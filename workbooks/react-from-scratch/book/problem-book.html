ownload<\/a><\/li><li><a href=\"https://github.com/Schniz/fnm\" target=\"_blank\" rel=\"noopener\">fnm on GitHub<\/a><\/li><li><a href=\"https://formulae.brew.sh/formula/node\" target=\"_blank\" rel=\"noopener\">Homebrew: node<\/a><\/li><\/ul>","from":"01","usedIn":["01"]},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","plain":"process.argv, exit codes and node --check","also":["command line arguments","argv","exit code","exitCode","process.exit","syntax check","node -c","stderr","stdout","console.log","LASTEXITCODE"],"html":"<p>Start a program with <code>node program.js one two<\/code> and it receives two arguments. Inside it, <code>process.argv<\/code> is an array: element 0 is the path of the node executable, element 1 the path of the script, and your arguments begin at index 2.<\/p>\n<pre><code>// args.js, run as: node args.js one two\nconsole.log(process.argv.slice(2));   // [ &#x27;one&#x27;, &#x27;two&#x27; ]<\/code><\/pre>\n<p>Every program in <code>assignments/<\/code> reads its input path from <code>process.argv[2]<\/code> and writes its output to the path in <code>process.argv[3]<\/code>. That's how the checker starts it, once per test, from assignment 01 on.<\/p>\n<p>A finished process leaves a number behind: its exit code. 0 means success. An uncaught error gives 1, and the harness uses 99 for <code>not implemented<\/code>. The checker reads them this way: 0 moves on to comparing the output file, 99 becomes \"Not implemented yet\", anything else is a Runtime Error. To see the code of the last command, type <code>echo $?<\/code> in a macOS or Linux shell, <code>$LASTEXITCODE<\/code> in PowerShell or <code>%ERRORLEVEL%<\/code> in cmd.<\/p>\n<p><code>node --check file.js<\/code> parses a file and reports a syntax error without running anything, and prints nothing when the file is fine. The checker's build step runs it over every <code>.js<\/code> file of your project before any test starts. That is why a typo in an unrelated file turns up as a Compile Error with its file and line.<\/p>\n<pre><code>node --check src/didact/dom.js<\/code><\/pre>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://nodejs.org/api/process.html\" target=\"_blank\" rel=\"noopener\">Node.js: process.argv and process exit codes<\/a><\/li><li><a href=\"https://nodejs.org/api/cli.html\" target=\"_blank\" rel=\"noopener\">Node.js: command-line options (--check)<\/a><\/li><\/ul>","from":"01","usedIn":["01","02","03","04","05","06","07","08","09","10","11","12"]},{"id":"workbook-check","title":"The checker: <code>check<\/code>, <code>-Case<\/code>, <code>-Fresh<\/code>, <code>-Dispute<\/code>","plain":"The checker: check, -Case, -Fresh, -Dispute","also":["check",".\\check","check.sh","verdict","Accepted","Wrong Answer","Compile Error","Runtime Error","Time Limit Exceeded","not implemented yet","fresh tests","dispute","case","run tests","printed by your program"],"html":"<p><code>.\\check NN<\/code> (<code>./check.sh NN<\/code> on macOS and Linux) tells you whether assignment NN works. It runs the syntax check over your project, starts the assignment's program on every test in <code>tests/NN/<\/code>, and compares the lines it writes with the expected ones word by word. Line endings and extra spaces don't matter outside quoted strings.<\/p>\n<pre><code>.\\check 07                           every test of assignment 7\n.\\check 07 -Case &lt;test-id&gt;           one test in full: input, expected output, yours\n.\\check 07 -Fresh                    a newly generated set of tests (a new random seed)\n.\\check 07 -Dispute &lt;test-id&gt; &quot;why&quot;  set a test aside<\/code><\/pre>\n<p>The report groups tests by requirement (<code>R1<\/code>, <code>R2<\/code>, and so on). Each failing group lists its first failures, with a guess at the requirement behind them, the source of the expected value and a command that reproduces the test.<\/p>\n<p>Accepted means every test passed. Wrong Answer means the program ran and wrote something different. A syntax error in any file of the project, found by <code>node --check<\/code>, gives Compile Error, and a crash or non-zero exit gives Runtime Error. Time Limit Exceeded comes after 10 seconds on one test, which an endless loop will earn you. \"Not implemented yet\" means the run hit a <code>throw<\/code> stub you haven't replaced.<\/p>\n<p>Debug with <code>console.log<\/code>. What your program prints stays out of the comparison; <code>-Case<\/code> lists it under \"printed by your program\" and the book shows it under the test result.<\/p>\n<p><code>-Fresh<\/code> gives you tests you haven't seen, which catches code that only works for the examples. Most assignments draw their expected output from React, so run <code>npm install<\/code> once in <code>tools/oracle<\/code> first (see <a href=\"#primer/workbook-oracle\">where the expected output comes from<\/a>). <code>-Dispute<\/code> stops one test from counting, adds <code>(1 disputed)<\/code> to the verdict and writes your reason to <code>disputes.json<\/code>. After that, ask your coding assistant to \"review my disputes\", and it rechecks the expected value against its independent source.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://nodejs.org/api/process.html\" target=\"_blank\" rel=\"noopener\">Node.js: process exit codes<\/a><\/li><li><a href=\"https://nodejs.org/api/cli.html\" target=\"_blank\" rel=\"noopener\">Node.js: command-line options (--check)<\/a><\/li><\/ul>","from":"01","usedIn":["01"]},{"id":"workbook-harness","title":"The harness and scenario files","plain":"The harness and scenario files","also":["runScenarioFile","scenario","scenario file","env.js","minidom","dump","markup","catalog","test harness","fake DOM","ops","idle","flush"],"html":"<p>Return values alone can't test a DOM library. The tests need a document to draw in, idle time to hand out and a way to say \"click that button\". The harness in <code>solutions/harness/<\/code> supplies them. You never edit it. It holds a small DOM that also counts what your code does to it (<code>minidom.js<\/code>), a scheduler the tests control (<code>env.js<\/code>), a printer that turns a tree into text, a short syntax for writing trees, the function components the tests use, and the runner (<code>scenario.js<\/code>).<\/p>\n<p>A test input is a scenario, one command per line, with <code>#<\/code> for comments.<\/p>\n<pre><code># a button and some text: draw, click, print\ntree t &lt;div id=&quot;a&quot;&gt;&lt;button id=go onClick=@bump&gt;+&lt;/button&gt;hello&lt;/div&gt;\nrender t\nflush\nclick #go\ndump\nlog<\/code><\/pre>\n<p>The program writes out whatever the printing commands ask for:<\/p>\n<pre><code>dump 1\nnode 0 a div &quot;id=a&quot;\nnode 1 b button &quot;id=go&quot;\ntext 2 &quot;+&quot;\ntext 1 &quot;hello&quot;\nlog bump<\/code><\/pre>\n<p>Each program in <code>assignments/<\/code> is one call, <code>runScenarioFile(inputPath, outputPath, lib)<\/code>. It runs the scenario against <code>lib<\/code> (the functions, or the <code>Didact<\/code> object, under test) and writes the printed lines to the output file for the checker to compare. From assignment 04 the program's first import is <code>../harness/env.js<\/code>, which installs <code>document<\/code> and a <code>requestIdleCallback<\/code>. Your library calls that function as it loads, and Node doesn't have one, which makes the import order matter.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Command<\/th><th>What it does<\/th><th>Prints<\/th><\/tr><\/thead><tbody><tr><td><code>call<\/code>, <code>props<\/code>, <code>show<\/code><\/td><td>01: call <code>createElement<\/code>, keep a props object, show it again<\/td><td><code>element<\/code>, <code>props<\/code><\/td><\/tr><tr><td><code>create<\/code>, <code>update<\/code><\/td><td>02: make one node, update it<\/td><td>nothing<\/td><\/tr><tr><td><code>tree<\/code>, <code>render<\/code>, <code>flush<\/code><\/td><td>name a tree, draw it, run all pending work<\/td><td>nothing<\/td><\/tr><tr><td><code>idle k<\/code><\/td><td>one idle period of <code>k<\/code> units of work<\/td><td><code>idle &lt;units&gt;<\/code><\/td><\/tr><tr><td><code>click<\/code>, <code>type<\/code>, <code>submit<\/code>, <code>poke<\/code><\/td><td>send an event or a state change, then <code>flush<\/code><\/td><td>nothing<\/td><\/tr><tr><td><code>dump<\/code>, <code>ops<\/code>, <code>log<\/code><\/td><td>show the container, the DOM operation counts, the recorded handler and effect calls<\/td><td><code>dump n<\/code> and the tree, <code>ops<\/code> numbers, <code>log<\/code> lines<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A dump line is <code>node &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;<\/code> or <code>text &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code>. An element gets a label (<code>a<\/code>, <code>b<\/code>, ... <code>z<\/code>, <code>aa<\/code>) the first time a dump shows it and keeps it. The same label in two dumps means the same DOM node, and that's how a test can tell that you kept a node rather than rebuilt it. <code>harness/README.md<\/code> lists the remaining choices, such as what <code>type<\/code> does with spaces.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/import\" target=\"_blank\" rel=\"noopener\">MDN: import, for side-effect imports<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/requestIdleCallback\" target=\"_blank\" rel=\"noopener\">MDN: requestIdleCallback()<\/a><\/li><\/ul>","from":"01","usedIn":["01","02","03","04","05","06","07","08","09","10","11","12"]},{"id":"workbook-oracle","title":"Where the expected output comes from (React 19 on jsdom)","plain":"Where the expected output comes from (React 19 on jsdom)","also":["oracle","expected output","jsdom","React 19","independent source","reference solution","fresh tests","npm install","test generator","act"],"html":"<p>Every test is a scenario plus the lines a correct program must print for it. Those lines don't come from the author's solution, since a solution can only prove its author agrees with themselves. They come from an oracle: a small program in <code>tools/oracle/<\/code> that runs the same scenario on real React 19.3.1 on jsdom 30.1.3, an implementation of the browser's DOM written in JavaScript that runs under Node. Renders and clicks run inside React's <code>act<\/code>, the test helper that applies pending updates before anyone looks. The oracle reuses the harness's own markup, components and dump format. The only difference between the two runs is what sits underneath, React in one and your library in the other. Where React's behaviour is the specification, as with the order effects run in (assignment 11), the tests pin what version 19.3.1 does.<\/p>\n<p>React can't answer two questions: how many units of work an idle period gets through, and how many DOM calls your library made. Small independent models in the test generators answer them, a formula over the number of fibers for the first and counting by definition for the second. Assignments 01 and 02 test functions React doesn't expose in that form. There the generators work out the expected values by hand and cross-check them against React where the two overlap. The reference solution is never a source. It has to pass these tests, and it doesn't define them.<\/p>\n<p>The tests in <code>tests/<\/code> ship with the workbook, generated once, which is why <code>.\\check NN<\/code> needs no React on your machine. Only <code>-Fresh<\/code> runs the oracle. Install it once:<\/p>\n<pre><code>cd tools/oracle\nnpm install<\/code><\/pre>\n<p>That fetches the exact versions pinned in <code>package-lock.json<\/code>, and needs Node 26.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/reference/react/act\" target=\"_blank\" rel=\"noopener\">React: act<\/a><\/li><li><a href=\"https://react.dev/reference/react-dom/client/createRoot\" target=\"_blank\" rel=\"noopener\">React: createRoot<\/a><\/li><li><a href=\"https://github.com/jsdom/jsdom\" target=\"_blank\" rel=\"noopener\">jsdom on GitHub<\/a><\/li><\/ul>","from":"01","usedIn":["01"]},{"id":"python-launcher","title":"<code>py -P<\/code> and Python 3.11 for the tools","plain":"py -P and Python 3.11 for the tools","also":["python","python3","py launcher","PYTHONSAFEPATH","python --version","Microsoft Store python","python not found"],"html":"<p>Your project is JavaScript, but the checker, the test generators and the study script that serves the book are Python programs. They need Python 3.11 or newer. On Windows, start Python with <code>py<\/code>, the launcher the Python installer adds; on macOS and Linux the command is <code>python3<\/code>. Windows also has a <code>python<\/code> shortcut that opens the Microsoft Store when Python is missing, which is why you type <code>py<\/code>.<\/p>\n<p>The tools run as <code>py -P tools/check.py<\/code>. The <code>-P<\/code> switch, new in Python 3.11, keeps Python from putting the script's own folder first on its import path, so a file called <code>random.py<\/code> or <code>json.py<\/code> lying next to a script can't take the place of the standard library module of that name. <code>.\\check<\/code> and <code>./check.sh<\/code> pass it for you; you type it yourself only when a page tells you to, as in <code>py -P tools/check.py 01<\/code>.<\/p>\n<pre><code># Windows\nwinget install Python.Python.3.12\n\n# macOS, with Homebrew\nbrew install python3\n\n# Debian and Ubuntu\nsudo apt install python3<\/code><\/pre>\n<p>Check it from a new terminal:<\/p>\n<pre><code>py --version         # Windows\npython3 --version    # macOS and Linux<\/code><\/pre>\n<p>You need 3.11 or higher. If a Linux distribution's <code>python3<\/code> is older, get a newer one from python.org or from a repository your distribution offers for it.<\/p>\n<p>It bites at assignment 01: <code>.\\check 01<\/code> is a Python script.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://docs.python.org/3/using/cmdline.html\" target=\"_blank\" rel=\"noopener\">Python: command line and environment (the -P option)<\/a><\/li><li><a href=\"https://docs.python.org/3/using/windows.html\" target=\"_blank\" rel=\"noopener\">Python: using Python on Windows<\/a><\/li><li><a href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noopener\">Python: Downloads<\/a><\/li><\/ul>","from":"01","usedIn":["01"]},{"id":"static-server","title":"Serving <code>index.html<\/code> locally","plain":"Serving index.html locally","also":["http.server","local web server","file://","CORS","localhost","port 8000","ES modules in the browser","live server","blank page"],"html":"<p>Assignment 12 ends with a page: <code>index.html<\/code> loads <code>src/main.js<\/code> through <code>&lt;script type=&quot;module&quot;&gt;<\/code>. Double-click <code>index.html<\/code> and it opens under a <code>file://<\/code> address, where a browser refuses to load modules. It treats each local file as cross-origin; the console shows a CORS error and the page stays empty. Serve the folder over HTTP instead. From <code>solutions/<\/code>, run:<\/p>\n<pre><code>py -m http.server 8000         # python3 -m http.server 8000 on macOS and Linux<\/code><\/pre>\n<p>Then open http://localhost:8000/ in a browser and stop the server with Ctrl+C when you're finished. Port 8000 is the default; give another number if something else is using it. From the workbook folder, <code>py -m http.server 8000 --directory solutions<\/code> does the same job.<\/p>\n<p>By default <code>http.server<\/code> listens on every network interface of your computer; add <code>--bind 127.0.0.1<\/code> to keep it to yourself. Files go out as they are on disk, so there is no live reload: save, then refresh. Errors from your modules land in the browser's developer tools (F12), under Console.<\/p>\n<p>Nothing else needs installing. There is no build step, because the browser reads your modules as they are. The tests for 12 don't open a browser; they run the same app on the harness's DOM. The page is there for watching the thing work.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://docs.python.org/3/library/http.server.html\" target=\"_blank\" rel=\"noopener\">Python: http.server<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules\" target=\"_blank\" rel=\"noopener\">MDN: JavaScript modules (testing locally)<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Tools_and_setup/set_up_a_local_testing_server\" target=\"_blank\" rel=\"noopener\">MDN: Set up a local testing server<\/a><\/li><\/ul>","from":"12","usedIn":["12"]}]},{"title":"The DOM","intro":"<p>The DOM is the browser's live model of a page, a tree of objects that scripts read and change, and it's what your library ends up drawing into. The tests run on a small DOM of the workbook's own, <code>harness/minidom.js<\/code>. For every call the assignments make it behaves like a browser, and like jsdom, where React runs to produce the expected outputs. Where it does less on purpose, the entry says so.<\/p>","entries":[{"id":"dom-tree","title":"The DOM tree: elements and text nodes","plain":"The DOM tree: elements and text nodes","also":["Document Object Model","DOM","node","element node","text node","nodeType","parentNode","childNodes","nextSibling","getElementById","container","root"],"html":"<p>To a script, a page is a tree of objects: the DOM. Each item is a node. Two kinds matter here. An element node stands for a tag such as <code>&lt;div&gt;<\/code> or <code>&lt;button&gt;<\/code>. A text node holds the characters between tags and has no tag, no props and no children. In <code>&lt;p&gt;Hi &lt;b&gt;you&lt;/b&gt;&lt;/p&gt;<\/code> the <code>p<\/code> has two children, the text <code>&quot;Hi &quot;<\/code> and the <code>b<\/code>, and the <code>b<\/code> has one, the text <code>&quot;you&quot;<\/code>.<\/p>\n<p>Nodes know their surroundings through <code>parentNode<\/code>, <code>childNodes<\/code>, <code>firstChild<\/code>, <code>lastChild<\/code>, <code>nextSibling<\/code> and <code>previousSibling<\/code>. <code>nodeType<\/code> is 1 for an element and 3 for a text node. To find an element already on the page, ask the document. <code>document.getElementById(&quot;box&quot;)<\/code> returns it, or <code>null<\/code>.<\/p>\n<pre><code>// page: &lt;div id=&quot;box&quot;&gt;&lt;p&gt;Hi &lt;b&gt;you&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;\nconst p = document.getElementById(&quot;box&quot;).firstChild;\nconsole.log(p.childNodes.length);          // 2\nconsole.log(p.firstChild.nodeType);        // 3, the text &quot;Hi &quot;\nconsole.log(p.lastChild.parentNode === p); // true<\/code><\/pre>\n<p>Making nodes starts in assignment 02, and in 03 you fill a container with a whole tree of them. Every test ends by dumping that tree: one <code>node<\/code> line per element with its depth, one <code>text<\/code> line per run of text (neighbouring text nodes print as one), and a label that stays with the same node across dumps. The container is a <code>&lt;div id=&quot;root&quot;&gt;<\/code> the harness puts in <code>body<\/code>. minidom has the reads above plus <code>contains<\/code>, <code>remove<\/code> and <code>getElementById<\/code>. It has no <code>querySelector<\/code> or <code>innerHTML<\/code>, and nothing in the workbook calls for either. A browser and jsdom answer the same reads the same way.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model/Introduction\" target=\"_blank\" rel=\"noopener\">MDN: Introduction to the DOM<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node\" target=\"_blank\" rel=\"noopener\">MDN: Node<\/a><\/li><li><a href=\"https://dom.spec.whatwg.org/\" target=\"_blank\" rel=\"noopener\">The DOM Standard<\/a><\/li><\/ul>","from":"02","usedIn":["02"]},{"id":"dom-create","title":"<code>createElement<\/code> and <code>createTextNode<\/code>","plain":"createElement and createTextNode","also":["document.createElement","document.createTextNode","make a node","new element","new text node","tagName","localName"],"html":"<p><code>document.createElement(&quot;li&quot;)<\/code> makes an element node and <code>document.createTextNode(&quot;Buy milk&quot;)<\/code> makes a text node holding that string. Neither puts anything on the page. A new node has no parent and, if it's an element, no content, and it stays invisible until you attach it under a node on the page (see <a href=\"#primer/dom-tree-editing\">appendChild and friends<\/a>).<\/p>\n<p>Tag names are case-insensitive in an HTML document: <code>createElement(&quot;LI&quot;)<\/code> makes the same element, whose <code>tagName<\/code> reads <code>&quot;LI&quot;<\/code> and whose <code>localName<\/code> reads <code>&quot;li&quot;<\/code>. The text you give <code>createTextNode<\/code> is plain text, so a <code>&lt;<\/code> in it stays a character and isn't parsed as a tag.<\/p>\n<pre><code>const li = document.createElement(&quot;li&quot;);\nconst label = document.createTextNode(&quot;Buy milk&quot;);\nconsole.log(li.parentNode, li.childNodes.length); // null 0\nli.appendChild(label);\nconsole.log(li.textContent);                      // &quot;Buy milk&quot;<\/code><\/pre>\n<p><code>createDom<\/code> in assignment 02 has to return an element node or a text node for each element it receives; the page names the type that marks a text element. Later renders call it once per node. The harness's <code>ops<\/code> command prints how many <code>create<\/code> calls happened, and from 06 on that count tells a node you kept from one you rebuilt. minidom's two functions follow the browser: <code>createElement<\/code> takes any tag string, an unknown one included, and <code>createTextNode<\/code> turns its argument into a string.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document/createElement\" target=\"_blank\" rel=\"noopener\">MDN: Document.createElement()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document/createTextNode\" target=\"_blank\" rel=\"noopener\">MDN: Document.createTextNode()<\/a><\/li><\/ul>","from":"02","usedIn":["02"]},{"id":"dom-properties","title":"Properties and attributes: <code>id<\/code>, <code>className<\/code>, <code>value<\/code>, <code>nodeValue<\/code>","plain":"Properties and attributes: id, className, value, nodeValue","also":["attribute","property","IDL attribute","content attribute","setAttribute","getAttribute","className","class","nodeValue","textContent","data","title","disabled"],"html":"<p>HTML source has attributes. The DOM has properties. A tag such as <code>&lt;a id=&quot;home&quot; class=&quot;nav&quot; title=&quot;Home&quot;&gt;<\/code> becomes an object, and a script changes it by plain assignment: <code>a.id = &quot;x&quot;<\/code>. Many properties mirror an attribute, some under another name. The attribute <code>class<\/code> is the property <code>className<\/code>, because <code>class<\/code> is a keyword in many languages that drive the DOM. <code>getAttribute<\/code> and <code>setAttribute<\/code> are a separate API for the markup side.<\/p>\n<p><code>id<\/code>, <code>className<\/code> and <code>title<\/code> stay in step with their attributes. <code>value<\/code> doesn't: an input's <code>value<\/code> property holds the text as it stands now, while its <code>value<\/code> attribute only supplies the starting text. A made-up property such as <code>a.foo = 1<\/code> is an ordinary JavaScript property and doesn't reach the markup.<\/p>\n<p>Text nodes keep their characters in <code>nodeValue<\/code> (the same string is in <code>data<\/code>). On an element <code>nodeValue<\/code> is <code>null<\/code>, and assigning to it does nothing.<\/p>\n<pre><code>const a = document.createElement(&quot;a&quot;);\na.className = &quot;nav&quot;;\na.title = &quot;Home&quot;;             // the tooltip, unrelated to document.title\nconst t = document.createTextNode(&quot;old&quot;);\nt.nodeValue = &quot;new&quot;;          // rewrites the text in place<\/code><\/pre>\n<p>An element's props land on a DOM node in assignment 02, and the page lists which names count. The dump prints <code>className<\/code>, <code>disabled<\/code>, <code>id<\/code>, <code>title<\/code> and <code>value<\/code>, each only for the tags where it means something, and <code>nodeValue<\/code> shows as a <code>text<\/code> line. Those are the prop lines a test can see. minidom gives the five a default (<code>&quot;&quot;<\/code>, and <code>false<\/code> for <code>disabled<\/code>), accepts any other property you assign, and counts each assignment as a <code>write<\/code> in <code>ops<\/code>. It has no <code>setAttribute<\/code>, no <code>style<\/code> and no <code>innerHTML<\/code>, and no assignment calls for them. jsdom agrees on all five.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes\" target=\"_blank\" rel=\"noopener\">MDN: HTML attribute reference, content versus IDL attributes<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Element/className\" target=\"_blank\" rel=\"noopener\">MDN: Element.className<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/nodeValue\" target=\"_blank\" rel=\"noopener\">MDN: Node.nodeValue<\/a><\/li><\/ul>","from":"02","usedIn":["02"]},{"id":"dom-events","title":"Listeners, event types and bubbling","plain":"Listeners, event types and bubbling","also":["addEventListener","removeEventListener","event handler","event listener","click","bubbling","propagation","target","currentTarget","dispatchEvent","onclick"],"html":"<p>Listeners are functions the browser calls when something happens to a node. <code>node.addEventListener(&quot;click&quot;, fn)<\/code> registers <code>fn<\/code> for events of type <code>&quot;click&quot;<\/code>, and <code>node.removeEventListener(&quot;click&quot;, fn)<\/code> takes it off again. Removal matches on type and on function identity. The function you remove has to be the object you added: two arrows with identical bodies are two functions. Adding one function twice for one type registers it once. Event types are lower-case words such as <code>&quot;click&quot;<\/code>, <code>&quot;input&quot;<\/code> and <code>&quot;submit&quot;<\/code>, with no <code>on<\/code> in front.<\/p>\n<p>The listener receives an event object. <code>event.target<\/code> is the node where the event started; <code>event.currentTarget<\/code> is the node whose listener is running now. Most events then bubble: once the target's listeners have run, the same event goes to its parent's listeners, then the grandparent's, up to the top of the tree. One listener on a <code>&lt;ul&gt;<\/code> hears the clicks of every <code>&lt;li&gt;<\/code> and button below it.<\/p>\n<pre><code>const list = document.createElement(&quot;ul&quot;);\nconst item = list.appendChild(document.createElement(&quot;li&quot;));\nlist.addEventListener(&quot;click&quot;, (e) =&gt; console.log(e.target === item, e.currentTarget === list));\nitem.dispatchEvent(new Event(&quot;click&quot;, { bubbles: true })); // true true<\/code><\/pre>\n<p>Handlers get attached in assignment 02, whose page gives the rule for which props are handlers and which event type each becomes. The tests click a node by id and read what the handlers logged. From 06 the handlers change between renders, and <code>ops<\/code> prints the <code>addListener<\/code> and <code>removeListener<\/code> counts. minidom has <code>addEventListener<\/code> and nothing else. There are no <code>onclick<\/code> property handlers, so <code>node.onclick = fn<\/code> is an ordinary property that does nothing when a click arrives. <code>click<\/code> and <code>submit<\/code> events are cancelable and <code>input<\/code> is not. Browsers and jsdom agree on all of it.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener\" target=\"_blank\" rel=\"noopener\">MDN: EventTarget.addEventListener()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/removeEventListener\" target=\"_blank\" rel=\"noopener\">MDN: EventTarget.removeEventListener()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/Event_bubbling\" target=\"_blank\" rel=\"noopener\">MDN: Event bubbling<\/a><\/li><\/ul>","from":"02","usedIn":["02","06"]},{"id":"dom-tree-editing","title":"<code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code>","plain":"appendChild, insertBefore, removeChild","also":["append","insert","remove","move a node","replaceChild","remove()","nextSibling","parentNode","reorder","placement","deletion"],"html":"<p>A freshly made node is nowhere. Three calls arrange nodes after that. <code>parent.appendChild(node)<\/code> makes <code>node<\/code> the last child of <code>parent<\/code>. <code>parent.insertBefore(node, ref)<\/code> puts it before <code>ref<\/code>, which has to be a child of <code>parent<\/code>; with <code>null<\/code> as <code>ref<\/code> it appends, and the call needs a second argument: you pass the <code>null<\/code> yourself. <code>parent.removeChild(node)<\/code> takes a child out and throws a <code>NotFoundError<\/code> when <code>node<\/code> isn't a child of <code>parent<\/code>, so removing the same node twice fails the second time.<\/p>\n<p>A node has one place. Append or insert a node that already has a parent and it moves, with no removal first. Remove a node and its whole subtree goes with it; the descendants stay attached to it, and it can go back in later.<\/p>\n<pre><code>const ul = document.createElement(&quot;ul&quot;);\nconst a = ul.appendChild(document.createElement(&quot;li&quot;));\nconst b = ul.appendChild(document.createElement(&quot;li&quot;));\nul.insertBefore(b, a);  // moves b: the order is now b, a\nul.removeChild(a);\nul.removeChild(a);      // throws NotFoundError<\/code><\/pre>\n<p>Assignment 03 attaches nodes to a parent for the first time; 05 does it for a whole finished tree in one pass. From 06 the tree changes after you draw it: nodes leave, new ones arrive, and in 07 the position of an arrival starts to matter. In 08 a node that exists has to change places. The harness counts an <code>insert<\/code> (a node that had no parent), a <code>move<\/code> (one that had) and a <code>remove<\/code>, which is how tests tell a reorder from a rebuild. minidom throws where a browser does, for a <code>removeChild<\/code> of a non-child and for an <code>insertBefore<\/code> whose reference isn't a child.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/appendChild\" target=\"_blank\" rel=\"noopener\">MDN: Node.appendChild()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/insertBefore\" target=\"_blank\" rel=\"noopener\">MDN: Node.insertBefore()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/removeChild\" target=\"_blank\" rel=\"noopener\">MDN: Node.removeChild()<\/a><\/li><\/ul>","from":"03","usedIn":["03","05","06","08","09"]},{"id":"dom-idle-callback","title":"<code>requestIdleCallback<\/code> and <code>timeRemaining()<\/code>","plain":"requestIdleCallback and timeRemaining()","also":["idle callback","IdleDeadline","deadline","cancelIdleCallback","background tasks","scheduler","idle period","didTimeout"],"html":"<p>One thread runs layout, painting and your clicks, and a long script blocks all of it. <code>requestIdleCallback(fn)<\/code> asks the browser to call <code>fn<\/code> later, when the thread has nothing more urgent to do. It calls <code>fn<\/code> once, with a deadline object. <code>deadline.timeRemaining()<\/code> is the number of milliseconds left in this idle period, and it can drop to 0 at once if something urgent arrives. To keep going, <code>fn<\/code> has to register itself again before it returns, because the browser won't call it a second time.<\/p>\n<pre><code>const jobs = [/* functions to run */];\nfunction onIdle(deadline) {\n  while (jobs.length &gt; 0 &amp;&amp; deadline.timeRemaining() &gt; 0) jobs.shift()();\n  if (jobs.length &gt; 0) requestIdleCallback(onIdle); // ask for another period\n}\nrequestIdleCallback(onIdle);<\/code><\/pre>\n<p>Only assignment 04 writes against it. <code>render.js<\/code> already registers the loop with a <code>requestIdleCallback(workLoop)<\/code> line at import time, and <code>workLoop<\/code> has to ask again every time it stops. Node has no such function, so <code>env.js<\/code> installs a stand-in that the tests drive, and you import it before your library; the entry programs do that first. The scenario command <code>idle k<\/code> runs one idle period in which <code>timeRemaining()<\/code> returns 1 until call number k, which returns 0 (a browser reports milliseconds). The test counts those calls, so read it once per unit of work. <code>flush<\/code> runs periods until one has no calls.<\/p>\n<p>MDN marks the API as limited availability, and React's own scheduler doesn't use it. The posts use it because it shows the idea: work in slices, and hand the thread back when told.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/requestIdleCallback\" target=\"_blank\" rel=\"noopener\">MDN: Window.requestIdleCallback()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/IdleDeadline/timeRemaining\" target=\"_blank\" rel=\"noopener\">MDN: IdleDeadline.timeRemaining()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Background_Tasks_API\" target=\"_blank\" rel=\"noopener\">MDN: Background Tasks API<\/a><\/li><\/ul>","from":"04","usedIn":["04"]},{"id":"dom-form-inputs","title":"Inputs: <code>value<\/code>, the <code>input<\/code> and <code>submit<\/code> events","plain":"Inputs: value, the input and submit events","also":["input element","form","value","input event","submit event","preventDefault","event.target.value","typing","textarea","submit button"],"html":"<p>An <code>&lt;input&gt;<\/code> keeps the text the user has typed in its <code>value<\/code> property. Typing fires an <code>input<\/code> event on that node after each change, and the event bubbles, so a parent can listen for it. Inside the listener, <code>event.target.value<\/code> is the text as it now stands. Assigning <code>input.value<\/code> from a script changes what the user sees. It fires nothing.<\/p>\n<p>Pressing Enter in a form, or clicking its submit button (a <code>&lt;button&gt;<\/code> with no <code>type<\/code> is one), fires <code>submit<\/code> on the <code>&lt;form&gt;<\/code>, and then the browser's default action takes over: it navigates, which reloads the page. A listener that calls <code>event.preventDefault()<\/code> cancels that, and that's how a script-driven app takes over a form. The <code>input<\/code> event has no default action to cancel.<\/p>\n<pre><code>const form = document.createElement(&quot;form&quot;);\nconst box = form.appendChild(document.createElement(&quot;input&quot;));\nform.addEventListener(&quot;submit&quot;, (e) =&gt; {\n  e.preventDefault();\n  console.log(&quot;add:&quot;, box.value);\n});<\/code><\/pre>\n<p>Props don't see typed text. It lives on the node. Re-render a list and keep a node, and its text stays. Rebuild the node and the text is gone. That is what the <code>type<\/code> command in assignments 07 and 08 tests: it sets <code>value<\/code> on a node and dispatches <code>input<\/code>, and later dumps show whether the text followed its item. Assignment 12 uses all three pieces in the todo form, alongside the idea in <a href=\"#primer/react-controlled-inputs\">controlled inputs<\/a>.<\/p>\n<p>In minidom, <code>input<\/code> and <code>submit<\/code> are plain events the harness dispatches. Nothing turns keystrokes into <code>value<\/code>. A click on an enabled submit button inside a form makes the harness dispatch <code>submit<\/code>, unless a listener prevented the click. That rule lives in the harness, and minidom lets events reach disabled controls. The app relies on what browsers and jsdom also do.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Element/input_event\" target=\"_blank\" rel=\"noopener\">MDN: the input event<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLFormElement/submit_event\" target=\"_blank\" rel=\"noopener\">MDN: the submit event<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Event/preventDefault\" target=\"_blank\" rel=\"noopener\">MDN: Event.preventDefault()<\/a><\/li><\/ul>","from":"07","usedIn":["07","08","12"]},{"id":"dom-document-title","title":"<code>document.title<\/code>","plain":"document.title","also":["page title","title element","tab title","window title","document.title"],"html":"<p><code>document.title<\/code> is a string you can read and assign. The browser shows it in the tab and the window's title bar, and assigning to it also changes the text of the page's <code>&lt;title&gt;<\/code> element. A page without a <code>&lt;title&gt;<\/code> reads <code>&quot;&quot;<\/code>. It hangs off <code>document<\/code>, so changing it leaves the node tree alone and a dump of the container looks the same before and after. Don't confuse it with an element's <code>title<\/code> property, which is the tooltip shown on hover.<\/p>\n<pre><code>document.title = &quot;3 left&quot;;\nconsole.log(document.title);  // &quot;3 left&quot;<\/code><\/pre>\n<p>Assignment 12 uses it. The todo app keeps the title in step with a number it already tracks, from an effect (see <a href=\"#primer/react-effects\"><code>useEffect<\/code><\/a>). The checker reads the title back, because <code>dump<\/code> prints a <code>title &quot;...&quot;<\/code> line after the tree whenever the title isn't empty. <code>index.html<\/code> starts with the title <code>didact<\/code>, so serve the folder (see <a href=\"#primer/static-server\">serving index.html<\/a>) and watch the tab change as you add and tick items. In minidom <code>document.title<\/code> is a plain string property that starts as <code>&quot;&quot;<\/code>, with no <code>&lt;title&gt;<\/code> element behind it, which no assignment needs. Browsers and jsdom read and write it the same way.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document/title\" target=\"_blank\" rel=\"noopener\">MDN: Document.title<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/title\" target=\"_blank\" rel=\"noopener\">MDN: the title element<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/title\" target=\"_blank\" rel=\"noopener\">MDN: HTMLElement.title<\/a><\/li><\/ul>","from":"12","usedIn":["12"]}]},{"title":"React and the ideas in the posts","intro":"<p>The assignments rebuild React's core in the order the two posts tell it. Each entry here names one idea, so a problem page can link to it instead of explaining it again, and says where React 19 has moved on from the posts.<\/p>","entries":[{"id":"react-elements","title":"Elements, and what JSX turns into","plain":"Elements, and what JSX turns into","also":["JSX","createElement","React element","vnode","virtual node","TEXT_ELEMENT","props.children"],"html":"<p>JSX is the HTML-looking syntax in React code, like <code>&lt;h1 id=&quot;top&quot;&gt;Hi&lt;/h1&gt;<\/code>. A browser can't run it, so a build step rewrites each tag into a call, <code>createElement(type, props, ...children)<\/code>, before the program starts. Here there is no build step and no JSX. You write the calls by hand, and the <code>createElement<\/code> of assignment 01 (<code>createElement.js<\/code>) is the function that rewrite would have targeted.<\/p>\n<p>What comes back is an element: a plain object describing one piece of UI, and nothing more. It holds a <code>type<\/code> (a tag name, or a function when the element is a <a href=\"#primer/react-function-components\">component<\/a>) and <code>props<\/code>, with the children inside <code>props.children<\/code> as an array. Text has no tag, so a string or number child gets wrapped in an element of type <code>&quot;TEXT_ELEMENT&quot;<\/code>, which gives every node in the tree the same shape.<\/p>\n<pre><code>createElement(&quot;h1&quot;, { id: &quot;top&quot; }, &quot;Hi&quot;)\n// { type: &quot;h1&quot;,\n//   props: { id: &quot;top&quot;,\n//            children: [ { type: &quot;TEXT_ELEMENT&quot;,\n//                          props: { nodeValue: &quot;Hi&quot;, children: [] } } ] } }<\/code><\/pre>\n<p>Elements are cheap to build, and that's the point. An app makes a whole new <a href=\"#primer/react-tree\">tree of them<\/a> on every update and leaves the library to work out what changed. Real React shapes them a little differently: <code>key<\/code> sits beside <code>props<\/code> instead of inside it, text children stay plain strings, and <code>null<\/code> and booleans are legal children. Didact keeps <code>key<\/code> in <code>props<\/code>, wraps its text, and leaves <code>null<\/code> and booleans out. <a href=\"#primer/react-today\">React 19 against the posts<\/a> collects the other differences.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/reference/react/createElement\" target=\"_blank\" rel=\"noopener\">createElement<\/a>, the reference page for the real element object<\/li><li><a href=\"https://react.dev/learn/writing-markup-with-jsx\" target=\"_blank\" rel=\"noopener\">Writing markup with JSX<\/a>, react.dev<\/li><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step I, Rodrigo Pombo<\/li><\/ul>","from":"01","usedIn":["01","04","09","12"]},{"id":"react-tree","title":"Trees of elements, and the \"virtual DOM\"","plain":"Trees of elements, and the \"virtual DOM\"","also":["virtual DOM","VDOM","element tree","render tree","UI tree"],"html":"<p>Elements nest. A <code>ul<\/code> element holds <code>li<\/code> elements in its <code>props.children<\/code>, each <code>li<\/code> holds a text element, and what you get is a tree of plain objects. The page is a tree too: the DOM, made of element nodes and text nodes (<a href=\"#primer/dom-tree\">the DOM tree<\/a>). The simplest render possible walks the first tree and builds one node of the second for each element, attached under its parent.<\/p>\n<pre><code>element tree                    DOM tree\n{ type: &quot;ul&quot; }            -&gt;    &lt;ul&gt;\n  { type: &quot;li&quot; }          -&gt;      &lt;li&gt;\n    TEXT_ELEMENT &quot;a&quot;      -&gt;        &quot;a&quot;   (a text node)\n  { type: &quot;li&quot; }          -&gt;      &lt;li&gt;\n    TEXT_ELEMENT &quot;b&quot;      -&gt;        &quot;b&quot;<\/code><\/pre>\n<p>\"Virtual DOM\" is the nickname for the first tree. React's old documentation describes it as an ideal picture of the UI kept in memory, which the library keeps in step with the real DOM. The name sounds grander than the thing, which is a pile of objects. What you get for it is cheap comparison: DOM nodes are heavy and writing to them can trigger layout, while a fresh tree of objects costs a few allocations. The library keeps the last tree, builds the next, compares the two and touches the DOM only where they differ. That comparison is <a href=\"#primer/react-reconciliation\">reconciliation<\/a>.<\/p>\n<p>One trap in the vocabulary: react.dev's \"render tree\" holds only components, without the HTML tags they produce. The trees here hold the tags too.<\/p>\n<p>Assignment 03 writes the walk (<code>renderSync.js<\/code>), and the checker's <code>dump<\/code> prints the DOM it builds, one node per line. A third tree arrives in 04: the <a href=\"#primer/react-fibers\">fibers<\/a>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/learn/understanding-your-ui-as-a-tree\" target=\"_blank\" rel=\"noopener\">Understanding your UI as a tree<\/a>, react.dev<\/li><li><a href=\"https://legacy.reactjs.org/docs/faq-internals.html\" target=\"_blank\" rel=\"noopener\">Virtual DOM and internals<\/a>, from React's earlier documentation<\/li><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step II, Rodrigo Pombo<\/li><\/ul>","from":"03","usedIn":["03","06"]},{"id":"react-fibers","title":"Fibers","plain":"Fibers","also":["fiber","fiber tree","unit of work","alternate","wipRoot","currentRoot","React Fiber"],"html":"<p>A fiber is the library's own object for one node of the tree, and it doubles as one unit of work. An element says what you asked for; a fiber also holds what the library knows about it: the element's <code>type<\/code> and <code>props<\/code>, its <code>dom<\/code> node once one exists, and three links, <code>parent<\/code>, <code>child<\/code> (the first child) and <code>sibling<\/code> (the next one). The children of a parent form a linked list, which lets a whole tree be walked with a loop instead of recursion.<\/p>\n<p>That matters because a recursive walk keeps your place on the call stack, and a call stack can't be paused. With the links, the place to resume is one variable: the next fiber. The order is depth first. Take the child if there is one, otherwise the sibling, otherwise the sibling of the nearest ancestor that has one. For <code>section &gt; (ul &gt; (li, li), footer)<\/code> the walk visits the root, <code>section<\/code>, <code>ul<\/code>, the two <code>li<\/code> fibers, then <code>footer<\/code>. The root fiber stands for the container the app renders into.<\/p>\n<p>React's real fibers carry far more (priorities, hook state, a <code>return<\/code> link where the posts write <code>parent<\/code>). The workbook adds fields as assignments need them: <code>alternate<\/code> and <code>effectTag<\/code> in 06, <code>hooks<\/code> in 10. Name yours as you like. The tests only look at the page that results.<\/p>\n<p>In 04, <code>reconcile.js<\/code> creates a fiber's child fibers and <code>render.js<\/code> walks them, one per turn of the <a href=\"#primer/react-work-loop\">work loop<\/a>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step IV, Rodrigo Pombo<\/li><li><a href=\"https://github.com/acdlite/react-fiber-architecture\" target=\"_blank\" rel=\"noopener\">React Fiber Architecture<\/a>, Andrew Clark's write-up of what a fiber is and why React adopted them<\/li><\/ul>","from":"04","usedIn":["04","05","06","07","08","09"]},{"id":"react-work-loop","title":"Units of work and the work loop","plain":"Units of work and the work loop","also":["concurrent mode","time slicing","workLoop","performUnitOfWork","shouldYield","yielding","scheduler","cooperative scheduling"],"html":"<p>A page's JavaScript shares one thread with clicks, scrolling and painting. Render a big tree in one go and all of that waits. The remedy: cut the job into small units, do a few, and hand control back to the browser until it has a gap to spare.<\/p>\n<p>The loop that does this receives a deadline from the browser (<a href=\"#primer/dom-idle-callback\"><code>requestIdleCallback<\/code><\/a>). It performs one unit, asks <code>deadline.timeRemaining()<\/code> how much of the idle period is left, and carries on while at least a millisecond remains. When time runs out it stops and asks for the next callback, and the unfinished work waits in a variable. The same pattern, with addition standing in for rendering:<\/p>\n<pre><code>const jobs = Array.from({ length: 5000 }, (_, i) =&gt; i);\nlet total = 0;\n\nfunction sumSome(deadline) {\n  while (jobs.length &gt; 0 &amp;&amp; deadline.timeRemaining() &gt; 1) total += jobs.pop();\n  if (jobs.length &gt; 0) requestIdleCallback(sumSome);\n}\nrequestIdleCallback(sumSome);<\/code><\/pre>\n<p>In Didact a unit is one <a href=\"#primer/react-fibers\">fiber<\/a>. The tests play the browser: the harness calls your loop with a fake deadline whose <code>timeRemaining()<\/code> runs out after a number of calls the test picks, and counts them.<\/p>\n<p>React itself dropped <code>requestIdleCallback<\/code> for a scheduler of its own, and only concurrent features such as transitions can pause a render; an ordinary update renders in one pass (<a href=\"#primer/react-today\">React 19 against the posts<\/a>). Didact keeps the interruptible loop because yielding is the idea worth building. The code is in <code>render.js<\/code> from assignment 04 (<code>workLoop<\/code>, <code>performUnitOfWork<\/code>).<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step III, Rodrigo Pombo<\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/requestIdleCallback\" target=\"_blank\" rel=\"noopener\">requestIdleCallback<\/a>, MDN<\/li><li><a href=\"https://react.dev/blog/2022/03/29/react-v18\" target=\"_blank\" rel=\"noopener\">React v18<\/a>, the section on concurrent rendering<\/li><\/ul>","from":"04","usedIn":["04"]},{"id":"react-render-commit","title":"The render phase and the commit phase","plain":"The render phase and the commit phase","also":["render phase","commit phase","commitRoot","wipRoot","work in progress","two-phase rendering"],"html":"<p>Cutting the job into <a href=\"#primer/react-work-loop\">units<\/a> leaves a problem: when the browser takes over, the tree is half built. If each unit attached its node to the page, a user would see half an interface, which is why the work has two phases.<\/p>\n<p>The render phase works out what the screen should be. It builds fibers and creates DOM nodes with their props set, but leaves the page alone, which means it can pause, restart or be thrown away. Pombo calls the tree under construction <code>wipRoot<\/code>, for work in progress. The commit phase then applies the result to the page in one synchronous pass that nothing interrupts. Anything that needs the finished page waits for it, <a href=\"#primer/react-effects\">effects<\/a> among them.<\/p>\n<pre><code>unit 1    create &lt;div&gt;          page still shows the old UI\nunit 2    create &lt;h1&gt;           page still shows the old UI\nunit 3    create &lt;p&gt;            page still shows the old UI\ncommit    insert div, h1, p     page shows the new UI, all at once<\/code><\/pre>\n<p>\"Render\" in this sense means calling components and building the result. Putting pixels on the screen is the browser's paint, which the React docs place after the commit; they count three steps in all: trigger, render, commit.<\/p>\n<p>Assignment 05 brings in <code>commit.js<\/code>, and <code>render.js<\/code> stops attaching nodes as it goes. The tests dump the container between idle periods, which catches anything that appears early.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/learn/render-and-commit\" target=\"_blank\" rel=\"noopener\">Render and commit<\/a>, react.dev<\/li><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step V, Rodrigo Pombo<\/li><\/ul>","from":"05","usedIn":["05","11"]},{"id":"react-reconciliation","title":"Reconciliation by type and position","plain":"Reconciliation by type and position","also":["reconcile","reconcileChildren","diffing","diff algorithm","alternate","effectTag","PLACEMENT","UPDATE","DELETION"],"html":"<p>An update hands the library a new element tree while the page still shows the old one. Reconciliation decides, place by place, which existing DOM node carries on. React's rule is a heuristic, cheap enough to run on every update: compare an element's <code>type<\/code> with the old fiber at the same position among its siblings.<\/p>\n<ul><li>Same type: keep the DOM node, update only the props that changed, then move on to the children.<\/li><li>Different type: assume a different subtree. Build a new node, drop the old one, and put the new one where the old one stood.<\/li><li>Leftovers on either side: an old child with no element left loses its node, and an element with no old child gets a new one.<\/li><\/ul>\n<p>An exact comparison of two trees is too slow (cubic), which is why React settles for betting that different types mean different trees. For the comparison, each new fiber keeps a link to its twin from the last render (<code>alternate<\/code>) and carries a tag telling the <a href=\"#primer/react-render-commit\">commit<\/a> what to do: <code>UPDATE<\/code>, <code>PLACEMENT<\/code> or <code>DELETION<\/code>.<\/p>\n<pre><code>before   &lt;div&gt;&lt;p&gt;a&lt;/p&gt;&lt;b&gt;b&lt;/b&gt;&lt;i&gt;c&lt;/i&gt;&lt;/div&gt;\nafter    &lt;div&gt;&lt;p&gt;a&lt;/p&gt;&lt;u&gt;b&lt;/u&gt;&lt;i&gt;c&lt;/i&gt;&lt;/div&gt;<\/code><\/pre>\n<p>The <code>p<\/code> and <code>i<\/code> keep their nodes. The <code>b<\/code> becomes a <code>u<\/code>, a new node that has to land between them. Position is the only identity so far, which is why inserting at the front of a list goes badly without <a href=\"#primer/react-keys\">keys<\/a>, and why a component keeps its <a href=\"#primer/react-state\">state<\/a> while its position and type stay put.<\/p>\n<p>Most of 06 happens in <code>reconcile.js<\/code>, with <code>render.js<\/code> and <code>state.js<\/code> holding on to the last committed tree and <code>commit.js<\/code> acting on the tags. 07 and 08 rework that same function.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://legacy.reactjs.org/docs/reconciliation.html\" target=\"_blank\" rel=\"noopener\">Reconciliation<\/a>, from React's earlier documentation, the clearest account of the diffing rules<\/li><li><a href=\"https://react.dev/learn/preserving-and-resetting-state\" target=\"_blank\" rel=\"noopener\">Preserving and resetting state<\/a>, react.dev<\/li><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step VI, Rodrigo Pombo<\/li><\/ul>","from":"06","usedIn":["06","07","09","10","11"]},{"id":"react-keys","title":"Keys","plain":"Keys","also":["key prop","key","keyed children","list keys","stable identity","keyed reconciliation"],"html":"<p>Without keys, position is identity. Put a new item at the front of a list and every item now sits where another used to, so each node is rewritten with its new neighbour's data and a fresh node is added at the end. A key fixes that. It's a label an element carries (<code>key: &quot;milk&quot;<\/code>) that lets the library recognise it from one render to the next, wherever it now stands. The same key means the same child, and its node stays, along with whatever the browser keeps on it, such as typed text and focus.<\/p>\n<pre><code>before   li key=&quot;a&quot;   li key=&quot;b&quot;\nafter    li key=&quot;z&quot;   li key=&quot;a&quot;   li key=&quot;b&quot;<\/code><\/pre>\n<p>Here <code>a<\/code> and <code>b<\/code> keep their nodes, and <code>z<\/code> is the only new one, placed first.<\/p>\n<p>Keys are unique among siblings and stay the same for the same item, so take an id from the data and skip array indexes and random numbers. A key that changes means a new element: the old node goes and a new one is built. Children without a key still match by position. In React <code>key<\/code> is not a prop, since <code>props<\/code> lacks it and a component never receives it; Didact keeps it as an ordinary prop, as assignment 01 specifies. Keys can be falsy, <code>&quot;&quot;<\/code> for one, so ask whether an element has a key instead of testing the key for truthiness (<a href=\"#primer/js-equality\"><code>===<\/code>, <code>Object.is<\/code>, truthy and falsy<\/a>).<\/p>\n<p>Wim Jongeneel's post matches children by key, but only while the keys both lists share stay in the same order. Moving them is <a href=\"#primer/react-moving-nodes\">the next entry<\/a>. Assignment 07 covers the first part, in <code>reconcile.js<\/code>, and the todo list in 12 keys its items by id.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/learn/rendering-lists\" target=\"_blank\" rel=\"noopener\">Rendering lists<\/a>, react.dev, on where keys come from<\/li><li><a href=\"https://react.dev/learn/preserving-and-resetting-state\" target=\"_blank\" rel=\"noopener\">Preserving and resetting state<\/a>, react.dev, which shows a key resetting a component<\/li><li><a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>, Wim Jongeneel, the section on diffing children<\/li><\/ul>","from":"07","usedIn":["07","08","09","10","12"]},{"id":"react-moving-nodes","title":"Reordering without recreating","plain":"Reordering without recreating","also":["reorder","move DOM nodes","swap","shuffle","insertBefore","list reordering","placement"],"html":"<p>Same keys, new order. Rebuilding the nodes would produce the right page and lose typed text, focus and anything else the browser held on them, so a reorder keeps each node and moves it. The DOM supports this directly: <code>insertBefore<\/code> and <code>appendChild<\/code> with a node that already has a parent move it, with no copy (<a href=\"#primer/dom-tree-editing\">tree editing<\/a>).<\/p>\n<p>Two jobs follow. Matching finds each new child's old twin by key, wherever it stood. Placing decides which nodes have to move and puts each one in front of the right neighbour. Moving every node is correct and wasteful. Turning <code>a b c d<\/code> into <code>b c d a<\/code> takes one move, of <code>a<\/code>, and a node already in order relative to the others can stay where it is.<\/p>\n<p>A moved node is still the same node, and its props are still compared and updated. The harness's <code>ops<\/code> line counts moves separately from creations and removals, so a plain reordering has to show no creates and no removes. If an input in the moved item holds typed text, the text travels with it; compare a <a href=\"#primer/react-controlled-inputs\">controlled input<\/a>, where the state would carry it instead.<\/p>\n<p>Real React moves a node among its siblings only. Take a subtree to a different parent and it is destroyed and built again. Jongeneel's post stops earlier, by his own account: children whose keys come out of order are removed and inserted again. Assignment 08 follows React, in <code>reconcile.js<\/code> and <code>commit.js<\/code>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://legacy.reactjs.org/docs/reconciliation.html\" target=\"_blank\" rel=\"noopener\">Reconciliation<\/a>, from React's earlier documentation, on keys and on what React can and can't express as a move<\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/insertBefore\" target=\"_blank\" rel=\"noopener\">Node.insertBefore()<\/a>, MDN<\/li><li><a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>, Wim Jongeneel, for what his version leaves out<\/li><\/ul>","from":"08","usedIn":["08"]},{"id":"react-function-components","title":"Function components","plain":"Function components","also":["component","components","props","props.children","composition","function type","component fiber"],"html":"<p>A component is a function that takes props and returns an element. To use one, pass the function itself as the <code>type<\/code>: <code>createElement(Badge, { label: &quot;new&quot; }, child)<\/code>. JSX spells that <code>&lt;Badge label=&quot;new&quot;&gt;<\/code>, and the capital letter is what tells it apart from a tag name.<\/p>\n<p>Creating that element doesn't call the function. The library does, in the render phase, when it reaches the component's fiber: it calls the function with the element's <code>props<\/code>, <code>children<\/code> among them, and the element that comes back becomes the fiber's one child. A component fiber has no DOM node of its own. It exists in the tree and nowhere on the page.<\/p>\n<pre><code>function Badge({ label, children }) {\n  return createElement(&quot;span&quot;, { className: &quot;badge&quot; }, label, ...children);\n}\n// createElement(Badge, { label: &quot;new&quot; }, createElement(&quot;b&quot;, null, &quot;!&quot;))\n//   fiber(Badge) -&gt; fiber(span) -&gt; fibers for &quot;new&quot; and b<\/code><\/pre>\n<p>No node means two consequences. The commit can no longer assume that a fiber's parent owns a DOM node, and removing a component has to remove whatever its output made. Swapping one component function for another at the same position follows the type rule of <a href=\"#primer/react-reconciliation\">reconciliation<\/a>: different functions are different types. The workbook has no way to skip a component whose props are unchanged, so each render pass runs all of them again. A component is also where <a href=\"#primer/react-state\">state<\/a> lives.<\/p>\n<p>In 09 this lands in <code>render.js<\/code> and <code>commit.js<\/code>. The tests get their components from the harness catalog (<code>Greeting<\/code>, <code>Frame<\/code>, <code>Counter<\/code> and others), and in 12 you write your own.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/learn/your-first-component\" target=\"_blank\" rel=\"noopener\">Your first component<\/a>, react.dev<\/li><li><a href=\"https://react.dev/learn/passing-props-to-a-component\" target=\"_blank\" rel=\"noopener\">Passing props to a component<\/a>, including the <code>children<\/code> prop<\/li><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step VII, Rodrigo Pombo<\/li><\/ul>","from":"09","usedIn":["09","10","12"]},{"id":"react-state","title":"<code>useState<\/code> and the rules of hooks","plain":"useState and the rules of hooks","also":["useState","hooks","hook","setState","setter","state","state variable","rules of hooks","hook index"],"html":"<p>A function component runs from the top on every render, so its local variables start over each time. <code>useState(initial)<\/code> gives it a memory. It returns <code>[value, setValue]<\/code>, and the library keeps the value somewhere that survives, on the component's <a href=\"#primer/react-fibers\">fiber<\/a>. The next render calls <code>useState<\/code> again and gets the stored value back; <code>initial<\/code> counts only the first time.<\/p>\n<p><code>setValue<\/code> changes nothing on the spot. It records an update and asks for a new render, and the variable in the render that is running keeps its old value (<a href=\"#primer/react-batching\">how updates pile up<\/a>).<\/p>\n<p>A call finds its slot by order: the first <code>useState<\/code> of a component gets the first slot, the second gets the second. That's where the rules of hooks come from. Call hooks at the top level of the component, outside conditions, loops and anything after an early return, which keeps every render making the same calls in the same order.<\/p>\n<pre><code>function Clicks() {\n  const [count, setCount] = useState(0);      // slot 0\n  const [last, setLast] = useState(&quot;never&quot;);  // slot 1\n  const onClick = () =&gt; {\n    setCount((n) =&gt; n + 1);\n    setLast(() =&gt; &quot;now&quot;);\n  };\n  return createElement(&quot;button&quot;, { onClick }, count, &quot; / &quot;, last);\n}<\/code><\/pre>\n<p>In React the setter is the same function on every render, and an update sent through an old one still counts. Yours has to keep working after the component renders again. The workbook's setter takes an updater function, as React's does (React accepts a plain value too). State belongs to a position and a type: a parent re-rendering keeps it, and a different component in the same spot starts empty.<\/p>\n<p>The file for 10 is <code>hooks.js<\/code>, with <code>state.js<\/code> and <code>render.js<\/code> telling it which component is running. The todo app in 12 keeps a <a href=\"#primer/react-controlled-inputs\">controlled input<\/a> in state.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/reference/react/useState\" target=\"_blank\" rel=\"noopener\">useState<\/a>, react.dev<\/li><li><a href=\"https://react.dev/reference/rules/rules-of-hooks\" target=\"_blank\" rel=\"noopener\">Rules of Hooks<\/a>, react.dev<\/li><li><a href=\"https://pomb.us/build-your-own-react/\" target=\"_blank\" rel=\"noopener\">Build your own React<\/a>, Step VIII, Rodrigo Pombo<\/li><\/ul>","from":"10","usedIn":["10","11","12"]},{"id":"react-batching","title":"Several updates, one render","plain":"Several updates, one render","also":["batching","automatic batching","updater function","update queue","stale state","functional update"],"html":"<p>A handler may call a <a href=\"#primer/react-state\">setter<\/a> more than once. React doesn't re-render after each call. It queues the updates, lets the handler finish, then renders once with all of them applied, oldest first. That is cheaper. The page never shows a state that sits between two of the calls.<\/p>\n<p>The catch is that a render's <code>count<\/code> is a snapshot. Starting from 2, two calls of <code>setCount(count + 1)<\/code> both ask for 3, and the result is 3. Two updaters hand the first one's result to the second:<\/p>\n<pre><code>setCount((n) =&gt; n + 1);   // 2 -&gt; 3\nsetCount((n) =&gt; n * 5);   // 3 -&gt; 15, and one render covers both<\/code><\/pre>\n<p>The workbook's setter takes functions for that reason. Each hook keeps a list of updaters that are waiting, and the next render of its component folds them into the state in order.<\/p>\n<p>How much gets batched has grown. Before React 18, only updates inside React's own event handlers were batched; since 18 they are batched everywhere, timeouts and promises included. Pombo's design gets one render per burst because a setter only schedules the next render, and calls made before it runs share it. Jongeneel's <code>setState<\/code> re-renders on the spot, so three calls make three renders. The workbook follows React.<\/p>\n<p>Assignment 10 puts it to the test: one of the catalog's counters calls its setter twice per click, and the page has to show both updates after a single flush.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/learn/queueing-a-series-of-state-updates\" target=\"_blank\" rel=\"noopener\">Queueing a series of state updates<\/a>, react.dev<\/li><li><a href=\"https://react.dev/blog/2022/03/29/react-v18\" target=\"_blank\" rel=\"noopener\">React v18<\/a>, the section on automatic batching<\/li><li><a href=\"https://react.dev/reference/react/useState\" target=\"_blank\" rel=\"noopener\">useState<\/a>, the part on updating state from the previous state<\/li><\/ul>","from":"10","usedIn":["10"]},{"id":"react-effects","title":"<code>useEffect<\/code>: after the DOM is updated","plain":"useEffect: after the DOM is updated","also":["useEffect","effect","side effect","cleanup","cleanup function","dependency array","deps","componentDidMount","componentDidUpdate","componentWillUnmount","lifecycle hooks"],"html":"<p>Rendering is a calculation: props and state in, elements out. Anything that reaches outside, such as starting a timer, subscribing to a feed or setting <code>document.title<\/code>, is a side effect, and <code>useEffect(effect, deps)<\/code> is where it goes. React calls <code>effect<\/code> after the <a href=\"#primer/react-render-commit\">commit<\/a>, when the DOM already shows the new output. If <code>effect<\/code> returns a function, that is its cleanup. React calls it before the effect runs again and once more when the component goes away.<\/p>\n<p><code>deps<\/code> says when the effect is due. With an array, React compares each entry to the previous render's with <code>Object.is<\/code> and runs the effect again only when one differs. An empty array means once, after mounting. No array means after every render. A cleanup belongs to the render that produced it.<\/p>\n<pre><code>function Ticker({ ms }) {\n  useEffect(() =&gt; {\n    const id = setInterval(() =&gt; console.log(&quot;tick&quot;), ms);\n    return () =&gt; clearInterval(id);\n  }, [ms]);\n  return createElement(&quot;p&quot;, null, `every ${ms} ms`);\n}<\/code><\/pre>\n<p>When <code>ms<\/code> changes, the old interval is cleared before the new one starts. The order across components matters and the tests pin it: in one commit every cleanup that is due runs before any new effect, and on mounting a child's effect runs before its parent's.<\/p>\n<p>React usually runs effects after the browser has painted, and Strict Mode in development adds an extra setup and cleanup. Didact runs them right after the commit and has no Strict Mode. Jongeneel's class components get the same moments from <code>componentDidMount<\/code>, <code>componentDidUpdate<\/code> and <code>componentWillUnmount<\/code>.<\/p>\n<p>In 11, <code>hooks.js<\/code> remembers the effect and its deps and <code>commit.js<\/code> runs them once the DOM is updated. The catalog's logger components record what their effects do, and the todo app in 12 sets the page title from one.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/reference/react/useEffect\" target=\"_blank\" rel=\"noopener\">useEffect<\/a>, react.dev<\/li><li><a href=\"https://react.dev/learn/synchronizing-with-effects\" target=\"_blank\" rel=\"noopener\">Synchronizing with Effects<\/a>, react.dev<\/li><li><a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>, Wim Jongeneel, the section on lifecycle hooks<\/li><\/ul>","from":"11","usedIn":["11","12"]},{"id":"react-controlled-inputs","title":"Controlled inputs","plain":"Controlled inputs","also":["controlled component","uncontrolled","input value","onInput","onChange","form state","two-way binding"],"html":"<p>A text input holds its own text in the browser. A controlled input hands that job to the app. The text lives in state, the element is rendered with its <code>value<\/code> taken from that state, and a handler stores the new text on each edit. The loop goes: keystroke, <code>input<\/code> event, the handler reading <code>event.target.value<\/code>, the setter, a re-render, <code>value<\/code> written back to the node. The state is the truth and the box shows it, so clearing a form is <code>setText(() =&gt; &quot;&quot;)<\/code> with no DOM call at all.<\/p>\n<pre><code>function Shout() {\n  const [text, setText] = useState(&quot;&quot;);\n  const onInput = (event) =&gt; {\n    const typed = event.target.value;   // read it now: the updater runs in a later render\n    setText(() =&gt; typed.toUpperCase());\n  };\n  return createElement(&quot;input&quot;, { value: text, onInput });\n}<\/code><\/pre>\n<p>Whatever the user types, this box shows capitals, because the state decides.<\/p>\n<p>React's <code>onChange<\/code> fires on every keystroke, like the browser's <code>input<\/code> event. The DOM's own <code>change<\/code> event waits until the field loses focus, and the harness dispatches <code>input<\/code>, which is why the todo app uses <code>onInput<\/code>. React also restores a controlled <code>value<\/code> that no handler accepted. Didact leaves whatever was typed, so keeping the state in step is your job. Inside a form, a submit reloads the page unless the handler calls <code>event.preventDefault()<\/code> (<a href=\"#primer/dom-form-inputs\">inputs and the <code>submit<\/code> event<\/a>).<\/p>\n<p>The form in <code>TodoApp.js<\/code> (assignment 12) is where it matters. The checker's <code>type<\/code> command sets a field's <code>value<\/code> and dispatches <code>input<\/code>, the way a user's typing would, and <code>submit<\/code> fires the form's submit event.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/reference/react-dom/components/input\" target=\"_blank\" rel=\"noopener\"><code>&lt;input&gt;<\/code><\/a>, react.dev, the section on controlling an input with state<\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Element/input_event\" target=\"_blank\" rel=\"noopener\">The input event<\/a>, MDN<\/li><\/ul>","from":"12","usedIn":["12"]},{"id":"react-today","title":"React 19 against the posts","plain":"React 19 against the posts","also":["React 19","React 19.3","ReactDOM.render","createRoot","requestIdleCallback","scheduler","differences from the posts","what changed since 2019"],"html":"<p>Pombo follows React 16.8 (2019) and Jongeneel wrote in 2021. The workbook checks your code against React 19.3.1, and where they disagree, React 19 wins. The architecture survived: a tree of fibers, a render pass followed by a commit, children matched by type and key, hook state on the fiber. You build that part. What moved:<\/p>\n<ul><li>React 19 dropped <code>ReactDOM.render<\/code>. <code>createRoot(container).render(element)<\/code> replaces it, and your <code>render(element, container)<\/code> stands in for <code>root.render<\/code>.<\/li><li>React no longer schedules with <code>requestIdleCallback<\/code>, and only concurrent features such as transitions can pause a render.<\/li><li>Updates have been batched everywhere since 18.<\/li><li>Effects usually run after the paint, with every cleanup of a commit ahead of any new effect.<\/li><li>Setters are one stable function per hook, and old ones keep working.<\/li><li>On the DOM side, React sets attributes for most props, handles <code>style<\/code> objects and <code>value<\/code> specially, and listens on the root. Didact assigns properties and listens on each node, and the tests use only props where both read the same.<\/li><li>Pombo has no keys, Jongeneel can't reorder, and React moves nodes.<\/li><\/ul>\n<pre><code>ReactDOM.render(element, container);        // the 2019 post, removed in React 19\ncreateRoot(container).render(element);      // React 19, from &quot;react-dom/client&quot;<\/code><\/pre>\n<p>React 19 also removed <code>ReactDOM.hydrate<\/code>, <code>unmountComponentAtNode<\/code>, <code>findDOMNode<\/code>, string refs, legacy context, and <code>propTypes<\/code> and <code>defaultProps<\/code> on function components. 19.3's own additions, such as View Transitions, are outside this workbook. The full table is in <code>docs/react-today.md<\/code>, which assignment pages link wherever a test follows React against a post. Details sit in <a href=\"#primer/react-work-loop\">work loop<\/a>, <a href=\"#primer/react-batching\">batching<\/a>, <a href=\"#primer/react-effects\">effects<\/a> and <a href=\"#primer/react-elements\">elements<\/a>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://react.dev/blog/2024/04/25/react-19-upgrade-guide\" target=\"_blank\" rel=\"noopener\">React 19 upgrade guide<\/a>, the removed APIs and their replacements<\/li><li><a href=\"https://react.dev/reference/react-dom/client/createRoot\" target=\"_blank\" rel=\"noopener\">createRoot<\/a>, react.dev<\/li><li><a href=\"https://react.dev/blog/2022/03/29/react-v18\" target=\"_blank\" rel=\"noopener\">React v18<\/a>, where batching and <code>createRoot<\/code> arrived<\/li><\/ul>","from":"01","usedIn":["01"]}]}],"checkpoints":[{"id":"01","num":"1","title":"Create elements","difficulty":"Easy","tests":48,"problem":"problems/01-create-element.md","entry":"solutions/assignments/assignment_01_create_element.js","files":[{"path":"solutions/assignments/assignment_01_create_element.js","role":"entry","purpose":null,"job":"Call `runScenarioFile` from the harness with the scenario file and your `createElement`. It builds each element the scenario lists and prints it.","blank":"// ======================================================================================\n// Assignment 01: Create elements\n// Problem: problems/01-create-element.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 01 as `python -P tools/run_js.py\n//   solutions 01 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 01` (`./check.sh 01` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Call `runScenarioFile` from the harness with the scenario file and your\n//   `createElement`. It builds each element the scenario lists and prints it.\n//\n// The other files of this assignment:\n//   You also write src/didact/createElement.js in this assignment; each one gives its job\n//   at the top.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { createElement } from '../src/didact/createElement.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 01: Create elements\n// Problem: problems/01-create-element.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 01 as `python -P tools/run_js.py\n//   solutions 01 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 01` (`./check.sh 01` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/didact/createElement.js in this assignment; each one gives its job\n//   at the top.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { createElement } from '../src/didact/createElement.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { createElement } from '../src/didact/createElement.js'; // createElement (assignment 01): the function under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { createElement });\n"},{"path":"solutions/src/didact/createElement.js","role":"new","purpose":"What JSX compiles to: a plain `{ type, props }` object, with the children inside `props`.","job":"Write `createElement(type, props, ...children)`, returning `{ type, props }` with every child inside `props.children`, and `createTextElement(text)`, which builds the text element a string or number child becomes.","blank":"// ======================================================================================\n// Assignment 01: Create elements\n// Problem: problems/01-create-element.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   What JSX compiles to: a plain `{ type, props }` object, with the children inside\n//   `props`.\n//\n// Your job:\n//   Write `createElement(type, props, ...children)`, returning
