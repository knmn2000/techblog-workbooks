id":"react-fibers","title":"Fibers","note":"the commit walks the finished tree by <code>child<\/code> and <code>sibling<\/code>, and every fiber holds the node it will attach.","group":"React and the ideas in the posts","from":"04"},{"id":"js-global-state","title":"Module-level state and why <code>state.js<\/code> is an object","note":"<code>render.js<\/code> leaves the finished root in it for <code>commit.js<\/code> to pick up.","group":"JavaScript","from":"04"},{"id":"workbook-harness","title":"The harness and scenario files","note":"<code>dump<\/code> can now come between idle periods, and <code>ops<\/code> reads the page's counters.","group":"Tools and the checker","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"}]}},{"id":"06","num":"6","title":"Reconcile children by position","difficulty":"Hard","tests":54,"problem":"problems/06-reconcile.md","entry":"solutions/assignments/assignment_06_reconcile.js","files":[{"path":"solutions/assignments/assignment_06_reconcile.js","role":"entry","purpose":null,"job":"Pass your `Didact` object to `runScenarioFile`. The scenario renders a second tree into the container that already holds the first.","blank":"// ======================================================================================\n// Assignment 06: Reconcile children by position\n// Problem: problems/06-reconcile.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 06 as `python -P tools/run_js.py\n//   solutions 06 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 06` (`./check.sh 06` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Pass your `Didact` object to `runScenarioFile`. The scenario renders a second tree\n//   into the container that already holds the first.\n//\n// The other files of this assignment:\n//   It adds to src/didact/state.js, which you started earlier: Track the last tree you\n//   committed in `currentRoot`, and the fibers waiting for removal in `deletions`.\n//   It adds to src/didact/render.js, which you started earlier: On every `render`, point\n//   the new root's `alternate` at `currentRoot` (the tree you committed last time) and\n//   reset `deletions`.\n//   It adds to src/didact/reconcile.js, which you started earlier: Rewrite\n//   `reconcileChildren` to compare each element with the old fiber at the same position.\n//   The same type keeps its DOM node and gets updated, a different type gets a fresh node,\n//   and an old fiber left without an element is queued for deletion.\n//   It adds to src/didact/commit.js, which you started earlier: Carry out what\n//   reconciliation decided. A new node goes before the next sibling that already has a DOM\n//   node, which keeps its position; an updated one goes through `updateDom`; each deleted\n//   node is removed once.\n//   Earlier files you can use: src/didact/dom.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { state } from '../src/didact/state.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 06: Reconcile children by position\n// Problem: problems/06-reconcile.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 06 as `python -P tools/run_js.py\n//   solutions 06 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 06` (`./check.sh 06` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/didact/state.js, which you started earlier: Track the last tree you\n//   committed in `currentRoot`, and the fibers waiting for removal in `deletions`.\n//   It adds to src/didact/render.js, which you started earlier: On every `render`, point\n//   the new root's `alternate` at `currentRoot` (the tree you committed last time) and\n//   reset `deletions`.\n//   It adds to src/didact/reconcile.js, which you started earlier: Rewrite\n//   `reconcileChildren` to compare each element with the old fiber at the same position.\n//   The same type keeps its DOM node and gets updated, a different type gets a fresh node,\n//   and an old fiber left without an element is queued for deletion.\n//   It adds to src/didact/commit.js, which you started earlier: Carry out what\n//   reconciliation decided. A new node goes before the next sibling that already has a DOM\n//   node, which keeps its position; an updated one goes through `updateDom`; each deleted\n//   node is removed once.\n//   Earlier files you can use: src/didact/dom.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { state } from '../src/didact/state.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"},{"path":"solutions/src/didact/state.js","role":"adds","purpose":"Shared bookkeeping in one object: what to work on next, and the tree under construction. It has to be an object, because an ES module can't share a variable for other modules to reassign.","job":"Track the last tree you committed in `currentRoot`, and the fibers waiting for removal in `deletions`.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Shared bookkeeping in one object: what to work on next, and the tree under\n//   construction. It has to be an object, because an ES module can't share a variable for\n//   other modules to reassign. Later, assignments 06 and 10 add to this file.\n//\n// Your job:\n//   Create one `state` object to hold the next unit of work and the root of the tree being\n//   built.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/render.js","role":"adds","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units.","job":"On every `render`, point the new root's `alternate` at `currentRoot` (the tree you committed last time) and reset `deletions`.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   `render` and the work loop behind it: one fiber per unit of work, and the browser can\n//   interrupt between units. Later, assignments 05, 06, 09 and 10 add to this file.\n//\n// Your job:\n//   Build `render`, `workLoop` and `performUnitOfWork`. `render` only schedules the work;\n//   each idle period then runs fibers, one per unit of work, until `timeRemaining()` falls\n//   below 1.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/reconcile.js","role":"adds","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render.","job":"Rewrite `reconcileChildren` to compare each element with the old fiber at the same position. The same type keeps its DOM node and gets updated, a different type gets a fresh node, and an old fiber left without an element is queued for deletion.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Decides which fibers a parent's children become. At first that means a fresh fiber for\n//   every child, then a comparison with the previous render. Later, assignments 06, 07 and\n//   08 add to this file.\n//\n// Your job:\n//   Give every element a fiber of its own in `reconcileChildren(wipFiber, elements)`, and\n//   link the fibers with `child`, `sibling` and `parent`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/commit.js","role":"adds","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing.","job":"Carry out what reconciliation decided. A new node goes before the next sibling that already has a DOM node, which keeps its position; an updated one goes through `updateDom`; each deleted node is removed once.","blank":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Applies a finished fiber tree to the DOM in a single pass, which keeps half a render\n//   from ever showing. Later, assignments 06, 08, 09 and 11 add to this file.\n//\n// Your job:\n//   Define `commitRoot` and `commitWork`. Once the last unit is done, they append the\n//   finished tree to the container in a single pass.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"05"}],"buildsOn":[{"path":"solutions/src/didact/dom.js","owner":"02","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-optional-chaining\">optional chaining<\/a>","<a href=\"#primer/js-equality\">===, Object.is, truthy and falsy<\/a>"],"text":["optional chaining","===, Object.is, truthy and falsy"]},{"label":"Library","items":["<a href=\"#primer/dom-tree-editing\">appendChild, insertBefore, removeChild<\/a>","<a href=\"#primer/dom-events\">listeners, event types and bubbling<\/a>","<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["appendChild, insertBefore, removeChild","listeners, event types and bubbling","the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/react-reconciliation\">reconciliation by type and position<\/a>","<a href=\"#primer/react-tree\">trees of elements<\/a>","<a href=\"#primer/react-fibers\">fibers<\/a>"],"text":["reconciliation by type and position","trees of elements","fibers"]}],"body":"<div class=\"d-problem flow\"><p>Render a tree, render another into the same container, and make the page match the second one with as few changes as the rules allow. The tests can see which DOM nodes survived. A library that clears the container and draws again fails them, even though its page looks right.<\/p>\n<h3>Matching children<\/h3>\n<p>Compare the tree on the page (the old one) with the new element tree, one parent at a time. The new tree's top element is compared with the old tree's top node, which is the only child of the container. When two children match, their own children get the same treatment.<\/p>\n<p>A child's position is its index among its siblings. At each position <code>i<\/code> under a parent, take the old child at <code>i<\/code> (if there is one) and the new element at <code>i<\/code> (if there is one), and apply the first row of the table that fits.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Old child at <code>i<\/code><\/th><th>New element at <code>i<\/code><\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td>exists, same type<\/td><td>exists<\/td><td>The old DOM node stays. Changed props are applied to it, or the new text if it is a text node. Then the two sets of children are compared.<\/td><\/tr><tr><td>exists, other type<\/td><td>exists<\/td><td>A new node is made and the old one leaves the page with everything below it. The new node takes position <code>i<\/code> among its siblings, so the children keep the order of the new element's list.<\/td><\/tr><tr><td>exists<\/td><td>none<\/td><td>The old node leaves the page, with everything below it.<\/td><\/tr><tr><td>none<\/td><td>exists<\/td><td>A new node is made and goes after the siblings already there.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Same type means the <code>type<\/code> values are <code>===<\/code>: the same tag name, or both text pieces (<code>&quot;TEXT_ELEMENT&quot;<\/code>). An element and a text piece at one position are different types. Nothing below a replaced or removed node is compared. Its subtree is gone, and every element under a new node is new too.<\/p>\n<p>Matching goes by position alone. Take the list <code>A, B, C<\/code> and turn it into <code>A, C<\/code>. The node that showed <code>B<\/code> now shows <code>C<\/code>, and the node that showed <code>C<\/code> is the one that leaves. <code>key<\/code> plays no part here, and no scenario gives one.<\/p>\n<h3>Props, handlers and the log<\/h3>\n<p>A node that stays is updated with <code>updateDom(dom, oldProps, newProps)<\/code> from <code>dom.js<\/code>. It writes the props that are new or changed, clears the ones that are gone and swaps a handler whose function changed. After the render the node shows the new element's props and has the new element's listeners and no others. A prop named <code>onClick<\/code> listens to <code>click<\/code>.<\/p>\n<p>A new node gets its props from <code>createDom<\/code>, as in 04.<\/p>\n<h3>Renders in a row<\/h3>\n<p>A scenario renders two or more trees into the same container. Each is compared with what is on the page, never with an older tree, and a fiber removed by one render must not be removed again by the next. Every <code>render<\/code> is followed by a <code>flush<\/code> before anything else happens. What your library does with a <code>render<\/code> that follows another before any work has run is not tested.<\/p>\n<h3>Input<\/h3>\n<p>The entry file is run as <code>node assignments/assignment_06_reconcile.js &lt;input-file&gt; &lt;output-file&gt;<\/code>, and you have met its three steps in 04 and 05. Load <code>../harness/env.js<\/code> first, since <code>render.js<\/code> asks for <code>requestIdleCallback<\/code> while it loads. Bring in <code>Didact<\/code> (<code>../src/didact/index.js<\/code>) and <code>runScenarioFile<\/code> (<code>../harness/scenario.js<\/code>). End by awaiting <code>runScenarioFile<\/code> with <code>process.argv[2]<\/code>, <code>process.argv[3]<\/code> and <code>Didact<\/code>. It comes done with the Boilerplate; from scratch you write it.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Keeps a tree under a name for later <code>render<\/code> lines. No output.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td><code>Didact.render(element, container)<\/code>, always with the same container. Nothing printed, no work run.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Idle periods until the work is done. No output.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the container.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>A bubbling <code>click<\/code> on the element whose id is <code>&lt;id&gt;<\/code>, followed by a <code>flush<\/code>. No output.<\/td><\/tr><tr><td><code>log<\/code><\/td><td>One line per handler call since the previous <code>log<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A tree is one line of HTML-like text, for instance <code>&lt;div id=box className=&quot;a b&quot;&gt;&lt;p onClick=@one&gt;hi&lt;/p&gt;&lt;/div&gt;<\/code>. Values are strings, a bare name means <code>true<\/code>, and text keeps its inner spaces. A value starting with <code>@<\/code> is a handler. <code>@one<\/code> is a function that adds the word <code>one<\/code> to the log when it runs, and every <code>@one<\/code> in a scenario is that same function. A <code>click<\/code> runs the target's listeners first and then each ancestor's, up to the root.<\/p>\n<h3>Output<\/h3>\n<pre><code>dump &lt;i&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;\nlog &lt;name&gt;<\/code><\/pre>\n<p>A <code>dump<\/code> prints <code>dump &lt;i&gt;<\/code>, counting dumps from 1, then the container's children in document order with their depth from 0: <code>node<\/code> for an element, <code>text<\/code> for a piece of text. An element is labelled when a dump first shows it, <code>a<\/code>, <code>b<\/code>, on through <code>z<\/code>, <code>aa<\/code>, <code>ab<\/code>, and the same DOM node keeps its label in every later dump. A node your library replaced is a new node and takes the next unused label, which is how the tests tell a kept node from a rebuilt one. Text nodes have no label. The tests can't tell a reused text node from a new one.<\/p>\n<p>The quoted prop list follows the tag. Alphabetically it can hold <code>className=...<\/code>, <code>disabled=true<\/code> (only on a <code>button<\/code>, <code>input<\/code> or <code>textarea<\/code>), <code>id=...<\/code>, <code>title=...<\/code> and <code>value=...<\/code> (only on an <code>input<\/code> or <code>textarea<\/code>), and an entry appears only once its prop has left its default, which is empty text or false. Entries are separated by spaces. A node with none prints <code>&quot;&quot;<\/code>. Whitespace, <code>&quot;<\/code> and <code>%<\/code> inside a value are percent-encoded, so <code>a b<\/code> becomes <code>a%20b<\/code>. A <code>text<\/code> line percent-encodes <code>%<\/code>, <code>&quot;<\/code> and line breaks and leaves spaces alone, and text nodes that touch print as a single line.<\/p>\n<p>Each call of an <code>@name<\/code> handler since the last <code>log<\/code> becomes a <code>log &lt;name&gt;<\/code> line, in call order.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The same type at the same position keeps its DOM node, with the same label in the next dump, and the new props and text are applied to it.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A prop that is missing from the new element is cleared on the node that stays.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A different type at a position gets a new node, and the new node stays at that position among its siblings.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Elements beyond the old children are added after them.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Old children beyond the new elements are removed, once each, however many are adjacent, and also when earlier renders removed some.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>After a render, a click runs the new handler once, and runs nothing for a handler that was removed.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Changes at several depths in one render, kept, replaced, added and removed nodes together, give the right tree.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>Random trees, two or three renders in a row: the container ends up as the last tree, and the nodes that stay are the ones the rules above keep.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Whole sessions of renders, clicks and dumps.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Up to 28 nodes per tree, any tag name, and only the props <code>id<\/code>, <code>className<\/code>, <code>title<\/code>, <code>disabled<\/code> and <code>onClick<\/code>; no function components, no keys. A scenario renders two to five trees with a <code>flush<\/code> after each, and never uses <code>idle<\/code> or <code>ops<\/code>. A <code>click<\/code> always names an element with a unique id. The 54 tests are hand-made pairs and sequences for each requirement, two full sessions and eight random ones: four edits of one tree, two chains of edits, two unrelated trees. <code>-Fresh<\/code> replaces the random ones. Ten seconds a test is far more than needed.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/state.js","text":"// ---- Assignment 06: the last committed tree and the old fibers to remove ----\nexport const state = {\n  nextUnitOfWork: null,\n  wipRoot: null,\n  currentRoot: null, // the root of the tree that is on screen\n  deletions: [], // old fibers that have no counterpart in the tree being built\n};\n"},{"path":"src/didact/render.js","text":"// ---- Assignment 04: the work loop ----\n// render() only schedules work. Whenever the browser is idle, workLoop() builds the tree of\n// fibers one unit of work at a time, so it can stop when the browser has something else to do.\nimport { createDom } from './dom.js';\nimport { reconcileChildren } from './reconcile.js';\nimport { state } from './state.js';\n\n// ---- Assignment 05: commit when the last unit is done ----\nimport { commitRoot } from './commit.js';\n\n// ---- Assignment 06: schedule the work against the tree on screen ----\nexport function render(element, container) {\n  state.deletions = [];\n  state.wipRoot = { dom: container, props: { children: [element] }, alternate: state.currentRoot };\n  state.nextUnitOfWork = state.wipRoot;\n}\n\n// ---- Assignment 05: commit in the same period as the last unit ----\nfunction workLoop(deadline) {\n  try {\n    let shouldYield = false;\n    while (state.nextUnitOfWork && !shouldYield) {\n      state.nextUnitOfWork = performUnitOfWork(state.nextUnitOfWork);\n      shouldYield = deadline.timeRemaining() < 1;\n    }\n    if (!state.nextUnitOfWork && state.wipRoot) commitRoot();\n  } finally {\n    requestIdleCallback(workLoop);\n  }\n}\n\n// ---- Assignment 05: one unit of work, without touching the page ----\nfunction performUnitOfWork(fiber) {\n  if (!fiber.dom) fiber.dom = createDom(fiber);\n  reconcileChildren(fiber, fiber.props.children);\n  return nextFiber(fiber);\n}\n\n// ---- Assignment 04: which fiber is next ----\n// Depth first: the child, else the sibling, else the nearest ancestor's sibling.\nfunction nextFiber(fiber) {\n  if (fiber.child) return fiber.child;\n  for (let next = fiber; next; next = next.parent) {\n    if (next.sibling) return next.sibling;\n  }\n  return null;\n}\n\nrequestIdleCallback(workLoop);\n"},{"path":"src/didact/reconcile.js","text":"// ---- Assignment 06: compare with the previous tree ----\nimport { state } from './state.js';\n\nfunction link(wipFiber, fibers) {\n  wipFiber.child = fibers[0] ?? null;\n  fibers.forEach((fiber, index) => {\n    fiber.sibling = fibers[index + 1] ?? null;\n  });\n}\n\n// The fiber for an element, given the old fiber it is compared with. The same type keeps the old\n// DOM node (UPDATE). Otherwise the element gets a node of its own (PLACEMENT) and the old fiber goes.\nfunction makeFiber(parent, element, oldFiber) {\n  if (oldFiber?.type === element.type) {\n    return {\n      type: oldFiber.type,\n      props: element.props,\n      dom: oldFiber.dom,\n      parent,\n      alternate: oldFiber,\n      effectTag: 'UPDATE',\n    };\n  }\n  if (oldFiber) deleteFiber(oldFiber);\n  return { type: element.type, props: element.props, dom: null, parent, alternate: null, effectTag: 'PLACEMENT' };\n}\n\n// The old fiber is only put on a list: the tree on screen is never changed by a render that may\n// still be thrown away.\nfunction deleteFiber(oldFiber) {\n  state.deletions.push(oldFiber);\n}\n\n// ---- Assignment 06: compare by position ----\nexport function reconcileChildren(wipFiber, elements) {\n  let oldFiber = wipFiber.alternate?.child;\n  const fibers = elements.map((element) => {\n    const fiber = makeFiber(wipFiber, element, oldFiber);\n    oldFiber = oldFiber?.sibling;\n    return fiber;\n  });\n  // The old children that the new list is too short for.\n  for (; oldFiber; oldFiber = oldFiber.sibling) deleteFiber(oldFiber);\n  link(wipFiber, fibers);\n}\n"},{"path":"src/didact/commit.js","text":"// ---- Assignment 05: commit the finished tree in one pass ----\n// The render phase builds fibers and DOM nodes but leaves the page alone; this applies the result.\nimport { state } from './state.js';\n\n// ---- Assignment 06: update props of kept nodes ----\nimport { updateDom } from './dom.js';\n\n// ---- Assignment 06: remove, place and update ----\nexport function commitRoot() {\n  state.deletions.forEach(commitDeletion);\n  commitWork(state.wipRoot);\n  state.currentRoot = state.wipRoot;\n  state.wipRoot = null;\n}\n\n// ---- Assignment 06: act on the effect tags ----\nfunction commitWork(fiber) {\n  if (fiber.effectTag === 'PLACEMENT') {\n    fiber.parent.dom.insertBefore(fiber.dom, nextStableDom(fiber));\n  } else if (fiber.effectTag === 'UPDATE') {\n    updateDom(fiber.dom, fiber.alternate.props, fiber.props);\n  }\n  // The fiber's old twin stays for now. The one before it is garbage: cut the link to it, or\n  // every old tree would be kept alive by the one after it.\n  if (fiber.alternate) fiber.alternate.alternate = null;\n  for (let child = fiber.child; child; child = child.sibling) commitWork(child);\n}\n\n// ---- Assignment 06: remove a deleted node ----\n// Each deleted fiber is on the list once, and only its own node is removed: its children went\n// with it.\nfunction commitDeletion(fiber) {\n  fiber.parent.dom.removeChild(fiber.dom);\n}\n\n// ---- Assignment 06: where a placed node goes ----\n// A placed node goes in front of the first later sibling that is not being placed itself, because\n// that one already stands where it belongs. With none, it goes last.\nfunction nextStableDom(fiber) {\n  for (let sibling = fiber.sibling; sibling; sibling = sibling.sibling) {\n    if (sibling.effectTag !== 'PLACEMENT') return sibling.dom;\n  }\n  return null;\n}\n"},{"path":"assignments/assignment_06_reconcile.js","text":"// Assignment 06: the checker runs this program as `node assignments/assignment_06_reconcile.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/index.js","src/didact/createElement.js","src/didact/dom.js"],"proof":{"passed":54,"total":54,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p><a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Step VI: Reconciliation<\/a> is where the post covers this, and you can pass without it. If you read it, go from the start through the three-way comparison of an element with the old fiber, then the effect tags, the list of fibers to remove and the new <code>commitWork<\/code>. The part on <code>updateDom<\/code> and listeners is what you wrote in 02. Stop before the code frames. In a few places the post's own code disagrees with the rules below; the section after you pass names them.<\/p>","readTitle":"Read in the blog first","context":"<p>Until now the container was empty when a render began. From here the second <code>render<\/code> meets a page that already holds the first tree, and it has to turn that page into the new one while keeping every node it can. No new files: <code>state.js<\/code> and <code>render.js<\/code> remember the last tree on the page, <code>reconcile.js<\/code> compares, and <code>commit.js<\/code> carries out the verdicts. Position is the only identity a child has until 07 refines the comparison.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Step VI: Reconciliation<\/a><\/li><li>React's older documentation, <a href=\"https://legacy.reactjs.org/docs/reconciliation.html\" target=\"_blank\" rel=\"noopener\">Reconciliation<\/a>, for the diffing rules<\/li><li>react.dev, <a href=\"https://react.dev/learn/preserving-and-resetting-state\" target=\"_blank\" rel=\"noopener\">Preserving and resetting state<\/a><\/li><li>MDN: <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/insertBefore\" target=\"_blank\" rel=\"noopener\">Node.insertBefore<\/a> and <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/removeChild\" target=\"_blank\" rel=\"noopener\">Node.removeChild<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 06                         the whole suite, grouped by requirement\n.\\check 06 -Case 06-R3-two-of-five   one test: the input, the expected output and yours\n.\\check 06 -Fresh                  eight new random sequences of renders\n.\\check 06 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test that you can show is wrong<\/code><\/pre>\n<p>Appending every new node to its parent gets you this report:<\/p>\n<pre><code>  R3  a different type at a position gets a new node, and it stays at t... .    3 / 8   FAILED\n      x 06-R3-middle-child  the middle of three children changes tag\n          node[0]: expected (depth=1, label=e, tag=u, props=&quot;&quot;), got (depth=1, label=d, tag=i, props=&quot;&quot;) - differs in label, tag  (in `dump 2`)\n          likely cause: R3 - a different type at a position gets a new node, and it stays at that position among its siblings\n          expected values from: React 19.3.1 on jsdom 30.1.3 (tools/oracle), cross-checked line by line against a positional model in tools/gen_p06.py\n          reproduce: py -P tools/run_js.py solutions 06 build/cases/06/06-R3-middle-child.in build/cases/06/06-R3-middle-child.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Leave removals and replacements for last. Start by making the same tree rendered twice keep every label. That takes only the last committed tree, a link from each new fiber to its twin, and <code>updateDom<\/code> in the commit. Then add one behaviour at a time, in this order: a changed type, extra new children, missing children.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>After each commit, remember the root of the tree that went onto the page, and have <code>render<\/code> build the next root with a link back to it. <code>reconcileChildren<\/code> walks the new elements and the old children of the fiber's twin together, one pair per position. A pair of the same type gives a fiber that reuses the old node and is tagged <code>UPDATE<\/code>. Any other pair gives a fiber with no node, tagged <code>PLACEMENT<\/code>, and the old child, if there is one, goes on a list of fibers to remove. Once the elements run out, every old child left over joins that list. The commit takes off everything on the list first, then walks the new tree. A <code>PLACEMENT<\/code> fiber's node goes into its parent in front of the next sibling already on the page, and an <code>UPDATE<\/code> fiber gets <code>updateDom<\/code> with its twin's props and its own.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Compare <code>type<\/code> with <code>type<\/code>. An element against a fiber, or one props object against another, never matches.<\/li><li>Step to the next old sibling after each element, and when the elements run out keep going through the old siblings that remain.<\/li><li>Appending a new node to its parent is the wrong move. It goes in front of the node of the next sibling already on the page, and later siblings that are new themselves aren't on the page yet, so skip them.<\/li><li>A removed fiber goes on the list once. Don't walk on from it to its siblings or children: each of those has its own entry or leaves with the parent.<\/li><li>Begin every render with an empty removal list, or the next render takes last time's nodes out again.<\/li><li>Remember the committed tree at the end of the commit, not at the start of the render, and leave the committed fibers alone while a render is going on.<\/li><li><code>updateDom<\/code> needs the old fiber's props. Empty old props can't clear a prop or remove a listener.<\/li><li>The first render has no twin. <code>alternate.child<\/code> on nothing throws; <code>alternate?.child<\/code> is undefined.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>render(element, container):\n    deletions = []\n    wipRoot = fiber with dom = container, props.children = [element], alternate = currentRoot\n    nextUnitOfWork = wipRoot\n\nreconcileChildren(wipFiber, elements):\n    oldFiber = wipFiber.alternate?.child\n    for each element, in order:\n        if oldFiber and oldFiber.type == element.type:\n            fiber = type, props of element, dom of oldFiber, parent wipFiber, alternate oldFiber, &quot;UPDATE&quot;\n        else:\n            fiber = type and props of element, no dom, parent wipFiber, no alternate, &quot;PLACEMENT&quot;\n            if oldFiber: add oldFiber to deletions\n        oldFiber = oldFiber&#x27;s sibling\n        link fiber into wipFiber.child / previous fiber&#x27;s sibling\n    for each oldFiber still left: add it to deletions\n\ncommitRoot():\n    for each fiber in deletions: fiber.parent.dom.removeChild(fiber.dom)\n    commitWork(wipRoot)\n    currentRoot = wipRoot\n    wipRoot = nothing\n\ncommitWork(fiber):\n    if fiber is &quot;PLACEMENT&quot;: fiber.parent.dom.insertBefore(fiber.dom, dom of the next sibling that is not &quot;PLACEMENT&quot;, or null)\n    if fiber is &quot;UPDATE&quot;: updateDom(fiber.dom, fiber.alternate.props, fiber.props)\n    for each child: commitWork(child)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the replaced child stays in the middle","test":"06-R3-middle-child","input":"tree a <div><p>A<\/p><b>B<\/b><i>C<\/i><\/div>\ntree b <div><p>A<\/p><u>B<\/u><i>C<\/i><\/div>\nrender a\nflush\ndump\nrender b\nflush\ndump","output":"dump 1\nnode 0 a div \"\"\nnode 1 b p \"\"\ntext 2 \"A\"\nnode 1 c b \"\"\ntext 2 \"B\"\nnode 1 d i \"\"\ntext 2 \"C\"\ndump 2\nnode 0 a div \"\"\nnode 1 b p \"\"\ntext 2 \"A\"\nnode 1 e u \"\"\ntext 2 \"B\"\nnode 1 d i \"\"\ntext 2 \"C\"","image":null,"explain":"<p><code>div<\/code>, <code>p<\/code> and <code>i<\/code> are the same nodes, so they keep <code>a<\/code>, <code>b<\/code> and <code>d<\/code>. The <code>b<\/code> became a <code>u<\/code>: the old node left and a new one, labelled <code>e<\/code>, took its place between the other two. Appending that new node to the <code>div<\/code> would put <code>u<\/code> after <code>i<\/code>, and the second dump would print <code>i<\/code> before <code>u<\/code>.<\/p>"},{"label":"Example 2","name":"two adjacent removals","test":"06-R5-four-to-two","input":"tree a <ul><li>a<\/li><li>b<\/li><li>c<\/li><li>d<\/li><\/ul>\ntree b <ul><li>a<\/li><li>b<\/li><\/ul>\nrender a\nflush\ndump\nrender b\nflush\ndump","output":"dump 1\nnode 0 a ul \"\"\nnode 1 b li \"\"\ntext 2 \"a\"\nnode 1 c li \"\"\ntext 2 \"b\"\nnode 1 d li \"\"\ntext 2 \"c\"\nnode 1 e li \"\"\ntext 2 \"d\"\ndump 2\nnode 0 a ul \"\"\nnode 1 b li \"\"\ntext 2 \"a\"\nnode 1 c li \"\"\ntext 2 \"b\"","image":null,"explain":"<p>The last two <code>li<\/code> nodes have no element left. They sit side by side. Each has to come out of the <code>ul<\/code> once. If removing the first goes on to touch the second, which is what happens when a deleted fiber's removal also follows its siblings, that node is removed twice and the run dies with a <code>NotFoundError<\/code> from <code>removeChild<\/code>.<\/p>"},{"label":"Example 3","name":"the latest handler only","test":"06-R6-handler-replaced","input":"tree a <button id=b onClick=@one>x<\/button>\ntree b <button id=b onClick=@two>x<\/button>\nrender a\nflush\ndump\nclick #b\nlog\nrender b\nflush\ndump\nclick #b\nlog","output":"dump 1\nnode 0 a button \"id=b\"\ntext 1 \"x\"\nlog one\ndump 2\nnode 0 a button \"id=b\"\ntext 1 \"x\"\nlog two","image":null,"explain":"<p>The button is kept, so it is <code>a<\/code> in both dumps. The second render gives it another function, <code>two<\/code>. The old listener has to come off and the new one go on, or the second click prints <code>log one<\/code> and <code>log two<\/code>.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Pombo's Step VI<\/a> keeps the last committed tree in <code>currentRoot<\/code> and gives every fiber an <code>alternate<\/code>: the old fiber at the same place, or <code>null<\/code> for a new one. <code>reconcileChildren(wipFiber, elements)<\/code> walks the elements and the old fibers together in one loop that runs until both are used up, and tags each new fiber <code>UPDATE<\/code> or <code>PLACEMENT<\/code>. An old fiber to remove gets the tag <code>DELETION<\/code> and goes into a <code>deletions<\/code> array that <code>render<\/code> empties. <code>commitRoot<\/code> runs <code>commitWork<\/code> over <code>deletions<\/code>, then over <code>wipRoot.child<\/code>, and sets <code>currentRoot<\/code>; <code>commitWork<\/code> handles the three tags and calls <code>updateDom<\/code> for an update, as in 02. That is the structure the rules above describe. Two things differ here. <code>currentRoot<\/code> and <code>deletions<\/code> live in <code>state<\/code>, and a removed fiber is only put on the list, with no <code>DELETION<\/code> tag written onto it (the last paragraph says why).<\/p>\n<p>Two places in the post's <code>commitWork<\/code> break what the tests need. A fiber with <code>PLACEMENT<\/code> is added with <code>domParent.appendChild(fiber.dom)<\/code>, so a replaced child with later siblings ends up behind them, and the first example here fails. And <code>commitWork<\/code> goes on to <code>fiber.child<\/code> and <code>fiber.sibling<\/code> for every tag, a deleted fiber included. With two adjacent removals, the walk from the first one reaches the second, which is tagged for deletion as well, and removes it. Then the <code>deletions<\/code> array removes it again. That second removal of the same node makes <code>removeChild<\/code> throw <code>NotFoundError<\/code>, the commit stops before the kept nodes get their new props, and because the post's loop registers itself again only as its last statement, the library never runs again. Any render that removes or replaces two neighbouring children hits this; a list that shrinks by two is one example. Both are why the page asks for placement in front of a sibling and for each node to be removed once.<\/p>\n<p>The same walk over deleted fibers re-applies old tags to the siblings and children it passes. That costs extra DOM calls, which a dump does not show. The post also writes the tag <code>DELETION<\/code> onto a fiber that is already on the page. Its epilogue says an update arriving in the middle of a render makes Didact throw the unfinished tree away and start again from the root, and the tag outlives that restart, so a later render can remove a live node. The tests render only after a <code>flush<\/code>, so none of them restarts work and none can show this. Hint 3 asks you to leave the committed fibers alone for that reason, and a list entry is all a removal needs.<\/p>\n<p>React matches unkeyed children by position, as here, and by key when there are keys; <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> lists the other differences, including how it sets props. The post's aside says React also uses keys, and 07 adds them. One more difference the tests cannot see: every <code>alternate<\/code> link keeps the previous render's fiber alive, and that fiber's own <code>alternate<\/code> reaches back further, which means the post never lets go of an old tree.<\/p>"},"need":{"new":[{"id":"react-reconciliation","title":"Reconciliation by type and position","note":"same type at the same place keeps its node, a different type gets a new one, and the old children left over go.","group":"React and the ideas in the posts","from":"06"}],"earlier":[{"id":"dom-tree-editing","title":"<code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code>","note":"a new node goes in front of a particular sibling instead of at the end, and once a node is removed it is gone for good, which makes removing it a second time an error.","group":"The DOM","from":"03"},{"id":"dom-events","title":"Listeners, event types and bubbling","note":"a node that is kept ends up with the new handler and none of the old.","group":"The DOM","from":"02"},{"id":"react-tree","title":"Trees of elements","note":"two renders make two trees, and the library has to find what separates them.","group":"React and the ideas in the posts","from":"03"},{"id":"react-fibers","title":"Fibers","note":"each fiber now links to its twin from the previous render.","group":"React and the ideas in the posts","from":"04"},{"id":"js-optional-chaining","title":"Optional chaining <code>?.<\/code> and <code>??<\/code>","note":"the first render has no earlier tree, so asking for its children comes back empty.","group":"JavaScript","from":"04"},{"id":"js-equality","title":"<code>===<\/code>, <code>Object.is<\/code>, truthy and falsy","note":"two elements match when their types are equal under <code>===<\/code>.","group":"JavaScript","from":"02"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"}]}},{"id":"07","num":"7","title":"Match children by key","difficulty":"Medium","tests":47,"problem":"problems/07-keys.md","entry":"solutions/assignments/assignment_07_keys.js","files":[{"path":"solutions/assignments/assignment_07_keys.js","role":"entry","purpose":null,"job":"Point `runScenarioFile` at your `Didact` object. The scenario re-renders lists whose children carry keys.","blank":"// ======================================================================================\n// Assignment 07: Match children by key\n// Problem: problems/07-keys.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 07 as `python -P tools/run_js.py\n//   solutions 07 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 07` (`./check.sh 07` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Point `runScenarioFile` at your `Didact` object. The scenario re-renders lists whose\n//   children carry keys.\n//\n// The other files of this assignment:\n//   It adds to src/didact/reconcile.js, which you started earlier: Pair each child with\n//   the old child that has the same `key`, wherever that one stood, as long as the keys\n//   both lists share stay in the same order. Children without a key still match by\n//   position.\n//   Earlier files you can use: src/didact/dom.js and src/didact/render.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as reconcile from '../src/didact/reconcile.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 07: Match children by key\n// Problem: problems/07-keys.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 07 as `python -P tools/run_js.py\n//   solutions 07 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 07` (`./check.sh 07` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/didact/reconcile.js, which you started earlier: Pair each child with\n//   the old child that has the same `key`, wherever that one stood, as long as the keys\n//   both lists share stay in the same order. Children without a key still match by\n//   position.\n//   Earlier files you can use: src/didact/dom.js and src/didact/render.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as reconcile from '../src/didact/reconcile.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"},{"path":"solutions/src/didact/reconcile.js","role":"adds","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render.","job":"Pair each child with the old child that has the same `key`, wherever that one stood, as long as the keys both lists share stay in the same order. Children without a key still match by position.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Decides which fibers a parent's children become. At first that means a fresh fiber for\n//   every child, then a comparison with the previous render. Later, assignments 06, 07 and\n//   08 add to this file.\n//\n// Your job:\n//   Give every element a fiber of its own in `reconcileChildren(wipFiber, elements)`, and\n//   link the fibers with `child`, `sibling` and `parent`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"}],"buildsOn":[{"path":"solutions/src/didact/dom.js","owner":"02","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props."},{"path":"solutions/src/didact/render.js","owner":"04","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-maps-sets\"><code>Map<\/code> and <code>Set<\/code><\/a> (optional)","<a href=\"#primer/js-equality\"><code>===<\/code>, <code>Object.is<\/code>, truthy and falsy<\/a>"],"text":["Map and Set (optional)","===, Object.is, truthy and falsy"]},{"label":"Library","items":["<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>","<a href=\"#primer/dom-form-inputs\">inputs: <code>value<\/code> and the <code>input<\/code> event<\/a>"],"text":["the harness and scenario files","inputs: value and the input event"]},{"label":"Concepts","items":["<a href=\"#primer/react-keys\">keys<\/a>","<a href=\"#primer/react-reconciliation\">reconciliation by type and position<\/a>","<a href=\"#primer/react-fibers\">fibers<\/a>"],"text":["keys","reconciliation by type and position","fibers"]}],"body":"<div class=\"d-problem flow\"><p>Teach <code>reconcileChildren<\/code> to pair each new child with the old child that has the same key, wherever that old child stood. A scenario renders a list, renders an edited list and dumps the page. Every dump is compared with React's, and the checker also counts the DOM nodes your program built and removed.<\/p>\n<h3>Input<\/h3>\n<p>The checker starts <code>node assignments/assignment_07_keys.js &lt;input-file&gt; &lt;output-file&gt;<\/code>. The program is short. Import <code>../harness/env.js<\/code> first: your library has to load after the fake page and the controllable idle callback exist. Import your <code>Didact<\/code> object from <code>src/didact/index.js<\/code>. End with <code>await runScenarioFile(process.argv[2], process.argv[3], Didact)<\/code>, where <code>runScenarioFile<\/code> comes from <code>../harness/scenario.js<\/code>. The Boilerplate has it written. From a blank start, those lines are yours. A scenario uses these lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Stores a tree of one root element under a name. <code>key=&quot;a&quot;<\/code> is an attribute like the rest and lands in <code>props.key<\/code> as a string.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Calls <code>Didact.render<\/code> with that tree and the container. No work runs yet.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs idle periods until your work loop is idle. Each <code>render<\/code> here gets a <code>flush<\/code> before the next command.<\/td><\/tr><tr><td><code>type #&lt;id&gt; &lt;text&gt;<\/code><\/td><td>Sets the <code>value<\/code> of the element with that id to the rest of the line, fires a bubbling <code>input<\/code> event, then flushes.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the page.<\/td><\/tr><tr><td><code>ops create remove<\/code><\/td><td>Prints how many nodes the harness DOM created and how many <code>removeChild<\/code> calls it saw since the previous <code>ops<\/code> line (or since the start).<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Inputs in the markup have an id and no <code>value<\/code> attribute, so typed text is the only value they ever hold. Keys are unique among siblings. Two lists in one tree may reuse a key, though, and a key dropped from a list may return in a later render as a new child.<\/p>\n<h3>Output<\/h3>\n<p>A <code>dump<\/code> opens with a counter line, then lists the container's content, parents before children. The container itself is not printed, so a root element sits at depth 0.<\/p>\n<pre><code>dump &lt;n&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p>The props field holds <code>className<\/code>, <code>id<\/code>, <code>title<\/code> and, on inputs, <code>value<\/code>, whenever they differ from their defaults. They are sorted by name and separated by spaces, and a value containing a space, a quote or <code>%<\/code> is percent-encoded. Neighbouring text nodes share one <code>text<\/code> line.<\/p>\n<p>The tests read labels. Elements are named <code>a<\/code>, <code>b<\/code>, <code>c<\/code>, ... <code>z<\/code>, <code>aa<\/code>, ... in the order dumps first show them, and a node keeps its label in every later dump. The same label in two dumps is therefore the same DOM node, and a node you rebuild shows up under a new letter even when it looks identical.<\/p>\n<p>An <code>ops<\/code> line is <code>ops &lt;creates&gt; &lt;removes&gt;<\/code>. A create is one <code>createElement<\/code> or <code>createTextNode<\/code> call on the harness DOM, so elements and text nodes both count. A remove is one <code>removeChild<\/code> call.<\/p>\n<h3>How children are matched<\/h3>\n<p>These rules work on the children of one parent at a time, and again inside every matched pair.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>New child<\/th><th>It continues<\/th><th>Otherwise<\/th><\/tr><\/thead><tbody><tr><td>has a key<\/td><td>the old child with that key, if its type is the same<\/td><td>a new node is built; an old child with that key but another type is removed<\/td><\/tr><tr><td>has no key<\/td><td>the old child at the same position, if that has no key either and the same type<\/td><td>a new node is built; an old child at that position of another type is removed<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>A key is <code>String(props.key)<\/code>. A child whose <code>props.key<\/code> is missing, <code>null<\/code> or <code>undefined<\/code> has none. Keys are compared as those strings, as they are. The empty string is a key and <code>&quot;0&quot;<\/code> is a key. <code>&quot;1&quot;<\/code> and <code>&quot;01&quot;<\/code> are two keys, and so are <code>&quot;0&quot;<\/code> and <code>&quot;&quot;<\/code>. Duplicate keys among siblings are not tested, so what happens to them is up to you.<\/li><li>A child that continues an old one keeps the old node. Its props and text are brought up to date as in 06, and its own children are matched by these same rules.<\/li><li>A keyed child never continues an unkeyed one, and an unkeyed child never continues a keyed one. The tests switch whole lists from one kind to the other and do not mix both kinds in one list, so a mixed list is yours to define.<\/li><li>A new node goes before the first later sibling that is already standing in the page, or last if there is none. Several new children in a row follow the same rule.<\/li><li>An old child that no new child continues is removed, with one <code>removeChild<\/code> for the child's own node, whatever it holds.<\/li><li>In this assignment the keys that two renders share come in the same order in both. A list that reorders its keys is assignment 08.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each case targets one requirement. A failing run names the requirement most of its failures point to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Rendering a list again with the same keys in the same order keeps every node, and the changed props and text are written into the kept nodes.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A new keyed child is built and placed where the new list has it: at the front, in the middle or at the end.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A child whose key is still in the list keeps its node, and every node below it, while other children are added and removed around it, over several renders too.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A child whose key is missing from the new list is removed, that one only: first, last, middle, several next to each other, or all.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A key that is new, or a known key on a different tag, gives a new node in the place of the old child.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>An input keeps what was typed into it for as long as its key is in the list. A new input starts empty.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Keys are compared as exact strings: <code>&quot;&quot;<\/code> is a key, <code>&quot;0&quot;<\/code> is a key, and <code>&quot;1&quot;<\/code>, <code>&quot;01&quot;<\/code> and <code>&quot;001&quot;<\/code> are three keys.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>Children without a key match by position, and a keyed child never matches an unkeyed one.<\/span><\/li><li><span class=\"rid\">R9<\/span><span><code>ops create remove<\/code> counts a create for every element and text node of a new child and one remove for every removed child, and nothing for kept ones.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Longer sessions on lists between other elements, among them seeded random ones.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>No scenario runs past 56 lines, 7 renders or 12 children in a list. Texts are single words, or two words for typed values. The 47 tests cover every requirement, two longer sessions and seven seeded random runs (a fresh seed gives seven new ones). Each case has a 10-second limit and takes a fraction of a second.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/reconcile.js","text":"// ---- Assignment 06: compare with the previous tree ----\nimport { state } from './state.js';\n\nfunction link(wipFiber, fibers) {\n  wipFiber.child = fibers[0] ?? null;\n  fibers.forEach((fiber, index) => {\n    fiber.sibling = fibers[index + 1] ?? null;\n  });\n}\n\n// The fiber for an element, given the old fiber it is compared with. The same type keeps the old\n// DOM node (UPDATE). Otherwise the element gets a node of its own (PLACEMENT) and the old fiber goes.\nfunction makeFiber(parent, element, oldFiber) {\n  if (oldFiber?.type === element.type) {\n    return {\n      type: oldFiber.type,\n      props: element.props,\n      dom: oldFiber.dom,\n      parent,\n      alternate: oldFiber,\n      effectTag: 'UPDATE',\n    };\n  }\n  if (oldFiber) deleteFiber(oldFiber);\n  return { type: element.type, props: element.props, dom: null, parent, alternate: null, effectTag: 'PLACEMENT' };\n}\n\n// The old fiber is only put on a list: the tree on screen is never changed by a render that may\n// still be thrown away.\nfunction deleteFiber(oldFiber) {\n  state.deletions.push(oldFiber);\n}\n\n// ---- Assignment 07: match by key, if the keys stay in order ----\nexport function reconcileChildren(wipFiber, elements) {\n  let oldFiber = wipFiber.alternate?.child;\n  const fibers = elements.map((element) => {\n    const match = findMatch(oldFiber, element);\n    if (match) {\n      // The old children passed over on the way to the match are not in the new list.\n      for (; oldFiber !== match; oldFiber = oldFiber.sibling) deleteFiber(oldFiber);\n      oldFiber = match.sibling;\n    }\n    return makeFiber(wipFiber, element, match);\n  });\n  for (; oldFiber; oldFiber = oldFiber.sibling) deleteFiber(oldFiber);\n  link(wipFiber, fibers);\n}\n\nconst keyOf = (item) => (item.props.key == null ? null : String(item.props.key));\n\n// The old child an element continues. With a key: the first old child from `from` on that has the\n// same key. Without one: the old child at `from`, if it has no key either (match by position).\nfunction findMatch(from, element) {\n  const key = keyOf(element);\n  if (key === null) return from && keyOf(from) === null ? from : null;\n  for (let fiber = from; fiber; fiber = fiber.sibling) {\n    if (keyOf(fiber) === key) return fiber;\n  }\n  return null;\n}\n"},{"path":"assignments/assignment_07_keys.js","text":"// Assignment 07: the checker runs this program as `node assignments/assignment_07_keys.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/index.js","src/didact/createElement.js","src/didact/render.js","src/didact/dom.js","src/didact/state.js","src/didact/commit.js"],"proof":{"passed":47,"total":47,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>You can do this page without the post. If you want the idea first, read the opening of section <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.2%20Creating%20the%20diff%20for%20the%20children\" target=\"_blank\" rel=\"noopener\">3.2, Creating the diff for the children<\/a> in <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d\" target=\"_blank\" rel=\"noopener\">Jongeneel's article<\/a>. That means the prose and the first figure, which compares two lists of children by key. Stop where the code of <code>childsDiff<\/code> begins, because that is the author's answer to this assignment. A second figure, keys in a new order, closes the section; it belongs to 08. Pombo's <a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Step VI<\/a> points here in one sentence: React also uses keys, for a better reconciliation. His <a href=\"https://pomb.us/build-your-own-react/#epilogue\" target=\"_blank\" rel=\"noopener\">epilogue<\/a> lists reconciliation by key among the features you can add.<\/p>","readTitle":"Read in the blog first","context":"<p>Position matching, as in 06, pairs a new child with whatever stood in its slot. Put one item in front of a list and it falls apart. Every old node takes its neighbour's text, and a spare node is tacked on at the end. A key tells the library which child is which. Only <code>reconcile.js<\/code> changes.<\/p>","sources":"<ul><li>Wim Jongeneel, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.2%20Creating%20the%20diff%20for%20the%20children\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>, section 3.2 on the diff for the children, and the <a href=\"https://github.com/WimJongeneel/ts-reactive-rendering\" target=\"_blank\" rel=\"noopener\">repository<\/a> behind it<\/li><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Step VI: Reconciliation<\/a><\/li><li>React documentation: <a href=\"https://react.dev/learn/rendering-lists\" target=\"_blank\" rel=\"noopener\">Rendering lists<\/a> and <a href=\"https://react.dev/learn/preserving-and-resetting-state\" target=\"_blank\" rel=\"noopener\">Preserving and resetting state<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 07                          every test, grouped by requirement\n.\\check 07 -Case 07-R2-front        one test with its input, the expected output and yours\n.\\check 07 -Fresh                   seven new random sessions, to try your code on scenarios you haven&#x27;t seen\n.\\check 07 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>A reconciler that appends every new node, which is what Jongeneel's code does with a new first item, fails like this:<\/p>\n<pre><code>  R2  A new keyed child is built and placed where the new list has it: ... .    1 / 7   FAILED\n      x 07-R2-front  a keyed item is added in front of two others\n          node[0]: expected (depth=1, label=d, tag=li, props=&quot;&quot;), got (depth=1, label=b, tag=li, props=&quot;&quot;) - differs in label  (in `dump 2`)\n          likely cause: R2 - A new keyed child is built and placed where the new list has it: at the front, in the middle or at the end\n          expected values from: React 19.3.1 on jsdom 30.1.3 (tools/oracle); ops lines from a model of the matching rules in tools/gen_p07.py\n          reproduce: py -P tools/run_js.py build/bugs/07/front-insert-appended 07 build/cases/07/07-R2-front.in build/cases/07/07-R2-front.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>In 06 the child at slot <code>i<\/code> is compared with the old fiber at slot <code>i<\/code>. With keys, the old child you want can stand several slots away. Write a function from the new element and the old children to its partner, and call it where 06 picks the old fiber at the same position.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Go through the new elements in order and find each one's partner among the old children: by key if it has one, by position if not. A partner of the same type gives a fiber that keeps the partner's DOM node and links back to it (an update). Otherwise the fiber gets a node of its own (a placement), and if a partner of another type turned up, queue that old fiber for removal. When the elements run out, queue every old child that no new child took. A table from key to old fiber makes the lookup a single step. Walking forward through the old list works as well, since in this assignment the keys that survive keep their order.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>The key <code>&quot;&quot;<\/code> is falsy. Compare with <code>=== undefined<\/code> or <code>== null<\/code>, never with <code>if (key)<\/code>.<\/li><li>Convert a key with <code>String<\/code> and keep it a string. Turning <code>&quot;01&quot;<\/code> into the number 1 merges it with <code>&quot;1&quot;<\/code>, and <code>&quot;&quot;<\/code> and <code>&quot;0&quot;<\/code> both become 0.<\/li><li>The next old child is not always the next one to match. Old children that the walk passes over without a partner are removed.<\/li><li>Several new children in a row: the sibling after the first new node may be new too, with no place in the page yet. Insert before the first following sibling that is already in the page.<\/li><li>Queue each removed fiber once, and remove only its own node. The nodes below it go with it.<\/li><li>Same key on a different tag means the old child is removed and the new one is built. It does not keep the node.<\/li><li>A child without a key gets a partner only when the old child at its position has no key either.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>reconcileChildren(wipFiber, elements):\n    oldFibers = children of wipFiber.alternate, in order\n    claimed = empty set\n    for each element, at position i:\n        key = element.props.key, or none if it has none\n        partner = old fiber with that key        (key given)\n                  old fiber at position i         (no key, and that fiber has no key)\n        if partner exists and partner.type == element.type:\n            fiber = update fiber, dom = partner.dom, alternate = partner\n        else:\n            fiber = placement fiber, new dom to be made\n            if partner exists: queue partner for removal\n        claimed.add(partner)\n        add fiber to the new list\n    for each old fiber not in claimed: queue for removal\n    link the new list with child and sibling<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a new item in front","test":"07-R2-front","input":"tree t1 <ul><li key=\"a\">item a<\/li><li key=\"b\">item b<\/li><\/ul>\nrender t1\nflush\ndump\nops create remove\ntree t2 <ul><li key=\"z\">item z<\/li><li key=\"a\">item a<\/li><li key=\"b\">item b<\/li><\/ul>\nrender t2\nflush\ndump\nops create remove","output":"dump 1\nnode 0 a ul \"\"\nnode 1 b li \"\"\ntext 2 \"item a\"\nnode 1 c li \"\"\ntext 2 \"item b\"\nops 5 0\ndump 2\nnode 0 a ul \"\"\nnode 1 d li \"\"\ntext 2 \"item z\"\nnode 1 b li \"\"\ntext 2 \"item a\"\nnode 1 c li \"\"\ntext 2 \"item b\"\nops 2 0","image":null,"explain":"<p>The new <code>li<\/code> comes first and takes the new label <code>d<\/code>. The two old items keep <code>b<\/code> and <code>c<\/code>, text included. Nothing is rewritten. Position matching would have written <code>item z<\/code> into the first node and built a spare at the end. On the <code>ops<\/code> lines, the first says five creates: the <code>ul<\/code>, two <code>li<\/code>s and two texts. The second says two, the <code>li<\/code> and its text, and no removes.<\/p>"},{"label":"Example 2","name":"the empty key","test":"07-R7-empty-key-front-removal","input":"tree t1 <ul><li key=\"x\">item x<\/li><li key=\"\">item empty<\/li><li key=\"y\">item y<\/li><\/ul>\nrender t1\nflush\ndump\nops create remove\ntree t2 <ul><li key=\"\">item empty<\/li><li key=\"y\">item y<\/li><\/ul>\nrender t2\nflush\ndump\nops create remove","output":"dump 1\nnode 0 a ul \"\"\nnode 1 b li \"\"\ntext 2 \"item x\"\nnode 1 c li \"\"\ntext 2 \"item empty\"\nnode 1 d li \"\"\ntext 2 \"item y\"\nops 7 0\ndump 2\nnode 0 a ul \"\"\nnode 1 c li \"\"\ntext 2 \"item empty\"\nnode 1 d li \"\"\ntext 2 \"item y\"\nops 0 1","image":null,"explain":"<p>Item <code>x<\/code> is gone. The other two keep <code>c<\/code> and <code>d<\/code>. Watch the middle child, whose key is <code>&quot;&quot;<\/code>. A test written as <code>if (key)<\/code> takes it for a child without a key, goes looking for it by position, finds <code>x<\/code> there instead and rebuilds it.<\/p>"},{"label":"Example 3","name":"typed text and a new key","test":"07-R6-key-change-resets","input":"tree t1 <ul><li key=\"a\"><input id=\"ia\"/><\/li><li key=\"b\"><input id=\"ib\"/><\/li><\/ul>\nrender t1\nflush\ndump\nops create remove\ntype #ia typed\ntype #ib kept\ntree t2 <ul><li key=\"a2\"><input id=\"ia\"/><\/li><li key=\"b\"><input id=\"ib\"/><\/li><\/ul>\nrender t2\nflush\ndump\nops create remove","output":"dump 1\nnode 0 a ul \"\"\nnode 1 b li \"\"\nnode 2 c input \"id=ia\"\nnode 1 d li \"\"\nnode 2 e input \"id=ib\"\nops 5 0\ndump 2\nnode 0 a ul \"\"\nnode 1 f li \"\"\nnode 2 g input \"id=ia\"\nnode 1 d li \"\"\nnode 2 e input \"id=ib value=kept\"\nops 2 1","image":null,"explain":"<p>The first item's key changed from <code>a<\/code> to <code>a2<\/code>. That makes it a new child, even though its id is the one it had. Its <code>li<\/code> and <code>input<\/code> are new (<code>f<\/code> and <code>g<\/code>), the word <code>typed<\/code> went away with the old input, and the old <code>li<\/code> is removed. That is two creates and one remove. The remove counts once because the old <code>li<\/code> is one child, and the input inside leaves with it. The second item still has the key <code>b<\/code>, so <code>d<\/code> and <code>e<\/code> are the old nodes and the input still holds <code>kept<\/code>.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.2%20Creating%20the%20diff%20for%20the%20children\" target=\"_blank\" rel=\"noopener\">Jongeneel's children diff<\/a> is <code>childsDiff<\/code>. It keeps two lists of what is left, <code>remainingOldChilds<\/code> and <code>remainingNewChilds<\/code>, and finds the first old child whose key also occurs in the new list. This page calls that child the pivot; the code only keeps its key, in <code>nextUpdateKey<\/code>. <code>removeUntilkey<\/code> queues a <code>remove<\/code> for every old child in front of the pivot, <code>insertUntilKey<\/code> queues an <code>insert<\/code> for every new child in front of the pivot's partner, and the pair itself gets the diff of its two nodes, an <code>update<\/code>, a <code>replace<\/code> or a <code>skip<\/code>. The loop goes round again on what is left, and the leftovers are removed, then inserted. <code>applyChildrenDiff<\/code> replays the resulting list of operations against the DOM with a running offset. The workbook has no such list. As in 06, <code>reconcileChildren<\/code> builds the new fibers and tags them, and the commit places them.<\/p>\n<p>Replay that list and an item that belongs at position 0 ends up at the end whenever other children are still in the page. The code looks up the node before the item's position, finds none at index -1 and falls back to appending. The post's own second figure, <code>A, B, C<\/code> to <code>B, A, C<\/code>, leaves the list reading <code>A, B, B<\/code> when you run it. The loop <code>while (nextUpdateKey)<\/code> also ends early on a falsy key. The empty string is one. The post gives every text node that key by default. A text child is therefore removed and built again on every render, and a list whose first shared key is falsy goes through the removal and insertion sweep as a whole. A list of children without keys gets an empty operation list, so no change to it ever reaches the page. The TypeScript types require a key on <code>createElement<\/code>, which hides that. Here such children match by position, as in 06.<\/p>\n<p>The post lets a key be a string or a number and compares keys as they are, with <code>indexOf<\/code> when it looks for the next pair and with <code>!=<\/code> when it sweeps, so <code>1<\/code> and <code>&quot;1&quot;<\/code> can come out as one key or as two. Here a key is <code>String(props.key)<\/code>. A key that is in both lists but reached in a different order is removed and inserted again, because the post says outright that it does not support reordering. Assignment 08 changes that, the way React does. Section 5.6 later makes <code>removeUntilkey<\/code> unmount a removed child that is itself a component, and nothing deeper: a component inside a removed element gets no unmount call. Components arrive in 09, and 11 checks the cleanup.<\/p>\n<p><code>createElement<\/code> in the post also deletes <code>key<\/code> from the props object it receives, which alters the caller's object. Here <code>key<\/code> stays an ordinary prop. The table in <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> shows where React 19 and the posts part ways, and its row on keys is the one that applies.<\/p>"},"need":{"new":[{"id":"react-keys","title":"Keys","note":"what a <code>key<\/code> prop promises, and why it has to be unique among siblings and not across the page.","group":"React and the ideas in the posts","from":"07"},{"id":"js-maps-sets","title":"<code>Map<\/code> and <code>Set<\/code>","note":"a table from key to old fiber is one way to find a child's partner. Walking the old list is the other.","group":"JavaScript","from":"07"},{"id":"dom-form-inputs","title":"Inputs: <code>value<\/code> and the <code>input<\/code> event","note":"the scenarios type into inputs, and typed text lives only on the node. Rebuild the node and the text is gone.","group":"The DOM","from":"07"}],"earlier":[{"id":"react-reconciliation","title":"Reconciliation by type and position","note":"used here in a new way. Position still decides for children without a key, and a matched pair has to agree on type.","group":"React and the ideas in the posts","from":"06"},{"id":"js-equality","title":"<code>===<\/code>, <code>Object.is<\/code>, truthy and falsy","note":"put to a new use. The empty string is a legal key, and it is falsy.","group":"JavaScript","from":"02"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"},{"id":"react-fibers","title":"Fibers","note":"","from":"04"}]}},{"id":"08","num":"8","title":"Reorder keyed children","difficulty":"Hard","tests":42,"problem":"problems/08-reorder.md","entry":"solutions/assignments/assignment_08_reorder.js","files":[{"path":"solutions/assignments/assignment_08_reorder.js","role":"entry","purpose":null,"job":"Feed `runScenarioFile` your `Didact` object and let the scenario shuffle keyed lists.","blank":"// ======================================================================================\n// Assignment 08: Reorder keyed children\n// Problem: problems/08-reorder.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 08 as `python -P tools/run_js.py\n//   solutions 08 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 08` (`./check.sh 08` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Feed `runScenarioFile` your `Didact` object and let the scenario shuffle keyed lists.\n//\n// The other files of this assignment:\n//   It adds to src/didact/reconcile.js, which you started earlier: Let a key keep matching\n//   its old child when the shared keys come in a different order.\n//   It adds to src/didact/commit.js, which you started earlier: Move the DOM node of a\n//   reordered child instead of recreating it; a node that lives on keeps its state.\n//   Earlier files you can use: sr
