c/didact/render.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as reconcile from '../src/didact/reconcile.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 08: Reorder keyed children\n// Problem: problems/08-reorder.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 08 as `python -P tools/run_js.py\n//   solutions 08 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 08` (`./check.sh 08` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/didact/reconcile.js, which you started earlier: Let a key keep matching\n//   its old child when the shared keys come in a different order.\n//   It adds to src/didact/commit.js, which you started earlier: Move the DOM node of a\n//   reordered child instead of recreating it; a node that lives on keeps its state.\n//   Earlier files you can use: src/didact/render.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as reconcile from '../src/didact/reconcile.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"},{"path":"solutions/src/didact/reconcile.js","role":"adds","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render.","job":"Let a key keep matching its old child when the shared keys come in a different order.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Decides which fibers a parent's children become. At first that means a fresh fiber for\n//   every child, then a comparison with the previous render. Later, assignments 06, 07 and\n//   08 add to this file.\n//\n// Your job:\n//   Give every element a fiber of its own in `reconcileChildren(wipFiber, elements)`, and\n//   link the fibers with `child`, `sibling` and `parent`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/commit.js","role":"adds","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing.","job":"Move the DOM node of a reordered child instead of recreating it; a node that lives on keeps its state.","blank":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Applies a finished fiber tree to the DOM in a single pass, which keeps half a render\n//   from ever showing. Later, assignments 06, 08, 09 and 11 add to this file.\n//\n// Your job:\n//   Define `commitRoot` and `commitWork`. Once the last unit is done, they append the\n//   finished tree to the container in a single pass.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"05"}],"buildsOn":[{"path":"solutions/src/didact/render.js","owner":"04","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-maps-sets\"><code>Map<\/code> and <code>Set<\/code><\/a>","<a href=\"#primer/js-arrays\">array methods<\/a>"],"text":["Map and Set","array methods"]},{"label":"Library","items":["<a href=\"#primer/dom-tree-editing\"><code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code><\/a>","<a href=\"#primer/dom-form-inputs\">inputs: <code>value<\/code> and the <code>input<\/code> event<\/a>"],"text":["appendChild, insertBefore, removeChild","inputs: value and the input event"]},{"label":"Concepts","items":["<a href=\"#primer/react-moving-nodes\">reordering without recreating<\/a>","<a href=\"#primer/react-keys\">keys<\/a>","<a href=\"#primer/react-fibers\">fibers<\/a>"],"text":["reordering without recreating","keys","fibers"]}],"body":"<div class=\"d-problem flow\"><p>Let a keyed list change order. A scenario renders a list, then a permutation of it, often with items added and dropped in the same step. It types into inputs here and there and dumps the page. Each dump is compared with React's, and the checker counts the nodes your program built and removed.<\/p>\n<h3>Input<\/h3>\n<p>Each scenario goes through <code>node assignments/assignment_08_reorder.js &lt;input-file&gt; &lt;output-file&gt;<\/code>. From a blank start that program is yours to write, in three steps: load <code>../harness/env.js<\/code> before anything else, import the default <code>Didact<\/code> export of <code>src/didact/index.js<\/code>, and <code>await<\/code> the harness function <code>runScenarioFile<\/code> (from <code>../harness/scenario.js<\/code>) with the two file names from <code>process.argv<\/code> and <code>Didact<\/code>. The Boilerplate comes with it done. These are the scenario lines this assignment relies on.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Remembers a one-root tree under a name. <code>key=&quot;a&quot;<\/code> is a string attribute and arrives as <code>props.key<\/code>.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Calls <code>Didact.render(tree, container)<\/code> and returns. Nothing is drawn yet.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs idle periods until the loop has nothing left. A <code>render<\/code> is always followed by a <code>flush<\/code>.<\/td><\/tr><tr><td><code>type #&lt;id&gt; &lt;text&gt;<\/code><\/td><td>Writes the rest of the line into the <code>value<\/code> of the element with that id, fires a bubbling <code>input<\/code> event and flushes.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the container, as described next.<\/td><\/tr><tr><td><code>ops create remove<\/code><\/td><td>Prints the harness DOM's counters of <code>create<\/code> and <code>remove<\/code> since the last <code>ops<\/code> line or since the start.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Inputs carry an id and no <code>value<\/code> attribute. Sibling keys are unique, though one tree may use the same key in two different lists. The keys of a later render can come in any order.<\/p>\n<h3>Output<\/h3>\n<pre><code>dump &lt;n&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p>A dump prints the container's content from the top: one <code>node<\/code> line per element, one <code>text<\/code> line per run of text, a parent before its children, and the container itself left out. The props field lists <code>className<\/code>, <code>id<\/code>, <code>title<\/code> and (on inputs) <code>value<\/code> when they are off their defaults, sorted by name, with spaces, quotes and <code>%<\/code> percent-encoded.<\/p>\n<p>A label is a node's identity across dumps. The first time a dump shows an element it takes the next unused name from <code>a<\/code>, <code>b<\/code>, ... <code>z<\/code>, <code>aa<\/code>, ..., and it keeps that name for the rest of the scenario. Equal labels in two dumps are one DOM node. A node moved to another place keeps its label, which is how the tests tell a move from a rebuild. Lines come in page order.<\/p>\n<p><code>ops &lt;creates&gt; &lt;removes&gt;<\/code> counts calls: <code>createElement<\/code> plus <code>createTextNode<\/code> for the first number, <code>removeChild<\/code> for the second. A move is neither, and the line leaves the move counter out.<\/p>\n<h3>What has to be true after a render<\/h3>\n<ul><li>Every new child with a key continues the old child with the same key and the same type, wherever the old child stood. The old node is kept. A key is <code>String(props.key)<\/code> as in 07, and a missing, <code>null<\/code> or <code>undefined<\/code> key means no key.<\/li><li>The children of every parent end up in the new list's order, a new child at its own place.<\/li><li>A kept child gets its new props and text, whether or not its node moved. Its own children are matched by the same rules.<\/li><li>A new child whose key no old child has, or whose key has an old child of another type, gets a new node. Old children that no new child continues are removed, one <code>removeChild<\/code> each for the child's own node.<\/li><li>Children without a key are matched by position, as in 06. Swapping their texts changes the texts in the same nodes and never moves a node. The tests do not mix keyed and unkeyed children in one list.<\/li><li>Keys are exact strings: <code>&quot;&quot;<\/code>, <code>&quot;0&quot;<\/code>, <code>&quot;1&quot;<\/code> and <code>&quot;01&quot;<\/code> are four keys, and none of them is \"no key\".<\/li><li>Which nodes you move, and how many, is up to you. Any set of moves that ends in the right order without building anything new passes, so a permutation of the same keys costs <code>ops 0 0<\/code>.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test is filed under one requirement, and the report tallies the passes for each.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The same keys in a new order (swap, reverse, rotate) put the nodes in that order, and every node is a kept one.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A reorder in the same render as new and removed keys: the kept children keep their nodes in the new order, new ones are built, missing ones are removed.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>An input keeps what was typed into it when its item moves, and typing into it afterwards still reaches it.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A child that moves still receives its new props and text, including the removal of a prop.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>ops create remove<\/code> is <code>0 0<\/code> for a pure reorder, and counts only the new children's nodes and the removed children otherwise.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Lists inside items reorder on their own, and an item that moves takes its nested nodes along.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>The keys <code>&quot;&quot;<\/code>, <code>&quot;0&quot;<\/code>, <code>&quot;1&quot;<\/code> and <code>&quot;01&quot;<\/code> move like any other key.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>Children without a key are matched by position, even when their texts come in another order.<\/span><\/li><li><span class=\"rid\">R9<\/span><span>Long runs of reorders, insertions and removals.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Whole sessions on sortable rows and on a list between other elements.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>No scenario goes past 74 lines, 11 renders or 10 children in a list. The 42 tests hold cases for each requirement, two longer sessions and seven seeded random runs: shuffles with inserts and removals, some with inputs and typing in between. A fresh seed gives seven new ones. Each case has a limit of 10 seconds, and a correct program needs a small fraction of that.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/reconcile.js","text":"// ---- Assignment 06: compare with the previous tree ----\nimport { state } from './state.js';\n\nfunction link(wipFiber, fibers) {\n  wipFiber.child = fibers[0] ?? null;\n  fibers.forEach((fiber, index) => {\n    fiber.sibling = fibers[index + 1] ?? null;\n  });\n}\n\n// The fiber for an element, given the old fiber it is compared with. The same type keeps the old\n// DOM node (UPDATE). Otherwise the element gets a node of its own (PLACEMENT) and the old fiber goes.\nfunction makeFiber(parent, element, oldFiber) {\n  if (oldFiber?.type === element.type) {\n    return {\n      type: oldFiber.type,\n      props: element.props,\n      dom: oldFiber.dom,\n      parent,\n      alternate: oldFiber,\n      effectTag: 'UPDATE',\n    };\n  }\n  if (oldFiber) deleteFiber(oldFiber);\n  return { type: element.type, props: element.props, dom: null, parent, alternate: null, effectTag: 'PLACEMENT' };\n}\n\n// The old fiber is only put on a list: the tree on screen is never changed by a render that may\n// still be thrown away.\nfunction deleteFiber(oldFiber) {\n  state.deletions.push(oldFiber);\n}\n\n// ---- Assignment 08: match keys anywhere, move what is out of order ----\nexport function reconcileChildren(wipFiber, elements) {\n  const oldFibers = new Map();\n  for (let fiber = wipFiber.alternate?.child; fiber; fiber = fiber.sibling) {\n    oldFibers.set(slotOf(fiber.props.key, fiber.index), fiber);\n  }\n\n  // The old position of the kept child that stood furthest along in the old order so far.\n  let lastKeptIndex = 0;\n  const fibers = elements.map((element, index) => {\n    const slot = slotOf(element.props.key, index);\n    const fiber = makeFiber(wipFiber, element, oldFibers.get(slot));\n    oldFibers.delete(slot);\n    fiber.index = index;\n    if (fiber.alternate) {\n      // A kept child that stood before one already kept has been passed by it: its node has to move.\n      if (fiber.alternate.index < lastKeptIndex) fiber.effectTag = 'PLACEMENT';\n      else lastKeptIndex = fiber.alternate.index;\n    }\n    return fiber;\n  });\n  // Whatever no new child took over.\n  oldFibers.forEach((oldFiber) => deleteFiber(oldFiber));\n  link(wipFiber, fibers);\n}\n\n// How an old child is found again: by its key, or by its position if it has none.\nconst slotOf = (key, index) => (key == null ? index : String(key));\n"},{"path":"src/didact/commit.js","text":"// ---- Assignment 05: commit the finished tree in one pass ----\n// The render phase builds fibers and DOM nodes but leaves the page alone; this applies the result.\nimport { state } from './state.js';\n\n// ---- Assignment 06: update props of kept nodes ----\nimport { updateDom } from './dom.js';\n\n// ---- Assignment 06: remove, place and update ----\nexport function commitRoot() {\n  state.deletions.forEach(commitDeletion);\n  commitWork(state.wipRoot);\n  state.currentRoot = state.wipRoot;\n  state.wipRoot = null;\n}\n\n// ---- Assignment 08: move kept nodes ----\nfunction commitWork(fiber) {\n  // A new node is inserted. A kept node that has to move goes through the same call, and\n  // still gets its props updated below.\n  if (fiber.effectTag === 'PLACEMENT') fiber.parent.dom.insertBefore(fiber.dom, nextStableDom(fiber));\n  if (fiber.alternate) updateDom(fiber.dom, fiber.alternate.props, fiber.props);\n  if (fiber.alternate) fiber.alternate.alternate = null;\n  for (let child = fiber.child; child; child = child.sibling) commitWork(child);\n}\n\n// ---- Assignment 06: remove a deleted node ----\n// Each deleted fiber is on the list once, and only its own node is removed: its children went\n// with it.\nfunction commitDeletion(fiber) {\n  fiber.parent.dom.removeChild(fiber.dom);\n}\n\n// ---- Assignment 06: where a placed node goes ----\n// A placed node goes in front of the first later sibling that is not being placed itself, because\n// that one already stands where it belongs. With none, it goes last.\nfunction nextStableDom(fiber) {\n  for (let sibling = fiber.sibling; sibling; sibling = sibling.sibling) {\n    if (sibling.effectTag !== 'PLACEMENT') return sibling.dom;\n  }\n  return null;\n}\n"},{"path":"assignments/assignment_08_reorder.js","text":"// Assignment 08: the checker runs this program as `node assignments/assignment_08_reorder.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/index.js","src/didact/createElement.js","src/didact/render.js","src/didact/dom.js","src/didact/state.js"],"proof":{"passed":42,"total":42,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>Neither post has this step. Jongeneel's article states that its key matching cannot reorder: a key that shows up in a different order is removed and built again, and a stateful component loses its state with it. Pombo's <a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Step VI<\/a> has an aside saying React detects children that change places, and his <a href=\"https://pomb.us/build-your-own-react/#epilogue\" target=\"_blank\" rel=\"noopener\">epilogue<\/a> lists reconciliation by key among the features you can add. This assignment follows React instead, and the workbook, not a post, is its author. The page holds all you need, and <a href=\"https://react.dev/learn/rendering-lists\" target=\"_blank\" rel=\"noopener\">Rendering lists<\/a> on react.dev shows the same behaviour from the user's side. If you read Jongeneel's <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.2%20Creating%20the%20diff%20for%20the%20children\" target=\"_blank\" rel=\"noopener\">section 3.2, Creating the diff for the children<\/a> first, the last figure of the section shows keys in a new order, which is the case here. The post builds its B again. Here B keeps its node.<\/p>","readTitle":"Read in the blog first","context":"<p>07 finds an old child by key only while the shared keys keep their order. Now any order goes. <code>reconcile.js<\/code> has to find a partner anywhere in the old list and notice which kept children ended up out of order. <code>commit.js<\/code> then puts those nodes where they now belong without building new ones.<\/p>","sources":"<ul><li>React documentation: <a href=\"https://react.dev/learn/rendering-lists\" target=\"_blank\" rel=\"noopener\">Rendering lists<\/a>, <a href=\"https://react.dev/learn/preserving-and-resetting-state\" target=\"_blank\" rel=\"noopener\">Preserving and resetting state<\/a><\/li><li>Wim Jongeneel, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.2%20Creating%20the%20diff%20for%20the%20children\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>, section 3.2 on the diff for the children, for the case it leaves out<\/li><li>MDN, <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/insertBefore\" target=\"_blank\" rel=\"noopener\"><code>Node.insertBefore<\/code><\/a>, which says what happens to a node that is already in the document<\/li><\/ul>","checking":"<pre><code>.\\check 08                          every test, grouped by requirement\n.\\check 08 -Case 08-R4-moved-props-change   one test with its input, the expected dumps and yours\n.\\check 08 -Fresh                   seven new random sessions, to try your code on scenarios you haven&#x27;t seen\n.\\check 08 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>A reconciler that answers an out-of-place key by removing the old node and building a new one, which is what Jongeneel's does, fails like this:<\/p>\n<pre><code>  R1  Rendering the same keys in a new order puts the nodes in that ord... .    0 / 7   FAILED\n      x 08-R1-swap-first-two  [a, b, c] becomes [b, a, c]\n          node[0]: expected (depth=1, label=b, tag=li, props=&quot;&quot;), got (depth=1, label=e, tag=li, props=&quot;&quot;) - differs in label  (in `dump 2`)\n          likely cause: R1 - Rendering the same keys in a new order puts the nodes in that order and keeps every one of them\n          expected values from: React 19.3.1 on jsdom 30.1.3 (tools/oracle); ops lines from a model of the matching rules in tools/gen_p07.py\n          reproduce: py -P tools/run_js.py build/bugs/08/reorder-as-remove-and-insert 08 build/cases/08/08-R1-swap-first-two.in build/cases/08/08-R1-swap-first-two.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>In 07 you walked the old list in step with the new one. A reorder breaks that, because the partner of the next new child can lie before the old child you are looking at. Replace the walk with a lookup that doesn't care where the old child stood. Then there is the second job, getting the nodes into the new order. Treat it as a problem of its own.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Put the old children in a table by key. Go through the new elements in order and take each partner out of the table: same key and same type means a kept fiber that carries the old node, anything else means a new node. Whatever is left in the table is removed.<\/p>\n<p>For the order, give every fiber its position in its list. Compare each kept child's old position with the highest old position among the kept children before it in the new list. If it is lower, a later child has passed it and its node has to move. If it is higher, the child stays. It becomes the new highest. The children that stay form an increasing run of old positions. Moving as few nodes as possible would mean keeping a longest such run in place; this rule keeps a run that is not always the longest, and the tests accept that.<\/p>\n<p>In the commit, a moved node and a new node go through the same insertion: put it in front of the first later sibling that already stands in the right place, or at the end. Insertion of a node that has a parent moves it. Moved nodes still get their props updated.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A moved fiber is a kept one. Give it the old node and the old fiber as its alternate, and tag it for placement as well.<\/li><li>A new node and a moved node both go before the first later sibling that is already settled. A sibling that is new or moving itself is not settled yet, and it may not be in the page at all.<\/li><li>Update a moved node's props too. The commit step for placement must not replace the update.<\/li><li>Removed children are the ones left in the table. Do not remove a child that you matched and moved.<\/li><li>Children without a key have nothing to look up, so match them by position. Reverse <code>&lt;li&gt;A&lt;/li&gt;&lt;li&gt;B&lt;/li&gt;&lt;li&gt;C&lt;/li&gt;<\/code> and the result is three text updates, not a remove and an insert.<\/li><li>The key <code>&quot;&quot;<\/code> is falsy and <code>&quot;0&quot;<\/code> is not. Test whether a child has a key with <code>== null<\/code>, not with <code>if (key)<\/code>.<\/li><li>Each fiber's old position has to survive from one render to the next, so store it on the fiber when you make it.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>reconcileChildren(wipFiber, elements):\n    table = map from slot to old fiber, for each old child\n            (slot = key, or position when the child has no key)\n    highest = 0\n    for each element, at position i:\n        slot = key, or i if it has no key\n        partner = table.get(slot); table.delete(slot)\n        fiber = update fiber (old dom, alternate = partner)   if partner has the same type\n                placement fiber (new dom)                       otherwise; if partner exists, queue it for removal\n        fiber.index = i\n        if fiber has a partner:\n            if partner.index &lt; highest: tag fiber for moving\n            else: highest = partner.index\n        add fiber to the new list\n    queue every old fiber still in the table for removal\n    link the new list\n\ncommitWork(fiber):\n    if fiber is tagged for placement or moving:\n        insert fiber.dom before the first later sibling that is not tagged\n    if fiber has an alternate: updateDom(fiber.dom, alternate.props, props)\n    commit the children<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a shuffle with one new and one dropped item","test":"08-R2-shuffle-insert-remove","input":"tree t1 <ul><li key=\"a\">item a<\/li><li key=\"b\">item b<\/li><li key=\"c\">item c<\/li><li key=\"d\">item d<\/li><\/ul>\nrender t1\nflush\ndump\nops create remove\ntree t2 <ul><li key=\"d\">item d<\/li><li key=\"x\">item x<\/li><li key=\"a\">item a<\/li><li key=\"c\">item c<\/li><\/ul>\nrender t2\nflush\ndump\nops create remove","output":"dump 1\nnode 0 a ul \"\"\nnode 1 b li \"\"\ntext 2 \"item a\"\nnode 1 c li \"\"\ntext 2 \"item b\"\nnode 1 d li \"\"\ntext 2 \"item c\"\nnode 1 e li \"\"\ntext 2 \"item d\"\nops 9 0\ndump 2\nnode 0 a ul \"\"\nnode 1 e li \"\"\ntext 2 \"item d\"\nnode 1 f li \"\"\ntext 2 \"item x\"\nnode 1 b li \"\"\ntext 2 \"item a\"\nnode 1 d li \"\"\ntext 2 \"item c\"\nops 2 1","image":null,"explain":"<p>Item <code>d<\/code> went from last to first, and <code>a<\/code> and <code>c<\/code> stayed behind it in their old order. In the second dump the labels <code>e<\/code>, <code>b<\/code> and <code>d<\/code> are the old <code>li<\/code>s of <code>d<\/code>, <code>a<\/code> and <code>c<\/code>. Item <code>x<\/code> is <code>f<\/code>, a new node. The node of item <code>b<\/code> is gone. The counters: one new <code>li<\/code> with its text is two creates, one dropped <code>li<\/code> is one remove. The three reordered items cost nothing.<\/p>"},{"label":"Example 2","name":"two inputs trade places","test":"08-R3-bare-inputs-swap","input":"tree t1 <div><input key=\"a\" id=\"ia\"/><input key=\"b\" id=\"ib\"/><\/div>\nrender t1\nflush\ndump\nops create remove\ntype #ia left\ntype #ib right\ndump\ntree t2 <div><input key=\"b\" id=\"ib\"/><input key=\"a\" id=\"ia\"/><\/div>\nrender t2\nflush\ndump\nops create remove\ntype #ib right!\ndump","output":"dump 1\nnode 0 a div \"\"\nnode 1 b input \"id=ia\"\nnode 1 c input \"id=ib\"\nops 3 0\ndump 2\nnode 0 a div \"\"\nnode 1 b input \"id=ia value=left\"\nnode 1 c input \"id=ib value=right\"\ndump 3\nnode 0 a div \"\"\nnode 1 c input \"id=ib value=right\"\nnode 1 b input \"id=ia value=left\"\nops 0 0\ndump 4\nnode 0 a div \"\"\nnode 1 c input \"id=ib value=right!\"\nnode 1 b input \"id=ia value=left\"","image":null,"explain":"<p>Typed text lives on the nodes and nowhere in your library, so it travels with the node. <code>c<\/code> comes first in dump 3 and still reads <code>right<\/code>. The last <code>type<\/code> looks <code>ib<\/code> up in the page and writes to whichever node is first now. A library that built two new inputs would show the labels <code>d<\/code> and <code>e<\/code> in dump 3, both empty.<\/p>"},{"label":"Example 3","name":"moved nodes still get their new props","test":"08-R4-moved-props-change","input":"tree t1 <ul><li key=\"a\" className=\"x\" title=\"t\">A<\/li><li key=\"b\" id=\"bb\">B<\/li><li key=\"c\">C<\/li><\/ul>\nrender t1\nflush\ndump\nops create remove\ntree t2 <ul><li key=\"c\" className=\"new\">C<\/li><li key=\"b\" title=\"now\">B<\/li><li key=\"a\" className=\"y\">A<\/li><\/ul>\nrender t2\nflush\ndump\nops create remove","output":"dump 1\nnode 0 a ul \"\"\nnode 1 b li \"className=x title=t\"\ntext 2 \"A\"\nnode 1 c li \"id=bb\"\ntext 2 \"B\"\nnode 1 d li \"\"\ntext 2 \"C\"\nops 7 0\ndump 2\nnode 0 a ul \"\"\nnode 1 d li \"className=new\"\ntext 2 \"C\"\nnode 1 c li \"title=now\"\ntext 2 \"B\"\nnode 1 b li \"className=y\"\ntext 2 \"A\"\nops 0 0","image":null,"explain":"<p>Whether a node moved or stayed, its props changed too. <code>a<\/code> swaps <code>className=x title=t<\/code> for <code>className=y<\/code>, <code>b<\/code> loses its id and gains a title, <code>c<\/code> gains a class. A program that treats \"moved\" as the whole story for a node and skips the prop comparison prints the old props here.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.2%20Creating%20the%20diff%20for%20the%20children\" target=\"_blank\" rel=\"noopener\">Jongeneel's <code>childsDiff<\/code><\/a> has no operation for moving a node. Its vocabulary is update, replace, skip, remove and insert. A key that the new list reaches before the old list does is inserted as a brand new node, and its old node is removed when the walk gets there. His second figure, <code>A, B, C<\/code> to <code>B, A, C<\/code>, becomes insert B, update A, remove B, update C: one node built and one thrown away, and a stateful component in it would start over. The article calls this a simplified implementation and says reordering is not supported. Replayed by his <code>applyChildrenDiff<\/code>, the list also hits the front-insert problem described in 07, and the page ends up reading <code>A, B, B<\/code>. Here the same keys cost no node at all (R1, R5). Typed text survives (R3). His loop <code>while (nextUpdateKey)<\/code> also stops on a falsy key, which R7 asks about again with moves involved.<\/p>\n<p><a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Pombo's <code>reconcileChildren<\/code><\/a> compares by position and ignores <code>key<\/code>, although an aside in the post says React also uses keys, which lets it detect children that change places. Position matching is still the rule for children without a key. R8 tests that. Reverse a list that has no keys and the nodes stay put while their texts change.<\/p>\n<p>React keeps every key that is in both lists as the same node and moves only some of them: it remembers the highest old index among the children matched so far and moves a child whose old index is lower, which is the rule in Hint 2. The tests don't count moves, so a program that moves every kept child in turn passes as well. In <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a>, the row on keys says that reordering moves DOM nodes, which is what this assignment asks of you.<\/p>"},"need":{"new":[{"id":"react-moving-nodes","title":"Reordering without recreating","note":"how a node changes places without being thrown away, and why its typed text comes along.","group":"React and the ideas in the posts","from":"08"}],"earlier":[{"id":"dom-tree-editing","title":"<code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code>","note":"a new use for it. Inserting a node that already has a parent moves it.","group":"The DOM","from":"03"},{"id":"react-keys","title":"Keys","note":"used in a new way. A key now finds its child wherever it stood.","group":"React and the ideas in the posts","from":"07"},{"id":"js-maps-sets","title":"<code>Map<\/code> and <code>Set<\/code>","note":"a different use this time. With the keys out of order, walking the old list beside the new one stops working. A table from key to old fiber doesn't care about order.","group":"JavaScript","from":"07"},{"id":"dom-form-inputs","title":"Inputs: <code>value<\/code> and the <code>input<\/code> event","note":"put to new use. The tests type before a reorder and read the text afterwards.","group":"The DOM","from":"07"},{"id":"js-arrays","title":"Array methods: map, filter, forEach, find, includes, slice","note":"","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"},{"id":"react-fibers","title":"Fibers","note":"","from":"04"}]}},{"id":"09","num":"9","title":"Function components","difficulty":"Medium","tests":45,"problem":"problems/09-function-components.md","entry":"solutions/assignments/assignment_09_function_components.js","files":[{"path":"solutions/assignments/assignment_09_function_components.js","role":"entry","purpose":null,"job":"Use `runScenarioFile` with your `Didact` object to render trees that contain the catalog's function components.","blank":"// ======================================================================================\n// Assignment 09: Function components\n// Problem: problems/09-function-components.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 09 as `python -P tools/run_js.py\n//   solutions 09 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 09` (`./check.sh 09` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Use `runScenarioFile` with your `Didact` object to render trees that contain the\n//   catalog's function components.\n//\n// The other files of this assignment:\n//   It adds to src/didact/render.js, which you started earlier: Teach `performUnitOfWork`\n//   about fibers whose type is a function: they have no DOM node, and their children are\n//   whatever calling the function returns.\n//   It adds to src/didact/commit.js, which you started earlier: Teach `commitWork` and the\n//   removal code about fibers that have no DOM node. The DOM parent to append into, and\n//   the DOM node to remove, can each be more than one fiber away.\n//   Earlier files you can use: src/didact/reconcile.js and src/didact/createElement.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { render } from '../src/didact/render.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 09: Function components\n// Problem: problems/09-function-components.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 09 as `python -P tools/run_js.py\n//   solutions 09 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 09` (`./check.sh 09` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/didact/render.js, which you started earlier: Teach `performUnitOfWork`\n//   about fibers whose type is a function: they have no DOM node, and their children are\n//   whatever calling the function returns.\n//   It adds to src/didact/commit.js, which you started earlier: Teach `commitWork` and the\n//   removal code about fibers that have no DOM node. The DOM parent to append into, and\n//   the DOM node to remove, can each be more than one fiber away.\n//   Earlier files you can use: src/didact/reconcile.js and src/didact/createElement.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { render } from '../src/didact/render.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"},{"path":"solutions/src/didact/render.js","role":"adds","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units.","job":"Teach `performUnitOfWork` about fibers whose type is a function: they have no DOM node, and their children are whatever calling the function returns.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   `render` and the work loop behind it: one fiber per unit of work, and the browser can\n//   interrupt between units. Later, assignments 05, 06, 09 and 10 add to this file.\n//\n// Your job:\n//   Build `render`, `workLoop` and `performUnitOfWork`. `render` only schedules the work;\n//   each idle period then runs fibers, one per unit of work, until `timeRemaining()` falls\n//   below 1.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/commit.js","role":"adds","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing.","job":"Teach `commitWork` and the removal code about fibers that have no DOM node. The DOM parent to append into, and the DOM node to remove, can each be more than one fiber away.","blank":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Applies a finished fiber tree to the DOM in a single pass, which keeps half a render\n//   from ever showing. Later, assignments 06, 08, 09 and 11 add to this file.\n//\n// Your job:\n//   Define `commitRoot` and `commitWork`. Once the last unit is done, they append the\n//   finished tree to the container in a single pass.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"05"}],"buildsOn":[{"path":"solutions/src/didact/reconcile.js","owner":"04","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render."},{"path":"solutions/src/didact/createElement.js","owner":"01","purpose":"What JSX compiles to: a plain `{ type, props }` object, with the children inside `props`."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-typeof\"><code>typeof<\/code> and the types you meet<\/a>"],"text":["typeof and the types you meet"]},{"label":"Library","items":["<a href=\"#primer/dom-tree-editing\"><code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code><\/a>","<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["appendChild, insertBefore, removeChild","the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/react-function-components\">function components<\/a>","<a href=\"#primer/react-elements\">elements and <code>props.children<\/code><\/a>","<a href=\"#primer/react-fibers\">fibers<\/a>","<a href=\"#primer/react-reconciliation\">reconciliation by type and position<\/a>"],"text":["function components","elements and props.children","fibers","reconciliation by type and position"]}],"body":"<div class=\"d-problem flow\"><p>Let a function be the <code>type<\/code> of an element. A scenario builds trees out of the catalog's components, renders and re-renders them, clicks a button now and then, and dumps the page. Your dumps and logs are compared with React's. In a few tests the sizes of your idle periods are compared with a formula.<\/p>\n<h3>Input<\/h3>\n<p>The entry program, <code>node assignments/assignment_09_function_components.js &lt;input-file&gt; &lt;output-file&gt;<\/code>, is the same few lines as in 06 to 08: import <code>../harness/env.js<\/code> first, then import <code>Didact<\/code> from <code>src/didact/index.js<\/code>, then await <code>runScenarioFile<\/code> from <code>../harness/scenario.js<\/code> with the input path, the output path and <code>Didact<\/code>. The Boilerplate has it written, and a blank start leaves it to you. Scenarios use these lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What happens<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Stores a tree under a name. A tag with a capital letter, as in <code>&lt;Frame title=News&gt;<\/code>, is a catalog component and gets its attributes as props, as strings.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Calls <code>Didact.render<\/code> with the tree and the container. Nothing runs yet.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs idle periods until the loop is idle. Outside the units tests, every <code>render<\/code> is followed by a <code>flush<\/code>.<\/td><\/tr><tr><td><code>idle &lt;k&gt;<\/code><\/td><td>Runs one idle period in which <code>timeRemaining()<\/code> allows <code>k<\/code> units, and prints <code>idle &lt;units run&gt;<\/code>.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>Fires a bubbling <code>click<\/code> on the element with that id, then flushes.<\/td><\/tr><tr><td><code>log<\/code><\/td><td>Prints one <code>log &lt;name&gt;<\/code> line per handler call since the previous <code>log<\/code> line.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the page.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Handlers are written <code>onClick=@name<\/code>, and calling one adds <code>name<\/code> to the log. <code>key=&quot;a&quot;<\/code> and <code>key=a<\/code> mean the same.<\/p>\n<h3>Output<\/h3>\n<p>A dump lists the nodes under the container, in document order, and leaves the container out.<\/p>\n<pre><code>dump &lt;n&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p><code>&lt;tag&gt;<\/code> is lower case. The props field shows <code>className<\/code>, <code>id<\/code>, <code>title<\/code> and (on inputs) <code>value<\/code> when they are off their defaults, sorted by name, with spaces, quotes and <code>%<\/code> percent-encoded. Neighbouring text nodes become one <code>text<\/code> line. Watch the <code>&lt;label&gt;<\/code>. Elements are named <code>a<\/code>, <code>b<\/code>, ... in the order dumps first show them, and a name sticks to its node. Same label in two dumps, same DOM node; a node your library threw away and built again comes back under a new one.<\/p>\n<p>While the first render is still waiting for idle periods, a dump shows an empty container. Nothing is committed before the last unit. An <code>idle<\/code> line prints how many units its period ran, and <code>idle 0<\/code> once nothing is left.<\/p>\n<h3>The components<\/h3>\n<p><code>harness/catalog.js<\/code> has more of them, but the ones that need <code>useState<\/code> or <code>useEffect<\/code> wait for 10 and 11. The tests use these four.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Component<\/th><th>Props<\/th><th>What it returns<\/th><\/tr><\/thead><tbody><tr><td><code>Greeting<\/code><\/td><td><code>name<\/code><\/td><td><code>&lt;h1&gt;<\/code> with the two text children <code>Hi <\/code> and the name, which a dump shows as the single line <code>Hi Ann<\/code><\/td><\/tr><tr><td><code>Frame<\/code><\/td><td><code>title<\/code> and children<\/td><td><code>&lt;section&gt;<\/code> that holds an <code>&lt;h2&gt;<\/code> with the title, followed by every child it was given<\/td><\/tr><tr><td><code>FnA<\/code><\/td><td>none<\/td><td><code>&lt;i&gt;a&lt;/i&gt;<\/code><\/td><\/tr><tr><td><code>FnB<\/code><\/td><td>none<\/td><td><code>&lt;b&gt;b&lt;/b&gt;<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Each returns a single element. <code>Frame<\/code> puts <code>props.children<\/code> into the new element's children as they are, whether elements, components or text.<\/p>\n<h3>What the library does with a component<\/h3>\n<ul><li>A function used as <code>type<\/code> is a component. Call it with the element's <code>props<\/code> (the <code>children<\/code> array included) and take the one element it returns as the single child of the component's fiber.<\/li><li>A component's fiber has no node, but it is still a unit of work. For the idle periods, the unit count of a tree is 1 for the container's root fiber, plus 1 for every element and every text node, plus 1 for every component.<\/li><li>A node's parent in the page is the node of the nearest ancestor fiber that has one. A component at the top of the tree has the container as its parent.<\/li><li>A component's own node is the first node below it, looking through any components it returns. That is the node to place, to move and to remove for the component.<\/li><li>Types are compared as before, and for components the type is the function. The same function at the same position (or with the same key) keeps the old nodes and gets the new props. Another function, or an element with a tag, replaces them in place.<\/li><li>A component that goes away takes its node out of the page, with everything below that node. Removal works the same whenever the component was mounted, including in the render right before.<\/li><li>Keys on components follow the rules of 07 and 08. The <code>key<\/code> stays in the <code>props<\/code> object the function receives, as it does for elements, and the catalog's components ignore it.<\/li><li>In the tests a component never returns <code>null<\/code>, <code>undefined<\/code> or an array.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>The report is grouped by requirement, and a test counts toward one only.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A function component's output is rendered, and the function receives its element's props.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Components nest, stand next to each other and can be the whole tree.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>props.children<\/code> carries the elements, text and components that were written inside a component, in order.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A component of the same type at the same position keeps its nodes and takes new props, text and handlers.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Another component, or a plain element, at that position replaces the component's nodes in place, also in front of another component.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>A component that disappears takes its nodes out of the page, and only those.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>A component mounted by one render can be removed or replaced by the very next render, and by a later one.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>Keyed components keep their nodes and typed values when others are inserted, removed or reordered.<\/span><\/li><li><span class=\"rid\">R9<\/span><span>A component is a unit of work of its own: it adds one to the count and has no node.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Whole sessions with several components, clicks and logs.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>At most 42 lines and 12 renders per scenario. Texts are short. Every <code>Greeting<\/code> gets a name. The 45 tests cover each requirement, two longer sessions and five seeded random runs (a fresh seed gives five new ones). Only the three units tests have <code>idle<\/code> lines. A case has a 10-second limit and needs a small fraction of it.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/render.js","text":"// ---- Assignment 04: the work loop ----\n// render() only schedules work. Whenever the browser is idle, workLoop() builds the tree of\n// fibers one unit of work at a time, so it can stop when the browser has something else to do.\nimport { createDom } from './dom.js';\nimport { reconcileChildren } from './reconcile.js';\nimport { state } from './state.js';\n\n// ---- Assignment 05: commit when the last unit is done ----\nimport { commitRoot } from './commit.js';\n\n// ---- Assignment 06: schedule the work against the tree on screen ----\nexport function render(element, container) {\n  state.deletions = [];\n  state.wipRoot = { dom: container, props: { children: [element] }, alternate: state.currentRoot };\n  state.nextUnitOfWork = state.wipRoot;\n}\n\n// ---- Assignment 05: commit in the same period as the last unit ----\nfunction workLoop(deadline) {\n  try {\n    let shouldYield = false;\n    while (state.nextUnitOfWork && !shouldYield) {\n      state.nextUnitOfWork = performUnitOfWork(state.nextUnitOfWork);\n      shouldYield = deadline.timeRemaining() < 1;\n    }\n    if (!state.nextUnitOfWork && state.wipRoot) commitRoot();\n  } finally {\n    requestIdleCallback(workLoop);\n  }\n}\n\n// ---- Assignment 09: function components ----\nfunction performUnitOfWork(fiber) {\n  if (typeof fiber.type === 'function') updateFunctionComponent(fiber);\n  else updateHostComponent(fiber);\n  return nextFiber(fiber);\n}\n\nfunction updateHostComponent(fiber) {\n  if (!fiber.dom) fiber.dom = createDom(fiber);\n  reconcileChildren(fiber, fiber.props.children);\n}\n\n// ---- Assignment 09: a component's children are what it returns ----\nfunction updateFunctionComponent(fiber) {\n  reconcileChildren(fiber, [fiber.type(fiber.props)]);\n}\n\n// ---- Assignment 04: which fiber is next ----\n// Depth first: the child, else the sibling, else the nearest ancestor's sibling.\nfunction nextFiber(fiber) {\n  if (fiber.child) return fiber.child;\n  for (let next = fiber; next; next = next.parent) {\n    if (next.sibling) return next.sibling;\n  }\n  return null;\n}\n\nrequestIdleCallback(workLoop);\n"},{"path":"src/didact/commit.js","text":"// ---- Assignment 05: commit the finished tree in one pass ----\n// The render phase builds fibers and DOM nodes but leaves the page alone; this applies the result.\nimport { state } from './state.js';\n\n// ---- Assignment 06: update props of kept nodes ----\nimport { updateDom } from './dom.js';\n\n// ---- Assignment 06: remove, place and update ----\nexport function commitRoot() {\n  state.deletions.forEach(commitDeletion);\n  commitWork(state.wipRoot);\n  state.currentRoot = state.wipRoot;\n  state.wipRoot = null;\n}\n\n// ---- Assignment 09: fibers without a DOM node ----\nfunction commitWork(fiber) {\n  if (fiber.effectTag === 'PLACEMENT') place(fiber);\n  if (fiber.dom && fiber.alternate) updateDom(fiber.dom, fiber.alternate.props, fiber.props);\n  if (fiber.alternate) fiber.alternate.alternate = null;\n  for (let child = fiber.child; child; child = child.sibling) commitWork(child);\n}\n\nfunction commitDeletion(fiber) {\n  parentDom(fiber).removeChild(domOf(fiber));\n}\n\n// A new function component and its first node are both tagged, so the second call finds the node\n// already where it belongs.\nfunction place(fiber) {\n  const parent = parentDom(fiber);\n  const dom = domOf(fiber);\n  const before = nextStableDom(fiber);\n  if (dom.parentNode !== parent || dom.nextSibling !== before) parent.insertBefore(dom, before);\n}\n\n// A function component has no node: its DOM parent is the nearest ancestor that has one ...\nfunction parentDom(fiber) {\n  let parent = fiber.parent;\n  while (!parent.dom) parent = parent.parent;\n  return parent.dom;\n}\n\n// ... and its own node is the first one under it.\nfunction domOf(fiber) {\n  while (!fiber.dom) fiber = fiber.child;\n  return fiber.dom;\n}\n\n// ---- Assignment 09: where a placed node goes ----\nfunction nextStableDom(fiber) {\n  // A function component without siblings of its own shares its DOM parent's children with the\n  // siblings of the component above it, so look there next.\n  for (let node = fiber; node.parent; node = node.parent) {\n    for (let sibling = node.sibling; sibling; sibling = sibling.sibling) {\n      const dom = stableDom(sibling);\n      if (dom) return dom;\n    }\n    if (node.parent.dom) return null;\n  }\n  return null;\n}\n\nfunction stableDom(fiber) {\n  if (fiber.effectTag === 'PLACEMENT') return null;\n  return fiber.dom ?? stableDom(fiber.child);\n}\n"},{"path":"assignments/assignment_09_function_components.js","text":"// Assignment 09: the checker runs this program as `node assignments/assignment_09_function_components.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/index.js","src/didact/createElement.js","src/didact/dom.js","src/didact/reconcile.js","src/didact/state.js"],"proof":{"passed":45,"total":45,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>You can do the assignment from this page alone. Pombo's <a href=\"https://pomb.us/build-your-own-react/#step-vii-function-components\" target=\"_blank\" rel=\"noopener\">Step VII: Function Components<\/a> is short and worth reading in full, up to the heading of Step VIII. Read his words and skip the code frames beside them. That code is the author's answer to this assignment.<\/p>","readTitle":"Read in the blog first","context":"<p>Up to here a fiber was a node, and its children were the elements written under it. A function component breaks both. <code>render.js<\/code> has to call the function, and <code>commit.js<\/code> has to cope with fibers that have no node. Hooks in 10 and 11 hang off component fibers, and the todo app in 12 is made of them.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-vii-function-components\" target=\"_blank\" rel=\"noopener\">Step VII: Function Components<\/a><\/li><li>React documentation: <a href=\"https://react.dev/learn/your-first-component\" target=\"_blank\" rel=\"noopener\">Your first component<\/a> and <a href=\"https://react.dev/learn/passing-props-to-a-component\" target=\"_blank\" rel=\"noopener\">Passing props to a component<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 09                          every test, grouped by requirement\n.\\check 09 -Case 09-R7-mount-then-remove   one test with its input, the expected dumps and yours\n.\\check 09 -Fresh                   five new random sessions, to try your code on scenarios you haven&#x27;t seen\n.\\check 09 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>Commit code that keeps walking a removed fiber's children, as the post's does, fails R7 like this:<\/p>\n<pre><code>  R7  A component mounted in one render can be removed or replaced by ... .    1 / 8   FAILED\n      x 09-R7-mount-then-remove  FnA is mounted and removed by the very next render\n          unexpected extra output at line 11: `node 1 c i &quot;&quot;`\n          likely cause: R7 - A component mounted in one render can be removed or replaced by the very next render, with or without a render in between\n          expected values from: React 19.3.1 on jsdom 30.1.3 (tools/oracle)\n          reproduce: py -P tools/run_js.py build/bugs/09/stale-deletion 09 build/cases/09/09-R7-mount-then-remove.in build/cases/09/09-R7-mount-then-remove.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Two places assume that a fiber has a node. One is the unit that creates it, the other the commit that appends, updates and removes it. In the first, a component needs the function called instead. In the second, <code>fiber.parent.dom<\/code> is null whenever the parent is a component, and <code>fiber.dom<\/code> is null for the component itself.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Split <code>performUnitOfWork<\/code> in two, the way Pombo does with <code>updateFunctionComponent<\/code> and <code>updateHostComponent<\/code>. One branch is for function components: it calls the function and passes its single result to <code>reconcileChildren<\/code>. The other is the branch you already have, which makes the node and reconciles the children from the props. The reconciler itself needs no change, since it only compares types.<\/p>\n<p>In the commit, write one helper that finds the DOM parent by climbing <code>parent<\/code> until a fiber has a <code>dom<\/code>, and one that finds a fiber's own node by descending <code>child<\/code> until a fiber has a <code>dom<\/code>. Use them for placing and for removing. The node a component is placed before is the first later sibling whose node, found by descending, is already in the page, and that search may have to go up through components.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Do not give a component fiber a DOM node, and do not call <code>updateDom<\/code> on it. Guard on <code>fiber.dom<\/code>.<\/li><li>A component's props include the children. The function gets the whole props object.<\/li><li>In the commit, a deleted fiber is only removed. If you go on to commit its children, they still carry the tags from the render that mounted them, so a component mounted by the render right before is put back into the page. A fiber that has been rendered once more is not affected, which is why this passes the easy tests.<\/li><li>A component and its siblings put their nodes into one DOM parent, the first ancestor fiber that has a node. Climb through components to find it, and descend through them to find a node.<\/li><li>When the node to insert before belongs to a sibling that is a component, take the first node below that component. The component has none of its own.<\/li><li><code>FnA<\/code> and <code>FnB<\/code> have the same shape and different types. Compare the function, not what it returns.<\/li><li>Mount one component with several siblings and give it a new type in the next render: the new node must land in the old node's place, not at the end of the parent.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>performUnitOfWork(fiber):\n    if fiber.type is a function:\n        children = [ fiber.type(fiber.props) ]\n    else:\n        if fiber has no dom: fiber.dom = createDom(fiber)\n        children = fiber.props.children\n    reconcileChildren(fiber, children)\n    return the next fiber (child, else sibling, else an ancestor&#x27;s sibling)\n\nparentDom(fiber):  climb fiber.parent until a fiber has dom; return that dom\nownDom(fiber):     descend fiber.child until a fiber has dom; return that dom\n\ncommit of a placement:  parentDom(fiber).insertBefore(ownDom(fiber), node in the page after fiber, or null)\ncommit of an update:    updateDom(fiber.dom, ...) only when fiber.dom exists\ncommit of a removal:    parentDom(fiber).removeChild(ownDom(fiber)); then stop, do not walk the fiber&#x27;s children<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a Frame with a component, an element and text inside","test":"09-R3-frame-mixed-children","input":"tree t1 <Frame title=Mix><Greeting name=A/><FnB/><em>e<\/em>tail<\/Frame>\nrender t1\nflush\ndump","output":"dump 1\nnode 0 a section \"\"\nnode 1 b h2 \"\"\ntext 2 \"Mix\"\nnode 1 c h1 \"\"\ntext 2 \"Hi A\"\nnode 1 d b \"\"\ntext 2 \"b\"\nnode 1 e em \"\"\ntext 2 \"e\"\ntext 1 \"tail\"","image":null,"explain":"<p>The tree is one component at the top. The container's first child is the <code>section<\/code> that <code>Frame<\/code> returned, and in it come the <code>h2<\/code>, then everything written inside <code>Frame<\/code>: the <code>h1<\/code> of the <code>Greeting<\/code>, the <code>b<\/code> of <code>FnB<\/code>, the <code>em<\/code>, and the text <code>tail<\/code>, a node of its own at depth 1. A component has no node, so none of the three shows in the dump.<\/p>"},{"label":"Example 2","name":"mounted, then removed by the next render","test":"09-R7-mount-then-remove","input":"tree t1 <div><p>a<\/p><FnA/><\/div>\nrender t1\nflush\ndump\ntree t2 <div><p>a<\/p><\/div>\nrender t2\nflush\ndump","output":"dump 1\nnode 0 a div \"\"\nnode 1 b p \"\"\ntext 2 \"a\"\nnode 1 c i \"\"\ntext 2 \"a\"\ndump 2\nnode 0 a div \"\"\nnode 1 b p \"\"\ntext 2 \"a\"","image":null,"explain":"<p>The second dump is what the test is about. The render that mounted <code>FnA<\/code> put the <code>i<\/code> in the page, and the very next render takes it out. If your commit keeps going into the removed fiber's children after taking the node out, the <code>i<\/code> goes back in, and the page holds a node that no tree describes.<\/p>"},{"label":"Example 3","name":"units of a component","test":"09-R9-units-greeting","input":"tree t1 <Greeting name=Ann/>\nrender t1\ndump\nidle 2\nidle 2\ndump\nidle 2\ndump\nidle 2","output":"dump 1\nidle 2\nidle 2\ndump 2\nidle 1\ndump 3\nnode 0 a h1 \"\"\ntext 1 \"Hi Ann\"\nidle 0","image":null,"explain":"<p>Count the units. The root fiber, the <code>Greeting<\/code>, its <code>h1<\/code> and two text nodes make five, spread as 2, 2 and 1 over three periods. The page stays empty for the first two, and the commit lands in the third. A program that skipped the unit for the component would count four, and the periods would read 2, 2, 0.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-vii-function-components\" target=\"_blank\" rel=\"noopener\">Pombo's Step VII<\/a> checks <code>fiber.type instanceof Function<\/code> in <code>performUnitOfWork<\/code> and calls <code>updateFunctionComponent<\/code> or <code>updateHostComponent<\/code>. The first calls <code>fiber.type(fiber.props)<\/code> and hands the result to <code>reconcileChildren<\/code> as a one-element list. The second creates the node and reconciles <code>props.children<\/code>. In <code>commitWork<\/code> a loop climbs <code>fiber.parent<\/code> until it finds a fiber with a <code>dom<\/code>, and <code>commitDeletion<\/code> descends <code>fiber.child<\/code> until it finds one. The workbook splits his single file: <code>performUnitOfWork<\/code> and the two update functions sit in <code>render.js<\/code>, the commit in <code>commit.js<\/code>. Hint 4 gives the climb and the descent helpers of their own, <code>parentDom<\/code> and <code>ownDom<\/code>, where his <code>commitWork<\/code> has the climb inline and <code>commitDeletion<\/code> takes the parent node as an argument.<\/p>\n<p>His deletion leaves a node behind when the component was mounted by the render right before. In the post's <code>commitWork<\/code> a deleted fiber is removed, and then its <code>child<\/code> and <code>sibling<\/code> are walked like those of any other fiber. The children of a component mounted one render ago still carry <code>PLACEMENT<\/code>, and their climb for a DOM parent now passes through the component to the live parent, so <code>appendChild<\/code> puts the node back. For a plain element the same walk only appends into a node that was detached a moment ago, which hides the problem. After one more render the tags read <code>UPDATE<\/code> and it is gone, and the post's own examples, <code>App<\/code> and <code>Counter<\/code>, never remove a component. Swapping <code>FnA<\/code> for <code>FnB<\/code> is hit the same way: the new node is appended at the end of the parent, where the old one stood in the middle. R7 asks for removal and replacement in the very next render, with and without a render in between.<\/p>\n<p>A component that returns <code>null<\/code> renders nothing in his code. Removing it later throws inside <code>commitDeletion<\/code>. The tests never return <code>null<\/code> from a component, so that case, like arrays and fragments, stays outside the workbook. The page for 10 says what that exception does to his work loop. <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> collects the other places where React 19 and the post differ.<\/p>"},"need":{"new":[{"id":"react-function-components","title":"Function components","note":"a function from props to the element to draw, and the two ways its fiber differs from an element's.","group":"React and the ideas in the posts","from":"09"}],"earlier":[{"id":"dom-tree-editing","title":"<code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code>","note":"a new way to use it. A component has no node, so finding the parent of a node, or the node to remove, means walking through fibers that have none.","group":"The DOM","from":"03"},{"id":"react-elements","title":"Elements and <code>props.children<\/code>","note":"used differently now. Whatever is written between a component's tags reaches the function as <code>props.children<\/code>, and the function decides where it goes.","group":"React and the ideas in the posts","from":"01"},{"id":"react-fibers","title":"Fibers","note":"in a new role. A fiber can now be a unit of work without being a DOM node.","group":"React and the ideas in the posts","from":"04"},{"id":"react-reconciliation","title":"Reconciliation by type and position","note":"applied to new things. The type of a component is the function itself. Two renders of <code>Greeting<\/code> agree, and <code>FnA<\/code> against <code>FnB<\/code> do not.","group":"React and the ideas in the posts","from":"06"},{"id":"react-keys","title":"Keys","note":"applied in a new place. A keyed component keeps its nodes through insertions, removals and reorders, the way a keyed element does.","group":"React and the ideas in the posts","from":"07"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"js-typeof","title":"<code>typeof<\/code> and the types you meet","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"}]}},{"id":"10","num":"10","title":"useState","difficulty":"Hard","tests":46,"problem":"problems/10-use-state.md","entry":"solutions/assignments/assignment_10_use_state.js","files":[{"path":"solutions/assignments/assignment_10_use_state.js","role":"entry","purpose":null,"job":"Your `Didact` object goes to `runScenarioFile`; the scenario clicks buttons in catalog components an nd in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   State and effects that belong to a component and outlive its re-renders, stored on the\n//   fiber: `useState` and `useEffect`. Later, assignment 11 adds to this file.\n//\n// Your job:\n//   Give function components memory with `useState(initial)`, keeping the state on the\n//   fiber and finding it again on the next render by hook index. The setter takes an\n//   updater function, queues it and schedules a new render from the root. The Boilerplate\n//   gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { state } from './state.js'; // state: wipFiber and hookIndex say whose hook this is; currentRoot is what to render again\n\nexport function useState(initial) {\n  // TODO: see \"What `useState` does\" and Requirements R1 to R9 on the page.\n  throw new Error('not implemented: useState');\n}\n"},{"path":"solutions/src/didact/state.js","role":"adds","purpose":"Shared bookkeeping in one object: what to work on next, and the tree under construction. It has to be an object, because an ES module can't share a variable for other modules to reassign.","job":"Add `wipFiber` and `hookIndex`. The first is the fiber of the component being rendered, the second the position of the next hook call.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Shared bookkeeping in one object: what to work on next, and the tree under\n//   construction. It has to be an object, because an ES module can't share a variable for\n//   other modules to reassign. Later, assignments 06 and 10 add to this file.\n//\n// Your job:\n//   Create one `state` object to hold the next unit of work and the root of the tree being\n//   built.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/render.js","role":"adds","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units.","job":"Before a function component is called, point `wipFiber` at its fiber, give that fiber an empty `hooks` array and reset `hookIndex`.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   `render` and the work loop behind it: one fiber per unit of work, and the browser can\n//   interrupt between units. Later, assignments 05, 06, 09 and 10 add to this file.\n//\n// Your job:\n//   Build `render`, `workLoop` and `performUnitOfWork`. `render` only schedules the work;\n//   each idle period then runs fibers, one per unit of work, until `timeRemaining()` falls\n//   below 1.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"},{"path":"solutions/src/didact/index.js","role":"adds","purpose":"What an app imports: one `Didact` object carrying `createElement` and `render`, with the hooks joining it as you write them.","job":"Expose `useState` on the `Didact` object.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   What an app imports: one `Didact` object carrying `createElement` and `render`, with\n//   the hooks joining it as you write them. Later, assignments 10 and 11 add to this file.\n//\n// Your job:\n//   Export a `Didact` object carrying `createElement` and `render`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"}],"buildsOn":[{"path":"solutions/src/didact/commit.js","owner":"05","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing."},{"path":"solutions/src/didact/reconcile.js","owner":"04","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-functions-closures\">arrow functions and closures<\/a>","<a href=\"#primer/js-global-state\">module-level state<\/a>","<a href=\"#primer/js-arrays\">array methods<\/a>"],"text":["arrow functions and closures","module-level state","array methods"]},{"label":"Library","items":["<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/react-state\">useState and the rules of hooks<\/a>","<a href=\"#primer/react-batching\">several updates, one render<\/a>","<a href=\"#primer/react-function-components\">function components<\/a>","<a href=\"#primer/react-reconciliation\">reconciliation by type and position<\/a>"],"text":["useState and the rules of hooks","several updates, one render","function components","reconciliation by type and position"]}],"body":"<div class=\"d-problem flow\"><p>Give <code>Didact<\/code> a <code>useState<\/code>. Scenarios build trees from the catalog's stateful components, click their buttons and dump the page. Your program prints the page at each dump, and the checker holds that against what React prints for the same scenario.<\/p>\n<h3>Input<\/h3>\n<p>Your entry program is started as <code>node assignments/assignment_10_use_state.js &lt;input-file&gt; &lt;output-file&gt;<\/code>. It does three things, in this order. It imports <code>../harness/env.js<\/code>, which has to come first because it puts <code>document<\/code> and a controllable <code>requestIdleCallback<\/code> in place before your library loads. It imports <code>Didact<\/code> from <code>../src/didact/index.js<\/code>. And it finishes with <code>await runScenarioFile(process.argv[2], process.argv[3], Didact)<\/code>, which reads the scenario, runs it on your library and writes the output file. The Boilerplate has all three. Starting blank, type them yourself. A scenario file is made of these lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Defines a tree of one root element. A capitalised tag such as <code>&lt;Counter id=a start=3/&gt;<\/code> is a catalog component, and attribute values are strings.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Calls <code>Didact.render(tree, container)<\/code> and runs none of the work.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs idle periods until the work loop is out of work.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>Dispatches a bubbling <code>click<\/code> on the element with that id, then flushes.<\/td><\/tr><tr><td><code>poke<\/code><\/td><td>Calls the setter that the first <code>Keeper<\/code> of the run handed out, with <code>n =&gt; n + 1<\/code>, then flushes.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the page, as described below.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>In every test a <code>render<\/code> is followed straight away by a <code>flush<\/code>, and the page is complete before the next line runs. <code>poke<\/code> is only used while the first <code>Keeper<\/code> is still on the page. What it does once that <code>Keeper<\/code> is gone is not tested.<\/p>\n<h3>Output<\/h3>\n<p>Each <code>dump<\/code> prints a header with its running number, then one line per element and per run of text in the container, parents first:<\/p>\n<pre><code>dump &lt;n&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p>The container itself is not printed, so its first child sits at depth 0. A <code>node<\/code> line gives the tag in lower case and the properties that differ from their defaults, sorted by name and separated by spaces: <code>className<\/code>, <code>id<\/code>, <code>title<\/code> and, for inputs, <code>value<\/code> (a value with a space, a double quote or a percent sign is percent-encoded). Neighbouring text nodes print as one <code>text<\/code> line, and a number child prints as its digits.<\/p>\n<p>Labels are what these tests are about. Each element is labelled the first time it appears in a dump, with the next unused letter (<code>a<\/code>, <code>b<\/code>, <code>c<\/code>, ... <code>z<\/code>, <code>aa<\/code>, ...) in document order, and it keeps that label from then on. Same label, same DOM node. If your library throws a node away and builds an identical one, the new node gets a new letter. That is how a test tells a node that was kept from one that was replaced.<\/p>\n<h3>The components the scenario
