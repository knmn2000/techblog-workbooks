/react-controlled-inputs\">controlled inputs<\/a>","<a href=\"#primer/react-keys\">keys<\/a>","<a href=\"#primer/react-state\">useState and the rules of hooks<\/a>","<a href=\"#primer/react-effects\">useEffect: after the DOM is updated<\/a>","<a href=\"#primer/react-function-components\">function components<\/a>"],"text":["controlled inputs","keys","useState and the rules of hooks","useEffect: after the DOM is updated","function components"]}],"body":"<div class=\"d-problem flow\"><p>Write a todo list as a function component on your own <code>Didact<\/code>. Scenarios render <code>&lt;TodoApp/&gt;<\/code>, type into its input, submit its form, click its buttons and dump the page. What your program prints is held against the output of the same app written in React.<\/p>\n<h3>Input<\/h3>\n<p><code>node assignments/assignment_12_todo_app.js &lt;input-file&gt; &lt;output-file&gt;<\/code> starts the entry program. It imports <code>../harness/env.js<\/code> first, then <code>Didact<\/code> from <code>../src/didact/index.js<\/code> and the named export <code>TodoApp<\/code> from <code>../src/app/TodoApp.js<\/code>. Its last line is <code>await runScenarioFile(process.argv[2], process.argv[3], { ...Didact, components: { TodoApp } })<\/code>, and the <code>components<\/code> entry is how <code>&lt;TodoApp/&gt;<\/code> in a scenario finds your function. The Boilerplate comes with the program written; starting blank, you write it. Scenario lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Names a tree. <code>tree t &lt;TodoApp/&gt;<\/code> is the usual one; the markup may also hold plain elements around it.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Schedules the render with <code>Didact.render(tree, container)<\/code>. None of the work runs yet.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs idle periods until nothing is left, effects included.<\/td><\/tr><tr><td><code>type #&lt;id&gt; &lt;text&gt;<\/code><\/td><td>Sets the element's <code>value<\/code> to the rest of the line, everything after the one space that follows the id, dispatches a bubbling <code>input<\/code> event, then flushes. <code>type #&lt;id&gt;<\/code> alone types the empty string.<\/td><\/tr><tr><td><code>submit #&lt;id&gt;<\/code><\/td><td>Dispatches a bubbling, cancelable <code>submit<\/code> event, then flushes.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>A bubbling <code>click<\/code> and a flush. A click on <code>#todo-add<\/code> that your handler does not cancel also submits the form, as in a browser.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the page.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p><code>dump<\/code> prints a header with a running number, the page below the container (one <code>node<\/code> line per element, one <code>text<\/code> line per run of text), and a <code>title<\/code> line when <code>document.title<\/code> is not empty:<\/p>\n<pre><code>dump &lt;n&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;\ntitle &quot;&lt;document.title&gt;&quot;<\/code><\/pre>\n<p>A <code>node<\/code> line has the tag in lower case and the props that differ from their defaults (<code>className<\/code>, <code>id<\/code>, and an input's <code>value<\/code>), sorted by name. In a prop, a value containing a space, a double quote or a percent sign is percent-encoded: <code>value=buy%20milk<\/code>. A <code>text<\/code> line encodes only <code>&quot;<\/code> and <code>%<\/code> (<code>%22<\/code>, <code>%25<\/code>), so spaces in a text stay as they are. Labels work as in the earlier dumps. A letter given to an element at its first appearance in a dump stays with it, which makes one letter one DOM node. The tests read that to tell which nodes your app keeps and which it rebuilds.<\/p>\n<h3>The page<\/h3>\n<p>The root of your app produces this tree, with one <code>li<\/code> for each item, the newest first:<\/p>\n<pre><code>&lt;div id=&quot;todo&quot;&gt;\n  &lt;form id=&quot;todo-form&quot;&gt;\n    &lt;input id=&quot;todo-input&quot; value={draft}/&gt;\n    &lt;button id=&quot;todo-add&quot;&gt;Add&lt;/button&gt;\n  &lt;/form&gt;\n  &lt;ul id=&quot;todo-list&quot;&gt;\n    &lt;li id=&quot;item-{id}&quot;&gt;\n      &lt;button id=&quot;toggle-{id}&quot;&gt;todo or done&lt;/button&gt;\n      &lt;span id=&quot;label-{id}&quot; className=&quot;done or empty&quot;&gt;{text}&lt;/span&gt;\n      &lt;button id=&quot;remove-{id}&quot;&gt;x&lt;/button&gt;\n    &lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;p id=&quot;todo-count&quot;&gt;{n} left&lt;/p&gt;\n&lt;/div&gt;<\/code><\/pre>\n<p><code>&lt;TodoApp/&gt;<\/code> takes no props. For an empty list the dump runs from the first <code>div<\/code> down to <code>text 2 &quot;0 left&quot;<\/code> and ends with <code>title &quot;0 left&quot;<\/code>.<\/p>\n<h3>The behaviour<\/h3>\n<p><code>TodoApp<\/code> is a function component without props, exported by name from <code>src/app/TodoApp.js<\/code> (<code>export function TodoApp<\/code>), and imports what it needs from <code>../didact/index.js<\/code>. The primer's examples rename <code>createElement<\/code> to <code>h<\/code> on import. That is a habit and nothing more. The app's state is the list of items, the draft in the input and the id the next item will get. Your <code>Didact<\/code>'s setters take an updater function, <code>setItems((current) =&gt; ...)<\/code>, and do not support a plain value: write <code>setDraft(() =&gt; value)<\/code>, never <code>setDraft(value)<\/code>. The rules:<\/p>\n<ul><li>The input is controlled: its <code>value<\/code> prop is the draft, and its <code>onInput<\/code> handler stores <code>event.target.value<\/code> as the new draft.<\/li><li><code>onSubmit<\/code> on the form calls <code>event.preventDefault()<\/code>. When the draft is empty once leading and trailing spaces are cut off, nothing else happens: no item, no id used, and the draft stays as typed. Otherwise a new item goes at the front of the list with the trimmed text, not done, and an id, and the draft is emptied. After an add the input shows the empty draft.<\/li><li>Ids count up from 1 in the order items are added. Once used, an id stays used, even after its item is removed.<\/li><li>The toggle button flips its item between <code>todo<\/code> and <code>done<\/code>. Its text shows the current one, and the label's <code>className<\/code> is <code>done<\/code> while the item is done and empty otherwise.<\/li><li>The remove button deletes its item and nothing else.<\/li><li>The count paragraph holds the text <code>&lt;n&gt; left<\/code>, in as many text nodes as you like, where <code>n<\/code> is the number of items that are not done.<\/li><li>After every step <code>document.title<\/code> reads <code>&lt;n&gt; left<\/code>. Set it from an effect with the dependency list <code>[n]<\/code>, where <code>n<\/code> is the count of items not done, so that it runs when the count changes. The tests see only the result, in the <code>title<\/code> line of the next dump.<\/li><li>Each <code>li<\/code> is keyed by its item's id. Adding, toggling, removing and typing all leave the other items' nodes where they are, along with the input, the form and the list.<\/li><\/ul>\n<p>Case files lose trailing spaces on every line, which rules out a scenario typing a draft of only spaces, or one ending in a space. The tests type an empty draft for the empty case, and one types a draft with three leading spaces and expects the item text without them. Trim before the emptiness test anyway.<\/p>\n<h3>The part the checker cannot see<\/h3>\n<p><code>src/main.js<\/code> renders <code>&lt;TodoApp/&gt;<\/code> into the <code>#root<\/code> element of <code>index.html<\/code>, as an entry program does for the tests but into a real page. The checker never runs it. To see the app, serve the project folder and open <code>index.html<\/code>, either with the book's Run button or with <code>python -m http.server 8000 --directory solutions<\/code> from the workbook folder, then browse to <code>http://localhost:8000/<\/code>. The server is needed because a browser refuses module imports from a file URL. Nothing in <code>main.js<\/code> is tested: a typo there passes the checker and leaves you a blank page.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Tests are grouped in the report by these ids. A failure may also name a likely cause, the requirement the first wrong line points at.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A fresh app renders the tree above with no items, the count <code>0 left<\/code> and the title <code>0 left<\/code>, also when it is a child of other elements.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>type<\/code> stores what was typed as the draft, and the input's <code>value<\/code> shows it (an empty draft shows no <code>value<\/code>).<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Submitting a draft that is not empty after trimming (through the form or the Add button) adds one item at the front: trimmed text, the next id, a <code>todo<\/code> button, and the input is cleared.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Submitting a draft that is empty adds nothing and uses no id.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>The toggle button flips its item between <code>todo<\/code> and <code>done<\/code>, with the class <code>done<\/code> on the label while it is done, and touches no other item.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>The remove button deletes its item and nothing else. Ids are never reused.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>The count paragraph reads <code>&lt;n&gt; left<\/code> where n is the number of items that are not done.<\/span><\/li><li><span class=\"rid\">R8<\/span><span><code>document.title<\/code> is <code>&lt;n&gt; left<\/code> after every step.<\/span><\/li><li><span class=\"rid\">R9<\/span><span>The nodes of items that stay are the same nodes after an add, a toggle or a remove, and typing keeps the input node.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Long sessions: scripted ones, and seeded random ones with valid operations only.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Expect 41 tests: the cases of each requirement, two scripted sessions (the long one has about 50 steps) and five seeded random ones, which <code>-Fresh<\/code> replaces. Sessions stay short: none has more than 78 scenario lines. Item texts are short, can hold spaces, double quotes and percent signs, and never end in a space. A correct app answers a test in a fraction of a second, and the limit is 10 seconds.<\/p><\/section>","solutionCode":{"files":[{"path":"src/app/TodoApp.js","text":"// Assignment 12: the todo list, written the way an application would write it on top of Didact.\nimport { createElement as h, useEffect, useState } from '../didact/index.js';\n\nexport function TodoApp() {\n  const [items, setItems] = useState([]);\n  const [draft, setDraft] = useState('');\n  const [nextId, setNextId] = useState(1);\n  const left = items.filter((item) => !item.done).length;\n\n  useEffect(() => {\n    document.title = `${left} left`;\n  }, [left]);\n\n  function addItem(event) {\n    event.preventDefault();\n    const text = draft.trim();\n    if (text === '') return;\n    // The newest item goes first, and an id is never used twice, even after removals.\n    setItems((current) => [{ id: nextId, text, done: false }, ...current]);\n    setNextId((id) => id + 1);\n    setDraft(() => '');\n  }\n\n  function typeDraft(event) {\n    const { value } = event.target;\n    setDraft(() => value);\n  }\n\n  const toggleItem = (id) =>\n    setItems((current) => current.map((item) => (item.id === id ? { ...item, done: !item.done } : item)));\n  const removeItem = (id) => setItems((current) => current.filter((item) => item.id !== id));\n\n  return h(\n    'div',\n    { id: 'todo' },\n    h(\n      'form',\n      { id: 'todo-form', onSubmit: addItem },\n      h('input', { id: 'todo-input', value: draft, onInput: typeDraft }),\n      h('button', { id: 'todo-add' }, 'Add'),\n    ),\n    h(\n      'ul',\n      { id: 'todo-list' },\n      ...items.map((item) => h(TodoItem, { key: item.id, item, onToggle: toggleItem, onRemove: removeItem })),\n    ),\n    h('p', { id: 'todo-count' }, left, ' left'),\n  );\n}\n\nfunction TodoItem({ item, onToggle, onRemove }) {\n  return h(\n    'li',\n    { id: `item-${item.id}` },\n    h('button', { id: `toggle-${item.id}`, onClick: () => onToggle(item.id) }, item.done ? 'done' : 'todo'),\n    h('span', { id: `label-${item.id}`, className: item.done ? 'done' : '' }, item.text),\n    h('button', { id: `remove-${item.id}`, onClick: () => onRemove(item.id) }, 'x'),\n  );\n}\n"},{"path":"src/main.js","text":"// Assignment 12: the finished program. index.html loads this file, which draws the todo app into #root.\nimport { createElement as h, render } from './didact/index.js';\nimport { TodoApp } from './app/TodoApp.js';\n\nrender(h(TodoApp, null), document.getElementById('root'));\n"},{"path":"assignments/assignment_12_todo_app.js","text":"// Assignment 12: the checker runs this program as `node assignments/assignment_12_todo_app.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { TodoApp } from '../src/app/TodoApp.js'; // TodoApp (assignment 12): the application under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { ...Didact, components: { TodoApp } });\n"}],"also":["src/didact/index.js","src/didact/createElement.js","src/didact/hooks.js","src/didact/render.js","src/didact/state.js","src/didact/dom.js","src/didact/reconcile.js","src/didact/commit.js"],"proof":{"passed":41,"total":41,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>Jongeneel's article builds a <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=6.%20Building%20a%20sample%20application\" target=\"_blank\" rel=\"noopener\">todo application<\/a> on his library in section 6, the one before the conclusion: a controlled form component and a list component that contains it. Read the first paragraph and stop before the listings. The app you write is another one. Items can be removed, there is a count and a page title, ids never repeat, new items go in front, and the components are functions with hooks rather than classes. His code sketches the idea. It is not a model to follow. Nothing below depends on having read it.<\/p>","readTitle":"Read in the blog first","context":"<p>After eleven assignments of library code, this is the first program that uses it: <code>TodoApp<\/code> imports <code>createElement<\/code>, <code>useState<\/code> and <code>useEffect<\/code> from your library the way an application imports them from React, and never sees a fiber or a commit. There is a second file, <code>src/main.js<\/code>. The checker cannot run it, because it needs a browser. More at the end.<\/p>","sources":"<ul><li>Wim Jongeneel, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=6.%20Building%20a%20sample%20application\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>, section 6, the sample application<\/li><li>React documentation: <a href=\"https://react.dev/learn/reacting-to-input-with-state\" target=\"_blank\" rel=\"noopener\">Reacting to input with state<\/a>, <a href=\"https://react.dev/learn/updating-arrays-in-state\" target=\"_blank\" rel=\"noopener\">Updating arrays in state<\/a> and the <a href=\"https://react.dev/reference/react-dom/components/input\" target=\"_blank\" rel=\"noopener\">input<\/a> component<\/li><\/ul>","checking":"<pre><code>.\\check 12                          every test, one line per requirement\n.\\check 12 -Case 12-R6-ids-never-reused    a single test: its scenario, the expected dump and yours\n.\\check 12 -Fresh                   five new random sessions\n.\\check 12 -Dispute &lt;id&gt; &quot;why&quot;      set a test aside when you are sure it is wrong<\/code><\/pre>\n<p>Forget to clear the input after an add and you get this:<\/p>\n<pre><code>  R3  Submitting a non-empty draft adds an item at the front of the lis... .    0 / 5   FAILED\n      x 12-R3-add-one-item  type buy milk and submit the form\n          node[0]: expected (depth=2, label=c, tag=input, props=&quot;id=todo-input&quot;), got (depth=2, label=c, tag=input, props=&quot;id=todo-input value=buy%20milk&quot;) - differs in props  (in `dump 1`)\n          likely cause: R3 - Submitting a non-empty draft adds an item at the front of the list: the trimmed text, the next id counting from 1, a todo button, and the input is cleared\n          expected values from: React 19.3.1 (react-dom 19.3.1) on jsdom 30.1.3 running tools/oracle/todoApp.mjs; every dump also checked against a model of the app in the generator\n          reproduce: py -P tools/run_js.py build/bugs/12/input-not-cleared 12 build/cases/12/12-R3-add-one-item.in build/cases/12/12-R3-add-one-item.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Start by listing what the page depends on. Items, draft and next id each change on their own schedule, and each gets its own <code>useState<\/code>. The count and the title are derived values and not state: compute them from the items on every render. Only the title needs an effect, being the one thing outside the tree.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p><code>TodoApp<\/code> gets three <code>useState<\/code> calls, a <code>useEffect<\/code> on the count, and a return value that is the tree from the contract. If the list gets hard to read, pull one item out into a function component of its own. Handlers use the updater form of the setter, <code>setItems((current) =&gt; ...)<\/code>, which is what your <code>useState<\/code> supports. Pass an item's id to its handlers rather than its position, and give each item's element a <code>key<\/code> that is the id.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Trim the draft before you test it for emptiness, and store the trimmed text.<\/li><li>The new item goes in front of the others: build the next list as <code>[newItem, ...current]<\/code>.<\/li><li>The new id comes from state of its own. The length of the list plus one repeats an id once anything has been removed.<\/li><li>Clear the draft after an add, or the input keeps showing it.<\/li><li>Key by id. With the index as key, an insert at the front looks like a change to every item, and the nodes are rewritten.<\/li><li>The <code>key<\/code> belongs on the element that is a child of the <code>ul<\/code>. If items are function components, put it on the component's element.<\/li><li><code>className<\/code> is <code>done<\/code> or an empty string, and a dump reads a missing prop and a prop set to <code>&quot;&quot;<\/code> the same way.<\/li><li>The count paragraph shows how many items are not done. All items would be the wrong number.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>TodoApp():\n    [items, setItems] = useState([])\n    [draft, setDraft] = useState(&quot;&quot;)\n    [nextId, setNextId] = useState(1)\n    left = number of items not done\n\n    useEffect(set document.title to left + &quot; left&quot;, [left])\n\n    onSubmit(event):\n        event.preventDefault()\n        text = trim(draft)\n        if text is empty: return\n        setItems(current =&gt; [{ id: nextId, text, done: false }, ...current])\n        setNextId(id =&gt; id + 1)\n        setDraft(() =&gt; &quot;&quot;)\n\n    return the tree of the contract:\n        input: value = draft, onInput = event =&gt; setDraft(() =&gt; event.target.value)\n        each item: an li keyed by its id; toggle and remove buttons call setItems with that id\n        p: left + &quot; left&quot;<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the first item","test":"12-R3-add-one-item","input":"tree t <TodoApp/>\nrender t\nflush\ntype #todo-input buy milk\nsubmit #todo-form\ndump","output":"dump 1\nnode 0 a div \"id=todo\"\nnode 1 b form \"id=todo-form\"\nnode 2 c input \"id=todo-input\"\nnode 2 d button \"id=todo-add\"\ntext 3 \"Add\"\nnode 1 e ul \"id=todo-list\"\nnode 2 f li \"id=item-1\"\nnode 3 g button \"id=toggle-1\"\ntext 4 \"todo\"\nnode 3 h span \"id=label-1\"\ntext 4 \"buy milk\"\nnode 3 i button \"id=remove-1\"\ntext 4 \"x\"\nnode 1 j p \"id=todo-count\"\ntext 2 \"1 left\"\ntitle \"1 left\"","image":null,"explain":"<p>No <code>value<\/code> on the input. The add emptied the draft, and after the <code>type<\/code> alone it would show <code>value=buy%20milk<\/code>. The title reads <code>1 left<\/code> because the effect ran inside the last flush, ahead of the dump.<\/p>"},{"label":"Example 2","name":"ids are not recycled","test":"12-R6-ids-never-reused","input":"tree t <TodoApp/>\nrender t\nflush\ntype #todo-input one\nsubmit #todo-form\ntype #todo-input two\nsubmit #todo-form\nclick #remove-2\ntype #todo-input three\nsubmit #todo-form\nclick #remove-1\ntype #todo-input four\nsubmit #todo-form\ndump","output":"dump 1\nnode 0 a div \"id=todo\"\nnode 1 b form \"id=todo-form\"\nnode 2 c input \"id=todo-input\"\nnode 2 d button \"id=todo-add\"\ntext 3 \"Add\"\nnode 1 e ul \"id=todo-list\"\nnode 2 f li \"id=item-4\"\nnode 3 g button \"id=toggle-4\"\ntext 4 \"todo\"\nnode 3 h span \"id=label-4\"\ntext 4 \"four\"\nnode 3 i button \"id=remove-4\"\ntext 4 \"x\"\nnode 2 j li \"id=item-3\"\nnode 3 k button \"id=toggle-3\"\ntext 4 \"todo\"\nnode 3 l span \"id=label-3\"\ntext 4 \"three\"\nnode 3 m button \"id=remove-3\"\ntext 4 \"x\"\nnode 1 n p \"id=todo-count\"\ntext 2 \"2 left\"\ntitle \"2 left\"","image":null,"explain":"<p>Two items are left and their ids are 4 and 3. An id taken as the length of the list plus one would have handed out <code>item-2<\/code> to three different items along the way. A removed item's id is gone for good. That is why the next id is state of its own.<\/p>"},{"label":"Example 3","name":"older items keep their nodes","test":"12-R9-front-insert-keeps-nodes","input":"tree t <TodoApp/>\nrender t\nflush\ntype #todo-input one\nsubmit #todo-form\ndump\ntype #todo-input two\nsubmit #todo-form\ndump\ntype #todo-input three\nsubmit #todo-form\ndump","output":"dump 1\nnode 0 a div \"id=todo\"\nnode 1 b form \"id=todo-form\"\nnode 2 c input \"id=todo-input\"\nnode 2 d button \"id=todo-add\"\ntext 3 \"Add\"\nnode 1 e ul \"id=todo-list\"\nnode 2 f li \"id=item-1\"\nnode 3 g button \"id=toggle-1\"\ntext 4 \"todo\"\nnode 3 h span \"id=label-1\"\ntext 4 \"one\"\nnode 3 i button \"id=remove-1\"\ntext 4 \"x\"\nnode 1 j p \"id=todo-count\"\ntext 2 \"1 left\"\ntitle \"1 left\"\ndump 2\nnode 0 a div \"id=todo\"\nnode 1 b form \"id=todo-form\"\nnode 2 c input \"id=todo-input\"\nnode 2 d button \"id=todo-add\"\ntext 3 \"Add\"\nnode 1 e ul \"id=todo-list\"\nnode 2 k li \"id=item-2\"\nnode 3 l button \"id=toggle-2\"\ntext 4 \"todo\"\nnode 3 m span \"id=label-2\"\ntext 4 \"two\"\nnode 3 n button \"id=remove-2\"\ntext 4 \"x\"\nnode 2 f li \"id=item-1\"\nnode 3 g button \"id=toggle-1\"\ntext 4 \"todo\"\nnode 3 h span \"id=label-1\"\ntext 4 \"one\"\nnode 3 i button \"id=remove-1\"\ntext 4 \"x\"\nnode 1 j p \"id=todo-count\"\ntext 2 \"2 left\"\ntitle \"2 left\"\ndump 3\nnode 0 a div \"id=todo\"\nnode 1 b form \"id=todo-form\"\nnode 2 c input \"id=todo-input\"\nnode 2 d button \"id=todo-add\"\ntext 3 \"Add\"\nnode 1 e ul \"id=todo-list\"\nnode 2 o li \"id=item-3\"\nnode 3 p button \"id=toggle-3\"\ntext 4 \"todo\"\nnode 3 q span \"id=label-3\"\ntext 4 \"three\"\nnode 3 r button \"id=remove-3\"\ntext 4 \"x\"\nnode 2 k li \"id=item-2\"\nnode 3 l button \"id=toggle-2\"\ntext 4 \"todo\"\nnode 3 m span \"id=label-2\"\ntext 4 \"two\"\nnode 3 n button \"id=remove-2\"\ntext 4 \"x\"\nnode 2 f li \"id=item-1\"\nnode 3 g button \"id=toggle-1\"\ntext 4 \"todo\"\nnode 3 h span \"id=label-1\"\ntext 4 \"one\"\nnode 3 i button \"id=remove-1\"\ntext 4 \"x\"\nnode 1 j p \"id=todo-count\"\ntext 2 \"3 left\"\ntitle \"3 left\"","image":null,"explain":"<p>Dump 2 puts the new item first under fresh labels <code>k<\/code> to <code>n<\/code>, and item 1 follows with its old <code>f<\/code> to <code>i<\/code>. Dump 3 repeats the move: item 3 leads with <code>o<\/code> to <code>r<\/code>, and items 2 and 1 keep theirs. With ids as keys the list inserts one new node in front. The old ones stay as they are. Keyed by position, it would rewrite item 1's node into item 2 and add a new node at the end, and the labels would show it.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p>Jongeneel's <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=6.%20Building%20a%20sample%20application\" target=\"_blank\" rel=\"noopener\"><code>ToDoComponent<\/code> and <code>NewItemForm<\/code><\/a> are class components with state objects. <code>NewItemForm<\/code> keeps the draft and calls the <code>addItem<\/code> prop on submit, and <code>ToDoComponent<\/code> keeps the items and renders the list. Items are <code>li<\/code> elements keyed by index, each with a button that flips its <code>done<\/code> flag, and event handlers are lower-case properties such as <code>onsubmit<\/code> and <code>oninput<\/code>.<\/p>\n<p>His app departs from the spec in several places. A new item goes at the end, where yours goes first. He keys by index, so each item is matched by position, and a removal or a front insert would rewrite the nodes of the items after it, where the tests expect every item to keep its own. His app only appends and has no removal, which is why the index key does no harm there. Submitting an empty draft adds an item with an empty label, since nothing trims or checks the draft. There is no remove button, no count, no ids and no title, and the toggle button reads <code>-<\/code> for an open item where yours reads <code>todo<\/code>. The draft lives in the form component, and a submit makes two <code>setState<\/code> calls, one in <code>addItem<\/code> and one that clears the draft. Each renders at once, where your handler's three updates give one render. His <code>renderDOM<\/code> also swaps the <code>#root<\/code> element itself for the app, where your <code>render<\/code> fills it. The tests side with the spec on all of these points.<\/p>\n<p>The \"Events\" row of <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> covers React 19 as well as the post: handlers are named <code>onSubmit<\/code>, <code>onInput<\/code> and <code>onClick<\/code> here, as in React, and your <code>updateDom<\/code> turns them into listeners.<\/p>"},"need":{"new":[{"id":"react-controlled-inputs","title":"Controlled inputs","note":"the input displays the draft held in state, and typing updates that state.","group":"React and the ideas in the posts","from":"12"},{"id":"dom-document-title","title":"document.title","note":"the title is the one piece of the page that sits outside the tree, which makes it an effect's job.","group":"The DOM","from":"12"},{"id":"static-server","title":"Serving index.html locally","note":"<code>src/main.js<\/code> is the one file here that needs a browser, and a browser needs a server for module imports.","group":"Tools and the checker","from":"12"}],"earlier":[{"id":"dom-form-inputs","title":"Inputs, the input and submit events","note":"the scenario lines <code>type<\/code> and <code>submit<\/code> dispatch these events.","group":"The DOM","from":"07"},{"id":"react-keys","title":"Keys","note":"each item's key is its id, and the tests check which nodes stay put.","group":"React and the ideas in the posts","from":"07"},{"id":"react-effects","title":"useEffect: after the DOM is updated","note":"and <a href=\"#primer/react-state\">useState and the rules of hooks<\/a>: this time they are called from application code instead of a catalog component.","group":"React and the ideas in the posts","from":"11"},{"id":"js-arrays","title":"Array methods: map, filter, forEach, find, includes, slice","note":"","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"js-objects","title":"Objects, spread and destructuring","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"react-elements","title":"Elements, and what JSX turns into","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"},{"id":"js-functions-closures","title":"Arrow functions and closures","note":"","from":"02"},{"id":"js-string-methods","title":"String methods: <code>startsWith<\/code>, <code>slice<\/code>, <code>toLowerCase<\/code>","note":"","from":"02"},{"id":"react-function-components","title":"Function components","note":"","from":"09"},{"id":"react-state","title":"<code>useState<\/code> and the rules of hooks","note":"","from":"10"}]}}],"project":{"dir":"solutions","label":"JavaScript","name":"didact","build":"","run":"python -m http.server 8000 --directory solutions","author":null,"layout":[{"path":"solutions/assignments/assignment_01_create_element.js","owner":"01","purpose":null},{"path":"solutions/src/didact/createElement.js","owner":"01","purpose":"What JSX compiles to: a plain `{ type, props }` object, with the children inside `props`."},{"path":"solutions/assignments/assignment_02_dom_props.js","owner":"02","purpose":null},{"path":"solutions/src/didact/dom.js","owner":"02","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props."},{"path":"solutions/assignments/assignment_03_first_render.js","owner":"03","purpose":null},{"path":"solutions/src/didact/renderSync.js","owner":"03","purpose":"A first draft of `render`: recurse through the tree and append nodes as you go. Assignment 4 replaces it with a work loop. The file stays for comparison."},{"path":"solutions/assignments/assignment_04_fibers.js","owner":"04","purpose":null},{"path":"solutions/src/didact/state.js","owner":"04","purpose":"Shared bookkeeping in one object: what to work on next, and the tree under construction. It has to be an object, because an ES module can't share a variable for other modules to reassign."},{"path":"solutions/src/didact/render.js","owner":"04","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units."},{"path":"solutions/src/didact/reconcile.js","owner":"04","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render."},{"path":"solutions/src/didact/index.js","owner":"04","purpose":"What an app imports: one `Didact` object carrying `createElement` and `render`, with the hooks joining it as you write them."},{"path":"solutions/assignments/assignment_05_commit.js","owner":"05","purpose":null},{"path":"solutions/src/didact/commit.js","owner":"05","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing."},{"path":"solutions/assignments/assignment_06_reconcile.js","owner":"06","purpose":null},{"path":"solutions/assignments/assignment_07_keys.js","owner":"07","purpose":null},{"path":"solutions/assignments/assignment_08_reorder.js","owner":"08","purpose":null},{"path":"solutions/assignments/assignment_09_function_components.js","owner":"09","purpose":null},{"path":"solutions/assignments/assignment_10_use_state.js","owner":"10","purpose":null},{"path":"solutions/src/didact/hooks.js","owner":"10","purpose":"State and effects that belong to a component and outlive its re-renders, stored on the fiber: `useState` and `useEffect`."},{"path":"solutions/assignments/assignment_11_use_effect.js","owner":"11","purpose":null},{"path":"solutions/assignments/assignment_12_todo_app.js","owner":"12","purpose":null},{"path":"solutions/src/app/TodoApp.js","owner":"12","purpose":"A todo list written the way an application would write it, as function components on your own Didact."},{"path":"solutions/src/main.js","owner":"12","purpose":"Where the finished program starts: it mounts the todo app into the page's `#root`."}],"authors":[{"label":"Wim Jongeneel's ts-reactive-rendering","url":"https://github.com/WimJongeneel/ts-reactive-rendering","files":["src/virtual_dom.ts","src/diffs.ts","src/render.ts","src/component.tsx","src/main.ts"]},{"label":"Rodrigo Pombo's didact","url":"https://github.com/pomber/didact","files":["didact.js"]}],"given":["harness/minidom.js","harness/env.js","harness/dump.js","harness/markup.js","harness/scenario.js","harness/catalog.js"]},"sources":[{"url":"https://pomb.us/build-your-own-react/","title":"Build your own React","author":"Rodrigo Pombo"},{"url":"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d","title":"Creating Our Own React From Scratch","author":"Wim Jongeneel"}]}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('book-data').textContent);
  const CPS = DATA.checkpoints;
  const BY = Object.fromEntries(CPS.map((c) => [c.id, c]));
  const DIFFS = ['Easy', 'Medium', 'Hard'].filter((d) => CPS.some((c) => c.difficulty === d))
    .concat([...new Set(CPS.map((c) => c.difficulty))].filter((d) => !['Easy', 'Medium', 'Hard'].includes(d)));

  // Progress, drafts and layout live in this browser only.
  const store = {
    get(k) { try { return localStorage.getItem(DATA.key + ':' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(DATA.key + ':' + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(DATA.key + ':' + k); } catch (e) {} },
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  // Your project: the folder you build the post's program in, one assignment at a time. Each
  // assignment's files (c.files) are its entry program, which the checker runs, the project files it
  // creates, and earlier files it adds to.
  const PROJECT = DATA.project;
  const PROJECT_DIR = PROJECT.dir + '/';
  // workbook.json writes program names with {exe}, which ends them in .exe on Windows. Show this
  // computer's form of every command: .\check, PowerShell and .exe on Windows; ./check.sh, a
  // terminal and no .exe on macOS and Linux.
  const SYSTEM = /Win/i.test(navigator.platform || navigator.userAgent) ? 'windows'
    : /Mac/i.test(navigator.platform || navigator.userAgent) ? 'mac' : 'linux';
  const CHECK_WIN = '.\\check ', CHECK_SH = './check.sh ';
  if (SYSTEM !== 'windows' && DATA.check.startsWith(CHECK_WIN)) {
    DATA.check = CHECK_SH + DATA.check.slice(CHECK_WIN.length);
    if (DATA.shell === 'PowerShell') DATA.shell = 'a terminal';
  } else if (SYSTEM === 'windows' && DATA.check.startsWith(CHECK_SH)) {
    DATA.check = CHECK_WIN + DATA.check.slice(CHECK_SH.length);
    if (DATA.shell === 'a terminal') DATA.shell = 'PowerShell';
  }
  // Workbooks made before {exe} wrote .exe after the program's name; macOS and Linux leave it out.
  const native = (cmd) => (SYSTEM === 'windows' ? (cmd || '').split('{exe}').join('.exe')
    : (cmd || '').split('{exe}').join('').replace(/^("?[^\s"]+?)\.exe(?="?(\s|$))/i, '$1'));
  PROJECT.build = native(PROJECT.build);
  PROJECT.run = native(PROJECT.run);
  const STUDY_HOW = SYSTEM === 'windows' ? 'double-click <code>study.cmd</code>, or run <code>.\\study</code>'
    : SYSTEM === 'mac' ? 'double-click <code>study.command</code>, or run <code>./study.sh</code>' : 'run <code>./study.sh</code>';
  const shortName = (path) => (path.startsWith(PROJECT_DIR) ? path.slice(PROJECT_DIR.length) : path);
  const draftKey = (path) => 'draft:' + path;  // the published book keeps your files in this browser
  const command = (id, extra) => DATA.check.replace('{id}', id) + (extra ? ' ' + extra : '');
  const solved = (id) => store.get(id + ':solved') === '1';
  const drafted = (id) => BY[id].files.some((f) => f.role !== 'adds' && store.get(draftKey(f.path)) !== null);
  const diffClass = (d) => d.toLowerCase();
  const icon = (paths, size, extra) => `<svg viewBox="0 0 24 24" width="${size || 16}" height="${size || 16}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra || ''}>${paths}</svg>`;
  const I = {
    check: icon('<path d="m5 12 5 5 9-10"/>'),
    tryIcon: icon('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'),
    tag: icon('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>', 14),
    bulb: icon('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>', 15),
    lock: icon('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 14),
    down: icon('<path d="m6 9 6 6 6-6"/>', 15),
    link: icon('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', 15),
    map: icon('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>', 15),
    book: icon('<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/>', 15),
    learn: icon('<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v5"/>', 15),
  };

  // The primer: entries by id, and which assignment introduces each one.
  const PRIMER = DATA.primer || [];
  const ENTRY = {};
  PRIMER.forEach((g) => g.entries.forEach((e) => { ENTRY[e.id] = e; }));

  let current = null;          // assignment id on screen, or null for the list
  let caseIndex = 0;           // selected test case in the bottom panel
  const peeked = new Set();    // editorials opened before solving, this visit only
  const lastAction = {};       // id -> { kind: 'run' | 'submit', test, copied }

  // ---------------------------------------------------------------- problem list
  const filter = { topic: null, diff: null, q: '' };

  function topicsOf(c) {
    const concepts = c.tags.find((g) => g.label.toLowerCase() === 'concepts');
    return concepts ? concepts.text : c.tags.flatMap((g) => g.text);
  }

  function renderListShell() {
    $$('[data-logo]').forEach((el) => { el.textContent = DATA.title.trim().charAt(0).toUpperCase(); });
    $('#book-name').textContent = DATA.title;
    $$('[data-book-name]').forEach((el) => { el.textContent = DATA.title; });
    $$('[data-primer-link]').forEach((el) => { el.hidden = !PRIMER.length; });
    // One post, or several ("A and B", "A, B and C"): each one named with its author and linked.
    const posts = (DATA.sources && DATA.sources.length ? DATA.sources : [{ url: DATA.sourceUrl, title: DATA.sourceTitle, author: DATA.author }])
      .map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">“${esc(s.title)}”</a> by ${esc(s.author)}`);
    $('#nav-src').innerHTML = 'Built on ' + (posts.length > 1 ? posts.slice(0, -1).join(', ') + ' and ' + posts[posts.length - 1] : posts[0]);
    $('#hero').innerHTML = `<span class="over">${CPS.length} assignments · any language</span><h1>${esc(DATA.headline)}</h1><p>${esc(DATA.lede)}</p>`;
    $('#credits').textContent = DATA.credits;
    $('#diff').innerHTML = ['All'].concat(DIFFS).map((d) =>
      `<button type="button" data-diff="${d === 'All' ? '' : esc(d)}" aria-pressed="${d === 'All'}">${esc(d)}</button>`).join('');

    const counts = {};
    CPS.forEach((c) => topicsOf(c).forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const topics = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    $('#topics').innerHTML = `<button class="tchip" type="button" data-topic="" aria-pressed="true">All topics</button>`
      + topics.map((t) => `<button class="tchip" type="button" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}<sup>${counts[t]}</sup></button>`).join('')
      + (topics.length > 11 ? '<button class="more" type="button" id="more-topics">Expand</button>' : '');
  }

  function renderSide() {
    const done = CPS.filter((c) => solved(c.id));
    const r = 50, C = 2 * Math.PI * r;
    let offset = 0;
    const arcs = DIFFS.map((d) => {
      const n = done.filter((c) => c.difficulty === d).length;
      const len = (n / CPS.length) * C;
      const arc = n ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="currentColor" class="${diffClass(d)}" stroke-width="7" stroke-linecap="butt" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"/>` : '';
      offset += len;
      return arc;
    }).join('');
    const bars = DIFFS.map((d) => {
      const all = CPS.filter((c) => c.difficulty === d).length;
      const n = done.filter((c) => c.difficulty === d).length;
      return `<button class="bar-row ${diffClass(d)}" type="button" data-diff="${esc(d)}" aria-pressed="${filter.diff === d}">
        <span class="lbl">${esc(d)}</span><span class="n"><b>${n}</b>/${all}</span><span class="bar"><i style="width:${all ? (n / all) * 100 : 0}%"></i></span></button>`;
    }).join('');
    const first = CPS[0] ? CPS[0].id : '01';
    $('#side').innerHTML = `
      <div class="card prog">
        <div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" style="stroke: var(--fill)" stroke-width="7"/>${arcs}</svg>
          <div class="ring-c"><div><b>${done.length}</b><span>/${CPS.length}</span></div><small>Solved</small></div></div>
        <div class="bars">${bars}</div>
      </div>
      <div class="card how"><h2>Using the book</h2><ol>
        ${PRIMER.length ? `<li><span>When a term, a library or a tool is new to you, look it up in the <a href="#primer">primer</a>. Each assignment's Learning material links to the entries it needs.</span></li>` : ''}
        <li><span>You build one ${esc(PROJECT.label)} project, in <code>${esc(PROJECT_DIR)}</code>. Each assignment adds files to it, and later assignments include them, so work through them in order. At the end, the project builds on its own and you can put it on GitHub.</span></li>
        <li><span>Write the code here or in your own editor (the button above the code opens the current file in it, so your editor's completion works). An assignment's files open with the Boilerplate: the input/output code and the declarations, with TODOs for you. Choose From scratch above the editor to start from empty files.</span></li>
        ${LOCAL ? `<li><span>The Run button checks the selected example, and Submit runs every test. The verdict appears in the Test result tab, and Accepted marks the assignment solved. The book saves your files as you type.</span></li>`
          : HOST ? `<li><span>Once the workbook is set up on your computer, Run and Submit check your code there. This copy shows the problems and the starter code. <button type="button" class="linkish" data-run-local>See how</button></span></li>`
          : `<li><span>The Submit button copies your code. Paste it into the solution file and run <code>${esc(command(first))}</code> in ${esc(DATA.shell)}, in the workbook folder:<br><span class="path">${esc(DATA.folder)}</span></span></li>
        <li><span>Paste the checker's output into the Test result tab. Accepted marks the assignment solved. If you open the workbook with the study server instead (${STUDY_HOW}), Run and Submit build and run your code for you.</span></li>`}
        <li><span>An assignment's tests depend only on the earlier files it uses, because each test input carries what earlier assignments would produce.${LOCAL ? ' The Re-check solved button reruns your solved assignments and shows any that a later change broke.' : ''}</span></li>
        <li><span>If a test looks wrong, run <code>${esc(command(first, '-Dispute <test-id> "why"'))}</code> to set it aside, then ask your coding assistant to review your disputes.</span></li>
      </ol></div>`;
    if (CPS.length && done.length === CPS.length) renderFinish();
  }

  // Every assignment passes: show the project the learner built next to the author's.
  function renderFinish() {
    const card = document.createElement('div');
    card.className = 'card finish';
    card.innerHTML = `<h2>You built it</h2><p class="note">All ${CPS.length} assignments pass. <code>${esc(PROJECT_DIR)}</code> has its own build file and builds without the workbook, so you can put it on GitHub as it is.</p><div id="finish-files"></div>`;
    $('#side').prepend(card);
    const show = (all) => {
      // The assignment programs are test scaffolding: compare the project itself.
      // The files the workbook copies into the project (a harness, third-party code) aren't the learner's own.
      const given = PROJECT.given || [];
      const mine = all.filter((f) => !f.startsWith('assignments/') && !f.startsWith('third_party/') && !given.includes(f));
      const scaffolding = all.length - mine.length;
      const scaffoldingNote = given.length ? 'assignments/ and the files the workbook gives you' : 'assignments/ and third_party/';
      // The authors whose project layouts the book compares with: one (project.author), or each of several.
      const authors = (PROJECT.authors && PROJECT.authors.length ? PROJECT.authors : PROJECT.author ? [PROJECT.author] : [])
        .filter((a) => a.files && a.files.length);
      const matched = new Set(authors.flatMap((a) => treeMatch(mine, a.files)));
      const listing = (files, hit) => files.map((f) => (hit(f) ? `<span class="hit">${esc(f)}</span>` : esc(f))).join('\n');
      const theirs = (a) => `<div><h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${authors.length > 1 ? esc(a.label) : "The author's"}</a></h3><pre>${listing(a.files, (f) => [...matched].some((m) => sameFile(m, f)))}</pre></div>`;
      const counts = authors.length > 1
        ? `${matched.size} of your files have a counterpart in the authors' projects (in green): ${authors.map((a) => `${treeMatch(mine, a.files).length} in ${esc(a.label)}`).join(', ')}.`
        : authors.length ? `${matched.size} of your files have a counterpart in ${esc(authors[0].label)} (in green).` : '';
      $('#finish-files').innerHTML = (authors.length ? `<div class="trees">
          <div><h3>Yours</h3><pre>${listing(mine, (f) => matched.has(f))}${scaffolding ? `\n<span class="muted">+ ${scaffoldingNote} (${scaffolding} files)</span>` : ''}</pre></div>
          ${authors.map(theirs).join('')}</div>
          <p class="note">${counts}</p>` : '')
        + (LOCAL && (PROJECT.build || PROJECT.run) ? `<p class="note">Run what you built:</p>${PROJECT.build ? cmdRow(PROJECT.build) : ''}${PROJECT.run ? cmdRow(PROJECT.run) : ''}` : '');
    };
    if (!LOCAL) { show(PROJECT.layout.map((f) => shortName(f.path))); return; }
    api('/api/files').then((r) => show(r.files.map((f) => shortName(f.path)))).catch(() => {});
  }
  // Does one of the learner's files correspond to one of the author's? Colours both trees on the
  // finish card and gives the count. `mine` is a path in the project (e.g. "src/font/FontParser.h"),
  // `theirs` a path in the author's repository (e.g. "FontParser.h" or "utils/Geometry.h").
  // The same module name counts, whatever the folder, extension or naming style: font/FontParser.h
  // is the author's FontParser.h, and a Python project's font_parser.py would be their FontParser.cpp.
  function sameFile(mine, theirs) {
    const key = (path) => path.split('/').pop().replace(/\.[^.]*$/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    return key(mine) === key(theirs);
  }
  function treeMatch(mine, theirs) {
    return mine.filter((m) => theirs.some((t) => sameFile(m, t)));
  }

  function renderRows() {
    const q = filter.q.trim().toLowerCase();
    const shown = CPS.filter((c) => (!filter.diff || c.difficulty === filter.diff)
      && (!filter.topic || topicsOf(c).includes(filter.topic))
      && (!q || (c.num + '. ' + c.title + ' ' + c.tags.flatMap((g) => g.text).join(' ')).toLowerCase().includes(q)));
    $('#rows').innerHTML = shown.map((c) => {
      const st = store.get(c.id + ':broke') ? '<span class="st-broke" title="Solved before, failing since a re-check">!</span>'
        : solved(c.id) ? `<span class="st-ok" title="Solved">${I.check}</span>`
        : drafted(c.id) ? `<span class="st-try" title="Attempted: a draft is saved">${I.tryIcon}</span>` : '';
      return `<tr data-id="${c.id}"><td class="st">${st}</td><td class="ti"><a href="#p${c.id}">${esc(c.num)}. ${esc(c.title)}</a></td>`
        + `<td class="te">${c.tests}</td><td class="di ${diffClass(c.difficulty)}">${esc(c.difficulty)}</td></tr>`;
    }).join('') || '<tr><td></td><td class="muted" colspan="3">No assignments match.</td></tr>';
    return shown;
  }

  function showList() {
    current = null;
    $('#ide-view').hidden = true;
    $('#primer-view').hidden = true;
    $('#list-view').hidden = false;
    document.body.classList.remove('in-ide');
    renderSide();
    renderRows();
    window.scrollTo(0, 0);
  }

  $('#topics').addEventListener('click', (e) => {
    if (e.target.id === 'more-topics') {
      const box = $('#topics');
      e.target.textContent = box.classList.toggle('collapsed') ? 'Expand' : 'Collapse';
      return;
    }
    const chip = e.target.closest('[data-topic]');
    if (!chip) return;
    filter.topic = chip.dataset.topic || null;
    $$('#topics [data-topic]').forEach((b) => b.setAttribute('aria-pressed', String(b === chip)));
    renderRows();
  });
  function setDiff(d) {
    filter.diff = d || null;
    $$('#diff [data-diff]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.diff || null) === filter.diff)));
    renderSide();
    renderRows();
  }
  $('#diff').addEventListener('click', (e) => { const b = e.target.closest('[data-diff]'); if (b) setDiff(b.dataset.diff); });
  $('#side').addEventListener('click', (e) => { const b = e.target.closest('.bar-row'); if (b) setDiff(filter.diff === b.dataset.diff ? '' : b.dataset.diff); });
  $('#q').addEventListener('input', (e) => { filter.q = e.target.value; renderRows(); });
  $('#rows').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-id]');
    if (row && !e.target.closest('a')) go('p' + row.dataset.id);
  });

  // ---------------------------------------------------------------- problem view
  // "Learning material": the primer entries this assignment introduces, each with how it's used here,
  // then the ones known from earlier assignments (with a note when the page gives one).
  // Each primer group is a block that folds, so a long list (the first assignment introduces most
  // of the language) shows as a few lines with counts; a short one starts open.
  function needHtml(need) {
    const item = (n) => `<li><a href="#primer/${esc(n.id)}">${n.title}</a>${n.note ? `<span>${n.note}</span>` : ''}</li>`;
    const block = (title, count, body, open) => `<details class="need-grp"${open ? ' open' : ''}><summary>${I.down}<span>${esc(title)}</span><span class="acc-sub">${count}</span></summary><div class="need-body">${body}</div></details>`;
    const groups = [...new Set(need.new.map((n) => n.group || 'New in this assignment'))];
    const fresh = groups.map((g) => {
      const items = need.new.filter((n) => (n.group || 'New in this assignment') === g);
      return block(g, items.length, `<ul class="need-list">${items.map(item).join('')}</ul>`, need.new.length <= 8);
    }).join('');
    const noted = need.earlier.filter((n) => n.note), rest = need.earlier.filter((n) => !n.note);
    const earlier = (noted.length ? `<ul class="need-list">${noted.map(item).join('')}</ul>` : '')
      + (rest.length ? `<div class="need-chips">${rest.map((n) => `<a class="chip" href="#primer/${esc(n.id)}" title="Introduced in assignment ${esc(BY[n.from] ? BY[n.from].num : n.from)}">${n.title}</a>`).join('')}</div>` : '');
    return (need.new.length ? `<p class="need-h">New in this assignment</p>${fresh}` : '')
      + (need.earlier.length ? block('From earlier assignments', need.earlier.length, earlier, false) : '');
  }

  function renderDesc(c) {
    const opened = Number(store.get(c.id + ':hints') || 0);
    const acc = (id, iconHtml, title, body) => `<div class="acc" ${id ? `id="${id}"` : ''}><button class="acc-btn" type="button" aria-expanded="false">${iconHtml}<span>${title}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${body}</div></div>`;
    const hintHtml = c.hints.map((h, k) => {
      const n = k + 1, locked = n > opened + 1;
      return `<div class="acc hint" data-n="${n}"><button class="acc-btn" type="button" aria-expanded="false"${locked ? ' disabled' : ''}>${I.bulb}<span>${esc(h.title)}<span class="acc-sub">${h.sub}</span></span>`
        + `<span class="acc-lock" ${locked ? '' : 'hidden'} title="Open hint ${n - 1} first">${I.lock}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${h.html}</div></div>`;
    }).join('');
    const need = c.need || { new: [], earlier: [] };
    const needCount = need.new.length + need.earlier.length;
    const needSub = [need.new.length ? `${need.new.length} new` : '', need.earlier.length ? `${need.earlier.length} from earlier` : ''].filter(Boolean).join(' · ');
    const tags = c.tags.map((g) => `<div class="tg"><span class="tg-label">${esc(g.label)}</span><div class="tg-items">${g.items.map((t) => `<span class="chip">${t}</span>`).join('')}</div></div>`).join('');

    $('#desc').innerHTML = `
      <div class="d-head"><h1>${esc(c.num)}. ${esc(c.title)}</h1><span class="solved-mark" id="solved-mark" ${solved(c.id) ? '' : 'hidden'}>Solved ${I.check}</span></div>
      <div class="chips">
        <span class="chip ${diffClass(c.difficulty)}">${esc(c.difficulty)}</span>
        ${c.tags.length ? `<button class="chip" type="button" data-jump="acc-topics">${I.tag}Topics</button>` : ''}
        ${c.hints.length ? `<button class="chip" type="button" data-jump="hints">${I.bulb}Hint</button>` : ''}
        <span class="chip">${c.tests} tests</span>
        <span class="chip" title="The checker compares only what your program writes, so you can use any structure, language or library.">Any language</span>
      </div>
      ${c.read ? `<div class="callout">${I.book}<div><p class="callout-title">${esc(c.readTitle || 'Read in the blog first')}</p>${c.read}</div></div>` : ''}
      ${c.sources || needCount ? `<div class="accs accs-top">${needCount ? acc('acc-need', I.learn, `Learning material<span class="acc-sub">${needSub}</span>`, needHtml(c.need)) : ''}${c.sources ? acc('acc-sources', I.link, 'Source material', c.sources) : ''}</div>` : ''}
      ${startCard(c)}
      <div class="flow">${c.body}</div>
      <div class="accs">
        ${c.tags.length ? acc('acc-topics', I.tag, 'Topics', tags) : ''}
        ${hintHtml}
        ${c.context ? acc('', I.map, 'Where this fits', c.context) : ''}
      </div>
      <div class="d-foot"><button class="btn" type="button" id="solve-btn"></button><span>Assignment ${CPS.indexOf(c) + 1} of ${CPS.length} · problem page <code>${esc(c.problem)}</code></span></div>`;

    const host = $('[data-examples]', $('#desc'));
    if (host) host.innerHTML = c.examples.map(exampleHtml).join('');
    paintSolved();
  }

  // Start here: the files to write in this assignment, your job in each, and how to begin.
  const withCode = (t) => esc(t || '').replace(/`([^`]+)`/g, '<code>$1</code>');
  // The first sentence of a job is the line under the file; the rest waits behind "Expand for more info".
  const splitJob = (t) => {
    const m = /^(.+?[.!?])\s+(?=[A-Z`(])/.exec(t || '');
    return m ? [m[1], t.slice(m[0].length)] : [t || '', ''];
  };
  const WAY_NOTES = {
    boilerplate: 'You get the input/output code and the declarations, and fill in each TODO.',
    blank: 'Each file starts with only a comment: why the file exists and your job in it.',
  };
  function startCard(c) {
    const order = [...c.files.filter((f) => f.role !== 'entry'), ...c.files.filter((f) => f.role === 'entry')];
    const from = (f) => (f.owner && BY[f.owner] ? esc(BY[f.owner].num) : '');
    const tag = (f) => (f.role === 'entry' ? '<span class="step-tag">The checker runs it</span>'
      : f.role === 'adds' ? `<span class="step-tag adds">Add to it · from ${from(f)}</span>` : '<span class="step-tag new">New</span>');
    const nameOf = (f) => {
      const rel = shortName(f.path), cut = rel.lastIndexOf('/');
      const name = esc(rel.slice(cut + 1)), dir = cut < 0 ? '' : `<span class="step-dir">${esc(rel.slice(0, cut + 1))}</span>`;
      return (LOCAL ? `<button type="button" class="step-name" data-open-file="${esc(f.path)}" title="Open in the editor">${name}</button>` : `<span class="step-name">${name}</span>`) + dir;
    };
    const steps = order.map((f, k) => {
      const [lead, rest] = splitJob(f.job);
      const why = f.role === 'entry' ? 'It reads a test input, calls your code and writes the answer. The checker compares that answer with the expected one.'
        : f.role === 'new' ? f.purpose : '';
      const more = rest || why ? `<details class="step-more"><summary><span class="when-closed">Expand for more info</span><span class="when-open">Show less</span>${I.down}</summary>
          <div class="step-more-body">${rest ? `<p><span class="lbl">In more detail</span>${withCode(rest)}</p>` : ''}${why ? `<p><span class="lbl">Why this file</span>${withCode(why)}</p>` : ''}</div></details>` : '';
      return `<li class="step"><span class="step-n">${k + 1}</span><div class="step-main">
        <div class="step-file">${nameOf(f)}${tag(f)}</div>
        <p class="step-job">${withCode(lead)}</p>${more}</div></li>`;
    }).join('');
    const link = (f) => (LOCAL ? `<button type="button" class="fpath" data-open-file="${esc(f.path)}">${esc(shortName(f.path))}</button>`
      : `<code class="fpath">${esc(shortName(f.path))}</code>`);
    const facts = [];
    if (c.buildsOn.length) facts.push(['You can use', `<span>${c.buildsOn.map((f) => `${link(f)} <span class="muted">${from(f)}</span>`).join(' &nbsp;')}</span>`]);
    return `<section class="start" aria-labelledby="start-title">
      <div class="start-top"><span class="start-eyebrow">Start here</span>
        <h2 id="start-title">${order.length === 1 ? 'Complete this file' : `Complete these ${order.length} files`}</h2>
        <p class="start-sub">${order.length === 1 ? '' : 'Go from top to bottom. '}The checker runs ${order.length === 1 ? 'it' : 'the last one'} on ${c.tests} test inputs and compares what it writes with the expected output. You can organise the code any way you like.</p></div>
      <ol class="steps">${steps}</ol>
      ${facts.length ? `<dl class="start-facts">${facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
    </section>`;
  }

  function exampleHtml(ex) {
    const title = `<p class="ex-title"><strong>${esc(ex.label)}:</strong> <span>${ex.name}</span></p>`;
    if (ex.raw) return `<div class="ex">${title}<div class="flow">${ex.raw}</div></div>`;
    const out = ex.output != null ? `<pre>${esc(ex.output)}</pre>`
      : ex.image ? `<img class="shot" src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '';
    return `<div class="ex">${title}<div class="ex-block">
      <div class="ex-row"><span class="ex-k">Input:</span><pre>${esc(ex.input)}</pre></div>
      ${out ? `<div class="ex-row"><span class="ex-k">Output:</span>${out}</div>` : ''}
      ${ex.explain ? `<div class="ex-row"><span class="ex-k">Explanation:</span><div class="flow">${ex.explain}</div></div>` : ''}
    </div></div>`;
  }

  function toggleAcc(box, open) {
    const btn = $('.acc-btn', box), body = $('.acc-body', box);
    const show = open === undefined ? body.hidden : open;
    body.hidden = !show;
    btn.setAttribute('aria-expanded', String(show));
  }

  // Hints open in order; the furthest one opened is remembered.
  function openHint(box) {
    const n = Number(box.dataset.n), key = current + ':hints';
    const opened = Number(store.get(key) || 0);
    if (n > opened) {
      store.set(key, String(n));
      $$('.acc.hint', $('#desc')).forEach((h) => {
        const locked = Number(h.dataset.n) > n + 1;
        $('.acc-btn', h).disabled = locked;
        $('.acc-lock', h).hidden = !locked;
      });
      toggleAcc(box, true);
    } else toggleAcc(box);
  }

  $('#desc').addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {
      const target = jump.dataset.jump === 'hints' ? $('.acc.hint', $('#desc')) : $('#' + jump.dataset.jump);
      if (target) {
        if (jump.dataset.jump !== 'hints') toggleAcc(target, true);
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      return;
    }
    const btn = e.target.closest('.acc-btn');
    if (btn) {
      const box = btn.parentElement;
      if (box.classList.contains('hint')) openHint(box); else toggleAcc(box);
      return;
    }
    if (e.target.closest('#solve-btn')) setSolved(current, !solved(current));
    const file = e.target.closest('[data-open-file]');
    if (file) openTab(file.dataset.openFile);
    const way = e.target.closest('[data-start-kind]');
    if (way) { const b = $(`#kind [data-kind="${way.dataset.startKind}"]`); if (b) b.click(); }
  });

  // The Editorial: a solution proven to pass every test (the reference, fingerprinted when it
  // passed), then how the blog author did it. Locked until Accepted, but always one click away.
  let solFile = 0;
  function renderEditorial(c) {
    const sol = c.solutionCode;
    const has = !!c.editorial || !!sol;
    $('#ed-tab').hidden = !has;
    $('#ed-sep').hidden = !has;
    if (!has) return;
    if (!(solved(c.id) || peeked.has(c.id))) {
      $('#editorial').innerHTML = `<div class="locked">${I.lock}<h2>Solve it first, or peek</h2><p>The editorial has a complete solution that passes every test${c.editorial ? ', and compares it with the author\'s code from the blog' : ''}. The book opens it for you when the checker says Accepted.</p><button class="btn" type="button" id="peek">Show the solution anyway</button></div>`;
      return;
    }
    solFile = Math.min(solFile, sol ? sol.files.length - 1 : 0);
    const proof = sol && sol.proof
      ? `<span class="badge ok">${I.check} Passes all ${sol.proof.total} tests · checked ${esc(sol.proof.date)}</span>`
      : `<span class="badge warn">Not yet checked against the tests</span>`;
    const files = sol && sol.files.length > 1
      ? `<div class="case-pills" role="tablist">${sol.files.map((f, i) => `<button class="pill-btn" type="button" role="tab" data-sol="${i}" aria-selected="${i === solFile}">${esc(f.path)}</button>`).join('')}</div>` : '';
    $('#editorial').innerHTML = `<h1 class="ed-title">Editorial</h1>`
      + (sol ? `<section class="ed-sec"><h2>A solution that passes <span class="muted">(${esc(PROJECT.label)})</span></h2>${proof}
          <p class="note">This solution follows the problem page and doesn't copy the blog's code. Yours can look different and still pass, because the checker compares only what your program writes.</p>
          ${files}<div class="sol-head"><code>${esc(sol.files[solFile].path)}</code><button class="btn" type="button" id="sol-copy">Copy</button></div>
          <pre class="sol-code" id="sol-code"></pre>
          ${sol.also.length ? `<p class="note">It also uses earlier assignments' files: ${sol.also.map((u) => `<code>${esc(u)}</code>`).join(', ')}. Their Editorials show them.</p>` : ''}
          ${sol.given && sol.given.length ? `<p class="note">It runs on files the workbook gives you, which you don't write: ${sol.given.map((u) => `<code>${esc(u)}</code>`).join(', ')}.</p>` : ''}</section>` : '')
      + (c.editorial ? `<section class="ed-sec"><h2>${esc(c.editorial.title)}</h2><div class="flow">${c.editorial.html}</div></section>` : '');
    if (sol) {
      const box = $('#sol-code'), text = sol.files[solFile].text;
      if (window.CodeMirror && window.CodeMirror.runMode) window.CodeMirror.runMode(text, modeFor(sol.files[solFile].path), box);
      else box.textContent = text;
    }
  }
  $('#editorial').addEventListener('click', (e) => {
    const c = BY[current];
    if (e.target.closest('#peek')) { peeked.add(current); renderEditorial(c); return; }
    const tab = e.target.closest('[data-sol]');
    if (tab) { solFile = Number(tab.dataset.sol); renderEditorial(c); return; }
    const copy = e.target.closest('#sol-copy');
    if (copy) copyText(c.solutionCode.files[solFile].text).then((ok) => flash(copy, ok));
  });

  function setLeft(tab) {
    $$('[data-left]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.left === tab)));
    $('#desc').hidden = tab !== 'desc';
    $('#editorial').hidden = tab !== 'editorial';
  }
  function setBottom(tab) {
    $$('[data-bottom]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.bottom === tab)));
    $('#cases').hidden = tab !== 'cases';
    $('#result').hidden = tab !== 'result';
  }
  $$('[data-left]').forEach((b) => b.addEventListener('click', () => setLeft(b.dataset.left)));
  $$('[data-bottom]').forEach((b) => b.addEventListener('click', () => setBottom(b.dataset.bottom)));

  // ---- test cases
  const casesOf = (c) => c.examples.filter((ex) => !ex.raw && ex.input != null);
  function renderCases(c) {
    const list = casesOf(c);
    if (!list.length) {
      $('#cases').innerHTML = `<p class="note">This assignment has no worked examples. <code>${esc(command(c.id))}</code> runs all ${c.tests} tests.</p>`;
      return;
    }
    caseIndex = Math.min(caseIndex, list.length - 1);
    const ex = list[caseIndex];
    const expected = ex.output != null ? `<pre class="field-v">${esc(ex.output)}</pre>`
      : ex.image ? `<img src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '<p class="note">See the problem page.</p>';
    $('#cases').innerHTML = `
      <div class="case-pills" role="tablist">${list.map((x, i) => `<button class="pill-btn" type="button" role="tab" data-case="${i}" aria-selected="${i === caseIndex}">Case ${i + 1}</button>`).join('')}</div>
      ${ex.name ? `<p class="case-name">${ex.name}</p>` : ''}
      <div class="field"><div class="field-k">Input</div><pre class="field-v">${esc(ex.input)}</pre></div>
      <div class="field"><div class="field-k">Expected output</div>${expected}</div>
      ${ex.test ? `<div class="field"><div class="field-k">Run only this case (test ${esc(ex.test)})</div>${cmdRow(command(c.id, '-Case ' + ex.test))}</div>` : ''}`;
  }
  $('#cases').addEventListener('click', (e) => {
    const b = e.target.closest('[data-case]');
    if (b) { caseIndex = Number(b.dataset.case); renderCases(BY[current]); }
  });
  const cmdRow = (text) => `<div class="cmd"><code>${esc(text)}</code><button class="btn" type="button" data-copy="${esc(text)}">Copy</button></div>`;

  // ---- results: the learner pastes the checker's output; we read the verdict from it.
  // Every outcome gets a plain sentence saying what happened and what to do next.
  function looksLikeCode(t, c) {
    const s = t.trim();
    if ([code(), ...c.files.flatMap((f) => [f.blank, f.boilerplate])].some((x) => x && x.trim() === s)) return true;
    return !/^Assignment \S+ - /m.test(s)
      && /^\s*(#include\b|#!|import \S|from \S+ import|def \w+\(|(int|void|auto) main\s*\(|fn main\(|func main\(|function \w+\(|\/\/ Assignment \d)/m.test(s);
  }
  function parseOutput(text, c) {
    const t = text.replace(/\r/g, '');
    const head = t.match(/^Assignment (\S+) - /m);
    const run = `<code>${esc(command(c.id))}</code>`;
    let v = null, m;
    if ((m = t.match(/Accepted: (\d+) \/ (\d+) tests passed(?: \((\d+) disputed\))?/))) {
      v = { kind: 'ok', label: 'Accepted', passed: +m[1], total: +m[2], disputed: +(m[3] || 0) };
    } else if ((m = t.match(/Wrong Answer: (\d+) \/ (\d+) tests passed/))) {
      v = { kind: 'bad', label: 'Wrong Answer', passed: +m[1], total: +m[2] };
      v.help = /wrote nothing in any failing test/.test(t)
        ? `Your program ran but didn't write anything. The checker starts it with two file names, the input to read and the output to write; write your answer to the second one.`
        : `Some tests failed. Each one below shows the expected output, what your program wrote, and the requirement it most likely breaks.`;
    } else if (/Compile Error/.test(t)) {
      v = { kind: 'bad', label: 'Compile Error' };
      v.help = /has no main\(\) function/.test(t)
        ? `Your code has no <code>main</code> function, so it can't be built into a program the checker can run. Add a <code>main</code> that reads the input file and writes the output file.`
        : `Your code didn't build, so no tests ran. The compiler's messages are below; fix the first error first, since later ones often follow from it.`;
    } else if ((m = t.match(/Not implemented yet:? ?(\S*)/))) {
      v = { kind: 'warn', label: 'Not implemented yet' };
      v.help = `<code>${esc(m[1] || 'A function')}</code> is still a TODO in your files. Write it, save, and run ${run} again.`;
    } else if (/Not started yet/.test(t)) {
      v = { kind: 'warn', label: 'Not started yet' };
      v.help = /is empty\./.test(t)
        ? `<code>${esc(c.entry)}</code> is empty, so there was nothing to check. Write the program in it, save, and run ${run} again.`
        : /Created this assignment's files/.test(t) ? `The checker created this assignment's files in your project. Write them, save, and run ${run} again.`
        : `<code>${esc(c.entry)}</code> is still the blank starter, so there was nothing to check. Write your program, save, and run ${run} again.`;
    } else if (/^Passed\s*$/m.test(t)) {
      v = { kind: 'ok', label: 'Passed', single: true, help: 'This one test passes. Run all of them to get a verdict for the assignment.' };
    } else if ((m = t.match(/^Failed: (.*)$/m))) {
      v = { kind: 'bad', label: 'Failed', single: true, help: `This one test fails: ${esc(m[1])}` };
    } else if (!t.trim()) {
      v = { kind: 'unknown', label: 'Nothing was pasted', help: 'The box was empty. Copy what the checker printed in the terminal, then paste it here.' };
    } else if (looksLikeCode(t, c)) {
      v = { kind: 'unknown', label: "That's your code, not the result", code: true,
        help: `Submit copied your code so you can put it in your project. Paste it into its file and save, run ${run} in ${esc(DATA.shell)}, then copy what the checker prints and paste that here.` };
    } else if (head) {
      v = { kind: 'unknown', label: 'The output is cut off',
        help: `This starts like the checker's output but has no verdict at the end. Copy everything it printed, down to the last line (it starts with Accepted, Wrong Answer, Compile Error, Not started yet or Not implemented yet).` };
    } else {
      v = { kind: 'unknown', label: "That isn't the checker's output",
        help: `Paste what ${run} prints in the terminal. It starts with “Assignment ${esc(c.id)} - …” and ends with a verdict such as “Accepted: ${c.tests} / ${c.tests} tests passed.”` };
    }
    v.raw = t;
    v.other = head && head[1] !== c.id ? head[1] : null;
    v.reqs = [...t.matchAll(/^ {2}(\S+)\s+(.+?) \.{2,}\s+(\d+) \/ (\d+)/gm)].map((r) => ({ id: r[1], text: r[2], ok: +r[3], n: +r[4] }));
    v.fails = [];
    const lines = t.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const f = lines[i].match(/^\s+x (\S+)\s+(.*)$/);
      if (!f) continue;
      const detail = [];
      while (i + 1 < lines.length && /^ {9,}\S/.test(lines[i + 1])) detail.push(lines[++i].trim());
      v.fails.push({ id: f[1], title: f[2], detail: detail.join('\n') });
    }
    return v;
  }

  function verdictHtml(v, c) {
    let h = `<div class="verdict ${v.kind}"><h2>${esc(v.label)}</h2>`
      + (v.total ? `<span class="sub">${v.passed} / ${v.total} tests passed${v.disputed ? ` · ${v.disputed} disputed` : ''}</span>` : '')
      + `<button class="btn" type="button" id="clear-result">Clear</button></div>`;
    if (v.other) h += `<p class="note warn">This output is from assignment ${esc(v.other)}, not ${esc(c.id)}, so it wasn't counted here. Open assignment ${esc(v.other)} and paste it there.</p>`;
    else if (v.kind === 'ok' && !v.single) h += `<p class="note">The book marked the assignment solved and opened the Editorial tab.</p>`;
    if (v.help) h += `<p class="note">${v.help}</p>`;
    if (v.reqs.length) {
      h += '<div class="req-rows">' + v.reqs.map((r) => `<div class="req-row${r.ok === r.n ? '' : ' fail'}"><span class="rid">${esc(r.id)}</span><span class="rq" title="${esc(r.text)}">${esc(r.text)}</span><span class="cnt">${r.ok} / ${r.n}</span><span class="bar"><i style="width:${r.n ? (r.ok / r.n) * 100 : 0}%"></i></span></div>`).join('') + '</div>';
    }
    h += v.fails.map((f) => `<div class="fail-card"><span class="id">${esc(f.id)}</span><span class="t">${esc(f.title)}</span><pre>${esc(f.detail)}</pre></div>`).join('');
    if (v.kind !== 'ok' && !v.fails.length && !v.reqs.length && v.raw.trim()) {
      const lines = v.raw.trim().split('\n');
      const shown = v.kind === 'unknown' ? lines.slice(0, 12) : lines.slice(-40);
      h += `<div class="field-k">${v.kind === 'unknown' ? 'What you pasted' : 'What the checker printed'}</div>`
        + `<pre class="raw">${esc(shown.join('\n'))}${v.kind === 'unknown' && lines.length > 12 ? '\n…' : ''}</pre>`;
    }
    return h;
  }

  function renderResult(c, notice) {
    if (HOST) {
      $('#result').innerHTML = `<div class="hosted"><p>This copy of the book shows the problems, but it can't run code. Set the
        workbook up on your computer: there, Run and Submit build your project and check it against all ${c.tests} tests.</p>
        <button class="btn green" type="button" data-run-local>How to run it locally</button></div>`;
      return;
    }
    const saved = store.get(c.id + ':result');
    const v = saved ? parseOutput(saved, c) : null;
    const act = lastAction[c.id];
    const runCmd = act && act.kind === 'run' && act.test ? command(c.id, '-Case ' + act.test) : command(c.id);
    const copied = !act ? 'Copy your code and paste it over'
      : act.empty ? 'Nothing to copy yet: the editor is empty. Write your program, then paste it over'
      : act.copied ? 'The book copied your code. Paste it over'
      : 'Copy didn\'t work here, so the book selected the code in the editor. Press Ctrl+C, then paste it over';
    $('#result').innerHTML = (notice ? `<p class="note warn">${notice}</p>` : '')
      + (act && act.warn ? `<p class="note warn">${act.warn}</p>` : '') + (v ? verdictHtml(v, c) : '') + `
      <ol class="steps">
        <li class="step${act && act.copied ? ' done' : ''}"><span>1</span><div><p>${copied} <code>${esc(act && act.path ? act.path : c.entry)}</code>, and the same for this assignment's other files you changed (the tabs above the editor). Skip this step if you write in the project's files with your own editor.</p>
          <div><button class="btn" type="button" id="copy-again">Copy code</button></div></div></li>
        <li class="step"><span>2</span><div><p>Run the checker in ${esc(DATA.shell)}, in <code>${esc(DATA.folder)}</code>:</p>${cmdRow(runCmd)}</div></li>
        <li class="step${v && v.kind !== 'unknown' ? ' done' : ''}"><span>3</span><div><p>Copy what the checker prints in the terminal and paste it here (the result, not your code).</p>
          <textarea class="paste" id="paste" spellcheck="false" placeholder="Paste the checker's output here (Ctrl+V). It starts with “Assignment ${esc(c.id)} - …”"></textarea></div></li>
      </ol>
      <details class="more"><summary>More commands, and what a failure looks like</summary><div>
        ${cmdRow(command(c.id))}${cmdRow(command(c.id, '-Fresh'))}${cmdRow(command(c.id, '-Dispute <test-id> "why"'))}
        <div class="flow" style="margin-top:14px">${c.checking}</div></div></details>`;
  }

  function takeOutput(text) {
    if (!current) return;
    const c = BY[current];
    if (!text.trim()) {
      renderResult(c, 'The box was empty, so there was nothing to read. Copy what the checker printed in the terminal (everything from “Assignment ' + esc(c.id) + ' - …” to the last line), then paste it here.');
      return;
    }
    store.set(c.id + ':result', text);
    if (lastAction[c.id]) lastAction[c.id].warn = null;  // the pasted result says more than the Submit-time warning
    const v = parseOutput(text, c);
    if (v.kind === 'ok' && !v.single && !v.other) setSolved(c.id, true);
    renderResult(c);
    $('#result').scrollTop = 0;
  }
  $('#result').addEventListener('paste', (e) => {
    if (e.target.id !== 'paste') return;
    e.preventDefault();
    takeOutput((e.clipboardData || window.clipboardData).getData('text'));
  });
  $('#result').addEventListener('change', (e) => { if (e.target.id === 'paste') takeOutput(e.target.value); });
  $('#result').addEventListener('click', (e) => {
    if (e.target.closest('#clear-result')) { store.del(current + ':result'); renderResult(BY[current]); }
    if (e.target.closest('#copy-again')) act(lastAction[current] ? lastAction[current].kind : 'submit');
  });

  // ---- solved state
  function setSolved(id, value) {
    if (value) store.set(id + ':solved', '1'); else store.del(id + ':solved');
    if (id === current) { paintSolved(); renderEditorial(BY[id]); }
  }
  function paintSolved() {
    if (!current) return;
    const done = solved(current);
    const mark = $('#solved-mark'), btn = $('#solve-btn');
    if (mark) mark.hidden = !done;
    if (btn) { btn.innerHTML = done ? `${I.check} Solved` : 'Mark as solved'; btn.classList.toggle('done', done); }
    $('#tb-prog').innerHTML = `<b>${CPS.filter((c) => solved(c.id)).length}</b> / ${CPS.length} solved`;
  }

  // ---- editor
  // A assignment's files open as tabs, one CodeMirror document each: the project files it creates
  // or adds to, then its entry program. Files of earlier assignments can be opened from the Files
  // panel. The published book keeps them in this browser; with study, they're your files on disk.
  let cm = null, plainEditor = null, saveTimer = 0;
  const docs = {};  // path -> CodeMirror.Doc
  // A key that would change the code (not moving around, selecting or copying).
  const wantsToType = (e) => !e.ctrlKey && !e.metaKey && !e.altKey
    && (e.key.length === 1 || /^(Enter|Backspace|Delete|Tab)$/.test(e.key));
  function initEditor() {
    const host = $('#editor');
    if (window.CodeMirror) {
      cm = window.CodeMirror(host, {
        lineNumbers: true, matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true, indentWithTabs: false,
        extraKeys: {
