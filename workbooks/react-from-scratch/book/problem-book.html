s use<\/h3>\n<p>The catalog is in <code>harness/catalog.js<\/code> and worth a read. Its components call <code>useState<\/code> with a number or a boolean, and their handlers always pass an updater:<\/p>\n<pre><code>const [count, setCount] = useState(Number(start));\nonClick: () =&gt; setCount((c) =&gt; c + 1)<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>Component<\/th><th>Props<\/th><th>What it renders<\/th><\/tr><\/thead><tbody><tr><td><code>Counter<\/code><\/td><td><code>id<\/code> (default <code>c<\/code>), <code>start<\/code> (default 0)<\/td><td><code>&lt;div id={id}&gt;<\/code>, then <code>&lt;button id=&quot;{id}-inc&quot;&gt;+&lt;/button&gt;<\/code> and <code>&lt;span id=&quot;{id}-count&quot;&gt;<\/code> holding the count as a number. The button adds 1. The counter with id <code>d<\/code> calls its setter twice per click, so it adds 2.<\/td><\/tr><tr><td><code>MultiCounter<\/code><\/td><td>none<\/td><td><code>&lt;div id=&quot;mc&quot;&gt;<\/code> with buttons <code>mc-a<\/code> and <code>mc-b<\/code> (text <code>a<\/code>, <code>b<\/code>) and spans <code>mc-av<\/code> and <code>mc-bv<\/code>. It has two <code>useState(0)<\/code> calls, one per button.<\/td><\/tr><tr><td><code>Toggle<\/code><\/td><td>none<\/td><td><code>&lt;div id=&quot;t&quot;&gt;<\/code> while off and <code>&lt;section id=&quot;t&quot; className=&quot;on&quot;&gt;<\/code> while on, each with <code>&lt;button id=&quot;t-btn&quot;&gt;toggle&lt;/button&gt;<\/code> and <code>&lt;span id=&quot;t-state&quot;&gt;<\/code> reading <code>off<\/code> or <code>on<\/code>. The button flips the state.<\/td><\/tr><tr><td><code>Keeper<\/code><\/td><td>none<\/td><td><code>&lt;p id=&quot;keeper&quot;&gt;<\/code> showing a number from <code>useState(0)<\/code>. The first <code>Keeper<\/code> to render stores its setter in the harness for <code>poke<\/code>.<\/td><\/tr><tr><td><code>Frame<\/code>, <code>FnA<\/code><\/td><td><code>title<\/code> and children / none<\/td><td>From assignment 09: a <code>section<\/code> with an <code>h2<\/code> and the children, and <code>&lt;i&gt;a&lt;/i&gt;<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>What <code>useState<\/code> does<\/h3>\n<p><code>useState(initial)<\/code> goes in <code>src/didact/hooks.js<\/code>, exported on the <code>Didact<\/code> object. A component's function calls it and gets <code>[state, setState]<\/code> back. The setter takes an updater, a function from the previous state to the next (Pombo calls it an action). A plain value in place of an updater is not tested.<\/p>\n<p>State belongs to the fiber of the component that called <code>useState<\/code>. As a component's function runs, each call takes the next slot of that component, counting from 0. No slot is shared between components. If the component was already in the last committed tree, slot n holds what the same call left there on the previous run, pending updates included. A component that was not there (new at its position, or a different type from the one that was there) starts every slot from its <code>initial<\/code>.<\/p>\n<p>Calling <code>setState(updater)<\/code> does nothing to the page. It records the updater and schedules a new render from the root of the tree, the way <code>render<\/code> does. The updater runs during that render, when the component asks for its state again. Several updaters recorded before the next render all run in that one render, oldest first. The setter from the first render stays as good as the latest one: however many renders have passed, an update sent through it must not be lost.<\/p>\n<p>Whose state it is depends on the position in the tree and the type there, or on the key when there is one. Rendering the same tree again keeps it. So does re-rendering from a parent whose props changed, or because a neighbour's setter ran. A prop like <code>start<\/code> is read on the first render only. Move a component to another position (a new sibling in front of it, say) and it is a new component. Two unkeyed counters that trade places trade props, but the state stays at the position. With keys the state follows the key.<\/p>\n<p><code>Toggle<\/code> is the case of a root that changes. Its function returns a <code>div<\/code> while the state is off and a <code>section<\/code> while it is on, so every click replaces the root node and everything below it. The state does not live on that node, which is why the on/off cycle carries on and the new <code>button<\/code> still answers clicks.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test targets one requirement, and a failing run groups its failures under it.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>useState(initial)<\/code> returns <code>[state, setState]<\/code>, and on the first render of a component the state is <code>initial<\/code>.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>After a setter call and the flush that follows, the component has re-rendered with <code>updater(previous state)<\/code> as its state and the dump shows it. The elements that exist before and after are the same nodes.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Each component instance has state of its own: two <code>Counter<\/code>s keep separate counts.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A component may call <code>useState<\/code> several times. The n-th call gets slot n of that component, <code>MultiCounter<\/code>'s two buttons change two different numbers, and a component never reads another component's slots.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Updaters queued before the next render all run, in call order, in one render (<code>Counter<\/code> <code>d<\/code>: +2 per click).<\/span><\/li><li><span class=\"rid\">R6<\/span><span>State survives a re-render caused by <code>render<\/code> of a new tree that keeps the component's position and type, and one caused by another component's setter.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>A component keeps its state when the fiber at its position (or with its key) has the same type, and starts from <code>initial<\/code> otherwise.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>A setter obtained in an earlier render keeps working: <code>poke<\/code> after any number of renders adds 1.<\/span><\/li><li><span class=\"rid\">R9<\/span><span>A component whose root tag changes (<code>Toggle<\/code>) keeps its state, and the new nodes respond to clicks.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Longer sessions mixing all of it, among them seeded random ones.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>The longest scenario is 54 lines and no tree has more than 8 components. Texts are single words or numbers. That makes 46 tests: per-requirement cases, two long scripted sessions, and five random sessions drawn from a seed (a fresh seed gives five new sessions), each with at most a few hundred lines of output. A correct solution runs a test in well under a second. The limit is 10 seconds.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/hooks.js","text":"// ---- Assignment 10: useState ----\n// State lives in a hook object that every render of the component finds again by position,\n// so it survives re-renders, and so does the setter that points at it.\nimport { render } from './render.js';\nimport { state } from './state.js';\n\n// The hook at the current position of the component being rendered: the object its previous\n// render left there, or a new one the first time.\nfunction nextHook(create) {\n  const hook = state.wipFiber.alternate?.hooks[state.hookIndex] ?? create();\n  state.wipFiber.hooks.push(hook);\n  state.hookIndex++;\n  return hook;\n}\n\nexport function useState(initial) {\n  const hook = nextHook(() => {\n    const hook = { state: initial, queue: [] };\n    hook.setState = (update) => {\n      hook.queue.push(update);\n      rerender();\n    };\n    return hook;\n  });\n  // Apply what was queued since the last render, oldest first.\n  for (const update of hook.queue.splice(0)) hook.state = update(hook.state);\n  return [hook.state, hook.setState];\n}\n\n// Starts again from the root, with the element it was last asked to draw.\nfunction rerender() {\n  const root = state.wipRoot ?? state.currentRoot;\n  render(root.props.children[0], root.dom);\n}\n"},{"path":"src/didact/state.js","text":"// ---- Assignment 10: the component being rendered ----\nexport const state = {\n  nextUnitOfWork: null,\n  wipRoot: null,\n  currentRoot: null,\n  deletions: [],\n  wipFiber: null, // the function component being rendered: its hooks live on it\n  hookIndex: 0, // which hook of that component the next useState or useEffect call is\n};\n"},{"path":"src/didact/render.js","text":"// ---- Assignment 04: the work loop ----\n// render() only schedules work. Whenever the browser is idle, workLoop() builds the tree of\n// fibers one unit of work at a time, so it can stop when the browser has something else to do.\nimport { createDom } from './dom.js';\nimport { reconcileChildren } from './reconcile.js';\nimport { state } from './state.js';\n\n// ---- Assignment 05: commit when the last unit is done ----\nimport { commitRoot } from './commit.js';\n\n// ---- Assignment 06: schedule the work against the tree on screen ----\nexport function render(element, container) {\n  state.deletions = [];\n  state.wipRoot = { dom: container, props: { children: [element] }, alternate: state.currentRoot };\n  state.nextUnitOfWork = state.wipRoot;\n}\n\n// ---- Assignment 05: commit in the same period as the last unit ----\nfunction workLoop(deadline) {\n  try {\n    let shouldYield = false;\n    while (state.nextUnitOfWork && !shouldYield) {\n      state.nextUnitOfWork = performUnitOfWork(state.nextUnitOfWork);\n      shouldYield = deadline.timeRemaining() < 1;\n    }\n    if (!state.nextUnitOfWork && state.wipRoot) commitRoot();\n  } finally {\n    requestIdleCallback(workLoop);\n  }\n}\n\n// ---- Assignment 09: function components ----\nfunction performUnitOfWork(fiber) {\n  if (typeof fiber.type === 'function') updateFunctionComponent(fiber);\n  else updateHostComponent(fiber);\n  return nextFiber(fiber);\n}\n\nfunction updateHostComponent(fiber) {\n  if (!fiber.dom) fiber.dom = createDom(fiber);\n  reconcileChildren(fiber, fiber.props.children);\n}\n\n// ---- Assignment 10: hooks belong to the fiber being rendered ----\nfunction updateFunctionComponent(fiber) {\n  state.wipFiber = fiber;\n  state.hookIndex = 0;\n  fiber.hooks = [];\n  reconcileChildren(fiber, [fiber.type(fiber.props)]);\n}\n\n// ---- Assignment 04: which fiber is next ----\n// Depth first: the child, else the sibling, else the nearest ancestor's sibling.\nfunction nextFiber(fiber) {\n  if (fiber.child) return fiber.child;\n  for (let next = fiber; next; next = next.parent) {\n    if (next.sibling) return next.sibling;\n  }\n  return null;\n}\n\nrequestIdleCallback(workLoop);\n"},{"path":"src/didact/index.js","text":"// ---- Assignment 10: useState joins the library ----\nimport { createElement } from './createElement.js';\nimport { useState } from './hooks.js';\nimport { render } from './render.js';\n\nconst Didact = { createElement, render, useState };\n\nexport default Didact;\nexport { createElement, render, useState };\n"},{"path":"assignments/assignment_10_use_state.js","text":"// Assignment 10: the checker runs this program as `node assignments/assignment_10_use_state.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/createElement.js","src/didact/dom.js","src/didact/reconcile.js","src/didact/commit.js"],"proof":{"passed":46,"total":46,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>Everything you need is below. If you want Pombo's version first, read the start of <a href=\"https://pomb.us/build-your-own-react/#step-viii-hooks\" target=\"_blank\" rel=\"noopener\">Step VIII: Hooks<\/a>: the four paragraphs that turn the example into a click counter. Stop at \"We need to initialize some global variables\". After that comes the author's code, and writing it is your job.<\/p>","readTitle":"Read in the blog first","context":"<p>Until now a function component began from nothing on every render, which is why a counter could not count. That ends here, with a memory that lives on each component's fiber. <code>hooks.js<\/code> is new and holds <code>useState<\/code>, the shared <code>wipFiber<\/code> and <code>hookIndex<\/code> go in <code>state.js<\/code>, and <code>render.js<\/code> and <code>index.js<\/code> get a few lines of wiring.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-viii-hooks\" target=\"_blank\" rel=\"noopener\">Step VIII: Hooks<\/a><\/li><li>Wim Jongeneel, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>: <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.3%20Updating%20a%20component\" target=\"_blank\" rel=\"noopener\">5.3 Updating a component<\/a> and <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.4%20Updating%20components%20with%20setState\" target=\"_blank\" rel=\"noopener\">5.4 Updating components with setState<\/a>, compared in \"After you pass\"<\/li><li>React documentation: <a href=\"https://react.dev/reference/react/useState\" target=\"_blank\" rel=\"noopener\">useState<\/a>, <a href=\"https://react.dev/learn/queueing-a-series-of-state-updates\" target=\"_blank\" rel=\"noopener\">Queueing a series of state updates<\/a>, <a href=\"https://react.dev/learn/preserving-and-resetting-state\" target=\"_blank\" rel=\"noopener\">Preserving and resetting state<\/a> and the <a href=\"https://react.dev/reference/rules/rules-of-hooks\" target=\"_blank\" rel=\"noopener\">Rules of Hooks<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 10                          every test, grouped by requirement\n.\\check 10 -Case 10-R8-poke-once    one test with its full input, the expected dumps and yours\n.\\check 10 -Fresh                   five new random sessions, to try your code on scenarios you have not seen\n.\\check 10 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>A setter that only works for the render that made it fails like this:<\/p>\n<pre><code>  R8  A setter from an earlier render still works: nothing is lost when... .    1 / 4   FAILED\n      x 10-R8-poke-four-times  Keeper, four pokes, a dump after each\n          text[0]: expected (depth=1, value=&quot;2&quot;), got (depth=1, value=&quot;1&quot;) - differs in value  (in `dump 2`)\n          likely cause: R8 - A setter from an earlier render still works: nothing is lost when it is called later\n          expected values from: React 19.3.1 (react-dom 19.3.1) on jsdom 30.1.3, run by tools/oracle with the harness catalog\n          reproduce: py -P tools/run_js.py build/bugs/10/stale-setter 10 build/cases/10/10-R8-poke-four-times.in build/cases/10/10-R8-poke-four-times.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Think about where a counter's number can live between two runs of its function. The function's locals are gone once it returns. The DOM is downstream of the number: the span is written from it and never read back. What survives a render is the fiber tree, and the previous fiber for the same component can be reached from the new one.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Each function-component fiber carries a list of hook records, emptied at the start of every run of its function. <code>useState<\/code> takes the next slot, looks at the same slot on the old fiber and reuses the record found there, or builds a new one from <code>initial<\/code> when there is none. A record holds the state and a queue of updaters, which the setter fills. Share one record per slot across renders. Then the next render reads the record the old fiber had, and the setter you handed out earlier still points at it. The setter schedules a render from the root, on the tree you last committed. When <code>useState<\/code> reads a slot again, it runs the queue over the state before returning it. Set <code>wipFiber<\/code> and <code>hookIndex<\/code> before calling the component function; <code>useState<\/code> has no other way to find out who is calling.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Reset the hook index to 0 for every component. One reset per render sends two <code>Counter<\/code>s side by side into each other's slots.<\/li><li>A setter closes over the record of the render that made it. If the next render builds a fresh record, whatever was queued on the old one is never read. Either every render shares the one record, or updates have another way to reach the record a later render will read.<\/li><li>Empty the queue after applying it. Apply it twice and every update counts twice.<\/li><li>Apply every queued updater, in order. A handler that calls the setter twice has to move the state twice.<\/li><li>A <code>useState<\/code> that starts from <code>initial<\/code> on every render looks right until the first click.<\/li><li>Several setter calls before the next render restart the same render. Keep the tree you were about to commit when that happens.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>before calling a component function:\n    state.wipFiber = fiber\n    state.hookIndex = 0\n    fiber.hooks = []\n\nuseState(initial):\n    slot = wipFiber.alternate?.hooks[hookIndex]\n    if slot is missing:\n        slot = { state: initial, queue: [] }\n        slot.setState = updater =&gt; { slot.queue.push(updater); schedule a render from the root }\n    wipFiber.hooks.push(slot)\n    hookIndex += 1\n    for each updater in slot.queue, oldest first: slot.state = updater(slot.state)\n    empty slot.queue\n    return [slot.state, slot.setState]\n\nschedule a render from the root:\n    render(the root&#x27;s element again, the root&#x27;s container)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a root that changes tag","test":"10-R9-toggle-once","input":"tree t <Toggle/>\nrender t\nflush\ndump\nclick #t-btn\ndump","output":"dump 1\nnode 0 a div \"id=t\"\nnode 1 b button \"id=t-btn\"\ntext 2 \"toggle\"\nnode 1 c span \"id=t-state\"\ntext 2 \"off\"\ndump 2\nnode 0 d section \"className=on id=t\"\nnode 1 e button \"id=t-btn\"\ntext 2 \"toggle\"\nnode 1 f span \"id=t-state\"\ntext 2 \"on\"","image":null,"explain":"<p>Dump 2 has the labels <code>d<\/code>, <code>e<\/code> and <code>f<\/code>. The <code>div<\/code> became a <code>section<\/code>, a different type and so a different node, and all three old nodes are gone with three new ones in their place. The component still says <code>on<\/code>. Its state survived the swap, and that is why this case sits with the state requirements.<\/p>"},{"label":"Example 2","name":"two counters trade places","test":"10-R7-swap-positions","input":"tree a <div><Counter id=a/><Counter id=b/><\/div>\ntree b <div><Counter id=b/><Counter id=a/><\/div>\nrender a\nflush\nclick #a-inc\nclick #a-inc\nclick #a-inc\nclick #b-inc\ndump\nrender b\nflush\ndump\nclick #b-inc\ndump","output":"dump 1\nnode 0 a div \"\"\nnode 1 b div \"id=a\"\nnode 2 c button \"id=a-inc\"\ntext 3 \"+\"\nnode 2 d span \"id=a-count\"\ntext 3 \"3\"\nnode 1 e div \"id=b\"\nnode 2 f button \"id=b-inc\"\ntext 3 \"+\"\nnode 2 g span \"id=b-count\"\ntext 3 \"1\"\ndump 2\nnode 0 a div \"\"\nnode 1 b div \"id=b\"\nnode 2 c button \"id=b-inc\"\ntext 3 \"+\"\nnode 2 d span \"id=b-count\"\ntext 3 \"3\"\nnode 1 e div \"id=a\"\nnode 2 f button \"id=a-inc\"\ntext 3 \"+\"\nnode 2 g span \"id=a-count\"\ntext 3 \"1\"\ndump 3\nnode 0 a div \"\"\nnode 1 b div \"id=b\"\nnode 2 c button \"id=b-inc\"\ntext 3 \"+\"\nnode 2 d span \"id=b-count\"\ntext 3 \"4\"\nnode 1 e div \"id=a\"\nnode 2 f button \"id=a-inc\"\ntext 3 \"+\"\nnode 2 g span \"id=a-count\"\ntext 3 \"1\"","image":null,"explain":"<p>The only thing telling the two <code>Counter<\/code>s apart is their <code>id<\/code>, and <code>id<\/code> is an ordinary prop. The state at the first position is still 3, so after the swap the counter with id <code>b<\/code> shows 3 and the one with id <code>a<\/code> shows 1. Labels <code>b<\/code> to <code>g<\/code> stay put between dumps 1 and 2. Same nodes, rewritten in place. The last click checks that the handlers followed their elements, since <code>#b-inc<\/code> is now the first counter's button.<\/p>"},{"label":"Example 3","name":"a setter from the first render","test":"10-R8-poke-four-times","input":"tree t <Keeper/>\nrender t\nflush\npoke\ndump\npoke\ndump\npoke\ndump\npoke\ndump","output":"dump 1\nnode 0 a p \"id=keeper\"\ntext 1 \"1\"\ndump 2\nnode 0 a p \"id=keeper\"\ntext 1 \"2\"\ndump 3\nnode 0 a p \"id=keeper\"\ntext 1 \"3\"\ndump 4\nnode 0 a p \"id=keeper\"\ntext 1 \"4\"","image":null,"explain":"<p>Every <code>poke<\/code> calls the setter from the first render, and every poke triggers a render. The first one happens to use the latest setter. By the second it is a render old, by the third two renders, by the fourth three. The update has to get through each time.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p>In <a href=\"https://pomb.us/build-your-own-react/#step-viii-hooks\" target=\"_blank\" rel=\"noopener\">Pombo's hooks<\/a>, <code>updateFunctionComponent<\/code> sets <code>wipFiber<\/code>, empties the fiber's <code>hooks<\/code> array and resets <code>hookIndex<\/code> before it calls the component. <code>useState<\/code> then finds <code>oldHook<\/code> at <code>wipFiber.alternate.hooks[hookIndex]<\/code>, copies its state into a new hook with a new queue, replays the old queue's actions onto it, and returns that state with a <code>setState<\/code> that pushes onto that hook's queue.<\/p>\n<p>The post builds a new hook object on every render, and each <code>setState<\/code> closes over the hook from the render that made it. Send an update through a setter from an earlier render and it lands in a queue that no later render reads. Pombo's code drops it. That is R8: poke a <code>Keeper<\/code> four times through its first setter and the post's code shows 1 after every poke. The first update arrives, the other three vanish. React hands out one stable setter, and R8 wants the same from yours.<\/p>\n<p>Pombo's code differs from React in three smaller ways, none of them tested. Its <code>setState<\/code> throws while <code>currentRoot<\/code> is still <code>null<\/code>, since it builds the new root from the committed tree. It accepts functions only, and a plain value breaks the next render, where React takes it as the new state. And <code>useState<\/code> stores <code>initial<\/code> as given, so a function passed as the initial value is kept rather than called.<\/p>\n<p>Two failures in the post's code stop its work loop for good. One is the plain value above, which raises in the next render. The other is removing a component that returned <code>null<\/code>: the component renders with a null child fiber, and <code>commitDeletion<\/code> later reads <code>dom<\/code> from that null. <code>workLoop<\/code> requests its next idle callback in its last statement, so an exception inside a unit or a commit leaves nothing registered, and every later <code>render<\/code> or <code>setState<\/code> schedules work that never runs. Neither is tested.<\/p>\n<p>Jongeneel's <code>Component<\/code> keeps its state on a class instance. Its <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.4%20Updating%20components%20with%20setState\" target=\"_blank\" rel=\"noopener\"><code>setState<\/code><\/a> applies the updater, renders, diffs and patches the DOM before it returns, so three calls in a handler render three times, where your <code>useState<\/code> and React render once. His <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.3%20Updating%20a%20component\" target=\"_blank\" rel=\"noopener\"><code>getUpdateDiff<\/code><\/a> runs into the situation <code>Toggle<\/code> creates, a component whose root element is replaced. The callback meant to point <code>mountedElement<\/code> at the new element is written in the post as an arrow function that nothing assigns or calls. The component keeps the old, detached node, and every later <code>setState<\/code> patches a node that is no longer in the page. The post's tag comparison also never reports a changed tag, so in the post as written this happens when a root turns from an element into text. The repository fixes both, and R9 asks for the repository's behaviour: after a root changes, the next click reaches the live node.<\/p>\n<p><a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> lists where React 19 departs from the posts. The rows to read for this assignment are \"Setter identity\", \"Updater argument\" and \"Batching\".<\/p>"},"need":{"new":[{"id":"react-state","title":"useState and the rules of hooks","note":"what a hook is, why one component can call <code>useState<\/code> several times, and why the calls must come in the same order on every render.","group":"React and the ideas in the posts","from":"10"},{"id":"react-batching","title":"Several updates, one render","note":"the counter with id <code>d<\/code> queues two updaters per click, and both have to land in a single render.","group":"React and the ideas in the posts","from":"10"}],"earlier":[{"id":"js-functions-closures","title":"Arrow functions and closures","note":"a setter closes over the state it belongs to, and the tests call it long after the render that made it.","group":"JavaScript","from":"02"},{"id":"react-reconciliation","title":"Reconciliation by type and position","note":"the pairing of an old fiber with a new one used to decide which DOM node survives. It now decides whose state a component gets as well.","group":"React and the ideas in the posts","from":"06"},{"id":"react-keys","title":"Keys","note":"counters with keys keep their counts when the list is reordered.","group":"React and the ideas in the posts","from":"07"},{"id":"js-arrays","title":"Array methods: map, filter, forEach, find, includes, slice","note":"","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"},{"id":"js-global-state","title":"Module-level state and why <code>state.js<\/code> is an object","note":"","from":"04"},{"id":"react-function-components","title":"Function components","note":"","from":"09"}]}},{"id":"11","num":"11","title":"useEffect","difficulty":"Hard","tests":48,"problem":"problems/11-use-effect.md","entry":"solutions/assignments/assignment_11_use_effect.js","files":[{"path":"solutions/assignments/assignment_11_use_effect.js","role":"entry","purpose":null,"job":"Send your `Didact` object through `runScenarioFile`. The scenario mounts, updates and removes catalog components that log from their effects.","blank":"// ======================================================================================\n// Assignment 11: useEffect\n// Problem: problems/11-use-effect.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 11 as `python -P tools/run_js.py\n//   solutions 11 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 11` (`./check.sh 11` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Send your `Didact` object through `runScenarioFile`. The scenario mounts, updates and\n//   removes catalog components that log from their effects.\n//\n// The other files of this assignment:\n//   It adds to src/didact/hooks.js, which you started earlier: Write `useEffect(effect,\n//   deps)`: store the effect on its fiber, along with its dependencies and whatever\n//   cleanup function the effect returned.\n//   It adds to src/didact/commit.js, which you started earlier: Once the DOM is up to\n//   date, run the cleanups of effects that run again, then the effects that are new or\n//   whose dependencies changed. A removed component's cleanups run too.\n//   It adds to src/didact/index.js, which you started earlier: Export `useEffect` on the\n//   `Didact` object next to `useState`.\n//   Earlier files you can use: src/didact/render.js and src/didact/state.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as hooks from '../src/didact/hooks.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 11: useEffect\n// Problem: problems/11-use-effect.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 11 as `python -P tools/run_js.py\n//   solutions 11 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 11` (`./check.sh 11` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/didact/hooks.js, which you started earlier: Write `useEffect(effect,\n//   deps)`: store the effect on its fiber, along with its dependencies and whatever\n//   cleanup function the effect returned.\n//   It adds to src/didact/commit.js, which you started earlier: Once the DOM is up to\n//   date, run the cleanups of effects that run again, then the effects that are new or\n//   whose dependencies changed. A removed component's cleanups run too.\n//   It adds to src/didact/index.js, which you started earlier: Export `useEffect` on the\n//   `Didact` object next to `useState`.\n//   Earlier files you can use: src/didact/render.js and src/didact/state.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as hooks from '../src/didact/hooks.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"},{"path":"solutions/src/didact/hooks.js","role":"adds","purpose":"State and effects that belong to a component and outlive its re-renders, stored on the fiber: `useState` and `useEffect`.","job":"Write `useEffect(effect, deps)`: store the effect on its fiber, along with its dependencies and whatever cleanup function the effect returned.","blank":"// ======================================================================================\n// Assignment 10: useState\n// Problem: problems/10-use-state.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   State and effects that belong to a component and outlive its re-renders, stored on the\n//   fiber: `useState` and `useEffect`. Later, assignment 11 adds to this file.\n//\n// Your job:\n//   Give function components memory with `useState(initial)`, keeping the state on the\n//   fiber and finding it again on the next render by hook index. The setter takes an\n//   updater function, queues it and schedules a new render from the root.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"10"},{"path":"solutions/src/didact/commit.js","role":"adds","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing.","job":"Once the DOM is up to date, run the cleanups of effects that run again, then the effects that are new or whose dependencies changed. A removed component's cleanups run too.","blank":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Applies a finished fiber tree to the DOM in a single pass, which keeps half a render\n//   from ever showing. Later, assignments 06, 08, 09 and 11 add to this file.\n//\n// Your job:\n//   Define `commitRoot` and `commitWork`. Once the last unit is done, they append the\n//   finished tree to the container in a single pass.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"05"},{"path":"solutions/src/didact/index.js","role":"adds","purpose":"What an app imports: one `Didact` object carrying `createElement` and `render`, with the hooks joining it as you write them.","job":"Export `useEffect` on the `Didact` object next to `useState`.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   What an app imports: one `Didact` object carrying `createElement` and `render`, with\n//   the hooks joining it as you write them. Later, assignments 10 and 11 add to this file.\n//\n// Your job:\n//   Export a `Didact` object carrying `createElement` and `render`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"}],"buildsOn":[{"path":"solutions/src/didact/render.js","owner":"04","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units."},{"path":"solutions/src/didact/state.js","owner":"04","purpose":"Shared bookkeeping in one object: what to work on next, and the tree under construction. It has to be an object, because an ES module can't share a variable for other modules to reassign."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-functions-closures\">arrow functions and closures<\/a>","<a href=\"#primer/js-equality\">equality and <code>Object.is<\/code><\/a>","<a href=\"#primer/js-arrays\">array methods<\/a>"],"text":["arrow functions and closures","equality and Object.is","array methods"]},{"label":"Library","items":["<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/react-effects\">useEffect: after the DOM is updated<\/a>","<a href=\"#primer/react-render-commit\">the render phase and the commit phase<\/a>","<a href=\"#primer/react-state\">useState and the rules of hooks<\/a>","<a href=\"#primer/react-reconciliation\">reconciliation by type and position<\/a>"],"text":["useEffect: after the DOM is updated","the render phase and the commit phase","useState and the rules of hooks","reconciliation by type and position"]}],"body":"<div class=\"d-problem flow\"><p>Add <code>useEffect(effect, deps)<\/code> to <code>Didact<\/code>. Some catalog components write a line to the run's log from their effects and cleanups. A scenario mounts, updates and removes them and reads the log after each step, and your log is checked against the one React 19 produces.<\/p>\n<h3>Input<\/h3>\n<p>The entry program is the one you know, started with <code>node assignments/assignment_11_use_effect.js &lt;input-file&gt; &lt;output-file&gt;<\/code>: <code>../harness/env.js<\/code> imported first (it sets up <code>document<\/code> and a controllable <code>requestIdleCallback<\/code> before your library loads), then <code>Didact<\/code> from <code>../src/didact/index.js<\/code>, then a last line <code>await runScenarioFile(process.argv[2], process.argv[3], Didact)<\/code> that runs the scenario on your library and writes the output file. The Boilerplate ships it finished. Blank start: write those lines. These are the scenario lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Names a tree with one root element. A capitalised tag such as <code>&lt;LoggerDeps name=x dep=1/&gt;<\/code> is a catalog component, and attribute values are strings. Redefining a name is allowed.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Calls <code>Didact.render(tree, container)<\/code>. No work happens yet.<\/td><\/tr><tr><td><code>idle &lt;k&gt;<\/code><\/td><td>Runs one idle period in which your work loop may do at most <code>k<\/code> units of work, then prints <code>idle &lt;units done&gt;<\/code>.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs idle periods until no work is left.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>A bubbling <code>click<\/code> on the element with that id, then a flush.<\/td><\/tr><tr><td><code>log<\/code><\/td><td>Prints the log entries recorded since the previous <code>log<\/code>.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the page.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Between one <code>render<\/code> and the next there is always a <code>flush<\/code>.<\/p>\n<h3>Output<\/h3>\n<p>Every entry recorded since the last <code>log<\/code> comes out as one line, in the order recorded. A stretch with no entries prints nothing:<\/p>\n<pre><code>log &lt;text&gt;<\/code><\/pre>\n<p><code>dump<\/code> prints <code>dump &lt;n&gt;<\/code> and the page in the usual format: <code>node &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;<\/code> for each element, <code>text &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code> for each run of text, parents first, container left out. A label is a letter handed to an element by the first dump that shows it and kept after that, so a letter identifies a node. <code>idle &lt;k&gt;<\/code> prints <code>idle &lt;units&gt;<\/code>, the number of units your loop got through in that period: <code>k<\/code> when at least <code>k<\/code> units are left, fewer when the work runs out.<\/p>\n<p>Most scenarios finish each step with <code>log<\/code> and <code>dump<\/code>. The dump marks the boundary between two steps, and a line that shows up one step late fails the test.<\/p>\n<h3>The components the scenarios use<\/h3>\n<p>Also in <code>harness/catalog.js<\/code>. Every effect writes the text shown here to the log, and names are single words.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Component<\/th><th>Props<\/th><th>Renders<\/th><th>Effect<\/th><\/tr><\/thead><tbody><tr><td><code>Logger<\/code><\/td><td><code>name<\/code><\/td><td><code>&lt;em&gt;{name}&lt;/em&gt;<\/code><\/td><td>deps <code>[]<\/code>. Logs <code>mount &lt;name&gt;<\/code>; the cleanup logs <code>cleanup &lt;name&gt;<\/code>.<\/td><\/tr><tr><td><code>LoggerDeps<\/code><\/td><td><code>name<\/code>, <code>dep<\/code><\/td><td><code>&lt;em&gt;{name}:{dep}&lt;/em&gt;<\/code><\/td><td>deps <code>[dep]<\/code>. Logs <code>run &lt;name&gt; &lt;dep&gt;<\/code>; the cleanup logs <code>clean &lt;name&gt; &lt;dep&gt;<\/code>.<\/td><\/tr><tr><td><code>LoggerEvery<\/code><\/td><td><code>name<\/code><\/td><td><code>&lt;div&gt;&lt;em&gt;{name}:{count}&lt;/em&gt;&lt;button id=&quot;{name}-btn&quot;&gt;bump&lt;/button&gt;&lt;/div&gt;<\/code><\/td><td>no deps array. Logs <code>run &lt;name&gt;<\/code>; the cleanup logs <code>clean &lt;name&gt;<\/code>. The button adds 1 to a <code>useState<\/code> counter.<\/td><\/tr><tr><td><code>Outer<\/code><\/td><td><code>name<\/code><\/td><td><code>&lt;div&gt;<\/code> holding <code>&lt;Logger name=&quot;{name}.inner&quot;/&gt;<\/code><\/td><td>deps <code>[]<\/code>. Logs <code>mount &lt;name&gt;<\/code>; the cleanup logs <code>cleanup &lt;name&gt;<\/code>.<\/td><\/tr><tr><td><code>Frame<\/code>, <code>Counter<\/code><\/td><td>as before<\/td><td>as before<\/td><td>none. <code>Counter<\/code>'s button has the id <code>c-inc<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A tree never holds more than one <code>LoggerEvery<\/code>.<\/p>\n<h3>What <code>useEffect<\/code> does<\/h3>\n<p>Write <code>useEffect(effect, deps)<\/code> in <code>src/didact/hooks.js<\/code>, next to <code>useState<\/code>, and export it on the <code>Didact<\/code> object. <code>effect<\/code> is a function that may return another function, the cleanup. <code>deps<\/code> is an array or is left out (<code>undefined<\/code>, and <code>null<\/code> counts the same). No array means the effect is due on every render. The catalog passes an array or nothing, and an array never changes length between two renders of a component, so a change of length is untested. Comparing item by item up to the shorter length is fine, and so is treating a different length as a change.<\/p>\n<p>While a component's function runs, no effect runs. The function registers it and that is all. Once the render phase is over and the commit has put the new tree on the page, the effects that are due run, still inside the same flush. An effect is due when its component mounts, when <code>deps<\/code> is <code>undefined<\/code>, or when <code>deps<\/code> differs from the deps of the previous run. The comparison goes item by item with <code>Object.is<\/code>, not array against array, because every render makes a new array. An effect that is not due neither runs nor cleans up. A cleanup runs before the effect that replaces it and when the component is removed, in the sequence given under \"The order\" below.<\/p>\n<p>An effect holds on to the function and the cleanup from the render that ran it. If a later render brings new props but unchanged deps, nothing happens, and the cleanup that runs on removal still reports the old props.<\/p>\n<h3>The order<\/h3>\n<p>These are React 19.3.1's orders, and the tests pin them:<\/p>\n<ol><li>Mount, post-order: the effects of a component's children run before the component's own, and siblings run left to right. <code>Outer<\/code> mounts <code>name.inner<\/code> first, then <code>name<\/code>.<\/li><li>Removal, pre-order: when a subtree is removed, a component's cleanup runs before the cleanups of the components below it, and siblings run left to right. <code>Outer<\/code> cleans <code>name<\/code> first, then <code>name.inner<\/code>. The cleanup runs for every component in the subtree, however deep, also below plain elements.<\/li><li>A commit that keeps its components and re-runs some effects: every cleanup of the commit first, then every effect. Within each group siblings go left to right.<\/li><li>A commit that replaces a subtree and mounts another one: every cleanup of what goes away runs before any effect of what is new.<\/li><\/ol>\n<p>No test mixes a removal and a re-run in one commit, so how the cleanups of the removed subtree interleave with the cleanups of re-running effects is untested. No test re-runs the effects of a component and of one of its descendants together, and none mounts a component in a commit that also re-runs another effect. The order in those situations is yours to pick. When a component and one of its descendants re-run together, React runs the descendants' cleanups and effects first.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>A test belongs to one requirement. The report shows how many of each group pass and names the requirement most failures point at.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>An effect runs once per mount, and only after the render that created it has been committed: while units of work are still left, nothing has been logged and the page is empty.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>An effect with <code>[]<\/code> runs once. Rendering again, new props, a changed parent and a click elsewhere do not run it again.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>An effect with a deps array runs again only when an item of the array differs from the last run's, and the cleanup of that last run goes first. The same values in a new array change nothing.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>An effect without a deps array runs after every render of its component, the previous cleanup first.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Removing a subtree runs the cleanups of every component in it, a parent's before its children's, siblings in order.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>On mount, children's effects run before their parent's, and siblings' effects in order.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>In one commit every cleanup runs before any effect.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>An effect and its cleanup are the ones from the render that ran the effect: a new prop that does not change the deps changes neither.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Longer sessions mixing all of it, among them seeded random ones.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>The 48 tests are each requirement's cases, two scripted sessions and five seeded random sessions (<code>-Fresh<\/code> draws five new). The longest scenario has 87 lines, no tree has more than 5 components, and the dumps are small, while a random session mixes prop changes, clicks, replacing the root, removing everything, and adding or removing items at the end of the list. The limit is 10 seconds a test, and a correct solution needs far less.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/hooks.js","text":"// ---- Assignment 10: useState ----\n// State lives in a hook object that every render of the component finds again by position,\n// so it survives re-renders, and so does the setter that points at it.\nimport { render } from './render.js';\nimport { state } from './state.js';\n\n// The hook at the current position of the component being rendered: the object its previous\n// render left there, or a new one the first time.\nfunction nextHook(create) {\n  const hook = state.wipFiber.alternate?.hooks[state.hookIndex] ?? create();\n  state.wipFiber.hooks.push(hook);\n  state.hookIndex++;\n  return hook;\n}\n\nexport function useState(initial) {\n  const hook = nextHook(() => {\n    const hook = { state: initial, queue: [] };\n    hook.setState = (update) => {\n      hook.queue.push(update);\n      rerender();\n    };\n    return hook;\n  });\n  // Apply what was queued since the last render, oldest first.\n  for (const update of hook.queue.splice(0)) hook.state = update(hook.state);\n  return [hook.state, hook.setState];\n}\n\n// Starts again from the root, with the element it was last asked to draw.\nfunction rerender() {\n  const root = state.wipRoot ?? state.currentRoot;\n  render(root.props.children[0], root.dom);\n}\n\n// ---- Assignment 11: useEffect ----\n// The hook keeps the latest effect and its dependencies; the commit decides whether it is due.\nexport function useEffect(effect, deps) {\n  const hook = nextHook(() => ({ deps: undefined, cleanup: undefined }));\n  hook.effect = effect;\n  hook.nextDeps = deps;\n  hook.due = depsChanged(hook.deps, deps);\n}\n\n// `prev` are the dependencies of the last run. Without a list, on either side, the effect runs every time.\nfunction depsChanged(prev, next) {\n  return !prev || !next || prev.length !== next.length || next.some((dep, i) => !Object.is(dep, prev[i]));\n}\n"},{"path":"src/didact/commit.js","text":"// ---- Assignment 05: commit the finished tree in one pass ----\n// The render phase builds fibers and DOM nodes but leaves the page alone; this applies the result.\nimport { state } from './state.js';\n\n// ---- Assignment 06: update props of kept nodes ----\nimport { updateDom } from './dom.js';\n\n// ---- Assignment 11: effects run after the commit ----\nexport function commitRoot() {\n  const { deletions, wipRoot } = state;\n  deletions.forEach(commitDeletion);\n  commitWork(wipRoot);\n  state.currentRoot = wipRoot;\n  state.wipRoot = null;\n  // An effect can start a new render, so the tree has to count as committed before they run.\n  runEffects(deletions, wipRoot);\n}\n\n// ---- Assignment 09: fibers without a DOM node ----\nfunction commitWork(fiber) {\n  if (fiber.effectTag === 'PLACEMENT') place(fiber);\n  if (fiber.dom && fiber.alternate) updateDom(fiber.dom, fiber.alternate.props, fiber.props);\n  if (fiber.alternate) fiber.alternate.alternate = null;\n  for (let child = fiber.child; child; child = child.sibling) commitWork(child);\n}\n\nfunction commitDeletion(fiber) {\n  parentDom(fiber).removeChild(domOf(fiber));\n}\n\n// A new function component and its first node are both tagged, so the second call finds the node\n// already where it belongs.\nfunction place(fiber) {\n  const parent = parentDom(fiber);\n  const dom = domOf(fiber);\n  const before = nextStableDom(fiber);\n  if (dom.parentNode !== parent || dom.nextSibling !== before) parent.insertBefore(dom, before);\n}\n\n// A function component has no node: its DOM parent is the nearest ancestor that has one ...\nfunction parentDom(fiber) {\n  let parent = fiber.parent;\n  while (!parent.dom) parent = parent.parent;\n  return parent.dom;\n}\n\n// ... and its own node is the first one under it.\nfunction domOf(fiber) {\n  while (!fiber.dom) fiber = fiber.child;\n  return fiber.dom;\n}\n\n// ---- Assignment 09: where a placed node goes ----\nfunction nextStableDom(fiber) {\n  // A function component without siblings of its own shares its DOM parent's children with the\n  // siblings of the component above it, so look there next.\n  for (let node = fiber; node.parent; node = node.parent) {\n    for (let sibling = node.sibling; sibling; sibling = sibling.sibling) {\n      const dom = stableDom(sibling);\n      if (dom) return dom;\n    }\n    if (node.parent.dom) return null;\n  }\n  return null;\n}\n\nfunction stableDom(fiber) {\n  if (fiber.effectTag === 'PLACEMENT') return null;\n  return fiber.dom ?? stableDom(fiber.child);\n}\n\n// ---- Assignment 11: run the effects ----\n// React's order: every cleanup that is due, then every effect that is due.\nfunction runEffects(deletions, root) {\n  cleanUp(root, Map.groupBy(deletions, (fiber) => fiber.parent));\n  for (const hook of [...dueHooks(root)]) {\n    hook.cleanup = hook.effect();\n    hook.deps = hook.nextDeps;\n    hook.due = false;\n  }\n}\n\n// Walks the new tree. At each fiber, the children it lost go first (a lost fiber before its own\n// children), then its surviving children, then the fiber's own cleanups.\nfunction cleanUp(fiber, lostChildren) {\n  for (const lost of lostChildren.get(fiber.alternate) ?? []) {\n    for (const gone of parentFirst(lost)) gone.hooks?.forEach(runCleanup);\n  }\n  for (let child = fiber.child; child; child = child.sibling) cleanUp(child, lostChildren);\n  fiber.hooks?.filter((hook) => hook.due).forEach(runCleanup);\n}\n\nfunction runCleanup(hook) {\n  if (!hook.cleanup) return;\n  hook.cleanup();\n  hook.cleanup = undefined;\n}\n\nfunction* parentFirst(fiber) {\n  yield fiber;\n  for (let child = fiber.child; child; child = child.sibling) yield* parentFirst(child);\n}\n\n// The effects that are due, children before parents.\nfunction* dueHooks(fiber) {\n  for (let child = fiber.child; child; child = child.sibling) yield* dueHooks(child);\n  for (const hook of fiber.hooks ?? []) {\n    if (hook.due) yield hook;\n  }\n}\n"},{"path":"src/didact/index.js","text":"// ---- Assignment 11: useEffect joins the library ----\nimport { createElement } from './createElement.js';\nimport { useEffect, useState } from './hooks.js';\nimport { render } from './render.js';\n\nconst Didact = { createElement, render, useState, useEffect };\n\nexport default Didact;\nexport { createElement, render, useState, useEffect };\n"},{"path":"assignments/assignment_11_use_effect.js","text":"// Assignment 11: the checker runs this program as `node assignments/assignment_11_use_effect.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/createElement.js","src/didact/render.js","src/didact/state.js","src/didact/dom.js","src/didact/reconcile.js"],"proof":{"passed":48,"total":48,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>Neither post builds <code>useEffect<\/code>. This one is an extension: nothing in either author's code corresponds to it, and the behaviour is React 19.3.1's, the version the expected output comes from. Jongeneel has the same three moments as class methods: componentDidMount in <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.2%20Mounting%20components\" target=\"_blank\" rel=\"noopener\">5.2 Mounting components<\/a>, componentDidUpdate in <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.3%20Updating%20a%20component\" target=\"_blank\" rel=\"noopener\">5.3 Updating a component<\/a> and componentWillUnmount in <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.6%20Unmounting%20components\" target=\"_blank\" rel=\"noopener\">5.6 Unmounting components<\/a>. A figure of those lifecycle hooks opens <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.%20Components%20and%20reactive%20scopes\" target=\"_blank\" rel=\"noopener\">section 5<\/a>, and it is worth reading, with the text around it, if you want the idea. Skip his code, since his mount and update hooks run from timers and this assignment follows React. Pombo's <a href=\"https://pomb.us/build-your-own-react/#epilogue\" target=\"_blank\" rel=\"noopener\">epilogue<\/a> lists <code>useEffect<\/code> as an easy addition and goes no further. You can do the assignment without either.<\/p>","readTitle":"Read in the blog first","context":"<p>Since 10 a function component can remember. It still cannot touch anything outside the tree, a page title or a timer for instance. <code>useEffect<\/code> joins <code>useState<\/code> in <code>hooks.js<\/code> and takes slots the same way, and <code>commit.js<\/code> runs whatever the hook noted down once the DOM matches the new tree.<\/p>","sources":"<ul><li>Wim Jongeneel, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a>: the lifecycle figure at the start of <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.%20Components%20and%20reactive%20scopes\" target=\"_blank\" rel=\"noopener\">section 5<\/a>, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.2%20Mounting%20components\" target=\"_blank\" rel=\"noopener\">5.2 Mounting components<\/a>, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.3%20Updating%20a%20component\" target=\"_blank\" rel=\"noopener\">5.3 Updating a component<\/a> and <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.6%20Unmounting%20components\" target=\"_blank\" rel=\"noopener\">5.6 Unmounting components<\/a><\/li><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#epilogue\" target=\"_blank\" rel=\"noopener\">Epilogue<\/a><\/li><li>React documentation: <a href=\"https://react.dev/reference/react/useEffect\" target=\"_blank\" rel=\"noopener\">useEffect<\/a> and <a href=\"https://react.dev/learn/synchronizing-with-effects\" target=\"_blank\" rel=\"noopener\">Synchronizing with Effects<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 11                          every test, grouped by requirement\n.\\check 11 -Case 11-R6-outer-inner-first   one test: its scenario, the log you should get and yours\n.\\check 11 -Fresh                   five new random sessions\n.\\check 11 -Dispute &lt;id&gt; &quot;why&quot;      set a test aside when you are sure it is wrong<\/code><\/pre>\n<p>Running the effects during the component function fails like this:<\/p>\n<pre><code>  R1  An effect runs once per mount, and only after the render that cre... .    4 / 6   FAILED\n      x 11-R1-nothing-runs-before-the-commit  two Loggers in a div: after 4 units of work no effect has run, after the flus...\n          line 2: expected `dump 1`, got `log mount a`  (in `idle 4`)\n          likely cause: R1 - An effect runs once per mount, and only after the render that created it has been committed\n          expected values from: React 19.3.1 (react-dom 19.3.1) on jsdom 30.1.3, run by tools/oracle with the harness catalog; orders pinned in _source/react-observed.md\n          reproduce: py -P tools/run_js.py build/bugs/11/effects-in-render 11 build/cases/11/11-R1-nothing-runs-before-the-commit.in build/cases/11/11-R1-nothing-runs-before-the-commit.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Compare <code>useEffect<\/code> with <code>useState<\/code>. Both keep something on the fiber between renders, and the slot and <code>hookIndex<\/code> machinery from 10 carries over unchanged. The difference is timing: a state update is applied while the component renders, and an effect cannot be.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p><code>useEffect<\/code> takes a slot and fills it in: the effect, the new deps, the deps and cleanup of the last run, and whether the effect is due (no deps array, no earlier run, or an item that differs). Nothing runs at this point. Run things at the end of <code>commitRoot<\/code>, once the DOM matches the new tree, and walk the fibers twice: cleanups first, effects second. Removed components are no longer in the new tree. The commit has to learn about them from the render phase, as it already does for deleted nodes. Store each run's cleanup in the slot and never rebuild it from newer props.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>===<\/code> or <code>!==<\/code> on the <code>deps<\/code> arrays reports a difference on every render. Compare item by item.<\/li><li><code>undefined<\/code> and <code>[]<\/code> mean different things. The first is due on every render, the second on the first render only.<\/li><li>Your work loop visits a parent before its children, and an effect list built in that order has the parent first. Mount wants children first.<\/li><li>Cleanup then effect, component by component, interleaves the two. Every cleanup has to run before the first effect.<\/li><li>A removed component may sit under a plain element that went with it. A walk over only the top fiber of the deleted subtree misses every cleanup below.<\/li><li>Removal wants a parent's cleanup before its children's, the reverse of mount order. One walk order serves only one of them.<\/li><li>The cleanup to call is the one the previous run returned. Let a newer render overwrite it and <code>clean a 1<\/code> turns into <code>clean b 1<\/code>.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>useEffect(effect, deps):\n    slot = the old fiber&#x27;s slot at hookIndex, or { deps: none, cleanup: none }\n    slot.effect = effect\n    slot.nextDeps = deps\n    slot.due = slot.deps is none or deps is none or some item differs from slot.deps (Object.is)\n    wipFiber.hooks.push(slot); hookIndex += 1\n\nat the end of commitRoot, after the DOM is updated:\n    for each deleted fiber, parent first, then each of its descendants: run the cleanup of its slots\n    for each fiber of the new tree: run the cleanup of its due slots\n    for each fiber of the new tree, children before parents:\n        for each due slot: slot.cleanup = slot.effect(); slot.deps = slot.nextDeps; slot.due = false\n\nrun a cleanup: if the slot has one, call it and forget it<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"nothing before the commit","test":"11-R1-nothing-runs-before-the-commit","input":"tree t <div><Logger name=a/><Logger name=b/><\/div>\nrender t\nidle 4\nlog\ndump\nflush\nlog\ndump","output":"idle 4\ndump 1\nlog mount a\nlog mount b\ndump 2\nnode 0 a div \"\"\nnode 1 b em \"\"\ntext 2 \"a\"\nnode 1 c em \"\"\ntext 2 \"b\"","image":null,"explain":"<p>The tree comes to 8 units of work: the container's root, the <code>div<\/code>, two <code>Logger<\/code> components, their two <code>em<\/code> elements and two text nodes. <code>idle 4<\/code> gets through four of them, enough for the first <code>Logger<\/code>'s function to have run, yet the log is empty and so is the page (<code>dump 1<\/code> has no lines). The <code>flush<\/code> finishes the render, commits and runs both effects.<\/p>"},{"label":"Example 2","name":"cleanups before effects","test":"11-R7-both-siblings-change","input":"tree t <div><LoggerDeps name=a dep=1/><LoggerDeps name=b dep=1/><\/div>\nrender t\nflush\nlog\ndump\ntree t <div><LoggerDeps name=a dep=2/><LoggerDeps name=b dep=2/><\/div>\nrender t\nflush\nlog\ndump\ntree t <div><LoggerDeps name=a dep=2/><LoggerDeps name=b dep=3/><\/div>\nrender t\nflush\nlog\ndump","output":"log run a 1\nlog run b 1\ndump 1\nnode 0 a div \"\"\nnode 1 b em \"\"\ntext 2 \"a:1\"\nnode 1 c em \"\"\ntext 2 \"b:1\"\nlog clean a 1\nlog clean b 1\nlog run a 2\nlog run b 2\ndump 2\nnode 0 a div \"\"\nnode 1 b em \"\"\ntext 2 \"a:2\"\nnode 1 c em \"\"\ntext 2 \"b:2\"\nlog clean b 2\nlog run b 3\ndump 3\nnode 0 a div \"\"\nnode 1 b em \"\"\ntext 2 \"a:2\"\nnode 1 c em \"\"\ntext 2 \"b:3\"","image":null,"explain":"<p>Step two makes both effects due. <code>clean a 1<\/code>, <code>run a 2<\/code>, <code>clean b 1<\/code>, <code>run b 2<\/code> would be tidier, and React does not do that: every <code>clean<\/code> line comes before any <code>run<\/code> line. In step three <code>a<\/code> keeps <code>dep=2<\/code> and its effect stays asleep, which leaves two lines for <code>b<\/code>. Each line names the dep of the run it belongs to, hence <code>clean b 2<\/code> and not <code>clean b 3<\/code>.<\/p>"},{"label":"Example 3","name":"mounting and removing are mirror images","test":"11-R5-outer-and-logger-removed","input":"tree t <div><Outer name=o/><Logger name=l/><\/div>\nrender t\nflush\nlog\ndump\ntree t <p>x<\/p>\nrender t\nflush\nlog\ndump","output":"log mount o.inner\nlog mount o\nlog mount l\ndump 1\nnode 0 a div \"\"\nnode 1 b div \"\"\nnode 2 c em \"\"\ntext 3 \"o.inner\"\nnode 1 d em \"\"\ntext 2 \"l\"\nlog cleanup o\nlog cleanup o.inner\nlog cleanup l\ndump 2\nnode 0 e p \"\"\ntext 1 \"x\"","image":null,"explain":"<p>Mount goes inner <code>Logger<\/code>, <code>Outer<\/code>, sibling. Removal goes <code>Outer<\/code>, the <code>Logger<\/code> inside it, sibling. The fiber deleted in this example is the root <code>div<\/code>, with the components sitting inside it, which means your commit has to look inside deleted fibers.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p>In Jongeneel's class <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=5.2%20Mounting%20components\" target=\"_blank\" rel=\"noopener\"><code>Component<\/code><\/a> the three moments are methods. <code>notifyMounted<\/code> schedules <code>componentDidMount<\/code>, <code>getUpdateDiff<\/code> schedules <code>componentDidUpdate<\/code>, and <code>unmount<\/code> calls <code>componentWillUnmount<\/code>. Mapped onto hooks, <code>componentDidMount<\/code> is an effect with <code>[]<\/code>, <code>componentDidUpdate<\/code> is an effect with no deps array (which also runs after the mount, where his hook does not) and <code>componentWillUnmount<\/code> is the cleanup. He has no deps lists and no cleanup that runs between updates.<\/p>\n<p>Where the post's version parts company with the tests, most important first.<\/p>\n<p><code>unmount<\/code> is called only for a component that is a direct member of a removed child list, or that gets replaced by a non-text node, which means a component below a removed element, or below another removed component, never hears about it. In the repository a parent whose tag changes is replaced without unmounting what it held, and a component replaced by text is not unmounted either. R5 checks the nested case with <code>Outer<\/code>. React cleans up every component of the removed subtree.<\/p>\n<p>His mount and update hooks run from <code>setTimeout<\/code>, after the diff has been applied. <code>componentDidMount<\/code> reaches every component that mounts, nested ones too, because <code>renderElement<\/code> recurses. <code>componentDidUpdate<\/code> is queued on every re-render of a component, even when the diff is empty, and it is queued before the DOM is patched. In an update, the mount hook of a component that appears in the update runs after its parent's update hook; React runs the new child's mount hook first. A hook queued before an unmount still fires afterwards, on an instance without an element. <code>componentWillUnmount<\/code> is the exception to the timers: <code>unmount<\/code> calls it at once, before the update touches the DOM. Mounting is the one place the two orders agree, since nested components queue their timers bottom-up and children mount before parents.<\/p>\n<p>His <code>setState<\/code> is synchronous and unbatched: three calls render three times, where React renders once and your <code>useState<\/code> queues. The \"Effects\" row of <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> covers where React 19 differs from both posts.<\/p>"},"need":{"new":[{"id":"react-effects","title":"useEffect: after the DOM is updated","note":"effects and cleanups, what a deps array promises, and why the order effects run in is a rule and not an accident.","group":"React and the ideas in the posts","from":"11"}],"earlier":[{"id":"react-render-commit","title":"The render phase and the commit phase","note":"effects are the first work that has to wait until the commit is over. The render phase may only remember them.","group":"React and the ideas in the posts","from":"05"},{"id":"js-functions-closures","title":"Arrow functions and closures","note":"an effect and the cleanup it returns close over the props of the render that ran them, and the tests check that they stay that way.","group":"JavaScript","from":"02"},{"id":"js-equality","title":"Equality and <code>Object.is<\/code>","note":"every render builds a new deps array, so two renders can hold equal contents in two different arrays.","group":"JavaScript","from":"02"},{"id":"react-reconciliation","title":"Reconciliation by type and position","note":"the fibers your reconciler discards still own cleanups.","group":"React and the ideas in the posts","from":"06"},{"id":"js-arrays","title":"Array methods: map, filter, forEach, find, includes, slice","note":"","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"},{"id":"react-state","title":"<code>useState<\/code> and the rules of hooks","note":"","from":"10"}]}},{"id":"12","num":"12","title":"The todo app","difficulty":"Medium","tests":41,"problem":"problems/12-todo-app.md","entry":"solutions/assignments/assignment_12_todo_app.js","files":[{"path":"solutions/assignments/assignment_12_todo_app.js","role":"entry","purpose":null,"job":"Supply `runScenarioFile` with your `Didact` object and your `TodoApp`. The scenario types into the form, adds items, toggles and removes them.","blank":"// ======================================================================================\n// Assignment 12: The todo app\n// Problem: problems/12-todo-app.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 12 as `python -P tools/run_js.py\n//   solutions 12 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 12` (`./check.sh 12` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Supply `runScenarioFile` with your `Didact` object and your `TodoApp`. The scenario\n//   types into the form, adds items, toggles and removes them.\n//\n// The other files of this assignment:\n//   You also write src/app/TodoApp.js and src/main.js in this assignment; each one gives\n//   its job at the top.\n//   Earlier files you can use: src/didact/index.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { TodoApp } from '../src/app/TodoApp.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 12: The todo app\n// Problem: problems/12-todo-app.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 12 as `python -P tools/run_js.py\n//   solutions 12 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 12` (`./check.sh 12` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/app/TodoApp.js and src/main.js in this assignment; each one gives\n//   its job at the top.\n//   Earlier files you can use: src/didact/index.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import { TodoApp } from '../src/app/TodoApp.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { TodoApp } from '../src/app/TodoApp.js'; // TodoApp (assignment 12): the application under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { ...Didact, components: { TodoApp } });\n"},{"path":"solutions/src/app/TodoApp.js","role":"new","purpose":"A todo list written the way an application would write it, as function components on your own Didact.","job":"Compose `TodoApp` from function components on your Didact: a form with a controlled input, a list of keyed items, and a toggle and a remove button on each item.","blank":"// ======================================================================================\n// Assignment 12: The todo app\n// Problem: problems/12-todo-app.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   A todo list written the way an application would write it, as function components on\n//   your own Didact.\n//\n// Your job:\n//   Compose `TodoApp` from function components on your Didact: a form with a controlled\n//   input, a list of keyed items, and a toggle and a remove button on each item.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 12: The todo app\n// Problem: problems/12-todo-app.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   A todo list written the way an application would write it, as function components on\n//   your own Didact.\n//\n// Your job:\n//   Compose `TodoApp` from function components on your Didact: a form with a controlled\n//   input, a list of keyed items, and a toggle and a remove button on each item. The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { createElement as h, useEffect, useState } from '../didact/index.js'; // createElement (as h) for the markup; useState and useEffect for the app's state and the page title\n\nexport function TodoApp() {\n  // TODO: see \"The page\", \"The behaviour\" and Requirements R1 to R9 on the page.\n  throw new Error('not implemented: TodoApp');\n}\n"},{"path":"solutions/src/main.js","role":"new","purpose":"Where the finished program starts: it mounts the todo app into the page's `#root`.","job":"Mount `TodoApp` into the page's `#root`; `index.html` then shows a working app.","blank":"// ======================================================================================\n// Assignment 12: The todo app\n// Problem: problems/12-todo-app.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Where the finished program starts: it mounts the todo app into the page's `#root`.\n//\n// Your job:\n//   Mount `TodoApp` into the page's `#root`; `index.html` then shows a working app.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 12: The todo app\n// Problem: problems/12-todo-app.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Where the finished program starts: it mounts the todo app into the page's `#root`.\n//\n// Your job:\n//   Mount `TodoApp` into the page's `#root`; `index.html` then shows a working app. The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { createElement as h, render } from './didact/index.js'; // createElement (as h) and render: describe the app and draw it\nimport { TodoApp } from './app/TodoApp.js'; // TodoApp (this assignment): the app to draw\n\n// TODO: see \"The part the checker cannot see\" on the page.\n"}],"buildsOn":[{"path":"solutions/src/didact/index.js","owner":"04","purpose":"What an app imports: one `Didact` object carrying `createElement` and `render`, with the hooks joining it as you write them."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-modules\">ES modules<\/a>","<a href=\"#primer/js-arrays\">array methods<\/a>","<a href=\"#primer/js-functions-closures\">arrow functions and closures<\/a>","<a href=\"#primer/js-string-methods\">string methods<\/a>"],"text":["ES modules","array methods","arrow functions and closures","string methods"]},{"label":"Library","items":["<a href=\"#primer/dom-form-inputs\">inputs, the input and submit events<\/a>","<a href=\"#primer/dom-document-title\">document.title<\/a>","<a href=\"#primer/static-server\">serving index.html locally<\/a>"],"text":["inputs, the input and submit events","document.title","serving index.html locally"]},{"label":"Concepts","items":["<a href=\"#primer
