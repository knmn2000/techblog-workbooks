 `{ type, props }` with\n//   every child inside `props.children`, and `createTextElement(text)`, which builds the\n//   text element a string or number child becomes.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 01: Create elements\n// Problem: problems/01-create-element.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   What JSX compiles to: a plain `{ type, props }` object, with the children inside\n//   `props`.\n//\n// Your job:\n//   Write `createElement(type, props, ...children)`, returning `{ type, props }` with\n//   every child inside `props.children`, and `createTextElement(text)`, which builds the\n//   text element a string or number child becomes. The Boilerplate gives you the\n//   declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nexport function createElement(type, props, ...children) {\n  // TODO: see \"What an element is\" and Requirements R1 to R7 on the page.\n  throw new Error('not implemented: createElement');\n}\n\nexport function createTextElement(text) {\n  // TODO: see \"What an element is\" and Requirement R3 on the page.\n  throw new Error('not implemented: createTextElement');\n}\n"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-modules\">ES modules<\/a>","<a href=\"#primer/js-objects\">objects, spread and destructuring<\/a>","<a href=\"#primer/js-rest-spread\">rest parameters and spread arguments<\/a>","<a href=\"#primer/js-typeof\">typeof<\/a>","<a href=\"#primer/js-arrays\">array methods<\/a>","<a href=\"#primer/js-errors\">throw, try and catch<\/a>","<a href=\"#primer/js-async-await\">async and await<\/a>"],"text":["ES modules","objects, spread and destructuring","rest parameters and spread arguments","typeof","array methods","throw, try and catch","async and await"]},{"label":"Library","items":["<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>","<a href=\"#primer/node-process\">process.argv and exit codes<\/a>"],"text":["the harness and scenario files","process.argv and exit codes"]},{"label":"Concepts","items":["<a href=\"#primer/react-elements\">elements and what JSX turns into<\/a>","<a href=\"#primer/react-today\">React 19 against the posts<\/a>"],"text":["elements and what JSX turns into","React 19 against the posts"]}],"body":"<div class=\"d-problem flow\"><p>Write <code>createElement<\/code>, the function a JSX tag compiles to. A scenario file says how to call it, and your program prints what comes back.<\/p>\n<h3>Input<\/h3>\n<p><code>node assignments/assignment_01_create_element.js &lt;input-file&gt; &lt;output-file&gt;<\/code> is the command line behind each test. The harness reads the input, makes the calls each line asks for, and writes the output. A scenario has three kinds of line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>call &lt;type&gt; &lt;props&gt; [child ...]<\/code><\/td><td>Calls <code>createElement(type, props, ...children)<\/code> and prints the result. <code>&lt;type&gt;<\/code> is a bare word or a JSON string. <code>&lt;props&gt;<\/code> is a JSON object, <code>null<\/code>, or <code>@name<\/code>, an object defined by a <code>props<\/code> line. A child is a JSON string, a JSON number, or <code>$k<\/code>, the element that the k-th <code>call<\/code> returned (counting from 1).<\/td><\/tr><tr><td><code>props &lt;name&gt; &lt;json&gt;<\/code><\/td><td>Stores a props object under <code>&lt;name&gt;<\/code> for later <code>@name<\/code> arguments. Prints nothing.<\/td><\/tr><tr><td><code>show &lt;name&gt;<\/code><\/td><td>Prints the stored object as it is now.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>@name<\/code> passes the stored object itself. Nothing is copied, and every use of one name is the same object.<\/p>\n<p>The entry program, <code>assignments/assignment_01_create_element.js<\/code>, is short. It imports your <code>createElement<\/code> and the harness's <code>runScenarioFile<\/code> (from <code>../harness/scenario.js<\/code>) and ends with <code>await runScenarioFile(process.argv[2], process.argv[3], { createElement })<\/code>, passing along the input and output paths from the command line. The Boilerplate gives it to you finished. Starting from scratch, write it first, because nothing runs without it.<\/p>\n<p><code>src/didact/createElement.js<\/code> exports two functions:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Export<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>createElement(type, props, ...children)<\/code><\/td><td>The one the scenario calls.<\/td><\/tr><tr><td><code>createTextElement(text)<\/code><\/td><td>Returns the text element for one string or number: type <code>&quot;TEXT_ELEMENT&quot;<\/code>, props <code>{ nodeValue: text, children: [] }<\/code>, with <code>nodeValue<\/code> as passed, so a number stays a number. The tests call only <code>createElement<\/code>; a text element shows up in the children it lands in.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p><code>call<\/code> prints one line, <code>element &lt;k&gt; &lt;json&gt;<\/code>, where <code>k<\/code> counts the calls so far, starting at 1. <code>show<\/code> prints <code>props &lt;name&gt; &lt;json&gt;<\/code>. Your code prints nothing itself. The harness writes the JSON, compact, with a few conventions:<\/p>\n<ul><li>Keys are sorted by name at every level, which hides the order you built the object in.<\/li><li>A space inside a string prints as <code>\\u0020<\/code>, and a character outside ASCII as a <code>\\uXXXX<\/code> escape.<\/li><li>Numbers print the way JavaScript prints them, which turns the input <code>4.0<\/code> into <code>4<\/code>.<\/li><\/ul>\n<pre><code>element 1 {&quot;props&quot;:{&quot;children&quot;:[],&quot;id&quot;:&quot;a&quot;},&quot;type&quot;:&quot;div&quot;}\nprops p {&quot;id&quot;:&quot;a&quot;}<\/code><\/pre>\n<h3>What an element is<\/h3>\n<p>An element is an object with two fields, <code>type<\/code> and <code>props<\/code>. <code>type<\/code> is the first argument, untouched. <code>props<\/code> is a fresh object, never the one passed in, holding every key and value of the props you received, plus <code>children<\/code>.<\/p>\n<p>Every call also builds a fresh <code>children<\/code> array, one entry per child argument, in the order given:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Child argument<\/th><th>Entry in <code>children<\/code><\/th><\/tr><\/thead><tbody><tr><td>a string, including <code>&quot;&quot;<\/code><\/td><td><code>{&quot;type&quot;:&quot;TEXT_ELEMENT&quot;,&quot;props&quot;:{&quot;nodeValue&quot;:&lt;the string&gt;,&quot;children&quot;:[]}}<\/code><\/td><\/tr><tr><td>a number, including <code>0<\/code><\/td><td>the same, with the number as <code>nodeValue<\/code><\/td><\/tr><tr><td>an element<\/td><td>that element, unchanged<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A number keeps its type: the child <code>42<\/code> gives <code>nodeValue<\/code> 42, and the child <code>&quot;42&quot;<\/code> gives <code>nodeValue<\/code> <code>&quot;42&quot;<\/code>. No children means an empty array, and one child still means an array of one.<\/p>\n<p>A <code>children<\/code> key in the props you receive counts for nothing. The array built from the child arguments replaces it, even when there are no child arguments and the result is <code>[]<\/code>.<\/p>\n<p>Props of <code>null<\/code> act like an empty object. The object you receive, and everything inside it, comes out of your function as it went in. <code>key<\/code> is an ordinary prop: it stays in <code>props<\/code> with its value and shows up nowhere else on the element.<\/p>\n<p>Children that are <code>null<\/code>, booleans, arrays or <code>undefined<\/code> are out of scope. No test passes them, so your function can do what it likes with them.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>An element has the fields <code>type<\/code> and <code>props<\/code> and no others. <code>type<\/code> is the first argument; <code>props<\/code> carries every key and value of the props that were given.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>props.children<\/code> is an array holding the children in order: empty for none, one entry for one child. A <code>children<\/code> key in the given props is replaced by it.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A string or number child becomes a text element whose <code>nodeValue<\/code> is the value as given, so a number stays a number and <code>0<\/code> and <code>&quot;&quot;<\/code> count.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>An element given as a child sits in <code>children<\/code> unchanged, at the position where it was passed.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Props of <code>null<\/code> act like <code>{}<\/code>.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>The call leaves the props you were given unmodified, however often the object is reused.<\/span><\/li><li><span class=\"rid\">R7<\/span><span><code>key<\/code> stays in <code>props<\/code> as an ordinary prop.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Several <code>call<\/code> lines that build a tree from the leaves up, the way an app does.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Types are single words. Props are JSON objects or <code>null<\/code>. Numbers are finite and print the same in JSON and in JavaScript. A string child can hold any characters, spaces and quotes included. A scenario runs to 16 lines at most. The 48 tests cover each requirement's cases, then two longer scripted trees and nine seeded random ones (<code>-Fresh<\/code> gives nine new ones). A correct solution needs milliseconds. Each test may run for 10 seconds.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/createElement.js","text":"// Assignment 01: an element is a plain { type, props } object, with the children inside props.\n\n// What JSX compiles to. A string or number child has no element of its own, so it gets a text\n// element; an object child is already an element and passes through.\nexport function createElement(type, props, ...children) {\n  return {\n    type,\n    props: {\n      ...props,\n      children: children.map((child) => (typeof child === 'object' ? child : createTextElement(child))),\n    },\n  };\n}\n\n// The element for a piece of text: its content travels as the nodeValue prop.\nexport function createTextElement(text) {\n  return { type: 'TEXT_ELEMENT', props: { nodeValue: text, children: [] } };\n}\n"},{"path":"assignments/assignment_01_create_element.js","text":"// Assignment 01: the checker runs this program as `node assignments/assignment_01_create_element.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport { createElement } from '../src/didact/createElement.js'; // createElement (assignment 01): the function under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { createElement });\n"}],"also":[],"proof":{"passed":48,"total":48,"date":"2026-11-01"},"given":["harness/scenario.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js","harness/env.js"]},"read":"<p>You can pass with this page alone. If you would rather meet Pombo's version first, read <a href=\"https://pomb.us/build-your-own-react/#step-i-the-createelement-function\" target=\"_blank\" rel=\"noopener\">Step I: The createElement Function<\/a> up to the point where he starts naming the library. His animated code is his solution, so save it for after you pass. <a href=\"https://pomb.us/build-your-own-react/#step-zero-review\" target=\"_blank\" rel=\"noopener\">Step Zero<\/a>, the short review before it, shows what a JSX tag compiles to and is worth a minute if JSX is new to you.<\/p>","readTitle":"Read in the blog first","context":"<p>Didact starts with the object everything else passes around: the DOM code, the fibers and the hooks all read <code>{ type, props }<\/code>. A slip in your version stays contained, because assignments 02 to 08 build their elements with the harness's copy of this function. Your <code>createElement<\/code> is first called by other code in 09, when the catalog's function components use it.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-i-the-createelement-function\" target=\"_blank\" rel=\"noopener\">Step I: The createElement Function<\/a> and the review before it, <a href=\"https://pomb.us/build-your-own-react/#step-zero-review\" target=\"_blank\" rel=\"noopener\">Step Zero<\/a><\/li><li>Wim Jongeneel, the part of <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=2.1%20The%20HTML%20syntax%20tree\" target=\"_blank\" rel=\"noopener\">Creating Our Own React From Scratch<\/a> on the HTML syntax tree, where his own element constructor appears<\/li><li>React documentation: <a href=\"https://react.dev/reference/react/createElement\" target=\"_blank\" rel=\"noopener\">createElement<\/a> and <a href=\"https://react.dev/learn/writing-markup-with-jsx\" target=\"_blank\" rel=\"noopener\">Writing markup with JSX<\/a><\/li><li>MDN: <a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters\" target=\"_blank\" rel=\"noopener\">rest parameters<\/a> and <a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax\" target=\"_blank\" rel=\"noopener\">spread syntax<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 01                          every test, grouped by requirement\n.\\check 01 -Case 01-R3-number       one test with its full input, the expected lines and yours\n.\\check 01 -Fresh                   nine new random trees, to try your code on scenarios you have not seen\n.\\check 01 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>A <code>createElement<\/code> that spreads the given props after it has written <code>children<\/code> fails like this:<\/p>\n<pre><code>  R2  `props.children` is always an array of the children in order: emp... .    5 / 6   FAILED\n      x 01-R2-children-key  a children key in the given props is replaced by the children array\n          element[0]: expected (n=1, json={&quot;props&quot;:{&quot;children&quot;:[{&quot;props&quot;:{&quot;children&quot;:[],&quot;nodeValue&quot;:&quot;x&quot;},&quot;type&quot;:&quot;TEXT_ELEMENT&quot;}]},&quot;type&quot;:&quot;div&quot;}), got (n=1, json={&quot;props&quot;:{&quot;children&quot;:&quot;junk&quot;},&quot;type&quot;:&quot;div&quot;}) - differs in json\n          likely cause: R2 - `props.children` is always an array of the children in order: empty for none, one entry for one child\n          expected values from: independent dict model in tools/gen_p01.py, cross-checked with React 19.3.1 createElement\n          reproduce: py -P tools/run_js.py build/bugs/01/props-after-children 01 build/cases/01/01-R2-children-key.in build/cases/01/01-R2-children-key.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Start with the smallest scenario there is, the single line <code>call div null<\/code>. The output is one object with two fields. Get that right, then add a child, then a text child, then a props object. The tests have a case for every one of those steps.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Make the result's <code>props<\/code> a fresh object: copy the given props into it, then give it its own <code>children<\/code> field, so that a <code>children<\/code> key from the caller cannot survive. Turn the child arguments into a new array one at a time. An element stays itself and anything else goes through <code>createTextElement<\/code>. The copy does two jobs: the caller's object stays as it was, and <code>null<\/code> props turn into the same thing as an empty object.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Do not turn a number child into a string. <code>0<\/code> is a child too, and a falsy filter drops it.<\/li><li>A text element needs <code>children: []<\/code> of its own. The render in 03 walks into the children of every element, text elements included, and expects an array each time.<\/li><li>One child is still an array of one. React's own <code>createElement<\/code> unwraps it; yours must not.<\/li><li>Whichever is written later wins: the spread of the given props or your own <code>children<\/code>. The <code>children<\/code> in the result has to come from your code.<\/li><li>Assigning to the object you received feels like a shortcut, and it holds until a scenario reuses the object. <code>show<\/code> is there for that case.<\/li><li>Here <code>key<\/code> is an ordinary prop: it stays in <code>props<\/code>, and the element gets no third field for it.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>createElement(type, props, ...children):\n    resultProps = a new object with every key of props   (nothing, if props is null)\n    resultProps.children = for each child in children:\n                               if the child is an element: the child itself\n                               otherwise: createTextElement(child)\n    return an object with fields type and props = resultProps\n\ncreateTextElement(text):\n    return an element of type &quot;TEXT_ELEMENT&quot; whose props are nodeValue = text and children = []<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"text, an element, text","test":"01-R4-interleaved","input":"call b null \"bold\"\ncall p null \"a \" $1 \" b\"","output":"element 1 {\"props\":{\"children\":[{\"props\":{\"children\":[],\"nodeValue\":\"bold\"},\"type\":\"TEXT_ELEMENT\"}]},\"type\":\"b\"}\nelement 2 {\"props\":{\"children\":[{\"props\":{\"children\":[],\"nodeValue\":\"a\\u0020\"},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[{\"props\":{\"children\":[],\"nodeValue\":\"bold\"},\"type\":\"TEXT_ELEMENT\"}]},\"type\":\"b\"},{\"props\":{\"children\":[],\"nodeValue\":\"\\u0020b\"},\"type\":\"TEXT_ELEMENT\"}]},\"type\":\"p\"}","image":null,"explain":"<p><code>$1<\/code> stands for whatever line 1 returned. In the second call it is the middle child, and it shows up in the output as line 1 printed it, between two text elements whose spaces the harness writes as <code>\\u0020<\/code>. <code>&quot;a &quot;<\/code> and <code>&quot; b&quot;<\/code> keep those spaces. Don't trim.<\/p>"},{"label":"Example 2","name":"a number is not a string","test":"01-R3-numeric-string","input":"call p null \"42\" 42 \"4.0\" 4.0 \"-7\" -7","output":"element 1 {\"props\":{\"children\":[{\"props\":{\"children\":[],\"nodeValue\":\"42\"},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[],\"nodeValue\":42},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[],\"nodeValue\":\"4.0\"},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[],\"nodeValue\":4},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[],\"nodeValue\":\"-7\"},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[],\"nodeValue\":-7},\"type\":\"TEXT_ELEMENT\"}]},\"type\":\"p\"}","image":null,"explain":"<p>Six children, three pairs, and in every pair the string keeps its quotes in the output while the number loses them. <code>&quot;4.0&quot;<\/code> and <code>4.0<\/code> is the odd pair: the string stays <code>&quot;4.0&quot;<\/code>, and the number comes back as <code>4<\/code> because that is how JavaScript prints it. Your code receives a number.<\/p>"},{"label":"Example 3","name":"one props object, three elements","test":"01-R6-reuse","input":"props p {\"className\":\"box\",\"title\":\"t\"}\ncall div @p \"one\"\ncall div @p \"two\" \"three\"\ncall div @p\nshow p","output":"element 1 {\"props\":{\"children\":[{\"props\":{\"children\":[],\"nodeValue\":\"one\"},\"type\":\"TEXT_ELEMENT\"}],\"className\":\"box\",\"title\":\"t\"},\"type\":\"div\"}\nelement 2 {\"props\":{\"children\":[{\"props\":{\"children\":[],\"nodeValue\":\"two\"},\"type\":\"TEXT_ELEMENT\"},{\"props\":{\"children\":[],\"nodeValue\":\"three\"},\"type\":\"TEXT_ELEMENT\"}],\"className\":\"box\",\"title\":\"t\"},\"type\":\"div\"}\nelement 3 {\"props\":{\"children\":[],\"className\":\"box\",\"title\":\"t\"},\"type\":\"div\"}\nprops p {\"className\":\"box\",\"title\":\"t\"}","image":null,"explain":"<p>The <code>show<\/code> line is what this test is about. After three calls that all got the same object, <code>p<\/code> must still hold only <code>className<\/code> and <code>title<\/code>. An implementation that writes <code>children<\/code> onto the object it received shows it here.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-i-the-createelement-function\" target=\"_blank\" rel=\"noopener\">Pombo's version<\/a> has the same two functions this page asks for. <code>createElement<\/code> returns <code>{ type, props }<\/code> with the given props spread first and <code>children<\/code> after them, and whatever is not an object goes to <code>createTextElement<\/code>, which builds the <code>TEXT_ELEMENT<\/code> node with <code>nodeValue<\/code> and an empty <code>children<\/code>. In the post it all lives in one file under the name <code>Didact<\/code>, and a pragma comment points JSX at <code>Didact.createElement<\/code>. Here the two functions get a module of their own, and the app code calls <code>createElement<\/code> by hand, since the workbook has no build step.<\/p>\n<p>The post decides with <code>typeof child === &quot;object&quot;<\/code>, which splits the out-of-scope values in two. <code>null<\/code> and arrays are objects, so they land in <code>children<\/code> as they are. <code>undefined<\/code> and the booleans are not, so they become text elements holding <code>undefined<\/code>, <code>false<\/code> or <code>true<\/code>. React renders nothing for <code>null<\/code>, <code>undefined<\/code> and the booleans, and it renders the items of an array. No test passes any of them.<\/p>\n<p>According to the post, React itself neither wraps primitive children nor creates an empty array when there are none, and Didact does both on purpose to keep the later code simple. This assignment follows the post: <code>children<\/code> is <code>[]<\/code> when empty and never missing, and a lone child sits in an array. (<code>React.createElement<\/code> stores a lone child as the child itself.) React also keeps <code>key<\/code> in a field of the element beside <code>props<\/code>, whereas here it stays in <code>props<\/code>, because the reconciler of assignment 07 reads it there. <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> lists where React 19 departs from the posts, and its row on keys is the one that bears on this.<\/p>\n<p><a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=2.1%20The%20HTML%20syntax%20tree\" target=\"_blank\" rel=\"noopener\">Jongeneel's <code>createElement<\/code><\/a> returns a different shape, <code>{ kind, tagname, props, childeren, key }<\/code> (<code>childeren<\/code> is his spelling), with the children in a field beside <code>props<\/code>. Three of its choices matter to the tests. It runs <code>delete props.key<\/code> on the object it receives, which doubles as the <code>props<\/code> of the node. The caller's props change, and the key sits on the node instead of in <code>props<\/code>. It reads <code>props.key<\/code> without a guard, so <code>null<\/code> props throw. And it takes only nodes as children: text goes through a separate <code>createText<\/code> that turns its value into a string. R6 and R7 catch the first, R5 the second, R3 the third.<\/p>"},"need":{"new":[{"id":"js-modules","title":"ES modules: import and export","note":"<code>createElement.js<\/code> exports by name, and the entry program imports from it.","group":"JavaScript","from":"01"},{"id":"js-objects","title":"Objects, spread and destructuring","note":"an element is a plain object, and its props begin as a copy of the props you receive.","group":"JavaScript","from":"01"},{"id":"js-rest-spread","title":"Rest parameters and spread arguments","note":"after <code>props<\/code> come any number of arguments, and the children are those.","group":"JavaScript","from":"01"},{"id":"js-typeof","title":"typeof and the types you meet","note":"<code>typeof<\/code> is how you tell a string or a number from an element.","group":"JavaScript","from":"01"},{"id":"js-arrays","title":"Array methods","note":"children in, a different list of children out.","group":"JavaScript","from":"01"},{"id":"js-errors","title":"throw, try, catch and finally","note":"the starter throws <code>not implemented: ...<\/code> until you replace it, and the checker treats that as work not done yet, not as a crash.","group":"JavaScript","from":"01"},{"id":"js-async-await","title":"async, await and top-level await","note":"the entry program awaits the harness before it exits.","group":"JavaScript","from":"01"},{"id":"node-install","title":"Install and check Node.js 26","note":"your entry program runs under <code>node<\/code>.","group":"Tools and the checker","from":"01"},{"id":"node-process","title":"process.argv, exit codes and node --check","note":"<code>process.argv<\/code> is where the input path and the output path show up in the entry program.","group":"Tools and the checker","from":"01"},{"id":"workbook-check","title":"The checker","note":"the commands listed under Checking your solution.","group":"Tools and the checker","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"<code>call<\/code>, <code>props<\/code> and <code>show<\/code>, the three kinds of scenario line.","group":"Tools and the checker","from":"01"},{"id":"workbook-oracle","title":"Where the expected output comes from","note":"here, a model written from the rules below and checked against <code>React.createElement<\/code> wherever the two agree.","group":"Tools and the checker","from":"01"},{"id":"python-launcher","title":"py -P and Python 3.11","note":"what you need to run the checker, which is a Python program.","group":"Tools and the checker","from":"01"},{"id":"react-elements","title":"Elements, and what JSX turns into","note":"the shape <code>createElement<\/code> returns, and why the app code writes its calls out by hand.","group":"React and the ideas in the posts","from":"01"},{"id":"react-today","title":"React 19 against the posts","note":"where real React differs from the posts. You meet it again in the last section here.","group":"React and the ideas in the posts","from":"01"}],"earlier":[]}},{"id":"02","num":"2","title":"DOM nodes and props","difficulty":"Medium","tests":50,"problem":"problems/02-dom-props.md","entry":"solutions/assignments/assignment_02_dom_props.js","files":[{"path":"solutions/assignments/assignment_02_dom_props.js","role":"entry","purpose":null,"job":"Give `runScenarioFile` your `createDom` and `updateDom`. The scenario creates one node, updates it a few times and clicks it.","blank":"// ======================================================================================\n// Assignment 02: DOM nodes and props\n// Problem: problems/02-dom-props.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 02 as `python -P tools/run_js.py\n//   solutions 02 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 02` (`./check.sh 02` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Give `runScenarioFile` your `createDom` and `updateDom`. The scenario creates one\n//   node, updates it a few times and clicks it.\n//\n// The other files of this assignment:\n//   You also write src/didact/dom.js in this assignment; each one gives its job at the\n//   top.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as dom from '../src/didact/dom.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 02: DOM nodes and props\n// Problem: problems/02-dom-props.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 02 as `python -P tools/run_js.py\n//   solutions 02 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 02` (`./check.sh 02` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/didact/dom.js in this assignment; each one gives its job at the\n//   top.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as dom from '../src/didact/dom.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { createDom, updateDom } from '../src/didact/dom.js'; // createDom and updateDom (assignment 02): the functions under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { createDom, updateDom });\n"},{"path":"solutions/src/didact/dom.js","role":"new","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props.","job":"Make `createDom` return the node for an element, and `updateDom(dom, prevProps, nextProps)` write only what changed. New and changed properties get set, removed ones get cleared, and a listener is swapped when its handler changed.","blank":"// ======================================================================================\n// Assignment 02: DOM nodes and props\n// Problem: problems/02-dom-props.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Two jobs on a single DOM node: build it from an element, and bring its properties and\n//   listeners in line with new props.\n//\n// Your job:\n//   Make `createDom` return the node for an element, and `updateDom(dom, prevProps,\n//   nextProps)` write only what changed. New and changed properties get set, removed ones\n//   get cleared, and a listener is swapped when its handler changed.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 02: DOM nodes and props\n// Problem: problems/02-dom-props.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Two jobs on a single DOM node: build it from an element, and bring its properties and\n//   listeners in line with new props.\n//\n// Your job:\n//   Make `createDom` return the node for an element, and `updateDom(dom, prevProps,\n//   nextProps)` write only what changed. New and changed properties get set, removed ones\n//   get cleared, and a listener is swapped when its handler changed. The Boilerplate gives\n//   you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nexport function createDom(element) {\n  // TODO: see \"How props reach a node\" and Requirements R1 to R5 on the page.\n  throw new Error('not implemented: createDom');\n}\n\nexport function updateDom(dom, prevProps, nextProps) {\n  // TODO: see \"How props reach a node\" and Requirements R2 and R4 to R9 on the page.\n  throw new Error('not implemented: updateDom');\n}\n"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-functions-closures\">closures<\/a>","<a href=\"#primer/js-object-keys\">Object.keys, entries and in<\/a>","<a href=\"#primer/js-equality\">=== and falsy values<\/a>","<a href=\"#primer/js-string-methods\">string methods<\/a>"],"text":["closures","Object.keys, entries and in","=== and falsy values","string methods"]},{"label":"Library","items":["<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/dom-tree\">the DOM tree<\/a>","<a href=\"#primer/dom-create\">createElement and createTextNode<\/a>","<a href=\"#primer/dom-properties\">properties and attributes<\/a>","<a href=\"#primer/dom-events\">listeners, event types and bubbling<\/a>"],"text":["the DOM tree","createElement and createTextNode","properties and attributes","listeners, event types and bubbling"]}],"body":"<div class=\"d-problem flow\"><p>Write the two functions that put props on a DOM node. <code>createDom(element)<\/code> makes the node for an element, and <code>updateDom(dom, prevProps, nextProps)<\/code> moves a node from one set of props to the next, touching as little as it can. A scenario creates a node, updates it, clicks it, then prints the node's state along with a count of what your code did to it.<\/p>\n<h3>The module<\/h3>\n<p><code>src/didact/dom.js<\/code> exports:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Export<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>createDom(element)<\/code><\/td><td><code>element<\/code> is <code>{ type, props }<\/code>. Returns a new node that is not attached to anything: a text node when <code>type<\/code> is <code>&quot;TEXT_ELEMENT&quot;<\/code>, otherwise an element whose tag is <code>type<\/code>. The props are put on it as in <code>updateDom(dom, {}, element.props)<\/code>.<\/td><\/tr><tr><td><code>updateDom(dom, prevProps, nextProps)<\/code><\/td><td>Changes <code>dom<\/code> so that it reflects <code>nextProps<\/code>, given that it reflects <code>prevProps<\/code> already. Returns nothing.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Both reach the DOM through the global <code>document<\/code>. The harness installs it before calling your functions, but possibly after your module has loaded, so read <code>document<\/code> inside the functions and leave the top of the file alone.<\/p>\n<h3>Input<\/h3>\n<p>Each test is <code>node assignments/assignment_02_dom_props.js &lt;input-file&gt; &lt;output-file&gt;<\/code>, run by the checker. The entry program is built like the one in 01 with a different library object: it imports <code>createDom<\/code> and <code>updateDom<\/code> from your <code>dom.js<\/code> and <code>runScenarioFile<\/code> from <code>../harness/scenario.js<\/code>, then awaits <code>runScenarioFile(process.argv[2], process.argv[3], { createDom, updateDom })<\/code>. The Boilerplate ships it finished. From scratch, write them first. The commands are:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>create &lt;tag|text&gt; [prop ...]<\/code><\/td><td>Calls <code>createDom({ type, props })<\/code>, with <code>text<\/code> standing for the type <code>TEXT_ELEMENT<\/code>, and keeps the node it returns. Any node kept earlier is dropped.<\/td><\/tr><tr><td><code>update [prop ...]<\/code><\/td><td>Calls <code>updateDom(node, prev, next)<\/code> on the kept node, where <code>prev<\/code> is the props of the last <code>create<\/code> or <code>update<\/code> and <code>next<\/code> is the props on this line. Then <code>next<\/code> becomes <code>prev<\/code>.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>Dispatches a bubbling <code>click<\/code> on the kept node, which must have that id. The node is not in any document, and the harness finds it anyway.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the kept node.<\/td><\/tr><tr><td><code>ops create write addListener removeListener<\/code><\/td><td>Prints four counters, described under Output.<\/td><\/tr><tr><td><code>log<\/code><\/td><td>Prints the handler calls recorded since the last <code>log<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Props are written like attributes: <code>id=a<\/code>, <code>title=&quot;two words&quot;<\/code>, <code>title=&#x27;say &quot;hi&quot;&#x27;<\/code>. Every value is a string, a bare name such as <code>disabled<\/code> means <code>true<\/code>, and <code>onClick=@one<\/code> is a handler, where <code>@one<\/code> is a single function that records the word <code>one<\/code> in the log when it is called (every <code>@one<\/code> in a scenario is that same function). The props object that <code>create<\/code> and <code>update<\/code> hand you carries <code>children: []<\/code> next to the listed props.<\/p>\n<h3>Output<\/h3>\n<p><code>dump<\/code> prints <code>dump &lt;n&gt;<\/code>, where <code>n<\/code> counts the dumps, then one line for the kept node:<\/p>\n<pre><code>node 0 &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext 0 &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p>A dump labels the first node it shows <code>a<\/code> and the next new one <code>b<\/code>, and so on; a node keeps its label from then on. <code>&lt;tag&gt;<\/code> is lower case. <code>&lt;props&gt;<\/code> lists the values that differ from the default for <code>className<\/code>, <code>disabled<\/code> (on <code>button<\/code>, <code>input<\/code> and <code>textarea<\/code>), <code>id<\/code>, <code>title<\/code> and <code>value<\/code> (on <code>input<\/code> and <code>textarea<\/code>). They come sorted by name and joined with single spaces, each as <code>name=value<\/code>, with <code>true<\/code> printed for a boolean. A value that contains whitespace, a double quote or <code>%<\/code> is percent-encoded (<code>encodeURIComponent<\/code>), so <code>two words<\/code> prints as <code>two%20words<\/code>. An element with nothing to list prints <code>&quot;&quot;<\/code>. Props the dump has never heard of, <code>lang<\/code> for one, do not show. A text node prints its <code>nodeValue<\/code>, with <code>%<\/code>, <code>&quot;<\/code> and line breaks encoded and spaces kept, and prints no line at all while its text is empty.<\/p>\n<p>After <code>ops create write addListener removeListener<\/code> the output is one line, <code>ops &lt;create&gt; &lt;write&gt; &lt;addListener&gt; &lt;removeListener&gt;<\/code>, and the counters go back to 0. They measure what your code did to DOM objects since the previous <code>ops<\/code> or the start of the scenario:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Counter<\/th><th>Counts<\/th><\/tr><\/thead><tbody><tr><td><code>create<\/code><\/td><td>calls of <code>document.createElement<\/code> and <code>document.createTextNode<\/code><\/td><\/tr><tr><td><code>write<\/code><\/td><td>assignments to a property of the node, <code>nodeValue<\/code> and made-up property names included<\/td><\/tr><tr><td><code>addListener<\/code><\/td><td>calls of <code>addEventListener<\/code>, whether or not they change anything<\/td><\/tr><tr><td><code>removeListener<\/code><\/td><td>calls of <code>removeEventListener<\/code>, the same<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Each run of a <code>@name<\/code> handler since the last <code>log<\/code> produces one <code>log &lt;name&gt;<\/code> line, in the order they ran.<\/p>\n<h3>How props reach a node<\/h3>\n<p>Every name in <code>prevProps<\/code> or <code>nextProps<\/code> falls into one of four groups. It is new if only <code>nextProps<\/code> has it, gone if only <code>prevProps<\/code> has it, changed if both have it with values that are not <code>===<\/code>, and unchanged otherwise.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Kind of name<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td><code>children<\/code> and <code>key<\/code><\/td><td>Ignored, in every group.<\/td><\/tr><tr><td>starts with <code>on<\/code><\/td><td>A handler. Its event type is the rest of the name in lower case (<code>onClick<\/code> listens to <code>click<\/code>). Not assigned as a property.<\/td><\/tr><tr><td>anything else<\/td><td>A property of the node: <code>dom[name] = value<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>What each group costs, for a property and for a handler:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Group<\/th><th>Property <code>name<\/code><\/th><th>Handler <code>onX<\/code> with type <code>x<\/code><\/th><\/tr><\/thead><tbody><tr><td>new<\/td><td><code>dom[name] = value<\/code><\/td><td><code>addEventListener(x, handler)<\/code><\/td><\/tr><tr><td>changed<\/td><td><code>dom[name] = value<\/code><\/td><td><code>removeEventListener(x, oldHandler)<\/code>, then <code>addEventListener(x, newHandler)<\/code><\/td><\/tr><tr><td>gone<\/td><td><code>dom[name] = &quot;&quot;<\/code>, which makes the node report its default again<\/td><td><code>removeEventListener(x, oldHandler)<\/code><\/td><\/tr><tr><td>unchanged<\/td><td>nothing<\/td><td>nothing<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A new value that happens to be falsy, <code>&quot;&quot;<\/code> say, is still a value and gets written. A handler is unchanged when it is the same function, and the scenario's <code>@one<\/code> is the same function wherever it appears. The props are plain objects with their own names, so to tell that a name is gone, <code>name in nextProps<\/code> and <code>Object.hasOwn(nextProps, name)<\/code> both work.<\/p>\n<p>A text element looks like <code>{ type: &quot;TEXT_ELEMENT&quot;, props: { nodeValue, children: [] } }<\/code>. Create the text node empty and give it its text by writing <code>nodeValue<\/code>, as you would for any other property. That write is the node's only cost, which makes a text node one create and one write. Later changes to the text are updates of <code>nodeValue<\/code> under the same rules.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>createDom<\/code> returns an element whose tag is the element's type.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>children<\/code> and <code>key<\/code> are never assigned to the node, by <code>createDom<\/code> or by <code>updateDom<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A <code>TEXT_ELEMENT<\/code> becomes a text node holding its <code>nodeValue<\/code>, at a cost of one create and one write.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Props are assigned as properties of the node, at creation and when new in an update.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A prop whose name starts with <code>on<\/code> becomes a listener for the lower-cased rest of the name, and is not assigned as a property.<\/span><\/li><li><span class=\"rid\">R6<\/span><span><code>updateDom<\/code> writes only props that are new or whose value differs from before, falsy values included.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>A prop that is missing from <code>nextProps<\/code> is cleared with one write, and the node reports its default again.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>A changed handler loses its old listener and gets the new one, an unchanged handler is left alone, a removed handler is removed.<\/span><\/li><li><span class=\"rid\">R9<\/span><span><code>updateDom<\/code> on a text node writes a changed <code>nodeValue<\/code> and clears it when it is gone.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Longer sequences of <code>create<\/code>, <code>update<\/code>, <code>click<\/code> and <code>ops<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Values are ASCII strings, with a leading <code>@<\/code> only on handlers, and the handler props are <code>onClick<\/code>, <code>onclick<\/code>, <code>onMouseDown<\/code> and <code>onInput<\/code>. <code>click<\/code> is only used on a node that has an id and, where it is meant to produce a log line, a click handler. No scenario passes <code>children<\/code> as a listed prop, and no name that starts with <code>on<\/code> gets a value other than a handler. A scenario has 40 lines at most. The 50 tests are each requirement's cases plus two long scripted sequences and six seeded random ones (<code>-Fresh<\/code> draws six new ones). Milliseconds is what a correct solution takes; the limit is 10 seconds per test.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/dom.js","text":"// Assignment 02: the two places the library touches a real DOM node.\n\nconst isEvent = (name) => name.startsWith('on');\nconst isProperty = (name) => name !== 'children' && name !== 'key' && !isEvent(name);\nconst eventType = (name) => name.toLowerCase().substring(2); // onClick -> click\n\nexport function createDom(element) {\n  const dom =\n    element.type === 'TEXT_ELEMENT' ? document.createTextNode('') : document.createElement(element.type);\n  updateDom(dom, {}, element.props);\n  return dom;\n}\n\n// Brings dom in line with nextProps and touches only what differs from prevProps.\nexport function updateDom(dom, prevProps, nextProps) {\n  const isNew = (name) => prevProps[name] !== nextProps[name];\n  const isGone = (name) => !(name in nextProps);\n  const prevNames = Object.keys(prevProps);\n  const nextNames = Object.keys(nextProps);\n\n  // A changed handler is a different function, so the old one has to come off first.\n  for (const name of prevNames.filter(isEvent)) {\n    if (isGone(name) || isNew(name)) dom.removeEventListener(eventType(name), prevProps[name]);\n  }\n  for (const name of prevNames.filter(isProperty)) {\n    if (isGone(name)) dom[name] = '';\n  }\n  for (const name of nextNames.filter(isProperty)) {\n    if (isNew(name)) dom[name] = nextProps[name];\n  }\n  for (const name of nextNames.filter(isEvent)) {\n    if (isNew(name)) dom.addEventListener(eventType(name), nextProps[name]);\n  }\n}\n"},{"path":"assignments/assignment_02_dom_props.js","text":"// Assignment 02: the checker runs this program as `node assignments/assignment_02_dom_props.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport { createDom, updateDom } from '../src/didact/dom.js'; // createDom and updateDom (assignment 02): the functions under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { createDom, updateDom });\n"}],"also":[],"proof":{"passed":50,"total":50,"date":"2026-11-01"},"given":["harness/scenario.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js","harness/env.js"]},"read":"<p>You do not need the post for this one. If you want Pombo's account anyway, there are two stretches. In <a href=\"https://pomb.us/build-your-own-react/#step-ii-the-render-function\" target=\"_blank\" rel=\"noopener\">Step II<\/a>, the paragraphs that make a text node for a text element, then the ones that <a href=\"https://pomb.us/build-your-own-react/#:~:text=The%20last%20thing%20we%20need%20to%20do%20here\" target=\"_blank\" rel=\"noopener\">assign the props<\/a>. In Step VI, from <a href=\"https://pomb.us/build-your-own-react/#:~:text=One%20special%20kind%20of%20prop\" target=\"_blank\" rel=\"noopener\">One special kind of prop<\/a> and the three paragraphs ahead of it, up to the link to the sandbox. The code in both is the author's version of what you are about to write.<\/p>","readTitle":"Read in the blog first","context":"<p>Elements from 01 only describe a page. Here Didact first touches a real node. The first render in 03 calls <code>createDom<\/code>, and once the library can compare two renders, the commit calls <code>updateDom<\/code> on a node it keeps. Your file is <code>src/didact/dom.js<\/code>.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-ii-the-render-function\" target=\"_blank\" rel=\"noopener\">Step II: The render Function<\/a> and, in <a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Step VI<\/a>, the part on <code>updateDom<\/code> and event listeners<\/li><li>MDN: <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document/createElement\" target=\"_blank\" rel=\"noopener\">document.createElement<\/a>, <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document/createTextNode\" target=\"_blank\" rel=\"noopener\">document.createTextNode<\/a>, <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/nodeValue\" target=\"_blank\" rel=\"noopener\">Node.nodeValue<\/a>, <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener\" target=\"_blank\" rel=\"noopener\">addEventListener<\/a> and <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/removeEventListener\" target=\"_blank\" rel=\"noopener\">removeEventListener<\/a><\/li><li>Wim Jongeneel, <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=4.1%20Rendering%20a%20virtual%20DOM\" target=\"_blank\" rel=\"noopener\">Rendering a virtual DOM<\/a> and <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=4.2%20Applying%20a%20diff%20to%20a%20HTML%20element\" target=\"_blank\" rel=\"noopener\">Applying a diff to a HTML element<\/a>, for a version that assigns props as properties<\/li><li>The harness's own DOM, <code>harness/minidom.js<\/code>, which counts what your code does to it<\/li><\/ul>","checking":"<pre><code>.\\check 02                          every test, grouped by requirement\n.\\check 02 -Case 02-R8-swap         one test with its full input, the expected lines and yours\n.\\check 02 -Fresh                   six new random sequences, to try your code on scenarios you have not seen\n.\\check 02 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>An <code>updateDom<\/code> that adds the new handler and forgets to remove the old one fails like this, with the first handler still running:<\/p>\n<pre><code>  R8  A changed handler loses its old listener and gets a new one, an u... .    4 / 10  FAILED\n      x 02-R8-swap-three-times  a, b, c, a: each click runs exactly the current handler\n          log[0]: expected (text=b), got (text=a) - differs in text\n          likely cause: R8 - A changed handler loses its old listener and gets a new one, an unchanged one is left alone, a removed one is removed\n          expected values from: definition-level model in tools/gen_p02.py (property slots, listener map keyed by event type, set arithmetic over prop maps)\n          reproduce: py -P tools/run_js.py build/bugs/02/changed-handler-keeps-old-listener 02 build/cases/02/02-R8-swap-three-times.in build/cases/02/02-R8-swap-three-times.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Start with <code>create div id=a<\/code> and a <code>dump<\/code>. Add an <code>update<\/code> with the same props and a second <code>ops<\/code>, and the right answer is four zeros. Every rule here comes down to which props earn a write and which listeners earn a call. <code>ops<\/code> shows you which.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Two small predicates help, one for \"this name is a handler\" and one for \"this name is a property I should write\", plus a function that turns <code>onClick<\/code> into <code>click<\/code>. Then make four passes over the two props objects: take off the handlers that are gone or changed, clear the properties that are gone, set the properties that are new or changed, and put on the handlers that are new or changed. After that <code>createDom<\/code> is little more than picking the node kind and calling <code>updateDom<\/code> with empty previous props.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Gone and falsy are different things. A prop still in <code>nextProps<\/code> with the value <code>&quot;&quot;<\/code> is not gone, and it gets written.<\/li><li>Remove a listener with the function you added, which is the one in <code>prevProps<\/code>. The new function matches nothing.<\/li><li>Remove the old listener before you add the new one, or the node listens twice.<\/li><li>A handler is not a property. Assign it as <code>dom.onClick<\/code> too and <code>write<\/code> comes out one too high.<\/li><li>Lower-case <code>onClick<\/code> to <code>click<\/code>, or nothing ever hears the click.<\/li><li>Every props object you get has <code>children<\/code> in it. Skip it, and skip <code>key<\/code> as well.<\/li><li>A text node gets its text through the same path as the other props, which is what makes it count as a write.<\/li><li>A removed handler leaves no property behind, so there is no <code>&quot;&quot;<\/code> to write for it.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>isEvent(name):     name starts with &quot;on&quot;\nisProperty(name):  name is not &quot;children&quot;, not &quot;key&quot;, and not isEvent(name)\neventType(name):   lower-case the name and drop the first two letters\n\ncreateDom(element):\n    dom = a text node containing &quot;&quot; if element.type is &quot;TEXT_ELEMENT&quot;, else an element with that tag\n    updateDom(dom, {}, element.props)\n    return dom\n\nupdateDom(dom, prevProps, nextProps):\n    for each handler name in prevProps that is gone or has another function in nextProps:\n        removeEventListener(eventType(name), prevProps[name])\n    for each property name in prevProps that is not in nextProps:\n        dom[name] = &quot;&quot;\n    for each property name in nextProps whose value differs from prevProps[name]:\n        dom[name] = nextProps[name]\n    for each handler name in nextProps whose function differs from prevProps[name]:\n        addEventListener(eventType(name), nextProps[name])<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a text node","test":"02-R3-text","input":"create text nodeValue=hello\ndump\nops create write addListener removeListener","output":"dump 1\ntext 0 \"hello\"\nops 1 1 0 0","image":null,"explain":"<p>One prop in the scenario, and the counters read one create and one write. The create is the text node. The write is <code>nodeValue<\/code>, assigned once the node exists, like any other prop. Build the node with its text already inside and skip the assignment, and you get <code>ops 1 0 0 0<\/code>. That fails.<\/p>"},{"label":"Example 2","name":"three props, then none of the two","test":"02-R7-input","input":"create input id=i value=v disabled\ndump\nupdate id=i\ndump\nops create write addListener removeListener","output":"dump 1\nnode 0 a input \"disabled=true id=i value=v\"\ndump 2\nnode 0 a input \"id=i\"\nops 1 5 0 0","image":null,"explain":"<p><code>ops<\/code> comes only at the end, so its counters add up both steps. Creation writes three props, <code>id<\/code>, <code>value<\/code> and <code>disabled<\/code>. The update leaves <code>id<\/code> alone and clears <code>value<\/code> and <code>disabled<\/code> with one write each: three plus two is five. The second dump shows both back at their defaults.<\/p>"},{"label":"Example 3","name":"a handler swapped","test":"02-R8-swap","input":"create button id=b onClick=@a\nclick #b\nlog\nops create write addListener removeListener\nupdate id=b onClick=@b\nops create write addListener removeListener\nclick #b\nlog","output":"log a\nops 1 1 1 0\nops 0 0 1 1\nlog b","image":null,"explain":"<p>Creation writes <code>id<\/code> and adds a listener, which gives <code>1 1 1 0<\/code> on the first <code>ops<\/code>. The update changes only the handler. <code>id<\/code> is unchanged, and <code>@a<\/code> and <code>@b<\/code> are different functions, and the old listener comes off while the new one goes on: <code>0 0 1 1<\/code>. The second click then calls <code>b<\/code> and nothing else. With <code>a<\/code> still registered, the last <code>log<\/code> would print both.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-vi-reconciliation\" target=\"_blank\" rel=\"noopener\">Pombo's post<\/a> splits the DOM work into two functions. <code>createDom(fiber)<\/code> makes the node and calls <code>updateDom(dom, {}, fiber.props)<\/code> (it takes a fiber where this page takes an element, but both carry <code>type<\/code> and <code>props<\/code>), and <code>updateDom(dom, prevProps, nextProps)<\/code> does the rest. Four helpers, <code>isEvent<\/code>, <code>isProperty<\/code>, <code>isNew<\/code> and <code>isGone<\/code>, pick the names for four passes: remove the listeners that are gone or changed, blank the properties that are gone, assign the properties that are new or changed, add the listeners that are new or changed. The event type is the prop name in lower case without its first two letters. The tests assume this structure.<\/p>\n<p>The post's <code>isProperty<\/code> leaves out <code>children<\/code> and the event names and nothing else, so a <code>key<\/code> prop lands on its node as a property of its own. The spec here writes no such thing: R2 fails the post's version, and so do the longer tests that put a <code>key<\/code> in their props. The post also treats any name that starts with <code>on<\/code> as a handler, <code>once<\/code> or <code>online<\/code> included, and an event name such as <code>onDoubleClick<\/code> becomes <code>doubleclick<\/code>, which no browser fires. The tests use neither.<\/p>\n<p>Jongeneel's <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=4.1%20Rendering%20a%20virtual%20DOM\" target=\"_blank\" rel=\"noopener\">renderer<\/a> assigns every prop as a property, handlers too (<code>elem.onclick = fn<\/code>), so a changed handler replaces the old one without a removal. It also creates a text node with its text already inside, and changed text becomes a new node instead of a <code>nodeValue<\/code> write. R3 and R9 would fail both. When he <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=4.2%20Applying%20a%20diff%20to%20a%20HTML%20element\" target=\"_blank\" rel=\"noopener\">applies a diff<\/a>, the loop that removes props runs over array indexes, and the list it runs over was <a href=\"https://itnext.io/creating-our-own-react-from-scratch-82dd6356676d#:~:text=3.1%20Creating%20the%20diff%20of%20an%20element\" target=\"_blank\" rel=\"noopener\">worked out<\/a> against the wrong object, so no removed prop is ever cleared and R7 catches it. React 19 works another way again: it sets most props as attributes and keeps listeners on the root. <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> has the rows \"Props on DOM nodes\" and \"Events\".<\/p>"},"need":{"new":[{"id":"js-functions-closures","title":"Arrow functions and closures","note":"the handlers in the scenarios are plain functions. A name always stands for the same function, and that is how an unchanged handler differs from a new one.","group":"JavaScript","from":"02"},{"id":"js-object-keys","title":"Object.keys, Object.entries, Object.hasOwn and in","note":"walking the names of a props object, and asking whether a name is still there.","group":"JavaScript","from":"02"},{"id":"js-equality","title":"===, Object.is, truthy and falsy","note":"<code>===<\/code> decides whether two values are the same prop. The empty string is falsy, which matters when you ask whether a prop was given.","group":"JavaScript","from":"02"},{"id":"js-string-methods","title":"String methods","note":"<code>onClick<\/code> to <code>click<\/code>.","group":"JavaScript","from":"02"},{"id":"dom-tree","title":"The DOM tree: elements and text nodes","note":"a text node has nothing of its own but its text.","group":"The DOM","from":"02"},{"id":"dom-create","title":"createElement and createTextNode","note":"one call per kind of node.","group":"The DOM","from":"02"},{"id":"dom-properties","title":"Properties and attributes","note":"assigning <code>id<\/code>, <code>className<\/code>, <code>title<\/code>, <code>value<\/code>, <code>disabled<\/code> and <code>nodeValue<\/code> as properties.","group":"The DOM","from":"02"},{"id":"dom-events","title":"Listeners, event types and bubbling","note":"a listener belongs to an event type, and it comes off only when you pass the function that went on.","group":"The DOM","from":"02"}],"earlier":[{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"js-objects","title":"Objects, spread and destructuring","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"}]}},{"id":"03","num":"3","title":"Render a tree","difficulty":"Easy","tests":46,"problem":"problems/03-first-render.md","entry":"solutions/assignments/assignment_03_first_render.js","files":[{"path":"solutions/assignments/assignment_03_first_render.js","role":"entry","purpose":null,"job":"Hand `runScenarioFile` the `render` from `renderSync.js`. The scenario renders a tree and dumps the container.","blank":"// ======================================================================================\n// Assignment 03: Render a tree\n// Problem: problems/03-first-render.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 03 as `python -P tools/run_js.py\n//   solutions 03 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 03` (`./check.sh 03` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Hand `runScenarioFile` the `render` from `renderSync.js`. The scenario renders a tree\n//   and dumps the container.\n//\n// The other files of this assignment:\n//   You also write src/didact/renderSync.js in this assignment; each one gives its job at\n//   the top.\n//   Earlier files you can use: src/didact/dom.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as renderSync from '../src/didact/renderSync.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 03: Render a tree\n// Problem: problems/03-first-render.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 03 as `python -P tools/run_js.py\n//   solutions 03 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 03` (`./check.sh 03` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/didact/renderSync.js in this assignment; each one gives its job at\n//   the top.\n//   Earlier files you can use: src/didact/dom.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as renderSync from '../src/didact/renderSync.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { render } from '../src/didact/renderSync.js'; // render (assignment 03): the recursive first draft under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { render });\n"},{"path":"solutions/src/didact/renderSync.js","role":"new","purpose":"A first draft of `render`: recurse through the tree and append nodes as you go. Assignment 4 replaces it with a work loop. The file stays for comparison.","job":"Implement `render(element, container)`: build the DOM for the element and for each child below it, and append the result to the container.","blank":"// ======================================================================================\n// Assignment 03: Render a tree\n// Problem: problems/03-first-render.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   A first draft of `render`: recurse through the tree and append nodes as you go.\n//   Assignment 4 replaces it with a work loop. The file stays for comparison.\n//\n// Your job:\n//   Implement `render(element, container)`: build the DOM for the element and for each\n//   child below it, and append the result to the container.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 03: Render a tree\n// Problem: problems/03-first-render.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   A first draft of `render`: recurse through the tree and append nodes as you go.\n//   Assignment 4 replaces it with a work loop. The file stays for comparison.\n//\n// Your job:\n//   Implement `render(element, container)`: build the DOM for the element and for each\n//   child below it, and append the result to the container. The Boilerplate gives you the\n//   declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { createDom } from './dom.js'; // createDom (assignment 02): makes the DOM node, with its props, for one element\n\nexport function render(element, container) {\n  // TODO: see \"What `render` builds\" and Requirements R1 to R6 on the page.\n  throw new Error('not implemented: render');\n}\n"}],"buildsOn":[{"path":"solutions/src/didact/dom.js","owner":"02","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-loops\">loops<\/a>","<a href=\"#primer/js-modules\">ES modules<\/a>"],"text":["loops","ES modules"]},{"label":"Library","items":["<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/dom-tree-editing\">appendChild, insertBefore and removeChild<\/a>","<a href=\"#primer/react-tree\">trees of elements<\/a>"],"text":["appendChild, insertBefore and removeChild","trees of elements"]}],"body":"<div class=\"d-problem flow\"><p>Write <code>render(element, container)<\/code>. It receives an element tree and an empty DOM node, builds the nodes for the whole tree with your <code>createDom<\/code> from 02, and puts them under that node. A scenario renders a tree, dumps the container, and clicks things to find out whether the handlers made it.<\/p>\n<h3>The module<\/h3>\n<p><code>src/didact/renderSync.js<\/code> exports <code>render(element, container)<\/code>. It returns nothing, and when it returns the whole tree is in the container. Elements arrive as <code>{ type, props }<\/code> objects in the format of assignment 01: <code>props.children<\/code> is always an array, and a string child is already a text element.<\/p>\n<h3>Input<\/h3>\n<p>For each test the checker launches <code>node assignments/assignment_03_first_render.js &lt;input-file&gt; &lt;output-file&gt;<\/code>. The entry program hands the harness one function. It imports <code>render<\/code> from your <code>renderSync.js<\/code> and <code>runScenarioFile<\/code> from <code>../harness/scenario.js<\/code>, then awaits <code>runScenarioFile(process.argv[2], process.argv[3], { render })<\/code>. The Boilerplate includes it finished, and a from-scratch start needs it before the first test. A scenario is made of these lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Parses one line of markup into a tree and stores it. Nothing is rendered yet.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td>Builds the elements of the stored tree and calls <code>render(element, container)<\/code> with the page's empty container.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Runs any scheduled work to the end. Your <code>render<\/code> schedules none, so here it does nothing, and every scenario has one after <code>render<\/code>.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the container's contents, as described under Output.<\/td><\/tr><tr><td><code>click #&lt;id&gt;<\/code><\/td><td>Dispatches a bubbling <code>click<\/code> on the element with that id, which has to be in the container.<\/td><\/tr><tr><td><code>log<\/code><\/td><td>Prints the handler calls recorded since the last <code>log<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The markup is one line of HTML-like text: <code>&lt;tag name=&quot;value&quot; other=value flag onClick=@hit&gt;text &lt;b&gt;nested&lt;/b&gt;&lt;/tag&gt;<\/code>. Values are strings; a bare name such as <code>disabled<\/code> means <code>true<\/code>. <code>@hit<\/code> is a handler, one function that records the word <code>hit<\/code> in the log whenever it runs, and one name always means one function. Text between tags keeps its inner spaces, but whitespace-only text is dropped before it reaches the tree. <code>input<\/code>, <code>br<\/code>, <code>hr<\/code> and <code>img<\/code> take no closing tag. The harness builds the elements with its own copy of <code>createElement<\/code>, so your assignment 01 is not involved.<\/p>\n<h3>Output<\/h3>\n<p><code>dump<\/code> prints <code>dump &lt;n&gt;<\/code>, where <code>n<\/code> counts the dumps, followed by one line for each element and each run of text in the container, parents before their children, in document order:<\/p>\n<pre><code>node &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p>The container itself is left out, so its first child sits at depth 0 and every level below adds 1. An element gets the next free label (<code>a<\/code>, <code>b<\/code>, ..., <code>z<\/code>, <code>aa<\/code>, ...) the first time a dump shows it, which makes labels run in document order within a single dump. <code>&lt;tag&gt;<\/code> is lower case. <code>&lt;props&gt;<\/code> lists the values that differ from the default for <code>className<\/code>, <code>disabled<\/code> (on <code>button<\/code>, <code>input<\/code> and <code>textarea<\/code>), <code>id<\/code>, <code>title<\/code> and <code>value<\/code> (on <code>input<\/code> and <code>textarea<\/code>), sorted by name and joined with single spaces. A value with whitespace, a double quote or <code>%<\/code> is percent-encoded, and a boolean prints as <code>true<\/code>. Props outside that list, <code>lang<\/code> for example, do not show. A text line shows the node's text with <code>%<\/code>, double quotes and line breaks encoded, and spaces left alone. Neighbouring text nodes print as one line. An empty container prints only the <code>dump &lt;n&gt;<\/code> line. No <code>title<\/code> line appears in these scenarios, because <code>document.title<\/code> stays empty.<\/p>\n<p>Each handler call is printed as <code>log &lt;name&gt;<\/code>, in order.<\/p>\n<h3>What <code>render<\/code> builds<\/h3>\n<p>Every element becomes one node of its tag, and every text element one text node holding the text. A node's children are the nodes of the element's children, in the order the element lists them, and they sit inside that node, not beside it. The top element's node becomes the container's only child. Props and handlers reach each node the way <code>createDom<\/code> puts them there. A click on a node runs its handlers, then its parent's, and so on up through the container.<\/p>\n<p>Each scenario calls <code>render<\/code> once, onto an empty container: nothing to update, replace or clear.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>An element without children becomes one node with the element's tag, and it is the only child of the container once <code>render<\/code> has returned. The container is empty before <code>render<\/code> runs.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>The nodes of an element's children are inside its node, at every depth.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Siblings keep their order, and none is left out.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A string child becomes a text node at its place among its siblings, with its spaces kept.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>The props of an element are set on its node.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Handlers are attached: a click runs the handler of the node that was clicked and then those of its ancestors.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Whole pages and larger random trees.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Scenarios run to 10 lines at most. Every tag is lower case, which makes each element a plain host element with a string type, and no component appears before assignment 09. A tree has at most about 200 nodes (elements and texts together) and none is deeper than 10 levels. The ids a scenario clicks are unique within their tree. The 46 tests are each requirement's cases, two scripted pages and seven seeded random trees (<code>-Fresh<\/code> gives seven new ones). A correct solution finishes in milliseconds, and a test gets 10 seconds.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/renderSync.js","text":"// Assignment 03: the first draft of render. The recursion cannot be interrupted halfway;\n// assignment 04 replaces it with a work loop and nothing imports this file after that.\nimport { createDom } from './dom.js';\n\nexport function render(element, container) {\n  const dom = createDom(element);\n  element.props.children.forEach((child) => render(child, dom));\n  container.appendChild(dom);\n}\n"},{"path":"assignments/assignment_03_first_render.js","text":"// Assignment 03: the checker runs this program as `node assignments/assignment_03_first_render.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport { render } from '../src/didact/renderSync.js'; // render (assignment 03): the recursive first draft under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], { render });\n"}],"also":["src/didact/dom.js"],"proof":{"passed":46,"total":46,"date":"2026-11-01"},"given":["harness/scenario.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js","harness/env.js"]},"read":"<p>Nothing here depends on the post. For Pombo's version, take the start of <a href=\"https://pomb.us/build-your-own-react/#step-ii-the-render-function\" target=\"_blank\" rel=\"noopener\">Step II: The render Function<\/a>, the paragraphs on creating a node from the element type and doing the same for each child. Stop before the one about props: <code>createDom<\/code> from assignment 02 already covers that. The opening of <a href=\"https://pomb.us/build-your-own-react/#step-iii-concurrent-mode\" target=\"_blank\" rel=\"noopener\">Step III<\/a> explains what is wrong with a recursion like this one, and it can wait for 04.<\/p>","readTitle":"Read in the blog first","context":"<p>Elements exist (01) and a node can be given its props (02). This assignment walks a whole tree of them, with <code>createDom<\/code> from <code>src/didact/dom.js<\/code> doing the work on each node. It is a first draft: one recursive call that cannot stop halfway, and 04 swaps it for a loop. You write <code>src/didact/renderSync.js<\/code>. After 04 nothing imports it.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-ii-the-render-function\" target=\"_blank\" rel=\"noopener\">Step II: The render Function<\/a> and the start of <a href=\"https://pomb.us/build-your
