          // In Vim's Normal and Visual modes, Tab belongs to Vim.
          Tab: (ed) => (vimNormal(ed) ? window.CodeMirror.Pass
            : ed.somethingSelected() ? ed.indentSelection('add') : ed.replaceSelection(' '.repeat(ed.getOption('indentUnit')), 'end')),
          'Shift-Tab': (ed) => (vimNormal(ed) ? window.CodeMirror.Pass : ed.execCommand('indentLess')),
        },
      });
      if (window.CodeMirror.Vim) {
        window.CodeMirror.Vim.defineEx('write', 'w', () => saveNow());
        cm.on('vim-mode-change', (e) => { vimMode = e.mode + (e.subMode ? ' ' + e.subMode : ''); showPos(); });
        setVim(!HOST && store.get('editor:vim') === '1');  // a published copy has no Vim: keys there mean "I want to type"
        if (HOST) $('#vim').hidden = true;
      } else {
        $('#vim').hidden = true;  // the keymap didn't load
      }
      cm.on('changes', saveSoon);
      cm.on('cursorActivity', showPos);
      if (HOST) {
        // The published copy is read-only: typing, pasting or dropping text into it opens the host's
        // "run it on your computer" dialog instead, so it's clear where the code gets written.
        cm.setOption('readOnly', true);
        cm.on('keydown', (ed, e) => { if (wantsToType(e)) { e.preventDefault(); runLocally(); } });
        ['paste', 'drop', 'cut'].forEach((type) => cm.getWrapperElement().addEventListener(type, (e) => { e.preventDefault(); runLocally(); }, true));
        // Phone keyboards and input methods send text without a key event.
        cm.getInputField().addEventListener('beforeinput', (e) => { e.preventDefault(); runLocally(); });
      }
      if (window.ResizeObserver) {
        let frame = 0;
        new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => cm.refresh()); }).observe(host);
      }
    } else {
      plainEditor = document.createElement('textarea');
      plainEditor.className = 'fallback-editor';
      plainEditor.spellcheck = false;
      plainEditor.setAttribute('aria-label', 'Code');
      host.appendChild(plainEditor);
      plainEditor.addEventListener('input', saveSoon);
      if (HOST) {
        plainEditor.readOnly = true;
        plainEditor.addEventListener('keydown', (e) => { if (wantsToType(e)) { e.preventDefault(); runLocally(); } });
        ['paste', 'drop', 'cut', 'beforeinput'].forEach((type) => plainEditor.addEventListener(type, (e) => { e.preventDefault(); runLocally(); }));
      }
    }
  }
  const code = () => (cm ? cm.getValue() : plainEditor.value);
  const EXT_MODES = { cpp: 'text/x-c++src', cc: 'text/x-c++src', cxx: 'text/x-c++src', h: 'text/x-c++src', hpp: 'text/x-c++src',
    c: 'text/x-csrc', java: 'text/x-java', cs: 'text/x-csharp', kt: 'text/x-kotlin', py: 'text/x-python', js: 'text/javascript',
    mjs: 'text/javascript', ts: 'text/typescript', rs: 'text/x-rustsrc', go: 'text/x-go', lua: 'text/x-lua' };
  const modeFor = (path) => EXT_MODES[(path.split('.').pop() || '').toLowerCase()] || 'text/plain';
  const docOf = (path) => docs[path];
  const textOf = (path) => (cm ? (docs[path] ? docs[path].getValue() : null) : path === live.active ? plainEditor.value : null);
  const fileIn = (c, path) => (c ? c.files.find((f) => f.path === path) || null : null);

  // Blank or boilerplate: a assignment's own files (its entry program and the files it creates) start
  // from one of them. Earlier files it adds to are never replaced.
  const ownFiles = (c) => c.files.filter((f) => f.role !== 'adds');
  // Boilerplate unless the learner chose to start from scratch (or there's no boilerplate).
  const kindOf = (c) => (store.get(c.id + ':kind') !== 'blank' && c.files.some((f) => f.boilerplate != null) ? 'boilerplate' : 'blank');
  const starterOf = (f, kind) => (kind === 'boilerplate' && f.boilerplate != null ? f.boilerplate : f.blank);
  const kindName = (kind) => (kind === 'boilerplate' ? 'Boilerplate' : 'From scratch');
  const kindPhrase = (kind) => (kind === 'boilerplate' ? 'the Boilerplate' : 'empty files (from scratch)');
  // The published book: what a file shows before you've typed in it.
  function startText(c, path) {
    const draft = store.get(draftKey(path)), f = fileIn(c, path);
    if (draft !== null) return draft;
    if (f) return starterOf(f, f.role === 'adds' ? 'blank' : kindOf(c));
    // A file of another assignment, opened from the Files panel without the study server: its starter.
    const owner = CPS.find((x) => x.files.some((g) => g.path === path && g.role !== 'adds'));
    return owner ? starterOf(fileIn(owner, path), kindOf(owner)) : '';
  }
  function useStarter(c, kind) {
    if (kind === 'blank') store.set(c.id + ':kind', kind); else store.del(c.id + ':kind');
    paintKind(c);
    if (LOCAL) {
      api('/api/starter', { method: 'POST', body: JSON.stringify({ checkpoint: c.id, kind }) }).then((r) => {
        setOnline(true);
        r.files.forEach((f) => { live.disk[f.path] = fromDisk(f); setDocQuietly(f.path, live.disk[f.path].text); });
        showSaved();
      }).catch((e) => { if (!e.status) setOnline(false); });
      return;
    }
    live.quiet = true;
    ownFiles(c).forEach((f) => {
      store.del(draftKey(f.path));
      if (docs[f.path]) docs[f.path].setValue(starterOf(f, kind));
      else if (!cm && f.path === live.active) plainEditor.value = starterOf(f, kind);
    });
    live.quiet = false;
    showSaved();
  }
  function paintKind(c) {
    $('#kind').hidden = !c.files.some((f) => f.boilerplate != null);
    $$('#kind [data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kindOf(c))));
    $$('[data-start-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.startKind === kindOf(c))));
    $$('.way-note').forEach((n) => { n.textContent = WAY_NOTES[kindOf(c)]; });
  }
  // Changed from both starters: replacing it would lose work, so ask first.
  function ownChanged(c) {
    return ownFiles(c).some((f) => {
      const text = textOf(f.path) ?? (LOCAL ? (live.disk[f.path] || {}).text : store.get(draftKey(f.path)));
      return text != null && text !== f.blank && text !== f.boilerplate;
    });
  }
  // A one-line question in the code toolbar (the page can't use confirm()).
  let onYes = null, onNo = null;
  function ask(text, yes, labels, no) {
    onYes = yes;
    onNo = no || null;
    $('#confirm-text').textContent = text;
    $('#confirm-yes').textContent = (labels && labels[0]) || 'Replace';
    $('#confirm-no').textContent = (labels && labels[1]) || 'Cancel';
    $('#confirm').hidden = false;
    $('#confirm-yes').focus();
  }
  const filesWord = (c) => (ownFiles(c).length === 1 ? 'file' : `${ownFiles(c).length} files`);
  $('#kind').addEventListener('click', (e) => {
    const b = e.target.closest('[data-kind]');
    const c = BY[current];
    if (!b || !c || b.dataset.kind === kindOf(c)) return;
    if (!ownChanged(c)) useStarter(c, b.dataset.kind);
    else ask(`Replace this assignment's ${filesWord(c)} with ${kindPhrase(b.dataset.kind)}?`, () => useStarter(c, b.dataset.kind));
  });
  $('#reset').addEventListener('click', () => {
    const c = BY[current];
    ask(`Reset this assignment's ${filesWord(c)} to ${kindPhrase(kindOf(c))}?`, () => useStarter(c, kindOf(c)));
  });
  $('#confirm-no').addEventListener('click', () => {
    $('#confirm').hidden = true;
    if (onNo) onNo();
  });
  $('#confirm-yes').addEventListener('click', () => {
    $('#confirm').hidden = true;
    if (current && onYes) onYes();
  });

  function loadEditor(c) {
    $('#confirm').hidden = true;
    paintKind(c);
    openCheckpointFiles(c);
  }

  function saveSoon() {
    if (live.quiet) return;
    if (LOCAL) { saveSoonLive(); return; }
    clearTimeout(saveTimer);
    $('#saved').textContent = 'Saving…';
    const id = current, path = live.active;
    saveTimer = setTimeout(() => {
      if (id !== current) return;
      keepDraft(path);
      showSaved();
    }, 400);
  }
  function keepDraft(path) {
    const text = textOf(path), f = fileIn(BY[current], path);
    if (text === null) return;
    if (f && (text === f.blank || text === f.boilerplate)) store.del(draftKey(path)); else store.set(draftKey(path), text);
  }
  function showSaved() {
    if (!current) return;
    const path = live.active;
    if (LOCAL) {
      const known = live.disk[path];
      $('#saved').textContent = !live.online ? 'Not saved: the study server has stopped'
        : live.noProject ? 'No project yet'
        : live.conflict[path] ? 'The file changed on disk'
        : known && known.text === textOf(path) ? `Saved to ${path}` : 'Saving…';
      return;
    }
    if (HOST) { $('#saved').textContent = 'Read-only here: run the workbook on your computer to write code'; return; }
    $('#saved').textContent = path && store.get(draftKey(path)) !== null ? 'Saved in this browser' : kindOf(BY[current]) === 'boilerplate' ? 'The Boilerplate' : 'Empty, from scratch';
  }
  function showPos() {
    if (!cm) { $('#pos').textContent = ''; return; }
    const p = cm.getCursor();
    $('#pos').textContent = (vimOn ? `${vimMode.toUpperCase()} · ` : '') + `Ln ${p.line + 1}, Col ${p.ch + 1}`;
  }

  // ---- Vim keys (CodeMirror's Vim keymap), remembered in this browser
  let vimOn = false, vimMode = 'normal';
  function vimNormal(ed) { return !!(ed.state.vim && !ed.state.vim.insertMode); }
  function setVim(on) {
    vimOn = !!(on && cm && window.CodeMirror.Vim);
    if (cm) cm.setOption('keyMap', vimOn ? 'vim' : 'default');
    vimMode = 'normal';
    $('#vim').setAttribute('aria-pressed', String(vimOn));
    if (vimOn) store.set('editor:vim', '1'); else store.del('editor:vim');
    showPos();
  }
  $('#vim').addEventListener('click', () => { setVim(!vimOn); if (cm) cm.focus(); });

  // Save now: :w in Vim, or Ctrl+S anywhere in the problem view.
  function saveNow() {
    if (!current) return;
    if (LOCAL) { saveAll(); return; }
    clearTimeout(saveTimer);
    keepDraft(live.active);
    showSaved();
  }

  // ---- clipboard
  function copyText(text) {
    try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch (e) { return Promise.resolve(false); }
  }
  function selectAllCode() {
    if (cm) { cm.focus(); cm.execCommand('selectAll'); } else { plainEditor.focus(); plainEditor.select(); }
  }
  function flash(btn, ok) {
    const old = btn.innerHTML;
    btn.innerHTML = ok ? 'Copied' : 'Press Ctrl+C';
    btn.classList.toggle('done', ok);
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove('done'); }, 1400);
  }
  $('#copy-code').addEventListener('click', () => {
    const btn = $('#copy-code');
    copyText(code()).then((ok) => {
      if (!ok) selectAllCode();
      btn.style.color = ok ? 'var(--ok)' : '';
      setTimeout(() => { btn.style.color = ''; }, 1200);
    });
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    copyText(b.dataset.copy).then((ok) => {
      if (!ok) {
        const range = document.createRange();
        range.selectNodeContents(b.previousElementSibling);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      }
      flash(b, ok);
    });
  });

  // ---- Run / Submit: copy the code, then show what to run in the terminal
  function act(kind) {
    if (!current) return;
    if (LOCAL) { runLive(kind, {}); return; }
    if (HOST) { runLocally(); return; }
    const c = BY[current];
    const list = casesOf(c);
    const test = kind === 'run' && list[caseIndex] ? list[caseIndex].test : null;
    const path = live.active, text = code(), f = fileIn(c, path);
    const entry = { kind, test, copied: false, empty: !text.trim(), path };
    // Say up front what the checker will answer, instead of letting it look like a failure later.
    if (entry.empty) entry.warn = `<code>${esc(path)}</code> is empty. Write it first: the checker needs every file of this assignment.`;
    else if (f && f.role === 'entry' && text.trim() === f.blank.trim()) entry.warn = 'This is still the blank starter (an empty <code>main</code>), so the checker will answer “Not started yet”. Write your program first, or pick Boilerplate above the editor for ready-made input/output code.';
    lastAction[c.id] = entry;
    if (entry.empty) {
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
      return;
    }
    copyText(text).then((ok) => {
      entry.copied = ok;
      if (!ok) selectAllCode();
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
    });
  }
  $('#run').addEventListener('click', () => act('run'));
  $('#submit').addEventListener('click', () => act('submit'));
  document.addEventListener('keydown', (e) => {
    if (!current || !(e.ctrlKey || e.metaKey) || e.target.id === 'paste') return;
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); saveNow(); return; }
    if (e.key === 'Enter') { e.preventDefault(); act('submit'); }
    else if (e.key === "'") { e.preventDefault(); act('run'); }
  }, true);

  // ---- tabs: the assignment's files, plus any other file of the project you opened
  const LOCAL = window.WORKBOOK_LOCAL || null;
  // A published copy (the workbooks site) sets WORKBOOK_HOST = { back: { href, label }, runLocally() }
  // before this script runs. That copy can't run code, so the editor is read-only, and Run, Submit and
  // the Run locally button call runLocally(), which the host may define after the book has loaded.
  const HOST = !LOCAL && window.WORKBOOK_HOST ? window.WORKBOOK_HOST : null;
  const runLocally = () => { if (HOST && typeof HOST.runLocally === 'function') HOST.runLocally(); };
  const live = { online: !!LOCAL, disk: {}, conflict: {}, conflictData: {}, report: {}, marks: {}, busy: false,
    quiet: false, tabs: [], active: null, project: [], showTree: false, tick: 0, noProject: false };
  const ENTRY_OF = Object.fromEntries(CPS.map((c) => [c.entry, c]));  // an entry program -> its assignment
  const tabOrder = (c) => [...c.files.filter((f) => f.role !== 'entry'), ...c.files.filter((f) => f.role === 'entry')].map((f) => f.path);
  const isExtra = (path) => !fileIn(BY[current], path);
  const keepTabs = () => { if (current) store.set('tabs:' + current, JSON.stringify(live.tabs.filter(isExtra))); };
  function openCheckpointFiles(c) {
    const kept = (() => { try { return JSON.parse(store.get('tabs:' + c.id) || '[]'); } catch (e) { return []; } })();
    const own = tabOrder(c);
    live.tabs = [...own, ...(LOCAL ? kept.filter((p) => !own.includes(p)) : [])];
    if (!cm) live.tabs = own;
    activate(live.tabs[0]);
    if (LOCAL) startCheckpoint(c);
  }
  // Opening a assignment creates its files in your project (never over ones that exist).
  async function startCheckpoint(c) {
    try {
      await api('/api/start', { method: 'POST', body: JSON.stringify({ checkpoint: c.id, kind: kindOf(c) }) });
      setOnline(true);
      live.noProject = false;
    } catch (e) {
      if (e.status === 409) live.noProject = true; else if (!e.status) setOnline(false);
    }
    paintNoProject();
    if (live.noProject || current !== c.id) return;
    await Promise.all(live.tabs.map((p) => loadFile(p)));
    if (live.showTree) refreshProject();
  }
  function openTab(path, line) {
    const owner = ENTRY_OF[path];  // another assignment's entry program: go to that assignment
    if (owner && owner.id !== current) { go('p' + owner.id); return; }
    if (!live.tabs.includes(path)) { live.tabs.push(path); keepTabs(); }
    activate(path, line);
  }
  function activate(path, line) {
    if (!cm && live.active && live.active !== path && !LOCAL) keepDraft(live.active);
    live.active = path;
    const unit = /\.py$/.test(path) ? 4 : (BY[current] && BY[current].indent) || 2;
    if (cm) {
      if (!docs[path]) {
        docs[path] = window.CodeMirror.Doc(LOCAL ? '' : startText(BY[current], path), modeFor(path));
        if (LOCAL && !live.noProject) loadFile(path);
      }
      cm.swapDoc(docs[path]);
      cm.setOption('indentUnit', unit);
      cm.setOption('tabSize', unit);
      if (line) { cm.setCursor({ line: line - 1, ch: 0 }); cm.scrollIntoView(null, 80); }
      requestAnimationFrame(() => cm.refresh());
    } else {
      plainEditor.value = LOCAL ? ((live.disk[path] || {}).text || '') : startText(BY[current], path);
      plainEditor.style.tabSize = unit;
    }
    paintFiles();
    showSaved();
    showPos();
    if (live.conflict[path]) askConflict(path);
  }
  function closeTab(path) {
    if (!isExtra(path)) return;
    if (LOCAL) saveFile(path);
    live.tabs = live.tabs.filter((p) => p !== path);
    keepTabs();
    if (live.active === path) activate(live.tabs[0]); else paintFiles();
  }
  function paintTabs() {
    const bar = $('#ftabs');
    if (!cm || live.tabs.length < 2) { bar.hidden = true; return; }
    bar.hidden = false;
    const c = BY[current];
    const hint = (p) => {
      const f = fileIn(c, p);
      return !f ? 'Another file of your project' : f.role === 'entry' ? 'The program the checker runs'
        : f.role === 'adds' ? `From assignment ${f.owner && BY[f.owner] ? BY[f.owner].num : ''}: this assignment adds to it` : 'New in this assignment';
    };
    bar.innerHTML = live.tabs.map((p) => `<span class="ftab${p === live.active ? ' on' : ''}${live.conflict[p] ? ' warn' : ''}" role="tab" aria-selected="${p === live.active}" title="${esc(hint(p))}">`
      + `<button type="button" data-tab="${esc(p)}">${esc(shortName(p))}</button>`
      + (isExtra(p) ? `<button type="button" class="x" data-close="${esc(p)}" aria-label="Close ${esc(shortName(p))}">×</button>` : '') + '</span>').join('');
  }
  function paintFiles() {
    const path = live.active || '';
    paintTabs();
    $('#file').textContent = path;
    const ext = path.split('.').pop().toLowerCase();
    const other = { md: 'Markdown', txt: 'Text', json: 'JSON', cmake: 'CMake' }[ext] || (/CMakeLists\.txt$/.test(path) ? 'CMake' : null);
    $('#lang').textContent = other || PROJECT.label;
    $('#reset').hidden = !(current && ownFiles(BY[current]).some((f) => f.path === path));
    renderTree();
  }
  $('#ftabs').addEventListener('click', (e) => {
    const close = e.target.closest('[data-close]');
    if (close) { closeTab(close.dataset.close); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { activate(tab.dataset.tab); if (cm) cm.focus(); }
  });

  // ---------------------------------------------------------------- live mode (.\study)
  // Served by tools/serve.py, the page saves your files and runs the checker itself, so Run and
  // Submit show the verdict directly. The published copy of the book keeps the copy-and-paste steps.
  const pending = new Set();  // files with unsaved edits
  let diskTimer = 0;

  async function api(path, options) {
    const res = await fetch(path, Object.assign({ headers: { 'X-Workbook-Token': LOCAL.token, 'Content-Type': 'application/json' } }, options || {}));
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw Object.assign(new Error(body.error || res.statusText), { status: res.status, body });
    }
    return res.json();
  }
  function setOnline(ok) {
    if (live.exited) return;
    if (live.online !== ok) { live.online = ok; paintLive(); showSaved(); }
  }
  function paintLive() {
    const el = $('#live');
    if (!LOCAL) return;
    el.hidden = false;
    el.className = 'live ' + (!live.online ? 'off' : LOCAL.problem ? 'warn' : 'on');
    el.textContent = !live.online ? 'Disconnected' : LOCAL.problem ? "Can't build yet" : 'Live';
    el.title = !live.online ? `The study server has stopped. Start it again (${STUDY_HOW.replace(/<\/?code>/g, '')}), then reload this page.`
      : LOCAL.problem || `Run and Submit build and check your project in ${LOCAL.folder}`;
  }

  // ---- files on disk
  const fromDisk = (f) => ({ mtime: f.mtime, text: (f.text === null ? '' : f.text).replace(/\r\n/g, '\n'), missing: f.text === null });
  function setDocQuietly(path, text) {
    // Swap in text from disk without saving it straight back, keeping the cursor where it was.
    live.quiet = true;
    const doc = docOf(path);
    if (doc) { const at = doc.getCursor(); doc.setValue(text); doc.setCursor(at); }
    else if (!cm && path === live.active) plainEditor.value = text;
    live.quiet = false;
  }
  async function loadFile(path) {
    try {
      const f = fromDisk(await api('/api/file?path=' + encodeURIComponent(path)));
      setOnline(true);
      live.disk[path] = f;
      if (!docOf(path) && cm) docs[path] = window.CodeMirror.Doc(f.text, modeFor(path));
      else if (textOf(path) !== f.text) setDocQuietly(path, f.text);
    } catch (e) { if (!e.status) setOnline(false); }
    if (path === live.active) showSaved();
  }
  function saveSoonLive() {
    if (!live.active) return;
    pending.add(live.active);
    clearTimeout(diskTimer);
    $('#saved').textContent = 'Saving…';
    diskTimer = setTimeout(saveAll, 600);
  }
  async function saveAll() {
    if (live.exited) return;
    clearTimeout(diskTimer);
    const paths = [...new Set([...pending, ...live.tabs])];
    pending.clear();
    for (const path of paths) await saveFile(path);
  }
  async function saveFile(path) {
    const text = textOf(path);
    if (text === null || live.conflict[path] || live.noProject) return;
    const known = live.disk[path];
    if (!known || known.text === text) { if (path === live.active) showSaved(); return; }  // not loaded yet, or nothing new
    try {
      const r = await api('/api/file', { method: 'PUT', body: JSON.stringify({ path, text, base: known.mtime }) });
      live.disk[path] = { mtime: r.mtime, text };
      setOnline(true);
    } catch (e) {
      if (e.status === 409) conflict(path, fromDisk(e.body)); else if (!e.status) setOnline(false);
    }
    if (path === live.active) showSaved();
  }
  // Both this page and another editor changed a file: let the learner pick, never overwrite silently.
  function conflict(path, f) {
    pending.delete(path);
    live.conflict[path] = true;
    live.conflictData[path] = f;
    if (path === live.active) { showSaved(); askConflict(path); }
    paintTabs();
  }
  function askConflict(path) {
    const f = live.conflictData[path];
    ask(`${shortName(path)} changed on disk while you were typing here.`, () => {
      live.conflict[path] = false; live.disk[path] = f; setDocQuietly(path, f.text); showSaved(); paintTabs();
    }, ['Load the file', 'Keep mine'], () => {
      live.conflict[path] = false; live.disk[path] = f; saveFile(path); paintTabs();
    });
  }
  // Edits made in another editor (VS Code, Notepad) show up here, for every open file.
  async function watchDisk() {
    if (!LOCAL || !live.active || live.noProject || document.hidden || live.busy || !$('#confirm').hidden) return;
    for (const path of live.tabs) {
      try {
        const f = fromDisk(await api('/api/file?path=' + encodeURIComponent(path)));
        setOnline(true);
        const known = live.disk[path], mine = textOf(path);
        if (!known || f.mtime === known.mtime || mine === null || live.conflict[path]) continue;
        if (f.text === mine) { live.disk[path] = f; continue; }
        if (known.text === mine) {  // nothing unsaved here: just take the new version
          live.disk[path] = f;
          setDocQuietly(path, f.text);
          if (path === live.active) $('#saved').textContent = 'Updated from the file on disk';
          continue;
        }
        conflict(path, f);
      } catch (e) { if (!e.status) setOnline(false); }
    }
    if (live.showTree && ++live.tick % 3 === 0) refreshProject();
  }
  if (LOCAL) {
    live.timer = setInterval(watchDisk, 2000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
    // Open in your editor: the file goes to the editor installed on this computer, which brings its own
    // language server. Edits made there come back through watchDisk.
    $('#open-editor').hidden = false;
    $('#open-editor').addEventListener('click', async () => {
      if (!live.active) return;
      await saveAll();
      try {
        const r = await api('/api/open', { method: 'POST', body: JSON.stringify({ path: live.active, line: cm ? cm.getCursor().line + 1 : 1 }) });
        $('#saved').textContent = `Opened in ${r.editor}`;
      } catch (e) { $('#saved').textContent = e.message; }
    });
  }

  // ---- No project yet (a workbook cloned but not set up): say how to make one
  function paintNoProject() {
    const box = $('#noproj');
    box.hidden = !(LOCAL && live.noProject);
    if (box.hidden) return;
    box.innerHTML = `<div><h2>Set up your project first</h2>
      <p>Your code goes in <code>${esc(PROJECT_DIR)}</code>, a ${esc(PROJECT.label)} project with its own build file and README that you can put on GitHub when you finish. The folder doesn't exist yet.</p>
      <p>Ask your coding assistant to set up your workbook (it asks which language you'd like), or make the ${esc(PROJECT.label)} project now:</p>
      <button class="btn green" type="button" id="setup-project">Set up the ${esc(PROJECT.label)} project</button></div>`;
    showSaved();
  }
  $('#noproj').addEventListener('click', async (e) => {
    if (!e.target.closest('#setup-project')) return;
    e.target.disabled = true;
    try { await api('/api/setup', { method: 'POST', body: '{}' }); setOnline(true); } catch (err) { if (!err.status) setOnline(false); return; }
    live.noProject = false;
    Object.keys(docs).forEach((p) => delete docs[p]);
    if (current) openCheckpointFiles(BY[current]);
    paintNoProject();
  });

  // ---- the Files panel: your project as it grows, folder by folder
  async function refreshProject() {
    if (!LOCAL) { renderTree(); return; }  // the planned project, from workbook.json
    try {
      const r = await api('/api/files');
      live.project = r.files;
      live.noProject = !r.exists;
      setOnline(true);
    } catch (e) { if (!e.status) setOnline(false); }
    renderTree();
  }
  function renderTree() {
    const tree = $('#tree');
    if (!cm) return;
    tree.hidden = !live.showTree;
    $('#tree-btn').setAttribute('aria-pressed', String(live.showTree));
    if (!live.showTree) return;
    const folders = {};
    live.project.forEach((f) => {
      const rel = shortName(f.path), cut = rel.lastIndexOf('/');
      (folders[cut < 0 ? '' : rel.slice(0, cut + 1)] = folders[cut < 0 ? '' : rel.slice(0, cut + 1)] || []).push(f);
    });
    const order = Object.keys(folders).sort((a, b) => (a === '') - (b === '') || a.localeCompare(b));
    // This assignment's files stand out, the earlier files it can use are marked, the rest fade.
    const cur = current && BY[current];
    const isNow = (path) => !!(cur && cur.files.some((x) => x.path === path));
    const isUse = (path) => !!(cur && cur.buildsOn.some((x) => x.path === path));
    const item = (f) => {
      const c = f.checkpoint && BY[f.checkpoint];
      const role = isNow(f.path) ? ' now' : isUse(f.path) ? ' uses' : cur ? ' dim' : '';
      const mark = !c ? '<span class="tm"></span>' : store.get(c.id + ':broke') ? '<span class="tm broke" title="Passed before, failing now">!</span>'
        : solved(c.id) ? '<span class="tm ok" title="Solved">✓</span>' : '<span class="tm"></span>';
      const tip = LOCAL ? `${shortName(f.path)} · ${f.lines} lines${c ? ` · assignment ${c.num}: ${c.title}` : ''}${f.state === 'blank' ? ' · not written yet' : ''}`
        : `${shortName(f.path)}${c ? ` · assignment ${c.num}: ${c.title}` : ''}${f.purpose ? `\n${f.purpose}` : ''}`;
      return `<button type="button" class="tree-item${role}${f.path === live.active ? ' on' : ''}${f.state === 'blank' ? ' blank' : ''}" data-open="${esc(f.path)}" title="${esc(tip)}">${mark}<span class="nm">${esc(f.path.split('/').pop())}</span>${c ? `<span class="tag-n">${esc(c.num)}</span>` : ''}</button>`;
    };
    const solvedCount = CPS.filter((c) => solved(c.id)).length;
    tree.innerHTML = `<div class="tree-dir"><span>${esc(PROJECT_DIR)}</span>${LOCAL ? '<button type="button" class="tree-add" id="new-file" title="New file" aria-label="New file">+</button>' : ''}</div>
      ${LOCAL ? '' : '<p class="tree-key tree-plan">The project you build, file by file. Open any file to read its starter.</p>'}
      <form class="new-file" id="new-file-form" hidden><input id="new-file-name" spellcheck="false" placeholder="src/utils/Bit.h" aria-label="New file, a path in your project"></form>
      ${cur ? `<p class="tree-key"><span><i class="k-now"></i>this assignment</span><span><i class="k-uses"></i>you can use</span></p>` : ''}
      ${live.project.length ? order.map((d) => (d ? `<div class="tree-dir${folders[d].some((f) => isNow(f.path)) ? ' now' : ''}"><span>${esc(d)}</span></div>` : '') + folders[d].map(item).join('')).join('')
        : '<p class="tree-empty">The project is empty. Opening an assignment adds its files.</p>'}
      ${LOCAL ? `<div class="tree-foot"><button class="btn" type="button" id="recheck"${solvedCount ? '' : ' disabled'}>Re-check solved (${solvedCount})</button></div>` : ''}`;
  }
  $('#tree-btn').addEventListener('click', () => {
    live.showTree = !live.showTree;
    store.set('tree', live.showTree ? '1' : '0');
    if (live.showTree) refreshProject(); else renderTree();
    if (cm) requestAnimationFrame(() => cm.refresh());
  });
  $('#tree').addEventListener('click', (e) => {
    const open = e.target.closest('[data-open]');
    if (open) { openTab(open.dataset.open); return; }
    if (e.target.closest('#new-file')) { const form = $('#new-file-form'); form.hidden = !form.hidden; if (!form.hidden) $('#new-file-name').focus(); return; }
    if (e.target.closest('#recheck')) recheckSolved();
  });
  $('#tree').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#new-file-name').value.trim().replace(/\\/g, '/').replace(/^\/+/, '');
    if (!/^([\w.-]+\/)*[\w-][\w.-]*\.(h|hpp|c|cc|cpp|cxx|py|js|mjs|ts|rs|go|lua|md|txt)$/.test(name) || name.split('/').includes('..')) {
      $('#new-file-name').setCustomValidity('A path in your project, like src/utils/Bit.h'); $('#new-file-name').reportValidity(); return;
    }
    const path = PROJECT_DIR + name;
    const start = /\.(h|hpp)$/.test(name) ? '#pragma once\n\n' : '';
    try {
      await api('/api/file', { method: 'PUT', body: JSON.stringify({ path, text: start, base: '0' }) });  // '0': only if it doesn't exist yet
    } catch (err) { if (err.status !== 409) { setOnline(!!err.status); return; } }
    await refreshProject();
    openTab(path);
  });
  $('#tree').addEventListener('input', (e) => { if (e.target.id === 'new-file-name') e.target.setCustomValidity(''); });

  // ---- Re-check solved: catches a change to an earlier file that broke something you'd already passed
  async function recheckSolved() {
    const ids = CPS.filter((c) => solved(c.id)).map((c) => c.id);
    if (!ids.length || live.busy) return;
    await saveAll();
    live.busy = true;
    $('#run').disabled = $('#submit').disabled = true;
    setBottom('result');
    const rows = [];
    for (const [k, id] of ids.entries()) {
      $('#result').innerHTML = `<div class="running"><span class="spinner" aria-hidden="true"></span>Re-checking your solved assignments: ${k + 1} of ${ids.length} (${esc(BY[id].num)}. ${esc(BY[id].title)})…</div>` + recheckTable(rows);
      let r;
      try { r = await api('/api/check/' + id, { method: 'POST', body: '{}' }); setOnline(true); } catch (e) { setOnline(false); r = { verdict: 'offline' }; }
      live.report[id] = r;
      if (r.verdict === 'accepted') store.del(id + ':broke'); else store.set(id + ':broke', '1');
      rows.push({ id, r });
    }
    live.busy = false;
    $('#run').disabled = $('#submit').disabled = false;
    const broke = rows.filter((x) => x.r.verdict !== 'accepted');
    $('#result').innerHTML = `<div class="verdict ${broke.length ? 'bad' : 'ok'}"><h2>${broke.length ? `${broke.length} broke` : 'All still pass'}</h2><span class="sub">${rows.length - broke.length} / ${rows.length} solved assignments pass</span></div>`
      + `<p class="note">${broke.length ? 'These passed before and fail now. A change to a file they use is the usual cause; open one to see its failing tests.' : `All ${rows.length} assignments you solved still pass with your project as it is now.`}</p>`
      + recheckTable(rows);
    renderTree();
  }
  function recheckTable(rows) {
    const looks = { accepted: ['ok', 'Accepted'], 'wrong-answer': ['bad', 'Wrong Answer'], 'compile-error': ['bad', 'Compile Error'],
      'not-started': ['warn', 'Not started yet'], 'not-implemented': ['warn', 'Not implemented yet'], offline: ['unknown', 'Not connected'] };
    return rows.length ? `<div class="recheck">${rows.map(({ id, r }) => {
      const [kind, label] = looks[r.verdict] || ['unknown', 'Error'];
      return `<a class="rc-row" href="#p${id}"><span class="rc-n">${esc(BY[id].num)}.</span><span class="rc-t">${esc(BY[id].title)}</span><span class="rc-v ${kind}">${label}${r.total ? ` ${r.passed}/${r.total}` : ''}</span></a>`;
    }).join('')}</div>` : '';
  }

  // ---- Exit: save everything, stop the study server, say goodbye
  async function exitBook() {
    try { await saveAll(); } catch (e) { /* the server may already be gone */ }
    try { await api('/api/exit', { method: 'POST', body: '{}' }); } catch (e) { /* likewise */ }
    live.exited = true;
    clearInterval(live.timer);
    document.body.classList.remove('in-ide');
    // The page's <style> lives in <body>, so keep it and clear everything else.
    [...document.body.children].forEach((el) => { if (el.tagName !== 'STYLE' && el.tagName !== 'LINK') el.remove(); });
    document.body.insertAdjacentHTML('beforeend', `<div class="bye" role="status"><div>
      <span class="logo">${esc(DATA.title.trim().charAt(0).toUpperCase())}</span>
      <h1>See you again!</h1>
      <p>${esc(DATA.title)} has stopped. Your code is in <code>solutions/</code>.</p>
      <p>To come back, ${STUDY_HOW}, or ask your coding assistant to open your workbook.</p>
      <p class="bye-close" hidden>You can close this tab now.</p></div></div>`);
    // Browsers only let a page close tabs it opened itself; otherwise the message stays.
    setTimeout(() => { window.close(); setTimeout(() => { const note = document.querySelector('.bye-close'); if (note) note.hidden = false; }, 300); }, 1800);
  }
  function armExit(btn) {
    // Two clicks, so a stray one doesn't stop the book.
    if (btn.dataset.armed) { exitBook(); return; }
    btn.dataset.armed = '1';
    const label = btn.textContent;
    btn.textContent = 'Click again to exit';
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = label; } }, 3000);
  }
  if (LOCAL) {
    ['#exit', '#exit-list'].forEach((id) => { $(id).hidden = false; $(id).addEventListener('click', (e) => armExit(e.currentTarget)); });
  }

  // ---- Run / Submit, for real
  async function runLive(kind, options) {
    const c = BY[current];
    if (!c || live.busy) return;
    const list = casesOf(c);
    const test = kind === 'run' && list[caseIndex] ? list[caseIndex].test : null;
    const stuck = live.tabs.find((p) => live.conflict[p]);
    if (stuck) { activate(stuck); return; }
    await saveAll();
    live.busy = true;
    $('#run').disabled = $('#submit').disabled = true;
    setBottom('result');
    const what = test ? `Running test ${esc(test)}…` : options.fresh ? 'Making a fresh set of tests and running them…' : `Building and running all ${c.tests} tests…`;
    $('#result').innerHTML = `<div class="running"><span class="spinner" aria-hidden="true"></span>${what}</div>`;
    let report;
    try {
      report = await api('/api/check/' + c.id, { method: 'POST', body: JSON.stringify({ case: test, fresh: !!options.fresh }) });
      setOnline(true);
    } catch (e) {
      setOnline(false);
      report = { verdict: 'offline' };
    }
    live.busy = false;
    $('#run').disabled = $('#submit').disabled = false;
    report.test = test;
    report.fresh = !!options.fresh;
    live.report[c.id] = report;
    if (report.verdict === 'accepted') {
      setSolved(c.id, true);
      store.del(c.id + ':broke');
    }
    if (report.verdict === 'no-project') { live.noProject = true; paintNoProject(); }
    await markErrors(c, report);
    if (current === c.id) { renderLiveResult(c); $('#result').scrollTop = 0; }
    if (live.showTree) refreshProject();
  }

  // Compile errors are marked in whichever project file they're in, this assignment's or an earlier one.
  function errorPath(c, file) {
    const f = String(file || '').replace(/\\/g, '/');
    return f.startsWith(PROJECT_DIR) ? f : live.tabs.find((p) => f.endsWith('/' + p)) || null;
  }
  async function markErrors(c, report) {
    Object.entries(live.marks).forEach(([path, handles]) => {
      const doc = docOf(path);
      if (doc) handles.forEach((h) => doc.removeLineClass(h, 'background', 'cm-error-line'));
    });
    live.marks = {};
    if (!cm) return;
    for (const e of (report.errors || []).filter((x) => x.kind === 'error')) {
      const path = errorPath(c, e.file);
      if (!path) continue;
      if (!docOf(path)) { docs[path] = window.CodeMirror.Doc('', modeFor(path)); await loadFile(path); }
      const doc = docOf(path);
      const line = Math.min(Math.max(e.line - 1, 0), doc.lineCount() - 1);
      (live.marks[path] = live.marks[path] || []).push(doc.addLineClass(line, 'background', 'cm-error-line'));
    }
  }

  const tail = (text, n) => String(text || '').trim().split('\n').slice(-n).join('\n');
  const fileUrl = (path) => '/files/' + path.split('/').map(encodeURIComponent).join('/')
    + '?t=' + encodeURIComponent(LOCAL.token) + '&v=' + Date.now();

  function liveHelp(r, c) {
    switch (r.verdict) {
      case 'accepted': return 'The book marked the assignment solved and opened the Editorial tab.';
      case 'wrong-answer': return r.wroteNothing
        ? "Your program ran but didn't write anything. The checker starts it with two file names, the input to read and the output to write; write your answer to the second one."
        : 'Some tests failed. Each one below shows the expected output and what your program wrote.'
          + (r.mostLikely ? ` Most of them point to <b>${esc(r.mostLikely.id)}</b>: ${esc(r.mostLikely.text)}.` : '');
      case 'compile-error': return r.noMain
        ? `<code>${esc(c.entry)}</code> has no <code>main</code> function, so it can't be built into a program. Add a <code>main</code> that reads the input file and writes the output file.`
        : r.blame ? `Your project didn't build, so no tests ran. The first error is in <code>${esc(shortName(r.blame.file))}</code>, ${r.blame.checkpoint && BY[r.blame.checkpoint] ? `assignment ${esc(BY[r.blame.checkpoint].num)}'s file` : 'another file of your project'}. The build compiles the whole project at once, so fix that file first.`
        : "Your code didn't build, so no tests ran. The editor marks the lines with errors; fix the first error first, since later ones often follow from it.";
      case 'not-started': return r.empty
        ? `<code>${esc(c.entry)}</code> is empty, so there was nothing to check. Write the program in it.`
        : `<code>${esc(c.entry)}</code> is still the blank starter, so there was nothing to check. Write it, or pick Boilerplate above the editor for ready-made input/output code.`;
      case 'no-project': return 'There is no project yet, so there was nothing to build. Set it up above the editor, or ask your coding assistant to set up your workbook.';
      case 'not-implemented': return `<code>${esc(r.function || 'A function')}</code> is still a TODO in your files. Write it and Submit again.`;
      case 'passed': return `This test passes. Submit runs all ${c.tests}.`;
      case 'failed': return 'This test fails. Its input, your output and the expected output are below.';
      case 'offline': return `The study server has stopped, so nothing ran. Start it again (${STUDY_HOW} in the workbook folder), then reload this page.`;
      default: return esc(r.message || 'The checker ran into a problem.');
    }
  }

  // ---- Your output vs expected: lines are lined up, then the differing words are marked. Words and
  // numbers are compared the way the checker compares them (quoted strings are one word; numbers
  // within the assignment's tolerance are equal), so only real differences light up.
  const words = (line) => line.match(/"[^"]*"|\S+/g) || [];
  const sameWord = (a, b, tol) => {
    if (a === b) return true;
    const x = Number(a), y = Number(b);
    return tol > 0 && a.trim() !== '' && b.trim() !== '' && isFinite(x) && isFinite(y) && Math.abs(x - y) <= tol + 1e-12;
  };
  const sameLine = (a, b, tol) => a.length === b.length && a.every((w, k) => sameWord(w, b[k], tol));
  function matchPairs(a, b, eq) {
    // Longest common subsequence: which items of a and b line up. Falls back to position for huge inputs.
    const n = a.length, m = b.length;
    if (n * m > 400000) return Array.from({ length: Math.min(n, m) }, (_, i) => i).filter((i) => eq(a[i], b[i])).map((i) => [i, i]);
    const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const pairs = [];
    for (let i = 0, j = 0; i < n && j < m;) {
      if (eq(a[i], b[j])) { pairs.push([i, j]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    return pairs;
  }
  function diffOutputs(actual, expected, compare) {
    const tol = (compare && compare.tolerance) || 0;
    const clipped = (l) => /^\.\.\. \(\d+ more lines\)$/.test(l);
    const A = actual.map((t) => ({ text: t, w: words(t), kind: clipped(t) ? 'clip' : 'same', marks: new Set() }));
    const E = expected.map((t) => ({ text: t, w: words(t), kind: clipped(t) ? 'clip' : 'same', marks: new Set() }));
    const eq = (a, b) => a.kind !== 'clip' && b.kind !== 'clip' && sameLine(a.w, b.w, tol);
    if (compare && compare.mode === 'unordered') {  // any order: a line is fine if some expected line matches it
      const used = new Set();
      A.forEach((a) => { const j = E.findIndex((e, k) => !used.has(k) && eq(a, e)); if (j >= 0) used.add(j); else if (a.kind !== 'clip') a.kind = 'extra'; });
      E.forEach((e, k) => { if (!used.has(k) && e.kind !== 'clip') e.kind = 'missing'; });
      return { yours: A, expected: E };
    }
    const pairs = matchPairs(A, E, eq).concat([[A.length, E.length]]);
    let i = 0, j = 0;
    for (const [pi, pj] of pairs) {
      // Lines between two matches: pair them up as changed lines, the rest are extra or missing.
      while (i < pi && j < pj) {
        const a = A[i++], e = E[j++];
        if (a.kind === 'clip' || e.kind === 'clip') continue;
        a.kind = e.kind = 'changed';
        // Same number of words: the checker compares them position by position, so do that too.
        const hit = a.w.length === e.w.length
          ? a.w.map((w, k) => [k, k]).filter(([k]) => sameWord(a.w[k], e.w[k], tol))
          : matchPairs(a.w, e.w, (x, y) => sameWord(x, y, tol));
        const ha = new Set(hit.map((p) => p[0])), he = new Set(hit.map((p) => p[1]));
        a.w.forEach((_, k) => { if (!ha.has(k)) a.marks.add(k); });
        e.w.forEach((_, k) => { if (!he.has(k)) e.marks.add(k); });
      }
      while (i < pi) { if (A[i].kind !== 'clip') A[i].kind = 'extra'; i++; }
      while (j < pj) { if (E[j].kind !== 'clip') E[j].kind = 'missing'; j++; }
      i = pi + 1; j = pj + 1;
    }
    return { yours: A, expected: E };
  }
  function diffBlock(title, lines, tone) {
    if (!lines.length) return `<div class="field"><div class="field-k">${title}</div><pre class="field-v diff"><span class="dl clip">(nothing)</span></pre></div>`;
    const body = lines.map((l) => {
      const inner = l.kind === 'clip' || !l.w.length ? esc(l.text)
        : l.w.map((w, k) => (l.marks.has(k) ? `<span class="tk-${tone}">${esc(w)}</span>` : esc(w))).join(' ');
      return `<span class="dl ${l.kind} ${tone}">${inner || ' '}</span>`;
    }).join('');
    return `<div class="field"><div class="field-k">${title}</div><pre class="field-v diff">${body}</pre></div>`;
  }

  function caseBody(x, report) {
    let h = x.message ? `<p class="note bad-text">${esc(x.message)}</p>` : '';
    if (x.causes && x.causes.length) h += `<p class="note">Likely cause: ${x.causes.map((k) => `<b>${esc(k.id)}</b> ${esc(k.text)}`).join('; ')}</p>`;
    if (x.images) {
      const pics = [['Expected', x.images.expected], ['Yours', x.images.actual], ['Difference', x.images.diff]].filter((p) => p[1]);
      h += `<div class="img-cmp">${pics.map(([t, p]) => `<figure><img src="${fileUrl(p)}" alt="${esc(t)}"><figcaption>${t}</figcaption></figure>`).join('')}</div>`;
      if (x.images.diff) h += '<p class="note">In the difference: red is ink you added, blue is ink you missed, magenta is the wrong colour, and yellow is allowed (the checker lets edges move one pixel).</p>';
    } else {
      const d = diffOutputs(x.actual || [], x.expected || [], report && report.compare);
      h += `<div class="field"><div class="field-k">Input</div><pre class="field-v">${esc((x.input || []).join('\n'))}</pre></div>`
        + diffBlock('Your output', d.yours, 'del') + diffBlock('Expected', d.expected, 'add')
        + `<p class="note muted">Highlighted: what differs${report && report.compare && report.compare.tolerance ? ` (numbers within ${report.compare.tolerance} count as equal)` : ''}${report && report.compare && report.compare.mode === 'unordered' ? '; line order doesn\'t matter here' : ''}.</p>`;
    }
    if (x.printed && x.printed.length) h += `<div class="field"><div class="field-k">Printed by your program</div><pre class="field-v">${esc(x.printed.join('\n'))}</pre></div>`
      + '<p class="note muted">Whatever the program wrote to the screen (cout, print), for debugging. The checker never compares it; the answer is the output file.</p>';
    if (x.source) h += `<p class="note muted">Expected values from: ${esc(x.source)}</p>`;
    return h;
  }

  function reportHtml(r, c) {
    const looks = { accepted: ['ok', 'Accepted'], passed: ['ok', 'Accepted'], 'wrong-answer': ['bad', 'Wrong Answer'], 'no-project': ['warn', 'No project yet'],
      failed: ['bad', 'Wrong Answer'], 'compile-error': ['bad', 'Compile Error'], 'not-started': ['warn', 'Not started yet'],
      'not-implemented': ['warn', 'Not implemented yet'], offline: ['unknown', 'Not connected'], dispute: ['ok', 'Dispute recorded'] };
    const [kind, label] = looks[r.verdict] || ['unknown', 'Something went wrong'];
    const single = r.verdict === 'passed' || r.verdict === 'failed';
    const sub = [single ? `test ${esc(r.test || '')}` : r.total ? `${r.passed} / ${r.total} tests passed` : '',
      r.disputed && r.disputed.length ? `${r.disputed.length} disputed` : '', r.fresh ? 'fresh tests' : '',
      r.seconds != null ? `${r.seconds} s` : ''].filter(Boolean).join(' · ');
    let h = `<div class="verdict ${kind}"><h2>${esc(label)}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
    h += `<p class="note">${liveHelp(r, c)}</p>`;
    if (r.verdict === 'compile-error') {
      const errs = (r.errors || []).filter((e) => e.kind === 'error').slice(0, 8);
      if (errs.length) h += `<div class="err-list">${errs.map((e) => {
        const path = errorPath(c, e.file);
        const body = `<span class="loc">${esc(shortName(e.file))}:${e.line}:${e.column}</span> ${esc(e.message)}`;
        return path ? `<button type="button" class="err" data-goto="${esc(path)}" data-line="${e.line}" title="Open ${esc(shortName(path))} at line ${e.line}">${body}</button>` : `<div>${body}</div>`;
      }).join('')}</div>`;
      h += `<div class="field-k">Compiler output</div><pre class="raw">${esc(tail(r.build || r.text, 60))}</pre>`;
    }
    if (single && r.cases && r.cases[0]) h += caseBody(r.cases[0], r);
    if (!single && r.requirements && r.requirements.length) {
      h += '<div class="req-rows">' + r.requirements.map((q) => `<div class="req-row${q.passed === q.total ? '' : ' fail'}"><span class="rid">${esc(q.id)}</span><span class="rq" title="${esc(q.text)}">${esc(q.text)}</span><span class="cnt">${q.passed} / ${q.total}</span><span class="bar"><i style="width:${q.total ? (q.passed / q.total) * 100 : 0}%"></i></span></div>`).join('') + '</div>';
    }
    if (!single) {
      const failing = (r.cases || []).filter((x) => x.status !== 'pass');
      const shown = failing.filter((x) => x.message !== undefined);
      h += shown.map((x, i) => `<details class="case-card"${i < 2 ? ' open' : ''}><summary><span class="id">${esc(x.id)}</span> <span class="t">${esc(x.title)}</span></summary><div class="case-body">${caseBody(x, r)}</div></details>`).join('');
      if (failing.length > shown.length) h += `<p class="note">…and ${failing.length - shown.length} more failing tests.</p>`;
    }
    if (r.verdict === 'error' && r.text) h += `<pre class="raw">${esc(tail(r.text, 40))}</pre>`;
    return h;
  }

  function renderLiveResult(c) {
    const r = live.report[c.id];
    const intro = LOCAL.problem ? `<p class="note warn">${esc(LOCAL.problem)}</p>`
      : `<p class="note">Run checks the selected example (Ctrl+'), Submit runs all ${c.tests} tests (Ctrl+Enter). The book saves your files to <code>${esc(PROJECT_DIR)}</code> as you type and shows changes you make in another editor.</p>`;
    // After an Accepted Submit: what comes next, and what of this it builds on.
    const k = CPS.indexOf(c), next = CPS[k + 1];
    const uses = next ? next.files.filter((f) => f.role === 'adds').concat(next.buildsOn).filter((f) => c.files.some((g) => g.path === f.path)) : [];
    const nudge = r && r.verdict === 'accepted' && !r.fresh && next
      ? `<div class="nudge"><span>Next: <a href="#p${esc(next.id)}">${esc(next.num)}. ${esc(next.title)}</a>${uses.length ? `, which builds on ${uses.map((f) => `<code>${esc(shortName(f.path))}</code>`).join(', ')}` : ''}.</span></div>` : '';
    const solvedCount = CPS.filter((x) => solved(x.id)).length;
    $('#result').innerHTML = (r ? reportHtml(r, c) : intro) + nudge
      + `<div class="live-actions"><button class="btn" type="button" id="live-fresh">Run a fresh set of tests</button>`
      + (solvedCount ? `<button class="btn" type="button" id="recheck-all" title="Runs every assignment you've solved again, to find any that a change to an earlier file broke">Re-check solved (${solvedCount})</button>` : '') + '</div>'
      + `<details class="more"><summary>If a test looks wrong</summary><div>${cmdRow(command(c.id, '-Dispute <test-id> "why"'))}
        <p class="note" style="margin-top:8px">Run this in the workbook folder to set the test aside so it stops counting, then ask your coding assistant to review your disputes.</p></div></details>`;
  }
  if (LOCAL) {
    $('#result').addEventListener('click', (e) => {
      if (e.target.closest('#live-fresh')) { runLive('submit', { fresh: true }); return; }
      if (e.target.closest('#recheck-all')) { recheckSolved(); return; }
      const goto = e.target.closest('[data-goto]');
      if (goto) openTab(goto.dataset.goto, Number(goto.dataset.line));
    });
  }

  // ---- the primer: a page of its own, and a peek over the problem panel inside an assignment
  const usedIn = (e) => (e.usedIn.length === CPS.length && CPS.length > 1 ? '<p class="used">Used in every assignment</p>'
    : e.usedIn.length ? `<p class="used">Used in ${e.usedIn.map((cid) =>
    `<a href="#p${esc(cid)}" title="${esc(BY[cid] ? BY[cid].title : '')}">${esc(BY[cid] ? BY[cid].num : cid)}</a>`).join('')}</p>` : '');
  let primerDrawn = false;
  function renderPrimer() {
    const groups = PRIMER.map((g, k) => `<section class="pgroup" id="pg-${k}"><h2>${esc(g.title)}</h2>${g.intro ? `<div class="flow">${g.intro}</div>` : ''}`
      + g.entries.map((e) => `<article class="pentry" id="pe-${esc(e.id)}"><h3>${e.title}</h3><div class="flow">${e.html}</div>${usedIn(e)}</article>`).join('')
      + '</section>').join('');
    $('#primer').innerHTML = `<div class="primer-head"><h1>Primer</h1>
        <p>The terms, libraries and tools the ${CPS.length} assignments use, each explained in a few paragraphs, with where the workbook uses it and links to learn more. Each assignment's Learning material links to the entries it needs.</p></div>
      <div class="primer-tools"><label class="search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="pq" placeholder="Search the primer" aria-label="Search the primer"></label>
        ${PRIMER.map((g, k) => `<button class="chip" type="button" data-pgroup="${k}">${esc(g.title)}</button>`).join('')}</div>
      ${groups}<p class="pempty" id="pempty" hidden>No entries match.</p>`;
    $$('#primer .pentry').forEach((el) => {
      const e = ENTRY[el.id.slice(3)];
      el.dataset.search = [e.plain, ...e.also, el.textContent].join(' ').toLowerCase();
    });
    $('#pq').addEventListener('input', (ev) => {
      const q = ev.target.value.trim().toLowerCase();
      let shown = 0;
      $$('#primer .pentry').forEach((el) => { el.hidden = !!q && !el.dataset.search.includes(q); shown += el.hidden ? 0 : 1; });
      $$('#primer .pgroup').forEach((g) => { g.hidden = !$$('.pentry', g).some((el) => !el.hidden); });
      $('#pempty').hidden = shown > 0;
    });
    $('#primer').addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-pgroup]');
      if (b) $('#pg-' + b.dataset.pgroup).scrollIntoView({ block: 'start' });
    });
    primerDrawn = true;
  }
  function showPrimer(id) {
    if (LOCAL && current) saveAll();
    current = null;
    $('#ide-view').hidden = true;
    $('#list-view').hidden = true;
    $('#primer-view').hidden = false;
    document.body.classList.remove('in-ide');
    if (!primerDrawn) renderPrimer();
    $$('#primer .pentry.hit').forEach((el) => el.classList.remove('hit'));
    const el = id && $('#pe-' + id);
    if (el) el.classList.add('hit');
    // After layout (and after the browser restores the scroll position on a reload).
    requestAnimationFrame(() => { if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0); });
  }
  function openPeek(id) {
    const e = ENTRY[id];
    if (!e) return;
    $('#primer-peek-body').innerHTML = `<h2 class="peek-title">${e.title}</h2>${e.html}${usedIn(e)}`;
    $('#primer-peek-open').setAttribute('href', '#primer/' + id);
    $('#primer-peek').hidden = false;
    $('#primer-peek-body').scrollTop = 0;
  }
  const closePeek = () => { $('#primer-peek').hidden = true; };
  $('#primer-peek-close').addEventListener('click', closePeek);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#primer-peek').hidden) closePeek(); });
  // Inside an assignment, a primer link opens the entry over the problem panel, so the editor stays.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#primer/"]');
    if (!a || e.defaultPrevented || a.hasAttribute('data-full') || !a.closest('#ide-view')) return;
    const id = a.getAttribute('href').slice('#primer/'.length);
    if (!ENTRY[id]) return;
    e.preventDefault();
    openPeek(id);
  });

  // ---- navigation between assignments
  function openCheckpoint(id) {
    const c = BY[id];
    const changed = current !== id;
    if (LOCAL && current && changed) saveAll();  // don't lose the last keystrokes
    current = id;
    closePeek();
    $('#primer-view').hidden = true;
    $('#list-view').hidden = true;
    $('#ide-view').hidden = false;
    document.body.classList.add('in-ide');
    if (changed) { caseIndex = 0; solFile = 0; }
    renderDesc(c);
    renderEditorial(c);
    renderCases(c);
    if (LOCAL) renderLiveResult(c); else renderResult(c);
    loadEditor(c);
    setLeft('desc');
    setBottom((LOCAL ? live.report[c.id] : store.get(c.id + ':result')) ? 'result' : 'cases');
    $('#desc').scrollTop = 0;
    const k = CPS.indexOf(c);
    $('#prev').disabled = k === 0;
    $('#next').disabled = k === CPS.length - 1;
    $('#prev').title = k > 0 ? `${CPS[k - 1].num}. ${CPS[k - 1].title}` : '';
    $('#next').title = k < CPS.length - 1 ? `${CPS[k + 1].num}. ${CPS[k + 1].title}` : '';
    if (cm) requestAnimationFrame(() => cm.refresh());
    window.scrollTo(0, 0);
  }
  $('#prev').addEventListener('click', () => { const k = CPS.indexOf(BY[current]); if (k > 0) go('p' + CPS[k - 1].id); });
  $('#next').addEventListener('click', () => { const k = CPS.indexOf(BY[current]); if (k < CPS.length - 1) go('p' + CPS[k + 1].id); });

  let routed = null;
  function route(hash) {
    if (hash === routed && (current || !$('#list-view').hidden || !$('#primer-view').hidden)) return;
    routed = hash;
    const pm = /^primer(?:\/([a-z0-9-]+))?$/.exec(hash || '');
    const m = /^p(.+)$/.exec(hash || '');
    if (pm && PRIMER.length) showPrimer(pm[1]);
    else if (m && BY[m[1]]) openCheckpoint(m[1]); else showList();
  }
  function go(hash) {
    try { history.pushState(null, '', '#' + hash); } catch (e) {}
    route(hash);
  }
  // In-page links switch views directly, so they work even where hash changes don't.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented) return;
    e.preventDefault();
    go(a.getAttribute('href').slice(1));
  });
  window.addEventListener('popstate', () => route(location.hash.slice(1)));
  window.addEventListener('hashchange', () => route(location.hash.slice(1)));

  // ---- resizable panels
  function splitter(el, axis, box, prop, min, max) {
    const key = 'layout:' + prop;
    const apply = (f) => { box.style.setProperty(prop, (Math.min(max, Math.max(min, f)) * 100).toFixed(2) + '%'); };
    const saved = Number(store.get(key));
    if (saved) apply(saved);
    const fraction = () => parseFloat(box.style.getPropertyValue(prop)) / 100 || (axis === 'x' ? 0.45 : 0.6);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      const rect = box.getBoundingClientRect();
      const move = (ev) => apply(axis === 'x' ? (ev.clientX - rect.left) / rect.width : (ev.clientY - rect.top) / rect.height);
      const up = () => {
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        store.set(key, String(fraction()));
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
    el.addEventListener('keydown', (e) => {
      const step = { ArrowLeft: -0.02, ArrowUp: -0.02, ArrowRight: 0.02, ArrowDown: 0.02 }[e.key];
      if (!step) return;
      e.preventDefault();
      apply(fraction() + step);
      store.set(key, String(fraction()));
    });
  }
  splitter($('#split-v'), 'x', $('#ide-main'), '--left', 0.25, 0.7);
  splitter($('#split-h'), 'y', $('#right'), '--top', 0.2, 0.85);

  if (HOST) {
    if (HOST.back) {
      const back = `<a class="host-back" href="${esc(HOST.back.href)}">&larr; ${esc(HOST.back.label)}</a>`;
      $('#ide-view .tb-left').insertAdjacentHTML('beforeend', back);
      $('#list-view .nav-in').insertAdjacentHTML('afterbegin', back);
    }
    $('#ide-view .tb-right').insertAdjacentHTML('afterbegin', '<button class="run-local" type="button" data-run-local>Run locally</button>');
  }
  document.addEventListener('click', (e) => { if (e.target.closest('[data-run-local]')) { e.preventDefault(); runLocally(); } });

  renderListShell();
  initEditor();
  if (LOCAL) paintLive();
  else live.project = PROJECT.layout.map((f) => ({ path: f.path, checkpoint: f.owner, purpose: f.purpose }));
  if (cm) {  // the Files panel needs the full editor; without the study server it shows the planned project
    $('#tree-btn').hidden = $('#tree-sep').hidden = false;
    live.showTree = store.get('tree') === '1';
    if (live.showTree) refreshProject();
  }
  route(location.hash.slice(1));
})();
</script>
