<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build React yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* A problem book in the style of a coding-practice site: a problem list, then a split view with
   the statement on the left and an editor + test cases on the right. Everything is rendered from
   the JSON in #book-data (written by tools/build_book.py), so the template fits any workbook. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Monaco, Consolas, "Courier New", monospace;

  --bg: #f0f0f0;            /* page, behind the panels */
  --layer: #ffffff;         /* panels and cards */
  --layer-head: #fafafa;    /* panel tab bars */
  --fill: #f2f3f5;          /* chips, input boxes, buttons */
  --fill-hover: #e7e8eb;
  --row-alt: #f7f8fa;       /* striped list rows */
  --line: #e7e7e7;
  --line-strong: #d4d4d8;
  --text: #262626;
  --text-2: #595959;
  --text-3: #8c8c8c;
  --brand: #ffa116;         /* orange accent */
  --brand-ink: #b46a00;     /* orange that reads as text on light */
  --link: #0a6fd8;
  --easy: #00a38f;
  --medium: #c98300;
  --hard: #f02a50;
  --ok: #2db55d;
  --bad: #e5383b;
  --on-color: #ffffff;      /* text on --ok / --brand */
  --code-bg: #f5f6f7;
  --sel: #cde2ff;
  --sel-blur: #e3e6ea;
  --active-line: #f6f8fb;
  --icon-desc: #007aff;
  --icon-ed: #f08c00;
  --icon-code: #02a12f;
  --syn-text: #262626; --syn-kw: #0000ff; --syn-type: #267f99; --syn-str: #a31515; --syn-num: #098658;
  --syn-com: #008000; --syn-fn: #795e26; --syn-meta: #af00db; --syn-var: #001080;
  /* For figures on problem pages (inline SVG): these follow the theme. */
  --ink: var(--text); --muted: var(--text-2); --rule: var(--line); --surface: var(--layer);
  --fig-a: #2f55e4; --fig-b: #d9591f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
    --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
    --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
    --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
    --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
    --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
    --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
    --fig-a: #7f9cff; --fig-b: #ff8d5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
  --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
  --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
  --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
  --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
  --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
  --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
  --fig-a: #7f9cff; --fig-b: #ff8d5c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 var(--font-ui); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; border-radius: 4px; }
code, pre, kbd, samp { font-family: var(--font-mono); }
svg { flex: none; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--text-3); }

/* ---------- shared bits ---------- */
.chip { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 999px; border: 0;
  background: var(--fill); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { color: var(--text); background: var(--fill-hover); }
.easy { color: var(--easy) !important; } .medium { color: var(--medium) !important; } .hard { color: var(--hard) !important; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; border: 0;
  background: var(--fill); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill-hover); }
.btn.green { background: var(--ok); color: var(--on-color); }
.btn.green:hover { filter: brightness(1.08); }
.btn.done { color: var(--ok); }
.icon-btn { width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; display: inline-grid; place-items: center;
  color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--fill); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.cmd { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 8px; padding: 5px 5px 5px 12px; min-width: 0; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; scrollbar-width: thin; }
.cmd .btn { height: 26px; padding: 0 10px; font-size: 12px; background: var(--layer); }
.cmd .btn:hover { background: var(--fill-hover); }

/* ---------- problem list ---------- */
.nav { background: var(--layer); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  padding-top: env(safe-area-inset-top, 0px); }
.nav-in { max-width: 1200px; margin: 0 auto; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: 15px; }
.brand:hover { text-decoration: none; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #1a1a1a; display: grid; place-items: center;
  font: 700 14px/1 var(--font-mono); }
.nav-src { color: var(--text-3); font-size: 13px; margin-left: auto; }
.list-wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 20px 28px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "prog" "plist" "how"; }
.side { display: contents; }
.side .prog { grid-area: prog; } .side .how { grid-area: how; }
@media (min-width: 1000px) {
  .list-wrap { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "hero side" "plist side"; align-items: start; }
  .side { display: grid; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .side .prog, .side .how { grid-area: auto; }
}
.hero { grid-area: hero; display: grid; gap: 8px; }
.hero .over { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink); }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); max-width: 70ch; }
.side { grid-area: side; gap: 16px; }
.plist { grid-area: plist; display: grid; gap: 14px; min-width: 0; }
.card { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }

.prog { grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 18px; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-c b { font-size: 24px; font-weight: 600; }
.ring-c span { color: var(--text-3); font-size: 13px; }
.ring-c small { color: var(--text-2); font-size: 12px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.bar-row .n { color: var(--text-2); }
.bar-row .n b { color: var(--text); font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.bar-row[aria-pressed="true"] .lbl { text-decoration: underline; text-underline-offset: 3px; }
.how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: how; }
.how li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 13px; color: var(--text-2); counter-increment: how; }
.how li::before { content: counter(how); width: 20px; height: 20px; border-radius: 50%; background: var(--fill); color: var(--text-2);
  display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-top: 1px; }
.how b { color: var(--text); font-weight: 600; }
.how code, .credits code { font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 4px; }
.path { font: 12px/1.5 var(--font-mono); color: var(--text-3); word-break: break-all; }

.topics { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.topics.collapsed .tchip:nth-child(n + 13) { display: none; }
.tchip { height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 999px;
  background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.tchip:hover { color: var(--text); background: var(--fill); }
.tchip sup { color: var(--text-3); font-size: 10px; }
.tchip[aria-pressed="true"] { background: var(--text); color: var(--layer); }
.tchip[aria-pressed="true"] sup { color: var(--layer); opacity: .7; }
.topics .more { color: var(--link); background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0 8px; height: 28px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; max-width: 340px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--fill); border-radius: 8px; color: var(--text-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: 13px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--layer); color: var(--text); font-weight: 500; }
.seg.small { flex: none; }
.seg.small button { height: 24px; padding: 0 9px; font-size: 12px; }
.table-scroll { overflow-x: auto; }
.ptable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.ptable th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ptable td { padding: 11px 12px; white-space: nowrap; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(odd) td { background: var(--row-alt); }
.ptable tbody tr td:first-child { border-radius: 8px 0 0 8px; }
.ptable tbody tr td:last-child { border-radius: 0 8px 8px 0; }
.ptable tbody tr:hover td { background: var(--fill); }
.ptable .st { width: 44px; }
.ptable .ti { white-space: normal; min-width: 220px; }
.ptable .ti a { color: var(--text); font-weight: 500; }
.ptable .ti a:hover { color: var(--link); text-decoration: none; }
.ptable .te { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); width: 80px; }
.ptable .di { width: 96px; font-weight: 500; }
.ptable th.te { text-align: right; }
.st-ok { color: var(--ok); display: inline-grid; }
.st-try { color: var(--medium); display: inline-grid; }
.credits { margin: 6px 0 0; color: var(--text-3); font-size: 12px; max-width: 80ch; }

/* ---------- problem view ---------- */
.ide { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; padding-bottom: 10px; }
body.in-ide { overflow: hidden; }
.topbar { flex: none; height: 50px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-right { justify-self: end; gap: 10px; }
.tb-left .logo { margin-right: 8px; }
.tb-link { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; color: var(--text); font-weight: 500; white-space: nowrap; }
.tb-link:hover { background: var(--fill); text-decoration: none; }
.tb-mid { display: flex; gap: 1px; }
.act { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; border: 0; background: var(--fill); cursor: pointer; font-weight: 600; }
.act:hover { background: var(--fill-hover); }
.act.run { border-radius: 8px 0 0 8px; color: var(--text-2); }
.act.submit { border-radius: 0 8px 8px 0; color: var(--ok); }
.tb-prog { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.tb-prog b { color: var(--text); font-weight: 600; }
.exit-btn { height: 28px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.exit-btn:hover, .exit-btn[data-armed] { color: var(--bad); border-color: var(--bad); }
/* A published copy (WORKBOOK_HOST): a way back to the host, and a way to run it locally */
.host-back { font-size: 12.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; padding: 6px 8px; border-radius: 6px; }
.host-back:hover { background: var(--fill); color: var(--text); text-decoration: none; }
.run-local { height: 28px; padding: 0 12px; border: 0; border-radius: 8px; background: var(--brand); color: #1a1a1a; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
.run-local:hover { filter: brightness(1.06); }
.hosted { display: grid; gap: 12px; justify-items: start; padding: 4px 2px; color: var(--text-2); max-width: 60ch; }
.hosted p { margin: 0; line-height: 1.55; }
.linkish { background: none; border: 0; padding: 0; color: var(--link); font: inherit; cursor: pointer; }
.linkish:hover { text-decoration: underline; }
.bye { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); color: var(--text); text-align: center; padding: 24px; }
.bye > div { display: grid; gap: 12px; justify-items: center; max-width: 46ch; }
.bye h1 { margin: 0; font-size: 28px; font-weight: 600; }
.bye p { margin: 0; color: var(--text-2); }
.bye code { font-size: 13px; background: var(--fill); padding: 1px 6px; border-radius: 4px; }
.live { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: help; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.live.on { color: var(--ok); } .live.warn { color: var(--medium); } .live.off { color: var(--bad); }
.act:disabled { opacity: .55; cursor: progress; }
.running { display: flex; align-items: center; gap: 10px; color: var(--text-2); padding: 6px 0 14px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ok); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.err-list { display: grid; gap: 4px; margin-bottom: 12px; font: 12.5px/1.5 var(--font-mono); }
.err-list .loc { color: var(--bad); font-weight: 600; }
.cm-error-line { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.bad-text { color: var(--bad) !important; }
.note.muted { color: var(--text-3); font-size: 12px; }
.case-card { background: var(--fill); border-radius: 8px; margin-bottom: 8px; min-width: 0; }
.case-card > summary { cursor: pointer; padding: 9px 12px; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.case-card > summary .id { font: 600 12.5px var(--font-mono); color: var(--bad); white-space: nowrap; }
.case-card > summary .t { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-body { padding: 0 12px 12px; display: grid; gap: 8px; min-width: 0; }
.case-body .field { margin-bottom: 0; }
.case-body .field-v { background: var(--layer); max-height: 220px; }
.field-v.diff { padding: 6px 0; }
.diff .dl { display: block; width: max-content; min-width: 100%; padding: 0 12px; min-height: 1.6em; }
.diff .dl.del.changed { background: color-mix(in srgb, var(--bad) 9%, transparent); }
.diff .dl.del.extra { background: color-mix(in srgb, var(--bad) 20%, transparent); }
.diff .dl.add.changed { background: color-mix(in srgb, var(--ok) 9%, transparent); }
.diff .dl.add.missing { background: color-mix(in srgb, var(--ok) 20%, transparent); }
.diff .dl.clip { color: var(--text-3); }
.tk-del { background: color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 3px; padding: 0 2px; }
.tk-add { background: color-mix(in srgb, var(--ok) 40%, transparent); border-radius: 3px; padding: 0 2px; }
.img-cmp { display: flex; flex-wrap: wrap; gap: 10px; }
.img-cmp figure { margin: 0; display: grid; gap: 4px; justify-items: start; }
.img-cmp img { width: 180px; max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; }
.img-cmp figcaption { font-size: 12px; color: var(--text-3); }
.live-actions { margin: 14px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
.ide-main { flex: 1; min-height: 0; display: flex; }
.panel { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.left { flex: 0 0 var(--left, 45%); }
.right { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.code { flex: 0 0 var(--top, 60%); }
.tests { flex: 1; }
.splitter { flex: 0 0 8px; position: relative; touch-action: none; }
.splitter::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background .15s; }
.splitter.v { cursor: col-resize; } .splitter.v::after { top: 30%; bottom: 30%; left: 3px; width: 2px; }
.splitter.h { cursor: row-resize; } .splitter.h::after { left: 30%; right: 30%; top: 3px; height: 2px; }
.splitter:hover::after, .splitter.dragging::after, .splitter:focus-visible::after { background: var(--link); top: 0; bottom: 0; left: 3px; }
.splitter.h:hover::after, .splitter.h.dragging::after, .splitter.h:focus-visible::after { left: 0; right: 0; top: 3px; bottom: auto; }
.splitter:focus-visible { outline: none; }

.panel-head { flex: none; height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--layer-head);
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptab { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 6px; background: none;
  color: var(--text-2); cursor: pointer; font-weight: 500; white-space: nowrap; font-size: 13px; }
.ptab:hover { background: var(--fill); color: var(--text); }
.ptab[aria-selected="true"] { color: var(--text); font-weight: 600; }
.ptab.static { cursor: default; color: var(--text); font-weight: 600; } .ptab.static:hover { background: none; }
.sep { width: 1px; height: 14px; background: var(--line-strong); margin: 0 2px; flex: none; }
.ico-desc { color: var(--icon-desc); } .ico-ed { color: var(--icon-ed); } .ico-code { color: var(--icon-code); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }

/* statement */
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.d-head h1 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.solved-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-size: 13px; white-space: nowrap; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.callout { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; background: var(--fill); border-radius: 8px; padding: 10px 14px;
  color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
.callout svg { margin-top: 3px; color: var(--brand-ink); }
.callout p { margin: 0; }
.callout > div { display: grid; gap: 6px; min-width: 0; }
.callout-title { color: var(--text); font-weight: 600; }
.start { margin: 22px 0 30px; padding: 20px 20px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--layer); display: grid; gap: 18px; }
.start-top { display: grid; gap: 4px; }
.start-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-ink); }
.start-top h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--text); }
.start-sub { margin: 0; font-size: 13px; color: var(--text-3); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; }
.step { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; padding-bottom: 20px; }
.step:last-child { padding-bottom: 0; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 12px; top: 32px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--line-strong); }
.start.start :not(pre) > code { font: 12.5px var(--font-mono); color: var(--text); background: none; border: 0; padding: 0; }
.step-n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); color: var(--text-2); font: 600 12px/23px var(--font-ui); text-align: center; background: var(--layer); }
.step-main { min-width: 0; padding-top: 2px; }
.step-file { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.step-name { font: 600 13.5px var(--font-mono); color: var(--text); background: none; border: 0; padding: 0; overflow-wrap: anywhere; text-align: left; }
button.step-name { cursor: pointer; }
button.step-name:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.step-dir { font: 12px var(--font-mono); color: var(--text-3); }
.step-tag { align-self: center; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; background: var(--fill); color: var(--text-3); white-space: nowrap; }
.step-tag.new { color: var(--brand-ink); }
.step-tag.adds { color: var(--link); }
.step-job { margin: 6px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
.step-more { margin-top: 6px; }
.step-more > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12.5px; color: var(--link); border-radius: 4px; }
.step-more > summary::-webkit-details-marker { display: none; }
.step-more > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
.step-more > summary svg { width: 14px; height: 14px; transition: transform .15s; }
.step-more[open] > summary svg { transform: rotate(180deg); }
.step-more .when-open, .step-more[open] .when-closed { display: none; }
.step-more[open] .when-open { display: inline; }
.step-more-body { margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--fill); display: grid; gap: 10px; font-size: 13px; line-height: 1.6; color: var(--text-2); }
.step-more-body p { margin: 0; }
.lbl { display: block; margin-bottom: 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.start-facts { margin: 0; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.fact { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 14px; align-items: baseline; }
.fact dt { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.fact dd { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-2); display: grid; gap: 8px; justify-items: start; min-width: 0; }
.fact dd b { color: var(--text); font-weight: 600; }
.ways { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); }
.way { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--text-2); font: 500 12.5px var(--font-ui); cursor: pointer; }
.way:hover { color: var(--text); }
.way[aria-pressed="true"] { background: var(--fill-hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.way-note { font-size: 12.5px; color: var(--text-3); }
@media (max-width: 520px) { .fact { grid-template-columns: minmax(0, 1fr); } }
.fpath { font: 12px var(--font-mono); background: var(--fill); color: var(--text); border: 0; border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
button.fpath { cursor: pointer; } button.fpath:hover { background: var(--fill-hover); }
.noproj { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; background: var(--layer); text-align: center; }
.noproj > div { max-width: 46ch; display: grid; gap: 10px; justify-items: center; font-size: 13px; color: var(--text-2); }
.noproj h2 { margin: 0; font-size: 16px; color: var(--text); }
.noproj p { margin: 0; }
.finish { grid-template-columns: minmax(0, 1fr); }
.finish .cmd code { white-space: pre-wrap; overflow-wrap: anywhere; }
.trees { display: grid; gap: 12px; min-width: 0; }
.trees > div { min-width: 0; }
.trees h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.trees pre { margin: 0; max-width: 100%; font: 11.5px/1.55 var(--font-mono); color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.trees .hit { color: var(--ok); }
.flow > * { margin: 0; }
.flow > * + * { margin-top: 12px; }
.flow > h2:not(:first-child) { margin-top: 26px; }
.flow > h3:not(:first-child) { margin-top: 20px; }
.flow > h4:not(:first-child) { margin-top: 16px; }
.flow > .d-sec:not(:first-child), .flow > .examples { margin-top: 26px; }
.flow h2 { font-size: 15px; font-weight: 600; }
.flow h3 { font-size: 14px; font-weight: 600; }
.flow h4 { font-size: 14px; font-weight: 500; }
.flow ul, .flow ol { padding-left: 22px; }
.flow li + li { margin-top: 4px; }
.flow :not(pre) > code { font-size: 12.5px; background: var(--fill); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; color: var(--text); }
.flow pre { background: var(--code-bg); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
.flow pre code { font-size: inherit; }
.flow strong { font-weight: 600; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.flow table { border-collapse: collapse; width: 100%; font-size: 13px; }
.flow th, .flow td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.flow tr:last-child td { border-bottom: 0; }
.flow th { font-weight: 600; background: var(--layer-head); color: var(--text-2); }
.reqs { list-style: none; padding: 0 !important; display: grid; gap: 8px; }
.reqs li + li { margin-top: 0; }
.reqs li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.rid { font: 600 12px/1.6 var(--font-mono); color: var(--brand-ink); }
.ex + .ex { margin-top: 22px; }
.ex-title { margin: 0 0 8px; }
.ex-title strong { font-weight: 600; }
.ex-title span { color: var(--text-2); }
.ex-block { border-left: 2px solid var(--line-strong); padding-left: 14px; display: grid; gap: 8px; min-width: 0; }
.ex-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; }
.ex-k { font-weight: 600; font-size: 13px; }
.ex-row > pre { margin: 0; padding: 0; background: none; color: var(--text-2); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
.ex-row .flow { color: var(--text-2); }
img.shot, figure.pic img { max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #000; display: block; }
figure.pic { display: grid; gap: 4px; justify-items: start; }
figure.pic figcaption { font: 11px/1.3 var(--font-mono); color: var(--text-3); }
figure.split-figure { display: grid; gap: 14px; align-items: center; }
@media (min-width: 720px) { figure.split-figure { grid-template-columns: 200px minmax(0, 1fr); } }
figure.split-figure svg { width: 100%; max-width: 200px; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.dot.a { background: var(--fig-a); } .dot.b { border: 2px solid var(--fig-b); }
.md-details summary { cursor: pointer; font-weight: 500; }

.accs { margin-top: 30px; border-top: 1px solid var(--line); }
.accs-top { margin: -6px 0 0; border-top: 0; }  /* Source material, right under "Read in the blog first" */
.accs-top .acc { border-bottom: 0; }
.accs-top .acc-btn { padding: 4px 2px 6px; font-size: 13px; color: var(--text-2); }
.accs-top .acc-body { padding-top: 4px; font-size: 13px; }
.acc { border-bottom: 1px solid var(--line); }
.acc-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 2px; background: none; border: 0; cursor: pointer; color: var(--text); text-align: left; font-weight: 500; }
.acc-btn:disabled { cursor: not-allowed; color: var(--text-3); }
.acc-btn > svg:first-child { color: var(--text-2); }
.acc-sub { color: var(--text-3); font-weight: 400; margin-left: 8px; }
.acc-lock { color: var(--text-3); display: inline-grid; }
.chev { margin-left: auto; display: inline-grid; color: var(--text-3); transition: transform .15s; }
.acc-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-body { padding: 0 2px 16px 28px; color: var(--text-2); }
.tg + .tg { margin-top: 10px; }
.tg-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.tg-items { display: flex; flex-wrap: wrap; gap: 6px; }
.tg-items .chip { height: auto; min-height: 24px; white-space: normal; padding: 2px 10px; }
.tg-items code { font-size: 11.5px; }
.d-foot { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; color: var(--text-3); font-size: 12px; }
.ed-title { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
.ed-sec { display: grid; gap: 10px; margin-bottom: 28px; min-width: 0; }
.ed-sec > h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ed-sec .note { margin: 0; }
.badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--fill); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--medium); }
.badge svg { width: 14px; height: 14px; }
.sol-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.sol-head code { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sol-head .btn { height: 26px; font-size: 12px; }
.sol-code { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); color: var(--syn-text); tab-size: 2; }
#editorial .case-pills { margin-bottom: 0; }
.locked { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--text-2); }
.locked svg { width: 28px; height: 28px; color: var(--brand); }
.locked h2 { margin: 0; color: var(--text); font-size: 16px; font-weight: 600; }
.locked p { margin: 0; max-width: 46ch; }

/* editor */
.code-tools { flex: none; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.lang { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--text-2); font-size: 13px; white-space: nowrap; cursor: help; }
.file { font: 12px var(--font-mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tools-right { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-right: 4px; }
.confirm .btn { height: 26px; padding: 0 10px; font-size: 12px; }
.editor-row { flex: 1; min-height: 0; display: flex; position: relative; }
.editor { flex: 1; min-width: 0; min-height: 0; position: relative; }
/* Files panel and open-file tabs (live mode) */
.tree { flex: 0 0 210px; overflow: auto; border-right: 1px solid var(--line); background: var(--layer-head); padding: 6px 0 10px; font-size: 13px; }
.tree-dir { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 4px 12px; color: var(--text-3); font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; }
.tree-add { width: 22px; height: 22px; border: 0; border-radius: 5px; background: none; color: var(--text-2); cursor: pointer; font-size: 16px; line-height: 1; }
.tree-add:hover { background: var(--fill); color: var(--text); }
.tree-item { width: 100%; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 14px; border: 0; background: none; color: var(--text-2); cursor: pointer; text-align: left; font: 12.5px var(--font-mono); }
.tree-item:hover { background: var(--fill); color: var(--text); }
.tree-item.on { background: var(--fill-hover); color: var(--text); }
.tree-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .tm { width: 12px; flex: none; font-weight: 700; }
.tree-item.blank .nm { font-style: italic; }
.tree-item.now { box-shadow: inset 3px 0 0 var(--brand); }
.tree-item.now .nm { color: var(--text); font-weight: 600; }
.tree-item.uses .nm { color: var(--link); }
.tree-item.dim { opacity: .5; }
.tree-item.dim:hover, .tree-item.dim.on { opacity: 1; }
.tree-dir.now span { color: var(--brand-ink); }
.tree-key { margin: 0 12px 4px 14px; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--text-3); }
.tree-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.tree-key .k-now { background: var(--brand); } .tree-key .k-uses { background: var(--link); }
.tree-item .tm.ok { color: var(--ok); } .tree-item .tm.broke { color: var(--bad); }
.tag-n { flex: none; min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--fill); color: var(--text-3); font: 600 10px/16px var(--font-ui); text-align: center; }
.tree-empty { margin: 2px 12px 6px 14px; color: var(--text-3); font-size: 12px; line-height: 1.45; }
.tree-key.tree-plan { display: block; margin-bottom: 8px; line-height: 1.45; }
.new-file { padding: 2px 10px 6px 14px; }
.new-file input { width: 100%; height: 26px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--layer); padding: 0 8px; font: 12.5px var(--font-mono); color: var(--text); }
.new-file input:focus { outline: none; border-color: var(--link); }
.tree-foot { padding: 12px 10px 0 14px; }
.tree-foot .btn { width: 100%; justify-content: center; height: 28px; font-size: 12px; }
.ftabs { flex: none; display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; background: var(--layer); }
.ftab { display: inline-flex; align-items: center; border-radius: 6px 6px 0 0; color: var(--text-3); white-space: nowrap; }
.ftab button { border: 0; background: none; color: inherit; cursor: pointer; font: 12px var(--font-mono); height: 28px; padding: 0 10px; }
.ftab .x { padding: 0 8px 0 0; font-size: 14px; }
.ftab.on { background: var(--fill); color: var(--text); }
.ftab.warn button:first-child { color: var(--medium); }
.err-list .err { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 0; font: inherit; color: inherit; cursor: pointer; }
.err-list .err:hover .loc { text-decoration: underline; }
.nudge { background: var(--fill); border-radius: 8px; padding: 12px 14px; margin: 4px 0 14px; display: grid; gap: 8px; font-size: 13px; color: var(--text-2); }
.nudge b { color: var(--text); }
.nudge code { font-size: 12px; background: var(--layer); padding: 1px 5px; border-radius: 4px; }
.recheck { display: grid; gap: 2px; margin-top: 8px; }
.rc-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--text); font-size: 13px; }
.rc-row:hover { background: var(--fill); text-decoration: none; }
.rc-n { color: var(--text-3); } .rc-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-v { font-weight: 600; font-size: 12px; } .rc-v.ok { color: var(--ok); } .rc-v.bad { color: var(--bad); } .rc-v.warn { color: var(--medium); }
.st-broke { color: var(--bad); font-weight: 700; display: inline-grid; place-items: center; width: 16px; }
.finish h2 { color: var(--ok); }
.finish table { width: 100%; border-collapse: collapse; font-size: 12px; }
.finish td { padding: 3px 0; vertical-align: top; color: var(--text-2); }
.finish td:first-child { font-family: var(--font-mono); color: var(--text); padding-right: 8px; word-break: break-all; }
.vim-btn { width: auto; padding: 0 8px; font: 600 12px var(--font-mono); }
.lang-select { height: 26px; border: 0; border-radius: 6px; background: var(--fill); color: var(--text); font: 500 13px var(--font-ui); padding: 0 4px; cursor: pointer; max-width: 160px; }
.lang-select:hover { background: var(--fill-hover); }
.install { display: grid; gap: 8px; background: var(--fill); border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; font-size: 13px; color: var(--text-2); }
.install p { margin: 0; }
.install b { color: var(--medium); }
.install .cmd { background: var(--layer); }
.vim-btn[aria-pressed="true"] { color: var(--ok); background: var(--fill); }
/* Vim mode: block cursor in Normal mode, and the : / command line (CodeMirror's dialog addon). */
.cm-fat-cursor .CodeMirror-cursor { width: auto; border: 0 !important; background: color-mix(in srgb, var(--ok) 55%, transparent); }
.cm-fat-cursor div.CodeMirror-cursors { z-index: 1; }
.cm-fat-cursor .CodeMirror-line::selection, .cm-fat-cursor .CodeMirror-line > span::selection, .cm-fat-cursor .CodeMirror-line > span > span::selection { background: transparent; }
.cm-fat-cursor { caret-color: transparent; }
.cm-animate-fat-cursor { width: auto; border: 0; animation: blink 1.06s steps(1) infinite; background: color-mix(in srgb, var(--ok) 55%, transparent); }
@keyframes blink { 50% { background-color: transparent; } }
.CodeMirror-dialog { position: absolute; left: 0; right: 0; background: var(--layer-head); z-index: 15; padding: 2px 10px; overflow: hidden; color: var(--text); font: 13px var(--font-mono); }
.CodeMirror-dialog-top { border-bottom: 1px solid var(--line); top: 0; }
.CodeMirror-dialog-bottom { border-top: 1px solid var(--line); bottom: 0; }
.CodeMirror-dialog input { border: none; outline: none; background: transparent; width: 20em; color: inherit; font: inherit; }
.CodeMirror-dialog button { font-size: 70%; }
.cm-searching { background: color-mix(in srgb, var(--medium) 35%, transparent); }
.editor > .CodeMirror, .editor > .fallback-editor { position: absolute; inset: 0; height: auto; }
.code-status { flex: none; height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); }
.fallback-editor { width: 100%; height: 100%; border: 0; resize: none; padding: 8px 12px; background: var(--layer); color: var(--text);
  font: 14px/1.6 var(--font-mono); white-space: pre; outline: none; tab-size: 2; }

/* test cases and results */
.case-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pill-btn { height: 30px; padding: 0 14px; border-radius: 8px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-weight: 500; font-size: 13px; }
.pill-btn:hover { background: var(--fill); color: var(--text); }
.pill-btn[aria-selected="true"] { background: var(--fill); color: var(--text); }
.case-name { margin: -4px 0 12px; color: var(--text-2); font-size: 13px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 14px; min-width: 0; }
.field-k { font-size: 12px; color: var(--text-3); }
.field-v { margin: 0; background: var(--fill); border-radius: 8px; padding: 10px 12px; font: 13px/1.6 var(--font-mono); color: var(--text); overflow-x: auto; white-space: pre; }
.field img { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; }
.verdict { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 14px; }
.verdict h2 { margin: 0; font-size: 20px; font-weight: 600; }
.verdict.ok h2 { color: var(--ok); } .verdict.bad h2 { color: var(--bad); } .verdict.warn h2 { color: var(--medium); } .verdict.unknown h2 { color: var(--text-2); }

<script type="application/json" id="book-data">{"key":"build-react-yourself","title":"Build React yourself","headline":"Learn what React does by writing it","lede":"Rebuild React's core in JavaScript: elements, a work loop over fibers, the commit phase, reconciliation by position and by key, function components, useState, useEffect, and a todo app running on your own library. Your code runs on a small DOM, and what it draws is compared with real React 19.3.1 on jsdom. Where the two posts this follows differ from React as it is today, the tests follow React.","credits":"Expected outputs come from React 19.3.1 running on jsdom 30.1.3, with small independent models covering the counts of work. The book saves your progress in this browser and nowhere else.","sourceUrl":"https://pomb.us/build-your-own-react/","sourceTitle":"Build your own React","author":"Rodrigo Pombo","folder":"react-from-scratch","check":".\\check {id}","shell":"PowerShell","primer":[{"title":"JavaScript","intro":"<p>The slice of the language the starters and assignments lean on, roughly in the order you hit it. It's recent JavaScript on Node.js 26, with no build step and no JSX.<\/p>","entries":[{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","plain":"ES modules: import and export","also":["import","export","module","require","CommonJS","default export","named export","type module","package.json"],"html":"<p>A module is a file with a scope of its own. Nothing in it is visible elsewhere unless the file says <code>export<\/code>, and nothing from another file is visible until this one says <code>import<\/code>. An import picks a named export by name. A file may also have one default export, and the importer can call that anything it likes.<\/p>\n<pre><code>// shapes.js\nexport const sides = 4;\nexport function area(w, h) { return w * h; }\nexport default function describe() { return &#x27;a rectangle&#x27;; }\n\n// main.js\nimport describe, { area, sides as n } from &#x27;./shapes.js&#x27;;\nimport &#x27;./setup.js&#x27;; // runs the file, takes nothing from it<\/code><\/pre>\n<p>Three details catch people who come from other languages. The specifier is a file path. A relative one needs its extension: <code>&#x27;./shapes.js&#x27;<\/code>, not <code>&#x27;./shapes&#x27;<\/code>. Your project's <code>package.json<\/code> contains <code>&quot;type&quot;: &quot;module&quot;<\/code>, which tells Node to read its <code>.js<\/code> files as modules. And a module runs once, the first time anything imports it, so import order matters when a file does something as it loads.<\/p>\n<p>Every assignment program opens with imports, and every file you write in <code>src/didact/<\/code> exports something another one imports. <code>index.js<\/code> (assignment 04) ends with a default export of the <code>Didact<\/code> object plus a list of named ones. <code>TodoApp.js<\/code> (12) renames on import with <code>createElement as h<\/code>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules\" target=\"_blank\" rel=\"noopener\">MDN: JavaScript modules<\/a><\/li><li><a href=\"https://nodejs.org/api/esm.html\" target=\"_blank\" rel=\"noopener\">Node.js: ECMAScript modules<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/import\" target=\"_blank\" rel=\"noopener\">MDN: import<\/a><\/li><\/ul>","from":"01","usedIn":["01","02","03","04","05","06","07","08","09","10","11","12"]},{"id":"js-objects","title":"Objects, spread and destructuring","plain":"Objects, spread and destructuring","also":["object literal","shorthand property","spread operator","destructuring","copy an object","Object.assign","dictionary","hash map","shallow copy"],"html":"<p>Elements, props, fibers and the library's shared state are all plain JavaScript objects: bags of named properties, written <code>{ name: value }<\/code>. Three bits of syntax keep the code around them short.<\/p>\n<p>Shorthand first. When a variable already has the property's name, <code>{ render }<\/code> means <code>{ render: render }<\/code>. Spread, <code>{ ...a, x: 1 }<\/code>, builds a new object from the own properties of <code>a<\/code> and then <code>x<\/code>. If a name repeats, the later property wins, and the copy is shallow, so nested objects stay shared with the original. Destructuring runs the other way, pulling properties out into variables, either in a declaration (<code>const { id, text } = item<\/code>) or right in a parameter list.<\/p>\n<pre><code>const base = { id: 7, tags: [&#x27;a&#x27;], done: false };\nconst next = { ...base, done: true };   // a new object; base is untouched\nconst { id, done } = next;              // id is 7, done is true\nbase.tags === next.tags;                // true: tags is shared, not copied<\/code><\/pre>\n<p>The entry programs hand your functions to the harness as <code>{ createElement }<\/code> or <code>{ createDom, updateDom }<\/code>, and the one for assignment 12 spreads the whole <code>Didact<\/code> object into a larger one. The copying half bites sooner, in 01: any time an assignment wants a new object built from another, with the other left unchanged, you are choosing how to copy.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Object_initializer\" target=\"_blank\" rel=\"noopener\">MDN: Object initializer<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax\" target=\"_blank\" rel=\"noopener\">MDN: Spread syntax<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring\" target=\"_blank\" rel=\"noopener\">MDN: Destructuring<\/a><\/li><\/ul>","from":"01","usedIn":["01","02","03","04","12"]},{"id":"js-rest-spread","title":"Rest parameters and spread arguments","plain":"Rest parameters and spread arguments","also":["...args","variadic","varargs","spread operator","rest operator","arguments object","three dots"],"html":"<p>Three dots, two jobs. Which one you get depends on where they sit.<\/p>\n<p>In a parameter list, <code>...name<\/code> collects the remaining arguments into a real array. It has to come last, and when no extra arguments arrive the array is empty. At a call site, <code>f(...list)<\/code> does the reverse: the elements of <code>list<\/code> go in as separate arguments.<\/p>\n<pre><code>function tag(name, ...kids) { return { name, kids }; }\n\ntag(&#x27;ul&#x27;, &#x27;a&#x27;, &#x27;b&#x27;);        // kids: [&#x27;a&#x27;, &#x27;b&#x27;]\ntag(&#x27;ul&#x27;);                  // kids: [], still an array\nconst more = [&#x27;x&#x27;, &#x27;y&#x27;];\ntag(&#x27;ul&#x27;, ...more, &#x27;z&#x27;);    // kids: [&#x27;x&#x27;, &#x27;y&#x27;, &#x27;z&#x27;]<\/code><\/pre>\n<p>JSX is why it comes up. A tag with children, <code>&lt;ul&gt;{a}{b}&lt;/ul&gt;<\/code>, compiles to a call that gets the children as extra arguments, so <code>createElement(type, props, ...children)<\/code> has to take any number of them. The Boilerplate of assignment 01 already has that signature; deciding what to do with the array is the assignment. Spread comes back in 12, where the app has its children in a list and the call wants them one by one.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/rest_parameters\" target=\"_blank\" rel=\"noopener\">MDN: Rest parameters<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax\" target=\"_blank\" rel=\"noopener\">MDN: Spread syntax<\/a><\/li><\/ul>","from":"01","usedIn":["01"]},{"id":"js-typeof","title":"<code>typeof<\/code> and the types you meet","plain":"typeof and the types you meet","also":["type check","typeof null","primitive types","Array.isArray","is a string","is a number","dynamic typing"],"html":"<p>JavaScript has no type declarations. Values carry their type; variables don't. You will meet number (integers and fractions alike), string, boolean, <code>undefined<\/code>, <code>null<\/code>, function and object, with object covering plain objects, arrays and elements. <code>typeof x<\/code> returns the type's name as a string.<\/p>\n<pre><code>typeof &#x27;hi&#x27;          // &#x27;string&#x27;\ntypeof 3.5           // &#x27;number&#x27;\ntypeof {}            // &#x27;object&#x27;\ntypeof [1, 2]        // &#x27;object&#x27;: arrays have no type name of their own\ntypeof (() =&gt; 1)     // &#x27;function&#x27;\ntypeof undefined     // &#x27;undefined&#x27;\ntypeof null          // &#x27;object&#x27;: a leftover of the first implementation, kept for compatibility<\/code><\/pre>\n<p>Two edges to remember. A check for \"some object\" lets <code>null<\/code> through, so test <code>=== null<\/code> separately, and reach for <code>Array.isArray(x)<\/code> when you need an array. In its favour, <code>typeof<\/code> doesn't throw on a name that was never declared.<\/p>\n<p>Assignment 01 hands <code>createElement<\/code> children of several kinds in one list: strings, numbers and objects that are already elements. Telling them apart is your job, and <code>typeof<\/code> is one candidate. By 09 an element's <code>type<\/code> is no longer always a string.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof\" target=\"_blank\" rel=\"noopener\">MDN: typeof<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Grammar_and_types\" target=\"_blank\" rel=\"noopener\">MDN: Grammar and types<\/a><\/li><\/ul>","from":"01","usedIn":["01","09"]},{"id":"js-arrays","title":"Array methods: map, filter, forEach, find, includes, slice","plain":"Array methods: map, filter, forEach, find, includes, slice","also":["list","array","push","pop","splice","indexOf","some","every","reduce","length","Array.from"],"html":"<p>An array is an ordered list indexed from 0, with a <code>length<\/code>. Most of its methods take a function and call it once per element.<\/p>\n<pre><code>const nums = [3, 8, 12];\nnums.map((n) =&gt; n * 2);               // [6, 16, 24], a new array of the results\nnums.filter((n) =&gt; n &gt; 5);            // [8, 12], the elements the function accepted\nnums.find((n) =&gt; n &gt; 5);              // 8, the first one it accepted (or undefined)\nnums.includes(8);                     // true, no function needed\nnums.slice(1);                        // [8, 12], a copy from index 1 on\nnums.forEach((n) =&gt; console.log(n));  // returns undefined: it exists for the side effect<\/code><\/pre>\n<p><code>map<\/code>, <code>filter<\/code> and <code>slice<\/code> leave the array alone; <code>push<\/code>, <code>pop<\/code> and <code>splice<\/code> change it in place. When a library keeps an old tree around to compare with a new one, that difference decides whether the comparison still works.<\/p>\n<p>Most assignments will have you reaching for these, even though the Boilerplate calls none of them. An element's children are an array from 01 on (<code>props.children<\/code>), and a lot of the work is turning one list into another: children into DOM nodes (03) or fibers (04), a list of data into a list of elements (12).<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array\" target=\"_blank\" rel=\"noopener\">MDN: Array<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map\" target=\"_blank\" rel=\"noopener\">MDN: Array.prototype.map()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Indexed_collections\" target=\"_blank\" rel=\"noopener\">MDN: Indexed collections<\/a><\/li><\/ul>","from":"01","usedIn":["01","08","10","11","12"]},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","plain":"throw, try, catch and finally","also":["exception","raise","error handling","new Error","stack trace","not implemented","uncaught error","exit code 99"],"html":"<p><code>throw<\/code> stops the current function and unwinds the call stack until some <code>catch<\/code> takes the error. If nothing does, the program prints a stack trace and exits with code 1. Any value can be thrown, but use <code>new Error(&#x27;message&#x27;)<\/code>, which records where it happened. A <code>finally<\/code> block runs whether the <code>try<\/code> block finished, threw or returned.<\/p>\n<pre><code>function split(line) {\n  if (line === &#x27;&#x27;) throw new Error(&#x27;empty line&#x27;);\n  return line.split(&#x27;,&#x27;);\n}\n\ntry {\n  split(&#x27;&#x27;);\n} catch (err) {\n  console.log(err.message);   // empty line\n} finally {\n  console.log(&#x27;done&#x27;);        // runs either way\n}<\/code><\/pre>\n<p>Every function you write in this workbook starts as a stub that throws <code>new Error(&#x27;not implemented: ...&#x27;)<\/code>, and the harness gives that message a meaning. An error whose text starts with <code>not implemented<\/code> ends the program with exit code 99, which the checker reports as \"Not implemented yet\" instead of a failure. Any other uncaught error becomes a Runtime Error, with its message beside it. If a test dies that way, read the stack trace from the top: the first line that names one of your files is where it happened.<\/p>\n<p>You'll find the stubs in every Boilerplate file, from <code>createElement.js<\/code> in 01 on, and replacing them is the work. Exit codes get their own entry: <a href=\"#primer/node-process\">exit codes and <code>node --check<\/code><\/a>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/throw\" target=\"_blank\" rel=\"noopener\">MDN: throw<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/try...catch\" target=\"_blank\" rel=\"noopener\">MDN: try...catch<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Error\" target=\"_blank\" rel=\"noopener\">MDN: Error<\/a><\/li><\/ul>","from":"01","usedIn":["01","02","03","04","05","10","12"]},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","plain":"async, await and top-level await","also":["promise","Promise","then","asynchronous","top-level await","event loop","callback"],"html":"<p>Reading a file, waiting on a timer or making a network request takes time, and JavaScript doesn't stop the world to wait. Such an operation returns a promise, an object standing for a result that arrives later. <code>await promise<\/code> pauses the surrounding function until the promise settles, then hands you the value, or throws if the operation failed. A function that uses <code>await<\/code> must be declared <code>async<\/code>, and calling it returns a promise of its own.<\/p>\n<p>In an ES module, <code>await<\/code> also works at the top level of the file, outside any function. The module then counts as unfinished until the promise settles.<\/p>\n<pre><code>import { readFile } from &#x27;node:fs/promises&#x27;;\n\nconst text = await readFile(&#x27;notes.txt&#x27;, &#x27;utf8&#x27;);   // top level: no async function around it\nconsole.log(text.length);<\/code><\/pre>\n<p>You won't write <code>async<\/code> or <code>await<\/code> in your own files. Each program in <code>assignments/<\/code> boils down to one line of it, <code>await runScenarioFile(...)<\/code>, which reads the scenario, runs it against your library and writes the output file before the program ends. The library itself is synchronous and waits through scheduled callbacks, which is the subject of <a href=\"#primer/dom-idle-callback\">requestIdleCallback<\/a>. One trap for the curious: a top-level <code>await<\/code> on a promise that can never settle ends Node with status 13.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await\" target=\"_blank\" rel=\"noopener\">MDN: await<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function\" target=\"_blank\" rel=\"noopener\">MDN: async function<\/a><\/li><li><a href=\"https://nodejs.org/api/esm.html\" target=\"_blank\" rel=\"noopener\">Node.js: top-level await in ES modules<\/a><\/li><\/ul>","from":"01","usedIn":["01","02","03","04","05","06","07","08","09","10","11","12"]},{"id":"js-functions-closures","title":"Arrow functions and closures","plain":"Arrow functions and closures","also":["lambda","anonymous function","callback","fat arrow","=>","function expression","scope","lexical scope","handler"],"html":"<p>Two ways to write the same function:<\/p>\n<pre><code>function add(a, b) { return a + b; }\nconst add2 = (a, b) =&gt; a + b;<\/code><\/pre>\n<p>An arrow function with an expression after <code>=&gt;<\/code> returns that expression. With a <code>{ block }<\/code> body it needs an explicit <code>return<\/code>. To return an object literal, wrap it in parentheses, <code>() =&gt; ({ ok: true })<\/code>, or the parser takes the braces for a block. Arrows are the usual shape for callbacks, which is why you see them throughout array code.<\/p>\n<p>A closure is a function that keeps access to the variables around where it was written, even after the outer code has finished running.<\/p>\n<pre><code>function makeCounter() {\n  let n = 0;\n  return () =&gt; ++n;\n}\nconst a = makeCounter();\nconst b = makeCounter();\na(); a(); b();   // 1, 2, 1: each counter has its own n<\/code><\/pre>\n<p>Handlers and setters are closures. A click handler written inside a component carries the values from the render that made it, and a setter handed out on a component's first render has to keep working on every render after; much of assignment 10 turns on that. The scenario files in the tests lean on closures from 02 on: each <code>onClick=@name<\/code> handler is a function that appends to a log, one function per name.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions\" target=\"_blank\" rel=\"noopener\">MDN: Arrow functions<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures\" target=\"_blank\" rel=\"noopener\">MDN: Closures<\/a><\/li><\/ul>","from":"02","usedIn":["02","10","11","12"]},{"id":"js-object-keys","title":"<code>Object.keys<\/code>, <code>Object.entries<\/code>, <code>Object.hasOwn<\/code> and <code>in<\/code>","plain":"Object.keys, Object.entries, Object.hasOwn and in","also":["iterate object","for in","property names","own property","has key","hasOwnProperty","Object.values","enumerate properties"],"html":"<p><code>updateDom<\/code> in assignment 02 gets two props objects. It needs the names in each, and a way to ask whether one has a name the other lacks.<\/p>\n<p>Going through an object's properties starts with their names. <code>Object.keys(obj)<\/code> returns an array of the object's own property names, <code>Object.values(obj)<\/code> the values, and <code>Object.entries(obj)<\/code> an array of <code>[name, value]<\/code> pairs, which pairs well with destructuring in a <code>for...of<\/code>. Own means set on the object itself rather than inherited.<\/p>\n<p>Asking whether a name is present can be done two ways, and they reach differently. <code>&#x27;k&#x27; in obj<\/code> is true for own and inherited properties alike (<code>&#x27;toString&#x27; in {}<\/code> is true). <code>Object.hasOwn(obj, &#x27;k&#x27;)<\/code> is true for own ones only. Neither matches <code>obj.k !== undefined<\/code>, because a property can exist and hold <code>undefined<\/code>.<\/p>\n<pre><code>const props = { id: &#x27;x&#x27;, title: undefined };\nObject.keys(props);               // [&#x27;id&#x27;, &#x27;title&#x27;]\nObject.entries(props);            // [[&#x27;id&#x27;, &#x27;x&#x27;], [&#x27;title&#x27;, undefined]]\n&#x27;title&#x27; in props;                 // true\nprops.title !== undefined;        // false: present, but its value is undefined\nObject.hasOwn(props, &#x27;id&#x27;);       // true<\/code><\/pre>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/keys\" target=\"_blank\" rel=\"noopener\">MDN: Object.keys()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/hasOwn\" target=\"_blank\" rel=\"noopener\">MDN: Object.hasOwn()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/in\" target=\"_blank\" rel=\"noopener\">MDN: the in operator<\/a><\/li><\/ul>","from":"02","usedIn":["02"]},{"id":"js-equality","title":"<code>===<\/code>, <code>Object.is<\/code>, truthy and falsy","plain":"===, Object.is, truthy and falsy","also":["strict equality","loose equality","==","!==","NaN","falsy values","truthiness","identity","null vs undefined","SameValue"],"html":"<p><code>===<\/code> compares two values without converting either, so <code>1 === &#x27;1&#x27;<\/code> is false. <code>==<\/code> converts first and gives results such as <code>0 == &#x27;&#x27;<\/code> being true; leave it alone, with one exception below. Objects and functions compare by identity: two separate <code>{}<\/code> are not <code>===<\/code> to each other, and a function equals only itself, whatever its body.<\/p>\n<p>A variant, <code>Object.is(a, b)<\/code>, is <code>===<\/code> with two corrections: <code>Object.is(NaN, NaN)<\/code> is true and <code>Object.is(0, -0)<\/code> is false. React compares a hook's dependency list with it, entry by entry. That matters in assignment 11.<\/p>\n<p>Truthiness decides what <code>if (x)<\/code>, <code>x &amp;&amp; y<\/code> and <code>x || y<\/code> do. The falsy values are <code>false<\/code>, <code>0<\/code>, <code>-0<\/code>, <code>0n<\/code>, <code>&#x27;&#x27;<\/code>, <code>null<\/code>, <code>undefined<\/code> and <code>NaN<\/code>. Everything else is truthy, <code>&#x27;0&#x27;<\/code>, <code>[]<\/code> and <code>{}<\/code> included. That's a trap whenever a falsy value is also a legitimate one:<\/p>\n<pre><code>const label = &#x27;&#x27;;\nlabel || &#x27;untitled&#x27;;     // &#x27;untitled&#x27;, although &#x27;&#x27; was a valid value\nlabel ?? &#x27;untitled&#x27;;     // &#x27;&#x27;: only null and undefined count as missing\nlabel === undefined;     // false<\/code><\/pre>\n<p>If the question is whether something is there, ask it in those words, with <code>=== undefined<\/code> or <code>== null<\/code> (the one use of <code>==<\/code> worth knowing: it is true for <code>null<\/code> and <code>undefined<\/code> and for nothing else), and keep truthiness for when you want it. <code>??<\/code> has an <a href=\"#primer/js-optional-chaining\">entry of its own<\/a>. Comparing old and new props in 02, deciding what counts as a key in 07 and comparing dependency lists in 11 all come down to these rules.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Equality_comparisons_and_sameness\" target=\"_blank\" rel=\"noopener\">MDN: Equality comparisons and sameness<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Glossary/Falsy\" target=\"_blank\" rel=\"noopener\">MDN: Falsy<\/a><\/li><\/ul>","from":"02","usedIn":["02","06","07","11"]},{"id":"js-loops","title":"<code>for<\/code>, <code>for...of<\/code> and <code>while<\/code>","plain":"for, for...of and while","also":["loop","iterate","for each","do while","break","continue","for in","index loop","linked list traversal"],"html":"<p>The counting loop has three parts in its parentheses: setup, condition, step. <code>while (cond)<\/code> has only the condition and may run zero times. <code>for (const x of list)<\/code> visits the values of an array, a string, a <code>Map<\/code> or a <code>Set<\/code>. A plain object isn't iterable, so feed it through <code>Object.entries<\/code> first. Its lookalike <code>for (const k in obj)<\/code> visits property names, inherited ones too, and is best left alone. <code>break<\/code> leaves the loop, <code>continue<\/code> jumps to the next round.<\/p>\n<pre><code>for (let i = 0; i &lt; 3; i++) console.log(i);         // 0 1 2\nfor (const word of [&#x27;a&#x27;, &#x27;b&#x27;]) console.log(word);   // a b\nlet n = 10;\nwhile (n &gt; 1) n = Math.floor(n / 2);                // repeats until the condition fails<\/code><\/pre>\n<p>Loops also walk structures with no index. Following <code>next<\/code> links until the chain ends is <code>for (let node = head; node; node = node.next)<\/code>: the setup picks a start, the step moves along a link, and the condition is the link itself.<\/p>\n<p>The Boilerplate has no loops. Several assignments need them. Assignment 03 walks a tree whose children sit in arrays. 04 works \"until there is none left or the time is up\", which a counting loop doesn't fit. 05 visits every piece of a finished tree.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Loops_and_iteration\" target=\"_blank\" rel=\"noopener\">MDN: Loops and iteration<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for...of\" target=\"_blank\" rel=\"noopener\">MDN: for...of<\/a><\/li><\/ul>","from":"03","usedIn":["03"]},{"id":"js-optional-chaining","title":"Optional chaining <code>?.<\/code> and <code>??<\/code>","plain":"Optional chaining ?. and ??","also":["null check","nullish coalescing","safe navigation","elvis operator","default value","??=","undefined property"],"html":"<p>A property read on <code>undefined<\/code> or <code>null<\/code> throws a TypeError. <code>a?.b<\/code> reads <code>b<\/code> only when <code>a<\/code> is neither; otherwise it gives <code>undefined<\/code> and skips the rest of the chain. It comes in three forms: <code>a?.b<\/code>, <code>a?.[key]<\/code> and <code>f?.()<\/code>. <code>a ?? b<\/code> gives <code>b<\/code> only when <code>a<\/code> is <code>null<\/code> or <code>undefined<\/code>, which differs from <code>a || b<\/code>, where <code>0<\/code> and the empty string fall through to <code>b<\/code> too. <code>a ??= b<\/code> assigns only if <code>a<\/code> is null or undefined.<\/p>\n<pre><code>const user = { profile: null };\nuser.profile?.name;               // undefined, no error\nuser.profile?.name ?? &#x27;anon&#x27;;     // &#x27;anon&#x27;\n\nconst score = 0;\nscore || 10;                      // 10, probably not what you meant\nscore ?? 10;                      // 0<\/code><\/pre>\n<p>Trees and linked structures have missing links. At the end of the work there is no next fiber (04), and from 06 on, when the library compares each render with the one before, the first render has nothing to compare with. A chain of lookups that can fall off the end is where <code>?.<\/code> pays off, and <code>??<\/code> supplies the value to use when it does.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining\" target=\"_blank\" rel=\"noopener\">MDN: Optional chaining<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Nullish_coalescing\" target=\"_blank\" rel=\"noopener\">MDN: Nullish coalescing<\/a><\/li><\/ul>","from":"04","usedIn":["04","06"]},{"id":"js-maps-sets","title":"<code>Map<\/code> and <code>Set<\/code>","plain":"Map and Set","also":["dictionary","hash map","hash table","unique values","lookup by key","Map.get","Set.has","groupBy"],"html":"<p>Assignment 07 has to find children by key rather than by where they stand, in lists that can be long. A plain object works as a lookup table when the keys are strings, with two catches. It starts out with inherited names (<code>&#x27;constructor&#x27; in {}<\/code> is true), and it turns every key into a string, so <code>1<\/code> and <code>&#x27;1&#x27;<\/code> land on the same entry. <code>Map<\/code> has neither problem. Any value can be a key, keys compare like <code>===<\/code> (except that <code>NaN<\/code> equals <code>NaN<\/code>, and objects match by identity), insertion order is remembered, and there is a <code>size<\/code>. <code>Set<\/code> does the same for lone values and stores each one once.<\/p>\n<pre><code>const seen = new Map();\nseen.set(&#x27;a&#x27;, 1).set(&#x27;b&#x27;, 2);\nseen.get(&#x27;a&#x27;);                    // 1\nseen.get(&#x27;z&#x27;);                    // undefined\nseen.has(&#x27;b&#x27;);                    // true\nseen.delete(&#x27;b&#x27;);\nfor (const [key, value] of seen) console.log(key, value);   // a 1\n\nconst ids = new Set([&#x27;a&#x27;, &#x27;b&#x27;, &#x27;a&#x27;]);\nids.size;                         // 2\nids.has(&#x27;a&#x27;);                     // true<\/code><\/pre>\n<p>A lookup by key doesn't scan. It costs about the same whatever the number of entries, while searching an array takes longer as the array grows.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map\" target=\"_blank\" rel=\"noopener\">MDN: Map<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Set\" target=\"_blank\" rel=\"noopener\">MDN: Set<\/a><\/li><\/ul>","from":"07","usedIn":["07","08"]},{"id":"js-string-methods","title":"String methods: <code>startsWith<\/code>, <code>slice<\/code>, <code>toLowerCase<\/code>","plain":"String methods: startsWith, slice, toLowerCase","also":["substring","template literal","string","trim","split","uppercase","lowercase","prefix","case"],"html":"<p>Strings start to carry meaning in assignment 02: a prop's name says whether it is an event handler, and the DOM spells the event's name another way. The page gives the rules; these methods are the usual tools for applying them.<\/p>\n<p>Strings are immutable. Every method returns a new string and leaves the original alone. Indexes start at 0, and <code>s.length<\/code> counts UTF-16 units, so an emoji counts as two.<\/p>\n<pre><code>const file = &#x27;Report.Final.PDF&#x27;;\nfile.startsWith(&#x27;Rep&#x27;);                    // true, and case sensitive\nfile.toLowerCase();                        // &#x27;report.final.pdf&#x27;\nfile.slice(7);                             // &#x27;Final.PDF&#x27;, from index 7 on\nfile.slice(0, 6);                          // &#x27;Report&#x27;: the end index is excluded\nfile.slice(-3);                            // &#x27;PDF&#x27;: a negative index counts from the end\nfile.toLowerCase().endsWith(&#x27;.pdf&#x27;);       // true\nconst msg = `${3} items`;                  // a template literal: backticks with ${} holes<\/code><\/pre>\n<p>The older <code>substring<\/code> treats negative indexes as 0 and swaps its arguments when they come in the wrong order, which is why most people reach for <code>slice<\/code>.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String\" target=\"_blank\" rel=\"noopener\">MDN: String<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/startsWith\" target=\"_blank\" rel=\"noopener\">MDN: String.prototype.startsWith()<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/slice\" target=\"_blank\" rel=\"noopener\">MDN: String.prototype.slice()<\/a><\/li><\/ul>","from":"02","usedIn":["02","12"]},{"id":"js-global-state","title":"Module-level state and why <code>state.js<\/code> is an object","plain":"Module-level state and why state.js is an object","also":["global variable","shared state","singleton","live binding","let export","reassign import","mutable module state","Assignment to constant variable"],"html":"<p>A variable declared at the top of a module belongs to that module and lives as long as the program does. Every function in the file can read and change it, so <code>let count = 0<\/code> at the top is the simplest global state there is.<\/p>\n<p>Sharing it with other files is where it gets fiddly. After <code>export let count = 0<\/code>, other modules can read <code>count<\/code> and see its current value, because an import is a live view of the exporter's variable. They can't assign to it. <code>count = 5<\/code> in the importing file throws <code>TypeError: Assignment to constant variable<\/code>. Only the module that declares a variable may reassign it.<\/p>\n<p>That rules out a bare export for a value that several files must replace, such as which piece of work comes next. Export an object and let every file assign to its properties. The binding stays put while the properties change, and each file sees the change.<\/p>\n<pre><code>// counter.js\nexport const counter = { value: 0 };\n\n// a.js\nimport { counter } from &#x27;./counter.js&#x27;;\ncounter.value++;\n\n// b.js\nimport { counter } from &#x27;./counter.js&#x27;;\nconsole.log(counter.value);   // sees the change from a.js<\/code><\/pre>\n<p>The <code>state.js<\/code> file is that object, created in assignment 04, where the Boilerplate gives you the empty <code>export const state = {}<\/code> and the page lists the fields. <code>render.js<\/code> and <code>commit.js<\/code> import it from 04 and 05 on, <code>hooks.js<\/code> from 10, and it picks up more fields as the library grows.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/import\" target=\"_blank\" rel=\"noopener\">MDN: import (live bindings)<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/export\" target=\"_blank\" rel=\"noopener\">MDN: export<\/a><\/li><\/ul>","from":"04","usedIn":["04","05","10"]}]},{"title":"Tools and the checker","intro":"<p>Installs, terminal commands and how the checker behaves, with commands for Windows, macOS and Linux.<\/p>","entries":[{"id":"node-install","title":"Install and check Node.js 26","plain":"Install and check Node.js 26","also":["nodejs","node.js","npm","node version","winget","brew","fnm","nvm","LTS","node --version","command not found"],"html":"<p>Node.js runs JavaScript outside a browser: your library, the harness, every test. This workbook needs version 26 or newer. The checker looks for <code>node<\/code> on your PATH, reads its version and, if that is too old, tells you how to get a newer one.<\/p>\n<pre><code># Windows\nwinget install OpenJS.NodeJS.LTS\n\n# macOS, with Homebrew\nbrew install node\n\n# Linux: distribution packages such as apt&#x27;s nodejs are often older than 26,\n# so use fnm, the route nodejs.org itself suggests\ncurl -o- https://fnm.vercel.app/install | bash\nfnm install 26<\/code><\/pre>\n<p>The download page also has plain installers and binaries if you'd rather use one. Open a new terminal afterwards: one that was already open doesn't see the changed PATH. Then check:<\/p>\n<pre><code>node --version<\/code><\/pre>\n<p>You want <code>v26.<\/code> and two more numbers, or a higher major version. Seeing an older number means another Node sits earlier on your PATH; <code>where node<\/code> on Windows or <code>which -a node<\/code> elsewhere lists them in order. npm comes with Node and matters once, when you run <code>npm install<\/code> inside <code>tools/oracle<\/code> before your first <code>-Fresh<\/code> check.<\/p>\n<p><code>.\\check 01<\/code> already starts <code>node<\/code> on one of your files. Install it first.<\/p>\n<p>Learn more:<\/p>\n<ul><li><a href=\"https://nodejs.org/en/download\" target=\"_blank\" rel=\"noopener\">Node.js: D
