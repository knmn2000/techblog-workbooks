-own-react/#step-iii-concurrent-mode\" target=\"_blank\" rel=\"noopener\">Step III<\/a><\/li><li>MDN: <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/appendChild\" target=\"_blank\" rel=\"noopener\">Node.appendChild<\/a><\/li><li>React documentation: <a href=\"https://react.dev/reference/react-dom/client/createRoot\" target=\"_blank\" rel=\"noopener\">createRoot<\/a>, which is what <code>render<\/code> stands in for<\/li><\/ul>","checking":"<pre><code>.\\check 03                          every test, grouped by requirement\n.\\check 03 -Case 03-R3-three-tags   one test with its full input, the expected dump and yours\n.\\check 03 -Fresh                   seven new random trees, to try your code on scenarios you have not seen\n.\\check 03 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you are sure is wrong<\/code><\/pre>\n<p>A <code>render<\/code> that puts each node in front of the container's first child turns every list around, and fails like this:<\/p>\n<pre><code>  R3  Siblings keep their order and none is dropped ........................    1 / 7   FAILED\n      x 03-R3-three-tags  h1, h2, h3 in a div\n          node[0]: expected (depth=1, label=b, tag=h1, props=&quot;&quot;), got (depth=1, label=b, tag=h3, props=&quot;&quot;) - differs in tag  (in `dump 1`)\n          likely cause: R3 - Siblings keep their order and none is dropped\n          expected values from: React 19.3.1 + react-dom 19.3.1 on jsdom 30.1.3 (tools/oracle)\n          reproduce: py -P tools/run_js.py build/bugs/03/siblings-reversed 03 build/cases/03/03-R3-three-tags.in build/cases/03/03-R3-three-tags.out<\/code><\/pre>\n<p>Requirements build on one another. When several fail, start with the first.<\/p>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Do the smallest tree first, a single element with no children. Then give it one child and see what changes. The child is an element too, so whatever worked on the first one works on the second.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p><code>render<\/code> takes a node to put things under, and for the top element that node is the container. Make the node for the element, call <code>render<\/code> on each child with the new node as the container, then attach the new node to the container you were given. Recursion copes with any depth. Text elements need no special case, since <code>createDom<\/code> already knows what to do with them.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Children go into their parent's node. Hand them the container of your own call and they land beside the parent.<\/li><li>Appending in list order keeps the children's order. Put each node at the front of the container and the list comes out reversed.<\/li><li>Visit every child. Stop after the first, or skip the text elements, and nodes vanish without an error.<\/li><li>Let <code>createDom<\/code> set the props. Do it yourself and <code>id<\/code> and <code>className<\/code> work, but a handler such as <code>onClick<\/code> ends up as a property that nothing listens to.<\/li><li>Every element has an array in <code>element.props.children<\/code>, text elements included.<\/li><li>No need to clear the container or reuse nodes. Each scenario renders once, into an empty one.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>render(element, container):\n    dom = createDom(element)\n    for each child in element.props.children:\n        render(child, dom)\n    container.appendChild(dom)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the last child has children","test":"03-R3-last-is-deep","input":"tree t <div><h1><\/h1><h2><\/h2><section><h3><\/h3><h4><\/h4><\/section><\/div>\nrender t\nflush\ndump","output":"dump 1\nnode 0 a div \"\"\nnode 1 b h1 \"\"\nnode 1 c h2 \"\"\nnode 1 d section \"\"\nnode 2 e h3 \"\"\nnode 2 f h4 \"\"","image":null,"explain":"<p>The depth column carries the structure. <code>h1<\/code>, <code>h2<\/code> and <code>section<\/code> are all at depth 1, siblings under the <code>div<\/code>; <code>h3<\/code> and <code>h4<\/code> at depth 2 sit inside the <code>section<\/code>. An implementation that renders children into the container instead of into their parent prints everything at depth 0, with the <code>div<\/code> last.<\/p>"},{"label":"Example 2","name":"text on both sides of an element","test":"03-R4-text-element-text","input":"tree t <p>hello <b>big<\/b> world<\/p>\nrender t\nflush\ndump","output":"dump 1\nnode 0 a p \"\"\ntext 1 \"hello \"\nnode 1 b b \"\"\ntext 2 \"big\"\ntext 1 \" world\"","image":null,"explain":"<p>The <code>p<\/code> has three children: text, the <code>b<\/code>, more text. The two texts print on separate lines because the <code>b<\/code> is between them, and each keeps the space beside the element, which the quotes make visible. <code>big<\/code> is a level deeper, inside the <code>b<\/code>.<\/p>"},{"label":"Example 3","name":"a click rises through the ancestors","test":"03-R6-bubbling","input":"tree t <div id=\"outer\" onClick=@outer><button id=\"inner\" onClick=@inner><\/button><\/div>\nrender t\nflush\nclick #inner\nlog\nclick #outer\nlog","output":"log inner\nlog outer\nlog outer","image":null,"explain":"<p>The first click lands on the button, so <code>inner<\/code> runs, and then the click goes on to the <code>div<\/code>, where <code>outer<\/code> runs: two lines for one click. The second click is on the <code>div<\/code> itself. The button is no ancestor of the <code>div<\/code>, so only <code>outer<\/code> runs. There is no <code>dump<\/code> in this scenario; it only checks what clicks do.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-ii-the-render-function\" target=\"_blank\" rel=\"noopener\">Pombo's <code>render<\/code><\/a> makes a text node for a <code>TEXT_ELEMENT<\/code> and an ordinary node for anything else, assigns the props, calls itself on every child with the new node as the container, and appends the node to its own container last. Children are therefore attached to a node before the node is attached to its parent. Do it the other way round, parent first and filled afterwards, and you get the same page. That passes too.<\/p>\n<p>The post assigns props with a loop of its own: every prop except <code>children<\/code> becomes a property (<code>key<\/code> included), and this loop is where the two versions differ. A handler such as <code>onClick<\/code> ends up as a property of that name, which no browser looks at, so no handler works in the post's Step II until the listeners arrive in Step VI. Here the props go through your <code>updateDom<\/code>, clicks work from the first render, and R6 tests for it. The post's Step III then says that a recursion like this one keeps the main thread busy until the tree is done, which is why 04 takes it apart.<\/p>\n<p>Neither the post nor this page clears what is already in the container. React empties it on a first render, but the tests render into an empty container and the difference stays hidden. React's <code>root.render<\/code> also finishes later than your <code>render<\/code> does. The row on mounting in <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> says that your <code>render<\/code> plays the part of <code>root.render<\/code>.<\/p>"},"need":{"new":[{"id":"js-loops","title":"Loops: for, for...of and while","note":"an element can have any number of children, and every one needs a visit.","group":"JavaScript","from":"03"},{"id":"dom-tree-editing","title":"appendChild, insertBefore and removeChild","note":"appending puts a node into its parent's list of children, and the order of the appends becomes the order on the page.","group":"The DOM","from":"03"},{"id":"react-tree","title":"Trees of elements, and the \"virtual DOM\"","note":"the children of an element are elements too, so a tree is elements inside elements, and handling it means doing one thing to the root and then the same thing to each child.","group":"React and the ideas in the posts","from":"03"}],"earlier":[{"id":"js-modules","title":"ES modules: import and export","note":"the new part is importing a file of your own, by a relative path that ends in <code>.js<\/code>.","group":"JavaScript","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","note":"","from":"01"},{"id":"js-objects","title":"Objects, spread and destructuring","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"","from":"01"}]}},{"id":"04","num":"4","title":"Work in units: fibers","difficulty":"Medium","tests":47,"problem":"problems/04-fibers.md","entry":"solutions/assignments/assignment_04_fibers.js","files":[{"path":"solutions/assignments/assignment_04_fibers.js","role":"entry","purpose":null,"job":"Run `runScenarioFile` with your `Didact` object. The scenario renders a tree, runs idle periods of a size it picks, and dumps the container.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 04 as `python -P tools/run_js.py\n//   solutions 04 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 04` (`./check.sh 04` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Run `runScenarioFile` with y /).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Shared bookkeeping in one object: what to work on next, and the tree under\n//   construction. It has to be an object, because an ES module can't share a variable for\n//   other modules to reassign. Later, assignments 06 and 10 add to this file.\n//\n// Your job:\n//   Create one `state` object to hold the next unit of work and the root of the tree being\n//   built. The Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nexport const state = {\n  // TODO: the fields the work loop shares; see \"The modules\" on the page.\n};\n"},{"path":"solutions/src/didact/render.js","role":"new","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units.","job":"Build `render`, `workLoop` and `performUnitOfWork`. `render` only schedules the work; each idle period then runs fibers, one per unit of work, until `timeRemaining()` falls below 1.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   `render` and the work loop behind it: one fiber per unit of work, and the browser can\n//   interrupt between units. Later, assignments 05, 06, 09 and 10 add to this file.\n//\n// Your job:\n// ion workLoop(deadline) {\n  // TODO: see \"Reading the clock\" and Requirements R3 and R5 on the page.\n  throw new Error('not implemented: workLoop');\n}\n\nrequestIdleCallback(workLoop); // the browser (here: the test harness) calls workLoop whenever it is idle\n\nfunction performUnitOfWork(fiber) {\n  // TODO: see \"Units of work\" and Requirements R2, R4 and R6 on the page.\n  throw new Error('not implemented: performUnitOfWork');\n}\n"},{"path":"solutions/src/didact/reconcile.js","role":"new","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render.","job":"Give every element a fiber of its own in `reconcileChildren(wipFiber, elements)`, and link the fibers with `child`, `sibling` and `parent`.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Decides which fibers a parent's children become. At first that means a fresh fiber for\n//   every child, then a comparison with the previous render. Later, assignments 06, 07 and\n//   08 add to this file.\n//\n// Your job:\n//   Give every element a fiber of its own in `reconcileChildren(wipFiber, elements)`, and\n//   link the fibers with `child`, `sibling` and `parent`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Decides which fibers a parent's children become. At first that means a fresh fiber for\n//   every child, then a comparison with the previous render. Later, assignments 06, 07 and\n//   08 add to this file.\n//\n// Your job:\n//   Give every element a fiber of its own in `reconcileChildren(wipFiber, elements)`, and\n//   link the fibers with `child`, `sibling` and `parent`. The Boilerplate gives you the\n//   declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nexport function reconcileChildren(wipFiber, elements) {\n  // TODO: see \"The modules\" and \"Units of work\" on the page.\n  throw new Error('not implemented: reconcileChildren');\n}\n"},{"path":"solutions/src/didact/index.js","role":"new","purpose":"What an app imports: one `Didact` object carrying `createElement` and `render`, with the hooks joining it as you write them.","job":"Export a `Didact` object carrying `createElement` and `render`.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   What an app imports: one `Didact` object carrying `createElement` and `render`, with\n//   the hooks joining it as you write them. Later, assignments 10 and 11 add to this file.\n//\n// Your job:\n//   Export a `Didact` object carrying `createElement` and `render`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   What an app imports: one `Didact` object carrying `createElement` and `render`, with\n//   the hooks joining it as you write them. Later, assignments 10 and 11 add to this file.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations. You fill in the TODOs\n//   in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { createElement } from './createElement.js'; // createElement (assignment 01): what an app calls to describe its UI\nimport { render } from './render.js'; // render (this assignment): what an app calls to draw it\n\nconst Didact = { createElement, render };\n\nexport default Didact;\nexport { createElement, render };\n"}],"buildsOn":[{"path":"solutions/src/didact/createElement.js","owner":"01","purpose":"What JSX compiles to: a plain `{ type, props }` object, with the children inside `props`."},{"path":"solutions/src/didact/dom.js","owner":"02","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-optional-chaining\">optional chaining<\/a> (optional)","<a href=\"#primer/js-global-state\">module-level state<\/a>"],"text":["optional chaining (optional)","module-level state"]},{"label":"Library","items":["<a href=\"#primer/dom-idle-callback\">requestIdleCallback and timeRemaining()<\/a>","<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["requestIdleCallback and timeRemaining()","the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/react-elements\">elements<\/a>","<a href=\"#primer/react-fibers\">fibers<\/a>","<a href=\"#primer/react-work-loop\">units of work and the work loop<\/a>"],"text":["elements","fibers","units of work and the work loop"]}],"body":"<div class=\"d-problem flow\"><p>Write the half of a renderer that can stop partway. <code>render<\/code> queues a job and returns. When the browser is idle it calls <code>workLoop<\/code>, which builds the tree one fiber at a time and gives the thread back once time runs out. In the tests a scenario plays the browser: it sets how many units of work each idle period may do, and looks at the container before and after.<\/p>\n<h3>The modules<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>File<\/th><th>Export<\/th><th>What it is<\/th><\/tr><\/thead><tbody><tr><td><code>src/didact/state.js<\/code><\/td><td><code>state<\/code><\/td><td>One shared object holding the fiber to work on next and the root of the tree under construction. The field names are yours.<\/td><\/tr><tr><td><code>src/didact/render.js<\/code><\/td><td><code>render(element, container)<\/code><\/td><td>Queues the job. Does no work and touches nothing.<\/td><\/tr><tr><td><code>src/didact/render.js<\/code><\/td><td><code>workLoop(deadline)<\/code><\/td><td>The idle callback. Register it when the module loads, and again at the end of every call.<\/td><\/tr><tr><td><code>src/didact/render.js<\/code><\/td><td><code>performUnitOfWork(fiber)<\/code><\/td><td>Does one fiber's work and returns the fiber to do next, or nothing after the last one.<\/td><\/tr><tr><td><code>src/didact/reconcile.js<\/code><\/td><td><code>reconcileChildren(wipFiber, elements)<\/code><\/td><td>Gives <code>wipFiber<\/code> one new child fiber per element, linked in order.<\/td><\/tr><tr><td><code>src/didact/index.js<\/code><\/td><td>default <code>Didact<\/code><\/td><td><code>{ createElement, render }<\/code>, the object the entry program hands to the harness. Exporting the same two names as named exports too is fine.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A fiber is a plain object with <code>type<\/code>, <code>props<\/code>, <code>dom<\/code>, <code>parent<\/code>, <code>child<\/code> and <code>sibling<\/code>. A link that goes nowhere (the root's <code>parent<\/code> and <code>sibling<\/code>, a leaf's <code>child<\/code>) can be <code>null<\/code> or <code>undefined<\/code>; nothing tells them apart. The root fiber has no type. Its <code>dom<\/code> is the container and its <code>props.children<\/code> is <code>[element]<\/code>. Elements are <code>{ type, props }<\/code> with <code>props.children<\/code> always an array, and a text piece is <code>{ type: &quot;TEXT_ELEMENT&quot;, props: { nodeValue, children: [] } }<\/code>. The scenarios build their elements with the harness's own <code>h<\/code>, so your <code>createElement<\/code> is not involved. For a DOM node, call <code>createDom<\/code> from <code>dom.js<\/code>. It takes a fiber without complaint, since a fiber has a <code>type<\/code> and <code>props<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>Each test runs <code>node assignments/assignment_04_fibers.js &lt;input-file&gt; &lt;output-file&gt;<\/code>. The file is short. It imports <code>../harness/env.js<\/code> first, which gives you <code>document<\/code> and <code>requestIdleCallback<\/code> before <code>render.js<\/code> loads. Then come your <code>Didact<\/code> from <code>../src/didact/index.js<\/code> and <code>runScenarioFile<\/code> from <code>../harness/scenario.js<\/code>, and a last line, <code>await runScenarioFile(process.argv[2], process.argv[3], Didact)<\/code>, which reads the scenario, runs it against your library and writes the output. The Boilerplate ships it complete. Starting from scratch, you write those lines yourself.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Names a tree for later. No output.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td><code>Didact.render(element, container)<\/code> on the named tree, with the page's <code>#root<\/code> div as the container. No output.<\/td><\/tr><tr><td><code>idle &lt;k&gt;<\/code><\/td><td>One idle period with budget <code>k<\/code>, a whole number from 1 up or the word <code>inf<\/code>. Prints one line.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Idle periods with an unlimited budget, repeated until one never calls <code>timeRemaining()<\/code>. No output.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints what the container holds.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A tree is one line of HTML-like text, like <code>&lt;div id=a className=&quot;big one&quot;&gt;text &lt;b&gt;bold&lt;/b&gt;&lt;/div&gt;<\/code>. Attribute values are strings and a bare name means <code>true<\/code>. Text keeps its inner spaces; whitespace between two tags is dropped. <code>input<\/code>, <code>br<\/code> and <code>hr<\/code> have no closing tag. Each piece of text becomes a text element, and each thing in angle brackets an element.<\/p>\n<p>One idle period goes like this:<\/p>\n<ul><li>Every callback registered when the period starts is called with the same deadline, <code>{ didTimeout: false, timeRemaining() }<\/code>. A callback registered during the period waits for the next one.<\/li><li><code>timeRemaining()<\/code> counts the calls made during the period. Calls before number <code>k<\/code> return 1, and call <code>k<\/code> and every later call return 0. With <code>inf<\/code> it returns 1 every time.<\/li><li>The period prints how many calls it counted.<\/li><\/ul>\n<h3>Output<\/h3>\n<pre><code>idle &lt;n&gt;\ndump &lt;i&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;<\/code><\/pre>\n<p><code>idle &lt;n&gt;<\/code> is how many times your code called <code>timeRemaining()<\/code> during that period. <code>dump &lt;i&gt;<\/code> numbers the dumps of the run from 1, and the lines under it describe the container's children in document order, indented by depth from 0. The container itself is not listed. An empty container prints the <code>dump<\/code> line and nothing else.<\/p>\n<p>A <code>node<\/code> line carries the element's tag in lower case and a label. The first element a dump shows is <code>a<\/code>, then <code>b<\/code>, on through <code>z<\/code>, then <code>aa<\/code>, <code>ab<\/code>. Between the quotes sit the props that differ from their defaults, written <code>name=value<\/code>, alphabetical, one space apart. Only these five can appear:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Prop<\/th><th>Shown when<\/th><\/tr><\/thead><tbody><tr><td><code>className<\/code>, <code>id<\/code>, <code>title<\/code><\/td><td>the value is not empty<\/td><\/tr><tr><td><code>disabled<\/code><\/td><td>it is true, on a <code>button<\/code>, <code>input<\/code> or <code>textarea<\/code>; printed <code>disabled=true<\/code><\/td><\/tr><tr><td><code>value<\/code><\/td><td>the value is not empty, on an <code>input<\/code> or <code>textarea<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>A value containing whitespace, a <code>&quot;<\/code> or a <code>%<\/code> goes through <code>encodeURIComponent<\/code>, so <code>big one<\/code> prints as <code>big%20one<\/code>. An element with nothing to show gets <code>&quot;&quot;<\/code>. A <code>text<\/code> line encodes <code>%<\/code>, <code>&quot;<\/code> and line breaks and leaves spaces alone. Text nodes that touch print as one line, and an empty text node prints nothing.<\/p>\n<h3>Units of work<\/h3>\n<p>A unit of work is one fiber. A render has these:<\/p>\n<ul><li>the root fiber, for the container,<\/li><li>one for every element in the tree,<\/li><li>one for every text node.<\/li><\/ul>\n<p>With <code>E<\/code> elements and <code>T<\/code> text pieces, a tree takes <code>1 + E + T<\/code> units. <code>&lt;p&gt;hello&lt;/p&gt;<\/code> takes 3: the root, <code>p<\/code> and the text. The root counts even though it has no node to make, and a text piece counts even though it has no children.<\/p>\n<p>Doing a unit takes three steps. One: give the fiber its node with <code>createDom<\/code>, unless it already has one (the root does; its node is the container). Two: make its children, a fiber for each element in <code>fiber.props.children<\/code>, in order. Each points back with <code>parent<\/code>, <code>child<\/code> goes to the first, <code>sibling<\/code> chains the rest, and none of them holds a node yet. Three: choose the fiber to do next.<\/p>\n<p>The next fiber is the first match in this list:<\/p>\n<ol><li>the fiber's <code>child<\/code><\/li><li>its <code>sibling<\/code><\/li><li>the <code>sibling<\/code> of its parent (the post calls it the uncle), and if the parent has none, the sibling of the grandparent, and so on up the <code>parent<\/code> chain<\/li><li>nothing, once the climb has passed the root: the render is finished.<\/li><\/ol>\n<p>Take <code>div &gt; (h1 &gt; (p, a), h2)<\/code>. The units go root, <code>div<\/code>, <code>h1<\/code>, <code>p<\/code>, <code>a<\/code>, <code>h2<\/code>. After <code>a<\/code> there is no child and no sibling: the walk climbs to <code>h1<\/code> and takes its sibling <code>h2<\/code>.<\/p>\n<h3>Reading the clock<\/h3>\n<p><code>workLoop<\/code> does one unit, calls <code>timeRemaining()<\/code> once, and stops if the value is below 1; otherwise it does another unit. With budget <code>k<\/code> that means <code>k<\/code> units when at least <code>k<\/code> are waiting, and all of them when fewer are. The period prints its number of reads, which makes <code>idle k<\/code> print the smaller of <code>k<\/code> and the units left.<\/p>\n<p>The read comes after every unit, the last unit of the tree included, and never when there is no unit to do. At the end of every call the loop registers itself for the next period, whether or not it did anything. Forget that and it stops being called; a <code>render<\/code> that arrives after a quiet period never runs.<\/p>\n<h3>What may be on the page<\/h3>\n<p><code>render<\/code> leaves the container alone and runs no unit. When a unit attaches its node to the page is left open here. Attaching in every unit, as the post does, passes, and so does attaching the whole tree after the last unit, which is what 05 asks for. A scenario can therefore look at the container at two moments only: before the first period has run, when it must be empty, and after <code>flush<\/code>, when it must hold the whole tree in order. A scenario calls <code>render<\/code> at most once.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>render<\/code> only schedules the work: right after it the container is still empty and no unit has run.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>There is one unit of work per fiber: the root fiber, every element and every text node, and nothing else.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The loop reads <code>timeRemaining()<\/code> once after each unit, so <code>idle k<\/code> prints the smaller of <code>k<\/code> and the units left.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>The walk reaches every fiber, depth first: child, then sibling, then the parent's sibling and so on up. After <code>flush<\/code> the container holds the whole tree in order.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>With no work left, a period reads nothing and prints 0, before any <code>render<\/code> and after the tree is done, whatever the budget.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Every node carries the props and the text of its element.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Whole scenarios: the empty page, uneven periods, the finished page.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Trees run from 2 to 60 units and hold plain elements and text only: no handlers, components or keys. A scenario renders at most once. Budgets are whole numbers from 1 up, or <code>inf<\/code>; <code>idle 0<\/code> never appears. A <code>dump<\/code> comes only right after <code>render<\/code> or after <code>flush<\/code>. The 47 tests are examples of each requirement on hand-picked trees, three whole scenarios and six seeded random ones, three on period sizes and three on whole trees. <code>-Fresh<\/code> replaces the random ones. Each test gets 10 seconds, and a correct solution takes a few milliseconds.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/state.js","text":"// ---- Assignment 04: the shared state ----\n// Everything the work loop shares lives on this one object: a module cannot reassign a variable\n// that another module imported, but any module can change a property of an object.\nexport const state = {\n  nextUnitOfWork: null, // the fiber the work loop does next; null when there is no work\n  wipRoot: null, // the root of the tree being built (work in progress)\n};\n"},{"path":"src/didact/render.js","text":"// ---- Assignment 04: the work loop ----\n// render() only schedules work. Whenever the browser is idle, workLoop() builds the tree of\n// fibers one unit of work at a time, so it can stop when the browser has something else to do.\nimport { createDom } from './dom.js';\nimport { reconcileChildren } from './reconcile.js';\nimport { state } from './state.js';\n\n// ---- Assignment 04: schedule the work ----\nexport function render(element, container) {\n  state.wipRoot = { dom: container, props: { children: [element] } };\n  state.nextUnitOfWork = state.wipRoot;\n}\n\n// ---- Assignment 04: the loop ----\nfunction workLoop(deadline) {\n  try {\n    let shouldYield = false;\n    while (state.nextUnitOfWork && !shouldYield) {\n      state.nextUnitOfWork = performUnitOfWork(state.nextUnitOfWork);\n      shouldYield = deadline.timeRemaining() < 1;\n    }\n  } finally {\n    requestIdleCallback(workLoop); // even after an error, or the loop would be dead for good\n  }\n}\n\n// ---- Assignment 04: one unit of work ----\n// Makes the fiber's node, gives the fiber its children, and returns the fiber to do next.\nfunction performUnitOfWork(fiber) {\n  if (!fiber.dom) fiber.dom = createDom(fiber);\n  if (fiber.parent) fiber.parent.dom.appendChild(fiber.dom);\n  reconcileChildren(fiber, fiber.props.children);\n  return nextFiber(fiber);\n}\n\n// ---- Assignment 04: which fiber is next ----\n// Depth first: the child, else the sibling, else the nearest ancestor's sibling.\nfunction nextFiber(fiber) {\n  if (fiber.child) return fiber.child;\n  for (let next = fiber; next; next = next.parent) {\n    if (next.sibling) return next.sibling;\n  }\n  return null;\n}\n\nrequestIdleCallback(workLoop);\n"},{"path":"src/didact/reconcile.js","text":"// ---- Assignment 04: a fiber for every child ----\n// Turns the elements under a fiber into its child fibers, linked by child and sibling.\nexport function reconcileChildren(wipFiber, elements) {\n  const fibers = elements.map((element) => ({\n    type: element.type,\n    props: element.props,\n    dom: null,\n    parent: wipFiber,\n  }));\n  wipFiber.child = fibers[0] ?? null;\n  fibers.forEach((fiber, index) => {\n    fiber.sibling = fibers[index + 1] ?? null;\n  });\n}\n"},{"path":"src/didact/index.js","text":"// ---- Assignment 04: the Didact object ----\n// What an app imports: the library's public face.\nimport { createElement } from './createElement.js';\nimport { render } from './render.js';\n\nconst Didact = { createElement, render };\n\nexport default Didact;\nexport { createElement, render };\n"},{"path":"assignments/assignment_04_fibers.js","text":"// Assignment 04: the checker runs this program as `node assignments/assignment_04_fibers.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/createElement.js","src/didact/dom.js"],"proof":{"passed":47,"total":47,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>You can skip the post and still pass. If you do read Pombo, two parts pay off. <a href=\"https://pomb.us/build-your-own-react/#step-iii-concurrent-mode\" target=\"_blank\" rel=\"noopener\">Step III: Concurrent Mode<\/a> says why one long render hurts and brings in <code>requestIdleCallback<\/code>; stop where the text announces the first unit of work and a <code>performUnitOfWork<\/code> that returns the next one, because code frames follow. <a href=\"https://pomb.us/build-your-own-react/#step-iv-fibers\" target=\"_blank\" rel=\"noopener\">Step IV: Fibers<\/a> has the picture of the fiber tree and the paragraphs on finding the next fiber: child, sibling, the parent's sibling, then further up until the root. Stop before the code frames that come after them.<\/p>","readTitle":"Read in the blog first","context":"<p>Assignment 03 drew a whole tree in one recursive call, and a recursion can't be paused halfway. Here the same job turns into a loop over small pieces. <code>renderSync.js<\/code> stays on the shelf. The new library starts with four files, <code>state.js<\/code>, <code>render.js<\/code>, <code>reconcile.js<\/code> and <code>index.js<\/code>, and takes only <code>createDom<\/code> from <code>dom.js<\/code>.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-iii-concurrent-mode\" target=\"_blank\" rel=\"noopener\">Step III: Concurrent Mode<\/a> and <a href=\"https://pomb.us/build-your-own-react/#step-iv-fibers\" target=\"_blank\" rel=\"noopener\">Step IV: Fibers<\/a><\/li><li>MDN: <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/requestIdleCallback\" target=\"_blank\" rel=\"noopener\">requestIdleCallback<\/a> and <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/IdleDeadline/timeRemaining\" target=\"_blank\" rel=\"noopener\">IdleDeadline.timeRemaining<\/a><\/li><li>Andrew Clark, <a href=\"https://github.com/acdlite/react-fiber-architecture\" target=\"_blank\" rel=\"noopener\">React Fiber Architecture<\/a><\/li><li><code>harness/env.js<\/code>, the file that installs the <code>requestIdleCallback<\/code> the tests drive<\/li><\/ul>","checking":"<pre><code>.\\check 04                         every test, grouped by requirement\n.\\check 04 -Case 04-R3-mixed-budgets   one test: its input, the expected lines, and what you printed\n.\\check 04 -Fresh                  six new random scenarios, for a run on trees you have not seen\n.\\check 04 -Dispute &lt;id&gt; &quot;why&quot;     set a test aside that you are sure is wrong<\/code><\/pre>\n<p>With a walk that never climbs past a fiber without a sibling, the report looks like this:<\/p>\n<pre><code>  R2  one unit of work per fiber: the root fiber, every element and eve... .    4 / 8   FAILED\n      x 04-R2-units-post-shape  div &gt; (h1 &gt; (p, a), h2): six units without text\n          idle[0]: expected (units=6), got (units=5) - differs in units\n          likely cause: R2 - one unit of work per fiber: the root fiber, every element and every text node, and nothing else\n          expected values from: React 19.3.1 on jsdom 30.1.3 for the dumps; the unit formula (1 root fiber + elements + text nodes) for the idle lines\n          reproduce: py -P tools/run_js.py solutions 04 build/cases/04/04-R2-units-post-shape.in build/cases/04/04-R2-units-post-shape.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Count first, page later. Have <code>render<\/code> store a root fiber, write the loop around a <code>performUnitOfWork<\/code> that does nothing except return the next fiber, and run <code>render a<\/code>, <code>idle inf<\/code> on the tree <code>&lt;br&gt;<\/code>. It has to print <code>idle 2<\/code>. The <code>idle<\/code> lines depend on the loop alone, which lets you check them while everything else is still a stub.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Keep the next fiber to do in the shared state. <code>render<\/code> sets it to a fresh root fiber and returns. The loop takes that fiber, performs it, stores what comes back, reads the clock, and goes round again while a fiber is stored and the clock allows. To perform a fiber, make its node, ask <code>reconcileChildren<\/code> for its children and walk to the next fiber: the child first, then the sibling, then up through the parents until one has a sibling. Register the loop once when <code>render.js<\/code> loads, and again at the end of each call.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Count the root fiber as a unit like the rest. Its node is already there, the container, so don't make it another.<\/li><li>Text pieces are fibers too. An empty <code>props.children<\/code> is no reason to skip one.<\/li><li>One read per unit, taken after it. Two units per read, a read before the unit, or a read in a call that had no work all change what <code>idle<\/code> prints.<\/li><li>End every call with <code>requestIdleCallback(workLoop)<\/code>, the ones that found nothing to do included.<\/li><li>No child and no sibling does not mean the end. Climb through <code>parent<\/code> to the first fiber that has a sibling; the walk is over only when the climb runs out.<\/li><li><code>render<\/code> runs nothing, not even the root's unit. A <code>dump<\/code> straight after it has to be empty.<\/li><li>Assign to <code>state.nextUnitOfWork<\/code>. A module may not reassign an imported variable.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>render(element, container):\n    root = fiber with dom = container and props.children = [element]\n    state.wipRoot = root\n    state.nextUnitOfWork = root\n\nworkLoop(deadline):\n    while state.nextUnitOfWork exists:\n        state.nextUnitOfWork = performUnitOfWork(state.nextUnitOfWork)\n        if deadline.timeRemaining() &lt; 1: leave the while loop\n    requestIdleCallback(workLoop)\n\nrequestIdleCallback(workLoop)          once, at the bottom of the module\n\nperformUnitOfWork(fiber):\n    fiber.dom = createDom(fiber) if it has none\n    attach it to fiber.parent.dom, if there is a parent (optional in this assignment)\n    reconcileChildren(fiber, fiber.props.children)\n    return the next fiber, or nothing\n\nnext fiber:\n    if fiber has a child: that child\n    walk f from fiber up through parent: the first f with a sibling gives that sibling\n    otherwise nothing<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"six units without any text","test":"04-R2-units-post-shape","input":"tree a <div><h1><p><\/p><a><\/a><\/h1><h2><\/h2><\/div>\nrender a\nidle inf\nidle inf","output":"idle 6\nidle 0","image":null,"explain":"<p>Six fibers: the root, <code>div<\/code>, <code>h1<\/code>, <code>p<\/code>, <code>a<\/code> and <code>h2<\/code>. The unlimited period reads the clock after each of them, which makes 6, and the second period finds nothing and reads nothing. A first line saying 5 means the root went uncounted, or the walk stopped at <code>a<\/code> instead of climbing to <code>h2<\/code>.<\/p>"},{"label":"Example 2","name":"periods of three","test":"04-R3-budget-3-post-text","input":"tree a <div><h1>title<p>para<\/p><a>link<\/a><\/h1><h2>sub<\/h2><\/div>\nrender a\nidle 3\nidle 3\nidle 3\nidle 3\nidle 3","output":"idle 3\nidle 3\nidle 3\nidle 1\nidle 0","image":null,"explain":"<p>5 elements, 4 text pieces and the root make 10 units, and three periods use up 9 of them. The fourth does the last unit, reads the clock once and finds nothing more. The fifth has nothing from the start and prints 0.<\/p>"},{"label":"Example 3","name":"stop, then flush","test":"04-E2E-resume-after-periods","input":"tree a <div><div><div><p>a<\/p><p>b<\/p><\/div><p>c<\/p><\/div><p>d<\/p><\/div>\nrender a\nidle 4\nidle 1\nflush\ndump","output":"idle 4\nidle 1\ndump 1\nnode 0 a div \"\"\nnode 1 b div \"\"\nnode 2 c div \"\"\nnode 3 d p \"\"\ntext 4 \"a\"\nnode 3 e p \"\"\ntext 4 \"b\"\nnode 2 f p \"\"\ntext 3 \"c\"\nnode 1 g p \"\"\ntext 2 \"d\"","image":null,"explain":"<p>Twelve units in all. After the two periods five are done, and the next fiber waits in <code>state<\/code> while the browser has the thread. <code>flush<\/code> has to pick the walk up where it stopped. This is the first <code>dump<\/code> of the scenario, so it is number 1.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-iv-fibers\" target=\"_blank\" rel=\"noopener\">Pombo's Step IV<\/a> builds this same machine out of <code>render<\/code>, <code>workLoop<\/code>, <code>performUnitOfWork<\/code> and <code>createDom<\/code>. <code>render<\/code> points <code>nextUnitOfWork<\/code> at a root fiber whose <code>dom<\/code> is the container. <code>performUnitOfWork<\/code> creates the node, makes one fiber per child, and returns the child, the sibling or the uncle. The post's <code>workLoop(deadline)<\/code> carries a <code>shouldYield<\/code> flag and reads <code>timeRemaining()<\/code> after each unit, the last one included, which is what the tests expect. Its unit also attaches its node to <code>fiber.parent.dom<\/code> in the same step, and the page fills up while the work runs. That is allowed here, and 05 is where it changes (<a href=\"https://pomb.us/build-your-own-react/#step-v-render-and-commit-phases\" target=\"_blank\" rel=\"noopener\">Step V<\/a>).<\/p>\n<p>The post keeps <code>nextUnitOfWork<\/code> as a variable in its one file. An ES module cannot reassign a variable it imported, so here it lives in <code>state<\/code>, beside <code>wipRoot<\/code>, which the post brings in only at Step V. In the post the loop over a fiber's children sits inside <code>performUnitOfWork<\/code> until Step VI pulls it out as <code>reconcileChildren<\/code>. That function exists from the start here, to give 06 something to replace. Nothing in the post counts units. The harness counts your <code>timeRemaining()<\/code> reads instead, and they equal the units because the loop reads once per unit.<\/p>\n<p>In the post, <code>requestIdleCallback(workLoop)<\/code> is the loop's last statement, so an exception inside a unit means it is never scheduled again. Registering it from a <code>finally<\/code> block keeps the loop alive after an error. No test throws from a unit, and 06 names a bug in the post that ends the loop this way. The post also says React no longer uses <code>requestIdleCallback<\/code>. <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> lists what it uses instead and when a render can pause.<\/p>"},"need":{"new":[{"id":"react-fibers","title":"Fibers","note":"the tree you walk. A fiber for every element and text node, one more for the container, tied together with <code>parent<\/code>, <code>child<\/code> and <code>sibling<\/code>. Each fiber is one unit of work.","group":"React and the ideas in the posts","from":"04"},{"id":"react-work-loop","title":"Units of work and the work loop","note":"do a unit, look at the clock, quit when it says time is up.","group":"React and the ideas in the posts","from":"04"},{"id":"dom-idle-callback","title":"<code>requestIdleCallback<\/code> and <code>timeRemaining()<\/code>","note":"the harness has a stand-in for the browser that you drive by hand, and <code>idle<\/code> prints how often your code read the clock.","group":"The DOM","from":"04"},{"id":"js-global-state","title":"Module-level state and why <code>state.js<\/code> is an object","note":"<code>render.js<\/code> and <code>reconcile.js<\/code> have to see the same \"next fiber\".","group":"JavaScript","from":"04"},{"id":"js-optional-chaining","title":"Optional chaining <code>?.<\/code> and <code>??<\/code>","note":"the end of the work is a missing link, and the walk meets one often.","group":"JavaScript","from":"04"}],"earlier":[{"id":"react-elements","title":"Elements, and what JSX turns into","note":"the children array and the <code>TEXT_ELEMENT<\/code> shape from 01 settle how many fibers a tree gets.","group":"React and the ideas in the posts","from":"01"},{"id":"workbook-harness","title":"The harness and scenario files","note":"<code>idle<\/code> and <code>flush<\/code> are new here.","group":"Tools and the checker","from":"01"},{"id":"js-async-await","title":"<code>async<\/code>, <code>await<\/code> and top-level await","note":"","from":"01"},{"id":"js-errors","title":"<code>throw<\/code>, <code>try<\/code>, <code>catch<\/code> and <code>finally<\/code>","note":"","from":"01"},{"id":"js-modules","title":"ES modules: <code>import<\/code> and <code>export<\/code>","note":"","from":"01"},{"id":"js-objects","title":"Objects, spread and destructuring","note":"","from":"01"},{"id":"node-process","title":"<code>process.argv<\/code>, exit codes and <code>node --check<\/code>","note":"","from":"01"}]}},{"id":"05","num":"5","title":"Render phase, then commit","difficulty":"Medium","tests":44,"problem":"problems/05-commit.md","entry":"solutions/assignments/assignment_05_commit.js","files":[{"path":"solutions/assignments/assignment_05_commit.js","role":"entry","purpose":null,"job":"Wire your `Didact` object into `runScenarioFile`; the scenario dumps the container between idle periods.","blank":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 05 as `python -P tools/run_js.py\n//   solutions 05 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 05` (`./check.sh 05` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   Wire your `Didact` object into `runScenarioFile`; the scenario dumps the container\n//   between idle periods.\n//\n// The other files of this assignment:\n//   You also write src/didact/commit.js in this assignment; each one gives its job at the\n//   top.\n//   It adds to src/didact/render.js, which you started earlier: Stop attaching DOM nodes\n//   while units run. Hold the tree under construction in `wipRoot`, and call `commitRoot`\n//   after the last unit.\n//   Earlier files you can use: src/didact/state.js, src/didact/dom.js,\n//   src/didact/reconcile.js and src/didact/index.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as commit from '../src/didact/commit.js'\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n\nfunction main() {\n}\n\nmain();\n","boilerplate":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 05 as `python -P tools/run_js.py\n//   solutions 05 <input-file> <output-file>`. It reads a test input, calls your code and\n//   writes the answer to the output file, and the checker compares that answer with the\n//   expected one. Run `.\\check 05` (`./check.sh 05` on macOS or Linux), or use Run and\n//   Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished. You fill in the TODOs in this\n//   assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/didact/commit.js in this assignment; each one gives its job at the\n//   top.\n//   It adds to src/didact/render.js, which you started earlier: Stop attaching DOM nodes\n//   while units run. Hold the tree under construction in `wipRoot`, and call `commitRoot`\n//   after the last unit.\n//   Earlier files you can use: src/didact/state.js, src/didact/dom.js,\n//   src/didact/reconcile.js and src/didact/index.js.\n//   Import them as ES modules, by a relative path with the .js ending, for example:\n//       import * as commit from '../src/didact/commit.js'\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"},{"path":"solutions/src/didact/commit.js","role":"new","purpose":"Applies a finished fiber tree to the DOM in a single pass, which keeps half a render from ever showing.","job":"Define `commitRoot` and `commitWork`. Once the last unit is done, they append the finished tree to the container in a single pass.","blank":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Applies a finished fiber tree to the DOM in a single pass, which keeps half a render\n//   from ever showing. Later, assignments 06, 08, 09 and 11 add to this file.\n//\n// Your job:\n//   Define `commitRoot` and `commitWork`. Once the last unit is done, they append the\n//   finished tree to the container in a single pass.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 05: Render phase, then commit\n// Problem: problems/05-commit.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Applies a finished fiber tree to the DOM in a single pass, which keeps half a render\n//   from ever showing. Later, assignments 06, 08, 09 and 11 add to this file.\n//\n// Your job:\n//   Define `commitRoot` and `commitWork`. Once the last unit is done, they append the\n//   finished tree to the container in a single pass. The Boilerplate gives you the\n//   declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\nimport { state } from './state.js'; // state: wipRoot, the finished tree to apply\n\nexport function commitRoot() {\n  // TODO: see \"The period that ends the work\", \"After the commit\" and Requirements R2 and R4 on the page.\n  throw new Error('not implemented: commitRoot');\n}\n\nfunction commitWork(fiber) {\n  // TODO: see \"The modules\" and Requirement R5 on the page.\n  throw new Error('not implemented: commitWork');\n}\n"},{"path":"solutions/src/didact/render.js","role":"adds","purpose":"`render` and the work loop behind it: one fiber per unit of work, and the browser can interrupt between units.","job":"Stop attaching DOM nodes while units run. Hold the tree under construction in `wipRoot`, and call `commitRoot` after the last unit.","blank":"// ======================================================================================\n// Assignment 04: Work in units: fibers\n// Problem: problems/04-fibers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   `render` and the work loop behind it: one fiber per unit of work, and the browser can\n//   interrupt between units. Later, assignments 05, 06, 09 and 10 add to this file.\n//\n// Your job:\n//   Build `render`, `workLoop` and `performUnitOfWork`. `render` only schedules the work;\n//   each idle period then runs fibers, one per unit of work, until `timeRemaining()` falls\n//   below 1.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations (the same files are in starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"04"}],"buildsOn":[{"path":"solutions/src/didact/state.js","owner":"04","purpose":"Shared bookkeeping in one object: what to work on next, and the tree under construction. It has to be an object, because an ES module can't share a variable for other modules to reassign."},{"path":"solutions/src/didact/dom.js","owner":"02","purpose":"Two jobs on a single DOM node: build it from an element, and bring its properties and listeners in line with new props."},{"path":"solutions/src/didact/reconcile.js","owner":"04","purpose":"Decides which fibers a parent's children become. At first that means a fresh fiber for every child, then a comparison with the previous render."},{"path":"solutions/src/didact/index.js","owner":"04","purpose":"What an app imports: one `Didact` object carrying `createElement` and `render`, with the hooks joining it as you write them."}],"indent":2,"tags":[{"label":"Language","items":["<a href=\"#primer/js-global-state\">module-level state<\/a>"],"text":["module-level state"]},{"label":"Library","items":["<a href=\"#primer/dom-tree-editing\">appendChild, insertBefore, removeChild<\/a>","<a href=\"#primer/workbook-harness\">the harness and scenario files<\/a>"],"text":["appendChild, insertBefore, removeChild","the harness and scenario files"]},{"label":"Concepts","items":["<a href=\"#primer/react-render-commit\">the render phase and the commit phase<\/a>","<a href=\"#primer/react-fibers\">fibers<\/a>"],"text":["the render phase and the commit phase","fibers"]}],"body":"<div class=\"d-problem flow\"><p>Build the tree without showing any of it. Then put the whole thing on the page in one pass at the end. A scenario renders a tree, runs idle periods of its own choosing, dumps the container after some of them, and asks the harness for counts of what your code has attached.<\/p>\n<h3>The modules<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>File<\/th><th>Export<\/th><th>What it is<\/th><\/tr><\/thead><tbody><tr><td><code>src/didact/commit.js<\/code><\/td><td><code>commitRoot()<\/code><\/td><td>Attaches the finished tree to the container and clears the tree under construction.<\/td><\/tr><tr><td><code>src/didact/commit.js<\/code><\/td><td><code>commitWork(fiber)<\/code><\/td><td>Attaches one fiber's node to the node of its parent fiber, then goes on to the fibers below it.<\/td><\/tr><tr><td><code>src/didact/render.js<\/code><\/td><td><code>workLoop<\/code>, <code>performUnitOfWork<\/code><\/td><td>The 04 loop and unit, with two changes: no unit touches the page, and the loop calls <code>commitRoot<\/code> when the work is done.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>state<\/code> keeps its 04 fields, and you can add more.<\/p>\n<h3>Input<\/h3>\n<p>Tests run <code>node assignments/assignment_05_commit.js &lt;input-file&gt; &lt;output-file&gt;<\/code>, a file shaped like 04's: <code>../harness/env.js<\/code> first, because the loop wants <code>requestIdleCallback<\/code> the moment <code>render.js<\/code> loads, then <code>../src/didact/index.js<\/code> for <code>Didact<\/code>, <code>../harness/scenario.js<\/code> for <code>runScenarioFile<\/code>, and a last line that awaits <code>runScenarioFile(process.argv[2], process.argv[3], Didact)<\/code>. The Boilerplate includes the file. From scratch, you write it. A scenario renders one tree onto the empty container and never renders again.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>What the harness does<\/th><\/tr><\/thead><tbody><tr><td><code>tree &lt;name&gt; &lt;markup&gt;<\/code><\/td><td>Registers a tree from one line of HTML-like text, for instance <code>&lt;ul id=l&gt;&lt;li&gt;one&lt;/li&gt;&lt;li&gt;two&lt;/li&gt;&lt;/ul&gt;<\/code>. No output.<\/td><\/tr><tr><td><code>render &lt;name&gt;<\/code><\/td><td><code>Didact.render(element, container)<\/code> on that tree. No output, and no work runs.<\/td><\/tr><tr><td><code>idle &lt;k&gt;<\/code><\/td><td>An idle period in which <code>timeRemaining()<\/code> answers 1 until call number <code>k<\/code> and 0 from then on (with <code>inf<\/code>, always 1). Prints the number of calls. <code>k<\/code> is 1 or more, or <code>inf<\/code>.<\/td><\/tr><tr><td><code>flush<\/code><\/td><td>Unlimited periods in a row, stopping after the first that finds nothing to do, meaning a period that never reads the clock. No output.<\/td><\/tr><tr><td><code>dump<\/code><\/td><td>Prints the container's contents.<\/td><\/tr><tr><td><code>ops insert move remove<\/code><\/td><td>Prints three counters, then zeroes all of them.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The counters tally your code's calls on DOM nodes since the previous <code>ops<\/code>, or since the scenario began. <code>insert<\/code> is the <code>appendChild<\/code> and <code>insertBefore<\/code> calls whose node had no parent yet, <code>move<\/code> the same calls on a node that already had one, and <code>remove<\/code> the <code>removeChild<\/code> and <code>remove<\/code> calls. No other counter is asked for here, so how many nodes you create and how many properties you write is up to you.<\/p>\n<h3>Output<\/h3>\n<pre><code>idle &lt;n&gt;\ndump &lt;i&gt;\nnode &lt;depth&gt; &lt;label&gt; &lt;tag&gt; &quot;&lt;props&gt;&quot;\ntext &lt;depth&gt; &quot;&lt;text&gt;&quot;\nops &lt;insert&gt; &lt;move&gt; &lt;remove&gt;<\/code><\/pre>\n<p><code>idle &lt;n&gt;<\/code> is the number of <code>timeRemaining()<\/code> calls in that period. A <code>dump<\/code> prints <code>dump &lt;i&gt;<\/code>, counting dumps from 1, then what the container holds, in document order and indented by depth from 0: a <code>node<\/code> line per element, a <code>text<\/code> line per text node; an empty container gets the <code>dump<\/code> line and nothing after it. Elements are labelled <code>a<\/code>, <code>b<\/code>, <code>c<\/code> and on, in the order a dump first meets them.<\/p>\n<p>The quoted <code>&lt;props&gt;<\/code> on a <code>node<\/code> line lists what differs from the defaults, as <code>name=value<\/code>, alphabetically, and five props can appear: <code>className<\/code>, <code>id<\/code> and <code>title<\/code> when not empty; <code>disabled<\/code> on buttons, inputs and textareas, written <code>disabled=true<\/code>; and <code>value<\/code> on inputs and textareas when not empty. A value with whitespace, <code>&quot;<\/code> or <code>%<\/code> in it goes through <code>encodeURIComponent<\/code>, so a space becomes <code>%20<\/code>. Nothing to list prints <code>&quot;&quot;<\/code>. In a <code>text<\/code> line, line breaks and the characters <code>%<\/code> and <code>&quot;<\/code> are encoded; spaces stay.<\/p>\n<h3>While the units run<\/h3>\n<p>Units count the way they did in assignment 04: the root fiber, then one per element and one per text node, <code>1 + E + T<\/code> for a tree with <code>E<\/code> elements and <code>T<\/code> text pieces. A period with budget <code>k<\/code> does <code>k<\/code> units if that many are waiting, and all of them otherwise. It reads <code>timeRemaining()<\/code> once after each, the last unit of the tree included. With nothing to do it reads nothing.<\/p>\n<p>What changes is the page. A unit may create its fiber's node and set its props, but it may not attach anything to the container or to another node, which means a <code>dump<\/code> after a period that leaves units undone shows an empty container and <code>ops insert move remove<\/code> prints <code>0 0 0<\/code>.<\/p>\n<h3>The period that ends the work<\/h3>\n<p>The period whose last unit finishes the tree commits as well. Straight after that unit, in the same call of the loop, every element and text node of the finished tree is attached to its parent's node, and by the time <code>idle<\/code> returns the container holds the whole tree. The pass is not a unit and does not call <code>timeRemaining()<\/code>, so <code>idle<\/code> prints what it printed in 04.<\/p>\n<p>That holds even when the last unit also uses up the budget: <code>idle 9<\/code> on a tree of 9 units commits in that period. No extra period.<\/p>\n<p>Each node is attached once, and the counters read <code>N 0 0<\/code> for the period of the commit. <code>N<\/code> is the number of elements plus text nodes; the root fiber has no node of its own to attach, which makes <code>N<\/code> one less than the units. The checker can't see in what order you visit the fibers, so a parent may go in before or after its children and the walk may be recursive or a loop. It does have to reach every fiber, siblings included, and attach the children of one parent in tree order. Otherwise they land in the wrong order.<\/p>\n<h3>After the commit<\/h3>\n<p>With the tree on the page, later periods and <code>flush<\/code> have nothing to do. They print 0, leave the container alone and keep the counters at 0. A loop that forgets to clear its finished root commits again every period, and the <code>move<\/code> counter gives it away.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>While units run the container stays empty: a <code>dump<\/code> after a period that leaves work undone shows no node.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>The period that runs the last unit also commits: a <code>dump<\/code> right after it shows the whole tree.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The commit adds no unit and no <code>timeRemaining()<\/code> read, so <code>idle k<\/code> still prints the smaller of <code>k<\/code> and the units left, and later periods print 0.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Each node is inserted once, by the commit: <code>ops insert move remove<\/code> prints <code>0 0 0<\/code> while work is waiting, <code>N 0 0<\/code> after the period of the last unit (N is the number of elements plus text nodes), and <code>0 0 0<\/code> after that.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>The committed tree has the right shape: nesting, sibling order, props and text.<\/span><\/li><li><span class=\"rid\">E2E<\/span><span>Whole scenarios mixing periods, dumps and counters.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><p>Trees have 2 to 60 units of plain elements and text, with no handlers, components or keys, and a scenario renders one tree with budgets that are whole numbers from 1 up or <code>inf<\/code>, and an <code>ops<\/code> line that always names <code>insert move remove<\/code>. The 44 tests are hand-picked trees for every requirement, two whole scenarios and five seeded random ones, two of which dump after each period. <code>-Fresh<\/code> draws five new ones. A test may take 10 seconds; a correct solution finishes in milliseconds.<\/p><\/section>","solutionCode":{"files":[{"path":"src/didact/commit.js","text":"// ---- Assignment 05: commit the finished tree in one pass ----\n// The render phase builds fibers and DOM nodes but leaves the page alone; this applies the result.\nimport { state } from './state.js';\n\n// ---- Assignment 05: append every node ----\nexport function commitRoot() {\n  commitWork(state.wipRoot.child);\n  state.wipRoot = null;\n}\n\nfunction commitWork(fiber) {\n  fiber.parent.dom.appendChild(fiber.dom);\n  for (let child = fiber.child; child; child = child.sibling) commitWork(child);\n}\n"},{"path":"src/didact/render.js","text":"// ---- Assignment 04: the work loop ----\n// render() only schedules work. Whenever the browser is idle, workLoop() builds the tree of\n// fibers one unit of work at a time, so it can stop when the browser has something else to do.\nimport { createDom } from './dom.js';\nimport { reconcileChildren } from './reconcile.js';\nimport { state } from './state.js';\n\n// ---- Assignment 05: commit when the last unit is done ----\nimport { commitRoot } from './commit.js';\n\n// ---- Assignment 04: schedule the work ----\nexport function render(element, container) {\n  state.wipRoot = { dom: container, props: { children: [element] } };\n  state.nextUnitOfWork = state.wipRoot;\n}\n\n// ---- Assignment 05: commit in the same period as the last unit ----\nfunction workLoop(deadline) {\n  try {\n    let shouldYield = false;\n    while (state.nextUnitOfWork && !shouldYield) {\n      state.nextUnitOfWork = performUnitOfWork(state.nextUnitOfWork);\n      shouldYield = deadline.timeRemaining() < 1;\n    }\n    if (!state.nextUnitOfWork && state.wipRoot) commitRoot();\n  } finally {\n    requestIdleCallback(workLoop);\n  }\n}\n\n// ---- Assignment 05: one unit of work, without touching the page ----\nfunction performUnitOfWork(fiber) {\n  if (!fiber.dom) fiber.dom = createDom(fiber);\n  reconcileChildren(fiber, fiber.props.children);\n  return nextFiber(fiber);\n}\n\n// ---- Assignment 04: which fiber is next ----\n// Depth first: the child, else the sibling, else the nearest ancestor's sibling.\nfunction nextFiber(fiber) {\n  if (fiber.child) return fiber.child;\n  for (let next = fiber; next; next = next.parent) {\n    if (next.sibling) return next.sibling;\n  }\n  return null;\n}\n\nrequestIdleCallback(workLoop);\n"},{"path":"assignments/assignment_05_commit.js","text":"// Assignment 05: the checker runs this program as `node assignments/assignment_05_commit.js <input-file> <output-file>`.\n// It hands the scenario file to the harness together with the code under test.\n\nimport '../harness/env.js'; // first: installs document and a requestIdleCallback the tests control, before the library loads\nimport Didact from '../src/didact/index.js'; // Didact: the library under test\nimport { runScenarioFile } from '../harness/scenario.js'; // runScenarioFile: reads the scenario file, runs it against your code, writes the output file\n\nawait runScenarioFile(process.argv[2], process.argv[3], Didact);\n"}],"also":["src/didact/index.js","src/didact/createElement.js","src/didact/dom.js","src/didact/reconcile.js","src/didact/state.js"],"proof":{"passed":44,"total":44,"date":"2026-11-01"},"given":["harness/scenario.js","harness/env.js","harness/dump.js","harness/markup.js","harness/catalog.js","harness/minidom.js"]},"read":"<p>Pombo's version is <a href=\"https://pomb.us/build-your-own-react/#step-v-render-and-commit-phases\" target=\"_blank\" rel=\"noopener\">Step V: Render and Commit Phases<\/a>. Six short paragraphs with code frames between them cover why attaching a node in every unit is a problem, what <code>wipRoot<\/code> is, and how a finished tree gets appended. Read the paragraphs. Save the frames for after you have a solution of your own. The post is optional, and the page below is enough.<\/p>","readTitle":"Read in the blog first","context":"<p>In 04 a unit was allowed to append its node, as the post's does. The page could grow piece by piece while the browser was free to paint it. This one closes that gap. The new file is <code>src/didact/commit.js<\/code>, and <code>render.js<\/code> changes. The walk, <code>reconcile.js<\/code> and <code>state.js<\/code> stay as 04 left them.<\/p>","sources":"<ul><li>Rodrigo Pombo, <a href=\"https://pomb.us/build-your-own-react/#step-v-render-and-commit-phases\" target=\"_blank\" rel=\"noopener\">Step V: Render and Commit Phases<\/a><\/li><li>react.dev, <a href=\"https://react.dev/learn/render-and-commit\" target=\"_blank\" rel=\"noopener\">Render and commit<\/a><\/li><li>MDN: <a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/appendChild\" target=\"_blank\" rel=\"noopener\">Node.appendChild<\/a><\/li><li><code>harness/minidom.js<\/code>, which says how <code>insert<\/code>, <code>move<\/code> and <code>remove<\/code> are counted<\/li><\/ul>","checking":"<pre><code>.\\check 05                         all tests, grouped by requirement\n.\\check 05 -Case 05-R2-short-last-period   one test with the input, the expected lines and your output\n.\\check 05 -Fresh                  five new random scenarios\n.\\check 05 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you think is wrong<\/code><\/pre>\n<p>If the commit waits for the next period instead of running at the end of this one, the report reads:<\/p>\n<pre><code>  R2  the period that runs the last unit also commits: a dump right aft... .    0 / 7   FAILED\n      x 05-R2-last-period-of-three  8 units in periods of 3: the third one runs the last two and commits\n          output ends early - expected line 5: `node 0 a div &quot;&quot;`  (in `idle 2`)\n          likely cause: R2 - the period that runs the last unit also commits: a dump right after it shows the whole tree\n          expected values from: React 19.3.1 on jsdom 30.1.3 for the dumps; the unit formula for the idle lines; a model in tools/gen_p05.py for the ops lines\n          reproduce: py -P tools/run_js.py solutions 05 build/cases/05/05-R2-last-period-of-three.in build/cases/05/05-R2-last-period-of-three.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Picture a scenario that dumps after every period and read your 04 loop with it in mind. The only thing that has to leave the unit is the line that puts a node into its parent. Then ask what is left to do after the last unit, and where in the loop you find out the work is over.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Have <code>render<\/code> keep the root fiber it creates, as the tree under construction, beside the fiber to work on next. Units stop attaching. After the <code>while<\/code> loop in <code>workLoop<\/code>, check whether a fiber is left and whether a tree under construction exists. With no fiber left and the tree there, commit it. Start at the root's first child, attach each fiber's node to its parent fiber's node, then do its children and its siblings. Clear the kept root at the end, so a later period does not do it all again.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>No attaching may stay in the unit. A single <code>appendChild<\/code> there makes the dump after the first period non-empty.<\/li><li>Commit in the call that ran the last unit. Checking at the top of the next call is a period late.<\/li><li>The commit is not a unit. It adds no read of <code>timeRemaining()<\/code> and does not wait for the clock.<\/li><li>Follow the siblings as well as the children; a walk that follows only <code>child<\/code> attaches the first branch and stops.<\/li><li>Skip the root fiber. Its node is the container and nothing attaches it. The walk starts at its child.<\/li><li>Clear the finished root after the commit, or every later period, even an idle one, appends the whole tree again.<\/li><li><code>commit.js<\/code> reads the tree under construction and the next fiber to work on from the same state object <code>render.js<\/code> writes to.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>workLoop(deadline):\n    while nextUnitOfWork exists:\n        nextUnitOfWork = performUnitOfWork(nextUnitOfWork)\n        if deadline.timeRemaining() &lt; 1: leave the while loop\n    if no nextUnitOfWork and wipRoot exists:\n        commitRoot()\n    requestIdleCallback(workLoop)\n\nperformUnitOfWork(fiber):\n    fiber.dom = createDom(fiber) if it has none\n    reconcileChildren(fiber, fiber.props.children)\n    return the next fiber                    # nothing attached here any more\n\ncommitRoot():\n    commitWork(wipRoot.child)\n    wipRoot = nothing\n\ncommitWork(fiber):\n    fiber.parent.dom.appendChild(fiber.dom)\n    for each child of fiber, in order: commitWork(child)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"dumping after every period","test":"05-R1-empty-between-periods","input":"tree a <div><h1>title<p>para<\/p><a>link<\/a><\/h1><h2>sub<\/h2><\/div>\nrender a\nidle 3\ndump\nidle 3\ndump\nidle 3\ndump","output":"idle 3\ndump 1\nidle 3\ndump 2\nidle 3\ndump 3","image":null,"explain":"<p>Ten units. Three periods of three leave one undone, so nothing has been committed and all three dumps end after their header line. Nodes may already exist, because units create them, but every one is detached.<\/p>"},{"label":"Example 2","name":"the period that commits","test":"05-R2-last-period-of-three","input":"tree a <div><section><article><span><em><b><div><\/div><\/b><\/em><\/span><\/article><\/section><\/div>\nrender a\nidle 3\nidle 3\nidle 3\ndump","output":"idle 3\nidle 3\nidle 2\ndump 1\nnode 0 a div \"\"\nnode 1 b section \"\"\nnode 2 c article \"\"\nnode 3 d span \"\"\nnode 4 e em \"\"\nnode 5 f b \"\"\nnode 6 g div \"\"","image":null,"explain":"<p>Seven elements and the root fiber make eight units. Two are left for the third period. It does them, prints 2 (no ninth read for the commit) and leaves the whole chain on the page before <code>dump<\/code> runs. A solution that commits at the start of the next period prints the same numbers and then dumps an empty container. Right numbers, wrong page.<\/p>"},{"label":"Example 3","name":"counting inserts","test":"05-R4-insert-at-commit","input":"tree a <div><h1>title<p>para<\/p><a>link<\/a><\/h1><h2>sub<\/h2><\/div>\nrender a\nidle 4\nops insert move remove\nidle 4\nops insert move remove\nidle 4\nops insert move remove","output":"idle 4\nops 0 0 0\nidle 4\nops 0 0 0\nidle 2\nops 9 0 0","image":null,"explain":"<p>5 elements and 4 text pieces make nine nodes. All nine are attached in the commit, in a single period, and none was in the DOM before, so each call counts as an <code>insert<\/code>. A <code>move<\/code> would mean a node that already had a parent was appended again. That is what happens when a unit attaches its node and the commit attaches it again.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://pomb.us/build-your-own-react/#step-v-render-and-commit-phases\" target=\"_blank\" rel=\"noopener\">Pombo's Step V<\/a> repairs the half-drawn page of Step IV. The root of the tree under construction goes in <code>wipRoot<\/code>, <code>performUnitOfWork<\/code> loses its attaching line, and <code>workLoop<\/code> calls <code>commitRoot()<\/code> when there is no next unit of work and <code>wipRoot<\/code> is set. <code>commitRoot<\/code> calls <code>commitWork(wipRoot.child)<\/code> and clears <code>wipRoot<\/code>, and <code>commitWork<\/code> appends <code>fiber.dom<\/code> to <code>fiber.parent.dom<\/code>, a parent before the fibers below it, and then recurses into <code>child<\/code> and <code>sibling<\/code>. The tests assume that shape, including the commit in the call of the last unit. They accept the other order of parent and children too. In the post it all shares a file with the loop and <code>wipRoot<\/code> is a plain variable; here <code>commit.js<\/code> reads it from <code>state<\/code>.<\/p>\n<p>Two things in the post's commit go beyond what the checker needs, and neither is exercised here. First, the post's <code>commitWork<\/code> recurses along <code>sibling<\/code>, so a parent with enough children can overflow the call stack. A test of the post's Step V code on Node 26 passed at fifteen thousand siblings and overflowed at twenty thousand. The limit depends on the engine, and the trees here have a few dozen nodes at most. Second, the commit walks the whole tree, where the post's epilogue says React keeps a linked list of the fibers that have effects and visits only those. <a href=\"docs/react-today.md\" target=\"_blank\" rel=\"noopener\">React today<\/a> says when React can pause a render at all.<\/p>\n<p>The commit runs inside <code>workLoop<\/code>, ahead of the closing <code>requestIdleCallback(workLoop)<\/code>, so an exception from it ends the loop for good, as one from a unit does. No test throws from the commit. 06 names a bug in the post that does.<\/p>"},"need":{"new":[{"id":"react-render-commit","title":"The render phase and the commit phase","note":"units build the tree and never touch the page; one uninterrupted pass then attaches it.","group":"React and the ideas in the posts","from":"05"}],"earlier":[{"id":"dom-tree-editing","title":"<code>appendChild<\/code>, <code>insertBefore<\/code>, <code>removeChild<\/code>","note":"how a node gets attached to a parent. The harness scores a node with no parent yet as an <code>insert<\/code> and one that already has a parent as a <code>move<\/code>.","group":"The DOM","from":"03"},{"
