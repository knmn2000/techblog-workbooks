riable such as <code>uint64_t<\/code>, and report the end of the file (by throwing an exception, for example) as soon as <code>get()<\/code> reports it. For a signed type, apply the two's complement rule to the finished value.<\/p>\n<p>An F2Dot14 is a 16-bit signed read divided by 16384.0, a jump is <code>seekg(offset, std::ios::beg)<\/code>, and a skip is <code>seekg(count, std::ios::cur)<\/code>. (In the Boilerplate these are <code>readBigEndian<\/code>, <code>readF2Dot14<\/code>, <code>jumpTo<\/code> and <code>skipBytes<\/code>, and the end of the file is the <code>UnexpectedEof<\/code> exception.)<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Compare <code>get()<\/code>'s result with EOF before turning it into a byte. Once cast, EOF looks like the byte <code>ff<\/code>.<\/li><li><code>char<\/code> may be signed. If you read into a <code>char<\/code> (with <code>read<\/code>), the byte <code>ff<\/code> becomes −1, and shifting a negative value spreads ones through the high bits. Convert to <code>uint8_t<\/code> first.<\/li><li>The sign rule uses the full width: subtract 2^16 for an <code>i16<\/code>, not 2^15 or 2^8.<\/li><li>Check for the end after every <code>get()<\/code> in a read. <code>file.eof()<\/code> is no help before a read: it turns true after a read has failed.<\/li><li>A stream that has failed ignores <code>seekg<\/code> until you call <code>clear()<\/code>. Calling <code>clear()<\/code> at the start of your jump keeps your reader usable after an error.<\/li><li>Printing a <code>uint8_t<\/code> with <code>&lt;&lt;<\/code> prints a character. Put <code>+<\/code> in front of it, or cast it to <code>int<\/code>, to print the number.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>read_big_endian(T):\n    value = 0                               # wide and unsigned, e.g. uint64\n    repeat size_of(T) times:\n        c = file.get()\n        if c is EOF: report &quot;end of file&quot;   # e.g. throw an exception\n        value = (value &lt;&lt; 8) | c\n    n = 8 * size_of(T)\n    if T is signed and value &gt;= 2^(n-1):\n        return value - 2^n                  # as a signed number\n    return value\n\nread_f2dot14():  return read_big_endian(int16) / 16384.0\njump_to(offset): file.clear(); file.seekg(offset, from the start)\nskip(n):         file.seekg(n, from the current position)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the same bytes, unsigned and signed","test":"01-R2-same-bytes","input":"file tests/01/data/01-R2-same-bytes.bin\nu16\njump 0\ni16\njump 0\nu32\njump 0\ni32\njump 0\nu8\ni8","output":"u16 65534\ni16 -2\nu32 4294901759\ni32 -65537\nu8 255\ni8 -2","image":null,"explain":"<p>The file holds the 4 bytes <code>ff fe ff ff<\/code>.<\/p>\n<p><code>ff fe<\/code> is <code>0xfffe<\/code> = 65534. As an <code>i16<\/code>, 65534 ≥ 32768, so the value is 65534 − 65536 = −2. The last two reads are <code>ff<\/code> (255) and then <code>fe<\/code> (254 − 256 = −2), because <code>u8<\/code> moved the position on by one byte.<\/p>"},{"label":"Example 2","name":"two fields of a real font","test":"01-R4-font-head","input":"file fonts/JetBrainsMonoNerdFont-Bold.ttf\njump 300\nskip 18\nu16\nskip 30\ni16","output":"u16 1000\ni16 1","image":null,"explain":"<p>The font's <code>head<\/code> table starts at byte 300 (assignment 02 shows how to find that). Its <code>unitsPerEm<\/code> field is 18 bytes in, at byte 318. Reading it moves the position to 320, and <code>skip 30<\/code> lands on byte 350, which is <code>head<\/code> + 50: the <code>indexToLocFormat<\/code> field that assignment 04 needs.<\/p>"},{"label":"Example 3","name":"running out of bytes","test":"01-R5-eof-in-u32","input":"file tests/01/data/01-R5-eof-in-u32.bin\nu16\nu32\nu8","output":"u16 258\neof","image":null,"explain":"<p>The file holds the 5 bytes <code>01 02 03 04 05<\/code>.<\/p>\n<p><code>u16<\/code> reads <code>01 02<\/code> = 258. The <code>u32<\/code> needs 4 bytes and the file has 3 left, so the program writes <code>eof<\/code> and stops. It doesn't run the last <code>u8<\/code>, even though one byte remains.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Byte%20readers\" target=\"_blank\" rel=\"noopener\">The blog's byte readers<\/a> live in a <code>FontParser<\/code> class, which opens the font as a binary <code>std::ifstream<\/code> and keeps it for every later step. <code>jumpTo<\/code> and <code>skipBytes<\/code> wrap <code>seekg<\/code>. A function template, <code>readBeOrThrow&lt;T&gt;<\/code>, reads <code>sizeof(T)<\/code> bytes with <code>get()<\/code>, throws \"unexpected EOF\" at the end of the file, assembles the bytes most significant first, and converts signed types from two's complement by hand. <code>readUint8<\/code> to <code>readInt32<\/code> are one-line wrappers around it, and <code>readF2Dot14<\/code> divides an <code>int16<\/code> by 2^14.<\/p>\n<p><strong>Something to look for:<\/strong> since C++20, the standard defines a conversion from an unsigned value to a signed type of the same width as wrapping modulo 2^n, so <code>static_cast&lt;int16_t&gt;(uint16_t{0xfffe})<\/code> is −2. Before C++20 the result was implementation-defined, which is one reason to write the conversion out by hand as the author does. Both versions give the same answers on these tests.<\/p>"}},{"id":"02","num":"2","title":"Read the table directory","difficulty":"Easy","tests":13,"problem":"problems/02-table-directory.md","entry":"solutions/assignments/assignment_02_table_directory.cpp","files":[{"path":"solutions/assignments/assignment_02_table_directory.cpp","role":"entry","purpose":null,"job":"Read the `font` line, read that file's table directory with your `FontParser` code, and write `tables <numTables>` followed by one `table` line per record. The Output section gives the format, including the quotes around the tag.","blank":"// ======================================================================================\n// Assignment 02: Read the table directory\n// Problem: problems/02-table-directory.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 02 as `build/solutions/assignment_02.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 02`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `font` line, read that file's table directory with your `FontParser` code,\n//   and write `tables <numTables>` followed by one `table` line per record. The Output\n//   section gives the format, including the quotes around the tag.\n//\n// The other files of this assignment:\n//   You also write src/font/FontParser.h and src/font/FontParser.cpp in this assignment;\n//   each one gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h.\n//   Include them by their path under src/, e.g. #include \"font/FontParser.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 02: Read the table directory\n// Problem: problems/02-table-directory.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 02 as `build/solutions/assignment_02.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 02`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/font/FontParser.h and src/font/FontParser.cpp in this assignment;\n//   each one gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h.\n//   Include them by their path under src/, e.g. #include \"font/FontParser.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/FontParser.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, path;\n      words >> keyword >> path;\n      if (keyword != \"font\") continue;\n      ByteReader reader(path);\n      const std::vector<TableRecord> tables = readTableDirectory(reader);\n      output << \"tables \" << tables.size() << '\\n';\n      for (const TableRecord& t : tables)\n        output << \"table \\\"\" << t.tag << \"\\\" \" << t.checkSum << ' ' << t.offset << ' ' << t.length << '\\n';\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/font/FontParser.h","role":"new","purpose":"This header declares the code that opens a font and reads its table directory: the tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...). Assignments 03 to 05 find their tables by tag in these records, and assignment 18 opens the font through it.","job":"Declare a record for one table (its 4-character tag, `checkSum`, `offset` and `length`), a function that reads the whole directory through your `ByteReader`, and a collection of records that assignments 03 to 05 can search by tag. Assignment 18 also uses one object that opens a font and holds its reader and tables. You can declare it now or when you reach assignment 18.","blank":"#pragma once\n// ======================================================================================\n// Assignment 02: Read the table directory\n// Problem: problems/02-table-directory.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares the code that opens a font and reads its table directory: the\n//   tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...).\n//   Assignments 03 to 05 find their tables by tag in these records, and assignment 18\n//   opens the font through it.\n//\n// Your job:\n//   Declare a record for one table (its 4-character tag, `checkSum`, `offset` and\n//   `length`), a function that reads the whole directory through your `ByteReader`, and a\n//   collection of records that assignments 03 to 05 can search by tag. Assignment 18 also\n//   uses one object that opens a font and holds its reader and tables. You can declare it\n//   now or when you reach assignment 18.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 02: Read the table directory\n// Problem: problems/02-table-directory.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares the code that opens a font and reads its table directory: the\n//   tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...).\n//   Assignments 03 to 05 find their tables by tag in these records, and assignment 18\n//   opens the font through it.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <map>\n#include <string>\n#include <vector>\n\n#include \"font/ByteReader.h\"\n\n// One entry of the table directory: where a table is in the file.\nstruct TableRecord {\n  std::string tag;  // exactly 4 characters, trailing spaces included\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\n\nusing Tables = std::map<std::string, TableRecord>;  // by tag\n\n// Reads the offset table and the table directory at the start of the file, in file order.\nstd::vector<TableRecord> readTableDirectory(ByteReader& reader);\n\n// A font file opened for reading, with its table directory loaded.\nclass FontParser {\n public:\n  explicit FontParser(const std::string& path);\n\n  ByteReader& reader() { return reader_; }\n  [[nodiscard]] const Tables& tables() const { return tables_; }\n\n private:\n  ByteReader reader_;\n  Tables tables_;\n};\n"},{"path":"solutions/src/font/FontParser.cpp","role":"new","purpose":"This file reads the table directory from the first bytes of the font through your `ByteReader`. Each later assignment that needs a table looks up its offset in these records.","job":"Read `numTables` from the 12-byte header and skip the other header fields, then read one 16-byte record per table and keep each tag's 4 bytes as the font stores them. If you declared a font object, have it open the file and load the directory once.","blank":"// ======================================================================================\n// Assignment 02: Read the table directory\n// Problem: problems/02-table-directory.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads the table directory from the first bytes of the font through your\n//   `ByteReader`. Each later assignment that needs a table looks up its offset in these\n//   records.\n//\n// Your job:\n//   Read `numTables` from the 12-byte header and skip the other header fields, then read\n//   one 16-byte record per table and keep each tag's 4 bytes as the font stores them. If\n//   you declared a font object, have it open the file and load the directory once.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 02: Read the table directory\n// Problem: problems/02-table-directory.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads the table directory from the first bytes of the font through your\n//   `ByteReader`. Each later assignment that needs a table looks up its offset in these\n//   records.\n//\n// Your job:\n//   Read `numTables` from the 12-byte header and skip the other header fields, then read\n//   one 16-byte record per table and keep each tag's 4 bytes as the font stores them. If\n//   you declared a font object, have it open the file and load the directory once. The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/FontParser.h\"\n\nstd::vector<TableRecord> readTableDirectory(ByteReader& reader) {\n  // TODO: read the header, then one record per table (layout on the problem page).\n  throw std::logic_error(\"not implemented: readTableDirectory\");\n}\n\nFontParser::FontParser(const std::string& path) : reader_(path) {\n  for (const TableRecord& t : readTableDirectory(reader_)) tables_[t.tag] = t;\n}\n"}],"buildsOn":[{"path":"solutions/src/font/ByteReader.h","owner":"01","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines."}],"indent":2,"tags":[{"label":"Language","items":["structs","fixed-width unsigned integers (<code>uint16_t<\/code>, <code>uint32_t<\/code>)","strings built from bytes","binary file I/O (<code>seekg<\/code>, <code>get<\/code>)"],"text":["structs","fixed-width unsigned integers (uint16_t, uint32_t)","strings built from bytes","binary file I/O (seekg, get)"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode","<code>std::vector<\/code>","<code>std::string<\/code>","<code>std::unordered_map<\/code> (optional)"],"text":["std::ifstream in binary mode","std::vector","std::string","std::unordered_map (optional)"]},{"label":"Concepts","items":["the sfnt container","table tags","offsets from the start of the file","big-endian byte order"],"text":["the sfnt container","table tags","offsets from the start of the file","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font file's table directory and writes how many tables the font has, then the record of every table.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file has one line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The file to read. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Some test files are real fonts. Others are hand-made files that hold only a table directory, so their offsets may point past the end of the file. Your program doesn't need to follow any offset.<\/p>\n<h3>Output<\/h3>\n<pre><code>tables &lt;numTables&gt;\ntable &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;\ntable &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;\n...<\/code><\/pre>\n<ul><li>First the line <code>tables &lt;numTables&gt;<\/code>.<\/li><li>Then one <code>table<\/code> line per record. The records may come in any order.<\/li><li>Write the tag's 4 characters inside double quotes as the font stores them, including any spaces at the end: <code>&quot;cvt &quot;<\/code>, not <code>&quot;cvt&quot;<\/code>.<\/li><li>The three numbers (<code>checkSum<\/code>, <code>offset<\/code>, <code>length<\/code>) are in decimal.<\/li><\/ul>\n<h3>The table directory<\/h3>\n<p>The directory starts at byte 0 of the file. All numbers are <strong>big-endian<\/strong>, and your <code>ByteReader<\/code> from assignment 01 can read every field.<\/p>\n<p><strong>Header<\/strong> (the \"offset subtable\"), 12 bytes:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>scaler type<\/td><td>uint32<\/td><td>What kind of font this is: <code>0x00010000<\/code> or <code>&#x27;true&#x27;<\/code> for TrueType outlines<\/td><\/tr><tr><td><code>numTables<\/code><\/td><td>uint16<\/td><td>How many table records follow<\/td><\/tr><tr><td><code>searchRange<\/code><\/td><td>uint16<\/td><td>(the largest power of 2 that is ≤ <code>numTables<\/code>) × 16, an aid for binary search<\/td><\/tr><tr><td><code>entrySelector<\/code><\/td><td>uint16<\/td><td>log2 of that power of 2<\/td><\/tr><tr><td><code>rangeShift<\/code><\/td><td>uint16<\/td><td><code>numTables<\/code> × 16 − <code>searchRange<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Of these five fields, your program needs <code>numTables<\/code>. Skip the other four, whatever they hold.<\/p>\n<p><strong>Table records<\/strong>: <code>numTables<\/code> of them, 16 bytes each, starting at byte 12:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>tag<\/code><\/td><td>4 bytes<\/td><td>The table's name as 4 ASCII characters. A name shorter than 4 characters ends in spaces, as in <code>&#x27;cvt &#x27;<\/code>.<\/td><\/tr><tr><td><code>checkSum<\/code><\/td><td>uint32<\/td><td>A checksum of the table's bytes<\/td><\/tr><tr><td><code>offset<\/code><\/td><td>uint32<\/td><td>Where the table starts, in bytes from the start of the file<\/td><\/tr><tr><td><code>length<\/code><\/td><td>uint32<\/td><td>The table's length in bytes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Record k (counting from 0) starts at byte 12 + 16k.<\/p>\n<p>A well-made font sorts the records by tag, byte by byte, so uppercase tags come before lowercase ones. Your program can ignore that order.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Your program reads <code>numTables<\/code> as the uint16 at byte 4 and writes it as <code>tables &lt;numTables&gt;<\/code> (it can be 0). It skips the scaler type before it and the 6 bytes of search fields after it, whatever they hold.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Each record is 16 bytes: the tag, then <code>checkSum<\/code>, <code>offset<\/code> and <code>length<\/code> as big-endian uint32 values, which can be 2^31 or more.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Your program writes the tag as its 4 bytes, trailing spaces included.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>numTables<\/code> is between 0 and 30 in the tests, and the tags in one file are all different.<\/li><li>Tags are printable ASCII without <code>&quot;<\/code>, and spaces appear only at the end.<\/li><li>Each file holds the whole directory. Offsets and lengths may point anywhere, including past the end of the file.<\/li><li>Each case has a 10-second limit. A correct solution finishes in milliseconds.<\/li><li>There are 13 tests: hand-made directories for each rule, three small fonts built with fontTools (with and without the hinting tables, and with three tables removed), both real fonts, and 3 random directories.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/font/FontParser.h","text":"#pragma once\n// Assignment 02: the table directory, and the parser later steps read the font through.\n\n#include <cstdint>\n#include <map>\n#include <string>\n#include <vector>\n\n#include \"font/ByteReader.h\"\n\n// One entry of the table directory: where a table is in the file.\nstruct TableRecord {\n  std::string tag;  // exactly 4 characters, trailing spaces included\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\n\nusing Tables = std::map<std::string, TableRecord>;  // by tag\n\n// Reads the offset table and the table directory at the start of the file, in file order.\nstd::vector<TableRecord> readTableDirectory(ByteReader& reader);\n\n// A font file opened for reading, with its table directory loaded.\nclass FontParser {\n public:\n  explicit FontParser(const std::string& path);\n\n  ByteReader& reader() { return reader_; }\n  [[nodiscard]] const Tables& tables() const { return tables_; }\n\n private:\n  ByteReader reader_;\n  Tables tables_;\n};\n"},{"path":"src/font/FontParser.cpp","text":"#include \"font/FontParser.h\"\n\nstd::vector<TableRecord> readTableDirectory(ByteReader& reader) {\n  reader.jumpTo(0);\n  reader.readUint32();  // scaler type: 0x00010000, 'true', ... (not needed)\n  const uint16_t numTables = reader.readUint16();\n  reader.skipBytes(6);  // searchRange, entrySelector, rangeShift\n\n  std::vector<TableRecord> tables(numTables);\n  for (TableRecord& t : tables) {\n    for (int i = 0; i < 4; ++i) t.tag += static_cast<char>(reader.readUint8());\n    t.checkSum = reader.readUint32();\n    t.offset = reader.readUint32();\n    t.length = reader.readUint32();\n  }\n  return tables;\n}\n\nFontParser::FontParser(const std::string& path) : reader_(path) {\n  for (const TableRecord& t : readTableDirectory(reader_)) tables_[t.tag] = t;\n}\n"},{"path":"assignments/assignment_02_table_directory.cpp","text":"// Assignment 02 (read the table directory): lists the tables of each font in a test input.\n// The directory is read by src/font/FontParser.\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/FontParser.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, path;\n      words >> keyword >> path;\n      if (keyword != \"font\") continue;\n      ByteReader reader(path);\n      const std::vector<TableRecord> tables = readTableDirectory(reader);\n      output << \"tables \" << tables.size() << '\\n';\n      for (const TableRecord& t : tables)\n        output << \"table \\\"\" << t.tag << \"\\\" \" << t.checkSum << ' ' << t.offset << ' ' << t.length << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/font/ByteReader.h","src/font/ByteReader.cpp"],"proof":{"passed":13,"total":13,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Offset%20table\" target=\"_blank\" rel=\"noopener\">Offset table<\/a> section through the paragraph that starts \"This is the structure of the\". The author's code follows that paragraph.<\/p>","readTitle":"Read in the blog first","context":"<p>A TrueType font is a set of <strong>tables<\/strong> (<code>cmap<\/code>, <code>glyf<\/code>, <code>head<\/code>, ...) packed into one file. The <strong>table directory<\/strong> at the start of the file lists where each table is. Assignments 03 to 05 read the <code>cmap<\/code>, <code>loca<\/code> and metrics tables at the offsets you find here. Their inputs already contain this assignment's output lines for the tables they need, so you can solve them without finishing this one.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6.html\" target=\"_blank\" rel=\"noopener\">The font directory<\/a> (the \"offset subtable\" and \"table directory\" tables)<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/otff#organization-of-an-opentype-font\" target=\"_blank\" rel=\"noopener\">Organization of an OpenType font<\/a> (TableDirectory and TableRecord)<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Offset%20table\" target=\"_blank\" rel=\"noopener\">Offset table<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 02                         run every test\n.\\check 02 -Case 02-R3-spaces      one test, showing its full input, expected output and your output\n.\\check 02 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 02 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Tags as the font stores them: 4 characters, trailing spaces kept ...........    0 / 2   FAILED\n      x 02-R3-tiny-hinted  the 4-glyph font plus &#x27;cvt &#x27;, fpgm, prep and gasp (14 tables)\n          expected `table &quot;cvt &quot; 4292346576 544 8`, closest line written: `table &quot;cvt&quot; 4292346576 544 8` - differs in tag (15 lines written, 15 expected)\n          likely cause: R3 - Tags as the font stores them: 4 characters, trailing spaces kept\n          expected values from: Python struct, cross-checked against fontTools 4.67.0 SFNTReader\n          reproduce: build/solutions/assignment_02.exe build/cases/02/02-R3-tiny-hinted.in build/cases/02/02-R3-tiny-hinted.out<\/code><\/pre>\n<p>Your lines may come in any order, so the checker looks for each expected line in your output. If one is missing, it shows the closest line you wrote with the same keyword. Inside a quoted tag, the checker compares every space.<\/p>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>The answer comes from the first 12 + 16 × <code>numTables<\/code> bytes. Read the header fields in the order the font stores them, then loop <code>numTables<\/code> times, reading one record per pass.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Seek to byte 0. Read and ignore a uint32 (the scaler type). Read the uint16 <code>numTables<\/code>. Skip 6 bytes. Then, for each record, read 4 single bytes and append each one to a string as a character, and read three uint32 values. Your <code>ByteReader<\/code> from assignment 01 does the byte order for you.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Don't trim the tag. <code>&quot;cvt &quot;<\/code> and <code>&quot;cvt&quot;<\/code> are different answers.<\/li><li>Read the tag byte by byte. If you read it as a uint32 and pull the characters out with shifts, start with the most significant byte, or you'll get <code>pamc<\/code> for <code>cmap<\/code>.<\/li><li>Skip 6 bytes after <code>numTables<\/code>. If you skip 4 or 8, you read every record from the wrong position.<\/li><li><code>checkSum<\/code> and <code>offset<\/code> can be 2^31 or more. Keep them in an unsigned 32-bit (or wider) type.<\/li><li>The search fields may be wrong. Don't use them to count the records.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>seek(0)\nreadUint32()                         # scaler type, not needed\nnumTables = readUint16()\nskip(6)                              # searchRange, entrySelector, rangeShift\nrecords = []\nrepeat numTables times:\n    tag = 4 characters, one readUint8() each\n    checkSum = readUint32()\n    offset   = readUint32()\n    length   = readUint32()\n    add (tag, checkSum, offset, length) to records\nwrite &quot;tables&quot;, numTables\nfor each record: write &#x27;table &quot;&#x27; + tag + &#x27;&quot;&#x27;, checkSum, offset, length<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a hand-made directory","test":"02-R1-true-scaler","input":"font tests/02/data/02-R1-true-scaler.bin","output":"tables 3\ntable \"cmap\" 286331153 64 8\ntable \"glyf\" 572662306 72 4\ntable \"head\" 858993459 76 4","image":null,"explain":"<p>The first 60 bytes:<\/p>\n<pre><code>74 72 75 65                  scaler type &#x27;true&#x27;\n00 03                        numTables = 3\nff ff ff ff ff ff            searchRange, entrySelector, rangeShift: skip them\n63 6d 61 70                  tag &quot;cmap&quot;\n11 11 11 11 00 00 00 40 00 00 00 08         checkSum 286331153, offset 64, length 8\n67 6c 79 66                  tag &quot;glyf&quot;\n22 22 22 22 00 00 00 48 00 00 00 04         checkSum 572662306, offset 72, length 4\n68 65 61 64                  tag &quot;head&quot;\n33 33 33 33 00 00 00 4c 00 00 00 04         checkSum 858993459, offset 76, length 4<\/code><\/pre>\n<p>The 6 bytes of search fields are all <code>ff<\/code> here, where a real font with 3 tables would hold 32, 1 and 16. Your program skips them, so their values don't change the output.<\/p>"},{"label":"Example 2","name":"tags that end in spaces","test":"02-R3-spaces","input":"font tests/02/data/02-R3-spaces.bin","output":"tables 6\ntable \"A   \" 1 108 4\ntable \"CFF \" 2 112 4\ntable \"ab  \" 3 116 4\ntable \"cvt \" 4 120 4\ntable \"head\" 5 124 4\ntable \"zzz \" 6 128 4","image":null,"explain":"<p>The tag <code>A   <\/code> is the byte <code>41<\/code> followed by three spaces (<code>20 20 20<\/code>). All four bytes are part of the tag.<\/p>"},{"label":"Example 3","name":"a real font","test":"02-E2E-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf","output":"tables 18\ntable \"GDEF\" 1324961447 2406324 670\ntable \"GPOS\" 3088890585 2440700 19232\ntable \"GSUB\" 3036347712 2406996 33702\ntable \"OS/2\" 325127274 424 96\ntable \"PfEd\" 383833929 2459932 568\ntable \"cmap\" 2612855665 49020 11978\ntable \"cvt \" 676859925 64812 168\ntable \"fpgm\" 1647248255 61000 3596\ntable \"gasp\" 16 2406316 8\ntable \"glyf\" 810950304 113484 2068620\ntable \"head\" 546057157 300 54\ntable \"hhea\" 34418196 356 36\ntable \"hmtx\" 1631122185 520 48500\ntable \"loca\" 588705204 64980 48504\ntable \"maxp\" 946608241 392 32\ntable \"name\" 4079467112 2182104 2527\ntable \"post\" 4288561555 2184632 221681\ntable \"prep\" 2328730654 64596 214","image":null,"explain":"<p>The records follow tag order, and the tables sit in the file in a different order: <code>head<\/code> comes first in the file (offset 300) but has the eleventh record.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20table%20directory\" target=\"_blank\" rel=\"noopener\">The blog's directory parser<\/a> runs in <code>FontParser<\/code>'s constructor, right after it opens the file. It skips the scaler type, reads <code>numTables<\/code>, skips the three search fields, and then reads each record: the tag as 4 raw bytes turned into a string, followed by the checksum, offset and length. The records go into an <code>unordered_map<\/code> keyed by tag, so every later step finds its table by name, for example the <code>cmap<\/code> table in assignment 03.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet doesn't check the scaler type or verify any checksums. Neither matters for this workbook. A stricter parser would reject files whose scaler type isn't <code>0x00010000<\/code> or <code>&#x27;true&#x27;<\/code> (an <code>&#x27;OTTO&#x27;<\/code> font stores CFF outlines instead of <code>glyf<\/code>), and could check each table's sum of uint32 words against its <code>checkSum<\/code>.<\/p>"}},{"id":"03","num":"3","title":"Map characters to glyphs (cmap format 12)","difficulty":"Medium","tests":24,"problem":"problems/03-cmap.md","entry":"solutions/assignments/assignment_03_cmap.cpp","files":[{"path":"solutions/assignments/assignment_03_cmap.cpp","role":"entry","purpose":null,"job":"Read the `font` line, turn the `table \"cmap\"` line into a table record (you need its offset), and load the character map once with your `Cmap` code. If loading reports no usable subtable, write the single line `unsupported`. Otherwise answer each `count` and `lookup` line in input order, in the formats the Output section gives.","blank":"// ======================================================================================\n// Assignment 03: Map characters to glyphs (cmap format 12)\n// Problem: problems/03-cmap.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 03 as `build/solutions/assignment_03.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 03`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `font` line, turn the `table \"cmap\"` line into a table record (you need its\n//   offset), and load the character map once with your `Cmap` code. If loading reports no\n//   usable subtable, write the single line `unsupported`. Otherwise answer each `count`\n//   and `lookup` line in input order, in the formats the Output section gives.\n//\n// The other files of this assignment:\n//   You also write src/font/Cmap.h and src/font/Cmap.cpp in this assignment; each one\n//   gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h and src/font/FontParser.h.\n//   Include them by their path under src/, e.g. #include \"font/Cmap.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 03: Map characters to glyphs (cmap format 12)\n// Problem: problems/03-cmap.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 03 as `build/solutions/assignment_03.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 03`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/font/Cmap.h and src/font/Cmap.cpp in this assignment; each one\n//   gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h and src/font/FontParser.h.\n//   Include them by their path under src/, e.g. #include \"font/Cmap.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/Cmap.h\"\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  t.tag = line.substr(open + 1, close - open - 1);\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[t.tag] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `count` or `lookup U+XXXX`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"count\" || keyword == \"lookup\") queries.push_back(line);\n    }\n    ByteReader reader(path);\n\n    std::unordered_map<uint32_t, uint32_t> glyphFor;\n    try {\n      glyphFor = loadUnicodeToGlyphCodeMap(reader, tables);\n    } catch (const UnsupportedCmap&) {\n      output << \"unsupported\\n\";\n      return 0;\n    }\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword, codePoint;\n      words >> keyword >> codePoint;\n      if (keyword == \"count\") {\n        output << \"count \" << glyphFor.size() << '\\n';\n      } else {\n        const auto found = glyphFor.find(std::stoul(codePoint.substr(2), nullptr, 16));  // skip \"U+\"\n        output << \"lookup \" << codePoint << ' ';\n        if (found == glyphFor.end()) output << \"none\\n\";\n        else output << found->second << '\\n';\n      }\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/font/Cmap.h","role":"new","purpose":"This header declares your reader for the `cmap` table, the font's map from each character to the glyph that draws it. It reads the format 12 subtable, which covers the full Unicode range, and assignment 18 looks up every character of a line of text in the result.","job":"Declare a function that reads a font's character map, given your `ByteReader` and the table records from your `FontParser`. Its result should give the number of mapped code points and the glyph id for a code point, or no glyph if the map doesn't cover it. Also declare how the function reports a font without a usable subtable, such as an exception type.","blank":"#pragma once\n// ======================================================================================\n// Assignment 03: Map characters to glyphs (cmap format 12)\n// Problem: problems/03-cmap.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for the `cmap` table, the font's map from each\n//   character to the glyph that draws it. It reads the format 12 subtable, which covers\n//   the full Unicode range, and assignment 18 looks up every character of a line of text\n//   in the result.\n//\n// Your job:\n//   Declare a function that reads a font's character map, given your `ByteReader` and the\n//   table records from your `FontParser`. Its result should give the number of mapped code\n//   points and the glyph id for a code point, or no glyph if the map doesn't cover it.\n//   Also declare how the function reports a font without a usable subtable, such as an\n//   exception type.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 03: Map characters to glyphs (cmap format 12)\n// Problem: problems/03-cmap.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for the `cmap` table, the font's map from each\n//   character to the glyph that draws it. It reads the format 12 subtable, which covers\n//   the full Unicode range, and assignment 18 looks up every character of a line of text\n//   in the result.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <stdexcept>\n#include <unordered_map>\n\n#include \"font/ByteReader.h\"\n#include \"font/FontParser.h\"\n\n// The font has no format 12 subtable for the full Unicode range (platform 0, encoding 4).\nstruct UnsupportedCmap : std::runtime_error {\n  using std::runtime_error::runtime_error;\n};\n\n// Code point -> glyph id, for every character the font maps.\nstd::unordered_map<uint32_t, uint32_t> loadUnicodeToGlyphCodeMap(ByteReader& reader, const Tables& tables);\n"},{"path":"solutions/src/font/Cmap.cpp","role":"new","purpose":"This file reads the platform 0 / encoding 4 subtable of `cmap` into a map from character to glyph. Assignment 18 builds this map once per font.","job":"Find the encoding record with platform 0 and encoding 4, check that its subtable is format 12, and read its groups so your code can look up every code point they cover. Report the two `unsupported` cases (no such record, or another format) the way your header declares.","blank":"// ======================================================================================\n// Assignment 03: Map characters to glyphs (cmap format 12)\n// Problem: problems/03-cmap.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads the platform 0 / encoding 4 subtable of `cmap` into a map from\n//   character to glyph. Assignment 18 builds this map once per font.\n//\n// Your job:\n//   Find the encoding record with platform 0 and encoding 4, check that its subtable is\n//   format 12, and read its groups so your code can look up every code point they cover.\n//   Report the two `unsupported` cases (no such record, or another format) the way your\n//   header declares.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 03: Map characters to glyphs (cmap format 12)\n// Problem: problems/03-cmap.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads the platform 0 / encoding 4 subtable of `cmap` into a map from\n//   character to glyph. Assignment 18 builds this map once per font.\n//\n// Your job:\n//   Find the encoding record with platform 0 and encoding 4, check that its subtable is\n//   format 12, and read its groups so your code can look up every code point they cover.\n//   Report the two `unsupported` cases (no such record, or another format) the way your\n//   header declares. The Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/Cmap.h\"\n\nstd::unordered_map<uint32_t, uint32_t> loadUnicodeToGlyphCodeMap(ByteReader& reader, const Tables& tables) {\n  // TODO: find the subtable, check its format, and expand every group (problem page). Throw\n  // UnsupportedCmap when the font has no format 12 subtable for platform 0, encoding 4.\n  throw std::logic_error(\"not implemented: loadUnicodeToGlyphCodeMap\");\n}\n"}],"buildsOn":[{"path":"solutions/src/font/ByteReader.h","owner":"01","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines."},{"path":"solutions/src/font/FontParser.h","owner":"02","purpose":"This header declares the code that opens a font and reads its table directory: the tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...). Assignments 03 to 05 find their tables by tag in these records, and assignment 18 opens the font through it."}],"indent":2,"tags":[{"label":"Language","items":["32-bit unsigned integers","hexadecimal","nested loops","exceptions"],"text":["32-bit unsigned integers","hexadecimal","nested loops","exceptions"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>seekg<\/code>)","<code>std::unordered_map<\/code> (or <code>std::map<\/code>, or a sorted <code>std::vector<\/code> with binary search)"],"text":["std::ifstream in binary mode (seekg)","std::unordered_map (or std::map, or a sorted std::vector with binary search)"]},{"label":"Concepts","items":["Unicode code points (U+XXXX) beyond the BMP","glyph ids","the <code>cmap<\/code> table","encoding records","format 12 range groups","big-endian byte order"],"text":["Unicode code points (U+XXXX) beyond the BMP","glyph ids","the cmap table","encoding records","format 12 range groups","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font's character map and answers two kinds of question: how many characters it maps, and which glyph a given character maps to.<\/p>\n<p>A <strong>code point<\/strong> is a character's number in Unicode, written <code>U+<\/code> and hexadecimal digits: <code>A<\/code> is U+0041. A <strong>glyph<\/strong> is a shape the font can draw, and its <strong>glyph id<\/strong> is its number in the font, from 0 up. The <strong>character map<\/strong> (the <code>cmap<\/code> table) lists the glyph id for each code point. Your program reads one part of it: the platform 0 / encoding 4 subtable in format 12, described below.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these lines, in this order:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>table &quot;cmap&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>The <code>cmap<\/code> table's record from the table directory, written as assignment 02 writes it. Your program needs only <code>offset<\/code>: where <code>cmap<\/code> starts, in bytes from the start of the file.<\/td><\/tr><tr><td><code>count<\/code><\/td><td>Asks for the number of code points the subtable maps.<\/td><\/tr><tr><td><code>lookup U+&lt;hex&gt;<\/code><\/td><td>Asks which glyph this code point maps to. The code point is in hexadecimal, uppercase, with 4 to 6 digits (<code>U+0041<\/code>, <code>U+1F600<\/code>, <code>U+10FFFD<\/code>).<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There are one or more <code>count<\/code> and <code>lookup<\/code> lines, in any mix.<\/p>\n<p>Your program can parse the <code>table<\/code> line into the table record your <code>FontParser<\/code> from assignment 02 declares, and read the font with your <code>ByteReader<\/code> from assignment 01.<\/p>\n<h3>Output<\/h3>\n<p>If the font has no platform 0 / encoding 4 subtable in format 12 (see below), write the single line <code>unsupported<\/code> and nothing else.<\/p>\n<p>Otherwise write one line per question, in input order:<\/p>\n<ul><li><code>count<\/code> → <code>count &lt;n&gt;<\/code>, the number of code points the subtable maps<\/li><li><code>lookup U+&lt;hex&gt;<\/code> → <code>lookup U+&lt;hex&gt; &lt;glyphId&gt;<\/code>, or <code>lookup U+&lt;hex&gt; none<\/code> if no group covers the code point. Write the code point as it appears in the input.<\/li><\/ul>\n<h3>The <code>cmap<\/code> table<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>. Every offset inside <code>cmap<\/code> counts from the start of the <code>cmap<\/code> table, not from the start of the file.<\/p>\n<p><strong>Header<\/strong>, 4 bytes, at the table's offset:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>version<\/code><\/td><td>uint16<\/td><td>0 (skip it)<\/td><\/tr><tr><td><code>numberSubtables<\/code><\/td><td>uint16<\/td><td>How many encoding records follow<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Encoding records<\/strong>: <code>numberSubtables<\/code> of them, 8 bytes each, right after the header:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>platformID<\/code><\/td><td>uint16<\/td><td>0 = Unicode, 1 = Macintosh, 3 = Windows<\/td><\/tr><tr><td><code>encodingID<\/code><\/td><td>uint16<\/td><td>Meaning depends on the platform. For platform 0: 3 = Unicode, BMP only (code points up to U+FFFF); 4 = Unicode, full repertoire; 5 = variation sequences<\/td><\/tr><tr><td><code>offset<\/code><\/td><td>uint32<\/td><td>Where this record's subtable starts, from the start of <code>cmap<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Which subtable.<\/strong> Every subtable starts with a uint16 <code>format<\/code>. Find the <strong>(0, 4) record<\/strong>, the one with <code>platformID<\/code> 0 and <code>encodingID<\/code> 4:<\/p>\n<ul><li>If it exists and its subtable is format 12, use that subtable, wherever the record is in the list.<\/li><li>If there is no such record, the answer is <code>unsupported<\/code>.<\/li><li>If its subtable's format isn't 12, the answer is also <code>unsupported<\/code>.<\/li><li>Ignore every other record, even one that points to a format 12 subtable.<\/li><\/ul>\n<p>Fonts also use format 4 for BMP-only maps, format 13 for \"many codes, one glyph\" maps, and format 14 for variation sequences. Your program reads only format 12.<\/p>\n<p><strong>Format 12 subtable<\/strong> (\"segmented coverage\"):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>format<\/code><\/td><td>uint16<\/td><td>12<\/td><\/tr><tr><td><code>reserved<\/code><\/td><td>uint16<\/td><td>0<\/td><\/tr><tr><td><code>length<\/code><\/td><td>uint32<\/td><td>Length of the subtable in bytes, header included<\/td><\/tr><tr><td><code>language<\/code><\/td><td>uint32<\/td><td>0 for Unicode subtables<\/td><\/tr><tr><td><code>numGroups<\/code><\/td><td>uint32<\/td><td>How many groups follow<\/td><\/tr><tr><td><code>groups[numGroups]<\/code><\/td><td>12 bytes each<\/td><td>See below<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Your program skips <code>reserved<\/code>, <code>length<\/code> and <code>language<\/code>, 10 bytes in all.<\/p>\n<p><strong>One group<\/strong>, 12 bytes:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>startCharCode<\/code><\/td><td>uint32<\/td><td>First code point in the group<\/td><\/tr><tr><td><code>endCharCode<\/code><\/td><td>uint32<\/td><td>Last code point in the group, <strong>included<\/strong><\/td><\/tr><tr><td><code>startGlyphID<\/code><\/td><td>uint32<\/td><td>Glyph id of <code>startCharCode<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>A code point c with <code>startCharCode<\/code> ≤ c ≤ <code>endCharCode<\/code> maps to glyph <code>startGlyphID<\/code> + (c − <code>startCharCode<\/code>). A group of one code point has <code>startCharCode<\/code> = <code>endCharCode<\/code>. The groups come in increasing order and don't overlap, so the subtable maps Σ (<code>endCharCode<\/code> − <code>startCharCode<\/code> + 1) code points in total.<\/p>\n<p>Code points go up to U+10FFFF, so they need 32 bits. Format 4 stores 16-bit codes and can't reach emoji, rare CJK characters or the Nerd Font icons in JetBrains Mono, and format 12 exists to cover them.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Your program reads the subtable whose record has platform 0 and encoding 4, wherever that record is in the list, and ignores the others, including format 12 subtables with different mappings.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Each group maps every code point from <code>startCharCode<\/code> to <code>endCharCode<\/code>, both included, to consecutive glyph ids starting at <code>startGlyphID<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Code points above U+FFFF follow the same rules as the rest, as 32-bit numbers.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A code point that no group covers gives <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>count<\/code> is the number of code points the subtable maps.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>If there is no (0, 4) record, or its subtable isn't format 12, the whole output is the single line <code>unsupported<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>The tests' subtables map up to about 17,000 code points, in up to about 5,500 groups. Every group has <code>startCharCode<\/code> ≤ <code>endCharCode<\/code> ≤ U+10FFFF.<\/li><li>The groups come in increasing <code>startCharCode<\/code> order and don't overlap. There is at most one (0, 4) record.<\/li><li>Each input has at most 100 questions.<\/li><li>Each case has a 10-second limit. A correct solution finishes in under a second.<\/li><li>There are 24 tests: both real fonts (ASCII, Latin-1, Nerd Font icons above U+F0000, kanji and kana, CJK characters above U+FFFF, unmapped code points, counts), small fonts built with fontTools (decoy subtables, (0, 4) listed last, long runs, one-code groups, emoji-range codes, gaps, and four kinds of unsupported <code>cmap<\/code>: no (0, 4) record at all, a (0, 4) record pointing to a format 4 or a format 13 subtable, and a format 12 subtable listed only under (3, 10)), and random character maps.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/font/Cmap.h","text":"#pragma once\n// Assignment 03: which glyph draws each character (the cmap table, format 12).\n\n#include <cstdint>\n#include <stdexcept>\n#include <unordered_map>\n\n#include \"font/ByteReader.h\"\n#include \"font/FontParser.h\"\n\n// The font has no format 12 subtable for the full Unicode range (platform 0, encoding 4).\nstruct UnsupportedCmap : std::runtime_error {\n  using std::runtime_error::runtime_error;\n};\n\n// Code point -> glyph id, for every character the font maps.\nstd::unordered_map<uint32_t, uint32_t> loadUnicodeToGlyphCodeMap(ByteReader& reader, const Tables& tables);\n"},{"path":"src/font/Cmap.cpp","text":"#include \"font/Cmap.h\"\n\n#include <optional>\n\nstd::unordered_map<uint32_t, uint32_t> loadUnicodeToGlyphCodeMap(ByteReader& reader, const Tables& tables) {\n  const uint32_t cmap = tables.at(\"cmap\").offset;\n  reader.jumpTo(cmap);\n  reader.readUint16();  // version\n  const uint16_t numberSubtables = reader.readUint16();\n\n  std::optional<uint32_t> subtable;  // offset from the start of cmap\n  for (uint16_t i = 0; i < numberSubtables; ++i) {\n    const uint16_t platformID = reader.readUint16();\n    const uint16_t encodingID = reader.readUint16();\n    const uint32_t offset = reader.readUint32();\n    if (platformID == 0 && encodingID == 4 && !subtable) subtable = offset;\n  }\n  if (!subtable) throw UnsupportedCmap(\"no platform 0 / encoding 4 subtable\");\n\n  reader.jumpTo(cmap + *subtable);\n  if (reader.readUint16() != 12) throw UnsupportedCmap(\"the (0, 4) subtable is not format 12\");\n  reader.skipBytes(10);  // reserved (uint16), length (uint32), language (uint32)\n  const uint32_t nGroups = reader.readUint32();\n\n  std::unordered_map<uint32_t, uint32_t> glyphFor;\n  for (uint32_t g = 0; g < nGroups; ++g) {\n    const uint32_t startCharCode = reader.readUint32();\n    const uint32_t endCharCode = reader.readUint32();\n    const uint32_t startGlyphID = reader.readUint32();\n    for (uint64_t c = startCharCode; c <= endCharCode; ++c)  // both ends included\n      glyphFor[static_cast<uint32_t>(c)] = startGlyphID + static_cast<uint32_t>(c - startCharCode);\n  }\n  return glyphFor;\n}\n"},{"path":"assignments/assignment_03_cmap.cpp","text":"// Assignment 03 (map characters to glyphs): answers a test input's lookups.\n// The map is read by src/font/Cmap.\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/Cmap.h\"\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  t.tag = line.substr(open + 1, close - open - 1);\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[t.tag] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `count` or `lookup U+XXXX`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"count\" || keyword == \"lookup\") queries.push_back(line);\n    }\n    ByteReader reader(path);\n\n    std::unordered_map<uint32_t, uint32_t> glyphFor;\n    try {\n      glyphFor = loadUnicodeToGlyphCodeMap(reader, tables);\n    } catch (const UnsupportedCmap&) {\n      output << \"unsupported\\n\";\n      return 0;\n    }\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword, codePoint;\n      words >> keyword >> codePoint;\n      if (keyword == \"count\") {\n        output << \"count \" << glyphFor.size() << '\\n';\n      } else {\n        const auto found = glyphFor.find(std::stoul(codePoint.substr(2), nullptr, 16));  // skip \"U+\"\n        output << \"lookup \" << codePoint << ' ';\n        if (found == glyphFor.end()) output << \"none\\n\";\n        else output << found->second << '\\n';\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/font/ByteReader.h","src/font/FontParser.h","src/font/ByteReader.cpp","src/font/FontParser.cpp"],"proof":{"passed":24,"total":24,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=cmap%20table\" target=\"_blank\" rel=\"noopener\">cmap table<\/a> section up to the paragraph that starts \"In the implementation, simply loop\". The author's code follows that paragraph.<\/p>","readTitle":"Read in the blog first","context":"<p>A font stores glyphs, numbered 0, 1, 2, ..., and its <code>cmap<\/code> table maps each character's code point to a glyph id. Assignment 04 then turns the glyph id into the byte offset of the glyph's outline, and assignment 07 decodes the outline there. Assignment 18 looks up every character of its text in the map you read here.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6cmap.html\" target=\"_blank\" rel=\"noopener\">'cmap' table<\/a> (the header, the subtable list and \"Format 12\")<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/cmap\" target=\"_blank\" rel=\"noopener\">cmap: Character to Glyph Index Mapping Table<\/a> (platform and encoding IDs, \"Format 12: Segmented coverage\", \"Format 13: Many-to-one range mappings\")<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=cmap%20table\" target=\"_blank\" rel=\"noopener\">cmap table<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 03                         run every test\n.\\check 03 -Case 03-R4-gaps        one test, showing its full input, expected output and your output\n.\\check 03 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 03 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  Every group maps startCharCode..endCharCode (both included) ..........    1 / 4   FAILED\n      x 03-R2-long-runs  two long groups: U+0100-U+04FF (1024 codes) and U+3041-U+3096\n          line 5: expected `lookup U+04FF 1024`, got `lookup U+04FF none`\n          likely cause: R2 - Every group maps startCharCode..endCharCode (both included)\n          expected values from: fontTools 4.67.0 cmap.getcmap(0, 4) and getGlyphID, cross-checked against a struct parse\n          reproduce: build/solutions/assignment_03.exe build/cases/03/03-R2-long-runs.in build/cases/03/03-R2-long-runs.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Your program makes three hops: the <code>cmap<\/code> header, the right encoding record, then the subtable and its groups. The offset in an encoding record counts from the start of <code>cmap<\/code>, so the subtable is at (<code>cmap<\/code> offset + record offset) in the file.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Read every encoding record and remember the offset of the one with platform 0 and encoding<\/p>\n<ol><li>Jump to it and read the format; if there is no such record or the format isn't 12, report an unsupported font (the Boilerplate throws <code>UnsupportedCmap<\/code>). Otherwise skip the 10 bytes of <code>reserved<\/code>, <code>length<\/code> and <code>language<\/code>, read <code>numGroups<\/code>, and for each group put every code point from start to end into a hash map with its glyph id. <code>count<\/code> is then the size of the map.<\/li><\/ol>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>The (0, 4) record may not come first. JetBrains Mono lists (0, 3) first, and that one is format 4.<\/li><li>Don't take the first format 12 subtable you find. The (3, 10) subtable often holds the same mappings, but the spec doesn't require it, and two tests contain decoys with different mappings.<\/li><li>The range includes <code>endCharCode<\/code>: loop with <code>&lt;=<\/code>, not <code>&lt;<\/code>.<\/li><li>Keep code points in 32-bit (or wider) variables everywhere. A <code>uint16_t<\/code> key turns U+1F600 into U+F600. If your loop counter has the same type as <code>endCharCode<\/code>, <code>c &lt;= end<\/code> can never become false when end is the largest value of that type; a 64-bit counter avoids that.<\/li><li>Format 13 has the same layout as format 12. Check the format number.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>cmap = tables[&quot;cmap&quot;].offset\nseek(cmap); skip(2)                        # version\nn = read_u16()\nsubtable = none\nrepeat n times:\n    platform = read_u16(); encoding = read_u16(); offset = read_u32()\n    if platform == 0 and encoding == 4 and subtable is none: subtable = offset\nif subtable is none: report unsupported\nseek(cmap + subtable)\nif read_u16() != 12: report unsupported\nskip(10)                                   # reserved, length, language\nmap = {}\nrepeat read_u32() times:                   # numGroups\n    start = read_u32(); end = read_u32(); glyph = read_u32()\n    for c from start to end, both included:\n        map[c] = glyph + (c - start)\nreturn map<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"two groups","test":"03-R4-gaps","input":"font tests/03/data/03-R4-gaps.ttf\ntable \"cmap\" 786752 476 52\nlookup U+002F\nlookup U+0030\nlookup U+0039\nlookup U+003A\nlookup U+0040\nlookup U+0041\nlookup U+0046\nlookup U+0047\nlookup U+0061","output":"lookup U+002F none\nlookup U+0030 1\nlookup U+0039 10\nlookup U+003A none\nlookup U+0040 none\nlookup U+0041 20\nlookup U+0046 25\nlookup U+0047 none\nlookup U+0061 none","image":null,"explain":"<p>The 52 bytes at offset 476:<\/p>\n<pre><code>00 00 00 01                  version 0, numberSubtables 1\n00 00 00 04 00 00 00 0c      platform 0, encoding 4, subtable at cmap + 12\n00 0c 00 00                  format 12, reserved\n00 00 00 28 00 00 00 00      length 40, language 0\n00 00 00 02                  numGroups 2\n00 00 00 30 00 00 00 39 00 00 00 01     U+0030..U+0039 (&#x27;0&#x27;..&#x27;9&#x27;) -&gt; glyphs 1..10\n00 00 00 41 00 00 00 46 00 00 00 14     U+0041..U+0046 (&#x27;A&#x27;..&#x27;F&#x27;) -&gt; glyphs 20..25<\/code><\/pre>\n<p>U+0039 is the last code of the first group, so it maps to 1 + (0x39 − 0x30) = 10. U+003A, one past the end, is in no group.<\/p>"},{"label":"Example 2","name":"a real font","test":"03-R1-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"cmap\" 2612855665 49020 11978\nlookup U+0041\nlookup U+0061\nlookup U+0030\nlookup U+20AC\ncount","output":"lookup U+0041 37\nlookup U+0061 69\nlookup U+0030 20\nlookup U+20AC 744\ncount 11743","image":null,"explain":"<p>JetBrains Mono's <code>cmap<\/code> has 5 encoding records: (0, 3) at <code>cmap<\/code> + 44, (0, 4) at <code>cmap<\/code> + 8728, (1, 0), (3, 1) and (3, 10). The first record points to a format 4 subtable, so your program has to keep looking. The (0, 4) subtable at byte 49020 + 8728 = 57748 has 226 groups. The second group is <code>00 00 00 20 00 00 00 7e 00 00 00 04<\/code>: U+0020..U+007E → glyphs 4..98, which puts U+0041 at glyph 4 + (0x41 − 0x20) = 4 + 33 = 37.<\/p>"},{"label":"Example 3","name":"a format 13 subtable","test":"03-R6-format13","input":"font tests/03/data/03-R6-format13.ttf\ntable \"cmap\" 1442434 412 104\ncount\nlookup U+0041\nlookup U+0042","output":"unsupported","image":null,"explain":"<p>This font's (0, 4) record points to a format 13 subtable. Format 13 has the same layout as format 12, but every code in a group maps to the <em>same<\/em> glyph. Reading it as format 12 would give wrong answers, so your program has to check the format.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Unicode%E2%86%92GlyphCode%20mapping\" target=\"_blank\" rel=\"noopener\">The blog's character map loader<\/a>, <code>loadUnicodeToGlyphCodeMap<\/code>, jumps to <code>cmap<\/code>, skips the version, and loops over every encoding record, keeping the offset of a platform 0 / encoding 4 record. It throws \"Not supported format\" if there is none, or if the subtable's format isn't 12. Then it skips the 10 header bytes, reads the group count, and expands every group into an <code>unordered_map<\/code> from code point to glyph id, <code>unicodeToGlyphCode<\/code>, which later steps look characters up in.<\/p>\n<p><strong>Something to look for:<\/strong> the loop doesn't stop at the first match, so if a font had two (0, 4) records, the loader would keep the last one. The spec doesn't allow duplicate records (fontTools won't write them), so this makes no difference in practice. Expanding every group trades memory for simpler code: a font that maps most of Unicode would need over a million map entries, while the sorted groups with a binary search stay small. Many fonts that cover only the BMP have a format 4 subtable and no format 12 one (like test <code>03-R6-format4-only<\/code>). A complete renderer would read format 4 as a fallback.<\/p>"}},{"id":"04","num":"4","title":"Locate glyph records (loca)","difficulty":"Medium","tests":18,"problem":"problems/04-loca.md","entry":"solutions/assignments/assignment_04_loca.cpp","files":[{"path":"solutions/assignments/assignment_04_loca.cpp","role":"entry","purpose":null,"job":"Read the `font` line, turn the four `table` lines (`glyf`, `head`, `loca`, `maxp`) into table records, collect the `glyph` ids, and load the locations once with your `Loca` code. Write the `glyphs <numGlyphs> loca <short|long>` line, then one `glyph <id> <offset> <length>` line per requested id, in input order.","blank":"// ======================================================================================\n// Assignment 04: Locate glyph records (loca)\n// Problem: problems/04-loca.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 04 as `build/solutions/assignment_04.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 04`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `font` line, turn the four `table` lines (`glyf`, `head`, `loca`, `maxp`)\n//   into table records, collect the `glyph` ids, and load the locations once with your\n//   `Loca` code. Write the `glyphs <numGlyphs> loca <short|long>` line, then one `glyph\n//   <id> <offset> <length>` line per requested id, in input order.\n//\n// The other files of this assignment:\n//   You also write src/font/Loca.h and src/font/Loca.cpp in this assignment; each one\n//   gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h and src/font/FontParser.h.\n//   Include them by their path under src/, e.g. #include \"font/Loca.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 04: Locate glyph records (loca)\n// Problem: problems/04-loca.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 04 as `build/solutions/assignment_04.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 04`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/font/Loca.h and src/font/Loca.cpp in this assignment; each one\n//   gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h and src/font/FontParser.h.\n//   Include them by their path under src/, e.g. #include \"font/Loca.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/Loca.h\"\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  t.tag = line.substr(open + 1, close - open - 1);\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[t.tag] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<uint32_t> ids;  // from the `glyph <id>` lines\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        words >> path;\n      } else if (keyword == \"table\") {\n        addTable(line, tables);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        words >> id;\n        ids.push_back(id);\n      }\n    }\n    ByteReader reader(path);\n\n    const GlyphLocations loca = loadGlyphLocations(reader, tables);\n    output << \"glyphs \" << loca.numGlyphs << \" loca \" << (loca.longFormat ? \"long\" : \"short\") << '\\n';\n    for (const uint32_t id : ids) {\n      if (id >= loca.glyphs.size())\n        throw std::runtime_error(\"glyph \" + std::to_string(id) + \" is missing: loadGlyphLocations returned \" +\n                                 std::to_string(loca.glyphs.size()) + \" glyphs\");\n      output << \"glyph \" << id << ' ' << loca.glyphs[id].offset << ' ' << loca.glyphs[id].length << '\\n';\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implem
