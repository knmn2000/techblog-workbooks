---------\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::unique_ptr<Canvas> canvas;\n    Placement place;\n    Style style;\n    RGB color{255, 255, 255};\n    Outline outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<Canvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness> <markerSize>\n        words >> style.lineThickness >> style.markerSize;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = Outline{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3) {\n          outline.points.push_back(Point{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        }\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        drawOutline(*canvas, outline, place, style, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    if (!canvas->writePng(argv[2])) throw std::runtime_error(std::string(\"cannot write \") + argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":22,"total":22,"date":"2026-10-21"},"uses":["include/provided/Canvas.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Render%20outlines%20as%20straight%20lines\" target=\"_blank\" rel=\"noopener\">Render outlines as straight lines<\/a> section up to and including the paragraph that starts \"The glyph coordinates are\". The author's code comes right after it.<\/p>","context":"<p>Checkpoint 7 decodes a glyph into contours of points; checkpoint 6 draws lines and squares. This checkpoint puts the two together and draws the first picture of a real glyph: every contour as a closed polygon, with a square on each point. It ignores curves on purpose. Checkpoint 11 draws the same outlines with proper curves.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: contours, points and font units<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>: how <code>endPtsOfContours<\/code> splits the points into contours<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Render%20outlines%20as%20straight%20lines\" target=\"_blank\" rel=\"noopener\">Render outlines as straight lines<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 08                         run every test\n.\\check 08 -Case 08-R2-triangle    one test, showing its full input and where your picture is\n.\\check 08 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 08 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>Open your picture (<code>build/cases/08/&lt;id&gt;.out.png<\/code>) next to the expected one (<code>tests/08/expected/&lt;id&gt;.png<\/code>) and the diff the checker writes. A failing test looks like this:<\/p>\n<pre><code>  R2  Every contour is closed: its last point joins its first ..............    0 / 2   FAILED\n      x 08-R2-triangle  hand-made triangle: the third side is the closing line\n          1127 pixels missing, e.g. (116, 21) should be white (beyond the 1-pixel edge tolerance). Diff: build/cases/08/08-R2-triangle.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven\n          likely cause: R2 - Every contour is closed: its last point joins its first\n          expected values from: hand-made outline; picture checked against the ideal segments and markers\n          reproduce: build/p08.exe build/cases/08/08-R2-triangle.in build/cases/08/08-R2-triangle.out.png<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write a small function that turns one font point into a pixel (the two formulas above, then round). Check it on Example 1 by hand before drawing anything.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Walk the contours with a running start index: contour k runs from <code>first<\/code> to <code>ends[k]<\/code>, then <code>first = ends[k] + 1<\/code>. Inside a contour, the point after <code>i<\/code> is <code>i + 1<\/code>, except after the last point, where it is <code>first<\/code>. Draw all lines, then loop over all points once more for the markers.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Subtract <code>scale * y<\/code> from the baseline; adding it draws the glyph upside down and mostly off the canvas.<\/li><li>Apply the scale to the coordinates only: <code>x0 + scale * x<\/code>, not <code>scale * (x0 + x)<\/code>.<\/li><li>The closing line goes back to the contour's own first point, not to point 0 of the outline.<\/li><li>Don't round a coordinate with a plain cast if it can be negative: <code>(int)-2.7<\/code> is -2. <code>std::lround<\/code> rounds to the nearest.<\/li><li>Each outline may have its own <code>place<\/code>, <code>style<\/code> and <code>color<\/code>; use the most recent ones (the boilerplate keeps track of them for you).<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>pixel(p) = (round(x0 + scale * p.x), round(baseline - scale * p.y))\n\ndrawOutline(outline):\n    first = 0\n    for last in outline.ends:\n        for i in first .. last:\n            next = (i == last) ? first : i + 1\n            drawLine(pixel(points[i]), pixel(points[next]), lineThickness, color)\n        first = last + 1\n    for p in points:\n        (x, y) = pixel(p)\n        drawRect(x, y, markerSize, markerSize, color)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a triangle","test":"08-R2-triangle","input":"canvas 430 350\nplace 15 335 0.8\nstyle 3 9\ncolor 255 255 255\noutline\nends 2\npoints 0 0 on 500 0 on 130 400 off","output":"a 430 x 350 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa4AAAFeCAIAAABSBWzUAAAFn0lEQVR42u3Y243gNhREQeafNJUAKUAAKT666t R2-triangle.png<\/figcaption><\/figure>\n<div class=\"table-wrap\"><table><thead><tr><th>Point<\/th><th>Font units<\/th><th>px = 15 + 0.8x<\/th><th>py = 335 - 0.8y<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>(0, 0)<\/td><td>15<\/td><td>335<\/td><\/tr><tr><td>1<\/td><td>(500, 0)<\/td><td>415<\/td><td>335<\/td><\/tr><tr><td>2<\/td><td>(130, 400)<\/td><td>119<\/td><td>15<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>ends 2<\/code> means one contour with points 0 to 2. The lines are 0 → 1, 1 → 2 and the closing line 2 → 0. Point 2 is <code>off<\/code>, but here it is joined with straight lines like the others. Then each point gets a 9 x 9 square: point 2's covers columns 115 to 123 and rows 11 to 19.<\/p>"},{"label":"Example 2","name":"the hyphen","test":"08-R1-hyphen","input":"canvas 352 148\nplace -124 404 1\nstyle 3 10\ncolor 255 255 255\noutline\nends 3\npoints 140 272 on 140 388 on 460 388 on 460 272 on","output":"a 352 x 148 PNG: a 320 x 116 rectangle outline from (16, 16) to (336, 132)","image":null,"explain":"<p><code>x0<\/code> is negative here: font x = 140 lands on pixel 140 - 124 = 16. The hyphen's bottom edge (y = 272) lands on row 404 - 272 = 132 and its top edge (y = 388) on row 16, so the top edge is higher up in the picture, as it should be.<\/p>"},{"label":"Example 3","name":"two outlines","test":"08-R5-two","input":"canvas 470 300\nplace 0 260 0.35\nstyle 2 7\ncolor 255 220 0\noutline\nends 7 16\npoints 35 0 on 219 730 on 380 730 on 565 0 on 437 0 on 397 177 on 203 177 on 163 0 on 226 279 on 374 279 on 330 475 on 319 524 off 303 603 off 300 621 on 297 603 off 281 524 off 270 476 on\nplace 230 280 0.3\nstyle 3 9\ncolor 0 220 220\noutline\nends 17 26 35\npoints 77 0 on 77 730 on 301 730 on 406 730 off 531 628 off 531 542 on 531 482 off 462 396 off 407 387 on 407 385 on 448 380 off 512 331 off 548 254 off 548 208 on 548 145 off 490 51 off 384 0 off 312 0 on 199 429 on 299 429 on 348 429 off 406 482 off 406 528 on 406 573 off 349 626 off 299 626 on 199 igure>\n<p>The second outline uses the second <code>place<\/code>, <code>style<\/code> and <code>color<\/code>. <code>B<\/code> has three contours (<code>ends 17 26 35<\/code>): points 0 to 17, 18 to 26 and 27 to 35, each closed on its own.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Render%20outlines%20as%20straight%20lines\" target=\"_blank\" rel=\"noopener\">The blog's <code>renderGlyphOutline<\/code><\/a> takes a start position, the glyph and a colour. It walks the contours with a running start index, and at a contour's last point it sets the next point back to the contour's first point, just like Hint 2. It draws each line with thickness 5 and puts a 20 x 20 square on the current point in the same loop. Its <code>main<\/code> draws <code>a<\/code> from JetBrains Mono Bold at (300, 300) on a 1200 x 1200 canvas; test <code>08-E2E-blog-a<\/code> is the same picture at half size.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet doesn't flip y itself. It adds the start position to the font coordinates and asks stb to flip the whole image vertically when writing the PNG. That works for one glyph, but the start position is then measured from the bottom of the picture. This page uses an explicit baseline instead, which the later checkpoints need when several glyphs share a line of text; the blog switches to a transform matrix (<code>setGlyphBaseline<\/code>) for the same reason in its curve section.<\/p>"}},{"id":"09","num":"9","title":"Resolve compound glyphs","difficulty":"Hard","tests":36,"solution":"solutions/p09_compound_glyph.cpp","problem":"problems/09-compound-glyph.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 09 - Resolve compound glyphs\n//\n// Problem:  problems/09-compound-glyph.md (also in the web problem book)\n// Check:    .\\check 09\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p09.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p09_compound_glyph.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 09 - Resolve compound glyphs\n//\n// Problem:  problems/09-compound-glyph.md (also in the web problem book)\n// Check:    .\\check 09\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on resolveGlyph().\n\n#include <cmath>\n#include <cstdint>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"   // optional: be::u16(file), be::i8(file), be::f2dot14(file), ...\n#include \"provided/SimpleGlyph.h\" // optional: provided::readSimpleGlyph (checkpoint 07's job)\n\n// One simple glyph's outline. Coordinates are doubles because transforms can make\n// them fractional.\nusing provided::Outline;  // { std::vector<int> endPtsOfContours; std::vector<OutlinePoint> points; }\n                          // OutlinePoint: { double x, y; bool onCurve; }\n\nstruct GlyphRecord {\n  uint32_t offset = 0;  // where the glyph's record starts in the file\n  uint32_t length = 0;  // 0 = the glyph has no outline\n};\n\n// Returns the outlines of every simple glyph that `glyphId` is made of, in final\n// position, in depth-first order. `records` holds every glyph the input listed.\nstd::vector<Outline> resolveGlyph(std::ifstream& file, const std::map<uint32_t, GlyphRecord>& records,\n                                  uint32_t glyphId) {\n  // TODO: read the component records and apply their transforms (see the problem page).\n  throw NotImplemented(\"resolveGlyph\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\nstd::string number(const double v) {\n  if (std::abs(v - std::round(v)) < 1e-9) return std::to_string(static_cast<long long>(std::llround(v)));\n  char buf[32];\n  std::snprintf(buf, sizeof buf, \"%.4f\", v);\n  std::string s = buf;\n  while (s.back() == '0') s.pop_back();\n  if (s.back() == '.') s.pop_back();  // 4.99999 rounds to \"5.0000\": print \"5\"\n  return s == \"-0\" ? \"0\" : s;\n}\n\nvoid write(std::ostream& out, const uint32_t id, const std::vector<Outline>& outlines) {\n  out << \"glyph \" << id << \" components \" << outlines.size() << '\\n';\n  for (const Outline& o : outlines) {\n    out << \"ends\";\n    for (const int e : o.endPtsOfContours) out << ' ' << e;\n    out << \"\\npoints\";\n    for (const auto& p : o.points) out << ' ' << number(p.x) << ' ' << number(p.y) << (p.onCurve ? \" on\" : \" off\");\n    out << '\\n';\n  }\n}\n\n}  // namespace\n\n// Usage: p09 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::ifstream font;\n    std::map<uint32_t, GlyphRecord> records;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {  // font <path>\n        std::string path;\n        words >> path;\n        font = std::ifstream(path, std::ios::binary);\n        if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n        records.clear();\n      } else if (keyword == \"glyph\") {  // glyph <id> <offset> <length>\n        uint32_t id = 0;\n        GlyphRecord r;\n        words >> id >> r.offset >> r.length;\n        records[id] = r;\n      } else if (keyword == \"decode\") {  // decode <id>\n        uint32_t id = 0;\n        words >> id;\n        font.clear();\n        write(output, id, resolveGlyph(font, records, id));\n      }\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["recursion","affine transforms as six numbers","signed bytes (<code>int8<\/code>)","fixed-point numbers"],"text":["recursion","affine transforms as six numbers","signed bytes (int8)","fixed-point numbers"]},{"label":"Library","items":["<code>std::ifstream<\/code> (binary)","<code>std::map<\/code>","<code>std::vector<\/code>"],"text":["std::ifstream (binary)","std::map","std::vector"]},{"label":"Concepts","items":["compound glyphs","component records","F2Dot14","composing transforms","depth-first traversal"],"text":["compound glyphs","component records","F2Dot14","composing transforms","depth-first traversal"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that resolves glyphs into the outlines of the simple glyphs they are made of.<\/p>\n<p>Only your program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p09_compound_glyph.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p09_compound_glyph.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>resolveGlyph()<\/code>. The boilerplate also includes <code>provided/SimpleGlyph.h<\/code>, a ready decoder for simple glyphs (checkpoint 07's job), which you can use or replace with your own.<\/p>\n<h3>Input<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file the following lines refer to (relative to the workbook folder). Starts a new font: forget earlier <code>glyph<\/code> lines.<\/td><\/tr><tr><td><code>glyph &lt;id&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>Where glyph <code>id<\/code>'s record is in the file and how long it is (0 = no outline), as checkpoint 04 works out. The input lists every glyph you will need.<\/td><\/tr><tr><td><code>decode &lt;id&gt;<\/code><\/td><td>Resolve glyph <code>id<\/code> and write it out.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each <code>decode<\/code> line, write a header line and then one <code>ends<\/code> / <code>points<\/code> pair per simple glyph the glyph is made of:<\/p>\n<pre><code>glyph &lt;id&gt; components &lt;k&gt;\nends &lt;...&gt;\npoints &lt;x0&gt; &lt;y0&gt; &lt;on|off&gt; &lt;x1&gt; &lt;y1&gt; &lt;on|off&gt; ...\n... (k pairs)<\/code><\/pre>\n<ul><li>An empty glyph (length 0) gives <code>components 0<\/code>. A simple glyph gives <code>components 1<\/code> with its own outline.<\/li><li>Components appear in depth-first order: the order of the component records, and inside a nested compound glyph, its components in their order before moving on. A component that is an empty glyph adds nothing and isn't counted.<\/li><li><code>ends<\/code> and <code>on|off<\/code> are the simple glyph's own values (checkpoint 07). Coordinates are after every transform that applies, so they can be fractional: one of the random tests expects <code>points 338.5 -275.25 on 324.4375 -266.8125 off ...<\/code>. The checker accepts a difference of up to 0.01 per number, so the exact value or anything rounded to two or more decimals passes. The boilerplate's <code>number()<\/code> prints whole numbers plainly and others rounded to 4 decimals with trailing zeros dropped (<code>47.5<\/code>, <code>374.9062<\/code>).<\/li><\/ul>\n<h3>The compound glyph record<\/h3>\n<p>The 10-byte header is the same as for simple glyphs: <code>numberOfContours<\/code> (int16, negative for a compound glyph) and the bounding box (4 x int16, you can ignore it). Component records follow, one after another, until one has MORE_COMPONENTS clear:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>flags<\/code><\/td><td>uint16<\/td><td>See the table below<\/td><\/tr><tr><td><code>glyphIndex<\/code><\/td><td>uint16<\/td><td>The component glyph<\/td><\/tr><tr><td><code>argument1<\/code>, <code>argument2<\/code><\/td><td>int16 each if ARG_1_AND_2_ARE_WORDS is set, otherwise int8 each<\/td><td>The offset (e, f)<\/td><\/tr><tr><td>transform<\/td><td>F2Dot14 x 0, 1, 2 or 4<\/td><td>Depends on the scale flags<\/td><\/tr><\/tbody><\/table><\/div>\n<p>All numbers are big-endian. F2Dot14 is a signed 16-bit number divided by 16384 (checkpoint 01), so <code>40 00<\/code> is 1.0 and <code>c0 00<\/code> is -1.0. <strong>The arguments are signed<\/strong>: the byte <code>e2<\/code> is -30, not 226.<\/p>\n<p><strong>Component flags<\/strong> (bits not listed don't affect the output):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bit<\/th><th>Mask<\/th><th>Name<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>0x0001<\/code><\/td><td>ARG_1_AND_2_ARE_WORDS<\/td><td>The two arguments are int16; otherwise int8<\/td><\/tr><tr><td>1<\/td><td><code>0x0002<\/code><\/td><td>ARGS_ARE_XY_VALUES<\/td><td>The arguments are an x/y offset. Always set in the tests<\/td><\/tr><tr><td>3<\/td><td><code>0x0008<\/code><\/td><td>WE_HAVE_A_SCALE<\/td><td>One F2Dot14 follows: a = d = scale<\/td><\/tr><tr><td>5<\/td><td><code>0x0020<\/code><\/td><td>MORE_COMPONENTS<\/td><td>Another component record follows this one<\/td><\/tr><tr><td>6<\/td><td><code>0x0040<\/code><\/td><td>WE_HAVE_AN_X_AND_Y_SCALE<\/td><td>Two F2Dot14 follow: a, then d<\/td><\/tr><tr><td>7<\/td><td><code>0x0080<\/code><\/td><td>WE_HAVE_A_TWO_BY_TWO<\/td><td>Four F2Dot14 follow: a, b, c, d<\/td><\/tr><tr><td>8<\/td><td><code>0x0100<\/code><\/td><td>WE_HAVE_INSTRUCTIONS<\/td><td>Hinting instructions follow the last component; ignore them<\/td><\/tr><tr><td>11<\/td><td><code>0x0800<\/code><\/td><td>SCALED_COMPONENT_OFFSET<\/td><td>The offset is transformed by a, b, c, d too (see below)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>At most one of bits 3, 6 and 7 is set. With none of them, a = d = 1 and b = c = 0.<\/p>\n<h3>Placing a component<\/h3>\n<p>Every point (x, y) of the component becomes<\/p>\n<pre><code>x&#x27; = a*x + c*y + e\ny&#x27; = b*x + d*y + f<\/code><\/pre>\n<p>where (e, f) = (argument1, argument2). If SCALED_COMPONENT_OFFSET is set, the offset goes through the 2 x 2 part first: e = a*argument1 + c*argument2 and f = b*argument1 + d*argument2.<\/p>\n<p>A component can itself be a compound glyph. Then its own components are placed with their own transforms first, and the result is placed with the outer transform. In other words, transforms compose from the inside out.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>An empty glyph gives <code>components 0<\/code>; a simple glyph gives <code>components 1<\/code> and its outline.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Component records are read correctly: flags, glyph index, signed 1-byte or 2-byte arguments, and the loop over MORE_COMPONENTS.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The three scale forms: one scale, separate x and y scales, and the full 2 x 2 matrix.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Every point is transformed with x' = a*x + c*y + e and y' = b*x + d*y + f.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>With SCALED_COMPONENT_OFFSET, the offset is transformed by a, b, c, d too.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Nested compound glyphs: inner transforms apply first, then outer ones.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Components come out depth first, in record order; empty components are skipped.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Records are well-formed, every glyph you need has a <code>glyph<\/code> line, and compound glyphs nest at most 3 levels deep. Point-matched components (ARGS_ARE_XY_VALUES clear) don't occur.<\/li><li>Scales are within the F2Dot14 range (-2 to just under 2).<\/li><li>There are 36 tests: hand-made glyphs for each rule in a small test font, accented letters from JetBrains Mono Bold such as <code>é<\/code> and <code>Ü<\/code>, and 6 random compound glyphs (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p09_compound_glyph.cpp","text":"// Reference solution - checkpoint 09 (resolve compound glyphs).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cmath>\n#include <cstdint>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"provided/BigEndian.h\"\n#include \"provided/SimpleGlyph.h\"\n\nusing provided::Outline;\n\nstruct GlyphRecord {\n  uint32_t offset = 0;\n  uint32_t length = 0;\n};\n\nnamespace {\n\nconstexpr uint16_t ARG_1_AND_2_ARE_WORDS = 0x0001;\nconstexpr uint16_t ARGS_ARE_XY_VALUES = 0x0002;\nconstexpr uint16_t WE_HAVE_A_SCALE = 0x0008;\nconstexpr uint16_t MORE_COMPONENTS = 0x0020;\nconstexpr uint16_t WE_HAVE_AN_X_AND_Y_SCALE = 0x0040;\nconstexpr uint16_t WE_HAVE_A_TWO_BY_TWO = 0x0080;\nconstexpr uint16_t SCALED_COMPONENT_OFFSET = 0x0800;\n\n// x' = a*x + c*y + e, y' = b*x + d*y + f\nstruct Affine {\n  double a = 1, b = 0, c = 0, d = 1, e = 0, f = 0;\n\n  // This transform applied after `inner`.\n  [[nodiscard]] Affine after(const Affine& inner) const {\n    return {a * inner.a + c * inner.b, b * inner.a + d * inner.b,\n            a * inner.c + c * inner.d, b * inner.c + d * inner.d,\n            a * inner.e + c * inner.f + e, b * inner.e + d * inner.f + f};\n  }\n};\n\nstruct Component {\n  uint16_t glyphId = 0;\n  Affine transform;\n};\n\nclass Resolver {\npublic:\n  Resolver(std::ifstream& file, const std::map<uint32_t, GlyphRecord>& records)\n      : file_(file), records_(records) {}\n\n  void resolve(const uint32_t glyphId, const Affine& toGlyph, const int depth,\n               std::vector<Outline>& out) {\n    if (depth > 16) throw std::runtime_error(\"compound glyphs nested too deeply\");\n    const auto it = records_.find(glyphId);\n    if (it == records_.end()) throw std::runtime_error(\"no glyph line for glyph \" + std::to_string(glyphId));\n    if (it->second.length == 0) return;  // empty glyph: nothing to draw\n\n    file_.clear();\n    file_.seekg(it->second.offset);\n    const int numberOfContours = be::i16(file_);\n    if (numberOfContours >= 0) {\n      Outline outline = provided::readSimpleGlyph(file_, it->second.offset);\n      if (outline.points.empty()) return;\n      for (auto& p : outline.points) {\n        const double x = p.x, y = p.y;\n        p.x = toGlyph.a * x + toGlyph.c * y + toGlyph.e;\n        p.y = toGlyph.b * x + toGlyph.d * y + toGlyph.f;\n      }\n      out.push_back(std::move(outline));\n      return;\n    }\n\n    // Read every component record first: resolving one moves the stream elsewhere.\n    file_.seekg(8, std::ios::cur);  // bounding box\n    std::vector<Component> components;\n    uint16_t flags = 0;\n    do {\n      flags = be::u16(file_);\n      Component comp;\n      comp.glyphId = be::u16(file_);\n      int arg1 = 0, arg2 = 0;\n      if (flags & ARG_1_AND_2_ARE_WORDS) {\n        arg1 = be::i16(file_);\n        arg2 = be::i16(file_);\n      } else {\n        arg1 = be::i8(file_);\n        arg2 = be::i8(file_);\n      }\n      if (!(flags & ARGS_ARE_XY_VALUES)) throw std::runtime_error(\"point-matched components aren't supported\");\n\n      Affine& t = comp.transform;\n      if (flags & WE_HAVE_A_SCALE) {\n        t.a = t.d = be::f2dot14(file_);\n      } else if (flags & WE_HAVE_AN_X_AND_Y_SCALE) {\n        t.a = be::f2dot14(file_);\n        t.d = be::f2dot14(file_);\n      } else if (flags & WE_HAVE_A_TWO_BY_TWO) {\n        t.a = be::f2dot14(file_);\n        t.b = be::f2dot14(file_);\n        t.c = be::f2dot14(file_);\n        t.d = be::f2dot14(file_);\n      }\n      t.e = arg1;\n      t.f = arg2;\n      if (flags & SCALED_COMPONENT_OFFSET) {  // the offset goes through the 2x2 part too\n        t.e = t.a * arg1 + t.c * arg2;\n        t.f = t.b * arg1 + t.d * arg2;\n      }\n      components.push_back(comp);\n    } while (flags & MORE_COMPONENTS);\n\n    for (const Component& comp : components) {\n      resolve(comp.glyphId, toGlyph.after(comp.transform), depth + 1, out);\n    }\n  }\n\nprivate:\n  std::ifstream& file_;\n  const std::map<uint32_t, GlyphRecord>& records_;\n};\n\n}  // namespace\n\nstd::vector<Outline> resolveGlyph(std::ifstream& file, const std::map<uint32_t, GlyphRecord>& records,\n                                  const uint32_t glyphId) {\n  std::vector<Outline> out;\n  Resolver(file, records).resolve(glyphId, Affine{}, 0, out);\n  return out;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\nstd::string number(const double v) {\n  if (std::abs(v - std::round(v)) < 1e-9) return std::to_string(static_cast<long long>(std::llround(v)));\n  char buf[32];\n  std::snprintf(buf, sizeof buf, \"%.4f\", v);\n  std::string s = buf;\n  while (s.back() == '0') s.pop_back();\n  if (s.back() == '.') s.pop_back();  // 4.99999 rounds to \"5.0000\": print \"5\"\n  return s == \"-0\" ? \"0\" : s;\n}\n\nvoid write(std::ostream& out, const uint32_t id, const std::vector<Outline>& outlines) {\n  out << \"glyph \" << id << \" components \" << outlines.size() << '\\n';\n  for (const Outline& o : outlines) {\n    out << \"ends\";\n    for (const int e : o.endPtsOfContours) out << ' ' << e;\n    out << \"\\npoints\";\n    for (const auto& p : o.points) out << ' ' << number(p.x) << ' ' << number(p.y) << (p.onCurve ? \" on\" : \" off\");\n    out << '\\n';\n  }\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::ifstream font;\n    std::map<uint32_t, GlyphRecord> records;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::ifstream(path, std::ios::binary);\n        if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n        records.clear();\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        GlyphRecord r;\n        words >> id >> r.offset >> r.length;\n        records[id] = r;\n      } else if (keyword == \"decode\") {\n        uint32_t id = 0;\n        words >> id;\n        write(output, id, resolveGlyph(font, records, id));\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":36,"total":36,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h","include/provided/SimpleGlyph.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Compound%20glyph\" target=\"_blank\" rel=\"noopener\">Compound glyph<\/a> section up to the transformation matrix. Stop at the paragraph that starts \"Implementation. As compound glyphs are nested\". The author's code comes right after it.<\/p>","context":"<p>Checkpoint 07 decoded simple glyphs and reported compound ones without decoding them. A compound glyph has no points of its own: it lists other glyphs (components) and where to put each one, for example <code>é<\/code> is <code>e<\/code> plus an acute accent moved above it. This checkpoint turns a compound glyph into the outlines of the simple glyphs it is made of, each in its final position. The fill checkpoints (14, 16, 17) and the text renderer (18) draw those outlines.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6glyf.html\" target=\"_blank\" rel=\"noopener\">'glyf' table<\/a>: compound glyph flags and the transformation<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf#composite-glyph-description\" target=\"_blank\" rel=\"noopener\">glyf: composite glyph description<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Compound%20glyph\" target=\"_blank\" rel=\"noopener\">Compound glyph<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 09                         run every test\n.\\check 09 -Case 09-R6-nested      one test, showing its input, the expected output and yours\n.\\check 09 -Fresh                  new random compound glyphs (new seed)\n.\\check 09 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  Component records: flags, glyph id, signed 1- or 2-byte arguments... .    3 / 4   FAILED\n      x 09-R2-neg-bytes  neg_bytes: offset (-30, -5) stored as two signed bytes\n          points[0]: expected (x=-30, y=-5, curve=on), got (x=226, y=251, curve=on) - differs in x, y\n          likely cause: R4 - x&#x27; = a*x + c*y + e and y&#x27; = b*x + d*y + f for every point\n          expected values from: fontTools 4.67.0\n          reproduce: build/p09.exe build/cases/09/09-R2-neg-bytes.in build/cases/09/09-R2-neg-bytes.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Handle the three cases at the top: no outline (length 0), a simple glyph (numberOfContours ≥ 0), and a compound glyph. Only the last one needs new code, and it calls the same function again for each component.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Write one recursive function that takes a glyph id and the transform to apply, and appends outlines to a list. For a compound glyph, read <strong>all<\/strong> of its component records first (reading a component moves the file position elsewhere), then call yourself for each one with the combined transform. Keep a transform as six numbers a, b, c, d, e, f.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>int8 arguments are signed: read them as <code>int8_t<\/code>, not <code>uint8_t<\/code>.<\/li><li>After WE_HAVE_A_TWO_BY_TWO the order is a, b, c, d, and x' uses c (not b) for y.<\/li><li>Inner transforms apply first. Combining outer (A) after inner (B) gives a = A.a*B.a + A.c*B.b, b = A.b*B.a + A.d*B.b, c = A.a*B.c + A.c*B.d, d = A.b*B.c + A.d*B.d, e = A.a*B.e + A.c*B.f + A.e, f = A.b*B.e + A.d*B.f + A.f.<\/li><li>SCALED_COMPONENT_OFFSET changes only the offset, not the 2 x 2 part.<\/li><li>Skip components that are empty glyphs instead of writing an empty outline.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>resolve(id, T, out):\n    if length(id) == 0: return\n    seek(offset(id)); n = readInt16()\n    if n &gt;= 0: out.append(transform(decodeSimple(id), T)); return\n    skip(8)\n    records = []\n    do:\n        flags = readUint16(); gid = readUint16()\n        e, f = (readInt16(), readInt16()) if flags &amp; 0x1 else (readInt8(), readInt8())\n        a, b, c, d = 1, 0, 0, 1\n        if flags &amp; 0x08: a = d = readF2Dot14()\n        elif flags &amp; 0x40: a = readF2Dot14(); d = readF2Dot14()\n        elif flags &amp; 0x80: a, b, c, d = 4 x readF2Dot14()\n        if flags &amp; 0x800: e, f = a*e + c*f, b*e + d*f\n        records.append((gid, (a, b, c, d, e, f)))\n    while flags &amp; 0x20\n    for gid, L in records:\n        resolve(gid, T after L, out)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a scaled component with a scaled offset","test":"09-R5-scaled-offset","input":"font tests/09/data/compound-test.ttf\nglyph 14 800 18\nglyph 2 536 22\ndecode 14","output":"glyph 14 components 1\nends 3\npoints 20 20 on 20 70 on 70 70 on 70 20 on","image":null,"explain":"<p>Glyph 2 is a square from (0, 0) to (100, 100). Glyph 14's 18 bytes:<\/p>\n<pre><code>ff ff                       numberOfContours = -1: compound\n00 14 00 14 00 46 00 46     bounding box (ignore)\n08 0a                       flags 0x080a: ARGS_ARE_XY_VALUES, WE_HAVE_A_SCALE, SCALED_COMPONENT_OFFSET\n00 02                       glyphIndex 2\n28 28                       arguments as int8: 40, 40\n20 00                       scale 0x2000 / 16384 = 0.5<\/code><\/pre>\n<p>The square is scaled by 0.5, and because SCALED_COMPONENT_OFFSET is set the offset (40, 40) is scaled too, to (20, 20):<\/p>"},{"label":"Example 2","name":"a rotation","test":"09-R3-rotate","input":"font tests/09/data/compound-test.ttf\nglyph 11 730 24\nglyph 2 536 22\ndecode 11","output":"glyph 11 components 1\nends 3\npoints 100 0 on 0 0 on 0 100 on 100 100 on","image":null,"explain":"<p>Glyph 11's component record is <code>00 82 | 00 02 | 64 00 | 00 00 40 00 c0 00 00 00<\/code>: flags WE_HAVE_A_TWO_BY_TWO with byte arguments, glyph 2, offset (100, 0), and a = 0, b = 1, c = -1, d = 0. So x' = -y + 100 and y' = x, a quarter turn:<\/p>"},{"label":"Example 3","name":"three components","test":"09-R2-three-parts","input":"font tests/09/data/compound-test.ttf\nglyph 8 662 30\nglyph 2 536 22\nglyph 3 558 20\nglyph 4 578 34\ndecode 8","output":"glyph 8 components 3\nends 3\npoints 0 0 on 0 100 on 100 100 on 100 0 on\nends 2\npoints 120 0 on 180 0 on 150 80 on\nends 3 6\npoints 0 150 on 20 210 off 60 210 off 80 150 on 30 160 on 50 160 on 40 180 on","image":null,"explain":"<p>Glyph 8 places glyph 2 (a square) at (0, 0), glyph 3 (a triangle) at (120, 0) and glyph 4 (two contours, with off-curve points) at (0, 150):<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20compound%20glyphs\" target=\"_blank\" rel=\"noopener\">The blog's compound-glyph parser<\/a> splits the work into <code>getCompoundGlyph<\/code>, which loops over the component records while MORE_COMPONENTS is set, and <code>getCompoundSubComponents<\/code>, which decodes a component and recurses for nested compound glyphs. It builds a <code>glm::mat3<\/code> for each component, saves the stream position before recursing and jumps back afterwards, and takes the glyph's metrics from a component with USE_MY_METRICS.<\/p>\n<p><strong>Things to look for:<\/strong><\/p>\n<ul><li>The snippet reads 1-byte arguments as unsigned, so a small negative offset like -30 becomes 226. JetBrains Mono has 48 such components, all in its ligature glyphs.<\/li><li>It scales the offset with Apple's older <code>m<\/code>/<code>n<\/code> rule for every component. The current specifications only scale the offset when SCALED_COMPONENT_OFFSET is set. JetBrains Mono marks its components UNSCALED_COMPONENT_OFFSET and uses no scales, so the two agree there.<\/li><li>For a nested compound glyph, <code>getCompoundSubComponents<\/code> doesn't pass its own matrix down to the inner components, so an outer offset or scale is lost. JetBrains Mono has no nested compound glyphs, but the tests do.<\/li><\/ul>"}},{"id":"10","num":"10","title":"Lerp and quadratic Bezier curves","difficulty":"Easy","tests":24,"solution":"solutions/p10_bezier.cpp","problem":"problems/10-bezier.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 10 - Lerp and quadratic Bezier curves\n//\n// Problem:  problems/10-bezier.md (also in the web problem book)\n// Check:    .\\check 10\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p10.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p10_bezier.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 10 - Lerp and quadratic Bezier curves\n//\n// Problem:  problems/10-bezier.md (also in the web problem book)\n// Check:    .\\check 10\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on lerp() and bezier().\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"NotImplemented.h\"\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\n// Optional helpers: add, subtract, scale. (glm::dvec2 from third_party/ works too.)\nVec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\nVec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\nVec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// The point a fraction t of the way from a to b (0 <= t <= 1).\nVec2 lerp(const Vec2 a, const Vec2 b, const double t) {\n  // TODO: see \"Linear interpolation\" on the problem page.\n  throw NotImplemented(\"lerp\");\n}\n\n// The point at parameter t on the quadratic Bezier curve that starts at a,\n// is pulled toward the control point b, and ends at c (0 <= t <= 1).\nVec2 bezier(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  // TODO: see \"A point on a quadratic Bezier curve\" on the problem page.\n  throw NotImplemented(\"bezier\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// Whole numbers print plainly; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\n// Usage: p10 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      Vec2 p;\n      if (keyword == \"lerp\") {  // lerp ax ay bx by t\n        const Vec2 a = readPoint(words), b = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = lerp(a, b, t);\n      } else if (keyword == \"bezier\") {  // bezier ax ay bx by cx cy t\n        const Vec2 a = readPoint(words), b = readPoint(words), c = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = bezier(a, b, c, t);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(p.x) << ' ' << number(p.y) << '\\n';\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","small structs with <code>+<\/code>, <code>-<\/code> and <code>*<\/code> operators"],"text":["floating-point arithmetic (double)","small structs with +, - and  operators"]},{"label":"Library","items":["none needed (the boilerplate's input/output uses <code>std::istringstream<\/code>)","optional: <code>glm::dvec2<\/code> from <code>third_party/glm-1.0.1<\/code>"],"text":["none needed (the boilerplate's input/output uses std::istringstream)","optional: glm::dvec2 from third_party/glm-1.0.1"]},{"label":"Concepts","items":["linear interpolation (lerp)","quadratic Bezier curves","control points","de Casteljau's algorithm","curve parameter t"],"text":["linear interpolation (lerp)","quadratic Bezier curves","control points","de Casteljau's algorithm","curve parameter t"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a list of requests, one per line, and prints the point that each one asks for.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p10_bezier.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p10_bezier.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>lerp()<\/code> and <code>bezier()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains two kinds of lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>lerp ax ay bx by t<\/code><\/td><td>The point a fraction <code>t<\/code> of the way along the straight segment from a = (ax, ay) to b = (bx, by).<\/td><\/tr><tr><td><code>bezier ax ay bx by cx cy t<\/code><\/td><td>The point at parameter <code>t<\/code> on the quadratic Bezier curve that starts at a = (ax, ay), ends at c = (cx, cy), and is pulled toward the control point b = (bx, by).<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Every number is a decimal such as <code>12<\/code>, <code>-3.25<\/code> or <code>0.0625<\/code>. <code>t<\/code> is always between 0 and 1, inclusive. Note the order on a <code>bezier<\/code> line: start, <strong>control point<\/strong>, end.<\/p>\n<h3>Output<\/h3>\n<p>One line per input line, in the same order: the point's coordinates <code>x y<\/code>, separated by a space.<\/p>\n<p>The checker accepts any number within 0.001 of the expected value, so <code>25<\/code>, <code>25.0<\/code> and <code>25.0000<\/code> all match <code>25<\/code>. When a value isn't whole, print enough decimals to be within 0.001 (4 is plenty). The boilerplate's <code>number()<\/code> does this: whole numbers plainly, others rounded to 4 decimals with trailing zeros dropped (<code>37.5<\/code>, <code>0.0625<\/code>).<\/p>\n<h3>Linear interpolation<\/h3>\n<p>The point a fraction t of the way from a to b is<\/p>\n<pre><code>lerp(a, b, t) = a + (b − a) · t<\/code><\/pre>\n<p>Work it out for x and y separately. t = 0 gives a, t = 1 gives b and t = 0.5 gives the midpoint. Because t is measured from a, <code>lerp(a, b, 0.25)<\/code> is close to a, and <code>lerp(b, a, 0.25)<\/code> is close to b.<\/p>\n<h3>A point on a quadratic Bezier curve<\/h3>\n<p>A quadratic Bezier curve is defined by three points: the start a, the control point b and the end c. The curve leaves a heading toward b and arrives at c coming from the direction of b. It is pulled toward b but doesn't pass through it (unless all three points lie on one line).<\/p>\n<p>The point at parameter t takes three lerps, all with the same t. This is <strong>de Casteljau's construction<\/strong>:<\/p>\n<ol><li>p = lerp(a, b, t), a point on the leg from a to the control point<\/li><li>q = lerp(b, c, t), a point on the leg from the control point to c<\/li><li>The curve point is lerp(p, q, t).<\/li><\/ol>\n<p>Multiplying it out gives the same point as one formula, which you may use instead:<\/p>\n<pre><code>B(t) = (1 − t)² · a  +  2 (1 − t) t · b  +  t² · c<\/code><\/pre>\n<p>The three weights, (1 − t)², 2(1 − t)t and t², always add up to 1. At t = 0 the curve is at a; at t = 1 it is at c.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>t<\/th><th>(1 − t)²<\/th><th>2(1 − t)t<\/th><th>t²<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0.25<\/td><td>0.5625<\/td><td>0.375<\/td><td>0.0625<\/td><\/tr><tr><td>0.5<\/td><td>0.25<\/td><td>0.5<\/td><td>0.25<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A <code>lerp<\/code> line gives the point a fraction t of the way from a to b.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A <code>bezier<\/code> line gives the point at t on the curve that starts at a, ends at c and is pulled toward the control point b (the <strong>middle<\/strong> point on the line).<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The ends are exact: t = 0 gives the first point and t = 1 the last one. For a curve, that is c, not the control point b.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Negative coordinates, fractional coordinates and fractional t all work.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate in the input is between −1000 and 1000, and has at most 4 digits after the decimal point. <code>t<\/code> is between 0 and 1, inclusive.<\/li><li>The input is well-formed: each line has the keyword and the right count of numbers.<\/li><li>A test has from 1 to about 80 lines.<\/li><li>There are 24 tests: hand-made lines for each rule, random lines, and every line and curve of 'S' and 'o' (JetBrains Mono Bold) and 'あ' (Noto Sans JP), plus one curve of '3' cut into 16 steps.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>32-bit <code>float<\/code> is accurate enough for these tests, but <code>double<\/code> is the safer habit.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p10_bezier.cpp","text":"// Reference solution - checkpoint 10 (lerp and quadratic Bezier curves).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\nVec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\nVec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\nVec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\nVec2 lerp(const Vec2 a, const Vec2 b, const double t) {\n  return a + (b - a) * t;\n}\n\n// De Casteljau: lerp along both legs of the control polygon, then between the two results.\nVec2 bezier(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  return lerp(lerp(a, b, t), lerp(b, c, t), t);\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\n// Whole numbers print plainly; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      Vec2 p;\n      if (keyword == \"lerp\") {\n        const Vec2 a = readPoint(words), b = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = lerp(a, b, t);\n      } else if (keyword == \"bezier\") {\n        const Vec2 a = readPoint(words), b = readPoint(words), c = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = bezier(a, b, c, t);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(p.x) << ' ' << number(p.y) << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":24,"total":24,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the start of the blog's <strong>\"Renderer: Curve Rendering\"<\/strong> section: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Definition%20of%20B%C3%A9zier%20Curves\" target=\"_blank\" rel=\"noopener\">Definition of Bézier Curves<\/a> and <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=De%20Casteljau,algorithm\" target=\"_blank\" rel=\"noopener\">De Casteljau's algorithm<\/a>. Stop at the sentence that introduces the code. The author's code (the listing \"Lerp for a segment and a quadratic Bézier curve\") comes right after it. \"TrueType Bézier curves\" belongs to checkpoint 11.<\/p>","context":"<p>Checkpoint 8 drew glyph outlines with straight lines only. Real glyphs are made of quadratic Bezier curves: an on-curve start point, an off-curve control point and an on-curve end point. This checkpoint computes points along such a curve. Checkpoint 11 draws each curve by joining many of these points with short straight lines.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>, on quadratic curves in TrueType outlines<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>, where on-curve and off-curve points are defined<\/li><li>Pomax, <em>A Primer on Bézier Curves<\/em>, <a href=\"https://pomax.github.io/bezierinfo/#decasteljau\" target=\"_blank\" rel=\"noopener\">de Casteljau's algorithm<\/a>, with interactive drawings<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=De%20Casteljau,algorithm\" target=\"_blank\" rel=\"noopener\">De Casteljau's algorithm<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 10                         run every test\n.\\check 10 -Case 10-R2-midpoint    one test, showing its full input, expected output and your output\n.\\check 10 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 10 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  bezier: the point at t on the curve from a to c, pulled toward b .....    0 / 7   FAILED\n      x 10-R2-midpoint  an arch from (0,0) to (100,0) pulled toward (50,100): t = 0.5\n          line 1: expected `50 50`, got `37.5 25`\n          expected values from: exact arithmetic with Python fractions.Fraction\n          reproduce: build/p10.exe build/cases/10/10-R2-midpoint.in build/cases/10/10-R2-midpoint.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>lerp<\/code> first and test it on Example 1. A curve point can be built from three calls to <code>lerp<\/code>, so once <code>lerp<\/code> works, <code>bezier<\/code> is one line.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Treat a point as a pair and apply the same arithmetic to x and y. For a curve, lerp along the leg a → b and along the leg b → c with the same t, then lerp between those two results, again with the same t. Check yourself on Example 2, where every step lands on a round number.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>It is (b − a) · t, not (a − b) · t. At t = 0.25 the point is closer to a.<\/li><li>On a <code>bezier<\/code> line the middle point is the control point and the last point is the end. At t = 1 the answer is c.<\/li><li>Use the same t in all three lerps, and lerp from the first leg's point to the second leg's point, not the other way round.<\/li><li>If you use the expanded formula, don't drop the 2 on the middle term. The weights must add up to 1.<\/li><li>Read the numbers as floating point. Inputs like <code>46.5<\/code> and <code>0.0625<\/code> are common.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>lerp(a, b, t):\n    return (a.x + (b.x - a.x) * t,  a.y + (b.y - a.y) * t)\n\nbezier(a, b, c, t):\n    p = lerp(a, b, t)\n    q = lerp(b, c, t)\n    return lerp(p, q, t)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"lerp in both directions","test":"10-R1-direction","input":"lerp 10 20 50 100 0.25\nlerp 50 100 10 20 0.25\nlerp 10 20 50 100 0.9\nlerp 50 100 10 20 0.9","output":"20 40\n40 80\n46 92\n14 28","image":null,"explain":"<p>On the first line, b − a = (40, 80). A quarter of that is (10, 20), and a + (10, 20) = (20, 40). The second line swaps a and b, so the quarter is measured from (50, 100) instead.<\/p>"},{"label":"Example 2","name":"the middle of an arch","test":"10-R2-midpoint","input":"bezier 0 0 50 100 100 0 0.5","output":"50 50","image":null,"explain":"<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Computation<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>p = lerp(a, b, 0.5)<\/td><td>halfway from (0, 0) to (50, 100)<\/td><td>(25, 50)<\/td><\/tr><tr><td>q = lerp(b, c, 0.5)<\/td><td>halfway from (50, 100) to (100, 0)<\/td><td>(75, 50)<\/td><\/tr><tr><td>lerp(p, q, 0.5)<\/td><td>halfway from (25, 50) to (75, 50)<\/td><td><strong>(50, 50)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>The control point is at height 100, but the curve only reaches 50. With the formula: 0.25 · (0, 0) + 0.5 · (50, 100) + 0.25 · (100, 0) = (50, 50).<\/p>"},{"label":"Example 3","name":"the end of a curve is c, not b","test":"10-R3-control-not-on-curve","input":"bezier 0 0 0 100 100 100 1\nbezier 0 0 0 100 100 100 0.5","output":"100 100\n25 75","image":null,"explain":"<p>At t = 1 every weight except t² is 0, so the curve ends at c = (100, 100). The control point (0, 100) only bends the curve: at t = 0.5, p = (0, 50), q = (50, 100) and the point is (25, 75).<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Lerp%20for%20a%20segment\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> has two short functions on <code>glm::vec2<\/code>. <code>lerp<\/code> asserts that t is between 0 and 1 and returns a + (b − a) · t. <code>bezierLerp<\/code> nests three <code>lerp<\/code> calls in de Casteljau's order, as in Example 2. The expanded formula appears only in the blog's prose, not in its code.<\/p>\n<p><strong>Something to look for:<\/strong> the drawing code in the next section (\"TrueType Bézier curves\") calls the curve function <code>quadBezierLerp<\/code>, while this listing names it <code>bezierLerp<\/code>. They are the same function. If you follow along in C++, pick one name.<\/p>"}},{"id":"11","num":"11","title":"Draw an outline with curves","difficulty":"Medium","tests":27,"solution":"solutions/p11_outline_curves.cpp","problem":"problems/11-outline-curves.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 11 - Draw an outline with curves\n//\n// Problem:  problems/11-outline-curves.md (also in the web problem book)\n// Check:    .\\check 11\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p11.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p11_outline_curves.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 11 - Draw an outline with curves\n//\n// Problem:  problems/11-outline-curves.md (also in the web problem book)\n// Check:    .\\check 11\n//\n// Only the picture your program writes is checked, so structure this however you\n// like, or use another language or library (see README.md). The input/output code\n// at the bottom is provided so you can focus on drawQuadratic() and drawOutline().\n\n#include <algorithm>\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"provided/Canvas.h\"  // Canvas: drawLine, drawRect, writePng (checkpoint 06, ready-made)\n\nstruct Point {\n  double x = 0;  // font units; x grows to the right\n  double y = 0;  // font units; y grows upwards\n  bool onCurve = false;\n};\n\nstruct Outline {\n  std::vector<int> endPtsOfContours;  // index of the last point of each contour\n  std::vector<Point> points;\n};\n\n// Where the outline goes: font point (x, y) lands on pixel\n// (x0 + scale * x, baseline - scale * y).\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\nconst RGB ON_CURVE_COLOR{255, 0, 0};   // red: on-curve points from the input\nconst RGB OFF_CURVE_COLOR{0, 255, 0};  // green: off-curve (control) points from the input\nconst RGB IMPLIED_COLOR{0, 0, 255};    // blue: on-curve points implied between two off-curve points\n\n// Draws the quadratic Bezier curve from p0 to p2 with control point p1 (all in\n// pixels) as short straight lines, about one per pixel of |p0 p1| + |p1 p2|.\nvoid drawQuadratic(Canvas& canvas, const Vec2 p0, const Vec2 p1, const Vec2 p2, const int thickness,\n                   const RGB color) {\n  // TODO: see \"Drawing a curve\" on the problem page.\n  throw NotImplemented(\"drawQuadratic\");\n}\n\n// Draws every contour with straight lines and quadratic curves in `color`, then a\n// 2 * lineThickness square on every on-curve, off-curve and implied on-curve point.\nvoid drawOutline(Canvas& canvas, const Outline& outline, const Placement& place, const int lineThickness,\n                 const RGB color) {\n  // TODO: see \"Walking a contour\" and \"Markers\" on the problem page.\n  throw NotImplemented(\"drawOutline\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\n// Usage: p11 <input-file> <output-file.png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::unique_ptr<Canvas> canvas;\n    Placement place;\n    int lineThickness = 1;\n    RGB color{255, 255, 255};\n    Outline outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<Canvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness>\n        words >> lineThickness;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = Outline{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3) {\n          outline.points.push_back(Point{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        }\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        drawOutline(*canvas, outline, place, lineThickness, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    if (!canvas->writePng(argv[2])) throw std::runtime_error(std::string(\"cannot write \") + argv[2]);\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["walking a circular list with an index modulo its length","a small 2D vector struct","floating-point arithmetic, rounding only at the end"],"text":["walking a circular list with an index modulo its length","a small 2D vector struct","floating-point arithmetic, rounding only at the end"]},{"label":"Library","items":["<code>Canvas<\/code> from <code>include/provided/Canvas.h<\/code> (<code>drawLine<\/code> with floating-point ends, <code>drawRect<\/code>, <code>writePng<\/code>)"],"text":["Canvas from include/provided/Canvas.h (drawLine with floating-point ends, drawRect, writePng)"]},{"label":"Concepts","items":["quadratic Bézier curves","on-curve and off-curve points","implied on-curve points","flattening a curve into short lines"],"text":["quadratic Bézier curves","on-curve and off-curve points","implied on-curve points","flattening a curve into short lines"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads one or more glyph outlines and draws each one with straight lines and quadratic curves, marks every point with a coloured square, and writes the picture as a PNG.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p11_outline_curves.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p11_outline_curves.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, gives you a <code>Canvas<\/code> and writes the PNG; you fill in <code>drawQuadratic()<\/code> and <code>drawOutline()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The output file name ends in <code>.png<\/code>. The input is the same as in checkpoint 8, except that <code>style<\/code> has one number:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;w&gt; &lt;h&gt;<\/code><\/td><td>Always the first line: the picture is <code>w<\/code> x <code>h<\/code> pixels, all black.<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Where the following outlines go (see below).<\/td><\/tr><tr><td><code>style &lt;lineThickness&gt;<\/code><\/td><td>Thickness of lines and curves, in pixels, for the following outlines.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>Colour of the lines and curves of the following outlines.<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline. An <code>ends<\/code> line and a <code>points<\/code> line follow.<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, in increasing order.<\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>Every point of the outline, in order, in font units.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>place<\/code>, <code>style<\/code> and <code>color<\/code> come before the first <code>outline<\/code> and may change between outlines; each outline uses the most recent ones. Coordinates may have a fractional part.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) file, exactly <code>w<\/code> x <code>h<\/code> pixels, RGB, with (0, 0) at the top-left and y growing downwards. The boilerplate writes it with <code>Canvas::writePng<\/code>.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>. <code>include/provided/Canvas.h<\/code> does all of this for you; the boilerplate uses it.<\/p>\n<h3>From font units to pixels<\/h3>\n<p>A point (x, y) in font units sits at<\/p>\n<pre><code>px = x0 + scale * x\npy = baseline - scale * y<\/code><\/pre>\n<p>Keep these as floating-point numbers. Work out curves and implied points from them, and round to whole pixels only when you draw (<code>Canvas::drawLine<\/code> with <code>float<\/code> or <code>double<\/code> ends rounds them for you). Rounding every point first, as in checkpoint 8, moves a curve by less than a pixel and also passes.<\/p>\n<h3>Walking a contour<\/h3>\n<p><code>ends<\/code> splits the points into contours exactly as in checkpoint 8: contour 0 is points 0 to <code>e0<\/code>, contour 1 is points <code>e0 + 1<\/code> to <code>e1<\/code>, and so on. Each contour is closed, so after its last point comes its first point again. Go round a contour keeping a <strong>current position<\/strong>, which is always an on-curve point (real or implied). Each point you reach adds one piece that starts at the current position:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Point reached<\/th><th>The point after it<\/th><th>Piece<\/th><th>Current position becomes<\/th><\/tr><\/thead><tbody><tr><td>on-curve<\/td><td>(doesn't matter)<\/td><td>a <strong>straight line<\/strong> to it<\/td><td>this point<\/td><\/tr><tr><td>off-curve<\/td><td>on-curve<\/td><td>a <strong>curve<\/strong> with this point as control point, ending at the point after it (which is then used up)<\/td><td>the point after it<\/td><\/tr><tr><td>off-curve<\/td><td>off-curve<\/td><td>a <strong>curve<\/strong> with this point as control point, ending at the <strong>implied on-curve point<\/strong> halfway between the two<\/td><td>the implied point<\/td><\/tr><\/tbody><\/table><\/div>\n<p>An implied on-curve point is not in the file. Whenever two off-curve points follow each other (the last and the first point of a contour count as neighbours), the outline passes through the point exactly halfway between them, and that point is where one curve ends and the next begins.<\/p>\n<p><strong>Where to start.<\/strong> A piece always starts at an on-curve point, real or implied. So start the walk at an on-curve point of the contour (the first one you find), and go all the way round back to it: the walk ends when it reaches the starting point again, so if the contour's last point is on-curve the final piece is a line back to the start, and if it is off-curve the final piece is a curve that ends at the start. A contour with k off-curve control points draws exactly k curves. If the contour has <strong>no<\/strong> on-curve point at all, start at the implied point halfway between its last and first points. Two cases need this:<\/p>\n<ul><li>a contour whose first point is off-curve: its first curve starts at the last on-curve point of the contour (or at the implied point between its last and first points), not at (0, 0);<\/li><li>a contour with only off-curve points, such as a circle made of 4 or 8 control points: it is a ring of curves joined at implied points.<\/li><\/ul>\n<h3>Drawing a curve<\/h3>\n<p>The quadratic Bézier curve from P0 to P2 with control point P1 is<\/p>\n<pre><code>B(t) = (1 - t)² P0 + 2 (1 - t) t P1 + t² P2,     t from 0 to 1<\/code><\/pre>\n<p>Draw it as <code>n<\/code> short straight lines from B((i - 1) / n) to B(i / n) for i = 1 to n, where<\/p>\n<pre><code>n = max(1, ceil(|P1 - P0| + |P2 - P1|))       lengths in pixels<\/code><\/pre>\n<p>The control polygon is never shorter than the curve, so every short line is at most about a pixel long. More pieces are fine; much fewer (say a fixed 8) leave visible corners on long curves. Lines and curves both use thickness <code>lineThickness<\/code> and the outline's colour.<\/p>\n<h3>Markers<\/h3>\n<p>After <strong>all<\/strong> the lines and curves of an outline are drawn, draw a square of size <code>2 * lineThickness<\/code>, on the point rounded to the nearest pixel. The size is even, so the square covers columns x − lineThickness up to x + lineThickness − 1 (and rows likewise), as <code>Canvas::drawRect<\/code> does: a 6 x 6 marker at x = 50 covers columns 47 to 52. Draw it on:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Point<\/th><th>Colour<\/th><\/tr><\/thead><tbody><tr><td>every on-curve point of the input<\/td><td>red (255, 0, 0)<\/td><\/tr><tr><td>every off-curve point of the input<\/td><td>green (0, 255, 0)<\/td><\/tr><tr><td>every implied on-curve point<\/td><td>blue (0, 0, 255)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Markers go on top of the lines, so each square shows its full colour. The tests never let markers of different colours overlap, so their order among themselves doesn't matter.<\/p>\n<h3>How the picture is compared<\/h3>\n<p>The checker compares your PNG with the expected picture pixel by pixel and forgives only an edge that moved by at most 1 pixel, so small rounding differences pass, but a straight line where a curve should be, a missing marker or a marker of the wrong colour fails. When a test fails, the checker writes a diff picture: red where you have extra ink, blue where ink is missing, magenta for the wrong colour, yellow for forgiven pixels.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement it targets.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Two on-curve points in a row are joined by a straight line (the last and first point of a contour included).<\/span><\/li><li><span class=\"rid\">R2<\/span><span>An off-curve point between two on-curve points makes one quadratic curve between them, drawn as short lines.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Between two off-curve points in a row there is an implied on-curve point, halfway; curves end and start there, and it gets a blue marker.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A contour that starts with an off-curve point, or has no on-curve point at all, is drawn completely, closing curve included.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Markers are <code>2 * lineThickness<\/code> squares on top of the lines: red on-curve, green off-curve, blue implied.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Points are placed with <code>place<\/code> (x0 + scale * x, baseline - scale * y), and several outlines on one canvas each use their own <code>place<\/code>, <code>style<\/code> and <code>color<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>w<\/code> and <code>h<\/code> are at most 600. Every outline fits inside the canvas.<\/li><li>Every contour has at least 3 points. An outline has at most a few hundred points.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 27 tests: glyphs from JetBrains Mono Bold (<code>-<\/code>, <code>A<\/code>, <code>B<\/code>, <code>D<\/code>, <code>S<\/code>, <code>a<\/code>, <code>g<\/code>, <code>o<\/code>), Nerd Font icons from the same file whose contours start off-curve or have no on-curve point (U+F111, U+F10C, U+E3A2, U+F00C, U+F042), <code>a<\/code> and U+5341 十 from Noto Sans JP, hand-made outlines and 3 random outlines.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p11_outline_curves.cpp","text":"// Reference solution - checkpoint 11 (draw an outline with curves).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <algorithm>\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"provided/Canvas.h\"  // Canvas: drawLine, drawRect, writePng (checkpoint 06, ready-made)\n\nstr
