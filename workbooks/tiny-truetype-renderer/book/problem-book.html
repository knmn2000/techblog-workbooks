omponent.h","GlyphComponent.cpp","utils/Bit.h","utils/Debug.h","utils/Geometry.h","utils/Unicode.h"]},"layout":[{"path":"solutions/assignments/assignment_01_byte_readers.cpp","owner":"01","purpose":null},{"path":"solutions/src/font/ByteReader.h","owner":"01","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines."},{"path":"solutions/src/font/ByteReader.cpp","owner":"01","purpose":"This file implements the reader: it opens the font, moves the position and turns bytes into numbers. Every later assignment that reads the font runs this code, so a bug here makes their tests fail too."},{"path":"solutions/assignments/assignment_02_table_directory.cpp","owner":"02","purpose":null},{"path":"solutions/src/font/FontParser.h","owner":"02","purpose":"This header declares the code that opens a font and reads its table directory: the tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...). Assignments 03 to 05 find their tables by tag in these records, and assignment 18 opens the font through it."},{"path":"solutions/src/font/FontParser.cpp","owner":"02","purpose":"This file reads the table directory from the first bytes of the font through your `ByteReader`. Each later assignment that needs a table looks up its offset in these records."},{"path":"solutions/assignments/assignment_03_cmap.cpp","owner":"03","purpose":null},{"path":"solutions/src/font/Cmap.h","owner":"03","purpose":"This header declares your reader for the `cmap` table, the font's map from each character to the glyph that draws it. It reads the format 12 subtable, which covers the full Unicode range, and assignment 18 looks up every character of a line of text in the result."},{"path":"solutions/src/font/Cmap.cpp","owner":"03","purpose":"This file reads the platform 0 / encoding 4 subtable of `cmap` into a map from character to glyph. Assignment 18 builds this map once per font."},{"path":"solutions/assignments/assignment_04_loca.cpp","owner":"04","purpose":null},{"path":"solutions/src/font/Loca.h","owner":"04","purpose":"This header declares your reader for the `loca` table, which gives the position and size in bytes of each glyph's record, by glyph id. Assignment 09 uses it to find the parts of a compound glyph, and assignment 18 to find the glyph of every character."},{"path":"solutions/src/font/Loca.cpp","owner":"04","purpose":"This file reads `maxp`, `head` and `loca` and works out one location per glyph id. Assignments 09 and 18 look glyphs up in its result."},{"path":"solutions/assignments/assignment_05_metrics.cpp","owner":"05","purpose":null},{"path":"solutions/src/font/Metrics.h","owner":"05","purpose":"This header declares your reader for the `hhea` and `hmtx` tables: the font's ascent and descent, and each glyph's advance width and left side bearing. Assignment 18 moves the pen by each glyph's advance width and sizes the text from the ascent and descent."},{"path":"solutions/src/font/Metrics.cpp","owner":"05","purpose":"This file reads `hhea`, `maxp` and `hmtx` into the ascent, the descent and one set of metrics per glyph id, including the glyphs that store a side bearing and no advance. Assignment 18 loads these metrics once per font."},{"path":"solutions/assignments/assignment_06_canvas.cpp","owner":"06","purpose":null},{"path":"solutions/src/FrameBufferCanvas.h","owner":"06","purpose":"The canvas holds a picture in memory, one colour per pixel. It can paint one pixel, fill a rectangle, draw a thick line and save the picture as a PNG. You draw every later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line of text in 18."},{"path":"solutions/src/FrameBufferCanvas.cpp","owner":"06","purpose":"The canvas holds a picture in memory, one colour per pixel. It can paint one pixel, fill a rectangle, draw a thick line and save the picture as a PNG. You draw every later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line of text in 18."},{"path":"solutions/assignments/assignment_07_simple_glyph.cpp","owner":"07","purpose":null},{"path":"solutions/src/GlyphComponent.h","owner":"07","purpose":"Every outline in the project takes this form: its points (x and y in font units, on or off the curve) and the index where each contour ends. Assignments 08 and 11 draw outlines in this form, 09 produces one per part of a compound glyph, and 14, 16 and 17 fill them."},{"path":"solutions/src/Glyph.h","owner":"07","purpose":"This type holds a glyph as the glyf table stores it: whether it is empty, simple or compound, its contour count, its bounding box and, for a simple glyph, its outline. Your `GlyphParser` returns it, and in assignment 09 you use its kind to tell simple glyphs from compound ones."},{"path":"solutions/src/font/GlyphParser.h","owner":"07","purpose":"The parser decodes one glyph record from the glyf table into the types in `Glyph.h`: the header of any glyph, and the contours and points of a simple one. In assignment 09 you call it for every simple glyph inside a compound glyph."},{"path":"solutions/src/font/GlyphParser.cpp","owner":"07","purpose":"The parser decodes one glyph record from the glyf table into the types in `Glyph.h`: the header of any glyph, and the contours and points of a simple one. In assignment 09 you call it for every simple glyph inside a compound glyph."},{"path":"solutions/assignments/assignment_08_outline_lines.cpp","owner":"08","purpose":null},{"path":"solutions/src/render/Placement.h","owner":"08","purpose":"A placement is where a glyph goes on the canvas, given as three numbers: the pixel column of font x = 0, the pixel row of the baseline and the pixels per font unit. Together they turn font units (y up) into pixels (y down). You place glyphs with it in assignments 11, 14, 16 and 17, and in assignment 18 you move it along a line of text, one glyph at a time."},{"path":"solutions/src/render/Outline.h","owner":"08","purpose":"These files draw a glyph's outline on the canvas, with straight lines between its points and a marker on every point. In assignment 11 you add a second drawing, with the real curves, to the same files."},{"path":"solutions/src/render/Outline.cpp","owner":"08","purpose":"These files draw a glyph's outline on the canvas, with straight lines between its points and a marker on every point. In assignment 11 you add a second drawing, with the real curves, to the same files."},{"path":"solutions/assignments/assignment_09_compound_glyph.cpp","owner":"09","purpose":null},{"path":"solutions/src/font/CompoundGlyph.h","owner":"09","purpose":"This code turns any glyph into the simple outlines you draw it with. It reads a compound glyph's components, moves, scales or rotates each one, and resolves components nested at any depth. In assignment 18 you draw every character of a line of text through it, so your text renderer doesn't need to tell simple glyphs from compound ones."},{"path":"solutions/src/font/CompoundGlyph.cpp","owner":"09","purpose":"This code turns any glyph into the simple outlines you draw it with. It reads a compound glyph's components, moves, scales or rotates each one, and resolves components nested at any depth. In assignment 18 you draw every character of a line of text through it, so your text renderer doesn't need to tell simple glyphs from compound ones."},{"path":"solutions/assignments/assignment_10_bezier.cpp","owner":"10","purpose":null},{"path":"solutions/src/utils/Geometry.h","owner":"10","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them."},{"path":"solutions/assignments/assignment_11_outline_curves.cpp","owner":"11","purpose":null},{"path":"solutions/assignments/assignment_12_segment_intersection.cpp","owner":"12","purpose":null},{"path":"solutions/assignments/assignment_13_line_curve_intersection.cpp","owner":"13","purpose":null},{"path":"solutions/assignments/assignment_14_even_odd_fill.cpp","owner":"14","purpose":null},{"path":"solutions/src/render/Scanline.h","owner":"14","purpose":"It holds the steps both fill rules share: it turns an outline into edges in pixels and finds, row by row, where the line through the pixel centres crosses them. Your even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both run on it."},{"path":"solutions/src/render/Scanline.cpp","owner":"14","purpose":"It holds the steps both fill rules share: it turns an outline into edges in pixels and finds, row by row, where the line through the pixel centres crosses them. Your even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both run on it."},{"path":"solutions/src/render/EvenOdd.h","owner":"14","purpose":"It fills a glyph by the even-odd rule, on top of your `render/Scanline`. Assignment 16 adds the non-zero rule beside it, and the text renderer in assignment 18 uses that rule."},{"path":"solutions/src/render/EvenOdd.cpp","owner":"14","purpose":"It fills a glyph by the even-odd rule, on top of your `render/Scanline`. Assignment 16 adds the non-zero rule beside it, and the text renderer in assignment 18 uses that rule."},{"path":"solutions/assignments/assignment_15_bezier_min_y.cpp","owner":"15","purpose":null},{"path":"solutions/assignments/assignment_16_nonzero_lines.cpp","owner":"16","purpose":null},{"path":"solutions/src/render/NonZero.h","owner":"16","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it."},{"path":"solutions/src/render/NonZero.cpp","owner":"16","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it."},{"path":"solutions/assignments/assignment_17_nonzero_curves.cpp","owner":"17","purpose":null},{"path":"solutions/assignments/assignment_18_render_text.cpp","owner":"18","purpose":null},{"path":"solutions/src/utils/Unicode.h","owner":"18","purpose":"It turns UTF-8 text into Unicode code points, the numbers a font's cmap maps to glyphs. Your `TextRenderer` decodes every line of text with it."},{"path":"solutions/src/TextRenderer.h","owner":"18","purpose":"This class holds the whole pipeline. It loads a font's tables once, then maps each character of a line of text to its glyph, fills the glyph by the non-zero rule and moves the pen on by its advance. The checker's program and `main.cpp` both draw through it."},{"path":"solutions/src/TextRenderer.cpp","owner":"18","purpose":"This class holds the whole pipeline. It loads a font's tables once, then maps each character of a line of text to its glyph, fills the glyph by the non-zero rule and moves the pen on by its advance. The checker's program and `main.cpp` both draw through it."},{"path":"solutions/src/main.cpp","owner":"18","purpose":"This is the finished command-line program. `tiny_ttf <font.ttf> \"<text>\" <out.png>` draws a line of text with a TrueType font into a PNG sized to fit it, using your `TextRenderer`. An optional fourth argument sets the text height in pixels (64 by default)."}]}}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('book-data').textContent);
  const CPS = DATA.checkpoints;
  const BY = Object.fromEntries(CPS.map((c) => [c.id, c]));
  const DIFFS = ['Easy', 'Medium', 'Hard'].filter((d) => CPS.some((c) => c.difficulty === d))
    .concat([...new Set(CPS.map((c) => c.difficulty))].filter((d) => !['Easy', 'Medium', 'Hard'].includes(d)));

  // Progress, drafts and layout live in this browser only.
  const store = {
    get(k) { try { return localStorage.getItem(DATA.key + ':' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(DATA.key + ':' + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(DATA.key + ':' + k); } catch (e) {} },
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  // Your project: the folder you build the post's program in, one assignment at a time. Each
  // assignment's files (c.files) are its entry program, which the checker runs, the project files it
  // creates, and earlier files it adds to.
  const PROJECT = DATA.project;
  const PROJECT_DIR = PROJECT.dir + '/';
  const shortName = (path) => (path.startsWith(PROJECT_DIR) ? path.slice(PROJECT_DIR.length) : path);
  const draftKey = (path) => 'draft:' + path;  // the published book keeps your files in this browser
  const command = (id, extra) => DATA.check.replace('{id}', id) + (extra ? ' ' + extra : '');
  const solved = (id) => store.get(id + ':solved') === '1';
  const drafted = (id) => BY[id].files.some((f) => f.role !== 'adds' && store.get(draftKey(f.path)) !== null);
  const diffClass = (d) => d.toLowerCase();
  const icon = (paths, size, extra) => `<svg viewBox="0 0 24 24" width="${size || 16}" height="${size || 16}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra || ''}>${paths}</svg>`;
  const I = {
    check: icon('<path d="m5 12 5 5 9-10"/>'),
    tryIcon: icon('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'),
    tag: icon('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>', 14),
    bulb: icon('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>', 15),
    lock: icon('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 14),
    down: icon('<path d="m6 9 6 6 6-6"/>', 15),
    link: icon('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', 15),
    map: icon('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>', 15),
    book: icon('<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/>', 15),
  };

  let current = null;          // assignment id on screen, or null for the list
  let caseIndex = 0;           // selected test case in the bottom panel
  const peeked = new Set();    // editorials opened before solving, this visit only
  const lastAction = {};       // id -> { kind: 'run' | 'submit', test, copied }

  // ---------------------------------------------------------------- problem list
  const filter = { topic: null, diff: null, q: '' };

  function topicsOf(c) {
    const concepts = c.tags.find((g) => g.label.toLowerCase() === 'concepts');
    return concepts ? concepts.text : c.tags.flatMap((g) => g.text);
  }

  function renderListShell() {
    $$('[data-logo]').forEach((el) => { el.textContent = DATA.title.trim().charAt(0).toUpperCase(); });
    $('#book-name').textContent = DATA.title;
    $('#nav-src').innerHTML = `Built on <a href="${esc(DATA.sourceUrl)}" target="_blank" rel="noopener">“${esc(DATA.sourceTitle)}”</a> by ${esc(DATA.author)}`;
    $('#hero').innerHTML = `<span class="over">${CPS.length} assignments · any language</span><h1>${esc(DATA.headline)}</h1><p>${esc(DATA.lede)}</p>`;
    $('#credits').textContent = DATA.credits;
    $('#diff').innerHTML = ['All'].concat(DIFFS).map((d) =>
      `<button type="button" data-diff="${d === 'All' ? '' : esc(d)}" aria-pressed="${d === 'All'}">${esc(d)}</button>`).join('');

    const counts = {};
    CPS.forEach((c) => topicsOf(c).forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const topics = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    $('#topics').innerHTML = `<button class="tchip" type="button" data-topic="" aria-pressed="true">All topics</button>`
      + topics.map((t) => `<button class="tchip" type="button" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}<sup>${counts[t]}</sup></button>`).join('')
      + (topics.length > 11 ? '<button class="more" type="button" id="more-topics">Expand</button>' : '');
  }

  function renderSide() {
    const done = CPS.filter((c) => solved(c.id));
    const r = 50, C = 2 * Math.PI * r;
    let offset = 0;
    const arcs = DIFFS.map((d) => {
      const n = done.filter((c) => c.difficulty === d).length;
      const len = (n / CPS.length) * C;
      const arc = n ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="currentColor" class="${diffClass(d)}" stroke-width="7" stroke-linecap="butt" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"/>` : '';
      offset += len;
      return arc;
    }).join('');
    const bars = DIFFS.map((d) => {
      const all = CPS.filter((c) => c.difficulty === d).length;
      const n = done.filter((c) => c.difficulty === d).length;
      return `<button class="bar-row ${diffClass(d)}" type="button" data-diff="${esc(d)}" aria-pressed="${filter.diff === d}">
        <span class="lbl">${esc(d)}</span><span class="n"><b>${n}</b>/${all}</span><span class="bar"><i style="width:${all ? (n / all) * 100 : 0}%"></i></span></button>`;
    }).join('');
    const first = CPS[0] ? CPS[0].id : '01';
    $('#side').innerHTML = `
      <div class="card prog">
        <div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" style="stroke: var(--fill)" stroke-width="7"/>${arcs}</svg>
          <div class="ring-c"><div><b>${done.length}</b><span>/${CPS.length}</span></div><small>Solved</small></div></div>
        <div class="bars">${bars}</div>
      </div>
      <div class="card how"><h2>Using the book</h2><ol>
        <li><span><b>You build one project.</b> Each assignment adds files to your ${esc(PROJECT.label)} project in <code>${esc(PROJECT_DIR)}</code>, and later assignments include them, so work through them in order. At the end, the project builds on its own and you can put it on GitHub.</span></li>
        <li><span><b>Write the code</b> here or in your own editor. An assignment's files open with the Boilerplate: the input/output code and the declarations, with TODOs for you. Choose From scratch above the editor to start from empty files.</span></li>
        ${LOCAL ? `<li><span><b>Run</b> checks the selected example and <b>Submit</b> runs every test. The verdict appears in Test Result, and Accepted marks the assignment solved. The book saves your files as you type.</span></li>`
          : `<li><span><b>Submit</b> copies your code. Paste it into the solution file and run <code>${esc(command(first))}</code> in ${esc(DATA.shell)}, in the workbook folder:<br><span class="path">${esc(DATA.folder)}</span></span></li>
        <li><span><b>Paste the checker's output</b> into Test Result. Accepted marks the assignment solved. If you open the workbook with <code>study</code> (double-click <code>study.cmd</code>) instead, Run and Submit build and run your code for you.</span></li>`}
        <li><span><b>Each assignment stands alone.</b> A test input carries what earlier assignments would produce, so an assignment's tests depend only on the earlier files it uses. <b>Re-check solved</b> reruns your solved assignments and shows any that a later change broke.</span></li>
        <li><span><b>If a test looks wrong,</b> run <code>${esc(command(first, '-Dispute <test-id> "why"'))}</code> to set it aside, then ask Claude to review your disputes.</span></li>
      </ol></div>`;
    if (CPS.length && done.length === CPS.length) renderFinish();
  }

  // Every assignment passes: show the project the learner built next to the author's.
  function renderFinish() {
    const card = document.createElement('div');
    card.className = 'card finish';
    card.innerHTML = `<h2>You built it</h2><p class="note">All ${CPS.length} assignments pass. <code>${esc(PROJECT_DIR)}</code> has its own build file and builds without the workbook, so you can put it on GitHub as it is.</p><div id="finish-files"></div>`;
    $('#side').prepend(card);
    const show = (all) => {
      // The assignment programs are test scaffolding: compare the project itself.
      const mine = all.filter((f) => !f.startsWith('assignments/') && !f.startsWith('third_party/'));
      const scaffolding = all.length - mine.length;
      const authorFiles = PROJECT.author ? PROJECT.author.files : [];
      const matched = new Set(treeMatch(mine, authorFiles));
      const listing = (files, hit) => files.map((f) => (hit(f) ? `<span class="hit">${esc(f)}</span>` : esc(f))).join('\n');
      $('#finish-files').innerHTML = (authorFiles.length ? `<div class="trees">
          <div><h3>Yours</h3><pre>${listing(mine, (f) => matched.has(f))}${scaffolding ? `\n<span class="muted">+ assignments/ and third_party/ (${scaffolding} files)</span>` : ''}</pre></div>
          <div><h3><a href="${esc(PROJECT.author.url)}" target="_blank" rel="noopener">The author's</a></h3><pre>${listing(authorFiles, (f) => [...matched].some((m) => sameFile(m, f)))}</pre></div></div>
          <p class="note">${matched.size} of your files have a counterpart in ${esc(PROJECT.author.label)} (in green).</p>` : '')
        + (LOCAL ? `<p class="note">Run what you built:</p>${cmdRow(PROJECT.build)}${cmdRow(PROJECT.run)}` : '');
    };
    if (!LOCAL) { show(PROJECT.layout.map((f) => shortName(f.path))); return; }
    api('/api/files').then((r) => show(r.files.map((f) => shortName(f.path)))).catch(() => {});
  }
  // Does one of the learner's files correspond to one of the author's? Colours both trees on the
  // finish card and gives the count. `mine` is a path in the project (e.g. "src/font/FontParser.h"),
  // `theirs` a path in the author's repository (e.g. "FontParser.h" or "utils/Geometry.h").
  // The same module name counts, whatever the folder, extension or naming style: font/FontParser.h
  // is the author's FontParser.h, and a Python project's font_parser.py would be their FontParser.cpp.
  function sameFile(mine, theirs) {
    const key = (path) => path.split('/').pop().replace(/\.[^.]*$/, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    return key(mine) === key(theirs);
  }
  function treeMatch(mine, theirs) {
    return mine.filter((m) => theirs.some((t) => sameFile(m, t)));
  }

  function renderRows() {
    const q = filter.q.trim().toLowerCase();
    const shown = CPS.filter((c) => (!filter.diff || c.difficulty === filter.diff)
      && (!filter.topic || topicsOf(c).includes(filter.topic))
      && (!q || (c.num + '. ' + c.title + ' ' + c.tags.flatMap((g) => g.text).join(' ')).toLowerCase().includes(q)));
    $('#rows').innerHTML = shown.map((c) => {
      const st = store.get(c.id + ':broke') ? '<span class="st-broke" title="Solved before, failing since a re-check">!</span>'
        : solved(c.id) ? `<span class="st-ok" title="Solved">${I.check}</span>`
        : drafted(c.id) ? `<span class="st-try" title="Attempted: a draft is saved">${I.tryIcon}</span>` : '';
      return `<tr data-id="${c.id}"><td class="st">${st}</td><td class="ti"><a href="#p${c.id}">${esc(c.num)}. ${esc(c.title)}</a></td>`
        + `<td class="te">${c.tests}</td><td class="di ${diffClass(c.difficulty)}">${esc(c.difficulty)}</td></tr>`;
    }).join('') || '<tr><td></td><td class="muted" colspan="3">No assignments match.</td></tr>';
    return shown;
  }

  function showList() {
    current = null;
    $('#ide-view').hidden = true;
    $('#list-view').hidden = false;
    document.body.classList.remove('in-ide');
    renderSide();
    renderRows();
    window.scrollTo(0, 0);
  }

  $('#topics').addEventListener('click', (e) => {
    if (e.target.id === 'more-topics') {
      const box = $('#topics');
      e.target.textContent = box.classList.toggle('collapsed') ? 'Expand' : 'Collapse';
      return;
    }
    const chip = e.target.closest('[data-topic]');
    if (!chip) return;
    filter.topic = chip.dataset.topic || null;
    $$('#topics [data-topic]').forEach((b) => b.setAttribute('aria-pressed', String(b === chip)));
    renderRows();
  });
  function setDiff(d) {
    filter.diff = d || null;
    $$('#diff [data-diff]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.diff || null) === filter.diff)));
    renderSide();
    renderRows();
  }
  $('#diff').addEventListener('click', (e) => { const b = e.target.closest('[data-diff]'); if (b) setDiff(b.dataset.diff); });
  $('#side').addEventListener('click', (e) => { const b = e.target.closest('.bar-row'); if (b) setDiff(filter.diff === b.dataset.diff ? '' : b.dataset.diff); });
  $('#q').addEventListener('input', (e) => { filter.q = e.target.value; renderRows(); });
  $('#rows').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-id]');
    if (row && !e.target.closest('a')) go('p' + row.dataset.id);
  });

  // ---------------------------------------------------------------- problem view
  function renderDesc(c) {
    const opened = Number(store.get(c.id + ':hints') || 0);
    const acc = (id, iconHtml, title, body) => `<div class="acc" ${id ? `id="${id}"` : ''}><button class="acc-btn" type="button" aria-expanded="false">${iconHtml}<span>${title}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${body}</div></div>`;
    const hintHtml = c.hints.map((h, k) => {
      const n = k + 1, locked = n > opened + 1;
      return `<div class="acc hint" data-n="${n}"><button class="acc-btn" type="button" aria-expanded="false"${locked ? ' disabled' : ''}>${I.bulb}<span>${esc(h.title)}<span class="acc-sub">${h.sub}</span></span>`
        + `<span class="acc-lock" ${locked ? '' : 'hidden'} title="Open hint ${n - 1} first">${I.lock}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${h.html}</div></div>`;
    }).join('');
    const tags = c.tags.map((g) => `<div class="tg"><span class="tg-label">${esc(g.label)}</span><div class="tg-items">${g.items.map((t) => `<span class="chip">${t}</span>`).join('')}</div></div>`).join('');

    $('#desc').innerHTML = `
      <div class="d-head"><h1>${esc(c.num)}. ${esc(c.title)}</h1><span class="solved-mark" id="solved-mark" ${solved(c.id) ? '' : 'hidden'}>Solved ${I.check}</span></div>
      <div class="chips">
        <span class="chip ${diffClass(c.difficulty)}">${esc(c.difficulty)}</span>
        ${c.tags.length ? `<button class="chip" type="button" data-jump="acc-topics">${I.tag}Topics</button>` : ''}
        ${c.hints.length ? `<button class="chip" type="button" data-jump="hints">${I.bulb}Hint</button>` : ''}
        <span class="chip">${c.tests} tests</span>
        <span class="chip" title="The checker compares only what your program writes, so you can use any structure, language or library.">Any language</span>
      </div>
      ${c.read ? `<div class="callout">${I.book}<div><b>${esc(c.readTitle || 'Read in the blog first')}.</b> ${c.read.replace(/^<p>|<\/p>$/g, '')}</div></div>` : ''}
      ${c.sources ? `<div class="accs accs-top">${acc('acc-sources', I.link, 'Source material', c.sources)}</div>` : ''}
      ${startCard(c)}
      <div class="flow">${c.body}</div>
      <div class="accs">
        ${c.tags.length ? acc('acc-topics', I.tag, 'Topics', tags) : ''}
        ${hintHtml}
        ${c.context ? acc('', I.map, 'Where this fits', c.context) : ''}
      </div>
      <div class="d-foot"><button class="btn" type="button" id="solve-btn"></button><span>Assignment ${CPS.indexOf(c) + 1} of ${CPS.length} · problem page <code>${esc(c.problem)}</code></span></div>`;

    const host = $('[data-examples]', $('#desc'));
    if (host) host.innerHTML = c.examples.map(exampleHtml).join('');
    paintSolved();
  }

  // Start here: the files to write in this assignment, your job in each, and how to begin.
  const withCode = (t) => esc(t || '').replace(/`([^`]+)`/g, '<code>$1</code>');
  // The first sentence of a job is the line under the file; the rest waits behind "Expand for more info".
  const splitJob = (t) => {
    const m = /^(.+?[.!?])\s+(?=[A-Z`(])/.exec(t || '');
    return m ? [m[1], t.slice(m[0].length)] : [t || '', ''];
  };
  const WAY_NOTES = {
    boilerplate: 'You get the input/output code and the declarations, and fill in each TODO.',
    blank: 'Each file starts with only a comment: why the file exists and your job in it.',
  };
  function startCard(c) {
    const order = [...c.files.filter((f) => f.role !== 'entry'), ...c.files.filter((f) => f.role === 'entry')];
    const from = (f) => (f.owner && BY[f.owner] ? esc(BY[f.owner].num) : '');
    const tag = (f) => (f.role === 'entry' ? '<span class="step-tag">The checker runs it</span>'
      : f.role === 'adds' ? `<span class="step-tag adds">Add to it · from ${from(f)}</span>` : '<span class="step-tag new">New</span>');
    const nameOf = (f) => {
      const rel = shortName(f.path), cut = rel.lastIndexOf('/');
      const name = esc(rel.slice(cut + 1)), dir = cut < 0 ? '' : `<span class="step-dir">${esc(rel.slice(0, cut + 1))}</span>`;
      return (LOCAL ? `<button type="button" class="step-name" data-open-file="${esc(f.path)}" title="Open in the editor">${name}</button>` : `<span class="step-name">${name}</span>`) + dir;
    };
    const steps = order.map((f, k) => {
      const [lead, rest] = splitJob(f.job);
      const why = f.role === 'entry' ? 'It reads a test input, calls your code and writes the answer. The checker compares that answer with the expected one.'
        : f.role === 'new' ? f.purpose : '';
      const more = rest || why ? `<details class="step-more"><summary><span class="when-closed">Expand for more info</span><span class="when-open">Show less</span>${I.down}</summary>
          <div class="step-more-body">${rest ? `<p><span class="lbl">In more detail</span>${withCode(rest)}</p>` : ''}${why ? `<p><span class="lbl">Why this file</span>${withCode(why)}</p>` : ''}</div></details>` : '';
      return `<li class="step"><span class="step-n">${k + 1}</span><div class="step-main">
        <div class="step-file">${nameOf(f)}${tag(f)}</div>
        <p class="step-job">${withCode(lead)}</p>${more}</div></li>`;
    }).join('');
    const link = (f) => (LOCAL ? `<button type="button" class="fpath" data-open-file="${esc(f.path)}">${esc(shortName(f.path))}</button>`
      : `<code class="fpath">${esc(shortName(f.path))}</code>`);
    const facts = [];
    if (c.files.some((f) => f.boilerplate != null)) {
      facts.push(['Start from', `<div class="ways" role="group" aria-label="Start from">
        <button type="button" class="way" data-start-kind="boilerplate">Boilerplate</button>
        <button type="button" class="way" data-start-kind="blank">From scratch</button></div>
        <span class="way-note">${WAY_NOTES[kindOf(c)]}</span>`]);
    }
    if (c.buildsOn.length) facts.push(['You can use', `<span>${c.buildsOn.map((f) => `${link(f)} <span class="muted">${from(f)}</span>`).join(' &nbsp;')}</span>`]);
    facts.push(['Done when', `<span>Submit says <b>Accepted</b> on all ${c.tests} tests.</span>`]);
    return `<section class="start" aria-labelledby="start-title">
      <div class="start-top"><span class="start-eyebrow">Start here</span>
        <h2 id="start-title">You write ${order.length === 1 ? 'one file' : `${order.length} files`}</h2>
        <p class="start-sub">${order.length === 1 ? '' : 'Go from top to bottom. '}The checker runs ${order.length === 1 ? 'it' : 'the last one'} on ${c.tests} test inputs and compares what it writes with the expected output. You can organise the code any way you like.</p></div>
      <ol class="steps">${steps}</ol>
      <dl class="start-facts">${facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    </section>`;
  }

  function exampleHtml(ex) {
    const title = `<p class="ex-title"><strong>${esc(ex.label)}:</strong> <span>${ex.name}</span></p>`;
    if (ex.raw) return `<div class="ex">${title}<div class="flow">${ex.raw}</div></div>`;
    const out = ex.output != null ? `<pre>${esc(ex.output)}</pre>`
      : ex.image ? `<img class="shot" src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '';
    return `<div class="ex">${title}<div class="ex-block">
      <div class="ex-row"><span class="ex-k">Input:</span><pre>${esc(ex.input)}</pre></div>
      ${out ? `<div class="ex-row"><span class="ex-k">Output:</span>${out}</div>` : ''}
      ${ex.explain ? `<div class="ex-row"><span class="ex-k">Explanation:</span><div class="flow">${ex.explain}</div></div>` : ''}
    </div></div>`;
  }

  function toggleAcc(box, open) {
    const btn = $('.acc-btn', box), body = $('.acc-body', box);
    const show = open === undefined ? body.hidden : open;
    body.hidden = !show;
    btn.setAttribute('aria-expanded', String(show));
  }

  // Hints open in order; the furthest one opened is remembered.
  function openHint(box) {
    const n = Number(box.dataset.n), key = current + ':hints';
    const opened = Number(store.get(key) || 0);
    if (n > opened) {
      store.set(key, String(n));
      $$('.acc.hint', $('#desc')).forEach((h) => {
        const locked = Number(h.dataset.n) > n + 1;
        $('.acc-btn', h).disabled = locked;
        $('.acc-lock', h).hidden = !locked;
      });
      toggleAcc(box, true);
    } else toggleAcc(box);
  }

  $('#desc').addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {
      const target = jump.dataset.jump === 'hints' ? $('.acc.hint', $('#desc')) : $('#' + jump.dataset.jump);
      if (target) {
        if (jump.dataset.jump !== 'hints') toggleAcc(target, true);
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      return;
    }
    const btn = e.target.closest('.acc-btn');
    if (btn) {
      const box = btn.parentElement;
      if (box.classList.contains('hint')) openHint(box); else toggleAcc(box);
      return;
    }
    if (e.target.closest('#solve-btn')) setSolved(current, !solved(current));
    const file = e.target.closest('[data-open-file]');
    if (file) openTab(file.dataset.openFile);
    const way = e.target.closest('[data-start-kind]');
    if (way) { const b = $(`#kind [data-kind="${way.dataset.startKind}"]`); if (b) b.click(); }
  });

  // The Editorial: a solution proven to pass every test (the reference, fingerprinted when it
  // passed), then how the blog author did it. Locked until Accepted, but always one click away.
  let solFile = 0;
  function renderEditorial(c) {
    const sol = c.solutionCode;
    const has = !!c.editorial || !!sol;
    $('#ed-tab').hidden = !has;
    $('#ed-sep').hidden = !has;
    if (!has) return;
    if (!(solved(c.id) || peeked.has(c.id))) {
      $('#editorial').innerHTML = `<div class="locked">${I.lock}<h2>Solve it first, or peek</h2><p>The editorial has a complete solution that passes every test${c.editorial ? ', and compares it with the author\'s code from the blog' : ''}. The book opens it for you when the checker says Accepted.</p><button class="btn" type="button" id="peek">Show the solution anyway</button></div>`;
      return;
    }
    solFile = Math.min(solFile, sol ? sol.files.length - 1 : 0);
    const proof = sol && sol.proof
      ? `<span class="badge ok">${I.check} Passes all ${sol.proof.total} tests · checked ${esc(sol.proof.date)}</span>`
      : `<span class="badge warn">Not yet checked against the tests</span>`;
    const files = sol && sol.files.length > 1
      ? `<div class="case-pills" role="tablist">${sol.files.map((f, i) => `<button class="pill-btn" type="button" role="tab" data-sol="${i}" aria-selected="${i === solFile}">${esc(f.path)}</button>`).join('')}</div>` : '';
    $('#editorial').innerHTML = `<h1 class="ed-title">Editorial</h1>`
      + (sol ? `<section class="ed-sec"><h2>A solution that passes <span class="muted">(${esc(PROJECT.label)})</span></h2>${proof}
          <p class="note">This solution follows the problem page and doesn't copy the blog's code. Yours can look different and still pass, because the checker compares only what your program writes.</p>
          ${files}<div class="sol-head"><code>${esc(sol.files[solFile].path)}</code><button class="btn" type="button" id="sol-copy">Copy</button></div>
          <pre class="sol-code" id="sol-code"></pre>
          ${sol.also.length ? `<p class="note">It also uses earlier assignments' files: ${sol.also.map((u) => `<code>${esc(u)}</code>`).join(', ')}. Their Editorials show them.</p>` : ''}</section>` : '')
      + (c.editorial ? `<section class="ed-sec"><h2>${esc(c.editorial.title)}</h2><div class="flow">${c.editorial.html}</div></section>` : '');
    if (sol) {
      const box = $('#sol-code'), text = sol.files[solFile].text;
      if (window.CodeMirror && window.CodeMirror.runMode) window.CodeMirror.runMode(text, modeFor(sol.files[solFile].path), box);
      else box.textContent = text;
    }
  }
  $('#editorial').addEventListener('click', (e) => {
    const c = BY[current];
    if (e.target.closest('#peek')) { peeked.add(current); renderEditorial(c); return; }
    const tab = e.target.closest('[data-sol]');
    if (tab) { solFile = Number(tab.dataset.sol); renderEditorial(c); return; }
    const copy = e.target.closest('#sol-copy');
    if (copy) copyText(c.solutionCode.files[solFile].text).then((ok) => flash(copy, ok));
  });

  function setLeft(tab) {
    $$('[data-left]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.left === tab)));
    $('#desc').hidden = tab !== 'desc';
    $('#editorial').hidden = tab !== 'editorial';
  }
  function setBottom(tab) {
    $$('[data-bottom]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.bottom === tab)));
    $('#cases').hidden = tab !== 'cases';
    $('#result').hidden = tab !== 'result';
  }
  $$('[data-left]').forEach((b) => b.addEventListener('click', () => setLeft(b.dataset.left)));
  $$('[data-bottom]').forEach((b) => b.addEventListener('click', () => setBottom(b.dataset.bottom)));

  // ---- test cases
  const casesOf = (c) => c.examples.filter((ex) => !ex.raw && ex.input != null);
  function renderCases(c) {
    const list = casesOf(c);
    if (!list.length) {
      $('#cases').innerHTML = `<p class="note">This assignment has no worked examples. <code>${esc(command(c.id))}</code> runs all ${c.tests} tests.</p>`;
      return;
    }
    caseIndex = Math.min(caseIndex, list.length - 1);
    const ex = list[caseIndex];
    const expected = ex.output != null ? `<pre class="field-v">${esc(ex.output)}</pre>`
      : ex.image ? `<img src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '<p class="note">See the problem page.</p>';
    $('#cases').innerHTML = `
      <div class="case-pills" role="tablist">${list.map((x, i) => `<button class="pill-btn" type="button" role="tab" data-case="${i}" aria-selected="${i === caseIndex}">Case ${i + 1}</button>`).join('')}</div>
      ${ex.name ? `<p class="case-name">${ex.name}</p>` : ''}
      <div class="field"><div class="field-k">input</div><pre class="field-v">${esc(ex.input)}</pre></div>
      <div class="field"><div class="field-k">expected output</div>${expected}</div>
      ${ex.test ? `<div class="field"><div class="field-k">run just this case (test ${esc(ex.test)})</div>${cmdRow(command(c.id, '-Case ' + ex.test))}</div>` : ''}`;
  }
  $('#cases').addEventListener('click', (e) => {
    const b = e.target.closest('[data-case]');
    if (b) { caseIndex = Number(b.dataset.case); renderCases(BY[current]); }
  });
  const cmdRow = (text) => `<div class="cmd"><code>${esc(text)}</code><button class="btn" type="button" data-copy="${esc(text)}">Copy</button></div>`;

  // ---- results: the learner pastes the checker's output; we read the verdict from it.
  // Every outcome gets a plain sentence saying what happened and what to do next.
  function looksLikeCode(t, c) {
    const s = t.trim();
    if ([code(), ...c.files.flatMap((f) => [f.blank, f.boilerplate])].some((x) => x && x.trim() === s)) return true;
    return !/^Assignment \S+ - /m.test(s)
      && /^\s*(#include\b|#!|import \S|from \S+ import|def \w+\(|(int|void|auto) main\s*\(|fn main\(|func main\(|function \w+\(|\/\/ Assignment \d)/m.test(s);
  }
  function parseOutput(text, c) {
    const t = text.replace(/\r/g, '');
    const head = t.match(/^Assignment (\S+) - /m);
    const run = `<code>${esc(command(c.id))}</code>`;
    let v = null, m;
    if ((m = t.match(/Accepted: (\d+) \/ (\d+) tests passed(?: \((\d+) disputed\))?/))) {
      v = { kind: 'ok', label: 'Accepted', passed: +m[1], total: +m[2], disputed: +(m[3] || 0) };
    } else if ((m = t.match(/Wrong Answer: (\d+) \/ (\d+) tests passed/))) {
      v = { kind: 'bad', label: 'Wrong Answer', passed: +m[1], total: +m[2] };
      v.help = /wrote nothing in any failing test/.test(t)
        ? `Your program ran but didn't write anything. The checker starts it with two file names, the input to read and the output to write; write your answer to the second one.`
        : `Some tests failed. Each one below shows the expected output, what your program wrote, and the requirement the checker thinks it breaks.`;
    } else if (/Compile Error/.test(t)) {
      v = { kind: 'bad', label: 'Compile Error' };
      v.help = /has no main\(\) function/.test(t)
        ? `Your code has no <code>main</code> function, so it can't be built into a program the checker can run. Add a <code>main</code> that reads the input file and writes the output file.`
        : `Your code didn't build, so no tests ran. The compiler's messages are below; fix the first error first, since later ones often follow from it.`;
    } else if ((m = t.match(/Not implemented yet:? ?(\S*)/))) {
      v = { kind: 'warn', label: 'Not implemented yet' };
      v.help = `<code>${esc(m[1] || 'A function')}</code> is still a TODO in your files. Write it, save, and run ${run} again.`;
    } else if (/Not started yet/.test(t)) {
      v = { kind: 'warn', label: 'Not started yet' };
      v.help = /is empty\./.test(t)
        ? `<code>${esc(c.entry)}</code> is empty, so there was nothing to check. Write the program in it, save, and run ${run} again.`
        : /Created this assignment's files/.test(t) ? `The checker created this assignment's files in your project. Write them, save, and run ${run} again.`
        : `<code>${esc(c.entry)}</code> is still the blank starter, so there was nothing to check. Write your program, save, and run ${run} again.`;
    } else if (/^Passed\s*$/m.test(t)) {
      v = { kind: 'ok', label: 'Passed', single: true, help: 'This one test passes. Run all of them to get a verdict for the assignment.' };
    } else if ((m = t.match(/^Failed: (.*)$/m))) {
      v = { kind: 'bad', label: 'Failed', single: true, help: `This one test fails: ${esc(m[1])}` };
    } else if (!t.trim()) {
      v = { kind: 'unknown', label: 'Nothing was pasted', help: 'The box was empty. Copy what the checker printed in the terminal, then paste it here.' };
    } else if (looksLikeCode(t, c)) {
      v = { kind: 'unknown', label: "That's your code, not the result", code: true,
        help: `Submit copied your code so you can put it in your project. Paste it into its file and save, run ${run} in ${esc(DATA.shell)}, then copy what the checker prints and paste that here.` };
    } else if (head) {
      v = { kind: 'unknown', label: 'The output is cut off',
        help: `This starts like the checker's output but has no verdict at the end. Copy everything it printed, down to the last line (it starts with Accepted, Wrong Answer, Compile Error, Not started yet or Not implemented yet).` };
    } else {
      v = { kind: 'unknown', label: "That isn't the checker's output",
        help: `Paste what ${run} prints in the terminal. It starts with “Assignment ${esc(c.id)} - …” and ends with a verdict such as “Accepted: ${c.tests} / ${c.tests} tests passed.”` };
    }
    v.raw = t;
    v.other = head && head[1] !== c.id ? head[1] : null;
    v.reqs = [...t.matchAll(/^ {2}(\S+)\s+(.+?) \.{2,}\s+(\d+) \/ (\d+)/gm)].map((r) => ({ id: r[1], text: r[2], ok: +r[3], n: +r[4] }));
    v.fails = [];
    const lines = t.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const f = lines[i].match(/^\s+x (\S+)\s+(.*)$/);
      if (!f) continue;
      const detail = [];
      while (i + 1 < lines.length && /^ {9,}\S/.test(lines[i + 1])) detail.push(lines[++i].trim());
      v.fails.push({ id: f[1], title: f[2], detail: detail.join('\n') });
    }
    return v;
  }

  function verdictHtml(v, c) {
    let h = `<div class="verdict ${v.kind}"><h2>${esc(v.label)}</h2>`
      + (v.total ? `<span class="sub">${v.passed} / ${v.total} testcases passed${v.disputed ? ` · ${v.disputed} disputed` : ''}</span>` : '')
      + `<button class="btn" type="button" id="clear-result">Clear</button></div>`;
    if (v.other) h += `<p class="note warn">This output is from assignment ${esc(v.other)}, not ${esc(c.id)}, so it wasn't counted here. Open assignment ${esc(v.other)} and paste it there.</p>`;
    else if (v.kind === 'ok' && !v.single) h += `<p class="note">The book marked the assignment solved and opened the Editorial tab.</p>`;
    if (v.help) h += `<p class="note">${v.help}</p>`;
    if (v.reqs.length) {
      h += '<div class="req-rows">' + v.reqs.map((r) => `<div class="req-row${r.ok === r.n ? '' : ' fail'}"><span class="rid">${esc(r.id)}</span><span class="rq" title="${esc(r.text)}">${esc(r.text)}</span><span class="cnt">${r.ok} / ${r.n}</span><span class="bar"><i style="width:${r.n ? (r.ok / r.n) * 100 : 0}%"></i></span></div>`).join('') + '</div>';
    }
    h += v.fails.map((f) => `<div class="fail-card"><span class="id">${esc(f.id)}</span><span class="t">${esc(f.title)}</span><pre>${esc(f.detail)}</pre></div>`).join('');
    if (v.kind !== 'ok' && !v.fails.length && !v.reqs.length && v.raw.trim()) {
      const lines = v.raw.trim().split('\n');
      const shown = v.kind === 'unknown' ? lines.slice(0, 12) : lines.slice(-40);
      h += `<div class="field-k">${v.kind === 'unknown' ? 'What you pasted' : 'What the checker printed'}</div>`
        + `<pre class="raw">${esc(shown.join('\n'))}${v.kind === 'unknown' && lines.length > 12 ? '\n…' : ''}</pre>`;
    }
    return h;
  }

  function renderResult(c, notice) {
    const saved = store.get(c.id + ':result');
    const v = saved ? parseOutput(saved, c) : null;
    const act = lastAction[c.id];
    const runCmd = act && act.kind === 'run' && act.test ? command(c.id, '-Case ' + act.test) : command(c.id);
    const copied = !act ? '<b>Copy your code</b> and paste it over'
      : act.empty ? '<b>Nothing to copy yet:</b> the editor is empty. Write your program, then paste it over'
      : act.copied ? '<b>Code copied.</b> Paste it over'
      : '<b>Copy didn\'t work here:</b> the book selected the code in the editor, so press Ctrl+C, then paste it over';
    $('#result').innerHTML = (notice ? `<p class="note warn">${notice}</p>` : '')
      + (act && act.warn ? `<p class="note warn">${act.warn}</p>` : '') + (v ? verdictHtml(v, c) : '') + `
      <ol class="steps">
        <li class="step${act && act.copied ? ' done' : ''}"><span>1</span><div><p>${copied} <code>${esc(act && act.path ? act.path : c.entry)}</code>, and the same for this assignment's other files you changed (the tabs above the editor). Skip this step if you write in the project's files with your own editor.</p>
          <div><button class="btn" type="button" id="copy-again">Copy code</button></div></div></li>
        <li class="step"><span>2</span><div><p><b>Run the checker</b> in ${esc(DATA.shell)}, in <code>${esc(DATA.folder)}</code>:</p>${cmdRow(runCmd)}</div></li>
        <li class="step${v && v.kind !== 'unknown' ? ' done' : ''}"><span>3</span><div><p><b>Copy what the checker prints</b> in the terminal and paste it here (the result, not your code).</p>
          <textarea class="paste" id="paste" spellcheck="false" placeholder="Paste the checker's output here (Ctrl+V). It starts with “Assignment ${esc(c.id)} - …”"></textarea></div></li>
      </ol>
      <details class="more"><summary>More commands, and what a failure looks like</summary><div>
        ${cmdRow(command(c.id))}${cmdRow(command(c.id, '-Fresh'))}${cmdRow(command(c.id, '-Dispute <test-id> "why"'))}
        <div class="flow" style="margin-top:14px">${c.checking}</div></div></details>`;
  }

  function takeOutput(text) {
    if (!current) return;
    const c = BY[current];
    if (!text.trim()) {
      renderResult(c, 'The box was empty, so there was nothing to read. Copy what the checker printed in the terminal (everything from “Assignment ' + esc(c.id) + ' - …” to the last line), then paste it here.');
      return;
    }
    store.set(c.id + ':result', text);
    if (lastAction[c.id]) lastAction[c.id].warn = null;  // the pasted result says more than the Submit-time warning
    const v = parseOutput(text, c);
    if (v.kind === 'ok' && !v.single && !v.other) setSolved(c.id, true);
    renderResult(c);
    $('#result').scrollTop = 0;
  }
  $('#result').addEventListener('paste', (e) => {
    if (e.target.id !== 'paste') return;
    e.preventDefault();
    takeOutput((e.clipboardData || window.clipboardData).getData('text'));
  });
  $('#result').addEventListener('change', (e) => { if (e.target.id === 'paste') takeOutput(e.target.value); });
  $('#result').addEventListener('click', (e) => {
    if (e.target.closest('#clear-result')) { store.del(current + ':result'); renderResult(BY[current]); }
    if (e.target.closest('#copy-again')) act(lastAction[current] ? lastAction[current].kind : 'submit');
  });

  // ---- solved state
  function setSolved(id, value) {
    if (value) store.set(id + ':solved', '1'); else store.del(id + ':solved');
    if (id === current) { paintSolved(); renderEditorial(BY[id]); }
  }
  function paintSolved() {
    if (!current) return;
    const done = solved(current);
    const mark = $('#solved-mark'), btn = $('#solve-btn');
    if (mark) mark.hidden = !done;
    if (btn) { btn.innerHTML = done ? `${I.check} Solved` : 'Mark as solved'; btn.classList.toggle('done', done); }
    $('#tb-prog').innerHTML = `<b>${CPS.filter((c) => solved(c.id)).length}</b> / ${CPS.length} solved`;
  }

  // ---- editor
  // A assignment's files open as tabs, one CodeMirror document each: the project files it creates
  // or adds to, then its entry program. Files of earlier assignments can be opened from the Files
  // panel. The published book keeps them in this browser; with study, they're your files on disk.
  let cm = null, plainEditor = null, saveTimer = 0;
  const docs = {};  // path -> CodeMirror.Doc
  function initEditor() {
    const host = $('#editor');
    if (window.CodeMirror) {
      cm = window.CodeMirror(host, {
        lineNumbers: true, matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true, indentWithTabs: false,
        extraKeys: {
          // In Vim's Normal and Visual modes, Tab belongs to Vim.
          Tab: (ed) => (vimNormal(ed) ? window.CodeMirror.Pass
            : ed.somethingSelected() ? ed.indentSelection('add') : ed.replaceSelection(' '.repeat(ed.getOption('indentUnit')), 'end')),
          'Shift-Tab': (ed) => (vimNormal(ed) ? window.CodeMirror.Pass : ed.execCommand('indentLess')),
        },
      });
      if (window.CodeMirror.Vim) {
        window.CodeMirror.Vim.defineEx('write', 'w', () => saveNow());
        cm.on('vim-mode-change', (e) => { vimMode = e.mode + (e.subMode ? ' ' + e.subMode : ''); showPos(); });
        setVim(store.get('editor:vim') === '1');
      } else {
        $('#vim').hidden = true;  // the keymap didn't load
      }
      cm.on('changes', saveSoon);
      cm.on('cursorActivity', showPos);
      if (window.ResizeObserver) {
        let frame = 0;
        new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => cm.refresh()); }).observe(host);
      }
    } else {
      plainEditor = document.createElement('textarea');
      plainEditor.className = 'fallback-editor';
      plainEditor.spellcheck = false;
      plainEditor.setAttribute('aria-label', 'Code');
      host.appendChild(plainEditor);
      plainEditor.addEventListener('input', saveSoon);
    }
  }
  const code = () => (cm ? cm.getValue() : plainEditor.value);
  const EXT_MODES = { cpp: 'text/x-c++src', cc: 'text/x-c++src', cxx: 'text/x-c++src', h: 'text/x-c++src', hpp: 'text/x-c++src',
    c: 'text/x-csrc', java: 'text/x-java', cs: 'text/x-csharp', kt: 'text/x-kotlin', py: 'text/x-python', js: 'text/javascript',
    mjs: 'text/javascript', ts: 'text/typescript', rs: 'text/x-rustsrc', go: 'text/x-go', lua: 'text/x-lua' };
  const modeFor = (path) => EXT_MODES[(path.split('.').pop() || '').toLowerCase()] || 'text/plain';
  const docOf = (path) => docs[path];
  const textOf = (path) => (cm ? (docs[path] ? docs[path].getValue() : null) : path === live.active ? plainEditor.value : null);
  const fileIn = (c, path) => (c ? c.files.find((f) => f.path === path) || null : null);

  // Blank or boilerplate: a assignment's own files (its entry program and the files it creates) start

  const ownFiles = (c) => c.files.filter((f) => f.role !== 'adds');
  // Boilerplate unless the learner chose to start from scratch (or there's no boilerplate).
  const kindOf = (c) => (store.get(c.id + ':kind') !== 'blank' && c.files.some((f) => f.boilerplate != null) ? 'boilerplate' : 'blank');
  const starterOf = (f, kind) => (kind === 'boilerplate' && f.boilerplate != null ? f.boilerplate : f.blank);
  const kindName = (kind) => (kind === 'boilerplate' ? 'Boilerplate' : 'From scratch');

  // The published book: what a file shows before you've typed in it.
  function startText(c, path) {
    const draft = store.get(draftKey(path)), f = fileIn(c, path);
    return draft !== null ? draft : f ? starterOf(f, f.role === 'adds' ? 'blank' : kindOf(c)) : '';
  }
  function useStarter(c, kind) {
    if (kind === 'blank') store.set(c.id + ':kind', kind); else store.del(c.id + ':kind');

    if (LOCAL) {
      api('/api/starter', { method: 'POST', body: JSON.stringify({ checkpoint: c.id, kind }) }).then((r) => {
        setOnline(true);
        r.files.forEach((f) => { live.disk[f.path] = fromDisk(f); setDocQuietly(f.path, live.disk[f.path].text); });
        showSaved();

      return;
    }
    live.quiet = true;
    ownFiles(c).forEach((f) => {
      store.del(draftKey(f.path));

  }
  function paintKind(c) {
    $('#kind').hidden = !c.files.some((f) => f.boilerplate != null);
    $$('#kind [data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kindOf(c))));
    $$('[data-start-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.startKind === kindOf(c))));
    $$('.way-note').forEach((n) => { n.textContent = WAY_NOTES[kindOf(c)]; });
  }
  // Changed from both starters: replacing it would lose work, so ask first.
  function ownChanged(c) {
    return ownFiles(c).some((f) => {
      const text = textOf(f.path) ?? (LOCAL ? (live.disk[f.path] || {}).text : store.get(draftKey(f.path)));

  }
  // A one-line question in the code toolbar (the page can't use confirm()).
  let onYes = null, onNo = null;
  function ask(text, yes, labels, no) {

    onNo = no || null;

    $('#confirm-no').textContent = (labels && labels[1]) || 'Cancel';
    $('#confirm').hidden = false;
    $('#confirm-yes').focus();
  }
  const filesWord = (c) => (ownFiles(c).length === 1 ? 'file' : `${ownFiles(c).length} files`);
  $('#kind').addEventListener('click', (e) => {
    const b = e.target.closest('[data-kind]');
    const c = BY[current];
    if (!b || !c || b.dataset.kind === kindOf(c)) return;
    if (!ownChanged(c)) useStarter(c, b.dataset.kind);
    else ask(`Replace this assignment's ${filesWord(c)} with ${kindPhrase(b.dataset.kind)}?`, () => useStarter(c, b.dataset.kind));
  });
  $('#reset').addEventListener('click', () => {
    const c = BY[current];
    ask(`Reset this assignment's ${filesWord(c)} to ${kindPhrase(kindOf(c))}?`, () => useStarter(c, kindOf(c)));
  });
  $('#confirm-no').addEventListener('click', () => {
    $('#confirm').hidden = true;

  });
  $('#confirm-yes').addEventListener('click', () => {
    $('#confirm').hidden = true;
    if (current && onYes) onYes();
  });

  function loadEditor(c) {
    $('#confirm').hidden = true;

    openCheckpointFiles(c);
  }

  function saveSoon() {
    if (live.quiet) return;

    clearTimeout(saveTimer);
    $('#saved').textContent = 'Saving…';
    const id = current, path = live.active;

      showSaved();

  }
  function keepDraft(path) {
    const text = textOf(path), f = fileIn(BY[current], path);

  }
  function showSaved() {
    if (!current) return;
    const path = live.active;
    if (LOCAL) {
      const known = live.disk[path];
      $('#saved').textContent = !live.online ? 'Not saved: the study server has stopped'
        : live.noProject ? 'No project yet'
        : live.conflict[path] ? 'The file changed on disk'
        : known && known.text === textOf(path) ? `Saved to ${path}` : 'Saving…';
      return;
    }

  function showPos() {

  }

  // ---- Vim keys (CodeMirror's Vim keymap), remembered in this browser
  let vimOn = false, vimMode = 'normal';
  function vimNormal(ed) { return !!(ed.state.vim && !ed.state.vim.insertMode); }
  function setVim(on) {

  }
  $('#vim').addEventListener('click', () => { setVim(!vimOn); if (cm) cm.focus(); });

  // Save now: :w in Vim, or Ctrl+S anywhere in the problem view.
  function saveNow() {
    if (!current) return;
    if (LOCAL) { saveAll(); return; }
    clearTimeout(saveTimer);
    keepDraft(live.active);
    showSaved();
  }

  // ---- clipboard
  function copyText(text) {
    try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch (e) { return Promise.resolve(false); }
  }
  function selectAllCode() {
    if (cm) { cm.focus(); cm.execCommand('selectAll'); } else { plainEditor.focus(); plainEditor.select(); }
  }
  function flash(btn, ok) {
    const old = btn.innerHTML;
    btn.innerHTML = ok ? 'Copied' : 'Press Ctrl+C';
    btn.classList.toggle('done', ok);
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove('done'); }, 1400);
  }
  $('#copy-code').addEventListener('click', () => {
    const btn = $('#copy-code');
    copyText(code()).then((ok) => {
      if (!ok) selectAllCode();
      btn.style.color = ok ? 'var(--ok)' : '';
      setTimeout(() => { btn.style.color = ''; }, 1200);
    });
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    copyText(b.dataset.copy).then((ok) => {
      if (!ok) {
        const range = document.createRange();
        range.selectNodeContents(b.previousElementSibling);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      }
      flash(b, ok);
    });
  });

  // ---- Run / Submit: copy the code, then show what to run in the terminal
  function act(kind) {
    if (!current) return;
    if (LOCAL) { runLive(kind, {}); return; }
    const c = BY[current];
    const list = casesOf(c);
    const test = kind === 'run' && list[caseIndex] ? list[caseIndex].test : null;
    const path = live.active, text = code(), f = fileIn(c, path);
    const entry = { kind, test, copied: false, empty: !text.trim(), path };
    // Say up front what the checker will answer, instead of letting it look like a failure later.
    if (entry.empty) entry.warn = `<code>${esc(path)}</code> is empty. Write it first: the checker needs every file of this assignment.`;
    else if (f && f.role === 'entry' && text.trim() === f.blank.trim()) entry.warn = 'This is still the blank starter (an empty <code>main</code>), so the checker will answer “Not started yet”. Write your program first, or pick Boilerplate above the editor for ready-made input/output code.';
    lastAction[c.id] = entry;
    if (entry.empty) {
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
      return;
    }
    copyText(text).then((ok) => {
      entry.copied = ok;
      if (!ok) selectAllCode();
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
    });
  }
  $('#run').addEventListener('click', () => act('run'));
  $('#submit').addEventListener('click', () => act('submit'));
  document.addEventListener('keydown', (e) => {
    if (!current || !(e.ctrlKey || e.metaKey) || e.target.id === 'paste') return;
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); saveNow(); return; }
    if (e.key === 'Enter') { e.preventDefault(); act('submit'); }
    else if (e.key === "'") { e.preventDefault(); act('run'); }
  }, true);

  // ---- tabs: the assignment's files, plus any other file of the project you opened
  const LOCAL = window.WORKBOOK_LOCAL || null;
  const live = { online: !!LOCAL, disk: {}, conflict: {}, conflictData: {}, report: {}, marks: {}, busy: false,
    quiet: false, tabs: [], active: null, project: [], showTree: false, tick: 0, noProject: false };
  const ENTRY_OF = Object.fromEntries(CPS.map((c) => [c.entry, c]));  // an entry program -> its assignment
  const tabOrder = (c) => [...c.files.filter((f) => f.role !== 'entry'), ...c.files.filter((f) => f.role === 'entry')].map((f) => f.path);
  const isExtra = (path) => !fileIn(BY[current], path);
  const keepTabs = () => { if (current) store.set('tabs:' + current, JSON.stringify(live.tabs.filter(isExtra))); };
  function openCheckpointFiles(c) {
    const kept = (() => { try { return JSON.parse(store.get('tabs:' + c.id) || '[]'); } catch (e) { return []; } })();
    const own = tabOrder(c);
    live.tabs = [...own, ...(LOCAL ? kept.filter((p) => !own.includes(p)) : [])];
    if (!cm) live.tabs = own;
    activate(live.tabs[0]);
    if (LOCAL) startCheckpoint(c);
  }
  // Opening a assignment creates its files in your project (never over ones that exist).
  async function startCheckpoint(c) {
    try {
      await api('/api/start', { method: 'POST', body: JSON.stringify({ checkpoint: c.id, kind: kindOf(c) }) });
      setOnline(true);
      live.noProject = false;
    } catch (e) {
      if (e.status === 409) live.noProject = true; else if (!e.status) setOnline(false);
    }
    paintNoProject();
    if (live.noProject || current !== c.id) return;
    await Promise.all(live.tabs.map((p) => loadFile(p)));
    if (live.showTree) refreshProject();
  }
  function openTab(path, line) {
    const owner = ENTRY_OF[path];  // another assignment's entry program: go to that assignment
    if (owner && owner.id !== current) { go('p' + owner.id); return; }
    if (!live.tabs.includes(path)) { live.tabs.push(path); keepTabs(); }
    activate(path, line);
  }
  function activate(path, line) {
    if (!cm && live.active && live.active !== path && !LOCAL) keepDraft(live.active);
    live.active = path;
    const unit = /\.py$/.test(path) ? 4 : (BY[current] && BY[current].indent) || 2;
    if (cm) {
      if (!docs[path]) {
        docs[path] = window.CodeMirror.Doc(LOCAL ? '' : startText(BY[current], path), modeFor(path));
        if (LOCAL && !live.noProject) loadFile(path);
      }
      cm.swapDoc(docs[path]);

      cm.setOption('tabSize', unit);

      requestAnimationFrame(() => cm.refresh());
    } else {
      plainEditor.value = LOCAL ? ((live.disk[path] || {}).text || '') : startText(BY[current], path);

    showPos();

  }

  function paintTabs() {

    bar.hidden = false;
    const c = BY[current];
    const hint = (p) => {
      const f = fileIn(c, p);
      return !f ? 'Another file of your project' : f.role === 'entry' ? 'The program the checker runs'
        : f.role === 'adds' ? `From assignment ${f.owner && BY[f.owner] ? BY[f.owner].num : ''}: this assignment adds to it` : 'New in this assignment';
    };
    bar.innerHTML = live.tabs.map((p) => `<span class="ftab${p === live.active ? ' on' : ''}${live.conflict[p] ? ' warn' : ''}" role="tab" aria-selected="${p === live.active}" title="${esc(hint(p))}">`
      + `<button type="button" data-tab="${esc(p)}">${esc(shortName(p))}</button>`
      + (isExtra(p) ? `<button type="button" class="x" data-close="${esc(p)}" aria-label="Close ${esc(shortName(p))}">×</button>` : '') + '</span>').join('');
  }
  function paintFiles() {
    const path = live.active || '';

    const other = { md: 'Markdown', txt: 'Text', json: 'JSON', cmake: 'CMake' }[ext] || (/CMakeLists\.txt$/.test(path) ? 'CMake' : null);

  // ---------------------------------------------------------------- live mode (.\study)
  // Served by tools/serve.py, the page saves your files and runs the checker itself, so Run and
  // Submit show the verdict directly. The published copy of the book keeps the copy-and-paste steps.
  const pending = new Set();  // files with unsaved edits
  let diskTimer = 0;

  async function api(path, options) {
    const res = await fetch(path, Object.assign({ headers: { 'X-Workbook-Token': LOCAL.token, 'Content-Type': 'application/json' } }, options || {}));
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw Object.assign(new Error(body.error || res.statusText), { status: res.status, body });
    }
    return res.json();
  }
  function setOnline(ok) {
    if (live.exited) return;
    if (live.online !== ok) { live.online = ok; paintLive(); showSaved(); }
  }
  function paintLive() {
    const el = $('#live');
    if (!LOCAL) return;
    el.hidden = false;
    el.className = 'live ' + (!live.online ? 'off' : LOCAL.problem ? 'warn' : 'on');
    el.textContent = !live.online ? 'Disconnected' : LOCAL.problem ? "Can't build yet" : 'Live';
    el.title = !live.online ? 'The study server has stopped. Start it again (double-click study.cmd, or run .\\study), then reload this page.'
      : LOCAL.problem || `Run and Submit build and check your project in ${LOCAL.folder}`;
  }

  // ---- files on disk
  const fromDisk = (f) => ({ mtime: f.mtime, text: (f.text === null ? '' : f.text).replace(/\r\n/g, '\n'), missing: f.text === null });
  function setDocQuietly(path, text) {
    // Swap in text from disk without saving it straight back, keeping the cursor where it was.
    live.quiet = true;
    const doc = docOf(path);
    if (doc) { const at = doc.getCursor(); doc.setValue(text); doc.setCursor(at); }
    else if (!cm && path === live.active) plainEditor.value = text;
    live.quiet = false;
  }
  async function loadFile(path) {
    try {
      const f = fromDisk(await api('/api/file?path=' + encodeURIComponent(path)));
      setOnline(true);
      live.disk[path] = f;
      if (!docOf(path) && cm) docs[path] = window.CodeMirror.Doc(f.text, modeFor(path));
      else if (textOf(path) !== f.text) setDocQuietly(path, f.text);
    } catch (e) { if (!e.status) setOnline(false); }

  }
  function saveSoonLive() {
    if (!live.active) return;

  }
  async function saveAll() {
    if (live.exited) return;
