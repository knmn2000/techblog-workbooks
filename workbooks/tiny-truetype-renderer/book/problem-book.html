00 400 off 400 0 off","output":"a 344 x 344 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAVgAAAFYCAIAAACZDnMXAAAF+ElEQVR42u3a23LqyhJFQf3/T+NHwI0dCPWtmJnhZ86iu2qE0NnHAQAAAAAAAAAA8I5b84cLJu56zYlJwfWak3pXf0Z7wWc5cCFg6yWfEwKxEALKLPzaEAiEELBs54desDp4BcT6zfdNIWjznYkukDXoTsyJkTjKTsxhkjiyzsohEzqaDsrJEzqFTsl1YOBwQRgvXBk58+SI3CCmB3dK3rg4H1eM+cB1EzkTDsftYwgwCSbBxWMqTIXLxoSYEBeMaTEtMffqZDA27hKMkPsD4+TaoMtcORYJwIAZMMHGpJk0ncbIGTl5BrPnJsAEbnsHzgSjKMNgJp04mExnDebTLzEwqA4XjKtjBUPrQMHoOkowwA4RjLHjA8Ps4MBIOzIw2A4LjLdjAkPugMCoOxow8A4FjP0Xn4gRweQ7CzD/TgFsgd9IYBF8edCCpHVQAUjfCBWA9L1QAbAdQgDx26ECkL4jKgA2RQggflNUAOzLoQKQvjIeByB9a1QA7I4QQPwPBBUAG+QdIcQvkccBsEceByB+lTwOgG3yOADxC+VxAOyUxwGIXyuPA2CzPA5A/HJ5HAD75XEA4lfM4wDYMo8DYNGEACyaCoB1EwKIXzevCcHGeRwASycEYOlUAKyeEIDVEwKweioAFlAIwAIKAQiBCoAWCAEIgRCAEKgAaIEQgBAIAQiBCoAWCAEIgRCAEDz+r7oA2K0FHgdACGYtphCAEAgBCIEXBOA1gccB8FAgBCAEQgBC4AUBeE0gBCAEfheAXwdCAEIgBCAEXhCA1wRCAELgdwH4dSAEIARCAELgBQF4TSAEIARCAEIgBCAEzecKARQKQeeFFQIQAiEAvw68IAAhEAIQAiEAIRACEAIhACF4+kQhgHIh6La2QgBCIAQgBF4QgNcEQgBCIAQgBEIAQiAEIARCAEIgBCAEQgBCIAQgBM1nCQEUDUGH5RUCEAIhACHwggC8JhACEAIhACEQAhACIQAhEAIQAiEAIRACEAIhACEQAhACIQAhEAIQgocPaf6AMhHotb9CAEIgBCAEQgBCIAQgBEIAQnD/MP/3IdSNgf+OABACQAgAIQCEABACQAgAIQCEABACQAgAIQCGhkALoGgFhACEQAhACHotrxBA9AsCIQAhEAIQAiEAIRACEAIhACEQAhACIQAhEAIQgj8+TgugXAWEAIRACEAI+q6tEED0CwIhACEQAhACIQAhEAIQAiEAIXj1oVoAhSogBCAEAxZWCEAIhACyXxAIAQiBEIAQTPjVAVRZVSEAIRACEAKvCcALAiEAIfDrAPwuEAIQAiEAIfCaALwgEAIQAr8OwO8CIQAhEAIQAq8JwAsCDwXgcUAIQAiEAITAawLwgsBDAXgcEAIQAiEAIdACUAEhACEQAhACLQAVEAIQAiEAIdACUAEhACEQAhACLQAVEAIQAiEAIdACUAEhACHo9m/SAsjdOCEA6yYEYN20ACyaEIBFe/Hv0wLI3TIhACvmoQDsl4cCsFweCsBmeSgAa+WhAOyUhwKwUB4KwDZ5KACr5KEA7JGHArBEHgrABnkoAOvjoQDsjhaArfEDAYTAQwHYF98NbIqvBzbFNwQ74nuC7fBVwXb4tmAvfGewEX2/thagAqHroAVgEfxAAFvgFMD8Owsw+X4jYeyNvUPBwBt4R4NRN+oOCENuyB0Txtt4OywMtsF2ZBhpI+3gMMyG2fFhjJ2JQ8QA4ygxujhQDC2OFeOKw8WgMuiInTLm01k7a0ymE3fimElH79wxisgwJhA3gdnj//twJRg5d+NiMGluyCVhwNyWq8JcodwYJ9wfRgh3ybixMTkuFdOCC8aE4LIxFbh4TAKGALdP7ECYCdeN+TAfrhizYlzcKabH9LhBeGuYzJMrw3gZLxeEgTNwrgMjaAqdPJybS6PpkDGsRtZhYo6NshPDiH/GmVj+fW6s+WPRDozZh4EXvNk3tb9XrlcIKnThwgp9eMGr/9kIgTr03Lrff5O5ayFgfSDmhMDFCQFbx+J6CBy4EGBScL0AAAAAAAAAAMAX+gFw2AV0ZrJPTgAAAABJRU5ErkJggg==\" alt=\"A white circle through four blue markers, with four green markers at the corners of a square around it\"><figcaption>tests/11/expected/11-R4-circle4.png<\/figcaption><\/figure>\n<p>There is no on-curve point, so start at the implied point between the last and first points: halfway between (332, 332) and (12, 332), which is (172, 332). Each of the 4 points is then the control point of one curve, and the 4 curves meet at 4 implied points (blue).<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=TrueType%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">The blog's curve renderer<\/a> replaces the start position with a transform matrix: <code>setGlyphBaseline<\/code> moves the glyph to its baseline and <code>transformVec2<\/code> maps a point to the picture. The new <code>renderGlyphOutline<\/code> walks each contour once, and <code>drawBezier<\/code> flattens a curve with <code>quadBezierLerp<\/code>, using the ceiling of the control polygon's length as the number of pieces, as on this page. Its markers are twice the line thickness and coloured red, green and blue, as here.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet keeps a \"previous point\" that starts at (0, 0) and doesn't reset it between contours. A contour whose first point is off-curve therefore starts its first curve from that stale point and skips its real closing curve. The JetBrains Mono Nerd Font has over two thousand such contours, most of them in icons, and R4's tests cover them. The snippet also draws each marker inside the walk, so a line drawn later can cross an earlier marker. On this page you draw all markers last.<\/p>"}},{"id":"12","num":"12","title":"Intersect two segments","difficulty":"Medium","tests":34,"problem":"problems/12-segment-intersection.md","entry":"solutions/assignments/assignment_12_segment_intersection.cpp","files":[{"path":"solutions/assignments/assignment_12_segment_intersection.cpp","role":"entry","purpose":null,"job":"Read each `segments` line as four points: a1 and a2 for segment A, then b1 and b2 for segment B. Call your intersection function from `utils/Geometry.h` and write the meeting point as `x y`, or `none`, one line per input line.","blank":"// ======================================================================================\n// Assignment 12: Intersect two segments\n// Problem: problems/12-segment-intersection.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 12 as `build/solutions/assignment_12.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 12`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read each `segments` line as four points: a1 and a2 for segment A, then b1 and b2 for\n//   segment B. Call your intersection function from `utils/Geometry.h` and write the\n//   meeting point as `x y`, or `none`, one line per input line.\n//\n// The other files of this assignment:\n//   It adds to src/utils/Geometry.h, which you started earlier: Add a function that takes\n//   two segments, each given by its two end points, and returns the one point where they\n//   meet. If they don't meet, or are parallel or collinear, it returns nothing;\n//   `std::optional` suits this. Put small helpers for the 2D cross product and the side\n//   value here too, `inline` like the rest of the header. The Boilerplate's `Geometry.h`\n//   from assignment 10 already declares the function as `segmentsIntersect`.\n//   Include them by their path under src/, e.g. #include \"utils/Geometry.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 12: Intersect two segments\n// Problem: problems/12-segment-intersection.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 12 as `build/solutions/assignment_12.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 12`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/utils/Geometry.h, which you started earlier: Add a function that takes\n//   two segments, each given by its two end points, and returns the one point where they\n//   meet. If they don't meet, or are parallel or collinear, it returns nothing;\n//   `std::optional` suits this. Put small helpers for the 2D cross product and the side\n//   value here too, `inline` like the rest of the header. The Boilerplate's `Geometry.h`\n//   from assignment 10 already declares the function as `segmentsIntersect`.\n//   Include them by their path under src/, e.g. #include \"utils/Geometry.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"segments\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 a1 = readPoint(words), a2 = readPoint(words);\n      const Vec2 b1 = readPoint(words), b2 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      if (const std::optional<Vec2> p = segmentsIntersect(a1, a2, b1, b2)) {\n        output << number(p->x) << ' ' << number(p->y) << '\\n';\n      } else {\n        output << \"none\\n\";\n      }\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/utils/Geometry.h","role":"adds","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them.","job":"Add a function that takes two segments, each given by its two end points, and returns the one point where they meet. If they don't meet, or are parallel or collinear, it returns nothing; `std::optional` suits this. Put small helpers for the 2D cross product and the side value here too, `inline` like the rest of the header. The Boilerplate's `Geometry.h` from assignment 10 already declares the function as `segmentsIntersect`.","blank":"#pragma once\n// ======================================================================================\n// Assignment 10: Lerp and quadratic Bezier curves\n// Problem: problems/10-bezier.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header holds the project's 2D maths: a point type, lerp, and the point at t on a\n//   quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13\n//   and 15 add functions for where segments and curves meet and for a curve's lowest\n//   point, and the fills from assignment 14 on use them.\n//\n// Your job:\n//   Declare a 2D point type with `double` x and y, and the arithmetic you want on it:\n//   adding, subtracting and scaling by a number. Then write two functions: lerp, which\n//   returns the point a fraction t of the way from a to b, and one that returns the point\n//   at t on a quadratic Bezier curve from its start, control point and end. The project\n//   has no `Geometry.cpp`, so define the functions in this header and mark them `inline`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"10"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","<code>std::optional<\/code> for \"no answer\"","small structs"],"text":["floating-point arithmetic (double)","std::optional for \"no answer\"","small structs"]},{"label":"Library","items":["none needed (the boilerplate's input/output uses <code>std::istringstream<\/code>)"],"text":["none needed (the boilerplate's input/output uses std::istringstream)"]},{"label":"Concepts","items":["2D cross product","which side of a line a point is on","parametric form of a segment","parallel and collinear lines","closed segments (endpoints included)"],"text":["2D cross product","which side of a line a point is on","parametric form of a segment","parallel and collinear lines","closed segments (endpoints included)"]}],"body":"<div class=\"d-problem flow\"><p>Your program reads pairs of line segments. For each pair it writes the point where the two segments meet, or <code>none<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Every line of the input file has the same form:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>segments a1x a1y a2x a2y b1x b1y b2x b2y<\/code><\/td><td>Segment A runs from a1 = (a1x, a1y) to a2 = (a2x, a2y). Segment B runs from b1 = (b1x, b1y) to b2 = (b2x, b2y).<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>Write one line per input line, in the same order: the meeting point as <code>x y<\/code>, or the word <code>none<\/code>.<\/p>\n<p>The checker accepts any number within 0.001 of the expected value, so <code>5<\/code>, <code>5.0<\/code> and <code>5.0000<\/code> all match <code>5<\/code>. If a value isn't whole, print enough decimals to land within 0.001; 4 decimals are enough. The boilerplate's <code>number()<\/code> prints whole numbers with no decimal point and rounds the others to 4 decimals, dropping trailing zeros (<code>37.5<\/code>, <code>0.0625<\/code>).<\/p>\n<h3>The rules<\/h3>\n<ol><li><strong>Segments include their endpoints.<\/strong> If the two segments meet only at an endpoint, that point is the answer. This covers two edges of a polygon that share a corner, and a <strong>T-junction<\/strong>, where one segment ends on the middle of the other.<\/li><li><strong>Parallel segments give <code>none<\/code>.<\/strong> That includes <strong>collinear<\/strong> segments, which lie on the same line, even when they overlap, touch end to end, or are identical. They have no single meeting point. (For filling this is harmless: an edge that lies along the scanline adds no crossing.)<\/li><li><strong>Otherwise<\/strong> the answer is the one point the two segments share, or <code>none<\/code> if they don't share one. Two lines that aren't parallel cross at one point, but that point may lie beyond the end of one segment or both.<\/li><\/ol>\n<h3>The 2D cross product<\/h3>\n<pre><code>cross(u, v) = u.x · v.y − u.y · v.x<\/code><\/pre>\n<ul><li>It is 0 when u and v are parallel or one of them is zero, and only then.<\/li><li>Its sign says which way you turn going from the direction of u to the direction of v.<\/li><\/ul>\n<p><strong>Which side of a line a point is on.<\/strong> For a line through s and e, and a point p, the <strong>side value<\/strong> is:<\/p>\n<pre><code>side(p; s, e) = cross(e − s, p − s)<\/code><\/pre>\n<p>The result is positive on one side of the line, negative on the other, and 0 when p lies on the line.<\/p>\n<h3>Step 1: the side test<\/h3>\n<p>Segment B can reach segment A's line only if b1 and b2 don't lie on the same side of it, where a point on the line counts as on neither side. The same goes for A and B's line. Both conditions must hold:<\/p>\n<pre><code>side(b1; a1, a2) · side(b2; a1, a2) ≤ 0     and     side(a1; b1, b2) · side(a2; b1, b2) ≤ 0<\/code><\/pre>\n<p>If either product is positive, the answer is <code>none<\/code>. Use ≤, not &lt;: when an endpoint lies on the other segment's line, its side value is 0, so the product is 0 and a touching pair passes.<\/p>\n<h3>Step 2: the meeting point<\/h3>\n<p>Let v1 = a2 − a1 and v2 = b2 − b1. If cross(v1, v2) = 0, the segments are parallel or collinear: the answer is <code>none<\/code> (rule 2). Collinear segments pass the side test, because every side value is 0, so you need this check even after Step 1. Otherwise:<\/p>\n<pre><code>t = cross(b1 − a1, v2) / cross(v1, v2)\npoint = a1 + t · v1<\/code><\/pre>\n<p>The formula comes from writing a point on A as a1 + t·v1 and a point on B as b1 + s·v2. If you set them equal and take the cross product of both sides with v2, s drops out, because cross(v2, v2) = 0. After Step 1, t is between 0 and 1.<\/p>\n<p>You can get the same answers another way: also compute s = cross(b1 − a1, v1) / cross(v1, v2), and accept the point only when t and s are both between 0 and 1, inclusive.<\/p>\n<h3>Exact arithmetic<\/h3>\n<p>Every coordinate is a multiple of 0.25 between −1000 and 1000. In <code>double<\/code> arithmetic every side value and cross product above is then exact:<\/p>\n<ul><li>Touching gives a side value of 0, and parallel segments give a cross product of 0, with no rounding error in either.<\/li><li>If you multiply two side values to compare their signs, the product can round, but its sign is still exact. If you compare the two signs without multiplying, nothing rounds.<\/li><li>A tolerance such as <code>|cross(v1, v2)| &lt; 1e-9<\/code> also works: when two segments in the tests aren't parallel, |cross(v1, v2)| is at least 0.25.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Segments that cross at a point inside both give that point.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Touching counts: if the segments meet at an endpoint of either one (a shared corner or a T-junction), that point is the answer.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>If the lines cross outside either segment, the answer is <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Parallel segments give <code>none<\/code>, and so do collinear ones, even when they overlap or meet end to end.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Vertical, horizontal, negative and fractional coordinates work like any others.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate is between −1000 and 1000 and is a multiple of 0.25. No segment has zero length.<\/li><li>For two segments that aren't parallel, |cross(v1, v2)| ≥ 0.25.<\/li><li>A test has from 1 to 20 lines.<\/li><li>There are 34 tests: hand-made pairs for each rule, random pairs aimed at R1 to R4, random pairs on a small grid (where touching and collinear pairs are common), and horizontal lines across every edge of 'K' and 'Z' from JetBrains Mono Bold, once between corners and once through a corner.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/utils/Geometry.h","text":"#pragma once\n// Points, curves and where they meet.\n// Assignment 10: lerp and quadratic Bezier curves. 12: two segments. 13: a line and a curve.\n// 15: the lowest point of a curve.\n\n#include <algorithm>\n#include <cmath>\n#include <optional>\n#include <vector>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\ninline Vec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\ninline Vec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\ninline Vec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// ---- Assignment 10 ------------------------------------------------------------------\n\n// The point a fraction t of the way from a to b.\ninline Vec2 lerp(const Vec2 a, const Vec2 b, const double t) { return a + (b - a) * t; }\n\n// The quadratic Bezier curve a (start), b (control), c (end) at t. De Casteljau: lerp along\n// both legs of the control polygon, then between the two results.\ninline Vec2 bezierLerp(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  return lerp(lerp(a, b, t), lerp(b, c, t), t);\n}\n\n// ---- Assignment 12 ------------------------------------------------------------------\n\nnamespace geometry_detail {\n\ninline double cross(const Vec2 u, const Vec2 v) { return u.x * v.y - u.y * v.x; }\ninline double dot(const Vec2 u, const Vec2 v) { return u.x * v.x + u.y * v.y; }\n\n// Positive on one side of the line through start and end, negative on the other, 0 on it.\ninline double side(const Vec2 pt, const Vec2 start, const Vec2 end) { return cross(end - start, pt - start); }\n\n}  // namespace geometry_detail\n\n// Where segment a1-a2 meets segment b1-b2; nothing if they don't, or are parallel.\ninline std::optional<Vec2> segmentsIntersect(const Vec2 a1, const Vec2 a2, const Vec2 b1, const Vec2 b2) {\n  using namespace geometry_detail;\n  // Each segment's endpoints must not lie strictly on the same side of the other's line.\n  if (side(b1, a1, a2) * side(b2, a1, a2) > 0) return std::nullopt;\n  if (side(a1, b1, b2) * side(a2, b1, b2) > 0) return std::nullopt;\n  const Vec2 v1 = a2 - a1, v2 = b2 - b1;\n  const double denominator = cross(v1, v2);\n  if (std::abs(denominator) < 1e-9) return std::nullopt;  // parallel or collinear\n  const double t = cross(b1 - a1, v2) / denominator;\n  return a1 + v1 * t;\n}\n"},{"path":"assignments/assignment_12_segment_intersection.cpp","text":"// Assignment 12 (intersect two segments): answers a test input's segment pairs.\n// The maths is in src/utils/Geometry.h.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"segments\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 a1 = readPoint(words), a2 = readPoint(words);\n      const Vec2 b1 = readPoint(words), b2 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      if (const std::optional<Vec2> p = segmentsIntersect(a1, a2, b1, b2)) {\n        output << number(p->x) << ' ' << number(p->y) << '\\n';\n      } else {\n        output << \"none\\n\";\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":[],"proof":{"passed":34,"total":34,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, in the blog's <strong>\"Renderer: Filling Glyph\"<\/strong> section, read the start of <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Even%2Dodd%20Rule\" target=\"_blank\" rel=\"noopener\">Even-odd Rule<\/a> and then <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersection%20of%20line%20segments\" target=\"_blank\" rel=\"noopener\">intersection of line segments<\/a>. Stop after the formula for t. The author's code (the listing \"Function to find a intersections of 2 segments\") follows it.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 14 you fill a glyph with the even-odd rule. For each row of pixels, your program lays a long horizontal line, a <strong>scanline<\/strong>, across the glyph. It finds every place where the scanline crosses the outline and fills between pairs of crossings.<\/p>\n<p>Here you find the crossing with one straight edge. In assignment 13 you do the same for a curved edge.<\/p>","sources":"<ul><li>cp-algorithms, <a href=\"https://cp-algorithms.com/geometry/check-segments-intersection.html\" target=\"_blank\" rel=\"noopener\">Check if two segments intersect<\/a>, the side test with endpoints and collinear cases<\/li><li>cp-algorithms, <a href=\"https://cp-algorithms.com/geometry/segments-intersection.html\" target=\"_blank\" rel=\"noopener\">Finding intersection of two segments<\/a><\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Line%E2%80%93line_intersection#Given_two_points_on_each_line_segment\" target=\"_blank\" rel=\"noopener\">Line–line intersection: given two points on each line segment<\/a>, the parameters t and u in closed form<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersection%20of%20line%20segments\" target=\"_blank\" rel=\"noopener\">intersection of line segments<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 12                               run every test\n.\\check 12 -Case 12-R2-scanline-vertex   one test, showing its full input, expected output and your output\n.\\check 12 -Fresh                        a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 12 -Dispute &lt;id&gt; &quot;why&quot;           set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Lines that cross outside either segment -&gt; none ......................    0 / 4   FAILED\n      x 12-R3-beyond-end  the lines cross at (5, 5) but the first segment stops at (4, 4)\n          line 1: expected `none`, got `5 5`\n          likely cause: R3 - Lines that cross outside either segment -&gt; none\n          expected values from: exact arithmetic with Python fractions.Fraction (parametric solve, cross-checked)\n          reproduce: build/solutions/assignment_12.exe build/cases/12/12-R3-beyond-end.in build/cases/12/12-R3-beyond-end.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>cross(u, v)<\/code> first and check it by hand: cross((1, 0), (0, 1)) = 1 and cross((2, 4), (1, 2)) = 0. You build the side test, the parallel check and the formula for t from it.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Work in three steps, in this order. Reject the pair if either side-test product is positive. Reject it if cross(v1, v2) is 0. Otherwise compute t and return a1 + t·v1. Work through Example 1 and have your code print each intermediate value.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Use ≤ 0 in the side test. With &lt; 0, every touching case (R2) gives <code>none<\/code>.<\/li><li>Without the side test you get the crossing of two infinite lines, which can lie outside the segments (R3).<\/li><li>Check cross(v1, v2) before dividing by it. Collinear segments pass the side test, and 0 / 0 gives <code>nan<\/code>.<\/li><li>The order inside <code>cross<\/code> matters: cross(u, v) = −cross(v, u). If you swap the arguments in only one of the two cross products for t, the point lands on the wrong side of a1.<\/li><li>t belongs to segment A, so the point is a1 + t·v1, not b1 + t·v2.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>cross(u, v) = u.x * v.y - u.y * v.x\nside(p, s, e) = cross(e - s, p - s)\n\nintersect(a1, a2, b1, b2):\n    if side(b1, a1, a2) * side(b2, a1, a2) &gt; 0: return none\n    if side(a1, b1, b2) * side(a2, b1, b2) &gt; 0: return none\n    v1 = a2 - a1\n    v2 = b2 - b1\n    d = cross(v1, v2)\n    if d == 0: return none                  # parallel or collinear\n    t = cross(b1 - a1, v2) / d\n    return a1 + t * v1<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a crossing","test":"12-R1-off-center","input":"segments 0 0 8 4 2 6 6 -2","output":"4 2","image":null,"explain":"<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Computation<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>side(b1; a1, a2), side(b2; a1, a2)<\/td><td>cross((8, 4), (2, 6)), cross((8, 4), (6, −2))<\/td><td>40, −40: opposite sides<\/td><\/tr><tr><td>side(a1; b1, b2), side(a2; b1, b2)<\/td><td>cross((4, −8), (−2, −6)), cross((4, −8), (6, −2))<\/td><td>−40, 40: opposite sides<\/td><\/tr><tr><td>cross(v1, v2)<\/td><td>8 · (−8) − 4 · 4<\/td><td>−80<\/td><\/tr><tr><td>cross(b1 − a1, v2)<\/td><td>2 · (−8) − 6 · 4<\/td><td>−40<\/td><\/tr><tr><td>t, point<\/td><td>−40 / −80 = 0.5, (0, 0) + 0.5 · (8, 4)<\/td><td><strong>(4, 2)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"label":"Example 2","name":"a horizontal line through a corner","test":"12-R2-scanline-vertex","input":"segments -100 5 100 5 3 5 7 12\nsegments -100 5 100 5 0 0 3 5","output":"3 5\n3 5","image":null,"explain":"<p>The horizontal line y = 5 passes through (3, 5), where the two edges meet. On the first line, side(b1; a1, a2) = cross((200, 0), (103, 0)) = 0, so the product is 0 and the touch counts. Both edges report the same corner. A fill that counts crossings would count this corner twice; the blog fixes that in \"Removal of fill errors\" (assignment 15 builds one piece of that fix).<\/p>"},{"label":"Example 3","name":"collinear segments","test":"12-R4-collinear-overlap","input":"segments 0 0 10 10 5 5 15 15\nsegments 0 0 10 0 2 0 8 0\nsegments 0 0 10 0 8 0 2 0","output":"none\nnone\nnone","image":null,"explain":"<p>Every side value is 0, so the side test passes. cross(v1, v2) is 0, so the answer is <code>none<\/code>.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersections%20of%202%20segments\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> is one function, <code>segmentsIntersect<\/code>, that returns <code>std::optional&lt;glm::vec2&gt;<\/code>. Inside, a lambda <code>region<\/code> computes the side value and a lambda <code>cross<\/code> the cross product. <code>region<\/code> uses the opposite sign from this page's <code>side<\/code>, which makes no difference to a product. The function runs the side test with ≤ 0 as here, then checks the denominator, then returns a1 + t·v1.<\/p>\n<p><strong>Something to look for:<\/strong> the parallel check compares |cross(v1, v2)| with an <code>eps<\/code> that the listing doesn't define. Any small value works for glyph outlines, because two edges that aren't parallel have a cross product far from 0. In the blog's fill, one of the two segments is the scanline itself, running from x = 0 to the image width.<\/p>"}},{"id":"13","num":"13","title":"Intersect a line and a quadratic curve","difficulty":"Medium","tests":35,"problem":"problems/13-line-curve-intersection.md","entry":"solutions/assignments/assignment_13_line_curve_intersection.cpp","files":[{"path":"solutions/assignments/assignment_13_line_curve_intersection.cpp","role":"entry","purpose":null,"job":"Read each line as the curve's three points p1, p2 and p3 (start, control point, end), then the word `line` and the line's two points l1 and l2. Call your line-curve function from `utils/Geometry.h` and write the points it returns on one line (`x1 y1` or `x1 y1 x2 y2`), or `none` if it returns no points.","blank":"// ======================================================================================\n// Assignment 13: Intersect a line and a quadratic curve\n// Problem: problems/13-line-curve-intersection.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 13 as `build/solutions/assignment_13.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 13`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read each line as the curve's three points p1, p2 and p3 (start, control point, end),\n//   then the word `line` and the line's two points l1 and l2. Call your line-curve\n//   function from `utils/Geometry.h` and write the points it returns on one line (`x1 y1`\n//   or `x1 y1 x2 y2`), or `none` if it returns no points.\n//\n// The other files of this assignment:\n//   It adds to src/utils/Geometry.h, which you started earlier: Add a function that takes\n//   a quadratic curve (start, control point, end) and two points on an infinite line, and\n//   returns the points where they meet, in increasing t. There can be none, one or two.\n//   Put a dot product helper here too, and a helper that solves a t^2 + b t + c = 0,\n//   including the linear case a = 0. The Boilerplate's `Geometry.h` from assignment 10\n//   already declares the function as `segmentQuadBezierIntersect`.\n//   Include them by their path under src/, e.g. #include \"utils/Geometry.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 13: Intersect a line and a quadratic curve\n// Problem: problems/13-line-curve-intersection.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 13 as `build/solutions/assignment_13.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 13`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/utils/Geometry.h, which you started earlier: Add a function that takes\n//   a quadratic curve (start, control point, end) and two points on an infinite line, and\n//   returns the points where they meet, in increasing t. There can be none, one or two.\n//   Put a dot product helper here too, and a helper that solves a t^2 + b t + c = 0,\n//   including the linear case a = 0. The Boilerplate's `Geometry.h` from assignment 10\n//   already declares the function as `segmentQuadBezierIntersect`.\n//   Include them by their path under src/, e.g. #include \"utils/Geometry.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, lineWord;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      words >> lineWord;\n      const Vec2 l1 = readPoint(words), l2 = readPoint(words);\n      if (!words || lineWord != \"line\") throw std::runtime_error(\"bad line: \" + line);\n      const std::vector<Vec2> points = segmentQuadBezierIntersect(p1, p2, p3, l1, l2);\n      if (points.empty()) {\n        output << \"none\\n\";\n        continue;\n      }\n      for (std::size_t i = 0; i < points.size(); ++i)\n        output << (i ? \" \" : \"\") << number(points[i].x) << ' ' << number(points[i].y);\n      output << '\\n';\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/utils/Geometry.h","role":"adds","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them.","job":"Add a function that takes a quadratic curve (start, control point, end) and two points on an infinite line, and returns the points where they meet, in increasing t. There can be none, one or two. Put a dot product helper here too, and a helper that solves a t^2 + b t + c = 0, including the linear case a = 0. The Boilerplate's `Geometry.h` from assignment 10 already declares the function as `segmentQuadBezierIntersect`.","blank":"#pragma once\n// ======================================================================================\n// Assignment 10: Lerp and quadratic Bezier curves\n// Problem: problems/10-bezier.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header holds the project's 2D maths: a point type, lerp, and the point at t on a\n//   quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13\n//   and 15 add functions for where segments and curves meet and for a curve's lowest\n//   point, and the fills from assignment 14 on use them.\n//\n// Your job:\n//   Declare a 2D point type with `double` x and y, and the arithmetic you want on it:\n//   adding, subtracting and scaling by a number. Then write two functions: lerp, which\n//   returns the point a fraction t of the way from a to b, and one that returns the point\n//   at t on a quadratic Bezier curve from its start, control point and end. The project\n//   has no `Geometry.cpp`, so define the functions in this header and mark them `inline`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"10"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","returning a list of results (<code>std::vector<\/code>)","sorting"],"text":["floating-point arithmetic (double)","returning a list of results (std::vector)","sorting"]},{"label":"Library","items":["<code>std::sqrt<\/code>, <code>std::sort<\/code>"],"text":["std::sqrt, std::sort"]},{"label":"Concepts","items":["quadratic Bezier curve as a polynomial","normal vector and dot product","quadratic equations and the discriminant","the degenerate (linear) case","tangent lines","curve parameter t"],"text":["quadratic Bezier curve as a polynomial","normal vector and dot product","quadratic equations and the discriminant","the degenerate (linear) case","tangent lines","curve parameter t"]}],"body":"<div class=\"d-problem flow\"><p>Your program reads pairs of a quadratic Bezier curve and a straight line. For each pair it writes the points where the line meets the curve, or <code>none<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Every line of the input file has the same form:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>curve p1x p1y p2x p2y p3x p3y line l1x l1y l2x l2y<\/code><\/td><td>The curve starts at p1, bends toward the control point p2, and ends at p3. The line is the <strong>infinite<\/strong> straight line through l1 and l2.<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>The curve is the one from assignment 10: the point at parameter t is P(t) = (1 − t)² p1 + 2(1 − t)t p2 + t² p3, for t from 0 to 1.<\/li><li>The line doesn't stop at l1 or l2: those two points only fix its position and direction.<\/li><\/ul>\n<h3>Output<\/h3>\n<p>Write one line per input line, in the same order:<\/p>\n<ul><li><code>none<\/code> when the line doesn't meet the curve, or<\/li><li>the meeting points on one line: <code>x1 y1<\/code>, or <code>x1 y1 x2 y2<\/code>.<\/li><\/ul>\n<p>Points come in increasing order of t (the order you meet them travelling along the curve from p1 to p3), not by x or y. A line that touches the curve without crossing it (a <strong>tangent<\/strong>) gives its one point once.<\/p>\n<p>The checker accepts any number within 0.001 of the expected value. If a value isn't whole, print enough decimals to land within 0.001; 4 decimals are enough. The boilerplate's <code>number()<\/code> prints whole numbers with no decimal point and rounds the others to 4 decimals, dropping trailing zeros (<code>37.5<\/code>, <code>0.0625<\/code>).<\/p>\n<h3>The curve as a polynomial<\/h3>\n<p>If you multiply out the curve's formula, you get<\/p>\n<pre><code>P(t) = A t² + B t + C,    where A = p1 − 2 p2 + p3,   B = 2 (p2 − p1),   C = p1<\/code><\/pre>\n<p>A, B and C are vectors, so compute each one for x and for y.<\/p>\n<h3>The line as an equation<\/h3>\n<p>Let d = l2 − l1 be the line's direction, and K = (d.y, −d.x). K is perpendicular to the line: it is a <strong>normal vector<\/strong> of the line. A point X lies on the line if and only if<\/p>\n<pre><code>K · (X − l1) = 0           (· is the dot product: u · v = u.x v.x + u.y v.y)<\/code><\/pre>\n<p>Moving along the line changes X by a multiple of d, and K · d = 0, so the left side stays 0.<\/p>\n<h3>From a line and a curve to a quadratic<\/h3>\n<p>Put P(t) in place of X:<\/p>\n<pre><code>K · (A t² + B t + C − l1) = 0\na t² + b t + c = 0,    where a = K · A,   b = K · B,   c = K · (C − l1)<\/code><\/pre>\n<p>a, b and c are plain numbers. Every solution t is a place where the curve's polynomial meets the line.<\/p>\n<h3>Solving for t<\/h3>\n<p>The case depends on whether a is 0, and on D = b² − 4ac, the <strong>discriminant<\/strong>:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Case<\/th><th>Roots<\/th><\/tr><\/thead><tbody><tr><td>a ≠ 0 and D = b² − 4ac &lt; 0<\/td><td>none<\/td><\/tr><tr><td>a ≠ 0 and D = 0<\/td><td>one: t = −b / (2a). The line is tangent to the curve.<\/td><\/tr><tr><td>a ≠ 0 and D &gt; 0<\/td><td>two: t = (−b − √D) / (2a) and t = (−b + √D) / (2a)<\/td><\/tr><tr><td>a = 0 and b ≠ 0<\/td><td>one: t = −c / b. The equation is linear.<\/td><\/tr><tr><td>a = 0 and b = 0<\/td><td>none. The \"curve\" is a straight segment parallel to the line. (If c were also 0, it would lie on the line; the tests don't have that.)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The case a = 0 is common in real fonts: for a horizontal line, a is 0 whenever the control point's y is halfway between the end points' y. The quadratic formula would divide by 0 there.<\/p>\n<p>If a &lt; 0, the second formula in the table gives the smaller t, so sort the roots.<\/p>\n<h3>The roots that count<\/h3>\n<p>Keep only the roots with 0 ≤ t ≤ 1, including t = 0 and t = 1, where the line passes through p1 or p3. Roots outside that range belong to the curve's polynomial beyond its ends. For each root you keep, the point is P(t) = A t² + B t + C.<\/p>\n<h3>Precision<\/h3>\n<p>Every coordinate is a multiple of 0.25 between −1000 and 1000, so a, b, c and D are exact in <code>double<\/code>.<\/p>\n<ul><li>In tangent cases D comes out as 0 with no rounding error, and so does a in linear cases, so comparing with 0 works.<\/li><li>A tiny tolerance also works: every root other than 0 and 1 is at least 0.01 away from 0 and 1, and two different roots are at least 0.01 apart. If you accept t within, say, 1e-9 of the ends, you get the same answers.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A line that crosses the curve twice gives both points. The line is infinite: where l1 and l2 sit along it makes no difference.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Only roots with 0 ≤ t ≤ 1 count: if one root is on the curve and the other is beyond an end, the answer is the one point.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>If no root has 0 ≤ t ≤ 1 (or there are no real roots), the answer is <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A line that touches the curve without crossing it (D = 0) gives the touching point once.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>If a = K · A is 0, the equation is linear: t = −c / b, or no root if b is also 0.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Points are in increasing order of t, whichever way the line points.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Roots at t = 0 and at t = 1 count.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate is between −1000 and 1000 and is a multiple of 0.25. l1 ≠ l2. In no test does the curve lie along the line.<\/li><li>Every root other than 0 and 1 is at least 0.01 away from 0 and from 1. Two different roots are at least 0.01 apart.<\/li><li>A test has from 1 to 74 lines.<\/li><li>There are 35 tests: hand-made lines for each rule, random curves and lines, and one horizontal line against every curve of 'o' and 'S' (JetBrains Mono Bold) and 'あ' (Noto Sans JP).<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/utils/Geometry.h","text":"#pragma once\n// Points, curves and where they meet.\n// Assignment 10: lerp and quadratic Bezier curves. 12: two segments. 13: a line and a curve.\n// 15: the lowest point of a curve.\n\n#include <algorithm>\n#include <cmath>\n#include <optional>\n#include <vector>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\ninline Vec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\ninline Vec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\ninline Vec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// ---- Assignment 10 ------------------------------------------------------------------\n\n// The point a fraction t of the way from a to b.\ninline Vec2 lerp(const Vec2 a, const Vec2 b, const double t) { return a + (b - a) * t; }\n\n// The quadratic Bezier curve a (start), b (control), c (end) at t. De Casteljau: lerp along\n// both legs of the control polygon, then between the two results.\ninline Vec2 bezierLerp(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  return lerp(lerp(a, b, t), lerp(b, c, t), t);\n}\n\n// ---- Assignment 12 ------------------------------------------------------------------\n\nnamespace geometry_detail {\n\ninline double cross(const Vec2 u, const Vec2 v) { return u.x * v.y - u.y * v.x; }\ninline double dot(const Vec2 u, const Vec2 v) { return u.x * v.x + u.y * v.y; }\n\n// Positive on one side of the line through start and end, negative on the other, 0 on it.\ninline double side(const Vec2 pt, const Vec2 start, const Vec2 end) { return cross(end - start, pt - start); }\n\n}  // namespace geometry_detail\n\n// Where segment a1-a2 meets segment b1-b2; nothing if they don't, or are parallel.\ninline std::optional<Vec2> segmentsIntersect(const Vec2 a1, const Vec2 a2, const Vec2 b1, const Vec2 b2) {\n  using namespace geometry_detail;\n  // Each segment's endpoints must not lie strictly on the same side of the other's line.\n  if (side(b1, a1, a2) * side(b2, a1, a2) > 0) return std::nullopt;\n  if (side(a1, b1, b2) * side(a2, b1, b2) > 0) return std::nullopt;\n  const Vec2 v1 = a2 - a1, v2 = b2 - b1;\n  const double denominator = cross(v1, v2);\n  if (std::abs(denominator) < 1e-9) return std::nullopt;  // parallel or collinear\n  const double t = cross(b1 - a1, v2) / denominator;\n  return a1 + v1 * t;\n}\n\n// ---- Assignment 13 ------------------------------------------------------------------\n\nnamespace geometry_detail {\n\n// Real roots of a t^2 + b t + c = 0, in increasing order; a double root once.\n// The test data make a, and the discriminant of a tangent, exactly 0 when they are 0.\ninline std::vector<double> solveQuadratic(const double a, const double b, const double c) {\n  if (a == 0) {\n    if (b == 0) return {};  // no root (or every t, which the tests exclude)\n    return {-c / b};\n  }\n  const double discriminant = b * b - 4 * a * c;\n  if (discriminant < 0) return {};\n  if (discriminant == 0) return {-b / (2 * a)};\n  // The stable form: no cancellation between b and the square root.\n  const double q = -0.5 * (b + std::copysign(std::sqrt(discriminant), b));\n  std::vector<double> roots = {q / a, c / q};\n  std::sort(roots.begin(), roots.end());\n  return roots;\n}\n\n}  // namespace geometry_detail\n\n// Where the infinite line through l1 and l2 meets the curve p1 (start), p2 (control),\n// p3 (end), ordered along the curve.\ninline std::vector<Vec2> segmentQuadBezierIntersect(const Vec2 p1, const Vec2 p2, const Vec2 p3, const Vec2 l1,\n                                                    const Vec2 l2) {\n  using namespace geometry_detail;\n  const Vec2 d = l2 - l1;\n  const Vec2 k = {d.y, -d.x};  // perpendicular to the line: dot(k, X - l1) = 0 on it\n  // The curve as a polynomial: P(t) = A t^2 + B t + C.\n  const Vec2 A = p1 - p2 * 2 + p3, B = (p2 - p1) * 2, C = p1;\n  std::vector<Vec2> points;\n  for (const double t : solveQuadratic(dot(k, A), dot(k, B), dot(k, C - l1))) {\n    if (t >= 0 && t <= 1) points.push_back(A * (t * t) + B * t + C);\n  }\n  return points;\n}\n"},{"path":"assignments/assignment_13_line_curve_intersection.cpp","text":"// Assignment 13 (intersect a line and a quadratic curve): answers a test input's pairs.\n// The maths is in src/utils/Geometry.h.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, lineWord;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      words >> lineWord;\n      const Vec2 l1 = readPoint(words), l2 = readPoint(words);\n      if (!words || lineWord != \"line\") throw std::runtime_error(\"bad line: \" + line);\n      const std::vector<Vec2> points = segmentQuadBezierIntersect(p1, p2, p3, l1, l2);\n      if (points.empty()) {\n        output << \"none\\n\";\n        continue;\n      }\n      for (std::size_t i = 0; i < points.size(); ++i)\n        output << (i ? \" \" : \"\") << number(points[i].x) << ' ' << number(points[i].y);\n      output << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":[],"proof":{"passed":35,"total":35,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, in the blog's <strong>\"Renderer: Filling Glyph\"<\/strong> section, read <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Intersection%20detection%20for%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">Intersection detection for Bézier curves<\/a> up to the quadratic equation in t. The author's code (the listing \"Function to find a intersections of a segment and a quadratic Bezier curve\") follows it. Assignment 10 covers the curve itself.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 14 you fill a glyph row by row. For every row of pixels, your program lays a horizontal line across the glyph and finds where that line crosses the outline. In assignment 12 you found the crossing with a straight edge.<\/p>\n<p>Here you find the crossings with a curved edge, which can have zero, one or two of them.<\/p>","sources":"<ul><li>Pomax, <em>A Primer on Bézier Curves<\/em>, <a href=\"https://pomax.github.io/bezierinfo/#intersections\" target=\"_blank\" rel=\"noopener\">Intersections<\/a> (line-curve intersection) and <a href=\"https://pomax.github.io/bezierinfo/#matrix\" target=\"_blank\" rel=\"noopener\">Bézier curvatures as matrix operations<\/a> (the polynomial form)<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Quadratic_formula\" target=\"_blank\" rel=\"noopener\">Quadratic formula<\/a>, including the discriminant and a version that avoids cancellation<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>, on the quadratic curves in TrueType outlines<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Intersection%20detection%20for%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">Intersection detection for Bézier curves<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 13                          run every test\n.\\check 13 -Case 13-R1-arch         one test, showing its full input, expected output and your output\n.\\check 13 -Fresh                   a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 13 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  A tangent line gives its touching point once .........................    1 / 4   FAILED\n      x 13-R4-arch-top  a horizontal line touching the top of an arch at t = 0.5\n          line 1: expected `5 5`, got `5 5 5 5`\n          expected values from: exact arithmetic (fractions.Fraction, 60-digit decimal square roots), root count cross-checked\n          reproduce: build/solutions/assignment_13.exe build/cases/13/13-R4-arch-top.in build/cases/13/13-R4-arch-top.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>solveQuadratic(a, b, c)<\/code> on its own first and test it by hand: (1, −3, 2) gives 1 and 2; (1, 2, 1) gives −1 once; (1, 0, 1) gives nothing; (0, 2, −1) gives 0.5. Once it works, the rest of the function is a few dot products.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Compute A, B and C from the curve, and K from the line. Turn them into the three numbers a, b, c. Solve, keep the roots between 0 and 1, sort them, and turn each one back into a point with A t² + B t + C. Check each step against Example 1.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>a = 0 happens often with horizontal lines. Dividing by 2a then gives <code>inf<\/code> or <code>nan<\/code>, and the crossing disappears with no error.<\/li><li>If D = 0, return the root once.<\/li><li>Sort the roots. The sign of a decides which formula gives the smaller one, and reversing the line's direction flips that sign.<\/li><li>Don't check the points against l1 and l2. The line goes on forever.<\/li><li>Keep t = 0 and t = 1: use ≤ at both ends. A half-open range like 0 ≤ t &lt; 1 loses crossings at p3.<\/li><li>Check D before taking its square root. The square root of a negative number is <code>nan<\/code>.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>solveQuadratic(a, b, c):\n    if a == 0:\n        return [] if b == 0 else [-c / b]\n    D = b*b - 4*a*c\n    if D &lt; 0:  return []\n    if D == 0: return [-b / (2*a)]\n    return sorted([(-b - sqrt(D)) / (2*a), (-b + sqrt(D)) / (2*a)])\n\nintersect(p1, p2, p3, l1, l2):\n    A = p1 - 2*p2 + p3;  B = 2*(p2 - p1);  C = p1\n    d = l2 - l1;  K = (d.y, -d.x)\n    roots = solveQuadratic(dot(K, A), dot(K, B), dot(K, C - l1))\n    return [A*t*t + B*t + C for t in roots if 0 &lt;= t &lt;= 1]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"two crossings","test":"13-R1-arch","input":"curve 0 0 50 100 100 0 line 0 32 100 32","output":"20 32 80 32","image":null,"explain":"<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Computation<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>A, B, C<\/td><td>(0, 0) − 2·(50, 100) + (100, 0), 2·(50, 100), (0, 0)<\/td><td>(0, −200), (100, 200), (0, 0)<\/td><\/tr><tr><td>d, K<\/td><td>(100, 0), (0, −100)<\/td><td><\/td><\/tr><tr><td>a, b, c<\/td><td>K·A, K·B, K·((0, 0) − (0, 32))<\/td><td>20000, −20000, 3200<\/td><\/tr><tr><td>D<\/td><td>20000² − 4 · 20000 · 3200<\/td><td>144,000,000, so √D = 12000<\/td><\/tr><tr><td>t<\/td><td>(20000 ∓ 12000) / 40000<\/td><td>0.2 and 0.8<\/td><\/tr><tr><td>P(0.2), P(0.8)<\/td><td>A t² + B t + C<\/td><td><strong>(20, 32)<\/strong> and <strong>(80, 32)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"label":"Example 2","name":"the linear case","test":"13-R5-scanline","input":"curve 0 0 10 5 0 10 line -10 5 10 5\ncurve 100 0 160 50 100 100 line 0 30 1 30","output":"5 5\n125.2 30","image":null,"explain":"<p>On the first line, A = (−20, 0) and K = (0, −20), so a = 0. Then b = K · (20, 10) = −200 and c = K · ((0, 0) − (−10, 5)) = 100, so t = −c / b = 0.5 and P(0.5) = (5, 5). Both curves bulge sideways, so a horizontal line crosses each of them once.<\/p>"},{"label":"Example 3","name":"a tangent","test":"13-R4-arch-top","input":"curve 0 0 5 10 10 0 line 0 5 10 5","output":"5 5","image":null,"explain":"<p>Here a = 200, b = −200 and c = 50, so D = 40000 − 40000 = 0. The single root t = 0.5 is the top of the arch, where the line touches it, and your program prints that point once.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersections%20of%20a%20segment%20and%20a%20quadratic\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> is one function, <code>segmentQuadBezierIntersect<\/code>, that returns <code>std::vector&lt;glm::vec2&gt;<\/code>. It builds K, A, B and C as on this page, calls <code>solveQuadratic(dot(k, a), dot(k, b), dot(k, c - l1))<\/code>, and keeps the roots with −eps ≤ t ≤ 1 + eps.<\/p>\n<p><strong>Something to look for:<\/strong><\/p>\n<ul><li>Despite its name, the function treats l1 and l2 as an infinite line. It doesn't check that a point lies between them, which suits the blog's fill: its scanline spans the whole image.<\/li><li>The blog doesn't show <code>solveQuadratic<\/code>. A version that uses the quadratic formula for every input loses each crossing where a = 0 (R5), and in real glyphs that case is common for horizontal lines.<\/li><li>The points come out in whatever order <code>solveQuadratic<\/code> returns the roots. This assignment asks for increasing t so that each answer has one correct form.<\/li><\/ul>"}},{"id":"14","num":"14","title":"Fill a glyph: even-odd rule","difficulty":"Hard","tests":28,"problem":"problems/14-even-odd-fill.md","entry":"solutions/assignments/assignment_14_even_odd_fill.cpp","files":[{"path":"solutions/assignments/assignment_14_even_odd_fill.cpp","role":"entry","purpose":null,"job":"Read the `canvas`, `place` and `color` lines and each `outline` with its `ends` and `points` lines (see Input). Make the canvas, fill every outline in turn with your even-odd fill, and write the picture to the output path (see Output).","blank":"// ======================================================================================\n// Assignment 14: Fill a glyph: even-odd rule\n// Problem: problems/14-even-odd-fill.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 14 as `build/solutions/assignment_14.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 14`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `canvas`, `place` and `color` lines and each `outline` with its `ends` and\n//   `points` lines (see Input). Make the canvas, fill every outline in turn with your\n//   even-odd fill, and write the picture to the output path (see Output).\n//\n// The other files of this assignment:\n//   You also write src/render/Scanline.h, src/render/Scanline.cpp, src/render/EvenOdd.h\n//   and src/render/EvenOdd.cpp in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/FrameBufferCanvas.h, src/GlyphComponent.h,\n//   src/render/Placement.h and src/utils/Geometry.h.\n//   Include them by their path under src/, e.g. #include \"render/Scanline.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 14: Fill a glyph: even-odd rule\n// Problem: problems/14-even-odd-fill.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 14 as `build/solutions/assignment_14.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 14`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/render/Scanline.h, src/render/Scanline.cpp, src/render/EvenOdd.h\n//   and src/render/EvenOdd.cpp in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/FrameBufferCanvas.h, src/GlyphComponent.h,\n//   src/render/Placement.h and src/utils/Geometry.h.\n//   Include them by their path under src/, e.g. #include \"render/Scanline.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/EvenOdd.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<GlyphComponent> outlines;  // each one filled on its own\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // then `ends ...` and `points x y on|off ...`\n        outlines.emplace_back();\n      } else if (keyword == \"ends\" && !outlines.empty()) {\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\" && !outlines.empty()) {\n        GlyphPoint p;\n        for (std::string on; words >> p.x >> p.y >> on;) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    for (const GlyphComponent& outline : outlines) renderGlyphByEvenOdd(*canvas, outline, place, color);\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/render/Scanline.h","role":"new","purpose":"It holds the steps both fill rules share: it turns an outline into edges in pixels and finds, row by row, where the line through the pixel centres crosses them. Your even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both run on it.","job":"Declare what both fill rules share: a type for an edge piece (a straight line or a quadratic curve, in pixels) and one for a crossing (its x, and whether the edge runs up or down the screen there, which assignment 16 needs). Then declare functions that turn an outline and its placement into edge pieces, give each pixel row its crossings sorted by x, and fill a stretch of one row.","blank":"#pragma once\n// ======================================================================================\n// Assignment 14: Fill a glyph: even-odd rule\n// Problem: problems/14-even-odd-fill.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It holds the steps both fill rules share: it turns an outline into edges in pixels and\n//   finds, row by row, where the line through the pixel centres crosses them. Your\n//   even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both\n//   run on it.\n//\n// Your job:\n//   Declare what both fill rules share ctor>\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n#include \"utils/Geometry.h\"\n\n// A straight edge (curve == false) or a quadratic curve p0 -> c -> p1, in pixels.\nstruct EdgePiece {\n  Vec2 p0, c, p1;\n  bool curve = false;\n};\n\n// Where a row crosses an edge, and which way the edge runs there.\nstruct Crossing {\n  double x = 0;\n  int direction = 0;  // +1 going down the screen, -1 going up\n};\n\n// The outline's edges in pixels: implied on-curve points made explicit, contours that start\n// off-curve handled, and curves split where they turn in y.\nstd::vector<EdgePiece> edgePieces(const GlyphComponent& outline, const Placement& place);\n\n// Calls visit(row, crossings) for every pixel row the edges reach, with that row's crossings\n// sorted by x. A piece counts from its upper end up to, not including, its lower end, so a\n// row through a vertex that two pieces share counts one crossing there.\nvoid forEachRow(const std::vector<EdgePiece>& edges, int height,\n                const std::function<void(int row, const std::vector<Crossing>& crossings)>& visit);\n\n// Fills the pixels of `row` whose centres lie in [fromX, toX).\nvoid fillSpan(FrameBufferCanvas& canvas, int row, double fromX, double toX, RGB color);\n"},{"path":"solutions/src/render/Scanline.cpp","role":"new","purpose":"It holds the steps both fill rules share: it turns an outline into edges in pixels and finds, row by row, where the line through the pixel centres crosses them. Your even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both run on it.","job":"Implement the three functions you declared in `Scanline.h`: building edges, scanning rows and filling a stretch. In the edge builder, make implied on-curve points explicit, start each contour at an on-curve point and split every curve where its y turns around. In the row scan, find where the line through the row's pixel centres crosses each piece (by the half-open rule) and sort the crossings. In the stretch fill, paint the pixels whose centres lie in the stretch, clipped to the canvas.","blank":"// ======================================================================================\n// Assignment 14: Fill a glyph: even-odd rule\n// Problem: problems/14-even-odd-fill.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It holds the steps both fill rules share: it turns an outline into edges in pixels and\n//   finds, row by row, where the line through the pixel centres crosses them. Your\n//   even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both\n//   run on it.\n//\n// Your job:\n//   Implement the three functions you declared in `Scanline.h`: building edges, scanning\n//   rows and filling a stretch. In the edge builder, make implied on-curve points\n//   explicit, start each contour at an on-curve point and split every curve where its y\n//   turns around. In the row scan, find where the line through the row's pixel centres\n//   crosses each piece (by the half-open rule) and sort the crossings. In the stretch\n//   fill, paint the pixels whose centres lie in the stretch, clipped to the canvas.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 14: Fill a glyph: even-odd rule\n// Problem: problems/14-even-odd-fill.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It holds the steps both fill rules share: it turns an outline into edges in pixels and\n//   finds, row by row, where the line through the pixel centres
