wrgMjaAqdPJybS6PpkDGsRtZhYo6NshPDiH/GmVj+fW6s+WPRDozZh4EXvNk3tb9XrlcIKnThwgp9eMGr/9kIgTr03Lrff5O5ayFgfSDmhMDFCQFbx+J6CBy4EGBScL0AAAAAAAAAAMAX+gFw2AV0ZrJPTgAAAABJRU5ErkJggg==\" alt=\"A white circle through four blue markers, with four green markers at the corners of a square around it\"><figcaption>tests/11/expected/11-R4-circle4.png<\/figcaption><\/figure>\n<p>There is no on-curve point, so start at the implied point between the last and first points: halfway between (332, 332) and (12, 332), which is (172, 332). Each of the 4 points is then the control point of one curve, and the 4 curves meet at 4 implied points (blue).<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=TrueType%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">The blog's curve renderer<\/a> replaces the start position with a transform matrix: <code>setGlyphBaseline<\/code> moves the glyph to its baseline and <code>transformVec2<\/code> maps a point to the picture. The new <code>renderGlyphOutline<\/code> walks each contour once, and <code>drawBezier<\/code> flattens a curve with <code>quadBezierLerp<\/code>, using the ceiling of the control polygon's length as the number of pieces, as on this page. Markers are twice the line thickness, red, green and blue, as here.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet keeps a \"previous point\" that starts at (0, 0) and isn't reset between contours. A contour whose first point is off-curve therefore starts its first curve from that stale point and never draws its real closing curve. The JetBrains Mono Nerd Font has over two thousand such contours (mostly icons), which is why R4 has its own tests. The snippet also draws each marker inside the walk, so a line drawn later can cross an earlier marker; this page draws all markers last.<\/p>"}},{"id":"12","num":"12","title":"Intersect two segments","difficulty":"Medium","tests":34,"solution":"solutions/p12_segment_intersection.cpp","problem":"problems/12-segment-intersection.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 12 - Intersect two segments\n//\n// Problem:  problems/12-segment-intersection.md (also in the web problem book)\n// Check:    .\\check 12\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p12.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p12_segment_intersection.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 12 - Intersect two segments\n//\n// Problem:  problems/12-segment-intersection.md (also in the web problem book)\n// Check:    .\\check 12\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on intersect().\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"NotImplemented.h\"\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\n// Optional helpers: add, subtract, scale. (glm::dvec2 from third_party/ works too.)\nVec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\nVec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\nVec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// The point where segment a1-a2 meets segment b1-b2, or std::nullopt if they\n// don't meet or are parallel (rules on the problem page).\nstd::optional<Vec2> intersect(const Vec2 a1, const Vec2 a2, const Vec2 b1, const Vec2 b2) {\n  // TODO: the side test, then the crossing point (see \"The rules\" on the problem page).\n  throw NotImplemented(\"intersect\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// Whole numbers print plainly; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\n// Usage: p12 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword != \"segments\") throw std::runtime_error(\"unknown line: \" + line);\n      // segments a1x a1y a2x a2y b1x b1y b2x b2y\n      const Vec2 a1 = readPoint(words), a2 = readPoint(words);\n      const Vec2 b1 = readPoint(words), b2 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      const std::optional<Vec2> p = intersect(a1, a2, b1, b2);\n      if (p) {\n        output << number(p->x) << ' ' << number(p->y) << '\\n';\n      } else {\n        output << \"none\\n\";\n      }\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","<code>std::optional<\/code> for \"no answer\"","small structs"],"text":["floating-point arithmetic (double)","std::optional for \"no answer\"","small structs"]},{"label":"Library","items":["none needed (the boilerplate's input/output uses <code>std::istringstream<\/code>)","optional: <code>glm::dvec2<\/code> from <code>third_party/glm-1.0.1<\/code>"],"text":["none needed (the boilerplate's input/output uses std::istringstream)","optional: glm::dvec2 from third_party/glm-1.0.1"]},{"label":"Concepts","items":["2D cross product","which side of a line a point is on","parametric form of a segment","parallel and collinear lines","closed segments (endpoints included)"],"text":["2D cross product","which side of a line a point is on","parametric form of a segment","parallel and collinear lines","closed segments (endpoints included)"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads pairs of line segments and prints, for each pair, the point where the two segments meet, or <code>none<\/code>.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p12_segment_intersection.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p12_segment_intersection.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>intersect()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Every line of the input file has the same form:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>segments a1x a1y a2x a2y b1x b1y b2x b2y<\/code><\/td><td>Segment A runs from a1 = (a1x, a1y) to a2 = (a2x, a2y). Segment B runs from b1 = (b1x, b1y) to b2 = (b2x, b2y).<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>One line per input line, in the same order: either the meeting point <code>x y<\/code>, or the word <code>none<\/code>.<\/p>\n<p>The checker accepts any number within 0.001 of the expected value, so <code>5<\/code>, <code>5.0<\/code> and <code>5.0000<\/code> all match <code>5<\/code>. When a value isn't whole, print enough decimals to be within 0.001 (4 is plenty). The boilerplate's <code>number()<\/code> does this: whole numbers plainly, others rounded to 4 decimals with trailing zeros dropped (<code>37.5<\/code>, <code>0.0625<\/code>).<\/p>\n<h3>The rules<\/h3>\n<ol><li><strong>Segments include their endpoints.<\/strong> If the two segments meet only at an endpoint, that point is the answer. This covers two edges of a polygon that share a corner, and a T-junction, where one segment ends on the middle of the other.<\/li><li><strong>Parallel segments give <code>none<\/code>.<\/strong> That includes collinear segments, which lie on the same line, even when they overlap, touch end to end, or are identical. They have no single meeting point. (For filling this is harmless: an edge that lies along the horizontal line adds no crossing.)<\/li><li><strong>Otherwise<\/strong> the answer is the one point the two segments share, or <code>none<\/code> if they don't share one. Two lines that aren't parallel always cross somewhere, but that point may lie beyond the end of one segment or both.<\/li><\/ol>\n<h3>The 2D cross product<\/h3>\n<pre><code>cross(u, v) = u.x · v.y − u.y · v.x<\/code><\/pre>\n<p>It is 0 exactly when u and v are parallel (or one of them is zero). Its sign says which way you turn going from the direction of u to the direction of v.<\/p>\n<p><strong>Which side of a line a point is on.<\/strong> For a line through s and e, and a point p:<\/p>\n<pre><code>side(p; s, e) = cross(e − s, p − s)<\/code><\/pre>\n<p>The result is positive on one side of the line, negative on the other, and 0 when p lies on the line.<\/p>\n<h3>Step 1: the side test<\/h3>\n<p>Segment B can only reach segment A's line if b1 and b2 are not strictly on the same side of it. Likewise for A and B's line. Both must hold:<\/p>\n<pre><code>side(b1; a1, a2) · side(b2; a1, a2) ≤ 0     and     side(a1; b1, b2) · side(a2; b1, b2) ≤ 0<\/code><\/pre>\n<p>If either product is positive, the answer is <code>none<\/code>. Use ≤, not &lt;: when an endpoint lies on the other segment's line, its side value is 0, so the product is 0 and touching gets through.<\/p>\n<h3>Step 2: the meeting point<\/h3>\n<p>Let v1 = a2 − a1 and v2 = b2 − b1. If cross(v1, v2) = 0, the segments are parallel or collinear: the answer is <code>none<\/code> (rule 2). Collinear segments pass the side test, because every side value is 0, so this check is needed even after Step 1. Otherwise:<\/p>\n<pre><code>t = cross(b1 − a1, v2) / cross(v1, v2)\npoint = a1 + t · v1<\/code><\/pre>\n<p>Where this comes from: a point on A is a1 + t·v1 and a point on B is b1 + s·v2. Setting them equal and taking the cross product of both sides with v2 removes s, because cross(v2, v2) = 0. After Step 1, t is between 0 and 1.<\/p>\n<p>An equivalent route: also compute s = cross(b1 − a1, v1) / cross(v1, v2), and accept the point only when both t and s are between 0 and 1, inclusive. It gives the same answers.<\/p>\n<h3>Exact arithmetic<\/h3>\n<p>Every coordinate is a multiple of 0.25 between −1000 and 1000. In <code>double<\/code> arithmetic every side value and cross product above is then exact, so touching gives exactly 0 and parallel segments give a cross product of exactly 0. (If you multiply two side values to compare their signs, the product can round, but its sign is still exact; comparing the signs directly avoids the question.) A tolerance such as <code>|cross(v1, v2)| &lt; 1e-9<\/code> also works: when two segments in the tests aren't parallel, |cross(v1, v2)| is at least 0.25.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test may also print the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Segments that cross at a point inside both give that point.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Touching counts. When the segments meet at an endpoint of either one (a shared corner or a T-junction), that point is the answer.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>When the lines cross outside either segment, the answer is <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Parallel segments give <code>none<\/code>. So do collinear ones, even when they overlap or meet end to end.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Vertical, horizontal, negative and fractional coordinates work like any others.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate is between −1000 and 1000 and is a multiple of 0.25. No segment has zero length.<\/li><li>When two segments aren't parallel, |cross(v1, v2)| ≥ 0.25.<\/li><li>A test has from 1 to 20 lines.<\/li><li>There are 34 tests: hand-made pairs for each rule, random pairs aimed at R1 to R4, random pairs on a small grid (where touching and collinear pairs are common), and horizontal lines across every edge of 'K' and 'Z' from JetBrains Mono Bold, once between corners and once through a corner.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p12_segment_intersection.cpp","text":"// Reference solution - checkpoint 12 (intersect two segments).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\nVec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\nVec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\nVec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\nnamespace {\n\ndouble cross(const Vec2 u, const Vec2 v) { return u.x * v.y - u.y * v.x; }\n\n// Positive on one side of the line through start and end, negative on the other, 0 on it.\ndouble side(const Vec2 pt, const Vec2 start, const Vec2 end) { return cross(end - start, pt - start); }\n\n}  // namespace\n\nstd::optional<Vec2> intersect(const Vec2 a1, const Vec2 a2, const Vec2 b1, const Vec2 b2) {\n  // Each segment's endpoints must not lie strictly on the same side of the other's line.\n  if (side(b1, a1, a2) * side(b2, a1, a2) > 0) return std::nullopt;\n  if (side(a1, b1, b2) * side(a2, b1, b2) > 0) return std::nullopt;\n  const Vec2 v1 = a2 - a1, v2 = b2 - b1;\n  const double denominator = cross(v1, v2);\n  if (std::abs(denominator) < 1e-9) return std::nullopt;  // parallel or collinear\n  const double t = cross(b1 - a1, v2) / denominator;\n  return a1 + v1 * t;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"segments\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 a1 = readPoint(words), a2 = readPoint(words);\n      const Vec2 b1 = readPoint(words), b2 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      const std::optional<Vec2> p = intersect(a1, a2, b1, b2);\n      if (p) {\n        output << number(p->x) << ' ' << number(p->y) << '\\n';\n      } else {\n        output << \"none\\n\";\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":34,"total":34,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the blog tells the story behind it. In the blog's <strong>\"Renderer: Filling Glyph\"<\/strong> section, read the start of <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Even%2Dodd%20Rule\" target=\"_blank\" rel=\"noopener\">Even-odd Rule<\/a> and then <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersection%20of%20line%20segments\" target=\"_blank\" rel=\"noopener\">intersection of line segments<\/a>. Stop after the formula for t. The author's code (the listing \"Function to find a intersections of 2 segments\") comes right after it.<\/p>","context":"<p>Checkpoint 14 fills a glyph with the even-odd rule. For each row of pixels it lays a long horizontal line across the glyph, finds every place where that line crosses the outline, and fills between pairs of crossings. This checkpoint finds the crossing with one straight edge. Checkpoint 13 does the same for a curved edge.<\/p>","sources":"<ul><li>cp-algorithms, <a href=\"https://cp-algorithms.com/geometry/check-segments-intersection.html\" target=\"_blank\" rel=\"noopener\">Check if two segments intersect<\/a>, the side test with endpoints and collinear cases<\/li><li>cp-algorithms, <a href=\"https://cp-algorithms.com/geometry/segments-intersection.html\" target=\"_blank\" rel=\"noopener\">Finding intersection of two segments<\/a><\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Line%E2%80%93line_intersection#Given_two_points_on_each_line_segment\" target=\"_blank\" rel=\"noopener\">Line–line intersection: given two points on each line segment<\/a>, the parameters t and u in closed form<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersection%20of%20line%20segments\" target=\"_blank\" rel=\"noopener\">intersection of line segments<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 12                               run every test\n.\\check 12 -Case 12-R2-scanline-vertex   one test, showing its full input, expected output and your output\n.\\check 12 -Fresh                        a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 12 -Dispute &lt;id&gt; &quot;why&quot;           set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Lines that cross outside either segment -&gt; none ......................    0 / 4   FAILED\n      x 12-R3-beyond-end  the lines cross at (5, 5) but the first segment stops at (4, 4)\n          line 1: expected `none`, got `5 5`\n          likely cause: R3 - Lines that cross outside either segment -&gt; none\n          expected values from: exact arithmetic with Python fractions.Fraction (parametric solve, cross-checked)\n          reproduce: build/p12.exe build/cases/12/12-R3-beyond-end.in build/cases/12/12-R3-beyond-end.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>cross(u, v)<\/code> first and check it by hand: cross((1, 0), (0, 1)) = 1 and cross((2, 4), (1, 2)) = 0. The side test, the parallel check and the formula for t are all built from it.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Three steps, in this order. Reject the pair if either side-test product is positive. Reject it if cross(v1, v2) is 0. Otherwise compute t and return a1 + t·v1. Work through Example 1 with your code printing each intermediate value.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Use ≤ 0 in the side test. With &lt; 0, every touching case (R2) gives <code>none<\/code>.<\/li><li>Without the side test you get the crossing of two infinite lines, which can lie outside the segments (R3).<\/li><li>Check cross(v1, v2) before dividing by it. Collinear segments pass the side test, and 0 / 0 gives <code>nan<\/code>.<\/li><li>The order inside <code>cross<\/code> matters: cross(u, v) = −cross(v, u). If you swap the arguments in only one of the two cross products for t, the point lands on the wrong side of a1.<\/li><li>t belongs to segment A, so the point is a1 + t·v1, not b1 + t·v2.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>cross(u, v) = u.x * v.y - u.y * v.x\nside(p, s, e) = cross(e - s, p - s)\n\nintersect(a1, a2, b1, b2):\n    if side(b1, a1, a2) * side(b2, a1, a2) &gt; 0: return none\n    if side(a1, b1, b2) * side(a2, b1, b2) &gt; 0: return none\n    v1 = a2 - a1\n    v2 = b2 - b1\n    d = cross(v1, v2)\n    if d == 0: return none                  # parallel or collinear\n    t = cross(b1 - a1, v2) / d\n    return a1 + t * v1<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a crossing","test":"12-R1-off-center","input":"segments 0 0 8 4 2 6 6 -2","output":"4 2","image":null,"explain":"<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Computation<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>side(b1; a1, a2), side(b2; a1, a2)<\/td><td>cross((8, 4), (2, 6)), cross((8, 4), (6, −2))<\/td><td>40, −40: opposite sides<\/td><\/tr><tr><td>side(a1; b1, b2), side(a2; b1, b2)<\/td><td>cross((4, −8), (−2, −6)), cross((4, −8), (6, −2))<\/td><td>−40, 40: opposite sides<\/td><\/tr><tr><td>cross(v1, v2)<\/td><td>8 · (−8) − 4 · 4<\/td><td>−80<\/td><\/tr><tr><td>cross(b1 − a1, v2)<\/td><td>2 · (−8) − 6 · 4<\/td><td>−40<\/td><\/tr><tr><td>t, point<\/td><td>−40 / −80 = 0.5, (0, 0) + 0.5 · (8, 4)<\/td><td><strong>(4, 2)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"label":"Example 2","name":"a horizontal line through a corner","test":"12-R2-scanline-vertex","input":"segments -100 5 100 5 3 5 7 12\nsegments -100 5 100 5 0 0 3 5","output":"3 5\n3 5","image":null,"explain":"<p>The horizontal line y = 5 passes exactly through (3, 5), where the two edges meet. On the first line, side(b1; a1, a2) = cross((200, 0), (103, 0)) = 0, so the product is 0 and the touch counts. Both edges report the same corner. A fill that counts crossings would count this corner twice; the blog fixes that in \"Removal of fill errors\" (checkpoint 15 builds one piece of that fix).<\/p>"},{"label":"Example 3","name":"collinear segments","test":"12-R4-collinear-overlap","input":"segments 0 0 10 10 5 5 15 15\nsegments 0 0 10 0 2 0 8 0\nsegments 0 0 10 0 8 0 2 0","output":"none\nnone\nnone","image":null,"explain":"<p>Every side value is 0, so the side test passes. cross(v1, v2) is 0, so the answer is <code>none<\/code>.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersections%20of%202%20segments\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> is one function, <code>segmentsIntersect<\/code>, that returns <code>std::optional&lt;glm::vec2&gt;<\/code>. Inside, a lambda <code>region<\/code> computes the side value and a lambda <code>cross<\/code> the cross product. <code>region<\/code> uses the opposite sign from this page's <code>side<\/code>, which makes no difference to a product. The function runs the side test with ≤ 0 as here, then checks the denominator, then returns a1 + t·v1.<\/p>\n<p><strong>Something to look for:<\/strong> the parallel check compares |cross(v1, v2)| with an <code>eps<\/code> that the listing doesn't define. Any small value works for glyph outlines, because two edges that aren't parallel have a cross product far from 0. In the blog's fill, one of the two segments is always the scanline itself, running from x = 0 to the image width.<\/p>"}},{"id":"13","num":"13","title":"Intersect a line and a quadratic curve","difficulty":"Medium","tests":35,"solution":"solutions/p13_line_curve_intersection.cpp","problem":"problems/13-line-curve-intersection.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 13 - Intersect a line and a quadratic curve\n//\n// Problem:  problems/13-line-curve-intersection.md (also in the web problem book)\n// Check:    .\\check 13\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p13.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p13_line_curve_intersection.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 13 - Intersect a line and a quadratic curve\n//\n// Problem:  problems/13-line-curve-intersection.md (also in the web problem book)\n// Check:    .\\check 13\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on solveQuadratic() and intersect().\n\n#include <algorithm>\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"NotImplemented.h\"\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\n// Optional helpers: add, subtract, scale, dot product. (glm::dvec2 from third_party/ works too.)\nVec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\nVec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\nVec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\ndouble dot(const Vec2 u, const Vec2 v) { return u.x * v.x + u.y * v.y; }\n\n// The real roots of a t^2 + b t + c = 0, each one once. Remember that a can be 0.\nstd::vector<double> solveQuadratic(const double a, const double b, const double c) {\n  // TODO: see \"Solving for t\" on the problem page.\n  throw NotImplemented(\"solveQuadratic\");\n}\n\n// The points where the infinite line through l1 and l2 meets the curve that starts\n// at p1, is pulled toward the control point p2 and ends at p3. Only points with\n// 0 <= t <= 1, in order of t.\nstd::vector<Vec2> intersect(const Vec2 p1, const Vec2 p2, const Vec2 p3, const Vec2 l1, const Vec2 l2) {\n  // TODO: see \"From a line and a curve to a quadratic\" on the problem page.\n  throw NotImplemented(\"intersect\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// Whole numbers print plainly; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\n// Usage: p13 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, lineWord;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      // curve p1x p1y p2x p2y p3x p3y line l1x l1y l2x l2y\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      words >> lineWord;\n      const Vec2 l1 = readPoint(words), l2 = readPoint(words);\n      if (!words || lineWord != \"line\") throw std::runtime_error(\"bad line: \" + line);\n      const std::vector<Vec2> points = intersect(p1, p2, p3, l1, l2);\n      if (points.empty()) {\n        output << \"none\\n\";\n        continue;\n      }\n      for (std::size_t i = 0; i < points.size(); ++i) {\n        output << (i ? \" \" : \"\") << number(points[i].x) << ' ' << number(points[i].y);\n      }\n      output << '\\n';\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","returning a list of results (<code>std::vector<\/code>)","sorting"],"text":["floating-point arithmetic (double)","returning a list of results (std::vector)","sorting"]},{"label":"Library","items":["<code>std::sqrt<\/code>, <code>std::sort<\/code>","optional: <code>glm::dvec2<\/code> and <code>glm::dot<\/code> from <code>third_party/glm-1.0.1<\/code>"],"text":["std::sqrt, std::sort","optional: glm::dvec2 and glm::dot from third_party/glm-1.0.1"]},{"label":"Concepts","items":["quadratic Bezier curve as a polynomial","normal vector and dot product","quadratic equations and the discriminant","the degenerate (linear) case","tangent lines","curve parameter t"],"text":["quadratic Bezier curve as a polynomial","normal vector and dot product","quadratic equations and the discriminant","the degenerate (linear) case","tangent lines","curve parameter t"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads pairs of a quadratic Bezier curve and a straight line, and prints the points where the line meets the curve.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p13_line_curve_intersection.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p13_line_curve_intersection.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>solveQuadratic()<\/code> and <code>intersect()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Every line of the input file has the same form:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>curve p1x p1y p2x p2y p3x p3y line l1x l1y l2x l2y<\/code><\/td><td>The curve starts at p1, is pulled toward the control point p2, and ends at p3. The line is the <strong>infinite<\/strong> straight line through l1 and l2.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The curve is the one from checkpoint 10: the point at parameter t is P(t) = (1 − t)² p1 + 2(1 − t)t p2 + t² p3, for t from 0 to 1. The line doesn't stop at l1 or l2: those two points only fix its position and direction.<\/p>\n<h3>Output<\/h3>\n<p>One line per input line, in the same order:<\/p>\n<ul><li><code>none<\/code> when the line doesn't meet the curve, or<\/li><li>the meeting points on one line: <code>x1 y1<\/code>, or <code>x1 y1 x2 y2<\/code>. Points come in increasing order of t (the order you meet them travelling along the curve from p1 to p3), not by x or y. A line that touches the curve without crossing it (a tangent) gives its one point once.<\/li><\/ul>\n<p>The checker accepts any number within 0.001 of the expected value. When a value isn't whole, print enough decimals to be within 0.001 (4 is plenty). The boilerplate's <code>number()<\/code> does this: whole numbers plainly, others rounded to 4 decimals with trailing zeros dropped (<code>37.5<\/code>, <code>0.0625<\/code>).<\/p>\n<h3>The curve as a polynomial<\/h3>\n<p>Multiplying out the curve's formula gives<\/p>\n<pre><code>P(t) = A t² + B t + C,    where A = p1 − 2 p2 + p3,   B = 2 (p2 − p1),   C = p1<\/code><\/pre>\n<p>A, B and C are vectors; work out x and y separately.<\/p>\n<h3>The line as an equation<\/h3>\n<p>Let d = l2 − l1 be the line's direction, and K = (d.y, −d.x). K is perpendicular to the line. A point X lies on the line exactly when<\/p>\n<pre><code>K · (X − l1) = 0           (· is the dot product: u · v = u.x v.x + u.y v.y)<\/code><\/pre>\n<p>Moving along the line changes X by a multiple of d, and K · d = 0, so the left side stays 0.<\/p>\n<h3>From a line and a curve to a quadratic<\/h3>\n<p>Put P(t) in place of X:<\/p>\n<pre><code>K · (A t² + B t + C − l1) = 0\na t² + b t + c = 0,    where a = K · A,   b = K · B,   c = K · (C − l1)<\/code><\/pre>\n<p>a, b and c are plain numbers. Every solution t is a place where the curve's polynomial meets the line.<\/p>\n<h3>Solving for t<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Case<\/th><th>Roots<\/th><\/tr><\/thead><tbody><tr><td>a ≠ 0 and D = b² − 4ac &lt; 0<\/td><td>none<\/td><\/tr><tr><td>a ≠ 0 and D = 0<\/td><td>one: t = −b / (2a). The line is tangent to the curve.<\/td><\/tr><tr><td>a ≠ 0 and D &gt; 0<\/td><td>two: t = (−b − √D) / (2a) and t = (−b + √D) / (2a)<\/td><\/tr><tr><td>a = 0 and b ≠ 0<\/td><td>one: t = −c / b. The equation is linear.<\/td><\/tr><tr><td>a = 0 and b = 0<\/td><td>none. The \"curve\" is a straight segment parallel to the line. (If c were also 0, it would lie on the line; the tests don't have that.)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The case a = 0 is common in real fonts: for a horizontal line, a is 0 whenever the control point's y is halfway between the end points' y. The quadratic formula would divide by 0 there.<\/p>\n<p>When a &lt; 0, the second formula in the table gives the smaller t, so sort the roots.<\/p>\n<h3>Which roots count<\/h3>\n<p>Keep only the roots with 0 ≤ t ≤ 1, including t = 0 and t = 1 exactly (the line passes through p1 or p3). Roots outside that range belong to the curve's polynomial beyond its ends. For each root you keep, the point is P(t) = A t² + B t + C.<\/p>\n<h3>Precision<\/h3>\n<p>Every coordinate is a multiple of 0.25 between −1000 and 1000, so a, b, c and D are exact in <code>double<\/code>. In tangent cases D is exactly 0, and in linear cases a is exactly 0, so comparing with 0 works. A tiny tolerance also works: every root that isn't exactly 0 or 1 is at least 0.01 away from 0 and 1, and two different roots are at least 0.01 apart. Accepting t within, say, 1e-9 of the ends gives the same answers.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test may also print the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A line that crosses the curve twice gives both points. The line is infinite: where l1 and l2 sit along it makes no difference.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Only roots with 0 ≤ t ≤ 1 count. When one root is on the curve and the other is beyond an end, the answer is the one point.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>When no root has 0 ≤ t ≤ 1 (or there are no real roots), the answer is <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A line that touches the curve without crossing it (D = 0) gives the touching point once.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>When a = K · A is 0, the equation is linear: t = −c / b, or no root when b is also 0.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Points are in increasing order of t, whichever way the line points.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Roots exactly at t = 0 or t = 1 count.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate is between −1000 and 1000 and is a multiple of 0.25. l1 ≠ l2. The curve never lies along the line.<\/li><li>Every root that isn't exactly 0 or 1 is at least 0.01 away from 0 and from 1. Two different roots are at least 0.01 apart.<\/li><li>A test has from 1 to 74 lines.<\/li><li>There are 35 tests: hand-made lines for each rule, random curves and lines, and one horizontal line against every curve of 'o' and 'S' (JetBrains Mono Bold) and 'あ' (Noto Sans JP).<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p13_line_curve_intersection.cpp","text":"// Reference solution - checkpoint 13 (intersect a line and a quadratic curve).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <algorithm>\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\nVec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\nVec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\nVec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\nnamespace {\n\ndouble dot(const Vec2 u, const Vec2 v) { return u.x * v.x + u.y * v.y; }\n\n// Real roots of a t^2 + b t + c = 0, in increasing order; a double root once.\n// The test data make a, and the discriminant of a tangent, exactly 0 when they are 0.\nstd::vector<double> solveQuadratic(const double a, const double b, const double c) {\n  if (a == 0) {\n    if (b == 0) return {};  // no root (or every t, which the tests exclude)\n    return {-c / b};\n  }\n  const double discriminant = b * b - 4 * a * c;\n  if (discriminant < 0) return {};\n  if (discriminant == 0) return {-b / (2 * a)};\n  // The stable form: no cancellation between b and the square root.\n  const double q = -0.5 * (b + std::copysign(std::sqrt(discriminant), b));\n  std::vector<double> roots = {q / a, c / q};\n  std::sort(roots.begin(), roots.end());\n  return roots;\n}\n\n}  // namespace\n\n// Where the infinite line through l1 and l2 meets the curve p1 (start), p2 (control),\n// p3 (end), ordered by the curve parameter t.\nstd::vector<Vec2> intersect(const Vec2 p1, const Vec2 p2, const Vec2 p3, const Vec2 l1, const Vec2 l2) {\n  const Vec2 d = l2 - l1;\n  const Vec2 k = {d.y, -d.x};  // perpendicular to the line: dot(k, X - l1) = 0 on it\n  // The curve as a polynomial: P(t) = A t^2 + B t + C.\n  const Vec2 A = p1 - p2 * 2 + p3, B = (p2 - p1) * 2, C = p1;\n  std::vector<Vec2> points;\n  for (const double t : solveQuadratic(dot(k, A), dot(k, B), dot(k, C - l1))) {\n    if (t >= 0 && t <= 1) points.push_back(A * (t * t) + B * t + C);\n  }\n  return points;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, lineWord;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      words >> lineWord;\n      const Vec2 l1 = readPoint(words), l2 = readPoint(words);\n      if (!words || lineWord != \"line\") throw std::runtime_error(\"bad line: \" + line);\n      const std::vector<Vec2> points = intersect(p1, p2, p3, l1, l2);\n      if (points.empty()) {\n        output << \"none\\n\";\n        continue;\n      }\n      for (std::size_t i = 0; i < points.size(); ++i) {\n        output << (i ? \" \" : \"\") << number(points[i].x) << ' ' << number(points[i].y);\n      }\n      output << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":35,"total":35,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the blog tells the story behind it. In the blog's <strong>\"Renderer: Filling Glyph\"<\/strong> section, read <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Intersection%20detection%20for%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">Intersection detection for Bézier curves<\/a> up to the quadratic equation in t. The author's code (the listing \"Function to find a intersections of a segment and a quadratic Bezier curve\") comes right after it. Checkpoint 10 covers the curve itself.<\/p>","context":"<p>Checkpoint 14 fills a glyph by laying a horizontal line across it for every row of pixels and finding where that line crosses the outline. Checkpoint 12 found the crossing with a straight edge. This checkpoint finds the crossings with a curved edge, which can be zero, one or two points.<\/p>","sources":"<ul><li>Pomax, <em>A Primer on Bézier Curves<\/em>, <a href=\"https://pomax.github.io/bezierinfo/#intersections\" target=\"_blank\" rel=\"noopener\">Intersections<\/a> (line-curve intersection) and <a href=\"https://pomax.github.io/bezierinfo/#matrix\" target=\"_blank\" rel=\"noopener\">Bézier curvatures as matrix operations<\/a> (the polynomial form)<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Quadratic_formula\" target=\"_blank\" rel=\"noopener\">Quadratic formula<\/a>, including the discriminant and a version that avoids cancellation<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>, on the quadratic curves in TrueType outlines<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Intersection%20detection%20for%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">Intersection detection for Bézier curves<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 13                          run every test\n.\\check 13 -Case 13-R1-arch         one test, showing its full input, expected output and your output\n.\\check 13 -Fresh                   a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 13 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  A tangent line gives its touching point once .........................    1 / 4   FAILED\n      x 13-R4-arch-top  a horizontal line touching the top of an arch at t = 0.5\n          line 1: expected `5 5`, got `5 5 5 5`\n          expected values from: exact arithmetic (fractions.Fraction, 60-digit decimal square roots), root count cross-checked\n          reproduce: build/p13.exe build/cases/13/13-R4-arch-top.in build/cases/13/13-R4-arch-top.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>solveQuadratic(a, b, c)<\/code> on its own first and test it by hand: (1, −3, 2) gives 1 and 2; (1, 2, 1) gives −1 once; (1, 0, 1) gives nothing; (0, 2, −1) gives 0.5. Then the rest is a few dot products.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Compute A, B and C from the curve, and K from the line. Turn them into the three numbers a, b, c. Solve, keep the roots between 0 and 1, sort them, and turn each one back into a point with A t² + B t + C. Check each step against Example 1.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>a = 0 happens, and often with horizontal lines. Dividing by 2a then gives <code>inf<\/code> or <code>nan<\/code>, and the crossing silently disappears.<\/li><li>When D = 0, return the root once, not twice.<\/li><li>Sort the roots. Which formula gives the smaller one depends on the sign of a, and that sign flips when the line's direction is reversed.<\/li><li>Don't check the points against l1 and l2. The line goes on forever.<\/li><li>Keep t = 0 and t = 1: use ≤ at both ends. A half-open range like 0 ≤ t &lt; 1 loses crossings at p3.<\/li><li>Check D before taking its square root. The square root of a negative number is <code>nan<\/code>.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>solveQuadratic(a, b, c):\n    if a == 0:\n        return [] if b == 0 else [-c / b]\n    D = b*b - 4*a*c\n    if D &lt; 0:  return []\n    if D == 0: return [-b / (2*a)]\n    return sorted([(-b - sqrt(D)) / (2*a), (-b + sqrt(D)) / (2*a)])\n\nintersect(p1, p2, p3, l1, l2):\n    A = p1 - 2*p2 + p3;  B = 2*(p2 - p1);  C = p1\n    d = l2 - l1;  K = (d.y, -d.x)\n    roots = solveQuadratic(dot(K, A), dot(K, B), dot(K, C - l1))\n    return [A*t*t + B*t + C for t in roots if 0 &lt;= t &lt;= 1]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"two crossings","test":"13-R1-arch","input":"curve 0 0 50 100 100 0 line 0 32 100 32","output":"20 32 80 32","image":null,"explain":"<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Computation<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>A, B, C<\/td><td>(0, 0) − 2·(50, 100) + (100, 0), 2·(50, 100), (0, 0)<\/td><td>(0, −200), (100, 200), (0, 0)<\/td><\/tr><tr><td>d, K<\/td><td>(100, 0), (0, −100)<\/td><td><\/td><\/tr><tr><td>a, b, c<\/td><td>K·A, K·B, K·((0, 0) − (0, 32))<\/td><td>20000, −20000, 3200<\/td><\/tr><tr><td>D<\/td><td>20000² − 4 · 20000 · 3200<\/td><td>144,000,000, so √D = 12000<\/td><\/tr><tr><td>t<\/td><td>(20000 ∓ 12000) / 40000<\/td><td>0.2 and 0.8<\/td><\/tr><tr><td>P(0.2), P(0.8)<\/td><td>A t² + B t + C<\/td><td><strong>(20, 32)<\/strong> and <strong>(80, 32)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>"},{"label":"Example 2","name":"the linear case","test":"13-R5-scanline","input":"curve 0 0 10 5 0 10 line -10 5 10 5\ncurve 100 0 160 50 100 100 line 0 30 1 30","output":"5 5\n125.2 30","image":null,"explain":"<p>On the first line, A = (−20, 0) and K = (0, −20), so a = 0. Then b = K · (20, 10) = −200 and c = K · ((0, 0) − (−10, 5)) = 100, so t = −c / b = 0.5 and P(0.5) = (5, 5). Both curves bulge sideways, so a horizontal line crosses each of them once.<\/p>"},{"label":"Example 3","name":"a tangent","test":"13-R4-arch-top","input":"curve 0 0 5 10 10 0 line 0 5 10 5","output":"5 5","image":null,"explain":"<p>Here a = 200, b = −200 and c = 50, so D = 40000 − 40000 = 0. The single root t = 0.5 is the top of the arch, where the line touches it. Print it once.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=intersections%20of%20a%20segment%20and%20a%20quadratic\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> is one function, <code>segmentQuadBezierIntersect<\/code>, that returns <code>std::vector&lt;glm::vec2&gt;<\/code>. It builds K, A, B and C as on this page, calls <code>solveQuadratic(dot(k, a), dot(k, b), dot(k, c - l1))<\/code>, and keeps the roots with −eps ≤ t ≤ 1 + eps.<\/p>\n<p><strong>Something to look for:<\/strong><\/p>\n<ul><li>Despite its name, the function treats l1 and l2 as an infinite line. It never checks that a point lies between them. That suits the blog's fill, whose scanline spans the whole image.<\/li><li><code>solveQuadratic<\/code> isn't shown. A version that always uses the quadratic formula loses every crossing where a = 0 (R5), and in real glyphs that is a common case for horizontal lines.<\/li><li>The points come out in whatever order <code>solveQuadratic<\/code> returns the roots. This checkpoint asks for increasing t so that every answer has one correct form.<\/li><\/ul>"}},{"id":"14","num":"14","title":"Fill a glyph: even-odd rule","difficulty":"Hard","tests":28,"solution":"solutions/p14_even_odd_fill.cpp","problem":"problems/14-even-odd-fill.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 14 - Fill a glyph: even-odd rule\n//\n// Problem:  problems/14-even-odd-fill.md (also in the web problem book)\n// Check:    .\\check 14\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p14.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p14_even_odd_fill.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 14 - Fill a glyph: even-odd rule\n//\n// Problem:  problems/14-even-odd-fill.md (also in the web problem book)\n// Check:    .\\check 14\n//\n// Only the picture your program writes is checked, so structure this however you\n// like, or use another language or library (see README.md). The input/output code at\n// the bottom is provided so you can focus on fillOutline().\n\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"NotImplemented.h\"\n#include \"provided/Canvas.h\"  // Canvas: set(x, y, rgb), drawSpan(row, x0, x1, rgb) fills x0..x1 inclusive\n                              // (nothing if x0 > x1), writePng(path)\n\nstruct Point {\n  double x = 0;\n  double y = 0;\n  bool onCurve = true;\n};\n\n// One outline in glyph coordinates (y up), as checkpoints 07 and 09 produce it.\nstruct Outline {\n  std::vector<int> endPtsOfContours;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) is drawn at pixel (x0 + scale * x, baseline - scale * y).\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\n// Fills every pixel whose centre is inside `outline` by the even-odd rule.\nvoid fillOutline(Canvas& canvas, const Outline& outline, const Placement& place, const RGB color) {\n  // TODO: scanline fill (see the problem page).\n  throw NotImplemented(\"fillOutline\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\n// Usage: p14 <input-file> <output-png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    int width = 0, height = 0;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<Outline> outlines;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"canvas\") {  // canvas <width> <height>\n        words >> width >> height;\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r, g, b;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {\n        outlines.emplace_back();\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ...\n        Point p;\n        std::string on;\n        while (words >> p.x >> p.y >> on) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    Canvas canvas(width, height);  // black to begin with\n    for (const Outline& outline : outlines) fillOutline(canvas, outline, place, color);\n    if (!canvas.writePng(argv[2])) throw std::runtime_error(\"cannot write the PNG\");\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["sorting","floating-point comparisons","solving a quadratic equation"],"text":["sorting","floating-point comparisons","solving a quadratic equation"]},{"label":"Library","items":["<code>std::vector<\/code>","<code>std::sort<\/code>","<code>std::sqrt<\/code>"],"text":["std::vector","std::sort","std::sqrt"]},{"label":"Concepts","items":["scanline filling","the even-odd rule","quadratic Bézier curves","implied on-curve points","half-open intervals"],"text":["scanline filling","the even-odd rule","quadratic Bézier curves","implied on-curve points","half-open intervals"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that fills glyph outlines on a black canvas and writes the picture as a PNG.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p14_even_odd_fill.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p14_even_odd_fill.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, creates the canvas and writes the PNG; you fill in <code>fillOutline()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Glyph point (x, y) goes to pixel position (x0 + scale·x, baseline − scale·y). y grows up in the glyph and down on the screen.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The fill colour<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline; its <code>ends<\/code> and <code>points<\/code> lines follow<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, counting from 0: contour k runs from the point after the previous end up to and including <code>e_k<\/code><\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>The outline's points; coordinates may be fractional<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There can be several outlines. Fill each one on its own, one after another, in the same colour.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) of exactly <code>width<\/code> x <code>height<\/code> pixels. Every pixel starts black (0, 0, 0). A pixel is painted in the fill colour when its <strong>centre<\/strong> is inside an outline by the even-odd rule. Pixel (px, py), with py counted down from the top, has its centre at screen position (px + 0.5, py + 0.5), which is glyph point ((px + 0.5 − x0) / scale, (baseline − py − 0.5) / scale).<\/p>\n<p><strong>The checker forgives edges that move by one pixel.<\/strong> If you sample at the top of each row instead of the centre, or round x differently, you still pass. Missing or extra shapes, holes in the wrong place, and stray lines don't pass.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>. <code>include/provided/Canvas.h<\/code> does all of this for you; the boilerplate uses it.<\/p>\n<h3>From points to edges<\/h3>\n<p>Each contour is closed: after its last point it continues to its first. Walk the points in order:<\/p>\n<ul><li>Two on-curve points in a row are joined by a straight line.<\/li><li>An off-curve point is the control point of a quadratic Bézier curve from the previous on-curve point to the next on-curve point: B(t) = (1−t)²·P0 + 2(1−t)t·P1 + t²·P2 for t from 0 to 1.<\/li><li>When two off-curve points are next to each other, there is an <strong>implied on-curve point<\/strong> exactly halfway between them. Each off-curve point then has on-curve points on both sides.<\/li><li>A contour can start with an off-curve point, and can even consist only of off-curve points (then every on-curve point is implied).<\/li><\/ul>\n<h3>The even-odd rule<\/h3>\n<p>Draw a ray from the point to the right and count how many times it crosses the outline. An odd count means inside, an even count means outside. With a scanline (a horizontal line through a row of pixel centres) this becomes: find every x where the line crosses an edge, sort them, and fill between the 1st and 2nd, the 3rd and 4th, and so on.<\/p>\n<p><strong>The trap: vertices on the scanline.<\/strong> When a scanline passes exactly through a point where two edges meet, a naive count sees that point twice, and the rest of the row flips (a stray line), or it misses a crossing it should count. A clean rule is to treat each edge as <strong>half-open in y<\/strong>: an edge from y0 to y1 counts at scanline y when min(y0, y1) ≤ y &lt; max(y0, y1), with y measured on the screen (pixels, growing downward). Horizontal edges never count. Then a vertex the outline passes through counts once, and a pointed tip (both edges above, or both below) counts twice or not at all, which leaves the parity right either way.<\/p>\n<p>A quadratic curve can cross one scanline twice. Splitting each curve where its y turns around gives pieces that each cross a scanline at most once, and the half-open rule then works for curves too. For a curve P0, P1, P2 that point is t = (P0.y − P1.y) / (P0.y − 2·P1.y + P2.y), when the denominator isn't 0 and t is strictly between 0 and 1 (otherwise the curve is already monotone). Use the same split point, with the same y, for both halves. To find where a piece crosses scanline y, solve y(t) = y as a quadratic in t (linear when P0.y − 2·P1.y + P2.y = 0) and keep the root in [0, 1].<\/p>\n<p><strong>Clipping.<\/strong> Crossings can lie far outside the canvas. Clamp x to the canvas before converting it to an integer, since converting a huge double to <code>int<\/code> is undefined behaviour in C++. The provided <code>drawSpan(row, x0, x1)<\/code> fills x0 ... x1 inclusive, skips columns outside the canvas, and does nothing when x0 &gt; x1.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Pixels whose centre is inside are filled; every other pixel stays black.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A contour inside another is a hole and stays empty.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Curves are followed exactly, with implied on-curve points and contours that start or stay off-curve.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Vertices that sit exactly on a scanline are counted correctly (no stray lines).<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Where contours cross or overlap, the even-odd rule leaves the overlap empty.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Several outlines are filled one after another (their union).<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Placement and scale are applied; anything outside the canvas is clipped.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Canvases are at most about 560 x 560 pixels; outlines have at most a few hundred points.<\/li><li>Outlines are well-formed: every contour has at least 2 points.<\/li><li>There are 28 tests: hand-made shapes for each rule, letters from JetBrains Mono Bold at several scales, U+5341 from Noto Sans JP, and 6 random letters (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p14_even_odd_fill.cpp","text":"// Reference solution - checkpoint 14 (fill a glyph, even-odd rule).\n// SPOILERS: try the checkpoint yourself first. The work is in common/fill.h.\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"common/scene.h\"\n\nint main(int argc, char** argv) { return fill::run(argc, argv, fill::Rule::EvenOdd); }\n"},{"path":"common/scene.h","text":"#pragma once\n// Reference input reading for the fill checkpoints (14, 16, 17). SPOILERS.\n//\n//   canvas <w> <h>\n//   place <x0> <baseline> <scale>\n//   color <r> <g> <b>\n//   outline            (then `ends ...` and `points x y on|off ...`; repeatable)\n\n#include <cstdio>\n#include <fstream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"fill.h\"\n\nnamespace fill {\n\nstruct Scene {\n  int width = 0, height = 0;\n  Placement place;\n  RGB color{255, 255, 255};\n  std::vector<Outline> outlines;\n};\n\ninline Scene readScene(const std::string& path) {\n  std::ifstream in(path);\n  if (!in) throw std::runtime_error(\"cannot open \" + path);\n  Scene s;\n  for (std::string line; std::getline(in, line);) {\n    std::istringstream words(line);\n    std::string key;\n    words >> key;\n    if (key == \"canvas\") {\n      words >> s.width >> s.height;\n    } else if (key == \"place\") {\n      words >> s.place.x0 >> s.place.baseline >> s.place.scale;\n    } else if (key == \"color\") {\n      int r, g, b;\n      words >> r >> g >> b;\n      s.color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n    } else if (key == \"outline\") {\n      s.outlines.emplace_back();\n    } else if (key == \"ends\") {\n      for (int e; words >> e;) s.outlines.back().ends.push_back(e);\n    } else if (key == \"points\") {\n      Point p;\n      std::string on;\n      while (words >> p.x >> p.y >> on) {\n        p.onCurve = on == \"on\";\n        s.outlines.back().points.push_back(p);\n      }\n    }\n  }\n  return s;\n}\n\ninline int run(int argc, char** argv, const Rule rule) {\n  if (argc != 3) return 2;\n  try {\n    const Scene s = readScene(argv[1]);\n    Canvas canvas(s.width, s.height);\n    for (const Outline& o : s.outlines) fillOutline(canvas, o, s.place, rule, s.color);\n    return canvas.writePng(argv[2]) ? 0 : 1;\n  } catch (const std::exception& e) {\n    fprintf(stderr, \"error: %s\\n\", e.what());\n    return 1;\n  }\n}\n\n}  // namespace fill\n"},{"path":"common/fill.h","text":"#pragma once\n// Reference fill engine shared by the reference solutions of checkpoints 14, 16,\n// 17 and 18. SPOILERS: try those checkpoints yourself first.\n//\n// A pixel is filled when its centre is inside the outline. Every row is scanned\n// through the pixel centres; outline edges are split into pieces that are monotone\n// in y, so each piece crosses a scanline at most once (half-open in y, which\n// counts a shared vertex exactly once).\n\n#include <algorithm>\n#include <cmath>\n#include <utility>\n#include <vector>\n\n#include \"provided/Canvas.h\"\n\nnamespace fill {\n\nstruct Point {\n  double x = 0, y = 0;\n  bool onCurve = true;\n};\n\nstruct Outline {\n  std::vector<int> ends;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) -> pixel (x0 + scale*x, baseline - scale*y).\nstruct Placement {\n  double x0 = 0, baseline = 0, scale = 1;\n};\n\nenum class Rule { EvenOdd, NonZero };\n\nstruct Vec {\n  double x = 0, y = 0;\n};\n\n// A line (curve == false) or a quadratic curve from p0 via c to p1, monotone in y.\nstruct Piece {\n  Vec p0, c, p1;\n  bool curve = false;\n};\n\ninline Vec mid(const Vec a, const Vec b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\n// Splits a quadratic curve at its turning point in y, if it has one inside.\ninline void addCurve(const Vec p0, const Vec c, const Vec p1, std::vector<Piece>& out) {\n  const double denom = p0.y - 2 * c.y + p1.y;\n  if (std::abs(denom) > 1e-12) {\n    const double t = (p0.y - c.y) / denom;\n    if (t > 1e-9 && t < 1 - 1e-9) {\n      const Vec a = {p0.x + (c.x - p0.x) * t, p0.y + (c.y - p0.y) * t};\n      const Vec b = {c.x + (p1.x - c.x) * t, c.y + (p1.y - c.y) * t};\n      const Vec m = {a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t};\n      out.push_back({p0, a, m, true});\n      out.push_back({m, b, p1, true});\n      return;\n    }\n  }\n  out.push_back({p0, c, p1, true});\n}\n\n// The outline's edges in pixel space, with the implied on-curve points between\n// consecutive off-curve points, and contours that start off-curve handled.\ninline std::vector<Piece> pieces(const Outline& o, const Placement& at) {\n  std::vector<Piece> out;\n  int start = 0;\n  for (const int end : o.ends) {\n    std::vector<std::pair<Vec, bool>> pts;\n    for (int i = start; i <= end; ++i) {\n      const Point& p = o.points[i];\n      pts.push_back({{at.x0 + at.scale * p.x, at.baseline - at.scale * p.y}, p.onCurve});\n    }\n    start = end + 1;\n    if (pts.empty()) continue;\n\n    // Make every implied on-curve point explicit.\n    std::vector<std::pair<Vec, bool>> full;\n    for (std::size_t i = 0; i < pts.size(); ++i) {\n      const auto& p = pts[i];\n      const auto& next = pts[(i + 1) % pts.size()];\n      full.push_back(p);\n      if (!p.second && !next.second) full.push_back({mid(p.first, next.first), true});\n    }\n    const auto first = std::find_if(full.begin(), full.end(), [](const auto& p) { return p.second; });\n    if (first == full.end()) continue;  // a single off-curve point: nothing to fill\n    std::rotate(full.begin(), first, full.end());\n\n    Vec current = full[0].first;\n    for (std::size_t i = 1; i <= full.size(); ++i) {\n      const auto& p = full[i % full.size()];\n      if (p.second) {\n        out.push_back({current, current, p.first, false});\n        current = p.first;\n      } else {\n        const Vec end = full[(i + 1) % full.size()].first;  // always on-curve now\n        addCurve(current, p.first, end, out);\n        current = end;\n        ++i;\n      }\n    }\n  }\n  return out;\n}\n\nstruct Crossing {\n  double x = 0;\n  int direction = 0;  // +1 going down the screen, -1 going up\n};\n\n// Where a monotone piece crosses the horizontal line y = scanY (half-open in y).\ninline bool cross(const Piece& p, const double scanY, Crossing& out) {\n  const double y0 = p.p0.y, y1 = p.p1.y;\n  if (y0 == y1) return false;\n  if (!(std::min(y0, y1) <= scanY && scanY < std::max(y0, y1))) return false;\n  out.direction = y1 > y0 ? 1 : -1;\n  if (!p.curve) {\n    const double t = (scanY - y0) / (y1 - y0);\n    out.x = p.p0.x + (p.p1.x - p.p0.x) * t;\n    return true;\n  }\n  const double a = y0 - 2 * p.c.y + y1, b = 2 * (p.c.y - y0), c = y0 - scanY;\n  double t;\n  if (std::abs(a) < 1e-12) {\n    t = -c / b;\n  } else {\n    const double disc = std::max(0.0, b * b - 4 * a * c);\n    const double r1 = (-b + std::sqrt(disc)) / (2 * a), r2 = (-b - std::sqrt(disc)) / (2 * a);\n    const auto dist = [](const double r) { return r < 0 ? -r : (r > 1 ? r - 1 : 0); };\n    t = dist(r1) <= dist(r2) ? r1 : r2;  // the piece is monotone: one root is in [0, 1]\n  }\n  t = std::clamp(t, 0.0, 1.0);\n  const double u = 1 - t;\n  out.x = u * u * p.p0.x + 2 * u * t * p.c.x + t * t * p.p1.x;\n  return true;\n}\n\n// Fills one outline: every pixel whose centre is inside it by `rule`.\ninline void fillOutline(Canvas& canvas, const Outline& o, const Placement& at, const Rule rule,\n                        const RGB color) {\n  const std::vector<Piece> edges = pieces(o, at);\n  if (edges.empty()) return;\n  double top = 1e300, bottom = -1e300;\n  for (const Piece& e : edges) {\n    top = std::min({top, e.p0.y, e.c.y, e.p1.y});\n    bottom = std::max({bottom, e.p0.y, e.c.y, e.p1.y});\n  }\n  const int firstRow = std::max(0, static_cast<int>(std::floor(top)) - 1);\n  const int lastRow = std::min(canvas.height() - 1, static_cast<int>(std::ceil(bottom)) + 1);\n\n  std::vector<Crossing> crossings;\n  for (int row = firstRow; row <= lastRow; ++row) {\n    const double scanY = row + 0.5;\n    crossings.clear();\n    for (const Piece& e : edges) {\n      Crossing c;\n      if (cross(e, scanY, c)) crossings.push_back(c);\n    }\n    std::sort(crossings.begin(), crossings.end(), [](const Crossing& a, const Crossing& b) { return a.x < b.x; });\n    int winding = 0;\n    for (std::size_t i = 0; i + 1 < crossings.size(); ++i) {\n      winding += rule == Rule::EvenOdd ? 1 : crossings[i].direction;\n      const bool inside = rule == Rule::EvenOdd ? (winding % 2 != 0) : (winding != 0);\n      if (!inside) continue;\n      // Pixels whose centre x + 0.5 lies in [crossings[i].x, crossings[i + 1].x).\n      const int from = static_cast<int>(std::ceil(crossings[i].x - 0.5));\n      const int to = static_cast<int>(std::ceil(crossings[i + 1].x - 0.5)) - 1;\n      if (from <= to) canvas.drawSpan(row, from, to, color);\n    }\n  }\n}\n\n}  // namespace fill\n"}],"proof":{"passed":28,"total":28,"date":"2026-10-21"},"uses":["include/provided/Canvas.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Renderer%3A%20Filling%20Glyph\" target=\"_blank\" rel=\"noopener\">Renderer: Filling Glyph<\/a> section through <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a>, skipping the code blocks if you want to work it out yourself. The blog builds this in two steps (a first version, then a fix for errors at vertices); here they are one checkpoint.<\/p>","context":"<p>A glyph is only an outline until it's filled. This checkpoint takes the outlines from checkpoints 07 and 09 and paints the inside, using the even-odd rule. Checkpoints 16 and 17 do the same with the non-zero rule, and checkpoint 18 renders whole lines of text.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Even%E2%80%93odd_rule\" target=\"_blank\" rel=\"noopener\">Even–odd rule<\/a><\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: on-curve and off-curve points<\/li><li>Pomax, <a href=\"https://pomax.github.io/bezierinfo/\" target=\"_blank\" rel=\"noopener\">A Primer on Bézier Curves<\/a>: finding extremities and intersections<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Even-odd%20Rule\" target=\"_blank\" rel=\"noopener\">Even-odd Rule<\/a> and <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 14                         run every test\n.\\check 14 -Case 14-R5-star        one test: its input, and where the expected and your pictures are\n.\\check 14 -Fresh                  new random letters (new seed)\n.\\check 14 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing picture comes with a diff image:<\/p>\n<pre><code>  R4  Vertices exactly on a scanline are counted correctly .................    4 / 5   FAILED\n      x 14-R4-W  &#x27;W&#x27; at scale 0.5: vertices sharing a row\n          26 extra pixels, e.g. (145, 115) should be black (beyond the 1-pixel edge tolerance).\n          Diff: build/cases/14/14-R4-W.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Turn the outline into a list of edges first (lines and quadratic curves, in pixel coordinates), then fill row by row. Getting the edges right is half the job, and checkpoint 11 (drawing curves) already did most of it.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>For each pixel row, take the horizontal line through the pixel centres (y = row + 0.5). Collect the x of every place an edge crosses it, sort the list, and fill from the 1st crossing to the 2nd, the 3rd to the 4th, and so on. A pixel is filled when its centre x (px + 0.5) is in one of those ranges.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Use half-open intervals in y (min ≤ y &lt; max) so a shared vertex counts once; skip horizontal edges.<\/li><li>Split each quadratic curve where its y turns around (t = (y0 − y1c) / (y0 − 2·y1c + y2), when that is strictly between 0 and 1), so each piece crosses a row at most once.<\/li><li>Implied on-curve points: between two off-curve points, add their midpoint.<\/li><li>A contour may start off-curve: start walking from an on-curve point (or an implied one).<\/li><li>Remember y flips: pixel y = baseline − scale·glyph y.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>edges = []\nfor each contour:\n    pts = points mapped to pixels, with midpoints inserted between consecutive off-curve points\n    rotate pts so it starts at an on-curve point\n    walk around: on-&gt;on adds a line; on-&gt;off-&gt;on adds a curve (split at its y turning point)\n\nfor row in 0 .. height-1:\n    y = row + 0.5\n    xs = []\n    for e in edges:\n        if min(e.y0, e.y1) &lt;= y &lt; max(e.y0, e.y1):\n            xs.append(x where e crosses y)      # line: interpolate; curve: solve the quadratic in t\n    sort xs\n    for i in 0, 2, 4, ...:\n        fill pixels px with xs[i] &lt;= px + 0.5 &lt; xs[i+1]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a pentagram","test":"14-R5-star","input":"canvas 205 195\nplace 2 206 2\ncolor 255 255 255\noutline\nends 4\npoints 50 100 on 79 9 on 2 65 on 98 65 on 21 9 on","output":null,"image":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAM0AAADDCAIAAACu1AJOAAAIcUlEQVR4XmMYBaMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhQKUQ+A8Go8FJaggwjQbZaAjQIQRG09loMqNHCDCOBjPxIQCsM+GKGRlHg46EtDNano1mNIbRenM0EQyTEBgt/ImNSORKE6JntOokPhOM1pujReZovTmaBhhG682RlAgwK83RqpOk+B+tN0fLzNF6czQNjNabIycN4Ko0R6vO0f7maEk4uEJgtH02miLpEQKj47QEQhl/pTladRKZSEfLs9HybLS/OZoGhksIjNab+GKSmEpztOokJi+M1pujZeZovTmaBoZLCIyWZ6NpmR4hMNo+wxnKxDfORptoBJPqaHk2Wp6Nts9G08BwCYHRehN7TJJaaY5WnfhzxGi9OVpmjtabo2lgtN4cxmmAvEpztOrEkyRG683RMnO03hxNA6P15nBNA5RUmqNVJ65UMVpvjpaZo/XmaBoYrTeHZRqgvNIcrTqxJozRenO0zBytN0fTwGi9OfzSALUqzdGqEzNtjNabo2XmaL05mgZG681hlgaoW2mOVp1oyWO03hwtM0frzdE0MFxCYLQ8A8UkLSrN0TyCHAKj6YyG6WE0+cIDdzSdjZY7o+2z0TQwXEJgdL8TA61rt9HrLICZZbTeHC0zR+vN0TQwWm8OjxCgT5dwtOocrTdHy8zRenM0DYzWm8MgBOg5jjrCq87RenO0zBytN0fTwGi9OdRDgP6TjyO56hytN0fLzNF6czQNjNabQzoEBmrFzoitOkfrzdEyc7TeHE0Do/Xm0A2BgV3mOjKrztF6c7TMHK03R9PAaL05RENgMOwNGYFV52i9OVpmjtabo2lgeNebw3jj4WCos0Zg8OLc7zQsw2LwNIxGWvDibJ+NLmkfrbRJCgH8CYYFj1kQnaOb90cTHP4QIKZIImqf8PBIaoOthB5RocpCTGYdLdhGizTMECAp35IwfjbaYhtNbfAQIDUxkHy+xhAt7QdnJhk5gclCah4drUNHcqlGdnYlc95ptA4dgamNkkin6FyqoVLsD+ZcMULCkIWSfDlah46EUo0quZQK6zVG69BhnNqoFbnUPM9xcFYBgz8bjIRwo+b6s9GCbdgUbFSPSiqvcxxNasMgqdEiEml1DvIgqQuGSrof9sFFq3XbowXbkCvYaBplNNwfMJrUhlBSo3Vk0eP+gIGqFIZWQh/eoUSP/U6jBdugLdjoFjUs9AkCiH+G6PKEYTkMS+fMT9f9m6MF2yBJsvSPiAG434k+pdpQTNPDOGRY6J/DRuvQgSrVBjDvMY1APzOMSDCwBfwA34tIo5pi6DYEh2u
