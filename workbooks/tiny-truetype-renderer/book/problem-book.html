==========================================================================\n\n// Font point (x, y) lands on pixel (x0 + scale * x, baseline - scale * y): font y grows\n// upwards, pixel y grows downwards.\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n"},{"path":"solutions/src/render/Outline.h","role":"new","purpose":"These files draw a glyph's outline on the canvas, with straight lines between its points and a marker on every point. In assignment 11 you add a second drawing, with the real curves, to the same files.","job":"Declare a drawing style (line thickness and marker size) and a function that draws one outline (the type from `GlyphComponent.h`) on your `FrameBufferCanvas`, given a placement, a style and a colour.","blank":"#pragma once\n// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   These files draw a glyph's outline on the canvas, with straight lines between its\n//   points and a marker on every point. In assignment 11 you add a second drawing, with\n//   the real curves, to the same files.\n//\n// Your job:\n//   Declare a drawing style (line thickness and marker size) and a function that draws one\n//   outline (the type from `GlyphComponent.h`) on your `FrameBufferCanvas`, given a\n//   placement, a style and a colour.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   These files draw a glyph's outline on the canvas, with straight lines between its\n//   points and a marker on every point. In assignment 11 you add a second drawing, with\n//   the real curves, to the same files.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\nstruct OutlineStyle {\n  int lineThickness = 1;  // passed to FrameBufferCanvas::drawLine\n  int markerSize = 1;     // width and height of the square drawn at every point\n};\n\n// Assignment 08: a straight line between consecutive points of each contour (the last point\n// joins the first), then a marker on every point, all in `color`.\nvoid renderGlyphOutline(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                        const OutlineStyle& style, RGB color);\n\n// Assignment 11: the real outline, quadratic curves included, then markers twice the line\n// thickness: red on-curve points, green off-curve points, blue implied on-curve points.\nvoid renderGlyphCurves(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                       int lineThickness, RGB color);\n"},{"path":"solutions/src/render/Outline.cpp","role":"new","purpose":"These files draw a glyph's outline on the canvas, with straight lines between its points and a marker on every point. In assignment 11 you add a second drawing, with the real curves, to the same files.","job":"Implement the outline drawing as \"What to draw\" describes: turn every point into a pixel with the formulas in \"From font units to pixels\", join the points of each contour with lines, including the closing line, then draw a marker on every point. Use your canvas's line and rectangle for both.","blank":"// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   These files draw a glyph's outline on the canvas, with straight lines between its\n//   points and a marker on every point. In assignment 11 you add a second drawing, with\n//   the real curves, to the same files.\n//\n// Your job:\n//   Implement the outline drawing as \"What to draw\" describes: turn every point into a\n//   pixel with the formulas in \"From font units to pixels\", join the points of each\n//   contour with lines, including the closing line, then draw a marker on every point. Use\n//   your canvas's line and rectangle for both.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   These files draw a glyph's outline on the canvas, with straight lines between its\n//   points and a marker on every point. In assignment 11 you add a second drawing, with\n//   the real curves, to the same files.\n//\n// Your job:\n//   Implement the outline drawing as \"What to draw\" describes: turn every point into a\n//   pixel with the formulas in \"From font units to pixels\", join the points of each\n//   contour with lines, including the closing line, then draw a marker on every point. Use\n//   your canvas's line and rectangle for both. The Boilerplate gives you the declarations;\n//   fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"render/Outline.h\"\n\n#include <stdexcept>\n\nvoid renderGlyphOutline(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                        const OutlineStyle& style, const RGB color) {\n  // TODO: see \"What to draw\" on the problem page.\n  throw std::logic_error(\"not implemented: renderGlyphOutline\");\n}\n\nvoid renderGlyphCurves(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                       const int lineThickness, const RGB color) {\n  // TODO (assignment 11): see \"Walking a contour\", \"Drawing a curve\" and \"Markers\" on its\n  // problem page. bezierLerp in utils/Geometry.h (assignment 10) gives the points of a curve.\n  throw std::logic_error(\"not implemented: renderGlyphCurves\");\n}\n"}],"buildsOn":[{"path":"solutions/src/FrameBufferCanvas.h","owner":"06","purpose":"The canvas holds a picture in memory, one colour per pixel. It can paint one pixel, fill a rectangle, draw a thick line and save the picture as a PNG. You draw every later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line of text in 18."},{"path":"solutions/src/GlyphComponent.h","owner":"07","purpose":"Every outline in the project takes this form: its points (x and y in font units, on or off the curve) and the index where each contour ends. Assignments 08 and 11 draw outlines in this form, 09 produces one per part of a compound glyph, and 14, 16 and 17 fill them."}],"indent":2,"tags":[{"label":"Language","items":["nested loops over index ranges","wrapping an index back to the start","<code>std::lround<\/code>"],"text":["nested loops over index ranges","wrapping an index back to the start","std::lround"]},{"label":"Library","items":["your <code>FrameBufferCanvas<\/code> from assignment 06 (<code>drawLine<\/code>, <code>drawRect<\/code>, <code>writePng<\/code>)"],"text":["your FrameBufferCanvas from assignment 06 (drawLine, drawRect, writePng)"]},{"label":"Concepts","items":["glyph outlines and contours","font units vs pixels","flipping the y axis","scale and offset (a simple transform)"],"text":["glyph outlines and contours","font units vs pixels","flipping the y axis","scale and offset (a simple transform)"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that draws glyph outlines into a PNG: straight lines between each outline's points, and a small square on every point.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The output file name ends in <code>.png<\/code>. The input file contains these lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;w&gt; &lt;h&gt;<\/code><\/td><td>Always the first line: the picture is <code>w<\/code> x <code>h<\/code> pixels, all black.<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Where the following outlines go (see below).<\/td><\/tr><tr><td><code>style &lt;lineThickness&gt; &lt;markerSize&gt;<\/code><\/td><td>Line thickness and marker size, in pixels, for the following outlines.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>Colour of the following outlines.<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline. An <code>ends<\/code> line and a <code>points<\/code> line follow.<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, in increasing order.<\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>Every point of the outline, in order, in font units.<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>The input sets <code>place<\/code>, <code>style<\/code> and <code>color<\/code> before the first <code>outline<\/code>, and may set them again between outlines. Each outline uses the most recent ones.<\/li><li><code>ends<\/code> and <code>points<\/code> use the format that assignment 07 prints, except that a coordinate may have a fractional part (e.g. <code>120.75<\/code>), as assignment 09 produces for scaled components.<\/li><li><code>x0<\/code>, <code>baseline<\/code> and <code>scale<\/code> may be fractional or negative. <code>lineThickness<\/code>, <code>markerSize<\/code>, <code>w<\/code>, <code>h<\/code> and colours are whole numbers.<\/li><\/ul>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) file of <code>w<\/code> x <code>h<\/code> pixels, RGB. Pixel (0, 0) is the top-left corner and pixel y grows downwards.<\/p>\n<p><strong>Writing the picture.<\/strong> Your <code>FrameBufferCanvas<\/code> from assignment 06 can already do this (<code>writePng<\/code> in the Boilerplate). Write the picture to the output path the checker gives you. The name ends in <code>.png<\/code>, but the checker looks at the contents, so either of these works:<\/p>\n<ul><li><strong>A binary PPM<\/strong>: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><li><strong>A real PNG<\/strong>: <code>third_party/stb_image_write.h<\/code> in your project is on the include path. <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><\/ul>\n<h3>From font units to pixels<\/h3>\n<p>Glyph coordinates are in <strong>font units<\/strong>, which grow <strong>upwards<\/strong> from the baseline; pixel coordinates grow downwards from the top. A point (x, y) in font units lands on pixel<\/p>\n<pre><code>px = x0 + scale * x\npy = baseline - scale * y<\/code><\/pre>\n<p>rounded to the nearest whole number. This makes <code>x0<\/code> the pixel column where font x = 0 lands and <code>baseline<\/code> the pixel row where font y = 0 lands. A point with a negative y (a descender, like the tail of <code>g<\/code>) ends up <strong>below<\/strong> the baseline row.<\/p>\n<h3>What to draw<\/h3>\n<p>For each outline, in input order:<\/p>\n<ol><li><strong>Lines.<\/strong> The <code>ends<\/code> values split the points into contours: contour 0 is points 0 to <code>e0<\/code>, contour 1 is points <code>e0 + 1<\/code> to <code>e1<\/code>, and so on. Within each contour, draw a line from every point to the next one, and from the <strong>last point back to the contour's first point<\/strong>. Don't draw a line from one contour to the next. Draw each line with your <code>FrameBufferCanvas<\/code> line from assignment 06, with thickness <code>lineThickness<\/code>.<\/li><li><strong>Markers.<\/strong> Then, on every point, draw a <code>markerSize<\/code> x <code>markerSize<\/code> square centred on it (your canvas's rectangle): columns x − size/2 up to x − size/2 + size − 1 with size/2 rounded down, and rows likewise. With an odd size the point sits in the middle; with an even size the left and top sides get one pixel more, so a 10-pixel marker at x = 16 covers columns 11 to 20.<\/li><\/ol>\n<p>Three more rules:<\/p>\n<ul><li>Draw the lines and the markers in the outline's colour.<\/li><li>Treat <code>on<\/code> and <code>off<\/code> points the same: join every point with straight lines and give it a marker.<\/li><li>Later outlines paint over earlier ones, though no test makes outlines of different colours overlap.<\/li><\/ul>\n<h3>How the picture is compared<\/h3>\n<p>The checker compares your PNG with the expected picture pixel by pixel and forgives only an edge that moved by at most 1 pixel, so rounding a coordinate down instead of to the nearest still passes. A missing line, a line that shouldn't be there or a shape in the wrong place fails.<\/p>\n<p>If a test fails, the checker writes a diff picture:<\/p>\n<ul><li>red where you have extra ink;<\/li><li>blue where ink is missing;<\/li><li>magenta for the wrong colour;<\/li><li>yellow for forgiven pixels.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Point (x, y) lands on pixel (x0 + scale * x, baseline - scale * y), rounded, so the glyph stands upright on the baseline.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A line joins each contour's last point to its first, closing the contour.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Contours stay separate: no line joins the end of one contour to the start of the next.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Every point, on-curve or off-curve, gets a <code>markerSize<\/code> x <code>markerSize<\/code> square.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Several outlines on one canvas each use their own <code>place<\/code>, <code>style<\/code> and <code>color<\/code>.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>The scale applies to every coordinate, including coordinates with a fractional part.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>w<\/code> and <code>h<\/code> are at most 600. Every outline fits inside the canvas.<\/li><li>An outline has at most a few hundred points; <code>ends<\/code> is increasing and its last value is the last point index.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 22 tests: glyphs from JetBrains Mono Bold (<code>-<\/code>, <code>A<\/code>, <code>B<\/code>, <code>D<\/code>, <code>S<\/code>, <code>a<\/code>, <code>g<\/code>, <code>o<\/code>), U+5341 十 and U+3042 あ from Noto Sans JP, hand-made outlines and 3 random outlines.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/render/Placement.h","text":"#pragma once\n// Assignment 08: where a glyph goes on the canvas.\n\n// Font point (x, y) lands on pixel (x0 + scale * x, baseline - scale * y): font y grows\n// upwards, pixel y grows downwards.\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n"},{"path":"src/render/Outline.h","text":"#pragma once\n// Assignment 08: drawing a glyph's outline with straight lines; assignment 11: with curves.\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\nstruct OutlineStyle {\n  int lineThickness = 1;  // passed to FrameBufferCanvas::drawLine\n  int markerSize = 1;     // width and height of the square drawn at every point\n};\n\n// A straight line between consecutive points of each contour (the last point joins the\n// first), then a marker on every point, all in `color`.\nvoid renderGlyphOutline(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                        const OutlineStyle& style, RGB color);\n"},{"path":"src/render/Outline.cpp","text":"#include \"render/Outline.h\"\n\n#include <cmath>\n#include <utility>\n\nnamespace {\n\nint nearest(const double v) { return static_cast<int>(std::lround(v)); }\n\n// Font units -> the nearest pixel (y flipped: font y grows upwards, pixel y downwards).\nstd::pair<int, int> pixelOf(const GlyphPoint& p, const Placement& place) {\n  return {nearest(place.x0 + place.scale * p.x), nearest(place.baseline - place.scale * p.y)};\n}\n\n}  // namespace\n\nvoid renderGlyphOutline(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                        const OutlineStyle& style, const RGB color) {\n  int first = 0;\n  for (const int last : outline.endPtsOfContours) {\n    for (int i = first; i <= last; ++i) {\n      const int next = i == last ? first : i + 1;  // the last point closes the contour\n      const auto [ax, ay] = pixelOf(outline.points[i], place);\n      const auto [bx, by] = pixelOf(outline.points[next], place);\n      canvas.drawLine(ax, ay, bx, by, style.lineThickness, color);\n    }\n    first = last + 1;\n  }\n  for (const GlyphPoint& p : outline.points) {  // markers on top of the lines\n    const auto [x, y] = pixelOf(p, place);\n    canvas.drawRect(x, y, style.markerSize, style.markerSize, color);\n  }\n}\n"},{"path":"assignments/assignment_08_outline_lines.cpp","text":"// Assignment 08 (draw an outline with straight lines): draws a test input's outlines.\n// The drawing is src/render/Outline, on src/FrameBufferCanvas.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/Outline.h\"\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    OutlineStyle style;\n    RGB color{255, 255, 255};\n    GlyphComponent outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness> <markerSize>\n        words >> style.lineThickness >> style.markerSize;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = GlyphComponent{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3)\n          outline.points.push_back(GlyphPoint{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        renderGlyphOutline(*canvas, outline, place, style, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/FrameBufferCanvas.h","src/GlyphComponent.h","src/FrameBufferCanvas.cpp"],"proof":{"passed":22,"total":22,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Render%20outlines%20as%20straight%20lines\" target=\"_blank\" rel=\"noopener\">Render outlines as straight lines<\/a> section up to and including the paragraph that starts \"The glyph coordinates are\", and stop before the author's code that follows it.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 07 you decoded a glyph into contours of points (the types in your <code>GlyphComponent.h<\/code>), and your <code>FrameBufferCanvas<\/code> from assignment 06 draws lines and squares. Here you put the two together and draw your first picture of a real glyph: every contour as a closed polygon, with a square on each point. This assignment leaves out curves; assignment 11 adds them to the same <code>render/Outline<\/code> files.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: contours, points and font units<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>: how <code>endPtsOfContours<\/code> splits the points into contours<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Render%20outlines%20as%20straight%20lines\" target=\"_blank\" rel=\"noopener\">Render outlines as straight lines<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 08                         run every test\n.\\check 08 -Case 08-R2-triangle    one test, showing its full input and where your picture is\n.\\check 08 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 08 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>Open your picture (<code>build/cases/08/&lt;id&gt;.out.png<\/code>) next to the expected one (<code>tests/08/expected/&lt;id&gt;.png<\/code>) and the diff the checker writes. A failing test looks like this:<\/p>\n<pre><code>  R2  Every contour is closed: its last point joins its first ..............    0 / 2   FAILED\n      x 08-R2-triangle  hand-made triangle: the third side is the closing line\n          1127 pixels missing, e.g. (116, 21) should be white (beyond the 1-pixel edge tolerance). Diff: build/cases/08/08-R2-triangle.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven\n          likely cause: R2 - Every contour is closed: its last point joins its first\n          expected values from: hand-made outline; picture checked against the ideal segments and markers\n          reproduce: build/solutions/assignment_08.exe build/cases/08/08-R2-triangle.in build/cases/08/08-R2-triangle.out.png<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write a small function that turns one font point into a pixel (the two formulas above, then round). Check it on Example 1 by hand before drawing anything.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Walk the contours with a running start index: contour k runs from <code>first<\/code> to <code>ends[k]<\/code>, then <code>first = ends[k] + 1<\/code>. Inside a contour, the point after <code>i<\/code> is <code>i + 1<\/code>, except after the last point, where it is <code>first<\/code>. Draw all lines, then loop over all points once more for the markers.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Subtract <code>scale * y<\/code> from the baseline; adding it draws the glyph upside down, with most of it off the canvas.<\/li><li>Apply the scale to the coordinates only: <code>x0 + scale * x<\/code>, not <code>scale * (x0 + x)<\/code>.<\/li><li>The closing line goes back to the contour's own first point, not to point 0 of the outline.<\/li><li>Don't round a coordinate with a plain cast if it can be negative: <code>(int)-2.7<\/code> is -2. <code>std::lround<\/code> rounds to the nearest.<\/li><li>Each outline may have its own <code>place<\/code>, <code>style<\/code> and <code>color<\/code>; use the most recent ones (the boilerplate keeps track of them for you).<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>pixel(p) = (round(x0 + scale * p.x), round(baseline - scale * p.y))\n\ndrawOutline(outline):\n    first = 0\n    for last in outline.ends:\n        for i in first .. last:\n            next = (i == last) ? first : i + 1\n            drawLine(pixel(points[i]), pixel(points[next]), lineThickness, color)\n        first = last + 1\n    for p in points:\n        (x, y) = pixel(p)\n        drawRect(x, y, markerSize, markerSize, color)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a triangle","test":"08-R2-triangle","input":"canvas 430 350\nplace 15 335 0.8\nstyle 3 9\ncolor 255 255 255\noutline\nends 2\npoints 0 0 on 500 0 on 130 400 off","output":"a 430 x 350 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa4AAAFeCAIAAABSBWzUAAAFn0lEQVR42u3Y243gNhREQeafNJUAKUAAKT666teA7dVIZ25vKQAAAAAAAAAAAAAAAAAA09U+DweQQikEpFAKASmUQkAKpRCQQikEpFAKASlUQ0AK1RAIr2Gzjx4REJTC9z4CBJ2EaghIYfsfqSEQt47VEHASqiEghWoIWMdqCDgJ1RCQQjUErGM1BJyEaghIoRoC1rEaAlKohoB1vPpfBXBqCtUQi ><tbody><tr><td>0<\/td><td>(0, 0)<\/td><td>15<\/td><td>335<\/td><\/tr><tr><td>1<\/td><td>(500, 0)<\/td><td>415<\/td><td>335<\/td><\/tr><tr><td>2<\/td><td>(130, 400)<\/td><td>119<\/td><td>15<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>ends 2<\/code> means one contour with points 0 to 2. The lines are 0 → 1, 1 → 2 and the closing line 2 → 0. Point 2 is <code>off<\/code>, but here you join it with straight lines like the others. Then each point gets a 9 x 9 square: point 2's covers columns 115 to 123 and rows 11 to 19.<\/p>"},{"label":"Example 2","name":"the hyphen","test":"08-R1-hyphen","input":"canvas 352 148\nplace -124 404 1\nstyle 3 10\ncolor 255 255 255\noutline\nends 3\npoints 140 272 on 140 388 on 460 388 on 460 272 on","output":"a 352 x 148 PNG: a 320 x 116 rectangle outline from (16, 16) to (336, 132)","image":null,"explain":"<p><code>x0<\/code> is negative here: font x = 140 lands on pixel 140 - 124 = 16. The hyphen's bottom edge (y = 272) lands on row 404 - 272 = 132 and its top edge (y = 388) on row 16, which puts the top edge higher in the picture.<\/p>"},{"label":"Example 3","name":"two outlines","test":"08-R5-two","input":"canvas 470 300\nplace 0 260 0.35\nstyle 2 7\ncolor 255 220 0\noutline\nends 7 16\npoints 35 0 on 219 730 on 380 730 on 565 0 on 437 0 on 397 177 on 203 177 on 163 0 on 226 279 on 374 279 on 330 475 on 319 524 off 303 603 off 300 621 on 297 603 off 281 524 off 270 476 on\nplace 230 280 0.3\nstyle 3 9\ncolor 0 220 220\noutline\nends 17 26 35\npoints 77 0 on 77 730 on 301 730 on 406 730 off 531 628 off 531 542 on 531 482 off 462 396 off 407 387 on 407 385 on 448 380 off 512 331 off 548 254 off 548 208 on 548 145 off 490 51 off 384 0 off 312 0 on 199 429 on 299 429 on 348 429 off 406 482 off 406 528 on 406 573 off 349 626 off 299 626 on 199 626 on 199 104 on 305 104 on 360 104 off 423 163 off 423 214 on 423 265 off 360 328 off 305 328 on 199 328 on","output":"a 470 x 300 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"dat  26 and 27 to 35, each closed on its own.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Render%20outlines%20as%20straight%20lines\" target=\"_blank\" rel=\"noopener\">The blog's <code>renderGlyphOutline<\/code><\/a> takes a start position, the glyph and a colour. It walks the contours with a running start index, and at a contour's last point it sets the next point back to the contour's first point, as Hint 2 does. It draws each line with thickness 5 and puts a 20 x 20 square on the current point in the same loop. Its <code>main<\/code> draws <code>a<\/code> from JetBrains Mono Bold at (300, 300) on a 1200 x 1200 canvas; test <code>08-E2E-blog-a<\/code> is the same picture at half size.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet doesn't flip y itself. It adds the start position to the font coordinates and asks stb to turn the whole image upside down when it writes the PNG. That works for one glyph, but the start position then counts from the bottom of the picture. This page uses an explicit baseline instead, which the later assignments need when several glyphs share a line of text; the blog switches to a transform matrix (<code>setGlyphBaseline<\/code>) for the same reason in its curve section.<\/p>"}},{"id":"09","num":"9","title":"Resolve compound glyphs","difficulty":"Hard","tests":36,"problem":"problems/09-compound-glyph.md","entry":"solutions/assignments/assignment_09_compound_glyph.cpp","files":[{"path":"solutions/assignments/assignment_09_compound_glyph.cpp","role":"entry","purpose":null,"job":"On each `font` line, open the font and forget the earlier glyph locations; record each `glyph` line's offset and length by id. For each `decode` line, resolve the glyph and write the header line and one `ends` / `points` pair per part, as Output shows (fractional coordinates to at least 2 decimals).","blank":"// ======================================================================================\n// Assignment 09: Resolve compound glyphs\n// Problem: problems/09-compound-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 09 as `build/solutions/assignment_09.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 09`, or use Run and Submit in the book.\n//\n// Your job:\n//   On each `font` line, open the font and forget the earlier glyph locations; record each\n//   `glyph` line's offset and length by id. For each `decode` line, resolve the glyph and\n//   write the header line and one `ends` / `points` pair per part, as Output shows\n//   (fractional coordinates to at least 2 decimals).\n//\n// The other files of this assignment:\n//   You also write src/font/CompoundGlyph.h and src/font/CompoundGlyph.cpp in this\n//   assignment; each one gives its job at the top.\n//   Earlier files you can use: src/font/GlyphParser.h and src/font/Loca.h.\n//   Include them by their path under src/, e.g. #include \"font/CompoundGlyph.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 09: Resolve compound glyphs\n// Problem: problems/09-compound-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 09 as `build/solutions/assignment_09.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 09`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/font/CompoundGlyph.h and src/font/CompoundGlyph.cpp in this\n//   assignment; each one gives its job at the top.\n//   Earlier files you can use: src/font/GlyphParser.h and src/font/Loca.h.\n//   Include them by their path under src/, e.g. #include \"font/CompoundGlyph.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/CompoundGlyph.h\"\n\nnamespace {\n\nstd::string number(const double v) {\n  if (std::abs(v - std::round(v)) < 1e-9) return std::to_string(static_cast<long long>(std::llround(v)));\n  char buf[32];\n  std::snprintf(buf, sizeof buf, \"%.4f\", v);\n  std::string s = buf;\n  while (s.back() == '0') s.pop_back();\n  if (s.back() == '.') s.pop_back();  // 4.99999 rounds to \"5.0000\": print \"5\"\n  return s == \"-0\" ? \"0\" : s;\n}\n\nvoid write(std::ostream& out, const uint32_t id, const std::vector<GlyphComponent>& parts) {\n  out << \"glyph \" << id << \" components \" << parts.size() << '\\n';\n  for (const GlyphComponent& part : parts) {\n    out << \"ends\";\n    for (const int e : part.endPtsOfContours) out << ' ' << e;\n    out << \"\\npoints\";\n    for (const GlyphPoint& p : part.points) out << ' ' << number(p.x) << ' ' << number(p.y) << (p.onCurve ? \" on\" : \" off\");\n    out << '\\n';\n  }\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<ByteReader> font;\n    std::map<uint32_t, GlyphLocation> locations;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::make_unique<ByteReader>(path);\n        locations.clear();\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        GlyphLocation at;\n        words >> id >> at.offset >> at.length;\n        locations[id] = at;\n      } else if (keyword == \"decode\") {\n        uint32_t id = 0;\n        words >> id;\n        if (!font) throw std::runtime_error(\"a `decode` line before the `font` line\");\n        write(output, id, resolveGlyph(*font, locations, id));\n      }\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/font/CompoundGlyph.h","role":"new","purpose":"This code turns any glyph into the simple outlines you draw it with. It reads a compound glyph's components, moves, scales or rotates each one, and resolves components nested at any depth. In assignment 18 you draw every character of a line of text through it, so your text renderer doesn't need to tell simple glyphs from compound ones.","job":"Declare a function that takes a glyph id, the font (through your `ByteReader`) and where every glyph's record is (offset and length, like the locations from your `Loca.h`), and returns a list of outlines in the form from `GlyphComponent.h`, one per simple part.","blank":"#pragma once\n// ======================================================================================\n// Assignment 09: Resolve compound glyphs\n// Problem: problems/09-compound-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This code turns any glyph into the simple outlines you draw it with. It reads a\n//   compound glyph's components, moves, scales or rotates each one, and resolves\n//   components nested at any depth. In assignment 18 you draw every character of a line of\n//   text through it, so your text renderer doesn't need to tell simple glyphs from\n//   compound ones.\n//\n// Your job:\n//   Declare a function that takes a glyph id, the font (through your `ByteReader`) and\n//   where every glyph's record is (offset and length, like the locations from your\n//   `Loca.h`), and returns a list of outlines in the form from `GlyphComponent.h`, one per\n//   simple part.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 09: Resolve compound glyphs\n// Problem: problems/09-compound-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This code turns any glyph into the simple outlines you draw it with. It reads a\n//   compound glyph's components, moves, scales or rotates each one, and resolves\n//   components nested at any depth. In assignment 18 you draw every character of a line of\n//   text through it, so your text renderer doesn't need to tell simple glyphs from\n//   compound ones.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <map>\n#include <vector>\n\n#include \"GlyphComponent.h\"\n#include \"font/ByteReader.h\"\n#include \"font/Loca.h\"\n\n// The simple glyphs `glyphId` is drawn with, every point in the glyph's own coordinates\n// (font units). A simple glyph gives itself; an empty one gives nothing.\nstd::vector<GlyphComponent> resolveGlyph(ByteReader& reader, const std::map<uint32_t, GlyphLocation>& locations,\n                                         uint32_t glyphId);\n"},{"path":"solutions/src/font/CompoundGlyph.cpp","role":"new","purpose":"This code turns any glyph into the simple outlines you draw it with. It reads a compound glyph's components, moves, scales or rotates each one, and resolves components nested at any depth. In assignment 18 you draw every character of a line of text through it, so your text renderer doesn't need to tell simple glyphs from compound ones.","job":"Implement the glyph resolver as \"The compound glyph record\" and \"Placing a component\" describe. An empty glyph gives no parts, and a simple glyph gives itself, decoded by your `GlyphParser` from assignment 07. For a compound glyph, read all of its component records first, then resolve each component in record order: apply its own transform first and the outer ones after.","blank":"// ======================================================================================\n// Assignment 09: Resolve compound glyphs\n// Problem: problems/09-compound-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This code turns any glyph into the simple outlines you draw it with. It reads a\n//   compound glyph's components, moves, scales or rotates each one, and resolves\n//   components nested at any depth. In assignment 18 you draw every character of a line of\n//   text through it, so your text renderer doesn't need to tell simple glyphs from\n//   compound ones.\n//\n// Your job:\n//   Implement the glyph resolver as \"The compound glyph record\" and \"Placing a component\"\n//   describe. An empty glyph gives no parts, and a simple glyph gives itself, decoded by\n//   your `GlyphParser` from assignment 07. For a compound glyph, read all of its component\n//   records first, then resolve each component in record order: apply its own transform\n//   first and the outer ones after.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 09: Resolve compound glyphs\n// Problem: problems/09-compound-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This code turns any glyph into the simple outlines you draw it with. It reads a\n//   compound glyph's components, moves, scales or rotates each one, and resolves\n//   components nested at any depth. In assignment 18 you draw every character of a line of\n//   text through it, so your text renderer doesn't need to tell simple glyphs from\n//   compound ones.\n//\n// Your job:\n//   Implement the glyph resolver as \"The compound glyph record\" and \"Placing a component\"\n//   describe. An empty glyph gives no parts, and a simple glyph gives itself, decoded by\n//   your `GlyphParser` from assignment 07. For a compound glyph, read all of its component\n//   records first, then resolve each component in record order: apply its own transform\n//   first and the outer ones after. The Boilerplate gives you the declarations; fill in\n//   each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/CompoundGlyph.h\"\n\n#include <stdexcept>\n\n#include \"font/GlyphParser.h\"\n\nstd::vector<GlyphComponent> resolveGlyph(ByteReader& reader, const std::map<uint32_t, GlyphLocation>& locations,\n                                         const uint32_t glyphId) {\n  // TODO: read the component records and apply their transforms, recursively (see the problem\n  // page). readGlyph (assignment 07) decodes the simple glyphs they end in.\n  throw std::logic_error(\"not implemented: resolveGlyph\");\n}\n"}],"buildsOn":[{"path":"solutions/src/font/GlyphParser.h","owner":"07","purpose":"The parser decodes one glyph record from the glyf table into the types in `Glyph.h`: the header of any glyph, and the contours and points of a simple one. In assignment 09 you call it for every simple glyph inside a compound glyph."},{"path":"solutions/src/font/Loca.h","owner":"04","purpose":"This header declares your reader for the `loca` table, which gives the position and size in bytes of each glyph's record, by glyph id. Assignment 09 uses it to find the parts of a compound glyph, and assignment 18 to find the glyph of every character."}],"indent":2,"tags":[{"label":"Language","items":["recursion","affine transforms as six numbers","signed bytes (<code>int8<\/code>)","fixed-point numbers"],"text":["recursion","affine transforms as six numbers","signed bytes (int8)","fixed-point numbers"]},{"label":"Library","items":["<code>std::ifstream<\/code> (binary)","<code>std::map<\/code>","<code>std::vector<\/code>"],"text":["std::ifstream (binary)","std::map","std::vector"]},{"label":"Concepts","items":["compound glyphs","component records","F2Dot14","composing transforms","depth-first traversal"],"text":["compound glyphs","component records","F2Dot14","composing transforms","depth-first traversal"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that takes a glyph, simple or compound, and prints the outlines of the simple glyphs that make it up, each moved to its final position.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains three kinds of lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file the following lines refer to (relative to the workbook folder). Starts a new font: forget earlier <code>glyph<\/code> lines.<\/td><\/tr><tr><td><code>glyph &lt;id&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>Where glyph <code>id<\/code>'s record is in the file and how long it is (0 = no outline), as your <code>Loca<\/code> from assignment 04 works out. The input lists every glyph you will need.<\/td><\/tr><tr><td><code>decode &lt;id&gt;<\/code><\/td><td>Resolve glyph <code>id<\/code> and write it out.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each <code>decode<\/code> line, write a header line and then one <code>ends<\/code> / <code>points<\/code> pair per simple glyph inside the glyph:<\/p>\n<pre><code>glyph &lt;id&gt; components &lt;k&gt;\nends &lt;...&gt;\npoints &lt;x0&gt; &lt;y0&gt; &lt;on|off&gt; &lt;x1&gt; &lt;y1&gt; &lt;on|off&gt; ...\n... (k pairs)<\/code><\/pre>\n<ul><li>An empty glyph (length 0) gives <code>components 0<\/code>. A simple glyph gives <code>components 1<\/code> with its own outline.<\/li><li>Components appear in <strong>depth-first order<\/strong>: the order of the component records, and inside a nested compound glyph, its components in their order before moving on. A component that is an empty glyph adds nothing and isn't counted.<\/li><li><code>ends<\/code> and <code>on|off<\/code> are the simple glyph's own values, as in assignment 07.<\/li><li>Print coordinates after every transform that applies, so they can be fractional: one of the random tests expects <code>points 338.5 -275.25 on 324.4375 -266.8125 off ...<\/code>.<\/li><li>The checker accepts a difference of up to 0.01 per number, so the exact value or anything rounded to two or more decimals passes. The boilerplate's <code>number()<\/code> prints whole numbers without a decimal point and others rounded to 4 decimals with trailing zeros dropped (<code>47.5<\/code>, <code>374.9062<\/code>).<\/li><\/ul>\n<h3>The compound glyph record<\/h3>\n<p>The 10-byte header is the same as for simple glyphs: <code>numberOfContours<\/code> (int16, negative for a compound glyph) and the bounding box (4 x int16, you can ignore it).<\/p>\n<p><strong>Component records<\/strong> follow, one per component, one after another, until one has MORE_COMPONENTS clear:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>flags<\/code><\/td><td>uint16<\/td><td>See the table below<\/td><\/tr><tr><td><code>glyphIndex<\/code><\/td><td>uint16<\/td><td>The component glyph<\/td><\/tr><tr><td><code>argument1<\/code>, <code>argument2<\/code><\/td><td>int16 each if ARG_1_AND_2_ARE_WORDS is set, otherwise int8 each<\/td><td>The offset (e, f)<\/td><\/tr><tr><td>transform<\/td><td>F2Dot14 x 0, 1, 2 or 4<\/td><td>Depends on the scale flags<\/td><\/tr><\/tbody><\/table><\/div>\n<p>All numbers are big-endian. <strong>F2Dot14<\/strong> is a signed 16-bit number divided by 16384 (your <code>ByteReader<\/code> from assignment 01 reads it), so <code>40 00<\/code> is 1.0 and <code>c0 00<\/code> is -1.0.<\/p>\n<p><strong>The arguments are signed<\/strong>: the byte <code>e2<\/code> is -30, not 226.<\/p>\n<p><strong>Component flags<\/strong> (bits not listed don't affect the output):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bit<\/th><th>Mask<\/th><th>Name<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>0x0001<\/code><\/td><td>ARG_1_AND_2_ARE_WORDS<\/td><td>The two arguments are int16; otherwise int8<\/td><\/tr><tr><td>1<\/td><td><code>0x0002<\/code><\/td><td>ARGS_ARE_XY_VALUES<\/td><td>The arguments are an x/y offset. Every test sets it<\/td><\/tr><tr><td>3<\/td><td><code>0x0008<\/code><\/td><td>WE_HAVE_A_SCALE<\/td><td>One F2Dot14 follows: a = d = scale<\/td><\/tr><tr><td>5<\/td><td><code>0x0020<\/code><\/td><td>MORE_COMPONENTS<\/td><td>Another component record follows this one<\/td><\/tr><tr><td>6<\/td><td><code>0x0040<\/code><\/td><td>WE_HAVE_AN_X_AND_Y_SCALE<\/td><td>Two F2Dot14 follow: a, then d<\/td><\/tr><tr><td>7<\/td><td><code>0x0080<\/code><\/td><td>WE_HAVE_A_TWO_BY_TWO<\/td><td>Four F2Dot14 follow: a, b, c, d<\/td><\/tr><tr><td>8<\/td><td><code>0x0100<\/code><\/td><td>WE_HAVE_INSTRUCTIONS<\/td><td>Hinting instructions follow the last component; ignore them<\/td><\/tr><tr><td>11<\/td><td><code>0x0800<\/code><\/td><td>SCALED_COMPONENT_OFFSET<\/td><td>a, b, c, d transform the offset too (see below)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>At most one of bits 3, 6 and 7 is set. With none of them, a = d = 1 and b = c = 0.<\/p>\n<h3>Placing a component<\/h3>\n<p>Every point (x, y) of the component becomes<\/p>\n<pre><code>x&#x27; = a*x + c*y + e\ny&#x27; = b*x + d*y + f<\/code><\/pre>\n<p>where a, b, c, d are the <strong>2 x 2 part<\/strong> set by the scale flags (it scales, flips or rotates) and (e, f) is the <strong>offset<\/strong>, (argument1, argument2). If SCALED_COMPONENT_OFFSET is set, the offset goes through the 2 x 2 part first: e = a*argument1 + c*argument2 and f = b*argument1 + d*argument2.<\/p>\n<p>A component can itself be a compound glyph. In that case you place its own components with their own transforms first, then place the result with the outer transform, so transforms compose <strong>from the inside out<\/strong>.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>An empty glyph gives <code>components 0<\/code>; a simple glyph gives <code>components 1<\/code> and its outline.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Your program reads the component records: flags, glyph index, signed 1-byte or 2-byte arguments, and the loop over MORE_COMPONENTS.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The three scale forms: one scale, separate x and y scales, and the full 2 x 2 matrix.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Every point goes through x' = a*x + c*y + e and y' = b*x + d*y + f.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>With SCALED_COMPONENT_OFFSET, a, b, c, d transform the offset too.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Nested compound glyphs: inner transforms apply first, then outer ones.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Components come out depth first, in record order, and empty components add nothing.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Records are well-formed, every glyph you need has a <code>glyph<\/code> line, and compound glyphs nest at most 3 levels deep. Point-matched components (ARGS_ARE_XY_VALUES clear) don't occur.<\/li><li>Scales are within the F2Dot14 range, from -2 up to 32767/16384 (a little under 2).<\/li><li>Each case has a 10-second limit.<\/li><li>There are 36 tests: hand-made glyphs for each rule in a small test font, accented letters from JetBrains Mono Bold such as <code>é<\/code> and <code>Ü<\/code>, and 6 random compound glyphs (new ones with <code>-Fresh<\/code>).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/font/CompoundGlyph.h","text":"#pragma once\n// Assignment 09: compound glyphs, made of other glyphs that are moved, scaled or rotated.\n\n#include <cstdint>\n#include <map>\n#include <vector>\n\n#include \"GlyphComponent.h\"\n#include \"font/ByteReader.h\"\n#include \"font/Loca.h\"\n\n// The simple glyphs `glyphId` is drawn with, every point in the glyph's own coordinates\n// (font units). A simple glyph gives itself; an empty one gives nothing.\nstd::vector<GlyphComponent> resolveGlyph(ByteReader& reader, const std::map<uint32_t, GlyphLocation>& locations,\n                                         uint32_t glyphId);\n"},{"path":"src/font/CompoundGlyph.cpp","text":"#include \"font/CompoundGlyph.h\"\n\n#include <stdexcept>\n#include <string>\n\n#include \"font/GlyphParser.h\"\n\nnamespace {\n\nconstexpr uint16_t ARG_1_AND_2_ARE_WORDS = 0x0001;\nconstexpr uint16_t ARGS_ARE_XY_VALUES = 0x0002;\nconstexpr uint16_t WE_HAVE_A_SCALE = 0x0008;\nconstexpr uint16_t MORE_COMPONENTS = 0x0020;\nconstexpr uint16_t WE_HAVE_AN_X_AND_Y_SCALE = 0x0040;\nconstexpr uint16_t WE_HAVE_A_TWO_BY_TWO = 0x0080;\nconstexpr uint16_t SCALED_COMPONENT_OFFSET = 0x0800;\n\n// x' = a*x + c*y + e, y' = b*x + d*y + f\nstruct Affine {\n  double a = 1, b = 0, c = 0, d = 1, e = 0, f = 0;\n\n  // This transform applied after `inner`.\n  [[nodiscard]] Affine after(const Affine& inner) const {\n    return {a * inner.a + c * inner.b, b * inner.a + d * inner.b,\n            a * inner.c + c * inner.d, b * inner.c + d * inner.d,\n            a * inner.e + c * inner.f + e, b * inner.e + d * inner.f + f};\n  }\n};\n\nstruct Component {\n  uint32_t glyphId = 0;\n  Affine transform;\n};\n\nclass Resolver {\n public:\n  Resolver(ByteReader& reader, const std::map<uint32_t, GlyphLocation>& locations)\n      : reader_(reader), locations_(locations) {}\n\n  void resolve(const uint32_t glyphId, const Affine& toGlyph, const int depth, std::vector<GlyphComponent>& out) {\n    if (depth > 16) throw std::runtime_error(\"compound glyphs nested too deeply\");\n    const auto it = locations_.find(glyphId);\n    if (it == locations_.end()) throw std::runtime_error(\"no location for glyph \" + std::to_string(glyphId));\n    const Glyph glyph = readGlyph(reader_, it->second.offset, it->second.length);\n    if (glyph.kind == Glyph::Kind::Empty) return;  // nothing to draw\n\n    if (glyph.kind == Glyph::Kind::Simple) {\n      GlyphComponent outline = glyph.components.front();\n      if (outline.points.empty()) return;\n      for (GlyphPoint& p : outline.points) {\n        const double x = p.x, y = p.y;\n        p.x = toGlyph.a * x + toGlyph.c * y + toGlyph.e;\n        p.y = toGlyph.b * x + toGlyph.d * y + toGlyph.f;\n      }\n      out.push_back(std::move(outline));\n      return;\n    }\n\n    // Read every component record first: resolving one moves the reader elsewhere.\n    reader_.jumpTo(it->second.offset + 10);  // after numberOfContours and the bounding box\n    std::vector<Component> components;\n    uint16_t flags = 0;\n    do {\n      flags = reader_.readUint16();\n      Component comp;\n      comp.glyphId = reader_.readUint16();\n      int arg1 = 0, arg2 = 0;\n      if (flags & ARG_1_AND_2_ARE_WORDS) {\n        arg1 = reader_.readInt16();\n        arg2 = reader_.readInt16();\n      } else {\n        arg1 = reader_.readInt8();\n        arg2 = reader_.readInt8();\n      }\n      if (!(flags & ARGS_ARE_XY_VALUES)) throw std::runtime_error(\"point-matched components aren't supported\");\n\n      Affine& t = comp.transform;\n      if (flags & WE_HAVE_A_SCALE) {\n        t.a = t.d = reader_.readF2Dot14();\n      } else if (flags & WE_HAVE_AN_X_AND_Y_SCALE) {\n        t.a = reader_.readF2Dot14();\n        t.d = reader_.readF2Dot14();\n      } else if (flags & WE_HAVE_A_TWO_BY_TWO) {\n        t.a = reader_.readF2Dot14();\n        t.b = reader_.readF2Dot14();\n        t.c = reader_.readF2Dot14();\n        t.d = reader_.readF2Dot14();\n      }\n      t.e = arg1;\n      t.f = arg2;\n      if (flags & SCALED_COMPONENT_OFFSET) {  // the offset goes through the 2x2 part too\n        t.e = t.a * arg1 + t.c * arg2;\n        t.f = t.b * arg1 + t.d * arg2;\n      }\n      components.push_back(comp);\n    } while (flags & MORE_COMPONENTS);\n\n    for (const Component& comp : components) resolve(comp.glyphId, toGlyph.after(comp.transform), depth + 1, out);\n  }\n\n private:\n  ByteReader& reader_;\n  const std::map<uint32_t, GlyphLocation>& locations_;\n};\n\n}  // namespace\n\nstd::vector<GlyphComponent> resolveGlyph(ByteReader& reader, const std::map<uint32_t, GlyphLocation>& locations,\n                                         const uint32_t glyphId) {\n  std::vector<GlyphComponent> out;\n  Resolver(reader, locations).resolve(glyphId, Affine{}, 0, out);\n  return out;\n}\n"},{"path":"assignments/assignment_09_compound_glyph.cpp","text":"// Assignment 09 (resolve compound glyphs): prints the simple parts of each glyph a test\n// input asks about. The resolving is src/font/CompoundGlyph.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/CompoundGlyph.h\"\n\nnamespace {\n\nstd::string number(const double v) {\n  if (std::abs(v - std::round(v)) < 1e-9) return std::to_string(static_cast<long long>(std::llround(v)));\n  char buf[32];\n  std::snprintf(buf, sizeof buf, \"%.4f\", v);\n  std::string s = buf;\n  while (s.back() == '0') s.pop_back();\n  if (s.back() == '.') s.pop_back();  // 4.99999 rounds to \"5.0000\": print \"5\"\n  return s == \"-0\" ? \"0\" : s;\n}\n\nvoid write(std::ostream& out, const uint32_t id, const std::vector<GlyphComponent>& parts) {\n  out << \"glyph \" << id << \" components \" << parts.size() << '\\n';\n  for (const GlyphComponent& part : parts) {\n    out << \"ends\";\n    for (const int e : part.endPtsOfContours) out << ' ' << e;\n    out << \"\\npoints\";\n    for (const GlyphPoint& p : part.points) out << ' ' << number(p.x) << ' ' << number(p.y) << (p.onCurve ? \" on\" : \" off\");\n    out << '\\n';\n  }\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<ByteReader> font;\n    std::map<uint32_t, GlyphLocation> locations;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::make_unique<ByteReader>(path);\n        locations.clear();\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        GlyphLocation at;\n        words >> id >> at.offset >> at.length;\n        locations[id] = at;\n      } else if (keyword == \"decode\") {\n        uint32_t id = 0;\n        words >> id;\n        if (!font) throw std::runtime_error(\"a `decode` line before the `font` line\");\n        write(output, id, resolveGlyph(*font, locations, id));\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/GlyphComponent.h","src/font/ByteReader.h","src/font/Loca.h","src/font/GlyphParser.h","src/font/ByteReader.cpp","src/font/Loca.cpp","src/font/FontParser.h","src/font/GlyphParser.cpp","src/Glyph.h","src/font/FontParser.cpp"],"proof":{"passed":36,"total":36,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Compound%20glyph\" target=\"_blank\" rel=\"noopener\">Compound glyph<\/a> section up to the transformation matrix. Stop at the paragraph that starts \"Implementation. As compound glyphs are nested\", before the author's code.<\/p>","readTitle":"Read in the blog first","context":"<p>Your <code>GlyphParser<\/code> from assignment 07 decodes simple glyphs and only reports compound ones. A <strong>compound glyph<\/strong> has no points of its own: it lists other glyphs, its <strong>components<\/strong>, and where to put each one. For example, <code>é<\/code> is <code>e<\/code> plus an acute accent moved above it. Here you turn any glyph into the outlines of the simple glyphs that make it up, each in its final position. The fill assignments (14, 16, 17) and the text renderer (18) draw those outlines.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6glyf.html\" target=\"_blank\" rel=\"noopener\">'glyf' table<\/a>: compound glyph flags and the transformation<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf#composite-glyph-description\" target=\"_blank\" rel=\"noopener\">glyf: composite glyph description<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Compound%20glyph\" target=\"_blank\" rel=\"noopener\">Compound glyph<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 09                         run every test\n.\\check 09 -Case 09-R6-nested      one test, showing its input, the expected output and yours\n.\\check 09 -Fresh                  new random compound glyphs (new seed)\n.\\check 09 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  Component records: flags, glyph id, signed 1- or 2-byte arguments... .    3 / 4   FAILED\n      x 09-R2-neg-bytes  neg_bytes: offset (-30, -5) stored as two signed bytes\n          points[0]: expected (x=-30, y=-5, curve=on), got (x=226, y=251, curve=on) - differs in x, y\n          likely cause: R4 - x&#x27; = a*x + c*y + e and y&#x27; = b*x + d*y + f for every point\n          expected values from: fontTools 4.67.0\n          reproduce: build/solutions/assignment_09.exe build/cases/09/09-R2-neg-bytes.in build/cases/09/09-R2-neg-bytes.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Handle the three cases at the top: no outline (length 0), a simple glyph (numberOfContours ≥ 0), and a compound glyph. Only the last one needs new code, and it calls the same function again for each component.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Write one recursive function that takes a glyph id and the transform to apply, and appends outlines to a list. For a compound glyph, read <strong>all<\/strong> of its component records first (reading a component moves the file position elsewhere), then call the function again for each one with the combined transform. Keep a transform as six numbers a, b, c, d, e, f.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Read int8 arguments as <code>int8_t<\/code>, not <code>uint8_t<\/code>, so that <code>e2<\/code> comes out as -30.<\/li><li>After WE_HAVE_A_TWO_BY_TWO the order is a, b, c, d, and x' uses c (not b) for y.<\/li><li>Inner transforms apply first. Combining outer (A) after inner (B) gives a = A.a*B.a + A.c*B.b, b = A.b*B.a + A.d*B.b, c = A.a*B.c + A.c*B.d, d = A.b*B.c + A.d*B.d, e = A.a*B.e + A.c*B.f + A.e, f = A.b*B.e + A.d*B.f + A.f.<\/li><li>SCALED_COMPONENT_OFFSET changes only the offset, not the 2 x 2 part.<\/li><li>Skip components that are empty glyphs instead of writing an empty outline.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>resolve(id, T, out):\n    if length(id) == 0: return\n    seek(offset(id)); n = readInt16()\n    if n &gt;= 0: out.append(transform(decodeSimple(id), T)); return\n    skip(8)\n    records = []\n    do:\n        flags = readUint16(); gid = readUint16()\n        e, f = (readInt16(), readInt16()) if flags &amp; 0x1 else (readInt8(), readInt8())\n        a, b, c, d = 1, 0, 0, 1\n        if flags &amp; 0x08: a = d = readF2Dot14()\n        elif flags &amp; 0x40: a = readF2Dot14(); d = readF2Dot14()\n        elif flags &amp; 0x80: a, b, c, d = 4 x readF2Dot14()\n        if flags &amp; 0x800: e, f = a*e + c*f, b*e + d*f\n        records.append((gid, (a, b, c, d, e, f)))\n    while flags &amp; 0x20\n    for gid, L in records:\n        resolve(gid, T after L, out)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a scaled component with a scaled offset","test":"09-R5-scaled-offset","input":"font tests/09/data/compound-test.ttf\nglyph 14 800 18\nglyph 2 536 22\ndecode 14","output":"glyph 14 components 1\nends 3\npoints 20 20 on 20 70 on 70 70 on 70 20 on","image":null,"explain":"<p>Glyph 2 is a square from (0, 0) to (100, 100). Glyph 14's 18 bytes:<\/p>\n<pre><code>ff ff                       numberOfContours = -1: compound\n00 14 00 14 00 46 00 46     bounding box (ignore)\n08 0a                       flags 0x080a: ARGS_ARE_XY_VALUES, WE_HAVE_A_SCALE, SCALED_COMPONENT_OFFSET\n00 02                       glyphIndex 2\n28 28                       arguments as int8: 40, 40\n20 00                       scale 0x2000 / 16384 = 0.5<\/code><\/pre>\n<p>The scale of 0.5 halves the square, and because SCALED_COMPONENT_OFFSET is set, it also halves the offset (40, 40) to (20, 20):<\/p>"},{"label":"Example 2","name":"a rotation","test":"09-R3-rotate","input":"font tests/09/data/compound-test.ttf\nglyph 11 730 24\nglyph 2 536 22\ndecode 11","output":"glyph 11 components 1\nends 3\npoints 100 0 on 0 0 on 0 100 on 100 100 on","image":null,"explain":"<p>Glyph 11's component record is <code>00 82 | 00 02 | 64 00 | 00 00 40 00 c0 00 00 00<\/code>: flags WE_HAVE_A_TWO_BY_TWO with byte arguments, glyph 2, offset (100, 0), and a = 0, b = 1, c = -1, d = 0. That gives x' = -y + 100 and y' = x, a quarter turn:<\/p>"},{"label":"Example 3","name":"three components","test":"09-R2-three-parts","input":"font tests/09/data/compound-test.ttf\nglyph 8 662 30\nglyph 2 536 22\nglyph 3 558 20\nglyph 4 578 34\ndecode 8","output":"glyph 8 components 3\nends 3\npoints 0 0 on 0 100 on 100 100 on 100 0 on\nends 2\npoints 120 0 on 180 0 on 150 80 on\nends 3 6\npoints 0 150 on 20 210 off 60 210 off 80 150 on 30 160 on 50 160 on 40 180 on","image":null,"explain":"<p>Glyph 8 places glyph 2 (a square) at (0, 0), glyph 3 (a triangle) at (120, 0) and glyph 4 (two contours, with off-curve points) at (0, 150):<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20compound%20glyphs\" target=\"_blank\" rel=\"noopener\">The blog's compound-glyph parser<\/a> splits the work into <code>getCompoundGlyph<\/code>, which loops over the component records while MORE_COMPONENTS is set, and <code>getCompoundSubComponents<\/code>, which decodes a component and recurses for nested compound glyphs. It builds a <code>glm::mat3<\/code> for each component, saves the stream position before recursing and jumps back afterwards, and takes the glyph's metrics from a component with USE_MY_METRICS.<\/p>\n<p><strong>Things to look for:<\/strong><\/p>\n<ul><li>The snippet reads 1-byte arguments as unsigned, so a small negative offset like -30 becomes 226. JetBrains Mono has 48 such components, all in its ligature glyphs.<\/li><li>It scales the offset with Apple's older <code>m<\/code>/<code>n<\/code> rule for every component. The current specifications only scale the offset when SCALED_COMPONENT_OFFSET is set. JetBrains Mono marks its components UNSCALED_COMPONENT_OFFSET and uses no scales, so the two agree there.<\/li><li>For a nested compound glyph, <code>getCompoundSubComponents<\/code> doesn't pass its own matrix down to the inner components, so an outer offset or scale is lost. JetBrains Mono has no nested compound glyphs, but the tests do.<\/li><\/ul>"}},{"id":"10","num":"10","title":"Lerp and quadratic Bezier curves","difficulty":"Easy","tests":24,"problem":"problems/10-bezier.md","entry":"solutions/assignments/assignment_10_bezier.cpp","files":[{"path":"solutions/assignments/assignment_10_bezier.cpp","role":"entry","purpose":null,"job":"Read the input file line by line. A `lerp` line gives two points and t; a `bezier` line gives the start, the control point, the end and t. Call your lerp or curve function from `utils/Geometry.h` and write one `x y` line per input line, formatting the numbers as the Output section describes.","blank":"// ======================================================================================\n// Assignment 10: Lerp and quadratic Bezier curves\n// Problem: problems/10-bezier.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 10 as `build/solutions/assignment_10.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 10`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the input file line by line. A `lerp` line gives two points and t; a `bezier`\n//   line gives the start, the control point, the end and t. Call your
