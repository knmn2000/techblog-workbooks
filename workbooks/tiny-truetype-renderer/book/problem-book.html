ple the <code>cmap<\/code> table in checkpoint 3.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet doesn't check the scaler type or verify any checksums. Neither matters for this workbook. A stricter parser would reject files whose scaler type isn't <code>0x00010000<\/code> or <code>&#x27;true&#x27;<\/code> (an <code>&#x27;OTTO&#x27;<\/code> font stores CFF outlines instead of <code>glyf<\/code>), and could check each table's sum of uint32 words against its <code>checkSum<\/code>.<\/p>"}},{"id":"03","num":"3","title":"Map characters to glyphs (cmap format 12)","difficulty":"Medium","tests":24,"solution":"solutions/p03_cmap.cpp","problem":"problems/03-cmap.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 03 - Map characters to glyphs (cmap format 12)\n//\n// Problem:  problems/03-cmap.md (also in the web problem book)\n// Check:    .\\check 03\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p03.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p03_cmap.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 03 - Map characters to glyphs (cmap format 12)\n//\n// Problem:  problems/03-cmap.md (also in the web problem book)\n// Check:    .\\check 03\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on readCharacterMap().\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <unordered_map>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"  // optional: be::u8(file), be::u16(file), be::u32(file), ...\n\nstruct TableRecord {\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\nusing Tables = std::map<std::string, TableRecord>;  // by tag, from the input's `table` lines\n\n// Throw this when the font has no subtable this checkpoint supports.\n// The provided code catches it and writes `unsupported`.\nstruct UnsupportedCmap : std::runtime_error {\n  using std::runtime_error::runtime_error;\n};\n\n// Returns every (code point -> glyph id) pair of the font's platform 0 / encoding 4\n// subtable, which must be in format 12. tables.at(\"cmap\").offset is where cmap starts.\nstd::unordered_map<uint32_t, uint32_t> readCharacterMap(std::ifstream& font, const Tables& tables) {\n  // TODO: find the subtable, check its format, and expand every group (problem page).\n  throw NotImplemented(\"readCharacterMap\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[line.substr(open + 1, close - open - 1)] = t;\n}\n\n}  // namespace\n\n// Usage: p03 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `count` or `lookup U+XXXX`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"count\" || keyword == \"lookup\") queries.push_back(line);\n    }\n    std::ifstream font(path, std::ios::binary);\n    if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n\n    std::unordered_map<uint32_t, uint32_t> glyphFor;\n    try {\n      glyphFor = readCharacterMap(font, tables);\n    } catch (const UnsupportedCmap&) {\n      output << \"unsupported\\n\";  // the whole output is this one line\n      return 0;\n    }\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword, codePoint;\n      words >> keyword >> codePoint;\n      if (keyword == \"count\") {\n        output << \"count \" << glyphFor.size() << '\\n';\n      } else {\n        const auto found = glyphFor.find(std::stoul(codePoint.substr(2), nullptr, 16));  // skip \"U+\"\n        output << \"lookup \" << codePoint << ' ';\n        if (found == glyphFor.end()) output << \"none\\n\";\n        else output << found->second << '\\n';\n      }\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["32-bit unsigned integers","hexadecimal","nested loops","exceptions"],"text":["32-bit unsigned integers","hexadecimal","nested loops","exceptions"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>seekg<\/code>)","<code>std::unordered_map<\/code> (or <code>std::map<\/code>, or a sorted <code>std::vector<\/code> with binary search)"],"text":["std::ifstream in binary mode (seekg)","std::unordered_map (or std::map, or a sorted std::vector with binary search)"]},{"label":"Concepts","items":["Unicode code points (U+XXXX) beyond the BMP","glyph ids","the <code>cmap<\/code> table","encoding records","format 12 range groups","big-endian byte order"],"text":["Unicode code points (U+XXXX) beyond the BMP","glyph ids","the cmap table","encoding records","format 12 range groups","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font's Unicode character map (the platform 0 / encoding 4 subtable, in format 12) and answers questions about it: how many characters it maps, and which glyph a given character maps to.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p03_cmap.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p03_cmap.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>readCharacterMap()<\/code>, which returns every (code point → glyph id) pair.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these lines, in this order:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>table &quot;cmap&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>The <code>cmap<\/code> table's record from the table directory, written as checkpoint 2 writes it. You only need <code>offset<\/code>: where <code>cmap<\/code> starts, in bytes from the start of the file.<\/td><\/tr><tr><td><code>count<\/code><\/td><td>A question: how many code points does the subtable map?<\/td><\/tr><tr><td><code>lookup U+&lt;hex&gt;<\/code><\/td><td>A question: which glyph does this code point map to? The code point is in hexadecimal, uppercase, with 4 to 6 digits (<code>U+0041<\/code>, <code>U+1F600<\/code>, <code>U+10FFFD<\/code>).<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There are one or more <code>count<\/code> and <code>lookup<\/code> lines, in any mix.<\/p>\n<h3>Output<\/h3>\n<p>If the font has no platform 0 / encoding 4 subtable in format 12 (see below), write the single line <code>unsupported<\/code> and nothing else.<\/p>\n<p>Otherwise write one line per question, in input order:<\/p>\n<ul><li><code>count<\/code> → <code>count &lt;n&gt;<\/code>, the number of code points the subtable maps<\/li><li><code>lookup U+&lt;hex&gt;<\/code> → <code>lookup U+&lt;hex&gt; &lt;glyphId&gt;<\/code>, or <code>lookup U+&lt;hex&gt; none<\/code> if no group covers the code point. Write the code point exactly as it appears in the input.<\/li><\/ul>\n<h3>The <code>cmap<\/code> table<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>. Every offset in <code>cmap<\/code> is counted from the start of the <code>cmap<\/code> table, not from the start of the file.<\/p>\n<p><strong>Header<\/strong>, 4 bytes, at the table's offset:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>version<\/code><\/td><td>uint16<\/td><td>0. Skip it.<\/td><\/tr><tr><td><code>numberSubtables<\/code><\/td><td>uint16<\/td><td>How many encoding records follow<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Encoding records<\/strong>: <code>numberSubtables<\/code> of them, 8 bytes each, right after the header:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>platformID<\/code><\/td><td>uint16<\/td><td>0 = Unicode, 1 = Macintosh, 3 = Windows<\/td><\/tr><tr><td><code>encodingID<\/code><\/td><td>uint16<\/td><td>Meaning depends on the platform. For platform 0: 3 = Unicode, BMP only; 4 = Unicode, full repertoire; 5 = variation sequences<\/td><\/tr><tr><td><code>offset<\/code><\/td><td>uint32<\/td><td>Where this record's subtable starts, from the start of <code>cmap<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Which subtable.<\/strong> Use the subtable of the record with <code>platformID<\/code> 0 and <code>encodingID<\/code> 4, wherever it is in the list. Ignore every other record, even one that points to a format 12 subtable. If there is no such record, the answer is <code>unsupported<\/code>.<\/p>\n<p>Every subtable starts with a uint16 <code>format<\/code>. If the (0, 4) subtable's format isn't 12, the answer is also <code>unsupported<\/code>. (Fonts also use format 4 for BMP-only maps, format 13 for \"many codes, one glyph\" maps, and format 14 for variation sequences. This checkpoint reads only format 12.)<\/p>\n<p><strong>Format 12 subtable<\/strong> (\"segmented coverage\"):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>format<\/code><\/td><td>uint16<\/td><td>12<\/td><\/tr><tr><td><code>reserved<\/code><\/td><td>uint16<\/td><td>0. Skip it.<\/td><\/tr><tr><td><code>length<\/code><\/td><td>uint32<\/td><td>Length of the subtable in bytes, header included. Skip it.<\/td><\/tr><tr><td><code>language<\/code><\/td><td>uint32<\/td><td>0 for Unicode subtables. Skip it.<\/td><\/tr><tr><td><code>numGroups<\/code><\/td><td>uint32<\/td><td>How many groups follow<\/td><\/tr><tr><td><code>groups[numGroups]<\/code><\/td><td>12 bytes each<\/td><td>See below<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>One group<\/strong>, 12 bytes:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>startCharCode<\/code><\/td><td>uint32<\/td><td>First code point in the group<\/td><\/tr><tr><td><code>endCharCode<\/code><\/td><td>uint32<\/td><td>Last code point in the group, <strong>included<\/strong><\/td><\/tr><tr><td><code>startGlyphID<\/code><\/td><td>uint32<\/td><td>Glyph id of <code>startCharCode<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>A code point c with <code>startCharCode<\/code> ≤ c ≤ <code>endCharCode<\/code> maps to glyph <code>startGlyphID<\/code> + (c − <code>startCharCode<\/code>). A group of one code point has <code>startCharCode<\/code> = <code>endCharCode<\/code>. Groups are sorted and never overlap, so the subtable maps Σ (<code>endCharCode<\/code> − <code>startCharCode<\/code> + 1) code points in total.<\/p>\n<p>Code points go up to U+10FFFF, so they need 32 bits. Format 12 exists for exactly that reason: format 4 stores 16-bit codes and can't reach emoji, rare CJK characters or the Nerd Font icons in JetBrains Mono.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The subtable is the one whose record has platform 0 and encoding 4, wherever that record is in the list. Other subtables, even format 12 ones with different mappings, are ignored.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Each group maps every code point from <code>startCharCode<\/code> to <code>endCharCode<\/code>, both included, to consecutive glyph ids starting at <code>startGlyphID<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Code points above U+FFFF work like any other: they are 32-bit numbers.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A code point that no group covers gives <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>count<\/code> is the number of code points the subtable maps.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>If there is no (0, 4) record, or its subtable isn't format 12, the whole output is the single line <code>unsupported<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>The tests' subtables map up to about 17,000 code points, in up to about 5,500 groups. Every group has <code>startCharCode<\/code> ≤ <code>endCharCode<\/code> ≤ U+10FFFF.<\/li><li>Groups are sorted by <code>startCharCode<\/code> and don't overlap. There is at most one (0, 4) record.<\/li><li>Each input has at most 100 questions.<\/li><li>Each case has a 10-second limit. A correct solution takes well under a second.<\/li><li>There are 24 tests: both real fonts (ASCII, Latin-1, Nerd Font icons above U+F0000, kanji and kana, CJK characters above U+FFFF, unmapped code points, counts), small fonts built with fontTools (decoy subtables, (0, 4) listed last, long runs, one-code groups, emoji-range codes, gaps, and four kinds of unsupported <code>cmap<\/code>: no (0, 4) record at all, a (0, 4) record pointing to a format 4 or a format 13 subtable, and a format 12 subtable listed only under (3, 10)), and random character maps.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p03_cmap.cpp","text":"// Reference solution - checkpoint 03 (map characters to glyphs, cmap format 12).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <unordered_map>\n#include <vector>\n\n#include \"provided/BigEndian.h\"\n\nstruct TableRecord {\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\nusing Tables = std::map<std::string, TableRecord>;  // by tag, from the input's `table` lines\n\nstruct UnsupportedCmap : std::runtime_error {\n  using std::runtime_error::runtime_error;\n};\n\nstd::unordered_map<uint32_t, uint32_t> readCharacterMap(std::ifstream& font, const Tables& tables) {\n  const uint32_t cmap = tables.at(\"cmap\").offset;\n  font.seekg(cmap);\n  be::u16(font);  // version\n  const uint16_t numberSubtables = be::u16(font);\n\n  std::optional<uint32_t> subtable;  // offset from the start of cmap\n  for (uint16_t i = 0; i < numberSubtables; ++i) {\n    const uint16_t platformID = be::u16(font);\n    const uint16_t encodingID = be::u16(font);\n    const uint32_t offset = be::u32(font);\n    if (platformID == 0 && encodingID == 4 && !subtable) subtable = offset;\n  }\n  if (!subtable) throw UnsupportedCmap(\"no platform 0 / encoding 4 subtable\");\n\n  font.seekg(cmap + *subtable);\n  if (be::u16(font) != 12) throw UnsupportedCmap(\"the (0, 4) subtable is not format 12\");\n  font.seekg(10, std::ios::cur);  // reserved (uint16), length (uint32), language (uint32)\n  const uint32_t nGroups = be::u32(font);\n\n  std::unordered_map<uint32_t, uint32_t> glyphFor;\n  for (uint32_t g = 0; g < nGroups; ++g) {\n    const uint32_t startCharCode = be::u32(font);\n    const uint32_t endCharCode = be::u32(font);\n    const uint32_t startGlyphID = be::u32(font);\n    for (uint64_t c = startCharCode; c <= endCharCode; ++c)  // both ends included\n      glyphFor[static_cast<uint32_t>(c)] = startGlyphID + static_cast<uint32_t>(c - startCharCode);\n  }\n  return glyphFor;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[line.substr(open + 1, close - open - 1)] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `count` or `lookup U+XXXX`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"count\" || keyword == \"lookup\") queries.push_back(line);\n    }\n    std::ifstream font(path, std::ios::binary);\n    if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n\n    std::unordered_map<uint32_t, uint32_t> glyphFor;\n    try {\n      glyphFor = readCharacterMap(font, tables);\n    } catch (const UnsupportedCmap&) {\n      output << \"unsupported\\n\";\n      return 0;\n    }\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword, codePoint;\n      words >> keyword >> codePoint;\n      if (keyword == \"count\") {\n        output << \"count \" << glyphFor.size() << '\\n';\n      } else {\n        const auto found = glyphFor.find(std::stoul(codePoint.substr(2), nullptr, 16));  // skip \"U+\"\n        output << \"lookup \" << codePoint << ' ';\n        if (found == glyphFor.end()) output << \"none\\n\";\n        else output << found->second << '\\n';\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":24,"total":24,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=cmap%20table\" target=\"_blank\" rel=\"noopener\">cmap table<\/a> section up to the paragraph that starts \"In the implementation, simply loop\". The author's code comes right after it.<\/p>","context":"<p>Text arrives as characters, but a font stores glyphs, numbered 0, 1, 2, ... The <code>cmap<\/code> table turns a character's code point into a glyph id. Checkpoint 4 then turns the glyph id into the byte offset of the glyph's outline, and checkpoint 7 decodes the outline there.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6cmap.html\" target=\"_blank\" rel=\"noopener\">'cmap' table<\/a> (the header, the subtable list and \"Format 12\")<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/cmap\" target=\"_blank\" rel=\"noopener\">cmap: Character to Glyph Index Mapping Table<\/a> (platform and encoding IDs, \"Format 12: Segmented coverage\", \"Format 13: Many-to-one range mappings\")<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=cmap%20table\" target=\"_blank\" rel=\"noopener\">cmap table<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 03                         run every test\n.\\check 03 -Case 03-R4-gaps        one test, showing its full input, expected output and your output\n.\\check 03 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 03 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  Every group maps startCharCode..endCharCode (both included) ..........    1 / 4   FAILED\n      x 03-R2-long-runs  two long groups: U+0100-U+04FF (1024 codes) and U+3041-U+3096\n          line 5: expected `lookup U+04FF 1024`, got `lookup U+04FF none`\n          likely cause: R2 - Every group maps startCharCode..endCharCode (both included)\n          expected values from: fontTools 4.67.0 cmap.getcmap(0, 4) and getGlyphID, cross-checked against a struct parse\n          reproduce: build/p03.exe build/cases/03/03-R2-long-runs.in build/cases/03/03-R2-long-runs.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>It's three hops: the <code>cmap<\/code> header, the right encoding record, then the subtable and its groups. Remember that the offset in an encoding record is counted from the start of <code>cmap<\/code>, so the subtable is at (<code>cmap<\/code> offset + record offset) in the file.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Read every encoding record and remember the offset of the one with platform 0 and encoding<\/p>\n<ol><li>Jump to it and read the format; if there is no such record or the format isn't 12, throw <code>UnsupportedCmap<\/code>. Otherwise skip the 10 bytes of <code>reserved<\/code>, <code>length<\/code> and <code>language<\/code>, read <code>numGroups<\/code>, and for each group put every code point from start to end into a hash map with its glyph id. <code>count<\/code> is then the size of the map.<\/li><\/ol>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>The (0, 4) record is usually not the first. JetBrains Mono lists (0, 3) first, and that one is format 4.<\/li><li>Don't take \"any format 12 subtable\". The (3, 10) subtable often holds the same mappings, but nothing guarantees it, and two tests contain decoys with different mappings.<\/li><li><code>endCharCode<\/code> is included: loop with <code>&lt;=<\/code>, not <code>&lt;<\/code>.<\/li><li>Keep code points in 32-bit (or wider) variables everywhere. A <code>uint16_t<\/code> key turns U+1F600 into U+F600. If your loop counter has the same type as <code>endCharCode<\/code>, <code>c &lt;= end<\/code> can never become false when end is the largest value of that type; a 64-bit counter avoids that.<\/li><li>Format 13 looks exactly like format 12. Check the format number.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>cmap = tables[&quot;cmap&quot;].offset\nseek(cmap); skip(2)                        # version\nn = readUint16()\nsubtable = none\nrepeat n times:\n    platform = readUint16(); encoding = readUint16(); offset = readUint32()\n    if platform == 0 and encoding == 4 and subtable is none: subtable = offset\nif subtable is none: throw Unsupported\nseek(cmap + subtable)\nif readUint16() != 12: throw Unsupported\nskip(10)                                   # reserved, length, language\nmap = {}\nrepeat readUint32() times:                 # numGroups\n    start = readUint32(); end = readUint32(); glyph = readUint32()\n    for c from start to end, both included:\n        map[c] = glyph + (c - start)\nreturn map<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"two groups","test":"03-R4-gaps","input":"font tests/03/data/03-R4-gaps.ttf\ntable \"cmap\" 786752 476 52\nlookup U+002F\nlookup U+0030\nlookup U+0039\nlookup U+003A\nlookup U+0040\nlookup U+0041\nlookup U+0046\nlookup U+0047\nlookup U+0061","output":"lookup U+002F none\nlookup U+0030 1\nlookup U+0039 10\nlookup U+003A none\nlookup U+0040 none\nlookup U+0041 20\nlookup U+0046 25\nlookup U+0047 none\nlookup U+0061 none","image":null,"explain":"<p>The 52 bytes at offset 476:<\/p>\n<pre><code>00 00 00 01                  version 0, numberSubtables 1\n00 00 00 04 00 00 00 0c      platform 0, encoding 4, subtable at cmap + 12\n00 0c 00 00                  format 12, reserved\n00 00 00 28 00 00 00 00      length 40, language 0\n00 00 00 02                  numGroups 2\n00 00 00 30 00 00 00 39 00 00 00 01     U+0030..U+0039 (&#x27;0&#x27;..&#x27;9&#x27;) -&gt; glyphs 1..10\n00 00 00 41 00 00 00 46 00 00 00 14     U+0041..U+0046 (&#x27;A&#x27;..&#x27;F&#x27;) -&gt; glyphs 20..25<\/code><\/pre>\n<p>U+0039 is the last code of the first group, so it maps to 1 + (0x39 − 0x30) = 10. U+003A, one past the end, is in no group.<\/p>"},{"label":"Example 2","name":"a real font","test":"03-R1-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"cmap\" 2612855665 49020 11978\nlookup U+0041\nlookup U+0061\nlookup U+0030\nlookup U+20AC\ncount","output":"lookup U+0041 37\nlookup U+0061 69\nlookup U+0030 20\nlookup U+20AC 744\ncount 11743","image":null,"explain":"<p>JetBrains Mono's <code>cmap<\/code> has 5 encoding records: (0, 3) at <code>cmap<\/code> + 44, (0, 4) at <code>cmap<\/code> + 8728, (1, 0), (3, 1) and (3, 10). The first one is a format 4 subtable, so the program has to keep looking. The (0, 4) subtable at byte 49020 + 8728 = 57748 has 226 groups. The second group is <code>00 00 00 20 00 00 00 7e 00 00 00 04<\/code>: U+0020..U+007E → glyphs 4..98. So U+0041 maps to 4 + (0x41 − 0x20) = 4 + 33 = 37.<\/p>"},{"label":"Example 3","name":"a format 13 subtable","test":"03-R6-format13","input":"font tests/03/data/03-R6-format13.ttf\ntable \"cmap\" 1442434 412 104\ncount\nlookup U+0041\nlookup U+0042","output":"unsupported","image":null,"explain":"<p>This font's (0, 4) record points to a format 13 subtable. Format 13 has exactly the same layout as format 12, but every code in a group maps to the <em>same<\/em> glyph. Reading it as format 12 would give wrong answers, so the program must check the format.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Unicode%E2%86%92GlyphCode%20mapping\" target=\"_blank\" rel=\"noopener\">The blog's character map loader<\/a>, <code>loadUnicodeToGlyphCodeMap<\/code>, jumps to <code>cmap<\/code>, skips the version, and loops over every encoding record, keeping the offset of a platform 0 / encoding 4 record. It throws \"Not supported format\" if there is none, or if the subtable's format isn't 12. Then it skips the 10 header bytes, reads the group count, and expands every group into an <code>unordered_map<\/code> from code point to glyph id, <code>unicodeToGlyphCode<\/code>, which later steps look characters up in.<\/p>\n<p><strong>Something to look for:<\/strong> the loop doesn't stop at the first match, so if a font had two (0, 4) records the last one would win. The spec doesn't allow duplicate records (fontTools refuses to write them), so it makes no difference in practice. Expanding every group trades memory for simplicity: a font that maps most of Unicode would need over a million map entries, while keeping the sorted groups and binary-searching them stays small. Finally, many fonts that cover only the BMP have no format 12 subtable at all, just format 4 (like test <code>03-R6-format4-only<\/code>). A complete renderer would read format 4 as a fallback.<\/p>"}},{"id":"04","num":"4","title":"Locate glyph records (loca)","difficulty":"Medium","tests":18,"solution":"solutions/p04_loca.cpp","problem":"problems/04-loca.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 04 - Locate glyph records (loca)\n//\n// Problem:  problems/04-loca.md (also in the web problem book)\n// Check:    .\\check 04\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p04.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p04_loca.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 04 - Locate glyph records (loca)\n//\n// Problem:  problems/04-loca.md (also in the web problem book)\n// Check:    .\\check 04\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on readGlyphLocations().\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"  // optional: be::u16(file), be::i16(file), be::u32(file), ...\n\nstruct TableRecord {\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\nusing Tables = std::map<std::string, TableRecord>;  // by tag, from the input's `table` lines\n\nstruct GlyphLocation {\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;  // 0: the glyph has no outline\n};\n\nstruct GlyphLocations {\n  uint16_t numGlyphs = 0;             // from maxp\n  bool longFormat = false;            // from head: indexToLocFormat == 1\n  std::vector<GlyphLocation> glyphs;  // one per glyph id, numGlyphs of them\n};\n\n// Reads maxp, head and loca (tables.at(\"maxp\").offset etc.) and works out where\n// every glyph's record is inside the glyf table.\nGlyphLocations readGlyphLocations(std::ifstream& font, const Tables& tables) {\n  // TODO: see the problem page.\n  throw NotImplemented(\"readGlyphLocations\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[line.substr(open + 1, close - open - 1)] = t;\n}\n\n}  // namespace\n\n// Usage: p04 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<uint32_t> ids;  // from the `glyph <id>` lines\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        words >> path;\n      } else if (keyword == \"table\") {\n        addTable(line, tables);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        words >> id;\n        ids.push_back(id);\n      }\n    }\n    std::ifstream font(path, std::ios::binary);\n    if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n\n    const GlyphLocations loca = readGlyphLocations(font, tables);\n    output << \"glyphs \" << loca.numGlyphs << \" loca \" << (loca.longFormat ? \"long\" : \"short\") << '\\n';\n    for (const uint32_t id : ids) {\n      if (id >= loca.glyphs.size())\n        throw std::runtime_error(\"glyph \" + std::to_string(id) + \" is missing: readGlyphLocations returned \" +\n                                 std::to_string(loca.glyphs.size()) + \" glyphs\");\n      output << \"glyph \" << id << ' ' << loca.glyphs[id].offset << ' ' << loca.glyphs[id].length << '\\n';\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["unsigned arithmetic (<code>uint16_t<\/code>, <code>uint32_t<\/code>)","signed <code>int16_t<\/code>","off-by-one reasoning","<code>std::vector<\/code>"],"text":["unsigned arithmetic (uint16_t, uint32_t)","signed int16_t","off-by-one reasoning","std::vector"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>seekg<\/code>)"],"text":["std::ifstream in binary mode (seekg)"]},{"label":"Concepts","items":["glyph ids","the <code>maxp<\/code>, <code>head<\/code>, <code>loca<\/code> and <code>glyf<\/code> tables","short and long offset formats","empty glyphs","big-endian byte order"],"text":["glyph ids","the maxp, head, loca and glyf tables","short and long offset formats","empty glyphs","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font's <code>maxp<\/code>, <code>head<\/code> and <code>loca<\/code> tables and prints, for each requested glyph id, where that glyph's record is in the file and how long it is.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p04_loca.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p04_loca.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>readGlyphLocations()<\/code>, which works out the location of every glyph.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these lines, in this order:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>table &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>Four lines, for <code>glyf<\/code>, <code>head<\/code>, <code>loca<\/code> and <code>maxp<\/code>: their records from the table directory, written as checkpoint 2 writes them. <code>offset<\/code> is where the table starts in the file.<\/td><\/tr><tr><td><code>glyph &lt;id&gt;<\/code><\/td><td>A glyph id, from 0 to <code>numGlyphs<\/code> − 1. There may be none of these lines, or many.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>The first line is always<\/p>\n<pre><code>glyphs &lt;numGlyphs&gt; loca &lt;short|long&gt;<\/code><\/pre>\n<p>Then, for each <code>glyph<\/code> line, in input order:<\/p>\n<pre><code>glyph &lt;id&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/pre>\n<p><code>offset<\/code> is where the glyph's record starts, in bytes from the start of the <strong>file<\/strong>. <code>length<\/code> is the record's size in bytes. A length of 0 means the glyph has no outline (the space character, for example).<\/p>\n<p>The <code>glyph<\/code> lines are exactly checkpoint 7's input lines: put the <code>font<\/code> line in front of them and checkpoint 7 can decode the glyphs.<\/p>\n<h3>The tables you need<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>.<\/p>\n<p><strong><code>maxp<\/code><\/strong>: you need one field.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Offset in <code>maxp<\/code><\/th><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>version<\/code><\/td><td>4 bytes<\/td><td>Skip it<\/td><\/tr><tr><td>4<\/td><td><code>numGlyphs<\/code><\/td><td>uint16<\/td><td>How many glyphs the font has. Glyph ids go from 0 to <code>numGlyphs<\/code> − 1.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><code>head<\/code><\/strong>: you need one field, 50 bytes in.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Offset in <code>head<\/code><\/th><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0 to 49<\/td><td>version, revision, checksum adjustment, magic number, flags, <code>unitsPerEm<\/code>, dates, bounding box, ...<\/td><td><\/td><td>Not needed here<\/td><\/tr><tr><td>50<\/td><td><code>indexToLocFormat<\/code><\/td><td>int16<\/td><td>0: <code>loca<\/code> holds short offsets. 1: <code>loca<\/code> holds long offsets.<\/td><\/tr><tr><td>52<\/td><td><code>glyphDataFormat<\/code><\/td><td>int16<\/td><td>0. Not needed.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><code>loca<\/code><\/strong>: <code>numGlyphs<\/code> + 1 entries, one after another from the start of the table.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><code>indexToLocFormat<\/code><\/th><th>Entry type<\/th><th>The offset it stands for<\/th><\/tr><\/thead><tbody><tr><td>0 (short)<\/td><td>uint16<\/td><td>the entry × 2<\/td><\/tr><tr><td>1 (long)<\/td><td>uint32<\/td><td>the entry itself<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Short entries store half the offset, so a font whose <code>glyf<\/code> table is under 128 KB can use 2 bytes per entry. (That only works if every offset is even, which is why short-format fonts pad their glyph records to even lengths.)<\/p>\n<p>The offsets count from the start of the <strong><code>glyf<\/code> table<\/strong>. Glyph i's record runs from offset(i) up to, but not including, offset(i + 1):<\/p>\n<ul><li>absolute offset = <code>glyf<\/code> table offset + offset(i)<\/li><li>length = offset(i + 1) − offset(i)<\/li><\/ul>\n<p>That is why <code>loca<\/code> has one more entry than there are glyphs: entry <code>numGlyphs<\/code> marks where the last glyph ends. Glyphs with no outline have length 0, so they share their offset with the next glyph. The length may include a few bytes of padding at the end of the record; that's fine, because checkpoint 7 ignores them.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>numGlyphs<\/code> is the uint16 at <code>maxp<\/code> + 4.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>The format is the int16 <code>indexToLocFormat<\/code> at <code>head<\/code> + 50: 0 is <code>short<\/code>, 1 is <code>long<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>In the short format, each entry is a uint16 holding half the offset, so it is multiplied by 2. The results can be larger than 65535, so do the multiplication in 32 bits: a uint16 doubled in 16-bit arithmetic overflows.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A glyph's offset is the <code>glyf<\/code> table's offset plus its <code>loca<\/code> offset.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A glyph's length is the next <code>loca<\/code> offset minus its own. This includes the last glyph, whose end is the extra entry <code>numGlyphs<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>numGlyphs<\/code> is at most 17,936 in the tests. Every <code>glyph<\/code> id is below it.<\/li><li><code>indexToLocFormat<\/code> is always 0 or 1, and the <code>loca<\/code> entries never decrease.<\/li><li>Each input has at most 30 <code>glyph<\/code> lines.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 18 tests: both real fonts (long format, empty glyphs, first and last glyphs, random glyphs) and small fonts built with fontTools (short and long formats, a short <code>loca<\/code> whose offsets pass 65535, empty glyphs at the start, middle and end, and spare bytes after the last glyph).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p04_loca.cpp","text":"// Reference solution - checkpoint 04 (locate glyph records with loca).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"provided/BigEndian.h\"\n\nstruct TableRecord {\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\nusing Tables = std::map<std::string, TableRecord>;  // by tag, from the input's `table` lines\n\nstruct GlyphLocation {\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;  // 0: the glyph has no outline\n};\n\nstruct GlyphLocations {\n  uint16_t numGlyphs = 0;\n  bool longFormat = false;\n  std::vector<GlyphLocation> glyphs;  // one per glyph id\n};\n\nGlyphLocations readGlyphLocations(std::ifstream& font, const Tables& tables) {\n  GlyphLocations result;\n  font.seekg(tables.at(\"maxp\").offset + 4);  // after the 4-byte version\n  result.numGlyphs = be::u16(font);\n  font.seekg(tables.at(\"head\").offset + 50);\n  result.longFormat = be::i16(font) == 1;  // indexToLocFormat: 0 short, 1 long\n\n  // loca has numGlyphs + 1 entries: the last one marks where the last glyph ends.\n  font.seekg(tables.at(\"loca\").offset);\n  std::vector<uint32_t> entries(result.numGlyphs + 1u);\n  for (uint32_t& entry : entries) entry = result.longFormat ? be::u32(font) : 2u * be::u16(font);\n\n  const uint32_t glyf = tables.at(\"glyf\").offset;\n  for (std::size_t i = 0; i < result.numGlyphs; ++i)\n    result.glyphs.push_back({glyf + entries[i], entries[i + 1] - entries[i]});\n  return result;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[line.substr(open + 1, close - open - 1)] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<uint32_t> ids;  // from the `glyph <id>` lines\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        words >> path;\n      } else if (keyword == \"table\") {\n        addTable(line, tables);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        words >> id;\n        ids.push_back(id);\n      }\n    }\n    std::ifstream font(path, std::ios::binary);\n    if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n\n    const GlyphLocations loca = readGlyphLocations(font, tables);\n    output << \"glyphs \" << loca.numGlyphs << \" loca \" << (loca.longFormat ? \"long\" : \"short\") << '\\n';\n    for (const uint32_t id : ids) {\n      if (id >= loca.glyphs.size())\n        throw std::runtime_error(\"glyph \" + std::to_string(id) + \" is missing: readGlyphLocations returned \" +\n                                 std::to_string(loca.glyphs.size()) + \" glyphs\");\n      output << \"glyph \" << id << ' ' << loca.glyphs[id].offset << ' ' << loca.glyphs[id].length << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":18,"total":18,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=loca%20table\" target=\"_blank\" rel=\"noopener\">loca table<\/a> section through the paragraph that starts \"Additionally, a minor point is\". The author's code comes right after it.<\/p>","context":"<p>Checkpoint 3 turns a character into a glyph id. This checkpoint turns the glyph id into the place where the glyph's outline is stored: a byte offset and a length inside the <code>glyf<\/code> table. The <code>glyph<\/code> lines you write are exactly the input format of checkpoint 7, which decodes the outline found there.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6loca.html\" target=\"_blank\" rel=\"noopener\">'loca' table<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6head.html\" target=\"_blank\" rel=\"noopener\">'head' table<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6maxp.html\" target=\"_blank\" rel=\"noopener\">'maxp' table<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/loca\" target=\"_blank\" rel=\"noopener\">loca: Index to Location<\/a>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/head\" target=\"_blank\" rel=\"noopener\">head: Font Header Table<\/a>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/maxp\" target=\"_blank\" rel=\"noopener\">maxp: Maximum Profile<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=loca%20table\" target=\"_blank\" rel=\"noopener\">loca table<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 04                         run every test\n.\\check 04 -Case 04-R3-short-x2    one test, showing its full input, expected output and your output\n.\\check 04 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 04 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Short format: each uint16 entry is the offset / 2 ....................    0 / 2   FAILED\n      x 04-R3-short-x2  8 glyphs in a short loca: every offset is twice the stored value\n          glyph[0]: expected (id=0, offset=484, length=26), got (id=0, offset=484, length=13) - differs in length  (in `glyphs 8 loca short`)\n          likely cause: R5 - Length = next entry - this one (x2 if short); numGlyphs + 1 entries\n          expected values from: fontTools 4.67.0 maxp, head, loca and the glyf offset, cross-checked against a struct parse of loca\n          reproduce: build/p04.exe build/cases/04/04-R3-short-x2.in build/cases/04/04-R3-short-x2.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read the two numbers that tell you how to read <code>loca<\/code>: how many glyphs there are (<code>maxp<\/code>) and how big each entry is (<code>head<\/code>). Then read the whole <code>loca<\/code> table into a list of offsets. Everything else is subtraction.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Read <code>numGlyphs<\/code> + 1 entries into a vector, doubling them in the short format. Then, for each glyph i from 0 to <code>numGlyphs<\/code> − 1, its location is (<code>glyf<\/code> offset + entry[i], entry[i + 1] − entry[i]).<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Read <code>numGlyphs<\/code> + 1 entries, not <code>numGlyphs<\/code>. Without the extra one you can't tell how long the last glyph is. The <code>glyf<\/code> table's length is not a substitute: a font may have spare bytes after the last glyph.<\/li><li>In the short format, multiply by 2. Do it in a 32-bit variable: twice a uint16 can be more than 65535.<\/li><li><code>indexToLocFormat<\/code> is at <code>head<\/code> + 50. The field right after it (+52) is <code>glyphDataFormat<\/code>, which is always 0, so reading the wrong one makes every font look short.<\/li><li><code>loca<\/code> offsets count from the start of <code>glyf<\/code>, not from the start of the file.<\/li><li>An empty glyph has the same offset as the next glyph. That's correct, not a bug.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>seek(maxp + 4);  numGlyphs = readUint16()\nseek(head + 50); isLong = (readInt16() == 1)\nseek(loca)\nentries = []\nrepeat numGlyphs + 1 times:\n    entries.append(readUint32() if isLong else 2 * readUint16())\nfor i in 0 .. numGlyphs - 1:\n    glyph[i] = (glyf + entries[i], entries[i + 1] - entries[i])<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a short <code>loca<\/code>","test":"04-R3-short-x2","input":"font tests/04/data/04-R3-short-x2.ttf\ntable \"glyf\" 932940381 484 236\ntable \"head\" 603817628 172 54\ntable \"loca\" 19792115 464 18\ntable \"maxp\" 720906 264 32\nglyph 0\nglyph 1\nglyph 2\nglyph 3\nglyph 4\nglyph 5\nglyph 6\nglyph 7","output":"glyphs 8 loca short\nglyph 0 484 26\nglyph 1 510 40\nglyph 2 550 24\nglyph 3 574 28\nglyph 4 602 40\nglyph 5 642 26\nglyph 6 668 28\nglyph 7 696 24","image":null,"explain":"<p><code>maxp<\/code> + 4 (byte 268) holds <code>00 08<\/code>: 8 glyphs. <code>head<\/code> + 50 (byte 222) holds <code>00 00<\/code>: short format. So <code>loca<\/code> has 9 uint16 entries:<\/p>\n<pre><code>00 00  00 0d  00 21  00 2d  00 3b  00 4f  00 5c  00 6a  00 76\n  0      13     33     45     59     79     92    106    118     entries\n  0      26     66     90    118    158    184    212    236     offsets (x 2)<\/code><\/pre>\n<p>Glyph 1 starts at 484 + 26 = 510 and is 66 − 26 = 40 bytes long. The last entry, 236, is the size of the whole <code>glyf<\/code> table.<\/p>"},{"label":"Example 2","name":"checkpoint 7's glyphs","test":"04-R4-jetbrains-07","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"glyf\" 810950304 113484 2068620\ntable \"head\" 546057157 300 54\ntable \"loca\" 588705204 64980 48504\ntable \"maxp\" 946608241 392 32\nglyph 17\nglyph 4\nglyph 77\nglyph 37","output":"glyphs 12125 loca long\nglyph 17 115392 56\nglyph 4 113584 0\nglyph 77 122844 24\nglyph 37 118060 112","image":null,"explain":"<p>JetBrains Mono uses long offsets. Entry 17 (at byte 64980 + 4 × 17) is <code>00 00 07 74<\/code> = 1908, and entry 18 is 1964. So glyph 17, the hyphen, starts at 113484 + 1908 = 115392 and is 1964 − 1908 = 56 bytes long. Entries 4 and 5 are both 100, so glyph 4 (the space) is empty. These four lines are the input of checkpoint 7's example 3.<\/p>"},{"label":"Example 3","name":"an empty last glyph","test":"04-R5-empty-last-spare","input":"font tests/04/data/04-R5-empty-last-spare.ttf\ntable \"glyf\" 1843900827 468 94\ntable \"head\" 603817628 172 54\ntable \"loca\" 4587578 456 10\ntable \"maxp\" 458762 264 32\nglyph 0\nglyph 1\nglyph 2\nglyph 3","output":"glyphs 4 loca short\nglyph 0 468 26\nglyph 1 494 24\nglyph 2 518 40\nglyph 3 558 0","image":null,"explain":"<p>The 5 entries are 0, 13, 25, 45, 45, so the offsets are 0, 26, 50, 90, 90. Glyph 3, the last one, runs from 90 to 90: it is empty. This font's <code>glyf<\/code> table is 94 bytes long, 4 more than the last entry, so \"the last glyph runs to the end of <code>glyf<\/code>\" gives the wrong answer here (4). Only <code>loca<\/code>'s extra entry tells you where the last glyph ends.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=GlyphCode%E2%86%92GlyphOffset%20mapping\" target=\"_blank\" rel=\"noopener\">The blog's loca reader<\/a>, <code>loadGlyphOffsetsMap<\/code>, reads <code>numGlyphs<\/code> from <code>maxp<\/code> and <code>indexToLocFormat<\/code> from <code>head<\/code>, then reads one <code>loca<\/code> entry per glyph (doubling short ones) and stores <code>glyf<\/code> offset + entry in a map from glyph id to file offset, <code>glyphCodeToOffset<\/code>. It doesn't store lengths. Instead, when glyph i − 1 has the same offset as glyph i, it marks glyph i − 1 as empty, and later steps skip empty glyphs.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet reads <code>numGlyphs<\/code> entries, not <code>numGlyphs<\/code> + 1. With only those, nothing follows the last glyph to compare against, so the last glyph can never be marked empty, and its record would be read even when it has no outline. In JetBrains Mono the last glyph (12124) is in fact empty. The spec's extra entry exists for exactly this, which is why R5 asks for it.<\/p>"}},{"id":"05","num":"5","title":"Read the horizontal metrics","difficulty":"Easy","tests":14,"solution":"solutions/p05_metrics.cpp","problem":"problems/05-metrics.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 05 - Read the horizontal metrics\n//\n// Problem:  problems/05-metrics.md (also in the web problem book)\n// Check:    .\\check 05\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p05.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p05_metrics.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 05 - Read the horizontal metrics\n//\n// Problem:  problems/05-metrics.md (also in the web problem book)\n// Check:    .\\check 05\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on readHorizontalMetrics().\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"  // optional: be::u16(file), be::i16(file), ...\n\nstruct TableRecord {\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\nusing Tables = std::map<std::string, TableRecord>;  // by tag, from the input's `table` lines\n\nstruct Metric {\n  int advanceWidth = 0;\n  int leftSideBearing = 0;\n};\n\nstruct HorizontalMetrics {\n  int ascent = 0;              // from hhea\n  int descent = 0;             // from hhea\n  std::vector<Metric> glyphs;  // one per glyph id, numGlyphs of them\n};\n\n// Reads hhea, maxp and hmtx (tables.at(\"hhea\").offset etc.): the font's ascent and\n// descent, and every glyph's advance width and left side bearing.\nHorizontalMetrics readHorizontalMetrics(std::ifstream& font, const Tables& tables) {\n  // TODO: see the problem page.\n  throw NotImplemented(\"readHorizontalMetrics\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[line.substr(open + 1, close - open - 1)] = t;\n}\n\n}  // namespace\n\n// Usage: p05 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `font-metrics` or `glyph <id>`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"font-metrics\" || keyword == \"glyph\") queries.push_back(line);\n    }\n    std::ifstream font(path, std::ios::binary);\n    if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n\n    const HorizontalMetrics metrics = readHorizontalMetrics(font, tables);\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword;\n      std::size_t id = 0;\n      words >> keyword >> id;\n      if (keyword == \"font-metrics\") {\n        output << \"ascent \" << metrics.ascent << \" descent \" << metrics.descent << '\\n';\n      } else if (id < metrics.glyphs.size()) {\n        const Metric& g = metrics.glyphs[id];\n        output << \"glyph \" << id << \" advance \" << g.advanceWidth << \" lsb \" << g.leftSideBearing << '\\n';\n      } else {\n        output << \"glyph \" << id << \" missing\\n\";  // never right: every glyph has metrics\n      }\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["signed vs unsigned integers (<code>int16_t<\/code>, <code>uint16_t<\/code>)","structs","<code>std::vector<\/code>"],"text":["signed vs unsigned integers (int16_t, uint16_t)","structs","std::vector"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>seekg<\/code>)"],"text":["std::ifstream in binary mode (seekg)"]},{"label":"Concepts","items":["font units","ascent and descent","advance width","left side bearing","the <code>hhea<\/code>, <code>hmtx<\/code> and <code>maxp<\/code> tables","big-endian byte order"],"text":["font units","ascent and descent","advance width","left side bearing","the hhea, hmtx and maxp tables","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font's ascent and descent and the horizontal metrics of requested glyphs.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p05_metrics.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p05_metrics.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>readHorizontalMetrics()<\/code>, which returns the ascent, the descent and every glyph's metrics.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these lines, in this order:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>table &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>Three lines, for <code>hhea<\/code>, <code>hmtx<\/code> and <code>maxp<\/code>: their records from the table directory, written as checkpoint 2 writes them. <code>offset<\/code> is where the table starts in the file.<\/td><\/tr><tr><td><code>font-metrics<\/code><\/td><td>A question: what are the font's ascent and descent?<\/td><\/tr><tr><td><code>glyph &lt;id&gt;<\/code><\/td><td>A question: what are this glyph's metrics? <code>id<\/code> is from 0 to <code>numGlyphs<\/code> − 1.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>One line per question, in input order:<\/p>\n<ul><li><code>font-metrics<\/code> → <code>ascent &lt;ascent&gt; descent &lt;descent&gt;<\/code><\/li><li><code>glyph &lt;id&gt;<\/code> → <code>glyph &lt;id&gt; advance &lt;advanceWidth&gt; lsb &lt;leftSideBearing&gt;<\/code><\/li><\/ul>\n<p>All values are whole numbers in font units (both real fonts have 1000 units per em). The boilerplate writes <code>glyph &lt;id&gt; missing<\/code> if the list your function returns has no entry for a glyph. That line is never correct: every glyph has metrics.<\/p>\n<h3>The tables you need<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>.<\/p>\n<p><strong><code>hhea<\/code><\/strong> (horizontal header), 36 bytes. You need three fields:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Offset in <code>hhea<\/code><\/th><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>version<\/code><\/td><td>4 bytes<\/td><td>Skip it<\/td><\/tr><tr><td>4<\/td><td><code>ascent<\/code><\/td><td>int16<\/td><td>Distance from the baseline up to the top of the line<\/td><\/tr><tr><td>6<\/td><td><code>descent<\/code><\/td><td>int16<\/td><td>Distance from the baseline down to the bottom of the line. Usually negative.<\/td><\/tr><tr><td>8 to 33<\/td><td><code>lineGap<\/code>, <code>advanceWidthMax<\/code>, ..., <code>metricDataFormat<\/code><\/td><td><\/td><td>Not needed here<\/td><\/tr><tr><td>34<\/td><td><code>numberOfHMetrics<\/code><\/td><td>uint16<\/td><td>How many full records <code>hmtx<\/code> starts with<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><code>maxp<\/code><\/strong>: <code>numGlyphs<\/code> is the uint16 at <code>maxp<\/code> + 4.<\/p>\n<p><strong><code>hmtx<\/code><\/strong> (horizontal metrics) has two parts, one after the other:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Part<\/th><th>Count<\/th><th>Each entry<\/th><\/tr><\/thead><tbody><tr><td><code>hMetrics<\/code><\/td><td><code>numberOfHMetrics<\/code><\/td><td>a <code>longHorMetric<\/code>, 4 bytes: <code>advanceWidth<\/code> (uint16), then <code>lsb<\/code> (int16)<\/td><\/tr><tr><td><code>leftSideBearings<\/code><\/td><td><code>numGlyphs<\/code> − <code>numberOfHMetrics<\/code><\/td><td><code>lsb<\/code> only (int16), 2 bytes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>So the <code>leftSideBearings<\/code> array starts at <code>hmtx<\/code> + 4 × <code>numberOfHMetrics<\/code>.<\/p>\n<p><strong>A glyph's metrics.<\/strong> For glyph id i:<\/p>\n<ul><li>If i &lt; <code>numberOfHMetrics<\/code>: advance = <code>hMetrics[i].advanceWidth<\/code> and lsb = <code>hMetrics[i].lsb<\/code>.<\/li><li>Otherwise: advance = the advance of the <strong>last<\/strong> <code>longHorMetric<\/code>, <code>hMetrics[numberOfHMetrics − 1].advanceWidth<\/code>, and lsb = <code>leftSideBearings[i − numberOfHMetrics]<\/code>.<\/li><\/ul>\n<p>The second rule is a space saver. When the last glyphs of a font all have the same advance (common in monospaced fonts, and for runs of CJK glyphs), the font stores that advance once and keeps only a 2-byte side bearing for each of them.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>ascent<\/code> and <code>descent<\/code> are the int16 values at <code>hhea<\/code> + 4 and <code>hhea<\/code> + 6. They can be negative.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A glyph whose id is below <code>numberOfHMetrics<\/code> has its own <code>longHorMetric<\/code>: an unsigned advance and a signed lsb.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A glyph whose id is <code>numberOfHMetrics<\/code> or more takes the last <code>longHorMetric<\/code>'s advance, and its lsb is entry (id − <code>numberOfHMetrics<\/code>) of the int16 array after the <code>longHorMetric<\/code> records.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>numGlyphs<\/code> is at most 17,936 in the tests, and 1 ≤ <code>numberOfHMetrics<\/code> ≤ <code>numGlyphs<\/code>.<\/li><li>Every <code>glyph<\/code> id is below <code>numGlyphs<\/code>.<\/li><li>Each input has at most 31 questions.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 14 tests: both real fonts (ascent and descent, Latin, kana and kanji glyphs, random glyphs) and small fonts built with fontTools (the int16 limits, negative side bearings, trailing glyphs that share an advance, a font where <code>numberOfHMetrics<\/code> is 1, and random fonts).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p05_metrics.cpp","text":"// Reference solution - checkpoint 05 (read the horizontal metrics).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <map>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"provided/BigEndian.h\"\n\nstruct TableRecord {\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\nusing Tables = std::map<std::string, TableRecord>;  // by tag, from the input's `table` lines\n\nstruct Metric {\n  int advanceWidth = 0;\n  int leftSideBearing = 0;\n};\n\nstruct HorizontalMetrics {\n  int ascent = 0;\n  int descent = 0;\n  std::vector<Metric> glyphs;  // one per glyph id\n};\n\nHorizontalMetrics readHorizontalMetrics(std::ifstream& font, const Tables& tables) {\n  HorizontalMetrics m;\n  const uint32_t hhea = tables.at(\"hhea\").offset;\n  font.seekg(hhea + 4);\n  m.ascent = be::i16(font);\n  m.descent = be::i16(font);\n  font.seekg(hhea + 34);\n  const uint16_t numberOfHMetrics = be::u16(font);\n  font.seekg(tables.at(\"maxp\").offset + 4);\n  const uint16_t numGlyphs = be::u16(font);\n\n  font.seekg(tables.at(\"hmtx\").offset);\n  for (uint16_t i = 0; i < numberOfHMetrics; ++i) {  // longHorMetric records\n    const int advance = be::u16(font);\n    const int lsb = be::i16(font);\n    m.glyphs.push_back({advance, lsb});\n  }\n  // The remaining glyphs repeat the last advance; only their lsb is stored.\n  const int lastAdvance = m.glyphs.empty() ? 0 : m.glyphs.back().advanceWidth;\n  for (uint32_t i = numberOfHMetrics; i < numGlyphs; ++i) m.glyphs.push_back({lastAdvance, be::i16(font)});\n  return m;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[line.substr(open + 1, close - open - 1)] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `font-metrics` or `glyph <id>`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"font-metrics\" || keyword == \"glyph\") queries.push_back(line);\n    }\n    std::ifstream font(path, std::ios::binary);\n    if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n\n    const HorizontalMetrics metrics = readHorizontalMetrics(font, tables);\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword;\n      std::size_t id = 0;\n      words >> keyword >> id;\n      if (keyword == \"font-metrics\") {\n        output << \"ascent \" << metrics.ascent << \" descent \" << metrics.descent << '\\n';\n      } else if (id < metrics.glyphs.size()) {\n        const Metric& g = metrics.glyphs[id];\n        output << \"glyph \" << id << \" advance \" << g.advanceWidth << \" lsb \" << g.leftSideBearing << '\\n';\n      } else {\n        output << \"glyph \" << id << \" missing\\n\";  // never right: every glyph has metrics\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":14,"total":14,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=hhea%2C%20hmtx%20tables\" target=\"_blank\" rel=\"noopener\">hhea, hmtx tables<\/a> section through the paragraph that starts \"The hmtx table contains information for\". The author's code comes right after it.<\/p>","context":"<p>To set a line of text, a renderer needs more than outlines. The font's ascent and descent say how much room a line needs above and below the baseline. Each glyph's advance width says how far to move the pen after drawing it, and its left side bearing says where its outline starts relative to the pen. Checkpoint 18 uses all of these to lay out a line of text.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6hhea.html\" target=\"_blank\" rel=\"noopener\">'hhea' table<\/a> and <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6hmtx.html\" target=\"_blank\" rel=\"noopener\">'hmtx' table<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/hhea\" target=\"_blank\" rel=\"noopener\">hhea: Horizontal Header Table<\/a> and <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/hmtx\" target=\"_blank\" rel=\"noopener\">hmtx: Horizontal Metrics Table<\/a><\/li><li>Apple, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>, for pictures of advance width and left side bearing<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=hhea%2C%20hmtx%20tables\" target=\"_blank\" rel=\"noopener\">hhea, hmtx tables<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 05                         run every test\n.\\check 05 -Case 05-R3-negative-tail   one test, showing its full input, expected output and your output\n.\\check 05 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 05 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Later glyphs: the last advance, lsb from the array after .............    0 / 3   FAILED\n      x 05-R3-shared-advance  the last 3 glyphs share advance 600, so only 4 long metrics are stored\n          line 5: expected `glyph 4 advance 600 lsb 5`, got `glyph 4 missing`\n          likely cause: R3 - Later glyphs: the last advance, lsb from the array after\n          expected values from: fontTools 4.67.0 hhea and hmtx, cross-checked against a struct parse of hmtx\n          reproduce: build/p05.exe build/cases/05/05-R3-shared-advance.in build/cases/05/05-R3-shared-advance.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read the two int16 values at <code>hhea<\/code> + 4, then <code>numberOfHMetrics<\/code> at <code>hhea<\/code> + 34 and <code>numGlyphs<\/code> at <code>maxp<\/code> + 4. With those two counts you know exactly how <code>hmtx<\/code> is laid out.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Walk through <code>hmtx<\/code> once from its start. First read <code>numberOfHMetrics<\/code> pairs of (uint16, int16) and append each one to the result. Remember the last advance. Then read <code>numGlyphs<\/code> − <code>numberOfHMetrics<\/code> more int16 values, appending (last advance, value) for each. The result now has one entry per glyph id.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>ascent<\/code>, <code>descent<\/code> and every <code>lsb<\/code> are signed. <code>advanceWidth<\/code> is unsigned.<\/li><li>Glyphs past <code>numberOfHMetrics<\/code> still have metrics. Their advance is the last <code>longHorMetric<\/code>'s advance, but their lsb is their own, from the array that follows. Don't copy the last record's lsb.<\/li><li>The lsb-only array starts right after the last 4-byte record, and its entries are 2 bytes each.<\/li><li><code>numberOfHMetrics<\/code> is at <code>hhea<\/code> + 34. The field just before it (+32) is <code>metricDataFormat<\/code>, which is always 0.<\/li><li>Both real fonts store a full record for every glyph, so they can't tell you whether you handle the second rule. The small test fonts can.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>seek(hhea + 4);  ascent = readInt16(); descent = readInt16()\nseek(hhea + 34); n = readUint16()          # numberOfHMetrics\nseek(maxp + 4);  numGlyphs = readUint16()\nseek(hmtx)\nglyphs = []\nrepeat n times:\n    advance = readUint16(); lsb = readInt16()\n    glyphs.append((advance, lsb))\nlast = glyphs[n - 1].advance\nrepeat numGlyphs - n times:\n    glyphs.append((last, readInt16()))<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a real font's ascent and descent","test":"05-R1-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"hhea\" 34418196 356 36\ntable \"hmtx\" 1631122185 520 48500\ntable \"maxp\" 946608241 392 32\nfont-metrics","output":"ascent 1020 descent -300","image":null,"explain":"<p>The 4 bytes at <code>hhea<\/code> + 4 (byte 360) are <code>03 fc fe d4<\/code>. <code>03 fc<\/code> is 1020. <code>fe d4<\/code> is 65236 as an unsigned number, and 65236 − 65536 = −300 as an int16.<\/p>"},{"label":"Example 2","name":"glyphs past <code>numberOfHMetrics<\/code>","test":"05-R3-negative-tail","input":"font tests/05/data/05-R3-negative-tail.ttf\ntable \"hhea\" 60424786 228 36\ntable \"hmtx\" 92143626 392 18\ntable \"maxp\" 524293 264 32\nfont-metrics\nglyph 0\nglyph 1\nglyph 2\nglyph 3\nglyph 4\nglyph 5","output":"ascent 800 descent -200\nglyph 0 advance 500 lsb 50\nglyph 1 advance 640 lsb 20\nglyph 2 advance 500 lsb -60\nglyph 3 advance 500 lsb -5\nglyph 4 advance 500 lsb 0\nglyph 5 advance 500 lsb -230","image":null,"explain":"<p><code>hhea<\/code> + 4 holds <code>03 20 ff 38<\/code> (ascent 800, descent −200), and <code>hhea<\/code> + 34 holds <code>00 03<\/code>: 3 full records. <code>maxp<\/code> + 4 says there are 6 glyphs. The 18 bytes of <code>hmtx<\/code>:<\/p>\n<pre><code>01 f4 00 32      glyph 0: advance 500, lsb 50\n02 80 00 14      glyph 1: advance 640, lsb 20\n01 f4 ff c4      glyph 2: advance 500, lsb -60     (the last longHorMetric)\nff fb            glyph 3: lsb -5    advance 500, from glyph 2\n00 00            glyph 4: lsb 0     advance 500\nff 1a            glyph 5: lsb -230  advance 500<\/code><\/pre>"},{"label":"Example 3","name":"a monospaced font","test":"05-R2-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"hhea\" 34418196 356 36\ntable \"hmtx\" 1631122185 520 48500\ntable \"maxp\" 946608241 392 32\nglyph 0\nglyph 1\nglyph 2\nglyph 3\nglyph 4\nglyph 5\nglyph 17\nglyph 37\nglyph 69\nglyph 77","output":"glyph 0 advance 600 lsb 90\nglyph 1 advance 0 lsb 0\nglyph 2 advance 333 lsb 0\nglyph 3 advance 600 lsb 0\nglyph 4 advance 600 lsb 0\nglyph 5 advance 600 lsb 216\nglyph 17 advance 600 lsb 140\nglyph 37 advance 600 lsb 35\nglyph 69 advance 600 lsb 58\nglyph 77 advance 600 lsb 76","image":null,"explain":"<p>JetBrains Mono stores a full record for all 12125 glyphs (<code>numberOfHMetrics<\/code> = <code>numGlyphs<\/code>), so every glyph here follows the first rule. Most glyphs are 600 units wide, but not all: glyph 1 has no width at all.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20glyph%20metrics\" target=\"_blank\" rel=\"noopener\">The blog's metrics parser<\/a> has two parts. <code>getFontMetric<\/code> returns a <code>FontMetric<\/code> holding the ascent and descent from <code>hhea<\/code> + 4 and <code>hhea<\/code> + 6. <code>loadGlyphMetricsMap<\/code> reads <code>numberOfHMetrics<\/code> from <code>hhea<\/code> + 34, then reads that many (advance width, left side bearing) pairs from <code>hmtx<\/code> into a map keyed by glyph id, <code>glyphMetric<\/code>.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet stops after the <code>longHorMetric<\/code> records, so glyphs at or past <code>numberOfHMetrics<\/code> get no entry at all. That never shows up with JetBra
