<title>Tiny TrueType Workbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* A problem book in the style of a coding-practice site: a problem list, then a split view with
   the statement on the left and an editor + test cases on the right. Everything is rendered from
   the JSON in #book-data (written by tools/build_book.py), so the template fits any workbook. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Monaco, Consolas, "Courier New", monospace;

  --bg: #f0f0f0;            /* page, behind the panels */
  --layer: #ffffff;         /* panels and cards */
  --layer-head: #fafafa;    /* panel tab bars */
  --fill: #f2f3f5;          /* chips, input boxes, buttons */
  --fill-hover: #e7e8eb;
  --row-alt: #f7f8fa;       /* striped list rows */
  --line: #e7e7e7;
  --line-strong: #d4d4d8;
  --text: #262626;
  --text-2: #595959;
  --text-3: #8c8c8c;
  --brand: #ffa116;         /* orange accent */
  --brand-ink: #b46a00;     /* orange that reads as text on light */
  --link: #0a6fd8;
  --easy: #00a38f;
  --medium: #c98300;
  --hard: #f02a50;
  --ok: #2db55d;
  --bad: #e5383b;
  --on-color: #ffffff;      /* text on --ok / --brand */
  --code-bg: #f5f6f7;
  --sel: #cde2ff;
  --sel-blur: #e3e6ea;
  --active-line: #f6f8fb;
  --icon-desc: #007aff;
  --icon-ed: #f08c00;
  --icon-code: #02a12f;
  --syn-text: #262626; --syn-kw: #0000ff; --syn-type: #267f99; --syn-str: #a31515; --syn-num: #098658;
  --syn-com: #008000; --syn-fn: #795e26; --syn-meta: #af00db; --syn-var: #001080;
  /* For figures on problem pages (inline SVG): these follow the theme. */
  --ink: var(--text); --muted: var(--text-2); --rule: var(--line); --surface: var(--layer);
  --fig-a: #2f55e4; --fig-b: #d9591f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
    --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
    --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
    --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
    --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
    --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
    --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
    --fig-a: #7f9cff; --fig-b: #ff8d5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
  --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
  --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
  --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
  --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
  --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
  --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
  --fig-a: #7f9cff; --fig-b: #ff8d5c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 var(--font-ui); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; border-radius: 4px; }
code, pre, kbd, samp { font-family: var(--font-mono); }
svg { flex: none; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--text-3); }

/* ---------- shared bits ---------- */
.chip { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 999px; border: 0;
  background: var(--fill); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { color: var(--text); background: var(--fill-hover); }
.easy { color: var(--easy) !important; } .medium { color: var(--medium) !important; } .hard { color: var(--hard) !important; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; border: 0;
  background: var(--fill); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill-hover); }
.btn.green { background: var(--ok); color: var(--on-color); }
.btn.green:hover { filter: brightness(1.08); }
.btn.done { color: var(--ok); }
.icon-btn { width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; display: inline-grid; place-items: center;
  color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--fill); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.cmd { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 8px; padding: 5px 5px 5px 12px; min-width: 0; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; scrollbar-width: thin; }
.cmd .btn { height: 26px; padding: 0 10px; font-size: 12px; background: var(--layer); }
.cmd .btn:hover { background: var(--fill-hover); }

/* ---------- problem list ---------- */
.nav { background: var(--layer); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  padding-top: env(safe-area-inset-top, 0px); }
.nav-in { max-width: 1200px; margin: 0 auto; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: 15px; }
.brand:hover { text-decoration: none; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #1a1a1a; display: grid; place-items: center;
  font: 700 14px/1 var(--font-mono); }
.nav-src { color: var(--text-3); font-size: 13px; margin-left: auto; }
.list-wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 20px 28px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "prog" "plist" "how"; }
.side { display: contents; }
.side .prog { grid-area: prog; } .side .how { grid-area: how; }
@media (min-width: 1000px) {
  .list-wrap { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "hero side" "plist side"; align-items: start; }
  .side { display: grid; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .side .prog, .side .how { grid-area: auto; }
}
.hero { grid-area: hero; display: grid; gap: 8px; }
.hero .over { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink); }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); max-width: 70ch; }
.side { grid-area: side; gap: 16px; }
.plist { grid-area: plist; display: grid; gap: 14px; min-width: 0; }
.card { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }

.prog { grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 18px; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-c b { font-size: 24px; font-weight: 600; }
.ring-c span { color: var(--text-3); font-size: 13px; }
.ring-c small { color: var(--text-2); font-size: 12px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.bar-row .n { color: var(--text-2); }
.bar-row .n b { color: var(--text); font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.bar-row[aria-pressed="true"] .lbl { text-decoration: underline; text-underline-offset: 3px; }
.how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: how; }
.how li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 13px; color: var(--text-2); counter-increment: how; }
.how li::before { content: counter(how); width: 20px; height: 20px; border-radius: 50%; background: var(--fill); color: var(--text-2);
  display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-top: 1px; }
.how b { color: var(--text); font-weight: 600; }
.how code, .credits code { font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 4px; }
.path { font: 12px/1.5 var(--font-mono); color: var(--text-3); word-break: break-all; }

.topics { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.topics.collapsed .tchip:nth-child(n + 13) { display: none; }
.tchip { height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 999px;
  background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.tchip:hover { color: var(--text); background: var(--fill); }
.tchip sup { color: var(--text-3); font-size: 10px; }
.tchip[aria-pressed="true"] { background: var(--text); color: var(--layer); }
.tchip[aria-pressed="true"] sup { color: var(--layer); opacity: .7; }
.topics .more { color: var(--link); background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0 8px; height: 28px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; max-width: 340px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--fill); border-radius: 8px; color: var(--text-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: 13px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--layer); color: var(--text); font-weight: 500; }
.seg.small { flex: none; }
.seg.small button { height: 24px; padding: 0 9px; font-size: 12px; }
.table-scroll { overflow-x: auto; }
.ptable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.ptable th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ptable td { padding: 11px 12px; white-space: nowrap; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(odd) td { background: var(--row-alt); }
.ptable tbody tr td:first-child { border-radius: 8px 0 0 8px; }
.ptable tbody tr td:last-child { border-radius: 0 8px 8px 0; }
.ptable tbody tr:hover td { background: var(--fill); }
.ptable .st { width: 44px; }
.ptable .ti { white-space: normal; min-width: 220px; }
.ptable .ti a { color: var(--text); font-weight: 500; }
.ptable .ti a:hover { color: var(--link); text-decoration: none; }
.ptable .te { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); width: 80px; }
.ptable .di { width: 96px; font-weight: 500; }
.ptable th.te { text-align: right; }
.st-ok { color: var(--ok); display: inline-grid; }
.st-try { color: var(--medium); display: inline-grid; }
.credits { margin: 6px 0 0; color: var(--text-3); font-size: 12px; max-width: 80ch; }

/* ---------- problem view ---------- */
.ide { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; padding-bottom: 10px; }
body.in-ide { overflow: hidden; }
.topbar { flex: none; height: 50px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-right { justify-self: end; gap: 10px; }
.tb-left .logo { margin-right: 8px; }
.tb-link { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; color: var(--text); font-weight: 500; white-space: nowrap; }
.tb-link:hover { background: var(--fill); text-decoration: none; }
.tb-mid { display: flex; gap: 1px; }
.act { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; border: 0; background: var(--fill); cursor: pointer; font-weight: 600; }
.act:hover { background: var(--fill-hover); }
.act.run { border-radius: 8px 0 0 8px; color: var(--text-2); }
.act.submit { border-radius: 0 8px 8px 0; color: var(--ok); }
.tb-prog { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.tb-prog b { color: var(--text); font-weight: 600; }
.exit-btn { height: 28px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.exit-btn:hover, .exit-btn[data-armed] { color: var(--bad); border-color: var(--bad); }
.bye { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); color: var(--text); text-align: center; padding: 24px; }
.bye > div { display: grid; gap: 12px; justify-items: center; max-width: 46ch; }
.bye h1 { margin: 0; font-size: 28px; font-weight: 600; }
.bye p { margin: 0; color: var(--text-2); }
.bye code { font-size: 13px; background: var(--fill); padding: 1px 6px; border-radius: 4px; }
.live { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: help; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.live.on { color: var(--ok); } .live.warn { color: var(--medium); } .live.off { color: var(--bad); }
.act:disabled { opacity: .55; cursor: progress; }
.running { display: flex; align-items: center; gap: 10px; color: var(--text-2); padding: 6px 0 14px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ok); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.err-list { display: grid; gap: 4px; margin-bottom: 12px; font: 12.5px/1.5 var(--font-mono); }
.err-list .loc { color: var(--bad); font-weight: 600; }
.cm-error-line { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.bad-text { color: var(--bad) !important; }
.note.muted { color: var(--text-3); font-size: 12px; }
.case-card { background: var(--fill); border-radius: 8px; margin-bottom: 8px; min-width: 0; }
.case-card > summary { cursor: pointer; padding: 9px 12px; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.case-card > summary .id { font: 600 12.5px var(--font-mono); color: var(--bad); white-space: nowrap; }
.case-card > summary .t { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-body { padding: 0 12px 12px; display: grid; gap: 8px; min-width: 0; }
.case-body .field { margin-bottom: 0; }
.case-body .field-v { background: var(--layer); max-height: 220px; }
.field-v.diff { padding: 6px 0; }
.diff .dl { display: block; width: max-content; min-width: 100%; padding: 0 12px; min-height: 1.6em; }
.diff .dl.del.changed { background: color-mix(in srgb, var(--bad) 9%, transparent); }
.diff .dl.del.extra { background: color-mix(in srgb, var(--bad) 20%, transparent); }
.diff .dl.add.changed { background: color-mix(in srgb, var(--ok) 9%, transparent); }
.diff .dl.add.missing { background: color-mix(in srgb, var(--ok) 20%, transparent); }
.diff .dl.clip { color: var(--text-3); }
.tk-del { background: color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 3px; padding: 0 2px; }
.tk-add { background: color-mix(in srgb, var(--ok) 40%, transparent); border-radius: 3px; padding: 0 2px; }
.img-cmp { display: flex; flex-wrap: wrap; gap: 10px; }
.img-cmp figure { margin: 0; display: grid; gap: 4px; justify-items: start; }
.img-cmp img { width: 180px; max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; }
.img-cmp figcaption { font-size: 12px; color: var(--text-3); }
.live-actions { margin: 14px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
.ide-main { flex: 1; min-height: 0; display: flex; }
.panel { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.left { flex: 0 0 var(--left, 45%); }
.right { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.code { flex: 0 0 var(--top, 60%); }
.tests { flex: 1; }
.splitter { flex: 0 0 8px; position: relative; touch-action: none; }
.splitter::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background .15s; }
.splitter.v { cursor: col-resize; } .splitter.v::after { top: 30%; bottom: 30%; left: 3px; width: 2px; }
.splitter.h { cursor: row-resize; } .splitter.h::after { left: 30%; right: 30%; top: 3px; height: 2px; }
.splitter:hover::after, .splitter.dragging::after, .splitter:focus-visible::after { background: var(--link); top: 0; bottom: 0; left: 3px; }
.splitter.h:hover::after, .splitter.h.dragging::after, .splitter.h:focus-visible::after { left: 0; right: 0; top: 3px; bottom: auto; }
.splitter:focus-visible { outline: none; }

.panel-head { flex: none; height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--layer-head);
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptab { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 6px; background: none;
  color: var(--text-2); cursor: pointer; font-weight: 500; white-space: nowrap; font-size: 13px; }
.ptab:hover { background: var(--fill); color: var(--text); }
.ptab[aria-selected="true"] { color: var(--text); font-weight: 600; }
.ptab.static { cursor: default; color: var(--text); font-weight: 600; } .ptab.static:hover { background: none; }
.sep { width: 1px; height: 14px; background: var(--line-strong); margin: 0 2px; flex: none; }
.ico-desc { color: var(--icon-desc); } .ico-ed { color: var(--icon-ed); } .ico-code { color: var(--icon-code); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }

/* statement */
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.d-head h1 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.solved-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-size: 13px; white-space: nowrap; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.callout { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; background: var(--fill); border-radius: 8px; padding: 10px 14px;
  color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
.callout svg { margin-top: 3px; color: var(--brand-ink); }
.callout p { margin: 0; }
.start { margin: 22px 0 30px; padding: 20px 20px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--layer); display: grid; gap: 18px; }
.start-top { display: grid; gap: 4px; }
.start-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-ink); }
.start-top h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--text); }
.start-sub { margin: 0; font-size: 13px; color: var(--text-3); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; }
.step { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; padding-bottom: 20px; }
.step:last-child { padding-bottom: 0; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 12px; top: 32px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--line-strong); }
.start.start :not(pre) > code { font: 12.5px var(--font-mono); color: var(--text); background: none; border: 0; padding: 0; }
.step-n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-strong); color: var(--text-2); font: 600 12px/23px var(--font-ui); text-align: center; background: var(--layer); }
.step-main { min-width: 0; padding-top: 2px; }
.step-file { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.step-name { font: 600 13.5px var(--font-mono); color: var(--text); background: none; border: 0; padding: 0; overflow-wrap: anywhere; text-align: left; }
button.step-name { cursor: pointer; }
button.step-name:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.step-dir { font: 12px var(--font-mono); color: var(--text-3); }
.step-tag { align-self: center; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; background: var(--fill); color: var(--text-3); white-space: nowrap; }
.step-tag.new { color: var(--brand-ink); }
.step-tag.adds { color: var(--link); }
.step-job { margin: 6px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
.step-more { margin-top: 6px; }
.step-more > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12.5px; color: var(--link); border-radius: 4px; }
.step-more > summary::-webkit-details-marker { display: none; }
.step-more > summary:hover { text-decoration: underline; text-underline-offset: 3px; }
.step-more > summary svg { width: 14px; height: 14px; transition: transform .15s; }
.step-more[open] > summary svg { transform: rotate(180deg); }
.step-more .when-open, .step-more[open] .when-closed { display: none; }
.step-more[open] .when-open { display: inline; }
.step-more-body { margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--fill); display: grid; gap: 10px; font-size: 13px; line-height: 1.6; color: var(--text-2); }
.step-more-body p { margin: 0; }
.lbl { display: block; margin-bottom: 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.start-facts { margin: 0; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.fact { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 4px 14px; align-items: baseline; }
.fact dt { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.fact dd { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-2); display: grid; gap: 8px; justify-items: start; min-width: 0; }
.fact dd b { color: var(--text); font-weight: 600; }
.ways { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); }
.way { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--text-2); font: 500 12.5px var(--font-ui); cursor: pointer; }
.way:hover { color: var(--text); }
.way[aria-pressed="true"] { background: var(--fill-hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
.way-note { font-size: 12.5px; color: var(--text-3); }
@media (max-width: 520px) { .fact { grid-template-columns: minmax(0, 1fr); } }
.fpath { font: 12px var(--font-mono); background: var(--fill); color: var(--text); border: 0; border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
button.fpath { cursor: pointer; } button.fpath:hover { background: var(--fill-hover); }
.noproj { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; background: var(--layer); text-align: center; }
.noproj > div { max-width: 46ch; display: grid; gap: 10px; justify-items: center; font-size: 13px; color: var(--text-2); }
.noproj h2 { margin: 0; font-size: 16px; color: var(--text); }
.noproj p { margin: 0; }
.finish { grid-template-columns: minmax(0, 1fr); }
.finish .cmd code { white-space: pre-wrap; overflow-wrap: anywhere; }
.trees { display: grid; gap: 12px; min-width: 0; }
.trees > div { min-width: 0; }
.trees h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.trees pre { margin: 0; max-width: 100%; font: 11.5px/1.55 var(--font-mono); color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.trees .hit { color: var(--ok); }
.callout b { color: var(--text); font-weight: 600; }
.flow > * { margin: 0; }
.flow > * + * { margin-top: 12px; }
.flow > h2:not(:first-child) { margin-top: 26px; }
.flow > h3:not(:first-child) { margin-top: 20px; }
.flow > h4:not(:first-child) { margin-top: 16px; }
.flow > .d-sec:not(:first-child), .flow > .examples { margin-top: 26px; }
.flow h2 { font-size: 15px; font-weight: 600; }
.flow h3 { font-size: 14px; font-weight: 600; }
.flow h4 { font-size: 14px; font-weight: 500; }
.flow ul, .flow ol { padding-left: 22px; }
.flow li + li { margin-top: 4px; }
.flow :not(pre) > code { font-size: 12.5px; background: var(--fill); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; color: var(--text); }
.flow pre { background: var(--code-bg); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
.flow pre code { font-size: inherit; }
.flow strong { font-weight: 600; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.flow table { border-collapse: collapse; width: 100%; font-size: 13px; }
.flow th, .flow td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.flow tr:last-child td { border-bottom: 0; }
.flow th { font-weight: 600; background: var(--layer-head); color: var(--text-2); }
.reqs { list-style: none; padding: 0 !important; display: grid; gap: 8px; }
.reqs li + li { margin-top: 0; }
.reqs li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.rid { font: 600 12px/1.6 var(--font-mono); color: var(--brand-ink); }
.ex + .ex { margin-top: 22px; }
.ex-title { margin: 0 0 8px; }
.ex-title strong { font-weight: 600; }
.ex-title span { color: var(--text-2); }
.ex-block { border-left: 2px solid var(--line-strong); padding-left: 14px; display: grid; gap: 8px; min-width: 0; }
.ex-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; }
.ex-k { font-weight: 600; font-size: 13px; }
.ex-row > pre { margin: 0; padding: 0; background: none; color: var(--text-2); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
.ex-row .flow { color: var(--text-2); }
img.shot, figure.pic img { max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #000; display: block; }
figure.pic { display: grid; gap: 4px; justify-items: start; }
figure.pic figcaption { font: 11px/1.3 var(--font-mono); color: var(--text-3); }
figure.split-figure { display: grid; gap: 14px; align-items: center; }
@media (min-width: 720px) { figure.split-figure { grid-template-columns: 200px minmax(0, 1fr); } }
figure.split-figure svg { width: 100%; max-width: 200px; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.dot.a { background: var(--fig-a); } .dot.b { border: 2px solid var(--fig-b); }
.md-details summary { cursor: pointer; font-weight: 500; }

.accs { margin-top: 30px; border-top: 1px solid var(--line); }
.accs-top { margin: -6px 0 0; border-top: 0; }  /* Source material, right under "Read in the blog first" */
.accs-top .acc { border-bottom: 0; }
.accs-top .acc-btn { padding: 4px 2px 6px; font-size: 13px; color: var(--text-2); }
.accs-top .acc-body { padding-top: 4px; font-size: 13px; }
.acc { border-bottom: 1px solid var(--line); }
.acc-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 2px; background: none; border: 0; cursor: pointer; color: var(--text); text-align: left; font-weight: 500; }
.acc-btn:disabled { cursor: not-allowed; color: var(--text-3); }
.acc-btn > svg:first-child { color: var(--text-2); }
.acc-sub { color: var(--text-3); font-weight: 400; margin-left: 8px; }
.acc-lock { color: var(--text-3); display: inline-grid; }
.chev { margin-left: auto; display: inline-grid; color: var(--text-3); transition: transform .15s; }
.acc-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-body { padding: 0 2px 16px 28px; color: var(--text-2); }
.tg + .tg { margin-top: 10px; }
.tg-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.tg-items { display: flex; flex-wrap: wrap; gap: 6px; }
.tg-items .chip { height: auto; min-height: 24px; white-space: normal; padding: 2px 10px; }
.tg-items code { font-size: 11.5px; }
.d-foot { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; color: var(--text-3); font-size: 12px; }
.ed-title { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
.ed-sec { display: grid; gap: 10px; margin-bottom: 28px; min-width: 0; }
.ed-sec > h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ed-sec .note { margin: 0; }
.badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--fill); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--medium); }
.badge svg { width: 14px; height: 14px; }
.sol-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.sol-head code { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sol-head .btn { height: 26px; font-size: 12px; }
.sol-code { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); color: var(--syn-text); tab-size: 2; }
#editorial .case-pills { margin-bottom: 0; }
.locked { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--text-2); }
.locked svg { width: 28px; height: 28px; color: var(--brand); }
.locked h2 { margin: 0; color: var(--text); font-size: 16px; font-weight: 600; }
.locked p { margin: 0; max-width: 46ch; }

/* editor */
.code-tools { flex: none; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.lang { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--text-2); font-size: 13px; white-space: nowrap; cursor: help; }
.file { font: 12px var(--font-mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tools-right { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-right: 4px; }
.confirm .btn { height: 26px; padding: 0 10px; font-size: 12px; }
.editor-row { flex: 1; min-height: 0; display: flex; position: relative; }
.editor { flex: 1; min-width: 0; min-height: 0; position: relative; }
/* Files panel and open-file tabs (live mode) */
.tree { flex: 0 0 210px; overflow: auto; border-right: 1px solid var(--line); background: var(--layer-head); padding: 6px 0 10px; font-size: 13px; }
.tree-dir { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 4px 12px; color: var(--text-3); font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; }
.tree-add { width: 22px; height: 22px; border: 0; border-radius: 5px; background: none; color: var(--text-2); cursor: pointer; font-size: 16px; line-height: 1; }
.tree-add:hover { background: var(--fill); color: var(--text); }
.tree-item { width: 100%; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 14px; border: 0; background: none; color: var(--text-2); cursor: pointer; text-align: left; font: 12.5px var(--font-mono); }
.tree-item:hover { background: var(--fill); color: var(--text); }
.tree-item.on { background: var(--fill-hover); color: var(--text); }
.tree-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-item .tm { width: 12px; flex: none; font-weight: 700; }
.tree-item.blank .nm { font-style: italic; }
.tree-item.now { box-shadow: inset 3px 0 0 var(--brand); }
.tree-item.now .nm { color: var(--text); font-weight: 600; }
.tree-item.uses .nm { color: var(--link); }
.tree-item.dim { opacity: .5; }
.tree-item.dim:hover, .tree-item.dim.on { opacity: 1; }
.tree-dir.now span { color: var(--brand-ink); }
.tree-key { margin: 0 12px 4px 14px; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--text-3); }
.tree-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.tree-key .k-now { background: var(--brand); } .tree-key .k-uses { background: var(--link); }
.tree-item .tm.ok { color: var(--ok); } .tree-item .tm.broke { color: var(--bad); }
.tag-n { flex: none; min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px; background: var(--fill); color: var(--text-3); font: 600 10px/16px var(--font-ui); text-align: center; }
.tree-empty { margin: 2px 12px 6px 14px; color: var(--text-3); font-size: 12px; line-height: 1.45; }
.new-file { padding: 2px 10px 6px 14px; }
.new-file input { width: 100%; height: 26px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--layer); padding: 0 8px; font: 12.5px var(--font-mono); color: var(--text); }
.new-file input:focus { outline: none; border-color: var(--link); }
.tree-foot { padding: 12px 10px 0 14px; }
.tree-foot .btn { width: 100%; justify-content: center; height: 28px; font-size: 12px; }
.ftabs { flex: none; display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; background: var(--layer); }
.ftab { display: inline-flex; align-items: center; border-radius: 6px 6px 0 0; color: var(--text-3); white-space: nowrap; }
.ftab button { border: 0; background: none; color: inherit; cursor: pointer; font: 12px var(--font-mono); height: 28px; padding: 0 10px; }
.ftab .x { padding: 0 8px 0 0; font-size: 14px; }
.ftab.on { background: var(--fill); color: var(--text); }
.ftab.warn button:first-child { color: var(--medium); }
.err-list .err { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 0; font: inherit; color: inherit; cursor: pointer; }
.err-list .err:hover .loc { text-decoration: underline; }
.nudge { background: var(--fill); border-radius: 8px; padding: 12px 14px; margin: 4px 0 14px; display: grid; gap: 8px; font-size: 13px; color: var(--text-2); }
.nudge b { color: var(--text); }
.nudge code { font-size: 12px; background: var(--layer); padding: 1px 5px; border-radius: 4px; }
.recheck { display: grid; gap: 2px; margin-top: 8px; }
.rc-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--text); font-size: 13px; }
.rc-row:hover { background: var(--fill); text-decoration: none; }
.rc-n { color: var(--text-3); } .rc-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-v { font-weight: 600; font-size: 12px; } .rc-v.ok { color: var(--ok); } .rc-v.bad { color: var(--bad); } .rc-v.warn { color: var(--medium); }
.st-broke { color: var(--bad); font-weight: 700; display: inline-grid; place-items: center; width: 16px; }
.finish h2 { color: var(--ok); }
.finish table { width: 100%; border-collapse: collapse; font-size: 12px; }
.finish td { padding: 3px 0; vertical-align: top; color: var(--text-2); }
.finish td:first-child { font-family: var(--font-mono); color: var(--text); padding-right: 8px; word-break: break-all; }
.vim-btn { width: auto; padding: 0 8px; font: 600 12px var(--font-mono); }
.lang-select { height: 26px; border: 0; border-radius: 6px; background: var(--fill); color: var(--text); font: 500 13px var(--font-ui); padding: 0 4px; cursor: pointer; max-width: 160px; }
.lang-select:hover { background: var(--fill-hover); }
.install { display: grid; gap: 8px; background: var(--fill); border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; font-size: 13px; color: var(--text-2); }
.install p { margin: 0; }
.install b { color: var(--medium); }
.install .cmd { background: var(--layer); }
.vim-btn[aria-pressed="true"] { color: var(--ok); background: var(--fill); }
/* Vim mode: block cursor in Normal mode, and the : / command line (CodeMirror's dialog addon). */
.cm-fat-cursor .CodeMirror-cursor { width: auto; border: 0 !important; background: color-mix(in srgb, var(--ok) 55%, transparent); }
.cm-fat-cursor div.CodeMirror-cursors { z-index: 1; }
.cm-fat-cursor .CodeMirror-line::selection, .cm-fat-cursor .CodeMirror-line > span::selection, .cm-fat-cursor .CodeMirror-line > span > span::selection { background: transparent; }
.cm-fat-cursor { caret-color: transparent; }
.cm-animate-fat-cursor { width: auto; border: 0; animation: blink 1.06s steps(1) infinite; background: color-mix(in srgb, var(--ok) 55%, transparent); }
@keyframes blink { 50% { background-color: transparent; } }
.CodeMirror-dialog { position: absolute; left: 0; right: 0; background: var(--layer-head); z-index: 15; padding: 2px 10px; overflow: hidden; color: var(--text); font: 13px var(--font-mono); }
.CodeMirror-dialog-top { border-bottom: 1px solid var(--line); top: 0; }
.CodeMirror-dialog-bottom { border-top: 1px solid var(--line); bottom: 0; }
.CodeMirror-dialog input { border: none; outline: none; background: transparent; width: 20em; color: inherit; font: inherit; }
.CodeMirror-dialog button { font-size: 70%; }
.cm-searching { background: color-mix(in srgb, var(--medium) 35%, transparent); }
.editor > .CodeMirror, .editor > .fallback-editor { position: absolute; inset: 0; height: auto; }
.code-status { flex: none; height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); }
.fallback-editor { width: 100%; height: 100%; border: 0; resize: none; padding: 8px 12px; background: var(--layer); color: var(--text);
  font: 14px/1.6 var(--font-mono); white-space: pre; outline: none; tab-size: 2; }

/* test cases and results */
.case-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pill-btn { height: 30px; padding: 0 14px; border-radius: 8px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-weight: 500; font-size: 13px; }
.pill-btn:hover { background: var(--fill); color: var(--text); }
.pill-btn[aria-selected="true"] { background: var(--fill); color: var(--text); }
.case-name { margin: -4px 0 12px; color: var(--text-2); font-size: 13px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 14px; min-width: 0; }
.field-k { font-size: 12px; color: var(--text-3); }
.field-v { margin: 0; background: var(--fill); border-radius: 8px; padding: 10px 12px; font: 13px/1.6 var(--font-mono); color: var(--text); overflow-x: auto; white-space: pre; }
.field img { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; }
.verdict { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 14px; }
.verdict h2 { margin: 0; font-size: 20px; font-weight: 600; }
.verdict.ok h2 { color: var(--ok); } .verdict.bad h2 { color: var(--bad); } .verdict.warn h2 { color: var(--medium); } .verdict.unknown h2 { color: var(--text-2); }
.verdict .sub { color: var(--text-3); font-size: 13px; }
.verdict .btn { margin-left: auto; height: 26px; font-size: 12px; }
.note { margin: 0 0 12px; font-size: 13px; color: var(--text-2); }
.note.warn { color: var(--medium); }
.req-rows { display: grid; gap: 8px; margin-bottom: 16px; }
.req-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; font-size: 12.5px; }
.req-row .rq { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req-row .cnt { font-variant-numeric: tabular-nums; color: var(--text-2); }
.req-row .bar { grid-column: 2 / -1; height: 4px; color: var(--ok); }
.req-row.fail .bar, .req-row.fail .cnt { color: var(--bad); }
.fail-card { background: var(--fill); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-bottom: 8px; min-width: 0; }
.fail-card .id { font: 600 12.5px var(--font-mono); color: var(--bad); }
.fail-card .t { color: var(--text); font-size: 13px; }
.fail-card pre, pre.raw { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.55 var(--font-mono); color: var(--text-2); }
pre.raw { background: var(--fill); border-radius: 8px; padding: 10px 12px; max-height: 260px; overflow: auto; margin-bottom: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
.step > span { width: 22px; height: 22px; border-radius: 50%; background: var(--fill); color: var(--text-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.step.done > span { background: var(--ok); color: var(--on-color); }
.step > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.step p { margin: 0; color: var(--text-2); font-size: 13px; }
.step p b { color: var(--text); font-weight: 600; }
.step p code { font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
textarea.paste { width: 100%; min-height: 84px; resize: vertical; background: var(--fill); border: 1px solid transparent; border-radius: 8px;
  padding: 10px 12px; font: 12px/1.5 var(--font-mono); color: var(--text); }
textarea.paste:focus { border-color: var(--link); outline: none; }
details.more { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
details.more summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
details.more > div { margin-top: 12px; }
details.more .cmd + .cmd { margin-top: 6px; }

@media (max-width: 899px) {
  .ide { height: auto; padding-bottom: 24px; }
  body.in-ide { overflow: auto; }
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); height: auto; min-height: 50px; }
  .ide-main { flex-direction: column; gap: 10px; }
  .left, .code { flex: none; }
  .left .panel-body { overflow: visible; }
  .right { gap: 10px; }
  .code { height: 72vh; }
  .tests { flex: none; }
  .tests .panel-body { overflow: visible; }
  .splitter { display: none; }
  .tb-link span, .tb-prog, .tb-left .logo { display: none; }
}
@media (max-width: 560px) {
  .ptable .te { display: none; }

}
@media (max-width: 420px) {
  .act { padding: 0 12px; }

}

<script type="application/json" id="book-data">{"key":"tiny-truetype-workbook","title":"Tiny TrueType Workbook","headline":"Build a TrueType renderer yourself","lede":"Each assignment has you write the program that one part of the blog post builds, from reading big-endian bytes to drawing a line of text. The checker feeds your program test inputs and compares what it writes with expected answers, most of them computed by fontTools. You choose how to structure the code and which language or libraries to use.","credits":"Fonts: JetBrains Mono (Nerd Font build) and Noto Sans JP, both under the SIL Open Font License. Expected outputs come from fontTools. The book keeps your progress in this browser only.","sourceUrl":"https://yayo1.com/en/blog/tiny-truetype-renderer/","sourceTitle":"Writing a tiny TrueType parser and renderer from scratch","author":"Yohei Yamasaki","folder":"tiny-ttf-workbook","check":".\\check {id}","shell":"PowerShell","checkpoints":[{"id":"01","num":"1","title":"Read big-endian numbers","difficulty":"Easy","tests":28,"problem":"problems/01-byte-readers.md","entry":"solutions/assignments/assignment_01_byte_readers.cpp","files":[{"path":"solutions/assignments/assignment_01_byte_readers.cpp","role":"entry","purpose":null,"job":"Read the `file` line and open that file with your `ByteReader`, then run the other lines in order: `jump` and `skip` move the reader, and each read writes `<op> <value>`. If a read runs out of bytes, write `eof` and stop. The Output section gives the format, including the tolerance for F2Dot14 values.","blank":"// ======================================================================================\n// Assignment 01: Read big-endian numbers\n// Problem: problems/01-byte-readers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 01 as `build/solutions/assignment_01.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 01`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `file` line and open that file with your `ByteReader`, then run the other\n//   lines in order: `jump` and `skip` move the reader, and each read writes `<op>\n//   <value>`. If a read runs out of bytes, write `eof` and stop. The Output section gives\n//   the format, including the tolerance for F2Dot14 values.\n//\n// The other files of this assignment:\n//   You also write src/font/ByteReader.h and src/font/ByteReader.cpp in this assignment;\n//   each one gives its job at the top.\n//   Include them by their path under src/, e.g. #include \"font/ByteReader.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 01: Read big-endian numbers\n// Problem: problems/01-byte-readers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 01 as `build/solutions/assignment_01.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 01`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/font/ByteReader.h and src/font/ByteReader.cpp in this assignment;\n//   each one gives its job at the top.\n//   Include them by their path under src/, e.g. #include \"font/ByteReader.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iomanip>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"font/ByteReader.h\"\n\nnamespace {\n\n// k / 16384 has at most 14 digits after the point, so 14 decimals print it without rounding.\nstd::string decimal(const double value) {\n  std::ostringstream s;\n  s << std::fixed << std::setprecision(14) << value;\n  std::string text = s.str();\n  text.erase(text.find_last_not_of('0') + 1);\n  if (text.back() == '.') text.pop_back();\n  return text == \"-0\" ? \"0\" : text;\n}\n\n// Runs one operation. Read operations write one line, `<op> <value>`.\n// It reads the value before writing anything, so a read that fails writes nothing.\n// (The + in front of 8-bit values prints them as numbers, not characters.)\nvoid run(ByteReader& reader, const std::string& op, std::istringstream& words, std::ostream& out) {\n  const auto line = [&](const auto& value) { out << op << ' ' << value << '\\n'; };\n  if (op == \"jump\" || op == \"skip\") {\n    uint32_t n = 0;\n    words >> n;\n    if (op == \"jump\") reader.jumpTo(n);\n    else reader.skipBytes(n);\n  } else if (op == \"u8\") {\n    line(+reader.readUint8());\n  } else if (op == \"i8\") {\n    line(+reader.readInt8());\n  } else if (op == \"u16\") {\n    line(reader.readUint16());\n  } else if (op == \"i16\") {\n    line(reader.readInt16());\n  } else if (op == \"u32\") {\n    line(reader.readUint32());\n  } else if (op == \"i32\") {\n    line(reader.readInt32());\n  } else if (op == \"f2dot14\") {\n    line(decimal(reader.readF2Dot14()));\n  } else if (!op.empty()) {\n    throw std::runtime_error(\"unknown operation \" + op);\n  }\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string line, keyword, path;\n    std::getline(input, line);\n    std::istringstream first(line);\n    first >> keyword >> path;\n    if (keyword != \"file\") throw std::runtime_error(\"the first line must be: file <path>\");\n    ByteReader reader(path);\n    while (std::getline(input, line)) {\n      std::istringstream words(line);\n      std::string op;\n      words >> op;\n      try {\n        run(reader, op, words, output);\n      } catch (const UnexpectedEof&) {\n        output << \"eof\\n\";  // a read ran past the end: report it and stop\n        break;\n      }\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/font/ByteReader.h","role":"new","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines.","job":"Declare a reader that opens a binary file and keeps a current position. Give it functions to jump to an absolute offset, skip forward, read each of the six integer types (`u8` to `i32`) big-endian, and read an F2Dot14 as a floating-point number. Also declare how a read reports that it ran out of bytes, such as an exception type.","blank":"#pragma once\n// ======================================================================================\n// Assignment 01: Read big-endian numbers\n// Problem: problems/01-byte-readers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for big-endian numbers at any position in a font\n//   file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point.\n//   Every later assignment that reads the font goes through it: assignment 02 reads the\n//   table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the\n//   glyph outlines.\n//\n// Your job:\n//   Declare a reader that opens a binary file and keeps a current position. Give it\n//   functions to jump to an absolute offset, skip forward, read each of the six integer\n//   types (`u8` to `i32`) big-endian, and read an F2Dot14 as a floating-point number. Also\n//   declare how a read reports that it ran out of bytes, such as an exception type.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 01: Read big-endian numbers\n// Problem: problems/01-byte-readers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for big-endian numbers at any position in a font\n//   file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point.\n//   Every later assignment that reads the font goes through it: assignment 02 reads the\n//   table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the\n//   glyph outlines.\n//\n// Your job:\n//   Declare a reader that opens a binary file and keeps a current position. Give it\n//   functions to jump to an absolute offset, skip forward, read each of the six integer\n//   types (`u8` to `i32`) big-endian, and read an F2Dot14 as a floating-point number. Also\n//   declare how a read reports that it ran out of bytes, such as an exception type. The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <fstream>\n#include <stdexcept>\n#include <string>\n#include <type_traits>\n\n// Thrown when a read needs bytes past the end of the file.\nstruct UnexpectedEof : std::runtime_error {\n  UnexpectedEof() : std::runtime_error(\"unexpected EOF\") {}\n};\n\n// Reads a binary file from any position. Every number in a font is stored big-endian:\n// most significant byte first.\nclass ByteReader {\n public:\n  explicit ByteReader(const std::string& path);\n\n  void jumpTo(uint32_t offset);    // to a position counted from the start of the file\n  void skipBytes(uint32_t count);  // forward from the current position\n\n  // An integer of 1 to 4 bytes; signed types are two's complement.\n  template <typename T>\n  T readBigEndian() {\n    static_assert(std::is_integral_v<T> && sizeof(T) <= 4);\n    // TODO: read sizeof(T) bytes with nextByte(), most significant first, and build the\n    // number. For a signed T, see \"Signed numbers: two's complement\" on the problem page.\n    throw std::logic_error(\"not implemented: readBigEndian\");\n  }\n\n  uint8_t readUint8() { return readBigEndian<uint8_t>(); }\n  uint16_t readUint16() { return readBigEndian<uint16_t>(); }\n  uint32_t readUint32() { return readBigEndian<uint32_t>(); }\n  int8_t readInt8() { return readBigEndian<int8_t>(); }\n  int16_t readInt16() { return readBigEndian<int16_t>(); }\n  int32_t readInt32() { return readBigEndian<int32_t>(); }\n\n  // A 2.14 fixed-point number: a signed 16-bit integer divided by 2^14.\n  double readF2Dot14();\n\n private:\n  uint8_t nextByte();  // throws UnexpectedEof at the end of the file\n\n  std::ifstream file_;\n};\n"},{"path":"solutions/src/font/ByteReader.cpp","role":"new","purpose":"This file implements the reader: it opens the font, moves the position and turns bytes into numbers. Every later assignment that reads the font runs this code, so a bug here makes their tests fail too.","job":"Open the file in binary mode, move the position for jumps and skips, and build each number from its bytes, most significant first, with two's complement for the signed types. If a read needs a byte past the end of the file, report it the way your header declares and return no value.","blank":"// ======================================================================================\n// Assignment 01: Read big-endian numbers\n// Problem: problems/01-byte-readers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file implements the reader: it opens the font, moves the position and turns bytes\n//   into numbers. Every later assignment that reads the font runs this code, so a bug here\n//   makes their tests fail too.\n//\n// Your job:\n//   Open the file in binary mode, move the position for jumps and skips, and build each\n//   number from its bytes, most significant first, with two's complement for the signed\n//   types. If a read needs a byte past the end of the file, report it the way your header\n//   declares and return no value.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 01: Read big-endian numbers\n// Problem: problems/01-byte-readers.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file implements the reader: it opens the font, moves the position and turns bytes\n//   into numbers. Every later assignment that reads the font runs this code, so a bug here\n//   makes their tests fail too.\n//\n// Your job:\n//   Open the file in binary mode, move the position for jumps and skips, and build each\n//   number from its bytes, most significant first, with two's complement for the signed\n//   types. If a read needs a byte past the end of the file, report it the way your header\n//   declares and return no value. The Boilerplate gives you the declarations; fill in each\n//   TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/ByteReader.h\"\n\nByteReader::ByteReader(const std::string& path) : file_(path, std::ios::binary) {\n  if (!file_) throw std::runtime_error(\"cannot open \" + path);\n}\n\nvoid ByteReader::jumpTo(const uint32_t offset) {\n  // TODO: move the read position of file_. A jump must work even after a read ran past the end.\n  throw std::logic_error(\"not implemented: jumpTo\");\n}\n\nvoid ByteReader::skipBytes(const uint32_t count) {\n  // TODO: move the read position of file_ forward.\n  throw std::logic_error(\"not implemented: skipBytes\");\n}\n\ndouble ByteReader::readF2Dot14() {\n  // TODO: see \"F2Dot14\" on the problem page.\n  throw std::logic_error(\"not implemented: readF2Dot14\");\n}\n\nuint8_t ByteReader::nextByte() {\n  // TODO: one byte with file_.get(); at the end of the file, throw UnexpectedEof.\n  throw std::logic_error(\"not implemented: nextByte\");\n}\n"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["fixed-width integers (<code>uint8_t<\/code> ... <code>int32_t<\/code>)","bit shifts and OR","two's complement","templates (optional)","exceptions"],"text":["fixed-width integers (uint8_t ... int32_t)","bit shifts and OR","two's complement","templates (optional)","exceptions"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>get<\/code>, <code>seekg<\/code>)","<code>std::char_traits&lt;char&gt;::eof()<\/code>"],"text":["std::ifstream in binary mode (get, seekg)","std::char_traits<char>::eof()"]},{"label":"Concepts","items":["big-endian byte order","signed vs unsigned integers","fixed-point numbers (F2Dot14)","file offsets"],"text":["big-endian byte order","signed vs unsigned integers","fixed-point numbers (F2Dot14)","file offsets"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that opens a binary file, runs a list of read and move operations on it, and writes every number it reads.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The first line of the input file names the file to read. Every other line is one operation:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>file &lt;path&gt;<\/code><\/td><td>The binary file to read (first line only). The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>u8<\/code>, <code>u16<\/code>, <code>u32<\/code><\/td><td>Read an unsigned integer of 1, 2 or 4 bytes at the current position.<\/td><\/tr><tr><td><code>i8<\/code>, <code>i16<\/code>, <code>i32<\/code><\/td><td>Read a signed integer of 1, 2 or 4 bytes.<\/td><\/tr><tr><td><code>f2dot14<\/code><\/td><td>Read a 2-byte F2Dot14 number (see below).<\/td><\/tr><tr><td><code>jump &lt;offset&gt;<\/code><\/td><td>Move to byte <code>offset<\/code>, counted from the start of the file. Byte 0 is the first byte.<\/td><\/tr><tr><td><code>skip &lt;count&gt;<\/code><\/td><td>Move <code>count<\/code> bytes forward from the current position.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The reader keeps a <strong>current position<\/strong>: the byte the next read starts at.<\/p>\n<ul><li>The position starts at byte 0.<\/li><li>Each read moves it forward by the number of bytes it read.<\/li><li>A <code>jump<\/code> or <code>skip<\/code> may move the position to the end of the file or past it. The move itself succeeds, and the next read runs out of bytes.<\/li><\/ul>\n<h3>Output<\/h3>\n<ul><li>Each read operation writes one line, in input order: the operation's name, a space, and the value in decimal. For example <code>u16 65535<\/code>, <code>i16 -1<\/code> or <code>f2dot14 1.75<\/code>.<\/li><li><code>jump<\/code> and <code>skip<\/code> write nothing.<\/li><li><strong>F2Dot14 values<\/strong> have at most 14 digits after the decimal point, and the Boilerplate's output code prints all of them. If you write your own output code, the checker accepts any value within 0.000001 of the exact one.<\/li><\/ul>\n<p><strong>Running out of bytes.<\/strong> If a read needs a byte past the end of the file, write the line <code>eof<\/code> in place of its value and stop: your program runs no further operations. A read that ends on the last byte of the file succeeds.<\/p>\n<h3>Big-endian byte order<\/h3>\n<p><strong>Big-endian<\/strong> means the most significant byte comes first, and TrueType stores every number this way. The two bytes <code>12 34<\/code> hold <code>0x1234<\/code> = 4660 (a little-endian reader would get <code>0x3412<\/code> = 13330 instead). With the bytes b0, b1, b2, b3 in file order:<\/p>\n<ul><li>u16 = b0 × 256 + b1<\/li><li>u32 = b0 × 2^24 + b1 × 2^16 + b2 × 2^8 + b3<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Operation<\/th><th>Bytes<\/th><th>Values<\/th><\/tr><\/thead><tbody><tr><td><code>u8<\/code><\/td><td>1<\/td><td>0 to 255<\/td><\/tr><tr><td><code>u16<\/code><\/td><td>2<\/td><td>0 to 65535<\/td><\/tr><tr><td><code>u32<\/code><\/td><td>4<\/td><td>0 to 4294967295<\/td><\/tr><tr><td><code>i8<\/code><\/td><td>1<\/td><td>−128 to 127<\/td><\/tr><tr><td><code>i16<\/code><\/td><td>2<\/td><td>−32768 to 32767<\/td><\/tr><tr><td><code>i32<\/code><\/td><td>4<\/td><td>−2147483648 to 2147483647<\/td><\/tr><tr><td><code>f2dot14<\/code><\/td><td>2<\/td><td>−2 to 1.99993896484375<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Signed numbers: two's complement<\/h3>\n<p><strong>Two's complement<\/strong> is how the signed types store negative numbers. A signed read takes the same bytes as the unsigned read of the same size. Call the unsigned result u and the size in bits n (8, 16 or 32):<\/p>\n<ul><li>If the top bit is 1 (u ≥ 2^(n−1)), the value is u − 2^n.<\/li><li>Otherwise it is u.<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Bytes<\/th><th>Unsigned<\/th><th>Signed<\/th><\/tr><\/thead><tbody><tr><td><code>7f<\/code><\/td><td>127<\/td><td>127<\/td><\/tr><tr><td><code>80<\/code><\/td><td>128<\/td><td>128 − 256 = −128<\/td><\/tr><tr><td><code>ff<\/code><\/td><td>255<\/td><td>255 − 256 = −1<\/td><\/tr><tr><td><code>fe d4<\/code><\/td><td>65236<\/td><td>65236 − 65536 = −300<\/td><\/tr><tr><td><code>80 00 00 00<\/code><\/td><td>2147483648<\/td><td>−2147483648<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>F2Dot14<\/h3>\n<p>An <strong>F2Dot14<\/strong> is a fixed-point number: 2 bits before the binary point and 14 after. Read the 2 bytes as an <code>i16<\/code>, then divide by 16384 (2^14). The OpenType specification gives these examples:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bytes<\/th><th>As <code>i16<\/code><\/th><th>Value<\/th><th>The spec rounds it to<\/th><\/tr><\/thead><tbody><tr><td><code>7f ff<\/code><\/td><td>32767<\/td><td>1.99993896484375<\/td><td>1.999939<\/td><\/tr><tr><td><code>70 00<\/code><\/td><td>28672<\/td><td>1.75<\/td><td>1.75<\/td><\/tr><tr><td><code>00 01<\/code><\/td><td>1<\/td><td>0.00006103515625<\/td><td>0.000061<\/td><\/tr><tr><td><code>00 00<\/code><\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td><code>ff ff<\/code><\/td><td>−1<\/td><td>−0.00006103515625<\/td><td>−0.000061<\/td><\/tr><tr><td><code>80 00<\/code><\/td><td>−32768<\/td><td>−2<\/td><td>−2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Fonts use F2Dot14 for the scale factors of compound glyphs (assignment 09) and for variable-font axis coordinates.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>u8<\/code>, <code>u16<\/code> and <code>u32<\/code> read 1, 2 and 4 bytes, most significant byte first, as non-negative numbers.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>i8<\/code>, <code>i16<\/code> and <code>i32<\/code> read the same bytes as two's complement, so a set top bit gives a negative number.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>f2dot14<\/code> is the <code>i16<\/code> value divided by 16384.<\/span><\/li><li><span class=\"rid\">R4<\/span><span><code>jump<\/code> moves to an absolute offset. <code>skip<\/code> moves forward from the current position. Each read moves forward by its own size.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A read that needs bytes past the end of the file writes <code>eof<\/code>, and your program writes nothing after it.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Offsets and counts are whole numbers from 0 to 4294967295. A <code>jump<\/code> followed by <code>skip<\/code>s can move the position past 4294967295, so keep the position in a 64-bit number (or let the stream do it): a 32-bit position would wrap around and read the wrong bytes.<\/li><li>The files are hand-made files of up to 64 bytes (one is empty) and the two fonts in <code>fonts/<\/code> (2.4 MB and 9.6 MB).<\/li><li>Each input has at most 40 operations.<\/li><li>Each case has a 10-second limit. A correct solution finishes in milliseconds.<\/li><li>There are 28 tests: hand-made files for each rule (sign boundaries, the spec's F2Dot14 table, jumps and skips, every way to run out of bytes), header fields of both fonts, F2Dot14 values from Noto Sans JP's <code>avar<\/code> table, and 4 random files with random operations.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/font/ByteReader.h","text":"#pragma once\n// Assignment 01: the numbers a font file is made of.\n\n#include <cstdint>\n#include <fstream>\n#include <stdexcept>\n#include <string>\n#include <type_traits>\n\n// Thrown when a read needs bytes past the end of the file.\nstruct UnexpectedEof : std::runtime_error {\n  UnexpectedEof() : std::runtime_error(\"unexpected EOF\") {}\n};\n\n// Reads a binary file from any position. Every number in a font is stored big-endian:\n// most significant byte first.\nclass ByteReader {\n public:\n  explicit ByteReader(const std::string& path);\n\n  void jumpTo(uint32_t offset);    // to a position counted from the start of the file\n  void skipBytes(uint32_t count);  // forward from the current position\n\n  // An integer of 1 to 4 bytes; signed types are two's complement.\n  template <typename T>\n  T readBigEndian() {\n    static_assert(std::is_integral_v<T> && sizeof(T) <= 4);\n    uint64_t value = 0;\n    for (std::size_t i = 0; i < sizeof(T); ++i) value = value << 8 | nextByte();\n    if constexpr (std::is_signed_v<T>) {\n      const uint64_t range = uint64_t{1} << (8 * sizeof(T));  // 2^bits\n      if (value >= range / 2) return static_cast<T>(static_cast<int64_t>(value) - static_cast<int64_t>(range));\n    }\n    return static_cast<T>(value);\n  }\n\n  uint8_t readUint8() { return readBigEndian<uint8_t>(); }\n  uint16_t readUint16() { return readBigEndian<uint16_t>(); }\n  uint32_t readUint32() { return readBigEndian<uint32_t>(); }\n  int8_t readInt8() { return readBigEndian<int8_t>(); }\n  int16_t readInt16() { return readBigEndian<int16_t>(); }\n  int32_t readInt32() { return readBigEndian<int32_t>(); }\n\n  // A 2.14 fixed-point number: a signed 16-bit integer divided by 2^14.\n  double readF2Dot14();\n\n private:\n  uint8_t nextByte();  // throws UnexpectedEof at the end of the file\n\n  std::ifstream file_;\n};\n"},{"path":"src/font/ByteReader.cpp","text":"#include \"font/ByteReader.h\"\n\nByteReader::ByteReader(const std::string& path) : file_(path, std::ios::binary) {\n  if (!file_) throw std::runtime_error(\"cannot open \" + path);\n}\n\nvoid ByteReader::jumpTo(const uint32_t offset) {\n  file_.clear();  // a jump always starts from a clean state, even after reading past the end\n  file_.seekg(offset, std::ios::beg);\n}\n\nvoid ByteReader::skipBytes(const uint32_t count) { file_.seekg(count, std::ios::cur); }\n\ndouble ByteReader::readF2Dot14() { return readInt16() / 16384.0; }\n\nuint8_t ByteReader::nextByte() {\n  const int c = file_.get();\n  if (c == std::char_traits<char>::eof()) throw UnexpectedEof();\n  return static_cast<uint8_t>(c);\n}\n"},{"path":"assignments/assignment_01_byte_readers.cpp","text":"// Assignment 01 (read big-endian numbers): runs the read operations in a test input.\n// The reader itself is src/font/ByteReader.\n\n#include <fstream>\n#include <iomanip>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"font/ByteReader.h\"\n\nnamespace {\n\n// k / 16384 has at most 14 digits after the point, so 14 decimals print it without rounding.\nstd::string decimal(const double value) {\n  std::ostringstream s;\n  s << std::fixed << std::setprecision(14) << value;\n  std::string text = s.str();\n  text.erase(text.find_last_not_of('0') + 1);\n  if (text.back() == '.') text.pop_back();\n  return text == \"-0\" ? \"0\" : text;\n}\n\n// Runs one operation. Read operations write one line, `<op> <value>`.\n// It reads the value before writing anything, so a read that fails writes nothing.\n// (The + in front of 8-bit values prints them as numbers, not characters.)\nvoid run(ByteReader& reader, const std::string& op, std::istringstream& words, std::ostream& out) {\n  const auto line = [&](const auto& value) { out << op << ' ' << value << '\\n'; };\n  if (op == \"jump\" || op == \"skip\") {\n    uint32_t n = 0;\n    words >> n;\n    if (op == \"jump\") reader.jumpTo(n);\n    else reader.skipBytes(n);\n  } else if (op == \"u8\") {\n    line(+reader.readUint8());\n  } else if (op == \"i8\") {\n    line(+reader.readInt8());\n  } else if (op == \"u16\") {\n    line(reader.readUint16());\n  } else if (op == \"i16\") {\n    line(reader.readInt16());\n  } else if (op == \"u32\") {\n    line(reader.readUint32());\n  } else if (op == \"i32\") {\n    line(reader.readInt32());\n  } else if (op == \"f2dot14\") {\n    line(decimal(reader.readF2Dot14()));\n  } else if (!op.empty()) {\n    throw std::runtime_error(\"unknown operation \" + op);\n  }\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string line, keyword, path;\n    std::getline(input, line);\n    std::istringstream first(line);\n    first >> keyword >> path;\n    if (keyword != \"file\") throw std::runtime_error(\"the first line must be: file <path>\");\n    ByteReader reader(path);\n    while (std::getline(input, line)) {\n      std::istringstream words(line);\n      std::string op;\n      words >> op;\n      try {\n        run(reader, op, words, output);\n      } catch (const UnexpectedEof&) {\n        output << \"eof\\n\";  // a read ran past the end: report it and stop\n        break;\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":[],"proof":{"passed":28,"total":28,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <strong>\"What is TrueType?\"<\/strong> section, then <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Reading%20.ttf%20files\" target=\"_blank\" rel=\"noopener\">Reading .ttf files<\/a>. That section has one paragraph, and the author's code follows it, below a link card.<\/p>","readTitle":"Read in the blog first","context":"<p>A TrueType font stores every number big-endian. Your <code>ByteReader<\/code> is the first piece of your project, and every later assignment that reads the font goes through it: assignment 02 for the table directory, assignments 03 to 05 for the <code>cmap<\/code>, <code>loca<\/code> and metrics tables, and assignments 07 and 09 for glyph outlines.<\/p>","sources":"<ul><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/otff#data-types\" target=\"_blank\" rel=\"noopener\">Data types<\/a>. It lists every type and has the F2Dot14 table above.<\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6.html\" target=\"_blank\" rel=\"noopener\">Data types<\/a> (the table near the top of \"Font files\")<\/li><li>cppreference: <a href=\"https://en.cppreference.com/w/cpp/io/basic_istream/get\" target=\"_blank\" rel=\"noopener\"><code>std::basic_istream::get<\/code><\/a> and <a href=\"https://en.cppreference.com/w/cpp/io/basic_istream/seekg\" target=\"_blank\" rel=\"noopener\"><code>seekg<\/code><\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Reading%20.ttf%20files\" target=\"_blank\" rel=\"noopener\">Reading .ttf files<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 01                         run every test\n.\\check 01 -Case 01-R2-same-bytes  one test, showing its full input, expected output and your output\n.\\check 01 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 01 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  Signed reads (i8, i16, i32): two&#x27;s complement ........................    0 / 4   FAILED\n      x 01-R2-i8  i8: 00 7f 80 ff 81 01\n          line 3: expected `i8 -128`, got `i8 0`\n          likely cause: R2 - Signed reads (i8, i16, i32): two&#x27;s complement\n          expected values from: Python struct (&gt;B &gt;b &gt;H &gt;h &gt;I &gt;i; F2Dot14 = &gt;h / 16384 exactly)\n          reproduce: build/solutions/assignment_01.exe build/cases/01/01-R2-i8.in build/cases/01/01-R2-i8.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read one byte at a time with <code>get()<\/code>. It returns an <code>int<\/code>: 0 to 255 for a byte, or <code>std::char_traits&lt;char&gt;::eof()<\/code> when there are no more bytes. Start the number at 0, and for each byte shift what you have 8 bits left and OR the byte in.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>One function can serve all six integer types (a function template, in C++). Loop once per byte of the type, building the value in a wide unsigned va
