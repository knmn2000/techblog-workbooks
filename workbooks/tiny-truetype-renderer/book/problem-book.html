==============================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 14: Fill a glyph: even-odd rule\n// Problem: problems/14-even-odd-fill.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the even-odd rule, on top of your `render/Scanline`. Assignment 16\n//   adds the non-zero rule beside it, and the text renderer in assignment 18 uses that\n//   rule.\n//\n// Your job:\n//   Implement the even-odd fill with your `render/Scanline`: build the edge pieces, then\n//   on every row fill from the 1st crossing to the 2nd, the 3rd to the 4th, and so on. The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"render/EvenOdd.h\"\n\n#include <stdexcept>\n\n#include \"render/Scanline.h\"\n\nvoid renderGlyphByEvenOdd(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          const RGB color) {\n  // TODO: a scanline fill with edgePieces, forEachRow and fillSpan (see \"From points to edges\"\n  // and \"The even-odd rule\" on the problem page).\n  throw std::logic_error(\"not implemented: renderGlyphByEvenOdd\");\n}\n"}],"buildsOn":[{"path":"solutions/src/FrameBufferCanvas.h","owner":"06","purpose":"The canvas holds a picture in memory, one colour per pixel. It can paint one pixel, fill a rectangle, draw a thick line and save the picture as a PNG. You draw every later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line of text in 18."},{"path":"solutions/src/GlyphComponent.h","owner":"07","purpose":"Every outline in the project takes this form: its points (x and y in font units, on or off the curve) and the index where each contour ends. Assignments 08 and 11 draw outlines in this form, 09 produces one per part of a compound glyph, and 14, 16 and 17 fill them."},{"path":"solutions/src/render/Placement.h","owner":"08","purpose":"A placement is where a glyph goes on the canvas, given as three numbers: the pixel column of font x = 0, the pixel row of the baseline and the pixels per font unit. Together they turn font units (y up) into pixels (y down). You place glyphs with it in assignments 11, 14, 16 and 17, and in assignment 18 you move it along a line of text, one glyph at a time."},{"path":"solutions/src/utils/Geometry.h","owner":"10","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them."}],"indent":2,"tags":[{"label":"Language","items":["sorting","floating-point comparisons","solving a quadratic equation"],"text":["sorting","floating-point comparisons","solving a quadratic equation"]},{"label":"Library","items":["<code>std::vector<\/code>","<code>std::sort<\/code>","<code>std::sqrt<\/code>"],"text":["std::vector","std::sort","std::sqrt"]},{"label":"Concepts","items":["scanline filling","the even-odd rule","quadratic Bézier curves","implied on-curve points","half-open intervals"],"text":["scanline filling","the even-odd rule","quadratic Bézier curves","implied on-curve points","half-open intervals"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that fills glyph outlines on a black canvas by the even-odd rule and saves the picture as a PNG.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Glyph point (x, y) goes to pixel position (x0 + scale·x, baseline − scale·y). y grows up in the glyph and down on the screen.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The fill colour<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline; its <code>ends<\/code> and <code>points<\/code> lines follow<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, counting from 0: contour k runs from the point after the previous end up to and including <code>e_k<\/code><\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>The outline's points; coordinates may be fractional<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There can be several outlines. Fill each one on its own, one after another, in the same colour.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) <code>width<\/code> pixels wide and <code>height<\/code> pixels high. Every pixel starts black (0, 0, 0). Paint a pixel in the fill colour when its <strong>centre<\/strong> is inside an outline by the even-odd rule. Pixel (px, py), with py counted down from the top, has its centre at screen position (px + 0.5, py + 0.5), which is glyph point ((px + 0.5 − x0) / scale, (baseline − py − 0.5) / scale).<\/p>\n<p><strong>The checker forgives edges that move by one pixel.<\/strong> If you sample at the top of each row instead of the centre, or round x another way, you still pass. Missing or extra shapes, holes in the wrong place and stray lines fail.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so either of these works:<\/p>\n<ul><li><strong>A PNG.<\/strong> Your <code>FrameBufferCanvas<\/code> from assignment 06 already does this in <code>writePng<\/code>, and the boilerplate calls it. Underneath, <code>third_party/stb_image_write.h<\/code> is on your project's include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><li><strong>A binary PPM<\/strong>, if you'd rather write the bytes yourself. The header is <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>). Then come 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><\/ul>\n<h3>From points to edges<\/h3>\n<p>Every contour is a closed loop: after its last point it continues to its first. Walk the points in order, as your <code>render/Outline<\/code> did when it drew curves in assignment 11:<\/p>\n<ul><li>Two on-curve points in a row make a straight line.<\/li><li>An off-curve point is the control point of a quadratic Bézier curve from the previous on-curve point to the next on-curve point: B(t) = (1−t)²·P0 + 2(1−t)t·P1 + t²·P2 for t from 0 to 1.<\/li><li>Two off-curve points next to each other have an <strong>implied on-curve point<\/strong> at their midpoint. Each off-curve point then has on-curve points on both sides.<\/li><li>A contour can start with an off-curve point, and can even consist only of off-curve points (then each of its on-curve points is an implied one).<\/li><\/ul>\n<h3>The even-odd rule<\/h3>\n<p>Draw a ray from the point to the right and count how many times it crosses the outline. An odd count means inside, an even count means outside.<\/p>\n<p>A <strong>scanline<\/strong> is a horizontal line through a row of pixel centres. With scanlines the rule becomes, for each row:<\/p>\n<ol><li>Find every x where the scanline crosses an edge.<\/li><li>Sort the crossings by x.<\/li><li>Fill between the 1st and 2nd, the 3rd and 4th, and so on.<\/li><\/ol>\n<p><strong>Vertices on the scanline.<\/strong> If a scanline passes through a point where two edges meet, a naive count sees that point twice and flips the rest of the row (a stray line), or misses a crossing it should count. To fix this, treat each edge as <strong>half-open in y<\/strong>:<\/p>\n<ul><li>An edge from y0 to y1 counts at scanline y when min(y0, y1) ≤ y &lt; max(y0, y1), with y measured on the screen (pixels, growing downward).<\/li><li>A horizontal edge doesn't count.<\/li><\/ul>\n<p>Then a vertex the outline passes through counts once. A pointed tip (both edges above, or both below) counts twice or not at all, which leaves the parity right either way.<\/p>\n<p><strong>Curves.<\/strong> A quadratic curve can cross one scanline twice. Split each curve where its y turns around: each piece then crosses a scanline at most once, and the half-open rule works for curves too.<\/p>\n<ul><li>For a curve P0, P1, P2 the turning point is at t = (P0.y − P1.y) / (P0.y − 2·P1.y + P2.y). Split there only when the denominator isn't 0 and 0 &lt; t &lt; 1. Otherwise the curve is already <strong>monotone<\/strong>: it only rises or only falls.<\/li><li>Use the same split point, with the same y, for both halves.<\/li><li>To find where a piece crosses scanline y, solve y(t) = y as a quadratic in t (linear when P0.y − 2·P1.y + P2.y = 0) and keep the root in [0, 1].<\/li><\/ul>\n<p><strong>Clipping.<\/strong> Crossings can lie far outside the canvas. Clamp x to the canvas before you convert it to an integer, because C++ doesn't define what happens when you convert a huge double to <code>int<\/code>. The function that fills a stretch of a row (the boilerplate's <code>fillSpan<\/code>) should skip columns outside the canvas and do nothing when the stretch is empty.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Fill each pixel whose centre is inside, and leave every other pixel black.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A contour inside another is a hole and stays empty.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Follow the curves, including implied on-curve points and contours that start off-curve or have only off-curve points.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Count each vertex that lies on a scanline the right number of times, so no stray lines appear.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Where contours cross or overlap, the even-odd rule leaves the overlap empty.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Fill several outlines one after another, painting their union.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Apply the placement and scale, and clip anything outside the canvas.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Canvases are at most about 560 x 560 pixels; outlines have at most a few hundred points.<\/li><li>Outlines are well-formed: every contour has at least 2 points.<\/li><li>There are 28 tests: hand-made shapes for each rule, letters from JetBrains Mono Bold at several scales, U+5341 from Noto Sans JP, and 6 random letters (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/render/Scanline.h","text":"#pragma once\n// Assignment 14: scanning an outline row by row, the part both fill rules share.\n//\n// The fill paints a pixel when its centre is inside the outline. It scans each row along the\n// line through its pixel centres, and splits the outline's edges into pieces that don't turn\n// back in y, so each piece crosses a row at most once.\n\n#include <functional>\n#include <vector>\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n#include \"utils/Geometry.h\"\n\n// A straight edge (curve == false) or a quadratic curve p0 -> c -> p1, in pixels.\nstruct EdgePiece {\n  Vec2 p0, c, p1;\n  bool curve = false;\n};\n\n// Where a row crosses an edge, and which way the edge runs there.\nstruct Crossing {\n  double x = 0;\n  int direction = 0;  // +1 going down the screen, -1 going up\n};\n\n// The outline's edges in pixels: implied on-curve points made explicit, contours that start\n// off-curve handled, and curves split where they turn in y.\nstd::vector<EdgePiece> edgePieces(const GlyphComponent& outline, const Placement& place);\n\n// Calls visit(row, crossings) for every pixel row the edges reach, with that row's crossings\n// sorted by x. A piece counts from its upper end up to, not including, its lower end, so a\n// row through a vertex that two pieces share counts one crossing there.\nvoid forEachRow(const std::vector<EdgePiece>& edges, int height,\n                const std::function<void(int row, const std::vector<Crossing>& crossings)>& visit);\n\n// Fills the pixels of `row` whose centres lie in [fromX, toX).\nvoid fillSpan(FrameBufferCanvas& canvas, int row, double fromX, double toX, RGB color);\n"},{"path":"src/render/Scanline.cpp","text":"#include \"render/Scanline.h\"\n\n#include <algorithm>\n#include <cmath>\n#include <utility>\n\nnamespace {\n\nVec2 mid(const Vec2 a, const Vec2 b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\n// Splits a quadratic curve at its turning point in y, if it has one inside.\nvoid addCurve(const Vec2 p0, const Vec2 c, const Vec2 p1, std::vector<EdgePiece>& out) {\n  const double denom = p0.y - 2 * c.y + p1.y;\n  if (std::abs(denom) > 1e-12) {\n    const double t = (p0.y - c.y) / denom;\n    if (t > 1e-9 && t < 1 - 1e-9) {\n      const Vec2 a = lerp(p0, c, t), b = lerp(c, p1, t), m = lerp(a, b, t);\n      out.push_back({p0, a, m, true});\n      out.push_back({m, b, p1, true});\n      return;\n    }\n  }\n  out.push_back({p0, c, p1, true});\n}\n\n// Where a piece crosses the horizontal line y = scanY (half-open in y).\nbool cross(const EdgePiece& p, const double scanY, Crossing& out) {\n  const double y0 = p.p0.y, y1 = p.p1.y;\n  if (y0 == y1) return false;\n  if (!(std::min(y0, y1) <= scanY && scanY < std::max(y0, y1))) return false;\n  out.direction = y1 > y0 ? 1 : -1;\n  if (!p.curve) {\n    const double t = (scanY - y0) / (y1 - y0);\n    out.x = p.p0.x + (p.p1.x - p.p0.x) * t;\n    return true;\n  }\n  const double a = y0 - 2 * p.c.y + y1, b = 2 * (p.c.y - y0), c = y0 - scanY;\n  double t;\n  if (std::abs(a) < 1e-12) {\n    t = -c / b;\n  } else {\n    const double disc = std::max(0.0, b * b - 4 * a * c);\n    const double r1 = (-b + std::sqrt(disc)) / (2 * a), r2 = (-b - std::sqrt(disc)) / (2 * a);\n    const auto dist = [](const double r) { return r < 0 ? -r : (r > 1 ? r - 1 : 0); };\n    t = dist(r1) <= dist(r2) ? r1 : r2;  // the piece is monotone: one root is in [0, 1]\n  }\n  t = std::clamp(t, 0.0, 1.0);\n  const double u = 1 - t;\n  out.x = u * u * p.p0.x + 2 * u * t * p.c.x + t * t * p.p1.x;\n  return true;\n}\n\n}  // namespace\n\nstd::vector<EdgePiece> edgePieces(const GlyphComponent& outline, const Placement& place) {\n  std::vector<EdgePiece> out;\n  int start = 0;\n  for (const int end : outline.endPtsOfContours) {\n    std::vector<std::pair<Vec2, bool>> pts;\n    for (int i = start; i <= end; ++i) {\n      const GlyphPoint& p = outline.points[i];\n      pts.push_back({{place.x0 + place.scale * p.x, place.baseline - place.scale * p.y}, p.onCurve});\n    }\n    start = end + 1;\n    if (pts.empty()) continue;\n\n    // Make every implied on-curve point explicit.\n    std::vector<std::pair<Vec2, bool>> full;\n    for (std::size_t i = 0; i < pts.size(); ++i) {\n      const auto& p = pts[i];\n      const auto& next = pts[(i + 1) % pts.size()];\n      full.push_back(p);\n      if (!p.second && !next.second) full.push_back({mid(p.first, next.first), true});\n    }\n    const auto first = std::find_if(full.begin(), full.end(), [](const auto& p) { return p.second; });\n    if (first == full.end()) continue;  // a single off-curve point: nothing to fill\n    std::rotate(full.begin(), first, full.end());\n\n    Vec2 current = full[0].first;\n    for (std::size_t i = 1; i <= full.size(); ++i) {\n      const auto& p = full[i % full.size()];\n      if (p.second) {\n        out.push_back({current, current, p.first, false});\n        current = p.first;\n      } else {\n        const Vec2 next = full[(i + 1) % full.size()].first;  // always on-curve now\n        addCurve(current, p.first, next, out);\n        current = next;\n        ++i;\n      }\n    }\n  }\n  return out;\n}\n\nvoid forEachRow(const std::vector<EdgePiece>& edges, const int height,\n                const std::function<void(int, const std::vector<Crossing>&)>& visit) {\n  if (edges.empty()) return;\n  double top = 1e300, bottom = -1e300;\n  for (const EdgePiece& e : edges) {\n    top = std::min({top, e.p0.y, e.c.y, e.p1.y});\n    bottom = std::max({bottom, e.p0.y, e.c.y, e.p1.y});\n  }\n  const int firstRow = std::max(0, static_cast<int>(std::floor(top)) - 1);\n  const int lastRow = std::min(height - 1, static_cast<int>(std::ceil(bottom)) + 1);\n\n  std::vector<Crossing> crossings;\n  for (int row = firstRow; row <= lastRow; ++row) {\n    const double scanY = row + 0.5;  // through the pixel centres\n    crossings.clear();\n    for (const EdgePiece& e : edges) {\n      Crossing c;\n      if (cross(e, scanY, c)) crossings.push_back(c);\n    }\n    std::sort(crossings.begin(), crossings.end(), [](const Crossing& a, const Crossing& b) { return a.x < b.x; });\n    visit(row, crossings);\n  }\n}\n\nvoid fillSpan(FrameBufferCanvas& canvas, const int row, const double fromX, const double toX, const RGB color) {\n  if (row < 0 || row >= canvas.height()) return;\n  // Pixel x has its centre at x + 0.5.\n  const int from = std::max(0, static_cast<int>(std::ceil(fromX - 0.5)));\n  const int to = std::min(canvas.width() - 1, static_cast<int>(std::ceil(toX - 0.5)) - 1);\n  for (int x = from; x <= to; ++x) canvas.set(x, row, color);\n}\n"},{"path":"src/render/EvenOdd.h","text":"#pragma once\n// Assignment 14: filling a glyph by the even-odd rule.\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\n// Fills every pixel whose centre is inside the outline: a point is inside when a ray from it\n// crosses the outline an odd number of times.\nvoid renderGlyphByEvenOdd(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          RGB color);\n"},{"path":"src/render/EvenOdd.cpp","text":"#include \"render/EvenOdd.h\"\n\n#include \"render/Scanline.h\"\n\nvoid renderGlyphByEvenOdd(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          const RGB color) {\n  forEachRow(edgePieces(outline, place), canvas.height(), [&](const int row, const std::vector<Crossing>& crossings) {\n    // Inside after an odd number of crossings: between the 1st and 2nd, the 3rd and 4th, ...\n    for (std::size_t i = 0; i + 1 < crossings.size(); i += 2)\n      fillSpan(canvas, row, crossings[i].x, crossings[i + 1].x, color);\n  });\n}\n"},{"path":"assignments/assignment_14_even_odd_fill.cpp","text":"// Assignment 14 (fill a glyph, even-odd rule): fills each outline in a test input.\n// The filling is src/render/EvenOdd, built on src/render/Scanline.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/EvenOdd.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<GlyphComponent> outlines;  // each one filled on its own\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // then `ends ...` and `points x y on|off ...`\n        outlines.emplace_back();\n      } else if (keyword == \"ends\" && !outlines.empty()) {\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\" && !outlines.empty()) {\n        GlyphPoint p;\n        for (std::string on; words >> p.x >> p.y >> on;) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    for (const GlyphComponent& outline : outlines) renderGlyphByEvenOdd(*canvas, outline, place, color);\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/FrameBufferCanvas.h","src/GlyphComponent.h","src/render/Placement.h","src/FrameBufferCanvas.cpp","src/utils/Geometry.h"],"proof":{"passed":28,"total":28,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Renderer%3A%20Filling%20Glyph\" target=\"_blank\" rel=\"noopener\">Renderer: Filling Glyph<\/a> section through <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a>, skipping the code blocks if you want to work it out yourself. The blog builds this in two steps, a first version and then a fix for errors at vertices; this assignment covers both.<\/p>","readTitle":"Read in the blog first","context":"<p>In this assignment you take the outlines you decoded in assignments 07 and 09 (your <code>GlyphComponent<\/code>) and paint their inside by the even-odd rule. The row-by-row scanning goes in <code>render/Scanline<\/code>, which assignments 16 and 17 reuse for the non-zero rule. Assignment 18 then renders whole lines of text with the non-zero fill.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Even%E2%80%93odd_rule\" target=\"_blank\" rel=\"noopener\">Even–odd rule<\/a><\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: on-curve and off-curve points<\/li><li>Pomax, <a href=\"https://pomax.github.io/bezierinfo/\" target=\"_blank\" rel=\"noopener\">A Primer on Bézier Curves<\/a>: finding extremities and intersections<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Even-odd%20Rule\" target=\"_blank\" rel=\"noopener\">Even-odd Rule<\/a> and <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 14                         run every test\n.\\check 14 -Case 14-R5-star        one test: its input, and where the expected and your pictures are\n.\\check 14 -Fresh                  new random letters (new seed)\n.\\check 14 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing picture comes with a diff image:<\/p>\n<pre><code>  R4  A vertex on a scanline counts the right number of times .................    4 / 5   FAILED\n      x 14-R4-W  &#x27;W&#x27; at scale 0.5: vertices sharing a row\n          26 extra pixels, e.g. (145, 115) should be black (beyond the 1-pixel edge tolerance).\n          Diff: build/cases/14/14-R4-W.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Turn the outline into a list of edges first (lines and quadratic curves, in pixel coordinates), then fill row by row. Your <code>render/Outline<\/code> from assignment 11 (drawing curves) already does most of the first step.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>For each pixel row, take the horizontal line through the pixel centres (y = row + 0.5). Collect the x of every place an edge crosses it, sort the list, and fill from the 1st crossing to the 2nd, the 3rd to the 4th, and so on. Fill a pixel when its centre x (px + 0.5) is in one of those ranges.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Use half-open intervals in y (min ≤ y &lt; max) so a shared vertex counts once; skip horizontal edges.<\/li><li>Split each quadratic curve where its y turns around (t = (y0 − yc) / (y0 − 2·yc + y2), with yc the control point's y, when 0 &lt; t &lt; 1), so each piece crosses a row at most once.<\/li><li>Implied on-curve points: between two off-curve points, add their midpoint.<\/li><li>A contour may start off-curve: start walking from an on-curve point (or an implied one).<\/li><li>The y axis flips: pixel y = baseline − scale·glyph y.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>edges = []\nfor each contour:\n    pts = points mapped to pixels, with midpoints inserted between consecutive off-curve points\n    rotate pts so it starts at an on-curve point\n    walk around: on-&gt;on adds a line; on-&gt;off-&gt;on adds a curve (split at its y turning point)\n\nfor row in 0 .. height-1:\n    y = row + 0.5\n    xs = []\n    for e in edges:\n        if min(e.y0, e.y1) &lt;= y &lt; max(e.y0, e.y1):\n            xs.append(x where e crosses y)      # line: interpolate; curve: solve the quadratic in t\n    sort xs\n    for i in 0, 2, 4, ...:\n        fill pixels px with xs[i] &lt;= px + 0.5 &lt; xs[i+1]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a pentagram","test":"14-R5-star","input":"canvas 205 195\nplace 2 206 2\ncolor 255 255 255\noutline\nends 4\npoints 50 100 on 79 9 on 2 65 on 98 65 on 21 9 on","output":null,"image":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAM0AAADDCAIAAACu1AJOAAAIcUlEQVR4XmMYBaMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhQKUQ+A8Go8FJaggwjQbZaAjQIQRG09loMqNHCDCOBjPxIQCsM+GKGRlHg46EtDNano1mNIbRenM0EQyTEBgt/ImNSORKE6JntOokPhOM1pujReZovTmaBhhG682RlAgwK83RqpOk+B+tN0fLzNF6czQNjNabIycN4Ko0R6vO0f7maEk4uEJgtH02miLpEQKj47QEQhl/pTladRKZSEfLs9HybLS/OZoGhksIjNab+GKSmEpztOokJi+M1pujZeZovTmaBoZLCIyWZ6NpmR4hMNo+wxnKxDfORptoBJPqaHk2Wp6Nts9G08BwCYHRehN7TJJaaY5WnfhzxGi9OVpmjtabo2lgtN4cxmmAvEpztOrEkyRG683RMnO03hxNA6P15nBNA5RUmqNVJ65UMVpvjpaZo/XmaBoYrTeHZRqgvNIcrTqxJozRenO0zBytN0fTwGi9OfzSALUqzdGqEzNtjNabo2XmaL05mgZG681hlgaoW2mOVp1oyWO03hwtM0frzdE0MFxCYLQ8A8UkLSrN0TyCHAKj6YyG6WE0+cIDdzSdjZY7o+2z0TQwXEJgdL8TA61rt9HrLICZZbTeHC0zR+vN0TQwWm8OjxCgT5dwtOocrTdHy8zRenM0DYzWm8MgBOg5jjrCq87RenO0zBytN0fTwGi9OdRDgP6TjyO56hytN0fLzNF6czQNjNabQzoEBmrFzoitOkfrzdEyc7TeHE0D
