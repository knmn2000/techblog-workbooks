vertices counts an edge only when the edge's lowest y (on screen) is above the scanline, and handles curves that cross twice with a convexity check (checkpoint 15 finds the curve's lowest point).<\/p>\n<p><strong>Something to look for:<\/strong> in the fixed version, the check for a curve's endpoint on the scanline compares the row y with the endpoints' <strong>x<\/strong> coordinates, so that branch rarely does what it intends.<\/p>"}},{"id":"15","num":"15","title":"Lowest point of a quadratic curve","difficulty":"Easy","tests":22,"solution":"solutions/p15_bezier_min_y.cpp","problem":"problems/15-bezier-min-y.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 15 - Lowest point of a quadratic curve\n//\n// Problem:  problems/15-bezier-min-y.md (also in the web problem book)\n// Check:    .\\check 15\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p15.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p15_bezier_min_y.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 15 - Lowest point of a quadratic curve\n//\n// Problem:  problems/15-bezier-min-y.md (also in the web problem book)\n// Check:    .\\check 15\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on minY().\n\n#include <algorithm>\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"NotImplemented.h\"\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\n// The smallest y on the curve that starts at p1, is pulled toward the control\n// point p2 and ends at p3, over 0 <= t <= 1. Only the y coordinates matter.\ndouble minY(const Vec2 p1, const Vec2 p2, const Vec2 p3) {\n  // TODO: see \"Where the lowest point can be\" on the problem page.\n  throw NotImplemented(\"minY\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// Whole numbers print plainly; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\n// Usage: p15 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      // curve p1x p1y p2x p2y p3x p3y\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(minY(p1, p2, p3)) << '\\n';\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","avoiding a division by zero","<code>nan<\/code>"],"text":["floating-point arithmetic (double)","avoiding a division by zero","nan"]},{"label":"Library","items":["<code>std::min<\/code> (<code>&lt;algorithm&gt;<\/code>)"],"text":["std::min (<algorithm>)"]},{"label":"Concepts","items":["quadratic Bezier curve as a polynomial in t","turning point of a parabola","minimum over a closed interval","straight and flat curves","screen coordinates with y pointing down"],"text":["quadratic Bezier curve as a polynomial in t","turning point of a parabola","minimum over a closed interval","straight and flat curves","screen coordinates with y pointing down"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads quadratic Bezier curves and prints, for each one, the smallest y that the curve reaches.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p15_bezier_min_y.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p15_bezier_min_y.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>minY()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Every line of the input file has the same form:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>curve p1x p1y p2x p2y p3x p3y<\/code><\/td><td>The curve starts at p1, is pulled toward the control point p2, and ends at p3.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>It is the curve from checkpoint 10: the point at parameter t is (1 − t)² p1 + 2(1 − t)t p2 + t² p3, for t from 0 to 1.<\/p>\n<h3>Output<\/h3>\n<p>One line per input line, in the same order: the smallest y of any point on the curve, for t from 0 to 1 inclusive.<\/p>\n<p>The checker accepts any number within 0.001 of the expected value. When a value isn't whole, print enough decimals to be within 0.001 (4 is plenty). The boilerplate's <code>number()<\/code> does this: whole numbers plainly, others rounded to 4 decimals with trailing zeros dropped (<code>37.5<\/code>, <code>0.0625<\/code>). Don't round to a whole number.<\/p>\n<h3>The curve's height as a polynomial<\/h3>\n<p>Only y matters here. Multiplying out the curve's formula for y gives<\/p>\n<pre><code>y(t) = a t² + b t + y1,    where a = y1 − 2 y2 + y3   and   b = 2 (y2 − y1)<\/code><\/pre>\n<p>with y1, y2, y3 the y coordinates of p1, p2, p3.<\/p>\n<h3>Where the lowest point can be<\/h3>\n<p>On 0 ≤ t ≤ 1, the lowest point is at one of the ends, y(0) = y1 or y(1) = y3, or at the <strong>turning point<\/strong>, where y stops falling and starts rising. There the slope 2at + b is 0:<\/p>\n<pre><code>t* = −b / (2a),     y(t*) = a t*² + b t* + y1<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>a<\/th><th>Shape<\/th><th>Smallest y<\/th><\/tr><\/thead><tbody><tr><td>a &gt; 0<\/td><td>a valley: the turning point is the lowest point of the whole parabola<\/td><td>y(t*) if 0 &lt; t* &lt; 1; otherwise min(y1, y3)<\/td><\/tr><tr><td>a &lt; 0<\/td><td>a hill: the turning point is the <strong>highest<\/strong> point<\/td><td>min(y1, y3)<\/td><\/tr><tr><td>a = 0, b ≠ 0<\/td><td>straight: y changes at a steady rate<\/td><td>min(y1, y3)<\/td><\/tr><tr><td>a = 0, b = 0<\/td><td>flat: y1 = y2 = y3<\/td><td>y1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A shorter way to say the same thing: take the smallest of y1, y3, and y(t*) when a &gt; 0 and t* is between 0 and 1. Don't compute t* when a = 0: it divides by zero.<\/p>\n<p><strong>Decimal inputs and a = 0.<\/strong> Coordinates like 0.1 aren't exact in binary, so for a curve that is really straight, a can come out as a tiny non-zero number such as 1e-17 instead of 0. That's harmless if you only use t* when a &gt; 0 and 0 &lt; t* &lt; 1: for such a curve t* lands far outside [0, 1], or y(t*) is within rounding of an endpoint. No <code>a == 0<\/code> comparison is needed.<\/p>\n<h3>Screen coordinates<\/h3>\n<p>The blog uses this after the outline has been scaled to pixels and flipped so that y points down (row 0 at the top of the image). There, the smallest y is the curve's highest point on screen. The blog returns it as a whole number (<code>static_cast&lt;int&gt;<\/code>, which drops the fraction) because it compares it with integer row numbers. This checkpoint asks for the exact minimum instead. The tests use both font units (y up) and screen coordinates (y down); the rule is the same.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A curve that only rises or only falls has its minimum at an end.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A valley whose turning point lies inside the curve (0 &lt; t* &lt; 1) has its minimum there.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A turning point outside 0 ≤ t ≤ 1 doesn't count. The minimum is then at an end.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Straight curves (a = 0) and flat ones (a = b = 0) work, with no division by zero.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>For a curve that bulges upward (a &lt; 0), the turning point is the highest point, so the minimum is at an end.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate is between −1000 and 1000 and has at most 4 digits after the decimal point.<\/li><li>A test has from 1 to 74 lines.<\/li><li>There are 22 tests: hand-made curves for each rule, random curves, and every curve of 'o' and 'S' (JetBrains Mono Bold) and 'あ' (Noto Sans JP), plus 'S' scaled and flipped into screen coordinates.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p15_bezier_min_y.cpp","text":"// Reference solution - checkpoint 15 (lowest point of a quadratic curve).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <algorithm>\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\n// The smallest y on the curve p1 (start), p2 (control), p3 (end) for 0 <= t <= 1.\ndouble minY(const Vec2 p1, const Vec2 p2, const Vec2 p3) {\n  // y(t) = a t^2 + b t + p1.y\n  const double a = p1.y - 2 * p2.y + p3.y;\n  const double b = 2 * (p2.y - p1.y);\n  double lowest = std::min(p1.y, p3.y);  // the ends are always candidates\n  if (a > 0) {                           // a valley: its turning point is the lowest point\n    const double t = -b / (2 * a);\n    if (t > 0 && t < 1) lowest = std::min(lowest, (a * t + b) * t + p1.y);\n  }\n  return lowest;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(minY(p1, p2, p3)) << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":22,"total":22,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the blog tells the story behind it. In the blog's <strong>\"Renderer: Filling Glyph\"<\/strong> section, read <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a> up to the formula for the t where the curve turns. The author's code (the listing \"Find a minimum curve of a quad Bézier curve\") comes right after it. Checkpoint 10 covers the curve itself.<\/p>","context":"<p>The even-odd fill of checkpoint 14 counts where each row's horizontal line crosses the outline. Where an edge only touches a row, or two edges meet exactly on it, the hits can be counted twice or missed, and the row comes out wrong. The blog repairs this by looking at how far each edge reaches above the row before counting its hits. For a curved edge, that needs the curve's smallest y, which is what this checkpoint computes.<\/p>","sources":"<ul><li>Pomax, <em>A Primer on Bézier Curves<\/em>, <a href=\"https://pomax.github.io/bezierinfo/#components\" target=\"_blank\" rel=\"noopener\">Component functions<\/a> and <a href=\"https://pomax.github.io/bezierinfo/#extremities\" target=\"_blank\" rel=\"noopener\">Finding extremities: root finding<\/a>, on treating x and y separately and finding where the derivative is 0<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Quadratic_function#Vertex\" target=\"_blank\" rel=\"noopener\">Quadratic function: vertex<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>, on the quadratic curves in TrueType outlines<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 15                          run every test\n.\\check 15 -Case 15-R3-after-end    one test, showing its full input, expected output and your output\n.\\check 15 -Fresh                   a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 15 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  A turning point outside 0 &lt;= t &lt;= 1 doesn&#x27;t count ....................    0 / 4   FAILED\n      x 15-R3-before-start  turning point at t = -0.5 (y = -0.5 there, off the curve)\n          line 1: expected `0`, got `-0.5`\n          expected values from: exact arithmetic with Python fractions.Fraction, checked against 2001 samples of the curve\n          reproduce: build/p15.exe build/cases/15/15-R3-before-start.in build/cases/15/15-R3-before-start.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Forget x. Write y(t) as a t² + b t + y1 and sketch the three shapes it can have on 0 ≤ t ≤ 1: a valley, a hill or a straight line. Where can the lowest point of each one be?<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>The two ends are always candidates. The turning point is a candidate only when a &gt; 0 and it lies between t = 0 and t = 1. Take the smallest candidate. Check yourself on Examples 1 and 2.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A turning point outside 0 ≤ t ≤ 1 is not on the curve (R3).<\/li><li>When a &lt; 0 the turning point is the top of a hill, not the bottom (R5). If you return y(t*) whenever t* is in range, you return the highest point.<\/li><li>When a = 0, −b / (2a) is ±infinity, or <code>nan<\/code> (0 / 0) when b is also 0. A <code>nan<\/code> that reaches <code>std::min<\/code> can come out as the answer, depending on the argument order. Handle a = 0 before dividing (R4).<\/li><li>A straight curve can fall: when a = 0 the answer is min(y1, y3), not always y1.<\/li><li>Keep the fraction. The blog's whole-number result would turn −1.25 into −1.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>minY(p1, p2, p3):\n    a = p1.y - 2*p2.y + p3.y\n    b = 2*(p2.y - p1.y)\n    lowest = min(p1.y, p3.y)\n    if a &gt; 0:\n        t = -b / (2*a)\n        if 0 &lt; t &lt; 1:\n            lowest = min(lowest, a*t*t + b*t + p1.y)\n    return lowest<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a valley","test":"15-R2-asymmetric","input":"curve 0 30 40 -20 100 10","output":"-1.25","image":null,"explain":"<p>a = 30 − 2·(−20) + 10 = 80 and b = 2·(−20 − 30) = −100, so t* = 100 / 160 = 0.625, which is inside the curve. y(0.625) = 80 · 0.390625 − 100 · 0.625 + 30 = −1.25. Both ends are higher (30 and 10).<\/p>"},{"label":"Example 2","name":"the turning point is past the end","test":"15-R3-after-end","input":"curve 0 40 50 10 100 0","output":"0","image":null,"explain":"<p>a = 40 − 20 + 0 = 20 and b = 2·(10 − 40) = −60, so t* = 1.5. The curve is still going down when it stops at t = 1, so the answer is min(40, 0) = 0. Evaluating y at t* would give −5, a point on the parabola beyond the curve's end.<\/p>"},{"label":"Example 3","name":"hills","test":"15-R5-hill","input":"curve 0 0 5 10 10 4\ncurve 0 6 5 20 10 2","output":"0\n2","image":null,"explain":"<p>On the first line a = 0 − 20 + 4 = −16, a hill. Its turning point, t* = 0.625 with y = 6.25, is the top of the curve. The lowest point is the lower end: min(0, 4) = 0.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=minimum%20curve%20of%20a%20quad\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> is one function, <code>getBezierMinY<\/code>, that takes the three points and returns an <code>int<\/code>. It computes a and b as on this page. If |a| is below a small eps it returns p1.y when |b| is also tiny, and min(p1.y, p3.y) otherwise. Else it computes t*, and returns y(t*) when t* lies in [−eps, 1 + eps] and a &gt; 0, and min(p1.y, p3.y) in every other case. That is the table above, branch by branch.<\/p>\n<p><strong>Something to look for:<\/strong> the result goes through <code>static_cast&lt;int&gt;<\/code>, which drops the fraction by rounding toward zero. On screen, where y is positive, that is the same as rounding down, so 61.875 becomes 61 and the comparison with the integer row still works. For a negative y it rounds up instead (−1.25 becomes −1). This checkpoint asks for the exact value, so a solution that copies the cast fails R2.<\/p>"}},{"id":"16","num":"16","title":"Fill a polygon: non-zero rule","difficulty":"Medium","tests":24,"solution":"solutions/p16_nonzero_lines.cpp","problem":"problems/16-nonzero-lines.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 16 - Fill a polygon: non-zero rule\n//\n// Problem:  problems/16-nonzero-lines.md (also in the web problem book)\n// Check:    .\\check 16\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p16.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p16_nonzero_lines.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 16 - Fill a polygon: non-zero rule\n//\n// Problem:  problems/16-nonzero-lines.md (also in the web problem book)\n// Check:    .\\check 16\n//\n// Only the picture your program writes is checked, so structure this however you\n// like, or use another language or library (see README.md). The input/output code at\n// the bottom is provided so you can focus on fillOutline().\n\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"NotImplemented.h\"\n#include \"provided/Canvas.h\"  // Canvas: set(x, y, rgb), drawSpan(row, x0, x1, rgb) fills x0..x1 inclusive\n                              // (nothing if x0 > x1), writePng(path)\n\nstruct Point {\n  double x = 0;\n  double y = 0;\n  bool onCurve = true;\n};\n\n// One outline in glyph coordinates (y up). In this checkpoint every point is on-curve,\n// so every edge is a straight line.\nstruct Outline {\n  std::vector<int> endPtsOfContours;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) is drawn at pixel (x0 + scale * x, baseline - scale * y).\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\n// Fills every pixel whose centre is inside `outline` by the non-zero winding rule.\nvoid fillOutline(Canvas& canvas, const Outline& outline, const Placement& place, const RGB color) {\n  // TODO: scanline fill (see the problem page).\n  throw NotImplemented(\"fillOutline\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\n// Usage: p16 <input-file> <output-png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    int width = 0, height = 0;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<Outline> outlines;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"canvas\") {  // canvas <width> <height>\n        words >> width >> height;\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r, g, b;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {\n        outlines.emplace_back();\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ...\n        Point p;\n        std::string on;\n        while (words >> p.x >> p.y >> on) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    Canvas canvas(width, height);  // black to begin with\n    for (const Outline& outline : outlines) fillOutline(canvas, outline, place, color);\n    if (!canvas.writePng(argv[2])) throw std::runtime_error(\"cannot write the PNG\");\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["sorting pairs","signed counters"],"text":["sorting pairs","signed counters"]},{"label":"Library","items":["<code>std::vector<\/code>","<code>std::sort<\/code>"],"text":["std::vector","std::sort"]},{"label":"Concepts","items":["the non-zero winding rule","edge direction","scanline filling","half-open intervals"],"text":["the non-zero winding rule","edge direction","scanline filling","half-open intervals"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that fills polygon outlines on a black canvas with the non-zero rule and writes the picture as a PNG.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p16_nonzero_lines.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p16_nonzero_lines.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, creates the canvas and writes the PNG; you fill in <code>fillOutline()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Outline point (x, y) goes to pixel position (x0 + scale·x, baseline − scale·y). y grows up in the outline and down on the screen.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The fill colour<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline; its <code>ends<\/code> and <code>points<\/code> lines follow<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, counting from 0: contour k runs from the point after the previous end up to and including <code>e_k<\/code><\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; on ...<\/code><\/td><td>The outline's points. <strong>In this checkpoint every point is on-curve<\/strong>, so every edge is a straight line.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There can be several outlines. Fill each one on its own, one after another, in the same colour: the winding count is per outline, and a pixel ends up painted if any outline fills it.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) of exactly <code>width<\/code> x <code>height<\/code> pixels, black to begin with. A pixel is painted in the fill colour when its <strong>centre<\/strong> is inside an outline by the non-zero rule. Pixel (px, py), with py counted down from the top, has its centre at screen position (px + 0.5, py + 0.5).<\/p>\n<p>The checker forgives edges that move by one pixel, so sampling at the top of each row instead of the centre, or rounding x differently, still passes. Missing or extra shapes and stray lines don't.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>. <code>include/provided/Canvas.h<\/code> does all of this for you; the boilerplate uses it.<\/p>\n<h3>The non-zero rule<\/h3>\n<p>Each contour is closed (after its last point it continues to its first), and every edge has a direction: from a point to the next one. Draw a ray from the point to the right. Start a count at 0; for each edge the ray crosses, add 1 if the edge goes up the screen and subtract 1 if it goes down (either sign convention works, as long as it's the same for all edges). The point is inside when the final count is <strong>not zero<\/strong>.<\/p>\n<ul><li>Two overlapping contours that go the same way give a count of 2 where they overlap: still inside, so there is no hole. (Even-odd would leave one.)<\/li><li>A contour inside another that goes the opposite way gives 1 − 1 = 0: a hole. This is how fonts make the inside of an <code>o<\/code> or a <code>#<\/code>.<\/li><li>A contour that goes counter-clockwise on its own gives −1: inside. Test \"not zero\", not \"greater than zero\".<\/li><\/ul>\n<p>With a scanline: collect each crossing as (x, direction), sort by x, walk left to right keeping a running count, and fill the stretches where the count isn't zero.<\/p>\n<p><strong>Vertices on the scanline.<\/strong> As in checkpoint 14, treat each edge as half-open in y: it counts at scanline y when min(y0, y1) ≤ y &lt; max(y0, y1), with y measured on the screen (pixels, growing downward), and horizontal edges never count. Clamp crossing x values to the canvas before converting them to integers. The provided <code>drawSpan(row, x0, x1)<\/code> fills x0 ... x1 inclusive and does nothing when x0 &gt; x1. Then a vertex the outline passes through counts once, with the right direction.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Pixels whose centre is inside are filled; every other pixel stays black.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Where contours going the same way overlap, the overlap is filled.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A contour going the opposite way inside another cuts a hole.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A contour going counter-clockwise on its own is still filled.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Vertices exactly on a scanline are counted correctly.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Several outlines are filled one after another (their union).<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Placement and scale are applied; anything outside the canvas is clipped.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every point is on-curve. Canvases are at most about 560 x 560 pixels.<\/li><li>Every contour has at least 2 points.<\/li><li>There are 24 tests: hand-made polygons for each rule, straight-line letters from JetBrains Mono Bold, and straight-line characters from Noto Sans JP (random picks change with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p16_nonzero_lines.cpp","text":"// Reference solution - checkpoint 16 (fill a polygon, non-zero rule).\n// SPOILERS: try the checkpoint yourself first. The work is in common/fill.h.\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"common/scene.h\"\n\nint main(int argc, char** argv) { return fill::run(argc, argv, fill::Rule::NonZero); }\n"},{"path":"common/scene.h","text":"#pragma once\n// Reference input reading for the fill checkpoints (14, 16, 17). SPOILERS.\n//\n//   canvas <w> <h>\n//   place <x0> <baseline> <scale>\n//   color <r> <g> <b>\n//   outline            (then `ends ...` and `points x y on|off ...`; repeatable)\n\n#include <cstdio>\n#include <fstream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"fill.h\"\n\nnamespace fill {\n\nstruct Scene {\n  int width = 0, height = 0;\n  Placement place;\n  RGB color{255, 255, 255};\n  std::vector<Outline> outlines;\n};\n\ninline Scene readScene(const std::string& path) {\n  std::ifstream in(path);\n  if (!in) throw std::runtime_error(\"cannot open \" + path);\n  Scene s;\n  for (std::string line; std::getline(in, line);) {\n    std::istringstream words(line);\n    std::string key;\n    words >> key;\n    if (key == \"canvas\") {\n      words >> s.width >> s.height;\n    } else if (key == \"place\") {\n      words >> s.place.x0 >> s.place.baseline >> s.place.scale;\n    } else if (key == \"color\") {\n      int r, g, b;\n      words >> r >> g >> b;\n      s.color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n    } else if (key == \"outline\") {\n      s.outlines.emplace_back();\n    } else if (key == \"ends\") {\n      for (int e; words >> e;) s.outlines.back().ends.push_back(e);\n    } else if (key == \"points\") {\n      Point p;\n      std::string on;\n      while (words >> p.x >> p.y >> on) {\n        p.onCurve = on == \"on\";\n        s.outlines.back().points.push_back(p);\n      }\n    }\n  }\n  return s;\n}\n\ninline int run(int argc, char** argv, const Rule rule) {\n  if (argc != 3) return 2;\n  try {\n    const Scene s = readScene(argv[1]);\n    Canvas canvas(s.width, s.height);\n    for (const Outline& o : s.outlines) fillOutline(canvas, o, s.place, rule, s.color);\n    return canvas.writePng(argv[2]) ? 0 : 1;\n  } catch (const std::exception& e) {\n    fprintf(stderr, \"error: %s\\n\", e.what());\n    return 1;\n  }\n}\n\n}  // namespace fill\n"},{"path":"common/fill.h","text":"#pragma once\n// Reference fill engine shared by the reference solutions of checkpoints 14, 16,\n// 17 and 18. SPOILERS: try those checkpoints yourself first.\n//\n// A pixel is filled when its centre is inside the outline. Every row is scanned\n// through the pixel centres; outline edges are split into pieces that are monotone\n// in y, so each piece crosses a scanline at most once (half-open in y, which\n// counts a shared vertex exactly once).\n\n#include <algorithm>\n#include <cmath>\n#include <utility>\n#include <vector>\n\n#include \"provided/Canvas.h\"\n\nnamespace fill {\n\nstruct Point {\n  double x = 0, y = 0;\n  bool onCurve = true;\n};\n\nstruct Outline {\n  std::vector<int> ends;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) -> pixel (x0 + scale*x, baseline - scale*y).\nstruct Placement {\n  double x0 = 0, baseline = 0, scale = 1;\n};\n\nenum class Rule { EvenOdd, NonZero };\n\nstruct Vec {\n  double x = 0, y = 0;\n};\n\n// A line (curve == false) or a quadratic curve from p0 via c to p1, monotone in y.\nstruct Piece {\n  Vec p0, c, p1;\n  bool curve = false;\n};\n\ninline Vec mid(const Vec a, const Vec b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\n// Splits a quadratic curve at its turning point in y, if it has one inside.\ninline void addCurve(const Vec p0, const Vec c, const Vec p1, std::vector<Piece>& out) {\n  const double denom = p0.y - 2 * c.y + p1.y;\n  if (std::abs(denom) > 1e-12) {\n    const double t = (p0.y - c.y) / denom;\n    if (t > 1e-9 && t < 1 - 1e-9) {\n      const Vec a = {p0.x + (c.x - p0.x) * t, p0.y + (c.y - p0.y) * t};\n      const Vec b = {c.x + (p1.x - c.x) * t, c.y + (p1.y - c.y) * t};\n      const Vec m = {a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t};\n      out.push_back({p0, a, m, true});\n      out.push_back({m, b, p1, true});\n      return;\n    }\n  }\n  out.push_back({p0, c, p1, true});\n}\n\n// The outline's edges in pixel space, with the implied on-curve points between\n// consecutive off-curve points, and contours that start off-curve handled.\ninline std::vector<Piece> pieces(const Outline& o, const Placement& at) {\n  std::vector<Piece> out;\n  int start = 0;\n  for (const int end : o.ends) {\n    std::vector<std::pair<Vec, bool>> pts;\n    for (int i = start; i <= end; ++i) {\n      const Point& p = o.points[i];\n      pts.push_back({{at.x0 + at.scale * p.x, at.baseline - at.scale * p.y}, p.onCurve});\n    }\n    start = end + 1;\n    if (pts.empty()) continue;\n\n    // Make every implied on-curve point explicit.\n    std::vector<std::pair<Vec, bool>> full;\n    for (std::size_t i = 0; i < pts.size(); ++i) {\n      const auto& p = pts[i];\n      const auto& next = pts[(i + 1) % pts.size()];\n      full.push_back(p);\n      if (!p.second && !next.second) full.push_back({mid(p.first, next.first), true});\n    }\n    const auto first = std::find_if(full.begin(), full.end(), [](const auto& p) { return p.second; });\n    if (first == full.end()) continue;  // a single off-curve point: nothing to fill\n    std::rotate(full.begin(), first, full.end());\n\n    Vec current = full[0].first;\n    for (std::size_t i = 1; i <= full.size(); ++i) {\n      const auto& p = full[i % full.size()];\n      if (p.second) {\n        out.push_back({current, current, p.first, false});\n        current = p.first;\n      } else {\n        const Vec end = full[(i + 1) % full.size()].first;  // always on-curve now\n        addCurve(current, p.first, end, out);\n        current = end;\n        ++i;\n      }\n    }\n  }\n  return out;\n}\n\nstruct Crossing {\n  double x = 0;\n  int direction = 0;  // +1 going down the screen, -1 going up\n};\n\n// Where a monotone piece crosses the horizontal line y = scanY (half-open in y).\ninline bool cross(const Piece& p, const double scanY, Crossing& out) {\n  const double y0 = p.p0.y, y1 = p.p1.y;\n  if (y0 == y1) return false;\n  if (!(std::min(y0, y1) <= scanY && scanY < std::max(y0, y1))) return false;\n  out.direction = y1 > y0 ? 1 : -1;\n  if (!p.curve) {\n    const double t = (scanY - y0) / (y1 - y0);\n    out.x = p.p0.x + (p.p1.x - p.p0.x) * t;\n    return true;\n  }\n  const double a = y0 - 2 * p.c.y + y1, b = 2 * (p.c.y - y0), c = y0 - scanY;\n  double t;\n  if (std::abs(a) < 1e-12) {\n    t = -c / b;\n  } else {\n    const double disc = std::max(0.0, b * b - 4 * a * c);\n    const double r1 = (-b + std::sqrt(disc)) / (2 * a), r2 = (-b - std::sqrt(disc)) / (2 * a);\n    const auto dist = [](const double r) { return r < 0 ? -r : (r > 1 ? r - 1 : 0); };\n    t = dist(r1) <= dist(r2) ? r1 : r2;  // the piece is monotone: one root is in [0, 1]\n  }\n  t = std::clamp(t, 0.0, 1.0);\n  const double u = 1 - t;\n  out.x = u * u * p.p0.x + 2 * u * t * p.c.x + t * t * p.p1.x;\n  return true;\n}\n\n// Fills one outline: every pixel whose centre is inside it by `rule`.\ninline void fillOutline(Canvas& canvas, const Outline& o, const Placement& at, const Rule rule,\n                        const RGB color) {\n  const std::vector<Piece> edges = pieces(o, at);\n  if (edges.empty()) return;\n  double top = 1e300, bottom = -1e300;\n  for (const Piece& e : edges) {\n    top = std::min({top, e.p0.y, e.c.y, e.p1.y});\n    bottom = std::max({bottom, e.p0.y, e.c.y, e.p1.y});\n  }\n  const int firstRow = std::max(0, static_cast<int>(std::floor(top)) - 1);\n  const int lastRow = std::min(canvas.height() - 1, static_cast<int>(std::ceil(bottom)) + 1);\n\n  std::vector<Crossing> crossings;\n  for (int row = firstRow; row <= lastRow; ++row) {\n    const double scanY = row + 0.5;\n    crossings.clear();\n    for (const Piece& e : edges) {\n      Crossing c;\n      if (cross(e, scanY, c)) crossings.push_back(c);\n    }\n    std::sort(crossings.begin(), crossings.end(), [](const Crossing& a, const Crossing& b) { return a.x < b.x; });\n    int winding = 0;\n    for (std::size_t i = 0; i + 1 < crossings.size(); ++i) {\n      winding += rule == Rule::EvenOdd ? 1 : crossings[i].direction;\n      const bool inside = rule == Rule::EvenOdd ? (winding % 2 != 0) : (winding != 0);\n      if (!inside) continue;\n      // Pixels whose centre x + 0.5 lies in [crossings[i].x, crossings[i + 1].x).\n      const int from = static_cast<int>(std::ceil(crossings[i].x - 0.5));\n      const int to = static_cast<int>(std::ceil(crossings[i + 1].x - 0.5)) - 1;\n      if (from <= to) canvas.drawSpan(row, from, to, color);\n    }\n  }\n}\n\n}  // namespace fill\n"}],"proof":{"passed":24,"total":24,"date":"2026-10-21"},"uses":["include/provided/Canvas.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a> section up to the sentence about considering only line segments for now. The author's code comes right after it.<\/p>","context":"<p>Checkpoint 14 filled glyphs with the even-odd rule, which leaves a hole wherever two contours overlap. Fonts are designed for the non-zero rule, which doesn't. This checkpoint fills outlines made only of straight lines with the non-zero rule; checkpoint 17 adds curves.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Nonzero-rule\" target=\"_blank\" rel=\"noopener\">Nonzero-rule<\/a><\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: contour direction<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 16                         run every test\n.\\check 16 -Case 16-R4-reversed    one test: its input, and where the expected and your pictures are\n.\\check 16 -Fresh                  new random glyphs (new seed)\n.\\check 16 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Start from your checkpoint 14 scanline fill, if you have one. The edges and crossings are the same; only what you do with the sorted crossings changes.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>For each crossing, record its x and whether the edge goes down or up the screen (+1 or −1). Sort by x, walk left to right adding the directions, and fill each stretch between two crossings where the running count isn't zero.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>\"Inside\" is count ≠ 0. A lone counter-clockwise contour gives −1 and must be filled.<\/li><li>The direction comes from the edge's own order (point i to point i + 1), not from its endpoints sorted by y.<\/li><li>Keep the half-open rule (min ≤ y &lt; max) and skip horizontal edges.<\/li><li>The last point connects back to the first point of its contour, not of the outline.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>edges = [(p[i], p[i+1]) for each contour, wrapping at its end], mapped to pixels\nfor row in 0 .. height-1:\n    y = row + 0.5\n    crossings = []\n    for (a, b) in edges:\n        if min(a.y, b.y) &lt;= y &lt; max(a.y, b.y):\n            x = a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y)\n            crossings.append((x, +1 if b.y &gt; a.y else -1))\n    sort crossings by x\n    count = 0\n    for i in 0 .. len(crossings) - 2:\n        count += crossings[i].direction\n        if count != 0:\n            fill pixels px with crossings[i].x &lt;= px + 0.5 &lt; crossings[i+1].x<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a pentagram","test":"16-R2-star","input":"canvas 205 195\nplace 2 206 2\ncolor 255 255 255\noutline\nends 4\npoints 50 100 on 79 9 on 2 65 on 98 65 on 21 9 on","output":null,"image":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAM0AAADDCAIAAACu1AJOAAAH9klEQVR4XmMYBaMhMBoCoyEwGgKjITAaAqMhMBoCo tretch only when the count before it is greater than zero (and the count after it isn't negative). That works for fonts whose outer contours are all clockwise, but a contour wound the other way on its own (test <code>16-R4-reversed<\/code>) stays empty. The non-zero rule fills whenever the count isn't zero.<\/p>"}},{"id":"17","num":"17","title":"Fill a glyph: non-zero rule","difficulty":"Hard","tests":24,"solution":"solutions/p17_nonzero_curves.cpp","problem":"problems/17-nonzero-curves.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 17 - Fill a glyph: non-zero rule\n//\n// Problem:  problems/17-nonzero-curves.md (also in the web problem book)\n// Check:    .\\check 17\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p17.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p17_nonzero_curves.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 17 - Fill a glyph: non-zero rule\n//\n// Problem:  problems/17-nonzero-curves.md (also in the web problem book)\n// Check:    .\\check 17\n//\n// Only the picture your program writes is checked, so structure this however you\n// like, or use another language or library (see README.md). The input/output code at\n// the bottom is provided so you can focus on fillOutline().\n\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"NotImplemented.h\"\n#include \"provided/Canvas.h\"  // Canvas: set(x, y, rgb), drawSpan(row, x0, x1, rgb) fills x0..x1 inclusive\n                              // (nothing if x0 > x1), writePng(path)\n\nstruct Point {\n  double x = 0;\n  double y = 0;\n  bool onCurve = true;\n};\n\n// One outline in glyph coordinates (y up), as checkpoints 07 and 09 produce it.\nstruct Outline {\n  std::vector<int> endPtsOfContours;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) is drawn at pixel (x0 + scale * x, baseline - scale * y).\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\n// Fills every pixel whose centre is inside `outline` by the non-zero winding rule.\nvoid fillOutline(Canvas& canvas, const Outline& outline, const Placement& place, const RGB color) {\n  // TODO: scanline fill (see the problem page).\n  throw NotImplemented(\"fillOutline\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\n// Usage: p17 <input-file> <output-png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    int width = 0, height = 0;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<Outline> outlines;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"canvas\") {  // canvas <width> <height>\n        words >> width >> height;\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r, g, b;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {\n        outlines.emplace_back();\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ...\n        Point p;\n        std::string on;\n        while (words >> p.x >> p.y >> on) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    Canvas canvas(width, height);  // black to begin with\n    for (const Outline& outline : outlines) fillOutline(canvas, outline, place, color);\n    if (!canvas.writePng(argv[2])) throw std::runtime_error(\"cannot write the PNG\");\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["sorting","solving a quadratic equation","floating-point care"],"text":["sorting","solving a quadratic equation","floating-point care"]},{"label":"Library","items":["<code>std::vector<\/code>","<code>std::sort<\/code>","<code>std::sqrt<\/code>"],"text":["std::vector","std::sort","std::sqrt"]},{"label":"Concepts","items":["the non-zero winding rule","quadratic Bézier curves","implied on-curve points","curve direction","splitting curves at their y extremes"],"text":["the non-zero winding rule","quadratic Bézier curves","implied on-curve points","curve direction","splitting curves at their y extremes"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that fills glyph outlines on a black canvas with the non-zero rule and writes the picture as a PNG.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p17_nonzero_curves.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p17_nonzero_curves.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, creates the canvas and writes the PNG; you fill in <code>fillOutline()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Glyph point (x, y) goes to pixel position (x0 + scale·x, baseline − scale·y). y grows up in the glyph and down on the screen.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The fill colour<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline; its <code>ends<\/code> and <code>points<\/code> lines follow<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, counting from 0: contour k runs from the point after the previous end up to and including <code>e_k<\/code><\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>The outline's points; coordinates may be fractional<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There can be several outlines. Fill each one on its own, one after another, in the same colour. Compound glyphs arrive already resolved into one outline (checkpoint 09's job).<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) of exactly <code>width<\/code> x <code>height<\/code> pixels, black to begin with. A pixel is painted in the fill colour when its <strong>centre<\/strong> (px + 0.5, py + 0.5) is inside an outline by the non-zero rule. The checker forgives edges that move by one pixel; missing or extra shapes and stray lines fail.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>. <code>include/provided/Canvas.h<\/code> does all of this for you; the boilerplate uses it.<\/p>\n<h3>From points to edges<\/h3>\n<p>Each contour is closed: after its last point it continues to its first.<\/p>\n<ul><li>Two on-curve points in a row are joined by a straight line.<\/li><li>An off-curve point is the control point of a quadratic Bézier curve from the previous on-curve point to the next one: B(t) = (1−t)²·P0 + 2(1−t)t·P1 + t²·P2 for t from 0 to 1.<\/li><li>Between two off-curve points next to each other there is an <strong>implied on-curve point<\/strong> halfway between them.<\/li><li>A contour can start with an off-curve point, or consist only of off-curve points.<\/li><\/ul>\n<h3>The non-zero rule with curves<\/h3>\n<p>Every edge has a direction, from a point to the next one. For each place a scanline crosses the outline, note the x and whether the outline is going down or up the screen there (+1 or −1). Sort by x, keep a running count from left to right, and fill wherever the count isn't zero.<\/p>\n<p><strong>Where a piece crosses the scanline.<\/strong> For a line, interpolate. For a curve piece, solve y(t) = scanline y, a quadratic in t: a·t² + b·t + c = 0 with a = y0 − 2·y1 + y2, b = 2·(y1 − y0) and c = y0 − scanline y (linear when a = 0). After the split below exactly one root lies in [0, 1]; its x is (1−t)²·x0 + 2(1−t)t·x1 + t²·x2. Bisection on t also works, since each piece is monotone.<\/p>\n<p><strong>A curve can cross one scanline twice.<\/strong> At the bottom of a <code>U<\/code>, the curve goes down then up, so its two crossings have opposite directions. Split each curve at the point where its y turns around: for y(t) = (1−t)²·y0 + 2(1−t)t·y1 + t²·y2 that is t = (y0 − y1) / (y0 − 2·y1 + y2), when the denominator isn't 0 and t is strictly between 0 and 1. Each piece then goes only up or only down, crosses a scanline at most once, and its direction is simply whether its end is below its start.<\/p>\n<p><strong>Vertices and touching scanlines.<\/strong> Treat every piece as half-open in y: it counts at scanline y when min(y_start, y_end) ≤ y &lt; max(y_start, y_end). A scanline that just touches a curve's extreme then counts it twice with opposite directions (the extreme is the smaller y of both pieces) or not at all (the extreme is the larger y of both), which doesn't change the result either way.<\/p>\n<p><strong>Clipping.<\/strong> Crossings can lie far outside the canvas, especially at large scales. Clamp x to the canvas before converting it to an integer pixel index: converting a huge double to <code>int<\/code> is undefined behaviour in C++.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Curved outlines fill exactly the pixels whose centre is inside.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Implied on-curve points, and contours that start with or consist only of off-curve points.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Where curved contours going the same way overlap, the overlap is filled.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A contour going the opposite way inside another cuts a hole.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A scanline that crosses one curve twice, or just touches it, is counted correctly.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Several outlines are filled one after another; compound glyphs arrive as one outline.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Placement and scale are applied; anything outside the canvas is clipped.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Canvases are at most about 560 x 560 pixels; outlines have at most a few hundred points.<\/li><li>Every contour has at least 2 points.<\/li><li>There are 24 tests: hand-made curved shapes for each rule, letters from JetBrains Mono Bold, characters from Noto Sans JP, and 7 random glyphs (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p17_nonzero_curves.cpp","text":"// Reference solution - checkpoint 17 (fill a glyph, non-zero rule).\n// SPOILERS: try the checkpoint yourself first. The work is in common/fill.h.\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"common/scene.h\"\n\nint main(int argc, char** argv) { return fill::run(argc, argv, fill::Rule::NonZero); }\n"},{"path":"common/scene.h","text":"#pragma once\n// Reference input reading for the fill checkpoints (14, 16, 17). SPOILERS.\n//\n//   canvas <w> <h>\n//   place <x0> <baseline> <scale>\n//   color <r> <g> <b>\n//   outline            (then `ends ...` and `points x y on|off ...`; repeatable)\n\n#include <cstdio>\n#include <fstream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"fill.h\"\n\nnamespace fill {\n\nstruct Scene {\n  int width = 0, height = 0;\n  Placement place;\n  RGB color{255, 255, 255};\n  std::vector<Outline> outlines;\n};\n\ninline Scene readScene(const std::string& path) {\n  std::ifstream in(path);\n  if (!in) throw std::runtime_error(\"cannot open \" + path);\n  Scene s;\n  for (std::string line; std::getline(in, line);) {\n    std::istringstream words(line);\n    std::string key;\n    words >> key;\n    if (key == \"canvas\") {\n      words >> s.width >> s.height;\n    } else if (key == \"place\") {\n      words >> s.place.x0 >> s.place.baseline >> s.place.scale;\n    } else if (key == \"color\") {\n      int r, g, b;\n      words >> r >> g >> b;\n      s.color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n    } else if (key == \"outline\") {\n      s.outlines.emplace_back();\n    } else if (key == \"ends\") {\n      for (int e; words >> e;) s.outlines.back().ends.push_back(e);\n    } else if (key == \"points\") {\n      Point p;\n      std::string on;\n      while (words >> p.x >> p.y >> on) {\n        p.onCurve = on == \"on\";\n        s.outlines.back().points.push_back(p);\n      }\n    }\n  }\n  return s;\n}\n\ninline int run(int argc, char** argv, const Rule rule) {\n  if (argc != 3) return 2;\n  try {\n    const Scene s = readScene(argv[1]);\n    Canvas canvas(s.width, s.height);\n    for (const Outline& o : s.outlines) fillOutline(canvas, o, s.place, rule, s.color);\n    return canvas.writePng(argv[2]) ? 0 : 1;\n  } catch (const std::exception& e) {\n    fprintf(stderr, \"error: %s\\n\", e.what());\n    return 1;\n  }\n}\n\n}  // namespace fill\n"},{"path":"common/fill.h","text":"#pragma once\n// Reference fill engine shared by the reference solutions of checkpoints 14, 16,\n// 17 and 18. SPOILERS: try those checkpoints yourself first.\n//\n// A pixel is filled when its centre is inside the outline. Every row is scanned\n// through the pixel centres; outline edges are split into pieces that are monotone\n// in y, so each piece crosses a scanline at most once (half-open in y, which\n// counts a shared vertex exactly once).\n\n#include <algorithm>\n#include <cmath>\n#include <utility>\n#include <vector>\n\n#include \"provided/Canvas.h\"\n\nnamespace fill {\n\nstruct Point {\n  double x = 0, y = 0;\n  bool onCurve = true;\n};\n\nstruct Outline {\n  std::vector<int> ends;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) -> pixel (x0 + scale*x, baseline - scale*y).\nstruct Placement {\n  double x0 = 0, baseline = 0, scale = 1;\n};\n\nenum class Rule { EvenOdd, NonZero };\n\nstruct Vec {\n  double x = 0, y = 0;\n};\n\n// A line (curve == false) or a quadratic curve from p0 via c to p1, monotone in y.\nstruct Piece {\n  Vec p0, c, p1;\n  bool curve = false;\n};\n\ninline Vec mid(const Vec a, const Vec b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\n// Splits a quadratic curve at its turning point in y, if it has one inside.\ninline void addCurve(const Vec p0, const Vec c, const Vec p1, std::vector<Piece>& out) {\n  const double denom = p0.y - 2 * c.y + p1.y;\n  if (std::abs(denom) > 1e-12) {\n    const double t = (p0.y - c.y) / denom;\n    if (t > 1e-9 && t < 1 - 1e-9) {\n      const Vec a = {p0.x + (c.x - p0.x) * t, p0.y + (c.y - p0.y) * t};\n      const Vec b = {c.x + (p1.x - c.x) * t, c.y + (p1.y - c.y) * t};\n      const Vec m = {a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t};\n      out.push_back({p0, a, m, true});\n      out.push_back({m, b, p1, true});\n      return;\n    }\n  }\n  out.push_back({p0, c, p1, true});\n}\n\n// The outline's edges in pixel space, with the implied on-curve points between\n// consecutive off-curve points, and contours that start off-curve handled.\ninline std::vector<Piece> pieces(const Outline& o, const Placement& at) {\n  std::vector<Piece> out;\n  int start = 0;\n  for (const int end : o.ends) {\n    std::vector<std::pair<Vec, bool>> pts;\n    for (int i = start; i <= end; ++i) {\n      const Point& p = o.points[i];\n      pts.push_back({{at.x0 + at.scale * p.x, at.baseline - at.scale * p.y}, p.onCurve});\n    }\n    start = end + 1;\n    if (pts.empty()) continue;\n\n    // Make every implied on-curve point explicit.\n    std::vector<std::pair<Vec, bool>> full;\n    for (std::size_t i = 0; i < pts.size(); ++i) {\n      const auto& p = pts[i];\n      const auto& next = pts[(i + 1) % pts.size()];\n      full.push_back(p);\n      if (!p.second && !next.second) full.push_back({mid(p.first, next.first), true});\n    }\n    const auto first = std::find_if(full.begin(), full.end(), [](const auto& p) { return p.second; });\n    if (first == full.end()) continue;  // a single off-curve point: nothing to fill\n    std::rotate(full.begin(), first, full.end());\n\n    Vec current = full[0].first;\n    for (std::size_t i = 1; i <= full.size(); ++i) {\n      const auto& p = full[i % full.size()];\n      if (p.second) {\n        out.push_back({current, current, p.first, false});\n        current = p.first;\n      } else {\n        const Vec end = full[(i + 1) % full.size()].first;  // always on-curve now\n        addCurve(current, p.first, end, out);\n        current = end;\n        ++i;\n      }\n    }\n  }\n  return out;\n}\n\nstruct Crossing {\n  double x = 0;\n  int direction = 0;  // +1 going down the screen, -1 going up\n};\n\n// Where a monotone piece crosses the horizontal line y = scanY (half-open in y).\ninline bool cross(const Piece& p, const double scanY, Crossing& out) {\n  const double y0 = p.p0.y, y1 = p.p1.y;\n  if (y0 == y1) return false;\n  if (!(std::min(y0, y1) <= scanY && scanY < std::max(y0, y1))) return false;\n  out.direction = y1 > y0 ? 1 : -1;\n  if (!p.curve) {\n    const double t = (scanY - y0) / (y1 - y0);\n    out.x = p.p0.x + (p.p1.x - p.p0.x) * t;\n    return true;\n  }\n  const double a = y0 - 2 * p.c.y + y1, b = 2 * (p.c.y - y0), c = y0 - scanY;\n  double t;\n  if (std::abs(a) < 1e-12) {\n    t = -c / b;\n  } else {\n    const double disc = std::max(0.0, b * b - 4 * a * c);\n    const double r1 = (-b + std::sqrt(disc)) / (2 * a), r2 = (-b - std::sqrt(disc)) / (2 * a);\n    const auto dist = [](const double r) { return r < 0 ? -r : (r > 1 ? r - 1 : 0); };\n    t = dist(r1) <= dist(r2) ? r1 : r2;  // the piece is monotone: one root is in [0, 1]\n  }\n  t = std::clamp(t, 0.0, 1.0);\n  const double u = 1 - t;\n  out.x = u * u * p.p0.x + 2 * u * t * p.c.x + t * t * p.p1.x;\n  return true;\n}\n\n// Fills one outline: every pixel whose centre is inside it by `rule`.\ninline void fillOutline(Canvas& canvas, const Outline& o, const Placement& at, const Rule rule,\n                        const RGB color) {\n  const std::vector<Piece> edges = pieces(o, at);\n  if (edges.empty()) return;\n  double top = 1e300, bottom = -1e300;\n  for (const Piece& e : edges) {\n    top = std::min({top, e.p0.y, e.c.y, e.p1.y});\n    bottom = std::max({bottom, e.p0.y, e.c.y, e.p1.y});\n  }\n  const int firstRow = std::max(0, static_cast<int>(std::floor(top)) - 1);\n  const int lastRow = std::min(canvas.height() - 1, static_cast<int>(std::ceil(bottom)) + 1);\n\n  std::vector<Crossing> crossings;\n  for (int row = firstRow; row <= lastRow; ++row) {\n    const double scanY = row + 0.5;\n    crossings.clear();\n    for (const Piece& e : edges) {\n      Crossing c;\n      if (cross(e, scanY, c)) crossings.push_back(c);\n    }\n    std::sort(crossings.begin(), crossings.end(), [](const Crossing& a, const Crossing& b) { return a.x < b.x; });\n    int winding = 0;\n    for (std::size_t i = 0; i + 1 < crossings.size(); ++i) {\n      winding += rule == Rule::EvenOdd ? 1 : crossings[i].direction;\n      const bool inside = rule == Rule::EvenOdd ? (winding % 2 != 0) : (winding != 0);\n      if (!inside) continue;\n      // Pixels whose centre x + 0.5 lies in [crossings[i].x, crossings[i + 1].x).\n      const int from = static_cast<int>(std::ceil(crossings[i].x - 0.5));\n      const int to = static_cast<int>(std::ceil(crossings[i + 1].x - 0.5)) - 1;\n      if (from <= to) canvas.drawSpan(row, from, to, color);\n    }\n  }\n}\n\n}  // namespace fill\n"}],"proof":{"passed":24,"total":24,"date":"2026-10-21"},"uses":["include/provided/Canvas.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a> section to the end, including the two cases where a scanline crosses one curve twice. Skip the code blocks if you want to work it out yourself.<\/p>","context":"<p>Checkpoint 16 filled straight-line outlines with the non-zero rule. Real glyphs have curves, and a curve can cross one scanline twice, going up at one crossing and down at the other. This checkpoint fills full glyph outlines, curves included, which is what the text renderer in checkpoint 18 needs.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Nonzero-rule\" target=\"_blank\" rel=\"noopener\">Nonzero-rule<\/a><\/li><li>Pomax, <a href=\"https://pomax.github.io/bezierinfo/\" target=\"_blank\" rel=\"noopener\">A Primer on Bézier Curves<\/a>: extremities and splitting curves<\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 17                         run every test\n.\\check 17 -Case 17-R5-U           one test: its input, and where the expected and your pictures are\n.\\check 17 -Fresh                  new random glyphs (new seed)\n.\\check 17 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Combine your checkpoint 14 (curves into edges, crossings per row) and checkpoint 16 (counting with directions). The new part is giving each curve crossing the right direction.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Turn each contour into lines and curves in pixel coordinates. Split every curve at its y turning point so each piece is monotone in y. Now every piece, line or curve, crosses a row at most once, with a direction you can read from its endpoints. Then fill exactly as in checkpoint 16.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>After splitting, solve the piece's quadratic for the scanline y and keep the root in [0, 1]; if the quadratic coefficient is 0, the equation is linear.<\/li><li>The direction of a curve piece is its end's y compared with its start's y, not the control point.<\/li><li>Implied midpoints, and contours that start off-curve, as in checkpoint 14.<\/li><li>Fill where the count is not zero, of either sign.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>pieces = []\nfor each contour (pixel coordinates, implied points inserted, starting on-curve):\n    on-&gt;on:      pieces.append(line(a, b))\n    on-&gt;off-&gt;on: split curve(a, c, b) at t = (a.y - c.y) / (a.y - 2c.y + b.y) if 0 &lt; t &lt; 1\n                 pieces.extend(the one or two monotone curves)\n\nfor row in 0 .. height-1:\n    y = row + 0.5\n    crossings = []\n    for p in pieces:\n        if min(p.start.y, p.end.y) &lt;= y &lt; max(p.start.y, p.end.y):\n            x = crossing x (line: interpolate; curve: solve for t in [0, 1], then B(t).x)\n            crossings.append((x, +1 if p.end.y &gt; p.start.y else -1))\n    sort by x; walk with a running count; fill where count != 0<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a contour with no on-curve points","test":"17-R2-all-off","input":"canvas 133 133\nplace 6 126 1\ncolor 255 255 255\noutline\nends 7\npoints 119.53 60 off 102.1 17.9 off 60 0.47 off 17.9 17.9 off 0.47 60 off 17.9 102.1 off\n       60 119.53 off 102.1 102.1 off","output":null,"image":{"src":"data:image/
