bYQoGnyGsItfeIT+uiIF66cRTAMqRJ0jGRYP7BxRknawqV3BKZC+iQvfLUknkAfqIqSyDoRkmdGi65B0tQhczwMGNn0jEKS0vRo2sLf4CQmMKkYhoyUuIbWcUlGYYnfSaO1JJ2TFzB1MVKY3mmUyKietuDeHLGJjP5pC9pcYSAE6Oky8lp4JKXykZnCBip5ES7DIMmPyIgnrzwjL1XB8wWplo60FEbTuGMgAjASo4iKdRaF6QnZtVRP0MOvizDgyYvYMowB74nfDHQHFCaFkVCMEZ+TaZ2viB2tALqDisUPeWlydBiCuhUOfcKThPEwiIMGJJ2Npi0i8+TgKboQDWUyihN6JjIapa3hV1EOwrQFSVrkjOnToTAbLbSIz/kkZXj6Byz5q6hpkc5GExaNEhbQ2IEKW0aqdAQpqTcHxOeYDh5CiZuM0B5A3zHSYqgBTxAMnoiEOHJ4J6wBLLooaukzjAL6hgB5VcQgyTyMo6ll0IYA2W2PQVUwj6awwZXAKBwJGoSV/mgKGxQpjPIhxkHboBxNYQOWwihPVRCnD/LOymgKo18Ko1aSGhIJCx6soymMVimMuukJEWGMQyzKRlMYNVMYjVLV0Cq00AJ0NIVRuQyjeiJjZBzacTR62vlgHA4b6qkKOUxHyzDqp7DhMVJKrXAZTWE0KcOIT2TDqbjCGpSjtSS9a8lhn6RGW/p0SlLwYmykJSmGUTAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCgzkEAM5piNtjMGYrAAAAAElFTkSuQmCC\" alt=\"expected picture for 17-R3-a-hiragana\"><figcaption>tests/17/expected/17-R3-a-hiragana.png<\/figcaption><\/figure>"}],"editorial":{"title":"Compare with the author's code","html":"<p>The blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Fixing%20the%20counting%20error%20of%20B%C3%A9zier%20curve\" target=\"_blank\" rel=\"noopener\">non-zero renderer<\/a> doesn't split curves. When a scanline meets a curve twice, it decides the two directions from the curve's convexity: the crossing nearer the curve's start gets one direction and the other crossing gets the opposite. It scans only the rows inside the glyph's bounding box, and fills each component of a compound glyph separately.<\/p>\n<p><strong>Something to look for:<\/strong> like the line-only version, it fills only where the count is positive, so a contour wound the other way on its own would stay empty (checkpoint 16, test <code>16-R4-reversed<\/code>).<\/p>"}},{"id":"18","num":"18","title":"Render a line of text","difficulty":"Hard","tests":18,"solution":"solutions/p18_render_text.cpp","problem":"problems/18-render-text.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 18 - Render a line of text\n//\n// Problem:  problems/18-render-text.md (also in the web problem book)\n// Check:    .\\check 18\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p18.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p18_render_text.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 18 - Render a line of text\n//\n// Problem:  problems/18-render-text.md (also in the web problem book)\n// Check:    .\\check 18\n//\n// The capstone: everything from checkpoints 02-17 in one program. Only the picture\n// is checked, so structure it however you like; copying in your own earlier\n// solutions is the intended route. The input/output code at the bottom is provided.\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"   // optional: big-endian reads (checkpoint 01)\n#include \"provided/Canvas.h\"      // Canvas: set(x, y, rgb), drawSpan(row, x0, x1, rgb), writePng(path)\n#include \"provided/SimpleGlyph.h\" // optional: provided::readSimpleGlyph (checkpoint 07)\n\n// Draws `text` (UTF-8) with the font at `fontPath`. The first glyph's origin is at\n// pixel position (penX, baseline); `scale` is pixels per font unit; each glyph moves\n// the pen right by its advance width times `scale`. Returns the pen x after the text.\ndouble drawText(Canvas& canvas, const std::string& fontPath, const std::string& text, double penX,\n                double baseline, double scale, RGB color) {\n  // TODO: cmap, loca, hmtx, glyphs (compound ones too) and a non-zero fill\n  // (see the problem page).\n  throw NotImplemented(\"drawText\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\n// Usage: p18 <input-file> <output-png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string fontPath;\n    std::unique_ptr<Canvas> canvas;\n    double penX = 0, baseline = 0, scale = 1;\n    RGB color{255, 255, 255};\n    for (std::string line; std::getline(input, line);) {\n      if (!line.empty() && line.back() == '\\r') line.pop_back();\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {  // font <path>\n        words >> fontPath;\n      } else if (keyword == \"canvas\") {  // canvas <width> <height>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<Canvas>(w, h);\n      } else if (keyword == \"pen\") {  // pen <x> <baseline> <scale>\n        words >> penX >> baseline >> scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r, g, b;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"text\") {  // text <UTF-8 text to the end of the line>\n        const std::string text = line.size() > 5 ? line.substr(5) : \"\";\n        penX = drawText(*canvas, fontPath, text, penX, baseline, scale, color);\n      }\n    }\n    if (!canvas || !canvas->writePng(argv[2])) throw std::runtime_error(\"cannot write the PNG\");\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["UTF-8 decoding","organising a larger program","reusing your own code"],"text":["UTF-8 decoding","organising a larger program","reusing your own code"]},{"label":"Library","items":["<code>std::ifstream<\/code> (binary)","<code>std::unordered_map<\/code>","<code>std::vector<\/code>"],"text":["std::ifstream (binary)","std::unordered_map","std::vector"]},{"label":"Concepts","items":["the whole pipeline: table directory, cmap, loca, hmtx, simple and compound glyphs, non-zero filling, advance widths"],"text":["the whole pipeline: table directory, cmap, loca, hmtx, simple and compound glyphs, non-zero filling, advance widths"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that draws lines of text with a TrueType font and writes the picture as a PNG.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p18_render_text.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p18_render_text.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, creates the canvas and writes the PNG; you fill in <code>drawText()<\/code>. The boilerplate includes the optional helpers <code>provided/BigEndian.h<\/code> (checkpoint 01) and <code>provided/SimpleGlyph.h<\/code> (checkpoint 07), and the canvas from <code>provided/Canvas.h<\/code>. With the blank starter, include what you need yourself, or call your own code from <code>solutions/common/<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The TrueType font to use (relative to the workbook folder)<\/td><\/tr><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels; it starts black<\/td><\/tr><tr><td><code>pen &lt;x&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Where the next text starts: the first glyph's origin is at pixel position (x, baseline). <code>scale<\/code> is pixels per font unit.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The colour of the next text<\/td><\/tr><tr><td><code>text &lt;...&gt;<\/code><\/td><td>Text to draw, in UTF-8, from after the space following <code>text<\/code> to the end of the line (spaces included)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>pen<\/code>, <code>color<\/code> and <code>text<\/code> can repeat. A <code>text<\/code> line starts where the pen is: at the most recent <code>pen<\/code> line, moved right by any text drawn since (the provided code passes the pen x on). Later text is drawn on top of earlier text.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) of exactly <code>width<\/code> x <code>height<\/code> pixels. For each character, in order:<\/p>\n<ol><li><strong>Decode UTF-8<\/strong> into Unicode code points. A code point takes 1 to 4 bytes: <code>0xxxxxxx<\/code>, <code>110xxxxx 10xxxxxx<\/code>, <code>1110xxxx 10xxxxxx 10xxxxxx<\/code> or <code>11110xxx 10xxxxxx 10xxxxxx 10xxxxxx<\/code>.<\/li><li><strong>Find the glyph<\/strong> with the font's cmap: the format 12 subtable with platform 0, encoding 4 (checkpoint 03). A code point the font doesn't map uses <strong>glyph 0<\/strong> (<code>.notdef<\/code>), usually a box.<\/li><li><strong>Get its outline<\/strong> (checkpoints 04, 07, 09): find the glyph's record with <code>loca<\/code>; a simple glyph gives one outline, a compound glyph the outlines of its components placed with their full transforms (offsets, scales, 2 x 2 matrices, nested compound glyphs: checkpoint 09's rules), and an empty glyph (such as space) nothing. Fill every component outline; filling them one by one or merged gives the same picture for these fonts. Noto Sans JP is a variable font: use the outlines stored in <code>glyf<\/code> and ignore its variation tables.<\/li><li><strong>Fill it<\/strong> with the non-zero rule (checkpoint 17), placed with glyph point (x, y) at pixel position (penX + scale·x, baseline − scale·y). A pixel is painted when its centre is inside.<\/li><li><strong>Move the pen<\/strong>: penX += advanceWidth × scale, using the glyph's advance width from <code>hmtx<\/code> (checkpoint 05; glyphs past numberOfHMetrics use the last advance). Don't round the pen position: keep it fractional.<\/li><\/ol>\n<p>The checker forgives edges that move by one pixel. Missing glyphs, glyphs in the wrong place or colour, and holes in the wrong places fail.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>. <code>include/provided/Canvas.h<\/code> does all of this for you; the boilerplate uses it.<\/p>\n<h3>Where each piece is explained<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Checkpoint<\/th><th>Key facts<\/th><\/tr><\/thead><tbody><tr><td>Table directory<\/td><td>02<\/td><td>numTables: uint16 at byte 4; 16-byte records from byte 12: tag, checkSum, offset, length<\/td><\/tr><tr><td>cmap<\/td><td>03<\/td><td>encoding records (platform, encoding, offset from cmap) after a 4-byte header; format 12 groups: start, end, startGlyphID (uint32 each)<\/td><\/tr><tr><td>loca<\/td><td>04<\/td><td>numGlyphs: uint16 at <code>maxp<\/code> + 4; <code>head<\/code> + 50: 0 = short (uint16 × 2), 1 = long (uint32); numGlyphs + 1 entries, offsets from the start of <code>glyf<\/code><\/td><\/tr><tr><td>Advance widths<\/td><td>05<\/td><td>numberOfHMetrics: uint16 at <code>hhea<\/code> + 34; <code>hmtx<\/code>: (uint16 advance, int16 lsb) per glyph, later glyphs reuse the last advance<\/td><\/tr><tr><td>Simple glyphs<\/td><td>07<\/td><td>header, contour ends, instructions, flags with REPEAT, delta-coded x then y<\/td><\/tr><tr><td>Compound glyphs<\/td><td>09<\/td><td>component records: flags, glyph index, arguments, optional scale / x-y scale / 2 × 2<\/td><\/tr><tr><td>Filling<\/td><td>17<\/td><td>non-zero rule, curves split at their y turning point, pixel centres<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Load the font once and reuse it for every <code>text<\/code> line: <code>drawText<\/code> is called once per line.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>UTF-8 is decoded into code points, including 2-, 3- and 4-byte characters.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Characters are mapped to glyphs with cmap; characters the font doesn't have draw glyph 0.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Each glyph moves the pen right by its advance width times the scale.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Compound glyphs are drawn with their components in place.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Glyphs are filled with the non-zero rule, curves and overlapping strokes included.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Several pen positions, colours and text lines; later text is drawn on top.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>The scale is applied; text that runs off the canvas is clipped.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Both fonts in the tests have a platform 0 / encoding 4 format 12 cmap subtable. Canvases are at most 600 pixels wide.<\/li><li>The text contains no control characters, and no character needs more than one glyph.<\/li><li>There are 18 tests: one or more per requirement with JetBrains Mono Bold and Noto Sans JP, plus phrases and random words (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p18_render_text.cpp","text":"// Reference solution - checkpoint 18 (render a line of text).\n// SPOILERS: try the checkpoint yourself first. Most of the work is in common/.\n\n#include <cstdio>\n#include <fstream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"common/font.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) return 2;\n  try {\n    std::ifstream input(argv[1]);\n    std::unique_ptr<font::Font> font;\n    std::unique_ptr<Canvas> canvas;\n    double penX = 0, baseline = 0, scale = 1;\n    RGB color{255, 255, 255};\n    for (std::string line; std::getline(input, line);) {\n      if (!line.empty() && line.back() == '\\r') line.pop_back();\n      std::istringstream words(line);\n      std::string key;\n      words >> key;\n      if (key == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::make_unique<font::Font>(path);\n      } else if (key == \"canvas\") {\n        int w, h;\n        words >> w >> h;\n        canvas = std::make_unique<Canvas>(w, h);\n      } else if (key == \"pen\") {\n        words >> penX >> baseline >> scale;\n      } else if (key == \"color\") {\n        int r, g, b;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (key == \"text\") {\n        const std::string text = line.size() > 5 ? line.substr(5) : \"\";\n        for (const uint32_t cp : font::decodeUtf8(text)) {\n          const uint16_t gid = font->glyphFor(cp);\n          for (const fill::Outline& o : font->outlines(gid)) {\n            fill::fillOutline(*canvas, o, {penX, baseline, scale}, fill::Rule::NonZero, color);\n          }\n          penX += font->advance(gid) * scale;\n        }\n      }\n    }\n    return canvas->writePng(argv[2]) ? 0 : 1;\n  } catch (const std::exception& e) {\n    std::fprintf(stderr, \"error: %s\\n\", e.what());\n    return 1;\n  }\n}\n"},{"path":"common/font.h","text":"#pragma once\n// Reference font reading for checkpoint 18: the work of checkpoints 02-05, 07 and 09\n// in one place. SPOILERS: try those checkpoints yourself first.\n\n#include <cstdint>\n#include <fstream>\n#include <map>\n#include <stdexcept>\n#include <string>\n#include <unordered_map>\n#include <vector>\n\n#include \"fill.h\"\n#include \"provided/BigEndian.h\"\n#include \"provided/SimpleGlyph.h\"\n\nnamespace font {\n\nstruct Table {\n  uint32_t offset = 0, length = 0;\n};\n\nclass Font {\npublic:\n  explicit Font(const std::string& path) : in_(path, std::ios::binary) {\n    if (!in_) throw std::runtime_error(\"cannot open \" + path);\n    readDirectory();\n    readCmap();\n    readLoca();\n    readMetrics();\n  }\n\n  // Glyph id for a code point; 0 (.notdef) when the font doesn't map it.\n  [[nodiscard]] uint16_t glyphFor(const uint32_t cp) const {\n    const auto it = cmap_.find(cp);\n    return it == cmap_.end() ? 0 : it->second;\n  }\n\n  [[nodiscard]] uint16_t advance(const uint16_t gid) const { return advances_.at(gid); }\n\n  // The simple glyphs `gid` is made of, in font units, compound glyphs resolved.\n  std::vector<fill::Outline> outlines(const uint16_t gid) {\n    std::vector<fill::Outline> out;\n    resolve(gid, Affine{}, 0, out);\n    return out;\n  }\n\nprivate:\n  struct Affine {\n    double a = 1, b = 0, c = 0, d = 1, e = 0, f = 0;\n    [[nodiscard]] Affine after(const Affine& in) const {\n      return {a * in.a + c * in.b, b * in.a + d * in.b, a * in.c + c * in.d, b * in.c + d * in.d,\n              a * in.e + c * in.f + e, b * in.e + d * in.f + f};\n    }\n  };\n\n  void seek(const uint32_t offset) {\n    in_.clear();\n    in_.seekg(offset);\n  }\n\n  const Table& table(const std::string& tag) const {\n    const auto it = tables_.find(tag);\n    if (it == tables_.end()) throw std::runtime_error(\"font has no '\" + tag + \"' table\");\n    return it->second;\n  }\n\n  void readDirectory() {\n    seek(4);\n    const uint16_t count = be::u16(in_);\n    seek(12);\n    for (uint16_t i = 0; i < count; ++i) {\n      std::string tag(4, ' ');\n      for (char& ch : tag) ch = static_cast<char>(be::u8(in_));\n      be::u32(in_);  // checksum\n      Table t;\n      t.offset = be::u32(in_);\n      t.length = be::u32(in_);\n      tables_[tag] = t;\n    }\n  }\n\n  void readCmap() {\n    const uint32_t base = table(\"cmap\").offset;\n    seek(base + 2);\n    const uint16_t count = be::u16(in_);\n    uint32_t sub = 0;\n    for (uint16_t i = 0; i < count; ++i) {\n      const uint16_t platform = be::u16(in_), encoding = be::u16(in_);\n      const uint32_t offset = be::u32(in_);\n      if (platform == 0 && encoding == 4) sub = offset;\n    }\n    if (!sub) throw std::runtime_error(\"no format 12 cmap subtable\");\n    seek(base + sub);\n    if (be::u16(in_) != 12) throw std::runtime_error(\"cmap subtable is not format 12\");\n    seek(base + sub + 12);\n    const uint32_t groups = be::u32(in_);\n    for (uint32_t g = 0; g < groups; ++g) {\n      const uint32_t first = be::u32(in_), last = be::u32(in_), glyph = be::u32(in_);\n      for (uint64_t cp = first; cp <= last; ++cp) cmap_[static_cast<uint32_t>(cp)] = static_cast<uint16_t>(glyph + (cp - first));\n    }\n  }\n\n  void readLoca() {\n    seek(table(\"maxp\").offset + 4);\n    numGlyphs_ = be::u16(in_);\n    seek(table(\"head\").offset + 50);\n    const bool shortFormat = be::i16(in_) == 0;\n    seek(table(\"loca\").offset);\n    std::vector<uint32_t> loca(numGlyphs_ + 1u);\n    for (uint32_t& v : loca) v = shortFormat ? be::u16(in_) * 2u : be::u32(in_);\n    const uint32_t glyf = table(\"glyf\").offset;\n    for (uint32_t i = 0; i < numGlyphs_; ++i) records_.push_back({glyf + loca[i], loca[i + 1] - loca[i]});\n  }\n\n  void readMetrics() {\n    seek(table(\"hhea\").offset + 34);\n    const uint16_t longMetrics = be::u16(in_);\n    seek(table(\"hmtx\").offset);\n    uint16_t last = 0;\n    for (uint16_t i = 0; i < longMetrics; ++i) {\n      last = be::u16(in_);\n      be::i16(in_);\n      advances_.push_back(last);\n    }\n    while (advances_.size() < numGlyphs_) advances_.push_back(last);\n  }\n\n  void resolve(const uint16_t gid, const Affine& m, const int depth, std::vector<fill::Outline>& out) {\n    if (depth > 16 || gid >= records_.size()) throw std::runtime_error(\"bad compound glyph\");\n    const Table& r = records_[gid];\n    if (r.length == 0) return;\n    seek(r.offset);\n    if (be::i16(in_) >= 0) {\n      const provided::Outline simple = provided::readSimpleGlyph(in_, r.offset);\n      if (simple.points.empty()) return;\n      fill::Outline o;\n      o.ends = simple.endPtsOfContours;\n      for (const auto& p : simple.points) {\n        o.points.push_back({m.a * p.x + m.c * p.y + m.e, m.b * p.x + m.d * p.y + m.f, p.onCurve});\n      }\n      out.push_back(std::move(o));\n      return;\n    }\n    seek(r.offset + 10);\n    std::vector<std::pair<uint16_t, Affine>> parts;\n    uint16_t flags = 0;\n    do {\n      flags = be::u16(in_);\n      const uint16_t child = be::u16(in_);\n      const int x = (flags & 0x1) ? be::i16(in_) : be::i8(in_);\n      const int y = (flags & 0x1) ? be::i16(in_) : be::i8(in_);\n      Affine t;\n      if (flags & 0x8) {\n        t.a = t.d = be::f2dot14(in_);\n      } else if (flags & 0x40) {\n        t.a = be::f2dot14(in_);\n        t.d = be::f2dot14(in_);\n      } else if (flags & 0x80) {\n        t.a = be::f2dot14(in_);\n        t.b = be::f2dot14(in_);\n        t.c = be::f2dot14(in_);\n        t.d = be::f2dot14(in_);\n      }\n      t.e = x;\n      t.f = y;\n      if (flags & 0x800) {\n        t.e = t.a * x + t.c * y;\n        t.f = t.b * x + t.d * y;\n      }\n      parts.emplace_back(child, t);\n    } while (flags & 0x20);\n    for (const auto& [child, t] : parts) resolve(child, m.after(t), depth + 1, out);\n  }\n\n  std::ifstream in_;\n  std::map<std::string, Table> tables_;\n  std::unordered_map<uint32_t, uint16_t> cmap_;\n  std::vector<Table> records_;\n  std::vector<uint16_t> advances_;\n  uint16_t numGlyphs_ = 0;\n};\n\n// UTF-8 bytes to code points. Malformed bytes become U+FFFD.\ninline std::vector<uint32_t> decodeUtf8(const std::string& s) {\n  std::vector<uint32_t> out;\n  std::size_t i = 0;\n  while (i < s.size()) {\n    const auto b = static_cast<unsigned char>(s[i]);\n    int extra = -1;\n    uint32_t cp = 0;\n    if (b < 0x80) extra = 0, cp = b;\n    else if ((b >> 5) == 0x6) extra = 1, cp = b & 0x1F;\n    else if ((b >> 4) == 0xE) extra = 2, cp = b & 0x0F;\n    else if ((b >> 3) == 0x1E) extra = 3, cp = b & 0x07;\n    bool ok = extra >= 0 && i + extra < s.size();\n    for (int k = 1; ok && k <= extra; ++k) {\n      const auto next = static_cast<unsigned char>(s[i + k]);\n      ok = (next >> 6) == 0x2;\n      cp = (cp << 6) | (next & 0x3F);\n    }\n    if (!ok) {\n      out.push_back(0xFFFD);\n      ++i;\n      continue;\n    }\n    out.push_back(cp);\n    i += 1 + extra;\n  }\n  return out;\n}\n\n}  // namespace font\n"},{"path":"common/fill.h","text":"#pragma once\n// Reference fill engine shared by the reference solutions of checkpoints 14, 16,\n// 17 and 18. SPOILERS: try those checkpoints yourself first.\n//\n// A pixel is filled when its centre is inside the outline. Every row is scanned\n// through the pixel centres; outline edges are split into pieces that are monotone\n// in y, so each piece crosses a scanline at most once (half-open in y, which\n// counts a shared vertex exactly once).\n\n#include <algorithm>\n#include <cmath>\n#include <utility>\n#include <vector>\n\n#include \"provided/Canvas.h\"\n\nnamespace fill {\n\nstruct Point {\n  double x = 0, y = 0;\n  bool onCurve = true;\n};\n\nstruct Outline {\n  std::vector<int> ends;\n  std::vector<Point> points;\n};\n\n// Glyph (x, y) -> pixel (x0 + scale*x, baseline - scale*y).\nstruct Placement {\n  double x0 = 0, baseline = 0, scale = 1;\n};\n\nenum class Rule { EvenOdd, NonZero };\n\nstruct Vec {\n  double x = 0, y = 0;\n};\n\n// A line (curve == false) or a quadratic curve from p0 via c to p1, monotone in y.\nstruct Piece {\n  Vec p0, c, p1;\n  bool curve = false;\n};\n\ninline Vec mid(const Vec a, const Vec b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\n// Splits a quadratic curve at its turning point in y, if it has one inside.\ninline void addCurve(const Vec p0, const Vec c, const Vec p1, std::vector<Piece>& out) {\n  const double denom = p0.y - 2 * c.y + p1.y;\n  if (std::abs(denom) > 1e-12) {\n    const double t = (p0.y - c.y) / denom;\n    if (t > 1e-9 && t < 1 - 1e-9) {\n      const Vec a = {p0.x + (c.x - p0.x) * t, p0.y + (c.y - p0.y) * t};\n      const Vec b = {c.x + (p1.x - c.x) * t, c.y + (p1.y - c.y) * t};\n      const Vec m = {a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t};\n      out.push_back({p0, a, m, true});\n      out.push_back({m, b, p1, true});\n      return;\n    }\n  }\n  out.push_back({p0, c, p1, true});\n}\n\n// The outline's edges in pixel space, with the implied on-curve points between\n// consecutive off-curve points, and contours that start off-curve handled.\ninline std::vector<Piece> pieces(const Outline& o, const Placement& at) {\n  std::vector<Piece> out;\n  int start = 0;\n  for (const int end : o.ends) {\n    std::vector<std::pair<Vec, bool>> pts;\n    for (int i = start; i <= end; ++i) {\n      const Point& p = o.points[i];\n      pts.push_back({{at.x0 + at.scale * p.x, at.baseline - at.scale * p.y}, p.onCurve});\n    }\n    start = end + 1;\n    if (pts.empty()) continue;\n\n    // Make every implied on-curve point explicit.\n    std::vector<std::pair<Vec, bool>> full;\n    for (std::size_t i = 0; i < pts.size(); ++i) {\n      const auto& p = pts[i];\n      const auto& next = pts[(i + 1) % pts.size()];\n      full.push_back(p);\n      if (!p.second && !next.second) full.push_back({mid(p.first, next.first), true});\n    }\n    const auto first = std::find_if(full.begin(), full.end(), [](const auto& p) { return p.second; });\n    if (first == full.end()) continue;  // a single off-curve point: nothing to fill\n    std::rotate(full.begin(), first, full.end());\n\n    Vec current = full[0].first;\n    for (std::size_t i = 1; i <= full.size(); ++i) {\n      const auto& p = full[i % full.size()];\n      if (p.second) {\n        out.push_back({current, current, p.first, false});\n        current = p.first;\n      } else {\n        const Vec end = full[(i + 1) % full.size()].first;  // always on-curve now\n        addCurve(current, p.first, end, out);\n        current = end;\n        ++i;\n      }\n    }\n  }\n  return out;\n}\n\nstruct Crossing {\n  double x = 0;\n  int direction = 0;  // +1 going down the screen, -1 going up\n};\n\n// Where a monotone piece crosses the horizontal line y = scanY (half-open in y).\ninline bool cross(const Piece& p, const double scanY, Crossing& out) {\n  const double y0 = p.p0.y, y1 = p.p1.y;\n  if (y0 == y1) return false;\n  if (!(std::min(y0, y1) <= scanY && scanY < std::max(y0, y1))) return false;\n  out.direction = y1 > y0 ? 1 : -1;\n  if (!p.curve) {\n    const double t = (scanY - y0) / (y1 - y0);\n    out.x = p.p0.x + (p.p1.x - p.p0.x) * t;\n    return true;\n  }\n  const double a = y0 - 2 * p.c.y + y1, b = 2 * (p.c.y - y0), c = y0 - scanY;\n  double t;\n  if (std::abs(a) < 1e-12) {\n    t = -c / b;\n  } else {\n    const double disc = std::max(0.0, b * b - 4 * a * c);\n    const double r1 = (-b + std::sqrt(disc)) / (2 * a), r2 = (-b - std::sqrt(disc)) / (2 * a);\n    const auto dist = [](const double r) { return r < 0 ? -r : (r > 1 ? r - 1 : 0); };\n    t = dist(r1) <= dist(r2) ? r1 : r2;  // the piece is monotone: one root is in [0, 1]\n  }\n  t = std::clamp(t, 0.0, 1.0);\n  const double u = 1 - t;\n  out.x = u * u * p.p0.x + 2 * u * t * p.c.x + t * t * p.p1.x;\n  return true;\n}\n\n// Fills one outline: every pixel whose centre is inside it by `rule`.\ninline void fillOutline(Canvas& canvas, const Outline& o, const Placement& at, const Rule rule,\n                        const RGB color) {\n  const std::vector<Piece> edges = pieces(o, at);\n  if (edges.empty()) return;\n  double top = 1e300, bottom = -1e300;\n  for (const Piece& e : edges) {\n    top = std::min({top, e.p0.y, e.c.y, e.p1.y});\n    bottom = std::max({bottom, e.p0.y, e.c.y, e.p1.y});\n  }\n  const int firstRow = std::max(0, static_cast<int>(std::floor(top)) - 1);\n  const int lastRow = std::min(canvas.height() - 1, static_cast<int>(std::ceil(bottom)) + 1);\n\n  std::vector<Crossing> crossings;\n  for (int row = firstRow; row <= lastRow; ++row) {\n    const double scanY = row + 0.5;\n    crossings.clear();\n    for (const Piece& e : edges) {\n      Crossing c;\n      if (cross(e, scanY, c)) crossings.push_back(c);\n    }\n    std::sort(crossings.begin(), crossings.end(), [](const Crossing& a, const Crossing& b) { return a.x < b.x; });\n    int winding = 0;\n    for (std::size_t i = 0; i + 1 < crossings.size(); ++i) {\n      winding += rule == Rule::EvenOdd ? 1 : crossings[i].direction;\n      const bool inside = rule == Rule::EvenOdd ? (winding % 2 != 0) : (winding != 0);\n      if (!inside) continue;\n      // Pixels whose centre x + 0.5 lies in [crossings[i].x, crossings[i + 1].x).\n      const int from = static_cast<int>(std::ceil(crossings[i].x - 0.5));\n      const int to = static_cast<int>(std::ceil(crossings[i + 1].x - 0.5)) - 1;\n      if (from <= to) canvas.drawSpan(row, from, to, color);\n    }\n  }\n}\n\n}  // namespace fill\n"}],"proof":{"passed":18,"total":18,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h","include/provided/Canvas.h","include/provided/SimpleGlyph.h"]},"read":"<p>This page is complete on its own. This is where the blog ends up: its goal was to \"load a Unicode font, render an arbitrary string, and output it as a PNG file\". Skim the <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Goal\" target=\"_blank\" rel=\"noopener\">Goal<\/a> section and the final pictures in the <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a> section.<\/p>","context":"<p>Every earlier checkpoint built one piece. This one puts them together: from the bytes of a font file and a string of text to a picture of that text. Reusing your own solutions to checkpoints 02-17 is the intended route: if you moved them into <code>solutions/common/<\/code> as you went, this checkpoint can call them directly.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/UTF-8\" target=\"_blank\" rel=\"noopener\">UTF-8<\/a>: the byte patterns<\/li><li>Apple, <em>TrueType Reference Manual<\/em>: <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6cmap.html\" target=\"_blank\" rel=\"noopener\">'cmap'<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6loca.html\" target=\"_blank\" rel=\"noopener\">'loca'<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6hmtx.html\" target=\"_blank\" rel=\"noopener\">'hmtx'<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6glyf.html\" target=\"_blank\" rel=\"noopener\">'glyf'<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Goal\" target=\"_blank\" rel=\"noopener\">Goal<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 18                         run every test\n.\\check 18 -Case 18-E2E-hello      one test: its input, and where the expected and your pictures are\n.\\check 18 -Fresh                  new random words (new seed)\n.\\check 18 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Make a small font class that loads everything once: the table directory, the cmap mapping, the <code>loca<\/code> offsets and lengths, and the advance widths. Then drawing a string is a loop over code points.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Copy in your solutions to checkpoints 02-05 (tables), 07 and 09 (glyph outlines) and 17 (filling), adapting their inputs: each one already turns a font file into exactly what the next step needs. Decode the UTF-8 into code points first, then for each: glyph id, outlines, fill, advance.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A character the font doesn't map draws glyph 0, not nothing.<\/li><li>Keep the pen x as a double. Rounding it each step drifts by up to half a pixel per character.<\/li><li>The space character has no outline but does have an advance width.<\/li><li>Fill every outline of a compound glyph.<\/li><li>Text runs off the canvas in one test: skip pixels outside it.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>font = load(path)          # directory, cmap (0/4 format 12), loca, hmtx\nfor cp in utf8_decode(text):\n    gid = font.cmap.get(cp, 0)\n    for outline in font.outlines(gid):          # simple: 1, compound: its components\n        fill_nonzero(canvas, outline, place=(penX, baseline, scale), color)\n    penX += font.advance(gid) * scale\nreturn penX<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"Hello, World!","test":"18-E2E-hello","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ncanvas 562 113\npen 8 80 0.07\ncolor 255 255 255\ntext Hello, World!","output":null,"image":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjIAAABxCAIAAABA/d7lAAAKZklEQVR4XmMYBaMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCgz0EGIl04P///3GpZGSkqyF0C1E8XibGDcQHC1bTBtb20Yw7ICGANdLxJCRciYRULRSm1eGRWoZTjqNKcU1GuUSthMQ0WgCNhsBoCIyGwGgIjIbA4AmB0WppNDWOhsBoCIyGwGgIMIxWS6OJYDQERkOAqBCgcHAJ2Q4qGjUaeaMhQLsQGO0tjaau0RAYDYHREBgNgUEUAqPV0mhyHA2BwRIC1JoxJqlXNLreYTQDDLYQGK2WRtPkaAiMhsBoCIyGwGhvaTQNjIbAaAhQFgKjE0WjKWi4hgDLaNTiCgEiBzdoVDoMrO2jqWI0BEZaCIzmuMET46ODeKPlz2gIjIbAaAiMhgBRIYCn8qbiJOVotTSaHEdDYDQERkNgNAQYRntLo4lgNARGQ4CaITC6oG40PQ2bEBgmc0v4J3hGcyzt0utoyI/M0pAO8U7SiX+0OwVukMTvsPcgcjgP7WqJyOUGcGWj9RO18thoyA+q2ohuCXuwxTsx7oGoGbp5n6Afh7oHMbPSUJ1b+g8GpBYN5OkaHRxADoHRkKdpesBaehJZGaBFEzHuZCTl+H/ynEGGLiJDmCSTaecMmqYH4p09RD2INfSGZLVEYQQMp/ijc5U5GvKDf0gHlwspibtBGO9kOGnIZXxSHTxsSrahVy1RJehHayYyitfRkGcYkWA4xfsQyvjkOXV4lGxDrFqiYqCP1kwklbGjIT9aJ1EYAqNJiPgAHOGl01CqlqgeVaM1Ey0G8YkxczTkh0QlNyxz3LBPe8PAg8Pn8CFck7ejJSDDKBgNgWEUApg5Gp73h0dmJ9IXw8zXyCl0yFRLeKIK/2oiiCwu7UDxo <script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('book-data').textContent);
  const CPS = DATA.checkpoints;
  const BY = Object.fromEntries(CPS.map((c) => [c.id, c]));
  const DIFFS = ['Easy', 'Medium', 'Hard'].filter((d) => CPS.some((c) => c.difficulty === d))
    .concat([...new Set(CPS.map((c) => c.difficulty))].filter((d) => !['Easy', 'Medium', 'Hard'].includes(d)));

  // Progress, drafts and layout live in this browser only.
  const store = {
    get(k) { try { return localStorage.getItem(DATA.key + ':' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(DATA.key + ':' + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(DATA.key + ':' + k); } catch (e) {} },
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const command = (id, extra) => DATA.check.replace('{id}', id) + (extra ? ' ' + extra : '');
  const solved = (id) => store.get(id + ':solved') === '1';
  const drafted = (id) => store.get(id + ':draft') !== null;
  const diffClass = (d) => d.toLowerCase();
  const icon = (paths, size, extra) => `<svg viewBox="0 0 24 24" width="${size || 16}" height="${size || 16}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra || ''}>${paths}</svg>`;
  const I = {
    check: icon('<path d="m5 12 5 5 9-10"/>'),
    tryIcon: icon('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'),
    tag: icon('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>', 14),
    bulb: icon('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>', 15),
    lock: icon('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 14),
    down: icon('<path d="m6 9 6 6 6-6"/>', 15),
    link: icon('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', 15),
    map: icon('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>', 15),
    book: icon('<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/>', 15),
  };

  let current = null;          // checkpoint id on screen, or null for the list
  let caseIndex = 0;           // selected test case in the bottom panel
  const peeked = new Set();    // editorials opened before solving, this visit only
  const lastAction = {};       // id -> { kind: 'run' | 'submit', test, copied }

  // ---------------------------------------------------------------- problem list
  const filter = { topic: null, diff: null, q: '' };

  function topicsOf(c) {
    const concepts = c.tags.find((g) => g.label.toLowerCase() === 'concepts');
    return concepts ? concepts.text : c.tags.flatMap((g) => g.text);
  }

  function renderListShell() {
    $$('[data-logo]').forEach((el) => { el.textContent = DATA.title.trim().charAt(0).toUpperCase(); });
    $('#book-name').textContent = DATA.title;
    $('#nav-src').innerHTML = `Built on <a href="${esc(DATA.sourceUrl)}" target="_blank" rel="noopener">“${esc(DATA.sourceTitle)}”</a> by ${esc(DATA.author)}`;
    $('#hero').innerHTML = `<span class="over">${CPS.length} checkpoints · any language</span><h1>${esc(DATA.headline)}</h1><p>${esc(DATA.lede)}</p>`;
    $('#credits').textContent = DATA.credits;
    $('#diff').innerHTML = ['All'].concat(DIFFS).map((d) =>
      `<button type="button" data-diff="${d === 'All' ? '' : esc(d)}" aria-pressed="${d === 'All'}">${esc(d)}</button>`).join('');

    const counts = {};
    CPS.forEach((c) => topicsOf(c).forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const topics = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    $('#topics').innerHTML = `<button class="tchip" type="button" data-topic="" aria-pressed="true">All topics</button>`
      + topics.map((t) => `<button class="tchip" type="button" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}<sup>${counts[t]}</sup></button>`).join('')
      + (topics.length > 11 ? '<button class="more" type="button" id="more-topics">Expand</button>' : '');
  }

  function renderSide() {
    const done = CPS.filter((c) => solved(c.id));
    const r = 50, C = 2 * Math.PI * r;
    let offset = 0;
    const arcs = DIFFS.map((d) => {
      const n = done.filter((c) => c.difficulty === d).length;
      const len = (n / CPS.length) * C;
      const arc = n ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="currentColor" class="${diffClass(d)}" stroke-width="7" stroke-linecap="butt" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"/>` : '';
      offset += len;
      return arc;
    }).join('');
    const bars = DIFFS.map((d) => {
      const all = CPS.filter((c) => c.difficulty === d).length;
      const n = done.filter((c) => c.difficulty === d).length;
      return `<button class="bar-row ${diffClass(d)}" type="button" data-diff="${esc(d)}" aria-pressed="${filter.diff === d}">
        <span class="lbl">${esc(d)}</span><span class="n"><b>${n}</b>/${all}</span><span class="bar"><i style="width:${all ? (n / all) * 100 : 0}%"></i></span></button>`;
    }).join('');
    const first = CPS[0] ? CPS[0].id : '01';
    $('#side').innerHTML = `
      <div class="card prog">
        <div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" style="stroke: var(--fill)" stroke-width="7"/>${arcs}</svg>
          <div class="ring-c"><div><b>${done.length}</b><span>/${CPS.length}</span></div><small>Solved</small></div></div>
        <div class="bars">${bars}</div>
      </div>
      <div class="card how"><h2>How checking works</h2><ol>
        <li><span><b>Write it</b> in the editor here, or straight in <code>solutions/</code> in your own editor. Each starter is an empty <code>main</code>; switch to Boilerplate if you want the input and output code done for you.</span></li>
        <li><span><b>Submit</b> copies your code. Paste it into the solution file and run <code>${esc(command(first))}</code> in ${esc(DATA.shell)}, in the workbook folder:<br><span class="path">${esc(DATA.folder)}</span></span></li>
        <li><span><b>Paste the checker's output</b> into Test Result. Accepted marks the checkpoint solved.</span></li>
        <li><span><b>Any order.</b> Each input carries what the earlier checkpoints would produce, so every checkpoint stands alone.</span></li>
        <li><span><b>Build on your own work.</b> Code in <code>solutions/common/</code> is compiled into every checkpoint, so later ones (and the last one most of all) can call what you wrote earlier.</span></li>
        <li><span><b>A test looks wrong?</b> <code>${esc(command(first, '-Dispute <test-id> "why"'))}</code> sets it aside. Ask Claude to review your disputes.</span></li>
      </ol></div>`;
  }

  function renderRows() {
    const q = filter.q.trim().toLowerCase();
    const shown = CPS.filter((c) => (!filter.diff || c.difficulty === filter.diff)
      && (!filter.topic || topicsOf(c).includes(filter.topic))
      && (!q || (c.num + '. ' + c.title + ' ' + c.tags.flatMap((g) => g.text).join(' ')).toLowerCase().includes(q)));
    $('#rows').innerHTML = shown.map((c) => {
      const st = solved(c.id) ? `<span class="st-ok" title="Solved">${I.check}</span>`
        : drafted(c.id) ? `<span class="st-try" title="Attempted: a draft is saved">${I.tryIcon}</span>` : '';
      return `<tr data-id="${c.id}"><td class="st">${st}</td><td class="ti"><a href="#p${c.id}">${esc(c.num)}. ${esc(c.title)}</a></td>`
        + `<td class="te">${c.tests}</td><td class="di ${diffClass(c.difficulty)}">${esc(c.difficulty)}</td></tr>`;
    }).join('') || '<tr><td></td><td class="muted" colspan="3">No checkpoints match.</td></tr>';
    return shown;
  }

  function showList() {
    current = null;
    $('#ide-view').hidden = true;
    $('#list-view').hidden = false;
    document.body.classList.remove('in-ide');
    renderSide();
    renderRows();
    window.scrollTo(0, 0);
  }

  $('#topics').addEventListener('click', (e) => {
    if (e.target.id === 'more-topics') {
      const box = $('#topics');
      e.target.textContent = box.classList.toggle('collapsed') ? 'Expand' : 'Collapse';
      return;
    }
    const chip = e.target.closest('[data-topic]');
    if (!chip) return;
    filter.topic = chip.dataset.topic || null;
    $$('#topics [data-topic]').forEach((b) => b.setAttribute('aria-pressed', String(b === chip)));
    renderRows();
  });
  function setDiff(d) {
    filter.diff = d || null;
    $$('#diff [data-diff]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.diff || null) === filter.diff)));
    renderSide();
    renderRows();
  }
  $('#diff').addEventListener('click', (e) => { const b = e.target.closest('[data-diff]'); if (b) setDiff(b.dataset.diff); });
  $('#side').addEventListener('click', (e) => { const b = e.target.closest('.bar-row'); if (b) setDiff(filter.diff === b.dataset.diff ? '' : b.dataset.diff); });
  $('#q').addEventListener('input', (e) => { filter.q = e.target.value; renderRows(); });
  $('#rows').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-id]');
    if (row && !e.target.closest('a')) go('p' + row.dataset.id);
  });
  function pickOne(pool) {
    const open = pool.filter((c) => !solved(c.id) && c.id !== current);
    const from = open.length ? open : pool.filter((c) => c.id !== current);
    if (from.length) go('p' + from[Math.floor(Math.random() * from.length)].id);
  }
  $('#pick').addEventListener('click', () => pickOne(renderRows()));

  // ---------------------------------------------------------------- problem view
  function renderDesc(c) {
    const opened = Number(store.get(c.id + ':hints') || 0);
    const acc = (id, iconHtml, title, body) => `<div class="acc" ${id ? `id="${id}"` : ''}><button class="acc-btn" type="button" aria-expanded="false">${iconHtml}<span>${title}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${body}</div></div>`;
    const hintHtml = c.hints.map((h, k) => {
      const n = k + 1, locked = n > opened + 1;
      return `<div class="acc hint" data-n="${n}"><button class="acc-btn" type="button" aria-expanded="false"${locked ? ' disabled' : ''}>${I.bulb}<span>${esc(h.title)}<span class="acc-sub">${h.sub}</span></span>`
        + `<span class="acc-lock" ${locked ? '' : 'hidden'} title="Open hint ${n - 1} first">${I.lock}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${h.html}</div></div>`;
    }).join('');
    const tags = c.tags.map((g) => `<div class="tg"><span class="tg-label">${esc(g.label)}</span><div class="tg-items">${g.items.map((t) => `<span class="chip">${t}</span>`).join('')}</div></div>`).join('');

    $('#desc').innerHTML = `
      <div class="d-head"><h1>${esc(c.num)}. ${esc(c.title)}</h1><span class="solved-mark" id="solved-mark" ${solved(c.id) ? '' : 'hidden'}>Solved ${I.check}</span></div>
      <div class="chips">
        <span class="chip ${diffClass(c.difficulty)}">${esc(c.difficulty)}</span>
        ${c.tags.length ? `<button class="chip" type="button" data-jump="acc-topics">${I.tag}Topics</button>` : ''}
        ${c.hints.length ? `<button class="chip" type="button" data-jump="hints">${I.bulb}Hint</button>` : ''}
        <span class="chip">${c.tests} tests</span>
        <span class="chip" title="Only your program's output is checked, so any structure, language or library works.">Any language</span>
      </div>
      ${c.read ? `<div class="callout">${I.book}<div><b>Read in the blog first.</b> ${c.read.replace(/^<p>|<\/p>$/g, '')}</div></div>` : ''}
      <div class="flow">${c.body}</div>
      <div class="accs">
        ${c.tags.length ? acc('acc-topics', I.tag, 'Topics', tags) : ''}
        ${hintHtml}
        ${c.context ? acc('', I.map, 'Where this fits', c.context) : ''}
        ${c.sources ? acc('', I.link, 'Source material', c.sources) : ''}
      </div>
      <div class="d-foot"><button class="btn" type="button" id="solve-btn"></button><span>Checkpoint ${CPS.indexOf(c) + 1} of ${CPS.length} · problem page <code>${esc(c.problem)}</code></span></div>`;

    const host = $('[data-examples]', $('#desc'));
    if (host) host.innerHTML = c.examples.map(exampleHtml).join('');
    paintSolved();
  }

  function exampleHtml(ex) {
    const title = `<p class="ex-title"><strong>${esc(ex.label)}:</strong> <span>${ex.name}</span></p>`;
    if (ex.raw) return `<div class="ex">${title}<div class="flow">${ex.raw}</div></div>`;
    const out = ex.output != null ? `<pre>${esc(ex.output)}</pre>`
      : ex.image ? `<img class="shot" src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '';
    return `<div class="ex">${title}<div class="ex-block">
      <div class="ex-row"><span class="ex-k">Input:</span><pre>${esc(ex.input)}</pre></div>
      ${out ? `<div class="ex-row"><span class="ex-k">Output:</span>${out}</div>` : ''}
      ${ex.explain ? `<div class="ex-row"><span class="ex-k">Explanation:</span><div class="flow">${ex.explain}</div></div>` : ''}
    </div></div>`;
  }

  function toggleAcc(box, open) {
    const btn = $('.acc-btn', box), body = $('.acc-body', box);
    const show = open === undefined ? body.hidden : open;
    body.hidden = !show;
    btn.setAttribute('aria-expanded', String(show));
  }

  // Hints open in order; the furthest one opened is remembered.
  function openHint(box) {
    const n = Number(box.dataset.n), key = current + ':hints';
    const opened = Number(store.get(key) || 0);
    if (n > opened) {
      store.set(key, String(n));
      $$('.acc.hint', $('#desc')).forEach((h) => {
        const locked = Number(h.dataset.n) > n + 1;
        $('.acc-btn', h).disabled = locked;
        $('.acc-lock', h).hidden = !locked;
      });
      toggleAcc(box, true);
    } else toggleAcc(box);
  }

  $('#desc').addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {
      const target = jump.dataset.jump === 'hints' ? $('.acc.hint', $('#desc')) : $('#' + jump.dataset.jump);
      if (target) {
        if (jump.dataset.jump !== 'hints') toggleAcc(target, true);
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      return;
    }
    const btn = e.target.closest('.acc-btn');
    if (btn) {
      const box = btn.parentElement;
      if (box.classList.contains('hint')) openHint(box); else toggleAcc(box);
      return;
    }
    if (e.target.closest('#solve-btn')) setSolved(current, !solved(current));
  });

  // The Editorial: a solution proven to pass every test (the reference, fingerprinted when it
  // passed), then how the blog author did it. Locked until Accepted, but always one click away.
  let solFile = 0;
  function renderEditorial(c) {
    const sol = c.solutionCode;
    const has = !!c.editorial || !!sol;
    $('#ed-tab').hidden = !has;
    $('#ed-sep').hidden = !has;
    if (!has) return;
    if (!(solved(c.id) || peeked.has(c.id))) {
      $('#editorial').innerHTML = `<div class="locked">${I.lock}<h2>Solve it first, or peek</h2><p>The editorial has a complete solution that passes every test${c.editorial ? ', and compares it with the author\'s code from the blog' : ''}. It opens by itself when the checker says Accepted.</p><button class="btn" type="button" id="peek">Show the solution anyway</button></div>`;
      return;
    }
    solFile = Math.min(solFile, sol ? sol.files.length - 1 : 0);
    const proof = sol && sol.proof
      ? `<span class="badge ok">${I.check} Passes all ${sol.proof.total} tests · checked ${esc(sol.proof.date)}</span>`
      : `<span class="badge warn">Not yet checked against the tests</span>`;
    const files = sol && sol.files.length > 1
      ? `<div class="case-pills" role="tablist">${sol.files.map((f, i) => `<button class="pill-btn" type="button" role="tab" data-sol="${i}" aria-selected="${i === solFile}">${esc(f.path)}</button>`).join('')}</div>` : '';
    $('#editorial').innerHTML = `<h1 class="ed-title">Editorial</h1>`
      + (sol ? `<section class="ed-sec"><h2>A solution that passes</h2>${proof}
          <p class="note">Written from the problem page, not copied from the blog. Yours can look completely different and still be right: only the output is checked.</p>
          ${files}<div class="sol-head"><code>${esc(sol.files[solFile].path)}</code><button class="btn" type="button" id="sol-copy">Copy</button></div>
          <pre class="sol-code" id="sol-code"></pre>
          ${sol.uses.length ? `<p class="note">It also uses ${sol.uses.map((u) => `<code>${esc(u)}</code>`).join(', ')}, ${sol.uses.length === 1 ? 'which is' : 'which are'} in the workbook.</p>` : ''}</section>` : '')
      + (c.editorial ? `<section class="ed-sec"><h2>${esc(c.editorial.title)}</h2><div class="flow">${c.editorial.html}</div></section>` : '');
    if (sol) {
      const box = $('#sol-code'), text = sol.files[solFile].text;
      if (window.CodeMirror && window.CodeMirror.runMode) window.CodeMirror.runMode(text, c.lang.mime, box);
      else box.textContent = text;
    }
  }
  $('#editorial').addEventListener('click', (e) => {
    const c = BY[current];
    if (e.target.closest('#peek')) { peeked.add(current); renderEditorial(c); return; }
    const tab = e.target.closest('[data-sol]');
    if (tab) { solFile = Number(tab.dataset.sol); renderEditorial(c); return; }
    const copy = e.target.closest('#sol-copy');
    if (copy) copyText(c.solutionCode.files[solFile].text).then((ok) => flash(copy, ok));
  });

  function setLeft(tab) {
    $$('[data-left]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.left === tab)));
    $('#desc').hidden = tab !== 'desc';
    $('#editorial').hidden = tab !== 'editorial';
  }
  function setBottom(tab) {
    $$('[data-bottom]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.bottom === tab)));
    $('#cases').hidden = tab !== 'cases';
    $('#result').hidden = tab !== 'result';
  }
  $$('[data-left]').forEach((b) => b.addEventListener('click', () => setLeft(b.dataset.left)));
  $$('[data-bottom]').forEach((b) => b.addEventListener('click', () => setBottom(b.dataset.bottom)));

  // ---- test cases
  const casesOf = (c) => c.examples.filter((ex) => !ex.raw && ex.input != null);
  function renderCases(c) {
    const list = casesOf(c);
    if (!list.length) {
      $('#cases').innerHTML = `<p class="note">This checkpoint has no worked examples. <code>${esc(command(c.id))}</code> runs all ${c.tests} tests.</p>`;
      return;
    }
    caseIndex = Math.min(caseIndex, list.length - 1);
    const ex = list[caseIndex];
    const expected = ex.output != null ? `<pre class="field-v">${esc(ex.output)}</pre>`
      : ex.image ? `<img src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '<p class="note">See the problem page.</p>';
    $('#cases').innerHTML = `
      <div class="case-pills" role="tablist">${list.map((x, i) => `<button class="pill-btn" type="button" role="tab" data-case="${i}" aria-selected="${i === caseIndex}">Case ${i + 1}</button>`).join('')}</div>
      ${ex.name ? `<p class="case-name">${ex.name}</p>` : ''}
      <div class="field"><div class="field-k">input</div><pre class="field-v">${esc(ex.input)}</pre></div>
      <div class="field"><div class="field-k">expected output</div>${expected}</div>
      ${ex.test ? `<div class="field"><div class="field-k">run just this case (test ${esc(ex.test)})</div>${cmdRow(command(c.id, '-Case ' + ex.test))}</div>` : ''}`;
  }
  $('#cases').addEventListener('click', (e) => {
    const b = e.target.closest('[data-case]');
    if (b) { caseIndex = Number(b.dataset.case); renderCases(BY[current]); }
  });
  const cmdRow = (text) => `<div class="cmd"><code>${esc(text)}</code><button class="btn" type="button" data-copy="${esc(text)}">Copy</button></div>`;

  // ---- results: the learner pastes the checker's output; we read the verdict from it.
  // Every outcome gets a plain sentence saying what happened and what to do next.
  function looksLikeCode(t, c) {
    const s = t.trim();
    if ([code(), c.starter, c.boilerplate].some((x) => x && x.trim() === s)) return true;
    return !/^Checkpoint \S+ - /m.test(s)
      && /^\s*(#include\b|#!|import \S|from \S+ import|def \w+\(|(int|void|auto) main\s*\(|fn main\(|func main\(|function \w+\(|\/\/ Checkpoint \d)/m.test(s);
  }
  function parseOutput(text, c) {
    const t = text.replace(/\r/g, '');
    const head = t.match(/^Checkpoint (\S+) - /m);
    const run = `<code>${esc(command(c.id))}</code>`;
    let v = null, m;
    if ((m = t.match(/Accepted: (\d+) \/ (\d+) tests passed(?: \((\d+) disputed\))?/))) {
      v = { kind: 'ok', label: 'Accepted', passed: +m[1], total: +m[2], disputed: +(m[3] || 0) };
    } else if ((m = t.match(/Wrong Answer: (\d+) \/ (\d+) tests passed/))) {
      v = { kind: 'bad', label: 'Wrong Answer', passed: +m[1], total: +m[2] };
      v.help = /wrote nothing in any failing test/.test(t)
        ? `Your program ran but didn't write anything. It's started with two file names: the input to read and the output to write. Write your answer to the second one.`
        : `Some tests failed. Each one below shows what was expected and what your program wrote, and the requirement it most likely breaks.`;
    } else if (/Compile Error/.test(t)) {
      v = { kind: 'bad', label: 'Compile Error' };
      v.help = /has no main\(\) function/.test(t)
        ? `Your code has no <code>main</code> function, so it can't be built into a program the checker can run. Add a <code>main</code> that reads the input file and writes the output file.`
        : `Your code didn't build, so no tests ran. The compiler's messages are below; fix the first error first, since later ones often follow from it.`;
    } else if ((m = t.match(/Not implemented yet:? ?(\S*)/))) {
      v = { kind: 'warn', label: 'Not implemented yet' };
      v.help = `The boilerplate function <code>${esc(m[1] || 'a function')}</code> still says it isn't written. Fill it in, save, and run ${run} again.`;
    } else if (/Not started yet/.test(t)) {
      v = { kind: 'warn', label: 'Not started yet' };
      v.help = /is empty\./.test(t)
        ? `Your solution file <code>${esc(c.solution)}</code> is empty, so there was nothing to check. Put your program in it, save, and run ${run} again.`
        : `Your solution file <code>${esc(c.solution)}</code> is still the blank starter, so there was nothing to check. Write your program in it, save, and run ${run} again.`;
    } else if (/^Passed\s*$/m.test(t)) {
      v = { kind: 'ok', label: 'Passed', single: true, help: 'This one test passes. Run all of them to get a verdict for the checkpoint.' };
    } else if ((m = t.match(/^Failed: (.*)$/m))) {
      v = { kind: 'bad', label: 'Failed', single: true, help: `This one test fails: ${esc(m[1])}` };
    } else if (!t.trim()) {
      v = { kind: 'unknown', label: 'Nothing was pasted', help: 'The box was empty. Copy what the checker printed in the terminal, then paste it here.' };
    } else if (looksLikeCode(t, c)) {
      v = { kind: 'unknown', label: "That's your code, not the result", code: true,
        help: `Submit copied your code so you can put it in <code>${esc(c.solution)}</code>. Paste it into that file and save, run ${run} in ${esc(DATA.shell)}, then copy what the checker prints and paste that here.` };
    } else if (head) {
      v = { kind: 'unknown', label: 'The output is cut off',
        help: `This starts like the checker's output but has no verdict at the end. Copy everything it printed, down to the last line (it starts with Accepted, Wrong Answer, Compile Error, Not started yet or Not implemented yet).` };
    } else {
      v = { kind: 'unknown', label: "That isn't the checker's output",
        help: `Paste what ${run} prints in the terminal. It starts with “Checkpoint ${esc(c.id)} - …” and ends with a verdict such as “Accepted: ${c.tests} / ${c.tests} tests passed.”` };
    }
    v.raw = t;
    v.other = head && head[1] !== c.id ? head[1] : null;
    v.reqs = [...t.matchAll(/^ {2}(\S+)\s+(.+?) \.{2,}\s+(\d+) \/ (\d+)/gm)].map((r) => ({ id: r[1], text: r[2], ok: +r[3], n: +r[4] }));
    v.fails = [];
    const lines = t.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const f = lines[i].match(/^\s+x (\S+)\s+(.*)$/);
      if (!f) continue;
      const detail = [];
      while (i + 1 < lines.length && /^ {9,}\S/.test(lines[i + 1])) detail.push(lines[++i].trim());
      v.fails.push({ id: f[1], title: f[2], detail: detail.join('\n') });
    }
    return v;
  }

  function verdictHtml(v, c) {
    let h = `<div class="verdict ${v.kind}"><h2>${esc(v.label)}</h2>`
      + (v.total ? `<span class="sub">${v.passed} / ${v.total} testcases passed${v.disputed ? ` · ${v.disputed} disputed` : ''}</span>` : '')
      + `<button class="btn" type="button" id="clear-result">Clear</button></div>`;
    if (v.other) h += `<p class="note warn">This output is from checkpoint ${esc(v.other)}, not ${esc(c.id)}, so it wasn't counted here. Open checkpoint ${esc(v.other)} and paste it there.</p>`;
    else if (v.kind === 'ok' && !v.single) h += `<p class="note">Saved as solved. The Editorial tab is open now.</p>`;
    if (v.help) h += `<p class="note">${v.help}</p>`;
    if (v.reqs.length) {
      h += '<div class="req-rows">' + v.reqs.map((r) => `<div class="req-row${r.ok === r.n ? '' : ' fail'}"><span class="rid">${esc(r.id)}</span><span class="rq" title="${esc(r.text)}">${esc(r.text)}</span><span class="cnt">${r.ok} / ${r.n}</span><span class="bar"><i style="width:${r.n ? (r.ok / r.n) * 100 : 0}%"></i></span></div>`).join('') + '</div>';
    }
    h += v.fails.map((f) => `<div class="fail-card"><span class="id">${esc(f.id)}</span><span class="t">${esc(f.title)}</span><pre>${esc(f.detail)}</pre></div>`).join('');
    if (v.kind !== 'ok' && !v.fails.length && !v.reqs.length && v.raw.trim()) {
      const lines = v.raw.trim().split('\n');
      const shown = v.kind === 'unknown' ? lines.slice(0, 12) : lines.slice(-40);
      h += `<div class="field-k">${v.kind === 'unknown' ? 'What you pasted' : 'What the checker printed'}</div>`
        + `<pre class="raw">${esc(shown.join('\n'))}${v.kind === 'unknown' && lines.length > 12 ? '\n…' : ''}</pre>`;
    }
    return h;
  }

  function renderResult(c, notice) {
    const saved = store.get(c.id + ':result');
    const v = saved ? parseOutput(saved, c) : null;
    const act = lastAction[c.id];
    const runCmd = act && act.kind === 'run' && act.test ? command(c.id, '-Case ' + act.test) : command(c.id);
    const copied = !act ? '<b>Copy your code</b> and paste it over'
      : act.empty ? '<b>Nothing to copy yet:</b> the editor is empty. Write your program, then paste it over'
      : act.copied ? '<b>Code copied.</b> Paste it over'
      : '<b>Copy didn\'t work here:</b> the code is selected in the editor, so press Ctrl+C, then paste it over';
    $('#result').innerHTML = (notice ? `<p class="note warn">${notice}</p>` : '')
      + (act && act.warn ? `<p class="note warn">${act.warn}</p>` : '') + (v ? verdictHtml(v, c) : '') + `
      <ol class="steps">
        <li class="step${act && act.copied ? ' done' : ''}"><span>1</span><div><p>${copied} <code>${esc(c.solution)}</code>. Skip this if you edit that file directly.</p>
          <div><button class="btn" type="button" id="copy-again">Copy code</button></div></div></li>
        <li class="step"><span>2</span><div><p><b>Run the checker</b> in ${esc(DATA.shell)}, in <code>${esc(DATA.folder)}</code>:</p>${cmdRow(runCmd)}</div></li>
        <li class="step${v && v.kind !== 'unknown' ? ' done' : ''}"><span>3</span><div><p><b>Copy what the checker prints</b> in the terminal and paste it here (the result, not your code).</p>
          <textarea class="paste" id="paste" spellcheck="false" placeholder="Paste the checker's output here (Ctrl+V). It starts with “Checkpoint ${esc(c.id)} - …”"></textarea></div></li>
      </ol>
      <details class="more"><summary>More commands, and what a failure looks like</summary><div>
        ${cmdRow(command(c.id))}${cmdRow(command(c.id, '-Fresh'))}${cmdRow(command(c.id, '-Dispute <test-id> "why"'))}
        <div class="flow" style="margin-top:14px">${c.checking}</div></div></details>`;
  }

  function takeOutput(text) {
    if (!current) return;
    const c = BY[current];
    if (!text.trim()) {
      renderResult(c, 'The box was empty, so there was nothing to read. Copy what the checker printed in the terminal (everything from “Checkpoint ' + esc(c.id) + ' - …” to the last line), then paste it here.');
      return;
    }
    store.set(c.id + ':result', text);
    if (lastAction[c.id]) lastAction[c.id].warn = null;  // the pasted result says more than the Submit-time warning
    const v = parseOutput(text, c);
    if (v.kind === 'ok' && !v.single && !v.other) setSolved(c.id, true);
    renderResult(c);
    $('#result').scrollTop = 0;
  }
  $('#result').addEventListener('paste', (e) => {
    if (e.target.id !== 'paste') return;
    e.preventDefault();
    takeOutput((e.clipboardData || window.clipboardData).getData('text'));
  });
  $('#result').addEventListener('change', (e) => { if (e.target.id === 'paste') takeOutput(e.target.value); });
  $('#result').addEventListener('click', (e) => {
    if (e.target.closest('#clear-result')) { store.del(current + ':result'); renderResult(BY[current]); }
    if (e.target.closest('#copy-again')) act(lastAction[current] ? lastAction[current].kind : 'submit');
  });

  // ---- solved state
  function setSolved(id, value) {
    if (value) store.set(id + ':solved', '1'); else store.del(id + ':solved');
    if (id === current) { paintSolved(); renderEditorial(BY[id]); }
  }
  function paintSolved() {
    if (!current) return;
    const done = solved(current);
    const mark = $('#solved-mark'), btn = $('#solve-btn');
    if (mark) mark.hidden = !done;
    if (btn) { btn.innerHTML = done ? `${I.check} Solved` : 'Mark as solved'; btn.classList.toggle('done', done); }
    $('#tb-prog').innerHTML = `<b>${CPS.filter((c) => solved(c.id)).length}</b> / ${CPS.length} solved`;
  }

  // ---- editor
  let cm = null, plainEditor = null, saveTimer = 0;
  const docs = {};
  function initEditor() {
    const host = $('#editor');
    if (window.CodeMirror) {
      cm = window.CodeMirror(host, {
        lineNumbers: true, matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true, indentWithTabs: false,
        extraKeys: {
          Tab: (ed) => (ed.somethingSelected() ? ed.indentSelection('add') : ed.replaceSelection(' '.repeat(ed.getOption('indentUnit')), 'end')),
          'Shift-Tab': 'indentLess',
        },
      });
      cm.on('changes', saveSoon);
      cm.on('cursorActivity', showPos);
      if (window.ResizeObserver) {
        let frame = 0;
        new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => cm.refresh()); }).observe(host);
      }
    } else {
      plainEditor = document.createElement('textarea');
      plainEditor.className = 'fallback-editor';
      plainEditor.spellcheck = false;
      plainEditor.setAttribute('aria-label', 'Code');
      host.appendChild(plainEditor);
      plainEditor.addEventListener('input', saveSoon);
    }
  }
  const code = () => (cm ? cm.getValue() : plainEditor.value);
  // Each checkpoint starts blank; the boilerplate (input/output done) is one click away.
  const kindOf = (c) => (c.boilerplate && store.get(c.id + ':kind') === 'boilerplate' ? 'boilerplate' : 'blank');
  const starterOf = (c, kind) => (kind === 'boilerplate' && c.boilerplate ? c.boilerplate : c.starter);
  const kindName = (kind) => (kind === 'boilerplate' ? 'Boilerplate' : 'Blank');
  function setCode(text) {
    if (cm) cm.setValue(text); else plainEditor.value = text;
  }
  function useStarter(c, kind) {
    if (kind === 'boilerplate') store.set(c.id + ':kind', kind); else store.del(c.id + ':kind');
    setCode(starterOf(c, kind));
    store.del(c.id + ':draft');
    paintKind(c);
    showSaved();
  }
  function paintKind(c) {
    $('#kind').hidden = !c.boilerplate;
    $$('#kind [data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kindOf(c))));
  }
  let pendingKind = null;
  function ask(text, kind) {
    pendingKind = kind;
    $('#confirm-text').textContent = text;
    $('#confirm').hidden = false;
    $('#confirm-yes').focus();
  }
  $('#kind').addEventListener('click', (e) => {
    const b = e.target.closest('[data-kind]');
    const c = BY[current];
    if (!b || !c || b.dataset.kind === kindOf(c)) return;
    const text = code();
    if (text === c.starter || text === c.boilerplate) useStarter(c, b.dataset.kind);
    else ask(`Replace your code with the ${kindName(b.dataset.kind).toLowerCase()} starter?`, b.dataset.kind);
  });
  $('#reset').addEventListener('click', () => {
    const c = BY[current];
    ask(`Replace your code with the ${kindName(kindOf(c)).toLowerCase()} starter?`, kindOf(c));
  });
  $('#confirm-no').addEventListener('click', () => { $('#confirm').hidden = true; });
  $('#confirm-yes').addEventListener('click', () => {
    $('#confirm').hidden = true;
    if (current && pendingKind) useStarter(BY[current], pendingKind);
  });

  function loadEditor(c) {
    const draft = store.get(c.id + ':draft');
    const start = starterOf(c, kindOf(c));
    if (cm) {
      if (!docs[c.id]) docs[c.id] = window.CodeMirror.Doc(draft !== null ? draft : start, c.lang.mime);
      cm.swapDoc(docs[c.id]);
      cm.setOption('indentUnit', c.indent);
      cm.setOption('tabSize', c.indent);
    } else {
      plainEditor.value = draft !== null ? draft : start;
      plainEditor.style.tabSize = c.indent;
    }
    paintKind(c);
    $('#lang').innerHTML = `${esc(c.lang.label)} <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
    $('#file').textContent = c.solution;
    $('#confirm').hidden = true;
    showSaved();
    showPos();
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    $('#saved').textContent = 'Saving…';
    const id = current;
    saveTimer = setTimeout(() => {
      if (id !== current) return;
      const text = code();
      const c = BY[id];
      if (text === starterOf(c, kindOf(c))) store.del(id + ':draft'); else store.set(id + ':draft', text);
      showSaved();
    }, 400);
  }
  function showSaved() {
    if (!current) return;
    $('#saved').textContent = drafted(current) ? 'Saved in this browser' : `${kindName(kindOf(BY[current]))} starter`;
  }
  function showPos() {
    if (!cm) { $('#pos').textContent = ''; return; }
    const p = cm.getCursor();
    $('#pos').textContent = `Ln ${p.line + 1}, Col ${p.ch + 1}`;
  }

  // ---- clipboard
  function copyText(text) {
    try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch (e) { return Promise.resolve(false); }
  }
  function selectAllCode() {
    if (cm) { cm.focus(); cm.execCommand('selectAll'); } else { plainEditor.focus(); plainEditor.select(); }
  }
  function flash(btn, ok) {
    const old = btn.innerHTML;
    btn.innerHTML = ok ? 'Copied' : 'Press Ctrl+C';
    btn.classList.toggle('done', ok);
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove('done'); }, 1400);
  }
  $('#copy-code').addEventListener('click', () => {
    const btn = $('#copy-code');
    copyText(code()).then((ok) => {
      if (!ok) selectAllCode();
      btn.style.color = ok ? 'var(--ok)' : '';
      setTimeout(() => { btn.style.color = ''; }, 1200);
    });
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    copyText(b.dataset.copy).then((ok) => {
      if (!ok) {
        const range = document.createRange();
        range.selectNodeContents(b.previousElementSibling);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      }
      flash(b, ok);
    });
  });

  // ---- Run / Submit: copy the code, then show what to run in the terminal
  function act(kind) {
    if (!current) return;
    const c = BY[current];
    const list = casesOf(c);
    const test = kind === 'run' && list[caseIndex] ? list[caseIndex].test : null;
    const text = code();
    const entry = { kind, test, copied: false, empty: !text.trim() };
    // Say up front what the checker will answer, instead of letting it look like a failure later.
    if (entry.empty) entry.warn = `Your code is empty. The checker will answer “Not started yet” until <code>${esc(c.solution)}</code> has a program in it.`;
    else if (text.trim() === c.starter.trim()) entry.warn = 'This is still the blank starter (an empty <code>main</code>), so the checker will answer “Not started yet”. Write your program first, or pick Boilerplate above the editor for ready-made input/output code.';
    lastAction[c.id] = entry;
    if (entry.empty) {
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
      return;
    }
    copyText(text).then((ok) => {
      entry.copied = ok;
      if (!ok) selectAllCode();
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
    });
  }
  $('#run').addEventListener('click', () => act('run'));
  $('#submit').addEventListener('click', () => act('submit'));
  document.addEventListener('keydown', (e) => {
    if (!current || !(e.ctrlKey || e.metaKey) || e.target.id === 'paste') return;
    if (e.key === 'Enter') { e.preventDefault(); act('submit'); }
    else if (e.key === "'") { e.preventDefault(); act('run'); }
  }, true);

  // ---- navigation between checkpoints
  function openCheckpoint(id) {
    const c = BY[id];
    const changed = current !== id;
    current = id;
    $('#list-view').hidden = true;
    $('#ide-view').hidden = false;
    document.body.classList.add('in-ide');
    if (changed) { caseIndex = 0; solFile = 0; }
    renderDesc(c);
    renderEditorial(c);
    renderCases(c);
    renderResult(c);
    loadEditor(c);
    setLeft('desc');
    setBottom(store.get(c.id + ':result') ? 'result' : 'cases');
    $('#desc').scrollTop = 0;
    const k = CPS.indexOf(c);
    $('#prev').disabled = k === 0;
    $('#next').disabled = k === CPS.length - 1;
    $('#prev').title = k > 0 ? `${CPS[k - 1].num}. ${CPS[k - 1].title}` : '';
    $('#next').title = k < CPS.length - 1 ? `${CPS[k + 1].num}. ${CPS[k + 1].title}` : '';
    if (cm) requestAnimationFrame(() => cm.refresh());
    window.scrollTo(0, 0);
  }
  $('#prev').addEventListener('click', () => { const k = CPS.indexOf(BY[current]); if (k > 0) go('p' + CPS[k - 1].id); });
  $('#next').addEventListener('click', () => { const k = CPS.indexOf(BY[current]); if (k < CPS.length - 1) go('p' + CPS[k + 1].id); });
  $('#shuffle').addEventListener('click', () => pickOne(CPS));

  let routed = null;
  function route(hash) {
    if (hash === routed && (current || !$('#list-view').hidden)) return;
    routed = hash;
    const m = /^p(.+)$/.exec(hash || '');
    if (m && BY[m[1]]) openCheckpoint(m[1]); else showList();
  }
  function go(hash) {
    try { history.pushState(null, '', '#' + hash); } catch (e) {}
    route(hash);
  }
  // In-page links switch views directly, so they work even where hash changes don't.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented) return;
    e.preventDefault();
    go(a.getAttribute('href').slice(1));
  });
  window.addEventListener('popstate', () => route(location.hash.slice(1)));
  window.addEventListener('hashchange', () => route(location.hash.slice(1)));

  // ---- resizable panels
  function splitter(el, axis, box, prop, min, max) {
    const key = 'layout:' + prop;
    const apply = (f) => { box.style.setProperty(prop, (Math.min(max, Math.max(min, f)) * 100).toFixed(2) + '%'); };
    const saved = Number(store.get(key));
    if (saved) apply(saved);
    const fraction = () => parseFloat(box.style.getPropertyValue(prop)) / 100 || (axis === 'x' ? 0.45 : 0.6);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      const rect = box.getBoundingClientRect();
      const move = (ev) => apply(axis === 'x' ? (ev.clientX - rect.left) / rect.width : (ev.clientY - rect.top) / rect.height);
      const up = () => {
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        store.set(key, String(fraction()));
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
    el.addEventListener('keydown', (e) => {
      const step = { ArrowLeft: -0.02, ArrowUp: -0.02, ArrowRight: 0.02, ArrowDown: 0.02 }[e.key];
      if (!step) return;
      e.preventDefault();
      apply(fraction() + step);
      store.set(key, String(fraction()));
    });
  }
  splitter($('#split-v'), 'x', $('#ide-main'), '--left', 0.25, 0.7);
  splitter($('#split-h'), 'y', $('#right'), '--top', 0.2, 0.85);

  renderListShell();
  initEditor();
  route(location.hash.slice(1));
})();
</script>
