<title>Tiny TrueType Workbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* A problem book in the style of a coding-practice site: a problem list, then a split view with
   the statement on the left and an editor + test cases on the right. Everything is rendered from
   the JSON in #book-data (written by tools/build_book.py), so the template fits any workbook. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Monaco, Consolas, "Courier New", monospace;

  --bg: #f0f0f0;            /* page, behind the panels */
  --layer: #ffffff;         /* panels and cards */
  --layer-head: #fafafa;    /* panel tab bars */
  --fill: #f2f3f5;          /* chips, input boxes, buttons */
  --fill-hover: #e7e8eb;
  --row-alt: #f7f8fa;       /* striped list rows */
  --line: #e7e7e7;
  --line-strong: #d4d4d8;
  --text: #262626;
  --text-2: #595959;
  --text-3: #8c8c8c;
  --brand: #ffa116;         /* orange accent */
  --brand-ink: #b46a00;     /* orange that reads as text on light */
  --link: #0a6fd8;
  --easy: #00a38f;
  --medium: #c98300;
  --hard: #f02a50;
  --ok: #2db55d;
  --bad: #e5383b;
  --on-color: #ffffff;      /* text on --ok / --brand */
  --code-bg: #f5f6f7;
  --sel: #cde2ff;
  --sel-blur: #e3e6ea;
  --active-line: #f6f8fb;
  --icon-desc: #007aff;
  --icon-ed: #f08c00;
  --icon-code: #02a12f;
  --syn-text: #262626; --syn-kw: #0000ff; --syn-type: #267f99; --syn-str: #a31515; --syn-num: #098658;
  --syn-com: #008000; --syn-fn: #795e26; --syn-meta: #af00db; --syn-var: #001080;
  /* For figures on problem pages (inline SVG): these follow the theme. */
  --ink: var(--text); --muted: var(--text-2); --rule: var(--line); --surface: var(--layer);
  --fig-a: #2f55e4; --fig-b: #d9591f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
    --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
    --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
    --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
    --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
    --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
    --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
    --fig-a: #7f9cff; --fig-b: #ff8d5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
  --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
  --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
  --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
  --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
  --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
  --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
  --fig-a: #7f9cff; --fig-b: #ff8d5c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 var(--font-ui); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; border-radius: 4px; }
code, pre, kbd, samp { font-family: var(--font-mono); }
svg { flex: none; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--text-3); }

/* ---------- shared bits ---------- */
.chip { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 999px; border: 0;
  background: var(--fill); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { color: var(--text); background: var(--fill-hover); }
.easy { color: var(--easy) !important; } .medium { color: var(--medium) !important; } .hard { color: var(--hard) !important; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; border: 0;
  background: var(--fill); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill-hover); }
.btn.green { background: var(--ok); color: var(--on-color); }
.btn.green:hover { filter: brightness(1.08); }
.btn.done { color: var(--ok); }
.icon-btn { width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; display: inline-grid; place-items: center;
  color: var(--text-2); cursor: pointer; }
.icon-btn:hover { background: var(--fill); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.cmd { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 8px; padding: 5px 5px 5px 12px; min-width: 0; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; scrollbar-width: thin; }
.cmd .btn { height: 26px; padding: 0 10px; font-size: 12px; background: var(--layer); }
.cmd .btn:hover { background: var(--fill-hover); }

/* ---------- problem list ---------- */
.nav { background: var(--layer); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  padding-top: env(safe-area-inset-top, 0px); }
.nav-in { max-width: 1200px; margin: 0 auto; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: 15px; }
.brand:hover { text-decoration: none; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #1a1a1a; display: grid; place-items: center;
  font: 700 14px/1 var(--font-mono); }
.nav-src { color: var(--text-3); font-size: 13px; margin-left: auto; }
.list-wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 20px 28px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "prog" "plist" "how"; }
.side { display: contents; }
.side .prog { grid-area: prog; } .side .how { grid-area: how; }
@media (min-width: 1000px) {
  .list-wrap { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "hero side" "plist side"; align-items: start; }
  .side { display: grid; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .side .prog, .side .how { grid-area: auto; }
}
.hero { grid-area: hero; display: grid; gap: 8px; }
.hero .over { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink); }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); max-width: 70ch; }
.side { grid-area: side; gap: 16px; }
.plist { grid-area: plist; display: grid; gap: 14px; min-width: 0; }
.card { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }

.prog { grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 18px; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-c b { font-size: 24px; font-weight: 600; }
.ring-c span { color: var(--text-3); font-size: 13px; }
.ring-c small { color: var(--text-2); font-size: 12px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.bar-row .n { color: var(--text-2); }
.bar-row .n b { color: var(--text); font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.bar-row[aria-pressed="true"] .lbl { text-decoration: underline; text-underline-offset: 3px; }
.how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: how; }
.how li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 13px; color: var(--text-2); counter-increment: how; }
.how li::before { content: counter(how); width: 20px; height: 20px; border-radius: 50%; background: var(--fill); color: var(--text-2);
  display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-top: 1px; }
.how b { color: var(--text); font-weight: 600; }
.how code, .credits code { font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 4px; }
.path { font: 12px/1.5 var(--font-mono); color: var(--text-3); word-break: break-all; }

.topics { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.topics.collapsed .tchip:nth-child(n + 13) { display: none; }
.tchip { height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 999px;
  background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.tchip:hover { color: var(--text); background: var(--fill); }
.tchip sup { color: var(--text-3); font-size: 10px; }
.tchip[aria-pressed="true"] { background: var(--text); color: var(--layer); }
.tchip[aria-pressed="true"] sup { color: var(--layer); opacity: .7; }
.topics .more { color: var(--link); background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0 8px; height: 28px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; max-width: 340px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--fill); border-radius: 8px; color: var(--text-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: 13px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--layer); color: var(--text); font-weight: 500; }
.seg.small { flex: none; }
.seg.small button { height: 24px; padding: 0 9px; font-size: 12px; }
.pick { margin-left: auto; height: 32px; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.pick span { width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: var(--on-color); display: grid; place-items: center; }
.pick:hover { color: var(--text); }
.table-scroll { overflow-x: auto; }
.ptable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.ptable th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ptable td { padding: 11px 12px; white-space: nowrap; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(odd) td { background: var(--row-alt); }
.ptable tbody tr td:first-child { border-radius: 8px 0 0 8px; }
.ptable tbody tr td:last-child { border-radius: 0 8px 8px 0; }
.ptable tbody tr:hover td { background: var(--fill); }
.ptable .st { width: 44px; }
.ptable .ti { white-space: normal; min-width: 220px; }
.ptable .ti a { color: var(--text); font-weight: 500; }
.ptable .ti a:hover { color: var(--link); text-decoration: none; }
.ptable .te { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); width: 80px; }
.ptable .di { width: 96px; font-weight: 500; }
.ptable th.te { text-align: right; }
.st-ok { color: var(--ok); display: inline-grid; }
.st-try { color: var(--medium); display: inline-grid; }
.credits { margin: 6px 0 0; color: var(--text-3); font-size: 12px; max-width: 80ch; }

/* ---------- problem view ---------- */
.ide { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; padding-bottom: 10px; }
body.in-ide { overflow: hidden; }
.topbar { flex: none; height: 50px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-right { justify-self: end; gap: 10px; }
.tb-left .logo { margin-right: 8px; }
.tb-link { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; color: var(--text); font-weight: 500; white-space: nowrap; }
.tb-link:hover { background: var(--fill); text-decoration: none; }
.tb-mid { display: flex; gap: 1px; }
.act { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; border: 0; background: var(--fill); cursor: pointer; font-weight: 600; }
.act:hover { background: var(--fill-hover); }
.act.run { border-radius: 8px 0 0 8px; color: var(--text-2); }
.act.submit { border-radius: 0 8px 8px 0; color: var(--ok); }
.tb-prog { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.tb-prog b { color: var(--text); font-weight: 600; }
.ide-main { flex: 1; min-height: 0; display: flex; }
.panel { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.left { flex: 0 0 var(--left, 45%); }
.right { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.code { flex: 0 0 var(--top, 60%); }
.tests { flex: 1; }
.splitter { flex: 0 0 8px; position: relative; touch-action: none; }
.splitter::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background .15s; }
.splitter.v { cursor: col-resize; } .splitter.v::after { top: 30%; bottom: 30%; left: 3px; width: 2px; }
.splitter.h { cursor: row-resize; } .splitter.h::after { left: 30%; right: 30%; top: 3px; height: 2px; }
.splitter:hover::after, .splitter.dragging::after, .splitter:focus-visible::after { background: var(--link); top: 0; bottom: 0; left: 3px; }
.splitter.h:hover::after, .splitter.h.dragging::after, .splitter.h:focus-visible::after { left: 0; right: 0; top: 3px; bottom: auto; }
.splitter:focus-visible { outline: none; }

.panel-head { flex: none; height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--layer-head);
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptab { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 6px; background: none;
  color: var(--text-2); cursor: pointer; font-weight: 500; white-space: nowrap; font-size: 13px; }
.ptab:hover { background: var(--fill); color: var(--text); }
.ptab[aria-selected="true"] { color: var(--text); font-weight: 600; }
.ptab.static { cursor: default; color: var(--text); font-weight: 600; } .ptab.static:hover { background: none; }
.sep { width: 1px; height: 14px; background: var(--line-strong); margin: 0 2px; flex: none; }
.ico-desc { color: var(--icon-desc); } .ico-ed { color: var(--icon-ed); } .ico-code { color: var(--icon-code); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }

/* statement */
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.d-head h1 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.solved-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-size: 13px; white-space: nowrap; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.callout { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; background: var(--fill); border-radius: 8px; padding: 10px 14px;
  color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
.callout svg { margin-top: 3px; color: var(--brand-ink); }
.callout p { margin: 0; }
.callout b { color: var(--text); font-weight: 600; }
.flow > * { margin: 0; }
.flow > * + * { margin-top: 12px; }
.flow > h2:not(:first-child) { margin-top: 26px; }
.flow > h3:not(:first-child) { margin-top: 20px; }
.flow > h4:not(:first-child) { margin-top: 16px; }
.flow > .d-sec:not(:first-child), .flow > .examples { margin-top: 26px; }
.flow h2 { font-size: 15px; font-weight: 600; }
.flow h3 { font-size: 14px; font-weight: 600; }
.flow h4 { font-size: 14px; font-weight: 500; }
.flow ul, .flow ol { padding-left: 22px; }
.flow li + li { margin-top: 4px; }
.flow :not(pre) > code { font-size: 12.5px; background: var(--fill); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; color: var(--text); }
.flow pre { background: var(--code-bg); border-radius: 8px; padding: 10px 14px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
.flow pre code { font-size: inherit; }
.flow strong { font-weight: 600; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.flow table { border-collapse: collapse; width: 100%; font-size: 13px; }
.flow th, .flow td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.flow tr:last-child td { border-bottom: 0; }
.flow th { font-weight: 600; background: var(--layer-head); color: var(--text-2); }
.reqs { list-style: none; padding: 0 !important; display: grid; gap: 8px; }
.reqs li + li { margin-top: 0; }
.reqs li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.rid { font: 600 12px/1.6 var(--font-mono); color: var(--brand-ink); }
.ex + .ex { margin-top: 22px; }
.ex-title { margin: 0 0 8px; }
.ex-title strong { font-weight: 600; }
.ex-title span { color: var(--text-2); }
.ex-block { border-left: 2px solid var(--line-strong); padding-left: 14px; display: grid; gap: 8px; min-width: 0; }
.ex-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; }
.ex-k { font-weight: 600; font-size: 13px; }
.ex-row > pre { margin: 0; padding: 0; background: none; color: var(--text-2); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
.ex-row .flow { color: var(--text-2); }
img.shot, figure.pic img { max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #000; display: block; }
figure.pic { display: grid; gap: 4px; justify-items: start; }
figure.pic figcaption { font: 11px/1.3 var(--font-mono); color: var(--text-3); }
figure.split-figure { display: grid; gap: 14px; align-items: center; }
@media (min-width: 720px) { figure.split-figure { grid-template-columns: 200px minmax(0, 1fr); } }
figure.split-figure svg { width: 100%; max-width: 200px; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.dot.a { background: var(--fig-a); } .dot.b { border: 2px solid var(--fig-b); }
.md-details summary { cursor: pointer; font-weight: 500; }

.accs { margin-top: 30px; border-top: 1px solid var(--line); }
.acc { border-bottom: 1px solid var(--line); }
.acc-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 2px; background: none; border: 0; cursor: pointer; color: var(--text); text-align: left; font-weight: 500; }
.acc-btn:disabled { cursor: not-allowed; color: var(--text-3); }
.acc-btn > svg:first-child { color: var(--text-2); }
.acc-sub { color: var(--text-3); font-weight: 400; margin-left: 8px; }
.acc-lock { color: var(--text-3); display: inline-grid; }
.chev { margin-left: auto; display: inline-grid; color: var(--text-3); transition: transform .15s; }
.acc-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-body { padding: 0 2px 16px 28px; color: var(--text-2); }
.tg + .tg { margin-top: 10px; }
.tg-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.tg-items { display: flex; flex-wrap: wrap; gap: 6px; }
.tg-items .chip { height: auto; min-height: 24px; white-space: normal; padding: 2px 10px; }
.tg-items code { font-size: 11.5px; }
.d-foot { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; color: var(--text-3); font-size: 12px; }
.ed-title { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
.ed-sec { display: grid; gap: 10px; margin-bottom: 28px; min-width: 0; }
.ed-sec > h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ed-sec .note { margin: 0; }
.badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--fill); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--medium); }
.badge svg { width: 14px; height: 14px; }
.sol-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.sol-head code { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sol-head .btn { height: 26px; font-size: 12px; }
.sol-code { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 12.5px/1.6 var(--font-mono); color: var(--syn-text); tab-size: 2; }
#editorial .case-pills { margin-bottom: 0; }
.locked { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--text-2); }
.locked svg { width: 28px; height: 28px; color: var(--brand); }
.locked h2 { margin: 0; color: var(--text); font-size: 16px; font-weight: 600; }
.locked p { margin: 0; max-width: 46ch; }

/* editor */
.code-tools { flex: none; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.lang { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--text-2); font-size: 13px; white-space: nowrap; cursor: help; }
.file { font: 12px var(--font-mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tools-right { margin-left: auto; display: flex; align-items: center; gap: 2px; flex: none; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); margin-right: 4px; }
.confirm .btn { height: 26px; padding: 0 10px; font-size: 12px; }
.editor { flex: 1; min-height: 0; position: relative; }
.editor > .CodeMirror, .editor > .fallback-editor { position: absolute; inset: 0; height: auto; }
.code-status { flex: none; height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); }
.fallback-editor { width: 100%; height: 100%; border: 0; resize: none; padding: 8px 12px; background: var(--layer); color: var(--text);
  font: 14px/1.6 var(--font-mono); white-space: pre; outline: none; tab-size: 2; }

/* test cases and results */
.case-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pill-btn { height: 30px; padding: 0 14px; border-radius: 8px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-weight: 500; font-size: 13px; }
.pill-btn:hover { background: var(--fill); color: var(--text); }
.pill-btn[aria-selected="true"] { background: var(--fill); color: var(--text); }
.case-name { margin: -4px 0 12px; color: var(--text-2); font-size: 13px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-bottom: 14px; min-width: 0; }
.field-k { font-size: 12px; color: var(--text-3); }
.field-v { margin: 0; background: var(--fill); border-radius: 8px; padding: 10px 12px; font: 13px/1.6 var(--font-mono); color: var(--text); overflow-x: auto; white-space: pre; }
.field img { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; }
.verdict { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 14px; }
.verdict h2 { margin: 0; font-size: 20px; font-weight: 600; }
.verdict.ok h2 { color: var(--ok); } .verdict.bad h2 { color: var(--bad); } .verdict.warn h2 { color: var(--medium); } .verdict.unknown h2 { color: var(--text-2); }
.verdict .sub { color: var(--text-3); font-size: 13px; }
.verdict .btn { margin-left: auto; height: 26px; font-size: 12px; }
.note { margin: 0 0 12px; font-size: 13px; color: var(--text-2); }
.note.warn { color: var(--medium); }
.req-rows { display: grid; gap: 8px; margin-bottom: 16px; }
.req-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 3px 8px; align-items: center; font-size: 12.5px; }
.req-row .rq { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req-row .cnt { font-variant-numeric: tabular-nums; color: var(--text-2); }
.req-row .bar { grid-column: 2 / -1; height: 4px; color: var(--ok); }
.req-row.fail .bar, .req-row.fail .cnt { color: var(--bad); }
.fail-card { background: var(--fill); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-bottom: 8px; min-width: 0; }
.fail-card .id { font: 600 12.5px var(--font-mono); color: var(--bad); }
.fail-card .t { color: var(--text); font-size: 13px; }
.fail-card pre, pre.raw { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.55 var(--font-mono); color: var(--text-2); }
pre.raw { background: var(--fill); border-radius: 8px; padding: 10px 12px; max-height: 260px; overflow: auto; margin-bottom: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
.step > span { width: 22px; height: 22px; border-radius: 50%; background: var(--fill); color: var(--text-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.step.done > span { background: var(--ok); color: var(--on-color); }
.step > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.step p { margin: 0; color: var(--text-2); font-size: 13px; }
.step p b { color: var(--text); font-weight: 600; }
.step p code { font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
textarea.paste { width: 100%; min-height: 84px; resize: vertical; background: var(--fill); border: 1px solid transparent; border-radius: 8px;
  padding: 10px 12px; font: 12px/1.5 var(--font-mono); color: var(--text); }
textarea.paste:focus { border-color: var(--link); outline: none; }
details.more { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
details.more summary { cursor: pointer; color: var(--text-2); font-size: 13px; }
details.more > div { margin-top: 12px; }
details.more .cmd + .cmd { margin-top: 6px; }

@media (max-width: 899px) {
  .ide { height: auto; padding-bottom: 24px; }
  body.in-ide { overflow: auto; }
  .topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); height: auto; min-height: 50px; }
  .ide-main { flex-direction: column; gap: 10px; }
  .left, .code { flex: none; }
  .left .panel-body { overflow: visible; }
  .right { gap: 10px; }
  .code { height: 72vh; }
  .tests { flex: none; }
  .tests .panel-body { overflow: visible; }
  .splitter { display: none; }
  .tb-link span, .tb-prog, .tb-left .logo, #shuffle { display: none; }
}
@media (max-width: 560px) {
  .ptable .te { display: none; }
  .ptable .ti { min-width: 0; }
  .pick { margin-left: 0; }
}
@media (max-width: 420px) {
  .act { padding: 0 12px; }
  .panel-body { padding: 16px 14px 24px; }
}

<script type="application/json" id="book-data">{"key":"tiny-truetype-workbook","title":"Tiny TrueType Workbook","headline":"Build a TrueType renderer yourself","lede":"Each checkpoint asks you to write the program that one part of the blog post builds, from reading big-endian bytes to drawing a line of text. A checker feeds your program inputs and compares what it writes with answers worked out independently, mostly by fontTools. How you structure the code, and which language or library you use, is up to you.","credits":"Fonts: JetBrains Mono (Nerd Font build) and Noto Sans JP, both under the SIL Open Font License. Expected outputs come from fontTools. Progress is saved in this browser only.","sourceUrl":"https://yayo1.com/en/blog/tiny-truetype-renderer/","sourceTitle":"Writing a tiny TrueType parser and renderer from scratch","author":"Yohei Yamasaki","folder":"tiny-truetype-renderer","check":".\\check {id}","shell":"PowerShell","checkpoints":[{"id":"01","num":"1","title":"Read big-endian numbers","difficulty":"Easy","tests":28,"solution":"solutions/p01_byte_readers.cpp","problem":"problems/01-byte-readers.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 01 - Read big-endian numbers\n//\n// Problem:  problems/01-byte-readers.md (also in the web problem book)\n// Check:    .\\check 01\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p01.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p01_byte_readers.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 01 - Read big-endian numbers\n//\n// Problem:  problems/01-byte-readers.md (also in the web problem book)\n// Check:    .\\check 01\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on the ByteReader functions marked TODO.\n//\n// This checkpoint is about writing the readers yourself, so don't include\n// provided/BigEndian.h here. Later checkpoints may use it (or your own reader).\n\n#include <cstdint>\n#include <fstream>\n#include <iomanip>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <type_traits>\n\n#include \"NotImplemented.h\"\n\n// Throw this when a read needs bytes past the end of the file.\n// The provided code catches it, writes `eof` and stops.\nstruct UnexpectedEof : std::runtime_error {\n  UnexpectedEof() : std::runtime_error(\"unexpected EOF\") {}\n};\n\nclass ByteReader {\n public:\n  explicit ByteReader(const std::string& path) : file_(path, std::ios::binary) {\n    if (!file_) throw std::runtime_error(\"cannot open \" + path);\n  }\n\n  // Moves to byte `offset`, counted from the start of the file.\n  void jumpTo(uint32_t offset) {\n    // TODO: move the read position of file_.\n    throw NotImplemented(\"jumpTo\");\n  }\n\n  // Moves `count` bytes forward from the current position.\n  void skipBytes(uint32_t count) {\n    // TODO: move the read position of file_.\n    throw NotImplemented(\"skipBytes\");\n  }\n\n  // Reads sizeof(T) bytes, most significant first, as a T (uint8_t ... int32_t).\n  // Throws UnexpectedEof if the file ends before all the bytes are read.\n  template <typename T>\n  T readBigEndian() {\n    // TODO: read the bytes one at a time with file_.get(), build the number,\n    // and for signed T turn the bit pattern into a negative number when the\n    // top bit is set (two's complement).\n    throw NotImplemented(\"readBigEndian\");\n  }\n\n  uint8_t readUint8() { return readBigEndian<uint8_t>(); }\n  uint16_t readUint16() { return readBigEndian<uint16_t>(); }\n  uint32_t readUint32() { return readBigEndian<uint32_t>(); }\n  int8_t readInt8() { return readBigEndian<int8_t>(); }\n  int16_t readInt16() { return readBigEndian<int16_t>(); }\n  int32_t readInt32() { return readBigEndian<int32_t>(); }\n\n  // Reads an F2Dot14: a 16-bit number with 14 fraction bits.\n  double readF2Dot14() {\n    // TODO: see \"F2Dot14\" on the problem page.\n    throw NotImplemented(\"readF2Dot14\");\n  }\n\n private:\n  std::ifstream file_;\n};\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\n// k / 16384 has at most 14 digits after the point, so this prints it exactly.\nstd::string decimal(const double value) {\n  std::ostringstream s;\n  s << std::fixed << std::setprecision(14) << value;\n  std::string text = s.str();\n  text.erase(text.find_last_not_of('0') + 1);\n  if (text.back() == '.') text.pop_back();\n  return text == \"-0\" ? \"0\" : text;\n}\n\n// Runs one operation. Read operations write one line, `<op> <value>`.\n// The value is read before anything is written, so a read that fails writes nothing.\n// (The + in front of 8-bit values prints them as numbers, not characters.)\nvoid run(ByteReader& reader, const std::string& op, std::istringstream& words, std::ostream& out) {\n  const auto line = [&](const auto& value) { out << op << ' ' << value << '\\n'; };\n  if (op == \"jump\" || op == \"skip\") {\n    uint32_t n = 0;\n    words >> n;\n    if (op == \"jump\") reader.jumpTo(n);\n    else reader.skipBytes(n);\n  } else if (op == \"u8\") {\n    line(+reader.readUint8());\n  } else if (op == \"i8\") {\n    line(+reader.readInt8());\n  } else if (op == \"u16\") {\n    line(reader.readUint16());\n  } else if (op == \"i16\") {\n    line(reader.readInt16());\n  } else if (op == \"u32\") {\n    line(reader.readUint32());\n  } else if (op == \"i32\") {\n    line(reader.readInt32());\n  } else if (op == \"f2dot14\") {\n    line(decimal(reader.readF2Dot14()));\n  } else if (!op.empty()) {\n    throw std::runtime_error(\"unknown operation \" + op);\n  }\n}\n\n}  // namespace\n\n// Usage: p01 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::string line, keyword, path;\n    std::getline(input, line);  // file <path>\n    std::istringstream first(line);\n    first >> keyword >> path;\n    if (keyword != \"file\") throw std::runtime_error(\"the first line must be: file <path>\");\n    ByteReader reader(path);\n    while (std::getline(input, line)) {  // one operation per line\n      std::istringstream words(line);\n      std::string op;\n      words >> op;\n      try {\n        run(reader, op, words, output);\n      } catch (const UnexpectedEof&) {\n        output << \"eof\\n\";  // a read ran past the end: report it and stop\n        break;\n      }\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["fixed-width integers (<code>uint8_t<\/code> ... <code>int32_t<\/code>)","bit shifts and OR","two's complement","templates (optional)","exceptions"],"text":["fixed-width integers (uint8_t ... int32_t)","bit shifts and OR","two's complement","templates (optional)","exceptions"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>get<\/code>, <code>seekg<\/code>)","<code>std::char_traits&lt;char&gt;::eof()<\/code>"],"text":["std::ifstream in binary mode (get, seekg)","std::char_traits<char>::eof()"]},{"label":"Concepts","items":["big-endian byte order","signed vs unsigned integers","fixed-point numbers (F2Dot14)","file offsets"],"text":["big-endian byte order","signed vs unsigned integers","fixed-point numbers (F2Dot14)","file offsets"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that opens a binary file, runs a list of read and move operations on it, and prints every number it reads.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p01_byte_readers.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p01_byte_readers.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in the <code>ByteReader<\/code> functions marked TODO: <code>jumpTo<\/code>, <code>skipBytes<\/code>, <code>readBigEndian<\/code> and <code>readF2Dot14<\/code>. Don't use <code>provided/BigEndian.h<\/code> here: this checkpoint is where you write those readers yourself.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The first line of the input file names the file to read. Every other line is one operation:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>file &lt;path&gt;<\/code><\/td><td>The binary file to read (first line only). The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>u8<\/code>, <code>u16<\/code>, <code>u32<\/code><\/td><td>Read an unsigned integer of 1, 2 or 4 bytes at the current position.<\/td><\/tr><tr><td><code>i8<\/code>, <code>i16<\/code>, <code>i32<\/code><\/td><td>Read a signed integer of 1, 2 or 4 bytes.<\/td><\/tr><tr><td><code>f2dot14<\/code><\/td><td>Read a 2-byte F2Dot14 number (see below).<\/td><\/tr><tr><td><code>jump &lt;offset&gt;<\/code><\/td><td>Move to byte <code>offset<\/code>, counted from the start of the file. Byte 0 is the first byte.<\/td><\/tr><tr><td><code>skip &lt;count&gt;<\/code><\/td><td>Move <code>count<\/code> bytes forward from the current position.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The position starts at byte 0. Each read moves it forward by the number of bytes it read. A <code>jump<\/code> or <code>skip<\/code> may land at or past the end of the file. That is not an error by itself, but the next read will run out of bytes.<\/p>\n<h3>Output<\/h3>\n<p>For each read operation, in input order, write one line: the operation's name, a space, and the value in decimal. For example <code>u16 65535<\/code>, <code>i16 -1<\/code> or <code>f2dot14 1.75<\/code>. <code>jump<\/code> and <code>skip<\/code> write nothing.<\/p>\n<p>The boilerplate's output code prints F2Dot14 values exactly (they never have more than 14 digits after the decimal point). If you write your own output code, any value within 0.000001 of the exact one is accepted.<\/p>\n<p><strong>Running out of bytes.<\/strong> If a read needs a byte past the end of the file, write the line <code>eof<\/code> instead, and stop: run no further operations. A read that ends exactly on the last byte of the file is fine.<\/p>\n<h3>Big-endian byte order<\/h3>\n<p>TrueType stores the most significant byte first. The two bytes <code>12 34<\/code> hold <code>0x1234<\/code> = 4660 (a little-endian reader would get <code>0x3412<\/code> = 13330 instead). With the bytes b0, b1, b2, b3 in file order:<\/p>\n<ul><li>u16 = b0 × 256 + b1<\/li><li>u32 = b0 × 2^24 + b1 × 2^16 + b2 × 2^8 + b3<\/li><\/ul>\n<div class=\"table-wrap\"><table><thead><tr><th>Operation<\/th><th>Bytes<\/th><th>Values<\/th><\/tr><\/thead><tbody><tr><td><code>u8<\/code><\/td><td>1<\/td><td>0 to 255<\/td><\/tr><tr><td><code>u16<\/code><\/td><td>2<\/td><td>0 to 65535<\/td><\/tr><tr><td><code>u32<\/code><\/td><td>4<\/td><td>0 to 4294967295<\/td><\/tr><tr><td><code>i8<\/code><\/td><td>1<\/td><td>−128 to 127<\/td><\/tr><tr><td><code>i16<\/code><\/td><td>2<\/td><td>−32768 to 32767<\/td><\/tr><tr><td><code>i32<\/code><\/td><td>4<\/td><td>−2147483648 to 2147483647<\/td><\/tr><tr><td><code>f2dot14<\/code><\/td><td>2<\/td><td>−2 to 1.99993896484375<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Signed numbers: two's complement<\/h3>\n<p>A signed read takes the same bytes as the unsigned read of the same size. Call the unsigned result u and the size in bits n (8, 16 or 32). If the top bit is set, that is, u ≥ 2^(n−1), the value is u − 2^n. Otherwise it is u.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bytes<\/th><th>Unsigned<\/th><th>Signed<\/th><\/tr><\/thead><tbody><tr><td><code>7f<\/code><\/td><td>127<\/td><td>127<\/td><\/tr><tr><td><code>80<\/code><\/td><td>128<\/td><td>128 − 256 = −128<\/td><\/tr><tr><td><code>ff<\/code><\/td><td>255<\/td><td>255 − 256 = −1<\/td><\/tr><tr><td><code>fe d4<\/code><\/td><td>65236<\/td><td>65236 − 65536 = −300<\/td><\/tr><tr><td><code>80 00 00 00<\/code><\/td><td>2147483648<\/td><td>−2147483648<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>F2Dot14<\/h3>\n<p>An F2Dot14 is a fixed-point number: 2 bits before the binary point and 14 after. Read the 2 bytes as an <code>i16<\/code>, then divide by 16384 (2^14). The OpenType specification gives these examples:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bytes<\/th><th>As <code>i16<\/code><\/th><th>Value<\/th><th>The spec rounds it to<\/th><\/tr><\/thead><tbody><tr><td><code>7f ff<\/code><\/td><td>32767<\/td><td>1.99993896484375<\/td><td>1.999939<\/td><\/tr><tr><td><code>70 00<\/code><\/td><td>28672<\/td><td>1.75<\/td><td>1.75<\/td><\/tr><tr><td><code>00 01<\/code><\/td><td>1<\/td><td>0.00006103515625<\/td><td>0.000061<\/td><\/tr><tr><td><code>00 00<\/code><\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td><code>ff ff<\/code><\/td><td>−1<\/td><td>−0.00006103515625<\/td><td>−0.000061<\/td><\/tr><tr><td><code>80 00<\/code><\/td><td>−32768<\/td><td>−2<\/td><td>−2<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Fonts use F2Dot14 for the scale factors of compound glyphs (checkpoint 9) and for variable-font axis coordinates.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>u8<\/code>, <code>u16<\/code> and <code>u32<\/code> read 1, 2 and 4 bytes, most significant byte first, as non-negative numbers.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>i8<\/code>, <code>i16<\/code> and <code>i32<\/code> read the same bytes as two's complement, so a set top bit gives a negative number.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>f2dot14<\/code> is the <code>i16<\/code> value divided by 16384.<\/span><\/li><li><span class=\"rid\">R4<\/span><span><code>jump<\/code> moves to an absolute offset. <code>skip<\/code> moves forward from the current position. Each read moves forward by its own size.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A read that needs bytes past the end of the file writes <code>eof<\/code>, and nothing is written after it.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Offsets and counts are whole numbers from 0 to 4294967295. A <code>jump<\/code> followed by <code>skip<\/code>s can move the position past 4294967295, so keep the position in a 64-bit number (or let the stream do it): a 32-bit position would wrap around and read the wrong bytes.<\/li><li>The files are hand-made files of up to 64 bytes (one is empty) and the two fonts in <code>fonts/<\/code> (2.4 MB and 9.6 MB).<\/li><li>Each input has at most 40 operations.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 28 tests: hand-made files for each rule (sign boundaries, the spec's F2Dot14 table, jumps and skips, every way to run out of bytes), header fields of both fonts, F2Dot14 values from Noto Sans JP's <code>avar<\/code> table, and 4 random files with random operations.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p01_byte_readers.cpp","text":"// Reference solution - checkpoint 01 (read big-endian numbers).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cstdint>\n#include <fstream>\n#include <iomanip>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <type_traits>\n\n// Thrown when a read needs bytes past the end of the file.\nstruct UnexpectedEof : std::runtime_error {\n  UnexpectedEof() : std::runtime_error(\"unexpected EOF\") {}\n};\n\nclass ByteReader {\n public:\n  explicit ByteReader(const std::string& path) : file_(path, std::ios::binary) {\n    if (!file_) throw std::runtime_error(\"cannot open \" + path);\n  }\n\n  void jumpTo(const uint32_t offset) {\n    file_.clear();  // a jump always starts from a clean state\n    file_.seekg(offset, std::ios::beg);\n  }\n\n  void skipBytes(const uint32_t count) { file_.seekg(count, std::ios::cur); }\n\n  template <typename T>\n  T readBigEndian() {\n    static_assert(std::is_integral_v<T> && sizeof(T) <= 4);\n    uint64_t value = 0;\n    for (std::size_t i = 0; i < sizeof(T); ++i) {\n      const int c = file_.get();\n      if (c == std::char_traits<char>::eof()) throw UnexpectedEof();\n      value = value << 8 | static_cast<uint8_t>(c);  // most significant byte first\n    }\n    if constexpr (std::is_signed_v<T>) {\n      const uint64_t range = uint64_t{1} << (8 * sizeof(T));  // 2^bits\n      if (value >= range / 2) return static_cast<T>(static_cast<int64_t>(value) - static_cast<int64_t>(range));\n    }\n    return static_cast<T>(value);\n  }\n\n  uint8_t readUint8() { return readBigEndian<uint8_t>(); }\n  uint16_t readUint16() { return readBigEndian<uint16_t>(); }\n  uint32_t readUint32() { return readBigEndian<uint32_t>(); }\n  int8_t readInt8() { return readBigEndian<int8_t>(); }\n  int16_t readInt16() { return readBigEndian<int16_t>(); }\n  int32_t readInt32() { return readBigEndian<int32_t>(); }\n\n  double readF2Dot14() { return readInt16() / 16384.0; }\n\n private:\n  std::ifstream file_;\n};\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\n// k / 16384 has at most 14 digits after the point, so this prints it exactly.\nstd::string decimal(const double value) {\n  std::ostringstream s;\n  s << std::fixed << std::setprecision(14) << value;\n  std::string text = s.str();\n  text.erase(text.find_last_not_of('0') + 1);\n  if (text.back() == '.') text.pop_back();\n  return text == \"-0\" ? \"0\" : text;\n}\n\n// Runs one operation. Read operations write one line, `<op> <value>`.\n// The value is read before anything is written, so a read that fails writes nothing.\n// (The + in front of 8-bit values prints them as numbers, not characters.)\nvoid run(ByteReader& reader, const std::string& op, std::istringstream& words, std::ostream& out) {\n  const auto line = [&](const auto& value) { out << op << ' ' << value << '\\n'; };\n  if (op == \"jump\" || op == \"skip\") {\n    uint32_t n = 0;\n    words >> n;\n    if (op == \"jump\") reader.jumpTo(n);\n    else reader.skipBytes(n);\n  } else if (op == \"u8\") {\n    line(+reader.readUint8());\n  } else if (op == \"i8\") {\n    line(+reader.readInt8());\n  } else if (op == \"u16\") {\n    line(reader.readUint16());\n  } else if (op == \"i16\") {\n    line(reader.readInt16());\n  } else if (op == \"u32\") {\n    line(reader.readUint32());\n  } else if (op == \"i32\") {\n    line(reader.readInt32());\n  } else if (op == \"f2dot14\") {\n    line(decimal(reader.readF2Dot14()));\n  } else if (!op.empty()) {\n    throw std::runtime_error(\"unknown operation \" + op);\n  }\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string line, keyword, path;\n    std::getline(input, line);\n    std::istringstream first(line);\n    first >> keyword >> path;\n    if (keyword != \"file\") throw std::runtime_error(\"the first line must be: file <path>\");\n    ByteReader reader(path);\n    while (std::getline(input, line)) {\n      std::istringstream words(line);\n      std::string op;\n      words >> op;\n      try {\n        run(reader, op, words, output);\n      } catch (const UnexpectedEof&) {\n        output << \"eof\\n\";  // a read ran past the end: report it and stop\n        break;\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":28,"total":28,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <strong>\"What is TrueType?\"<\/strong> section for the big picture, then <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Reading%20.ttf%20files\" target=\"_blank\" rel=\"noopener\">Reading .ttf files<\/a>. That section has a single paragraph, starting \"Let's create a FontParser class\". The author's code comes right after it, below a link card.<\/p>","context":"<p>A TrueType file is a long run of bytes, and every number in it is stored big-endian. Each later checkpoint reads the font through small functions like the ones you write here: checkpoint 2 uses them to read the table directory, checkpoints 3 to 5 to read the <code>cmap<\/code>, <code>loca<\/code> and metrics tables, and checkpoint 7 to decode glyph outlines.<\/p>","sources":"<ul><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/otff#data-types\" target=\"_blank\" rel=\"noopener\">Data types<\/a>. It lists every type and has the F2Dot14 table above.<\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6.html\" target=\"_blank\" rel=\"noopener\">Data types<\/a> (the table near the top of \"Font files\")<\/li><li>cppreference: <a href=\"https://en.cppreference.com/w/cpp/io/basic_istream/get\" target=\"_blank\" rel=\"noopener\"><code>std::basic_istream::get<\/code><\/a> and <a href=\"https://en.cppreference.com/w/cpp/io/basic_istream/seekg\" target=\"_blank\" rel=\"noopener\"><code>seekg<\/code><\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Reading%20.ttf%20files\" target=\"_blank\" rel=\"noopener\">Reading .ttf files<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 01                         run every test\n.\\check 01 -Case 01-R2-same-bytes  one test, showing its full input, expected output and your output\n.\\check 01 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 01 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  Signed reads (i8, i16, i32): two&#x27;s complement ........................    0 / 4   FAILED\n      x 01-R2-i8  i8: 00 7f 80 ff 81 01\n          line 3: expected `i8 -128`, got `i8 0`\n          likely cause: R2 - Signed reads (i8, i16, i32): two&#x27;s complement\n          expected values from: Python struct (&gt;B &gt;b &gt;H &gt;h &gt;I &gt;i; F2Dot14 = &gt;h / 16384 exactly)\n          reproduce: build/p01.exe build/cases/01/01-R2-i8.in build/cases/01/01-R2-i8.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read one byte at a time with <code>get()<\/code>. It returns an <code>int<\/code>: 0 to 255 for a byte, or <code>std::char_traits&lt;char&gt;::eof()<\/code> when there are no more bytes. Start the number at 0, and for each byte shift what you have 8 bits left and OR the byte in.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>One function template can serve all six integer types. Loop <code>sizeof(T)<\/code> times, building the value in a wide unsigned variable such as <code>uint64_t<\/code>, and throw <code>UnexpectedEof<\/code> as soon as <code>get()<\/code> reports the end. For a signed <code>T<\/code>, apply the two's complement rule to the finished value. Then <code>readF2Dot14<\/code> is <code>readInt16() / 16384.0<\/code>, <code>jumpTo<\/code> is <code>seekg(offset, std::ios::beg)<\/code> and <code>skipBytes<\/code> is <code>seekg(count, std::ios::cur)<\/code>.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Compare <code>get()<\/code>'s result with EOF before turning it into a byte. Once cast, EOF looks like the byte <code>ff<\/code>.<\/li><li>If you read into a <code>char<\/code> instead (with <code>read<\/code>), remember that <code>char<\/code> may be signed: the byte <code>ff<\/code> becomes −1, and shifting a negative value spreads ones through the high bits. Convert to <code>uint8_t<\/code> first.<\/li><li>The sign rule uses the full width: subtract 2^16 for an <code>i16<\/code>, not 2^15 or 2^8.<\/li><li>Check for the end on every byte, not just the first. <code>file.eof()<\/code> is no help before a read: it only turns true after a read has failed.<\/li><li>A stream that has failed ignores <code>seekg<\/code> until you call <code>clear()<\/code>. Calling <code>clear()<\/code> at the start of <code>jumpTo<\/code> keeps your reader usable after an error.<\/li><li>Printing a <code>uint8_t<\/code> with <code>&lt;&lt;<\/code> prints a character. Put <code>+<\/code> in front of it, or cast it to <code>int<\/code>, to print the number.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>readBigEndian&lt;T&gt;():\n    value = 0                               # wide and unsigned, e.g. uint64\n    repeat sizeof(T) times:\n        c = file.get()\n        if c is EOF: throw UnexpectedEof\n        value = (value &lt;&lt; 8) | c\n    n = 8 * sizeof(T)\n    if T is signed and value &gt;= 2^(n-1):\n        return value - 2^n                  # as a signed number\n    return value\n\nreadF2Dot14():  return readInt16() / 16384.0\njumpTo(offset): file.clear(); file.seekg(offset, from the start)\nskipBytes(n):   file.seekg(n, from the current position)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the same bytes, unsigned and signed","test":"01-R2-same-bytes","input":"file tests/01/data/01-R2-same-bytes.bin\nu16\njump 0\ni16\njump 0\nu32\njump 0\ni32\njump 0\nu8\ni8","output":"u16 65534\ni16 -2\nu32 4294901759\ni32 -65537\nu8 255\ni8 -2","image":null,"explain":"<p>The file holds the 4 bytes <code>ff fe ff ff<\/code>.<\/p>\n<p><code>ff fe<\/code> is <code>0xfffe<\/code> = 65534. As an <code>i16<\/code>, 65534 ≥ 32768, so the value is 65534 − 65536 = −2. The last two reads are <code>ff<\/code> (255) and then <code>fe<\/code> (254 − 256 = −2), because <code>u8<\/code> moved the position on by one byte.<\/p>"},{"label":"Example 2","name":"two fields of a real font","test":"01-R4-font-head","input":"file fonts/JetBrainsMonoNerdFont-Bold.ttf\njump 300\nskip 18\nu16\nskip 30\ni16","output":"u16 1000\ni16 1","image":null,"explain":"<p>The font's <code>head<\/code> table starts at byte 300 (checkpoint 2 shows how to find that). Its <code>unitsPerEm<\/code> field is 18 bytes in, at byte 318. Reading it moves the position to 320, and <code>skip 30<\/code> lands on byte 350, which is <code>head<\/code> + 50: the <code>indexToLocFormat<\/code> field that checkpoint 4 needs.<\/p>"},{"label":"Example 3","name":"running out of bytes","test":"01-R5-eof-in-u32","input":"file tests/01/data/01-R5-eof-in-u32.bin\nu16\nu32\nu8","output":"u16 258\neof","image":null,"explain":"<p>The file holds the 5 bytes <code>01 02 03 04 05<\/code>.<\/p>\n<p><code>u16<\/code> reads <code>01 02<\/code> = 258. The <code>u32<\/code> needs 4 bytes but only 3 are left, so the program writes <code>eof<\/code> and stops. The last <code>u8<\/code> is never run, even though a byte is left.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Byte%20readers\" target=\"_blank\" rel=\"noopener\">The blog's byte readers<\/a> live in a <code>FontParser<\/code> class, which opens the font as a binary <code>std::ifstream<\/code> and keeps it for every later step. <code>jumpTo<\/code> and <code>skipBytes<\/code> wrap <code>seekg<\/code>. A function template, <code>readBeOrThrow&lt;T&gt;<\/code>, reads <code>sizeof(T)<\/code> bytes with <code>get()<\/code>, throws \"unexpected EOF\" at the end of the file, assembles the bytes most significant first, and converts signed types from two's complement by hand. <code>readUint8<\/code> to <code>readInt32<\/code> are one-line wrappers around it, and <code>readF2Dot14<\/code> divides an <code>int16<\/code> by 2^14.<\/p>\n<p><strong>Something to look for:<\/strong> since C++20, converting an unsigned value to a signed type of the same width is defined to wrap around modulo 2^n, so <code>static_cast&lt;int16_t&gt;(uint16_t{0xfffe})<\/code> is already −2. Before C++20 the result was implementation-defined, which is one reason to write the conversion out by hand as the author does. Either way gives the same answers here.<\/p>"}},{"id":"02","num":"2","title":"Read the table directory","difficulty":"Easy","tests":13,"solution":"solutions/p02_table_directory.cpp","problem":"problems/02-table-directory.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 02 - Read the table directory\n//\n// Problem:  problems/02-table-directory.md (also in the web problem book)\n// Check:    .\\check 02\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p02.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p02_table_directory.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 02 - Read the table directory\n//\n// Problem:  problems/02-table-directory.md (also in the web problem book)\n// Check:    .\\check 02\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on readTableDirectory().\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"  // optional: be::u8(file), be::u16(file), be::u32(file), ...\n\nstruct TableRecord {\n  std::string tag;  // exactly 4 characters, trailing spaces included\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\n\n// Returns every record of the font's table directory, in any order.\nstd::vector<TableRecord> readTableDirectory(std::ifstream& font) {\n  // TODO: read the header, then one record per table (layout on the problem page).\n  throw NotImplemented(\"readTableDirectory\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\n// Usage: p02 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, path;\n      words >> keyword >> path;\n      if (keyword != \"font\") continue;  // font <path>\n      std::ifstream font(path, std::ios::binary);\n      if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n      const std::vector<TableRecord> tables = readTableDirectory(font);\n      output << \"tables \" << tables.size() << '\\n';\n      for (const TableRecord& t : tables)\n        output << \"table \\\"\" << t.tag << \"\\\" \" << t.checkSum << ' ' << t.offset << ' ' << t.length << '\\n';\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["structs","fixed-width unsigned integers (<code>uint16_t<\/code>, <code>uint32_t<\/code>)","strings built from bytes","binary file I/O (<code>seekg<\/code>, <code>get<\/code>)"],"text":["structs","fixed-width unsigned integers (uint16_t, uint32_t)","strings built from bytes","binary file I/O (seekg, get)"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode","<code>std::vector<\/code>","<code>std::string<\/code> (optionally <code>std::unordered_map<\/code>)"],"text":["std::ifstream in binary mode","std::vector","std::string (optionally std::unordered_map)"]},{"label":"Concepts","items":["the sfnt container","table tags","offsets from the start of the file","big-endian byte order"],"text":["the sfnt container","table tags","offsets from the start of the file","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font file's table directory and prints the header's table count and every table record.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p02_table_directory.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p02_table_directory.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>readTableDirectory()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file has one line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The file to read. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Some test files are real fonts. Others are hand-made files that hold only a table directory, so their offsets may point past the end of the file. You never need to follow an offset.<\/p>\n<h3>Output<\/h3>\n<pre><code>tables &lt;numTables&gt;\ntable &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;\ntable &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;\n...<\/code><\/pre>\n<p>First the line <code>tables &lt;numTables&gt;<\/code>, then one <code>table<\/code> line per record. The records may come in any order. Write the tag's 4 characters inside double quotes, exactly as stored, including any spaces at the end: <code>&quot;cvt &quot;<\/code>, not <code>&quot;cvt&quot;<\/code>. The three numbers are in decimal.<\/p>\n<h3>The table directory<\/h3>\n<p>The directory starts at byte 0 of the file. All numbers are <strong>big-endian<\/strong>.<\/p>\n<p><strong>Header<\/strong> (the \"offset subtable\"), 12 bytes:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>scaler type<\/td><td>uint32<\/td><td>What kind of font this is: <code>0x00010000<\/code> or <code>&#x27;true&#x27;<\/code> for TrueType outlines. You don't need it.<\/td><\/tr><tr><td><code>numTables<\/code><\/td><td>uint16<\/td><td>How many table records follow<\/td><\/tr><tr><td><code>searchRange<\/code><\/td><td>uint16<\/td><td>(the largest power of 2 that is ≤ <code>numTables<\/code>) × 16. A binary-search aid. Skip it.<\/td><\/tr><tr><td><code>entrySelector<\/code><\/td><td>uint16<\/td><td>log2 of that power of 2. Skip it.<\/td><\/tr><tr><td><code>rangeShift<\/code><\/td><td>uint16<\/td><td><code>numTables<\/code> × 16 − <code>searchRange<\/code>. Skip it.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Table records<\/strong>: <code>numTables<\/code> of them, 16 bytes each, starting at byte 12:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>tag<\/code><\/td><td>4 bytes<\/td><td>The table's name as 4 ASCII characters. Shorter names are padded with spaces at the end, as in <code>&#x27;cvt &#x27;<\/code>.<\/td><\/tr><tr><td><code>checkSum<\/code><\/td><td>uint32<\/td><td>A checksum of the table's bytes<\/td><\/tr><tr><td><code>offset<\/code><\/td><td>uint32<\/td><td>Where the table starts, in bytes from the start of the file<\/td><\/tr><tr><td><code>length<\/code><\/td><td>uint32<\/td><td>The table's length in bytes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>So record k starts at byte 12 + 16k. In a well-made font the records are sorted by tag, byte by byte, so uppercase tags come before lowercase ones. You don't need to rely on that.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>numTables<\/code> is the uint16 at byte 4, written as <code>tables &lt;numTables&gt;<\/code> (it can be 0). The scaler type before it and the 6 bytes of search fields after it are skipped, whatever they hold.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Each record is 16 bytes: the tag, then <code>checkSum<\/code>, <code>offset<\/code> and <code>length<\/code> as big-endian uint32 values, which can be 2^31 or more.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The tag is written exactly as its 4 bytes, trailing spaces included.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>numTables<\/code> is between 0 and 30 in the tests, and the tags in one file are all different.<\/li><li>Tags are printable ASCII and never contain <code>&quot;<\/code>. Spaces only appear at the end.<\/li><li>The directory itself is always complete. Offsets and lengths may point anywhere.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 13 tests: hand-made directories for each rule, three small fonts built with fontTools (with and without the hinting tables, and with three tables removed), both real fonts, and 3 random directories.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p02_table_directory.cpp","text":"// Reference solution - checkpoint 02 (read the table directory).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"provided/BigEndian.h\"\n\nstruct TableRecord {\n  std::string tag;  // exactly 4 characters, trailing spaces included\n  uint32_t checkSum = 0;\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;\n};\n\nstd::vector<TableRecord> readTableDirectory(std::ifstream& font) {\n  font.seekg(0);\n  be::u32(font);  // scaler type: 0x00010000, 'true', ... (not needed)\n  const uint16_t numTables = be::u16(font);\n  font.seekg(6, std::ios::cur);  // searchRange, entrySelector, rangeShift\n\n  std::vector<TableRecord> tables(numTables);\n  for (TableRecord& t : tables) {\n    for (int i = 0; i < 4; ++i) t.tag += static_cast<char>(be::u8(font));\n    t.checkSum = be::u32(font);\n    t.offset = be::u32(font);\n    t.length = be::u32(font);\n  }\n  return tables;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword, path;\n      words >> keyword >> path;\n      if (keyword != \"font\") continue;\n      std::ifstream font(path, std::ios::binary);\n      if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n      const std::vector<TableRecord> tables = readTableDirectory(font);\n      output << \"tables \" << tables.size() << '\\n';\n      for (const TableRecord& t : tables)\n        output << \"table \\\"\" << t.tag << \"\\\" \" << t.checkSum << ' ' << t.offset << ' ' << t.length << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":13,"total":13,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Offset%20table\" target=\"_blank\" rel=\"noopener\">Offset table<\/a> section through the paragraph that starts \"This is the structure of the\". The author's code comes right after it.<\/p>","context":"<p>A TrueType font is a set of tables (<code>cmap<\/code>, <code>glyf<\/code>, <code>head<\/code>, ...) packed into one file. The table directory at the start of the file says where each table is. Checkpoints 3 to 5 read the <code>cmap<\/code>, <code>loca<\/code> and metrics tables at the offsets you find here. Their inputs already contain your output lines for the tables they need, so you can also do them without this one.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6.html\" target=\"_blank\" rel=\"noopener\">The font directory<\/a> (the \"offset subtable\" and \"table directory\" tables)<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/otff#organization-of-an-opentype-font\" target=\"_blank\" rel=\"noopener\">Organization of an OpenType font<\/a> (TableDirectory and TableRecord)<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Offset%20table\" target=\"_blank\" rel=\"noopener\">Offset table<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 02                         run every test\n.\\check 02 -Case 02-R3-spaces      one test, showing its full input, expected output and your output\n.\\check 02 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 02 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Tags exactly as stored: 4 characters, trailing spaces kept ...........    0 / 2   FAILED\n      x 02-R3-tiny-hinted  the 4-glyph font plus &#x27;cvt &#x27;, fpgm, prep and gasp (14 tables)\n          expected `table &quot;cvt &quot; 4292346576 544 8`, closest line written: `table &quot;cvt&quot; 4292346576 544 8` - differs in tag (15 lines written, 15 expected)\n          likely cause: R3 - Tags exactly as stored: 4 characters, trailing spaces kept\n          expected values from: Python struct, cross-checked against fontTools 4.67.0 SFNTReader\n          reproduce: build/p02.exe build/cases/02/02-R3-tiny-hinted.in build/cases/02/02-R3-tiny-hinted.out<\/code><\/pre>\n<p>The lines may be in any order, so the checker looks for each expected line in your output and, when one is missing, shows the closest line you wrote with the same keyword. Spaces inside a quoted tag are kept exactly.<\/p>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Everything you need is in the first 12 + 16 × <code>numTables<\/code> bytes. Read the header fields in the order they are stored, then loop <code>numTables<\/code> times, reading one record per pass.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Seek to byte 0. Read and ignore a uint32 (the scaler type). Read the uint16 <code>numTables<\/code>. Skip 6 bytes. Then, for each record, read 4 single bytes and append each one to a string as a character, and read three uint32 values. Checkpoint 1's readers (or <code>provided/BigEndian.h<\/code>) do the byte order for you.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Don't trim the tag. <code>&quot;cvt &quot;<\/code> and <code>&quot;cvt&quot;<\/code> are different answers.<\/li><li>Read the tag byte by byte. If you read it as a uint32 and pull the characters out with shifts, start with the most significant byte, or you'll get <code>pamc<\/code> for <code>cmap<\/code>.<\/li><li>Skip exactly 6 bytes after <code>numTables<\/code>. If you skip 4 or 8, every record is misaligned.<\/li><li><code>checkSum<\/code> and <code>offset<\/code> can be 2^31 or more. Keep them in an unsigned 32-bit (or wider) type.<\/li><li>The search fields may be wrong. Don't use them to count the records.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>seek(0)\nreadUint32()                         # scaler type, not needed\nnumTables = readUint16()\nskip(6)                              # searchRange, entrySelector, rangeShift\nrecords = []\nrepeat numTables times:\n    tag = 4 characters, one readUint8() each\n    checkSum = readUint32()\n    offset   = readUint32()\n    length   = readUint32()\n    add (tag, checkSum, offset, length) to records\nwrite &quot;tables&quot;, numTables\nfor each record: write &#x27;table &quot;&#x27; + tag + &#x27;&quot;&#x27;, checkSum, offset, length<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a hand-made directory","test":"02-R1-true-scaler","input":"font tests/02/data/02-R1-true-scaler.bin","output":"tables 3\ntable \"cmap\" 286331153 64 8\ntable \"glyf\" 572662306 72 4\ntable \"head\" 858993459 76 4","image":null,"explain":"<p>The first 60 bytes:<\/p>\n<pre><code>74 72 75 65                  scaler type &#x27;true&#x27;\n00 03                        numTables = 3\nff ff ff ff ff ff            searchRange, entrySelector, rangeShift: skip them\n63 6d 61 70                  tag &quot;cmap&quot;\n11 11 11 11 00 00 00 40 00 00 00 08         checkSum 286331153, offset 64, length 8\n67 6c 79 66                  tag &quot;glyf&quot;\n22 22 22 22 00 00 00 48 00 00 00 04         checkSum 572662306, offset 72, length 4\n68 65 61 64                  tag &quot;head&quot;\n33 33 33 33 00 00 00 4c 00 00 00 04         checkSum 858993459, offset 76, length 4<\/code><\/pre>\n<p>The search fields hold nonsense here (a real font with 3 tables would have 32, 1 and 16). That doesn't matter, because they are skipped.<\/p>"},{"label":"Example 2","name":"tags that end in spaces","test":"02-R3-spaces","input":"font tests/02/data/02-R3-spaces.bin","output":"tables 6\ntable \"A   \" 1 108 4\ntable \"CFF \" 2 112 4\ntable \"ab  \" 3 116 4\ntable \"cvt \" 4 120 4\ntable \"head\" 5 124 4\ntable \"zzz \" 6 128 4","image":null,"explain":"<p>The tag <code>A   <\/code> is the byte <code>41<\/code> followed by three spaces (<code>20 20 20<\/code>). All four bytes are part of the tag.<\/p>"},{"label":"Example 3","name":"a real font","test":"02-E2E-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf","output":"tables 18\ntable \"GDEF\" 1324961447 2406324 670\ntable \"GPOS\" 3088890585 2440700 19232\ntable \"GSUB\" 3036347712 2406996 33702\ntable \"OS/2\" 325127274 424 96\ntable \"PfEd\" 383833929 2459932 568\ntable \"cmap\" 2612855665 49020 11978\ntable \"cvt \" 676859925 64812 168\ntable \"fpgm\" 1647248255 61000 3596\ntable \"gasp\" 16 2406316 8\ntable \"glyf\" 810950304 113484 2068620\ntable \"head\" 546057157 300 54\ntable \"hhea\" 34418196 356 36\ntable \"hmtx\" 1631122185 520 48500\ntable \"loca\" 588705204 64980 48504\ntable \"maxp\" 946608241 392 32\ntable \"name\" 4079467112 2182104 2527\ntable \"post\" 4288561555 2184632 221681\ntable \"prep\" 2328730654 64596 214","image":null,"explain":"<p>Notice that the records are sorted by tag, not by offset: <code>head<\/code> is the first table in the file (offset 300) but the eleventh record.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20table%20directory\" target=\"_blank\" rel=\"noopener\">The blog's directory parser<\/a> runs in <code>FontParser<\/code>'s constructor, right after the file is opened. It skips the scaler type, reads <code>numTables<\/code>, skips the three search fields, and then reads each record: the tag as 4 raw bytes turned into a string, followed by the checksum, offset and length. The records go into an <code>unordered_map<\/code> keyed by tag, so every later step finds its table by name, for exam
