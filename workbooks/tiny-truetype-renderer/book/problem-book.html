<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p>The blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Glyph%20rendering%20with%20Even-odd%20rule\" target=\"_blank\" rel=\"noopener\">even-odd renderer<\/a> loops over every pixel row of the canvas and every point of the outline. It uses two helper functions from assignments 12 and 13 to intersect the row with each line or curve, truncates the crossing x to an integer, and draws horizontal lines between pairs. Its scanline runs along the row's top edge (integer y) instead of through the pixel centres. Its fix for vertices counts an edge only when the edge's lowest y (on screen) is above the scanline, and handles curves that cross twice with a convexity check (assignment 15 finds the curve's lowest point).<\/p>\n<p><strong>Something to look for:<\/strong> in the fixed version, the check for a curve's endpoint on the scanline compares the row y with the endpoints' <strong>x<\/strong> coordinates. That branch tests the wrong coordinate and seldom catches an endpoint that sits on the scanline.<\/p>"}},{"id":"15","num":"15","title":"Lowest point of a quadratic curve","difficulty":"Easy","tests":22,"problem":"problems/15-bezier-min-y.md","entry":"solutions/assignments/assignment_15_bezier_min_y.cpp","files":[{"path":"solutions/assignments/assignment_15_bezier_min_y.cpp","role":"entry","purpose":null,"job":"Read each `curve` line's six numbers as three points, call your lowest-point function, and write one answer per curve, in the same order (see Output for the precision).","blank":"// ======================================================================================\n// Assignment 15: Lowest point of a quadratic curve\n// Problem: problems/15-bezier-min-y.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 15 as `build/solutions/assignment_15.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 15`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read each `curve` line's six numbers as three points, call your lowest-point function,\n//   and write one answer per curve, in the same order (see Output for the precision).\n//\n// The other files of this assignment:\n//   It adds to src/utils/Geometry.h, which you started earlier: Add a function that takes\n//   a quadratic curve's start, control and end points and returns the smallest y on the\n//   curve for t from 0 to 1, as an exact `double` (don't round it to a whole number). The\n//   Boilerplate from assignment 10 already declares it as `getBezierMinY`; if you wrote\n//   this file your own way, add it next to your curve functions.\n//   Include them by their path under src/, e.g. #include \"utils/Geometry.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 15: Lowest point of a quadratic curve\n// Problem: problems/15-bezier-min-y.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 15 as `build/solutions/assignment_15.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 15`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/utils/Geometry.h, which you started earlier: Add a function that takes\n//   a quadratic curve's start, control and end points and returns the smallest y on the\n//   curve for t from 0 to 1, as an exact `double` (don't round it to a whole number). The\n//   Boilerplate from assignment 10 already declares it as `getBezierMinY`; if you wrote\n//   this file your own way, add it next to your curve functions.\n//   Include them by their path under src/, e.g. #include \"utils/Geometry.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(getBezierMinY(p1, p2, p3)) << '\\n';\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/utils/Geometry.h","role":"adds","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them.","job":"Add a function that takes a quadratic curve's start, control and end points and returns the smallest y on the curve for t from 0 to 1, as an exact `double` (don't round it to a whole number). The Boilerplate from assignment 10 already declares it as `getBezierMinY`; if you wrote this file your own way, add it next to your curve functions.","blank":"#pragma once\n// ======================================================================================\n// Assignment 10: Lerp and quadratic Bezier curves\n// Problem: problems/10-bezier.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header holds the project's 2D maths: a point type, lerp, and the point at t on a\n//   quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13\n//   and 15 add functions for where segments and curves meet and for a curve's lowest\n//   point, and the fills from assignment 14 on use them.\n//\n// Your job:\n//   Declare a 2D point type with `double` x and y, and the arithmetic you want on it:\n//   adding, subtracting and scaling by a number. Then write two functions: lerp, which\n//   returns the point a fraction t of the way from a to b, and one that returns the point\n//   at t on a quadratic Bezier curve from its start, control point and end. The project\n//   has no `Geometry.cpp`, so define the functions in this header and mark them `inline`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"10"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","avoiding a division by zero","<code>nan<\/code>"],"text":["floating-point arithmetic (double)","avoiding a division by zero","nan"]},{"label":"Library","items":["<code>std::min<\/code> (<code>&lt;algorithm&gt;<\/code>)"],"text":["std::min (<algorithm>)"]},{"label":"Concepts","items":["quadratic Bezier curve as a polynomial in t","turning point of a parabola","minimum over a closed interval","straight and flat curves","screen coordinates with y pointing down"],"text":["quadratic Bezier curve as a polynomial in t","turning point of a parabola","minimum over a closed interval","straight and flat curves","screen coordinates with y pointing down"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads quadratic Bezier curves and prints, for each one, the smallest y that the curve reaches.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Every line of the input file has the same form:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>curve p1x p1y p2x p2y p3x p3y<\/code><\/td><td>The curve starts at p1, bends toward the control point p2, and ends at p3.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Your <code>utils/Geometry.h<\/code> has evaluated this curve since assignment 10: the point at parameter t is (1 − t)² p1 + 2(1 − t)t p2 + t² p3, for t from 0 to 1.<\/p>\n<h3>Output<\/h3>\n<p>One line per input line, in the same order: the smallest y of any point on the curve, for t from 0 to 1 inclusive.<\/p>\n<ul><li>The checker accepts any number within 0.001 of the expected value.<\/li><li>If a value isn't whole, print enough decimals to be within 0.001 (4 is plenty), and don't round it to a whole number.<\/li><li>The boilerplate's <code>number()<\/code> does this: it prints whole numbers without a decimal point, and rounds others to 4 decimals with trailing zeros dropped (<code>37.5<\/code>, <code>0.0625<\/code>).<\/li><\/ul>\n<h3>The curve's height as a polynomial<\/h3>\n<p>You only need y. Multiplying out the curve's formula for y gives<\/p>\n<pre><code>y(t) = a t² + b t + y1,    where a = y1 − 2 y2 + y3   and   b = 2 (y2 − y1)<\/code><\/pre>\n<p>with y1, y2, y3 the y coordinates of p1, p2, p3.<\/p>\n<h3>Candidates for the lowest point<\/h3>\n<p>On 0 ≤ t ≤ 1, the lowest point is at one of the ends, y(0) = y1 or y(1) = y3, or at the <strong>turning point<\/strong>, where y stops falling and starts rising. There the slope 2at + b is 0:<\/p>\n<pre><code>t* = −b / (2a),     y(t*) = a t*² + b t* + y1<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>a<\/th><th>Shape<\/th><th>Smallest y<\/th><\/tr><\/thead><tbody><tr><td>a &gt; 0<\/td><td>a valley: the turning point is the lowest point of the whole parabola<\/td><td>y(t*) if 0 &lt; t* &lt; 1; otherwise min(y1, y3)<\/td><\/tr><tr><td>a &lt; 0<\/td><td>a hill: the turning point is the <strong>highest<\/strong> point<\/td><td>min(y1, y3)<\/td><\/tr><tr><td>a = 0, b ≠ 0<\/td><td>straight: y changes at a steady rate<\/td><td>min(y1, y3)<\/td><\/tr><tr><td>a = 0, b = 0<\/td><td>flat: y1 = y2 = y3<\/td><td>y1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The answer is the smallest of y1, y3 and, when a &gt; 0 and 0 &lt; t* &lt; 1, y(t*). Don't compute t* when a = 0, because the formula divides by zero.<\/p>\n<p><strong>Decimal inputs and a = 0.<\/strong> Coordinates like 0.1 aren't exact in binary, so a can come out as a tiny non-zero number such as 1e-17 when it should be 0. That does no harm if you use t* only when a &gt; 0 and 0 &lt; t* &lt; 1: on a curve whose a should be 0, t* lands far outside [0, 1], or y(t*) is within rounding of an endpoint. You don't need an <code>a == 0<\/code> comparison.<\/p>\n<h3>Screen coordinates<\/h3>\n<p>The blog calls this function after it has scaled the outline to pixels and flipped it so that y points down (row 0 at the top of the image). There, the smallest y is the curve's highest point on screen.<\/p>\n<p>The blog returns it as a whole number (<code>static_cast&lt;int&gt;<\/code>, which drops the fraction) because it compares it with integer row numbers. Your program prints the exact minimum instead.<\/p>\n<p>The tests use both font units (y up) and screen coordinates (y down); the rule is the same.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A curve that only rises or only falls has its minimum at an end.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A valley whose turning point lies inside the curve (0 &lt; t* &lt; 1) has its minimum there.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A turning point outside 0 ≤ t ≤ 1 doesn't count. The minimum is then at an end.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Straight curves (a = 0) and flat ones (a = b = 0) work, with no division by zero.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>For a curve that bulges upward (a &lt; 0), the turning point is the highest point, so the minimum is at an end.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate is between −1000 and 1000 and has at most 4 digits after the decimal point.<\/li><li>A test has from 1 to 74 lines.<\/li><li>There are 22 tests: hand-made curves for each rule, random curves, and every curve of 'o' and 'S' (JetBrains Mono Bold) and 'あ' (Noto Sans JP), plus 'S' scaled and flipped into screen coordinates.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/utils/Geometry.h","text":"#pragma once\n// Points, curves and where they meet.\n// Assignment 10: lerp and quadratic Bezier curves. 12: two segments. 13: a line and a curve.\n// 15: the lowest point of a curve.\n\n#include <algorithm>\n#include <cmath>\n#include <optional>\n#include <vector>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\ninline Vec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\ninline Vec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\ninline Vec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// ---- Assignment 10 ------------------------------------------------------------------\n\n// The point a fraction t of the way from a to b.\ninline Vec2 lerp(const Vec2 a, const Vec2 b, const double t) { return a + (b - a) * t; }\n\n// The quadratic Bezier curve a (start), b (control), c (end) at t. De Casteljau: lerp along\n// both legs of the control polygon, then between the two results.\ninline Vec2 bezierLerp(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  return lerp(lerp(a, b, t), lerp(b, c, t), t);\n}\n\n// ---- Assignment 12 ------------------------------------------------------------------\n\nnamespace geometry_detail {\n\ninline double cross(const Vec2 u, const Vec2 v) { return u.x * v.y - u.y * v.x; }\ninline double dot(const Vec2 u, const Vec2 v) { return u.x * v.x + u.y * v.y; }\n\n// Positive on one side of the line through start and end, negative on the other, 0 on it.\ninline double side(const Vec2 pt, const Vec2 start, const Vec2 end) { return cross(end - start, pt - start); }\n\n}  // namespace geometry_detail\n\n// Where segment a1-a2 meets segment b1-b2; nothing if they don't, or are parallel.\ninline std::optional<Vec2> segmentsIntersect(const Vec2 a1, const Vec2 a2, const Vec2 b1, const Vec2 b2) {\n  using namespace geometry_detail;\n  // Each segment's endpoints must not lie strictly on the same side of the other's line.\n  if (side(b1, a1, a2) * side(b2, a1, a2) > 0) return std::nullopt;\n  if (side(a1, b1, b2) * side(a2, b1, b2) > 0) return std::nullopt;\n  const Vec2 v1 = a2 - a1, v2 = b2 - b1;\n  const double denominator = cross(v1, v2);\n  if (std::abs(denominator) < 1e-9) return std::nullopt;  // parallel or collinear\n  const double t = cross(b1 - a1, v2) / denominator;\n  return a1 + v1 * t;\n}\n\n// ---- Assignment 13 ------------------------------------------------------------------\n\nnamespace geometry_detail {\n\n// Real roots of a t^2 + b t + c = 0, in increasing order; a double root once.\n// The test data make a, and the discriminant of a tangent, exactly 0 when they are 0.\ninline std::vector<double> solveQuadratic(const double a, const double b, const double c) {\n  if (a == 0) {\n    if (b == 0) return {};  // no root (or every t, which the tests exclude)\n    return {-c / b};\n  }\n  const double discriminant = b * b - 4 * a * c;\n  if (discriminant < 0) return {};\n  if (discriminant == 0) return {-b / (2 * a)};\n  // The stable form: no cancellation between b and the square root.\n  const double q = -0.5 * (b + std::copysign(std::sqrt(discriminant), b));\n  std::vector<double> roots = {q / a, c / q};\n  std::sort(roots.begin(), roots.end());\n  return roots;\n}\n\n}  // namespace geometry_detail\n\n// Where the infinite line through l1 and l2 meets the curve p1 (start), p2 (control),\n// p3 (end), ordered along the curve.\ninline std::vector<Vec2> segmentQuadBezierIntersect(const Vec2 p1, const Vec2 p2, const Vec2 p3, const Vec2 l1,\n                                                    const Vec2 l2) {\n  using namespace geometry_detail;\n  const Vec2 d = l2 - l1;\n  const Vec2 k = {d.y, -d.x};  // perpendicular to the line: dot(k, X - l1) = 0 on it\n  // The curve as a polynomial: P(t) = A t^2 + B t + C.\n  const Vec2 A = p1 - p2 * 2 + p3, B = (p2 - p1) * 2, C = p1;\n  std::vector<Vec2> points;\n  for (const double t : solveQuadratic(dot(k, A), dot(k, B), dot(k, C - l1))) {\n    if (t >= 0 && t <= 1) points.push_back(A * (t * t) + B * t + C);\n  }\n  return points;\n}\n\n// ---- Assignment 15 ------------------------------------------------------------------\n\n// The smallest y on the curve p1 (start), p2 (control), p3 (end) for 0 <= t <= 1.\ninline double getBezierMinY(const Vec2 p1, const Vec2 p2, const Vec2 p3) {\n  // y(t) = a t^2 + b t + p1.y\n  const double a = p1.y - 2 * p2.y + p3.y;\n  const double b = 2 * (p2.y - p1.y);\n  double lowest = std::min(p1.y, p3.y);  // the ends are always candidates\n  if (a > 0) {                           // a valley: its turning point is the lowest point\n    const double t = -b / (2 * a);\n    if (t > 0 && t < 1) lowest = std::min(lowest, (a * t + b) * t + p1.y);\n  }\n  return lowest;\n}\n"},{"path":"assignments/assignment_15_bezier_min_y.cpp","text":"// Assignment 15 (lowest point of a quadratic curve): answers a test input's curves.\n// The maths is in src/utils/Geometry.h.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword != \"curve\") throw std::runtime_error(\"unknown line: \" + line);\n      const Vec2 p1 = readPoint(words), p2 = readPoint(words), p3 = readPoint(words);\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(getBezierMinY(p1, p2, p3)) << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":[],"proof":{"passed":22,"total":22,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, in the blog's <strong>\"Renderer: Filling Glyph\"<\/strong> section, read <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a> up to the formula for the t where the curve turns. The author's code (the listing \"Find a minimum curve of a quad Bézier curve\") comes right after it. Assignment 10 covers the curve itself.<\/p>","readTitle":"Read in the blog first","context":"<p>The blog's even-odd fill can count a row's crossings twice, or miss them, where an edge touches the row without crossing it or two edges meet on the row. The blog's repair checks how far each edge reaches above the row, and for a curved edge it needs the curve's smallest y. Your fill from assignment 14 splits curves instead and doesn't need this function. It is the last of the blog's geometry helpers, and you add it to your <code>utils/Geometry.h<\/code> from assignment 10.<\/p>","sources":"<ul><li>Pomax, <em>A Primer on Bézier Curves<\/em>, <a href=\"https://pomax.github.io/bezierinfo/#components\" target=\"_blank\" rel=\"noopener\">Component functions<\/a> and <a href=\"https://pomax.github.io/bezierinfo/#extremities\" target=\"_blank\" rel=\"noopener\">Finding extremities: root finding<\/a>, on treating x and y as separate functions of t and finding where the derivative is 0<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Quadratic_function#Vertex\" target=\"_blank\" rel=\"noopener\">Quadratic function: vertex<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>, on the quadratic curves in TrueType outlines<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Removal%20of%20fill%20errors\" target=\"_blank\" rel=\"noopener\">Removal of fill errors<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 15                          run every test\n.\\check 15 -Case 15-R3-after-end    one test, showing its full input, expected output and your output\n.\\check 15 -Fresh                   a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 15 -Dispute &lt;id&gt; &quot;why&quot;      set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  A turning point outside 0 &lt;= t &lt;= 1 doesn&#x27;t count ....................    0 / 4   FAILED\n      x 15-R3-before-start  turning point at t = -0.5 (y = -0.5 there, off the curve)\n          line 1: expected `0`, got `-0.5`\n          expected values from: exact arithmetic with Python fractions.Fraction, checked against 2001 samples of the curve\n          reproduce: build/solutions/assignment_15.exe build/cases/15/15-R3-before-start.in build/cases/15/15-R3-before-start.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Ignore x and write y(t) as a t² + b t + y1. Sketch the three shapes it can have on 0 ≤ t ≤ 1, a valley, a hill and a straight line, and mark on each sketch the places its lowest point can be.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Both ends are candidates on every curve. The turning point is a candidate only when a &gt; 0 and it lies between t = 0 and t = 1. Take the smallest candidate, and test your reasoning on Examples 1 and 2.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A turning point outside 0 ≤ t ≤ 1 is not on the curve (R3).<\/li><li>If a &lt; 0, the turning point is the top of a hill (R5). If you return y(t*) whenever t* is in range, you return the highest point.<\/li><li>With a = 0, −b / (2a) is ±infinity, or <code>nan<\/code> (0 / 0) if b is also 0. A <code>nan<\/code> that reaches <code>std::min<\/code> can come out as the answer, depending on the argument order. Handle a = 0 before dividing (R4).<\/li><li>A straight curve can fall, so with a = 0 the answer is min(y1, y3), which can be y3.<\/li><li>Keep the fraction: the blog's whole-number result would turn −1.25 into −1.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>minY(p1, p2, p3):\n    a = p1.y - 2*p2.y + p3.y\n    b = 2*(p2.y - p1.y)\n    lowest = min(p1.y, p3.y)\n    if a &gt; 0:\n        t = -b / (2*a)\n        if 0 &lt; t &lt; 1:\n            lowest = min(lowest, a*t*t + b*t + p1.y)\n    return lowest<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a valley","test":"15-R2-asymmetric","input":"curve 0 30 40 -20 100 10","output":"-1.25","image":null,"explain":"<p>a = 30 − 2·(−20) + 10 = 80 and b = 2·(−20 − 30) = −100, so t* = 100 / 160 = 0.625, which is inside the curve. y(0.625) = 80 · 0.390625 − 100 · 0.625 + 30 = −1.25. Both ends are higher (30 and 10).<\/p>"},{"label":"Example 2","name":"the turning point is past the end","test":"15-R3-after-end","input":"curve 0 40 50 10 100 0","output":"0","image":null,"explain":"<p>a = 40 − 20 + 0 = 20 and b = 2·(10 − 40) = −60, so t* = 1.5. The curve is still going down when it stops at t = 1, so the answer is min(40, 0) = 0. Evaluating y at t* would give −5, a point on the parabola beyond the curve's end.<\/p>"},{"label":"Example 3","name":"hills","test":"15-R5-hill","input":"curve 0 0 5 10 10 4\ncurve 0 6 5 20 10 2","output":"0\n2","image":null,"explain":"<p>On the first line a = 0 − 20 + 4 = −16, a hill. Its turning point, t* = 0.625 with y = 6.25, is the top of the curve. The lowest point is the lower end: min(0, 4) = 0.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=minimum%20curve%20of%20a%20quad\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> is one function, <code>getBezierMinY<\/code>, that takes the three points and returns an <code>int<\/code>. It computes a and b as on this page. If |a| is below a small eps it returns p1.y when |b| is also tiny, and min(p1.y, p3.y) otherwise. Else it computes t*, and returns y(t*) when t* lies in [−eps, 1 + eps] and a &gt; 0, and min(p1.y, p3.y) in every other case. Its branches match the rows of the table above.<\/p>\n<p><strong>Something to look for:<\/strong> the result goes through <code>static_cast&lt;int&gt;<\/code>, which drops the fraction by rounding toward zero. On screen, where y is positive, that is the same as rounding down, so 61.875 becomes 61 and the comparison with the integer row still works. For a negative y it rounds up instead (−1.25 becomes −1). This assignment asks for the exact value, so a solution that copies the cast fails R2.<\/p>"}},{"id":"16","num":"16","title":"Fill a polygon: non-zero rule","difficulty":"Medium","tests":24,"problem":"problems/16-nonzero-lines.md","entry":"solutions/assignments/assignment_16_nonzero_lines.cpp","files":[{"path":"solutions/assignments/assignment_16_nonzero_lines.cpp","role":"entry","purpose":null,"job":"Read the `canvas`, `place` and `color` lines and each `outline` with its `ends` and `points` lines (see Input). Make the canvas, fill every outline in turn with your non-zero fill, and write the picture to the output path (see Output).","blank":"// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 16 as `build/solutions/assignment_16.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 16`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `canvas`, `place` and `color` lines and each `outline` with its `ends` and\n//   `points` lines (see Input). Make the canvas, fill every outline in turn with your\n//   non-zero fill, and write the picture to the output path (see Output).\n//\n// The other files of this assignment:\n//   You also write src/render/NonZero.h and src/render/NonZero.cpp in this assignment;\n//   each one gives its job at the top.\n//   Earlier files you can use: src/render/Scanline.h.\n//   Include them by their path under src/, e.g. #include \"render/NonZero.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 16 as `build/solutions/assignment_16.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 16`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/render/NonZero.h and src/render/NonZero.cpp in this assignment;\n//   each one gives its job at the top.\n//   Earlier files you can use: src/render/Scanline.h.\n//   Include them by their path under src/, e.g. #include \"render/NonZero.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/NonZero.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<GlyphComponent> outlines;  // each one filled on its own\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // then `ends ...` and `points x y on|off ...`\n        outlines.emplace_back();\n      } else if (keyword == \"ends\" && !outlines.empty()) {\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\" && !outlines.empty()) {\n        GlyphPoint p;\n        for (std::string on; words >> p.x >> p.y >> on;) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    for (const GlyphComponent& outline : outlines) renderGlyphByNonZero(*canvas, outline, place, color);\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/render/NonZero.h","role":"new","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it.","job":"Declare one function that fills an outline on a canvas by the non-zero rule, given its placement and colour.","blank":"#pragma once\n// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your\n//   `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves,\n//   and the text renderer in assignment 18 fills every glyph with it.\n//\n// Your job:\n//   Declare one function that fills an outline on a canvas by the non-zero rule, given its\n//   placement and colour.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your\n//   `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves,\n//   and the text renderer in assignment 18 fills every glyph with it.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\n// Fills every pixel whose centre is inside the outline: a point is inside when the edges a\n// ray from it crosses don't cancel out, counting +1 for an edge going down, -1 going up.\nvoid renderGlyphByNonZero(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          RGB color);\n"},{"path":"solutions/src/render/NonZero.cpp","role":"new","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it.","job":"Implement the non-zero fill with your `render/Scanline`: on every row, walk the sorted crossings left to right with a running winding count and fill each stretch where the count isn't zero. Each crossing needs the direction of its edge; if your crossings from assignment 14 don't record it yet, add it to `render/Scanline` first.","blank":"// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your\n//   `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves,\n//   and the text renderer in assignment 18 fills every glyph with it.\n//\n// Your job:\n//   Implement the non-zero fill with your `render/Scanline`: on every row, walk the sorted\n//   crossings left to right with a running winding count and fill each stretch where the\n//   count isn't zero. Each crossing needs the direction of its edge; if your crossings\n//   from assignment 14 don't record it yet, add it to `render/Scanline` first.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your\n//   `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves,\n//   and the text renderer in assignment 18 fills every glyph with it.\n//\n// Your job:\n//   Implement the non-zero fill with your `render/Scanline`: on every row, walk the sorted\n//   crossings left to right with a running winding count and fill each stretch where the\n//   count isn't zero. Each crossing needs the direction of its edge; if your crossings\n//   from assignment 14 don't record it yet, add it to `render/Scanline` first. The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"render/NonZero.h\"\n\n#include <stdexcept>\n\n#include \"render/Scanline.h\"\n\nvoid renderGlyphByNonZero(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          const RGB color) {\n  // TODO: scanline fill by the winding count (see the problem page). Assignment 17 has curves:\n  // each crossing needs the direction of the edge where it crosses.\n  throw std::logic_error(\"not implemented: renderGlyphByNonZero\");\n}\n"}],"buildsOn":[{"path":"solutions/src/render/Scanline.h","owner":"14","purpose":"It holds the steps both fill rules share: it turns an outline into edges in pixels and finds, row by row, where the line through the pixel centres crosses them. Your even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both run on it."}],"indent":2,"tags":[{"label":"Language","items":["sorting pairs","signed counters"],"text":["sorting pairs","signed counters"]},{"label":"Library","items":["<code>std::vector<\/code>","<code>std::sort<\/code>"],"text":["std::vector","std::sort"]},{"label":"Concepts","items":["the non-zero winding rule","edge direction","scanline filling","half-open intervals"],"text":["the non-zero winding rule","edge direction","scanline filling","half-open intervals"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that fills polygon outlines (straight edges only) on a black canvas with the non-zero rule and saves the picture as a PNG.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Outline point (x, y) goes to pixel position (x0 + scale·x, baseline − scale·y). y grows up in the outline and down on the screen.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The fill colour<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline; its <code>ends<\/code> and <code>points<\/code> lines follow<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, counting from 0: contour k runs from the point after the previous end up to and including <code>e_k<\/code><\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; on ...<\/code><\/td><td>The outline's points. <strong>In this assignment every point is on-curve<\/strong>, so every edge is a straight line.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There can be several outlines. Fill each one on its own, one after another, in the same colour. Keep a separate winding count (below) for each outline; a pixel ends up in the fill colour if any outline fills it.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) <code>width<\/code> pixels wide and <code>height<\/code> pixels high, black to begin with. Paint a pixel in the fill colour when its <strong>centre<\/strong> is inside an outline by the non-zero rule. Pixel (px, py), with py counted down from the top, has its centre at screen position (px + 0.5, py + 0.5).<\/p>\n<p>The checker forgives edges that move by one pixel, so you still pass if you sample at the top of each row instead of the centre, or round x another way. Missing or extra shapes and stray lines fail.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so either of these works:<\/p>\n<ul><li><strong>A PNG.<\/strong> Your <code>FrameBufferCanvas<\/code> from assignment 06 already does this in <code>writePng<\/code>, and the boilerplate calls it. Underneath, <code>third_party/stb_image_write.h<\/code> is on your project's include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><li><strong>A binary PPM<\/strong>, if you'd rather write the bytes yourself. The header is <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>). Then come 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><\/ul>\n<h3>The non-zero rule<\/h3>\n<p>Every contour is a closed loop (after its last point it continues to its first), and every edge has a <strong>direction<\/strong>: from a point to the next one.<\/p>\n<p>Draw a ray from the point to the right and keep a <strong>winding count<\/strong>, starting at 0. For each edge the ray crosses, add 1 if the edge goes up the screen and subtract 1 if it goes down. (Either sign convention works, as long as it's the same for all edges.) The point is inside when the final count is <strong>not zero<\/strong>.<\/p>\n<ul><li>Two overlapping contours that go the same way give a count of 2 where they overlap: still inside, so there is no hole. (Even-odd would leave one.)<\/li><li>A contour inside another that goes the opposite way gives 1 − 1 = 0: a hole. This is how fonts make the inside of an <code>o<\/code> or a <code>#<\/code>.<\/li><li>A contour that goes counter-clockwise on its own gives −1: inside. Test for \"not zero\" instead of \"greater than zero\".<\/li><\/ul>\n<p>With scanlines, for each row:<\/p>\n<ol><li>Collect each crossing as (x, direction).<\/li><li>Sort the crossings by x.<\/li><li>Walk left to right keeping a running count, and fill the stretches where the count isn't zero.<\/li><\/ol>\n<p><strong>Vertices on the scanline.<\/strong> As in assignment 14, treat each edge as half-open in y:<\/p>\n<ul><li>An edge counts at scanline y when min(y0, y1) ≤ y &lt; max(y0, y1), with y measured on the screen (pixels, growing downward).<\/li><li>A horizontal edge doesn't count.<\/li><\/ul>\n<p>Then a vertex the outline passes through counts once, with the right direction.<\/p>\n<p><strong>Clipping.<\/strong> Clamp crossing x values to the canvas before converting them to integers. Your stretch fill from assignment 14 (the boilerplate's <code>fillSpan<\/code>) should already skip columns outside the canvas and do nothing when a stretch is empty.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Fill each pixel whose centre is inside, and leave every other pixel black.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Fill the overlap of contours that go the same way.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A contour going the opposite way inside another cuts a hole.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Fill a contour that goes counter-clockwise on its own.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Count each vertex that lies on a scanline the right number of times, with the right direction.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Fill several outlines one after another, painting their union.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Apply the placement and scale, and clip anything outside the canvas.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every point is on-curve. Canvases are at most about 560 x 560 pixels.<\/li><li>Every contour has at least 2 points.<\/li><li>There are 24 tests: hand-made polygons for each rule, straight-line letters from JetBrains Mono Bold, and straight-line characters from Noto Sans JP (random picks change with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/render/NonZero.h","text":"#pragma once\n// Assignment 16: filling by the non-zero rule, for straight edges; assignment 17: with curves.\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\n// Fills every pixel whose centre is inside the outline: a point is inside when the edges a\n// ray from it crosses don't cancel out, counting +1 for an edge going down, -1 going up.\nvoid renderGlyphByNonZero(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          RGB color);\n"},{"path":"src/render/NonZero.cpp","text":"#include \"render/NonZero.h\"\n\n#include \"render/Scanline.h\"\n\nvoid renderGlyphByNonZero(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          const RGB color) {\n  // Curves need nothing extra here: edgePieces splits each one where it turns in y, so every\n  // piece runs one way, like a straight edge.\n  forEachRow(edgePieces(outline, place), canvas.height(), [&](const int row, const std::vector<Crossing>& crossings) {\n    int winding = 0;\n    for (std::size_t i = 0; i + 1 < crossings.size(); ++i) {\n      winding += crossings[i].direction;\n      if (winding != 0) fillSpan(canvas, row, crossings[i].x, crossings[i + 1].x, color);\n    }\n  });\n}\n"},{"path":"assignments/assignment_16_nonzero_lines.cpp","text":"// Assignment 16 (fill a polygon, non-zero rule): fills each outline in a test input.\n// The filling is src/render/NonZero, built on src/render/Scanline.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/NonZero.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<GlyphComponent> outlines;  // each one filled on its own\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // then `ends ...` and `points x y on|off ...`\n        outlines.emplace_back();\n      } else if (keyword == \"ends\" && !outlines.empty()) {\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\" && !outlines.empty()) {\n        GlyphPoint p;\n        for (std::string on; words >> p.x >> p.y >> on;) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    for (const GlyphComponent& outline : outlines) renderGlyphByNonZero(*canvas, outline, place, color);\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/FrameBufferCanvas.h","src/GlyphComponent.h","src/render/Placement.h","src/render/Scanline.h","src/FrameBufferCanvas.cpp","src/render/Scanline.cpp","src/utils/Geometry.h"],"proof":{"passed":24,"total":24,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a> section up to the sentence about considering only line segments for now. The author's code comes right after it.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 14 you filled glyphs with the even-odd rule, which leaves a hole wherever two contours overlap. TrueType uses the non-zero rule, which fills the overlap when both contours go the same way. In this assignment you add a non-zero fill, <code>render/NonZero<\/code>, built on your <code>render/Scanline<\/code> from assignment 14, for outlines made only of straight lines; assignment 17 adds curves.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Nonzero-rule\" target=\"_blank\" rel=\"noopener\">Nonzero-rule<\/a><\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: contour direction<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 16                         run every test\n.\\check 16 -Case 16-R4-reversed    one test: its input, and where the expected and your pictures are\n.\\check 16 -Fresh                  new random glyphs (new seed)\n.\\check 16 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Start from your scanline fill of assignment 14 (<code>render/Scanline<\/code>). The edges and crossings are the same; only what you do with the sorted crossings changes.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>For each crossing, record its x and whether the edge goes down or up the screen (+1 or −1). Sort by x, walk left to right adding the directions, and fill each stretch between two crossings where the running count isn't zero.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>\"Inside\" is count ≠ 0. A lone counter-clockwise contour gives −1, and you must fill it.<\/li><li>The direction comes from the edge's own order (point i to point i + 1), not from its endpoints sorted by y.<\/li><li>Keep the half-open rule (min ≤ y &lt; max) and skip horizontal edges.<\/li><li>The last point connects back to the first point of its contour, not of the outline.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>edges = [(p[i], p[i+1]) for each contour, wrapping at its end], mapped to pixels\nfor row in 0 .. height-1:\n    y = row + 0.5\n    crossings = []\n    for (a, b) in edges:\n        if min(a.y, b.y) &lt;= y &lt; max(a.y, b.y):\n            x = a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y)\n            crossings.append((x, +1 if b.y &gt; a.y else -1))\n    sort crossings by x\n    count = 0\n    for i in 0 .. len(crossings) - 2:\n        count += crossings[i].direction\n        if count != 0:\n            fill pixels px with crossings[i].x &lt;= px + 0.5 &lt; crossings[i+1].x<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a pentagram","test":"16-R2-star","input":"canvas 205 195\nplace 2 206 2\ncolor 255 255 255\noutline\nends 4\npoints 50 100 on 79 9 on 2 65 on 98 65 on 21 9 on","output":null,"image":{"src":"data:image/png;base64,iV
