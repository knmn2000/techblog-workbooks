ented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/font/Loca.h","role":"new","purpose":"This header declares your reader for the `loca` table, which gives the position and size in bytes of each glyph's record, by glyph id. Assignment 09 uses it to find the parts of a compound glyph, and assignment 18 to find the glyph of every character.","job":"Declare a glyph location (an offset from the start of the file and a length in bytes) and a function that reads the location of every glyph, given your `ByteReader` and the table records from your `FontParser`. Have its result also carry `numGlyphs` and whether `loca` uses the short or long format, because the first output line prints both.","blank":"#pragma once\n// ======================================================================================\n// Assignment 04: Locate glyph records (loca)\n// Problem: problems/04-loca.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for the `loca` table, which gives the position and\n//   size in bytes of each glyph's record, by glyph id. Assignment 09 uses it to find the\n//   parts of a compound glyph, and assignment 18 to find the glyph of every character.\n//\n// Your job:\n//   Declare a glyph location (an offset from the start of the file and a length in bytes)\n//   and a function that reads the location of every glyph, given your `ByteReader` and the\n//   table records from your `FontParser`. Have its result also carry `numGlyphs` and\n//   whether `loca` uses the short or long format, because the first output line prints\n//   both.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 04: Locate glyph records (loca)\n// Problem: problems/04-loca.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for the `loca` table, which gives the position and\n//   size in bytes of each glyph's record, by glyph id. Assignment 09 uses it to find the\n//   parts of a compound glyph, and assignment 18 to find the glyph of every character.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <vector>\n\n#include \"font/ByteReader.h\"\n#include \"font/FontParser.h\"\n\nstruct GlyphLocation {\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;  // 0: the glyph has no outline, e.g. space\n};\n\nstruct GlyphLocations {\n  uint16_t numGlyphs = 0;\n  bool longFormat = false;            // head.indexToLocFormat: 32-bit offsets\n  std::vector<GlyphLocation> glyphs;  // one per glyph id\n};\n\nGlyphLocations loadGlyphLocations(ByteReader& reader, const Tables& tables);\n"},{"path":"solutions/src/font/Loca.cpp","role":"new","purpose":"This file reads `maxp`, `head` and `loca` and works out one location per glyph id. Assignments 09 and 18 look glyphs up in its result.","job":"Read `numGlyphs` from `maxp` and `indexToLocFormat` from `head`, read the `numGlyphs` + 1 `loca` entries, and turn them into an absolute offset and a length for each glyph id. The page lists the fields and formulas under \"The tables you need\".","blank":"// ======================================================================================\n// Assignment 04: Locate glyph records (loca)\n// Problem: problems/04-loca.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads `maxp`, `head` and `loca` and works out one location per glyph id.\n//   Assignments 09 and 18 look glyphs up in its result.\n//\n// Your job:\n//   Read `numGlyphs` from `maxp` and `indexToLocFormat` from `head`, read the `numGlyphs`\n//   + 1 `loca` entries, and turn them into an absolute offset and a length for each glyph\n//   id. The page lists the fields and formulas under \"The tables you need\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 04: Locate glyph records (loca)\n// Problem: problems/04-loca.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads `maxp`, `head` and `loca` and works out one location per glyph id.\n//   Assignments 09 and 18 look glyphs up in its result.\n//\n// Your job:\n//   Read `numGlyphs` from `maxp` and `indexToLocFormat` from `head`, read the `numGlyphs`\n//   + 1 `loca` entries, and turn them into an absolute offset and a length for each glyph\n//   id. The page lists the fields and formulas under \"The tables you need\". The\n//   Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/Loca.h\"\n\n#include <stdexcept>\n\nGlyphLocations loadGlyphLocations(ByteReader& reader, const Tables& tables) {\n  // TODO: numGlyphs from maxp, the offset format from head, then loca (see the problem page).\n  throw std::logic_error(\"not implemented: loadGlyphLocations\");\n}\n"}],"buildsOn":[{"path":"solutions/src/font/ByteReader.h","owner":"01","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines."},{"path":"solutions/src/font/FontParser.h","owner":"02","purpose":"This header declares the code that opens a font and reads its table directory: the tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...). Assignments 03 to 05 find their tables by tag in these records, and assignment 18 opens the font through it."}],"indent":2,"tags":[{"label":"Language","items":["unsigned arithmetic (<code>uint16_t<\/code>, <code>uint32_t<\/code>)","signed <code>int16_t<\/code>","off-by-one reasoning","<code>std::vector<\/code>"],"text":["unsigned arithmetic (uint16_t, uint32_t)","signed int16_t","off-by-one reasoning","std::vector"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>seekg<\/code>)"],"text":["std::ifstream in binary mode (seekg)"]},{"label":"Concepts","items":["glyph ids","the <code>maxp<\/code>, <code>head<\/code>, <code>loca<\/code> and <code>glyf<\/code> tables","short and long offset formats","empty glyphs","big-endian byte order"],"text":["glyph ids","the maxp, head, loca and glyf tables","short and long offset formats","empty glyphs","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that finds where each requested glyph's record is in the font file, and how many bytes long it is.<\/p>\n<p>A glyph's <strong>record<\/strong> is the block of bytes in the <code>glyf<\/code> table that holds its outline. The <code>loca<\/code> table (index to location) gives the start of each record, and two fields in <code>maxp<\/code> and <code>head<\/code> tell you how to read <code>loca<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these lines, in this order:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>table &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>Four lines, for <code>glyf<\/code>, <code>head<\/code>, <code>loca<\/code> and <code>maxp<\/code>: their records from the table directory, written as assignment 02 writes them. <code>offset<\/code> is where the table starts in the file.<\/td><\/tr><tr><td><code>glyph &lt;id&gt;<\/code><\/td><td>A glyph id, from 0 to <code>numGlyphs<\/code> − 1. An input can have none of these lines, or many.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Your program can parse the <code>table<\/code> lines into the table records your <code>FontParser<\/code> from assignment 02 declares, and read the font with your <code>ByteReader<\/code> from assignment 01.<\/p>\n<h3>Output<\/h3>\n<p>The first line is<\/p>\n<pre><code>glyphs &lt;numGlyphs&gt; loca &lt;short|long&gt;<\/code><\/pre>\n<p>Then, for each <code>glyph<\/code> line, in input order:<\/p>\n<pre><code>glyph &lt;id&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/pre>\n<ul><li><code>offset<\/code> is where the glyph's record starts, in bytes from the start of the <strong>file<\/strong>.<\/li><li><code>length<\/code> is the record's size in bytes. A length of 0 means the glyph has no outline (the space character, for example).<\/li><\/ul>\n<p>The <code>glyph<\/code> lines match assignment 07's input lines: put the <code>font<\/code> line in front of them, and your assignment 07 program can decode the glyphs.<\/p>\n<h3>The tables you need<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>.<\/p>\n<p><strong><code>maxp<\/code><\/strong>: you need one field.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Offset in <code>maxp<\/code><\/th><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>version<\/code><\/td><td>4 bytes<\/td><td>Skip it<\/td><\/tr><tr><td>4<\/td><td><code>numGlyphs<\/code><\/td><td>uint16<\/td><td>How many glyphs the font has. Glyph ids go from 0 to <code>numGlyphs<\/code> − 1.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><code>head<\/code><\/strong>: you need one field, 50 bytes in.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Offset in <code>head<\/code><\/th><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0 to 49<\/td><td>version, revision, checksum adjustment, magic number, flags, <code>unitsPerEm<\/code>, dates, bounding box, ...<\/td><td><\/td><td>Not needed here<\/td><\/tr><tr><td>50<\/td><td><code>indexToLocFormat<\/code><\/td><td>int16<\/td><td>0: <code>loca<\/code> holds short offsets. 1: <code>loca<\/code> holds long offsets.<\/td><\/tr><tr><td>52<\/td><td><code>glyphDataFormat<\/code><\/td><td>int16<\/td><td>0 (not needed)<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><code>loca<\/code><\/strong>: <code>numGlyphs<\/code> + 1 entries, one after another from the start of the table.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><code>indexToLocFormat<\/code><\/th><th>Entry type<\/th><th>The offset it stands for<\/th><\/tr><\/thead><tbody><tr><td>0 (short)<\/td><td>uint16<\/td><td>the entry × 2<\/td><\/tr><tr><td>1 (long)<\/td><td>uint32<\/td><td>the entry itself<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Short entries store half the offset, so a font whose <code>glyf<\/code> table is under 128 KB can use 2 bytes per entry. (That only works if every offset is even, which is why short-format fonts pad their glyph records to even lengths.)<\/p>\n<p>The offsets count from the start of the <strong><code>glyf<\/code> table<\/strong>. Glyph i's record runs from offset(i) up to, but not including, offset(i + 1):<\/p>\n<ul><li>absolute offset = <code>glyf<\/code> table offset + offset(i)<\/li><li>length = offset(i + 1) − offset(i)<\/li><\/ul>\n<p><code>loca<\/code> has one more entry than there are glyphs: entry <code>numGlyphs<\/code> marks where the last glyph ends. A glyph with no outline has length 0 and shares its offset with the next glyph. The length may include a few bytes of padding at the end of the record, and assignment 07 ignores those bytes.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>numGlyphs<\/code> is the uint16 at <code>maxp<\/code> + 4.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>The format is the int16 <code>indexToLocFormat<\/code> at <code>head<\/code> + 50: 0 is <code>short<\/code>, 1 is <code>long<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>In the short format, each entry is a uint16 holding half the offset, and your program multiplies it by 2. The results can be larger than 65535, so do the multiplication in 32 bits: a uint16 doubled in 16-bit arithmetic overflows.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A glyph's offset is the <code>glyf<\/code> table's offset plus its <code>loca<\/code> offset.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A glyph's length is the next <code>loca<\/code> offset minus its own. This includes the last glyph, whose end is the extra entry <code>numGlyphs<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>numGlyphs<\/code> is at most 17,936 in the tests. Every <code>glyph<\/code> id is below it.<\/li><li><code>indexToLocFormat<\/code> is 0 or 1 in every test, and each <code>loca<\/code> entry is at least as large as the one before it.<\/li><li>Each input has at most 30 <code>glyph<\/code> lines.<\/li><li>Each case has a 10-second limit. A correct solution finishes in milliseconds.<\/li><li>There are 18 tests: both real fonts (long format, empty glyphs, first and last glyphs, random glyphs) and small fonts built with fontTools (short and long formats, a short <code>loca<\/code> whose offsets pass 65535, empty glyphs at the start, middle and end, and spare bytes after the last glyph).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/font/Loca.h","text":"#pragma once\n// Assignment 04: where each glyph's record is (the loca table).\n\n#include <cstdint>\n#include <vector>\n\n#include \"font/ByteReader.h\"\n#include \"font/FontParser.h\"\n\nstruct GlyphLocation {\n  uint32_t offset = 0;  // from the start of the file\n  uint32_t length = 0;  // 0: the glyph has no outline, e.g. space\n};\n\nstruct GlyphLocations {\n  uint16_t numGlyphs = 0;\n  bool longFormat = false;            // head.indexToLocFormat: 32-bit offsets\n  std::vector<GlyphLocation> glyphs;  // one per glyph id\n};\n\nGlyphLocations loadGlyphLocations(ByteReader& reader, const Tables& tables);\n"},{"path":"src/font/Loca.cpp","text":"#include \"font/Loca.h\"\n\nGlyphLocations loadGlyphLocations(ByteReader& reader, const Tables& tables) {\n  GlyphLocations result;\n  reader.jumpTo(tables.at(\"maxp\").offset + 4);  // after the 4-byte version\n  result.numGlyphs = reader.readUint16();\n  reader.jumpTo(tables.at(\"head\").offset + 50);\n  result.longFormat = reader.readInt16() == 1;  // indexToLocFormat: 0 short, 1 long\n\n  // loca has numGlyphs + 1 entries: the last one marks where the last glyph ends.\n  reader.jumpTo(tables.at(\"loca\").offset);\n  std::vector<uint32_t> entries(result.numGlyphs + 1u);\n  for (uint32_t& entry : entries) entry = result.longFormat ? reader.readUint32() : 2u * reader.readUint16();\n\n  const uint32_t glyf = tables.at(\"glyf\").offset;\n  for (std::size_t i = 0; i < result.numGlyphs; ++i)\n    result.glyphs.push_back({glyf + entries[i], entries[i + 1] - entries[i]});\n  return result;\n}\n"},{"path":"assignments/assignment_04_loca.cpp","text":"// Assignment 04 (locate glyph records): prints where each glyph in a test input is.\n// The locations are read by src/font/Loca.\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/Loca.h\"\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  t.tag = line.substr(open + 1, close - open - 1);\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[t.tag] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<uint32_t> ids;  // from the `glyph <id>` lines\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        words >> path;\n      } else if (keyword == \"table\") {\n        addTable(line, tables);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0;\n        words >> id;\n        ids.push_back(id);\n      }\n    }\n    ByteReader reader(path);\n\n    const GlyphLocations loca = loadGlyphLocations(reader, tables);\n    output << \"glyphs \" << loca.numGlyphs << \" loca \" << (loca.longFormat ? \"long\" : \"short\") << '\\n';\n    for (const uint32_t id : ids) {\n      if (id >= loca.glyphs.size())\n        throw std::runtime_error(\"glyph \" + std::to_string(id) + \" is missing: loadGlyphLocations returned \" +\n                                 std::to_string(loca.glyphs.size()) + \" glyphs\");\n      output << \"glyph \" << id << ' ' << loca.glyphs[id].offset << ' ' << loca.glyphs[id].length << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/font/ByteReader.h","src/font/FontParser.h","src/font/ByteReader.cpp","src/font/FontParser.cpp"],"proof":{"passed":18,"total":18,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=loca%20table\" target=\"_blank\" rel=\"noopener\">loca table<\/a> section through the paragraph that starts \"Additionally, a minor point is\". The author's code follows that paragraph.<\/p>","readTitle":"Read in the blog first","context":"<p>Assignment 03 turns a character into a glyph id. Here you turn the glyph id into the location of the glyph's outline: a byte offset and a length inside the <code>glyf<\/code> table. The <code>glyph<\/code> lines you write use assignment 07's input format, and assignment 07 decodes the outline at that location. Assignments 09 and 18 also find glyphs through your <code>Loca<\/code>.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6loca.html\" target=\"_blank\" rel=\"noopener\">'loca' table<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6head.html\" target=\"_blank\" rel=\"noopener\">'head' table<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6maxp.html\" target=\"_blank\" rel=\"noopener\">'maxp' table<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/loca\" target=\"_blank\" rel=\"noopener\">loca: Index to Location<\/a>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/head\" target=\"_blank\" rel=\"noopener\">head: Font Header Table<\/a>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/maxp\" target=\"_blank\" rel=\"noopener\">maxp: Maximum Profile<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=loca%20table\" target=\"_blank\" rel=\"noopener\">loca table<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 04                         run every test\n.\\check 04 -Case 04-R3-short-x2    one test, showing its full input, expected output and your output\n.\\check 04 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 04 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Short format: each uint16 entry is the offset / 2 ....................    0 / 2   FAILED\n      x 04-R3-short-x2  8 glyphs in a short loca: every offset is twice the stored value\n          glyph[0]: expected (id=0, offset=484, length=26), got (id=0, offset=484, length=13) - differs in length  (in `glyphs 8 loca short`)\n          likely cause: R5 - Length = next entry - this one (x2 if short); numGlyphs + 1 entries\n          expected values from: fontTools 4.67.0 maxp, head, loca and the glyf offset, cross-checked against a struct parse of loca\n          reproduce: build/solutions/assignment_04.exe build/cases/04/04-R3-short-x2.in build/cases/04/04-R3-short-x2.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read the two numbers that tell you how to read <code>loca<\/code>: how many glyphs there are (<code>maxp<\/code>) and how big each entry is (<code>head<\/code>). Then read the whole <code>loca<\/code> table into a list of offsets, and get each length by subtracting neighbouring offsets.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Read <code>numGlyphs<\/code> + 1 entries into a vector, doubling them in the short format. Then, for each glyph i from 0 to <code>numGlyphs<\/code> − 1, its location is (<code>glyf<\/code> offset + entry[i], entry[i + 1] − entry[i]).<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Read <code>numGlyphs<\/code> + 1 entries, not <code>numGlyphs<\/code>. Without the extra one you can't tell how long the last glyph is. The <code>glyf<\/code> table's length can't stand in for it: a font may have spare bytes after the last glyph.<\/li><li>In the short format, multiply by 2. Do it in a 32-bit variable: twice a uint16 can be more than 65535.<\/li><li><code>indexToLocFormat<\/code> is at <code>head<\/code> + 50. The field right after it (+52) is <code>glyphDataFormat<\/code>, whose value is 0, so reading it by mistake makes every font look short.<\/li><li><code>loca<\/code> offsets count from the start of <code>glyf<\/code>, not from the start of the file.<\/li><li>An empty glyph has the same offset as the next glyph. Write both lines with that offset.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>seek(maxp + 4);  numGlyphs = readUint16()\nseek(head + 50); isLong = (readInt16() == 1)\nseek(loca)\nentries = []\nrepeat numGlyphs + 1 times:\n    entries.append(readUint32() if isLong else 2 * readUint16())\nfor i in 0 .. numGlyphs - 1:\n    glyph[i] = (glyf + entries[i], entries[i + 1] - entries[i])<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a short <code>loca<\/code>","test":"04-R3-short-x2","input":"font tests/04/data/04-R3-short-x2.ttf\ntable \"glyf\" 932940381 484 236\ntable \"head\" 603817628 172 54\ntable \"loca\" 19792115 464 18\ntable \"maxp\" 720906 264 32\nglyph 0\nglyph 1\nglyph 2\nglyph 3\nglyph 4\nglyph 5\nglyph 6\nglyph 7","output":"glyphs 8 loca short\nglyph 0 484 26\nglyph 1 510 40\nglyph 2 550 24\nglyph 3 574 28\nglyph 4 602 40\nglyph 5 642 26\nglyph 6 668 28\nglyph 7 696 24","image":null,"explain":"<p><code>maxp<\/code> + 4 (byte 268) holds <code>00 08<\/code>: 8 glyphs. <code>head<\/code> + 50 (byte 222) holds <code>00 00<\/code>: short format, and <code>loca<\/code> has 9 uint16 entries:<\/p>\n<pre><code>00 00  00 0d  00 21  00 2d  00 3b  00 4f  00 5c  00 6a  00 76\n  0      13     33     45     59     79     92    106    118     entries\n  0      26     66     90    118    158    184    212    236     offsets (x 2)<\/code><\/pre>\n<p>Glyph 1 starts at 484 + 26 = 510 and is 66 − 26 = 40 bytes long. The last entry, 236, is the size of the whole <code>glyf<\/code> table.<\/p>"},{"label":"Example 2","name":"assignment 07's glyphs","test":"04-R4-jetbrains-07","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"glyf\" 810950304 113484 2068620\ntable \"head\" 546057157 300 54\ntable \"loca\" 588705204 64980 48504\ntable \"maxp\" 946608241 392 32\nglyph 17\nglyph 4\nglyph 77\nglyph 37","output":"glyphs 12125 loca long\nglyph 17 115392 56\nglyph 4 113584 0\nglyph 77 122844 24\nglyph 37 118060 112","image":null,"explain":"<p>JetBrains Mono uses long offsets. Entry 17 (at byte 64980 + 4 × 17) is <code>00 00 07 74<\/code> = 1908, and entry 18 is 1964, so glyph 17, the hyphen, starts at 113484 + 1908 = 115392 and is 1964 − 1908 = 56 bytes long. Entries 4 and 5 are both 100, so glyph 4 (the space) is empty. These four lines are the input of assignment 07's example 3.<\/p>"},{"label":"Example 3","name":"an empty last glyph","test":"04-R5-empty-last-spare","input":"font tests/04/data/04-R5-empty-last-spare.ttf\ntable \"glyf\" 1843900827 468 94\ntable \"head\" 603817628 172 54\ntable \"loca\" 4587578 456 10\ntable \"maxp\" 458762 264 32\nglyph 0\nglyph 1\nglyph 2\nglyph 3","output":"glyphs 4 loca short\nglyph 0 468 26\nglyph 1 494 24\nglyph 2 518 40\nglyph 3 558 0","image":null,"explain":"<p>The 5 entries are 0, 13, 25, 45, 45, so the offsets are 0, 26, 50, 90, 90. Glyph 3, the last one, runs from 90 to 90, so it is empty. This font's <code>glyf<\/code> table is 94 bytes long, 4 more than the last entry, so taking the end of <code>glyf<\/code> as the end of the last glyph gives the wrong length here (4). Use <code>loca<\/code>'s extra entry for the end of the last glyph.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=GlyphCode%E2%86%92GlyphOffset%20mapping\" target=\"_blank\" rel=\"noopener\">The blog's loca reader<\/a>, <code>loadGlyphOffsetsMap<\/code>, reads <code>numGlyphs<\/code> from <code>maxp<\/code> and <code>indexToLocFormat<\/code> from <code>head<\/code>, then reads one <code>loca<\/code> entry per glyph (doubling short ones) and stores <code>glyf<\/code> offset + entry in a map from glyph id to file offset, <code>glyphCodeToOffset<\/code>. It doesn't store lengths. Instead, when glyph i − 1 has the same offset as glyph i, it marks glyph i − 1 as empty, and later steps skip empty glyphs.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet reads <code>numGlyphs<\/code> entries, where the spec has <code>numGlyphs<\/code> + 1. With no entry after the last glyph to compare against, the loader can't mark the last glyph as empty, and later steps would read its record even when it has no outline. In JetBrains Mono the last glyph (12124) is empty. The spec's extra entry covers this case, and R5 tests it.<\/p>"}},{"id":"05","num":"5","title":"Read the horizontal metrics","difficulty":"Easy","tests":14,"problem":"problems/05-metrics.md","entry":"solutions/assignments/assignment_05_metrics.cpp","files":[{"path":"solutions/assignments/assignment_05_metrics.cpp","role":"entry","purpose":null,"job":"Read the `font` line, turn the three `table` lines (`hhea`, `hmtx`, `maxp`) into table records, collect the questions, and load the metrics once with your `Metrics` code. Answer each `font-metrics` and `glyph` line in input order, in the formats the Output section gives.","blank":"// ======================================================================================\n// Assignment 05: Read the horizontal metrics\n// Problem: problems/05-metrics.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 05 as `build/solutions/assignment_05.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 05`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `font` line, turn the three `table` lines (`hhea`, `hmtx`, `maxp`) into table\n//   records, collect the questions, and load the metrics once with your `Metrics` code.\n//   Answer each `font-metrics` and `glyph` line in input order, in the formats the Output\n//   section gives.\n//\n// The other files of this assignment:\n//   You also write src/font/Metrics.h and src/font/Metrics.cpp in this assignment; each\n//   one gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h and src/font/FontParser.h.\n//   Include them by their path under src/, e.g. #include \"font/Metrics.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 05: Read the horizontal metrics\n// Problem: problems/05-metrics.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 05 as `build/solutions/assignment_05.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 05`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/font/Metrics.h and src/font/Metrics.cpp in this assignment; each\n//   one gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h and src/font/FontParser.h.\n//   Include them by their path under src/, e.g. #include \"font/Metrics.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/Metrics.h\"\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  t.tag = line.substr(open + 1, close - open - 1);\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[t.tag] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `font-metrics` or `glyph <id>`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"font-metrics\" || keyword == \"glyph\") queries.push_back(line);\n    }\n    ByteReader reader(path);\n\n    const HorizontalMetrics metrics = loadHorizontalMetrics(reader, tables);\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword;\n      std::size_t id = 0;\n      words >> keyword >> id;\n      if (keyword == \"font-metrics\") {\n        output << \"ascent \" << metrics.ascent << \" descent \" << metrics.descent << '\\n';\n      } else if (id < metrics.glyphs.size()) {\n        const GlyphMetric& g = metrics.glyphs[id];\n        output << \"glyph \" << id << \" advance \" << g.advanceWidth << \" lsb \" << g.leftSideBearing << '\\n';\n      } else {\n        output << \"glyph \" << id << \" missing\\n\";  // a wrong answer: every glyph has metrics\n      }\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/font/Metrics.h","role":"new","purpose":"This header declares your reader for the `hhea` and `hmtx` tables: the font's ascent and descent, and each glyph's advance width and left side bearing. Assignment 18 moves the pen by each glyph's advance width and sizes the text from the ascent and descent.","job":"Declare the metrics of one glyph (advance width and left side bearing) and a function that reads the font's ascent and descent and the metrics of every glyph id, given your `ByteReader` and the table records from your `FontParser`.","blank":"#pragma once\n// ======================================================================================\n// Assignment 05: Read the horizontal metrics\n// Problem: problems/05-metrics.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for the `hhea` and `hmtx` tables: the font's ascent\n//   and descent, and each glyph's advance width and left side bearing. Assignment 18 moves\n//   the pen by each glyph's advance width and sizes the text from the ascent and descent.\n//\n// Your job:\n//   Declare the metrics of one glyph (advance width and left side bearing) and a function\n//   that reads the font's ascent and descent and the metrics of every glyph id, given your\n//   `ByteReader` and the table records from your `FontParser`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 05: Read the horizontal metrics\n// Problem: problems/05-metrics.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header declares your reader for the `hhea` and `hmtx` tables: the font's ascent\n//   and descent, and each glyph's advance width and left side bearing. Assignment 18 moves\n//   the pen by each glyph's advance width and sizes the text from the ascent and descent.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <vector>\n\n#include \"font/ByteReader.h\"\n#include \"font/FontParser.h\"\n\nstruct GlyphMetric {\n  int advanceWidth = 0;\n  int leftSideBearing = 0;\n};\n\nstruct HorizontalMetrics {\n  int ascent = 0;   // above the baseline, font units\n  int descent = 0;  // below it (negative)\n  std::vector<GlyphMetric> glyphs;  // one per glyph id\n};\n\nHorizontalMetrics loadHorizontalMetrics(ByteReader& reader, const Tables& tables);\n"},{"path":"solutions/src/font/Metrics.cpp","role":"new","purpose":"This file reads `hhea`, `maxp` and `hmtx` into the ascent, the descent and one set of metrics per glyph id, including the glyphs that store a side bearing and no advance. Assignment 18 loads these metrics once per font.","job":"Read `ascent`, `descent` and `numberOfHMetrics` from `hhea` and `numGlyphs` from `maxp`. Then read `hmtx` and give every glyph id from 0 to `numGlyphs` - 1 an advance and an lsb, by the two rules under \"A glyph's metrics\".","blank":"// ======================================================================================\n// Assignment 05: Read the horizontal metrics\n// Problem: problems/05-metrics.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads `hhea`, `maxp` and `hmtx` into the ascent, the descent and one set of\n//   metrics per glyph id, including the glyphs that store a side bearing and no advance.\n//   Assignment 18 loads these metrics once per font.\n//\n// Your job:\n//   Read `ascent`, `descent` and `numberOfHMetrics` from `hhea` and `numGlyphs` from\n//   `maxp`. Then read `hmtx` and give every glyph id from 0 to `numGlyphs` - 1 an advance\n//   and an lsb, by the two rules under \"A glyph's metrics\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 05: Read the horizontal metrics\n// Problem: problems/05-metrics.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This file reads `hhea`, `maxp` and `hmtx` into the ascent, the descent and one set of\n//   metrics per glyph id, including the glyphs that store a side bearing and no advance.\n//   Assignment 18 loads these metrics once per font.\n//\n// Your job:\n//   Read `ascent`, `descent` and `numberOfHMetrics` from `hhea` and `numGlyphs` from\n//   `maxp`. Then read `hmtx` and give every glyph id from 0 to `numGlyphs` - 1 an advance\n//   and an lsb, by the two rules under \"A glyph's metrics\". The Boilerplate gives you the\n//   declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/Metrics.h\"\n\n#include <stdexcept>\n\nHorizontalMetrics loadHorizontalMetrics(ByteReader& reader, const Tables& tables) {\n  // TODO: ascent, descent and numberOfHMetrics from hhea, then hmtx (see the problem page).\n  throw std::logic_error(\"not implemented: loadHorizontalMetrics\");\n}\n"}],"buildsOn":[{"path":"solutions/src/font/ByteReader.h","owner":"01","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines."},{"path":"solutions/src/font/FontParser.h","owner":"02","purpose":"This header declares the code that opens a font and reads its table directory: the tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...). Assignments 03 to 05 find their tables by tag in these records, and assignment 18 opens the font through it."}],"indent":2,"tags":[{"label":"Language","items":["signed vs unsigned integers (<code>int16_t<\/code>, <code>uint16_t<\/code>)","structs","<code>std::vector<\/code>"],"text":["signed vs unsigned integers (int16_t, uint16_t)","structs","std::vector"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode (<code>seekg<\/code>)"],"text":["std::ifstream in binary mode (seekg)"]},{"label":"Concepts","items":["font units","ascent and descent","advance width","left side bearing","the <code>hhea<\/code>, <code>hmtx<\/code> and <code>maxp<\/code> tables","big-endian byte order"],"text":["font units","ascent and descent","advance width","left side bearing","the hhea, hmtx and maxp tables","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a font's ascent and descent, and the advance width and left side bearing of requested glyphs.<\/p>\n<p>Text sits on a horizontal line, the <strong>baseline<\/strong>. A <strong>pen<\/strong> moves along it: the renderer draws each glyph at the pen's position, then moves the pen right. The numbers your program reads are:<\/p>\n<ul><li><strong>ascent<\/strong> and <strong>descent<\/strong>: how much room a line needs above and below the baseline.<\/li><li><strong>advance width<\/strong>: how far to move the pen after drawing a glyph.<\/li><li><strong>left side bearing<\/strong> (lsb): where the glyph's outline starts, measured from the pen.<\/li><\/ul>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these lines, in this order:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The font file. The path is relative to the workbook folder and contains no spaces.<\/td><\/tr><tr><td><code>table &quot;&lt;tag&gt;&quot; &lt;checkSum&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>Three lines, for <code>hhea<\/code>, <code>hmtx<\/code> and <code>maxp<\/code>: their records from the table directory, written as assignment 02 writes them. <code>offset<\/code> is where the table starts in the file.<\/td><\/tr><tr><td><code>font-metrics<\/code><\/td><td>Asks for the font's ascent and descent.<\/td><\/tr><tr><td><code>glyph &lt;id&gt;<\/code><\/td><td>Asks for this glyph's metrics. <code>id<\/code> is from 0 to <code>numGlyphs<\/code> − 1.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Your program can parse the <code>table<\/code> lines into the table records your <code>FontParser<\/code> from assignment 02 declares, and read the font with your <code>ByteReader<\/code> from assignment 01.<\/p>\n<h3>Output<\/h3>\n<p>One line per question, in input order:<\/p>\n<ul><li><code>font-metrics<\/code> → <code>ascent &lt;ascent&gt; descent &lt;descent&gt;<\/code><\/li><li><code>glyph &lt;id&gt;<\/code> → <code>glyph &lt;id&gt; advance &lt;advanceWidth&gt; lsb &lt;leftSideBearing&gt;<\/code><\/li><\/ul>\n<p>All values are whole numbers in <strong>font units<\/strong>, the grid the type designer drew the glyphs on. In both real fonts, 1000 font units make one em, the font's nominal size.<\/p>\n<p>The Boilerplate writes <code>glyph &lt;id&gt; missing<\/code> if the list your function returns has no entry for a glyph. Every glyph has metrics, so a <code>missing<\/code> line fails the test.<\/p>\n<h3>The tables you need<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>.<\/p>\n<p><strong><code>hhea<\/code><\/strong> (horizontal header), 36 bytes. You need three fields:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Offset in <code>hhea<\/code><\/th><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>version<\/code><\/td><td>4 bytes<\/td><td>Skip it<\/td><\/tr><tr><td>4<\/td><td><code>ascent<\/code><\/td><td>int16<\/td><td>Distance from the baseline up to the top of the line<\/td><\/tr><tr><td>6<\/td><td><code>descent<\/code><\/td><td>int16<\/td><td>Distance from the baseline down to the bottom of the line, negative in most fonts<\/td><\/tr><tr><td>8 to 33<\/td><td><code>lineGap<\/code>, <code>advanceWidthMax<\/code>, ..., <code>metricDataFormat<\/code><\/td><td><\/td><td>Not needed here<\/td><\/tr><tr><td>34<\/td><td><code>numberOfHMetrics<\/code><\/td><td>uint16<\/td><td>How many full records <code>hmtx<\/code> starts with<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><code>maxp<\/code><\/strong>: <code>numGlyphs<\/code> is the uint16 at <code>maxp<\/code> + 4.<\/p>\n<p><strong><code>hmtx<\/code><\/strong> (horizontal metrics) has two parts, one after the other:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Part<\/th><th>Count<\/th><th>Each entry<\/th><\/tr><\/thead><tbody><tr><td><code>hMetrics<\/code><\/td><td><code>numberOfHMetrics<\/code><\/td><td>a <code>longHorMetric<\/code>, 4 bytes: <code>advanceWidth<\/code> (uint16), then <code>lsb<\/code> (int16)<\/td><\/tr><tr><td><code>leftSideBearings<\/code><\/td><td><code>numGlyphs<\/code> − <code>numberOfHMetrics<\/code><\/td><td><code>lsb<\/code> only (int16), 2 bytes<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The <code>leftSideBearings<\/code> array starts at <code>hmtx<\/code> + 4 × <code>numberOfHMetrics<\/code>.<\/p>\n<p><strong>A glyph's metrics.<\/strong> For glyph id i:<\/p>\n<ul><li>If i &lt; <code>numberOfHMetrics<\/code>: advance = <code>hMetrics[i].advanceWidth<\/code> and lsb = <code>hMetrics[i].lsb<\/code>.<\/li><li>Otherwise: advance = the advance of the <strong>last<\/strong> <code>longHorMetric<\/code>, <code>hMetrics[numberOfHMetrics − 1].advanceWidth<\/code>, and lsb = <code>leftSideBearings[i − numberOfHMetrics]<\/code>.<\/li><\/ul>\n<p>The second rule saves space. If the last glyphs of a font all have the same advance (common in monospaced fonts and in runs of CJK glyphs), the font stores that advance once and keeps a 2-byte side bearing for each of those glyphs.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span><code>ascent<\/code> and <code>descent<\/code> are the int16 values at <code>hhea<\/code> + 4 and <code>hhea<\/code> + 6. They can be negative.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A glyph whose id is below <code>numberOfHMetrics<\/code> has its own <code>longHorMetric<\/code>: an unsigned advance and a signed lsb.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A glyph whose id is <code>numberOfHMetrics<\/code> or more takes the last <code>longHorMetric<\/code>'s advance, and its lsb is entry (id − <code>numberOfHMetrics<\/code>) of the int16 array after the <code>longHorMetric<\/code> records.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>numGlyphs<\/code> is at most 17,936 in the tests, and 1 ≤ <code>numberOfHMetrics<\/code> ≤ <code>numGlyphs<\/code>.<\/li><li>Every <code>glyph<\/code> id is below <code>numGlyphs<\/code>.<\/li><li>Each input has at most 31 questions.<\/li><li>Each case has a 10-second limit. A correct solution finishes in milliseconds.<\/li><li>There are 14 tests: both real fonts (ascent and descent, Latin, kana and kanji glyphs, random glyphs) and small fonts built with fontTools (the int16 limits, negative side bearings, trailing glyphs that share an advance, a font where <code>numberOfHMetrics<\/code> is 1, and random fonts).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/font/Metrics.h","text":"#pragma once\n// Assignment 05: how far each glyph moves the pen (the hhea and hmtx tables).\n\n#include <vector>\n\n#include \"font/ByteReader.h\"\n#include \"font/FontParser.h\"\n\nstruct GlyphMetric {\n  int advanceWidth = 0;\n  int leftSideBearing = 0;\n};\n\nstruct HorizontalMetrics {\n  int ascent = 0;   // above the baseline, font units\n  int descent = 0;  // below it (negative)\n  std::vector<GlyphMetric> glyphs;  // one per glyph id\n};\n\nHorizontalMetrics loadHorizontalMetrics(ByteReader& reader, const Tables& tables);\n"},{"path":"src/font/Metrics.cpp","text":"#include \"font/Metrics.h\"\n\n#include <cstdint>\n\nHorizontalMetrics loadHorizontalMetrics(ByteReader& reader, const Tables& tables) {\n  HorizontalMetrics m;\n  const uint32_t hhea = tables.at(\"hhea\").offset;\n  reader.jumpTo(hhea + 4);\n  m.ascent = reader.readInt16();\n  m.descent = reader.readInt16();\n  reader.jumpTo(hhea + 34);\n  const uint16_t numberOfHMetrics = reader.readUint16();\n  reader.jumpTo(tables.at(\"maxp\").offset + 4);\n  const uint16_t numGlyphs = reader.readUint16();\n\n  reader.jumpTo(tables.at(\"hmtx\").offset);\n  for (uint16_t i = 0; i < numberOfHMetrics; ++i) {  // longHorMetric records\n    const int advance = reader.readUint16();\n    const int lsb = reader.readInt16();\n    m.glyphs.push_back({advance, lsb});\n  }\n  // The remaining glyphs repeat the last advance; only their lsb is stored.\n  const int lastAdvance = m.glyphs.empty() ? 0 : m.glyphs.back().advanceWidth;\n  for (uint32_t i = numberOfHMetrics; i < numGlyphs; ++i) m.glyphs.push_back({lastAdvance, reader.readInt16()});\n  return m;\n}\n"},{"path":"assignments/assignment_05_metrics.cpp","text":"// Assignment 05 (read the horizontal metrics): answers a test input's metric queries.\n// The metrics are read by src/font/Metrics.\n\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"font/Metrics.h\"\n\nnamespace {\n\n// table \"<tag>\" <checkSum> <offset> <length>\nvoid addTable(const std::string& line, Tables& tables) {\n  const std::size_t open = line.find('\"');\n  const std::size_t close = line.find('\"', open + 1);\n  if (open == std::string::npos || close == std::string::npos) throw std::runtime_error(\"bad line: \" + line);\n  TableRecord t;\n  t.tag = line.substr(open + 1, close - open - 1);\n  std::istringstream numbers(line.substr(close + 1));\n  numbers >> t.checkSum >> t.offset >> t.length;\n  tables[t.tag] = t;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::string path;\n    Tables tables;\n    std::vector<std::string> queries;  // `font-metrics` or `glyph <id>`\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") words >> path;\n      else if (keyword == \"table\") addTable(line, tables);\n      else if (keyword == \"font-metrics\" || keyword == \"glyph\") queries.push_back(line);\n    }\n    ByteReader reader(path);\n\n    const HorizontalMetrics metrics = loadHorizontalMetrics(reader, tables);\n    for (const std::string& query : queries) {\n      std::istringstream words(query);\n      std::string keyword;\n      std::size_t id = 0;\n      words >> keyword >> id;\n      if (keyword == \"font-metrics\") {\n        output << \"ascent \" << metrics.ascent << \" descent \" << metrics.descent << '\\n';\n      } else if (id < metrics.glyphs.size()) {\n        const GlyphMetric& g = metrics.glyphs[id];\n        output << \"glyph \" << id << \" advance \" << g.advanceWidth << \" lsb \" << g.leftSideBearing << '\\n';\n      } else {\n        output << \"glyph \" << id << \" missing\\n\";  // a wrong answer: every glyph has metrics\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/font/ByteReader.h","src/font/FontParser.h","src/font/ByteReader.cpp","src/font/FontParser.cpp"],"proof":{"passed":14,"total":14,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=hhea%2C%20hmtx%20tables\" target=\"_blank\" rel=\"noopener\">hhea, hmtx tables<\/a> section through the paragraph that starts \"The hmtx table contains information for\". The author's code follows that paragraph.<\/p>","readTitle":"Read in the blog first","context":"<p>Outlines give the shape of each glyph. To set a line of text, a renderer also needs the height of the line and the distance from one glyph to the next. Assignment 18 moves the pen by each glyph's advance width, and its <code>main.cpp<\/code> sizes the text from the ascent and descent you read here.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6hhea.html\" target=\"_blank\" rel=\"noopener\">'hhea' table<\/a> and <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6hmtx.html\" target=\"_blank\" rel=\"noopener\">'hmtx' table<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/hhea\" target=\"_blank\" rel=\"noopener\">hhea: Horizontal Header Table<\/a> and <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/hmtx\" target=\"_blank\" rel=\"noopener\">hmtx: Horizontal Metrics Table<\/a><\/li><li>Apple, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>, for pictures of advance width and left side bearing<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=hhea%2C%20hmtx%20tables\" target=\"_blank\" rel=\"noopener\">hhea, hmtx tables<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 05                         run every test\n.\\check 05 -Case 05-R3-negative-tail   one test, showing its full input, expected output and your output\n.\\check 05 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 05 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Later glyphs: the last advance, lsb from the array after .............    0 / 3   FAILED\n      x 05-R3-shared-advance  the last 3 glyphs share advance 600, so only 4 long metrics are stored\n          line 5: expected `glyph 4 advance 600 lsb 5`, got `glyph 4 missing`\n          likely cause: R3 - Later glyphs: the last advance, lsb from the array after\n          expected values from: fontTools 4.67.0 hhea and hmtx, cross-checked against a struct parse of hmtx\n          reproduce: build/solutions/assignment_05.exe build/cases/05/05-R3-shared-advance.in build/cases/05/05-R3-shared-advance.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read the two int16 values at <code>hhea<\/code> + 4, then <code>numberOfHMetrics<\/code> at <code>hhea<\/code> + 34 and <code>numGlyphs<\/code> at <code>maxp<\/code> + 4. Those two counts give the layout of <code>hmtx<\/code>.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Walk through <code>hmtx<\/code> once from its start. First read <code>numberOfHMetrics<\/code> pairs of (uint16, int16) and append each one to the result. Keep the last advance. Then read <code>numGlyphs<\/code> − <code>numberOfHMetrics<\/code> more int16 values, appending (last advance, value) for each. The result now has one entry per glyph id.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>ascent<\/code>, <code>descent<\/code> and every <code>lsb<\/code> are signed. <code>advanceWidth<\/code> is unsigned.<\/li><li>Glyphs past <code>numberOfHMetrics<\/code> still have metrics. Their advance is the last <code>longHorMetric<\/code>'s advance, but their lsb is their own, from the array that follows. Don't copy the last record's lsb.<\/li><li>The lsb-only array starts right after the last 4-byte record, and its entries are 2 bytes each.<\/li><li><code>numberOfHMetrics<\/code> is at <code>hhea<\/code> + 34. The field before it (+32) is <code>metricDataFormat<\/code>, whose value is 0.<\/li><li>Both real fonts store a full record for every glyph, so only the small test fonts check the second rule.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>seek(hhea + 4);  ascent = readInt16(); descent = readInt16()\nseek(hhea + 34); n = readUint16()          # numberOfHMetrics\nseek(maxp + 4);  numGlyphs = readUint16()\nseek(hmtx)\nglyphs = []\nrepeat n times:\n    advance = readUint16(); lsb = readInt16()\n    glyphs.append((advance, lsb))\nlast = glyphs[n - 1].advance\nrepeat numGlyphs - n times:\n    glyphs.append((last, readInt16()))<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a real font's ascent and descent","test":"05-R1-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"hhea\" 34418196 356 36\ntable \"hmtx\" 1631122185 520 48500\ntable \"maxp\" 946608241 392 32\nfont-metrics","output":"ascent 1020 descent -300","image":null,"explain":"<p>The 4 bytes at <code>hhea<\/code> + 4 (byte 360) are <code>03 fc fe d4<\/code>. <code>03 fc<\/code> is 1020. <code>fe d4<\/code> is 65236 as an unsigned number, and 65236 − 65536 = −300 as an int16.<\/p>"},{"label":"Example 2","name":"glyphs past <code>numberOfHMetrics<\/code>","test":"05-R3-negative-tail","input":"font tests/05/data/05-R3-negative-tail.ttf\ntable \"hhea\" 60424786 228 36\ntable \"hmtx\" 92143626 392 18\ntable \"maxp\" 524293 264 32\nfont-metrics\nglyph 0\nglyph 1\nglyph 2\nglyph 3\nglyph 4\nglyph 5","output":"ascent 800 descent -200\nglyph 0 advance 500 lsb 50\nglyph 1 advance 640 lsb 20\nglyph 2 advance 500 lsb -60\nglyph 3 advance 500 lsb -5\nglyph 4 advance 500 lsb 0\nglyph 5 advance 500 lsb -230","image":null,"explain":"<p><code>hhea<\/code> + 4 holds <code>03 20 ff 38<\/code> (ascent 800, descent −200), and <code>hhea<\/code> + 34 holds <code>00 03<\/code>: 3 full records. <code>maxp<\/code> + 4 holds 6, the number of glyphs. The 18 bytes of <code>hmtx<\/code>:<\/p>\n<pre><code>01 f4 00 32      glyph 0: advance 500, lsb 50\n02 80 00 14      glyph 1: advance 640, lsb 20\n01 f4 ff c4      glyph 2: advance 500, lsb -60     (the last longHorMetric)\nff fb            glyph 3: lsb -5    advance 500, from glyph 2\n00 00            glyph 4: lsb 0     advance 500\nff 1a            glyph 5: lsb -230  advance 500<\/code><\/pre>"},{"label":"Example 3","name":"a monospaced font","test":"05-R2-jetbrains","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ntable \"hhea\" 34418196 356 36\ntable \"hmtx\" 1631122185 520 48500\ntable \"maxp\" 946608241 392 32\nglyph 0\nglyph 1\nglyph 2\nglyph 3\nglyph 4\nglyph 5\nglyph 17\nglyph 37\nglyph 69\nglyph 77","output":"glyph 0 advance 600 lsb 90\nglyph 1 advance 0 lsb 0\nglyph 2 advance 333 lsb 0\nglyph 3 advance 600 lsb 0\nglyph 4 advance 600 lsb 0\nglyph 5 advance 600 lsb 216\nglyph 17 advance 600 lsb 140\nglyph 37 advance 600 lsb 35\nglyph 69 advance 600 lsb 58\nglyph 77 advance 600 lsb 76","image":null,"explain":"<p>JetBrains Mono stores a full record for all 12125 glyphs (<code>numberOfHMetrics<\/code> = <code>numGlyphs<\/code>), so every glyph here follows the first rule. Most glyphs are 600 units wide, and glyph 1 has an advance of 0.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20glyph%20metrics\" target=\"_blank\" rel=\"noopener\">The blog's metrics parser<\/a> has two parts. <code>getFontMetric<\/code> returns a <code>FontMetric<\/code> holding the ascent and descent from <code>hhea<\/code> + 4 and <code>hhea<\/code> + 6. <code>loadGlyphMetricsMap<\/code> reads <code>numberOfHMetrics<\/code> from <code>hhea<\/code> + 34, then reads that many (advance width, left side bearing) pairs from <code>hmtx<\/code> into a map keyed by glyph id, <code>glyphMetric<\/code>.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet stops after the <code>longHorMetric<\/code> records, so glyphs at or past <code>numberOfHMetrics<\/code> get no entry. JetBrains Mono and Noto Sans JP store a full record for every glyph, so the gap doesn't show with them. Many fonts, including those compiled by fontTools, drop the trailing records when the last glyphs share an advance width, and a monospaced font can end up with <code>numberOfHMetrics<\/code> = 1. R3 tests the spec's rule: the last advance and the glyph's own lsb.<\/p>"}},{"id":"06","num":"6","title":"Draw on a framebuffer","difficulty":"Medium","tests":30,"problem":"problems/06-canvas.md","entry":"solutions/assignments/assignment_06_canvas.cpp","files":[{"path":"solutions/assignments/assignment_06_canvas.cpp","role":"entry","purpose":null,"job":"Read the `canvas` line and create a canvas of that size, then read the `point`, `rect` and `line` commands in order and call the matching canvas operation with each command's colour. At the end, write the picture to the output path (see Output).","blank":"// ======================================================================================\n// Assignment 06: Draw on a framebuffer\n// Problem: problems/06-canvas.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 06 as `build/solutions/assignment_06.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 06`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `canvas` line and create a canvas of that size, then read the `point`, `rect`\n//   and `line` commands in order and call the matching canvas operation with each\n//   command's colour. At the end, write the picture to the output path (see Output).\n//\n// The other files of this assignment:\n//   You also write src/FrameBufferCanvas.h and src/FrameBufferCanvas.cpp in this\n//   assignment; each one gives its job at the top.\n//   Include them by their path under src/, e.g. #include \"FrameBufferCanvas.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 06: Draw on a framebuffer\n// Problem: problems/06-canvas.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 06 as `build/solutions/assignment_06.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 06`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/FrameBufferCanvas.h and src/FrameBufferCanvas.cpp in this\n//   assignment; each one gives its job at the top.\n//   Include them by their path under src/, e.g. #include \"FrameBufferCanvas.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"FrameBufferCanvas.h\"\n\nnamespace {\n\nRGB readColor(std::istream& words) {\n  int r = 0, g = 0, b = 0;\n  words >> r >> g >> b;\n  return RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::optional<FrameBufferCanvas> canvas;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas.emplace(w, h);\n        continue;\n      }\n      if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n      if (keyword == \"point\") {\n        int x = 0, y = 0;\n        words >> x >> y;\n        canvas->set(x, y, readColor(words));\n      } else if (keyword == \"rect\") {\n        int cx = 0, cy = 0, w = 0, h = 0;\n        words >> cx >> cy >> w >> h;\n        canvas->drawRect(cx, cy, w, h, readColor(words));\n      } else if (keyword == \"line\") {\n        int ax = 0, ay = 0, bx = 0, by = 0, thickness = 0;\n        words >> ax >> ay >> bx >> by >> thickness;\n        canvas->drawLine(ax, ay, bx, by, thickness, readColor(words));\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/FrameBufferCanvas.h","role":"new","purpose":"The canvas holds a picture in memory, one colour per pixel. It can paint one pixel, fill a rectangle, draw a thick line and save the picture as a PNG. You draw every later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line of text in 18.","job":"Declare a colour type (red, green and blue, one byte each) and a canvas type that holds a width, a height and one colour per pixel, all black to start. Give the canvas four operations: paint one pixel, draw a filled rectangle from its centre and size, draw a line of a given thickness between two points, and write the picture to a file.","blank":"#pragma once\n// ======================================================================================\n// Assignment 06: Draw on a framebuffer\n// Problem: problems/06-canvas.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The canvas holds a picture in memory, one colour per pixel. It can paint one pixel,\n//   fill a rectangle, draw a thick line and save the picture as a PNG. You draw every\n//   later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line\n//   of text in 18.\n//\n// Your job:\n//   Declare a colour type (red, green and blue, one byte each) and a canvas type that\n//   holds a width, a height and one colour per pixel, all black to start. Give the canvas\n//   four operations: paint one pixel, draw a filled rectangle from its centre and size,\n//   draw a line of a given thickness between two points, and write the picture to a file.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 06: Draw on a framebuffer\n// Problem: problems/06-canvas.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The canvas holds a picture in memory, one colour per pixel. It can paint one pixel,\n//   fill a rectangle, draw a thick line and save the picture as a PNG. You draw every\n//   later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line\n//   of text in 18.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <string>\n#include <vector>\n\nstruct RGB {\n  uint8_t r = 0, g = 0, b = 0;\n  bool operator==(const RGB&) const = default;\n};\n\nclass FrameBufferCanvas {\n public:\n  FrameBufferCanvas(int width, int height);  // every pixel starts black\n\n  [[nodiscard]] int width() const { return width_; }\n  [[nodiscard]] int height() const { return height_; }\n\n  // One pixel; (0, 0) is the top-left corner. It ignores pixels outside the canvas.\n  void set(int x, int y, RGB color);\n  [[nodiscard]] RGB get(int x, int y) const;\n\n  // A w x h rectangle centred on (cx, cy): columns cx - w/2 ... cx - w/2 + w - 1, rows likewise.\n  void drawRect(int cx, int cy, int w, int h, RGB color);\n\n  // A line from (ax, ay) to (bx, by), both ends included, drawn as thickness x thickness squares.\n  void drawLine(int ax, int ay, int bx, int by, int thickness, RGB color);\n\n  void writePng(const std::string& path) const;  // throws if the file can't be written\n\n private:\n  int width_;\n  int height_;\n  std::vector<RGB> pixels_;  // row by row, top row first\n};\n"},{"path":"solutions/src/FrameBufferCanvas.cpp","role":"new","purpose":"The canvas holds a picture in memory, one colour per pixel. It can paint one pixel, fill a rectangle, draw a thick line and save the picture as a PNG. You draw every later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line of text in 18.","job":"Implement the canvas operations as \"Painting one pixel\", \"Drawing a rectangle\" and \"Drawing a line\" describe. Painting a pixel ignores coordinates outside the picture, a rectangle clips its loops to the canvas, and a line stamps a square at every step. Save the pixels as a PNG with `stbi_write_png` or as a binary PPM.","blank":"// ======================================================================================\n// Assignment 06: Draw on a framebuffer\n// Problem: problems/06-canvas.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The canvas holds a picture in memory, one colour per pixel. It can paint one pixel,\n//   fill a rectangle, draw a thick line and save the picture as a PNG. You draw every\n//   later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line\n//   of text in 18.\n//\n// Your job:\n//   Implement the canvas operations as \"Painting one pixel\", \"Drawing a rectangle\" and\n//   \"Drawing a line\" describe. Painting a pixel ignores coordinates outside the picture, a\n//   rectangle clips its loops to the canvas, and a line stamps a square at every step.\n//   Save the pixels as a PNG with `stbi_write_png` or as a binary PPM.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 06: Draw on a framebuffer\n// Problem: problems/06-canvas.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The canvas holds a picture in memory, one colour per pixel. It can paint one pixel,\n//   fill a rectangle, draw a thick line and save the picture as a PNG. You draw every\n//   later picture on it: outlines in 08 and 11, filled glyphs in 14, 16 and 17, and a line\n//   of text in 18.\n//\n// Your job:\n//   Implement the canvas operations as \"Painting one pixel\", \"Drawing a rectangle\" and\n//   \"Drawing a line\" describe. Painting a pixel ignores coordinates outside the picture, a\n//   rectangle clips its loops to the canvas, and a line stamps a square at every step.\n//   Save the pixels as a PNG with `stbi_write_png` or as a binary PPM. The Boilerplate\n//   gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"FrameBufferCanvas.h\"\n\n#include <stdexcept>\n\n#define STB_IMAGE_WRITE_IMPLEMENTATION\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored \"-Wall\"\n#pragma GCC diagnostic ignored \"-Wextra\"\n#pragma GCC diagnostic ignored \"-Wmissing-field-initializers\"\n#include \"stb_image_write.h\"\n#pragma GCC diagnostic pop\n\nstatic_assert(sizeof(RGB) == 3, \"RGB must be 3 tightly packed bytes for the PNG writer\");\n\nFrameBufferCanvas::FrameBufferCanvas(const int width, const int height)\n    : width_(width), height_(height), pixels_(static_cast<std::size_t>(width) * height) {}\n\nvoid FrameBufferCanvas::set(const int x, const int y, const RGB color) {\n  // TODO: ignore pixels outside the canvas, then write pixels_[y * width_ + x].\n  throw std::logic_error(\"not implemented: FrameBufferCanvas::set\");\n}\n\nRGB FrameBufferCanvas::get(const int x, const int y) const {\n  return pixels_[static_cast<std::size_t>(y) * width_ + x];\n}\n\nvoid FrameBufferCanvas::drawRect(const int cx, const int cy, const int w, const int h, const RGB color) {\n  // TODO: see \"Drawing a rectangle\" on the problem page.\n  throw std::logic_error(\"not implemented: FrameBufferCanvas::drawRect\");\n}\n\nvoid FrameBufferCanvas::drawLine(int ax, int ay, int bx, int by, const int thickness, const RGB color) {\n  // TODO: see \"Drawing a line\" on the problem page.\n  throw std::logic_error(\"not implemented: FrameBufferCanvas::drawLine\");\n}\n\nvoid FrameBufferCanvas::writePng(const std::string& path) const {\n  if (!stbi_write_png(path.c_str(), width_, height_, 3, pixels_.data(), width_ * 3))\n    throw std::runtime_error(\"cannot write \" + path);\n}\n"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["structs","<code>std::vector<\/code> as a 2D grid","integer division","<code>std::swap<\/code>","converting a float to an int (rounding vs truncating)"],"text":["structs","std::vector as a 2D grid","integer division","std::swap","converting a float to an int (rounding vs truncating)"]},{"label":"Library","items":["<code>stbi_write_png<\/code> from stb_image_write (the Boilerplate already calls it)"],"text":["stbi_write_png from stb_image_write (the Boilerplate already calls it)"]},{"label":"Concepts","items":["framebuffer","row-major pixel layout","clipping","line rasterization along the longer axis","drawing order"],"text":["framebuffer","row-major pixel layout","clipping","line rasterization along the longer axis","drawing order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a list of drawing commands and saves the picture they draw as a PNG file.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The output file name ends in <code>.png<\/code>. The input file contains these lines, one command per line. All values are whole numbers.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;w&gt; &lt;h&gt;<\/code><\/td><td>Always the first line: the picture is <code>w<\/code> pixels wide and <code>h<\/code> pixels tall, all black.<\/td><\/tr><tr><td><code>point &lt;x&gt; &lt;y&gt; &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>Paint pixel (x, y) in colour (r, g, b).<\/td><\/tr><tr><td><code>rect &lt;cx&gt; &lt;cy&gt; &lt;w&gt; &lt;h&gt; &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>A filled <code>w<\/code> x <code>h<\/code> rectangle centred on (cx, cy).<\/td><\/tr><tr><td><code>line &lt;ax&gt; &lt;ay&gt; &lt;bx&gt; &lt;by&gt; &lt;thickness&gt; &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>A line from (ax, ay) to (bx, by), <code>thickness<\/code> pixels thick.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Colours are 0 to 255 per channel. Coordinates can be negative or beyond the picture.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) file of <code>w<\/code> x <code>h<\/code> pixels, 8 bits per channel, RGB (RGBA works too; the checker ignores alpha). Pixel (0, 0) is the <strong>top-left<\/strong> corner; x grows to the right and <strong>y grows downwards<\/strong>. Every pixel that no command paints stays black (0, 0, 0).<\/p>\n<p><strong>Writing the picture.<\/strong> Write the picture to the output path the checker gives you. The name ends in <code>.png<\/code>, but the checker looks at the contents, so either of these works:<\/p>\n<ul><li><strong>A binary PPM<\/strong>, which needs no library: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><l
