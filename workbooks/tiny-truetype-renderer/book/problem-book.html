=========================================\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\n// Whole numbers print with no decimal point; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      Vec2 p;\n      if (keyword == \"lerp\") {\n        const Vec2 a = readPoint(words), b = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = lerp(a, b, t);\n      } else if (keyword == \"bezier\") {\n        const Vec2 a = readPoint(words), b = readPoint(words), c = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = bezierLerp(a, b, c, t);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(p.x) << ' ' << number(p.y) << '\\n';\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/utils/Geometry.h","role":"new","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them.","job":"Declare a 2D point type with `double` x and y, and the arithmetic you want on it: adding, subtracting and scaling by a number. Then write two functions: lerp, which returns the point a fraction t of the way from a to b, and one that returns the point at t on a quadratic Bezier curve from its start, control point and end. The project has no `Geometry.cpp`, so define the functions in this header and mark them `inline`.","blank":"#pragma once\n// ======================================================================================\n// Assignment 10: Lerp and quadratic Bezier curves\n// Problem: problems/10-bezier.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header holds the project's 2D maths: a point type, lerp, and the point at t on a\n//   quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13\n//   and 15 add functions for where segments and curves meet and for a curve's lowest\n//   point, and the fills from assignment 14 on use them.\n//\n// Your job:\n//   Declare a 2D point type with `double` x and y, and the arithmetic you want on it:\n//   adding, subtracting and scaling by a number. Then write two functions: lerp, which\n//   returns the point a fraction t of the way from a to b, and one that returns the point\n//   at t on a quadratic Bezier curve from its start, control point and end. The project\n//   has no `Geometry.cpp`, so define the functions in this header and mark them `inline`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 10: Lerp and quadratic Bezier curves\n// Problem: problems/10-bezier.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This header holds the project's 2D maths: a point type, lerp, and the point at t on a\n//   quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13\n//   and 15 add functions for where segments and curves meet and for a curve's lowest\n//   point, and the fills from assignment 14 on use them.\n//\n// Your job:\n//   Declare a 2D point type with `double` x and y, and the arithmetic you want on it:\n//   adding, subtracting and scaling by a number. Then write two functions: lerp, which\n//   returns the point a fraction t of the way from a to b, and one that returns the point\n//   at t on a quadratic Bezier curve from its start, control point and end. The project\n//   has no `Geometry.cpp`, so define the functions in this header and mark them `inline`.\n//   The Boilerplate gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n// Points, curves and where they meet.\n// Assignment 10: lerp and quadratic Bezier curves. 12: two segments. 13: a line and a curve.\n// 15: the lowest point of a curve.\n\n#include <optional>\n#include <stdexcept>\n#include <vector>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\ninline Vec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\ninline Vec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\ninline Vec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// ---- Assignment 10 ------------------------------------------------------------------\n\n// The point a fraction t of the way from a to b.\ninline Vec2 lerp(const Vec2 a, const Vec2 b, const double t) {\n  // TODO: see \"Linear interpolation\" on the problem page.\n  throw std::logic_error(\"not implemented: lerp\");\n}\n\n// The quadratic Bezier curve a (start), b (control), c (end) at t.\ninline Vec2 bezierLerp(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  // TODO: see \"A point on a quadratic Bezier curve\" on the problem page.\n  throw std::logic_error(\"not implemented: bezierLerp\");\n}\n\n// ---- Assignment 12 ------------------------------------------------------------------\n\n// Where segment a1-a2 meets segment b1-b2; nothing if they don't, or are parallel.\ninline std::optional<Vec2> segmentsIntersect(const Vec2 a1, const Vec2 a2, const Vec2 b1, const Vec2 b2) {\n  // TODO: the side test, then the crossing point (see \"The rules\" on the problem page).\n  throw std::logic_error(\"not implemented: segmentsIntersect\");\n}\n\n// ---- Assignment 13 ------------------------------------------------------------------\n\n// Where the infinite line through l1 and l2 meets the curve p1 (start), p2 (control),\n// p3 (end), ordered along the curve.\ninline std::vector<Vec2> segmentQuadBezierIntersect(const Vec2 p1, const Vec2 p2, const Vec2 p3, const Vec2 l1,\n                                                    const Vec2 l2) {\n  // TODO: see \"From a line and a curve to a quadratic\" and \"Solving for t\" on the problem page.\n  throw std::logic_error(\"not implemented: segmentQuadBezierIntersect\");\n}\n\n// ---- Assignment 15 ------------------------------------------------------------------\n\n// The smallest y on the curve p1 (start), p2 (control), p3 (end) for 0 <= t <= 1.\ninline double getBezierMinY(const Vec2 p1, const Vec2 p2, const Vec2 p3) {\n  // TODO: see \"Candidates for the lowest point\" on the problem page.\n  throw std::logic_error(\"not implemented: getBezierMinY\");\n}\n"}],"buildsOn":[],"indent":2,"tags":[{"label":"Language","items":["floating-point arithmetic (<code>double<\/code>)","small structs with <code>+<\/code>, <code>-<\/code> and <code>*<\/code> operators"],"text":["floating-point arithmetic (double)","small structs with +, - and  operators"]},{"label":"Library","items":["none needed (the boilerplate's input/output uses <code>std::istringstream<\/code>)"],"text":["none needed (the boilerplate's input/output uses std::istringstream)"]},{"label":"Concepts","items":["linear interpolation (lerp)","quadratic Bezier curves","control points","de Casteljau's algorithm","curve parameter t"],"text":["linear interpolation (lerp)","quadratic Bezier curves","control points","de Casteljau's algorithm","curve parameter t"]}],"body":"<div class=\"d-problem flow\"><p>Your program reads one request per line and writes the point that line asks for: a point part of the way along a straight segment, or a point on a quadratic Bezier curve.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains two kinds of lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>lerp ax ay bx by t<\/code><\/td><td>The point a fraction <code>t<\/code> of the way along the straight segment from a = (ax, ay) to b = (bx, by).<\/td><\/tr><tr><td><code>bezier ax ay bx by cx cy t<\/code><\/td><td>The point at parameter <code>t<\/code> on the quadratic Bezier curve that starts at a = (ax, ay), ends at c = (cx, cy), and bends toward the control point b = (bx, by).<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Every number is a decimal such as <code>12<\/code>, <code>-3.25<\/code> or <code>0.0625<\/code>.<\/li><li><code>t<\/code> is between 0 and 1, inclusive.<\/li><li>Mind the order on a <code>bezier<\/code> line: start, <strong>control point<\/strong>, end. The control point is the middle pair of numbers.<\/li><\/ul>\n<h3>Output<\/h3>\n<p>Write one line per input line, in the same order, holding the point's coordinates as <code>x y<\/code> with a space between them.<\/p>\n<p>The checker accepts any number within 0.001 of the expected value, so <code>25<\/code>, <code>25.0<\/code> and <code>25.0000<\/code> all match <code>25<\/code>. If a value isn't whole, print enough decimals to land within 0.001; 4 decimals are enough. The boilerplate's <code>number()<\/code> prints whole numbers with no decimal point and rounds the others to 4 decimals, dropping trailing zeros (<code>37.5<\/code>, <code>0.0625<\/code>).<\/p>\n<h3>Linear interpolation<\/h3>\n<p><strong>Linear interpolation<\/strong> (lerp for short) gives the point a fraction t of the way from a to b:<\/p>\n<pre><code>lerp(a, b, t) = a + (b − a) · t<\/code><\/pre>\n<ul><li>Apply the formula to x and to y.<\/li><li>t = 0 gives a, t = 1 gives b and t = 0.5 gives the midpoint.<\/li><li>t counts from a, so <code>lerp(a, b, 0.25)<\/code> lands near a and <code>lerp(b, a, 0.25)<\/code> lands near b.<\/li><\/ul>\n<h3>A point on a quadratic Bezier curve<\/h3>\n<p>Three points define a <strong>quadratic Bezier curve<\/strong>: the start a, the control point b and the end c. The curve leaves a heading toward b and arrives at c coming from the direction of b. It bends toward b but doesn't pass through it, unless all three points lie on one line with b between a and c.<\/p>\n<p>Each value of the <strong>curve parameter<\/strong> t picks one point on the curve. <strong>De Casteljau's construction<\/strong> finds the point at t with three lerps, all with the same t:<\/p>\n<ol><li>p = lerp(a, b, t), a point on the leg from a to the control point<\/li><li>q = lerp(b, c, t), a point on the leg from the control point to c<\/li><li>The curve point is lerp(p, q, t).<\/li><\/ol>\n<p>If you multiply it out, you get one formula for the same point, and you may use it instead:<\/p>\n<pre><code>B(t) = (1 − t)² · a  +  2 (1 − t) t · b  +  t² · c<\/code><\/pre>\n<p>For any t, the three weights (1 − t)², 2(1 − t)t and t² add up to 1. At t = 0 the curve is at a, and at t = 1 it is at c.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>t<\/th><th>(1 − t)²<\/th><th>2(1 − t)t<\/th><th>t²<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0.25<\/td><td>0.5625<\/td><td>0.375<\/td><td>0.0625<\/td><\/tr><tr><td>0.5<\/td><td>0.25<\/td><td>0.5<\/td><td>0.25<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A <code>lerp<\/code> line gives the point a fraction t of the way from a to b.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A <code>bezier<\/code> line gives the point at t on the curve that starts at a, ends at c and is pulled toward the control point b (the <strong>middle<\/strong> point on the line).<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The ends are exact: t = 0 gives the first point and t = 1 the last one. For a curve, that is c, not the control point b.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Negative coordinates, fractional coordinates and fractional t all work.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every coordinate in the input is between −1000 and 1000, and has at most 4 digits after the decimal point. <code>t<\/code> is between 0 and 1, inclusive.<\/li><li>The input is well-formed: each line has the keyword and the right count of numbers.<\/li><li>A test has from 1 to about 80 lines.<\/li><li>There are 24 tests: hand-made lines for each rule, random lines, and every line and curve of 'S' and 'o' (JetBrains Mono Bold) and 'あ' (Noto Sans JP), plus one curve of '3' cut into 16 steps.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>32-bit <code>float<\/code> is accurate enough for these tests. The point type in <code>Geometry.h<\/code> uses <code>double<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/utils/Geometry.h","text":"#pragma once\n// Points, curves and where they meet.\n// Assignment 10: lerp and quadratic Bezier curves. 12: two segments. 13: a line and a curve.\n// 15: the lowest point of a curve.\n\n#include <algorithm>\n#include <cmath>\n#include <optional>\n#include <vector>\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\ninline Vec2 operator+(const Vec2 a, const Vec2 b) { return {a.x + b.x, a.y + b.y}; }\ninline Vec2 operator-(const Vec2 a, const Vec2 b) { return {a.x - b.x, a.y - b.y}; }\ninline Vec2 operator*(const Vec2 v, const double s) { return {v.x * s, v.y * s}; }\n\n// ---- Assignment 10 ------------------------------------------------------------------\n\n// The point a fraction t of the way from a to b.\ninline Vec2 lerp(const Vec2 a, const Vec2 b, const double t) { return a + (b - a) * t; }\n\n// The quadratic Bezier curve a (start), b (control), c (end) at t. De Casteljau: lerp along\n// both legs of the control polygon, then between the two results.\ninline Vec2 bezierLerp(const Vec2 a, const Vec2 b, const Vec2 c, const double t) {\n  return lerp(lerp(a, b, t), lerp(b, c, t), t);\n}\n"},{"path":"assignments/assignment_10_bezier.cpp","text":"// Assignment 10 (lerp and quadratic Bezier curves): evaluates a test input's points.\n// The maths is in src/utils/Geometry.h.\n\n#include <cmath>\n#include <cstdio>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\n// Whole numbers print with no decimal point; others with 4 decimals, trailing zeros dropped.\nstd::string number(double v) {\n  if (std::isnan(v)) return \"nan\";\n  if (std::isinf(v)) return v > 0 ? \"inf\" : \"-inf\";\n  char text[64];\n  std::snprintf(text, sizeof text, \"%.4f\", v);\n  std::string s = text;\n  s.erase(s.find_last_not_of('0') + 1);\n  if (s.back() == '.') s.pop_back();\n  return s == \"-0\" ? \"0\" : s;\n}\n\nVec2 readPoint(std::istream& words) {\n  Vec2 p;\n  words >> p.x >> p.y;\n  return p;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      Vec2 p;\n      if (keyword == \"lerp\") {\n        const Vec2 a = readPoint(words), b = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = lerp(a, b, t);\n      } else if (keyword == \"bezier\") {\n        const Vec2 a = readPoint(words), b = readPoint(words), c = readPoint(words);\n        double t = 0;\n        words >> t;\n        p = bezierLerp(a, b, c, t);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n      if (!words) throw std::runtime_error(\"bad numbers in line: \" + line);\n      output << number(p.x) << ' ' << number(p.y) << '\\n';\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":[],"proof":{"passed":24,"total":24,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the start of the blog's <strong>\"Renderer: Curve Rendering\"<\/strong> section: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Definition%20of%20B%C3%A9zier%20Curves\" target=\"_blank\" rel=\"noopener\">Definition of Bézier Curves<\/a> and <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=De%20Casteljau,algorithm\" target=\"_blank\" rel=\"noopener\">De Casteljau's algorithm<\/a>. Stop at the sentence that introduces the code. The author's code (the listing \"Lerp for a segment and a quadratic Bézier curve\") follows it. \"TrueType Bézier curves\" belongs to assignment 11.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 08 you drew glyph outlines with straight lines. TrueType outlines also use quadratic Bezier curves. Each curve has an on-curve start point, an off-curve <strong>control point<\/strong> that pulls the curve toward itself, and an on-curve end point.<\/p>\n<p>Here you compute points along such a curve. In assignment 11 you draw each curve by joining many of these points with short straight lines.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>, on quadratic curves in TrueType outlines<\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>, which defines on-curve and off-curve points<\/li><li>Pomax, <em>A Primer on Bézier Curves<\/em>, <a href=\"https://pomax.github.io/bezierinfo/#decasteljau\" target=\"_blank\" rel=\"noopener\">de Casteljau's algorithm<\/a>, with interactive drawings<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=De%20Casteljau,algorithm\" target=\"_blank\" rel=\"noopener\">De Casteljau's algorithm<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 10                         run every test\n.\\check 10 -Case 10-R2-midpoint    one test, showing its full input, expected output and your output\n.\\check 10 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 10 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  bezier: the point at t on the curve from a to c, which bends toward b .....    0 / 7   FAILED\n      x 10-R2-midpoint  an arch from (0,0) to (100,0) pulled toward (50,100): t = 0.5\n          line 1: expected `50 50`, got `37.5 25`\n          expected values from: exact arithmetic with Python fractions.Fraction\n          reproduce: build/solutions/assignment_10.exe build/cases/10/10-R2-midpoint.in build/cases/10/10-R2-midpoint.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>lerp<\/code> first and test it on Example 1. Once <code>lerp<\/code> works, you can write the curve function as three calls to it.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Treat a point as a pair and apply the same arithmetic to x and y. For a curve, lerp along the leg a → b and along the leg b → c with the same t, then lerp between those two results, again with the same t. Check yourself on Example 2, where every step lands on a round number.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>It is (b − a) · t, not (a − b) · t. At t = 0.25 the point is closer to a.<\/li><li>On a <code>bezier<\/code> line the middle point is the control point and the last point is the end. At t = 1 the answer is c.<\/li><li>Use the same t in all three lerps, and lerp from the first leg's point to the second leg's point, not the other way round.<\/li><li>If you use the expanded formula, don't drop the 2 on the middle term. The weights must add up to 1.<\/li><li>Read the numbers as floating point. Inputs like <code>46.5<\/code> and <code>0.0625<\/code> are common.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>lerp(a, b, t):\n    return (a.x + (b.x - a.x) * t,  a.y + (b.y - a.y) * t)\n\nbezier(a, b, c, t):\n    p = lerp(a, b, t)\n    q = lerp(b, c, t)\n    return lerp(p, q, t)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"lerp in both directions","test":"10-R1-direction","input":"lerp 10 20 50 100 0.25\nlerp 50 100 10 20 0.25\nlerp 10 20 50 100 0.9\nlerp 50 100 10 20 0.9","output":"20 40\n40 80\n46 92\n14 28","image":null,"explain":"<p>On the first line, b − a = (40, 80). A quarter of that is (10, 20), and a + (10, 20) = (20, 40). The second line swaps a and b, so you measure the quarter from (50, 100).<\/p>"},{"label":"Example 2","name":"the middle of an arch","test":"10-R2-midpoint","input":"bezier 0 0 50 100 100 0 0.5","output":"50 50","image":null,"explain":"<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Computation<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td>p = lerp(a, b, 0.5)<\/td><td>halfway from (0, 0) to (50, 100)<\/td><td>(25, 50)<\/td><\/tr><tr><td>q = lerp(b, c, 0.5)<\/td><td>halfway from (50, 100) to (100, 0)<\/td><td>(75, 50)<\/td><\/tr><tr><td>lerp(p, q, 0.5)<\/td><td>halfway from (25, 50) to (75, 50)<\/td><td><strong>(50, 50)<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>The control point is at height 100, but the curve only reaches 50. With the formula: 0.25 · (0, 0) + 0.5 · (50, 100) + 0.25 · (100, 0) = (50, 50).<\/p>"},{"label":"Example 3","name":"the end of a curve is c, not b","test":"10-R3-control-not-on-curve","input":"bezier 0 0 0 100 100 100 1\nbezier 0 0 0 100 100 100 0.5","output":"100 100\n25 75","image":null,"explain":"<p>At t = 1 every weight except t² is 0, so the curve ends at c = (100, 100). The control point (0, 100) only bends the curve: at t = 0.5, p = (0, 50), q = (50, 100) and the point is (25, 75).<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Lerp%20for%20a%20segment\" target=\"_blank\" rel=\"noopener\">The blog's listing<\/a> has two short functions on <code>glm::vec2<\/code>. <code>lerp<\/code> asserts that t is between 0 and 1 and returns a + (b − a) · t. <code>bezierLerp<\/code> nests three <code>lerp<\/code> calls in de Casteljau's order, as in Example 2. The blog gives the expanded formula in its prose and doesn't use it in the code.<\/p>\n<p><strong>Something to look for:<\/strong> the drawing code in the next section (\"TrueType Bézier curves\") calls the curve function <code>quadBezierLerp<\/code>, while this listing names it <code>bezierLerp<\/code>. They are the same function. If you follow along in C++, pick one name.<\/p>"}},{"id":"11","num":"11","title":"Draw an outline with curves","difficulty":"Medium","tests":27,"problem":"problems/11-outline-curves.md","entry":"solutions/assignments/assignment_11_outline_curves.cpp","files":[{"path":"solutions/assignments/assignment_11_outline_curves.cpp","role":"entry","purpose":null,"job":"Read the input as in assignment 08: make the canvas from the `canvas` line, keep the latest `place`, `style` (which now holds only the line thickness) and `color`, and build each outline from its `ends` and `points` lines. Draw every outline with your new curve function from `render/Outline.h`, then write the canvas to the output path with your `FrameBufferCanvas` from assignment 06.","blank":"// ======================================================================================\n// Assignment 11: Draw an outline with curves\n// Problem: problems/11-outline-curves.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 11 as `build/solutions/assignment_11.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 11`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the input as in assignment 08: make the canvas from the `canvas` line, keep the\n//   latest `place`, `style` (which now holds only the line thickness) and `color`, and\n//   build each outline from its `ends` and `points` lines. Draw every outline with your\n//   new curve function from `render/Outline.h`, then write the canvas to the output path\n//   with your `FrameBufferCanvas` from assignment 06.\n//\n// The other files of this assignment:\n//   It adds to src/render/Outline.h, which you started earlier: Declare a second drawing\n//   function next to your straight-line one from assignment 08. It takes the canvas, an\n//   outline, its placement, a line thickness and a colour, and draws the outline with its\n//   curves. The Boilerplate's `Outline.h` already declares it as `renderGlyphCurves`; if\n//   you wrote the header your own way, add the declaration now.\n//   It adds to src/render/Outline.cpp, which you started earlier: Implement the curve\n//   drawing. Walk each contour from an on-curve point and turn its points into straight\n//   lines and quadratic curves, adding an implied on-curve point between two off-curve\n//   points. Draw each curve as short lines with your curve function from\n//   `utils/Geometry.h`. Draw the red, green and blue markers after all the lines of the\n//   outline.\n//   Earlier files you can use: src/utils/Geometry.h.\n//   Include them by their path under src/, e.g. #include \"render/Outline.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 11: Draw an outline with curves\n// Problem: problems/11-outline-curves.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 11 as `build/solutions/assignment_11.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 11`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/render/Outline.h, which you started earlier: Declare a second drawing\n//   function next to your straight-line one from assignment 08. It takes the canvas, an\n//   outline, its placement, a line thickness and a colour, and draws the outline with its\n//   curves. The Boilerplate's `Outline.h` already declares it as `renderGlyphCurves`; if\n//   you wrote the header your own way, add the declaration now.\n//   It adds to src/render/Outline.cpp, which you started earlier: Implement the curve\n//   drawing. Walk each contour from an on-curve point and turn its points into straight\n//   lines and quadratic curves, adding an implied on-curve point between two off-curve\n//   points. Draw each curve as short lines with your curve function from\n//   `utils/Geometry.h`. Draw the red, green and blue markers after all the lines of the\n//   outline.\n//   Earlier files you can use: src/utils/Geometry.h.\n//   Include them by their path under src/, e.g. #include \"render/Outline.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/Outline.h\"\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    int lineThickness = 1;\n    RGB color{255, 255, 255};\n    GlyphComponent outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness>\n        words >> lineThickness;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = GlyphComponent{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3)\n          outline.points.push_back(GlyphPoint{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        renderGlyphCurves(*canvas, outline, place, lineThickness, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/render/Outline.h","role":"adds","purpose":"These files draw a glyph's outline on the canvas, with straight lines between its points and a marker on every point. In assignment 11 you add a second drawing, with the real curves, to the same files.","job":"Declare a second drawing function next to your straight-line one from assignment 08. It takes the canvas, an outline, its placement, a line thickness and a colour, and draws the outline with its curves. The Boilerplate's `Outline.h` already declares it as `renderGlyphCurves`; if you wrote the header your own way, add the declaration now.","blank":"#pragma once\n// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   These files draw a glyph's outline on the canvas, with straight lines between its\n//   points and a marker on every point. In assignment 11 you add a second drawing, with\n//   the real curves, to the same files.\n//\n// Your job:\n//   Declare a drawing style (line thickness and marker size) and a function that draws one\n//   outline (the type from `GlyphComponent.h`) on your `FrameBufferCanvas`, given a\n//   placement, a style and a colour.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"08"},{"path":"solutions/src/render/Outline.cpp","role":"adds","purpose":"These files draw a glyph's outline on the canvas, with straight lines between its points and a marker on every point. In assignment 11 you add a second drawing, with the real curves, to the same files.","job":"Implement the curve drawing. Walk each contour from an on-curve point and turn its points into straight lines and quadratic curves, adding an implied on-curve point between two off-curve points. Draw each curve as short lines with your curve function from `utils/Geometry.h`. Draw the red, green and blue markers after all the lines of the outline.","blank":"// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   These files draw a glyph's outline on the canvas, with straight lines between its\n//   points and a marker on every point. In assignment 11 you add a second drawing, with\n//   the real curves, to the same files.\n//\n// Your job:\n//   Implement the outline drawing as \"What to draw\" describes: turn every point into a\n//   pixel with the formulas in \"From font units to pixels\", join the points of each\n//   contour with lines, including the closing line, then draw a marker on every point. Use\n//   your canvas's line and rectangle for both.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"08"}],"buildsOn":[{"path":"solutions/src/utils/Geometry.h","owner":"10","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them."}],"indent":2,"tags":[{"label":"Language","items":["walking a circular list with an index modulo its length","a small 2D vector struct","floating-point arithmetic, rounding only at the end"],"text":["walking a circular list with an index modulo its length","a small 2D vector struct","floating-point arithmetic, rounding only at the end"]},{"label":"Library","items":["your <code>FrameBufferCanvas<\/code> from assignment 06 (<code>drawLine<\/code>, <code>drawRect<\/code>, <code>writePng<\/code>)"],"text":["your FrameBufferCanvas from assignment 06 (drawLine, drawRect, writePng)"]},{"label":"Concepts","items":["quadratic Bézier curves","on-curve and off-curve points","implied on-curve points","flattening a curve into short lines"],"text":["quadratic Bézier curves","on-curve and off-curve points","implied on-curve points","flattening a curve into short lines"]}],"body":"<div class=\"d-problem flow\"><p>Your program reads one or more glyph outlines and draws each one with straight lines and quadratic curves. It marks every point with a coloured square and writes the picture as a PNG.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The output file name ends in <code>.png<\/code>. The input is the same as in assignment 08, except that <code>style<\/code> has one number (there is no marker size):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;w&gt; &lt;h&gt;<\/code><\/td><td>The first line of the file: the picture is <code>w<\/code> x <code>h<\/code> pixels, all black.<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Where the following outlines go (see below).<\/td><\/tr><tr><td><code>style &lt;lineThickness&gt;<\/code><\/td><td>Thickness of lines and curves, in pixels, for the following outlines.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>Colour of the lines and curves of the following outlines.<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline. An <code>ends<\/code> line and a <code>points<\/code> line follow.<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, in increasing order.<\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>Every point of the outline, in order, in font units.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>place<\/code>, <code>style<\/code> and <code>color<\/code> come before the first <code>outline<\/code> and may change between outlines; each outline uses the most recent ones. Coordinates may have a fractional part.<\/p>\n<h3>Output<\/h3>\n<p>Your program writes a PNG (or binary PPM) file of exactly <code>w<\/code> x <code>h<\/code> pixels, RGB, with (0, 0) at the top-left and y growing downwards.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path the checker gives you. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work.<\/p>\n<ul><li><strong>With your canvas:<\/strong> <code>writePng<\/code> on your <code>FrameBufferCanvas<\/code> from assignment 06 writes a PNG. The boilerplate calls it.<\/li><li><strong>A binary PPM by hand:<\/strong> the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><li><strong>A real PNG by hand:<\/strong> <code>third_party/stb_image_write.h<\/code> in your project is on the include path. <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><\/ul>\n<h3>From font units to pixels<\/h3>\n<p>A point (x, y) in font units sits at<\/p>\n<pre><code>px = x0 + scale * x\npy = baseline - scale * y<\/code><\/pre>\n<p>Keep these as floating-point numbers. Work out curves and implied points from them, and round to whole pixels only when you draw. Your <code>FrameBufferCanvas::drawLine<\/code> from assignment 06 takes whole pixels, so round each end to the nearest pixel (<code>std::lround<\/code>) as you call it; a cast to <code>int<\/code> cuts off the fraction instead of rounding.<\/p>\n<p>Rounding every point first, as in assignment 08, moves a curve by less than a pixel and also passes.<\/p>\n<h3>Walking a contour<\/h3>\n<p><code>ends<\/code> splits the points into contours as in assignment 08: contour 0 is points 0 to <code>e0<\/code>, contour 1 is points <code>e0 + 1<\/code> to <code>e1<\/code>, and so on. Each contour closes on itself: after its last point comes its first point again.<\/p>\n<p>Go round a contour keeping a <strong>current position<\/strong>: the point where the next piece starts. The current position is an on-curve point, real or implied. Each point you reach adds one piece that starts at the current position:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Point reached<\/th><th>The point after it<\/th><th>Piece<\/th><th>Current position becomes<\/th><\/tr><\/thead><tbody><tr><td>on-curve<\/td><td>(doesn't matter)<\/td><td>a <strong>straight line<\/strong> to it<\/td><td>this point<\/td><\/tr><tr><td>off-curve<\/td><td>on-curve<\/td><td>a <strong>curve<\/strong> with this point as control point, ending at the point after it, which the walk then skips<\/td><td>the point after it<\/td><\/tr><tr><td>off-curve<\/td><td>off-curve<\/td><td>a <strong>curve<\/strong> with this point as control point, ending at the <strong>implied on-curve point<\/strong> halfway between the two<\/td><td>the implied point<\/td><\/tr><\/tbody><\/table><\/div>\n<p>If two off-curve points follow each other, the outline passes through the point halfway between them. The font doesn't store that point; it is an <strong>implied on-curve point<\/strong>, where one curve ends and the next begins. The last and the first point of a contour count as neighbours.<\/p>\n<p><strong>Where to start.<\/strong> Every piece starts at an on-curve point, real or implied, so start the walk at the first on-curve point of the contour and go round the contour back to it. The walk ends when it reaches the starting point again:<\/p>\n<ul><li>if the contour's last point is on-curve, the final piece is a line back to the start;<\/li><li>if it is off-curve, the final piece is a curve that ends at the start.<\/li><\/ul>\n<p>A contour with k off-curve control points gives k curves. If the contour has <strong>no<\/strong> on-curve point, start at the implied point halfway between its last and first points.<\/p>\n<p>The start rule matters for two kinds of contour:<\/p>\n<ul><li>a contour whose first point is off-curve: its first curve starts at the last on-curve point of the contour (or at the implied point between its last and first points), not at (0, 0);<\/li><li>a contour with only off-curve points, such as a circle made of 4 or 8 control points: it is a ring of curves joined at implied points.<\/li><\/ul>\n<h3>Drawing a curve<\/h3>\n<p>The quadratic Bézier curve from P0 to P2 with control point P1 is<\/p>\n<pre><code>B(t) = (1 - t)² P0 + 2 (1 - t) t P1 + t² P2,     t from 0 to 1<\/code><\/pre>\n<p>Draw it as <code>n<\/code> short straight lines from B((i - 1) / n) to B(i / n) for i = 1 to n, where<\/p>\n<pre><code>n = max(1, ceil(|P1 - P0| + |P2 - P1|))       lengths in pixels<\/code><\/pre>\n<p>The curve is no longer than its <strong>control polygon<\/strong> (P0 to P1 to P2), so each short line is about a pixel long at most. More pieces are fine; much fewer, such as a fixed 8, leave visible corners on long curves.<\/p>\n<p>Lines and curves both use thickness <code>lineThickness<\/code> and the outline's colour.<\/p>\n<h3>Markers<\/h3>\n<p>Draw the markers after <strong>all<\/strong> the lines and curves of an outline: a square of size <code>2 * lineThickness<\/code> on each point, rounded to the nearest pixel. The size is even, so the square covers columns x − lineThickness up to x + lineThickness − 1 (and rows likewise), as your <code>FrameBufferCanvas::drawRect<\/code> from assignment 06 does: a 6 x 6 marker at x = 50 covers columns 47 to 52. The colour depends on the point:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Point<\/th><th>Colour<\/th><\/tr><\/thead><tbody><tr><td>every on-curve point of the input<\/td><td>red (255, 0, 0)<\/td><\/tr><tr><td>every off-curve point of the input<\/td><td>green (0, 255, 0)<\/td><\/tr><tr><td>every implied on-curve point<\/td><td>blue (0, 0, 255)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Markers go on top of the lines, so each square shows its full colour. In the tests, markers of different colours don't overlap, so you can draw them in any order.<\/p>\n<h3>How the picture is compared<\/h3>\n<p>The checker compares your PNG with the expected picture pixel by pixel. The one difference it forgives is an edge that moved by at most 1 pixel, so small rounding differences pass. A straight line where a curve should be, a missing marker or a marker of the wrong colour fails.<\/p>\n<p>If a test fails, the checker writes a diff picture:<\/p>\n<ul><li>red where you have extra ink;<\/li><li>blue where ink is missing;<\/li><li>magenta for the wrong colour;<\/li><li>yellow for forgiven pixels.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A straight line joins two on-curve points in a row, including the last and first point of a contour.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>An off-curve point between two on-curve points makes one quadratic curve between them, drawn as short lines.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Two off-curve points in a row have an implied on-curve point halfway between them. One curve ends there and the next starts there, and the point gets a blue marker.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Your program draws every piece of a contour that starts with an off-curve point or has no on-curve point, the closing curve included.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Markers are <code>2 * lineThickness<\/code> squares on top of the lines: red on-curve, green off-curve, blue implied.<\/span><\/li><li><span class=\"rid\">R6<\/span><span><code>place<\/code> positions the points (x0 + scale * x, baseline - scale * y), and several outlines on one canvas each use their own <code>place<\/code>, <code>style<\/code> and <code>color<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>w<\/code> and <code>h<\/code> are at most 600. Every outline fits inside the canvas.<\/li><li>Every contour has at least 3 points. An outline has at most a few hundred points.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 27 tests: glyphs from JetBrains Mono Bold (<code>-<\/code>, <code>A<\/code>, <code>B<\/code>, <code>D<\/code>, <code>S<\/code>, <code>a<\/code>, <code>g<\/code>, <code>o<\/code>), Nerd Font icons from the same file whose contours start off-curve or have no on-curve point (U+F111, U+F10C, U+E3A2, U+F00C, U+F042), <code>a<\/code> and U+5341 十 from Noto Sans JP, hand-made outlines and 3 random outlines.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/render/Outline.h","text":"#pragma once\n// Assignment 08: drawing a glyph's outline with straight lines; assignment 11: with curves.\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\nstruct OutlineStyle {\n  int lineThickness = 1;  // passed to FrameBufferCanvas::drawLine\n  int markerSize = 1;     // width and height of the square drawn at every point\n};\n\n// A straight line between consecutive points of each contour (the last point joins the\n// first), then a marker on every point, all in `color`.\nvoid renderGlyphOutline(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                        const OutlineStyle& style, RGB color);\n\n// ---- Assignment 11: curves --------------------------------------------------------\n\n// The real outline, quadratic curves included, then markers twice the line thickness:\n// red on-curve points, green off-curve points, blue implied on-curve points.\nvoid renderGlyphCurves(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                       int lineThickness, RGB color);\n"},{"path":"src/render/Outline.cpp","text":"#include \"render/Outline.h\"\n\n#include <cmath>\n#include <utility>\n\nnamespace {\n\nint nearest(const double v) { return static_cast<int>(std::lround(v)); }\n\n// Font units -> the nearest pixel (y flipped: font y grows upwards, pixel y downwards).\nstd::pair<int, int> pixelOf(const GlyphPoint& p, const Placement& place) {\n  return {nearest(place.x0 + place.scale * p.x), nearest(place.baseline - place.scale * p.y)};\n}\n\n}  // namespace\n\nvoid renderGlyphOutline(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                        const OutlineStyle& style, const RGB color) {\n  int first = 0;\n  for (const int last : outline.endPtsOfContours) {\n    for (int i = first; i <= last; ++i) {\n      const int next = i == last ? first : i + 1;  // the last point closes the contour\n      const auto [ax, ay] = pixelOf(outline.points[i], place);\n      const auto [bx, by] = pixelOf(outline.points[next], place);\n      canvas.drawLine(ax, ay, bx, by, style.lineThickness, color);\n    }\n    first = last + 1;\n  }\n  for (const GlyphPoint& p : outline.points) {  // markers on top of the lines\n    const auto [x, y] = pixelOf(p, place);\n    canvas.drawRect(x, y, style.markerSize, style.markerSize, color);\n  }\n}\n\n// ---- Assignment 11: curves --------------------------------------------------------\n// These includes arrived with the curves.\n\n#include <algorithm>\n#include <vector>\n\n#include \"utils/Geometry.h\"\n\nnamespace {\n\nconst RGB ON_CURVE_COLOR{255, 0, 0};   // red: on-curve points from the outline\nconst RGB OFF_CURVE_COLOR{0, 255, 0};  // green: off-curve (control) points\nconst RGB IMPLIED_COLOR{0, 0, 255};    // blue: on-curve points implied between two off-curve points\n\n// Font units -> pixels, not rounded yet.\nVec2 toPixel(const GlyphPoint& p, const Placement& place) {\n  return {place.x0 + place.scale * p.x, place.baseline - place.scale * p.y};\n}\n\nVec2 midpoint(const Vec2 a, const Vec2 b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\nvoid line(FrameBufferCanvas& canvas, const Vec2 a, const Vec2 b, const int thickness, const RGB color) {\n  // Rounded through float, as the pictures in the tests were drawn.\n  const auto round = [](const double v) { return nearest(static_cast<float>(v)); };\n  canvas.drawLine(round(a.x), round(a.y), round(b.x), round(b.y), thickness, color);\n}\n\n// A quadratic curve as short straight pieces. The control polygon is never shorter than the\n// curve, so this gives at most about one pixel per piece.\nvoid drawQuadratic(FrameBufferCanvas& canvas, const Vec2 p0, const Vec2 p1, const Vec2 p2, const int thickness,\n                   const RGB color) {\n  const double length = std::hypot(p1.x - p0.x, p1.y - p0.y) + std::hypot(p2.x - p1.x, p2.y - p1.y);\n  const int pieces = std::max(1, static_cast<int>(std::ceil(length)));\n  Vec2 previous = p0;\n  for (int i = 1; i <= pieces; ++i) {\n    const Vec2 next = bezierLerp(p0, p1, p2, static_cast<double>(i) / pieces);\n    line(canvas, previous, next, thickness, color);\n    previous = next;\n  }\n}\n\n}  // namespace\n\nvoid renderGlyphCurves(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                       const int lineThickness, const RGB color) {\n  struct Marker {\n    Vec2 at;\n    RGB color;\n  };\n  std::vector<Marker> markers;\n  int first = 0;\n  for (const int last : outline.endPtsOfContours) {\n    const int n = last - first + 1;\n    const auto at = [&](const int k) { return toPixel(outline.points[first + k % n], place); };\n    const auto on = [&](const int k) { return outline.points[first + k % n].onCurve; };\n\n    // Start from an on-curve point. With none, start from the implied on-curve point\n    // between the last and the first point; every point is then visited once.\n    int k = 0;\n    while (k < n && !on(k)) ++k;\n    Vec2 current;\n    int stop;\n    if (k < n) {\n      current = at(k);\n      stop = k + n + 1;  // ends with the start point again, which closes the contour\n      ++k;\n    } else {\n      current = midpoint(at(n - 1), at(0));\n      k = 0;\n      stop = n;\n    }\n    while (k < stop) {\n      if (on(k)) {\n        line(canvas, current, at(k), lineThickness, color);\n        current = at(k);\n        ++k;\n      } else if (on(k + 1)) {  // off, on: one curve, and the on-curve point is used up\n        drawQuadratic(canvas, current, at(k), at(k + 1), lineThickness, color);\n        current = at(k + 1);\n        k += 2;\n      } else {  // off, off: the curve ends at the implied point halfway between them\n        const Vec2 implied = midpoint(at(k), at(k + 1));\n        drawQuadratic(canvas, current, at(k), implied, lineThickness, color);\n        current = implied;\n        ++k;\n      }\n    }\n\n    for (int i = 0; i < n; ++i) {\n      markers.push_back({at(i), on(i) ? ON_CURVE_COLOR : OFF_CURVE_COLOR});\n      if (!on(i) && !on(i + 1)) markers.push_back({midpoint(at(i), at(i + 1)), IMPLIED_COLOR});\n    }\n    first = last + 1;\n  }\n  for (const Marker& m : markers)  // on top of every line\n    canvas.drawRect(nearest(m.at.x), nearest(m.at.y), 2 * lineThickness, 2 * lineThickness, m.color);\n}\n"},{"path":"assignments/assignment_11_outline_curves.cpp","text":"// Assignment 11 (draw an outline with curves): draws a test input's outlines, curves included.\n// The drawing is src/render/Outline, using the curve maths in src/utils/Geometry.h.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/Outline.h\"\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    int lineThickness = 1;\n    RGB color{255, 255, 255};\n    GlyphComponent outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness>\n        words >> lineThickness;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = GlyphComponent{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3)\n          outline.points.push_back(GlyphPoint{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        renderGlyphCurves(*canvas, outline, place, lineThickness, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/FrameBufferCanvas.h","src/GlyphComponent.h","src/render/Placement.h","src/utils/Geometry.h","src/FrameBufferCanvas.cpp"],"proof":{"passed":27,"total":27,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <strong>\"Renderer: Curve Rendering\"<\/strong> section through <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=TrueType%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">TrueType Bézier curves<\/a> and stop at the sentence that introduces the code. The author's code follows it.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 08 you joined every point of an outline with a straight line. TrueType outlines also contain quadratic curves: an off-curve point pulls the outline toward itself without lying on it.<\/p>\n<p>Here you draw outlines with their curves, using your curve function in <code>utils/Geometry.h<\/code> from assignment 10. Assignments 13, 14 and 17 use the same pieces (lines and curves) to fill glyphs.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: quadratic curves, on-curve and off-curve points, and the implied point between two off-curve points<\/li><li>FreeType, <a href=\"https://freetype.org/freetype2/docs/glyphs/glyphs-6.html\" target=\"_blank\" rel=\"noopener\">Glyph Conventions: outlines<\/a>: the same rules, with pictures<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/B%C3%A9zier_curve#Quadratic_B%C3%A9zier_curves\" target=\"_blank\" rel=\"noopener\">Bézier curve: quadratic curves<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=TrueType%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">TrueType Bézier curves<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 11                         run every test\n.\\check 11 -Case 11-R4-off-first   one test, showing its full input and where your picture is\n.\\check 11 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 11 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>Open your picture (<code>build/cases/11/&lt;id&gt;.out.png<\/code>) next to the expected one (<code>tests/11/expected/&lt;id&gt;.png<\/code>) and the diff the checker writes. A failing test looks like this:<\/p>\n<pre><code>  R3  Two off-curve points in a row: implied on-curve point halfway (blue) .    0 / 4   FAILED\n      x 11-R3-two-offs  hand-made: two off-curve points in a row, implied point between them\n          2263 pixels missing, e.g. (169, 9) should be blue; 2353 extra pixels, e.g. (306, 11) should be black (beyond the 1-pixel edge tolerance). Diff: build/cases/11/11-R3-two-offs.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven\n          likely cause: R3 - Two off-curve points in a row: implied on-curve point halfway (blue)\n          expected values from: hand-made outline; reference drawing, checked against fontTools&#x27; pieces and implied points\n          reproduce: build/solutions/assignment_11.exe build/cases/11/11-R3-two-offs.in build/cases/11/11-R3-two-offs.out.png<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Before you start, open the expected pictures for Example 1 and Example 3: the blue markers show where curves join. Write <code>drawQuadratic()<\/code> first and test it on Example 1's numbers. Then copy your loop from assignment 08 and change what happens at an off-curve point.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Convert the contour's points to pixels (as floats) and index them modulo the contour's length, so the point after the last is the first. Keep a <code>current<\/code> position: where the next piece starts. Find the first on-curve point and start there (or start at the midpoint of the last and first points if there is none). Then, for each point after the start, all the way round: an on-curve point ends a straight line; an off-curve point ends a curve at the next point if that is on-curve (skip it, since the curve used it) or at the midpoint with the next point. Each time, <code>current<\/code> becomes the end of what you drew. Collect the markers as you go and draw them after the loop.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Don't start the walk at point 0 with <code>current = (0, 0)<\/code>: a contour whose first point is off-curve then starts its first curve in the wrong place and loses its closing curve.<\/li><li>A contour can have no on-curve point at all (<code>fa-circle<\/code>, U+F111, is 8 off-curve points). Make sure your search for an on-curve start point doesn't loop forever or fall off the end.<\/li><li>After a curve that ends at a real on-curve point, don't draw a line to that point again.<\/li><li>The midpoint test also applies across the wrap: the last and first points of a contour are neighbours.<\/li><li>Draw markers after all lines, or later lines cross earlier markers.<\/li><li>Use the pixel positions for the piece count: <code>n<\/code> from font units would be far too many at a small scale (still correct, but slow) or too few at a large one.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>drawQuadratic(p0, p1, p2):\n    n = max(1, ceil(|p1 - p0| + |p2 - p1|))\n    prev = p0\n    for i in 1 .. n:\n        t = i / n\n        next = (1-t)² p0 + 2(1-t)t p1 + t² p2\n        drawLine(prev, next, lineThickness, color)\n        prev = next\n\ndrawOutline(outline):\n    markers = []\n    for each contour (pixel points q[0..m-1], q[k] means q[k mod m]):\n        s = index of the first on-curve point, or none\n        if s exists: current = q[s]; k = s + 1; stop = s + m + 1\n        else:        current = mid(q[m-1], q[0]); k = 0; stop = m\n        while k &lt; stop:\n            if q[k] is on:        drawLine(current, q[k]); current = q[k]; k += 1\n            elif q[k+1] is on:    drawQuadratic(current, q[k], q[k+1]); current = q[k+1]; k += 2\n            else:                 mid = mid(q[k], q[k+1]); drawQuadratic(current, q[k], mid); current = mid; k += 1\n        for i in 0 .. m-1:\n            add marker (q[i], red if on else green)\n            if q[i] and q[i+1] are both off: add marker (mid(q[i], q[i+1]), blue)\n    for each marker: drawRect(round(x), round(y), 2 * lineThickness, 2 * lineThickness, colour)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"two off-curve points in a row","test":"11-R3-two-offs","input":"canvas 344 344\nplace 12 332 0.8\nstyle 3\ncolor 255 255 255\noutline\nends 3\npoints 0 0 on 0 400 off 400 400 off 400 0 on","output":"a 344 x 344 PNG","image":null,"explain":"<figure class=\"pic\"> alt=\"A white arch: two curves meeting at a blue marker at the top, closed by a straight line at the bottom\"><figcaption>tests/11/expected/11-R3-two-offs.png<\/figcaption><\/figure>\n<p>In pixels the points are A (12, 332) on, B (12, 12) off, C (332, 12) off and D (332, 332) on. B and C are both off-curve, so the outline passes through the implied point halfway between them, M = (172, 12). The pieces are:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Piece<\/th><th>From<\/th><th>Control<\/th><th>To<\/th><th>n<\/th><\/tr><\/thead><tbody><tr><td>curve<\/td><td>A (12, 332)<\/td><td>B (12, 12)<\/td><td>M (172, 12)<\/td><td>320 + 160 = 480<\/td><\/tr><tr><td>curve<\/td><td>M (172, 12)<\/td><td>C (332, 12)<\/td><td>D (332, 332)<\/td><td>160 + 320 = 480<\/td><\/tr><tr><td>line<\/td><td>D (332, 332)<\/td><td><\/td><td>A (12, 332)<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Then draw 6 x 6 markers: red on A and D, green on B and C, blue on M.<\/p>"},{"label":"Example 2","name":"a contour that starts off-curve","test":"11-R4-off-first","input":"canvas 384 294\nplace 12 282 0.9\nstyle 3\ncolor 255 220 0\noutline\nends 3\npoints 300 0 off 400 200 on 200 300 on 0 100 off","output":"a 384 x 294 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYAAAAEmCAIAAADk4NAbAAAE4klEQVR42u3XMXLjMAxAUd3/jL6LUqQzR3ZGIQGIeG9c7RZJSPCbPA4AAAAAAAAAAAAACHQOHwABAgQIICxA58uqAHkB+v0ArKzP61OAZAhYWZ8hNG//KENAUH2u/leGgKD6yBAQVJ+vQZEhIPTuI0NAlfrIEJBcHxkCkusjQ8D9WCxNmwwBa+8+MgTc6ULwj5MhUJ/QEMgQqE/y4ZchUJ/kMy9D0DpANR+DMgTqI0PAshP+iF9ShkB9ZAiYdKQfGk0ZgmfXZ4O7mwyBu48MAQ3qI0OgPjIE9K6PDIH6yBDQuz4yBOojQ8BwCK2A1QB3HxmCZucNGQLXHxmCNgcMGQJ3HxkC9UGGQH1kCNQHGYKpxwYZAvWRIWh2QpAhyDkbyBCojwyB+iBDoD4yBOqDDMHUcUeGIGHQkSFQH2SIZmONDIH6IEOoDzIEq8cXGQL1QYbw+EKGQH2QIdQHGQL1QYYQIGQIbo4gZsA84O6DDKE+yJDxwOMLGUJ9kCEDg8cXMoT6IEPg8YUMoT7IEHh8IUOoDzIE6oMMUWQ+QIZw/UGGUB+QIdQHGUKAQIaYuusgQ7j7YDJlyPUHZAj1waDKkMcXyBCuP5hbGVIfkCE8vjDJRlp9QIbw+EKGDLnrDxTI0PH+QX0gKkMC
