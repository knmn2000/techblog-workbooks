ing count while it walks the sorted crossings, the same way this page describes.<\/p>\n<p><strong>Something to look for:<\/strong> it fills a stretch only when the count before it is greater than zero (and the count after it isn't negative). That works for fonts whose outer contours are all clockwise, but a contour wound the other way on its own (test <code>16-R4-reversed<\/code>) stays empty. The non-zero rule fills wherever the count isn't zero.<\/p>"}},{"id":"17","num":"17","title":"Fill a glyph: non-zero rule","difficulty":"Hard","tests":24,"problem":"problems/17-nonzero-curves.md","entry":"solutions/assignments/assignment_17_nonzero_curves.cpp","files":[{"path":"solutions/assignments/assignment_17_nonzero_curves.cpp","role":"entry","purpose":null,"job":"Read the `canvas`, `place` and `color` lines and each `outline` with its `ends` and `points` lines, where points can now be `off` (see Input). Make the canvas, fill every outline in turn with your non-zero fill, and write the picture to the output path (see Output).","blank":"// ======================================================================================\n// Assignment 17: Fill a glyph: non-zero rule\n// Problem: problems/17-nonzero-curves.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 17 as `build/solutions/assignment_17.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 17`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the `canvas`, `place` and `color` lines and each `outline` with its `ends` and\n//   `points` lines, where points can now be `off` (see Input). Make the canvas, fill every\n//   outline in turn with your non-zero fill, and write the picture to the output path (see\n//   Output).\n//\n// The other files of this assignment:\n//   It adds to src/render/NonZero.h, which you started earlier: Keep the non-zero fill\n//   function you declared in assignment 16. Your program now also passes it outlines with\n//   off-curve points, so it has to handle curves. You have nothing new to declare unless\n//   you add a helper for curves.\n//   It adds to src/render/NonZero.cpp, which you started earlier: Make the non-zero fill\n//   work for curved outlines. Every crossing on a curve needs the direction the curve runs\n//   at that row. Once you split each curve where its y turns around, each piece runs one\n//   way, and comparing its end's y with its start's y gives that direction. If your\n//   `render/Scanline` from assignment 14 already splits curves and gives every crossing\n//   its direction, your assignment 16 fill may pass as it is; otherwise add what's\n//   missing, in `render/Scanline` or here.\n//   Earlier files you can use: src/render/Scanline.h and src/utils/Geometry.h.\n//   Include them by their path under src/, e.g. #include \"render/NonZero.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 17: Fill a glyph: non-zero rule\n// Problem: problems/17-nonzero-curves.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 17 as `build/solutions/assignment_17.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 17`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   It adds to src/render/NonZero.h, which you started earlier: Keep the non-zero fill\n//   function you declared in assignment 16. Your program now also passes it outlines with\n//   off-curve points, so it has to handle curves. You have nothing new to declare unless\n//   you add a helper for curves.\n//   It adds to src/render/NonZero.cpp, which you started earlier: Make the non-zero fill\n//   work for curved outlines. Every crossing on a curve needs the direction the curve runs\n//   at that row. Once you split each curve where its y turns around, each piece runs one\n//   way, and comparing its end's y with its start's y gives that direction. If your\n//   `render/Scanline` from assignment 14 already splits curves and gives every crossing\n//   its direction, your assignment 16 fill may pass as it is; otherwise add what's\n//   missing, in `render/Scanline` or here.\n//   Earlier files you can use: src/render/Scanline.h and src/utils/Geometry.h.\n//   Include them by their path under src/, e.g. #include \"render/NonZero.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/NonZero.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<GlyphComponent> outlines;  // each one filled on its own\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // then `ends ...` and `points x y on|off ...`\n        outlines.emplace_back();\n      } else if (keyword == \"ends\" && !outlines.empty()) {\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\" && !outlines.empty()) {\n        GlyphPoint p;\n        for (std::string on; words >> p.x >> p.y >> on;) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    for (const GlyphComponent& outline : outlines) renderGlyphByNonZero(*canvas, outline, place, color);\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/render/NonZero.h","role":"adds","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it.","job":"Keep the non-zero fill function you declared in assignment 16. Your program now also passes it outlines with off-curve points, so it has to handle curves. You have nothing new to declare unless you add a helper for curves.","blank":"#pragma once\n// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your\n//   `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves,\n//   and the text renderer in assignment 18 fills every glyph with it.\n//\n// Your job:\n//   Declare one function that fills an outline on a canvas by the non-zero rule, given its\n//   placement and colour.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"16"},{"path":"solutions/src/render/NonZero.cpp","role":"adds","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it.","job":"Make the non-zero fill work for curved outlines. Every crossing on a curve needs the direction the curve runs at that row. Once you split each curve where its y turns around, each piece runs one way, and comparing its end's y with its start's y gives that direction. If your `render/Scanline` from assignment 14 already splits curves and gives every crossing its direction, your assignment 16 fill may pass as it is; otherwise add what's missing, in `render/Scanline` or here.","blank":"// ======================================================================================\n// Assignment 16: Fill a polygon: non-zero rule\n// Problem: problems/16-nonzero-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your\n//   `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves,\n//   and the text renderer in assignment 18 fills every glyph with it.\n//\n// Your job:\n//   Implement the non-zero fill with your `render/Scanline`: on every row, walk the sorted\n//   crossings left to right with a running winding count and fill each stretch where the\n//   count isn't zero. Each crossing needs the direction of its edge; if your crossings\n//   from assignment 14 don't record it yet, add it to `render/Scanline` first.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":null,"owner":"16"}],"buildsOn":[{"path":"solutions/src/render/Scanline.h","owner":"14","purpose":"It holds the steps both fill rules share: it turns an outline into edges in pixels and finds, row by row, where the line through the pixel centres crosses them. Your even-odd fill in this assignment and your non-zero fill in assignments 16 and 17 both run on it."},{"path":"solutions/src/utils/Geometry.h","owner":"10","purpose":"This header holds the project's 2D maths: a point type, lerp, and the point at t on a quadratic Bezier curve. In assignment 11 you draw curves with it. Assignments 12, 13 and 15 add functions for where segments and curves meet and for a curve's lowest point, and the fills from assignment 14 on use them."}],"indent":2,"tags":[{"label":"Language","items":["sorting","solving a quadratic equation","floating-point care"],"text":["sorting","solving a quadratic equation","floating-point care"]},{"label":"Library","items":["<code>std::vector<\/code>","<code>std::sort<\/code>","<code>std::sqrt<\/code>"],"text":["std::vector","std::sort","std::sqrt"]},{"label":"Concepts","items":["the non-zero winding rule","quadratic Bézier curves","implied on-curve points","curve direction","splitting curves at their y extremes"],"text":["the non-zero winding rule","quadratic Bézier curves","implied on-curve points","curve direction","splitting curves at their y extremes"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that fills glyph outlines, curves included, on a black canvas with the non-zero rule and saves the picture as a PNG.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Glyph point (x, y) goes to pixel position (x0 + scale·x, baseline − scale·y). y grows up in the glyph and down on the screen.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The fill colour<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline; its <code>ends<\/code> and <code>points<\/code> lines follow<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, counting from 0: contour k runs from the point after the previous end up to and including <code>e_k<\/code><\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>The outline's points; coordinates may be fractional<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There can be several outlines. Fill each one on its own, one after another, in the same colour. Compound glyphs arrive already resolved into one outline (assignment 09's job).<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) <code>width<\/code> pixels wide and <code>height<\/code> pixels high, black to begin with. Paint a pixel in the fill colour when its <strong>centre<\/strong> (px + 0.5, py + 0.5) is inside an outline by the non-zero rule. The checker forgives edges that move by one pixel; missing or extra shapes and stray lines fail.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so either of these works:<\/p>\n<ul><li><strong>A PNG.<\/strong> Your <code>FrameBufferCanvas<\/code> from assignment 06 already does this in <code>writePng<\/code>, and the boilerplate calls it. Underneath, <code>third_party/stb_image_write.h<\/code> is on your project's include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><li><strong>A binary PPM<\/strong>, if you'd rather write the bytes yourself. The header is <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>). Then come 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><\/ul>\n<h3>From points to edges<\/h3>\n<p>Every contour is a closed loop: after its last point it continues to its first. Walk the points as in assignment 14:<\/p>\n<ul><li>Two on-curve points in a row make a straight line.<\/li><li>An off-curve point is the control point of a quadratic Bézier curve from the previous on-curve point to the next one: B(t) = (1−t)²·P0 + 2(1−t)t·P1 + t²·P2 for t from 0 to 1.<\/li><li>Two off-curve points next to each other have an <strong>implied on-curve point<\/strong> halfway between them.<\/li><li>A contour can start with an off-curve point, or consist only of off-curve points.<\/li><\/ul>\n<h3>The non-zero rule with curves<\/h3>\n<p>Every edge has a direction, from a point to the next one. For each place a scanline crosses the outline, note the x and whether the outline is going down or up the screen there (+1 or −1). Sort by x, keep a running count from left to right, and fill wherever the count isn't zero.<\/p>\n<p><strong>A curve can cross one scanline twice.<\/strong> At the bottom of a <code>U<\/code>, the curve goes down then up, so its two crossings have opposite directions. Split each curve at the point where its y turns around: for y(t) = (1−t)²·y0 + 2(1−t)t·y1 + t²·y2 that is t = (y0 − y1) / (y0 − 2·y1 + y2), when the denominator isn't 0 and 0 &lt; t &lt; 1. Each piece is then <strong>monotone<\/strong>:<\/p>\n<ul><li>it goes only up or only down;<\/li><li>it crosses a scanline at most once;<\/li><li>its direction comes from comparing its end's y with its start's y.<\/li><\/ul>\n<p><strong>Finding the crossing.<\/strong> For a line, interpolate. For a curve piece, solve y(t) = scanline y, a quadratic in t: a·t² + b·t + c = 0 with a = y0 − 2·y1 + y2, b = 2·(y1 − y0) and c = y0 − scanline y (linear when a = 0). After the split, a single root lies in [0, 1]; its x is (1−t)²·x0 + 2(1−t)t·x1 + t²·x2. Bisection on t also works, since each piece is monotone.<\/p>\n<p><strong>Vertices and touching scanlines.<\/strong> Treat every piece as half-open in y: it counts at scanline y when min(y_start, y_end) ≤ y &lt; max(y_start, y_end). A scanline that touches a curve's extreme without crossing it then counts it either:<\/p>\n<ul><li>twice, with opposite directions, when the extreme is the smaller y of both pieces, or<\/li><li>not at all, when the extreme is the larger y of both.<\/li><\/ul>\n<p>Neither case changes the fill.<\/p>\n<p><strong>Clipping.<\/strong> Crossings can lie far outside the canvas, for example at large scales. Clamp x to the canvas before you convert it to an integer pixel index, because C++ doesn't define what happens when you convert a huge double to <code>int<\/code>.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Fill each pixel whose centre is inside a curved outline, and no others.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Handle implied on-curve points, and contours that start with an off-curve point or have only off-curve points.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Fill the overlap of curved contours that go the same way.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A contour going the opposite way inside another cuts a hole.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Get the count right where a scanline crosses one curve twice or touches its extreme.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Fill several outlines one after another; compound glyphs arrive as one outline.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Apply the placement and scale, and clip anything outside the canvas.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Canvases are at most about 560 x 560 pixels; outlines have at most a few hundred points.<\/li><li>Every contour has at least 2 points.<\/li><li>There are 24 tests: hand-made curved shapes for each rule, letters from JetBrains Mono Bold, characters from Noto Sans JP, and 7 random glyphs (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/render/NonZero.h","text":"#pragma once\n// Assignment 16: filling by the non-zero rule, for straight edges; assignment 17: with curves.\n\n#include \"FrameBufferCanvas.h\"\n#include \"GlyphComponent.h\"\n#include \"render/Placement.h\"\n\n// Fills every pixel whose centre is inside the outline: a point is inside when the edges a\n// ray from it crosses don't cancel out, counting +1 for an edge going down, -1 going up.\nvoid renderGlyphByNonZero(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          RGB color);\n"},{"path":"src/render/NonZero.cpp","text":"#include \"render/NonZero.h\"\n\n#include \"render/Scanline.h\"\n\nvoid renderGlyphByNonZero(FrameBufferCanvas& canvas, const GlyphComponent& outline, const Placement& place,\n                          const RGB color) {\n  // Curves need nothing extra here: edgePieces splits each one where it turns in y, so every\n  // piece runs one way, like a straight edge.\n  forEachRow(edgePieces(outline, place), canvas.height(), [&](const int row, const std::vector<Crossing>& crossings) {\n    int winding = 0;\n    for (std::size_t i = 0; i + 1 < crossings.size(); ++i) {\n      winding += crossings[i].direction;\n      if (winding != 0) fillSpan(canvas, row, crossings[i].x, crossings[i + 1].x, color);\n    }\n  });\n}\n"},{"path":"assignments/assignment_17_nonzero_curves.cpp","text":"// Assignment 17 (fill a glyph, non-zero rule): fills each outline in a test input.\n// The filling is src/render/NonZero; Scanline splits each curve where it turns.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/NonZero.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    RGB color{255, 255, 255};\n    std::vector<GlyphComponent> outlines;  // each one filled on its own\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // then `ends ...` and `points x y on|off ...`\n        outlines.emplace_back();\n      } else if (keyword == \"ends\" && !outlines.empty()) {\n        for (int e; words >> e;) outlines.back().endPtsOfContours.push_back(e);\n      } else if (keyword == \"points\" && !outlines.empty()) {\n        GlyphPoint p;\n        for (std::string on; words >> p.x >> p.y >> on;) {\n          p.onCurve = on == \"on\";\n          outlines.back().points.push_back(p);\n        }\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    for (const GlyphComponent& outline : outlines) renderGlyphByNonZero(*canvas, outline, place, color);\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/FrameBufferCanvas.h","src/GlyphComponent.h","src/render/Placement.h","src/render/Scanline.h","src/FrameBufferCanvas.cpp","src/render/Scanline.cpp","src/utils/Geometry.h"],"proof":{"passed":24,"total":24,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a> section to the end, including the two cases where a scanline crosses one curve twice. Skip the code blocks if you want to work it out yourself.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignment 16 you filled straight-line outlines with the non-zero rule. Real glyphs have curves, and a curve can cross one scanline twice, going up at one crossing and down at the other. In this assignment you extend your <code>render/NonZero<\/code> from assignment 16 to curves, using the curve splitting in your <code>render/Scanline<\/code> from assignment 14. The text renderer in assignment 18 fills every glyph with this fill.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Nonzero-rule\" target=\"_blank\" rel=\"noopener\">Nonzero-rule<\/a><\/li><li>Pomax, <a href=\"https://pomax.github.io/bezierinfo/\" target=\"_blank\" rel=\"noopener\">A Primer on Bézier Curves<\/a>: extremities and splitting curves<\/li><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 17                         run every test\n.\\check 17 -Case 17-R5-U           one test: its input, and where the expected and your pictures are\n.\\check 17 -Fresh                  new random glyphs (new seed)\n.\\check 17 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Combine your work from assignment 14 (<code>render/Scanline<\/code>: curves into edges, crossings per row) and assignment 16 (<code>render/NonZero<\/code>: counting with directions). The new part is giving each curve crossing the right direction.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Turn each contour into lines and curves in pixel coordinates. Split every curve at its y turning point so each piece is monotone in y. After that, every piece, line or curve, crosses a row at most once, with a direction you can read from its endpoints. Then fill as in assignment 16.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>After splitting, solve the piece's quadratic for the scanline y and keep the root in [0, 1]; if the quadratic coefficient is 0, the equation is linear.<\/li><li>The direction of a curve piece is its end's y compared with its start's y, not the control point.<\/li><li>Insert implied midpoints and handle contours that start off-curve, as in assignment 14.<\/li><li>Fill where the count is not zero, of either sign.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>pieces = []\nfor each contour (pixel coordinates, implied points inserted, starting on-curve):\n    on-&gt;on:      pieces.append(line(a, b))\n    on-&gt;off-&gt;on: split curve(a, c, b) at t = (a.y - c.y) / (a.y - 2c.y + b.y) if 0 &lt; t &lt; 1\n                 pieces.extend(the one or two monotone curves)\n\nfor row in 0 .. height-1:\n    y = row + 0.5\n    crossings = []\n    for p in pieces:\n        if min(p.start.y, p.end.y) &lt;= y &lt; max(p.start.y, p.end.y):\n            x = crossing x (line: interpolate; curve: solve for t in [0, 1], then B(t).x)\n            crossings.append((x, +1 if p.end.y &gt; p.start.y else -1))\n    sort by x; walk with a running count; fill where count != 0<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a contour with no on-curve points","test":"17-R2-all-off","input":"canvas 133 133\nplace 6 126 1\ncolor 255 255 255\noutline\nends 7\npoints 119.53 60 off 102.1 17.9 off 60 0.47 off 17.9 17.9 off 0.47 60 off 17.9 102.1 off\n       60 119.53 off 102.1 102.1 off","output":null,"image":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIUAAACFCAIAAAD6uKxrAAAD0ElEQVR4XmMYBaMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgIoIcA4tMLj////JDmYkXGIeXCwO5fUCMAfW4M/egZpfFA3GjAjadBGzOCKD1pHw+CPmEERH/SPhkEbMQMcH4MhJpDjZsDLsQGLj8EWE4MkVgYgPgZzTAx4rNA1PoZKTAxgrNAvPoZiZEAihp6VCj3iY+jGBP0zCs3jY3hEBt0yCm3jYzhFBn2ihIbxMfwigw5RQqv4GK6RQesooX58DO+YoHUNT+X4GDmRQaOMwsQwCgZTCFAzf4y0zEGLLEK1+BiZkUH1KKFOfIzkyKBulFAhPkYjg4pRQml8jEYGdVvAo+2rwdW+pCh/jGYOzMikcHCe/PgYjQxcOYuSKBktr4ZFeTWaOfBHI9lZZDR/DP38MZo5iIlD8rLIaP4Y4vljNHMQH4FkZJHR/DGU88do5iA19kjNIqP5Y3Dlj9H4GLLl1WhhRV7UkVRkjeaP0fKKYRTgDAFix3dHCytKEhHxRdZoeTVaXo0WVwyUlVejhRXlSYjIImu0vBotr0bLK9whMJo/RvPHaP6gpD4frcyplX6IqdJHy6vR8mq0vBqtz4dKGhgtr0bLq9HyarS8Gi2vRnMBOSEwWn+M1h+jOWe0/hitP0ZzwWj9MfTTwGh9Plqfj5Zko/X5UEkDRK2/Gp0CoTw6R9czDMlicbQ+H63PR+vz0fp8WNXnQM+MVumUxOjoeuqhWiaO1ueDK+ZION9ntMgiL+pG96sN4QbcaHk1ZMur0VYWGVE3eh7A0O5tjpZXQ7m8Gi2ySIq90fN9GIY6IOd80dGOCDGxPno+HMMwAGSevzuaRfDHPSO59+CPtq+GePsK7vzRLIIrJsnOHEADR/PHcMkfo30RrDFJSeYAGjh6/wc18weFkTFaXg26FvLofUVUixLKMwcVyiuIb0bbWlSJDKrFB9CgkRwl1IoMasbHiI0SKkYGleNjBEYJdSNjtH01HNtXaH4aORUJ1TMH9csreNwM71ihRUxAgo6Rdjl2uEYJ7SKDhvkDEs3DL0poGhk0j49h1uKidWTQIz6GTZTQITLoFB9DveyiT0zQvD7HbCkMxeqEnpFB1/wx5JrCdI6JAcgfyDlmMOeVAYmJAY6PwVmpDGBMDIr4GDyxMuAxMYjiYwCrlkESDfAQoOF4CQMFgNa1y2CLhsEeHzTKMYM2GoZMfKDlMVLzzeCPAIZRMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAkMnBAAzs72etDuMNwAAAABJRU5ErkJggg==","alt":"expect e. It scans only the rows inside the glyph's bounding box, and fills each component of a compound glyph on its own.<\/p>\n<p><strong>Something to look for:<\/strong> like the line-only version, it fills only where the count is positive, so a contour wound the other way on its own would stay empty (assignment 16, test <code>16-R4-reversed<\/code>).<\/p>"}},{"id":"18","num":"18","title":"Render a line of text","difficulty":"Hard","tests":18,"problem":"problems/18-render-text.md","entry":"solutions/assignments/assignment_18_render_text.cpp","files":[{"path":"solutions/assignments/assignment_18_render_text.cpp","role":"entry","purpose":null,"job":"Read the input line by line (see Input): load the font on `font`, make the canvas on `canvas`, keep the pen and colour from `pen` and `color`, and draw each `text` line (the rest of the line after `text` and its space) with your `TextRenderer`, carrying the returned pen x on to the next `text` line. Then write the picture to the output path (see Output).","blank":"// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 18 as `build/solutions/assignment_18.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 18`, or use Run and Submit in the book.\n//\n// Your job:\n//   Read the input line by line (see Input): load the font on `font`, make the canvas on\n//   `canvas`, keep the pen and colour from `pen` and `color`, and draw each `text` line\n//   (the rest of the line after `text` and its space) with your `TextRenderer`, carrying\n//   the returned pen x on to the next `text` line. Then write the picture to the output\n//   path (see Output).\n//\n// The other files of this assignment:\n//   You also write src/utils/Unicode.h, src/TextRenderer.h, src/TextRenderer.cpp and\n//   src/main.cpp in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/font/FontParser.h, src/font/Cmap.h, src/font/Loca.h,\n//   src/font/Metrics.h, src/font/CompoundGlyph.h and src/render/NonZero.h.\n//   Include them by their path under src/, e.g. #include \"utils/Unicode.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 18 as `build/solutions/assignment_18.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 18`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/utils/Unicode.h, src/TextRenderer.h, src/TextRenderer.cpp and\n//   src/main.cpp in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/font/FontParser.h, src/font/Cmap.h, src/font/Loca.h,\n//   src/font/Metrics.h, src/font/CompoundGlyph.h and src/render/NonZero.h.\n//   Include them by their path under src/, e.g. #include \"utils/Unicode.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"TextRenderer.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<TextRenderer> font;\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    double penX = 0, baseline = 0, scale = 1;\n    RGB color{255, 255, 255};\n    for (std::string line; std::getline(input, line);) {\n      if (!line.empty() && line.back() == '\\r') line.pop_back();\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {  // font <path>\n        std::string path;\n        words >> path;\n        font = std::make_unique<TextRenderer>(path);\n      } else if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"pen\") {  // pen <x> <baseline> <scale>\n        words >> penX >> baseline >> scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"text\") {  // text <the rest of the line, UTF-8>\n        if (!font || !canvas) throw std::runtime_error(\"`text` needs a `font` and a `canvas` line first\");\n        penX = font->drawText(*canvas, line.size() > 5 ? line.substr(5) : \"\", penX, baseline, scale, color);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/utils/Unicode.h","role":"new","purpose":"It turns UTF-8 text into Unicode code points, the numbers a font's cmap maps to glyphs. Your `TextRenderer` decodes every line of text with it.","job":"Write a function that decodes a string of UTF-8 bytes into a list of code points, for characters of 1 to 4 bytes (Output, step 1, lists the byte patterns). It is short enough to write in the header itself.","blank":"#pragma once\n// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   It turns UTF-8 text into Unicode code points, the numbers a font's cmap maps to\n//   glyphs. Your `TextRenderer` decodes every line of text with it.\n//\n// Your job:\n//   Write a function that decodes a string of UTF-8 bytes into a list of code points, for\n//   characters of 1 to 4 bytes (Output, step 1, lists the byte patterns). It is short\n//   enough to write in the header itself.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ========================================================= anvas from a pen x, baseline, scale and colour and returns the pen x after the last character, plus, for `main.cpp`, a way to measure a string's width and to read the font's ascent and descent.","blank":"#pragma once\n// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This class holds the whole pipeline. It loads a font's tables once, then maps each\n//   character of a line of text to its glyph, fills the glyph by the non-zero rule and\n//   moves the pen on by its advance. The checker's program and `main.cpp` both draw\n//   through it.\n//\n// Your job:\n//   Declare a class that loads a font from a path once and keeps what drawing needs: the\n//   map from code point to glyph, where each glyph's record is, and the advance widths.\n//   Give it a function that draws a UTF-8 string on a canvas from a pen x, baseline, scale\n//   and colour and returns the pen x after the last character, plus, for `main.cpp`, a way\n//   to measure a string's width and to read the font's ascent and descent.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This class holds the whole pipeline. It loads a font's tables once, then maps each\n//   character of a line of text to its glyph, fills the glyph by the non-zero rule and\n//   moves the pen on by its advance. The checker's program and `main.cpp` both draw\n//   through it.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n#include <map>\n#include <string>\n#include <unordered_map>\n\n#include \"FrameBufferCanvas.h\"\n#include \"font/FontParser.h\"\n#include \"font/Loca.h\"\n#include \"font/Metrics.h\"\n\nclass TextRenderer {\n public:\n  explicit TextRenderer(const std::string& fontPath);\n\n  // Draws UTF-8 text from x = penX with its baseline at y = baseline, `scale` pixels per\n  // font unit, each glyph filled by the non-zero rule. Returns the pen position after it.\n  double drawText(FrameBufferCanvas& canvas, const std::string& text, double penX, double baseline,\n                  double scale, RGB color);\n\n  // How far drawText would move the pen, in pixels.\n  [[nodiscard]] double measureText(const std::string& text, double scale) const;\n\n  [[nodiscard]] const HorizontalMetrics& metrics() const { return metrics_; }\n\n private:\n  [[nodiscard]] uint32_t glyphFor(uint32_t codePoint) const;  // 0, the \"missing\" glyph, if none\n  [[nodiscard]] double advance(uint32_t glyphId) const;\n\n  FontParser parser_;\n  std::unordered_map<uint32_t, uint32_t> glyphCodes_;\n  std::map<uint32_t, GlyphLocation> locations_;\n  HorizontalMetrics metrics_;\n};\n"},{"path":"solutions/src/TextRenderer.cpp","role":"new","purpose":"This class holds the whole pipeline. It loads a font's tables once, then maps each character of a line of text to its glyph, fills the glyph by the non-zero rule and moves the pen on by its advance. The checker's program and `main.cpp` both draw through it.","job":"Implement the class by calling your earlier work: load the cmap (assignment 03), the glyph locations (04) and the advance widths (05) once, when you open the font. To draw, decode the text, then for each code point find its glyph (glyph 0 if the font has none), fill each of its outlines from your `font/CompoundGlyph` with your non-zero fill, and move the pen by its advance times the scale.","blank":"// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This class holds the whole pipeline. It loads a font's tables once, then maps each\n//   character of a line of text to its glyph, fills the glyph by the non-zero rule and\n//   moves the pen on by its advance. The checker's program and `main.cpp` both draw\n//   through it.\n//\n// Your job:\n//   Implement the class by calling your earlier work: load the cmap (assignment 03), the\n//   glyph locations (04) and the advance widths (05) once, when you open the font. To\n//   draw, decode the text, then for each code point find its glyph (glyph 0 if the font\n//   has none), fill each of its outlines from your `font/CompoundGlyph` with your non-zero\n//   fill, and move the pen by its advance times the scale.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This class holds the whole pipeline. It loads a font's tables once, then maps each\n//   character of a line of text to its glyph, fills the glyph by the non-zero rule and\n//   moves the pen on by its advance. The checker's program and `main.cpp` both draw\n//   through it.\n//\n// Your job:\n//   Implement the class by calling your earlier work: load the cmap (assignment 03), the\n//   glyph locations (04) and the advance widths (05) once, when you open the font. To\n//   draw, decode the text, then for each code point find its glyph (glyph 0 if the font\n//   has none), fill each of its outlines from your `font/CompoundGlyph` with your non-zero\n//   fill, and move the pen by its advance times the scale. The Boilerplate gives you the\n//   declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"TextRenderer.h\"\n\n#include <stdexcept>\n\n#include \"font/Cmap.h\"\n#include \"font/CompoundGlyph.h\"\n#include \"render/NonZero.h\"\n#include \"utils/Unicode.h\"\n\nTextRenderer::TextRenderer(const std::string& fontPath) : parser_(fontPath) {\n  // TODO: load the cmap (03), the glyph locations (04) and the metrics (05) once, here.\n  throw std::logic_error(\"not implemented: TextRenderer::TextRenderer\");\n}\n\ndouble TextRenderer::drawText(FrameBufferCanvas& canvas, const std::string& text, double penX,\n                              const double baseline, const double scale, const RGB color) {\n  // TODO: for each code point: its glyph, resolved into simple parts (09), each filled by the\n  // non-zero rule (17), then the pen moved by the glyph's advance (see the problem page).\n  throw std::logic_error(\"not implemented: TextRenderer::drawText\");\n}\n\ndouble TextRenderer::measureText(const std::string& text, const double scale) const {\n  // TODO: the sum of the advances, in pixels.\n  throw std::logic_error(\"not implemented: TextRenderer::measureText\");\n}\n\nuint32_t TextRenderer::glyphFor(const uint32_t codePoint) const {\n  // TODO: the cmap's glyph, or 0 when the font has none.\n  throw std::logic_error(\"not implemented: TextRenderer::glyphFor\");\n}\n\ndouble TextRenderer::advance(const uint32_t glyphId) const {\n  // TODO: the glyph's advance width, in font units.\n  throw std::logic_error(\"not implemented: TextRenderer::advance\");\n}\n"},{"path":"solutions/src/main.cpp","role":"new","purpose":"This is the finished command-line program. `tiny_ttf <font.ttf> \"<text>\" <out.png>` draws a line of text with a TrueType font into a PNG sized to fit it, using your `TextRenderer`. An optional fourth argument sets the text height in pixels (64 by default).","job":"Write the command-line program: take the font path, the text and the output path (and an optional pixel height) from the command line, size a canvas to fit the text, draw it in white with your `TextRenderer` and save the PNG. The checker doesn't run it, and the Boilerplate already contains it; build the `tiny_ttf` target and try it on your own text.","blank":"// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This is the finished command-line program. `tiny_ttf <font.ttf> \"<text>\" <out.png>`\n//   draws a line of text with a TrueType font into a PNG sized to fit it, using your\n//   `TextRenderer`. An optional fourth argument sets the text height in pixels (64 by\n//   default).\n//\n// Your job:\n//   Write the command-line program: take the font path, the text and the output path (and\n//   an optional pixel height) from the command line, size a canvas to fit the text, draw\n//   it in white with your `TextRenderer` and save the PNG. The checker doesn't run it, and\n//   the Boilerplate already contains it; build the `tiny_ttf` target and try it on your\n//   own text.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 18: Render a line of text\n// Problem: problems/18-render-text.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This is the finished command-line program. `tiny_ttf <font.ttf> \"<text>\" <out.png>`\n//   draws a line of text with a TrueType font into a PNG sized to fit it, using your\n//   `TextRenderer`. An optional fourth argument sets the text height in pixels (64 by\n//   default).\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n// tiny_ttf: draws a line of text with a TrueType font and saves it as a PNG.\n//\n//   tiny_ttf <font.ttf> \"<text>\" <out.png> [pixel-height]\n//\n// The picture fits the text, with white glyphs on black; pixel-height (default 64) is the\n// distance from the font's ascent to its descent.\n\n#include <cmath>\n#include <exception>\n#include <iostream>\n#include <string>\n\n#include \"TextRenderer.h\"\n\nint main(int argc, char** argv) {\n  if (argc < 4 || argc > 5) {\n    std::cerr << \"usage: \" << argv[0] << \" <font.ttf> \\\"<text>\\\" <out.png> [pixel-height]\\n\";\n    return 2;\n  }\n  try {\n    const std::string fontPath = argv[1], text = argv[2], outPath = argv[3];\n    const double pixelHeight = argc == 5 ? std::stod(argv[4]) : 64.0;\n\n    TextRenderer renderer(fontPath);\n    const HorizontalMetrics& m = renderer.metrics();\n    const double scale = pixelHeight / (m.ascent - m.descent);\n    const int margin = static_cast<int>(std::lround(pixelHeight / 4));\n    const int width = static_cast<int>(std::ceil(renderer.measureText(text, scale))) + 2 * margin;\n    const int height = static_cast<int>(std::ceil(pixelHeight)) + 2 * margin;\n\n    FrameBufferCanvas canvas(width, height);\n    renderer.drawText(canvas, text, margin, margin + m.ascent * scale, scale, RGB{255, 255, 255});\n    canvas.writePng(outPath);\n    std::cout << \"wrote \" << outPath << \" (\" << width << \" x \" << height << \")\\n\";\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"buildsOn":[{"path":"solutions/src/font/FontParser.h","owner":"02","purpose":"This header declares the code that opens a font and reads its table directory: the tag, checksum, offset and length of each table (`cmap`, `glyf`, `loca`, ...). Assignments 03 to 05 find their tables by tag in these records, and assignment 18 opens the font through it."},{"path":"solutions/src/font/Cmap.h","owner":"03","purpose":"This header declares your reader for the `cmap` table, the font's map from each character to the glyph that draws it. It reads the format 12 subtable, which covers the full Unicode range, and assignment 18 looks up every character of a line of text in the result."},{"path":"solutions/src/font/Loca.h","owner":"04","purpose":"This header declares your reader for the `loca` table, which gives the position and size in bytes of each glyph's record, by glyph id. Assignment 09 uses it to find the parts of a compound glyph, and assignment 18 to find the glyph of every character."},{"path":"solutions/src/font/Metrics.h","owner":"05","purpose":"This header declares your reader for the `hhea` and `hmtx` tables: the font's ascent and descent, and each glyph's advance width and left side bearing. Assignment 18 moves the pen by each glyph's advance width and sizes the text from the ascent and descent."},{"path":"solutions/src/font/CompoundGlyph.h","owner":"09","purpose":"This code turns any glyph into the simple outlines you draw it with. It reads a compound glyph's components, moves, scales or rotates each one, and resolves components nested at any depth. In assignment 18 you draw every character of a line of text through it, so your text renderer doesn't need to tell simple glyphs from compound ones."},{"path":"solutions/src/render/NonZero.h","owner":"16","purpose":"It fills a glyph by the non-zero rule, the rule TrueType uses, on top of your `render/Scanline`. This assignment handles straight edges, assignment 17 adds curves, and the text renderer in assignment 18 fills every glyph with it."}],"indent":2,"tags":[{"label":"Language","items":["UTF-8 decoding","organising a larger program","reusing your own code"],"text":["UTF-8 decoding","organising a larger program","reusing your own code"]},{"label":"Library","items":["<code>std::ifstream<\/code> (binary)","<code>std::unordered_map<\/code>","<code>std::vector<\/code>"],"text":["std::ifstream (binary)","std::unordered_map","std::vector"]},{"label":"Concepts","items":["the whole pipeline: table directory, cmap, loca, hmtx, simple and compound glyphs, non-zero filling, advance widths"],"text":["the whole pipeline: table directory, cmap, loca, hmtx, simple and compound glyphs, non-zero filling, advance widths"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that draws lines of text with a TrueType font and saves the picture as a PNG.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs <code>&lt;program&gt; &lt;input-file&gt; &lt;output-png&gt;<\/code> from the workbook folder.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The TrueType font to use (relative to the workbook folder)<\/td><\/tr><tr><td><code>canvas &lt;width&gt; &lt;height&gt;<\/code><\/td><td>The picture size in pixels; it starts black<\/td><\/tr><tr><td><code>pen &lt;x&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Where the next text starts: the first glyph's origin is at pixel position (x, baseline). <code>scale<\/code> is pixels per font unit.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>The colour of the next text<\/td><\/tr><tr><td><code>text &lt;...&gt;<\/code><\/td><td>Text to draw, in UTF-8, from after the space following <code>text<\/code> to the end of the line (spaces included)<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code>pen<\/code>, <code>color<\/code> and <code>text<\/code> can repeat.<\/li><li>A <code>text<\/code> line starts where the pen is: at the most recent <code>pen<\/code> line, moved right by any text drawn since. (The boilerplate passes the pen x on from one <code>text<\/code> line to the next.)<\/li><li>Draw later text on top of earlier text.<\/li><\/ul>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) <code>width<\/code> pixels wide and <code>height<\/code> pixels high. For each character, in order:<\/p>\n<ol><li><strong>Decode UTF-8<\/strong> into Unicode code points. A code point takes 1 to 4 bytes: <code>0xxxxxxx<\/code>, <code>110xxxxx 10xxxxxx<\/code>, <code>1110xxxx 10xxxxxx 10xxxxxx<\/code> or <code>11110xxx 10xxxxxx 10xxxxxx 10xxxxxx<\/code>.<\/li><li><strong>Find the glyph<\/strong> with the font's cmap: the format 12 subtable with platform 0, encoding 4 (your <code>font/Cmap<\/code> from assignment 03). A code point the font doesn't map uses <strong>glyph 0<\/strong> (<code>.notdef<\/code>, which most fonts draw as a box).<\/li><li><strong>Get its outline<\/strong> (assignments 04, 07 and 09): find the glyph's record with <code>loca<\/code>. A simple glyph gives one outline. A compound glyph gives the outlines of its components placed with their full transforms (offsets, scales, 2 x 2 matrices, nested compound glyphs: assignment 09's rules, your <code>font/CompoundGlyph<\/code>). An empty glyph (such as space) gives nothing. Fill every component outline; filling them one by one or merged gives the same picture for these fonts. Noto Sans JP is a variable font: use the outlines stored in <code>glyf<\/code> and ignore its variation tables.<\/li><li><strong>Fill it<\/strong> with the non-zero rule (your <code>render/NonZero<\/code> from assignment 17), placed with glyph point (x, y) at pixel position (penX + scale·x, baseline − scale·y). Paint a pixel when its centre is inside.<\/li><li><strong>Move the pen<\/strong>: penX += advanceWidth × scale, using the glyph's advance width from <code>hmtx<\/code> (your <code>font/Metrics<\/code> from assignment 05; glyphs past numberOfHMetrics use the last advance). Don't round the pen position: keep it fractional.<\/li><\/ol>\n<p>The checker forgives edges that move by one pixel. Missing glyphs, glyphs in the wrong place or colour, and holes in the wrong places fail.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so either of these works:<\/p>\n<ul><li><strong>A PNG.<\/strong> Your <code>FrameBufferCanvas<\/code> from assignment 06 already does this in <code>writePng<\/code>, and the boilerplate calls it. Underneath, <code>third_party/stb_image_write.h<\/code> is on your project's include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><li><strong>A binary PPM<\/strong>, if you'd rather write the bytes yourself. The header is <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>). Then come 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes.<\/li><\/ul>\n<h3>The pieces and the assignments that cover them<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Step<\/th><th>Assignment<\/th><th>Key facts<\/th><\/tr><\/thead><tbody><tr><td>Table directory<\/td><td>02<\/td><td>numTables: uint16 at byte 4; 16-byte records from byte 12: tag, checkSum, offset, length<\/td><\/tr><tr><td>cmap<\/td><td>03<\/td><td>encoding records (platform, encoding, offset from cmap) after a 4-byte header; format 12 groups: start, end, startGlyphID (uint32 each)<\/td><\/tr><tr><td>loca<\/td><td>04<\/td><td>numGlyphs: uint16 at <code>maxp<\/code> + 4; <code>head<\/code> + 50: 0 = short (uint16 × 2), 1 = long (uint32); numGlyphs + 1 entries, offsets from the start of <code>glyf<\/code><\/td><\/tr><tr><td>Advance widths<\/td><td>05<\/td><td>numberOfHMetrics: uint16 at <code>hhea<\/code> + 34; <code>hmtx<\/code>: (uint16 advance, int16 lsb) per glyph, later glyphs reuse the last advance<\/td><\/tr><tr><td>Simple glyphs<\/td><td>07<\/td><td>header, contour ends, instructions, flags with REPEAT, delta-coded x then y<\/td><\/tr><tr><td>Compound glyphs<\/td><td>09<\/td><td>component records: flags, glyph index, arguments, optional scale / x-y scale / 2 × 2<\/td><\/tr><tr><td>Filling<\/td><td>17<\/td><td>non-zero rule, curves split at their y turning point, pixel centres<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Load the font once and reuse it for every <code>text<\/code> line. (The boilerplate makes one <code>TextRenderer<\/code> per <code>font<\/code> line and calls its <code>drawText<\/code> once per <code>text<\/code> line.)<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Decode UTF-8 into code points, including 2-, 3- and 4-byte characters.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Map characters to glyphs with cmap; a character the font doesn't have draws glyph 0.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Each glyph moves the pen right by its advance width times the scale.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Draw compound glyphs with their components in place.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Fill glyphs with the non-zero rule, curves and overlapping strokes included.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Handle several pen positions, colours and text lines, and draw later text on top.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Apply the scale, and clip text that runs off the canvas.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Both fonts in the tests have a platform 0 / encoding 4 format 12 cmap subtable. Canvases are at most 600 pixels wide.<\/li><li>The text contains no control characters, and no character needs more than one glyph.<\/li><li>There are 18 tests: one or more per requirement with JetBrains Mono Bold and Noto Sans JP, plus phrases and random words (new ones with <code>-Fresh<\/code>). Each case has 10 seconds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/utils/Unicode.h","text":"#pragma once\n// Assignment 18: text arrives as UTF-8 bytes; the font is looked up by code point.\n\n#include <cstdint>\n#include <string>\n#include <vector>\n\n// UTF-8 bytes to code points. A malformed byte becomes U+FFFD, the replacement character.\ninline std::vector<uint32_t> utf8ToCodepoints(const std::string& text) {\n  std::vector<uint32_t> out;\n  std::size_t i = 0;\n  while (i < text.size()) {\n    const auto b = static_cast<unsigned char>(text[i]);\n    int extra = -1;  // continuation bytes after this one\n    uint32_t cp = 0;\n    if (b < 0x80) extra = 0, cp = b;\n    else if ((b >> 5) == 0x6) extra = 1, cp = b & 0x1F;\n    else if ((b >> 4) == 0xE) extra = 2, cp = b & 0x0F;\n    else if ((b >> 3) == 0x1E) extra = 3, cp = b & 0x07;\n    bool ok = extra >= 0 && i + extra < text.size();\n    for (int k = 1; ok && k <= extra; ++k) {\n      const auto next = static_cast<unsigned char>(text[i + k]);\n      ok = (next >> 6) == 0x2;\n      cp = (cp << 6) | (next & 0x3F);\n    }\n    if (!ok) {\n      out.push_back(0xFFFD);\n      ++i;\n      continue;\n    }\n    out.push_back(cp);\n    i += 1 + extra;\n  }\n  return out;\n}\n"},{"path":"src/TextRenderer.h","text":"#pragma once\n// Assignment 18: a font ready to draw lines of text, built from the earlier steps.\n\n#include <cstdint>\n#include <map>\n#include <string>\n#include <unordered_map>\n\n#include \"FrameBufferCanvas.h\"\n#include \"font/FontParser.h\"\n#include \"font/Loca.h\"\n#include \"font/Metrics.h\"\n\nclass TextRenderer {\n public:\n  explicit TextRenderer(const std::string& fontPath);\n\n  // Draws UTF-8 text from x = penX with its baseline at y = baseline, `scale` pixels per\n  // font unit, each glyph filled by the non-zero rule. Returns the pen position after it.\n  double drawText(FrameBufferCanvas& canvas, const std::string& text, double penX, double baseline,\n                  double scale, RGB color);\n\n  // How far drawText would move the pen, in pixels.\n  [[nodiscard]] double measureText(const std::string& text, double scale) const;\n\n  [[nodiscard]] const HorizontalMetrics& metrics() const { return metrics_; }\n\n private:\n  [[nodiscard]] uint32_t glyphFor(uint32_t codePoint) const;  // 0, the \"missing\" glyph, if none\n  [[nodiscard]] double advance(uint32_t glyphId) const;\n\n  FontParser parser_;\n  std::unordered_map<uint32_t, uint32_t> glyphCodes_;\n  std::map<uint32_t, GlyphLocation> locations_;\n  HorizontalMetrics metrics_;\n};\n"},{"path":"src/TextRenderer.cpp","text":"#include \"TextRenderer.h\"\n\n#include \"font/Cmap.h\"\n#include \"font/CompoundGlyph.h\"\n#include \"render/NonZero.h\"\n#include \"utils/Unicode.h\"\n\nTextRenderer::TextRenderer(const std::string& fontPath)\n    : parser_(fontPath),\n      glyphCodes_(loadUnicodeToGlyphCodeMap(parser_.reader(), parser_.tables())),\n      metrics_(loadHorizontalMetrics(parser_.reader(), parser_.tables())) {\n  const GlyphLocations loca = loadGlyphLocations(parser_.reader(), parser_.tables());\n  for (uint32_t id = 0; id < loca.glyphs.size(); ++id) locations_[id] = loca.glyphs[id];\n}\n\ndouble TextRenderer::drawText(FrameBufferCanvas& canvas, const std::string& text, double penX,\n                              const double baseline, const double scale, const RGB color) {\n  for (const uint32_t cp : utf8ToCodepoints(text)) {\n    const uint32_t id = glyphFor(cp);\n    // A compound glyph's parts are filled one by one.\n    for (const GlyphComponent& part : resolveGlyph(parser_.reader(), locations_, id))\n      renderGlyphByNonZero(canvas, part, Placement{penX, baseline, scale}, color);\n    penX += advance(id) * scale;\n  }\n  return penX;\n}\n\ndouble TextRenderer::measureText(const std::string& text, const double scale) const {\n  double width = 0;\n  for (const uint32_t cp : utf8ToCodepoints(text)) width += advance(glyphFor(cp)) * scale;\n  return width;\n}\n\nuint32_t TextRenderer::glyphFor(const uint32_t codePoint) const {\n  const auto it = glyphCodes_.find(codePoint);\n  return it == glyphCodes_.end() ? 0 : it->second;\n}\n\ndouble TextRenderer::advance(const uint32_t glyphId) const {\n  return glyphId < metrics_.glyphs.size() ? metrics_.glyphs[glyphId].advanceWidth : 0;\n}\n"},{"path":"assignments/assignment_18_render_text.cpp","text":"// Assignment 18 (render a line of text): draws the text lines of a test input.\n// The drawing is src/TextRenderer, which puts every earlier step together; src/main.cpp is\n// the same thing as a command-line program.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"TextRenderer.h\"\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<TextRenderer> font;\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    double penX = 0, baseline = 0, scale = 1;\n    RGB color{255, 255, 255};\n    for (std::string line; std::getline(input, line);) {\n      if (!line.empty() && line.back() == '\\r') line.pop_back();\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {  // font <path>\n        std::string path;\n        words >> path;\n        font = std::make_unique<TextRenderer>(path);\n      } else if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"pen\") {  // pen <x> <baseline> <scale>\n        words >> penX >> baseline >> scale;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"text\") {  // text <the rest of the line, UTF-8>\n        if (!font || !canvas) throw std::runtime_error(\"`text` needs a `font` and a `canvas` line first\");\n        penX = font->drawText(*canvas, line.size() > 5 ? line.substr(5) : \"\", penX, baseline, scale, color);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/FrameBufferCanvas.h","src/font/FontParser.h","src/font/Loca.h","src/font/Metrics.h","src/font/Cmap.h","src/font/CompoundGlyph.h","src/render/NonZero.h","src/FrameBufferCanvas.cpp","src/font/FontParser.cpp","src/font/ByteReader.h","src/font/Loca.cpp","src/font/Metrics.cpp","src/font/Cmap.cpp","src/font/CompoundGlyph.cpp","src/GlyphComponent.h","src/render/NonZero.cpp","src/render/Placement.h","src/font/ByteReader.cpp","src/font/GlyphParser.h","src/render/Scanline.h","src/font/GlyphParser.cpp","src/Glyph.h","src/render/Scanline.cpp","src/utils/Geometry.h"],"proof":{"passed":18,"total":18,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. In this assignment you reach the blog's goal: a program that loads a Unicode font, draws any string with it and saves the result as a PNG. Skim the <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Goal\" target=\"_blank\" rel=\"noopener\">Goal<\/a> section and the final pictures in the <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Non-zero%20Rule\" target=\"_blank\" rel=\"noopener\">Non-zero Rule<\/a> section.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignments 01 to 17 you built the pieces one at a time. Here you put them together, going from the bytes of a font file and a string of text to a picture of that text. This is the last part of your project: <code>TextRenderer<\/code> uses the files of assignments 02 to 17, and <code>main.cpp<\/code> turns the project into a program you can run, <code>tiny_ttf &lt;font.ttf&gt; &quot;&lt;text&gt;&quot; &lt;out.png&gt;<\/code>.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/UTF-8\" target=\"_blank\" rel=\"noopener\">UTF-8<\/a>: the byte patterns<\/li><li>Apple, <em>TrueType Reference Manual<\/em>: <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6cmap.html\" target=\"_blank\" rel=\"noopener\">'cmap'<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6loca.html\" target=\"_blank\" rel=\"noopener\">'loca'<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6hmtx.html\" target=\"_blank\" rel=\"noopener\">'hmtx'<\/a>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6glyf.html\" target=\"_blank\" rel=\"noopener\">'glyf'<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Goal\" target=\"_blank\" rel=\"noopener\">Goal<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 18                         run every test\n.\\check 18 -Case 18-E2E-hello      one test: its input, and where the expected and your pictures are\n.\\check 18 -Fresh                  new random words (new seed)\n.\\check 18 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Make a small font class that loads these once: the table directory, the cmap mapping, the <code>loca<\/code> offsets and lengths, and the advance widths. Then drawing a string is a loop over code points.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Call the project files you already have: assignments 02 to 05 (tables), 07 and 09 (glyph outlines) and 17 (filling). Each one already hands the next step the data it needs. Decode the UTF-8 into code points first, then for each one find the glyph id, get its outlines, fill them and move the pen by the advance.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A character the font doesn't map draws glyph 0, not nothing.<\/li><li>Keep the pen x as a double. Rounding it each step drifts by up to half a pixel per character.<\/li><li>The space character has no outline but does have an advance width.<\/li><li>Fill every outline of a compound glyph.<\/li><li>Text runs off the canvas in one test: skip pixels outside it.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>font = load(path)          # directory, cmap (0/4 format 12), loca, hmtx\nfor cp in utf8_decode(text):\n    gid = font.cmap.get(cp, 0)\n    for outline in font.outlines(gid):          # simple: 1, compound: its components\n        fill_nonzero(canvas, outline, place=(penX, baseline, scale), color)\n    penX += font.advance(gid) * scale\nreturn penX<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"Hello, World!","test":"18-E2E-hello","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\ncanvas 562 113\npen 8 80 0.07\ncolor 255 255 255\ntext Hello, World!","output":null,"image":{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjIAAABxCAIAAABA/d7lAAAKZklEQVR4XmMYBaMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCoyEwGgKjITAaAqMhMBoCgz0EGIl04P///3GpZGSkqyF0C1E8XibGDcQHC1bTBtb20Yw7ICGANdLxJCRciYRULRSm1eGRWoZTjqNKcU1GuUSthMQ0WgCNhsBoCIyGwGgIjIbA4AmB0WppNDWOhsBoCIyGwGgIMIxWS6OJYDQERkOAqBCgcHAJ2Q4qGjUaeaMhQLsQGO0tjaau0RAYDYHREBgNgUEUAqPV0mhyHA2BwRIC1JoxJqlXNLreYTQDDLYQGK2WRtPkaAiMhsBoCIyGwGhvaTQNjIbAaAhQFgKjE0WjKWi4hgDLaNTiCgEiBzdoVDoMrO2j
