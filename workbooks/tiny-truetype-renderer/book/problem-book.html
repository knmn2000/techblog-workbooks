ins Mono or Noto Sans JP, which store a full record for every glyph. But many fonts, including those compiled by fontTools, drop the trailing records when the last glyphs share an advance width, and a monospaced font can end up with <code>numberOfHMetrics<\/code> = 1. The spec's rule (last advance, own lsb) is what R3 tests.<\/p>"}},{"id":"06","num":"6","title":"Draw on a framebuffer","difficulty":"Medium","tests":30,"solution":"solutions/p06_canvas.cpp","problem":"problems/06-canvas.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 06 - Draw on a framebuffer\n//\n// Problem:  problems/06-canvas.md (also in the web problem book)\n// Check:    .\\check 06\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p06.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p06_canvas.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 06 - Draw on a framebuffer\n//\n// Problem:  problems/06-canvas.md (also in the web problem book)\n// Check:    .\\check 06\n//\n// Only the picture your program writes is checked, so structure this however you\n// like, or use another language or library (see README.md). The input/output code\n// at the bottom is provided so you can focus on set(), drawRect() and drawLine().\n//\n// Later checkpoints use include/provided/Canvas.h, a ready-made version of what you\n// build here. Don't include it in this one: writing it is the exercise.\n\n#include <algorithm>\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n#include \"NotImplemented.h\"\n\nstruct RGB {\n  uint8_t r = 0, g = 0, b = 0;\n};\n\n// A width x height picture. Pixel (x, y) is pixels[y * width + x]: (0, 0) is the\n// top-left corner, x grows to the right and y grows downwards. Every pixel starts black.\nstruct FrameBuffer {\n  int width = 0;\n  int height = 0;\n  std::vector<RGB> pixels;\n\n  FrameBuffer(const int w, const int h)\n      : width(w), height(h), pixels(static_cast<std::size_t>(w) * h) {}\n\n  // Paints pixel (x, y). A pixel outside the picture is ignored.\n  void set(int x, int y, RGB color) {\n    // TODO: bounds check, then write pixels[y * width + x].\n    throw NotImplemented(\"FrameBuffer::set\");\n  }\n\n  // A w x h rectangle centred on (cx, cy): columns cx - w/2 ... cx - w/2 + w - 1\n  // (w/2 rounds down), rows cy - h/2 ... cy - h/2 + h - 1. Parts outside are ignored.\n  void drawRect(int cx, int cy, int w, int h, RGB color) {\n    // TODO\n    throw NotImplemented(\"FrameBuffer::drawRect\");\n  }\n\n  // A line from (ax, ay) to (bx, by), both ends included: one thickness x thickness\n  // square, centred like drawRect, for every step along the longer axis.\n  void drawLine(int ax, int ay, int bx, int by, int thickness, RGB color) {\n    // TODO: see \"Drawing a line\" on the problem page.\n    throw NotImplemented(\"FrameBuffer::drawLine\");\n  }\n};\n\n// ---- Input/output (provided) -------------------------------------------------\n\n// stb_image_write (third_party/stb) encodes the PNG. This file compiles its code.\n#define STB_IMAGE_WRITE_IMPLEMENTATION\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored \"-Wall\"\n#pragma GCC diagnostic ignored \"-Wextra\"\n#pragma GCC diagnostic ignored \"-Wmissing-field-initializers\"\n#include \"stb_image_write.h\"\n#pragma GCC diagnostic pop\n\nnamespace {\n\nstatic_assert(sizeof(RGB) == 3, \"RGB must be 3 tightly packed bytes for the PNG writer\");\n\nvoid writePng(const FrameBuffer& fb, const std::string& path) {\n  // 3 bytes per pixel (RGB), rows from the top down, width * 3 bytes per row.\n  if (!stbi_write_png(path.c_str(), fb.width, fb.height, 3, fb.pixels.data(), fb.width * 3)) {\n    throw std::runtime_error(\"cannot write \" + path);\n  }\n}\n\nRGB readColor(std::istream& words) {\n  int r = 0, g = 0, b = 0;\n  words >> r >> g >> b;\n  return RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n}\n\n}  // namespace\n\n// Usage: p06 <input-file> <output-file.png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::optional<FrameBuffer> fb;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        fb.emplace(w, h);\n        continue;\n      }\n      if (!fb) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n      if (keyword == \"point\") {  // point <x> <y> <r> <g> <b>\n        int x = 0, y = 0;\n        words >> x >> y;\n        fb->set(x, y, readColor(words));\n      } else if (keyword == \"rect\") {  // rect <cx> <cy> <w> <h> <r> <g> <b>\n        int cx = 0, cy = 0, w = 0, h = 0;\n        words >> cx >> cy >> w >> h;\n        fb->drawRect(cx, cy, w, h, readColor(words));\n      } else if (keyword == \"line\") {  // line <ax> <ay> <bx> <by> <thickness> <r> <g> <b>\n        int ax = 0, ay = 0, bx = 0, by = 0, thickness = 0;\n        words >> ax >> ay >> bx >> by >> thickness;\n        fb->drawLine(ax, ay, bx, by, thickness, readColor(words));\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!fb) throw std::runtime_error(\"no `canvas` line in the input\");\n    writePng(*fb, argv[2]);\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["structs","<code>std::vector<\/code> as a 2D grid","integer division","<code>std::swap<\/code>","converting a float to an int (rounding vs truncating)"],"text":["structs","std::vector as a 2D grid","integer division","std::swap","converting a float to an int (rounding vs truncating)"]},{"label":"Library","items":["<code>stbi_write_png<\/code> from stb_image_write (already called for you)"],"text":["stbi_write_png from stb_image_write (already called for you)"]},{"label":"Concepts","items":["framebuffer","row-major pixel layout","clipping","line rasterization along the longer axis","drawing order"],"text":["framebuffer","row-major pixel layout","clipping","line rasterization along the longer axis","drawing order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a list of drawing commands and writes the picture they draw as a PNG file.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p06_canvas.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p06_canvas.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, keeps the pixels in a <code>FrameBuffer<\/code> and writes the PNG; you fill in <code>set()<\/code>, <code>drawRect()<\/code> and <code>drawLine()<\/code>. Don't include <code>provided/Canvas.h<\/code> here: writing it is the exercise.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The output file name ends in <code>.png<\/code>. The input file contains these lines, one command per line. All values are whole numbers.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;w&gt; &lt;h&gt;<\/code><\/td><td>Always the first line: the picture is <code>w<\/code> pixels wide and <code>h<\/code> pixels tall, all black.<\/td><\/tr><tr><td><code>point &lt;x&gt; &lt;y&gt; &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>Paint pixel (x, y) in colour (r, g, b).<\/td><\/tr><tr><td><code>rect &lt;cx&gt; &lt;cy&gt; &lt;w&gt; &lt;h&gt; &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>A filled <code>w<\/code> x <code>h<\/code> rectangle centred on (cx, cy).<\/td><\/tr><tr><td><code>line &lt;ax&gt; &lt;ay&gt; &lt;bx&gt; &lt;by&gt; &lt;thickness&gt; &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>A line from (ax, ay) to (bx, by), <code>thickness<\/code> pixels thick.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Colours are 0 to 255 per channel. Coordinates can be negative or beyond the picture.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) file, exactly <code>w<\/code> x <code>h<\/code> pixels, 8 bits per channel, RGB (RGBA works too; alpha is ignored). Pixel (0, 0) is the <strong>top-left<\/strong> corner; x grows to the right and <strong>y grows downwards<\/strong>. Every pixel that no command paints stays black (0, 0, 0).<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/p>\n<h3>The commands, in order<\/h3>\n<p>Draw the commands in the order they appear. A later command paints over an earlier one wherever they overlap.<\/p>\n<h3>Painting one pixel<\/h3>\n<p><code>point x y ...<\/code> paints exactly one pixel. If (x, y) is outside the picture (x &lt; 0, y &lt; 0, x ≥ w or y ≥ h), nothing happens. Every other operation is built from this one, so this is where clipping lives: a shape partly outside the picture keeps its inside part.<\/p>\n<h3>Drawing a rectangle<\/h3>\n<p><code>rect cx cy w h ...<\/code> paints every pixel (x, y) with<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>from<\/th><th>to (included)<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td><code>cx - w/2<\/code><\/td><td><code>cx - w/2 + w - 1<\/code><\/td><\/tr><tr><td>y<\/td><td><code>cy - h/2<\/code><\/td><td><code>cy - h/2 + h - 1<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>where <code>w/2<\/code> and <code>h/2<\/code> round down. An odd size is centred exactly; an even size has one more pixel on the left (or top) side than on the right (or bottom):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>w<\/th><th>columns, for cx = 100<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>100<\/td><\/tr><tr><td>4<\/td><td>98 ... 101<\/td><\/tr><tr><td>5<\/td><td>98 ... 102<\/td><\/tr><tr><td>50<\/td><td>75 ... 124<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Drawing a line<\/h3>\n<p><code>line ax ay bx by t ...<\/code> stamps one <code>t<\/code> x <code>t<\/code> square (centred like a rectangle) for every step along the line's longer direction:<\/p>\n<ol><li>If the line is <strong>steep<\/strong>, meaning |by - ay| &gt; |bx - ax|, swap the roles of x and y for the steps below (step along y instead of x).<\/li><li>Step from the end with the smaller x to the end with the larger x, <strong>both ends included<\/strong>. With x = the step and (x1, y1), (x2, y2) the two ends in that order, the other coordinate is <code>y1 + (y2 - y1) / (x2 - x1) * (x - x1)<\/code>, worked out in floating point and rounded to the nearest whole number.<\/li><li>At each step, draw a <code>t<\/code> x <code>t<\/code> rectangle centred on (x, y) (on (y, x) for a steep line, swapping back).<\/li><li>If both ends are the same pixel, the line is a single square.<\/li><\/ol>\n<p>Rounding to the nearest is the cleanest choice, but truncating toward zero also passes, and a tie (exactly .5) may go either way: the checker forgives an edge that moves by one pixel. What it doesn't forgive is a missing piece, a gap or a shape in the wrong place. Compute the slope in floating point: with ints, <code>(by - ay) / (bx - ax)<\/code> is integer division and loses the fraction.<\/p>\n<h3>How the picture is compared<\/h3>\n<p>The checker reads your PNG and compares it with the expected picture pixel by pixel. A pixel that differs is forgiven only when it is an edge that moved by at most 1 pixel: extra ink right next to the same ink in the expected picture, or missing ink with the same ink right next to it in yours. Everything else counts, and every test allows 0 such pixels. When a test fails, the checker writes a diff picture: red where you have extra ink, blue where ink is missing, magenta for the wrong colour and yellow for forgiven pixels.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement it targets.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The picture is exactly <code>w<\/code> x <code>h<\/code>, black where nothing is drawn, with (0, 0) at the top-left and y growing downwards.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>point<\/code> paints exactly one pixel in its colour.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>rect<\/code> covers columns <code>cx - w/2<\/code> to <code>cx - w/2 + w - 1<\/code> and rows likewise, for even and odd sizes.<\/span><\/li><li><span class=\"rid\">R4<\/span><span><code>line<\/code> works in every direction (shallow, steep, horizontal, vertical, either end first), with both ends included and no gaps, and a zero-length line is one square.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>line<\/code> stamps a <code>thickness<\/code> x <code>thickness<\/code> square at every step.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Shapes partly outside the picture keep their inside part; shapes entirely outside draw nothing and don't crash.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Later commands paint over earlier ones.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>w<\/code> and <code>h<\/code> are between 1 and 600. Rectangle sizes and line thicknesses are between 1 and 600. Clip each rectangle's loops to the canvas rather than skipping pixels one by one: a thick line stamps one rectangle per step, and most of a big stamp can lie outside the canvas.<\/li><li>Coordinates are between -1000 and 1000, so a line has at most a few thousand steps.<\/li><li>At most 15 colours appear in one picture, all clearly different from each other and from black.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 30 tests: the blog's demo, hand-made scenes for each requirement and 5 random scenes.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p06_canvas.cpp","text":"// Reference solution - checkpoint 06 (draw on a framebuffer).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <algorithm>\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\nstruct RGB {\n  uint8_t r = 0, g = 0, b = 0;\n};\n\nstruct FrameBuffer {\n  int width = 0;\n  int height = 0;\n  std::vector<RGB> pixels;\n\n  FrameBuffer(const int w, const int h)\n      : width(w), height(h), pixels(static_cast<std::size_t>(w) * h) {}\n\n  void set(const int x, const int y, const RGB color) {\n    if (x < 0 || y < 0 || x >= width || y >= height) return;\n    pixels[static_cast<std::size_t>(y) * width + x] = color;\n  }\n\n  void drawRect(const int cx, const int cy, const int w, const int h, const RGB color) {\n    const int left = cx - w / 2, top = cy - h / 2;\n    // Clip the ranges first, so a huge or far-away rectangle costs nothing.\n    for (int y = std::max(top, 0); y < std::min(top + h, height); ++y) {\n      for (int x = std::max(left, 0); x < std::min(left + w, width); ++x) set(x, y, color);\n    }\n  }\n\n  void drawLine(int ax, int ay, int bx, int by, const int thickness, const RGB color) {\n    // Step along the longer axis, so consecutive squares never leave a gap.\n    const bool steep = std::abs(by - ay) > std::abs(bx - ax);\n    if (steep) {\n      std::swap(ax, ay);\n      std::swap(bx, by);\n    }\n    if (ax > bx) {\n      std::swap(ax, bx);\n      std::swap(ay, by);\n    }\n    const double slope = bx == ax ? 0.0 : static_cast<double>(by - ay) / (bx - ax);\n    for (int x = ax; x <= bx; ++x) {\n      const int y = static_cast<int>(std::lround(ay + slope * (x - ax)));\n      if (steep) drawRect(y, x, thickness, thickness, color);\n      else drawRect(x, y, thickness, thickness, color);\n    }\n  }\n};\n\n// ---- Input/output (same as the starter) --------------------------------------\n\n#define STB_IMAGE_WRITE_IMPLEMENTATION\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored \"-Wall\"\n#pragma GCC diagnostic ignored \"-Wextra\"\n#pragma GCC diagnostic ignored \"-Wmissing-field-initializers\"\n#include \"stb_image_write.h\"\n#pragma GCC diagnostic pop\n\nnamespace {\n\nstatic_assert(sizeof(RGB) == 3, \"RGB must be 3 tightly packed bytes for the PNG writer\");\n\nvoid writePng(const FrameBuffer& fb, const std::string& path) {\n  if (!stbi_write_png(path.c_str(), fb.width, fb.height, 3, fb.pixels.data(), fb.width * 3)) {\n    throw std::runtime_error(\"cannot write \" + path);\n  }\n}\n\nRGB readColor(std::istream& words) {\n  int r = 0, g = 0, b = 0;\n  words >> r >> g >> b;\n  return RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::optional<FrameBuffer> fb;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {\n        int w = 0, h = 0;\n        words >> w >> h;\n        fb.emplace(w, h);\n        continue;\n      }\n      if (!fb) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n      if (keyword == \"point\") {\n        int x = 0, y = 0;\n        words >> x >> y;\n        fb->set(x, y, readColor(words));\n      } else if (keyword == \"rect\") {\n        int cx = 0, cy = 0, w = 0, h = 0;\n        words >> cx >> cy >> w >> h;\n        fb->drawRect(cx, cy, w, h, readColor(words));\n      } else if (keyword == \"line\") {\n        int ax = 0, ay = 0, bx = 0, by = 0, thickness = 0;\n        words >> ax >> ay >> bx >> by >> thickness;\n        fb->drawLine(ax, ay, bx, by, thickness, readColor(words));\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!fb) throw std::runtime_error(\"no `canvas` line in the input\");\n    writePng(*fb, argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":30,"total":30,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Preparation%20of%20a%20renderer\" target=\"_blank\" rel=\"noopener\">Preparation of a renderer<\/a> section up to and including the paragraph that starts \"The line drawing algorithm\". The author's code comes right after it.<\/p>","context":"<p>Checkpoints 1 to 5 read numbers out of the font file. From here on, every few checkpoints draw a picture: outlines with straight lines (8), with curves (11), then filled glyphs (14, 16, 17). They all draw on the framebuffer you build here: a grid of pixels with three operations (one pixel, a rectangle, a thick line) that is written out as a PNG. Later checkpoints can use <code>include/provided/Canvas.h<\/code>, a ready-made version (their boilerplate starters include it), so you can skip ahead.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Digital_differential_analyzer_(graphics_algorithm\" target=\"_blank\" rel=\"noopener\">Digital differential analyzer (graphics algorithm)<\/a>): the line method used here<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Bresenham%27s_line_algorithm\" target=\"_blank\" rel=\"noopener\">Bresenham's line algorithm<\/a>: the same idea with integers only<\/li><li>stb, <a href=\"https://github.com/nothings/stb/blob/master/stb_image_write.h\" target=\"_blank\" rel=\"noopener\">stb_image_write.h<\/a>: the PNG writer (<code>third_party/stb<\/code>)<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Preparation%20of%20a%20renderer\" target=\"_blank\" rel=\"noopener\">Preparation of a renderer<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 06                         run every test\n.\\check 06 -Case 06-R4-short       one test, showing its full input and where your picture is\n.\\check 06 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 06 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>Open your picture (<code>build/cases/06/&lt;id&gt;.out.png<\/code>) next to the expected one (<code>tests/06/expected/&lt;id&gt;.png<\/code>) and the diff the checker writes. A failing test looks like this:<\/p>\n<pre><code>  R4  line in every direction (shallow, steep, axis-aligned), both ends... .    2 / 6   FAILED\n      x 06-R4-steep  steep lines (|slope| &gt; 1) going up and down: no gaps allowed\n          570 pixels missing, e.g. (20, 12) should be white (beyond the 1-pixel edge tolerance). Diff: build/cases/06/06-R4-steep.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven\n          likely cause: R4 - line in every direction (shallow, steep, axis-aligned), both ends included\n          expected values from: reference drawing, checked against the ideal shapes (exact pixels for point/rect, true segment for line)\n          reproduce: build/p06.exe build/cases/06/06-R4-steep.in build/cases/06/06-R4-steep.out.png<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Get <code>set()<\/code> right first: it is the only function that touches the pixel array, so if it checks the bounds, nothing else has to. Then <code>drawRect()<\/code> is two loops calling <code>set()<\/code>, and <code>drawLine()<\/code> is one loop calling <code>drawRect()<\/code>.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Pixel (x, y) lives at index <code>y * width + x<\/code> of the vector. For the line, decide once whether it is steep, swap x and y of both ends if so, and swap the ends if the first has the larger x. Now there is a single case: x goes up by 1 per step and y changes by <code>slope<\/code> per step, where <code>|slope| &lt;= 1<\/code>. Swap x and y back when you stamp the square.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Check <code>x &gt;= width<\/code>, not <code>x &gt; width<\/code>: index <code>y * width + width<\/code> is the first pixel of the next row (or past the end of the vector on the last row).<\/li><li>Without the steep swap, a nearly vertical line becomes a few dots.<\/li><li><code>(by - ay) / (bx - ax)<\/code> with ints is integer division. Convert to <code>double<\/code> first.<\/li><li>A zero-length line has <code>bx - ax == 0<\/code>. Don't divide by it; draw one square.<\/li><li><code>w / 2<\/code> for the rectangle is integer division on purpose: it rounds down.<\/li><li>Loop <code>x &lt;= bx<\/code>, not <code>x &lt; bx<\/code>, or the last end goes missing.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>set(x, y, c):\n    if 0 &lt;= x &lt; width and 0 &lt;= y &lt; height: pixels[y * width + x] = c\n\ndrawRect(cx, cy, w, h, c):\n    left = cx - w / 2;  top = cy - h / 2          # integer division\n    for y in top .. top + h - 1:\n        for x in left .. left + w - 1: set(x, y, c)\n\ndrawLine(ax, ay, bx, by, t, c):\n    steep = |by - ay| &gt; |bx - ax|\n    if steep: swap(ax, ay); swap(bx, by)\n    if ax &gt; bx: swap(ax, bx); swap(ay, by)\n    slope = (bx == ax) ? 0 : (by - ay) / double(bx - ax)\n    for x in ax .. bx:\n        y = round(ay + slope * (x - ax))\n        if steep: drawRect(y, x, t, t, c) else: drawRect(x, y, t, t, c)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the blog's demo scene","test":"06-E2E-blog-demo","input":"canvas 500 500\nline 100 100 300 400 5 255 255 255\nline 400 200 50 300 2 200 0 0\nrect 200 400 50 50 0 200 0","output":"a 500 x 500 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAH0CAIAAABEtEjdAAAGkklEQVR42u3dQWrDUBAFQd//ZL5VskogiyAHHFozvwqfYCyahzZ6PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAt/n4yUEAFsZd3wHEHYAhcdd3gJ1x13cA4x0A4x0AfQfgzX13FgDjHQB9ByDsu7MAGO8A6DsAYd+dBcB4B0DfAQj77iwAxjsA+g5A2HdnATDeAdB3AMK+OwuA8Q6AvgMQ9t1ZAIx3APQdgLDvzgJgvAOg7wCEfXcWAOMdAH0HIOy7swAY7wDoOwBh350FwHgHQN8BCPvuLADGOwD6DkDYd2cBMN4B0HcAwr47C4DxDoC+AxD23VkAjHcA9B2AsO/OAmC8A6DvAIR9dxYA4x0AfQcg7LuzABjvAOg7AGHfnQXAeAdA3wEI++4sAMY7APoOQNh3ZwEw3gHQdwDCvjsLgPEOgL4DEPbdWQCMdwD0HYCw784CYLwDoO8AhH13FgDjHQB9ByDsu7MAGO8A6DsAYd+dBcB4B0DfAQj77iwAxjsA+g5A2HdnATDeAdB3AMK+OwuA8Q6AvgMQ9t1ZAIx3APQdgLDvzsIUz68fYLyzJOhPcQd9Z2XTZR3+3HdnQdDBeAdNB30HQYew786CpoPxDoIO+o6muwuEfXcWBB2MdzRd00HfEXQg7LuzoOlgvCPogL6j6UDYd2cRdEEH4x1NB/QdQQfCvjuLpgPGO4IO6DuaDoR9dxZBB4x3NB3QdwQdCPvuLJoOGO8IOqDvaDoQ9t1ZBB0w3tF0QN8FHSDsu7NoOmC8C7qgA/qu6QBh351F0AHjXdMB9F3QAcK+azqA8S7oAPqu6QBh3wUdwHjXdAB9F3SAsO+aDmC8CzqAvms6QNh3QQcw3jUdQN8FHSDsu6YDGO+CDnBA3zUd4L59F3SAQ8e7pgMs6bugA4zvu6YDbIu7oAPs6bumAyzxW9BP+5Q2wP6mH/IpbYDNQf92yKe0AY5o+uOq724IMC/ol3HXd4CRTdd3gIVBf6XvTg0wsunGO8C2oOs7wNqmX/bd3wEwL+jGO8DOpus7wMKgv9J3/xrAyKYb7wDbgq7vAGubftl3/ywg6LM/fGG8A5q+82NG+g4I+s6v04k7oOmnxF3fAUHXdwBNn9N3Dwkg6MY7gKbrO4Cgh313FkDTjXcAQdd3AE0P++4sgKAb7wCaru+AoBP23VkATTfeAUEXdH0HNJ2w784CCLrxDmg6+g4IOmHfnQU0XdONd0DQ0XdA0wn77iwg6BjvgKaj74CgE/bdWWBw1sF4hyVxB30HOLrvzgJgvAOg7wCEfXcWAOMdAH0HIOy7swAY7wDoOwBh350FwHgHQN8BCPvuLADGOwD6DkDYd2cBMN4B0HcAwr47C4DxDoC+AxD23VkAjHcA9B2AsO/OAmC8A6DvAIR9dxYA4x0AfQcg7LuzABjvAOg7AGHfnQXAeAdA3wEI++4sAMY7APoOQNh3ZwEw3gHQdwDCvjsLgPEOgL4DEPbdWQCMdwD0HYCw784CYLwDoO8AhH13FgDjHQB9ByDsu7MAGO8A6DsAYd+dBcB4B0DfAQj77iwAxjsA+g5A2HdnATDeAdB3AMK+OwuA8Q6AvgMQ9t1ZAIx3APQdgLDvzgJgvAP8n+ctf/oOIO636rtnChD3hXHXd0DcZ8dd3wFx3xl3L2cAcT8o7voOiPvsuOs7IO474+7lDCDuB8Vd3wFxnx13fQfEfWfcvZwBxP2guOs7IO6z467vgLjvjLuXM4C4HxR3fQfEXd8BxN3LGQBxN94BcRd3fQfEXdy9nAHE/cy46zsg7voOIO5ezgCIu/EOiLu4G++AuIv7Vd89gIC4izuAuE/ouwcQEHcAxB1A3MUdQNzFHUDcxR1A3AEQdwDEHUDcxR1A3MUdQNzFHUDcARB3AHEXdwBxF3cAcRd3AHEHQNwBEHcAcRd3AHEXdwBxF3cAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAuLtPv18OWrCFegUAAAAASUVORK5CYII=\" alt=\"The blog&#x27;s demo: a thick white line, a thin red line crossing it, and a green square\"><figcaption>tests/06/expected/06-E2E-blog-demo.png<\/figcaption><\/figure>\n<p>The white line is steep (it rises 300 while moving 200 across), so it steps along y. The red line goes right to left, so its ends are swapped before stepping along x. Where the lines cross, the red one is on top because it comes later.<\/p>"},{"label":"Example 2","name":"even-sized rectangles","test":"06-R3-even","input":"canvas 220 140\nrect 60 70 50 50 0 200 0\nrect 160 40 20 8 255 120 170\nrect 160 100 2 2 255 255 255\npoint 60 70 255 255 255\npoint 160 40 60 120 255","output":"a 220 x 140 PNG","image":null,"explain":"<p>The green square covers columns 60 - 25 = 35 to 35 + 49 = 84 and rows 45 to 94: 25 pixels left of the centre column, 24 to the right. The pink bar covers columns 150 to 169 and rows 36 to 43. The 2 x 2 square covers columns 159 to 160 and rows 99 to 100. The two points are drawn last, so they show on top of the rectangles' centres.<\/p>"},{"label":"Example 3","name":"very short lines","test":"06-R4-short","input":"canvas 120 80\nline 10 10 11 10 1 255 255 255\nline 30 10 30 12 1 200 0 0\nline 50 10 52 13 1 0 200 0\nline 80 13 77 10 1 255 220 0\nline 10 50 13 49 1 0 220 220\nline 60 60 59 57 1 255 120 170","output":"a 120 x 80 PNG","image":null,"explain":"<p>Take the green line from (50, 10) to (52, 13). It moves 3 down and 2 across, so it is steep: step y from 10 to 13 and work out x = 50 + 2/3 * (y - 10).<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>y<\/th><th>x exactly<\/th><th>x rounded<\/th><th>pixel<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>50<\/td><td>50<\/td><td>(50, 10)<\/td><\/tr><tr><td>11<\/td><td>50.67<\/td><td>51<\/td><td>(51, 11)<\/td><\/tr><tr><td>12<\/td><td>51.33<\/td><td>51<\/td><td>(51, 12)<\/td><\/tr><tr><td>13<\/td><td>52<\/td><td>52<\/td><td>(52, 13)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Without the swap you would step x from 50 to 52 and paint only 3 pixels, leaving a gap.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Preparation%20of%20a%20renderer\" target=\"_blank\" rel=\"noopener\">The blog's first <code>FrameBufferCanvas<\/code><\/a> is a class that owns a one-dimensional vector of <code>RGB<\/code> pixels. <code>set<\/code> writes one pixel and ignores coordinates outside the picture, <code>drawRect<\/code> takes the centre and size, and <code>drawLine<\/code> does the steep swap, orders the ends and stamps a <code>drawRect<\/code> at every step. A second <code>drawLine<\/code> takes 2D vectors, which keeps the glyph code in later sections short, and <code>writePngFile<\/code> hands the buffer to <code>stbi_write_png<\/code> with 3 channels. Its <code>main<\/code> draws the scene from Example 1.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet turns the stepped coordinate into a pixel with a plain cast, which truncates toward zero instead of rounding, so its lines can sit up to a pixel to one side. The tests accept both. It also divides by <code>bx - ax<\/code> without checking, so a zero-length line divides by zero; this page asks for one square instead.<\/p>"}},{"id":"07","num":"7","title":"Decode simple glyphs","difficulty":"Medium","tests":151,"solution":"solutions/p07_simple_glyph.cpp","problem":"problems/07-simple-glyph.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 07 - Decode simple glyphs\n//\n// Problem:  problems/07-simple-glyph.md (also in the web problem book)\n// Check:    .\\check 07\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p07.exe <input-file> <output-file>\n//\n// Read the input file and write your answer to the output file; only that file is\n// checked. The includes, the parsing and the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p07_simple_glyph.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 07 - Decode simple glyphs\n//\n// Problem:  problems/07-simple-glyph.md (also in the web problem book)\n// Check:    .\\check 07\n//\n// Only your program's output is checked, so structure this however you like, or\n// use another language or library (see README.md). The input/output code at the\n// bottom is provided so you can focus on decodeGlyph().\n\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#include \"provided/BigEndian.h\"  // optional: be::u8(file), be::u16(file), be::i16(file), ...\n\nstruct Point {\n  int x = 0;\n  int y = 0;\n  bool onCurve = false;\n};\n\nstruct DecodedGlyph {\n  enum class Kind { Empty, Compound, Simple };\n  Kind kind = Kind::Empty;\n\n  // Only used when kind == Simple.\n  int numberOfContours = 0;\n  int xMin = 0, yMin = 0, xMax = 0, yMax = 0;\n  std::vector<int> endPtsOfContours;  // in file order\n  std::vector<Point> points;          // absolute coordinates in font units\n};\n\n// The glyph's record starts at byte `offset` of `file` and is `length` bytes long.\nDecodedGlyph decodeGlyph(std::ifstream& file, uint32_t offset, uint32_t length) {\n  // TODO: decode the record (layout and rules are on the problem page).\n  throw NotImplemented(\"decodeGlyph\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\nvoid write(std::ostream& out, const uint32_t id, const DecodedGlyph& g) {\n  out << \"glyph \" << id;\n  if (g.kind == DecodedGlyph::Kind::Empty) {\n    out << \" empty\\n\";\n    return;\n  }\n  if (g.kind == DecodedGlyph::Kind::Compound) {\n    out << \" compound\\n\";\n    return;\n  }\n  out << \" contours \" << g.numberOfContours << \" bbox \" << g.xMin << ' ' << g.yMin << ' '\n      << g.xMax << ' ' << g.yMax << \"\\nends\";\n  for (const int end : g.endPtsOfContours) out << ' ' << end;\n  out << \"\\npoints\";\n  for (const Point& p : g.points) out << ' ' << p.x << ' ' << p.y << (p.onCurve ? \" on\" : \" off\");\n  out << '\\n';\n}\n\n}  // namespace\n\n// Usage: p07 <input-file> <output-file>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::ifstream font;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {  // font <path>: the file the following glyph lines refer to\n        std::string path;\n        words >> path;\n        font = std::ifstream(path, std::ios::binary);\n        if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n      } else if (keyword == \"glyph\") {  // glyph <id> <offset> <length>\n        uint32_t id = 0, offset = 0, length = 0;\n        words >> id >> offset >> length;\n        font.clear();  // forget any end-of-file state left by the previous glyph\n        write(output, id, decodeGlyph(font, offset, length));\n      }\n    }\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["bit flags and masks","signed vs unsigned integers (<code>int16<\/code>, <code>uint8<\/code>)","running sums","binary file I/O (<code>seekg<\/code>, <code>get<\/code>)"],"text":["bit flags and masks","signed vs unsigned integers (int16, uint8)","running sums","binary file I/O (seekg, get)"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode","<code>std::vector<\/code>"],"text":["std::ifstream in binary mode","std::vector"]},{"label":"Concepts","items":["glyph outlines","contours","on-curve and off-curve points","delta encoding","run-length encoding","big-endian byte order"],"text":["glyph outlines","contours","on-curve and off-curve points","delta encoding","run-length encoding","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads a list of glyph records from font files and prints each glyph's decoded outline.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p07_simple_glyph.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p07_simple_glyph.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>decodeGlyph()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains two kinds of lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The file that the following <code>glyph<\/code> lines refer to. The path is relative to the workbook folder and contains no spaces. This line may appear more than once.<\/td><\/tr><tr><td><code>glyph &lt;id&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>A glyph record <code>length<\/code> bytes long, starting at byte <code>offset<\/code> of the current file. <code>id<\/code> is a non-negative whole number used as a label: print it back unchanged.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Offsets and lengths are what checkpoint 4 works out from the <code>loca<\/code> table, so you don't need any other table here. You only need <code>length<\/code> to tell whether there is a record at all (0 means none). Records are well-formed, so you don't have to bounds-check against it. Some test files are real fonts. Others are hand-made files that contain one glyph record at offset 0.<\/p>\n<h3>Output<\/h3>\n<p>For each <code>glyph<\/code> line, in input order, write one of three things:<\/p>\n<ul><li><strong>Length 0<\/strong> (the glyph has no outline, e.g. the space character): <code>glyph &lt;id&gt; empty<\/code><\/li><li><strong><code>numberOfContours<\/code> &lt; 0<\/strong> (a compound glyph): <code>glyph &lt;id&gt; compound<\/code>. Don't decode it.<\/li><li><strong>Otherwise<\/strong> (a simple glyph), three lines:<\/li><\/ul>\n<pre><code>glyph &lt;id&gt; contours &lt;numberOfContours&gt; bbox &lt;xMin&gt; &lt;yMin&gt; &lt;xMax&gt; &lt;yMax&gt;\nends &lt;endPtsOfContours[0]&gt; &lt;endPtsOfContours[1]&gt; ...\npoints &lt;x0&gt; &lt;y0&gt; &lt;on|off&gt; &lt;x1&gt; &lt;y1&gt; &lt;on|off&gt; ...<\/code><\/pre>\n<p>If <code>numberOfContours<\/code> is 0 (no test has one), print the header line, then <code>ends<\/code> and <code>points<\/code> with nothing after them. <code>ends<\/code> lists the values in the order they appear in the file. <code>points<\/code> gives every point in order as <strong>absolute<\/strong> coordinates in font units, followed by <code>on<\/code> if the point lies on the curve or <code>off<\/code> if it is a control point. Words are separated by spaces. The checker ignores extra whitespace.<\/p>\n<figure class=\"split-figure\">\n<svg viewBox=\"-30 -30 660 800\" role=\"img\" aria-label=\"The outline of A in JetBrains Mono Bold, drawn from its 17 decoded points\"><rect x=\"35\" y=\"0\" width=\"530\" height=\"730\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"4\" stroke-dasharray=\"14 10\"/><line x1=\"-30\" y1=\"730\" x2=\"630\" y2=\"730\" stroke=\"var(--muted)\" stroke-width=\"3\"/><polygon points=\"35,730 219,0 380,0 565,730 437,730 397,553 203,553 163,730\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/><polygon points=\"226,451 374,451 330,255 319,206 303,127 300,109 297,127 281,206 270,254\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/><g fill=\"var(--fig-a)\"><circle cx=\"35\" cy=\"730\" r=\"13\"/><circle cx=\"219\" cy=\"0\" r=\"13\"/><circle cx=\"380\" cy=\"0\" r=\"13\"/><circle cx=\"565\" cy=\"730\" r=\"13\"/><circle cx=\"437\" cy=\"730\" r=\"13\"/><circle cx=\"397\" cy=\"553\" r=\"13\"/><circle cx=\"203\" cy=\"553\" r=\"13\"/><circle cx=\"163\" cy=\"730\" r=\"13\"/><circle cx=\"226\" cy=\"451\" r=\"13\"/><circle cx=\"374\" cy=\"451\" r=\"13\"/><circle cx=\"330\" cy=\"255\" r=\"13\"/><circle cx=\"300\" cy=\"109\" r=\"13\"/><circle cx=\"270\" cy=\"254\" r=\"13\"/><\/g><g fill=\"var(--surface)\" stroke=\"var(--fig-b)\" stroke-width=\"6\"><circle cx=\"319\" cy=\"206\" r=\"11\"/><circle cx=\"303\" cy=\"127\" r=\"11\"/><circle cx=\"297\" cy=\"127\" r=\"11\"/><circle cx=\"281\" cy=\"206\" r=\"11\"/><\/g><\/svg>\n<figcaption><p>What the output describes: <code>A<\/code> is glyph 37, with two contours (<code>ends 7 16<\/code>) and 17 points, joined here with straight lines as checkpoint 08 will draw them. The four off-curve points at the top of the inner triangle are what checkpoint 11 turns into a curve.<\/p><div class=\"legend\"><span><span class=\"dot a\"><\/span>on-curve point<\/span><span><span class=\"dot b\"><\/span>off-curve (control) point<\/span><span>dashed: bbox 35 0 565 730<\/span><\/div><\/figcaption>\n<\/figure>\n<h3>The glyph record you are decoding<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>: the most significant byte comes first.<\/p>\n<p><strong>Header<\/strong>, 10 bytes:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>numberOfContours<\/code><\/td><td>int16<\/td><td>≥ 0: a simple glyph (this checkpoint). &lt; 0: a compound glyph<\/td><\/tr><tr><td><code>xMin<\/code>, <code>yMin<\/code>, <code>xMax<\/code>, <code>yMax<\/code><\/td><td>int16 each<\/td><td>Bounding box in font units<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Simple-glyph description<\/strong>, immediately after the header:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>endPtsOfContours[numberOfContours]<\/code><\/td><td>uint16 each<\/td><td>Index of the last point of each contour, in increasing order<\/td><\/tr><tr><td><code>instructionLength<\/code><\/td><td>uint16<\/td><td>Number of hinting-instruction bytes that follow<\/td><\/tr><tr><td><code>instructions[instructionLength]<\/code><\/td><td>uint8 each<\/td><td>Hinting bytecode. Skip it.<\/td><\/tr><tr><td><code>flags[]<\/code><\/td><td>uint8 each<\/td><td>One flag per point, compressed (see below)<\/td><\/tr><tr><td><code>xCoordinates[]<\/code><\/td><td>0, 1 or 2 bytes per point<\/td><td>Every point's x, delta-encoded<\/td><\/tr><tr><td><code>yCoordinates[]<\/code><\/td><td>0, 1 or 2 bytes per point<\/td><td>Every point's y, delta-encoded<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The number of points is not stored anywhere. It is <code>endPtsOfContours[last] + 1<\/code>. A record may end with up to 3 padding bytes, which you can ignore.<\/p>\n<p><strong>Flag bits:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bit<\/th><th>Mask<\/th><th>Name<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>0x01<\/code><\/td><td>ON_CURVE_POINT<\/td><td>The point is on the curve; otherwise it is a control point<\/td><\/tr><tr><td>1<\/td><td><code>0x02<\/code><\/td><td>X_SHORT_VECTOR<\/td><td>The x delta is 1 byte (unsigned)<\/td><\/tr><tr><td>2<\/td><td><code>0x04<\/code><\/td><td>Y_SHORT_VECTOR<\/td><td>The y delta is 1 byte (unsigned)<\/td><\/tr><tr><td>3<\/td><td><code>0x08<\/code><\/td><td>REPEAT_FLAG<\/td><td>The next byte says how many <strong>more<\/strong> points use this same flag<\/td><\/tr><tr><td>4<\/td><td><code>0x10<\/code><\/td><td>X_IS_SAME_OR_POSITIVE_X_SHORT_VECTOR<\/td><td>Meaning depends on bit 1 (table below)<\/td><\/tr><tr><td>5<\/td><td><code>0x20<\/code><\/td><td>Y_IS_SAME_OR_POSITIVE_Y_SHORT_VECTOR<\/td><td>Meaning depends on bit 2 (table below)<\/td><\/tr><tr><td>6, 7<\/td><td><\/td><td><\/td><td>Ignore<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Reading one coordinate.<\/strong> This is shown for x; y works the same way using bits 2 and 5.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bit 1 (short)<\/th><th>Bit 4<\/th><th>Bytes read<\/th><th>Delta<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>1, uint8<\/td><td>+value<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1, uint8<\/td><td>−value<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>none<\/td><td>0, meaning \"same as the previous point\"<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>2, int16<\/td><td>value (already signed)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The first point's delta is relative to (0, 0). Each later point's delta is relative to the point before it.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>One output record per <code>glyph<\/code> line, in input order, in the format above.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A record of length 0 → <code>glyph &lt;id&gt; empty<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>numberOfContours<\/code> &lt; 0 → <code>glyph &lt;id&gt; compound<\/code>, with nothing decoded.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>The header's contour count and bounding box are printed exactly as stored.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>ends<\/code> lists <code>endPtsOfContours<\/code> in file order. The point count is the last value + 1.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>The hinting instructions are skipped, however long they are.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>REPEAT is expanded, so every point gets its own flag. Each point's on/off comes from its own flag, <strong>including points created by a repeat<\/strong>.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>The 1-byte, 2-byte and \"same\" deltas are added up into absolute coordinates. All x values come before all y values, and the running total carries on across contour boundaries (it is not reset to 0 for each contour).<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>The test records are well-formed: <code>endPtsOfContours<\/code> increases, no REPEAT run goes past the last point, and the flags and coordinates fit inside the record.<\/li><li>The largest glyph in the tests has a few hundred points. Every coordinate fits in an int16, and so does every running total.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 151 tests: the examples above, hand-made records for each rule, every simple ASCII glyph in the font, and 40 other glyphs (Nerd Font icons with hundreds of points, glyphs that repeat on-curve flags, and random picks).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p07_simple_glyph.cpp","text":"// Reference solution - checkpoint 07 (decode simple glyphs).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <algorithm>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"provided/BigEndian.h\"\n\nstruct Point {\n  int x = 0;\n  int y = 0;\n  bool onCurve = false;\n};\n\nstruct DecodedGlyph {\n  enum class Kind { Empty, Compound, Simple };\n  Kind kind = Kind::Empty;\n  int numberOfContours = 0;\n  int xMin = 0, yMin = 0, xMax = 0, yMax = 0;\n  std::vector<int> endPtsOfContours;\n  std::vector<Point> points;\n};\n\nnamespace {\n\nconstexpr uint8_t ON_CURVE_POINT = 0x01;\nconstexpr uint8_t X_SHORT_VECTOR = 0x02;\nconstexpr uint8_t Y_SHORT_VECTOR = 0x04;\nconstexpr uint8_t REPEAT_FLAG = 0x08;\nconstexpr uint8_t X_IS_SAME_OR_POSITIVE = 0x10;\nconstexpr uint8_t Y_IS_SAME_OR_POSITIVE = 0x20;\n\n// Reads one axis of delta-encoded coordinates into points[i].*axis.\nvoid readAxis(std::istream& in, const std::vector<uint8_t>& flags, const uint8_t shortBit,\n              const uint8_t sameOrPositiveBit, int Point::*axis, std::vector<Point>& points) {\n  int value = 0;  // deltas run on across contours, starting from 0\n  for (std::size_t i = 0; i < flags.size(); ++i) {\n    const uint8_t flag = flags[i];\n    if (flag & shortBit) {\n      const int magnitude = be::u8(in);\n      value += (flag & sameOrPositiveBit) ? magnitude : -magnitude;\n    } else if (!(flag & sameOrPositiveBit)) {\n      value += be::i16(in);\n    }  // else: same as the previous point, no bytes\n    points[i].*axis = value;\n  }\n}\n\n}  // namespace\n\nDecodedGlyph decodeGlyph(std::ifstream& file, const uint32_t offset, const uint32_t length) {\n  DecodedGlyph g;\n  if (length == 0) return g;  // no outline, e.g. space\n\n  file.seekg(offset);\n  g.numberOfContours = be::i16(file);\n  if (g.numberOfContours < 0) {\n    g.kind = DecodedGlyph::Kind::Compound;\n    return g;\n  }\n  g.kind = DecodedGlyph::Kind::Simple;\n  g.xMin = be::i16(file);\n  g.yMin = be::i16(file);\n  g.xMax = be::i16(file);\n  g.yMax = be::i16(file);\n  if (g.numberOfContours == 0) return g;\n\n  std::size_t numPoints = 0;\n  for (int i = 0; i < g.numberOfContours; ++i) {\n    const int end = be::u16(file);\n    g.endPtsOfContours.push_back(end);\n    numPoints = std::max(numPoints, static_cast<std::size_t>(end) + 1);\n  }\n\n  file.seekg(be::u16(file), std::ios::cur);  // hinting instructions\n\n  std::vector<uint8_t> flags;\n  flags.reserve(numPoints);\n  while (flags.size() < numPoints) {\n    const uint8_t flag = be::u8(file);\n    const std::size_t copies = (flag & REPEAT_FLAG) ? 1u + be::u8(file) : 1u;\n    flags.insert(flags.end(), copies, flag);\n  }\n  flags.resize(numPoints);  // a malformed repeat count can't add points\n\n  g.points.resize(numPoints);\n  readAxis(file, flags, X_SHORT_VECTOR, X_IS_SAME_OR_POSITIVE, &Point::x, g.points);\n  readAxis(file, flags, Y_SHORT_VECTOR, Y_IS_SAME_OR_POSITIVE, &Point::y, g.points);\n  for (std::size_t i = 0; i < numPoints; ++i) g.points[i].onCurve = flags[i] & ON_CURVE_POINT;\n  return g;\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\nvoid write(std::ostream& out, const uint32_t id, const DecodedGlyph& g) {\n  out << \"glyph \" << id;\n  if (g.kind == DecodedGlyph::Kind::Empty) {\n    out << \" empty\\n\";\n    return;\n  }\n  if (g.kind == DecodedGlyph::Kind::Compound) {\n    out << \" compound\\n\";\n    return;\n  }\n  out << \" contours \" << g.numberOfContours << \" bbox \" << g.xMin << ' ' << g.yMin << ' '\n      << g.xMax << ' ' << g.yMax << \"\\nends\";\n  for (const int end : g.endPtsOfContours) out << ' ' << end;\n  out << \"\\npoints\";\n  for (const Point& p : g.points) out << ' ' << p.x << ' ' << p.y << (p.onCurve ? \" on\" : \" off\");\n  out << '\\n';\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::ifstream font;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::ifstream(path, std::ios::binary);\n        if (!font) throw std::runtime_error(\"cannot open font file \" + path);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0, offset = 0, length = 0;\n        words >> id >> offset >> length;\n        font.clear();\n        write(output, id, decodeGlyph(font, offset, length));\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":151,"total":151,"date":"2026-10-21"},"uses":["include/provided/BigEndian.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <strong>\"Glyph Parsing &amp; Outline Rendering\"<\/strong> section, from <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parsing%20glyf%20tables\" target=\"_blank\" rel=\"noopener\">Parsing glyf tables<\/a> through the list of flag rules under <strong>Simple glyph<\/strong>. Stop at the paragraph that starts \"Implementation.\" The author's code comes right after it.<\/p>","context":"<p>Checkpoints 3 and 4 take you from a character to a byte offset inside the font file. This checkpoint reads what is stored at that offset: the points that make up the glyph's outline. Checkpoint 8 draws them as straight lines, checkpoint 11 as curves, and checkpoint 9 handles compound glyphs, which are glyphs built out of other glyphs.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6glyf.html\" target=\"_blank\" rel=\"noopener\">'glyf' table<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>. Its simple-glyph flags table is the clearest.<\/li><li>Apple, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>, on on-curve and off-curve points<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Simple%20glyph\" target=\"_blank\" rel=\"noopener\">Simple glyph<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 07                         run every test\n.\\check 07 -Case 07-R7-repeat      one test, showing its full input, expected output and your output\n.\\check 07 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 07 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  Header: number of contours and bounding box ...............    0 / 2   FAILED\n      x 07-R4-B  &#x27;B&#x27;: three contours\n          points[26]: expected (x=199, y=626, curve=on), got (x=199, y=626, curve=off) - differs in curve\n          likely cause: R7 - REPEAT expanded; on/off for every point, repeats included\n          expected values from: fontTools 4.67.0\n          reproduce: build/p07.exe build/cases/07/07-R4-B.in build/cases/07/07-R4-B.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read the fields in exactly the order they are laid out: header, contour ends, instructions, flags, every x, every y. You can't read any coordinate until all the flags are expanded, because the flags decide how many bytes each coordinate takes.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Work in two passes. First expand the compressed flags into a list with exactly one flag per point. Then walk that list twice, once for x and once for y. Each time, keep a running total and read 0, 1 or 2 bytes per point depending on two bits. Write the coordinate reader once and give it the bit numbers for the axis (1 and 4 for x, 2 and 5 for y).<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A REPEAT count of 3 means 3 <strong>more<\/strong> copies, so that one flag covers 4 points.<\/li><li>A repeated point gets every bit of the flag, including ON_CURVE. If you record on-curve points separately from the flag list, make sure the repeated points are included too.<\/li><li>\"Same as previous\" (short bit clear, bit 4/5 set) reads <strong>no<\/strong> bytes.<\/li><li>A short delta is an unsigned size from 0 to 255, and its sign comes from bit 4/5. A long delta is already a signed int16.<\/li><li>The running total doesn't reset at a contour boundary.<\/li><li>Compound glyphs: check <code>numberOfContours<\/code> before reading anything past the header.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>if length == 0: return EMPTY\nseek(offset)\nnumberOfContours = readInt16()\nif numberOfContours &lt; 0: return COMPOUND\nbbox = readInt16() x 4\nends = readUint16() x numberOfContours\nn = ends[last] + 1\nskip(readUint16())                       # instructions\nflags = []\nwhile len(flags) &lt; n:\n    f = readUint8()\n    copies = 1 + readUint8() if f &amp; 0x08 else 1\n    append f to flags, copies times\nxs = readAxis(flags, shortBit=0x02, sameOrPositiveBit=0x10)\nys = readAxis(flags, shortBit=0x04, sameOrPositiveBit=0x20)\npoint i = (xs[i], ys[i], flags[i] &amp; 0x01)\n\nreadAxis(flags, shortBit, sameOrPositiveBit):\n    value = 0\n    for f in flags:\n        if f &amp; shortBit:                   value += readUint8() if f &amp; sameOrPositiveBit else -readUint8()\n        elif not (f &amp; sameOrPositiveBit):  value += readInt16()\n        output value<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the hyphen in JetBrains Mono Bold","test":"07-R8-hyphen","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\nglyph 17 115392 56","output":"glyph 17 contours 1 bbox 140 272 460 388\nends 3\npoints 140 272 on 140 388 on 460 388 on 460 272 on","image":null,"explain":"<p>These are the 56 bytes at offset 115392:<\/p>\n<pre><code>00 01                        numberOfContours = 1\n00 8c 01 10 01 cc 01 84      bbox = (140, 272) - (460, 388)\n00 03                        endPtsOfContours = [3], so there are 4 points\n00 1e                        instructionLength = 30\n.. 30 bytes ..               instructions: skip them\n13 35 21 15                  flags, one per point (no REPEAT)\n8c 01 40                     x data\n01 10 74 74                  y data\n00                           padding<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>Point<\/th><th>Flag<\/th><th>x rule<\/th><th>x bytes<\/th><th>x<\/th><th>y rule<\/th><th>y bytes<\/th><th>y<\/th><th>On curve?<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>0x13<\/code><\/td><td>short, +<\/td><td><code>8c<\/code><\/td><td>0 + 140 = <strong>140<\/strong><\/td><td>int16<\/td><td><code>01 10<\/code><\/td><td>0 + 272 = <strong>272<\/strong><\/td><td>on<\/td><\/tr><tr><td>1<\/td><td><code>0x35<\/code><\/td><td>same<\/td><td>none<\/td><td><strong>140<\/strong><\/td><td>short, +<\/td><td><code>74<\/code><\/td><td>272 + 116 = <strong>388<\/strong><\/td><td>on<\/td><\/tr><tr><td>2<\/td><td><code>0x21<\/code><\/td><td>int16<\/td><td><code>01 40<\/code><\/td><td>140 + 320 = <strong>460<\/strong><\/td><td>same<\/td><td>none<\/td><td><strong>388<\/strong><\/td><td>on<\/td><\/tr><tr><td>3<\/td><td><code>0x15<\/code><\/td><td>same<\/td><td>none<\/td><td><strong>460<\/strong><\/td><td>short, −<\/td><td><code>74<\/code><\/td><td>388 − 116 = <strong>272<\/strong><\/td><td>on<\/td><\/tr><\/tbody><\/table><\/div>"},{"label":"Example 2","name":"a repeated flag","test":"07-R7-repeat","input":"font tests/07/data/07-R7-repeat.bin\nglyph 0 0 24","output":"glyph 0 contours 1 bbox 10 0 40 50\nends 5\npoints 10 0 on 20 0 on 30 0 on 40 0 on 40 50 on 10 50 off","image":null,"explain":"<p>The 24 bytes:<\/p>\n<pre><code>00 01                        numberOfContours = 1\n00 0a 00 00 00 28 00 32      bbox = (10, 0) - (40, 50)\n00 05                        endPtsOfContours = [5], so 6 points\n00 00                        instructionLength = 0\n3b 03 35 22                  flags: 0x3b with REPEAT, count 3 (points 0-3); 0x35 (point 4); 0x22 (point 5)\n0a 0a 0a 0a 1e               x data: +10 +10 +10 +10 (0x3b: short, +), none (0x35: same), -30 (0x22: short, -)\n32                           y data: none for points 0-3 (same), +50 (0x35: short, +), none (0x22: same)<\/code><\/pre>\n<p>Point 5 is <code>off<\/code> because bit 0 of <code>0x22<\/code> is clear.<\/p>"},{"label":"Example 3","name":"one input with several glyphs","test":"07-R1-four-glyphs","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\nglyph 17 115392 56\nglyph 4 113584 0\nglyph 77 122844 24\nglyph 37 118060 112","output":"glyph 17 contours 1 bbox 140 272 460 388\nends 3\npoints 140 272 on 140 388 on 460 388 on 460 272 on\nglyph 4 empty\nglyph 77 compound\nglyph 37 contours 2 bbox 35 0 565 730\nends 7 16\npoints 35 0 on 219 730 on ... (17 points in total)","image":null,"explain":""}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20simple%20glyphs\" target=\"_blank\" rel=\"noopener\">The blog's simple-glyph parser<\/a> splits the work into <code>readGlyphHeader<\/code> (the header), <code>getGlyphComponent<\/code> (contour ends, instructions and flags) and <code>getGlyphCoordinates<\/code>, which is called once for x and once for y. It stores the contour ends and on-curve indices in <code>unordered_set<\/code>s and multiplies every point by an affine matrix. The matrix is the identity for simple glyphs; it matters for compound glyphs in checkpoint 9.<\/p>\n<p><strong>Something to look for:<\/strong> in the snippet as published, the flag loop records ON_CURVE only for the first point of a repeated run. In JetBrains Mono Bold, 42 of the 90 simple ASCII glyphs repeat an on-curve flag, which is why R7 has its own tests.<\/p>"}},{"id":"08","num":"8","title":"Draw an outline with straight lines","difficulty":"Easy","tests":22,"solution":"solutions/p08_outline_lines.cpp","problem":"problems/08-outline-lines.md","lang":{"label":"C++","mime":"text/x-c++src","mode":"clike"},"starter":"// Checkpoint 08 - Draw an outline with straight lines\n//\n// Problem:  problems/08-outline-lines.md (also in the web problem book)\n// Check:    .\\check 08\n//\n// The checker runs your program from the workbook folder as\n//\n//     build/p08.exe <input-file> <output-file>\n//\n// Read the input file and write your picture (a PNG or a binary PPM, see the problem\n// page) to the output file; only that file is checked. The includes, the parsing and\n// the structure are up to you.\n//\n// Code you want to share between checkpoints can go in solutions/common/ (see the\n// README there). To start from ready-made input/output code instead, copy\n// starters/boilerplate/p08_outline_lines.cpp over this file.\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// Checkpoint 08 - Draw an outline with straight lines\n//\n// Problem:  problems/08-outline-lines.md (also in the web problem book)\n// Check:    .\\check 08\n//\n// Only the picture your program writes is checked, so structure this however you\n// like, or use another language or library (see README.md). The input/output code\n// at the bottom is provided so you can focus on drawOutline().\n\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n#include \"NotImplemented.h\"\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"provided/Canvas.h\"  // Canvas: drawLine, drawRect, writePng (checkpoint 06, ready-made)\n\nstruct Point {\n  double x = 0;  // font units; x grows to the right\n  double y = 0;  // font units; y grows upwards\n  bool onCurve = false;\n};\n\nstruct Outline {\n  std::vector<int> endPtsOfContours;  // index of the last point of each contour\n  std::vector<Point> points;\n};\n\n// Where the outline goes: font point (x, y) lands on pixel\n// (x0 + scale * x, baseline - scale * y), rounded to the nearest whole pixel.\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\nstruct Style {\n  int lineThickness = 1;  // passed to Canvas::drawLine\n  int markerSize = 1;     // width and height of the square drawn at every point\n};\n\n// Draws every contour as straight lines between consecutive points, closing it back\n// to its first point, then a markerSize square at every point. All in `color`.\nvoid drawOutline(Canvas& canvas, const Outline& outline, const Placement& place, const Style& style,\n                 const RGB color) {\n  // TODO: see \"What to draw\" on the problem page.\n  throw NotImplemented(\"drawOutline\");\n}\n\n// ---- Input/output (provided) -------------------------------------------------\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\n// Usage: p08 <input-file> <output-file.png>\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::unique_ptr<Canvas> canvas;\n    Placement place;\n    Style style;\n    RGB color{255, 255, 255};\n    Outline outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<Canvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness> <markerSize>\n        words >> style.lineThickness >> style.markerSize;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = Outline{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3) {\n          outline.points.push_back(Point{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        }\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        drawOutline(*canvas, outline, place, style, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    if (!canvas->writePng(argv[2])) throw std::runtime_error(std::string(\"cannot write \") + argv[2]);\n  } catch (const NotImplemented& e) {\n    std::cerr << \"not implemented: \" << e.what() << \"\\n\";\n    return 99;\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n","indent":2,"tags":[{"label":"Language","items":["nested loops over index ranges","wrapping an index back to the start","<code>std::lround<\/code>"],"text":["nested loops over index ranges","wrapping an index back to the start","std::lround"]},{"label":"Library","items":["<code>Canvas<\/code> from <code>include/provided/Canvas.h<\/code> (<code>drawLine<\/code>, <code>drawRect<\/code>, <code>writePng<\/code>)"],"text":["Canvas from include/provided/Canvas.h (drawLine, drawRect, writePng)"]},{"label":"Concepts","items":["glyph outlines and contours","font units vs pixels","flipping the y axis","scale and offset (a simple transform)"],"text":["glyph outlines and contours","font units vs pixels","flipping the y axis","scale and offset (a simple transform)"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads one or more glyph outlines and draws each one as straight lines between its points, with a small square on every point, and writes the picture as a PNG.<\/p>\n<p>Only the picture is checked, so you can structure the program however you like and use any language or library. The starter <code>solutions/p08_outline_lines.cpp<\/code> is a comment and an empty <code>main<\/code>: the includes, reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p08_outline_lines.cpp<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input, gives you a <code>Canvas<\/code> and writes the PNG; you fill in <code>drawOutline()<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The output file name ends in <code>.png<\/code>. The input file contains these lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>canvas &lt;w&gt; &lt;h&gt;<\/code><\/td><td>Always the first line: the picture is <code>w<\/code> x <code>h<\/code> pixels, all black.<\/td><\/tr><tr><td><code>place &lt;x0&gt; &lt;baseline&gt; &lt;scale&gt;<\/code><\/td><td>Where the following outlines go (see below).<\/td><\/tr><tr><td><code>style &lt;lineThickness&gt; &lt;markerSize&gt;<\/code><\/td><td>Line thickness and marker size, in pixels, for the following outlines.<\/td><\/tr><tr><td><code>color &lt;r&gt; &lt;g&gt; &lt;b&gt;<\/code><\/td><td>Colour of the following outlines.<\/td><\/tr><tr><td><code>outline<\/code><\/td><td>Starts an outline. An <code>ends<\/code> line and a <code>points<\/code> line follow.<\/td><\/tr><tr><td><code>ends &lt;e0&gt; &lt;e1&gt; ...<\/code><\/td><td>Index of the last point of each contour, in increasing order.<\/td><\/tr><tr><td><code>points &lt;x&gt; &lt;y&gt; &lt;on|off&gt; ...<\/code><\/td><td>Every point of the outline, in order, in font units.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>place<\/code>, <code>style<\/code> and <code>color<\/code> always come before the first <code>outline<\/code>, and may appear again between outlines; each outline uses the most recent ones. <code>ends<\/code> and <code>points<\/code> have exactly the format that checkpoint 7 prints, except that a coordinate may have a fractional part (e.g. <code>120.75<\/code>), as checkpoint 9 produces for scaled components. <code>x0<\/code>, <code>baseline<\/code> and <code>scale<\/code> may be fractional or negative; <code>lineThickness<\/code>, <code>markerSize<\/code>, <code>w<\/code>, <code>h<\/code> and colours are whole numbers.<\/p>\n<h3>Output<\/h3>\n<p>A PNG (or binary PPM) file, exactly <code>w<\/code> x <code>h<\/code> pixels, RGB. Pixel (0, 0) is the top-left corner and pixel y grows downwards. The boilerplate writes it with <code>Canvas::writePng<\/code>.<\/p>\n<p><strong>Writing the picture.<\/strong> Write it to the output path you're given. The name ends in <code>.png<\/code>, but the checker looks at the contents, so a PNG and a binary PPM both work. A binary PPM is the easiest to write by hand: the header <code>P6<\/code>, the width, the height and <code>255<\/code>, separated by spaces or newlines and ended by one newline (for example <code>P6\\n205 195\\n255\\n<\/code>), then 3 bytes per pixel (red, green, blue), row by row from the top-left. Open the file in binary mode (<code>std::ios::binary<\/code>), or Windows writes every pixel byte 10 as two bytes. For a real PNG, <code>stb_image_write.h<\/code> from <code>third_party/stb<\/code> is on the include path: <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>. <code>include/provided/Canvas.h<\/code> does all of this for you; the boilerplate uses it.<\/p>\n<h3>From font units to pixels<\/h3>\n<p>Font coordinates grow <strong>upwards<\/strong> from the baseline; pixel coordinates grow downwards from the top. A point (x, y) in font units lands on pixel<\/p>\n<pre><code>px = x0 + scale * x\npy = baseline - scale * y<\/code><\/pre>\n<p>rounded to the nearest whole number. So <code>x0<\/code> is the pixel column where font x = 0 lands, <code>baseline<\/code> is the pixel row where font y = 0 lands, and a point with a negative y (a descender, like the tail of <code>g<\/code>) ends up <strong>below<\/strong> the baseline row.<\/p>\n<h3>What to draw<\/h3>\n<p>For each outline, in input order:<\/p>\n<ol><li><strong>Lines.<\/strong> The <code>ends<\/code> values split the points into contours: contour 0 is points 0 to <code>e0<\/code>, contour 1 is points <code>e0 + 1<\/code> to <code>e1<\/code>, and so on. Within each contour, draw a line from every point to the next one, and from the <strong>last point back to the contour's first point<\/strong>. Never draw a line from one contour to the next. Use <code>Canvas::drawLine<\/code> (or your own from checkpoint 6) with thickness <code>lineThickness<\/code>.<\/li><li><strong>Markers.<\/strong> Then, on every point, draw a <code>markerSize<\/code> x <code>markerSize<\/code> square centred on it (<code>Canvas::drawRect<\/code>): columns x − size/2 up to x − size/2 + size − 1 with size/2 rounded down, and rows likewise. An odd size is exactly centred; an even size has one more pixel on the left and top, so a 10-pixel marker at x = 16 covers columns 11 to 20.<\/li><\/ol>\n<p>Everything is drawn in the outline's colour. Whether a point is <code>on<\/code> or <code>off<\/code> doesn't matter here: every point is joined by straight lines and gets a marker. Later outlines are drawn over earlier ones, though no test makes outlines of different colours overlap.<\/p>\n<h3>How the picture is compared<\/h3>\n<p>The checker compares your PNG with the expected picture pixel by pixel and forgives only an edge that moved by at most 1 pixel, so rounding a coordinate down instead of to the nearest still passes. A missing line, a line that shouldn't be there or a shape in the wrong place fails. When a test fails, the checker writes a diff picture: red where you have extra ink, blue where ink is missing, magenta for the wrong colour, yellow for forgiven pixels.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement it targets.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Point (x, y) is drawn at pixel (x0 + scale * x, baseline - scale * y), rounded, so the glyph is upright and sits on the baseline.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Every contour is closed: a line joins its last point to its first.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Contours are kept separate: no line joins the end of one contour to the start of the next.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Every point, on-curve or off-curve, gets a <code>markerSize<\/code> x <code>markerSize<\/code> square.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Several outlines on one canvas each use their own <code>place<\/code>, <code>style<\/code> and <code>color<\/code>.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>The scale is applied to every coordinate, including coordinates with a fractional part.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>w<\/code> and <code>h<\/code> are at most 600. Every outline fits inside the canvas.<\/li><li>An outline has at most a few hundred points; <code>ends<\/code> is increasing and its last value is the last point index.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 22 tests: glyphs from JetBrains Mono Bold (<code>-<\/code>, <code>A<\/code>, <code>B<\/code>, <code>D<\/code>, <code>S<\/code>, <code>a<\/code>, <code>g<\/code>, <code>o<\/code>), U+5341 十 and U+3042 あ from Noto Sans JP, hand-made outlines and 3 random outlines.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p08_outline_lines.cpp","text":"// Reference solution - checkpoint 08 (draw an outline with straight lines).\n// SPOILERS: try the checkpoint yourself first.\n\n#include <cmath>\n#include <cstdint>\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <utility>\n#include <vector>\n\n#define CANVAS_PNG_IMPLEMENTATION\n#include \"provided/Canvas.h\"  // Canvas: drawLine, drawRect, writePng (checkpoint 06, ready-made)\n\nstruct Point {\n  double x = 0;  // font units; x grows to the right\n  double y = 0;  // font units; y grows upwards\n  bool onCurve = false;\n};\n\nstruct Outline {\n  std::vector<int> endPtsOfContours;  // index of the last point of each contour\n  std::vector<Point> points;\n};\n\n// Where the outline goes: font point (x, y) lands on pixel\n// (x0 + scale * x, baseline - scale * y), rounded to the nearest whole pixel.\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\nstruct Style {\n  int lineThickness = 1;  // passed to Canvas::drawLine\n  int markerSize = 1;     // width and height of the square drawn at every point\n};\n\nnamespace {\n\n// Font units -> nearest pixel (y flipped: font y grows up, pixel y grows down).\nstd::pair<int, int> toPixel(const Point& p, const Placement& place) {\n  return {static_cast<int>(std::lround(place.x0 + place.scale * p.x)),\n          static_cast<int>(std::lround(place.baseline - place.scale * p.y))};\n}\n\n}  // namespace\n\nvoid drawOutline(Canvas& canvas, const Outline& outline, const Placement& place, const Style& style,\n                 const RGB color) {\n  int first = 0;\n  for (const int last : outline.endPtsOfContours) {\n    for (int i = first; i <= last; ++i) {\n      const int next = i == last ? first : i + 1;  // the last point closes the contour\n      const auto [ax, ay] = toPixel(outline.points[i], place);\n      const auto [bx, by] = toPixel(outline.points[next], place);\n      canvas.drawLine(ax, ay, bx, by, style.lineThickness, color);\n    }\n    first = last + 1;\n  }\n  for (const Point& p : outline.points) {  // markers on top of the lines\n    const auto [x, y] = toPixel(p, place);\n    canvas.drawRect(x, y, style.markerSize, style.markerSize, color);\n  }\n}\n\n// ---- Input/output (same as the starter) -----------------------------
