uct Point {\n  double x = 0;  // font units; x grows to the right\n  double y = 0;  // font units; y grows upwards\n  bool onCurve = false;\n};\n\nstruct Outline {\n  std::vector<int> endPtsOfContours;  // index of the last point of each contour\n  std::vector<Point> points;\n};\n\n// Where the outline goes: font point (x, y) lands on pixel\n// (x0 + scale * x, baseline - scale * y).\nstruct Placement {\n  double x0 = 0;\n  double baseline = 0;\n  double scale = 1;\n};\n\nstruct Vec2 {\n  double x = 0;\n  double y = 0;\n};\n\nconst RGB ON_CURVE_COLOR{255, 0, 0};   // red: on-curve points from the input\nconst RGB OFF_CURVE_COLOR{0, 255, 0};  // green: off-curve (control) points from the input\nconst RGB IMPLIED_COLOR{0, 0, 255};    // blue: on-curve points implied between two off-curve points\n\nnamespace {\n\nVec2 midpoint(const Vec2 a, const Vec2 b) { return {(a.x + b.x) / 2, (a.y + b.y) / 2}; }\n\n// Font units -> pixels, not rounded yet (y flipped: font y grows up, pixel y grows down).\nVec2 toPixel(const Point& p, const Placement& place) {\n  return {place.x0 + place.scale * p.x, place.baseline - place.scale * p.y};\n}\n\nvoid line(Canvas& canvas, const Vec2 a, const Vec2 b, const int thickness, const RGB color) {\n  canvas.drawLine(static_cast<float>(a.x), static_cast<float>(a.y), static_cast<float>(b.x),\n                  static_cast<float>(b.y), thickness, color);\n}\n\nvoid marker(Canvas& canvas, const Vec2 at, const int size, const RGB color) {\n  canvas.drawRect(static_cast<int>(std::lround(at.x)), static_cast<int>(std::lround(at.y)), size, size, color);\n}\n\n}  // namespace\n\nvoid drawQuadratic(Canvas& canvas, const Vec2 p0, const Vec2 p1, const Vec2 p2, const int thickness,\n                   const RGB color) {\n  // The control polygon is never shorter than the curve, so this gives at most\n  // about one pixel per piece.\n  const double length = std::hypot(p1.x - p0.x, p1.y - p0.y) + std::hypot(p2.x - p1.x, p2.y - p1.y);\n  const int pieces = std::max(1, static_cast<int>(std::ceil(length)));\n  Vec2 previous = p0;\n  for (int i = 1; i <= pieces; ++i) {\n    const double t = static_cast<double>(i) / pieces, u = 1 - t;\n    const Vec2 next{u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y};\n    line(canvas, previous, next, thickness, color);\n    previous = next;\n  }\n}\n\nvoid drawOutline(Canvas& canvas, const Outline& outline, const Placement& place, const int lineThickness,\n                 const RGB color) {\n  struct Marker {\n    Vec2 at;\n    RGB color;\n  };\n  std::vector<Marker> markers;\n  int first = 0;\n  for (const int last : outline.endPtsOfContours) {\n    const int n = last - first + 1;\n    const auto at = [&](const int k) { return toPixel(outline.points[first + k % n], place); };\n    const auto on = [&](const int k) { return outline.points[first + k % n].onCurve; };\n\n    // Start from an on-curve point. With none, start from the implied on-curve point\n    // between the last and the first point; every point is then visited once.\n    int k = 0;\n    while (k < n && !on(k)) ++k;\n    Vec2 current;\n    int stop;\n    if (k < n) {\n      current = at(k);\n      stop = k + n + 1;  // ends with the start point again, which closes the contour\n      ++k;\n    } else {\n      current = midpoint(at(n - 1), at(0));\n      k = 0;\n      stop = n;\n    }\n    while (k < stop) {\n      if (on(k)) {\n        line(canvas, current, at(k), lineThickness, color);\n        current = at(k);\n        ++k;\n      } else if (on(k + 1)) {  // off, on: one curve, and the on-curve point is used up\n        drawQuadratic(canvas, current, at(k), at(k + 1), lineThickness, color);\n        current = at(k + 1);\n        k += 2;\n      } else {  // off, off: the curve ends at the implied point halfway between them\n        const Vec2 implied = midpoint(at(k), at(k + 1));\n        drawQuadratic(canvas, current, at(k), implied, lineThickness, color);\n        current = implied;\n        ++k;\n      }\n    }\n\n    for (int i = 0; i < n; ++i) {\n      markers.push_back({at(i), on(i) ? ON_CURVE_COLOR : OFF_CURVE_COLOR});\n      if (!on(i) && !on(i + 1)) markers.push_back({midpoint(at(i), at(i + 1)), IMPLIED_COLOR});\n    }\n    first = last + 1;\n  }\n  for (const Marker& m : markers) marker(canvas, m.at, 2 * lineThickness, m.color);  // on top of every line\n}\n\n// ---- Input/output (same as the starter) --------------------------------------\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n\n  try {\n    std::unique_ptr<Canvas> canvas;\n    Placement place;\n    int lineThickness = 1;\n    RGB color{255, 255, 255};\n    Outline outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<Canvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness>\n        words >> lineThickness;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = Outline{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3) {\n          outline.points.push_back(Point{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        }\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        drawOutline(*canvas, outline, place, lineThickness, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    if (!canvas->writePng(argv[2])) throw std::runtime_error(std::string(\"cannot write \") + argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"proof":{"passed":27,"total":27,"date":"2026-10-21"},"uses":["include/provided/Canvas.h"]},"read":"<p>This page is complete on its own; the blog tells the story behind it. Read the blog's <strong>\"Renderer: Curve Rendering\"<\/strong> section through <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=TrueType%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">TrueType Bézier curves<\/a>, and stop at the sentence \"Let's put it into code.\" The author's code comes right after it.<\/p>","context":"<p>Checkpoint 8 joined every point of an outline with a straight line. Real glyphs are made of quadratic curves: an off-curve point pulls the outline toward itself without lying on it. This checkpoint draws outlines the way they are meant to look, using the curve formula from checkpoint 10. Checkpoints 13, 14 and 17 use the same pieces (lines and curves) to fill glyphs.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>: quadratic curves, on-curve and off-curve points, and the implied point between two off-curve points<\/li><li>FreeType, <a href=\"https://freetype.org/freetype2/docs/glyphs/glyphs-6.html\" target=\"_blank\" rel=\"noopener\">Glyph Conventions: outlines<\/a>: the same rules, with pictures<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/B%C3%A9zier_curve#Quadratic_B%C3%A9zier_curves\" target=\"_blank\" rel=\"noopener\">Bézier curve: quadratic curves<\/a><\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=TrueType%20B%C3%A9zier%20curves\" target=\"_blank\" rel=\"noopener\">TrueType Bézier curves<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 11                         run every test\n.\\check 11 -Case 11-R4-off-first   one test, showing its full input and where your picture is\n.\\check 11 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 11 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>Open your picture (<code>build/cases/11/&lt;id&gt;.out.png<\/code>) next to the expected one (<code>tests/11/expected/&lt;id&gt;.png<\/code>) and the diff the checker writes. A failing test looks like this:<\/p>\n<pre><code>  R3  Two off-curve points in a row: implied on-curve point halfway (blue) .    0 / 4   FAILED\n      x 11-R3-two-offs  hand-made: two off-curve points in a row, implied point between them\n          2263 pixels missing, e.g. (169, 9) should be blue; 2353 extra pixels, e.g. (306, 11) should be black (beyond the 1-pixel edge tolerance). Diff: build/cases/11/11-R3-two-offs.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven\n          likely cause: R3 - Two off-curve points in a row: implied on-curve point halfway (blue)\n          expected values from: hand-made outline; reference drawing, checked against fontTools&#x27; pieces and implied points\n          reproduce: build/p11.exe build/cases/11/11-R3-two-offs.in build/cases/11/11-R3-two-offs.out.png<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write <code>drawQuadratic()<\/code> first and test it on Example 1's numbers. Then copy your checkpoint 8 loop and change what happens at an off-curve point. Look at Example 1 and Example 3 in the expected pictures before you start: the blue markers show where curves join.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Convert the contour's points to pixels (as floats) and index them modulo the contour's length, so the point after the last is the first. Keep a <code>current<\/code> position: where the next piece starts. Find the first on-curve point and start there (or start at the midpoint of the last and first points if there is none). Then, for each point after the start, all the way round: an on-curve point ends a straight line; an off-curve point ends a curve at the next point if that is on-curve (skip it, it is used up) or at the midpoint with the next point. Each time, <code>current<\/code> becomes the end of what you drew. Collect the markers as you go and draw them after the loop.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Don't start the walk at point 0 with <code>current = (0, 0)<\/code>: a contour whose first point is off-curve then starts its first curve in the wrong place and loses its closing curve.<\/li><li>A contour can have no on-curve point at all (<code>fa-circle<\/code>, U+F111, is 8 off-curve points). Make sure your search for an on-curve start point doesn't loop forever or fall off the end.<\/li><li>After a curve that ends at a real on-curve point, don't draw a line to that point again.<\/li><li>The midpoint test also applies across the wrap: the last and first points of a contour are neighbours.<\/li><li>Draw markers after all lines, or later lines cross earlier markers.<\/li><li>Use the pixel positions for the piece count: <code>n<\/code> from font units would be far too many at a small scale (still correct, just slow) or too few at a large one.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>drawQuadratic(p0, p1, p2):\n    n = max(1, ceil(|p1 - p0| + |p2 - p1|))\n    prev = p0\n    for i in 1 .. n:\n        t = i / n\n        next = (1-t)² p0 + 2(1-t)t p1 + t² p2\n        drawLine(prev, next, lineThickness, color)\n        prev = next\n\ndrawOutline(outline):\n    markers = []\n    for each contour (pixel points q[0..m-1], q[k] means q[k mod m]):\n        s = index of the first on-curve point, or none\n        if s exists: current = q[s]; k = s + 1; stop = s + m + 1\n        else:        current = mid(q[m-1], q[0]); k = 0; stop = m\n        while k &lt; stop:\n            if q[k] is on:        drawLine(current, q[k]); current = q[k]; k += 1\n            elif q[k+1] is on:    drawQuadratic(current, q[k], q[k+1]); current = q[k+1]; k += 2\n            else:                 mid = mid(q[k], q[k+1]); drawQuadratic(current, q[k], mid); current = mid; k += 1\n        for i in 0 .. m-1:\n            add marker (q[i], red if on else green)\n            if q[i] and q[i+1] are both off: add marker (mid(q[i], q[i+1]), blue)\n    for each marker: drawRect(round(x), round(y), 2 * lineThickness, 2 * lineThickness, colour)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"two off-curve points in a row","test":"11-R3-two-offs","input":"canvas 344 344\nplace 12 332 0.8\nstyle 3\ncolor 255 255 255\noutline\nends 3\npoints 0 0 on 0 400 off 400 400 off 400 0 on","output":"a 344 x 344 PNG","image":null,"explain":"<figure clas K5CYII=\" alt=\"A white arch: two curves meeting at a blue marker at the top, closed by a straight line at the bottom\"><figcaption>tests/11/expected/11-R3-two-offs.png<\/figcaption><\/figure>\n<p>In pixels the points are A (12, 332) on, B (12, 12) off, C (332, 12) off and D (332, 332) on. B and C are both off-curve, so the outline passes through the implied point halfway between them, M = (172, 12). The pieces are:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Piece<\/th><th>From<\/th><th>Control<\/th><th>To<\/th><th>n<\/th><\/tr><\/thead><tbody><tr><td>curve<\/td><td>A (12, 332)<\/td><td>B (12, 12)<\/td><td>M (172, 12)<\/td><td>320 + 160 = 480<\/td><\/tr><tr><td>curve<\/td><td>M (172, 12)<\/td><td>C (332, 12)<\/td><td>D (332, 332)<\/td><td>160 + 320 = 480<\/td><\/tr><tr><td>line<\/td><td>D (332, 332)<\/td><td><\/td><td>A (12, 332)<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Then 6 x 6 markers: red on A and D, green on B and C, blue on M.<\/p>"},{"label":"Example 2","name":"a contour that starts off-curve","test":"11-R4-off-first","input":"canvas 384 294\nplace 12 282 0.9\nstyle 3\ncolor 255 220 0\noutline\nends 3\npoints 300 0 off 400 200 on 200 300 on 0 100 off","output":"a 384 x 294 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYAAAAEmCAIAAADk4NAbAAAE4klEQVR42u3XMXLjMAxAUd3/jL6LUqQzR3ZGIQGIeG9c7RZJSPCbPA4AAAAAAAAAAAAACHQOHwABAgQIICxA58uqAHkB+v0ArKzP61OAZAhYWZ8hNG//KENAUH2u/leGgKD6yBAQVJ+vQZEhIPTuI0NAlfrIEJBcHxkCkusjQ8D9WCxNmwwBa+8+MgTc6ULwj5MhUJ/QEMgQqE/y4ZchUJ/kMy9D0DpANR+DMgTqI0PAshP+iF9ShkB9ZAiYdKQfGk0ZgmfXZ4O7mwyBu48MAQ3qI0OgPjIE9K6PDIH6yBDQuz4yBOojQ8BwCK2A1QB3HxmCZucNGQLXHxmCNgcMGQJ3HxkC9UGGQH1kCNQHGYKpxwYZAvWRIWh2QpAhyDkbyBCojwyB+iBDoD4yBOqDDMHUcUeGIGHQkSFQH2SIZmONDIH6IEOoDzIEq8cXGQL1QYbw+EKGQH2QIdQHGQL1QYYQIGQIbo4gZsA84O6DDKE+yJDxwOMLGUJ9kCEDg8cXMoT6IEPg8YUMoT7IEHh8IUOoDzIE6oMMUWQ+QIZw/UGGUB+QIdQHGUKAQIaYuusgQ7j7YDJlyPUHZAj1waDKkMcXyBCuP5hbGVIfkCE8vjDJRlp9QIbw+EKGDLnrDxTI0PH+QX0
