i><strong>A real PNG<\/strong>: <code>third_party/stb_image_write.h<\/code> in your project is on the include path. <code>#define STB_IMAGE_WRITE_IMPLEMENTATION<\/code> before including it in one file, then call <code>stbi_write_png(path, width, height, 3, pixels, width * 3)<\/code>.<\/li><\/ul>\n<h3>The commands, in order<\/h3>\n<p>Draw the commands in the order they appear. A later command paints over an earlier one wherever they overlap.<\/p>\n<h3>Painting one pixel<\/h3>\n<p><code>point x y ...<\/code> paints a single pixel. If (x, y) is outside the picture (x &lt; 0, y &lt; 0, x ≥ w or y ≥ h), nothing happens.<\/p>\n<p>The rectangle and the line paint through this operation, so its bounds check does the <strong>clipping<\/strong> for every shape: a shape that crosses the edge of the picture keeps only its inside part.<\/p>\n<h3>Drawing a rectangle<\/h3>\n<p><code>rect cx cy w h ...<\/code> paints every pixel (x, y) with<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>from<\/th><th>to (included)<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td><code>cx - w/2<\/code><\/td><td><code>cx - w/2 + w - 1<\/code><\/td><\/tr><tr><td>y<\/td><td><code>cy - h/2<\/code><\/td><td><code>cy - h/2 + h - 1<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>where <code>w/2<\/code> and <code>h/2<\/code> round down. With an odd size the centre pixel sits in the middle; with an even size the left (or top) side gets one pixel more than the right (or bottom):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>w<\/th><th>columns, for cx = 100<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>100<\/td><\/tr><tr><td>4<\/td><td>98 ... 101<\/td><\/tr><tr><td>5<\/td><td>98 ... 102<\/td><\/tr><tr><td>50<\/td><td>75 ... 124<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Drawing a line<\/h3>\n<p><code>line ax ay bx by t ...<\/code> stamps one <code>t<\/code> x <code>t<\/code> square (centred like a rectangle) for every step along the line's longer direction:<\/p>\n<ol><li>If the line is <strong>steep<\/strong>, meaning |by - ay| &gt; |bx - ax|, swap the roles of x and y for the steps below (step along y instead of x).<\/li><li>Step from the end with the smaller x to the end with the larger x, <strong>both ends included<\/strong>. With x = the step and (x1, y1), (x2, y2) the two ends in that order, the other coordinate is <code>y1 + (y2 - y1) / (x2 - x1) * (x - x1)<\/code>, worked out in floating point and rounded to the nearest whole number.<\/li><li>At each step, draw a <code>t<\/code> x <code>t<\/code> rectangle centred on (x, y) (on (y, x) for a steep line, swapping back).<\/li><li>If both ends are the same pixel, the line is a single square.<\/li><\/ol>\n<p><strong>Rounding.<\/strong> Round to the nearest whole number. Truncating toward zero also passes, and a tie at .5 may go either way, because the checker forgives an edge that moves by one pixel. It doesn't forgive a missing piece, a gap or a shape in the wrong place.<\/p>\n<p><strong>The slope.<\/strong> Compute it in floating point: with ints, <code>(by - ay) / (bx - ax)<\/code> is integer division and loses the fraction.<\/p>\n<h3>How the picture is compared<\/h3>\n<p>The checker reads your PNG and compares it with the expected picture pixel by pixel. It forgives a differing pixel only when it belongs to an edge that moved by at most 1 pixel: extra ink next to the same ink in the expected picture, or missing ink with the same ink next to it in your picture. Every other difference counts, and every test allows 0 of them.<\/p>\n<p>If a test fails, the checker writes a diff picture:<\/p>\n<ul><li>red where you have extra ink;<\/li><li>blue where ink is missing;<\/li><li>magenta for the wrong colour;<\/li><li>yellow for forgiven pixels.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The picture is <code>w<\/code> x <code>h<\/code> pixels, black wherever no command paints, with (0, 0) at the top-left and y growing downwards.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>point<\/code> paints one pixel, in its colour.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>rect<\/code> covers columns <code>cx - w/2<\/code> to <code>cx - w/2 + w - 1<\/code> and rows likewise, for even and odd sizes.<\/span><\/li><li><span class=\"rid\">R4<\/span><span><code>line<\/code> works in every direction (shallow, steep, horizontal, vertical, either end first), with both ends included and no gaps, and a zero-length line is one square.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>line<\/code> stamps a <code>thickness<\/code> x <code>thickness<\/code> square at every step.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>A shape that crosses the edge of the picture keeps its inside part, and a shape with no pixel inside the picture draws nothing and doesn't crash your program.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Later commands paint over earlier ones.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>w<\/code> and <code>h<\/code> are between 1 and 600. Rectangle sizes and line thicknesses are between 1 and 600. Clip each rectangle's loops to the canvas rather than skipping pixels one by one: a thick line stamps one rectangle per step, and most of a big stamp can lie outside the canvas.<\/li><li>Coordinates are between -1000 and 1000, so a line has at most a few thousand steps.<\/li><li>At most 15 colours appear in one picture, each far from the others and from black.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 30 tests: the blog's demo, hand-made scenes for each requirement and 5 random scenes.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/FrameBufferCanvas.h","text":"#pragma once\n// Assignment 06: a picture in memory, a few ways to draw on it, and PNG output.\n\n#include <cstdint>\n#include <string>\n#include <vector>\n\nstruct RGB {\n  uint8_t r = 0, g = 0, b = 0;\n  bool operator==(const RGB&) const = default;\n};\n\nclass FrameBufferCanvas {\n public:\n  FrameBufferCanvas(int width, int height);  // every pixel starts black\n\n  [[nodiscard]] int width() const { return width_; }\n  [[nodiscard]] int height() const { return height_; }\n\n  // One pixel; (0, 0) is the top-left corner. It ignores pixels outside the canvas.\n  void set(int x, int y, RGB color);\n  [[nodiscard]] RGB get(int x, int y) const;\n\n  // A w x h rectangle centred on (cx, cy): columns cx - w/2 ... cx - w/2 + w - 1, rows likewise.\n  void drawRect(int cx, int cy, int w, int h, RGB color);\n\n  // A line from (ax, ay) to (bx, by), both ends included, drawn as thickness x thickness squares.\n  void drawLine(int ax, int ay, int bx, int by, int thickness, RGB color);\n\n  void writePng(const std::string& path) const;  // throws if the file can't be written\n\n private:\n  int width_;\n  int height_;\n  std::vector<RGB> pixels_;  // row by row, top row first\n};\n"},{"path":"src/FrameBufferCanvas.cpp","text":"#include \"FrameBufferCanvas.h\"\n\n#include <algorithm>\n#include <cmath>\n#include <cstdlib>\n#include <stdexcept>\n#include <utility>\n\n#define STB_IMAGE_WRITE_IMPLEMENTATION\n#pragma GCC diagnostic push\n#pragma GCC diagnostic ignored \"-Wall\"\n#pragma GCC diagnostic ignored \"-Wextra\"\n#pragma GCC diagnostic ignored \"-Wmissing-field-initializers\"\n#include \"stb_image_write.h\"\n#pragma GCC diagnostic pop\n\nstatic_assert(sizeof(RGB) == 3, \"RGB must be 3 tightly packed bytes for the PNG writer\");\n\nFrameBufferCanvas::FrameBufferCanvas(const int width, const int height)\n    : width_(width), height_(height), pixels_(static_cast<std::size_t>(width) * height) {}\n\nvoid FrameBufferCanvas::set(const int x, const int y, const RGB color) {\n  if (x < 0 || y < 0 || x >= width_ || y >= height_) return;\n  pixels_[static_cast<std::size_t>(y) * width_ + x] = color;\n}\n\nRGB FrameBufferCanvas::get(const int x, const int y) const {\n  return pixels_[static_cast<std::size_t>(y) * width_ + x];\n}\n\nvoid FrameBufferCanvas::drawRect(const int cx, const int cy, const int w, const int h, const RGB color) {\n  const int left = cx - w / 2, top = cy - h / 2;\n  // Clip the ranges first, so a huge or far-away rectangle costs nothing.\n  for (int y = std::max(top, 0); y < std::min(top + h, height_); ++y) {\n    for (int x = std::max(left, 0); x < std::min(left + w, width_); ++x) set(x, y, color);\n  }\n}\n\nvoid FrameBufferCanvas::drawLine(int ax, int ay, int bx, int by, const int thickness, const RGB color) {\n  // Step along the longer axis, so consecutive squares never leave a gap.\n  const bool steep = std::abs(by - ay) > std::abs(bx - ax);\n  if (steep) {\n    std::swap(ax, ay);\n    std::swap(bx, by);\n  }\n  if (ax > bx) {\n    std::swap(ax, bx);\n    std::swap(ay, by);\n  }\n  const double slope = bx == ax ? 0.0 : static_cast<double>(by - ay) / (bx - ax);\n  for (int x = ax; x <= bx; ++x) {\n    const int y = static_cast<int>(std::lround(ay + slope * (x - ax)));\n    if (steep) drawRect(y, x, thickness, thickness, color);\n    else drawRect(x, y, thickness, thickness, color);\n  }\n}\n\nvoid FrameBufferCanvas::writePng(const std::string& path) const {\n  if (!stbi_write_png(path.c_str(), width_, height_, 3, pixels_.data(), width_ * 3))\n    throw std::runtime_error(\"cannot write \" + path);\n}\n"},{"path":"assignments/assignment_06_canvas.cpp","text":"// Assignment 06 (draw on a framebuffer): draws a test input's points, rectangles and lines.\n// The canvas is src/FrameBufferCanvas.\n\n#include <fstream>\n#include <iostream>\n#include <optional>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"FrameBufferCanvas.h\"\n\nnamespace {\n\nRGB readColor(std::istream& words) {\n  int r = 0, g = 0, b = 0;\n  words >> r >> g >> b;\n  return RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::optional<FrameBufferCanvas> canvas;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;\n      if (keyword == \"canvas\") {\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas.emplace(w, h);\n        continue;\n      }\n      if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n      if (keyword == \"point\") {\n        int x = 0, y = 0;\n        words >> x >> y;\n        canvas->set(x, y, readColor(words));\n      } else if (keyword == \"rect\") {\n        int cx = 0, cy = 0, w = 0, h = 0;\n        words >> cx >> cy >> w >> h;\n        canvas->drawRect(cx, cy, w, h, readColor(words));\n      } else if (keyword == \"line\") {\n        int ax = 0, ay = 0, bx = 0, by = 0, thickness = 0;\n        words >> ax >> ay >> bx >> by >> thickness;\n        canvas->drawLine(ax, ay, bx, by, thickness, readColor(words));\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":[],"proof":{"passed":30,"total":30,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Preparation%20of%20a%20renderer\" target=\"_blank\" rel=\"noopener\">Preparation of a renderer<\/a> section up to and including the paragraph that starts \"The line drawing algorithm\", and stop before the author's code that follows it.<\/p>","readTitle":"Read in the blog first","context":"<p>In assignments 01 to 05 you read numbers out of the font file. Six later assignments draw pictures: outlines with straight lines (08) and with curves (11), filled glyphs (14, 16, 17) and a line of text (18). They all draw on the <strong>framebuffer<\/strong> you build here, in <code>src/FrameBufferCanvas.h<\/code> and <code>.cpp<\/code>. It is a grid of pixels in memory with three operations (paint one pixel, fill a rectangle, draw a thick line) and a way to save the grid as a PNG.<\/p>","sources":"<ul><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Digital_differential_analyzer_(graphics_algorithm\" target=\"_blank\" rel=\"noopener\">Digital differential analyzer (graphics algorithm)<\/a>): the line method used here<\/li><li>Wikipedia, <a href=\"https://en.wikipedia.org/wiki/Bresenham%27s_line_algorithm\" target=\"_blank\" rel=\"noopener\">Bresenham's line algorithm<\/a>: the same idea with integers only<\/li><li>stb, <a href=\"https://github.com/nothings/stb/blob/master/stb_image_write.h\" target=\"_blank\" rel=\"noopener\">stb_image_write.h<\/a>: the PNG writer (<code>third_party/stb<\/code>)<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Preparation%20of%20a%20renderer\" target=\"_blank\" rel=\"noopener\">Preparation of a renderer<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 06                         run every test\n.\\check 06 -Case 06-R4-short       one test, showing its full input and where your picture is\n.\\check 06 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 06 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>Open your picture (<code>build/cases/06/&lt;id&gt;.out.png<\/code>) next to the expected one (<code>tests/06/expected/&lt;id&gt;.png<\/code>) and the diff the checker writes. A failing test looks like this:<\/p>\n<pre><code>  R4  line in every direction (shallow, steep, axis-aligned), both ends... .    2 / 6   FAILED\n      x 06-R4-steep  steep lines (|slope| &gt; 1) going up and down: no gaps allowed\n          570 pixels missing, e.g. (20, 12) should be white (beyond the 1-pixel edge tolerance). Diff: build/cases/06/06-R4-steep.diff.png - red extra, blue missing, magenta wrong colour, yellow forgiven\n          likely cause: R4 - line in every direction (shallow, steep, axis-aligned), both ends included\n          expected values from: reference drawing, checked against the ideal shapes (exact pixels for point/rect, true segment for line)\n          reproduce: build/solutions/assignment_06.exe build/cases/06/06-R4-steep.in build/cases/06/06-R4-steep.out.png<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Get <code>set()<\/code> right first: it is the only function that touches the pixel array, so if it checks the bounds, nothing else has to. Then <code>drawRect()<\/code> is two loops calling <code>set()<\/code>, and <code>drawLine()<\/code> is one loop calling <code>drawRect()<\/code>.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Pixel (x, y) lives at index <code>y * width + x<\/code> of the vector. For the line, decide once whether it is steep, swap x and y of both ends if so, and swap the ends if the first has the larger x. After those swaps you have one case left: x goes up by 1 per step and y changes by <code>slope<\/code> per step, where <code>|slope| &lt;= 1<\/code>. Swap x and y back when you stamp the square.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Check <code>x &gt;= width<\/code>, not <code>x &gt; width<\/code>: index <code>y * width + width<\/code> is the first pixel of the next row (or past the end of the vector on the last row).<\/li><li>Without the steep swap, a line close to vertical comes out as a few dots.<\/li><li><code>(by - ay) / (bx - ax)<\/code> with ints is integer division. Convert to <code>double<\/code> first.<\/li><li>A zero-length line has <code>bx - ax == 0<\/code>. Don't divide by it; draw one square.<\/li><li><code>w / 2<\/code> for the rectangle is integer division on purpose: it rounds down.<\/li><li>Loop <code>x &lt;= bx<\/code>, not <code>x &lt; bx<\/code>, or the last end goes missing.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>set(x, y, c):\n    if 0 &lt;= x &lt; width and 0 &lt;= y &lt; height: pixels[y * width + x] = c\n\ndrawRect(cx, cy, w, h, c):\n    left = cx - w / 2;  top = cy - h / 2          # integer division\n    for y in top .. top + h - 1:\n        for x in left .. left + w - 1: set(x, y, c)\n\ndrawLine(ax, ay, bx, by, t, c):\n    steep = |by - ay| &gt; |bx - ax|\n    if steep: swap(ax, ay); swap(bx, by)\n    if ax &gt; bx: swap(ax, bx); swap(ay, by)\n    slope = (bx == ax) ? 0 : (by - ay) / double(bx - ax)\n    for x in ax .. bx:\n        y = round(ay + slope * (x - ax))\n        if steep: drawRect(y, x, t, t, c) else: drawRect(x, y, t, t, c)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the blog's demo scene","test":"06-E2E-blog-demo","input":"canvas 500 500\nline 100 100 300 400 5 255 255 255\nline 400 200 50 300 2 200 0 0\nrect 200 400 50 50 0 200 0","output":"a 500 x 500 PNG","image":null,"explain":"<figure class=\"pic\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAH0CAIAAABEtEjdAAAGkklEQVR42u3dQWrDUBAFQd//ZL5VskogiyAHHFozvwqfYCyahzZ6PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAt/n4yUEAFsZd3wHEHYAhcdd3gJ1x13cA4x0A4x0AfQfgzX13FgDjHQB9ByDsu7MAGO8A6DsAYd+dBcB4B0DfAQj77iwAxjsA+g5A2HdnATDeAdB3AMK+OwuA8Q6AvgMQ9t1ZAIx3APQdgLDvzgJgvAOg7wCEfXcWAOMdAH0HIOy7swAY7wDoOwBh350FwHgHQN8BCPvuLADGOwD6DkDYd2cBMN4B0HcAwr47C4DxDoC+AxD23VkAjHcA9B2AsO/OAmC8A6DvAIR9dxYA4x0AfQcg7LuzABjvAOg7AGHfnQXAeAdA3wEI++4sAMY7APoOQNh3ZwEw3gHQdwDCvjsLgPEOgL4DEPbdWQCMdwD0HYCw784CYLwDoO8AhH13FgDjHQB9ByDsu7MAGO8A6DsAYd+dBcB4B0DfAQj77iwAxjsA+g5A2HdnATDeAdB3AMK+OwuA8Q6AvgMQ9t1ZAIx3APQdgLDvzsIUz68fYLyzJOhPcQd9Z2XTZR3+3HdnQdDBeAdNB30HQYew786CpoPxDoIO+o6muwuEfXcWBB2MdzRd00HfEXQg7LuzoOlgvCPogL6j6UDYd2cRdEEH4x1NB/QdQQfCvjuLpgPGO4IO6DuaDoR9dxZBB4x3NB3QdwQdCPvuLJoOGO8IOqDvaDoQ9t1ZBB0w3tF0QN8FHSDsu7NoOmC8C7qgA/qu6QBh351F0AHjXdMB9F3QAcK+azqA8S7oAPqu6QBh3wUdwHjXdAB9F3SAsO+aDmC8CzqAvms6QNh3QQcw3jUdQN8FHSDsu6YDGO+CDnBA3zUd4L59F3SAQ8e7pgMs6bugA4zvu6YDbIu7oAPs6bumAyzxW9BP+5Q2wP6mH/IpbYDNQf92yKe0AY5o+uOq724IMC/ol3HXd4CRTdd3gIVBf6XvTg0wsunGO8C2oOs7wNqmX/bd3wEwL+jGO8DOpus7wMKgv9J3/xrAyKYb7wDbgq7vAGubftl3/ywg6LM/fGG8A5q+82NG+g4I+s6v04k7oOmnxF3fAUHXdwBNn9N3Dwkg6MY7gKbrO4Cgh313FkDTjXcAQdd3AE0P++4sgKAb7wCaru+AoBP23VkATTfeAUEXdH0HNJ2w784CCLrxDmg6+g4IOmHfnQU0XdONd0DQ0XdA0wn77iwg6BjvgKaj74CgE/bdWWBw1sF4hyVxB30HOLrvzgJgvAOg7wCEfXcWAOMdAH0HIOy7swAY7wDoOwBh350FwHgHQN8BCPvuLADGOwD6DkDYd2cBMN4B0HcAwr47C4DxDoC+AxD23VkAjHcA9B2AsO/OAmC8A6DvAIR9dxYA4x0AfQcg7LuzABjvAOg7AGHfnQXAeAdA3wEI++4sAMY7APoOQNh3ZwEw3gHQdwDCvjsLgPEOgL4DEPbdWQCMdwD0HYCw784CYLwDoO8AhH13FgDjHQB9ByDsu7MAGO8A6DsAYd+dBcB4B0DfAQj77iwAxjsA+g5A2HdnATDeAdB3AMK+OwuA8Q6AvgMQ9t1ZAIx3APQdgLDvzgJgvAP8n+ctf/oOIO636rtnChD3hXHXd0DcZ8dd3wFx3xl3L2cAcT8o7voOiPvsuOs7IO474+7lDCDuB8Vd3wFxnx13fQfEfWfcvZwBxP2guOs7IO6z467vgLjvjLuXM4C4HxR3fQfEXd8BxN3LGQBxN94BcRd3fQfEXdy9nAHE/cy46zsg7voOIO5ezgCIu/EOiLu4G++AuIv7Vd89gIC4izuAuE/ouwcQEHcAxB1A3MUdQNzFHUDcxR1A3AEQdwDEHUDcxR1A3MUdQNzFHUDcARB3AHEXdwBxF3cAcRd3AHEHQNwBEHcAcRd3AHEXdwBxF3cAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAuLtPv18OWrCFegUAAAAASUVORK5CYII=\" alt=\"The blog&#x27;s demo: a thick white line, a thin red line crossing it, and a green square\"><figcaption>tests/06/expected/06-E2E-blog-demo.png<\/figcaption><\/figure>\n<p>The white line is steep (it moves 300 down and 200 across), so it steps along y. The red line goes right to left, so your program swaps its ends before stepping along x. The red line is on top where the two cross, because it comes later.<\/p>"},{"label":"Example 2","name":"even-sized rectangles","test":"06-R3-even","input":"canvas 220 140\nrect 60 70 50 50 0 200 0\nrect 160 40 20 8 255 120 170\nrect 160 100 2 2 255 255 255\npoint 60 70 255 255 255\npoint 160 40 60 120 255","output":"a 220 x 140 PNG","image":null,"explain":"<p>The green square covers columns 60 - 25 = 35 to 35 + 49 = 84 and rows 45 to 94: 25 pixels left of the centre column, 24 to the right. The pink bar covers columns 150 to 169 and rows 36 to 43. The 2 x 2 square covers columns 159 to 160 and rows 99 to 100. The two points come last, so they show on top of the rectangles' centres.<\/p>"},{"label":"Example 3","name":"lines 1 to 3 pixels long","test":"06-R4-short","input":"canvas 120 80\nline 10 10 11 10 1 255 255 255\nline 30 10 30 12 1 200 0 0\nline 50 10 52 13 1 0 200 0\nline 80 13 77 10 1 255 220 0\nline 10 50 13 49 1 0 220 220\nline 60 60 59 57 1 255 120 170","output":"a 120 x 80 PNG","image":null,"explain":"<p>Take the green line from (50, 10) to (52, 13). It moves 3 down and 2 across, so it is steep: step y from 10 to 13 and work out x = 50 + 2/3 * (y - 10).<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>y<\/th><th>x before rounding<\/th><th>x rounded<\/th><th>pixel<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>50<\/td><td>50<\/td><td>(50, 10)<\/td><\/tr><tr><td>11<\/td><td>50.67<\/td><td>51<\/td><td>(51, 11)<\/td><\/tr><tr><td>12<\/td><td>51.33<\/td><td>51<\/td><td>(51, 12)<\/td><\/tr><tr><td>13<\/td><td>52<\/td><td>52<\/td><td>(52, 13)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Without the swap you would step x from 50 to 52 and paint only 3 pixels, leaving a gap.<\/p>"}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Preparation%20of%20a%20renderer\" target=\"_blank\" rel=\"noopener\">The blog's first <code>FrameBufferCanvas<\/code><\/a> is a class that owns a one-dimensional vector of <code>RGB<\/code> pixels. <code>set<\/code> writes one pixel and ignores coordinates outside the picture, <code>drawRect<\/code> takes the centre and size, and <code>drawLine<\/code> does the steep swap, orders the ends and stamps a <code>drawRect<\/code> at every step. A second <code>drawLine<\/code> takes 2D vectors, which keeps the glyph code in later sections short, and <code>writePngFile<\/code> hands the buffer to <code>stbi_write_png<\/code> with 3 channels. Its <code>main<\/code> draws the scene from Example 1.<\/p>\n<p><strong>Something to look for:<\/strong> the snippet turns the stepped coordinate into a pixel with a plain cast, which truncates toward zero instead of rounding, so its lines can sit up to a pixel to one side, and the tests accept both. It also divides by <code>bx - ax<\/code> without checking, so a zero-length line divides by zero; this page asks for one square instead.<\/p>"}},{"id":"07","num":"7","title":"Decode simple glyphs","difficulty":"Medium","tests":151,"problem":"problems/07-simple-glyph.md","entry":"solutions/assignments/assignment_07_simple_glyph.cpp","files":[{"path":"solutions/assignments/assignment_07_simple_glyph.cpp","role":"entry","purpose":null,"job":"For each `font` line, open that file with your `ByteReader`. For each `glyph` line, decode the record it points to and write `empty`, `compound`, or the three lines of a simple glyph, as Output shows.","blank":"// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 07 as `build/solutions/assignment_07.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 07`, or use Run and Submit in the book.\n//\n// Your job:\n//   For each `font` line, open that file with your `ByteReader`. For each `glyph` line,\n//   decode the record it points to and write `empty`, `compound`, or the three lines of a\n//   simple glyph, as Output shows.\n//\n// The other files of this assignment:\n//   You also write src/GlyphComponent.h, src/Glyph.h, src/font/GlyphParser.h and\n//   src/font/GlyphParser.cpp in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h.\n//   Include them by their path under src/, e.g. #include \"GlyphComponent.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 07 as `build/solutions/assignment_07.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 07`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/GlyphComponent.h, src/Glyph.h, src/font/GlyphParser.h and\n//   src/font/GlyphParser.cpp in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/font/ByteReader.h.\n//   Include them by their path under src/, e.g. #include \"GlyphComponent.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"font/GlyphParser.h\"\n\nnamespace {\n\nvoid write(std::ostream& out, const uint32_t id, const Glyph& g) {\n  out << \"glyph \" << id;\n  if (g.kind == Glyph::Kind::Empty) {\n    out << \" empty\\n\";\n    return;\n  }\n  if (g.kind == Glyph::Kind::Compound) {\n    out << \" compound\\n\";\n    return;\n  }\n  const BoundingRect& b = g.bounds;\n  out << \" contours \" << g.numberOfContours << \" bbox \" << b.xMin << ' ' << b.yMin << ' ' << b.xMax << ' '\n      << b.yMax << \"\\nends\";\n  const GlyphComponent& outline = g.components.front();\n  for (const int end : outline.endPtsOfContours) out << ' ' << end;\n  out << \"\\npoints\";\n  for (const GlyphPoint& p : outline.points)\n    out << ' ' << static_cast<int>(p.x) << ' ' << static_cast<int>(p.y) << (p.onCurve ? \" on\" : \" off\");\n  out << '\\n';\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<ByteReader> font;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::make_unique<ByteReader>(path);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0, offset = 0, length = 0;\n        words >> id >> offset >> length;\n        if (!font) throw std::runtime_error(\"a `glyph` line before the `font` line\");\n        write(output, id, readGlyph(*font, offset, length));\n      }\n    }\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/GlyphComponent.h","role":"new","purpose":"Every outline in the project takes this form: its points (x and y in font units, on or off the curve) and the index where each contour ends. Assignments 08 and 11 draw outlines in this form, 09 produces one per part of a compound glyph, and 14, 16 and 17 fill them.","job":"Declare a point type (x, y and whether it is on the curve) and an outline type that holds the contour end indices and the list of points. Give x and y a type that can hold fractions, such as `double`: assignment 08 reads coordinates like `120.75` and assignment 09 scales points.","blank":"#pragma once\n// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Every outline in the project takes this form: its points (x and y in font units, on or\n//   off the curve) and the index where each contour ends. Assignments 08 and 11 draw\n//   outlines in this form, 09 produces one per part of a compound glyph, and 14, 16 and 17\n//   fill them.\n//\n// Your job:\n//   Declare a point type (x, y and whether it is on the curve) and an outline type that\n//   holds the contour end indices and the list of points. Give x and y a type that can\n//   hold fractions, such as `double`: assignment 08 reads coordinates like `120.75` and\n//   assignment 09 scales points.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   Every outline in the project takes this form: its points (x and y in font units, on or\n//   off the curve) and the index where each contour ends. Assignments 08 and 11 draw\n//   outlines in this form, 09 produces one per part of a compound glyph, and 14, 16 and 17\n//   fill them.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <vector>\n\nstruct GlyphPoint {\n  double x = 0;  // font units; x grows to the right\n  double y = 0;  // font units; y grows upwards\n  bool onCurve = false;\n};\n\n// Contours are runs of points: contour k ends at point endPtsOfContours[k].\nstruct GlyphComponent {\n  std::vector<int> endPtsOfContours;\n  std::vector<GlyphPoint> points;\n};\n"},{"path":"solutions/src/Glyph.h","role":"new","purpose":"This type holds a glyph as the glyf table stores it: whether it is empty, simple or compound, its contour count, its bounding box and, for a simple glyph, its outline. Your `GlyphParser` returns it, and in assignment 09 you use its kind to tell simple glyphs from compound ones.","job":"Declare a glyph type that records which of the three kinds it is (empty, simple or compound) and holds `numberOfContours`, the bounding box (`xMin`, `yMin`, `xMax`, `yMax`) and, for a simple glyph, its outline in the form from `GlyphComponent.h`.","blank":"#pragma once\n// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This type holds a glyph as the glyf table stores it: whether it is empty, simple or\n//   compound, its contour count, its bounding box and, for a simple glyph, its outline.\n//   Your `GlyphParser` returns it, and in assignment 09 you use its kind to tell simple\n//   glyphs from compound ones.\n//\n// Your job:\n//   Declare a glyph type that records which of the three kinds it is (empty, simple or\n//   compound) and holds `numberOfContours`, the bounding box (`xMin`, `yMin`, `xMax`,\n//   `yMax`) and, for a simple glyph, its outline in the form from `GlyphComponent.h`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   This type holds a glyph as the glyf table stores it: whether it is empty, simple or\n//   compound, its contour count, its bounding box and, for a simple glyph, its outline.\n//   Your `GlyphParser` returns it, and in assignment 09 you use its kind to tell simple\n//   glyphs from compound ones.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <vector>\n\n#include \"GlyphComponent.h\"\n\nstruct BoundingRect {\n  int xMin = 0, yMin = 0, xMax = 0, yMax = 0;\n};\n\nstruct Glyph {\n  enum class Kind { Empty, Simple, Compound };\n  Kind kind = Kind::Empty;\n  int numberOfContours = 0;  // negative for a compound glyph\n  BoundingRect bounds;\n  // A simple glyph has one component. A compound glyph is made of other glyphs;\n  // resolveGlyph (assignment 09) turns it into one component per part.\n  std::vector<GlyphComponent> components;\n};\n"},{"path":"solutions/src/font/GlyphParser.h","role":"new","purpose":"The parser decodes one glyph record from the glyf table into the types in `Glyph.h`: the header of any glyph, and the contours and points of a simple one. In assignment 09 you call it for every simple glyph inside a compound glyph.","job":"Declare one function that decodes the glyph record at a given offset and length, reading through your `ByteReader` from assignment 01, and returns a glyph from `Glyph.h`.","blank":"#pragma once\n// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The parser decodes one glyph record from the glyf table into the types in `Glyph.h`:\n//   the header of any glyph, and the contours and points of a simple one. In assignment 09\n//   you call it for every simple glyph inside a compound glyph.\n//\n// Your job:\n//   Declare one function that decodes the glyph record at a given offset and length,\n//   reading through your `ByteReader` from assignment 01, and returns a glyph from\n//   `Glyph.h`.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The parser decodes one glyph record from the glyf table into the types in `Glyph.h`:\n//   the header of any glyph, and the contours and points of a simple one. In assignment 09\n//   you call it for every simple glyph inside a compound glyph.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <cstdint>\n\n#include \"Glyph.h\"\n#include \"font/ByteReader.h\"\n\n// The glyph whose record starts at `offset` (a length of 0 means no outline). A compound\n// glyph comes back with its kind and bounds only; see resolveGlyph for its parts.\nGlyph readGlyph(ByteReader& reader, uint32_t offset, uint32_t length);\n"},{"path":"solutions/src/font/GlyphParser.cpp","role":"new","purpose":"The parser decodes one glyph record from the glyf table into the types in `Glyph.h`: the header of any glyph, and the contours and points of a simple one. In assignment 09 you call it for every simple glyph inside a compound glyph.","job":"Implement the glyph decoder as \"The glyph record you are decoding\" lays out. Length 0 gives an empty glyph. A negative `numberOfContours` gives a compound glyph, and you stop reading after the header. For a simple glyph, read the contour ends and every point, with absolute coordinates and the point's own on/off flag.","blank":"// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The parser decodes one glyph record from the glyf table into the types in `Glyph.h`:\n//   the header of any glyph, and the contours and points of a simple one. In assignment 09\n//   you call it for every simple glyph inside a compound glyph.\n//\n// Your job:\n//   Implement the glyph decoder as \"The glyph record you are decoding\" lays out. Length 0\n//   gives an empty glyph. A negative `numberOfContours` gives a compound glyph, and you\n//   stop reading after the header. For a simple glyph, read the contour ends and every\n//   point, with absolute coordinates and the point's own on/off flag.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"// ======================================================================================\n// Assignment 07: Decode simple glyphs\n// Problem: problems/07-simple-glyph.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The parser decodes one glyph record from the glyf table into the types in `Glyph.h`:\n//   the header of any glyph, and the contours and points of a simple one. In assignment 09\n//   you call it for every simple glyph inside a compound glyph.\n//\n// Your job:\n//   Implement the glyph decoder as \"The glyph record you are decoding\" lays out. Length 0\n//   gives an empty glyph. A negative `numberOfContours` gives a compound glyph, and you\n//   stop reading after the header. For a simple glyph, read the contour ends and every\n//   point, with absolute coordinates and the point's own on/off flag. The Boilerplate\n//   gives you the declarations; fill in each TODO.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include \"font/GlyphParser.h\"\n\n#include <stdexcept>\n\nGlyph readGlyph(ByteReader& reader, const uint32_t offset, const uint32_t length) {\n  // TODO: decode the record (layout and rules are on the problem page). A simple glyph's\n  // outline goes in g.components[0]; for a compound glyph, set its kind and stop.\n  throw std::logic_error(\"not implemented: readGlyph\");\n}\n"}],"buildsOn":[{"path":"solutions/src/font/ByteReader.h","owner":"01","purpose":"This header declares your reader for big-endian numbers at any position in a font file: unsigned and signed integers of 8, 16 and 32 bits, and F2Dot14 fixed point. Every later assignment that reads the font goes through it: assignment 02 reads the table directory, 03 to 05 the `cmap`, `loca` and metrics tables, and 07 and 09 the glyph outlines."}],"indent":2,"tags":[{"label":"Language","items":["bit flags and masks","signed vs unsigned integers (<code>int16<\/code>, <code>uint8<\/code>)","running sums","binary file I/O (<code>seekg<\/code>, <code>get<\/code>)"],"text":["bit flags and masks","signed vs unsigned integers (int16, uint8)","running sums","binary file I/O (seekg, get)"]},{"label":"Library","items":["<code>std::ifstream<\/code> in binary mode","<code>std::vector<\/code>"],"text":["std::ifstream in binary mode","std::vector"]},{"label":"Concepts","items":["glyph outlines","contours","on-curve and off-curve points","delta encoding","run-length encoding","big-endian byte order"],"text":["glyph outlines","contours","on-curve and off-curve points","delta encoding","run-length encoding","big-endian byte order"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that decodes glyph records in font files and prints each glyph's outline: where its contours end and where every point is.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains two kinds of lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>font &lt;path&gt;<\/code><\/td><td>The file that the following <code>glyph<\/code> lines refer to. The path is relative to the workbook folder and contains no spaces. This line may appear more than once.<\/td><\/tr><tr><td><code>glyph &lt;id&gt; &lt;offset&gt; &lt;length&gt;<\/code><\/td><td>A glyph record <code>length<\/code> bytes long, starting at byte <code>offset<\/code> of the current file. <code>id<\/code> is a non-negative whole number used as a label: print it back unchanged.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Your <code>Loca<\/code> from assignment 04 works out these offsets and lengths, so you need no other table here.<\/p>\n<ul><li>You only need <code>length<\/code> to tell whether there is a record at all (0 means none). Records are well-formed, so you don't have to bounds-check against it.<\/li><li>Some test files are real fonts. Others are hand-made files that contain one glyph record at offset 0.<\/li><\/ul>\n<h3>Output<\/h3>\n<p>For each <code>glyph<\/code> line, in input order, write one of three things:<\/p>\n<ul><li><strong>Length 0<\/strong> (the glyph has no outline, e.g. the space character): <code>glyph &lt;id&gt; empty<\/code><\/li><li><strong><code>numberOfContours<\/code> &lt; 0<\/strong> (a compound glyph): <code>glyph &lt;id&gt; compound<\/code>, without decoding the rest of the record.<\/li><li><strong>Otherwise<\/strong> (a simple glyph), three lines:<\/li><\/ul>\n<pre><code>glyph &lt;id&gt; contours &lt;numberOfContours&gt; bbox &lt;xMin&gt; &lt;yMin&gt; &lt;xMax&gt; &lt;yMax&gt;\nends &lt;endPtsOfContours[0]&gt; &lt;endPtsOfContours[1]&gt; ...\npoints &lt;x0&gt; &lt;y0&gt; &lt;on|off&gt; &lt;x1&gt; &lt;y1&gt; &lt;on|off&gt; ...<\/code><\/pre>\n<ul><li><code>ends<\/code> lists the <code>endPtsOfContours<\/code> values in the order they appear in the file.<\/li><li><code>points<\/code> gives every point in order as <strong>absolute<\/strong> coordinates in font units. Each is followed by <code>on<\/code> if it is an <strong>on-curve point<\/strong> (the outline passes through it) or <code>off<\/code> if it is an <strong>off-curve point<\/strong>, also called a control point (it bends a curve without lying on it).<\/li><li>If <code>numberOfContours<\/code> is 0 (no test has one), print the header line, then <code>ends<\/code> and <code>points<\/code> with nothing after them.<\/li><li>Separate words with spaces; the checker ignores extra whitespace.<\/li><\/ul>\n<figure class=\"split-figure\">\n<svg viewBox=\"-30 -30 660 800\" role=\"img\" aria-label=\"The outline of A in JetBrains Mono Bold, drawn from its 17 decoded points\"><rect x=\"35\" y=\"0\" width=\"530\" height=\"730\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"4\" stroke-dasharray=\"14 10\"/><line x1=\"-30\" y1=\"730\" x2=\"630\" y2=\"730\" stroke=\"var(--muted)\" stroke-width=\"3\"/><polygon points=\"35,730 219,0 380,0 565,730 437,730 397,553 203,553 163,730\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/><polygon points=\"226,451 374,451 330,255 319,206 303,127 300,109 297,127 281,206 270,254\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"5\" stroke-linejoin=\"round\"/><g fill=\"var(--fig-a)\"><circle cx=\"35\" cy=\"730\" r=\"13\"/><circle cx=\"219\" cy=\"0\" r=\"13\"/><circle cx=\"380\" cy=\"0\" r=\"13\"/><circle cx=\"565\" cy=\"730\" r=\"13\"/><circle cx=\"437\" cy=\"730\" r=\"13\"/><circle cx=\"397\" cy=\"553\" r=\"13\"/><circle cx=\"203\" cy=\"553\" r=\"13\"/><circle cx=\"163\" cy=\"730\" r=\"13\"/><circle cx=\"226\" cy=\"451\" r=\"13\"/><circle cx=\"374\" cy=\"451\" r=\"13\"/><circle cx=\"330\" cy=\"255\" r=\"13\"/><circle cx=\"300\" cy=\"109\" r=\"13\"/><circle cx=\"270\" cy=\"254\" r=\"13\"/><\/g><g fill=\"var(--surface)\" stroke=\"var(--fig-b)\" stroke-width=\"6\"><circle cx=\"319\" cy=\"206\" r=\"11\"/><circle cx=\"303\" cy=\"127\" r=\"11\"/><circle cx=\"297\" cy=\"127\" r=\"11\"/><circle cx=\"281\" cy=\"206\" r=\"11\"/><\/g><\/svg>\n<figcaption><p>What the output describes: <code>A<\/code> is glyph 37, with two contours (<code>ends 7 16<\/code>) and 17 points, joined here with straight lines as assignment 08 will draw them. The four off-curve points at the top of the inner triangle are what assignment 11 turns into a curve.<\/p><div class=\"legend\"><span><span class=\"dot a\"><\/span>on-curve point<\/span><span><span class=\"dot b\"><\/span>off-curve (control) point<\/span><span>dashed: bbox 35 0 565 730<\/span><\/div><\/figcaption>\n<\/figure>\n<h3>The glyph record you are decoding<\/h3>\n<p>All numbers are <strong>big-endian<\/strong>: the most significant byte comes first.<\/p>\n<p><strong>Header<\/strong>, 10 bytes:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>numberOfContours<\/code><\/td><td>int16<\/td><td>≥ 0: a simple glyph (this assignment). &lt; 0: a compound glyph<\/td><\/tr><tr><td><code>xMin<\/code>, <code>yMin<\/code>, <code>xMax<\/code>, <code>yMax<\/code><\/td><td>int16 each<\/td><td>Bounding box in font units<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Simple-glyph description<\/strong>, starting at byte 10 of the record:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Type<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>endPtsOfContours[numberOfContours]<\/code><\/td><td>uint16 each<\/td><td>Index of the last point of each contour, in increasing order<\/td><\/tr><tr><td><code>instructionLength<\/code><\/td><td>uint16<\/td><td>Number of hinting-instruction bytes that follow<\/td><\/tr><tr><td><code>instructions[instructionLength]<\/code><\/td><td>uint8 each<\/td><td>Hinting bytecode, which you skip<\/td><\/tr><tr><td><code>flags[]<\/code><\/td><td>uint8 each<\/td><td>One flag per point, compressed (see below)<\/td><\/tr><tr><td><code>xCoordinates[]<\/code><\/td><td>0, 1 or 2 bytes per point<\/td><td>Every point's x, delta-encoded<\/td><\/tr><tr><td><code>yCoordinates[]<\/code><\/td><td>0, 1 or 2 bytes per point<\/td><td>Every point's y, delta-encoded<\/td><\/tr><\/tbody><\/table><\/div>\n<p>The record has no point count: work it out as <code>endPtsOfContours[last] + 1<\/code>. A record may end with up to 3 padding bytes, which you can ignore.<\/p>\n<p><strong>Flag bits:<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bit<\/th><th>Mask<\/th><th>Name<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>0x01<\/code><\/td><td>ON_CURVE_POINT<\/td><td>The point is on the curve; otherwise it is a control point<\/td><\/tr><tr><td>1<\/td><td><code>0x02<\/code><\/td><td>X_SHORT_VECTOR<\/td><td>The x delta is 1 byte (unsigned)<\/td><\/tr><tr><td>2<\/td><td><code>0x04<\/code><\/td><td>Y_SHORT_VECTOR<\/td><td>The y delta is 1 byte (unsigned)<\/td><\/tr><tr><td>3<\/td><td><code>0x08<\/code><\/td><td>REPEAT_FLAG<\/td><td>The next byte says how many <strong>more<\/strong> points use this same flag<\/td><\/tr><tr><td>4<\/td><td><code>0x10<\/code><\/td><td>X_IS_SAME_OR_POSITIVE_X_SHORT_VECTOR<\/td><td>Meaning depends on bit 1 (table below)<\/td><\/tr><tr><td>5<\/td><td><code>0x20<\/code><\/td><td>Y_IS_SAME_OR_POSITIVE_Y_SHORT_VECTOR<\/td><td>Meaning depends on bit 2 (table below)<\/td><\/tr><tr><td>6, 7<\/td><td><\/td><td><\/td><td>Ignore<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Reading one coordinate.<\/strong> The table shows x; y works the same way with bits 2 and 5.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bit 1 (short)<\/th><th>Bit 4<\/th><th>Bytes read<\/th><th>Delta<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>1, uint8<\/td><td>+value<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1, uint8<\/td><td>−value<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>none<\/td><td>0, meaning \"same as the previous point\"<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>2, int16<\/td><td>value (already signed)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A <strong>delta<\/strong> is a change in position: the file stores each point's delta instead of its coordinate. The first point's delta is relative to (0, 0), and each later point's delta is relative to the point before it.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>One output record per <code>glyph<\/code> line, in input order, in the format above.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A record of length 0 → <code>glyph &lt;id&gt; empty<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>numberOfContours<\/code> &lt; 0 → <code>glyph &lt;id&gt; compound<\/code>, with nothing decoded.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Your program prints the header's contour count and bounding box as the font stores them.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>ends<\/code> lists <code>endPtsOfContours<\/code> in file order. The point count is the last value + 1.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>Your program skips the hinting instructions, however long they are.<\/span><\/li><li><span class=\"rid\">R7<\/span><span>Your program expands REPEAT so that every point gets its own flag, and takes each point's on/off from that flag, <strong>including points created by a repeat<\/strong>.<\/span><\/li><li><span class=\"rid\">R8<\/span><span>Your program adds up the 1-byte, 2-byte and \"same\" deltas into absolute coordinates. All x values come before all y values, and the running total carries on across contour boundaries without going back to 0.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>The test records are well-formed: <code>endPtsOfContours<\/code> increases, no REPEAT run goes past the last point, and the flags and coordinates fit inside the record.<\/li><li>The largest glyph in the tests has a few hundred points. Every coordinate fits in an int16, and so does every running total.<\/li><li>Each case has a 10-second limit. A correct solution takes milliseconds.<\/li><li>There are 151 tests: the examples above, hand-made records for each rule, every simple ASCII glyph in the font, and 40 other glyphs (Nerd Font icons with hundreds of points, glyphs that repeat on-curve flags, and random picks).<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/GlyphComponent.h","text":"#pragma once\n// Assignment 07: the outline of one simple glyph.\n\n#include <vector>\n\nstruct GlyphPoint {\n  double x = 0;  // font units; x grows to the right\n  double y = 0;  // font units; y grows upwards\n  bool onCurve = false;\n};\n\n// Contours are runs of points: contour k ends at point endPtsOfContours[k].\nstruct GlyphComponent {\n  std::vector<int> endPtsOfContours;\n  std::vector<GlyphPoint> points;\n};\n"},{"path":"src/Glyph.h","text":"#pragma once\n// Assignment 07: a glyph as stored in the glyf table.\n\n#include <vector>\n\n#include \"GlyphComponent.h\"\n\nstruct BoundingRect {\n  int xMin = 0, yMin = 0, xMax = 0, yMax = 0;\n};\n\nstruct Glyph {\n  enum class Kind { Empty, Simple, Compound };\n  Kind kind = Kind::Empty;\n  int numberOfContours = 0;  // negative for a compound glyph\n  BoundingRect bounds;\n  // A simple glyph has one component. A compound glyph is made of other glyphs;\n  // resolveGlyph (assignment 09) turns it into one component per part.\n  std::vector<GlyphComponent> components;\n};\n"},{"path":"src/font/GlyphParser.h","text":"#pragma once\n// Assignment 07: decoding a glyph record from the glyf table.\n\n#include <cstdint>\n\n#include \"Glyph.h\"\n#include \"font/ByteReader.h\"\n\n// The glyph whose record starts at `offset` (a length of 0 means no outline). A compound\n// glyph comes back with its kind and bounds only; see resolveGlyph for its parts.\nGlyph readGlyph(ByteReader& reader, uint32_t offset, uint32_t length);\n"},{"path":"src/font/GlyphParser.cpp","text":"#include \"font/GlyphParser.h\"\n\n#include <algorithm>\n#include <vector>\n\nnamespace {\n\nconstexpr uint8_t ON_CURVE_POINT = 0x01;\nconstexpr uint8_t X_SHORT_VECTOR = 0x02;\nconstexpr uint8_t Y_SHORT_VECTOR = 0x04;\nconstexpr uint8_t REPEAT_FLAG = 0x08;\nconstexpr uint8_t X_IS_SAME_OR_POSITIVE = 0x10;\nconstexpr uint8_t Y_IS_SAME_OR_POSITIVE = 0x20;\n\n// Reads one axis of delta-encoded coordinates into points[i].*axis.\nvoid readAxis(ByteReader& reader, const std::vector<uint8_t>& flags, const uint8_t shortBit,\n              const uint8_t sameOrPositiveBit, double GlyphPoint::*axis, std::vector<GlyphPoint>& points) {\n  int value = 0;  // deltas run on across contours, starting from 0\n  for (std::size_t i = 0; i < flags.size(); ++i) {\n    const uint8_t flag = flags[i];\n    if (flag & shortBit) {\n      const int magnitude = reader.readUint8();\n      value += (flag & sameOrPositiveBit) ? magnitude : -magnitude;\n    } else if (!(flag & sameOrPositiveBit)) {\n      value += reader.readInt16();\n    }  // else: same as the previous point, no bytes\n    points[i].*axis = value;\n  }\n}\n\n}  // namespace\n\nGlyph readGlyph(ByteReader& reader, const uint32_t offset, const uint32_t length) {\n  Glyph g;\n  if (length == 0) return g;  // no outline, e.g. space\n\n  reader.jumpTo(offset);\n  g.numberOfContours = reader.readInt16();\n  g.kind = g.numberOfContours < 0 ? Glyph::Kind::Compound : Glyph::Kind::Simple;\n  g.bounds.xMin = reader.readInt16();\n  g.bounds.yMin = reader.readInt16();\n  g.bounds.xMax = reader.readInt16();\n  g.bounds.yMax = reader.readInt16();\n  if (g.kind == Glyph::Kind::Compound) return g;\n\n  GlyphComponent& outline = g.components.emplace_back();\n  if (g.numberOfContours == 0) return g;\n\n  std::size_t numPoints = 0;\n  for (int i = 0; i < g.numberOfContours; ++i) {\n    const int end = reader.readUint16();\n    outline.endPtsOfContours.push_back(end);\n    numPoints = std::max(numPoints, static_cast<std::size_t>(end) + 1);\n  }\n\n  reader.skipBytes(reader.readUint16());  // hinting instructions\n\n  std::vector<uint8_t> flags;\n  flags.reserve(numPoints);\n  while (flags.size() < numPoints) {\n    const uint8_t flag = reader.readUint8();\n    const std::size_t copies = (flag & REPEAT_FLAG) ? 1u + reader.readUint8() : 1u;\n    flags.insert(flags.end(), copies, flag);\n  }\n  flags.resize(numPoints);  // a malformed repeat count can't add points\n\n  outline.points.resize(numPoints);\n  readAxis(reader, flags, X_SHORT_VECTOR, X_IS_SAME_OR_POSITIVE, &GlyphPoint::x, outline.points);\n  readAxis(reader, flags, Y_SHORT_VECTOR, Y_IS_SAME_OR_POSITIVE, &GlyphPoint::y, outline.points);\n  for (std::size_t i = 0; i < numPoints; ++i) outline.points[i].onCurve = flags[i] & ON_CURVE_POINT;\n  return g;\n}\n"},{"path":"assignments/assignment_07_simple_glyph.cpp","text":"// Assignment 07 (decode simple glyphs): prints each glyph in a test input.\n// Glyphs are decoded by src/font/GlyphParser into the types in src/Glyph.h.\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n\n#include \"font/GlyphParser.h\"\n\nnamespace {\n\nvoid write(std::ostream& out, const uint32_t id, const Glyph& g) {\n  out << \"glyph \" << id;\n  if (g.kind == Glyph::Kind::Empty) {\n    out << \" empty\\n\";\n    return;\n  }\n  if (g.kind == Glyph::Kind::Compound) {\n    out << \" compound\\n\";\n    return;\n  }\n  const BoundingRect& b = g.bounds;\n  out << \" contours \" << g.numberOfContours << \" bbox \" << b.xMin << ' ' << b.yMin << ' ' << b.xMax << ' '\n      << b.yMax << \"\\nends\";\n  const GlyphComponent& outline = g.components.front();\n  for (const int end : outline.endPtsOfContours) out << ' ' << end;\n  out << \"\\npoints\";\n  for (const GlyphPoint& p : outline.points)\n    out << ' ' << static_cast<int>(p.x) << ' ' << static_cast<int>(p.y) << (p.onCurve ? \" on\" : \" off\");\n  out << '\\n';\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  std::ofstream output(argv[2]);\n  if (!input || !output) {\n    std::cerr << \"cannot open \" << argv[1] << \" or \" << argv[2] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<ByteReader> font;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      words >> keyword;\n      if (keyword == \"font\") {\n        std::string path;\n        words >> path;\n        font = std::make_unique<ByteReader>(path);\n      } else if (keyword == \"glyph\") {\n        uint32_t id = 0, offset = 0, length = 0;\n        words >> id >> offset >> length;\n        if (!font) throw std::runtime_error(\"a `glyph` line before the `font` line\");\n        write(output, id, readGlyph(*font, offset, length));\n      }\n    }\n  } catch (const std::exception& e) {\n    std::cerr << \"error: \" << e.what() << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"}],"also":["src/font/ByteReader.h","src/font/ByteReader.cpp"],"proof":{"passed":151,"total":151,"date":"2026-10-21"}},"read":"<p>You can pass using this page alone. For the background, read the blog's <strong>\"Glyph Parsing &amp; Outline Rendering\"<\/strong> section, from <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parsing%20glyf%20tables\" target=\"_blank\" rel=\"noopener\">Parsing glyf tables<\/a> through the list of flag rules under <strong>Simple glyph<\/strong>. Stop at the paragraph that starts \"Implementation.\", before the author's code.<\/p>","readTitle":"Read in the blog first","context":"<p>Your <code>Cmap<\/code> (assignment 03) and <code>Loca<\/code> (assignment 04) take you from a character to a byte offset inside the font file. Here you decode the record at that offset into the points of the glyph's outline. Assignment 08 draws those points with straight lines and assignment 11 with curves. Assignment 09 handles <strong>compound glyphs<\/strong>, glyphs built out of other glyphs; in this assignment you only recognise them.<\/p>","sources":"<ul><li>Apple, <em>TrueType Reference Manual<\/em>, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM06/Chap6glyf.html\" target=\"_blank\" rel=\"noopener\">'glyf' table<\/a><\/li><li>Microsoft, <em>OpenType specification<\/em>, <a href=\"https://learn.microsoft.com/en-us/typography/opentype/spec/glyf\" target=\"_blank\" rel=\"noopener\">glyf: Glyph Data<\/a>. Its simple-glyph flags table is the clearest.<\/li><li>Apple, <a href=\"https://developer.apple.com/fonts/TrueType-Reference-Manual/RM01/Chap1.html\" target=\"_blank\" rel=\"noopener\">Digitizing Letterform Designs<\/a>, on on-curve and off-curve points<\/li><li>The blog: <a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Simple%20glyph\" target=\"_blank\" rel=\"noopener\">Simple glyph<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 07                         run every test\n.\\check 07 -Case 07-R7-repeat      one test, showing its full input, expected output and your output\n.\\check 07 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 07 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  Header: number of contours and bounding box ...............    0 / 2   FAILED\n      x 07-R4-B  &#x27;B&#x27;: three contours\n          points[26]: expected (x=199, y=626, curve=on), got (x=199, y=626, curve=off) - differs in curve\n          likely cause: R7 - REPEAT expanded; on/off for every point, repeats included\n          expected values from: fontTools 4.67.0\n          reproduce: build/solutions/assignment_07.exe build/cases/07/07-R4-B.in build/cases/07/07-R4-B.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Read the fields in the order the record lays them out: header, contour ends, instructions, flags, every x, every y. You can't read any coordinate until you have expanded all the flags, because the flags decide how many bytes each coordinate takes.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Work in two passes. First expand the compressed flags into a list with one flag for each point. Then walk that list twice, once for x and once for y. Each time, keep a running total and read 0, 1 or 2 bytes per point depending on two bits. Write the coordinate reader once and give it the bit numbers for the axis (1 and 4 for x, 2 and 5 for y).<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A REPEAT count of 3 means 3 <strong>more<\/strong> copies, so that one flag covers 4 points.<\/li><li>A repeated point gets every bit of the flag, including ON_CURVE. If you keep the on-curve points in a list of their own, add the repeated points to it too.<\/li><li>\"Same as previous\" (short bit clear, bit 4/5 set) reads <strong>no<\/strong> bytes.<\/li><li>A short delta is an unsigned size from 0 to 255, and its sign comes from bit 4/5. A long delta is already a signed int16.<\/li><li>The running total doesn't reset at a contour boundary.<\/li><li>Compound glyphs: check <code>numberOfContours<\/code> before reading anything past the header.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>if length == 0: return EMPTY\nseek(offset)\nnumberOfContours = readInt16()\nif numberOfContours &lt; 0: return COMPOUND\nbbox = readInt16() x 4\nends = readUint16() x numberOfContours\nn = ends[last] + 1\nskip(readUint16())                       # instructions\nflags = []\nwhile len(flags) &lt; n:\n    f = readUint8()\n    copies = 1 + readUint8() if f &amp; 0x08 else 1\n    append f to flags, copies times\nxs = readAxis(flags, shortBit=0x02, sameOrPositiveBit=0x10)\nys = readAxis(flags, shortBit=0x04, sameOrPositiveBit=0x20)\npoint i = (xs[i], ys[i], flags[i] &amp; 0x01)\n\nreadAxis(flags, shortBit, sameOrPositiveBit):\n    value = 0\n    for f in flags:\n        if f &amp; shortBit:                   value += readUint8() if f &amp; sameOrPositiveBit else -readUint8()\n        elif not (f &amp; sameOrPositiveBit):  value += readInt16()\n        output value<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the hyphen in JetBrains Mono Bold","test":"07-R8-hyphen","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\nglyph 17 115392 56","output":"glyph 17 contours 1 bbox 140 272 460 388\nends 3\npoints 140 272 on 140 388 on 460 388 on 460 272 on","image":null,"explain":"<p>These are the 56 bytes at offset 115392:<\/p>\n<pre><code>00 01                        numberOfContours = 1\n00 8c 01 10 01 cc 01 84      bbox = (140, 272) - (460, 388)\n00 03                        endPtsOfContours = [3], so there are 4 points\n00 1e                        instructionLength = 30\n.. 30 bytes ..               instructions: skip them\n13 35 21 15                  flags, one per point (no REPEAT)\n8c 01 40                     x data\n01 10 74 74                  y data\n00                           padding<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>Point<\/th><th>Flag<\/th><th>x rule<\/th><th>x bytes<\/th><th>x<\/th><th>y rule<\/th><th>y bytes<\/th><th>y<\/th><th>on/off<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td><code>0x13<\/code><\/td><td>short, +<\/td><td><code>8c<\/code><\/td><td>0 + 140 = <strong>140<\/strong><\/td><td>int16<\/td><td><code>01 10<\/code><\/td><td>0 + 272 = <strong>272<\/strong><\/td><td>on<\/td><\/tr><tr><td>1<\/td><td><code>0x35<\/code><\/td><td>same<\/td><td>none<\/td><td><strong>140<\/strong><\/td><td>short, +<\/td><td><code>74<\/code><\/td><td>272 + 116 = <strong>388<\/strong><\/td><td>on<\/td><\/tr><tr><td>2<\/td><td><code>0x21<\/code><\/td><td>int16<\/td><td><code>01 40<\/code><\/td><td>140 + 320 = <strong>460<\/strong><\/td><td>same<\/td><td>none<\/td><td><strong>388<\/strong><\/td><td>on<\/td><\/tr><tr><td>3<\/td><td><code>0x15<\/code><\/td><td>same<\/td><td>none<\/td><td><strong>460<\/strong><\/td><td>short, −<\/td><td><code>74<\/code><\/td><td>388 − 116 = <strong>272<\/strong><\/td><td>on<\/td><\/tr><\/tbody><\/table><\/div>"},{"label":"Example 2","name":"a repeated flag","test":"07-R7-repeat","input":"font tests/07/data/07-R7-repeat.bin\nglyph 0 0 24","output":"glyph 0 contours 1 bbox 10 0 40 50\nends 5\npoints 10 0 on 20 0 on 30 0 on 40 0 on 40 50 on 10 50 off","image":null,"explain":"<p>The 24 bytes:<\/p>\n<pre><code>00 01                        numberOfContours = 1\n00 0a 00 00 00 28 00 32      bbox = (10, 0) - (40, 50)\n00 05                        endPtsOfContours = [5], so 6 points\n00 00                        instructionLength = 0\n3b 03 35 22                  flags: 0x3b with REPEAT, count 3 (points 0-3); 0x35 (point 4); 0x22 (point 5)\n0a 0a 0a 0a 1e               x data: +10 +10 +10 +10 (0x3b: short, +), none (0x35: same), -30 (0x22: short, -)\n32                           y data: none for points 0-3 (same), +50 (0x35: short, +), none (0x22: same)<\/code><\/pre>\n<p>Point 5 is <code>off<\/code> because bit 0 of <code>0x22<\/code> is clear.<\/p>"},{"label":"Example 3","name":"one input with several glyphs","test":"07-R1-four-glyphs","input":"font fonts/JetBrainsMonoNerdFont-Bold.ttf\nglyph 17 115392 56\nglyph 4 113584 0\nglyph 77 122844 24\nglyph 37 118060 112","output":"glyph 17 contours 1 bbox 140 272 460 388\nends 3\npoints 140 272 on 140 388 on 460 388 on 460 272 on\nglyph 4 empty\nglyph 77 compound\nglyph 37 contours 2 bbox 35 0 565 730\nends 7 16\npoints 35 0 on 219 730 on ... (17 points in total)","image":null,"explain":""}],"editorial":{"title":"Compare with the author's code","html":"<p><a href=\"https://yayo1.com/en/blog/tiny-truetype-renderer/#:~:text=Parser%20for%20simple%20glyphs\" target=\"_blank\" rel=\"noopener\">The blog's simple-glyph parser<\/a> splits the work into <code>readGlyphHeader<\/code> (the header), <code>getGlyphComponent<\/code> (contour ends, instructions and flags) and <code>getGlyphCoordinates<\/code>, which it calls once for x and once for y. It stores the contour ends and on-curve indices in <code>unordered_set<\/code>s and multiplies every point by an affine matrix. The matrix is the identity for simple glyphs; it matters for compound glyphs in assignment 09.<\/p>\n<p><strong>Something to look for:<\/strong> in the snippet as published, the flag loop records ON_CURVE only for the first point of a repeated run. In JetBrains Mono Bold, 42 of the 90 simple ASCII glyphs repeat an on-curve flag, which is why R7 has its own tests.<\/p>"}},{"id":"08","num":"8","title":"Draw an outline with straight lines","difficulty":"Easy","tests":22,"problem":"problems/08-outline-lines.md","entry":"solutions/assignments/assignment_08_outline_lines.cpp","files":[{"path":"solutions/assignments/assignment_08_outline_lines.cpp","role":"entry","purpose":null,"job":"Create the canvas from the `canvas` line and keep the most recent `place`, `style` and `color`. For each `outline`, read its `ends` and `points` (coordinates may be fractional) and draw it; at the end, write the picture to the output path.","blank":"// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 08 as `build/solutions/assignment_08.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 08`, or use Run and Submit in the book.\n//\n// Your job:\n//   Create the canvas from the `canvas` line and keep the most recent `place`, `style` and\n//   `color`. For each `outline`, read its `ends` and `points` (coordinates may be\n//   fractional) and draw it; at the end, write the picture to the output path.\n//\n// The other files of this assignment:\n//   You also write src/render/Placement.h, src/render/Outline.h and src/render/Outline.cpp\n//   in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/FrameBufferCanvas.h and src/GlyphComponent.h.\n//   Include them by their path under src/, e.g. #include \"render/Placement.h\".\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n\nint main(int argc, char** argv) {\n}\n","boilerplate":"// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   The checker runs this program for assignment 08 as `build/solutions/assignment_08.exe\n//   <input-file> <output-file>`. It reads a test input, calls your code and writes the\n//   answer to the output file, and the checker compares that answer with the expected one.\n//   Run `.\\check 08`, or use Run and Submit in the book.\n//\n// Your job:\n//   The Boilerplate gives you this program finished: it reads the input, calls your code\n//   and writes the answer. You fill in the TODOs in this assignment's other files.\n//\n// The other files of this assignment:\n//   You also write src/render/Placement.h, src/render/Outline.h and src/render/Outline.cpp\n//   in this assignment; each one gives its job at the top.\n//   Earlier files you can use: src/FrameBufferCanvas.h and src/GlyphComponent.h.\n//   Include them by their path under src/, e.g. #include \"render/Placement.h\".\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ======================================================================================\n\n#include <fstream>\n#include <iostream>\n#include <memory>\n#include <sstream>\n#include <stdexcept>\n#include <string>\n#include <vector>\n\n#include \"render/Outline.h\"\n\nnamespace {\n\nstd::vector<std::string> wordsAfterKeyword(const std::string& line) {\n  std::istringstream in(line);\n  std::vector<std::string> words;\n  for (std::string w; in >> w;) words.push_back(w);\n  if (!words.empty()) words.erase(words.begin());\n  return words;\n}\n\n}  // namespace\n\nint main(int argc, char** argv) {\n  if (argc != 3) {\n    std::cerr << \"usage: \" << argv[0] << \" <input-file> <output-file.png>\\n\";\n    return 2;\n  }\n  std::ifstream input(argv[1]);\n  if (!input) {\n    std::cerr << \"cannot open \" << argv[1] << \"\\n\";\n    return 2;\n  }\n  try {\n    std::unique_ptr<FrameBufferCanvas> canvas;\n    Placement place;\n    OutlineStyle style;\n    RGB color{255, 255, 255};\n    GlyphComponent outline;\n    for (std::string line; std::getline(input, line);) {\n      std::istringstream words(line);\n      std::string keyword;\n      if (!(words >> keyword)) continue;  // blank line\n      if (keyword == \"canvas\") {  // canvas <w> <h>\n        int w = 0, h = 0;\n        words >> w >> h;\n        canvas = std::make_unique<FrameBufferCanvas>(w, h);\n      } else if (keyword == \"place\") {  // place <x0> <baseline> <scale>\n        words >> place.x0 >> place.baseline >> place.scale;\n      } else if (keyword == \"style\") {  // style <lineThickness> <markerSize>\n        words >> style.lineThickness >> style.markerSize;\n      } else if (keyword == \"color\") {  // color <r> <g> <b>\n        int r = 0, g = 0, b = 0;\n        words >> r >> g >> b;\n        color = RGB{static_cast<uint8_t>(r), static_cast<uint8_t>(g), static_cast<uint8_t>(b)};\n      } else if (keyword == \"outline\") {  // starts a new outline: an `ends` and a `points` line follow\n        outline = GlyphComponent{};\n      } else if (keyword == \"ends\") {  // ends <e0> <e1> ...\n        for (const std::string& w : wordsAfterKeyword(line)) outline.endPtsOfContours.push_back(std::stoi(w));\n      } else if (keyword == \"points\") {  // points <x> <y> <on|off> ... - completes the outline\n        const std::vector<std::string> w = wordsAfterKeyword(line);\n        for (std::size_t i = 0; i + 2 < w.size(); i += 3)\n          outline.points.push_back(GlyphPoint{std::stod(w[i]), std::stod(w[i + 1]), w[i + 2] == \"on\"});\n        if (!canvas) throw std::runtime_error(\"the first line must be `canvas <w> <h>`\");\n        renderGlyphOutline(*canvas, outline, place, style, color);\n      } else {\n        throw std::runtime_error(\"unknown line: \" + line);\n      }\n    }\n    if (!canvas) throw std::runtime_error(\"no `canvas` line in the input\");\n    canvas->writePng(argv[2]);\n  } catch (const std::exception& e) {\n    const std::string what = e.what();\n    if (what.rfind(\"not implemented\", 0) == 0) {  // a TODO in your project: the checker names it\n      std::cerr << what << \"\\n\";\n      return 99;\n    }\n    std::cerr << \"error: \" << what << \"\\n\";\n    return 1;\n  }\n  return 0;\n}\n"},{"path":"solutions/src/render/Placement.h","role":"new","purpose":"A placement is where a glyph goes on the canvas, given as three numbers: the pixel column of font x = 0, the pixel row of the baseline and the pixels per font unit. Together they turn font units (y up) into pixels (y down). You place glyphs with it in assignments 11, 14, 16 and 17, and in assignment 18 you move it along a line of text, one glyph at a time.","job":"Declare a small type in this header, with no `.cpp`, for the three values of a `place` line: `x0`, `baseline` and `scale`, as numbers that can be fractional or negative.","blank":"#pragma once\n// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   A placement is where a glyph goes on the canvas, given as three numbers: the pixel\n//   column of font x = 0, the pixel row of the baseline and the pixels per font unit.\n//   Together they turn font units (y up) into pixels (y down). You place glyphs with it in\n//   assignments 11, 14, 16 and 17, and in assignment 18 you move it along a line of text,\n//   one glyph at a time.\n//\n// Your job:\n//   Declare a small type in this header, with no `.cpp`, for the three values of a `place`\n//   line: `x0`, `baseline` and `scale`, as numbers that can be fractional or negative.\n//\n// How to start:\n//   Write it yourself from here, or press Boilerplate in the book's editor to get the\n//   input/output code and the declarations, with the author's names (the same files are in\n//   starters/boilerplate/).\n// ======================================================================================\n","boilerplate":"#pragma once\n// ======================================================================================\n// Assignment 08: Draw an outline with straight lines\n// Problem: problems/08-outline-lines.md (and in the problem book, with its Start here card)\n//\n// Why this file exists:\n//   A placement is where a glyph goes on the canvas, given as three numbers: the pixel\n//   column of font x = 0, the pixel row of the baseline and the pixels per font unit.\n//   Together they turn font units (y up) into pixels (y down). You place glyphs with it in\n//   assignments 11, 14, 16 and 17, and in assignment 18 you move it along a line of text,\n//   one glyph at a time.\n//\n// Your job:\n//   The Boilerplate gives you this file finished: the declarations, with the author's\n//   names. You fill in the TODOs in this assignment's other files.\n//\n// How to start:\n//   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n//   the book (the empty files are in starters/blank/).\n// ============
