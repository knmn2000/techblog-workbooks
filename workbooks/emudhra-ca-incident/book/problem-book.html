    if (copy) copyText(c.solutionCode.files[solFile].text).then((ok) => flash(copy, ok));
  });

  function setLeft(tab) {
    $$('[data-left]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.left === tab)));
    $('#desc').hidden = tab !== 'desc';
    $('#editorial').hidden = tab !== 'editorial';
  }
  function setBottom(tab) {
    $$('[data-bottom]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.bottom === tab)));
    $('#cases').hidden = tab !== 'cases';
    $('#result').hidden = tab !== 'result';
  }
  $$('[data-left]').forEach((b) => b.addEventListener('click', () => setLeft(b.dataset.left)));
  $$('[data-bottom]').forEach((b) => b.addEventListener('click', () => setBottom(b.dataset.bottom)));

  // ---- test cases
  const casesOf = (c) => c.examples.filter((ex) => !ex.raw && ex.input != null);
  function renderCases(c) {
    const list = casesOf(c);
    if (!list.length) {
      $('#cases').innerHTML = `<p class="note">This checkpoint has no worked examples. <code>${esc(command(c.id))}</code> runs all ${c.tests} tests.</p>`;
      return;
    }
    caseIndex = Math.min(caseIndex, list.length - 1);
    const ex = list[caseIndex];
    const expected = ex.output != null ? `<pre class="field-v">${esc(ex.output)}</pre>`
      : ex.image ? `<img src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '<p class="note">See the problem page.</p>';
    $('#cases').innerHTML = `
      <div class="case-pills" role="tablist">${list.map((x, i) => `<button class="pill-btn" type="button" role="tab" data-case="${i}" aria-selected="${i === caseIndex}">Case ${i + 1}</button>`).join('')}</div>
      ${ex.name ? `<p class="case-name">${ex.name}</p>` : ''}
      <div class="field"><div class="field-k">input</div><pre class="field-v">${esc(ex.input)}</pre></div>
      <div class="field"><div class="field-k">expected output</div>${expected}</div>
      ${ex.test ? `<div class="field"><div class="field-k">run just this case (test ${esc(ex.test)})</div>${cmdRow(command(c.id, '-Case ' + ex.test))}</div>` : ''}`;
  }
  $('#cases').addEventListener('click', (e) => {
    const b = e.target.closest('[data-case]');
    if (b) { caseIndex = Number(b.dataset.case); renderCases(BY[current]); }
  });
  const cmdRow = (text) => `<div class="cmd"><code>${esc(text)}</code><button class="btn" type="button" data-copy="${esc(text)}">Copy</button></div>`;

  // ---- results: the learner pastes the checker's output; we read the verdict from it.
  // Every outcome gets a plain sentence saying what happened and what to do next.
  function looksLikeCode(t, c) {
    const s = t.trim();
    if ([code(), c.starter, c.boilerplate].some((x) => x && x.trim() === s)) return true;
    return !/^Checkpoint \S+ - /m.test(s)
      && /^\s*(#include\b|#!|import \S|from \S+ import|def \w+\(|(int|void|auto) main\s*\(|fn main\(|func main\(|function \w+\(|\/\/ Checkpoint \d)/m.test(s);
  }
  function parseOutput(text, c) {
    const t = text.replace(/\r/g, '');
    const head = t.match(/^Checkpoint (\S+) - /m);
    const run = `<code>${esc(command(c.id))}</code>`;
    let v = null, m;
    if ((m = t.match(/Accepted: (\d+) \/ (\d+) tests passed(?: \((\d+) disputed\))?/))) {
      v = { kind: 'ok', label: 'Accepted', passed: +m[1], total: +m[2], disputed: +(m[3] || 0) };
    } else if ((m = t.match(/Wrong Answer: (\d+) \/ (\d+) tests passed/))) {
      v = { kind: 'bad', label: 'Wrong Answer', passed: +m[1], total: +m[2] };
      v.help = /wrote nothing in any failing test/.test(t)
        ? `Your program ran but didn't write anything. It's started with two file names: the input to read and the output to write. Write your answer to the second one.`
        : `Some tests failed. Each one below shows what was expected and what your program wrote, and the requirement it most likely breaks.`;
    } else if (/Compile Error/.test(t)) {
      v = { kind: 'bad', label: 'Compile Error' };
      v.help = /has no main\(\) function/.test(t)
        ? `Your code has no <code>main</code> function, so it can't be built into a program the checker can run. Add a <code>main</code> that reads the input file and writes the output file.`
        : `Your code didn't build, so no tests ran. The compiler's messages are below; fix the first error first, since later ones often follow from it.`;
    } else if ((m = t.match(/Not implemented yet:? ?(\S*)/))) {
      v = { kind: 'warn', label: 'Not implemented yet' };
      v.help = `The boilerplate function <code>${esc(m[1] || 'a function')}</code> still says it isn't written. Fill it in, save, and run ${run} again.`;
    } else if (/Not started yet/.test(t)) {
      v = { kind: 'warn', label: 'Not started yet' };
      v.help = /is empty\./.test(t)
        ? `Your solution file <code>${esc(c.solution)}</code> is empty, so there was nothing to check. Put your program in it, save, and run ${run} again.`
        : `Your solution file <code>${esc(c.solution)}</code> is still the blank starter, so there was nothing to check. Write your program in it, save, and run ${run} again.`;
    } else if (/^Passed\s*$/m.test(t)) {
      v = { kind: 'ok', label: 'Passed', single: true, help: 'This one test passes. Run all of them to get a verdict for the checkpoint.' };
    } else if ((m = t.match(/^Failed: (.*)$/m))) {
      v = { kind: 'bad', label: 'Failed', single: true, help: `This one test fails: ${esc(m[1])}` };
    } else if (!t.trim()) {
      v = { kind: 'unknown', label: 'Nothing was pasted', help: 'The box was empty. Copy what the checker printed in the terminal, then paste it here.' };
    } else if (looksLikeCode(t, c)) {
      v = { kind: 'unknown', label: "That's your code, not the result", code: true,
        help: `Submit copied your code so you can put it in <code>${esc(c.solution)}</code>. Paste it into that file and save, run ${run} in ${esc(DATA.shell)}, then copy what the checker prints and paste that here.` };
    } else if (head) {
      v = { kind: 'unknown', label: 'The output is cut off',
        help: `This starts like the checker's output but has no verdict at the end. Copy everything it printed, down to the last line (it starts with Accepted, Wrong Answer, Compile Error, Not started yet or Not implemented yet).` };
    } else {
      v = { kind: 'unknown', label: "That isn't the checker's output",
        help: `Paste what ${run} prints in the terminal. It starts with “Checkpoint ${esc(c.id)} - …” and ends with a verdict such as “Accepted: ${c.tests} / ${c.tests} tests passed.”` };
    }
    v.raw = t;
    v.other = head && head[1] !== c.id ? head[1] : null;
    v.reqs = [...t.matchAll(/^ {2}(\S+)\s+(.+?) \.{2,}\s+(\d+) \/ (\d+)/gm)].map((r) => ({ id: r[1], text: r[2], ok: +r[3], n: +r[4] }));
    v.fails = [];
    const lines = t.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const f = lines[i].match(/^\s+x (\S+)\s+(.*)$/);
      if (!f) continue;
      const detail = [];
      while (i + 1 < lines.length && /^ {9,}\S/.test(lines[i + 1])) detail.push(lines[++i].trim());
      v.fails.push({ id: f[1], title: f[2], detail: detail.join('\n') });
    }
    return v;
  }

  function verdictHtml(v, c) {
    let h = `<div class="verdict ${v.kind}"><h2>${esc(v.label)}</h2>`
      + (v.total ? `<span class="sub">${v.passed} / ${v.total} testcases passed${v.disputed ? ` · ${v.disputed} disputed` : ''}</span>` : '')
      + `<button class="btn" type="button" id="clear-result">Clear</button></div>`;
    if (v.other) h += `<p class="note warn">This output is from checkpoint ${esc(v.other)}, not ${esc(c.id)}, so it wasn't counted here. Open checkpoint ${esc(v.other)} and paste it there.</p>`;
    else if (v.kind === 'ok' && !v.single) h += `<p class="note">Saved as solved. The Editorial tab is open now.</p>`;
    if (v.help) h += `<p class="note">${v.help}</p>`;
    if (v.reqs.length) {
      h += '<div class="req-rows">' + v.reqs.map((r) => `<div class="req-row${r.ok === r.n ? '' : ' fail'}"><span class="rid">${esc(r.id)}</span><span class="rq" title="${esc(r.text)}">${esc(r.text)}</span><span class="cnt">${r.ok} / ${r.n}</span><span class="bar"><i style="width:${r.n ? (r.ok / r.n) * 100 : 0}%"></i></span></div>`).join('') + '</div>';
    }
    h += v.fails.map((f) => `<div class="fail-card"><span class="id">${esc(f.id)}</span><span class="t">${esc(f.title)}</span><pre>${esc(f.detail)}</pre></div>`).join('');
    if (v.kind !== 'ok' && !v.fails.length && !v.reqs.length && v.raw.trim()) {
      const lines = v.raw.trim().split('\n');
      const shown = v.kind === 'unknown' ? lines.slice(0, 12) : lines.slice(-40);
      h += `<div class="field-k">${v.kind === 'unknown' ? 'What you pasted' : 'What the checker printed'}</div>`
        + `<pre class="raw">${esc(shown.join('\n'))}${v.kind === 'unknown' && lines.length > 12 ? '\n…' : ''}</pre>`;
    }
    return h;
  }

  function renderResult(c, notice) {
    const saved = store.get(c.id + ':result');
    const v = saved ? parseOutput(saved, c) : null;
    const act = lastAction[c.id];
    const runCmd = act && act.kind === 'run' && act.test ? command(c.id, '-Case ' + act.test) : command(c.id);
    const copied = !act ? '<b>Copy your code</b> and paste it over'
      : act.empty ? '<b>Nothing to copy yet:</b> the editor is empty. Write your program, then paste it over'
      : act.copied ? '<b>Code copied.</b> Paste it over'
      : '<b>Copy didn\'t work here:</b> the code is selected in the editor, so press Ctrl+C, then paste it over';
    $('#result').innerHTML = (notice ? `<p class="note warn">${notice}</p>` : '')
      + (act && act.warn ? `<p class="note warn">${act.warn}</p>` : '') + (v ? verdictHtml(v, c) : '') + `
      <ol class="steps">
        <li class="step${act && act.copied ? ' done' : ''}"><span>1</span><div><p>${copied} <code>${esc(c.solution)}</code>. Skip this if you edit that file directly.</p>
          <div><button class="btn" type="button" id="copy-again">Copy code</button></div></div></li>
        <li class="step"><span>2</span><div><p><b>Run the checker</b> in ${esc(DATA.shell)}, in <code>${esc(DATA.folder)}</code>:</p>${cmdRow(runCmd)}</div></li>
        <li class="step${v && v.kind !== 'unknown' ? ' done' : ''}"><span>3</span><div><p><b>Copy what the checker prints</b> in the terminal and paste it here (the result, not your code).</p>
          <textarea class="paste" id="paste" spellcheck="false" placeholder="Paste the checker's output here (Ctrl+V). It starts with “Checkpoint ${esc(c.id)} - …”"></textarea></div></li>
      </ol>
      <details class="more"><summary>More commands, and what a failure looks like</summary><div>
        ${cmdRow(command(c.id))}${cmdRow(command(c.id, '-Fresh'))}${cmdRow(command(c.id, '-Dispute <test-id> "why"'))}
        <div class="flow" style="margin-top:14px">${c.checking}</div></div></details>`;
  }

  function takeOutput(text) {
    if (!current) return;
    const c = BY[current];
    if (!text.trim()) {
      renderResult(c, 'The box was empty, so there was nothing to read. Copy what the checker printed in the terminal (everything from “Checkpoint ' + esc(c.id) + ' - …” to the last line), then paste it here.');
      return;
    }
    store.set(c.id + ':result', text);
    if (lastAction[c.id]) lastAction[c.id].warn = null;  // the pasted result says more than the Submit-time warning
    const v = parseOutput(text, c);
    if (v.kind === 'ok' && !v.single && !v.other) setSolved(c.id, true);
    renderResult(c);
    $('#result').scrollTop = 0;
  }
  $('#result').addEventListener('paste', (e) => {
    if (e.target.id !== 'paste') return;
    e.preventDefault();
    takeOutput((e.clipboardData || window.clipboardData).getData('text'));
  });
  $('#result').addEventListener('change', (e) => { if (e.target.id === 'paste') takeOutput(e.target.value); });
  $('#result').addEventListener('click', (e) => {
    if (e.target.closest('#clear-result')) { store.del(current + ':result'); renderResult(BY[current]); }
    if (e.target.closest('#copy-again')) act(lastAction[current] ? lastAction[current].kind : 'submit');
  });

  // ---- solved state
  function setSolved(id, value) {
    if (value) store.set(id + ':solved', '1'); else store.del(id + ':solved');
    if (id === current) { paintSolved(); renderEditorial(BY[id]); }
  }
  function paintSolved() {
    if (!current) return;
    const done = solved(current);
    const mark = $('#solved-mark'), btn = $('#solve-btn');
    if (mark) mark.hidden = !done;
    if (btn) { btn.innerHTML = done ? `${I.check} Solved` : 'Mark as solved'; btn.classList.toggle('done', done); }
    $('#tb-prog').innerHTML = `<b>${CPS.filter((c) => solved(c.id)).length}</b> / ${CPS.length} solved`;
  }

  // ---- editor
  let cm = null, plainEditor = null, saveTimer = 0;
  const docs = {};
  function initEditor() {
    const host = $('#editor');
    if (window.CodeMirror) {
      cm = window.CodeMirror(host, {
        lineNumbers: true, matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true, indentWithTabs: false,
        extraKeys: {
          // In Vim's Normal and Visual modes, Tab belongs to Vim.
          Tab: (ed) => (vimNormal(ed) ? window.CodeMirror.Pass
            : ed.somethingSelected() ? ed.indentSelection('add') : ed.replaceSelection(' '.repeat(ed.getOption('indentUnit')), 'end')),
          'Shift-Tab': (ed) => (vimNormal(ed) ? window.CodeMirror.Pass : ed.execCommand('indentLess')),
        },
      });
      if (window.CodeMirror.Vim) {
        window.CodeMirror.Vim.defineEx('write', 'w', () => saveNow());
        cm.on('vim-mode-change', (e) => { vimMode = e.mode + (e.subMode ? ' ' + e.subMode : ''); showPos(); });
        setVim(store.get('editor:vim') === '1');
      } else {
        $('#vim').hidden = true;  // the keymap didn't load
      }
      cm.on('changes', saveSoon);
      cm.on('cursorActivity', showPos);
      if (window.ResizeObserver) {
        let frame = 0;
        new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => cm.refresh()); }).observe(host);
      }
    } else {
      plainEditor = document.createElement('textarea');
      plainEditor.className = 'fallback-editor';
      plainEditor.spellcheck = false;
      plainEditor.setAttribute('aria-label', 'Code');
      host.appendChild(plainEditor);
      plainEditor.addEventListener('input', saveSoon);
    }
  }
  const code = () => (cm ? cm.getValue() : plainEditor.value);
  // Each checkpoint starts blank; the boilerplate (input/output done) is one click away.
  const kindOf = (c) => (c.boilerplate && store.get(c.id + ':kind') === 'boilerplate' ? 'boilerplate' : 'blank');
  const starterOf = (c, kind) => (kind === 'boilerplate' && c.boilerplate ? c.boilerplate : c.starter);
  const kindName = (kind) => (kind === 'boilerplate' ? 'Boilerplate' : 'Blank');
  function setCode(text) {
    if (cm) cm.setValue(text); else plainEditor.value = text;
  }
  function useStarter(c, kind) {
    if (kind === 'boilerplate') store.set(c.id + ':kind', kind); else store.del(c.id + ':kind');
    setCode(starterOf(c, kind));
    store.del(c.id + ':draft');
    paintKind(c);
    showSaved();
  }
  function paintKind(c) {
    $('#kind').hidden = !c.boilerplate;
    $$('#kind [data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kindOf(c))));
  }
  // A one-line question in the code toolbar (the page can't use confirm()).
  let onYes = null, onNo = null;
  function ask(text, yes, labels, no) {
    onYes = yes;
    onNo = no || null;
    $('#confirm-text').textContent = text;
    $('#confirm-yes').textContent = (labels && labels[0]) || 'Replace';
    $('#confirm-no').textContent = (labels && labels[1]) || 'Cancel';
    $('#confirm').hidden = false;
    $('#confirm-yes').focus();
  }
  $('#kind').addEventListener('click', (e) => {
    const b = e.target.closest('[data-kind]');
    const c = BY[current];
    if (!b || !c || b.dataset.kind === kindOf(c)) return;
    const text = code();
    if (text === c.starter || text === c.boilerplate) useStarter(c, b.dataset.kind);
    else ask(`Replace your code with the ${kindName(b.dataset.kind).toLowerCase()} starter?`, () => useStarter(c, b.dataset.kind));
  });
  $('#reset').addEventListener('click', () => {
    const c = BY[current];
    ask(`Replace your code with the ${kindName(kindOf(c)).toLowerCase()} starter?`, () => useStarter(c, kindOf(c)));
  });
  $('#confirm-no').addEventListener('click', () => {
    $('#confirm').hidden = true;
    if (onNo) onNo();
  });
  $('#confirm-yes').addEventListener('click', () => {
    $('#confirm').hidden = true;
    if (current && onYes) onYes();
  });

  function loadEditor(c) {
    // Live mode: the solution file on disk is the source of truth, not browser drafts.
    const draft = LOCAL ? (live.disk[c.solution] ? live.disk[c.solution].text : null) : store.get(c.id + ':draft');
    const start = starterOf(c, kindOf(c));
    if (cm) {
      if (!docs[c.id]) docs[c.id] = window.CodeMirror.Doc(draft !== null ? draft : start, c.lang.mime);
      cm.swapDoc(docs[c.id]);
      cm.setOption('indentUnit', c.indent);
      cm.setOption('tabSize', c.indent);
    } else {
      plainEditor.value = draft !== null ? draft : start;
      plainEditor.style.tabSize = c.indent;
    }
    paintKind(c);
    $('#lang').innerHTML = `${esc(c.lang.label)} <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
    $('#file').textContent = c.solution;
    $('#confirm').hidden = true;
    showSaved();
    showPos();
    if (LOCAL) openCheckpointFiles(c);
  }
  function saveSoon() {
    if (live.quiet) return;
    if (LOCAL) { saveSoonLive(); return; }
    clearTimeout(saveTimer);
    $('#saved').textContent = 'Saving…';
    const id = current;
    saveTimer = setTimeout(() => {
      if (id !== current) return;
      const text = code();
      const c = BY[id];
      if (text === starterOf(c, kindOf(c))) store.del(id + ':draft'); else store.set(id + ':draft', text);
      showSaved();
    }, 400);
  }
  function showSaved() {
    if (!current) return;
    if (LOCAL) {
      const path = live.active || BY[current].solution, known = live.disk[path];
      $('#saved').textContent = !live.online ? 'Not saved: the study server has stopped'
        : live.conflict[path] ? 'The file changed on disk'
        : known && known.text === code() ? `Saved to ${path}` : 'Saving…';
      return;
    }
    $('#saved').textContent = drafted(current) ? 'Saved in this browser' : `${kindName(kindOf(BY[current]))} starter`;
  }
  function showPos() {
    if (!cm) { $('#pos').textContent = ''; return; }
    const p = cm.getCursor();
    $('#pos').textContent = (vimOn ? `${vimMode.toUpperCase()} · ` : '') + `Ln ${p.line + 1}, Col ${p.ch + 1}`;
  }

  // ---- Vim keys (CodeMirror's Vim keymap), remembered in this browser
  let vimOn = false, vimMode = 'normal';
  function vimNormal(ed) { return !!(ed.state.vim && !ed.state.vim.insertMode); }
  function setVim(on) {
    vimOn = !!(on && cm && window.CodeMirror.Vim);
    if (cm) cm.setOption('keyMap', vimOn ? 'vim' : 'default');
    vimMode = 'normal';
    $('#vim').setAttribute('aria-pressed', String(vimOn));
    if (vimOn) store.set('editor:vim', '1'); else store.del('editor:vim');
    showPos();
  }
  $('#vim').addEventListener('click', () => { setVim(!vimOn); if (cm) cm.focus(); });

  // Save now: :w in Vim, or Ctrl+S anywhere in the problem view.
  function saveNow() {
    if (!current) return;
    if (LOCAL) { saveAll(); return; }
    clearTimeout(saveTimer);
    const c = BY[current], text = code();
    if (text === starterOf(c, kindOf(c))) store.del(c.id + ':draft'); else store.set(c.id + ':draft', text);
    showSaved();
  }

  // ---- clipboard
  function copyText(text) {
    try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch (e) { return Promise.resolve(false); }
  }
  function selectAllCode() {
    if (cm) { cm.focus(); cm.execCommand('selectAll'); } else { plainEditor.focus(); plainEditor.select(); }
  }
  function flash(btn, ok) {
    const old = btn.innerHTML;
    btn.innerHTML = ok ? 'Copied' : 'Press Ctrl+C';
    btn.classList.toggle('done', ok);
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove('done'); }, 1400);
  }
  $('#copy-code').addEventListener('click', () => {
    const btn = $('#copy-code');
    copyText(code()).then((ok) => {
      if (!ok) selectAllCode();
      btn.style.color = ok ? 'var(--ok)' : '';
      setTimeout(() => { btn.style.color = ''; }, 1200);
    });
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    copyText(b.dataset.copy).then((ok) => {
      if (!ok) {
        const range = document.createRange();
        range.selectNodeContents(b.previousElementSibling);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      }
      flash(b, ok);
    });
  });

  // ---- Run / Submit: copy the code, then show what to run in the terminal
  function act(kind) {
    if (!current) return;
    if (LOCAL) { runLive(kind, {}); return; }
    const c = BY[current];
    const list = casesOf(c);
    const test = kind === 'run' && list[caseIndex] ? list[caseIndex].test : null;
    const text = code();
    const entry = { kind, test, copied: false, empty: !text.trim() };
    // Say up front what the checker will answer, instead of letting it look like a failure later.
    if (entry.empty) entry.warn = `Your code is empty. The checker will answer “Not started yet” until <code>${esc(c.solution)}</code> has a program in it.`;
    else if (text.trim() === c.starter.trim()) entry.warn = 'This is still the blank starter (an empty <code>main</code>), so the checker will answer “Not started yet”. Write your program first, or pick Boilerplate above the editor for ready-made input/output code.';
    lastAction[c.id] = entry;
    if (entry.empty) {
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
      return;
    }
    copyText(text).then((ok) => {
      entry.copied = ok;
      if (!ok) selectAllCode();
      renderResult(c);
      setBottom('result');
      $('#result').scrollTop = 0;
    });
  }
  $('#run').addEventListener('click', () => act('run'));
  $('#submit').addEventListener('click', () => act('submit'));
  document.addEventListener('keydown', (e) => {
    if (!current || !(e.ctrlKey || e.metaKey) || e.target.id === 'paste') return;
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); saveNow(); return; }
    if (e.key === 'Enter') { e.preventDefault(); act('submit'); }
    else if (e.key === "'") { e.preventDefault(); act('run'); }
  }, true);

  // ---------------------------------------------------------------- live mode (.\study)
  // Served by tools/serve.py, the page saves your files and runs the checker itself, so Run and
  // Submit show the verdict directly. The published copy of the book keeps the copy-and-paste steps.
  // Everything here is keyed by file path: the checkpoint's file and the shared files in
  // solutions/common/ are loaded, autosaved and watched the same way.
  const LOCAL = window.WORKBOOK_LOCAL || null;
  const live = { online: !!LOCAL, disk: {}, conflict: {}, conflictData: {}, report: {}, marks: {}, busy: false,
    quiet: false, tabs: [], active: null, project: [], showTree: false, tick: 0 };
  const shared = {};                                    // path -> CodeMirror.Doc for files in solutions/common/
  const BY_PATH = Object.fromEntries(CPS.map((c) => [c.solution, c]));
  const pending = new Set();                            // files with unsaved edits
  let diskTimer = 0;

  async function api(path, options) {
    const res = await fetch(path, Object.assign({ headers: { 'X-Workbook-Token': LOCAL.token, 'Content-Type': 'application/json' } }, options || {}));
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw Object.assign(new Error(body.error || res.statusText), { status: res.status, body });
    }
    return res.json();
  }
  function setOnline(ok) {
    if (live.online !== ok) { live.online = ok; paintLive(); showSaved(); }
  }
  function paintLive() {
    const el = $('#live');
    if (!LOCAL) return;
    el.hidden = false;
    el.className = 'live ' + (!live.online ? 'off' : LOCAL.problem ? 'warn' : 'on');
    el.textContent = !live.online ? 'Disconnected' : LOCAL.problem ? "Can't build yet" : 'Live';
    el.title = !live.online ? 'The study server has stopped. Start it again (double-click study.cmd, or run .\\study), then reload this page.'
      : LOCAL.problem || `Run and Submit build and check your code in ${LOCAL.folder}`;
  }

  // ---- files
  const isShared = (path) => !BY_PATH[path];
  const shortName = (path) => path.replace(/^solutions\//, '');
  const docOf = (path) => (BY_PATH[path] ? docs[BY_PATH[path].id] : shared[path]);
  const textOf = (path) => (cm ? (docOf(path) ? docOf(path).getValue() : null) : path === live.active ? plainEditor.value : null);
  const EXT_MODES = { cpp: 'text/x-c++src', cc: 'text/x-c++src', cxx: 'text/x-c++src', h: 'text/x-c++src', hpp: 'text/x-c++src',
    c: 'text/x-csrc', java: 'text/x-java', cs: 'text/x-csharp', kt: 'text/x-kotlin', py: 'text/x-python', js: 'text/javascript',
    mjs: 'text/javascript', ts: 'text/typescript', rs: 'text/x-rustsrc', go: 'text/x-go' };
  const modeFor = (path) => EXT_MODES[(path.split('.').pop() || '').toLowerCase()] || 'text/plain';
  const fromDisk = (f) => ({ mtime: f.mtime, text: (f.text === null ? '' : f.text).replace(/\r\n/g, '\n'), missing: f.text === null });

  function setDocQuietly(path, text) {
    // Swap in text from disk without saving it straight back, keeping the cursor where it was.
    live.quiet = true;
    const doc = docOf(path);
    if (doc) { const at = doc.getCursor(); doc.setValue(text); doc.setCursor(at); }
    else if (!cm && path === live.active) plainEditor.value = text;
    live.quiet = false;
  }
  async function loadFile(path) {
    try {
      const f = fromDisk(await api('/api/file?path=' + encodeURIComponent(path)));
      setOnline(true);
      live.disk[path] = f;
      if (!docOf(path) && isShared(path) && cm) shared[path] = window.CodeMirror.Doc(f.text, modeFor(path));
      else if (!f.missing && textOf(path) !== f.text) setDocQuietly(path, f.text);
    } catch (e) { if (!e.status) setOnline(false); }
    if (path === live.active) showSaved();
  }
  function saveSoonLive() {
    if (!live.active) return;
    pending.add(live.active);
    clearTimeout(diskTimer);
    $('#saved').textContent = 'Saving…';
    diskTimer = setTimeout(saveAll, 600);
  }
  async function saveAll() {
    clearTimeout(diskTimer);
    const paths = [...new Set([...pending, ...live.tabs])];
    pending.clear();
    for (const path of paths) await saveFile(path);
  }
  async function saveFile(path) {
    const text = textOf(path);
    if (text === null || live.conflict[path]) return;
    const known = live.disk[path];
    if (!known || known.text === text) { if (path === live.active) showSaved(); return; }  // not loaded yet, or nothing new
    try {
      const r = await api('/api/file', { method: 'PUT', body: JSON.stringify({ path, text, base: known.mtime }) });
      live.disk[path] = { mtime: r.mtime, text };
      setOnline(true);
    } catch (e) {
      if (e.status === 409) conflict(path, fromDisk(e.body)); else if (!e.status) setOnline(false);
    }
    if (path === live.active) showSaved();
  }
  // Both this page and another editor changed a file: let the learner pick, never overwrite silently.
  function conflict(path, f) {
    pending.delete(path);
    live.conflict[path] = true;
    live.conflictData[path] = f;
    if (path === live.active) { showSaved(); askConflict(path); }
    paintTabs();
  }
  function askConflict(path) {
    const f = live.conflictData[path];
    ask(`${shortName(path)} changed on disk while you were typing here.`, () => {
      live.conflict[path] = false; live.disk[path] = f; setDocQuietly(path, f.text); showSaved(); paintTabs();
    }, ['Load the file', 'Keep mine'], () => {
      live.conflict[path] = false; live.disk[path] = f; saveFile(path); paintTabs();
    });
  }
  // Edits made in another editor (VS Code, Notepad) show up here, for every open file.
  async function watchDisk() {
    if (!LOCAL || !live.active || document.hidden || live.busy || !$('#confirm').hidden) return;
    for (const path of live.tabs) {
      try {
        const f = fromDisk(await api('/api/file?path=' + encodeURIComponent(path)));
        setOnline(true);
        const known = live.disk[path], mine = textOf(path);
        if (!known || f.mtime === known.mtime || mine === null || live.conflict[path]) continue;
        if (f.text === mine) { live.disk[path] = f; continue; }
        if (known.text === mine) {  // nothing unsaved here: just take the new version
          live.disk[path] = f;
          setDocQuietly(path, f.text);
          if (path === live.active) $('#saved').textContent = 'Updated from the file on disk';
          continue;
        }
        conflict(path, f);
      } catch (e) { if (!e.status) setOnline(false); }
    }
    if (live.showTree && ++live.tick % 3 === 0) refreshProject();
  }
  if (LOCAL) {
    setInterval(watchDisk, 2000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });
  }

  // ---- tabs: the checkpoint's own file, plus any shared files you opened (remembered)
  function openCheckpointFiles(c) {
    const kept = (() => { try { return JSON.parse(store.get('tabs') || '[]'); } catch (e) { return []; } })();
    live.tabs = [c.solution, ...kept.filter((p) => isShared(p))];
    live.active = c.solution;
    loadFile(c.solution);
    live.tabs.slice(1).forEach((p) => { if (!live.disk[p]) loadFile(p); });
    paintFiles();
  }
  function openTab(path, line) {
    if (BY_PATH[path] && BY_PATH[path].id !== current) { go('p' + BY_PATH[path].id); return; }
    if (!live.tabs.includes(path)) live.tabs.push(path);
    store.set('tabs', JSON.stringify(live.tabs.filter(isShared)));
    activate(path, line);
  }
  function activate(path, line) {
    live.active = path;
    if (cm) {
      if (!docOf(path)) { shared[path] = window.CodeMirror.Doc('', modeFor(path)); loadFile(path); }
      cm.swapDoc(docOf(path));
      if (line) { cm.setCursor({ line: line - 1, ch: 0 }); cm.scrollIntoView(null, 80); }
      cm.focus();
      requestAnimationFrame(() => cm.refresh());
    }
    paintFiles();
    showSaved();
    showPos();
    if (live.conflict[path]) askConflict(path);
  }
  function closeTab(path) {
    if (!isShared(path)) return;
    saveFile(path);
    live.tabs = live.tabs.filter((p) => p !== path);
    store.set('tabs', JSON.stringify(live.tabs.filter(isShared)));
    if (live.active === path) activate(live.tabs[0]); else paintFiles();
  }
  function paintTabs() {
    const bar = $('#ftabs');
    if (!LOCAL || !cm || live.tabs.length < 2) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.innerHTML = live.tabs.map((p) => `<span class="ftab${p === live.active ? ' on' : ''}${live.conflict[p] ? ' warn' : ''}" role="tab" aria-selected="${p === live.active}">`
      + `<button type="button" data-tab="${esc(p)}">${esc(shortName(p))}</button>`
      + (isShared(p) ? `<button type="button" class="x" data-close="${esc(p)}" aria-label="Close ${esc(shortName(p))}">×</button>` : '') + '</span>').join('');
  }
  function paintFiles() {
    const path = live.active, onCheckpoint = !isShared(path);
    paintTabs();
    $('#file').textContent = path || '';
    const ext = (path || '').split('.').pop();
    const names = { h: 'C/C++ header', hpp: 'C++ header', cpp: 'C++', cc: 'C++', cxx: 'C++', c: 'C', py: 'Python', js: 'JavaScript',
      mjs: 'JavaScript', ts: 'TypeScript', rs: 'Rust', go: 'Go', java: 'Java', kt: 'Kotlin', cs: 'C#', md: 'Markdown', txt: 'Text', json: 'JSON' };
    if (!onCheckpoint) $('#lang').textContent = names[ext.toLowerCase()] || ext.toUpperCase();
    else if (current) $('#lang').innerHTML = `${esc(BY[current].lang.label)} <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
    // The starter switch and Reset only make sense for the checkpoint's own file.
    $('#kind').hidden = !onCheckpoint || !(current && BY[current].boilerplate);
    $('#reset').hidden = !onCheckpoint;
    renderTree();
  }
  $('#ftabs').addEventListener('click', (e) => {
    const close = e.target.closest('[data-close]');
    if (close) { closeTab(close.dataset.close); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) activate(tab.dataset.tab);
  });

  // ---- the Files panel: your project as it grows
  async function refreshProject() {
    try { live.project = (await api('/api/files')).files; setOnline(true); } catch (e) { if (!e.status) setOnline(false); }
    renderTree();
  }
  function renderTree() {
    const tree = $('#tree');
    if (!LOCAL || !cm) return;
    tree.hidden = !live.showTree;
    $('#tree-btn').setAttribute('aria-pressed', String(live.showTree));
    if (!live.showTree) return;
    const files = live.project;
    const common = files.filter((f) => !f.checkpoint);
    const cps = files.filter((f) => f.checkpoint);
    const usedBy = (p) => cps.filter((f) => (f.uses || []).includes(p)).map((f) => BY[f.checkpoint] ? BY[f.checkpoint].num : f.checkpoint);
    const solvedCount = CPS.filter((c) => solved(c.id)).length;
    tree.innerHTML = `<div class="tree-dir"><span>common/</span><button type="button" class="tree-add" id="new-file" title="New shared file" aria-label="New shared file">+</button></div>
      <form class="new-file" id="new-file-form" hidden><input id="new-file-name" spellcheck="false" placeholder="name.h" aria-label="New file name"></form>
      ${common.length ? common.map((f) => {
        const users = usedBy(f.path);
        return `<button type="button" class="tree-item${f.path === live.active ? ' on' : ''}" data-open="${esc(f.path)}" title="${esc(shortName(f.path))} · ${f.lines} lines${users.length ? ' · used by ' + users.join(', ') : ''}"><span class="nm">${esc(f.path.replace(/^solutions\/common\//, ''))}</span>${users.length ? `<span class="tag-n">${users.length}</span>` : ''}</button>`;
      }).join('') : '<p class="tree-empty">Nothing shared yet. Code that later checkpoints can reuse goes here.</p>'}
      <div class="tree-dir"><span>checkpoints</span></div>
      ${cps.map((f) => {
        const c = BY[f.checkpoint]; if (!c) return '';
        const mark = store.get(c.id + ':broke') ? '<span class="tm broke" title="Passed before, failing now">!</span>'
          : solved(c.id) ? '<span class="tm ok" title="Solved">✓</span>' : '<span class="tm"></span>';
        return `<button type="button" class="tree-item${c.id === current ? ' on' : ''}" data-open="${esc(f.path)}" title="${esc(c.num)}. ${esc(c.title)}${(f.uses || []).length ? ' · uses ' + f.uses.map(shortName).join(', ') : ''}">${mark}<span class="nm">${esc(f.path.split('/').pop())}</span>${(f.uses || []).length ? `<span class="tag-n" title="uses ${f.uses.length} shared file(s)">${f.uses.length}</span>` : ''}</button>`;
      }).join('')}
      <div class="tree-foot"><button class="btn" type="button" id="recheck"${solvedCount ? '' : ' disabled'}>Re-check solved (${solvedCount})</button></div>`;
  }
  $('#tree-btn').addEventListener('click', () => {
    live.showTree = !live.showTree;
    store.set('tree', live.showTree ? '1' : '0');
    if (live.showTree) refreshProject(); else renderTree();
    if (cm) requestAnimationFrame(() => cm.refresh());
  });
  $('#tree').addEventListener('click', (e) => {
    const open = e.target.closest('[data-open]');
    if (open) { openTab(open.dataset.open); return; }
    if (e.target.closest('#new-file')) { const form = $('#new-file-form'); form.hidden = !form.hidden; if (!form.hidden) $('#new-file-name').focus(); return; }
    if (e.target.closest('#recheck')) recheckSolved();
  });
  $('#tree').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#new-file-name').value.trim();
    if (!/^[A-Za-z_][\w.-]*\.(h|hpp|c|cc|cpp|cxx|py|js|mjs|ts|rs|go|java|kt|cs|md|txt)$/.test(name)) {
      $('#new-file-name').setCustomValidity('Use a name like bytes.h or bytes.cpp'); $('#new-file-name').reportValidity(); return;
    }
    const path = 'solutions/common/' + name;
    const start = /\.(h|hpp)$/.test(name) ? '#pragma once\n\n' : '';
    try {
      await api('/api/file', { method: 'PUT', body: JSON.stringify({ path, text: start, base: '0' }) });  // '0': only if it doesn't exist yet
    } catch (err) { if (err.status !== 409) { setOnline(!!err.status); return; } }
    await refreshProject();
    openTab(path);
  });
  $('#tree').addEventListener('input', (e) => { if (e.target.id === 'new-file-name') e.target.setCustomValidity(''); });

  // ---- Re-check solved: catches a change to shared code that broke something you'd already passed
  async function recheckSolved() {
    const ids = CPS.filter((c) => solved(c.id)).map((c) => c.id);
    if (!ids.length || live.busy) return;
    await saveAll();
    live.busy = true;
    $('#run').disabled = $('#submit').disabled = true;
    setBottom('result');
    const rows = [];
    for (const [k, id] of ids.entries()) {
      $('#result').innerHTML = `<div class="running"><span class="spinner" aria-hidden="true"></span>Re-checking your solved checkpoints: ${k + 1} of ${ids.length} (${esc(BY[id].num)}. ${esc(BY[id].title)})…</div>` + recheckTable(rows);
      let r;
      try { r = await api('/api/check/' + id, { method: 'POST', body: '{}' }); setOnline(true); } catch (e) { setOnline(false); r = { verdict: 'offline' }; }
      live.report[id] = r;
      if (r.verdict === 'accepted') store.del(id + ':broke'); else store.set(id + ':broke', '1');
      rows.push({ id, r });
    }
    live.busy = false;
    $('#run').disabled = $('#submit').disabled = false;
    const broke = rows.filter((x) => x.r.verdict !== 'accepted');
    $('#result').innerHTML = `<div class="verdict ${broke.length ? 'bad' : 'ok'}"><h2>${broke.length ? `${broke.length} broke` : 'All still pass'}</h2><span class="sub">${rows.length - broke.length} / ${rows.length} solved checkpoints pass</span></div>`
      + `<p class="note">${broke.length ? 'These passed before and fail now, most likely because of a change to shared code. Open one to see its failing tests.' : 'Every checkpoint you solved still passes with your current code.'}</p>`
      + recheckTable(rows);
    renderTree();
  }
  function recheckTable(rows) {
    const looks = { accepted: ['ok', 'Accepted'], 'wrong-answer': ['bad', 'Wrong Answer'], 'compile-error': ['bad', 'Compile Error'],
      'not-started': ['warn', 'Not started yet'], 'not-implemented': ['warn', 'Not implemented yet'], offline: ['unknown', 'Not connected'] };
    return rows.length ? `<div class="recheck">${rows.map(({ id, r }) => {
      const [kind, label] = looks[r.verdict] || ['unknown', 'Error'];
      return `<a class="rc-row" href="#p${id}"><span class="rc-n">${esc(BY[id].num)}.</span><span class="rc-t">${esc(BY[id].title)}</span><span class="rc-v ${kind}">${label}${r.total ? ` ${r.passed}/${r.total}` : ''}</span></a>`;
    }).join('')}</div>` : '';
  }

  // ---- Run / Submit, for real
  async function runLive(kind, options) {
    const c = BY[current];
    if (!c || live.busy) return;
    const list = casesOf(c);
    const test = kind === 'run' && list[caseIndex] ? list[caseIndex].test : null;
    const stuck = live.tabs.find((p) => live.conflict[p]);
    if (stuck) { activate(stuck); return; }
    await saveAll();
    live.busy = true;
    $('#run').disabled = $('#submit').disabled = true;
    setBottom('result');
    const what = test ? `Running test ${esc(test)}…` : options.fresh ? 'Making a fresh set of tests and running them…' : `Building and running all ${c.tests} tests…`;
    $('#result').innerHTML = `<div class="running"><span class="spinner" aria-hidden="true"></span>${what}</div>`;
    let report;
    try {
      report = await api('/api/check/' + c.id, { method: 'POST', body: JSON.stringify({ case: test, fresh: !!options.fresh }) });
      setOnline(true);
    } catch (e) {
      setOnline(false);
      report = { verdict: 'offline' };
    }
    live.busy = false;
    $('#run').disabled = $('#submit').disabled = false;
    report.test = test;
    report.fresh = !!options.fresh;
    live.report[c.id] = report;
    if (report.verdict === 'accepted') { setSolved(c.id, true); store.del(c.id + ':broke'); }
    await markErrors(c, report);
    if (current === c.id) { renderLiveResult(c); $('#result').scrollTop = 0; }
    if (live.showTree) refreshProject();
  }

  // Compile errors are marked in whichever file they're in: the checkpoint's or a shared one.
  function errorPath(c, file) {
    const f = String(file || '').replace(/\\/g, '/');
    const known = [c.solution, ...live.project.filter((x) => !x.checkpoint).map((x) => x.path), ...live.tabs];
    return known.find((p) => f === p || f.endsWith('/' + p)) || null;
  }
  async function markErrors(c, report) {
    Object.entries(live.marks).forEach(([path, handles]) => {
      const doc = docOf(path);
      if (doc) handles.forEach((h) => doc.removeLineClass(h, 'background', 'cm-error-line'));
    });
    live.marks = {};
    if (!cm) return;
    if ((report.errors || []).some((e) => !errorPath(c, e.file))) await refreshProject();
    for (const e of (report.errors || []).filter((x) => x.kind === 'error')) {
      const path = errorPath(c, e.file);
      if (!path) continue;
      if (!docOf(path)) { shared[path] = window.CodeMirror.Doc('', modeFor(path)); await loadFile(path); }
      const doc = docOf(path);
      const line = Math.min(Math.max(e.line - 1, 0), doc.lineCount() - 1);
      (live.marks[path] = live.marks[path] || []).push(doc.addLineClass(line, 'background', 'cm-error-line'));
    }
  }

  const tail = (text, n) => String(text || '').trim().split('\n').slice(-n).join('\n');
  const fileUrl = (path) => '/files/' + path.split('/').map(encodeURIComponent).join('/')
    + '?t=' + encodeURIComponent(LOCAL.token) + '&v=' + Date.now();

  function liveHelp(r, c) {
    switch (r.verdict) {
      case 'accepted': return 'Every test passes. Saved as solved; the Editorial tab is open now.';
      case 'wrong-answer': return r.wroteNothing
        ? "Your program ran but didn't write anything. It's started with two file names: the input to read and the output to write. Write your answer to the second one."
        : 'Some tests failed. Each one below shows what was expected and what your program wrote.'
          + (r.mostLikely ? ` Most of them point to <b>${esc(r.mostLikely.id)}</b>: ${esc(r.mostLikely.text)}.` : '');
      case 'compile-error': return r.noMain
        ? 'Your code has no <code>main</code> function, so it can\'t be built into a program. Add a <code>main</code> that reads the input file and writes the output file.'
        : "Your code didn't build, so no tests ran. Lines with errors are marked in the editor; fix the first error first, since later ones often follow from it.";
      case 'not-started': return r.empty
        ? 'Your solution file is empty, so there was nothing to check. Write your program in the editor.'
        : 'The editor still holds the blank starter, so there was nothing to check. Write your program, or pick Boilerplate above the editor for ready-made input/output code.';
      case 'not-implemented': return `The boilerplate function <code>${esc(r.function || 'a function')}</code> still says it isn't written. Fill it in and Submit again.`;
      case 'passed': return `This test passes. Submit runs all ${c.tests}.`;
      case 'failed': return 'This test fails. Its input, your output and the expected output are below.';
      case 'offline': return "The study server has stopped, so nothing ran. Start it again (double-click <code>study.cmd</code>, or run <code>.\\study</code> in the workbook folder), then reload this page.";
      default: return esc(r.message || 'The checker ran into a problem.');
    }
  }

  // ---- Your output vs expected: lines are lined up, then the differing words are marked. Words and
  // numbers are compared the way the checker compares them (quoted strings are one word; numbers
  // within the checkpoint's tolerance are equal), so only real differences light up.
  const words = (line) => line.match(/"[^"]*"|\S+/g) || [];
  const sameWord = (a, b, tol) => {
    if (a === b) return true;
    const x = Number(a), y = Number(b);
    return tol > 0 && a.trim() !== '' && b.trim() !== '' && isFinite(x) && isFinite(y) && Math.abs(x - y) <= tol + 1e-12;
  };
  const sameLine = (a, b, tol) => a.length === b.length && a.every((w, k) => sameWord(w, b[k], tol));
  function matchPairs(a, b, eq) {
    // Longest common subsequence: which items of a and b line up. Falls back to position for huge inputs.
    const n = a.length, m = b.length;
    if (n * m > 400000) return Array.from({ length: Math.min(n, m) }, (_, i) => i).filter((i) => eq(a[i], b[i])).map((i) => [i, i]);
    const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const pairs = [];
    for (let i = 0, j = 0; i < n && j < m;) {
      if (eq(a[i], b[j])) { pairs.push([i, j]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    return pairs;
  }
  function diffOutputs(actual, expected, compare) {
    const tol = (compare && compare.tolerance) || 0;
    const clipped = (l) => /^\.\.\. \(\d+ more lines\)$/.test(l);
    const A = actual.map((t) => ({ text: t, w: words(t), kind: clipped(t) ? 'clip' : 'same', marks: new Set() }));
    const E = expected.map((t) => ({ text: t, w: words(t), kind: clipped(t) ? 'clip' : 'same', marks: new Set() }));
    const eq = (a, b) => a.kind !== 'clip' && b.kind !== 'clip' && sameLine(a.w, b.w, tol);
    if (compare && compare.mode === 'unordered') {  // any order: a line is fine if some expected line matches it
      const used = new Set();
      A.forEach((a) => { const j = E.findIndex((e, k) => !used.has(k) && eq(a, e)); if (j >= 0) used.add(j); else if (a.kind !== 'clip') a.kind = 'extra'; });
      E.forEach((e, k) => { if (!used.has(k) && e.kind !== 'clip') e.kind = 'missing'; });
      return { yours: A, expected: E };
    }
    const pairs = matchPairs(A, E, eq).concat([[A.length, E.length]]);
    let i = 0, j = 0;
    for (const [pi, pj] of pairs) {
      // Lines between two matches: pair them up as changed lines, the rest are extra or missing.
      while (i < pi && j < pj) {
        const a = A[i++], e = E[j++];
        if (a.kind === 'clip' || e.kind === 'clip') continue;
        a.kind = e.kind = 'changed';
        // Same number of words: the checker compares them position by position, so do that too.
        const hit = a.w.length === e.w.length
          ? a.w.map((w, k) => [k, k]).filter(([k]) => sameWord(a.w[k], e.w[k], tol))
          : matchPairs(a.w, e.w, (x, y) => sameWord(x, y, tol));
        const ha = new Set(hit.map((p) => p[0])), he = new Set(hit.map((p) => p[1]));
        a.w.forEach((_, k) => { if (!ha.has(k)) a.marks.add(k); });
        e.w.forEach((_, k) => { if (!he.has(k)) e.marks.add(k); });
      }
      while (i < pi) { if (A[i].kind !== 'clip') A[i].kind = 'extra'; i++; }
      while (j < pj) { if (E[j].kind !== 'clip') E[j].kind = 'missing'; j++; }
      i = pi + 1; j = pj + 1;
    }
    return { yours: A, expected: E };
  }
  function diffBlock(title, lines, tone) {
    if (!lines.length) return `<div class="field"><div class="field-k">${title}</div><pre class="field-v diff"><span class="dl clip">(nothing)</span></pre></div>`;
    const body = lines.map((l) => {
      const inner = l.kind === 'clip' || !l.w.length ? esc(l.text)
        : l.w.map((w, k) => (l.marks.has(k) ? `<span class="tk-${tone}">${esc(w)}</span>` : esc(w))).join(' ');
      return `<span class="dl ${l.kind} ${tone}">${inner || ' '}</span>`;
    }).join('');
    return `<div class="field"><div class="field-k">${title}</div><pre class="field-v diff">${body}</pre></div>`;
  }

  function caseBody(x, report) {
    let h = x.message ? `<p class="note bad-text">${esc(x.message)}</p>` : '';
    if (x.causes && x.causes.length) h += `<p class="note">Likely cause: ${x.causes.map((k) => `<b>${esc(k.id)}</b> ${esc(k.text)}`).join('; ')}</p>`;
    if (x.images) {
      const pics = [['Expected', x.images.expected], ['Yours', x.images.actual], ['Difference', x.images.diff]].filter((p) => p[1]);
      h += `<div class="img-cmp">${pics.map(([t, p]) => `<figure><img src="${fileUrl(p)}" alt="${esc(t)}"><figcaption>${t}</figcaption></figure>`).join('')}</div>`;
      if (x.images.diff) h += '<p class="note">In the difference: red is ink you added, blue is ink you missed, magenta is the wrong colour, and yellow is forgiven (edges may move one pixel).</p>';
    } else {
      const d = diffOutputs(x.actual || [], x.expected || [], report && report.compare);
      h += `<div class="field"><div class="field-k">Input</div><pre class="field-v">${esc((x.input || []).join('\n'))}</pre></div>`
        + diffBlock('Your output', d.yours, 'del') + diffBlock('Expected', d.expected, 'add')
        + `<p class="note muted">Highlighted: what differs${report && report.compare && report.compare.tolerance ? ` (numbers within ${report.compare.tolerance} count as equal)` : ''}${report && report.compare && report.compare.mode === 'unordered' ? '; line order doesn\'t matter here' : ''}.</p>`;
    }
    if (x.source) h += `<p class="note muted">Expected values from: ${esc(x.source)}</p>`;
    return h;
  }

  function reportHtml(r, c) {
    const looks = { accepted: ['ok', 'Accepted'], passed: ['ok', 'Accepted'], 'wrong-answer': ['bad', 'Wrong Answer'],
      failed: ['bad', 'Wrong Answer'], 'compile-error': ['bad', 'Compile Error'], 'not-started': ['warn', 'Not started yet'],
      'not-implemented': ['warn', 'Not implemented yet'], offline: ['unknown', 'Not connected'], dispute: ['ok', 'Dispute recorded'] };
    const [kind, label] = looks[r.verdict] || ['unknown', 'Something went wrong'];
    const single = r.verdict === 'passed' || r.verdict === 'failed';
    const sub = [single ? `test ${esc(r.test || '')}` : r.total ? `${r.passed} / ${r.total} testcases passed` : '',
      r.disputed && r.disputed.length ? `${r.disputed.length} disputed` : '', r.fresh ? 'fresh tests' : '',
      r.seconds != null ? `${r.seconds} s` : ''].filter(Boolean).join(' · ');
    let h = `<div class="verdict ${kind}"><h2>${esc(label)}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
    h += `<p class="note">${liveHelp(r, c)}</p>`;
    if (r.verdict === 'compile-error') {
      const errs = (r.errors || []).filter((e) => e.kind === 'error').slice(0, 8);
      if (errs.length) h += `<div class="err-list">${errs.map((e) => {
        const path = errorPath(c, e.file);
        const body = `<span class="loc">${esc(e.file.split('/').pop())}:${e.line}:${e.column}</span> ${esc(e.message)}`;
        return path ? `<button type="button" class="err" data-goto="${esc(path)}" data-line="${e.line}" title="Open ${esc(shortName(path))} at line ${e.line}">${body}</button>` : `<div>${body}</div>`;
      }).join('')}</div>`;
      h += `<div class="field-k">Compiler output</div><pre class="raw">${esc(tail(r.build || r.text, 60))}</pre>`;
    }
    if (single && r.cases && r.cases[0]) h += caseBody(r.cases[0], r);
    if (!single && r.requirements && r.requirements.length) {
      h += '<div class="req-rows">' + r.requirements.map((q) => `<div class="req-row${q.passed === q.total ? '' : ' fail'}"><span class="rid">${esc(q.id)}</span><span class="rq" title="${esc(q.text)}">${esc(q.text)}</span><span class="cnt">${q.passed} / ${q.total}</span><span class="bar"><i style="width:${q.total ? (q.passed / q.total) * 100 : 0}%"></i></span></div>`).join('') + '</div>';
    }
    if (!single) {
      const failing = (r.cases || []).filter((x) => x.status !== 'pass');
      const shown = failing.filter((x) => x.message !== undefined);
      h += shown.map((x, i) => `<details class="case-card"${i < 2 ? ' open' : ''}><summary><span class="id">${esc(x.id)}</span> <span class="t">${esc(x.title)}</span></summary><div class="case-body">${caseBody(x, r)}</div></details>`).join('');
      if (failing.length > shown.length) h += `<p class="note">…and ${failing.length - shown.length} more failing tests.</p>`;
    }
    if (r.verdict === 'error' && r.text) h += `<pre class="raw">${esc(tail(r.text, 40))}</pre>`;
    return h;
  }

  function renderLiveResult(c) {
    const r = live.report[c.id];
    const intro = LOCAL.problem
      ? `<p class="note warn">${esc(LOCAL.problem)}</p>`
      : `<p class="note">Run checks the selected example (Ctrl+'), Submit runs all ${c.tests} tests (Ctrl+Enter). What you type is saved to <code>${esc(c.solution)}</code>, and changes you make to that file in another editor show up here.</p>`;
    // After an Accepted Submit (not the last checkpoint): suggest keeping the reusable parts in common/.
    const last = CPS.indexOf(c) === CPS.length - 1;
    const nudge = r && r.verdict === 'accepted' && !r.fresh && !last && cm ? (() => {
      const slug = c.solution.split('/').pop().replace(/\.[^.]+$/, '').replace(/^p\d+_/, '');
      const how = /C\+\+|^C$/.test(c.lang.label) ? `<code>common/${esc(slug)}.h</code> with a <code>.cpp</code> beside it, then <code>#include "common/${esc(slug)}.h"</code> here`
        : c.lang.label === 'Python' ? `<code>common/${esc(slug)}.py</code>, then <code>from common.${esc(slug)} import ...</code> here`
        : /JavaScript|TypeScript/.test(c.lang.label) ? `<code>common/${esc(slug)}.js</code>, then <code>require('./common/${esc(slug)}')</code> here`
        : `a file in <code>common/</code>`;
      return `<div class="nudge"><span><b>Keep it for later.</b> Later checkpoints build on what you just wrote, and the last one needs it all. Move the reusable parts into ${how}, then Submit again to check nothing broke. (Where this fits, under the statement, says which checkpoints come next.)</span>`
        + `<span><button class="btn" type="button" id="open-files">Open the Files panel</button></span></div>`;
    })() : '';
    const solvedCount = CPS.filter((x) => solved(x.id)).length;
    $('#result').innerHTML = (r ? reportHtml(r, c) : intro) + nudge
      + `<div class="live-actions"><button class="btn" type="button" id="live-fresh">Run a fresh set of tests</button>`
      + (solvedCount ? `<button class="btn" type="button" id="recheck-all" title="Run every checkpoint you've solved again, to catch anything a change to shared code broke">Re-check solved (${solvedCount})</button>` : '') + '</div>'
      + `<details class="more"><summary>Think a test is wrong?</summary><div>${cmdRow(command(c.id, '-Dispute <test-id> "why"'))}
        <p class="note" style="margin-top:8px">Run this in the workbook folder to set the test aside, so it no longer counts. Then ask Claude to review your disputes.</p></div></details>`;
  }
  if (LOCAL) {
    $('#result').addEventListener('click', (e) => {
      if (e.target.closest('#live-fresh')) { runLive('submit', { fresh: true }); return; }
      if (e.target.closest('#recheck-all')) { recheckSolved(); return; }
      if (e.target.closest('#open-files')) { if (!live.showTree) $('#tree-btn').click(); return; }
      const goto = e.target.closest('[data-goto]');
      if (goto) openTab(goto.dataset.goto, Number(goto.dataset.line));
    });
  }

  // ---- navigation between checkpoints
  function openCheckpoint(id) {
    const c = BY[id];
    const changed = current !== id;
    if (LOCAL && current && changed) saveAll();  // don't lose the last keystrokes
    current = id;
    $('#list-view').hidden = true;
    $('#ide-view').hidden = false;
    document.body.classList.add('in-ide');
    if (changed) { caseIndex = 0; solFile = 0; }
    renderDesc(c);
    renderEditorial(c);
    renderCases(c);
    if (LOCAL) renderLiveResult(c); else renderResult(c);
    loadEditor(c);
    setLeft('desc');
    setBottom((LOCAL ? live.report[c.id] : store.get(c.id + ':result')) ? 'result' : 'cases');
    $('#desc').scrollTop = 0;
    const k = CPS.indexOf(c);
    $('#prev').disabled = k === 0;
    $('#next').disabled = k === CPS.length - 1;
    $('#prev').title = k > 0 ? `${CPS[k - 1].num}. ${CPS[k - 1].title}` : '';
    $('#next').title = k < CPS.length - 1 ? `${CPS[k + 1].num}. ${CPS[k + 1].title}` : '';
    if (cm) requestAnimationFrame(() => cm.refresh());
    window.scrollTo(0, 0);
  }
  $('#prev').addEventListener('click', () => { const k = CPS.indexOf(BY[current]); if (k > 0) go('p' + CPS[k - 1].id); });
  $('#next').addEventListener('click', () => { const k = CPS.indexOf(BY[current]); if (k < CPS.length - 1) go('p' + CPS[k + 1].id); });
  $('#shuffle').addEventListener('click', () => pickOne(CPS));

  let routed = null;
  function route(hash) {
    if (hash === routed && (current || !$('#list-view').hidden)) return;
    routed = hash;
    const m = /^p(.+)$/.exec(hash || '');
    if (m && BY[m[1]]) openCheckpoint(m[1]); else showList();
  }
  function go(hash) {
    try { history.pushState(null, '', '#' + hash); } catch (e) {}
    route(hash);
  }
  // In-page links switch views directly, so they work even where hash changes don't.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || e.defaultPrevented) return;
    e.preventDefault();
    go(a.getAttribute('href').slice(1));
  });
  window.addEventListener('popstate', () => route(location.hash.slice(1)));
  window.addEventListener('hashchange', () => route(location.hash.slice(1)));

  // ---- resizable panels
  function splitter(el, axis, box, prop, min, max) {
    const key = 'layout:' + prop;
    const apply = (f) => { box.style.setProperty(prop, (Math.min(max, Math.max(min, f)) * 100).toFixed(2) + '%'); };
    const saved = Number(store.get(key));
    if (saved) apply(saved);
    const fraction = () => parseFloat(box.style.getPropertyValue(prop)) / 100 || (axis === 'x' ? 0.45 : 0.6);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
      const rect = box.getBoundingClientRect();
      const move = (ev) => apply(axis === 'x' ? (ev.clientX - rect.left) / rect.width : (ev.clientY - rect.top) / rect.height);
      const up = () => {
        el.classList.remove('dragging');
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        store.set(key, String(fraction()));
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
    el.addEventListener('keydown', (e) => {
      const step = { ArrowLeft: -0.02, ArrowUp: -0.02, ArrowRight: 0.02, ArrowDown: 0.02 }[e.key];
      if (!step) return;
      e.preventDefault();
      apply(fraction() + step);
      store.set(key, String(fraction()));
    });
  }
  splitter($('#split-v'), 'x', $('#ide-main'), '--left', 0.25, 0.7);
  splitter($('#split-h'), 'y', $('#right'), '--top', 0.2, 0.85);

  renderListShell();
  initEditor();
  if (LOCAL) {
    paintLive();
    if (cm) {  // the Files panel needs the full editor
      $('#tree-btn').hidden = $('#tree-sep').hidden = false;
      live.showTree = store.get('tree') === '1';
      if (live.showTree) refreshProject();
    }
  }
  route(location.hash.slice(1));
})();
</script>
