241c8cbb0cc85a088a3136ed8ee858bdca1f0789902304843909e09821bcc3a04fd568f14a080fa0aef6605341933fdd5ba128236de33b8652d66260af57cdbcda63c6c58188c\nissuer_pubkey t0 P-384 b7c32496319e08593b60245d1518bccd35f6236109df147af450aba3253237eeb9acedf9664944dcd9b1119a1cd63675 32301c3af7cbdc8626374f8ece577d5d4067fbad012a61489fc14b73a8a9dd9365b1abedacd7daef7336b9e95a70b620","output":"signature t0 invalid","image":null,"explain":"<p>The certificate is otherwise exactly as it was signed - subject, issuer, key, validity, all untouched - and the issuer's public key given here is the real one. Only the lowest bit of the signature's very last byte has been flipped, and that alone is enough to make it <code>invalid<\/code>.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>The post contains no code for this (it's prerequisite material, not drawn from the post), so there is no author's version to compare. The reference solution is in <code>_spoilers/reference/<\/code>: it reuses <code>common/certlib.py<\/code>'s <code>parse_certificate<\/code> (for <code>tbs_bytes<\/code>, <code>sig_r<\/code>, <code>sig_s<\/code>) and <code>verify_ecdsa_sha384<\/code>, its own self-contained copy of checkpoint 04's verification equation.<\/p>\n<p><strong>Something to look for:<\/strong> the reference's <code>scalar_mult<\/code> does double-and-add starting from the least significant bit. A correct alternative starts from the most significant bit and doubles the running result before adding instead of after - same answer, opposite bit order. Compare it with whatever you wrote.<\/p>"}},{"id":"09","num":"9","title":"Validate a certificate chain","difficulty":"Hard","tests":13,"solution":"solutions/p09_validate_chain.py","problem":"problems/09-validate-chain.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 09 - Validate a certificate chain\n#\n# Problem:  problems/09-validate-chain.md (also in the web problem book)\n# Check:    ./check.sh 09\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 09 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p09_validate_chain.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 09 - Validate a certificate chain\n#\n# Problem:  problems/09-validate-chain.md (also in the web problem book)\n# Check:    ./check.sh 09\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on validate_chain().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\nREASONS = (\"bad-signature\", \"unknown-anchor\", \"not-a-ca\", \"path-too-long\", \"expired\")\n\n\ndef validate_chain(now: str, anchors: list, cert_bytes_list: list):\n    \"\"\"anchors: list of (curve, x, y) trust anchor public keys. cert_bytes_list: the chain's\n    certificates, leaf first, most-senior intermediate last (no root certificate - the anchor\n    IS the root's key, trusted directly). Returns (True, None) if trusted, else (False, reason)\n    with reason one of REASONS. See the problem page for the exact rules and their order.\"\"\"\n    # TODO: check (in order) that signatures chain up to a trust anchor, that every signer has\n    # CA:true, that no path length constraint is violated, and that every certificate's\n    # validity window covers `now`. Reuse checkpoint 06's field-reading and checkpoint 08's\n    # signature check.\n    raise NotImplementedError(\"validate_chain\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    label, now, anchors, certs = None, None, [], []\n\n    def finish():\n        if label is None:\n            return\n        trusted, reason = validate_chain(now, anchors, certs)\n        lines.append(f\"chain {label} trusted\" if trusted else f\"chain {label} untrusted {reason}\")\n\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"chain\":  # chain <label>: starts a new chain, resetting state\n                finish()\n                label, now, anchors, certs = words[1], None, [], []\n            elif words[0] == \"now\":  # now <time-string>\n                now = words[1]\n            elif words[0] == \"anchor\":  # anchor <curve> <x> <y>: a trusted root public key\n                anchors.append((words[1], int(words[2], 16), int(words[3], 16)))\n            elif words[0] == \"cert\":  # cert <hex>: leaf first, most senior intermediate last\n                certs.append(bytes.fromhex(words[1]))\n    finish()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["loops over lists","structured state"],"text":["loops over lists","structured state"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["chain of trust","trust anchors","path length constraints","RFC 5280 path validation"],"text":["chain of trust","trust anchors","path length constraints","RFC 5280 path validation"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that, given a list of trust anchors and one or more certificate chains, decides whether each chain is trusted, and if not, why.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p09_validate_chain.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p09_validate_chain.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>validate_chain()<\/code>.<\/p>\n<h3>The model<\/h3>\n<p>A <strong>trust anchor<\/strong> is a public key the verifier already trusts, given directly (no certificate of its own - trust in it is axiomatic, the way a browser's root store works). A <strong>chain<\/strong> is a list of certificates, leaf first: certificate 0 is the one actually being checked, certificate 1 (if present) signed it, certificate 2 (if present) signed certificate 1, and so on. The most senior certificate in the list - the last one - must itself be signed by one of the trust anchors directly. There is no certificate for the trust anchor itself in the list.<\/p>\n<p>Checking a chain means checking all of the following, <strong>in this order<\/strong>, and stopping at the first problem found:<\/p>\n<ol><li><strong>Signatures.<\/strong> Certificate <code>i<\/code> must really be signed by certificate <code>i + 1<\/code>'s public key (checkpoint 08's check, with the curve constants <code>p<\/code>, <code>a<\/code>, <code>G<\/code> and <code>n<\/code> from checkpoint 08's page), for every <code>i<\/code> from the leaf up to the second-to-last certificate. The last certificate must really be signed by <strong>one of<\/strong> the given trust anchors (try each; any match is enough).<\/li><li><strong>CA permission.<\/strong> Every certificate that signed another one in this chain - that is, every certificate except the leaf - must have BasicConstraints CA:TRUE (checkpoint 06's <code>ca<\/code> field). A certificate that isn't marked as a CA can't be trusted to sign other certificates, no matter how good its signature is.<\/li><li><strong>Path length.<\/strong> A certificate's path length constraint (checkpoint 06's <code>pathlen<\/code>, when it has one) bounds how many <strong>more<\/strong> intermediate certificates may appear between it and the leaf. Counting from the leaf's immediate signer upward, the certificate at position <code>i<\/code> in the list (1-indexed: position 1 is the leaf's signer) has exactly <code>i - 1<\/code> intermediates below it (closer to the leaf). If that certificate has a path length constraint and <code>i - 1<\/code> exceeds it, the chain is invalid.<\/li><li><strong>Validity.<\/strong> Every certificate's validity window - <code>notBefore<\/code> through <code>notAfter<\/code> - must cover the given \"now\". All the time strings in this checkpoint are UTCTime in the same format (two-digit year, so e.g. <code>250601000000Z<\/code> is 2025-06-01), so plain text comparison gives you chronological order directly; you don't need to parse dates.<\/li><\/ol>\n<p>If all four hold, the chain is <strong>trusted<\/strong>. If not, report the <strong>first<\/strong> problem found, in the order above, using this fixed vocabulary:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Reason<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>bad-signature<\/code><\/td><td>A non-topmost certificate in the chain was not really signed by the next one up<\/td><\/tr><tr><td><code>unknown-anchor<\/code><\/td><td>The topmost certificate's signature doesn't check out against <strong>any<\/strong> given trust anchor - this is its own, separate step (see \"The model\" above), never reported as <code>bad-signature<\/code><\/td><\/tr><tr><td><code>not-a-ca<\/code><\/td><td>A certificate that signed another one in the chain isn't marked CA:TRUE<\/td><\/tr><tr><td><code>path-too-long<\/code><\/td><td>A certificate's path length constraint was violated by how many more intermediates follow it<\/td><\/tr><tr><td><code>expired<\/code><\/td><td>Some certificate's validity window does not cover <code>now<\/code> (this includes \"not yet valid\", not only \"expired\" in the everyday sense - this checkpoint doesn't distinguish the two directions)<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file describes one or more chains:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>chain &lt;label&gt;<\/code><\/td><td>Starts a new chain. Everything until the next <code>chain<\/code> line (or the end of the file) belongs to it. <code>label<\/code> is a word with no spaces.<\/td><\/tr><tr><td><code>now &lt;time&gt;<\/code><\/td><td>The time to check validity against, in the same raw format as checkpoint 06's <code>notBefore<\/code>/<code>notAfter<\/code>.<\/td><\/tr><tr><td><code>anchor &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>A trusted public key. May appear more than once (more than one trust anchor).<\/td><\/tr><tr><td><code>cert &lt;hex&gt;<\/code><\/td><td>One certificate. Leaf first; each later <code>cert<\/code> line is signed by the next one.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each <code>chain<\/code> block, in input order, write one line:<\/p>\n<pre><code>chain &lt;label&gt; trusted\nchain &lt;label&gt; untrusted &lt;reason&gt;<\/code><\/pre>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A valid 2-level chain: the leaf is signed directly by a trust anchor, no intermediates at all.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A valid 3-level chain: leaf, one intermediate, then a trust anchor.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>The topmost certificate's signature doesn't check out against any given trust anchor: <code>unknown-anchor<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A certificate claims the right issuer but isn't really signed by it (a different key signed it than the one it names): <code>bad-signature<\/code>.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>An intermediate that signed another certificate in the chain isn't marked CA:TRUE: <code>not-a-ca<\/code>.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>An intermediate asserts a path length constraint that a later (more-leaf-ward) intermediate violates: <code>path-too-long<\/code>. (And, for contrast, a path length that's exactly respected still gives <code>trusted<\/code>.)<\/span><\/li><li><span class=\"rid\">R7<\/span><span>A certificate's validity window doesn't cover <code>now<\/code>, in either direction: <code>expired<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate is P-384 (checkpoint 08's own constraint carries over).<\/li><li>Every chain has at least one certificate (the leaf) and at most three (leaf plus two intermediates) in these tests.<\/li><li>All time strings - every certificate's <code>notBefore<\/code>/<code>notAfter<\/code>, and every <code>now<\/code> - are UTCTime with a two-digit year in this checkpoint's data, so plain string comparison is chronological order. (This wouldn't generally be true across a change of century; it's true here because every date in this checkpoint's tests falls in 2000-2099.)<\/li><li>There are 13 tests: 1 each for R1-R5, 2 for R6 (one violation, one respected), 2 for R7 (both directions), and 4 end-to-end chains, including the shape of the real incident: a leaf's intermediate verifies while the intermediate's own signer is a recognised anchor, and stops verifying the moment that signer is no longer offered as one - modelling what \"distrusting an intermediate\" actually does to every certificate under it. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p09_validate_chain.py","text":"# Reference solution - checkpoint 09 (Validate a certificate chain). SPOILERS: try it\n# yourself first.\n#\n# Combines checkpoint 06's field reading and checkpoint 08's signature check into RFC 5280's\n# core path-validation idea, simplified: walk the chain leaf to root, checking (in order) that\n# every signature really chains up to a trust anchor, that every signer was allowed to sign\n# (CA:true), that no path length constraint is violated, and that every certificate's validity\n# window covers \"now\".\n\nimport sys\n\nfrom common.certlib import parse_certificate, verify_ecdsa_sha384\n\nREASONS = (\"bad-signature\", \"unknown-anchor\", \"not-a-ca\", \"path-too-long\", \"expired\")\n\n\ndef validate_chain(now: str, anchors: list, cert_bytes_list: list):\n    \"\"\"anchors: list of (curve, x, y). cert_bytes_list: leaf first, most-senior intermediate\n    last. Returns (True, None) or (False, reason), reason one of REASONS.\"\"\"\n    certs = [parse_certificate(b) for b in cert_bytes_list]\n\n    # 1. Signatures: each certificate but the last is signed by the next one up; the last is\n    # signed by one of the trust anchors directly (no root certificate is given, just its key).\n    for i in range(len(certs) - 1):\n        signer = certs[i + 1]\n        leaf = certs[i]\n        if not verify_ecdsa_sha384(signer.curve, signer.pubx, signer.puby, leaf.tbs_bytes, leaf.sig_r, leaf.sig_s):\n            return False, \"bad-signature\"\n    top = certs[-1]\n    if not any(verify_ecdsa_sha384(curve, x, y, top.tbs_bytes, top.sig_r, top.sig_s) for curve, x, y in anchors):\n        return False, \"unknown-anchor\"\n\n    # 2. Every signer (everything except the leaf) must be allowed to sign: CA:true.\n    for c in certs[1:]:\n        if not c.ca:\n            return False, \"not-a-ca\"\n\n    # 3. A signer's path length constraint bounds how many MORE intermediates may appear\n    # between it and the leaf (not counting the leaf itself).\n    for i in range(1, len(certs)):\n        intermediates_below = i - 1\n        if certs[i].pathlen is not None and intermediates_below > certs[i].pathlen:\n            return False, \"path-too-long\"\n\n    # 4. Every certificate's validity window must cover \"now\" (plain string comparison: every\n    # time in this checkpoint is the same format, so this is exactly a chronological order).\n    for c in certs:\n        if not (c.not_before <= now <= c.not_after):\n            return False, \"expired\"\n\n    return True, None\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    label, now, anchors, certs = None, None, [], []\n\n    def finish():\n        if label is None:\n            return\n        trusted, reason = validate_chain(now, anchors, certs)\n        lines.append(f\"chain {label} trusted\" if trusted else f\"chain {label} untrusted {reason}\")\n\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"chain\":  # chain <label>: starts a new chain, resetting state\n                finish()\n                label, now, anchors, certs = words[1], None, [], []\n            elif words[0] == \"now\":  # now <time-string>\n                now = words[1]\n            elif words[0] == \"anchor\":  # anchor <curve> <x> <y>: a trusted root public key\n                anchors.append((words[1], int(words[2], 16), int(words[3], 16)))\n            elif words[0] == \"cert\":  # cert <hex>: leaf first, most senior intermediate last\n                certs.append(bytes.fromhex(words[1]))\n    finish()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"},{"path":"common/certlib.py","text":"\"\"\"Hand-written X.509 certificate reading and ECDSA verification, built on common/der.py.\nShared by the reference solutions for checkpoints 06-09. SPOILERS: try the checkpoints yourself\nfirst.\n\nNo `cryptography.x509` parsing and no library ECDSA verification here: every field is read with\ncommon/der.py's TLV walker, and signatures are checked with plain modular arithmetic (the same\npoint-addition formulas checkpoint 10 uses, run the other direction: multiply instead of search).\nThe curve constants (p, n, Gx, Gy) are reused from tools/curves.py rather than retyped.\n\"\"\"\n\nimport hashlib\nimport sys\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom . import der\n\n# tools/curves.py holds the OpenSSL-verified curve constants; reuse its numbers instead of\n# retyping them (the generators already prove them correct via curves.verify()).\n_ROOT = Path(__file__).resolve().parents[3]\nsys.path.insert(0, str(_ROOT / \"tools\"))\nimport curves as _curves  # noqa: E402\n\nCURVES = {name: {\"p\": c[\"p\"], \"n\": c[\"n\"], \"gx\": c[\"gx\"], \"gy\": c[\"gy\"]} for name, c in _curves.CURVES.items()}\n\nID_EC_PUBLIC_KEY = \"1.2.840.10045.2.1\"\nCURVE_OIDS = {\"1.2.840.10045.3.1.7\": \"P-256\", \"1.3.132.0.34\": \"P-384\"}\nCOMMON_NAME_OID = \"2.5.4.3\"\nBASIC_CONSTRAINTS_OID = \"2.5.29.19\"\nECDSA_SHA384_OID = \"1.2.840.10045.4.3.3\"\n\n\n# ---- Reading one field at a time (each takes the relevant DER node) --------------------------\n\ndef read_name_cn(name_node: der.Node):\n    \"\"\"Name ::= SEQUENCE OF RelativeDistinguishedName (SET OF {type, value}). Returns the\n    commonName attribute's value as text, or None if the name has no commonName.\"\"\"\n    for rdn in name_node.children:                 # RelativeDistinguishedName: SET OF ...\n        for atv in rdn.children:                    # AttributeTypeAndValue: SEQUENCE { type, value }\n            attr_type, value = atv.children\n            if der.decode_oid(attr_type.content) == COMMON_NAME_OID:\n                return value.content.decode(\"utf-8\")\n    return None\n\n\ndef read_validity(validity_node: der.Node):\n    \"\"\"Validity ::= SEQUENCE { notBefore Time, notAfter Time }. Time is UTCTime or\n    GeneralizedTime; both are printed here exactly as they appear (this isn't a date checkpoint).\"\"\"\n    not_before, not_after = validity_node.children\n    return not_before.content.decode(\"ascii\"), not_after.content.decode(\"ascii\")\n\n\ndef read_spki(spki_node: der.Node):\n    \"\"\"SubjectPublicKeyInfo ::= SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT\n    STRING }. Returns (curve name, x, y) for an uncompressed EC point (0x04 || x || y).\"\"\"\n    algorithm, public_key_bits = spki_node.children\n    alg_oid_node, curve_oid_node = algorithm.children\n    if der.decode_oid(alg_oid_node.content) != ID_EC_PUBLIC_KEY:\n        raise ValueError(\"subjectPublicKeyInfo algorithm is not id-ecPublicKey\")\n    curve_oid = der.decode_oid(curve_oid_node.content)\n    if curve_oid not in CURVE_OIDS:\n        raise ValueError(f\"unrecognised curve OID {curve_oid}\")\n    curve = CURVE_OIDS[curve_oid]\n    _unused, point = der.decode_bit_string(public_key_bits.content)\n    if not point or point[0] != 0x04:\n        raise ValueError(\"expected an uncompressed EC point (0x04 || x || y)\")\n    coord_len = (len(point) - 1) // 2\n    x = int.from_bytes(point[1:1 + coord_len], \"big\")\n    y = int.from_bytes(point[1 + coord_len:], \"big\")\n    return curve, x, y\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"The raw subjectPublicKeyInfo node of a certificate, untouched (checkpoint 07 hashes its\n    exact original bytes - the whole nested SEQUENCE, not just the key bytes inside it).\"\"\"\n    top = der.parse_all(cert_bytes)\n    tbs = top[0].children[0]\n    children = tbs.children\n    i = 1 if children and children[0].cls == \"context\" and children[0].tag == 0 else 0\n    return children[i + 5]  # serialNumber, signature, issuer, validity, subject, then spki\n\n\ndef read_basic_constraints(extensions_wrapper: der.Node):\n    \"\"\"extensions_wrapper is the [3] EXPLICIT context node wrapping `Extensions ::= SEQUENCE OF\n    Extension`. Returns (ca, pathlen). Extension ::= SEQUENCE { extnID, critical BOOLEAN DEFAULT\n    FALSE OPTIONAL, extnValue OCTET STRING }, so extnValue is always the extension's last field.\"\"\"\n    extensions_seq = extensions_wrapper.children[0]\n    for extension in extensions_seq.children:\n        extn_id = der.decode_oid(extension.children[0].content)\n        if extn_id != BASIC_CONSTRAINTS_OID:\n            continue\n        extn_value = extension.children[-1]          # OCTET STRING: itself DER-encoded again\n        bc_seq = der.parse_all(extn_value.content)[0]  # BasicConstraints ::= SEQUENCE { cA, pathLen }\n        ca, idx = False, 0\n        if bc_seq.children and bc_seq.children[0].tag == der.BOOLEAN:\n            ca = bc_seq.children[0].content[0] != 0\n            idx = 1\n        pathlen = der.decode_integer(bc_seq.children[idx].content) if len(bc_seq.children) > idx else None\n        return ca, pathlen\n    return False, None  # BasicConstraints absent: RFC 5280 4.2.1.9 default is \"not a CA\"\n\n\n# ---- A whole certificate -----------------------------------------------------------------\n\n@dataclass\nclass Certificate:\n    tbs_bytes: bytes          # the exact original bytes of tbsCertificate, for re-hashing\n    serial: int\n    issuer_cn: str\n    subject_cn: str\n    not_before: str\n    not_after: str\n    curve: str\n    pubx: int\n    puby: int\n    ca: bool\n    pathlen: object           # int, or None if there is no path length constraint\n    sig_alg_oid: str\n    sig_r: int\n    sig_s: int\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Certificate ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }.\"\"\"\n    top = der.parse_all(cert_bytes)\n    if len(top) != 1 or top[0].tag != der.SEQUENCE or not top[0].constructed:\n        raise ValueError(\"a certificate is exactly one top-level SEQUENCE\")\n    cert = top[0]\n    if len(cert.children) != 3:\n        raise ValueError(\"a Certificate has exactly 3 fields: tbsCertificate, \"\n                          \"signatureAlgorithm, signatureValue\")\n    tbs_node, sig_alg_node, sig_value_node = cert.children\n    tbs_bytes = cert_bytes[tbs_node.start: tbs_node.start + tbs_node.total_len]\n\n    children = tbs_node.children\n    i = 0\n    if children and children[i].cls == \"context\" and children[i].tag == 0:\n        i += 1  # version [0] EXPLICIT INTEGER; every certificate here is v3, so its value is fixed\n    serial = der.decode_integer(children[i].content); i += 1\n    i += 1  # signature: AlgorithmIdentifier, repeating the outer signatureAlgorithm; not needed again\n    issuer_cn = read_name_cn(children[i]); i += 1\n    not_before, not_after = read_validity(children[i]); i += 1\n    subject_cn = read_name_cn(children[i]); i += 1\n    curve, pubx, puby = read_spki(children[i]); i += 1\n    ca, pathlen = False, None\n    if i < len(children) and children[i].cls == \"context\" and children[i].tag == 3:\n        ca, pathlen = read_basic_constraints(children[i])\n\n    sig_alg_oid = der.decode_oid(sig_alg_node.children[0].content)\n    _unused, sig_der_bytes = der.decode_bit_string(sig_value_node.content)\n    sig_seq = der.parse_all(sig_der_bytes)[0]          # ECDSA-Sig-Value ::= SEQUENCE { r, s }\n    sig_r = der.decode_integer(sig_seq.children[0].content)\n    sig_s = der.decode_integer(sig_seq.children[1].content)\n\n    return Certificate(tbs_bytes, serial, issuer_cn, subject_cn, not_before, not_after,\n                        curve, pubx, puby, ca, pathlen, sig_alg_oid, sig_r, sig_s)\n\n\n# ---- Elliptic-curve point arithmetic and ECDSA verification (hand modular arithmetic) --------\n\ndef point_add(p: int, a: int, point, other):\n    \"\"\"Affine point addition on y^2 = x^3 + a*x + b (mod p). Either point may be None (the\n    point at infinity, the addition identity).\"\"\"\n    if point is None:\n        return other\n    if other is None:\n        return point\n    x1, y1 = point\n    x2, y2 = other\n    if x1 == x2:\n        if (y1 + y2) % p == 0:\n            return None  # point and its negation: the sum is the point at infinity\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # tangent slope (doubling)\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p          # chord slope\n    x3 = (slope * slope - x1 - x2) % p\n    y3 = (slope * (x1 - x3) - y1) % p\n    return x3, y3\n\n\ndef scalar_mult(p: int, a: int, n: int, k: int, point):\n    \"\"\"k * point, by double-and-add. point may be None (gives None back).\"\"\"\n    k %= n\n    if k == 0 or point is None:\n        return None\n    result = None\n    addend = point\n    while k:\n        if k & 1:\n            result = point_add(p, a, result, addend)\n        addend = point_add(p, a, addend, addend)\n        k >>= 1\n    return result\n\n\ndef verify_ecdsa_sha384(curve_name: str, pubx: int, puby: int, message: bytes, r: int, s: int) -> bool:\n    \"\"\"Checks an ECDSA signature (r, s) over SHA-384(message) against public key (pubx, puby).\n    This workbook's incident uses P-384 keys with ecdsa-with-SHA384 throughout, so the hash is\n    fixed here; a P-256 certificate would use SHA-256 instead (out of scope for this checkpoint).\"\"\"\n    c = CURVES[curve_name]\n    p, a, n, gx, gy = c[\"p\"], c[\"p\"] - 3, c[\"n\"], c[\"gx\"], c[\"gy\"]\n    if not (1 <= r < n and 1 <= s < n):\n        return False\n    digest = hashlib.sha384(message).digest()\n    z = int.from_bytes(digest, \"big\")\n    n_bits = n.bit_length()\n    if 8 * len(digest) > n_bits:\n        z >>= 8 * len(digest) - n_bits\n    w = pow(s, -1, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    point = point_add(p, a, scalar_mult(p, a, n, u1, (gx, gy)), scalar_mult(p, a, n, u2, (pubx, puby)))\n    if point is None:\n        return False\n    x, _y = point\n    return x % n == r\n"}],"proof":{"passed":13,"total":13,"date":"2026-10-21"},"uses":[]},"read":"<p>This checkpoint is prerequisite material, not drawn from eMudhra's post, but it is the mechanism behind the sentence everyone took away from the incident: once a CA's intermediate was distrusted, certificates issued through it stopped verifying. Read RFC 5280 section 6 (\"Certification Path Validation Algorithm\") for the real, general algorithm - this checkpoint implements its core idea in miniature. Then read eMudhra's own <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">statement on the incident<\/a> for what actually happened: eight intermediate CA certificates were found to have been issued with cryptographically weak keys, and were revoked/distrusted by the major browsers. This page is complete on its own after that.<\/p>","context":"<p>Checkpoint 06 taught you to read a certificate's fields, and checkpoint 08 taught you to check whether one certificate was really signed by a given key. This checkpoint strings several certificates together into the thing a browser actually does with an incoming TLS certificate: decide whether to trust it, by walking up from the leaf to a key it already trusts. This is the mechanism that let browsers reject the compromised eMudhra intermediates once they were removed from the trust store - not by checking anything special about the intermediates themselves, but simply because the chain no longer reached anywhere trusted.<\/p>","sources":"<ul><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, section 6 (\"Certification Path Validation Algorithm\")<\/li><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a><\/li><\/ul>","checking":"<pre><code>./check.sh 09                              run every test\n./check.sh 09 -Case 09-R6-path-too-long    one test, showing its full input, expected output and your output\n./check.sh 09 -Fresh                       a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 09 -Dispute &lt;id&gt; &quot;why&quot;          set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R6  An intermediate&#x27;s path length constraint is violated by how many...    1 / 2   FAILED\n      x 09-R6-path-too-long  IntA-6 asserts path length 0, but IntB-6 follows it before the leaf\n          line 1: expected `chain c6 untrusted path-too-long`, got `chain c6 trusted`\n          likely cause: R6 - An intermediate&#x27;s path length constraint is violated by how many more intermediates follow it: path-too-long\n          expected values from: openssl verify -attime &lt;epoch&gt; -CAfile &lt;root&gt; -untrusted &lt;intermediates&gt; &lt;leaf&gt; (OpenSSL&#x27;s own path validation, independent of this workbook&#x27;s reference)\n          reproduce: python3 -P tools/run_py.py solutions 09 build/cases/09/09-R6-path-too-long.in build/cases/09/09-R6-path-too-long.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Parse each certificate with checkpoint 06's field reading (you need <code>ca<\/code>, <code>pathlen<\/code>, <code>notBefore<\/code>, <code>notAfter<\/code>, the public key) and checkpoint 08's signature pieces (<code>tbsCertificate<\/code>'s bytes, <code>r<\/code>, <code>s<\/code>). Then this checkpoint is mostly bookkeeping: four short loops over the list of certificates, each one a direct translation of one bullet in \"The model\" above.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Process the chain once per check, not once overall: a loop over adjacent pairs for signatures, a loop over everything-but-the-leaf for CA status, a loop (with a running count) for path length, a loop over everything for validity. Stop and return as soon as any loop finds a problem - don't collect every problem and then decide, since this checkpoint only ever reports the first one, by the order given on this page.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>The topmost certificate's signer isn't \"the next certificate\" - there isn't one. It's checked against the trust anchors directly, and matching <strong>any<\/strong> anchor is enough.<\/li><li>\"Every certificate that signed another one\" is everything except the leaf (certificate 0), not everything except the topmost one. A 3-certificate chain has exactly one signer that needs checking for CA status and path length: the intermediate.<\/li><li>Path length counts intermediates <strong>below<\/strong> a certificate (closer to the leaf), not including the leaf and not including the certificate itself. A path length of <code>0<\/code> on the certificate that signs the leaf directly is fine - it's a constraint on what's allowed <em>below<\/em> that certificate, not on it signing a leaf.<\/li><li>\"Expired\" here covers both directions: a certificate not yet valid at <code>now<\/code>, and one whose validity has already ended. Don't only check one side.<\/li><li>If the input gives more than one <code>anchor<\/code> line, trying just the first one (instead of all of them) will wrongly reject a chain that really does lead to one of the later ones.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>validate_chain(now, anchors, certs):   # certs: leaf first\n    for i in 0 .. len(certs) - 2:\n        if not signed_by(certs[i], certs[i + 1]):\n            return untrusted, &quot;bad-signature&quot;\n    if not any(signed_by(certs[-1], anchor) for anchor in anchors):\n        return untrusted, &quot;unknown-anchor&quot;\n\n    for c in certs[1:]:\n        if not c.ca:\n            return untrusted, &quot;not-a-ca&quot;\n\n    for i in 1 .. len(certs) - 1:\n        below = i - 1\n        if certs[i].pathlen is not none and below &gt; certs[i].pathlen:\n            return untrusted, &quot;path-too-long&quot;\n\n    for c in certs:\n        if not (c.notBefore &lt;= now &lt;= c.notAfter):\n            return untrusted, &quot;expired&quot;\n\n    return trusted<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a valid 2-level chain","test":"09-R1-two-level","input":"chain c1\nnow 250601000000Z\nanchor P-384 8c37c3bb0940a707a89dbb651a719c644c6a463d38564bd2d1356c0035dc5d93721b9bf3d4bae3125e77e5ad688251e9 f2b9602ae1162423b84924c3691f20e296704c451e07f381ee9ef096bc0cee11155f5cae3971b4d4864d356ec77e42d5\ncert 3082014a3081d2a003020102020102300a06082a8648ce3d0403033011310f300d06035504030c06526f6f742d31301e170d3235303530323030303030305a170d3236303630313030303030305a3011310f300d06035504030c064c6561662d313076301006072a8648ce3d020106052b8104002203620004350c9b8d51a04832daf850430e93435c42c227286ebf291baf26e4c4331200ee6a4143ae46372dd0b7d6ab2311a2646b3e3706e4d8522542d64efd922cd0e1ee6c5b2abad474a4db8f6b3d1081a2025f5a9b7c01a5a69545c005bc92ceadb5b0300a06082a8648ce3d0403030367003064023061c30b5456592ee538c43db0491ab97fd05f005a36b3ec6a7a884c86ccbc31c6c8f642a236627423a34bd124ae2c5d9802302e14ff224299ba519255daa213d5128aba4ff91fbb115678b555a20dd50dad8e5e574e48baa120f71007e07a341963b3","output":"chain c1 trusted","image":null,"explain":"<p>One certificate, no intermediates: it is signed directly by the trust anchor key.<\/p>"},{"label":"Example 2","name":"path length violated","test":"09-R6-path-too-long","input":"chain c6\nnow 250601000000Z\nanchor P-384 abbe83dd2afe21268be6efbf9da6c2db82bc6ae27d7acc374d02d42a843211371de592e7b0dda82cb7035bd27d0eeeef 25ef6c5a8b0252526764515e026f39f6e1516dac422ab9764f096d432a28fc18184aee07470f4433eb853b095268f3b0\ncert 3082014b3081d2a003020102020104300a06082a8648ce3d0403033011310f300d06035504030c06496e74422d36301e170d3235303530323030303030305a170d3236303630313030303030305a3011310f300d06035504030c064c6561662d363076301006072a8648ce3d020106052b8104002203620004759b040031e94a644a5f991cb79507ec0f5508e79a481b2092b9a321af911f51c2f2603a0f6bbb00f8a93e66509da1c5f23b8c23ab79691af588b23a780f69e1c48cc27657eee3e281f6a23548168fe442597a6fbaf1c1dfefa48dfb3c4ae99f300a06082a8648ce3d04030303680030650230703fbc346dc74c042b9122cc666c06693834d90e548bb0589eff8041993d003feb3c642a150ea0c1a684305e7c034ec7023100e033bf2a52aa40a5cb64beaf335123ae85b7190cbc015d3b22078b9c0c471f27d7eec95bd190d508ba66ceaa0f4bbd8d\ncert 3082015f3081e7a003020102020103300a06082a8648ce3d0403033011310f300d06035504030c06496e74412d36301e170d3235303530323030303030305a170d3236303630313030303030305a3011310f300d06035504030c06496e74422d363076301006072a8648ce3d020106052b8104002203620004a1eecf375b3b1d82f876ba1cd024c14e85888cc57229963cacb411a0c174b22906ea48cf6b13d2109b18d2a2aec33d60874ab51aec3bedcca9a0b58c4a02887474cbfff060835e9c20ba0b0b12adaadb80a838996a532a6f22047256e161ab27a3133011300f0603551d130101ff040530030101ff300a06082a8648ce3d04030303670030640230398f8e436952fa2ac7a7a089ad1a541103ae030da68afff4fd8910fb5b559449e2345d3a34d661ff45681c74a7a07b9702306c04a5524bb543a3ee1d1a0e60d50c9ae362fb39135d63e2298079b592ea2aa5bc374999838e9780f5367895e7f25462\ncert 308201623081eaa003020102020102300a06082a8648ce3d0403033011310f300d06035504030c06526f6f742d36301e170d3235303530323030303030305a170d3236303630313030303030305a3011310f300d06035504030c06496e74412d363076301006072a8648ce3d020106052b810400220362000463c3efe46957be3a716c233a9a2da8ff7e4038f2bdd915c5e61c18ab08c0118680e254d096a8e3c92365cc5cb44442ec580d5fe60f79f6122185c1e74a2e0168b68b9b3eb7de971b501967f43182659e4bd98ca05b2b35de9b6deb4116a02abaa316301430120603551d130101ff040830060101ff020100300a06082a8648ce3d0403030367003064023044d2f2492a62ffea89aaf305fdbc5744357c5489860c802ddf01c9eb8ebfbbe3a55c64013ced53807ff339cad23bcf910230374d32d6c8b6a74cbe0f088d2061829494d6ad3401f561fb72e66d2fa72dca50fa875eaf60c77c4ed9385b875f68ef6d","output":"chain c6 untrusted path-too-long","image":null,"explain":"<p>The chain is leaf, <code>IntB-6<\/code>, <code>IntA-6<\/code>, anchor: three <code>cert<\/code> lines (leaf, then each signer going up), plus the anchor. <code>IntA-6<\/code> (the third <code>cert<\/code> line) carries path length <code>0<\/code> - meaning no intermediate may appear between it and the leaf - but <code>IntB-6<\/code> (the second <code>cert<\/code> line) does exactly that, one position closer to the leaf. (<code>IntA-6<\/code> itself is signed by the key given as the trust anchor, <code>Root-6<\/code>.)<\/p>"},{"label":"Example 3","name":"signed by an unlisted root","test":"09-R3-unknown-anchor","input":"chain c3\nnow 250601000000Z\nanchor P-384 5101da4433353de6df962daf91e881337ea90bcfc516bd7a9f5237c30660eb8649730bde08dbbf841b2c331558c587b0 3cae8209eab991d23b39f65a1fb48824f58ad9bd3cb98f2ed1046d14564cb3f71c2cfd986522ff2f7c1825df856fcf50\ncert 308201503081d8a003020102020101300a06082a8648ce3d04030330173115301306035504030c0c556e6b6e6f776e2d526f6f74301e170d3235303530323030303030305a170d3236303630313030303030305a3011310f300d06035504030c064c6561662d333076301006072a8648ce3d020106052b81040022036200048cc1cbcb31f30b3f7452e79a4ac4cc3f8f9849b9398c6de3f7213c207a8e92cc0434ed0b70cc6a9de61c75ef8e74a53cd910fa5aceb8a8f7fb005c473ebf4e20348b708295629f29b04f8a421c3d29fe304f4b0c401a35469796dac357cb2e6d300a06082a8648ce3d0403030367003064023023538226362bdd8a133ac7528a797e8c2c2681d46c8eb33dbfa64edbbce5e2c270c2e7a4646865244d1aa4e143b25c6f0230655e8e82c7530fa3eccd1f3be1b634e70fcdb4b65208be30a8ddd272d428d08aaad661c951530f433da99857ee87251f","output":"chain c3 untrusted unknown-anchor","image":null,"explain":"<p>This certificate's own issuer field even says \"Unknown-Root\", but that's just a name - what actually matters is that no given <code>anchor<\/code> key makes its signature check out. The <code>anchor<\/code> line given here is for a different, unrelated root.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>eMudhra's statement describes the outcome (browsers blocked certificates through the affected intermediates) without publishing any verification code - there's no author's snippet to compare against. The reference solution is in <code>_spoilers/reference/<\/code>: it reuses <code>common/certlib.py<\/code>'s <code>parse_certificate<\/code> and <code>verify_ecdsa_sha384<\/code>, checking signatures, then CA status, then path length, then validity, in that fixed order, returning on the first failure.<\/p>\n<p><strong>Something to look for:<\/strong> since every chain in this checkpoint's tests has at most one problem, the order of those four checks doesn't actually change any test's answer - a correct solution that checks validity first and signatures last passes exactly the same tests. What the order <em>does<\/em> fix is which single reason gets reported when more than one thing is wrong with a chain, which these tests don't exercise. If you want to see this for yourself, try building a chain with two unrelated problems and see which reason your program reports first.<\/p>"}},{"id":"10","num":"10","title":"Find a weak private key","difficulty":"Medium","tests":36,"solution":"solutions/p10_find_weak_key.py","problem":"problems/10-find-weak-key.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 10 - Find a weak private key\n#\n# Problem:  problems/10-find-weak-key.md (also in the web problem book)\n# Check:    ./check.sh 10\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 10 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p10_find_weak_key.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 10 - Find a weak private key\n#\n# Problem:  problems/10-find-weak-key.md (also in the web problem book)\n# Check:    ./check.sh 10\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on find_private_key().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\n# The curve constants are on the problem page. Fill this in from there.\nCURVES = {\n    \"P-256\": {},\n    \"P-384\": {},\n}\n\n\ndef find_private_key(curve, x, y, bound):\n    \"\"\"Return d, with 1 <= d <= bound, if the public key (x, y) on `curve` equals d*G; else None.\"\"\"\n    # TODO: step through G, 2G, 3G, ... up to `bound`, comparing each point with (x, y).\n    raise NotImplementedError(\"find_private_key\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    bound = 0\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"bound\":  # bound <N>: applies to the key lines after it\n                bound = int(words[1])\n            elif words[0] == \"key\":  # key <label> <curve> <x> <y>, coordinates in hex\n                label, curve, x, y = words[1], words[2], int(words[3], 16), int(words[4], 16)\n                d = find_private_key(curve, x, y, bound)\n                lines.append(f\"none {label}\" if d is None else f\"weak {label} {d}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["big integers","modular arithmetic (<code>pow(a, -1, p)<\/code> in Python)","parsing hex","a counting loop"],"text":["big integers","modular arithmetic (pow(a, -1, p) in Python)","parsing hex","a counting loop"]},{"label":"Library","items":["none needed. Python's built-in <code>int<\/code> handles 384-bit numbers"],"text":["none needed. Python's built-in int handles 384-bit numbers"]},{"label":"Concepts","items":["elliptic-curve public and private keys","point addition and doubling","weak keys","key space"],"text":["elliptic-curve public and private keys","point addition and doubling","weak keys","key space"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads public keys and, for each one, finds out whether its private key is a small number.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p10_find_weak_key.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p10_find_weak_key.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>find_private_key()<\/code>.<\/p>\n<h3>How a public key relates to its private key<\/h3>\n<p>An elliptic curve is a set of points (x, y) with arithmetic mod a prime <code>p<\/code>. Each curve comes with a fixed point <code>G<\/code>, the generator. A private key is a whole number <code>d<\/code>. The matching public key is the point<\/p>\n<pre><code>Q = d * G = G + G + ... + G        (d copies of G)<\/code><\/pre>\n<p>Going from <code>d<\/code> to <code>Q<\/code> is cheap. Going from <code>Q<\/code> back to <code>d<\/code> is believed to be infeasible when <code>d<\/code> is a random number of 256 or 384 bits, because there are about 2^256 or 2^384 candidates. If <code>d<\/code> is small, there are few candidates, and an attacker can try them in order: compute <code>1*G<\/code>, <code>2*G<\/code>, <code>3*G<\/code> and so on until one equals <code>Q<\/code>. That is the whole attack, and this checkpoint asks you to carry it out.<\/p>\n<p>A tiny example, on the curve <code>y² = x³ + 2x + 2<\/code> mod 17 with <code>G = (5, 1)<\/code>:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>d<\/th><th>d·G<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>(5, 1)<\/td><\/tr><tr><td>2<\/td><td>(6, 3)<\/td><\/tr><tr><td>3<\/td><td>(10, 6)<\/td><\/tr><tr><td>4<\/td><td>(3, 1)<\/td><\/tr><tr><td>5<\/td><td>(9, 16)<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Given the public key <code>Q = (3, 1)<\/code>, you walk down the table and stop at the row with <code>d = 4<\/code>.<\/p>\n<h3>The arithmetic you need<\/h3>\n<p>All curves here have the form <code>y² = x³ + a·x + b (mod p)<\/code> with <code>a = p - 3<\/code>. Every operation below is mod <code>p<\/code>. To divide by <code>k<\/code>, multiply by <code>k<\/code> to the power -1 mod <code>p<\/code> (the modular inverse; Python has <code>pow(k, -1, p)<\/code>).<\/p>\n<p>To add two different points <code>P = (x1, y1)<\/code> and <code>R = (x2, y2)<\/code>:<\/p>\n<pre><code>slope = (y2 - y1) / (x2 - x1)\nx3    = slope² - x1 - x2\ny3    = slope * (x1 - x3) - y1<\/code><\/pre>\n<p>To add a point to itself (<code>P + P<\/code>, called doubling), the slope comes from the curve's tangent:<\/p>\n<pre><code>slope = (3·x1² + a) / (2·y1)\nx3    = slope² - 2·x1\ny3    = slope * (x1 - x3) - y1<\/code><\/pre>\n<p><code>d*G<\/code> is <code>(d-1)*G + G<\/code>, so stepping from one multiple to the next is one addition of <code>G<\/code>. The first step from <code>1*G<\/code> to <code>2*G<\/code> is a doubling, because both points are <code>G<\/code>. The ordinary formula would divide by <code>x2 - x1 = 0<\/code> there.<\/p>\n<p>The point <code>(x, p - y)<\/code> is the <strong>negation<\/strong> of <code>(x, y)<\/code>. It has the same x and the other y. If <code>Q = d*G<\/code>, then <code>(x, p - y)<\/code> equals <code>(n - d)*G<\/code>, where <code>n<\/code> is the number of points in the group generated by <code>G<\/code> (about 2^256 or 2^384). Such a key is not small.<\/p>\n<h3>The curves<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>P-256<\/th><th>P-384<\/th><\/tr><\/thead><tbody><tr><td><code>p<\/code><\/td><td><code>ffffffff00000001000000000000000000000000ffffffffffffffffffffffff<\/code><\/td><td><code>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff<\/code><\/td><\/tr><tr><td><code>a<\/code><\/td><td><code>p - 3<\/code><\/td><td><code>p - 3<\/code><\/td><\/tr><tr><td><code>b<\/code><\/td><td><code>5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604b<\/code><\/td><td><code>b3312fa7e23ee7e4988e056be3f82d19181d9c6efe8141120314088f5013875ac656398d8a2ed19d2a85c8edd3ec2aef<\/code><\/td><\/tr><tr><td><code>Gx<\/code><\/td><td><code>6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296<\/code><\/td><td><code>aa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7<\/code><\/td><\/tr><tr><td><code>Gy<\/code><\/td><td><code>4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5<\/code><\/td><td><code>3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>All numbers are in hexadecimal. (<code>b<\/code> is only listed for completeness; the formulas above don't use it.)<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains two kinds of lines:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>bound &lt;N&gt;<\/code><\/td><td>The largest private key to try. It applies to every <code>key<\/code> line after it, until the next <code>bound<\/code> line.<\/td><\/tr><tr><td><code>key &lt;label&gt; &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>A public key. <code>label<\/code> is a word with no spaces. <code>curve<\/code> is <code>P-256<\/code> or <code>P-384<\/code>. <code>x<\/code> and <code>y<\/code> are hexadecimal, lowercase, with no <code>0x<\/code> prefix.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Every key is a valid point on its curve.<\/p>\n<h3>Output<\/h3>\n<p>For each <code>key<\/code> line, in input order, write one line:<\/p>\n<pre><code>weak &lt;label&gt; &lt;d&gt;      the key equals d*G for a whole number d from 1 to the bound; &lt;d&gt; is written in decimal\nnone &lt;label&gt;          no d from 1 to the bound gives this key<\/code><\/pre>\n<p><code>&lt;label&gt;<\/code> is copied from the input unchanged. The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>One output line per <code>key<\/code> line, in input order, in the format above. A later <code>bound<\/code> line replaces the earlier one for the keys after it.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A key whose <code>d<\/code> is between 1 and the bound is reported with that <code>d<\/code>. This includes <code>d = 1<\/code> (the key is <code>G<\/code>), <code>d = 2<\/code> (the first step is a doubling), and <code>d<\/code> equal to the bound.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Only an exact match is weak. The bound is inclusive, so <code>d = bound + 1<\/code> is <code>none<\/code>. Both coordinates must match, so a key with the right x and the other y (the negation of a weak key) is <code>none<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Both curves work. P-256 and P-384 have their own <code>p<\/code> and <code>G<\/code>.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A bound of 1000 with several keys finishes inside the time limit, including keys that are not weak, where every step up to the bound runs.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>The first line of every input is a <code>bound<\/code> line, so each key has a bound. There are no blank lines, and every other line is a <code>key<\/code> line.<\/li><li>Every key is a valid point on its curve. Labels have no spaces. An input has at most 15 keys.<\/li><li>The bound is at most 1000, and in most tests it is 255.<\/li><li>Each case has a 10-second limit. A loop that adds <code>G<\/code> once per step takes well under a second.<\/li><li>There are 36 tests: 3 for R1, 10 for R2, 7 for R3, 2 for R4, 4 for R5 and 10 end-to-end. They include the examples above, <code>d = 1<\/code>, <code>2<\/code>, <code>3<\/code> and the bound itself on both curves, values one past the bound, negated keys, both curves in one input, a bound of 1000 with strong keys that make every step run, and the eight small values reported for the incident mixed with random keys. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p10_find_weak_key.py","text":"# Reference solution - checkpoint 10 (Find a weak private key). SPOILERS: try it yourself first.\n#\n# The public key is Q = d*G. If d is small, walking G, 2G, 3G, ... reaches Q after d steps.\n# Each step adds G to the previous point, so the whole search costs `bound` point additions\n# rather than `bound` full multiplications.\n\nimport sys\n\nCURVES = {\n    \"P-256\": {\n        \"p\": 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff,\n        \"gx\": 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296,\n        \"gy\": 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5,\n    },\n    \"P-384\": {\n        \"p\": 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff,\n        \"gx\": 0xaa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7,\n        \"gy\": 0x3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f,\n    },\n}\n\n\ndef add(p, a, point, other):\n    \"\"\"Add two affine points (neither is the point at infinity, and they are not negatives).\"\"\"\n    x1, y1 = point\n    x2, y2 = other\n    if (x1, y1) == (x2, y2):\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # doubling: the tangent's slope\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p  # the slope of the line through both points\n    x3 = (slope * slope - x1 - x2) % p\n    return x3, (slope * (x1 - x3) - y1) % p\n\n\ndef find_private_key(curve, x, y, bound):\n    \"\"\"Return d, with 1 <= d <= bound, if the public key (x, y) on `curve` equals d*G; else None.\"\"\"\n    params = CURVES[curve]\n    p, a = params[\"p\"], params[\"p\"] - 3\n    g = (params[\"gx\"], params[\"gy\"])\n    target = (x, y)\n    point = g  # 1*G\n    for d in range(1, bound + 1):\n        if point == target:\n            return d\n        point = add(p, a, point, g)\n    return None\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    bound = 0\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"bound\":  # bound <N>: applies to the key lines after it\n                bound = int(words[1])\n            elif words[0] == \"key\":  # key <label> <curve> <x> <y>, coordinates in hex\n                label, curve, x, y = words[1], words[2], int(words[3], 16), int(words[4], 16)\n                d = find_private_key(curve, x, y, bound)\n                lines.append(f\"none {label}\" if d is None else f\"weak {label} {d}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"}],"proof":{"passed":36,"total":36,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own; the post tells the story behind it. Read eMudhra's <a href=\"https://emudhra.com/en/post/certificate-security-incident#:~:text=An%20Update%20on%20Our%20Global%20TLS%20Intermediate%20CA%20Incident\" target=\"_blank\" rel=\"noopener\">Update 3<\/a>, from \"What happened\" through \"How it happened\". It says the keys were \"cryptographically weak\" and that a researcher \"was able to reverse-engineer\" them. It doesn't say how that works. This checkpoint is how.<\/p>","context":"<p>Checkpoints 1 to 3 build the arithmetic that turns a private number into a public key. This checkpoint runs it the other way for keys that were generated badly. Checkpoint 11 uses a key you recover here to sign a certificate, and checkpoint 13 turns this search into a check that a certificate authority could run before it publishes a key.<\/p>","sources":"<ul><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a>, Update 3<\/li><li>BleepingComputer, <a href=\"https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/\" target=\"_blank\" rel=\"noopener\">Mozilla, Google, Apple block compromised eMudhra CA certificates<\/a>: the keys were P-384 private keys with values smaller than 256<\/li><li>The Register, <a href=\"https://www.theregister.com/security/2026/10/20/indian-certification-authority-emudhras-private-keys-compromised-one-of-them-was-the-number-4/5304312\" target=\"_blank\" rel=\"noopener\">Indian certification authority eMudhra's private keys compromised<\/a>: the recovered values 4, 56 and 115, found in under a second<\/li><li>SECG, <a href=\"https://www.secg.org/sec2-v2.pdf\" target=\"_blank\" rel=\"noopener\">SEC 2: Recommended Elliptic Curve Domain Parameters<\/a>, for <code>secp256r1<\/code> and <code>secp384r1<\/code><\/li><li>NIST, <a href=\"https://csrc.nist.gov/pubs/sp/800/186/final\" target=\"_blank\" rel=\"noopener\">SP 800-186: Recommendations for Discrete Logarithm-based Cryptography<\/a>, for P-256 and P-384<\/li><\/ul>","checking":"<pre><code>./check.sh 10                         run every test\n./check.sh 10 -Case 10-R2-d2-p256     one test, showing its full input, expected output and your output\n./check.sh 10 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 10 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Only an exact match is weak: the bound is inclusive (d = bound + ... .    0 / 7   FAILED\n      x 10-R3-neg-p256  P-256: keys with the sign of y flipped, for d = 1, 4, 56 and 255\n          line 1: expected `none n1`, got `weak n1 1`\n          likely cause: R3 - Only an exact match is weak: the bound is inclusive (d = bound + 1 is `none`), and both coordinates must match, so the negated key (x, p - y) is `none`\n          expected values from: cryptography 41.0.7 (OpenSSL): the public key is computed from the chosen private value d\n          reproduce: python3 -P tools/run_py.py solutions 10 build/cases/10/10-R3-neg-p256.in build/cases/10/10-R3-neg-p256.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>You don't need to solve any hard problem. A public key is <code>d<\/code> copies of <code>G<\/code> added together, so if you are told <code>d<\/code> is at most the bound, you can try <code>d = 1, 2, 3, ...<\/code> and stop when the point matches. The work is in writing the point addition.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Keep one variable for the current point, starting at <code>G<\/code> (which is <code>1*G<\/code>). In each step, compare it with the key; if it matches, you know <code>d<\/code>. Otherwise add <code>G<\/code> to it and move to the next <code>d<\/code>. Adding <code>G<\/code> once per step is much cheaper than computing every <code>d*G<\/code> from scratch. Write one function for \"add two points\" that picks the doubling formula when both points are the same.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>G + G<\/code> needs the doubling formula. The ordinary formula divides by zero.<\/li><li>Compare both x and y. The negation of a key has the same x.<\/li><li>The bound is inclusive: <code>d = bound<\/code> is found, <code>d = bound + 1<\/code> is not.<\/li><li>Count from 1. <code>d = 0<\/code> is not a key.<\/li><li>Each key line uses its own curve's <code>p<\/code> and <code>G<\/code>. Keep both in a table.<\/li><li>A <code>bound<\/code> line applies to the <code>key<\/code> lines after it, and a later one replaces it.<\/li><li>Coordinates are hex text. Parse them as base 16, and print <code>d<\/code> in decimal.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>add(P, R):\n    if P == R: slope = (3*P.x² + a) * inverse(2*P.y)  mod p\n    else:      slope = (R.y - P.y) * inverse(R.x - P.x)  mod p\n    x3 = slope² - P.x - R.x  mod p\n    y3 = slope * (P.x - x3) - P.y  mod p\n    return (x3, y3)\n\nfind_private_key(curve, Q, bound):\n    point = G\n    for d from 1 to bound:\n        if point == Q: return d\n        point = add(point, G)\n    return none<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the first step is a doubling","test":"10-R2-d2-p256","input":"bound 255\nkey two P-256 7cf27b188d034f7e8a52380304b51ac3c08969e277f21b35a60b48fc47669978 07775510db8ed040293d9ac69f7430dbba7dade63ce982299e04b79d227873d1","output":"weak two 2","image":null,"explain":"<p><code>1*G<\/code> is <code>G<\/code> itself, which has x = <code>6b17d1f2…<\/code>. Your loop compares it with the key (no match), then adds <code>G<\/code> to get <code>2*G<\/code>. That addition is <code>G + G<\/code>, so use the doubling formula. The result has x = <code>7cf27b18…<\/code>, which matches the key, so <code>d = 2<\/code>.<\/p>"},{"label":"Example 2","name":"the same x with the other y","test":"10-R3-neg-and-plain","input":"bound 100\nkey plain P-384 e035e8b33efae0987f6b994529285be4a9d55093d2b9c155c086e2b3c025a8c1c860097bb529b268b7ff95719518ac0a 97ec427650d600ee6cb34cd52ca0939b67b1549fa42eb2b56bc12979167a090075510dffbc395a4b6e04bec3a3ec4ae9\nkey flipped P-384 e035e8b33efae0987f6b994529285be4a9d55093d2b9c155c086e2b3c025a8c1c860097bb529b268b7ff95719518ac0a 6813bd89af29ff11934cb32ad35f6c64984eab605bd14d4a943ed686e985f6fe8aaef1ff43c6a5b491fb413d5c13b516","output":"weak plain 42\nnone flipped","image":null,"explain":"<p>Both keys have the same x. The first is <code>42*G<\/code>. The second is <code>42*G<\/code> with y replaced by <code>p - y<\/code>, which is <code>(n - 42)*G<\/code>, a huge private key. A program that compares only x reports both as <code>weak … 42<\/code>.<\/p>"},{"label":"Example 3","name":"the value from the incident","test":"10-E2E-incident-d4","input":"bound 255\nkey intermediate-1 P-384 138251cd52ac9298c1c8aad977321deb97e709bd0b4ca0aca55dc8ad51dcfc9d1589a1597e3a5120e1efd631c63e1835 cacae29869a62e1631e8a28181ab56616dc45d918abc09f3ab0e63cf792aa4dced7387be37bba569549f1c02b270ed67","output":"weak intermediate-1 4","image":null,"explain":"<p>This is the public key for private key 4 on P-384, made for this workbook. Press reports say one of the eight eMudhra intermediate keys had exactly this private key. Your loop reaches it on the fourth step.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>The post contains no code, so there is no author's version to compare. It describes the outcome: a researcher reverse-engineered the weak keys, reportedly with AI-assisted tooling. What you wrote is the plain version of that: a loop of at most 255 point additions.<\/p>\n<p><strong>Something to look for:<\/strong> the post says only that the keys were \"cryptographically weak\". The size of the values comes from press reports, which say the keys were P-384 private keys below 256, and The Register lists the recovered values 4, 56, 115, 66, 155, 156, 230 and 237. Those reports don't say which value belongs to which of the eight certificates, so the labels in the E2E tests are only numbers. eMudhra says it hasn't confirmed the root cause, and it says none of the eight issued a certificate; this checkpoint says nothing about either.<\/p>"}},{"id":"11","num":"11","title":"Sign a certificate with a recovered key","difficulty":"Hard","tests":21,"solution":"solutions/p11_sign_with_weak_key.py","problem":"problems/11-sign-with-weak-key.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 11 - Sign a certificate with a recovered key\n#\n# Problem:  problems/11-sign-with-weak-key.md (also in the web problem book)\n# Check:    ./check.sh 11\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 11 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p11_sign_with_weak_key.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 11 - Sign a certificate with a recovered key\n#\n# Problem:  problems/11-sign-with-weak-key.md (also in the web problem book)\n# Check:    ./check.sh 11\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on sign().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\nCURVES = {\n    \"P-256\": {},\n    \"P-384\": {},\n}\nHEXLEN = {\"P-256\": 64, \"P-384\": 96}\n\n\ndef sign(curve, d, z, k):\n    \"\"\"Return (r, s), the ECDSA signature for private key d, hash z, and nonce k.\"\"\"\n    # TODO: R = k*G; r = R.x mod n; s = k^-1 * (z + r*d) mod n. The curve constants are on\n    # the problem page.\n    raise NotImplementedError(\"sign\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            # sign <id> <curve> <d> <z> <k>: d, z, k in hex\n            _, case_id, curve, d, z, k = words\n            r, s = sign(curve, int(d, 16), int(z, 16), int(k, 16))\n            w = HEXLEN[curve]\n            lines.append(f\"signature {case_id} {r:0{w}x} {s:0{w}x}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["big integers","modular arithmetic","parsing hex"],"text":["big integers","modular arithmetic","parsing hex"]},{"label":"Library","items":["none needed. Python's built-in <code>int<\/code> handles 384-bit numbers"],"text":["none needed. Python's built-in int handles 384-bit numbers"]},{"label":"Concepts","items":["ECDSA signing","the private key's role","why a compromised CA key is catastrophic"],"text":["ECDSA signing","the private key's role","why a compromised CA key is catastrophic"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that computes an ECDSA signature, given a private key, a message's hash, and a one-time random number called the nonce (written <code>k<\/code>).<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p11_sign_with_weak_key.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p11_sign_with_weak_key.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>sign()<\/code>.<\/p>\n<h3>The signing equation<\/h3>\n<p>Real signing draws <code>k<\/code> at random, once per signature, and never reuses it. Here <code>k<\/code> is given to you directly, so the answer is exact and checkable; the problem page's \"After you pass\" explains why reusing <code>k<\/code> would be a disaster of its own.<\/p>\n<p>With <code>n<\/code> the curve's order (from checkpoint 10's table) and <code>G<\/code> the generator:<\/p>\n<pre><code>R = k * G\nr = R.x mod n\ns = k^-1 * (z + r * d) mod n<\/code><\/pre>\n<p><code>z<\/code> is the message's hash, already reduced to an integer the same way checkpoint 4 uses it. The signature is the pair <code>(r, s)<\/code>. This is literally checkpoint 4's verification equation solved for <code>s<\/code> instead of checked: a relying party who later wants to check <code>(r, s)<\/code> runs checkpoint 4's procedure and it comes back valid, because that is what the equation guarantees.<\/p>\n<p><code>k * G<\/code> needs the same double-and-add approach as checkpoint 3 (<code>k<\/code> can be any size up to <code>n<\/code>), not a loop that adds <code>G<\/code> to itself <code>k<\/code> times.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. Each line is one signature to produce:<\/p>\n<pre><code>sign &lt;id&gt; &lt;curve&gt; &lt;d&gt; &lt;z&gt; &lt;k&gt;<\/code><\/pre>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>id<\/code><\/td><td>A label with no spaces. Print it back unchanged.<\/td><\/tr><tr><td><code>curve<\/code><\/td><td><code>P-256<\/code> or <code>P-384<\/code>.<\/td><\/tr><tr><td><code>d<\/code><\/td><td>The private key, hex, zero-padded to the curve's field width (64 hex digits for P-256, 96 for P-384).<\/td><\/tr><tr><td><code>z<\/code><\/td><td>The message's hash, same hex width as <code>d<\/code>, already an integer in range.<\/td><\/tr><tr><td><code>k<\/code><\/td><td>The nonce, same hex width. Always a valid value: <code>1 &lt;= k &lt;= n - 1<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>One line per input, in order:<\/p>\n<pre><code>signature &lt;id&gt; &lt;r&gt; &lt;s&gt;<\/code><\/pre>\n<p><code>r<\/code> and <code>s<\/code>, in lowercase hex, zero-padded to the same width as the input values. The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also shows which requirement it was written to cover.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>One output line per input, in order, in the format above.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Both curves work. P-256 and P-384 each use their own <code>p<\/code>, <code>a<\/code>, <code>G<\/code> and <code>n<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Every nonce works, including <code>k = 1<\/code> (<code>R<\/code> is <code>G<\/code> itself), <code>k = 2<\/code> (the first doubling), <code>k = n - 1<\/code> (the largest valid nonce), and a large random <code>k<\/code>. <code>k * G<\/code> must come from double-and-add, not a loop that runs <code>k<\/code> times: <code>k<\/code> here is as large as the curve's order, so a per-step loop would not finish.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>The private key can be any value, including small ones. <code>d = 4<\/code> (the value reported for the real incident) works exactly the same way as a large, properly generated key. The formula does not know or care how <code>d<\/code> was chosen.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>The hash <code>z<\/code> can be any value in range, including <code>0<\/code> and <code>n - 1<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>d<\/code>, <code>z<\/code> and <code>k<\/code> are always well-formed: <code>1 &lt;= d &lt; n<\/code>, <code>0 &lt;= z &lt; n<\/code>, <code>1 &lt;= k &lt; n<\/code>.<\/li><li>Every test case is constructed so that <code>r<\/code> and <code>s<\/code> both come out non-zero, which a real signer must check and redraw <code>k<\/code> for if either happened. That check is not exercised here; the constraint guarantees you won't hit it.<\/li><li>Each case has a 10-second limit. Double-and-add for <code>k * G<\/code> takes well under a second even for the largest <code>k<\/code> in the tests.<\/li><li>There are 21 tests: the examples above, both curves, the nonce values described in R3, several small and large private keys including the incident's, and the hash boundaries in R5.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p11_sign_with_weak_key.py","text":"# Reference solution - checkpoint 11 (Sign a certificate with a recovered key). SPOILERS: try\n# it yourself first.\n#\n# ECDSA signing is the mirror of checkpoint 04's verification equation: given d, a message hash\n# z, and a one-time random number k (given here so the answer is reproducible, instead of drawn\n# by the program):\n#   R = k*G, r = R.x mod n\n#   s = k^-1 * (z + r*d) mod n\n# k must never be reused across two different messages signed with the same key: reusing it\n# leaks d directly (not exercised here; see the problem page's \"After you pass\").\n\nimport sys\n\nCURVES = {\n    \"P-256\": {\n        \"p\": 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff,\n        \"gx\": 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296,\n        \"gy\": 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5,\n        \"n\": 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551,\n    },\n    \"P-384\": {\n        \"p\": 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff,\n        \"gx\": 0xaa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7,\n        \"gy\": 0x3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f,\n        \"n\": 0xffffffffffffffffffffffffffffffffffffffffffffffffc7634d81f4372ddf581a0db248b0a77aecec196accc52973,\n    },\n}\n\n\ndef add(p, a, point, other):\n    \"\"\"Add two affine points (neither is the point at infinity).\"\"\"\n    x1, y1 = point\n    x2, y2 = other\n    if (x1, y1) == (x2, y2):\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p\n    x3 = (slope * slope - x1 - x2) % p\n    return x3, (slope * (x1 - x3) - y1) % p\n\n\ndef multiply(p, a, g, k):\n    \"\"\"k*G by double-and-add: O(log k) additions, unlike checkpoint 10's O(k) search.\"\"\"\n    result, base = None, g\n    while k:\n        if k & 1:\n            result = base if result is None else add(p, a, result, base)\n        base = add(p, a, base, base)\n        k >>= 1\n    return result\n\n\ndef sign(curve, d, z, k):\n    \"\"\"Returns (r, s), the ECDSA signature for private key d, hash z, nonce k.\"\"\"\n    c = CURVES[curve]\n    p, a, n = c[\"p\"], c[\"p\"] - 3, c[\"n\"]\n    g = (c[\"gx\"], c[\"gy\"])\n    r = multiply(p, a, g, k)[0] % n\n    s = pow(k, -1, n) * (z + r * d) % n\n    return r, s\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\nHEXLEN = {\"P-256\": 64, \"P-384\": 96}  # zero-padded width: bytes in the field size, times 2\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            # sign <id> <curve> <d> <z> <k>: d, z, k in hex\n            _, case_id, curve, d, z, k = words\n            r, s = sign(curve, int(d, 16), int(z, 16), int(k, 16))\n            w = HEXLEN[curve]\n            lines.append(f\"signature {case_id} {r:0{w}x} {s:0{w}x}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"}],"proof":{"passed":21,"total":21,"date":"2026-10-21"},"uses":[]},"read":"","context":"<p>Checkpoint 10 found a private key <code>d<\/code> from a public key, when <code>d<\/code> was small. Checkpoint 4 checked whether a signature was valid, given a public key. This checkpoint is what an attacker does with <code>d<\/code> once they
