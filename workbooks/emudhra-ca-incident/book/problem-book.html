d an uncompressed EC point (0x04 || x || y)\")\n    coord_len = (len(point) - 1) // 2\n    x = int.from_bytes(point[1:1 + coord_len], \"big\")\n    y = int.from_bytes(point[1 + coord_len:], \"big\")\n    return curve, x, y\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"The raw subjectPublicKeyInfo node of a certificate, untouched (checkpoint 07 hashes its\n    exact original bytes - the whole nested SEQUENCE, not just the key bytes inside it).\"\"\"\n    top = der.parse_all(cert_bytes)\n    tbs = top[0].children[0]\n    children = tbs.children\n    i = 1 if children and children[0].cls == \"context\" and children[0].tag == 0 else 0\n    return children[i + 5]  # serialNumber, signature, issuer, validity, subject, then spki\n\n\ndef read_basic_constraints(extensions_wrapper: der.Node):\n    \"\"\"extensions_wrapper is the [3] EXPLICIT context node wrapping `Extensions ::= SEQUENCE OF\n    Extension`. Returns (ca, pathlen). Extension ::= SEQUENCE { extnID, critical BOOLEAN DEFAULT\n    FALSE OPTIONAL, extnValue OCTET STRING }, so extnValue is always the extension's last field.\"\"\"\n    extensions_seq = extensions_wrapper.children[0]\n    for extension in extensions_seq.children:\n        extn_id = der.decode_oid(extension.children[0].content)\n        if extn_id != BASIC_CONSTRAINTS_OID:\n            continue\n        extn_value = extension.children[-1]          # OCTET STRING: itself DER-encoded again\n        bc_seq = der.parse_all(extn_value.content)[0]  # BasicConstraints ::= SEQUENCE { cA, pathLen }\n        ca, idx = False, 0\n        if bc_seq.children and bc_seq.children[0].tag == der.BOOLEAN:\n            ca = bc_seq.children[0].content[0] != 0\n            idx = 1\n        pathlen = der.decode_integer(bc_seq.children[idx].content) if len(bc_seq.children) > idx else None\n        return ca, pathlen\n    return False, None  # BasicConstraints absent: RFC 5280 4.2.1.9 default is \"not a CA\"\n\n\n# ---- A whole certificate -----------------------------------------------------------------\n\n@dataclass\nclass Certificate:\n    tbs_bytes: bytes          # the exact original bytes of tbsCertificate, for re-hashing\n    serial: int\n    issuer_cn: str\n    subject_cn: str\n    not_before: str\n    not_after: str\n    curve: str\n    pubx: int\n    puby: int\n    ca: bool\n    pathlen: object           # int, or None if there is no path length constraint\n    sig_alg_oid: str\n    sig_r: int\n    sig_s: int\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Certificate ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }.\"\"\"\n    top = der.parse_all(cert_bytes)\n    if len(top) != 1 or top[0].tag != der.SEQUENCE or not top[0].constructed:\n        raise ValueError(\"a certificate is exactly one top-level SEQUENCE\")\n    cert = top[0]\n    if len(cert.children) != 3:\n        raise ValueError(\"a Certificate has exactly 3 fields: tbsCertificate, \"\n                          \"signatureAlgorithm, signatureValue\")\n    tbs_node, sig_alg_node, sig_value_node = cert.children\n    tbs_bytes = cert_bytes[tbs_node.start: tbs_node.start + tbs_node.total_len]\n\n    children = tbs_node.children\n    i = 0\n    if children and children[i].cls == \"context\" and children[i].tag == 0:\n        i += 1  # version [0] EXPLICIT INTEGER; every certificate here is v3, so its value is fixed\n    serial = der.decode_integer(children[i].content); i += 1\n    i += 1  # signature: AlgorithmIdentifier, repeating the outer signatureAlgorithm; not needed again\n    issuer_cn = read_name_cn(children[i]); i += 1\n    not_before, not_after = read_validity(children[i]); i += 1\n    subject_cn = read_name_cn(children[i]); i += 1\n    curve, pubx, puby = read_spki(children[i]); i += 1\n    ca, pathlen = False, None\n    if i < len(children) and children[i].cls == \"context\" and children[i].tag == 3:\n        ca, pathlen = read_basic_constraints(children[i])\n\n    sig_alg_oid = der.decode_oid(sig_alg_node.children[0].content)\n    _unused, sig_der_bytes = der.decode_bit_string(sig_value_node.content)\n    sig_seq = der.parse_all(sig_der_bytes)[0]          # ECDSA-Sig-Value ::= SEQUENCE { r, s }\n    sig_r = der.decode_integer(sig_seq.children[0].content)\n    sig_s = der.decode_integer(sig_seq.children[1].content)\n\n    return Certificate(tbs_bytes, serial, issuer_cn, subject_cn, not_before, not_after,\n                        curve, pubx, puby, ca, pathlen, sig_alg_oid, sig_r, sig_s)\n\n\n# ---- Elliptic-curve point arithmetic and ECDSA verification (hand modular arithmetic) --------\n\ndef point_add(p: int, a: int, point, other):\n    \"\"\"Affine point addition on y^2 = x^3 + a*x + b (mod p). Either point may be None (the\n    point at infinity, the addition identity).\"\"\"\n    if point is None:\n        return other\n    if other is None:\n        return point\n    x1, y1 = point\n    x2, y2 = other\n    if x1 == x2:\n        if (y1 + y2) % p == 0:\n            return None  # point and its negation: the sum is the point at infinity\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # tangent slope (doubling)\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p          # chord slope\n    x3 = (slope * slope - x1 - x2) % p\n    y3 = (slope * (x1 - x3) - y1) % p\n    return x3, y3\n\n\ndef scalar_mult(p: int, a: int, n: int, k: int, point):\n    \"\"\"k * point, by double-and-add. point may be None (gives None back).\"\"\"\n    k %= n\n    if k == 0 or point is None:\n        return None\n    result = None\n    addend = point\n    while k:\n        if k & 1:\n            result = point_add(p, a, result, addend)\n        addend = point_add(p, a, addend, addend)\n        k >>= 1\n    return result\n\n\ndef verify_ecdsa_sha384(curve_name: str, pubx: int, puby: int, message: bytes, r: int, s: int) -> bool:\n    \"\"\"Checks an ECDSA signature (r, s) over SHA-384(message) against public key (pubx, puby).\n    This workbook's incident uses P-384 keys with ecdsa-with-SHA384 throughout, so the hash is\n    fixed here; a P-256 certificate would use SHA-256 instead (out of scope for this checkpoint).\"\"\"\n    c = CURVES[curve_name]\n    p, a, n, gx, gy = c[\"p\"], c[\"p\"] - 3, c[\"n\"], c[\"gx\"], c[\"gy\"]\n    if not (1 <= r < n and 1 <= s < n):\n        return False\n    digest = hashlib.sha384(message).digest()\n    z = int.from_bytes(digest, \"big\")\n    n_bits = n.bit_length()\n    if 8 * len(digest) > n_bits:\n        z >>= 8 * len(digest) - n_bits\n    w = pow(s, -1, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    point = point_add(p, a, scalar_mult(p, a, n, u1, (gx, gy)), scalar_mult(p, a, n, u2, (pubx, puby)))\n    if point is None:\n        return False\n    x, _y = point\n    return x % n == r\n"}],"proof":{"passed":17,"total":17,"date":"2026-10-21"},"uses":[]},"read":"<p>This checkpoint is prerequisite material, not drawn from eMudhra's post: it reads the specific fields of an X.509 certificate that the rest of this workbook needs. Read RFC 5280 section 4.1 (\"Basic Certificate Fields\") for the shape of a certificate, and section 4.2.1.9 (\"Basic Constraints\") for what makes a certificate a CA. This page is complete on its own after that.<\/p>","context":"<p>Checkpoint 05 taught you to walk DER's tag-length-value structure. This checkpoint walks a real certificate's bytes with that same technique and pulls out the handful of fields this workbook's later checkpoints need: who it's for, who issued it, when it's valid, its public key, and whether it's allowed to sign other certificates. Checkpoint 07 hashes the public key you read here, checkpoint 08 checks the signature, and checkpoint 09 chains several certificates together using exactly these fields.<\/p>","sources":"<ul><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, sections 4.1 (certificate fields) and 4.2.1.9 (Basic Constraints)<\/li><li>RFC 5480, <a href=\"https://www.rfc-editor.org/rfc/rfc5480\" target=\"_blank\" rel=\"noopener\">Elliptic Curve Cryptography Subject Public Key Information<\/a>, for the id-ecPublicKey SubjectPublicKeyInfo shape and the uncompressed point format<\/li><\/ul>","checking":"<pre><code>./check.sh 06                               run every test\n./check.sh 06 -Case 06-R3-pathlen-1         one test, showing its full input, expected output and your output\n./check.sh 06 -Fresh                        a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 06 -Dispute &lt;id&gt; &quot;why&quot;           set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R6  A certificate with no BasicConstraints extension at all defaults...    2 / 3   FAILED\n      x 06-R6-other-extension-no-basic-constraints  a different extension is present...\n          key[0]: expected (curve=P-256, pubx=07539bc9..., puby=...), got (curve=P-256, pubx=7539bc9..., puby=...) - differs in pubx\n          likely cause: R6 - A certificate with no BasicConstraints extension at all defaults to CA:false, no path length\n          expected values from: cryptography 41.0.7 (OpenSSL): fields are read back from the built certificate with a separate parse call, and validity strings with openssl asn1parse\n          reproduce: python3 -P tools/run_py.py solutions 06 build/cases/06/06-R6-other-extension-no-basic-constraints.in build/cases/06/06-R6-other-extension-no-basic-constraints.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Parse the certificate the way checkpoint 05 parses anything: one top-level SEQUENCE (<code>Certificate<\/code>), whose first child is another SEQUENCE (<code>tbsCertificate<\/code>). Everything you need is a child of that second SEQUENCE, in the fixed order given on this page.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Walk <code>tbsCertificate<\/code>'s direct children in order: skip the first one (version, always present and always <code>[0]<\/code>), then serialNumber, then signature (skip it too), then issuer, validity, subject, subjectPublicKeyInfo - six fields read in a fixed sequence. After that, there may or may not be a seventh child; if there is, and it's tagged <code>[3]<\/code>, that's extensions.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>version<\/code> is <code>[0]<\/code> EXPLICIT, meaning its content is itself a complete TLV node (an INTEGER), not the raw integer bytes directly in the <code>[0]<\/code> wrapper.<\/li><li><code>signature<\/code> (inside <code>tbsCertificate<\/code>) repeats the same algorithm as the outer <code>signatureAlgorithm<\/code>. Don't confuse the two or double-count a field.<\/li><li>An <code>Extension<\/code>'s <code>critical<\/code> field is optional, so <code>extnValue<\/code> is sometimes the second child and sometimes the third. It's always the <em>last<\/em> one.<\/li><li><code>extnValue<\/code> is an OCTET STRING whose content bytes are themselves a complete DER structure - you parse it a second time, independently of the outer walk.<\/li><li><code>cA BOOLEAN DEFAULT FALSE<\/code> means the encoder leaves it out entirely when false. A BasicConstraints SEQUENCE with only an INTEGER child means <code>cA<\/code> is false and that INTEGER is the path length - not the other way around.<\/li><li>Pad <code>pubx<\/code> and <code>puby<\/code> to the full coordinate width. A coordinate that happens to start with a zero byte is one hex digit shorter if you don't pad it, and the checker will catch that.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>read_certificate(bytes):\n    cert = parse_top_level_sequence(bytes)\n    tbs = cert.children[0]\n    children = tbs.children\n    i = 1 if children[0] is context-tag-0 else 0   # skip version if present\n    i += 1                                          # skip serialNumber\n    i += 1                                          # skip signature\n    issuer_cn = read_common_name(children[i]); i += 1\n    not_before, not_after = read_two_times(children[i]); i += 1\n    subject_cn = read_common_name(children[i]); i += 1\n    curve, x, y = read_public_key(children[i]); i += 1\n    ca, pathlen = false, none\n    if i &lt; len(children) and children[i] is context-tag-3:\n        ca, pathlen = read_basic_constraints(children[i])\n    return subject_cn, issuer_cn, not_before, not_after, curve, x, y, ca, pathlen<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a CA certificate with a path length","test":"06-R3-pathlen-1","input":"cert ca 308201763081fea003020102020101300a06082a8648ce3d04030330173115301306035504030c0c4578616d706c652d526f6f74301e170d3235303130313030303030305a170d3236303130313030303030305a301f311d301b06035504030c144578616d706c652d43412d506174686c656e2d313076301006072a8648ce3d020106052b8104002203620004e1623e85fc905a98a7d91c6dc26756f4c066161013d55fa7f7ad67897920f7a685f7bc8dd5ade34e9b1f25b65a9d9e23d97999d8a6638bbaf8def683da109ab03f8030fcd5c939c93a8e56d3ae60979440ee04be5d1288297aa111afebd07bbaa316301430120603551d130101ff040830060101ff020101300a06082a8648ce3d040303036700306402303f51e3de63db3ef3d01bbd44f60d1fd36f0d5ec18414b11dcdd69f3f9d0e8fe911f45d6c16be551aae0e543208537e4e02301895e2b422df6c84e29a69561aca0a7d99fa899950fd26fc130162dd6e0e11d536469c3326458c6e3f9577883571346b","output":"cert ca Example-CA-Pathlen-1 Example-Root\nvalidity 250101000000Z 260101000000Z\nkey P-384 e1623e85fc905a98a7d91c6dc26756f4c066161013d55fa7f7ad67897920f7a685f7bc8dd5ade34e9b1f25b65a9d9e23 d97999d8a6638bbaf8def683da109ab03f8030fcd5c939c93a8e56d3ae60979440ee04be5d1288297aa111afebd07bba\nca true 1","image":null,"explain":"<p>The certificate carries a BasicConstraints extension whose content decodes to <code>SEQUENCE { BOOLEAN true, INTEGER 1 }<\/code> - <code>cA<\/code> is present (true) and <code>pathLenConstraint<\/code> is <code>1<\/code>.<\/p>"},{"label":"Example 2","name":"no extensions at all","test":"06-R6-no-basic-constraints","input":"cert plain 308201233081caa003020102020101300a06082a8648ce3d040302301f311d301b06035504030c144e6f2d457874656e73696f6e732d497373756572301e170d3235303130313030303030305a170d3236303130313030303030305a30183116301406035504030c0d4e6f2d457874656e73696f6e733059301306072a8648ce3d020106082a8648ce3d03010703420004fdefa4845516df81e692b44605f484718dc2fe2edcf5d0b79ad85fbb655dc72ce86f7ee0ed72f65e897ecada18a82d161eb1feb3fa8b0798582f21fbe45451ea300a06082a8648ce3d0403020348003045022100b009db1bcf6a306229bb122b3271e64a5d44ad6874e22067f59a4dc1230d2a350220674d5f5b01adc3d5f8859190bd5016a1301facff5a28b5993d9f1bc65fa608ca","output":"cert plain No-Extensions No-Extensions-Issuer\nvalidity 250101000000Z 260101000000Z\nkey P-256 fdefa4845516df81e692b44605f484718dc2fe2edcf5d0b79ad85fbb655dc72c e86f7ee0ed72f65e897ecada18a82d161eb1feb3fa8b0798582f21fbe45451ea\nca false none","image":null,"explain":"<p><code>tbsCertificate<\/code> simply has no eighth field - its last child is <code>subjectPublicKeyInfo<\/code>. There is nothing to look inside; the default applies directly.<\/p>"},{"label":"Example 3","name":"several certificates, one chain-shaped input","test":"06-E2E-chain-shaped","input":"cert root 3082016f3081f5a003020102020101300a06082a8648ce3d04030330183116301406035504030c0d576f726b626f6f6b2d526f6f74301e170d3235303130313030303030305a170d3236303130313030303030305a30183116301406035504030c0d576f726b626f6f6b2d526f6f743076301006072a8648ce3d020106052b8104002203620004507ddbbe1b5b4597fc94fa596afd5ea790ac82c752252ffe9e9b95cd696bbcf103cd95cac83c0b40fdb9d8d792defb500ccf0104f13d368f620e6de88ce4b96aa8190b9b968da2ef552251f69940df65343559faa197374de240d48ee4d99028a3133011300f0603551d130101ff040530030101ff300a06082a8648ce3d0403030369003066023100c50214aa231c11efa95960923e47a020dd7cb43d7113da0acb9918a6ff007a2f1954ce263527a21c66b5057d855f10c7023100c1cadfb71f2a8e07f02f9988d99fe08c0688ee3920dd400cc0496f7db5899af7d1e5ee1f349c13b98377aeb172b68987\ncert intermediate 3082017a30820100a003020102020101300a06082a8648ce3d04030330183116301406035504030c0d576f726b626f6f6b2d526f6f74301e170d3235303130313030303030305a170d3236303130313030303030305a3020311e301c06035504030c15576f726b626f6f6b2d496e7465726d6564696174653076301006072a8648ce3d020106052b810400220362000465fcfdf22ddb0828646fa09dd6ac70346910523bc4dc5685f99ece135247f11246abb5a9b1a2566ccbc9722707e38be2da9f61bf80f5ee378b911bf1fdc5b7d0bd16863e3dfc1fe45032a3ce0f6aa8d4f38ce5f59095592f155e15db7c636b64a316301430120603551d130101ff040830060101ff020100300a06082a8648ce3d0403030368003065023009ae7a7120d47ffc17a9961dae82bbaa12cc61edeb3772c42b1472bdadc2b3b62442f31d80280d0506447f561265390e023100a52b34c76fd7d65fe173ba0338700418bf8b42a5f6747ad9bb98c04a4785810a21bc9fc8d81dd3051869e811a31c9cb7\ncert leaf 308201603081e8a003020102020101300a06082a8648ce3d0403033020311e301c06035504030c15576f726b626f6f6b2d496e7465726d656469617465301e170d3235303130313030303030305a170d3236303130313030303030305a30183116301406035504030c0d576f726b626f6f6b2d4c6561663076301006072a8648ce3d020106052b8104002203620004e7b3aed763622f0e4776aa889b41b42354653dc964aea513a4498d785b0bb38952130cb33a0fe971f521257b484ba0bbb3d3be8724e1337d27043c65e65bcd10e10aa2b47d0e0091200e9c44328a8ac461b3b58a958e88b57c5acaa9a0514cc5300a06082a8648ce3d0403030367003064023028bde61493a39b95a28d3d84665ec4f879a27663704fb8fec2b47c2bf2dfa855bd47dfe08db7eee289dde50a0f14a5b202304365bf93be614e348762c9123dfc35fb5e15ee9c21762f07a371bf1e6371a559753e836fe94e20ad107c76352cc167ab","output":"cert root Workbook-Root Workbook-Root\nvalidity 250101000000Z 260101000000Z\nkey P-384 507ddbbe1b5b4597fc94fa596afd5ea790ac82c752252ffe9e9b95cd696bbcf103cd95cac83c0b40fdb9d8d792defb50 0ccf0104f13d368f620e6de88ce4b96aa8190b9b968da2ef552251f69940df65343559faa197374de240d48ee4d99028\nca true none\ncert intermediate Workbook-Intermediate Workbook-Root\nvalidity 250101000000Z 260101000000Z\nkey P-384 65fcfdf22ddb0828646fa09dd6ac70346910523bc4dc5685f99ece135247f11246abb5a9b1a2566ccbc9722707e38be2 da9f61bf80f5ee378b911bf1fdc5b7d0bd16863e3dfc1fe45032a3ce0f6aa8d4f38ce5f59095592f155e15db7c636b64\nca true 0\ncert leaf Workbook-Leaf Workbook-Intermediate\nvalidity 250101000000Z 260101000000Z\nkey P-384 e7b3aed763622f0e4776aa889b41b42354653dc964aea513a4498d785b0bb38952130cb33a0fe971f521257b484ba0bb b3d3be8724e1337d27043c65e65bcd10e10aa2b47d0e0091200e9c44328a8ac461b3b58a958e88b57c5acaa9a0514cc5\nca false none","image":null,"explain":"<p>Twelve output lines from three input certificates: four lines each, in order. (This checkpoint doesn't check that <code>intermediate<\/code>'s signature really came from <code>root<\/code> - that's checkpoint 08.)<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>The post contains no code for this (it's prerequisite material, not drawn from the post), so there is no author's version to compare. The reference solution is in <code>_spoilers/reference/<\/code>, built on <code>common/certlib.py<\/code>'s <code>parse_certificate<\/code>.<\/p>\n<p><strong>Something to look for:<\/strong> the reference checks for <code>extensions<\/code> by testing whether there's an extra child <em>and<\/em> that it carries tag <code>[3]<\/code> - it doesn't just check \"is there one more field than expected\", because a certificate could in principle have a stray extra field that isn't extensions at all. Compare that with whatever check you wrote.<\/p>"}},{"id":"07","num":"7","title":"Hash the public key (SPKI)","difficulty":"Easy","tests":6,"solution":"solutions/p07_spki_hash.py","problem":"problems/07-spki-hash.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 07 - Hash the public key (SPKI)\n#\n# Problem:  problems/07-spki-hash.md (also in the web problem book)\n# Check:    ./check.sh 07\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 07 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p07_spki_hash.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 07 - Hash the public key (SPKI)\n#\n# Problem:  problems/07-spki-hash.md (also in the web problem book)\n# Check:    ./check.sh 07\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on spki_hash().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\n\ndef spki_hash(cert_bytes: bytes) -> str:\n    \"\"\"SHA-256 of the exact original bytes of the certificate's subjectPublicKeyInfo SEQUENCE\n    (algorithm identifier + BIT STRING, not just the raw key bytes), as 64 lowercase hex chars.\"\"\"\n    # TODO: find subjectPublicKeyInfo the way checkpoint 06 does (it's a fixed-position child of\n    # tbsCertificate), slice out its exact original bytes, and hash them.\n    raise NotImplementedError(\"spki_hash\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"cert\":  # cert <label> <hex>: a full DER-encoded certificate\n                lines.append(f\"spki {words[1]} {spki_hash(bytes.fromhex(words[2]))}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["byte slicing","<code>hashlib.sha256<\/code> (or your language's SHA-256)"],"text":["byte slicing","hashlib.sha256 (or your language's SHA-256)"]},{"label":"Library","items":["none needed beyond a SHA-256 implementation"],"text":["none needed beyond a SHA-256 implementation"]},{"label":"Concepts","items":["SubjectPublicKeyInfo","SPKI pinning","CRLSet blocking"],"text":["SubjectPublicKeyInfo","SPKI pinning","CRLSet blocking"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that computes the SPKI hash of one or more certificates: SHA-256 of the exact original bytes of the certificate's <code>subjectPublicKeyInfo<\/code> field.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p07_spki_hash.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p07_spki_hash.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>spki_hash()<\/code>.<\/p>\n<h3>What exactly gets hashed<\/h3>\n<p><code>subjectPublicKeyInfo<\/code> is the whole <code>SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT STRING }<\/code> - checkpoint 06's \"key\" line came from the same field, at the same position: the 6th child of <code>tbsCertificate<\/code> (version, serialNumber, signature, issuer, validity, subject, then <code>subjectPublicKeyInfo<\/code>), exactly as checkpoint 06's walk reaches it. The hash is SHA-256 of <strong>that entire SEQUENCE's original DER bytes<\/strong>, tag and length included, not just the raw point bytes inside the BIT STRING, and not the algorithm identifier alone either. This matters: two certificates with the same key but a different curve OID encoding, or the same key hashed with and without its SEQUENCE wrapper, would NOT match under a correct implementation if you hashed the wrong slice - the whole point of this checkpoint is to hash exactly the bytes that OpenSSL's own pipeline hashes, so compare your output against the examples closely.<\/p>\n<p>This matches what<\/p>\n<pre><code>openssl x509 -pubkey -noout -inform DER -in cert.der | openssl pkey -pubin -outform DER | openssl dgst -sha256<\/code><\/pre>\n<p>computes: the first command extracts the public key as a PEM SubjectPublicKeyInfo block, the second re-encodes it as DER, and the third hashes those bytes.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains one kind of line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>cert &lt;label&gt; &lt;hex&gt;<\/code><\/td><td>A full DER-encoded certificate (the same shape as checkpoint 06's input, and standalone here too - you don't need checkpoint 06's output). <code>label<\/code> is a word with no spaces.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each <code>cert<\/code> line, in input order, write one line:<\/p>\n<pre><code>spki &lt;label&gt; &lt;hash&gt;<\/code><\/pre>\n<p><code>&lt;hash&gt;<\/code> is the SHA-256 digest as 64 lowercase hex characters. The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The SPKI hash is correct for several P-256 certificates.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>The SPKI hash is correct for several P-384 certificates.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Two different certificates - different subject name, different validity period, even a different serial number - that happen to carry the same public key produce the <strong>same<\/strong> hash. This is the actual mechanism: the hash survives reissuance, which is why it's what Chrome blocked on instead of the certificate's own serial number or fingerprint.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate is well-formed DER, the same shape checkpoint 06 reads.<\/li><li>There are 6 tests: 1 each for R1 and R2 (three certificates each), 2 for R3, and 2 end-to-end cases mixing curves and reissuance in one input. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p07_spki_hash.py","text":"# Reference solution - checkpoint 07 (Hash the public key). SPOILERS: try it yourself first.\n#\n# The SPKI hash is SHA-256 of the exact original bytes of subjectPublicKeyInfo - the whole\n# nested SEQUENCE (algorithm identifier + BIT STRING), not just the raw key bytes. Finding that\n# node is the same walk checkpoint 06 does; common/certlib.py's find_spki does only that much\n# of it, since this checkpoint doesn't need the rest of the certificate's fields.\n\nimport hashlib\nimport sys\n\nfrom common.certlib import find_spki\n\n\ndef spki_hash(cert_bytes: bytes) -> str:\n    node = find_spki(cert_bytes)\n    raw = cert_bytes[node.start: node.start + node.total_len]\n    return hashlib.sha256(raw).hexdigest()\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"cert\":  # cert <label> <hex>\n                lines.append(f\"spki {words[1]} {spki_hash(bytes.fromhex(words[2]))}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"},{"path":"common/certlib.py","text":"\"\"\"Hand-written X.509 certificate reading and ECDSA verification, built on common/der.py.\nShared by the reference solutions for checkpoints 06-09. SPOILERS: try the checkpoints yourself\nfirst.\n\nNo `cryptography.x509` parsing and no library ECDSA verification here: every field is read with\ncommon/der.py's TLV walker, and signatures are checked with plain modular arithmetic (the same\npoint-addition formulas checkpoint 10 uses, run the other direction: multiply instead of search).\nThe curve constants (p, n, Gx, Gy) are reused from tools/curves.py rather than retyped.\n\"\"\"\n\nimport hashlib\nimport sys\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom . import der\n\n# tools/curves.py holds the OpenSSL-verified curve constants; reuse its numbers instead of\n# retyping them (the generators already prove them correct via curves.verify()).\n_ROOT = Path(__file__).resolve().parents[3]\nsys.path.insert(0, str(_ROOT / \"tools\"))\nimport curves as _curves  # noqa: E402\n\nCURVES = {name: {\"p\": c[\"p\"], \"n\": c[\"n\"], \"gx\": c[\"gx\"], \"gy\": c[\"gy\"]} for name, c in _curves.CURVES.items()}\n\nID_EC_PUBLIC_KEY = \"1.2.840.10045.2.1\"\nCURVE_OIDS = {\"1.2.840.10045.3.1.7\": \"P-256\", \"1.3.132.0.34\": \"P-384\"}\nCOMMON_NAME_OID = \"2.5.4.3\"\nBASIC_CONSTRAINTS_OID = \"2.5.29.19\"\nECDSA_SHA384_OID = \"1.2.840.10045.4.3.3\"\n\n\n# ---- Reading one field at a time (each takes the relevant DER node) --------------------------\n\ndef read_name_cn(name_node: der.Node):\n    \"\"\"Name ::= SEQUENCE OF RelativeDistinguishedName (SET OF {type, value}). Returns the\n    commonName attribute's value as text, or None if the name has no commonName.\"\"\"\n    for rdn in name_node.children:                 # RelativeDistinguishedName: SET OF ...\n        for atv in rdn.children:                    # AttributeTypeAndValue: SEQUENCE { type, value }\n            attr_type, value = atv.children\n            if der.decode_oid(attr_type.content) == COMMON_NAME_OID:\n                return value.content.decode(\"utf-8\")\n    return None\n\n\ndef read_validity(validity_node: der.Node):\n    \"\"\"Validity ::= SEQUENCE { notBefore Time, notAfter Time }. Time is UTCTime or\n    GeneralizedTime; both are printed here exactly as they appear (this isn't a date checkpoint).\"\"\"\n    not_before, not_after = validity_node.children\n    return not_before.content.decode(\"ascii\"), not_after.content.decode(\"ascii\")\n\n\ndef read_spki(spki_node: der.Node):\n    \"\"\"SubjectPublicKeyInfo ::= SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT\n    STRING }. Returns (curve name, x, y) for an uncompressed EC point (0x04 || x || y).\"\"\"\n    algorithm, public_key_bits = spki_node.children\n    alg_oid_node, curve_oid_node = algorithm.children\n    if der.decode_oid(alg_oid_node.content) != ID_EC_PUBLIC_KEY:\n        raise ValueError(\"subjectPublicKeyInfo algorithm is not id-ecPublicKey\")\n    curve_oid = der.decode_oid(curve_oid_node.content)\n    if curve_oid not in CURVE_OIDS:\n        raise ValueError(f\"unrecognised curve OID {curve_oid}\")\n    curve = CURVE_OIDS[curve_oid]\n    _unused, point = der.decode_bit_string(public_key_bits.content)\n    if not point or point[0] != 0x04:\n        raise ValueError(\"expected an uncompressed EC point (0x04 || x || y)\")\n    coord_len = (len(point) - 1) // 2\n    x = int.from_bytes(point[1:1 + coord_len], \"big\")\n    y = int.from_bytes(point[1 + coord_len:], \"big\")\n    return curve, x, y\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"The raw subjectPublicKeyInfo node of a certificate, untouched (checkpoint 07 hashes its\n    exact original bytes - the whole nested SEQUENCE, not just the key bytes inside it).\"\"\"\n    top = der.parse_all(cert_bytes)\n    tbs = top[0].children[0]\n    children = tbs.children\n    i = 1 if children and children[0].cls == \"context\" and children[0].tag == 0 else 0\n    return children[i + 5]  # serialNumber, signature, issuer, validity, subject, then spki\n\n\ndef read_basic_constraints(extensions_wrapper: der.Node):\n    \"\"\"extensions_wrapper is the [3] EXPLICIT context node wrapping `Extensions ::= SEQUENCE OF\n    Extension`. Returns (ca, pathlen). Extension ::= SEQUENCE { extnID, critical BOOLEAN DEFAULT\n    FALSE OPTIONAL, extnValue OCTET STRING }, so extnValue is always the extension's last field.\"\"\"\n    extensions_seq = extensions_wrapper.children[0]\n    for extension in extensions_seq.children:\n        extn_id = der.decode_oid(extension.children[0].content)\n        if extn_id != BASIC_CONSTRAINTS_OID:\n            continue\n        extn_value = extension.children[-1]          # OCTET STRING: itself DER-encoded again\n        bc_seq = der.parse_all(extn_value.content)[0]  # BasicConstraints ::= SEQUENCE { cA, pathLen }\n        ca, idx = False, 0\n        if bc_seq.children and bc_seq.children[0].tag == der.BOOLEAN:\n            ca = bc_seq.children[0].content[0] != 0\n            idx = 1\n        pathlen = der.decode_integer(bc_seq.children[idx].content) if len(bc_seq.children) > idx else None\n        return ca, pathlen\n    return False, None  # BasicConstraints absent: RFC 5280 4.2.1.9 default is \"not a CA\"\n\n\n# ---- A whole certificate -----------------------------------------------------------------\n\n@dataclass\nclass Certificate:\n    tbs_bytes: bytes          # the exact original bytes of tbsCertificate, for re-hashing\n    serial: int\n    issuer_cn: str\n    subject_cn: str\n    not_before: str\n    not_after: str\n    curve: str\n    pubx: int\n    puby: int\n    ca: bool\n    pathlen: object           # int, or None if there is no path length constraint\n    sig_alg_oid: str\n    sig_r: int\n    sig_s: int\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Certificate ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }.\"\"\"\n    top = der.parse_all(cert_bytes)\n    if len(top) != 1 or top[0].tag != der.SEQUENCE or not top[0].constructed:\n        raise ValueError(\"a certificate is exactly one top-level SEQUENCE\")\n    cert = top[0]\n    if len(cert.children) != 3:\n        raise ValueError(\"a Certificate has exactly 3 fields: tbsCertificate, \"\n                          \"signatureAlgorithm, signatureValue\")\n    tbs_node, sig_alg_node, sig_value_node = cert.children\n    tbs_bytes = cert_bytes[tbs_node.start: tbs_node.start + tbs_node.total_len]\n\n    children = tbs_node.children\n    i = 0\n    if children and children[i].cls == \"context\" and children[i].tag == 0:\n        i += 1  # version [0] EXPLICIT INTEGER; every certificate here is v3, so its value is fixed\n    serial = der.decode_integer(children[i].content); i += 1\n    i += 1  # signature: AlgorithmIdentifier, repeating the outer signatureAlgorithm; not needed again\n    issuer_cn = read_name_cn(children[i]); i += 1\n    not_before, not_after = read_validity(children[i]); i += 1\n    subject_cn = read_name_cn(children[i]); i += 1\n    curve, pubx, puby = read_spki(children[i]); i += 1\n    ca, pathlen = False, None\n    if i < len(children) and children[i].cls == \"context\" and children[i].tag == 3:\n        ca, pathlen = read_basic_constraints(children[i])\n\n    sig_alg_oid = der.decode_oid(sig_alg_node.children[0].content)\n    _unused, sig_der_bytes = der.decode_bit_string(sig_value_node.content)\n    sig_seq = der.parse_all(sig_der_bytes)[0]          # ECDSA-Sig-Value ::= SEQUENCE { r, s }\n    sig_r = der.decode_integer(sig_seq.children[0].content)\n    sig_s = der.decode_integer(sig_seq.children[1].content)\n\n    return Certificate(tbs_bytes, serial, issuer_cn, subject_cn, not_before, not_after,\n                        curve, pubx, puby, ca, pathlen, sig_alg_oid, sig_r, sig_s)\n\n\n# ---- Elliptic-curve point arithmetic and ECDSA verification (hand modular arithmetic) --------\n\ndef point_add(p: int, a: int, point, other):\n    \"\"\"Affine point addition on y^2 = x^3 + a*x + b (mod p). Either point may be None (the\n    point at infinity, the addition identity).\"\"\"\n    if point is None:\n        return other\n    if other is None:\n        return point\n    x1, y1 = point\n    x2, y2 = other\n    if x1 == x2:\n        if (y1 + y2) % p == 0:\n            return None  # point and its negation: the sum is the point at infinity\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # tangent slope (doubling)\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p          # chord slope\n    x3 = (slope * slope - x1 - x2) % p\n    y3 = (slope * (x1 - x3) - y1) % p\n    return x3, y3\n\n\ndef scalar_mult(p: int, a: int, n: int, k: int, point):\n    \"\"\"k * point, by double-and-add. point may be None (gives None back).\"\"\"\n    k %= n\n    if k == 0 or point is None:\n        return None\n    result = None\n    addend = point\n    while k:\n        if k & 1:\n            result = point_add(p, a, result, addend)\n        addend = point_add(p, a, addend, addend)\n        k >>= 1\n    return result\n\n\ndef verify_ecdsa_sha384(curve_name: str, pubx: int, puby: int, message: bytes, r: int, s: int) -> bool:\n    \"\"\"Checks an ECDSA signature (r, s) over SHA-384(message) against public key (pubx, puby).\n    This workbook's incident uses P-384 keys with ecdsa-with-SHA384 throughout, so the hash is\n    fixed here; a P-256 certificate would use SHA-256 instead (out of scope for this checkpoint).\"\"\"\n    c = CURVES[curve_name]\n    p, a, n, gx, gy = c[\"p\"], c[\"p\"] - 3, c[\"n\"], c[\"gx\"], c[\"gy\"]\n    if not (1 <= r < n and 1 <= s < n):\n        return False\n    digest = hashlib.sha384(message).digest()\n    z = int.from_bytes(digest, \"big\")\n    n_bits = n.bit_length()\n    if 8 * len(digest) > n_bits:\n        z >>= 8 * len(digest) - n_bits\n    w = pow(s, -1, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    point = point_add(p, a, scalar_mult(p, a, n, u1, (gx, gy)), scalar_mult(p, a, n, u2, (pubx, puby)))\n    if point is None:\n        return False\n    x, _y = point\n    return x % n == r\n"}],"proof":{"passed":6,"total":6,"date":"2026-10-21"},"uses":[]},"read":"<p>Read Google's security blog post, <a href=\"https://security.googleblog.com/\" target=\"_blank\" rel=\"noopener\">\"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates\"<\/a>, for how Chrome blocked the compromised intermediates: not by their serial number or their exact bytes, but by the SHA-256 hash of their SubjectPublicKeyInfo, pushed to every Chrome install through CRLSet. This page is complete on its own; the post explains why this mechanism exists, not how to compute the hash - that's this checkpoint.<\/p>","context":"<p>Checkpoint 06 taught you to find a certificate's subjectPublicKeyInfo field. This checkpoint hashes it, the exact mechanism that let Chrome block the compromised eMudhra intermediates by their key, even across reissuance. Checkpoint 13 later uses the same idea to check a new key against a blocklist before it's ever published.<\/p>","sources":"<ul><li>Google Security Blog, \"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates\"<\/li><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, section 4.1.2.7 (SubjectPublicKeyInfo)<\/li><\/ul>","checking":"<pre><code>./check.sh 07                                 run every test\n./check.sh 07 -Case 07-R3-same-key-reissued   one test, showing its full input, expected output and your output\n./check.sh 07 -Fresh                          a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 07 -Dispute &lt;id&gt; &quot;why&quot;             set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Two different certificates ... share the same public key hash t...    0 / 2   FAILED\n      x 07-R3-same-key-reissued  two certificates with different subject names and different validity periods, same public key\n          spki[1]: expected (hash=119d012a158acc40f0a6790aa182b23f5cdb5e6be3ce0773cf69d3486b7b18e7), got (hash=&lt;a different hash&gt;) - differs in hash\n          likely cause: R3 - Two different certificates (different subject, different validity) that share the same public key hash the same - the hash survives reissuance\n          expected values from: openssl x509 -pubkey | openssl pkey -pubin -outform DER | openssl dgst -sha256 (three independent OpenSSL commands)\n          reproduce: python3 -P tools/run_py.py solutions 07 build/cases/07/07-R3-same-key-reissued.in build/cases/07/07-R3-same-key-reissued.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>You already know how to find <code>subjectPublicKeyInfo<\/code> from checkpoint 06 - it's a fixed-position child of <code>tbsCertificate<\/code>. This checkpoint doesn't need any of the other fields, just that one node's exact original bytes.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Once you have the node, slice <code>cert_bytes<\/code> from its first header byte through its last content byte (tag + length + content, all of it) and hash that slice directly. Don't re-encode the SEQUENCE yourself - DER is canonical, so the bytes you sliced are already exactly what gets hashed.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Hash the whole SEQUENCE (tag, length, and content), not just the BIT STRING inside it, and not just the raw key bytes inside the BIT STRING.<\/li><li>Don't drop the BIT STRING's unused-bits byte when slicing - you're not decoding this field at all for this checkpoint, just hashing its exact bytes untouched.<\/li><li>Print lowercase hex. The checker compares text exactly.<\/li><li>Two certificates sharing a key should give identical output. If your test of that fails, you're probably including something cert-specific (the serial number, the validity dates) in what you hash.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>spki_hash(cert_bytes):\n    cert = parse_top_level_sequence(cert_bytes)\n    tbs = cert.children[0]\n    spki_node = find_subject_public_key_info(tbs)   # as in checkpoint 06\n    raw = cert_bytes[spki_node.start : spki_node.start + spki_node.total_len]\n    return sha256(raw) as lowercase hex<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"three different certificates, three different hashes","test":"07-R1-p256-several","input":"cert c0 308201163081bda003020102020101300a06082a8648ce3d04030230153113301106035504030c0a53706b692d3235362d30301e170d3235303130313030303030305a170d3236303130313030303030305a30153113301106035504030c0a53706b692d3235362d303059301306072a8648ce3d020106082a8648ce3d03010703420004ced431f7289c6d75c5623eb85b4275dd362b23203dd10bcc6b9946311d4dcb1e1afa1d9d441a621c540410022bbd4e8fff9941f6ffcd8695c680283f33f537ff300a06082a8648ce3d04030203480030450220273de61de73efd9c3d9355e45a03703e8340ab82a7975a931505e57e65c17810022100997017fe6bf998e05cf7b7811d8e05ee9e001895df0d592efde8b973082fbd3f\ncert c1 308201153081bda003020102020102300a06082a8648ce3d04030230153113301106035504030c0a53706b692d3235362d31301e170d3235303130313030303030305a170d3236303130313030303030305a30153113301106035504030c0a53706b692d3235362d313059301306072a8648ce3d020106082a8648ce3d03010703420004bd5bf4e49987117744158d14f97ae8a2887779289bdfad1dadc43b7f7dbb6120d3dab6a986aba4607e28b3d127831864f45dfc082019d728c8a0311d0d4ecd64300a06082a8648ce3d040302034700304402206e0cd6d3966c5abb6ad3c6804c289af52598ee8d175d4414bb99520987802f270220274e06ef0ff0de69071809c586cd80cf3667b78c1c8ca0383d0dd4b5471b5676\ncert c2 308201153081bda003020102020103300a06082a8648ce3d04030230153113301106035504030c0a53706b692d3235362d32301e170d3235303130313030303030305a170d3236303130313030303030305a30153113301106035504030c0a53706b692d3235362d323059301306072a8648ce3d020106082a8648ce3d03010703420004c8e2bbb166515fa4870b60d4c7a10a7a44dba14d391b835d892177b0ccd01c47f96073cc78e247fd7e5cc136d05a6720bb91b7c2a1da0aba4a6c60fb1145bede300a06082a8648ce3d04030203470030440220655d837d396c54c476aff98686a235cf7aff790ede30b515229c25bf2dae0248022028c6e4a5ade40f47cc8f3f6a484c345fa46e3a0af3a058de0beef268e12a35f4","output":"spki c0 aa07b611245aa91ac5e6ffbb5a5bd5f0c31fa21edfca50e09ccc447571370938\nspki c1 5227c43bfb92248caa17da1360257dc01fc0d2df24772b73368ba4851d4edf67\nspki c2 06501fbecdfc4a2d42b5c156b9dbee39bb4fec752df7ecbb3d4bef94360430ef","image":null,"explain":"<p>Three unrelated keys, three different hashes.<\/p>"},{"label":"Example 2","name":"reissued key, same hash","test":"07-R3-same-key-reissued","input":"cert original 308201563081dca003020102020101300a06082a8648ce3d04030330163114301206035504030c0b52656973737565642d5631301e170d3234303130313030303030305a170d3235303130313030303030305a30163114301206035504030c0b52656973737565642d56313076301006072a8648ce3d020106052b8104002203620004dbe011d744b5f545db67dee9d9007aaed7fcb936d1d03d3b74fb7437fe188bb5df65ebe2c39c7e1a177d2a787c0d035ed89d25f8a63076bfa1d89a658ea6727885bbb6574d3c3ee1b2dae545d4e0d83c2ed2162467d33ea1b98596cf49ce4ad6300a06082a8648ce3d0403030369003066023100cd3dca49a78349954c04d3278d9e438cfc92f55a2bd56941c5265d30cbb663f928feec453d09dad12f9bf82c363231ec023100f780c528a0955ad8a6a02f703cc8bda8c620b827a68434027373c5df7c12edb048f047a680c2ae497d5974526913964e\ncert reissued 308201733081faa003020102020102300a06082a8648ce3d04030330253123302106035504030c1a52656973737565642d56322d446966666572656e742d4e616d65301e170d3235303630313030303030305a170d3236303630313030303030305a30253123302106035504030c1a52656973737565642d56322d446966666572656e742d4e616d653076301006072a8648ce3d020106052b8104002203620004dbe011d744b5f545db67dee9d9007aaed7fcb936d1d03d3b74fb7437fe188bb5df65ebe2c39c7e1a177d2a787c0d035ed89d25f8a63076bfa1d89a658ea6727885bbb6574d3c3ee1b2dae545d4e0d83c2ed2162467d33ea1b98596cf49ce4ad6300a06082a8648ce3d0403030368003065023100d494b78182205bd3f8a4fdc29bffd4b02806381182da7d46090ef63428fb9f13869f7c57112464b4114a4e1f63a465a70230071472b150800adf9f3085fa4e6f8a43b01d41984b9a393dbe86dc12695bd43fc8929e02b0f6a090440d9adda72c5c59","output":"spki original 119d012a158acc40f0a6790aa182b23f5cdb5e6be3ce0773cf69d3486b7b18e7\nspki reissued 119d012a158acc40f0a6790aa182b23f5cdb5e6be3ce0773cf69d3486b7b18e7","image":null,"explain":"<p><code>original<\/code> and <code>reissued<\/code> have different subject names, different serial numbers and different validity windows - but the same key, so the same SPKI hash. A certificate authority reissuing a certificate for the same key (or an attacker who reuses a compromised key across several mis-issued certificates) can't escape this by changing anything else.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>Google's post describes the outcome (blocking by SPKI hash via CRLSet) without publishing code for computing one. The reference solution is in <code>_spoilers/reference/<\/code>: it reuses <code>common/certlib.py<\/code>'s <code>find_spki<\/code> (the same field-finding logic as checkpoint 06) and hashes the slice directly with <code>hashlib.sha256<\/code>.<\/p>\n<p><strong>Something to look for:<\/strong> the reference finds the SPKI node by the same fixed-position walk checkpoint 06 uses. A different, equally valid approach is to look for a SEQUENCE shaped like SubjectPublicKeyInfo (a SEQUENCE followed by a BIT STRING) among <code>tbsCertificate<\/code>'s children, without counting positions at all - both find the same bytes.<\/p>"}},{"id":"08","num":"8","title":"Check a certificate's signature","difficulty":"Hard","tests":10,"solution":"solutions/p08_certificate_signature.py","problem":"problems/08-certificate-signature.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 08 - Check a certificate's signature\n#\n# Problem:  problems/08-certificate-signature.md (also in the web problem book)\n# Check:    ./check.sh 08\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 08 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p08_certificate_signature.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 08 - Check a certificate's signature\n#\n# Problem:  problems/08-certificate-signature.md (also in the web problem book)\n# Check:    ./check.sh 08\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on check_signature().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\n\ndef check_signature(cert_bytes: bytes, curve: str, issuer_x: int, issuer_y: int) -> bool:\n    \"\"\"True if cert_bytes was really signed by the private key matching (issuer_x, issuer_y)\n    on `curve`. See the problem page for how to re-extract tbsCertificate's exact original\n    bytes and for the ECDSA verification equation (P-384 with SHA-384, as in checkpoint 04).\"\"\"\n    # TODO: find tbsCertificate's original bytes, the signatureValue's (r, s), hash the former\n    # with SHA-384, and check it against (issuer_x, issuer_y) with the ECDSA verify equation.\n    raise NotImplementedError(\"check_signature\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    pending_cert = None  # (label, cert_bytes), waiting for its issuer_pubkey line\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"cert\":  # cert <label> <hex>: the certificate to check\n                pending_cert = (words[1], bytes.fromhex(words[2]))\n            elif words[0] == \"issuer_pubkey\":  # issuer_pubkey <label> <curve> <x> <y>\n                label, curve, x, y = words[1], words[2], int(words[3], 16), int(words[4], 16)\n                assert pending_cert and pending_cert[0] == label, \"issuer_pubkey must follow the cert with the same label\"\n                valid = check_signature(pending_cert[1], curve, x, y)\n                lines.append(f\"signature {label} {'valid' if valid else 'invalid'}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["byte slicing","big integers","modular arithmetic"],"text":["byte slicing","big integers","modular arithmetic"]},{"label":"Library","items":["a SHA-384 implementation"],"text":["a SHA-384 implementation"]},{"label":"Concepts","items":["tbsCertificate","ECDSA verification","DER's canonical encoding"],"text":["tbsCertificate","ECDSA verification","DER's canonical encoding"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that checks, for each certificate it's given, whether it was really signed by a specific alleged issuer's public key.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p08_certificate_signature.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p08_certificate_signature.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>check_signature()<\/code>.<\/p>\n<h3>What actually gets signed<\/h3>\n<p>A certificate's <code>signatureValue<\/code> is a signature over <code>tbsCertificate<\/code>'s <strong>exact original DER bytes<\/strong> - not a re-encoding of its fields, not a recomputed version of the same structure. DER is supposed to be canonical (one value, one encoding), so re-encoding tbsCertificate yourself <em>should<\/em> give the same bytes back - but it's an easy way to introduce a subtle bug (get a length byte's short/long form wrong, for instance) and sign or verify against bytes that are not quite the ones that were actually used. The safe approach, and the one this checkpoint asks for: slice the exact bytes out of the original certificate (its first header byte through its last content byte, tag and length included) and hash <strong>that<\/strong>.<\/p>\n<h3>The equation<\/h3>\n<ol><li>Find <code>tbsCertificate<\/code>'s exact original bytes (as above) and hash them with <strong>SHA-384<\/strong> (this checkpoint only covers P-384 certificates, signed <code>ecdsa-with-SHA384<\/code>; a P-256 certificate would use SHA-256 instead - out of scope here, see Constraints).<\/li><li><code>signatureValue<\/code> is a BIT STRING whose content (after the unused-bits byte, always <code>0<\/code> here) is itself DER: <code>SEQUENCE { r INTEGER, s INTEGER }<\/code>. Parse that inner structure the way checkpoint 05 parses anything, to get <code>r<\/code> and <code>s<\/code>.<\/li><li>Check <code>(r, s)<\/code> against the hash and the alleged issuer's public key <code>(x, y)<\/code>, using the same ECDSA verification equation as checkpoint 04:<\/li><\/ol>\n<pre><code>z  = the hash, as a big integer\nw  = s^-1 mod n\nu1 = z * w mod n\nu2 = r * w mod n\n(x3, y3) = u1*G + u2*Q          (Q = the issuer&#x27;s public key point)\nvalid if x3 mod n == r<\/code><\/pre>\n<p><code>n<\/code> is the curve's order (its number of points), from the table below. <code>u1*G<\/code> and <code>u2*Q<\/code> are each a full scalar multiplication (repeated point addition, as in checkpoint 03), and the two results are added together with one more point addition. Use the point add/doubling formulas from checkpoints 2 and 3's pages (the same style as checkpoint 10's reference uses) - don't reach for a cryptography library's own verify function; implementing the equation yourself is the point of this checkpoint.<\/p>\n<h3>The curve<\/h3>\n<p>P-384 only, for this checkpoint:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>P-384<\/th><\/tr><\/thead><tbody><tr><td><code>p<\/code><\/td><td><code>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff<\/code><\/td><\/tr><tr><td><code>a<\/code><\/td><td><code>p - 3<\/code><\/td><\/tr><tr><td><code>Gx<\/code><\/td><td><code>aa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7<\/code><\/td><\/tr><tr><td><code>Gy<\/code><\/td><td><code>3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f<\/code><\/td><\/tr><tr><td><code>n<\/code><\/td><td><code>ffffffffffffffffffffffffffffffffffffffffffffffffc7634d81f4372ddf581a0db248b0a77aecec196accc52973<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains pairs of lines, each pair describing one check:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>cert &lt;label&gt; &lt;hex&gt;<\/code><\/td><td>The certificate to check.<\/td><\/tr><tr><td><code>issuer_pubkey &lt;label&gt; &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>Immediately follows the <code>cert<\/code> line with the same <code>label<\/code>. The alleged issuer's public key: <code>curve<\/code> is <code>P-384<\/code> in every test here, <code>x<\/code> and <code>y<\/code> are hexadecimal.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each pair, in input order, write one line:<\/p>\n<pre><code>signature &lt;label&gt; valid\nsignature &lt;label&gt; invalid<\/code><\/pre>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A genuinely self-signed certificate (the issuer's key is the same key that signed it), verified against its own public key, is <code>valid<\/code>.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A certificate verified against the wrong issuer key is <code>invalid<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A certificate whose signature bytes have been tampered with - one flipped bit, anywhere in <code>r<\/code> or <code>s<\/code> - is <code>invalid<\/code>, even though every other byte of the certificate (including the issuer's real key) is untouched.<\/span><\/li><li><span class=\"rid\">R4<\/span><span><code>tbsCertificate<\/code>'s bytes are re-extracted correctly even when the certificate carries real v3 extensions, which make the structure large enough that its own length needs the DER long form - not just a toy 3-field structure.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate here is P-384, signed <code>ecdsa-with-SHA384<\/code>. A P-256 certificate would need SHA-256 instead (per RFC 5280's algorithm pairing) - out of scope for this checkpoint, which mirrors the real eMudhra incident's P-384 keys specifically.<\/li><li><code>issuer_pubkey<\/code> always immediately follows the <code>cert<\/code> line it belongs to, sharing the same label.<\/li><li>There are 10 tests: 3 for R1, 2 for R2, 2 for R3, 2 for R4, and one end-to-end case mixing valid, wrong-key and tampered signatures in a single input. Part of the set is random (fresh keys each run) and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p08_certificate_signature.py","text":"# Reference solution - checkpoint 08 (Check a certificate's signature). SPOILERS: try it\n# yourself first.\n#\n# Re-extracts the exact original bytes of tbsCertificate (not a re-encoding of its fields -\n# DER is canonical, but reconstructing it yourself is an easy way to get subtly different bytes\n# than the ones that were actually signed), hashes them with SHA-384, and checks the signature's\n# (r, s) against the alleged issuer's public key with the same modular-arithmetic ECDSA\n# verification equation as checkpoint 04, reused here as common/certlib.py's\n# verify_ecdsa_sha384 (this checkpoint's own self-contained copy of that logic).\n\nimport sys\n\nfrom common.certlib import parse_certificate, verify_ecdsa_sha384\n\n\ndef check_signature(cert_bytes: bytes, curve: str, issuer_x: int, issuer_y: int) -> bool:\n    cert = parse_certificate(cert_bytes)\n    return verify_ecdsa_sha384(curve, issuer_x, issuer_y, cert.tbs_bytes, cert.sig_r, cert.sig_s)\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    pending_cert = None  # (label, cert_bytes), waiting for its issuer_pubkey line\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"cert\":  # cert <label> <hex>\n                pending_cert = (words[1], bytes.fromhex(words[2]))\n            elif words[0] == \"issuer_pubkey\":  # issuer_pubkey <label> <curve> <x> <y>\n                label, curve, x, y = words[1], words[2], int(words[3], 16), int(words[4], 16)\n                assert pending_cert and pending_cert[0] == label, \"issuer_pubkey must follow the cert with the same label\"\n                valid = check_signature(pending_cert[1], curve, x, y)\n                lines.append(f\"signature {label} {'valid' if valid else 'invalid'}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"},{"path":"common/certlib.py","text":"\"\"\"Hand-written X.509 certificate reading and ECDSA verification, built on common/der.py.\nShared by the reference solutions for checkpoints 06-09. SPOILERS: try the checkpoints yourself\nfirst.\n\nNo `cryptography.x509` parsing and no library ECDSA verification here: every field is read with\ncommon/der.py's TLV walker, and signatures are checked with plain modular arithmetic (the same\npoint-addition formulas checkpoint 10 uses, run the other direction: multiply instead of search).\nThe curve constants (p, n, Gx, Gy) are reused from tools/curves.py rather than retyped.\n\"\"\"\n\nimport hashlib\nimport sys\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom . import der\n\n# tools/curves.py holds the OpenSSL-verified curve constants; reuse its numbers instead of\n# retyping them (the generators already prove them correct via curves.verify()).\n_ROOT = Path(__file__).resolve().parents[3]\nsys.path.insert(0, str(_ROOT / \"tools\"))\nimport curves as _curves  # noqa: E402\n\nCURVES = {name: {\"p\": c[\"p\"], \"n\": c[\"n\"], \"gx\": c[\"gx\"], \"gy\": c[\"gy\"]} for name, c in _curves.CURVES.items()}\n\nID_EC_PUBLIC_KEY = \"1.2.840.10045.2.1\"\nCURVE_OIDS = {\"1.2.840.10045.3.1.7\": \"P-256\", \"1.3.132.0.34\": \"P-384\"}\nCOMMON_NAME_OID = \"2.5.4.3\"\nBASIC_CONSTRAINTS_OID = \"2.5.29.19\"\nECDSA_SHA384_OID = \"1.2.840.10045.4.3.3\"\n\n\n# ---- Reading one field at a time (each takes the relevant DER node) --------------------------\n\ndef read_name_cn(name_node: der.Node):\n    \"\"\"Name ::= SEQUENCE OF RelativeDistinguishedName (SET OF {type, value}). Returns the\n    commonName attribute's value as text, or None if the name has no commonName.\"\"\"\n    for rdn in name_node.children:                 # RelativeDistinguishedName: SET OF ...\n        for atv in rdn.children:                    # AttributeTypeAndValue: SEQUENCE { type, value }\n            attr_type, value = atv.children\n            if der.decode_oid(attr_type.content) == COMMON_NAME_OID:\n                return value.content.decode(\"utf-8\")\n    return None\n\n\ndef read_validity(validity_node: der.Node):\n    \"\"\"Validity ::= SEQUENCE { notBefore Time, notAfter Time }. Time is UTCTime or\n    GeneralizedTime; both are printed here exactly as they appear (this isn't a date checkpoint).\"\"\"\n    not_before, not_after = validity_node.children\n    return not_before.content.decode(\"ascii\"), not_after.content.decode(\"ascii\")\n\n\ndef read_spki(spki_node: der.Node):\n    \"\"\"SubjectPublicKeyInfo ::= SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT\n    STRING }. Returns (curve name, x, y) for an uncompressed EC point (0x04 || x || y).\"\"\"\n    algorithm, public_key_bits = spki_node.children\n    alg_oid_node, curve_oid_node = algorithm.children\n    if der.decode_oid(alg_oid_node.content) != ID_EC_PUBLIC_KEY:\n        raise ValueError(\"subjectPublicKeyInfo algorithm is not id-ecPublicKey\")\n    curve_oid = der.decode_oid(curve_oid_node.content)\n    if curve_oid not in CURVE_OIDS:\n        raise ValueError(f\"unrecognised curve OID {curve_oid}\")\n    curve = CURVE_OIDS[curve_oid]\n    _unused, point = der.decode_bit_string(public_key_bits.content)\n    if not point or point[0] != 0x04:\n        raise ValueError(\"expected an uncompressed EC point (0x04 || x || y)\")\n    coord_len = (len(point) - 1) // 2\n    x = int.from_bytes(point[1:1 + coord_len], \"big\")\n    y = int.from_bytes(point[1 + coord_len:], \"big\")\n    return curve, x, y\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"The raw subjectPublicKeyInfo node of a certificate, untouched (checkpoint 07 hashes its\n    exact original bytes - the whole nested SEQUENCE, not just the key bytes inside it).\"\"\"\n    top = der.parse_all(cert_bytes)\n    tbs = top[0].children[0]\n    children = tbs.children\n    i = 1 if children and children[0].cls == \"context\" and children[0].tag == 0 else 0\n    return children[i + 5]  # serialNumber, signature, issuer, validity, subject, then spki\n\n\ndef read_basic_constraints(extensions_wrapper: der.Node):\n    \"\"\"extensions_wrapper is the [3] EXPLICIT context node wrapping `Extensions ::= SEQUENCE OF\n    Extension`. Returns (ca, pathlen). Extension ::= SEQUENCE { extnID, critical BOOLEAN DEFAULT\n    FALSE OPTIONAL, extnValue OCTET STRING }, so extnValue is always the extension's last field.\"\"\"\n    extensions_seq = extensions_wrapper.children[0]\n    for extension in extensions_seq.children:\n        extn_id = der.decode_oid(extension.children[0].content)\n        if extn_id != BASIC_CONSTRAINTS_OID:\n            continue\n        extn_value = extension.children[-1]          # OCTET STRING: itself DER-encoded again\n        bc_seq = der.parse_all(extn_value.content)[0]  # BasicConstraints ::= SEQUENCE { cA, pathLen }\n        ca, idx = False, 0\n        if bc_seq.children and bc_seq.children[0].tag == der.BOOLEAN:\n            ca = bc_seq.children[0].content[0] != 0\n            idx = 1\n        pathlen = der.decode_integer(bc_seq.children[idx].content) if len(bc_seq.children) > idx else None\n        return ca, pathlen\n    return False, None  # BasicConstraints absent: RFC 5280 4.2.1.9 default is \"not a CA\"\n\n\n# ---- A whole certificate -----------------------------------------------------------------\n\n@dataclass\nclass Certificate:\n    tbs_bytes: bytes          # the exact original bytes of tbsCertificate, for re-hashing\n    serial: int\n    issuer_cn: str\n    subject_cn: str\n    not_before: str\n    not_after: str\n    curve: str\n    pubx: int\n    puby: int\n    ca: bool\n    pathlen: object           # int, or None if there is no path length constraint\n    sig_alg_oid: str\n    sig_r: int\n    sig_s: int\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Certificate ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }.\"\"\"\n    top = der.parse_all(cert_bytes)\n    if len(top) != 1 or top[0].tag != der.SEQUENCE or not top[0].constructed:\n        raise ValueError(\"a certificate is exactly one top-level SEQUENCE\")\n    cert = top[0]\n    if len(cert.children) != 3:\n        raise ValueError(\"a Certificate has exactly 3 fields: tbsCertificate, \"\n                          \"signatureAlgorithm, signatureValue\")\n    tbs_node, sig_alg_node, sig_value_node = cert.children\n    tbs_bytes = cert_bytes[tbs_node.start: tbs_node.start + tbs_node.total_len]\n\n    children = tbs_node.children\n    i = 0\n    if children and children[i].cls == \"context\" and children[i].tag == 0:\n        i += 1  # version [0] EXPLICIT INTEGER; every certificate here is v3, so its value is fixed\n    serial = der.decode_integer(children[i].content); i += 1\n    i += 1  # signature: AlgorithmIdentifier, repeating the outer signatureAlgorithm; not needed again\n    issuer_cn = read_name_cn(children[i]); i += 1\n    not_before, not_after = read_validity(children[i]); i += 1\n    subject_cn = read_name_cn(children[i]); i += 1\n    curve, pubx, puby = read_spki(children[i]); i += 1\n    ca, pathlen = False, None\n    if i < len(children) and children[i].cls == \"context\" and children[i].tag == 3:\n        ca, pathlen = read_basic_constraints(children[i])\n\n    sig_alg_oid = der.decode_oid(sig_alg_node.children[0].content)\n    _unused, sig_der_bytes = der.decode_bit_string(sig_value_node.content)\n    sig_seq = der.parse_all(sig_der_bytes)[0]          # ECDSA-Sig-Value ::= SEQUENCE { r, s }\n    sig_r = der.decode_integer(sig_seq.children[0].content)\n    sig_s = der.decode_integer(sig_seq.children[1].content)\n\n    return Certificate(tbs_bytes, serial, issuer_cn, subject_cn, not_before, not_after,\n                        curve, pubx, puby, ca, pathlen, sig_alg_oid, sig_r, sig_s)\n\n\n# ---- Elliptic-curve point arithmetic and ECDSA verification (hand modular arithmetic) --------\n\ndef point_add(p: int, a: int, point, other):\n    \"\"\"Affine point addition on y^2 = x^3 + a*x + b (mod p). Either point may be None (the\n    point at infinity, the addition identity).\"\"\"\n    if point is None:\n        return other\n    if other is None:\n        return point\n    x1, y1 = point\n    x2, y2 = other\n    if x1 == x2:\n        if (y1 + y2) % p == 0:\n            return None  # point and its negation: the sum is the point at infinity\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # tangent slope (doubling)\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p          # chord slope\n    x3 = (slope * slope - x1 - x2) % p\n    y3 = (slope * (x1 - x3) - y1) % p\n    return x3, y3\n\n\ndef scalar_mult(p: int, a: int, n: int, k: int, point):\n    \"\"\"k * point, by double-and-add. point may be None (gives None back).\"\"\"\n    k %= n\n    if k == 0 or point is None:\n        return None\n    result = None\n    addend = point\n    while k:\n        if k & 1:\n            result = point_add(p, a, result, addend)\n        addend = point_add(p, a, addend, addend)\n        k >>= 1\n    return result\n\n\ndef verify_ecdsa_sha384(curve_name: str, pubx: int, puby: int, message: bytes, r: int, s: int) -> bool:\n    \"\"\"Checks an ECDSA signature (r, s) over SHA-384(message) against public key (pubx, puby).\n    This workbook's incident uses P-384 keys with ecdsa-with-SHA384 throughout, so the hash is\n    fixed here; a P-256 certificate would use SHA-256 instead (out of scope for this checkpoint).\"\"\"\n    c = CURVES[curve_name]\n    p, a, n, gx, gy = c[\"p\"], c[\"p\"] - 3, c[\"n\"], c[\"gx\"], c[\"gy\"]\n    if not (1 <= r < n and 1 <= s < n):\n        return False\n    digest = hashlib.sha384(message).digest()\n    z = int.from_bytes(digest, \"big\")\n    n_bits = n.bit_length()\n    if 8 * len(digest) > n_bits:\n        z >>= 8 * len(digest) - n_bits\n    w = pow(s, -1, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    point = point_add(p, a, scalar_mult(p, a, n, u1, (gx, gy)), scalar_mult(p, a, n, u2, (pubx, puby)))\n    if point is None:\n        return False\n    x, _y = point\n    return x % n == r\n"}],"proof":{"passed":10,"total":10,"date":"2026-10-21"},"uses":[]},"read":"<p>This checkpoint is prerequisite material, not drawn from eMudhra's post: it teaches the mechanism that connects an issuer's private key to a certificate it signed, which is what a revoked or distrusted intermediate's key compromise actually threatens. Read RFC 5280 section 4.1.1.3 (\"signatureValue\") and 4.1.2 (\"TBSCertificate\") for which bytes get signed and how the signature is stored. This page is complete on its own after that.<\/p>","context":"<p>Checkpoint 04 taught you to verify an ECDSA signature given a message, a signature and a public key. Checkpoint 06 taught you to read a certificate's fields. This checkpoint connects them: the \"message\" is a specific slice of the certificate itself, and checking it tells you whether a certificate was really signed by a given issuer - the question at the heart of checkpoint 09's chain validation, and the reason a compromised CA key is dangerous: anyone holding it can produce a signature that checks out here.<\/p>","sources":"<ul><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, sections 4.1.1.3 and 4.1.2<\/li><li>ITU-T X.690, section 8.1 (why re-encoding DER should be a no-op, and why slicing the original bytes sidesteps the risk of it not being one)<\/li><li>FIPS 186-5, <em>Digital Signature Standard (DSS)<\/em>, section 6.4.2 (the ECDSA verification equation)<\/li><\/ul>","checking":"<pre><code>./check.sh 08                                run every test\n./check.sh 08 -Case 08-R3-tampered-0         one test, showing its full input, expected output and your output\n./check.sh 08 -Fresh                         a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 08 -Dispute &lt;id&gt; &quot;why&quot;            set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  The TBS bytes are re-extracted correctly even when the certifica...    0 / 2   FAILED\n      x 08-R4-with-extensions  a self-signed CA certificate with a BasicConstraints extension present\n          line 1: expected `signature ext1 valid`, got `signature ext1 invalid`\n          likely cause: R4 - The TBS bytes are re-extracted correctly even when the certificate has v3 extensions (a non-trivial TBS structure)\n          expected values from: cryptography 41.0.7: public_key.verify(signature, tbs_bytes, ec.ECDSA(hashes.SHA384())), independent of this workbook&#x27;s modular-arithmetic reference\n          reproduce: python3 -P tools/run_py.py solutions 08 build/cases/08/08-R4-with-extensions.in build/cases/08/08-R4-with-extensions.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Everything you need to find is a fixed-position child of the certificate's top-level SEQUENCE: <code>tbsCertificate<\/code> is the first child, <code>signatureValue<\/code> is the third. You don't need to read any of <code>tbsCertificate<\/code>'s own fields this time - just its outer boundaries.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Parse the certificate as one top-level SEQUENCE. Its first child's node (not its content - the whole node, header included) gives you the exact bytes to hash: <code>data[node.start : node.start + node.total_len]<\/code>. Its third child is signatureValue; after stripping the unused-bits byte, parse that content as DER again to get <code>r<\/code> and <code>s<\/code>. Then it's exactly checkpoint 04's verification equation, with the hash of those sliced bytes as the message.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Hash the <em>bytes<\/em>, not a re-encoding of the fields. If your DER writer and reader don't round-trip identically (a length-form choice, most commonly), you'll hash the wrong thing and every real certificate will fail, not just the hand-crafted edge cases.<\/li><li><code>signatureValue<\/code> is a BIT STRING. Its first content byte is the unused-bits count (checkpoint 05), not part of the DER-encoded <code>(r, s)<\/code> SEQUENCE.<\/li><li><code>r<\/code> and <code>s<\/code> are each a full DER INTEGER - two's complement, possibly with a leading <code>0x00<\/code> pad byte (checkpoint 05's trap again).<\/li><li>SHA-384's digest is exactly as many bits as P-384's order <code>n<\/code>, so this checkpoint never needs to truncate the hash. That's not true of every curve/hash pairing in general, just this one.<\/li><li>A single flipped bit anywhere in <code>r<\/code> or <code>s<\/code> should invalidate the signature. If your verification only checks part of the value, or compares by length instead of by value, you can miss this.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>check_signature(cert_bytes, curve, issuer_x, issuer_y):\n    cert = parse_top_level_sequence(cert_bytes)\n    tbs_node = cert.children[0]\n    tbs_bytes = cert_bytes[tbs_node.start : tbs_node.start + tbs_node.total_len]\n\n    sig_bitstring = cert.children[2]\n    _unused, sig_der = split_bit_string(sig_bitstring.content)\n    sig_seq = parse_top_level_sequence(sig_der)\n    r = decode_integer(sig_seq.children[0])\n    s = decode_integer(sig_seq.children[1])\n\n    z = int(sha384(tbs_bytes))\n    w = modinv(s, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    (x3, y3) = add(scalar_mult(u1, G), scalar_mult(u2, (issuer_x, issuer_y)))\n    return (x3 % n) == r<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a valid self-signed certificate","test":"08-R1-self-signed-0","input":"cert s0 3082014c3081d2a003020102020101300a06082a8648ce3d0403033011310f300d06035504030c0653656c662d30301e170d3235303130313030303030305a170d3236303130313030303030305a3011310f300d06035504030c0653656c662d303076301006072a8648ce3d020106052b810400220362000413799bc39cebcabf392d24625ec169db4dc1d3aa4b413fb92fb3450ea24d9ace0432ae1f242748eb41fae6d6fc190625e915239da017393f8f433efd149645fa8ccd3a38f03645dcf76a908f1dca483a724091b507a040f592d569d6be4406f8300a06082a8648ce3d0403030369003066023100a524602bdb5b7950ac3920ae115ff2658d6e8e80feae9bb515a578f13402b4ff7343be542a7d4fef963c797150d33466023100ce248e60dccf8814ce38576a7d62dbcf3c0c62fa5f9f793f3328f6eb5bf40643000bd1398c2b4f49e590832474ae61bd\nissuer_pubkey s0 P-384 13799bc39cebcabf392d24625ec169db4dc1d3aa4b413fb92fb3450ea24d9ace0432ae1f242748eb41fae6d6fc190625 e915239da017393f8f433efd149645fa8ccd3a38f03645dcf76a908f1dca483a724091b507a040f592d569d6be4406f8","output":"signature s0 valid","image":null,"explain":"<p>The public key in <code>issuer_pubkey<\/code> is exactly the certificate's own subject key - checked here directly as input, not re-extracted from the certificate (checkpoint 06 already covers reading it out).<\/p>"},{"label":"Example 2","name":"one bit flipped in the signature","test":"08-R3-tampered-0","input":"cert t0 3082014e3081d6a003020102020114300a06082a8648ce3d04030330133111300f06035504030c0854616d7065722d30301e170d3235303130313030303030305a170d3236303130313030303030305a30133111300f06035504030c0854616d7065722d303076301006072a8648ce3d020106052b8104002203620004b7c32496319e08593b60245d1518bccd35f6236109df147af450aba3253237eeb9acedf9664944dcd9b1119a1cd6367532301c3af7cbdc8626374f8ece577d5d4067fbad012a61489fc14b73a8a9dd9365b1abedacd7daef7336b9e95a70b620300a06082a8648ce3d040303036700306402303503532ecae9d7ae31701e2665a92a062b581e1cfeb49f2b3bdcd94
