():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 05: Read DER\n# Problem: problems/05-der-reader.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 05 as `python -P tools/run_py.py\n#   solutions 05 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 05`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/asn1/der.py in this assignment; each one gives its job at\n#   the top.\n#   Import them as modules of your package, e.g. `from pkiaudit.asn1 import der`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 05 (DER reader): lists every TLV node of each `der` line of a test input.\n\nThe checker runs `assignment_05_der_reader.py <input-file> <output-file>`. The DER reader is\nsrc/pkiaudit/asn1/der.py; this program walks its tree and prints one line per node.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.asn1 import der\n\n\ndef format_value(node: der.Node) -> str:\n    \"\"\"Writes a node's value: `...` for a constructed node, else its decoded value or hex.\"\"\"\n    if node.constructed:\n        return \"...\"  # its children follow on their own lines\n    if node.cls == \"universal\":\n        if node.tag == der.BOOLEAN:\n            return \"true\" if node.content and node.content[0] != 0 else \"false\"\n        if node.tag == der.INTEGER:\n            return str(der.decode_integer(node.content))\n        if node.tag == der.NULL:\n            return \"null\"\n        if node.tag == der.OBJECT_IDENTIFIER:\n            return der.decode_oid(node.content)\n        if node.tag == der.BIT_STRING:\n            unused, bits = der.decode_bit_string(node.content)\n            return f\"{unused}:{bits.hex()}\"\n        if node.tag in (der.UTCTIME, der.GENERALIZEDTIME):\n            return node.content.decode(\"ascii\")\n    # OCTET STRING, strings and context-specific primitives print as hex, and an empty value as\n    # `-`, so every line has six fields.\n    return node.content.hex() or \"-\"\n\n\ndef der_lines(data: bytes) -> list[str]:\n    \"\"\"Writes one line per TLV node in `data`, depth first, in document order.\"\"\"\n    lines = []\n\n    def visit(node: der.Node) -> None:\n        kind = \"constructed\" if node.constructed else \"primitive\"\n        lines.append(f\"node {node.depth} {node.cls} {kind} {node.tag} {node.length} {format_value(node)}\")\n        for child in node.children:\n            visit(child)\n\n    for top in der.parse_all(data):\n        visit(top)\n    return lines\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes the node lines for each `der <hex>` line.\"\"\"\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if words and words[0] == \"der\":  # der <hex>: one or more DER values, concatenated\n                lines.extend(der_lines(bytes.fromhex(words[1])))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/asn1/der.py","role":"new","purpose":"This module reads DER, the tag-length-value encoding that holds every certificate in the project, into a tree of nodes, and decodes INTEGER, OBJECT IDENTIFIER and BIT STRING values. Your `x509/certificate.py` (assignment 06), `x509/spki.py` (07) and `x509/signature.py` (08) read certificates through it.","job":"Write a DER reader in `asn1/der.py` that turns bytes into a tree of tag-length-value nodes, each with its class, constructed bit, tag number, length, content bytes, children and depth. Read both length forms, and have each node record where it starts in the buffer and how many bytes it takes with its header, for assignments 07 and 08. Add decoders for INTEGER, OBJECT IDENTIFIER and BIT STRING content, as \"Decoding each type's content\" describes.","blank":"# ======================================================================================\n# Assignment 05: Read DER\n# Problem: problems/05-der-reader.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module reads DER, the tag-length-value encoding that holds every certificate in\n#   the project, into a tree of nodes, and decodes INTEGER, OBJECT IDENTIFIER and BIT\n#   STRING values. Your `x509/certificate.py` (assignment 06), `x509/spki.py` (07) and\n#   `x509/signature.py` (08) read certificates through it.\n#\n# Your job:\n#   Write a DER reader in `asn1/der.py` that turns bytes into a tree of tag-length-value\n#   nodes, each with its class, constructed bit, tag number, length, content bytes,\n#   children and depth. Read both length forms, and have each node record where it starts\n#   in the buffer and how many bytes it takes with its header, for assignments 07 and 08.\n#   Add decoders for INTEGER, OBJECT IDENTIFIER and BIT STRING content, as \"Decoding each\n#   type's content\" describes.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 05: Read DER\n# Problem: problems/05-der-reader.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module reads DER, the tag-length-value encoding that holds every certificate in\n#   the project, into a tree of nodes, and decodes INTEGER, OBJECT IDENTIFIER and BIT\n#   STRING values. Your `x509/certificate.py` (assignment 06), `x509/spki.py` (07) and\n#   `x509/signature.py` (08) read certificates through it.\n#\n# Your job:\n#   Write a DER reader in `asn1/der.py` that turns bytes into a tree of tag-length-value\n#   nodes, each with its class, constructed bit, tag number, length, content bytes,\n#   children and depth. Read both length forms, and have each node record where it starts\n#   in the buffer and how many bytes it takes with its header, for assignments 07 and 08.\n#   Add decoders for INTEGER, OBJECT IDENTIFIER and BIT STRING content, as \"Decoding each\n#   type's content\" describes. The Boilerplate gives you the declarations; fill in each\n#   TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"A reader for DER, the tag-length-value encoding certificates use (assignment 05).\n\nIt covers the part of ITU-T X.690 that X.509 certificates need: definite lengths and tag numbers\nbelow 31. `parse_all` turns bytes into a tree of `Node`s, and the decode functions read the\nvalues of the primitive types.\n\"\"\"\n\nfrom dataclasses import dataclass, field\n\nCLASS_NAMES = {0: \"universal\", 1: \"application\", 2: \"context\", 3: \"private\"}\n\n# Universal tag numbers (ITU-T X.690 section 8).\nBOOLEAN, INTEGER, BIT_STRING, OCTET_STRING, NULL, OBJECT_IDENTIFIER = 1, 2, 3, 4, 5, 6\nSEQUENCE, SET, UTCTIME, GENERALIZEDTIME = 16, 17, 23, 24\n\n\n@dataclass\nclass Node:\n    \"\"\"One TLV: its header fields, its content bytes and, if constructed, its children.\"\"\"\n\n    cls: str  # \"universal\", \"application\", \"context\" or \"private\"\n    constructed: bool\n    tag: int\n    length: int  # content length in bytes\n    content: bytes  # the content bytes, without the header\n    children: list[\"Node\"] = field(default_factory=list)\n    depth: int = 0  # 0 for a top-level node\n    start: int = 0  # offset of the first header byte in the buffer the parser read\n    total_len: int = 0  # header and content together\n\n    def encoding(self, data: bytes) -> bytes:\n        \"\"\"Returns this node's original bytes, header included, out of `data`, the buffer the parser read.\"\"\"\n        # Assignments 07 and 08 hash these bytes. Re-encoding the fields yourself can give\n        # different bytes from the ones the issuer signed.\n        return data[self.start:self.start + self.total_len]\n\n\ndef read_length(data: bytes, i: int) -> tuple[int, int]:\n    \"\"\"Reads the length field at data[i]; returns (length, index of the first content byte).\"\"\"\n    # TODO: the short form and the long form; see \"The length\" under \"The tag-length-value\n    # structure\" on the problem page.\n    raise NotImplementedError(\"read_length\")\n\n\ndef read_tlv(data: bytes, i: int, depth: int = 0) -> tuple[Node, int]:\n    \"\"\"Reads the TLV that starts at data[i]; returns (node, index of the byte after it).\"\"\"\n    # TODO: split the tag byte into class, constructed bit and tag number, read the length,\n    # then the content; a constructed node's content is more TLVs, one level deeper. See \"The\n    # tag-length-value structure\" on the problem page. Fill in `start` and `total_len` too:\n    # assignments 07 and 08 slice a node's original bytes out with `encoding`.\n    raise NotImplementedError(\"read_tlv\")\n\n\ndef parse_all(data: bytes) -> list[Node]:\n    \"\"\"Returns every top-level TLV in `data`, in order.\"\"\"\n    # TODO: read TLVs back to back until the bytes run out; see the `der` line under \"Input\" on\n    # the problem page.\n    raise NotImplementedError(\"parse_all\")\n\n\ndef decode_integer(content: bytes) -> int:\n    \"\"\"Reads INTEGER content bytes as a signed, big-endian, two's complement number.\"\"\"\n    # TODO: see \"INTEGER\" under \"Decoding each type's content\" on the problem page.\n    raise NotImplementedError(\"decode_integer\")\n\n\ndef decode_oid(content: bytes) -> str:\n    \"\"\"Reads OBJECT IDENTIFIER content bytes as dotted decimal, such as \"1.2.840.10045.2.1\".\"\"\"\n    # TODO: see \"OBJECT IDENTIFIER\" under \"Decoding each type's content\" on the problem page.\n    raise NotImplementedError(\"decode_oid\")\n\n\ndef decode_bit_string(content: bytes) -> tuple[int, bytes]:\n    \"\"\"Reads BIT STRING content bytes as (unused bits in the last byte, the bytes that hold the bits).\"\"\"\n    # TODO: see BIT STRING in the table under \"Decoding each type's content\" on the problem page.\n    raise NotImplementedError(\"decode_bit_string\")\n"}],"buildsOn":[],"indent":4,"tags":[{"label":"Language","items":["bit manipulation","hex strings","recursion"],"text":["bit manipulation","hex strings","recursion"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["ASN.1","DER (Distinguished Encoding Rules)","tag-length-value encoding"],"text":["ASN.1","DER (Distinguished Encoding Rules)","tag-length-value encoding"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads DER-encoded bytes and prints every tag-length-value (TLV) node in them, in the order each one starts, with its nesting depth, so that the output shows the shape of the encoding.<\/p>\n<h3>The tag-length-value structure<\/h3>\n<p>Every DER-encoded value is three parts, back to back:<\/p>\n<ul><li>a tag: what kind of value this is;<\/li><li>a length: how many bytes of content follow;<\/li><li>the content: the value itself or, for a constructed value, more complete TLV nodes.<\/li><\/ul>\n<p>The tag is the first byte. Its bits mean:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bits<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>8-7<\/td><td>tag class: <code>00<\/code> universal, <code>01<\/code> application, <code>10<\/code> context-specific, <code>11<\/code> private<\/td><\/tr><tr><td>6<\/td><td><code>0<\/code> primitive (the content is the value), <code>1<\/code> constructed (the content is more TLV nodes)<\/td><\/tr><tr><td>5-1<\/td><td>tag number<\/td><\/tr><\/tbody><\/table><\/div>\n<p>DER also has a multi-byte \"high tag number\" form for tag numbers 31 and above. No test uses it, so every tag in this assignment fits in one byte.<\/p>\n<p>Universal tags are ASN.1's built-in types: each number means the same type wherever it appears. You need these:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Tag number<\/th><th>Type<\/th><th>Form<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>BOOLEAN<\/td><td>primitive<\/td><\/tr><tr><td>2<\/td><td>INTEGER<\/td><td>primitive<\/td><\/tr><tr><td>3<\/td><td>BIT STRING<\/td><td>primitive (no test nests one)<\/td><\/tr><tr><td>4<\/td><td>OCTET STRING<\/td><td>primitive<\/td><\/tr><tr><td>5<\/td><td>NULL<\/td><td>primitive<\/td><\/tr><tr><td>6<\/td><td>OBJECT IDENTIFIER<\/td><td>primitive<\/td><\/tr><tr><td>16<\/td><td>SEQUENCE<\/td><td>constructed<\/td><\/tr><tr><td>17<\/td><td>SET<\/td><td>constructed<\/td><\/tr><tr><td>23<\/td><td>UTCTime<\/td><td>primitive<\/td><\/tr><tr><td>24<\/td><td>GeneralizedTime<\/td><td>primitive<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A context-specific tag ([0], [1], [2], [3], ...) means something different in each structure that uses it. A certificate uses [0] for its version field and [3] for its extensions. Both wrap another value, so both are constructed in this workbook. The tag number sits in the same bits 5-1 as a universal tag's; only the class bits differ.<\/p>\n<p>The length follows the tag byte, in one of two forms:<\/p>\n<ul><li>In the short form, the length byte's high bit is 0, and the rest of that byte (0 to 127) is the length. The length field is that one byte.<\/li><li>In the long form, the length byte's high bit is 1, and its low 7 bits say how many more bytes follow. Those bytes, read as one big-endian number, are the length. <code>0x81 0xC8<\/code> means \"1 more byte: 0xC8\", a length of 200. <code>0x82 0x01 0x2C<\/code> means \"2 more bytes: 0x01 0x2C\", a length of 300.<\/li><\/ul>\n<p>A length of 127 is the largest short form, and 128 is the first length that needs the long form.<\/p>\n<p>BER, the looser encoding that DER restricts, also allows an indefinite length: <code>0x80<\/code> with no length at all, ended by two zero bytes. DER forbids it and no test uses it, so you don't need to handle it.<\/p>\n<p>The content is the next <code>length<\/code> bytes. For a primitive node, those bytes are the value, decoded by type (below). For a constructed node, they are more complete TLV nodes, one after another, each one level deeper than its parent.<\/p>\n<h3>Decoding each type's content<\/h3>\n<p>A primitive node's value depends on its type:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Type<\/th><th>Content bytes<\/th><th>Print<\/th><\/tr><\/thead><tbody><tr><td>BOOLEAN<\/td><td>one byte: DER writes false as <code>0x00<\/code> and true as <code>0xFF<\/code><\/td><td><code>true<\/code> or <code>false<\/code><\/td><\/tr><tr><td>NULL<\/td><td>none<\/td><td><code>null<\/code><\/td><\/tr><tr><td>OCTET STRING<\/td><td>the value<\/td><td>the bytes as lowercase hex<\/td><\/tr><tr><td>BIT STRING<\/td><td>the number of unused bits (0 to 7) at the end of the last byte, then the bytes that hold the bits<\/td><td><code>&lt;unused-bits&gt;:&lt;hex of the rest&gt;<\/code>, e.g. <code>0:f0<\/code><\/td><\/tr><tr><td>UTCTime, GeneralizedTime<\/td><td>ASCII text<\/td><td>the text unchanged, e.g. <code>251020120000Z<\/code><\/td><\/tr><tr><td>INTEGER<\/td><td>a signed number (below)<\/td><td>the value in decimal<\/td><\/tr><tr><td>OBJECT IDENTIFIER<\/td><td>a list of numbers (below)<\/td><td>the dotted form, e.g. <code>1.2.840.10045.2.1<\/code><\/td><\/tr><tr><td>any other type<\/td><td><\/td><td>the bytes as lowercase hex, like OCTET STRING<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A BIT STRING with 0 unused bits and payload <code>0xF0<\/code> uses all 8 bits of that byte. With 4 unused bits, only the top 4 count. You print the bytes the same way in both cases.<\/p>\n<p>\"Any other type\" covers the string types you meet in real certificates, such as PrintableString and UTF8String, which this assignment doesn't decode. It also covers a context-specific tag used for implicit tagging: the tag replaces a value's own tag instead of wrapping another TLV, so the node is primitive.<\/p>\n<h4>INTEGER<\/h4>\n<p>The content bytes are a two's complement number, most significant byte first:<\/p>\n<ul><li>If the top bit of the first byte is 0, the value is the bytes read as an unsigned number.<\/li><li>If that bit is 1, the value is negative: subtract <code>2^(8 * number of bytes)<\/code> from the unsigned reading.<\/li><\/ul>\n<p>DER puts an extra <code>0x00<\/code> byte in front of a positive value whose top bit would otherwise be set, so that it doesn't read as negative. Keep that pad byte when you decode: it's what makes the value positive.<\/p>\n<p>Content <code>00 80<\/code> is two bytes with top byte <code>0x00<\/code>, so the value is positive: <code>0x0080 = 128<\/code>. Content <code>80<\/code> alone has its top bit set, so the value is negative: 128 unsigned, minus <code>2^8 = 256<\/code>, gives <code>-128<\/code>.<\/p>\n<p>DER sets no size limit on an INTEGER, and one test has a 20-byte value, the size of a certificate serial number. Python's <code>int<\/code> holds it; in another language, use a big-integer type.<\/p>\n<h4>OBJECT IDENTIFIER<\/h4>\n<p>An object identifier is a list of numbers called arcs, printed with dots between them, such as <code>1.2.840.10045.2.1<\/code>. The encoding packs the first two arcs into one value, <code>40 * arc1 + arc2<\/code> (arc1 is 0, 1 or 2), and gives each later arc a value of its own.<\/p>\n<p>Each value takes one or more bytes in base 128: 7 bits per byte, most significant group first, with the top bit set on every byte of the value except its last. To decode:<\/p>\n<ol><li>Start the current value at 0. For each byte, shift the value left 7 bits and OR in the byte's low 7 bits.<\/li><li>A byte whose top bit is 0 ends the value. The next byte starts a new one.<\/li><li>Split the first value <code>v<\/code> into two arcs: <code>v &lt; 40<\/code> gives <code>0, v<\/code>; <code>v &lt; 80<\/code> gives <code>1, v - 40<\/code>; a larger <code>v<\/code> gives <code>2, v - 80<\/code>.<\/li><\/ol>\n<p>The first value follows the same base-128 rule as the others, so it can take more than one byte too.<\/p>\n<p>Worked example: bytes <code>2a 86 48 ce 3d 04 03 03<\/code>.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Bytes<\/th><th>Value<\/th><th>Arcs<\/th><\/tr><\/thead><tbody><tr><td><code>2a<\/code><\/td><td>42, which is <code>40*1 + 2<\/code><\/td><td><code>1.2<\/code><\/td><\/tr><tr><td><code>86 48<\/code><\/td><td><code>0x86<\/code> has its top bit set, so the value goes on: 6 so far. <code>0x48<\/code> (top bit clear) ends it: <code>6*128 + 72 = 840<\/code><\/td><td><code>840<\/code><\/td><\/tr><tr><td><code>ce 3d<\/code><\/td><td>the same way: 10045<\/td><td><code>10045<\/code><\/td><\/tr><tr><td><code>04<\/code>, <code>03<\/code>, <code>03<\/code><\/td><td>one byte each: 4, 3, 3<\/td><td><code>4<\/code>, <code>3<\/code>, <code>3<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>The full OID is <code>1.2.840.10045.4.3.3<\/code>.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains one kind of line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>der &lt;hex&gt;<\/code><\/td><td>DER bytes, as lowercase hex with no spaces. A line can hold several complete top-level TLV nodes back to back, with nothing wrapping them: walk all of them.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>Walk every node of every <code>der<\/code> line depth first, in document order: a constructed node's line comes before its children's lines, and a node's children come before its next sibling. Write one line per node:<\/p>\n<pre><code>node &lt;depth&gt; &lt;class&gt; &lt;primitive-or-constructed&gt; &lt;tag&gt; &lt;length&gt; &lt;value&gt;<\/code><\/pre>\n<ul><li><code>&lt;depth&gt;<\/code>: <code>0<\/code> for a top-level node, <code>1<\/code> for its children, and so on.<\/li><li><code>&lt;class&gt;<\/code>: <code>universal<\/code>, <code>application<\/code>, <code>context<\/code> or <code>private<\/code>.<\/li><li><code>&lt;primitive-or-constructed&gt;<\/code>: the word <code>primitive<\/code> or <code>constructed<\/code>.<\/li><li><code>&lt;tag&gt;<\/code>: the tag number, in decimal.<\/li><li><code>&lt;length&gt;<\/code>: the number of content bytes, in decimal, not counting the tag and length fields.<\/li><li><code>&lt;value&gt;<\/code>: for a primitive node, its value as \"Decoding each type's content\" prints it, or <code>-<\/code> when a value printed as hex has no bytes (an empty OCTET STRING, for example). For a constructed node, the three characters <code>...<\/code>: its children follow on their own lines.<\/li><\/ul>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>BOOLEAN, NULL, OCTET STRING and BIT STRING values print as the table says, including a BIT STRING's unused-bits byte, and an input with several top-level nodes gets lines for all of them, in order.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>INTEGER is two's complement: a value with a leading <code>0x00<\/code> pad byte decodes to the right positive number, and a negative value decodes to the right negative number.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>OBJECT IDENTIFIER decodes from base-128 values to dotted arcs, including arcs (and the combined first value) that take more than one byte.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>SEQUENCE, SET and context-specific tags are constructed: their content is more TLV nodes, each one level deeper than its parent, through several levels.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Both length forms work: the short form, and the long form with one or more length bytes, including 127 and 128, the lengths on either side of the boundary.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every <code>der<\/code> line holds complete, well-formed DER: no truncated nodes, no indefinite lengths and no tag number of 31 or above.<\/li><li>Depths in the tests go no deeper than 4.<\/li><li>Each case has a 10-second limit.<\/li><li>There are 47 tests: 9 for R1 (two of them with several top-level nodes), 13 for R2, 8 for R3, 8 for R4 (two of them random), 6 for R5, and 3 end-to-end cases that combine several node types and levels of nesting in one structure shaped like a slice of a real certificate. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/pkiaudit/asn1/der.py","text":"\"\"\"A reader for DER, the tag-length-value encoding certificates use (assignment 05).\n\nIt covers the part of ITU-T X.690 that X.509 certificates need: definite lengths and tag numbers\nbelow 31. `parse_all` turns bytes into a tree of `Node`s, and the decode functions read the\nvalues of the primitive types.\n\"\"\"\n\nfrom dataclasses import dataclass, field\n\nCLASS_NAMES = {0: \"universal\", 1: \"application\", 2: \"context\", 3: \"private\"}\n\n# Universal tag numbers (ITU-T X.690 section 8).\nBOOLEAN, INTEGER, BIT_STRING, OCTET_STRING, NULL, OBJECT_IDENTIFIER = 1, 2, 3, 4, 5, 6\nSEQUENCE, SET, UTCTIME, GENERALIZEDTIME = 16, 17, 23, 24\n\n\n@dataclass\nclass Node:\n    \"\"\"One TLV: its header fields, its content bytes and, if constructed, its children.\"\"\"\n\n    cls: str  # \"universal\", \"application\", \"context\" or \"private\"\n    constructed: bool\n    tag: int\n    length: int  # content length in bytes\n    content: bytes  # the content bytes, without the header\n    children: list[\"Node\"] = field(default_factory=list)\n    depth: int = 0  # 0 for a top-level node\n    start: int = 0  # offset of the first header byte in the buffer the parser read\n    total_len: int = 0  # header and content together\n\n    def encoding(self, data: bytes) -> bytes:\n        \"\"\"Returns this node's original bytes, header included, out of `data`, the buffer the parser read.\"\"\"\n        # Assignments 07 and 08 hash these bytes. Re-encoding the fields yourself can give\n        # different bytes from the ones the issuer signed.\n        return data[self.start:self.start + self.total_len]\n\n\ndef read_length(data: bytes, i: int) -> tuple[int, int]:\n    \"\"\"Reads the length field at data[i]; returns (length, index of the first content byte).\"\"\"\n    first = data[i]\n    if first & 0x80 == 0:  # short form: the byte is the length (0 to 127)\n        return first, i + 1\n    count = first & 0x7F  # long form: the next `count` bytes hold the length, big-endian\n    if count == 0:\n        raise ValueError(\"indefinite length is not supported (DER requires definite length)\")\n    if i + 1 + count > len(data):\n        raise ValueError(\"truncated length field\")\n    length = int.from_bytes(data[i + 1:i + 1 + count], \"big\")\n    return length, i + 1 + count\n\n\ndef read_tlv(data: bytes, i: int, depth: int = 0) -> tuple[Node, int]:\n    \"\"\"Reads the TLV that starts at data[i]; returns (node, index of the byte after it).\"\"\"\n    start = i\n    if i >= len(data):\n        raise ValueError(f\"expected a TLV at offset {i}, ran out of bytes\")\n    first = data[i]\n    cls = CLASS_NAMES[(first >> 6) & 0x3]\n    constructed = bool(first & 0x20)\n    tag = first & 0x1F\n    if tag == 0x1F:\n        raise ValueError(\"high-tag-number form (tag number >= 31) is not supported\")\n    length, content_start = read_length(data, i + 1)\n    content_end = content_start + length\n    if content_end > len(data):\n        raise ValueError(f\"truncated TLV: wanted {length} content bytes, only \"\n                         f\"{len(data) - content_start} available\")\n    children = []\n    if constructed:\n        k = content_start\n        while k < content_end:\n            child, k = read_tlv(data, k, depth + 1)\n            children.append(child)\n        if k != content_end:\n            raise ValueError(\"a child TLV ran past its parent's length\")\n    node = Node(cls, constructed, tag, length, data[content_start:content_end], children, depth, start,\n                content_end - start)\n    return node, content_end\n\n\ndef parse_all(data: bytes) -> list[Node]:\n    \"\"\"Returns every top-level TLV in `data`, in order.\"\"\"\n    nodes, i = [], 0\n    while i < len(data):\n        node, i = read_tlv(data, i, 0)\n        nodes.append(node)\n    return nodes\n\n\ndef decode_integer(content: bytes) -> int:\n    \"\"\"Reads INTEGER content bytes as a signed, big-endian, two's complement number.\"\"\"\n    if not content:\n        raise ValueError(\"empty INTEGER\")\n    value = int.from_bytes(content, \"big\")\n    if content[0] & 0x80:  # the top bit of the first byte is the sign\n        value -= 1 << (8 * len(content))\n    return value\n\n\ndef decode_oid(content: bytes) -> str:\n    \"\"\"Reads OBJECT IDENTIFIER content bytes as dotted decimal, such as \"1.2.840.10045.2.1\".\"\"\"\n    if not content:\n        raise ValueError(\"empty OBJECT IDENTIFIER\")\n    # Each value is base 128, 7 bits per byte, with the high bit set on every byte but its last.\n    values, value = [], 0\n    for b in content:\n        value = (value << 7) | (b & 0x7F)\n        if not (b & 0x80):\n            values.append(value)\n            value = 0\n    if value:\n        raise ValueError(\"truncated OBJECT IDENTIFIER (last byte has the continuation bit set)\")\n    # The first value packs the first two arcs as 40 * arc1 + arc2, and may itself take more\n    # than one byte.\n    first = values[0]\n    if first < 40:\n        arc1, arc2 = 0, first\n    elif first < 80:\n        arc1, arc2 = 1, first - 40\n    else:\n        arc1, arc2 = 2, first - 80\n    return \".\".join(str(arc) for arc in [arc1, arc2] + values[1:])\n\n\ndef decode_bit_string(content: bytes) -> tuple[int, bytes]:\n    \"\"\"Reads BIT STRING content bytes as (unused bits in the last byte, the bytes that hold the bits).\"\"\"\n    if not content:\n        raise ValueError(\"empty BIT STRING (even zero bits needs the unused-bits byte)\")\n    return content[0], content[1:]\n"},{"path":"assignments/assignment_05_der_reader.py","text":"\"\"\"Assignment 05 (DER reader): lists every TLV node of each `der` line of a test input.\n\nThe checker runs `assignment_05_der_reader.py <input-file> <output-file>`. The DER reader is\nsrc/pkiaudit/asn1/der.py; this program walks its tree and prints one line per node.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.asn1 import der\n\n\ndef format_value(node: der.Node) -> str:\n    \"\"\"Writes a node's value: `...` for a constructed node, else its decoded value or hex.\"\"\"\n    if node.constructed:\n        return \"...\"  # its children follow on their own lines\n    if node.cls == \"universal\":\n        if node.tag == der.BOOLEAN:\n            return \"true\" if node.content and node.content[0] != 0 else \"false\"\n        if node.tag == der.INTEGER:\n            return str(der.decode_integer(node.content))\n        if node.tag == der.NULL:\n            return \"null\"\n        if node.tag == der.OBJECT_IDENTIFIER:\n            return der.decode_oid(node.content)\n        if node.tag == der.BIT_STRING:\n            unused, bits = der.decode_bit_string(node.content)\n            return f\"{unused}:{bits.hex()}\"\n        if node.tag in (der.UTCTIME, der.GENERALIZEDTIME):\n            return node.content.decode(\"ascii\")\n    # OCTET STRING, strings and context-specific primitives print as hex, and an empty value as\n    # `-`, so every line has six fields.\n    return node.content.hex() or \"-\"\n\n\ndef der_lines(data: bytes) -> list[str]:\n    \"\"\"Writes one line per TLV node in `data`, depth first, in document order.\"\"\"\n    lines = []\n\n    def visit(node: der.Node) -> None:\n        kind = \"constructed\" if node.constructed else \"primitive\"\n        lines.append(f\"node {node.depth} {node.cls} {kind} {node.tag} {node.length} {format_value(node)}\")\n        for child in node.children:\n            visit(child)\n\n    for top in der.parse_all(data):\n        visit(top)\n    return lines\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes the node lines for each `der <hex>` line.\"\"\"\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if words and words[0] == \"der\":  # der <hex>: one or more DER values, concatenated\n                lines.extend(der_lines(bytes.fromhex(words[1])))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/asn1/__init__.py"],"proof":{"passed":47,"total":47,"date":"2026-10-22"}},"read":"<p>eMudhra's post doesn't cover this assignment: it's background for the rest of the workbook. Every certificate here is a DER-encoded byte string, and assignments 06 to 09 all start by walking that encoding the way this one does. For the full rules, read ITU-T X.690 section 8 (\"Basic encoding rules\"), in particular 8.1 (the tag-length-value structure), 8.3 (INTEGER), 8.6 (BIT STRING) and 8.19 (OBJECT IDENTIFIER). The Source material section below links the document. You can pass using this page alone.<\/p>","readTitle":"Read in the blog first","context":"<p>This is the first assignment that reads bytes, so it uses none of your earlier modules. Your <code>asn1/der.py<\/code> turns bytes into a tree of nodes, and the certificate assignments read through it: <code>x509/certificate.py<\/code> (assignment 06) reads a certificate's fields, <code>x509/spki.py<\/code> (07) hashes its public key and <code>x509/signature.py<\/code> (08) checks its signature. Assignments 07 and 08 hash a node's original bytes, so store in each node its start offset and its total size, header included.<\/p>","sources":"<ul><li>ITU-T X.690, <a href=\"https://www.itu.int/rec/T-REC-X.690\" target=\"_blank\" rel=\"noopener\">Information technology - ASN.1 encoding rules: BER, CER and DER<\/a>, section 8 (the encoding this assignment reads)<\/li><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, section 4.1 (where assignment 06 uses this TLV structure to read a real certificate)<\/li><\/ul>","checking":"<pre><code>.\\check 05                                 run every test\n.\\check 05 -Case 05-R2-int-side-by-side    one test, showing its full input, expected output and your output\n.\\check 05 -Fresh                          a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 05 -Dispute &lt;id&gt; &quot;why&quot;             set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  INTEGER is two&#x27;s complement: a value needing a leading 0x00 pad b...    12 / 13  FAILED\n      x 05-R2-int-neg-128  INTEGER -128 (negative, two&#x27;s complement)\n          node[0]: expected (depth=0, cls=universal, pc=primitive, tag=2, length=1, value=-128), got (depth=0, cls=universal, pc=primitive, tag=2, length=1, value=128) - differs in value\n          likely cause: R2 - INTEGER is two&#x27;s complement: a value needing a leading 0x00 pad byte is still read correctly, and so is a negative value\n          expected values from: openssl asn1parse (OpenSSL 3.x): independently decodes tag class, constructed/primitive, depth and length from the same bytes\n          reproduce: py -P tools/run_py.py solutions 05 build/cases/05/05-R2-int-neg-128.in build/cases/05/05-R2-int-neg-128.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Write one function that reads a single TLV node starting at a byte offset and returns the node (its tag fields, length and content) and the offset after it: <code>read_tlv<\/code> in your <code>asn1/der.py<\/code>. Build the depth-first walk and the value formatting around calls to it.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>The tag byte gives the class, the constructed bit and the tag number by bit masking (<code>&gt;&gt; 6<\/code>, <code>&amp; 0x20<\/code>, <code>&amp; 0x1F<\/code>). The length byte tells you whether the length is that byte (short form) or the next N bytes (long form). A primitive node's value comes from decoding its content bytes by type. A constructed node's content is more TLV nodes: read them one after another with the same function, from the start of its content, until you have used up its length.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>An INTEGER's leading <code>0x00<\/code> byte belongs to the value: it makes a number whose high bit is set read as positive. Apply the two's complement rule to the bytes as given, pad byte included.<\/li><li>An OBJECT IDENTIFIER's first value, <code>40*arc1 + arc2<\/code>, follows the same base-128 rule as the later arcs, so it takes more than one byte when it's large.<\/li><li>A child is one level deeper than its parent. Pass the depth down as you recurse.<\/li><li>The long form can take one, two or more length bytes. A length of 127 is the last short form, and 128 is the first long form.<\/li><li>A context-specific tag keeps its number in the same five low bits as a universal tag; only the two class bits differ. Check the class before you decode by tag number: context-specific [1] isn't a BOOLEAN, though universal tag 1 is.<\/li><li>One <code>der<\/code> line can hold several top-level nodes with nothing around them. Keep reading until the bytes run out.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>read_tlv(data, i, depth):\n    first = data[i]\n    cls = (first &gt;&gt; 6) &amp; 0b11\n    constructed = (first &amp; 0x20) != 0\n    tag = first &amp; 0x1F\n\n    length_byte = data[i+1]\n    if high bit of length_byte is 0:\n        length = length_byte\n        content_start = i + 2\n    else:\n        n = length_byte &amp; 0x7F\n        length = big-endian value of the next n bytes\n        content_start = i + 2 + n\n\n    content = data[content_start : content_start + length]\n    node = {cls, constructed, tag, length, content, depth, children: [],\n            start: i, total_len: content_start + length - i}\n    if constructed:\n        k = content_start\n        while k &lt; content_start + length:\n            child, k = read_tlv(data, k, depth + 1)\n            node.children.append(child)\n    return node, content_start + length\n\nvisit(node):\n    print one line for node (value &quot;...&quot; if constructed, else decoded by type)\n    for child in node.children:\n        visit(child)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a BIT STRING with unused bits","test":"05-R1-bit-string-unused","input":"der 030205a0","output":"node 0 universal primitive 3 2 5:a0","image":null,"explain":"<p>Tag byte <code>0x03<\/code>: class bits <code>00<\/code> (universal), constructed bit <code>0<\/code> (primitive), tag number <code>3<\/code> (BIT STRING). Length byte <code>0x02<\/code>: short form, 2 content bytes. Content <code>05 a0<\/code>: the first byte, <code>0x05<\/code>, is the unused-bit count, and the rest, <code>a0<\/code>, holds the bits. Output value: <code>5:a0<\/code>.<\/p>"},{"label":"Example 2","name":"INTEGER needing a pad byte, next to one that doesn't","test":"05-R2-int-side-by-side","input":"der 02020080020180","output":"node 0 universal primitive 2 2 128\nnode 0 universal primitive 2 1 -128","image":null,"explain":"<p>The first value has tag <code>02<\/code> (INTEGER), length <code>02<\/code> and content <code>00 80<\/code>. The leading <code>00<\/code> makes it positive: <code>0x0080 = 128<\/code>. The second value has tag <code>02<\/code>, length <code>01<\/code> and content <code>80<\/code>. Its top bit is set and no pad byte comes first, so it's negative: 128 unsigned, minus 256, gives <code>-128<\/code>. The same byte <code>80<\/code> reads as 128 with a pad byte in front and as -128 without one.<\/p>"},{"label":"Example 3","name":"nesting with a context-specific tag","test":"05-R4-context-explicit","input":"der a003020102","output":"node 0 context constructed 0 3 ...\nnode 1 universal primitive 2 1 2","image":null,"explain":"<p>Tag byte <code>0xa0<\/code> is <code>1010_0000<\/code>: class bits <code>10<\/code> (context-specific), constructed bit <code>1<\/code>, tag number <code>0<\/code>. A certificate wraps its version field this way: <code>[0]<\/code> constructed, holding one INTEGER. The outer node's value is <code>...<\/code> because its content is a TLV node (the INTEGER <code>2<\/code>), which appears on the next line, one level deeper.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>eMudhra's post has no code for this, so there is no author's version to compare. The reference <code>asn1/der.py<\/code> has one small function, <code>read_tlv<\/code>, that calls itself for each child, and one decoder each for INTEGER, OBJECT IDENTIFIER and BIT STRING. The program's <code>format_value<\/code> has one branch per type.<\/p>\n<p>For an OBJECT IDENTIFIER's first value, the reference uses the same base-128 loop as for the other arcs, with no special case for a single byte. Compare how it handles an arc pair whose combined value is large with the code you wrote for the later arcs.<\/p>"}},{"id":"06","num":"6","title":"Read a certificate","difficulty":"Medium","tests":17,"problem":"problems/06-read-certificate.md","entry":"solutions/assignments/assignment_06_read_certificate.py","files":[{"path":"solutions/assignments/assignment_06_read_certificate.py","role":"entry","purpose":null,"job":"Read each `cert` line of the input (see Input) and read the certificate's fields with your `x509/certificate.py`. Write the four lines Output shows for each certificate, with the key coordinates in lowercase hex padded to the curve's width.","blank":"# ======================================================================================\n# Assignment 06: Read a certificate\n# Problem: problems/06-read-certificate.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 06 as `python -P tools/run_py.py\n#   solutions 06 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 06`, or use Run and Submit in the book.\n#\n# Your job:\n#   Read each `cert` line of the input (see Input) and read the certificate's fields with\n#   your `x509/certificate.py`. Write the four lines Output shows for each certificate,\n#   with the key coordinates in lowercase hex padded to the curve's width.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/x509/certificate.py in this assignment; each one gives its\n#   job at the top.\n#   Earlier files you can use: src/pkiaudit/asn1/der.py, src/pkiaudit/ecc/curve.py and\n#   src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.x509 import certificate`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 06: Read a certificate\n# Problem: problems/06-read-certificate.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 06 as `python -P tools/run_py.py\n#   solutions 06 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 06`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/x509/certificate.py in this assignment; each one gives its\n#   job at the top.\n#   Earlier files you can use: src/pkiaudit/asn1/der.py, src/pkiaudit/ecc/curve.py and\n#   src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.x509 import certificate`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 06 (read a certificate): prints the fields of each `cert` line of a test input.\n\nThe checker runs `assignment_06_read_certificate.py <input-file> <output-file>`. The fields are\nread by src/pkiaudit/x509/certificate.py.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.x509.certificate import parse_certificate\n\n\ndef certificate_lines(label: str, cert_bytes: bytes) -> list[str]:\n    \"\"\"Writes the four output lines for one certificate.\"\"\"\n    cert = parse_certificate(cert_bytes)\n    width = 2 * cert.curve.byte_length\n    x, y = cert.public_key\n    pathlen = \"none\" if cert.pathlen is None else str(cert.pathlen)\n    return [\n        f\"cert {label} {cert.subject_cn} {cert.issuer_cn}\",\n        f\"validity {cert.not_before} {cert.not_after}\",\n        f\"key {cert.curve.name} {x:0{width}x} {y:0{width}x}\",\n        f\"ca {'true' if cert.ca else 'false'} {pathlen}\",\n    ]\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes the fields of each `cert <label> <hex>` line.\"\"\"\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if words and words[0] == \"cert\":\n                lines.extend(certificate_lines(words[1], bytes.fromhex(words[2])))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/x509/certificate.py","role":"new","purpose":"This module reads the fields of an X.509 certificate that the project needs: the subject and issuer names, the validity window, the elliptic-curve public key and whether the certificate is a CA. Assignment 07 finds the public key field through it, 08 the signed bytes, and 09 and 16 validate chains with the fields it reads.","job":"In `x509/certificate.py`, read the fields of a DER certificate's tbsCertificate with your DER reader from assignment 05: the serial number, the issuer's and subject's common names, the two validity times, the curve and public key point, and the BasicConstraints values. Give the curve as your `P256` or `P384` from `ecc/curves.py`, and read a certificate without BasicConstraints as not a CA, with no path length. Keep finding the top-level SEQUENCE and listing tbsCertificate's fields as steps of their own: assignments 07 and 08 reuse them.","blank":"# ======================================================================================\n# Assignment 06: Read a certificate\n# Problem: problems/06-read-certificate.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module reads the fields of an X.509 certificate that the project needs: the\n#   subject and issuer names, the validity window, the elliptic-curve public key and\n#   whether the certificate is a CA. Assignment 07 finds the public key field through it,\n#   08 the signed bytes, and 09 and 16 validate chains with the fields it reads.\n#\n# Your job:\n#   In `x509/certificate.py`, read the fields of a DER certificate's tbsCertificate with\n#   your DER reader from assignment 05: the serial number, the issuer's and subject's\n#   common names, the two validity times, the curve and public key point, and the\n#   BasicConstraints values. Give the curve as your `P256` or `P384` from `ecc/curves.py`,\n#   and read a certificate without BasicConstraints as not a CA, with no path length. Keep\n#   finding the top-level SEQUENCE and listing tbsCertificate's fields as steps of their\n#   own: assignments 07 and 08 reuse them.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 06: Read a certificate\n# Problem: problems/06-read-certificate.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module reads the fields of an X.509 certificate that the project needs: the\n#   subject and issuer names, the validity window, the elliptic-curve public key and\n#   whether the certificate is a CA. Assignment 07 finds the public key field through it,\n#   08 the signed bytes, and 09 and 16 validate chains with the fields it reads.\n#\n# Your job:\n#   In `x509/certificate.py`, read the fields of a DER certificate's tbsCertificate with\n#   your DER reader from assignment 05: the serial number, the issuer's and subject's\n#   common names, the two validity times, the curve and public key point, and the\n#   BasicConstraints values. Give the curve as your `P256` or `P384` from `ecc/curves.py`,\n#   and read a certificate without BasicConstraints as not a CA, with no path length. Keep\n#   finding the top-level SEQUENCE and listing tbsCertificate's fields as steps of their\n#   own: assignments 07 and 08 reuse them. The Boilerplate gives you the declarations;\n#   fill in each TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Reading an X.509 certificate's fields out of its DER (assignment 06).\n\n    Certificate    ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }\n    TBSCertificate ::= SEQUENCE { version [0], serialNumber, signature, issuer, validity,\n                                  subject, subjectPublicKeyInfo, ..., extensions [3] }\n\nThis module reads tbsCertificate: the names, the validity window, the elliptic-curve public key\nand the BasicConstraints extension. Assignment 08 reads the signature around it.\n\"\"\"\n\nfrom dataclasses import dataclass\n\nfrom pkiaudit.asn1 import der\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.ecc.curves import P256, P384\n\nID_EC_PUBLIC_KEY = \"1.2.840.10045.2.1\"\nCURVE_OIDS = {\"1.2.840.10045.3.1.7\": P256, \"1.3.132.0.34\": P384}\nCOMMON_NAME_OID = \"2.5.4.3\"\nBASIC_CONSTRAINTS_OID = \"2.5.29.19\"\n\n# Positions in the list tbs_fields returns: tbsCertificate's fields after the version.\nSERIAL, SIGNATURE, ISSUER, VALIDITY, SUBJECT, PUBLIC_KEY_INFO = range(6)\n\n\n@dataclass(frozen=True)\nclass Certificate:\n    \"\"\"The fields of a certificate's tbsCertificate that the project uses.\"\"\"\n\n    serial: int\n    issuer_cn: str | None\n    subject_cn: str | None\n    not_before: str\n    not_after: str\n    curve: Curve\n    public_key: tuple[int, int]\n    ca: bool\n    pathlen: int | None  # None when there is no path length constraint\n\n\ndef certificate_node(cert_bytes: bytes) -> der.Node:\n    \"\"\"Returns the top-level Certificate SEQUENCE, after checking it has its three fields.\"\"\"\n    # TODO: parse the bytes with your DER reader and check for one SEQUENCE with three\n    # children; see \"The shape of a certificate\" on the problem page.\n    raise NotImplementedError(\"certificate_node\")\n\n\ndef tbs_fields(cert_bytes: bytes) -> list[der.Node]:\n    \"\"\"Returns tbsCertificate's fields after the version, so SERIAL to PUBLIC_KEY_INFO index it.\"\"\"\n    # TODO: tbsCertificate is the first field; skip its `[0]` version. See the table under \"The\n    # shape of a certificate\" on the problem page.\n    raise NotImplementedError(\"tbs_fields\")\n\n\ndef read_name_cn(name: der.Node) -> str | None:\n    \"\"\"Returns a Name's commonName as text, or None if it has none.\"\"\"\n    # TODO: see \"Reading a Name's common name\" on the problem page.\n    raise NotImplementedError(\"read_name_cn\")\n\n\ndef read_validity(validity: der.Node) -> tuple[str, str]:\n    \"\"\"Returns (notBefore, notAfter) as the text the certificate stores, UTCTime or GeneralizedTime.\"\"\"\n    # TODO: see \"Reading validity\" on the problem page.\n    raise NotImplementedError(\"read_validity\")\n\n\ndef read_public_key(spki: der.Node) -> tuple[Curve, tuple[int, int]]:\n    \"\"\"Returns (curve, (x, y)) from a SubjectPublicKeyInfo that holds an uncompressed EC point.\"\"\"\n    # TODO: check the algorithm, look the curve up in CURVE_OIDS and split the point; see\n    # \"Reading the public key\" on the problem page.\n    raise NotImplementedError(\"read_public_key\")\n\n\ndef read_basic_constraints(extensions: der.Node) -> tuple[bool, int | None]:\n    \"\"\"Returns (cA, pathLenConstraint) from the [3] extensions field, or (False, None) if absent.\"\"\"\n    # TODO: find the extension with BASIC_CONSTRAINTS_OID and parse its extnValue as DER again;\n    # see \"Reading BasicConstraints\" on the problem page.\n    raise NotImplementedError(\"read_basic_constraints\")\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Reads the fields of a DER certificate.\"\"\"\n    # TODO: read each field from tbs_fields with the functions above. Extensions, if present,\n    # are the `[3]` field right after subjectPublicKeyInfo; without them the certificate is not\n    # a CA and has no path length. See \"The shape of a certificate\" and \"Reading\n    # BasicConstraints\" on the problem page.\n    raise NotImplementedError(\"parse_certificate\")\n"}],"buildsOn":[{"path":"solutions/src/pkiaudit/asn1/der.py","owner":"05","purpose":"This module reads DER, the tag-length-value encoding that holds every certificate in the project, into a tree of nodes, and decodes INTEGER, OBJECT IDENTIFIER and BIT STRING values. Your `x509/certificate.py` (assignment 06), `x509/spki.py` (07) and `x509/signature.py` (08) read certificates through it."},{"path":"solutions/src/pkiaudit/ecc/curve.py","owner":"02","purpose":"This module holds the elliptic-curve group law: the curve type, points, the point at infinity and the rule that adds two points. Assignment 03 adds scalar multiplication to it, and your ECDSA code from assignment 04 and the weak-key search in assignment 10 run on its point addition."},{"path":"solutions/src/pkiaudit/ecc/curves.py","owner":"02","purpose":"This module holds the constants of every curve the project uses: the toy curve now, and P-256 and P-384, which assignment 03 adds. Later assignments look up P-256 and P-384 here, from the certificate reader in assignment 06 to the PKI audit in assignment 16."}],"indent":4,"tags":[{"label":"Language","items":["recursion","byte slicing"],"text":["recursion","byte slicing"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["X.509","ASN.1","SubjectPublicKeyInfo","BasicConstraints"],"text":["X.509","ASN.1","SubjectPublicKeyInfo","BasicConstraints"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads DER-encoded X.509 certificates and prints the fields this workbook needs from each one.<\/p>\n<h3>The shape of a certificate<\/h3>\n<p>A <code>Certificate<\/code> is a SEQUENCE of three fields: <code>tbsCertificate<\/code> (the part the issuer signs), <code>signatureAlgorithm<\/code> and <code>signatureValue<\/code>. This assignment reads only <code>tbsCertificate<\/code>, a SEQUENCE whose fields, in file order, are:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Field<\/th><th>What it is<\/th><th>In this assignment<\/th><\/tr><\/thead><tbody><tr><td><code>version<\/code><\/td><td><code>[0]<\/code> EXPLICIT INTEGER<\/td><td>present in every certificate here (v3); read past it, you don't need its value<\/td><\/tr><tr><td><code>serialNumber<\/code><\/td><td>INTEGER<\/td><td>not printed<\/td><\/tr><tr><td><code>signature<\/code><\/td><td>SEQUENCE (AlgorithmIdentifier)<\/td><td>repeats the outer signatureAlgorithm; not needed here<\/td><\/tr><tr><td><code>issuer<\/code><\/td><td>SEQUENCE (a Name)<\/td><td>read its commonName, below<\/td><\/tr><tr><td><code>validity<\/code><\/td><td>SEQUENCE of two Time values<\/td><td>read both, below<\/td><\/tr><tr><td><code>subject<\/code><\/td><td>SEQUENCE (a Name)<\/td><td>read its commonName, below<\/td><\/tr><tr><td><code>subjectPublicKeyInfo<\/code><\/td><td>SEQUENCE<\/td><td>read the curve and the point, below<\/td><\/tr><tr><td><code>extensions<\/code><\/td><td><code>[3]<\/code> EXPLICIT SEQUENCE OF Extension, optional<\/td><td>read BasicConstraints if present, below<\/td><\/tr><\/tbody><\/table><\/div>\n<p>EXPLICIT tagging means the <code>[0]<\/code> node wraps a complete INTEGER node, so the version number is the <code>[0]<\/code> node's child. Every certificate here is version 3, so the first child of <code>tbsCertificate<\/code> is the <code>[0]<\/code> version (its INTEGER holds 2, meaning v3), and you can skip it.<\/p>\n<p>No certificate here has an <code>issuerUniqueID<\/code> or a <code>subjectUniqueID<\/code>. <code>extensions<\/code> is the only optional field, and some certificates in this assignment have no extensions at all.<\/p>\n<h3>Reading a Name's common name<\/h3>\n<p>A <code>Name<\/code> is <code>SEQUENCE OF RelativeDistinguishedName<\/code>. Each <code>RelativeDistinguishedName<\/code> is <code>SET OF AttributeTypeAndValue<\/code>, and each <code>AttributeTypeAndValue<\/code> is <code>SEQUENCE { type OBJECT IDENTIFIER, value ANY }<\/code>.<\/p>\n<p>Every name in this assignment has one <code>RelativeDistinguishedName<\/code> with one attribute: commonName, OID <code>2.5.4.3<\/code>. Find the attribute whose type is that OID and read its value's content bytes as text. The value is a PrintableString or a UTF8String; in both, the content bytes are the characters.<\/p>\n<h3>Reading validity<\/h3>\n<p><code>Validity<\/code> is <code>SEQUENCE { notBefore Time, notAfter Time }<\/code>, and <code>Time<\/code> is <code>CHOICE { utcTime UTCTime, generalTime GeneralizedTime }<\/code>. Either tag can appear, and you don't need to tell them apart: print the content bytes as text, unchanged, as in assignment 05.<\/p>\n<h3>Reading the public key<\/h3>\n<p><code>SubjectPublicKeyInfo<\/code> is <code>SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT STRING }<\/code>, and <code>AlgorithmIdentifier<\/code> is <code>SEQUENCE { algorithm OBJECT IDENTIFIER, parameters ANY }<\/code>. For every key in this assignment:<\/p>\n<ul><li><code>algorithm<\/code> is <code>id-ecPublicKey<\/code>, OID <code>1.2.840.10045.2.1<\/code>.<\/li><li><code>parameters<\/code> is one OBJECT IDENTIFIER that names the curve: <code>1.2.840.10045.3.1.7<\/code> for P-256, <code>1.3.132.0.34<\/code> for P-384.<\/li><li><code>subjectPublicKey<\/code> is a BIT STRING. After its unused-bits byte (assignment 05's rule; it's <code>0<\/code> here), the content is <code>0x04<\/code>, meaning \"uncompressed point\", then the x-coordinate, then the y-coordinate. Each coordinate takes the curve's coordinate width: 32 bytes for P-256, 48 for P-384.<\/li><\/ul>\n<h3>Reading BasicConstraints<\/h3>\n<p>If <code>extensions<\/code> is present, its <code>[3]<\/code> node wraps a SEQUENCE of extensions, each one <code>Extension ::= SEQUENCE { extnID OBJECT IDENTIFIER, critical BOOLEAN DEFAULT FALSE, extnValue OCTET STRING }<\/code>. <code>critical<\/code> may be missing, so <code>extnValue<\/code> is the last field of an <code>Extension<\/code> whether <code>critical<\/code> is there or not.<\/p>\n<p>Find the extension whose <code>extnID<\/code> is <code>2.5.29.19<\/code> (basicConstraints). Its <code>extnValue<\/code> is an OCTET STRING whose content bytes are another complete DER structure. Parse those bytes as <code>BasicConstraints ::= SEQUENCE { cA BOOLEAN DEFAULT FALSE, pathLenConstraint INTEGER OPTIONAL }<\/code>.<\/p>\n<p><code>cA<\/code> has DEFAULT FALSE, and DER leaves out a field that holds its default value, so the bytes contain <code>cA<\/code> only when it's true. If the SEQUENCE's first child isn't a BOOLEAN, <code>cA<\/code> is false, and the child there, if any, is <code>pathLenConstraint<\/code>.<\/p>\n<p>If there is no <code>extensions<\/code> field, or no basicConstraints extension among the extensions, read the certificate as not a CA, with no path length constraint. RFC 5280 section 4.2.1.9 makes the extension optional and leaves open what its absence means for older certificates. Modern verifiers, and this workbook, read absence as \"not a CA\" because it's the safe direction: a certificate not marked as a CA can't sign other certificates.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains one kind of line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>cert &lt;label&gt; &lt;hex&gt;<\/code><\/td><td>A full DER-encoded certificate. <code>label<\/code> is a word with no spaces; print it back unchanged.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each <code>cert<\/code> line, in input order, write four lines:<\/p>\n<pre><code>cert &lt;label&gt; &lt;subject-cn&gt; &lt;issuer-cn&gt;\nvalidity &lt;notBefore&gt; &lt;notAfter&gt;\nkey &lt;curve&gt; &lt;pubx&gt; &lt;puby&gt;\nca &lt;true|false&gt; &lt;pathlen&gt;<\/code><\/pre>\n<ul><li><code>&lt;subject-cn&gt;<\/code>, <code>&lt;issuer-cn&gt;<\/code>: the commonName text. Neither contains spaces in this assignment.<\/li><li><code>&lt;notBefore&gt;<\/code>, <code>&lt;notAfter&gt;<\/code>: the time text, unchanged.<\/li><li><code>&lt;curve&gt;<\/code>: <code>P-256<\/code> or <code>P-384<\/code>.<\/li><li><code>&lt;pubx&gt;<\/code>, <code>&lt;puby&gt;<\/code>: lowercase hex at the curve's full coordinate width, 64 hex digits for P-256 and 96 for P-384. Pad with leading zeros when the number's own hex form is shorter.<\/li><li><code>&lt;pathlen&gt;<\/code>: the path length constraint in decimal, or the word <code>none<\/code> if there isn't one.<\/li><\/ul>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A leaf certificate that isn't a CA: the subject, issuer, validity and public key all match what the certificate holds.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A CA certificate (BasicConstraints CA:TRUE) with no path length constraint.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A CA certificate with a path length constraint (0, 1 or a larger number).<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Both curves: P-256 and P-384 public keys read right, each at its own coordinate width.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Subject and issuer can have the same common name (a self-signed certificate) or different ones, whether or not the certificate is a CA.<\/span><\/li><li><span class=\"rid\">R6<\/span><span>A certificate with no BasicConstraints extension, because it has no extensions or because it has others but not that one, reads as not a CA with no path length: <code>ca false none<\/code>.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate is version 3, self-consistent DER, built from real ECDSA P-256 or P-384 keys.<\/li><li>Subject and issuer common names contain no spaces and are at most 64 characters long.<\/li><li>Each Name has at most one <code>RelativeDistinguishedName<\/code> and one <code>AttributeTypeAndValue<\/code>. A certificate has at most one BasicConstraints extension.<\/li><li>Each case has a 10-second limit.<\/li><li>There are 17 tests: 3 for R1, 2 for R2, 3 for R3, 2 for R4, 2 for R5, 3 for R6, and 2 end-to-end cases: a random mix of five certificates and a three-certificate input shaped like a chain. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/pkiaudit/x509/certificate.py","text":"\"\"\"Reading an X.509 certificate's fields out of its DER (assignment 06).\n\n    Certificate    ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }\n    TBSCertificate ::= SEQUENCE { version [0], serialNumber, signature, issuer, validity,\n                                  subject, subjectPublicKeyInfo, ..., extensions [3] }\n\nThis module reads tbsCertificate: the names, the validity window, the elliptic-curve public key\nand the BasicConstraints extension. Assignment 08 reads the signature around it.\n\"\"\"\n\nfrom dataclasses import dataclass\n\nfrom pkiaudit.asn1 import der\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.ecc.curves import P256, P384\n\nID_EC_PUBLIC_KEY = \"1.2.840.10045.2.1\"\nCURVE_OIDS = {\"1.2.840.10045.3.1.7\": P256, \"1.3.132.0.34\": P384}\nCOMMON_NAME_OID = \"2.5.4.3\"\nBASIC_CONSTRAINTS_OID = \"2.5.29.19\"\n\n# Positions in the list tbs_fields returns: tbsCertificate's fields after the version.\nSERIAL, SIGNATURE, ISSUER, VALIDITY, SUBJECT, PUBLIC_KEY_INFO = range(6)\n\n\n@dataclass(frozen=True)\nclass Certificate:\n    \"\"\"The fields of a certificate's tbsCertificate that the project uses.\"\"\"\n\n    serial: int\n    issuer_cn: str | None\n    subject_cn: str | None\n    not_before: str\n    not_after: str\n    curve: Curve\n    public_key: tuple[int, int]\n    ca: bool\n    pathlen: int | None  # None when there is no path length constraint\n\n\ndef certificate_node(cert_bytes: bytes) -> der.Node:\n    \"\"\"Returns the top-level Certificate SEQUENCE, after checking it has its three fields.\"\"\"\n    top = der.parse_all(cert_bytes)\n    if len(top) != 1 or top[0].tag != der.SEQUENCE or not top[0].constructed:\n        raise ValueError(\"a certificate is exactly one top-level SEQUENCE\")\n    if len(top[0].children) != 3:\n        raise ValueError(\"a Certificate has exactly 3 fields: tbsCertificate, \"\n                         \"signatureAlgorithm, signatureValue\")\n    return top[0]\n\n\ndef tbs_fields(cert_bytes: bytes) -> list[der.Node]:\n    \"\"\"Returns tbsCertificate's fields after the version, so SERIAL to PUBLIC_KEY_INFO index it.\"\"\"\n    fields = certificate_node(cert_bytes).children[0].children\n    if fields and fields[0].cls == \"context\" and fields[0].tag == 0:\n        return fields[1:]  # version [0] EXPLICIT: every certificate here is v3\n    return fields\n\n\ndef read_name_cn(name: der.Node) -> str | None:\n    \"\"\"Returns a Name's commonName as text, or None if it has none.\"\"\"\n    # Name ::= SEQUENCE OF RelativeDistinguishedName, each a SET OF { type OID, value }.\n    for rdn in name.children:\n        for attribute in rdn.children:\n            attr_type, value = attribute.children\n            if der.decode_oid(attr_type.content) == COMMON_NAME_OID:\n                return value.content.decode(\"utf-8\")\n    return None\n\n\ndef read_validity(validity: der.Node) -> tuple[str, str]:\n    \"\"\"Returns (notBefore, notAfter) as the text the certificate stores, UTCTime or GeneralizedTime.\"\"\"\n    not_before, not_after = validity.children\n    return not_before.content.decode(\"ascii\"), not_after.content.decode(\"ascii\")\n\n\ndef read_public_key(spki: der.Node) -> tuple[Curve, tuple[int, int]]:\n    \"\"\"Returns (curve, (x, y)) from a SubjectPublicKeyInfo that holds an uncompressed EC point.\"\"\"\n    # SubjectPublicKeyInfo ::= SEQUENCE { AlgorithmIdentifier { algorithm, curve }, BIT STRING }\n    algorithm, public_key_bits = spki.children\n    algorithm_oid, parameters = algorithm.children\n    if der.decode_oid(algorithm_oid.content) != ID_EC_PUBLIC_KEY:\n        raise ValueError(\"subjectPublicKeyInfo algorithm is not id-ecPublicKey\")\n    curve_oid = der.decode_oid(parameters.content)\n    if curve_oid not in CURVE_OIDS:\n        raise ValueError(f\"unrecognised curve OID {curve_oid}\")\n    _unused, point = der.decode_bit_string(public_key_bits.content)\n    if not point or point[0] != 0x04:\n        raise ValueError(\"expected an uncompressed EC point (0x04 || x || y)\")\n    width = (len(point) - 1) // 2\n    x = int.from_bytes(point[1:1 + width], \"big\")\n    y = int.from_bytes(point[1 + width:], \"big\")\n    return CURVE_OIDS[curve_oid], (x, y)\n\n\ndef read_basic_constraints(extensions: der.Node) -> tuple[bool, int | None]:\n    \"\"\"Returns (cA, pathLenConstraint) from the [3] extensions field, or (False, None) if absent.\"\"\"\n    # Extension ::= SEQUENCE { extnID, critical BOOLEAN DEFAULT FALSE, extnValue OCTET STRING }:\n    # critical may be missing, so extnValue is the last field.\n    for extension in extensions.children[0].children:\n        if der.decode_oid(extension.children[0].content) != BASIC_CONSTRAINTS_OID:\n            continue\n        # extnValue's content is DER again: BasicConstraints ::= SEQUENCE { cA, pathLen }.\n        constraints = der.parse_all(extension.children[-1].content)[0].children\n        ca = False\n        if constraints and constraints[0].tag == der.BOOLEAN:\n            ca = constraints[0].content[0] != 0\n            constraints = constraints[1:]  # cA is DEFAULT FALSE, so DER leaves it out when false\n        pathlen = der.decode_integer(constraints[0].content) if constraints else None\n        return ca, pathlen\n    return False, None  # RFC 5280 4.2.1.9: a certificate without BasicConstraints is not a CA\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Reads the fields of a DER certificate.\"\"\"\n    fields = tbs_fields(cert_bytes)\n    not_before, not_after = read_validity(fields[VALIDITY])\n    curve, public_key = read_public_key(fields[PUBLIC_KEY_INFO])\n    ca, pathlen = False, None\n    # Extensions, when present, come right after the public key: no certificate here has the\n    # optional unique IDs [1] and [2] that may sit between them.\n    rest = fields[PUBLIC_KEY_INFO + 1:]\n    if rest and rest[0].cls == \"context\" and rest[0].tag == 3:\n        ca, pathlen = read_basic_constraints(rest[0])\n    return Certificate(\n        serial=der.decode_integer(fields[SERIAL].content),\n        issuer_cn=read_name_cn(fields[ISSUER]),\n        subject_cn=read_name_cn(fields[SUBJECT]),\n        not_before=not_before,\n        not_after=not_after,\n        curve=curve,\n        public_key=public_key,\n        ca=ca,\n        pathlen=pathlen,\n    )\n"},{"path":"assignments/assignment_06_read_certificate.py","text":"\"\"\"Assignment 06 (read a certificate): prints the fields of each `cert` line of a test input.\n\nThe checker runs `assignment_06_read_certificate.py <input-file> <output-file>`. The fields are\nread by src/pkiaudit/x509/certificate.py.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.x509.certificate import parse_certificate\n\n\ndef certificate_lines(label: str, cert_bytes: bytes) -> list[str]:\n    \"\"\"Writes the four output lines for one certificate.\"\"\"\n    cert = parse_certificate(cert_bytes)\n    width = 2 * cert.curve.byte_length\n    x, y = cert.public_key\n    pathlen = \"none\" if cert.pathlen is None else str(cert.pathlen)\n    return [\n        f\"cert {label} {cert.subject_cn} {cert.issuer_cn}\",\n        f\"validity {cert.not_before} {cert.not_after}\",\n        f\"key {cert.curve.name} {x:0{width}x} {y:0{width}x}\",\n        f\"ca {'true' if cert.ca else 'false'} {pathlen}\",\n    ]\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes the fields of each `cert <label> <hex>` line.\"\"\"\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if words and words[0] == \"cert\":\n                lines.extend(certificate_lines(words[1], bytes.fromhex(words[2])))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/x509/__init__.py","src/pkiaudit/asn1/__init__.py","src/pkiaudit/asn1/der.py","src/pkiaudit/ecc/__init__.py","src/pkiaudit/ecc/curve.py","src/pkiaudit/ecc/curves.py","src/pkiaudit/ecc/modmath.py"],"proof":{"passed":17,"total":17,"date":"2026-10-22"}},"read":"<p>eMudhra's post doesn't cover this assignment: it reads the fields of an X.509 certificate that the rest of the workbook needs. For background, read RFC 5280 section 4.1 (\"Basic Certificate Fields\") for the shape of a certificate, and section 4.2.1.9 (\"Basic Constraints\") for what makes a certificate a CA. You can pass using this page alone.<\/p>","readTitle":"Read in the blog first","context":"<p>Your <code>asn1/der.py<\/code> from assignment 05 walks the certificate's bytes, and your <code>P256<\/code> and <code>P384<\/code> in <code>ecc/curves.py<\/code> (assignment 03) are the curves the keys are on. Here, in <code>x509/certificate.py<\/code>, you pull out the fields the later assignments need: who the certificate is for, who issued it, when it's valid, its public key, and whether it may sign other certificates. Your <code>x509/spki.py<\/code> (assignment 07) hashes the public key field you find here, <code>x509/signature.py<\/code> (08) reads the signature around it, and <code>pki/chain.py<\/code> (09) and <code>pki/audit.py<\/code> (16) validate chains with these fields.<\/p>","sources":"<ul><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, sections 4.1 (certificate fields) and 4.2.1.9 (Basic Constraints)<\/li><li>RFC 5480, <a href=\"https://www.rfc-editor.org/rfc/rfc5480\" target=\"_blank\" rel=\"noopener\">Elliptic Curve Cryptography Subject Public Key Information<\/a>, for the id-ecPublicKey SubjectPublicKeyInfo shape and the uncompressed point format<\/li><\/ul>","checking":"<pre><code>.\\check 06                               run every test\n.\\check 06 -Case 06-R3-pathlen-1         one test, showing its full input, expected output and your output\n.\\check 06 -Fresh                        a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 06 -Dispute &lt;id&gt; &quot;why&quot;           set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R6  A certificate with no BasicConstraints extension at all defaults...    2 / 3   FAILED\n      x 06-R6-other-extension-no-basic-constraints  a different extension is present...\n          key[0]: expected (curve=P-256, pubx=07539bc9..., puby=...), got (curve=P-256, pubx=7539bc9..., puby=...) - differs in pubx\n          likely cause: R6 - A certificate with no BasicConstraints extension at all defaults to CA:false, no path length\n          expected values from: cryptography 41.0.7 (OpenSSL): fields are read back from the built certificate with a separate parse call, and validity strings with openssl asn1parse\n          reproduce: py -P tools/run_py.py solutions 06 build/cases/06/06-R6-other-extension-no-basic-constraints.in build/cases/06/06-R6-other-extension-no-basic-constraints.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Parse the certificate with your <code>asn1/der.py<\/code>, as in assignment 05: one top-level SEQUENCE (<code>Certificate<\/code>) whose first child is another SEQUENCE (<code>tbsCertificate<\/code>). The fields you need are children of <code>tbsCertificate<\/code>, in the order the table on this page gives. Give these two steps functions of their own (<code>certificate_node<\/code> and <code>tbs_fields<\/code> in the Boilerplate): assignments 07 and 08 reuse them.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Walk <code>tbsCertificate<\/code>'s children in order. Skip the first one (version, <code>[0]<\/code>), then serialNumber and signature, and read issuer, validity, subject and subjectPublicKeyInfo: six fields in a fixed order after the version. A seventh child after them, if there is one and it's tagged <code>[3]<\/code>, holds the extensions.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>version<\/code> is <code>[0]<\/code> EXPLICIT: its content is a complete INTEGER node, not the integer's bytes.<\/li><li><code>signature<\/code> inside <code>tbsCertificate<\/code> repeats the outer <code>signatureAlgorithm<\/code>. Count it as a field of its own, so the positions after it line up.<\/li><li><code>critical<\/code> is optional, so <code>extnValue<\/code> is the second child of an <code>Extension<\/code> in some certificates and the third in others. It's the last child in both.<\/li><li><code>extnValue<\/code> is an OCTET STRING whose content bytes are a complete DER structure: parse them a second time, as a buffer of their own.<\/li><li><code>cA BOOLEAN DEFAULT FALSE<\/code> means DER leaves <code>cA<\/code> out when it's false. A BasicConstraints SEQUENCE with only an INTEGER child has <code>cA<\/code> false, and that INTEGER is the path length.<\/li><li>Pad <code>pubx<\/code> and <code>puby<\/code> to the full coordinate width. A coordinate whose first byte is zero comes out shorter without padding, and the checker catches that.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>parse_certificate(cert_bytes):\n    cert = certificate_node(cert_bytes)             # the one top-level SEQUENCE\n    children = cert.children[0].children            # tbsCertificate&#x27;s fields\n    i = 1 if children[0] is context-tag-0 else 0    # skip version if present\n    i += 1                                          # skip serialNumber\n    i += 1                                          # skip signature\n    issuer_cn = read_name_cn(children[i]); i += 1\n    not_before, not_after = read_validity(children[i]); i += 1\n    subject_cn = read_name_cn(children[i]); i += 1\n    curve, (x, y) = read_public_key(children[i]); i += 1\n    ca, pathlen = false, none\n    if i &lt; len(children) and children[i] is context-tag-3:\n        ca, pathlen = read_basic_constraints(children[i])\n    return subject_cn, issuer_cn, not_before, not_after, curve, x, y, ca, pathlen<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a CA certificate with a path length","test":"06-R3-pathlen-1","input":"cert ca 308201763081fea003020102020101300a06082a8648ce3d04030330173115301306035504030c0c4578616d706c652d526f6f74301e170d3235303130313030303030305a170d3236303130313030303030305a301f311d301b06035504030c144578616d706c652d43412d506174686c656e2d313076301006072a8648ce3d020106052b8104002203620004e1623e85fc905a98a7d91c6dc26756f4c066161013d55fa7f7ad67897920f7a685f7bc8dd5ade34e9b1f25b65a9d9e23d97999d8a6638bbaf8def683da109ab03f8030fcd5c939c93a8e56d3ae60979440ee04be5d1288297aa111afebd07bbaa316301430120603551d130101ff040830060101ff020101300a06082a8648ce3d040303036700306402303f51e3de63db3ef3d01bbd44f60d1fd36f0d5ec18414b11dcdd69f3f9d0e8fe911f45d6c16be551aae0e543208537e4e02301895e2b422df6c84e29a69561aca0a7d99fa899950fd26fc130162dd6e0e11d536469c3326458c6e3f9577883571
