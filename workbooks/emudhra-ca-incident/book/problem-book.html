locked-spki\":\n                blocked_spki.add(words[1])\n            elif words[0] == \"distrusted-root\":\n                distrusted_roots.add(words[1])\n            elif words[0] == \"chain\":\n                flush()\n                chain_id, certs = words[1], []\n            elif words[0] == \"cert\":\n                role, spki, root_id = words[1], words[2], words[3]\n                certs.append((role, spki, root_id))\n    flush()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["parsing a small log format","sets"],"text":["parsing a small log format","sets"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["SPKI pinning/blocking","root distrust","CRLSet-style revocation","response speed vs. blast radius"],"text":["SPKI pinning/blocking","root distrust","CRLSet-style revocation","response speed vs. blast radius"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that decides, for each certificate chain it's given, whether anything in it is blocked.<\/p>\n<p>Two independent mechanisms can block a chain:<\/p>\n<ol><li><strong>SPKI blocking.<\/strong> A specific public key, identified by its SPKI hash, is blocked everywhere it appears, in any certificate, no matter which chain it's part of. This is fast to issue and exact: it blocks one exact key and nothing else. This is what Chrome's CRLSet did in the real incident, within hours.<\/li><li><strong>Root distrust.<\/strong> An entire root certificate, identified by an id, is distrusted. Every chain that leads back to that root is blocked, even certificates whose own keys were never individually flagged. This is coarser (it can affect certificates that were never themselves a problem) and was the precautionary step taken in this incident.<\/li><\/ol>\n<p>A chain is blocked by whichever mechanism applies; if a chain's own certificates would trigger both, <strong>SPKI blocking is reported<\/strong>, because it's the more specific, faster-acting mechanism, and it's the one that would have actually been issued first in a response like this one.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these kinds of lines, which may be mixed in any order before and between <code>chain<\/code> blocks:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>blocked-spki &lt;hash&gt;<\/code><\/td><td>Adds one SPKI hash to the blocklist. It applies to every <code>chain<\/code> that follows it, in any certificate, at any position.<\/td><\/tr><tr><td><code>distrusted-root &lt;root-id&gt;<\/code><\/td><td>Adds one root id to the distrust set. It applies to every <code>chain<\/code> that follows it, whenever that chain's own root carries this id.<\/td><\/tr><tr><td><code>chain &lt;id&gt;<\/code><\/td><td>Starts a certificate chain. Every <code>cert<\/code> line after it, until the next <code>chain<\/code> line (or the end of the input), belongs to this chain.<\/td><\/tr><tr><td><code>cert &lt;role&gt; &lt;spki-hash&gt; &lt;root-id&gt;<\/code><\/td><td>One certificate in the current chain. <code>role<\/code> is <code>leaf<\/code>, <code>intermediate<\/code> or <code>root<\/code>, and the certs for one chain are given leaf to root. <code>spki-hash<\/code> is that certificate's public key's SPKI hash. <code>root-id<\/code> is the identifier checked against the distrust set, and is only meaningful for a <code>root<\/code> cert; for a <code>leaf<\/code> or <code>intermediate<\/code> cert it is always the placeholder <code>-<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>This checkpoint is about the blocking policy, not about parsing real certificates (checkpoints 5-9 already cover that): an SPKI hash and a root id are just given directly, as plain hex or word tokens, standing in for what a real chain's DER would carry.<\/p>\n<h3>Output<\/h3>\n<p>For each <code>chain<\/code> block, in input order, write one line:<\/p>\n<pre><code>chain &lt;id&gt; trusted                     nothing in the chain is blocked\nchain &lt;id&gt; blocked spki &lt;role&gt;         the FIRST cert (leaf to root) whose SPKI hash is blocklisted\nchain &lt;id&gt; blocked root &lt;root-id&gt;      the chain&#x27;s root id is in the distrust set, and no SPKI hash matched first<\/code><\/pre>\n<p><code>&lt;id&gt;<\/code> is copied from the input unchanged. The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A chain with nothing blocklisted or distrusted anywhere in it is <code>trusted<\/code>.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A certificate (leaf, intermediate, or root) whose SPKI hash is directly on the blocklist blocks the whole chain: <code>blocked spki &lt;role&gt;<\/code>, naming that certificate, even if nothing else about the chain looks wrong.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A chain whose root id is on the distrust set, with no SPKI hash anywhere in the chain blocklisted, is <code>blocked root &lt;root-id&gt;<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>When a chain's own certificates would trigger both mechanisms (an SPKI hit and a distrusted root), the SPKI block is reported, not the root distrust.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A blocklist or distrust entry that was declared for some other chain's certificates does not affect a chain whose own certificates don't match it.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>blocked-spki<\/code> and <code>distrusted-root<\/code> lines, and <code>chain<\/code>/<code>cert<\/code> blocks, may appear in any order, but a <code>blocked-spki<\/code> or <code>distrusted-root<\/code> line only ever affects chains that come after it.<\/li><li>Every chain has exactly one <code>leaf<\/code>, at least one <code>intermediate<\/code>, and exactly one <code>root<\/code>, leaf to root in that order. An input has at most 8 chains.<\/li><li>Each case has a 10-second limit; this checkpoint does no heavy computation at all.<\/li><li>There are 8 tests: 1 for R1, 3 for R2 (one per role), 1 for R3, 1 for R4, 1 for R5, and 1 end-to-end case with five chains covering every verdict in one input. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p15_blocklist_distrust.py","text":"# Reference solution - checkpoint 15 (Block and distrust). SPOILERS: try it yourself first.\n#\n# Two separate mechanisms, checked in order. SPKI blocking is the finer-grained, faster one (it\n# blocks one exact key, wherever it shows up, the moment it's known to be bad): check it first,\n# scanning the chain leaf to root. Only if nothing in the chain is individually blocklisted does\n# the coarser, precautionary mechanism apply: is the whole hierarchy under this root distrusted.\n\nimport sys\n\n\ndef classify_chain(certs, blocked_spki, distrusted_roots):\n    \"\"\"certs: a list of (role, spki_hash, root_id) tuples, leaf to root. Returns (\"trusted\",),\n    (\"blocked\", \"spki\", role) or (\"blocked\", \"root\", root_id).\"\"\"\n    for role, spki, _root_id in certs:\n        if spki in blocked_spki:\n            return (\"blocked\", \"spki\", role)\n    for role, _spki, root_id in certs:\n        if role == \"root\" and root_id in distrusted_roots:\n            return (\"blocked\", \"root\", root_id)\n    return (\"trusted\",)\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    blocked_spki = set()\n    distrusted_roots = set()\n    lines = []\n    chain_id = None\n    certs = []\n\n    def flush():\n        if chain_id is None:\n            return\n        verdict = classify_chain(certs, blocked_spki, distrusted_roots)\n        if verdict[0] == \"trusted\":\n            lines.append(f\"chain {chain_id} trusted\")\n        else:\n            lines.append(f\"chain {chain_id} blocked {verdict[1]} {verdict[2]}\")\n\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"blocked-spki\":\n                blocked_spki.add(words[1])\n            elif words[0] == \"distrusted-root\":\n                distrusted_roots.add(words[1])\n            elif words[0] == \"chain\":\n                flush()\n                chain_id, certs = words[1], []\n            elif words[0] == \"cert\":\n                role, spki, root_id = words[1], words[2], words[3]\n                certs.append((role, spki, root_id))\n    flush()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"}],"proof":{"passed":8,"total":8,"date":"2026-10-21"},"uses":[]},"read":"<p>This page is complete on its own. eMudhra's <a href=\"https://emudhra.com/en/post/certificate-security-incident#:~:text=Update%201\" target=\"_blank\" rel=\"noopener\">Update 1<\/a> quotes Mozilla's response through OneCRL/NSS. Alongside the browser statements, Google's security blog post, \"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates,\" describes Chrome's response in two parts: blocking the exact compromised keys by their SPKI hash through Chrome's CRLSet, and, separately, removing trust in the affected root entirely as a precaution. This checkpoint models both mechanisms and the difference between them.<\/p>","context":"<p>Checkpoint 13 found a bad key by inspecting it directly. This checkpoint is what happens next, at the scale of a browser trust store: once a bad key (or a bad root) is known, how is trust in it actually withdrawn, for every certificate it ever signed, everywhere.<\/p>","sources":"<ul><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a>, Update 1 (quoting Mozilla's OneCRL/NSS response)<\/li><li>Google Security Blog, \"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates\": Chrome's CRLSet-based SPKI blocking, and the separate decision to remove trust in the affected root<\/li><li>Checkpoint 13 (<code>problems/13-key-linter.md<\/code>): the blocklist concept this checkpoint reuses and extends across a whole chain<\/li><\/ul>","checking":"<pre><code>./check.sh 15                                      run every test\n./check.sh 15 -Case 15-R4-spki-wins-over-root       one test, showing its full input, expected output and your output\n./check.sh 15 -Fresh                               a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 15 -Dispute &lt;id&gt; &quot;why&quot;                  set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  When both could apply to the same chain, the SPKI block is report... .    0 / 1   FAILED\n      x 15-R4-spki-wins-over-root  the intermediate is SPKI-blocklisted AND the root is distrusted: the SPKI block is reported\n          line 1: expected `chain c1 blocked spki intermediate`, got `chain c1 blocked root root-both`\n          likely cause: R4 - When both could apply to the same chain, the SPKI block is reported, not the root distrust\n          expected values from: definitional: two structurally different restatements of the blocking policy, cross-checked before each case is written\n          reproduce: python3 -P tools/run_py.py solutions 15 build/cases/15/15-R4-spki-wins-over-root.in build/cases/15/15-R4-spki-wins-over-root.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Treat this as two completely separate questions, checked in a fixed order: \"does any certificate in this chain have a blocklisted key,\" then, only if the answer is no, \"is this chain's root distrusted.\" Don't try to combine them into one check.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Keep two growing sets as you read the input: blocklisted SPKI hashes, and distrusted root ids. For each chain, scan its certificates leaf to root; the first one whose SPKI hash is in the blocklist decides the verdict. If none match, look at the chain's <code>root<\/code> certificate (there's exactly one) and check its root id against the distrust set.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A <code>blocked-spki<\/code> or <code>distrusted-root<\/code> line only applies to chains that come after it in the input, the same way checkpoint 10's <code>bound<\/code> line works. Don't apply it to earlier chains.<\/li><li>The SPKI check runs first, over every certificate in the chain, not just the root. A key could be compromised whether it belongs to a leaf, an intermediate, or a root.<\/li><li>Only a <code>root<\/code> certificate's <code>root-id<\/code> field means anything; a <code>leaf<\/code> or <code>intermediate<\/code> certificate's third field is always the placeholder <code>-<\/code> and should never be compared against the distrust set.<\/li><li>An entry on either set that doesn't match anything in a particular chain has no effect on that chain. Don't let one chain's problem leak into another's verdict.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>classify_chain(certs, blocked_spki, distrusted_roots):\n    for role, spki, root_id in certs:            # leaf to root\n        if spki in blocked_spki:\n            return (&quot;blocked&quot;, &quot;spki&quot;, role)\n    for role, spki, root_id in certs:\n        if role == &quot;root&quot; and root_id in distrusted_roots:\n            return (&quot;blocked&quot;, &quot;root&quot;, root_id)\n    return (&quot;trusted&quot;,)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"an intermediate's key is blocked everywhere","test":"15-R2-spki-blocked-intermediate","input":"blocked-spki <hash of the compromised intermediate's key>\nchain c1\ncert leaf <leaf's own hash> -\ncert intermediate <the compromised hash> -\ncert root <root's own hash> root-beta","output":"chain c1 blocked spki intermediate","image":null,"explain":"<p>The leaf and root are both fine on their own. The intermediate's exact key is the one that was compromised, and blocking it by SPKI hash catches every chain built on it, immediately, without touching the root at all.<\/p>"},{"label":"Example 2","name":"both mechanisms could apply","test":"15-R4-spki-wins-over-root","input":"blocked-spki <hash>\ndistrusted-root root-both\nchain c1\ncert leaf <hash> -\ncert intermediate <the same blocked hash> -\ncert root <hash> root-both","output":"chain c1 blocked spki intermediate","image":null,"explain":"<p>The root is also on the distrust list, but the SPKI block is reported: it's the more specific finding, and it's the one that answers \"which exact key is bad,\" which is more useful than \"this whole root is under precautionary distrust.\"<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>Neither source describes a single unified \"policy\" the way this checkpoint states one; they describe two separate real actions taken during the same incident. What you built names the distinction between them explicitly: one mechanism that's surgical and fast, another that's broad and precautionary, and a rule for which one to report when both would apply.<\/p>\n<p><strong>Something to look for:<\/strong> this checkpoint is also the last one in the workbook that's purely about policy, not cryptography. Checkpoint 16 is the capstone: it asks you to put the earlier checkpoints' pieces together into one audit over a small, synthetic PKI.<\/p>"}},{"id":"16","num":"16","title":"Audit a PKI","difficulty":"Hard","tests":12,"solution":"solutions/p16_audit_pki.py","problem":"problems/16-audit-pki.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 16 - Audit a PKI\n#\n# Problem:  problems/16-audit-pki.md (also in the web problem book)\n# Check:    ./check.sh 16\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 16 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p16_audit_pki.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 16 - Audit a PKI\n#\n# Problem:  problems/16-audit-pki.md (also in the web problem book)\n# Check:    ./check.sh 16\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on the four functions above it.\n#\n# Your own code from earlier checkpoints can go in solutions/common/ and is imported with\n# `import common.<module>`. This is the capstone: everything you need is in checkpoints 5-15.\n\nimport sys\n\nCURVES = {\n    \"P-256\": {},\n    \"P-384\": {},\n}\nWEAK_BOUND = 4096\n\n\ndef lint_key(curve, x, y, blocklist):\n    \"\"\"Return None if the key is fine, or one of \"off-curve\", \"known-compromised\", \"weak\" (the\n    first that applies, in that priority order). blocklist: a set of (curve, x, y) tuples.\"\"\"\n    # TODO: on-curve check (checkpoint 2's curve equation), then the blocklist, then checkpoint\n    # 10's bounded search for a small private key.\n    raise NotImplementedError(\"lint_key\")\n\n\ndef parse_certificate(cert_bytes):\n    \"\"\"Return an object with the fields checkpoint 6 reads (curve, pubx, puby, ca, pathlen,\n    tbs_bytes, sig_r, sig_s) - reuse your own checkpoints 5/6/8 code.\"\"\"\n    raise NotImplementedError(\"parse_certificate\")\n\n\ndef validate_chain(keys_by_id, cert_ids, anchor_ids):\n    \"\"\"keys_by_id: id -> (curve, x, y, cert-or-None). cert_ids: leaf-first, certs only (no\n    anchor among them). anchor_ids: every anchor declared in this PKI - the topmost cert must be\n    signed by ANY of them (checkpoint 9's \"try each\" rule). Return (True, None, matched_anchor)\n    or (False, reason, matched_anchor-or-None) - checkpoint 9's rules, plus which anchor (if\n    any) actually signed the topmost cert, for blast_radius to use.\"\"\"\n    # TODO: same checks as checkpoint 9, but the topmost cert's signer isn't one named id - try\n    # every id in anchor_ids and take the first that verifies.\n    raise NotImplementedError(\"validate_chain\")\n\n\ndef blast_radius(chains, matched_anchors):\n    \"\"\"chains: list of (chain_id, [cert ids leaf-first]). matched_anchors: chain_id -> the\n    anchor id that actually signed its topmost cert, or None. Return id -> list of chain ids\n    that depend on it: a cert at position >= 1 in some chain's own list, or an anchor that\n    actually verified some chain's topmost cert.\"\"\"\n    # TODO: for every cert id that appears at position >= 1 in some chain, and every anchor id\n    # that matched_anchors names for some chain, collect every chain that depends on it.\n    raise NotImplementedError(\"blast_radius\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    blocklist = set()\n    keys_by_id = {}\n    key_order = []\n    chains = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            kw = words[0]\n            if kw == \"blocklist\":\n                blocklist.add((words[1], int(words[2], 16), int(words[3], 16)))\n            elif kw == \"anchor\":\n                _, aid, curve, x, y = words\n                keys_by_id[aid] = (curve, int(x, 16), int(y, 16), None)\n                key_order.append(aid)\n            elif kw == \"cert\":\n                _, cid, hexdata = words\n                cert = parse_certificate(bytes.fromhex(hexdata))\n                keys_by_id[cid] = (cert.curve, cert.pubx, cert.puby, cert)\n                key_order.append(cid)\n            elif kw == \"chain\":\n                chains.append((words[1], words[2:]))\n\n    anchor_ids = [kid for kid in key_order if keys_by_id[kid][3] is None]\n\n    lines = []\n    for kid in key_order:\n        curve, x, y, _ = keys_by_id[kid]\n        reason = lint_key(curve, x, y, blocklist)\n        lines.append(f\"key {kid} {reason or 'ok'}\")\n    matched_anchors = {}\n    for chain_id, ids in chains:\n        ok, reason, matched = validate_chain(keys_by_id, ids, anchor_ids)\n        matched_anchors[chain_id] = matched\n        lines.append(f\"chain {chain_id} trusted\" if ok else f\"chain {chain_id} untrusted {reason}\")\n    exposed = blast_radius(chains, matched_anchors)\n    for kid in key_order:\n        if kid in exposed and exposed[kid]:\n            lines.append(f\"exposed {kid} \" + \" \".join(exposed[kid]))\n\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["graphs built from dictionaries","structured state"],"text":["graphs built from dictionaries","structured state"]},{"label":"Library","items":["none needed beyond what checkpoints 5-13 already use"],"text":["none needed beyond what checkpoints 5-13 already use"]},{"label":"Concepts","items":["key linting","chain validation","blast radius"],"text":["key linting","chain validation","blast radius"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that audits a small PKI: every key gets linted, every chain gets validated, and every key that signs something gets a report of which chains depend on it.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p16_audit_pki.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p16_audit_pki.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>lint_key()<\/code>, <code>parse_certificate()<\/code>, <code>validate_chain()<\/code> and <code>blast_radius()<\/code>.<\/p>\n<h3>The three things you report<\/h3>\n<ol><li><strong>Lint every key<\/strong>, anchors included, with checkpoint 13's three checks in the same priority order: off-curve, known-compromised (on a blocklist), weak (a small private key, found by checkpoint 10's bounded search).<\/li><li><strong>Validate every chain<\/strong>, with three of checkpoint 9's four checks, in the same order: signatures, CA permission, path length. This checkpoint's input has no <code>now<\/code> line, so there is nothing to check a certificate's validity window against: checkpoint 9 already covers that check thoroughly, and repeating it here would test the same thing twice, not teach anything new. One difference from checkpoint 9's other three checks: a chain here never names one specific anchor. Its topmost certificate must be signed by <strong>any<\/strong> anchor declared anywhere in this PKI, exactly like checkpoint 9's \"try each\" rule for multiple anchors, just applied across the whole PKI instead of one chain at a time.<\/li><li><strong>Report blast radius.<\/strong> For every key that occupies a signer's position in some chain - an intermediate or anchor one step above a leaf or another intermediate - report every chain that depends on it. This is structural: it's about where a key sits in a chain's list, not whether every signature along that chain turned out to actually verify. A certificate that claims an issuer but didn't really get signed by it (<code>bad-signature<\/code>) still names that issuer as part of its structure, and the issuer still gets an <code>exposed<\/code> line for that chain - knowing a chain depends on a forged link is exactly the kind of thing an audit should surface, not hide. A leaf's own key never gets a report: nothing is signed with it.<\/li><\/ol>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains, in any order except as noted:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>blocklist &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>A known-compromised public key. Applies to every key declared after it (checkpoint 13's rule).<\/td><\/tr><tr><td><code>anchor &lt;id&gt; &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>A trust anchor: a public key the verifier already trusts, no certificate of its own. <code>id<\/code> is a word with no spaces, unique across every <code>anchor<\/code> and <code>cert<\/code> line.<\/td><\/tr><tr><td><code>cert &lt;id&gt; &lt;hex&gt;<\/code><\/td><td>A full DER certificate, same format as checkpoints 6-9.<\/td><\/tr><tr><td><code>chain &lt;chain-id&gt; &lt;id&gt; &lt;id&gt; ...<\/code><\/td><td>A chain: certificate ids only, leaf first, most-senior last. <strong>No anchor id appears here<\/strong> - the topmost certificate's signer is found among every declared anchor, not named in the chain.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Every <code>anchor<\/code> and <code>cert<\/code> line must come before any <code>chain<\/code> line that uses its id.<\/p>\n<h3>Output<\/h3>\n<p>Three kinds of line, in this order:<\/p>\n<pre><code>key &lt;id&gt; &lt;ok|off-curve|known-compromised|weak&gt;\nchain &lt;chain-id&gt; &lt;trusted|untrusted &lt;reason&gt;&gt;\nexposed &lt;id&gt; &lt;chain-id&gt; &lt;chain-id&gt; ...<\/code><\/pre>\n<ul><li>One <code>key<\/code> line per declared <code>anchor<\/code> or <code>cert<\/code>, in input order.<\/li><li>One <code>chain<\/code> line per <code>chain<\/code> block, in input order. <code>&lt;reason&gt;<\/code> is one of <code>bad-signature<\/code>, <code>unknown-anchor<\/code>, <code>not-a-ca<\/code>, <code>path-too-long<\/code> - four of checkpoint 9's five words. <code>expired<\/code> never appears here: this checkpoint has no <code>now<\/code> line, so there is nothing to check a certificate's validity window against (see \"Validate every chain\" above).<\/li><li>One <code>exposed<\/code> line per key that occupies a signer's position in <strong>some<\/strong> chain (structurally, as above), in input order, listing every chain id that depends on it (space-separated, in the order those chains were declared). A key nothing depends on gets no <code>exposed<\/code> line at all - not even an empty one.<\/li><\/ul>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also shows which requirement it was written to cover.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Every key is linted, anchors included, in input order: off-curve, known-compromised, weak or ok, in that priority. A key that is both weak and blocklisted reports known-compromised, because that check runs first.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Every chain is validated in input order, with three of checkpoint 9's checks (signatures, CA permission, path length - not validity, which this checkpoint has no <code>now<\/code> line to check against) and four of its reason words, except that the topmost certificate's signer is any declared anchor, not one named in the chain.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Every key that occupies a signer's position in at least one chain gets an <code>exposed<\/code> line listing every chain that depends on it. A leaf's own key gets none.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A key shared by two chains (the same intermediate, or the same anchor, signs both) is exposed by both - the actual blast-radius lesson: one compromised key can threaten more than one chain at once.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Both curves' keys lint correctly. Full chain validation in this checkpoint is P-384 only, matching checkpoints 6-9's own scope (a P-256 certificate would need SHA-256 instead of SHA-384); a P-256 key here is linted but never put in a chain.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate is P-384, matching checkpoints 6-9's scope. A P-256 key may appear as an <code>anchor<\/code> or a standalone <code>cert<\/code> for linting, but never inside a <code>chain<\/code> line.<\/li><li>Ids (<code>anchor<\/code> and <code>cert<\/code> together) are unique within one input. A <code>chain<\/code> line's ids all refer to already-declared <code>cert<\/code> lines.<\/li><li>There is no <code>now<\/code> line and no <code>expired<\/code> reason in this checkpoint: validity was already checkpoint 9's lesson, and this checkpoint's own new idea is blast radius, not a repeat of that check.<\/li><li>Each case has a 10-second limit. Checkpoint 10's bounded search (used for linting) is the same budget as checkpoint 13's, not a larger one.<\/li><li>There are 12 tests: the examples above, both curves, a key that's both weak and blocklisted (R1), every checkpoint-9-style reason reached through this checkpoint's own \"any anchor\" rule (R2), a 2-level chain confirming a leaf gets no <code>exposed<\/code> line (R3), and an end-to-end PKI shaped like the real incident: one root, a weak intermediate signing two leaves, a strong intermediate signing a third. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p16_audit_pki.py","text":"# Reference solution - checkpoint 16 (Audit a PKI). SPOILERS: try it yourself first.\n#\n# This is the capstone: it combines checkpoint 13's key linting, checkpoint 9's chain\n# validation, and one new idea, blast radius - for every key that signs something else in this\n# PKI, which chains would stop being trusted if that key turned out to be compromised. That last\n# question is exactly what eMudhra, Mozilla and Chrome all had to answer within hours of\n# disclosure: not just \"is this key bad,\" but \"what does it reach.\"\n\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[2] / \"tools\"))\nimport curves as _curves  # noqa: E402\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\nfrom common.certlib import parse_certificate, verify_ecdsa_sha384  # noqa: E402\n\nWEAK_BOUND = 4096  # same toy budget as checkpoint 13, for the same reason: see its problem page\n\nCURVES = {name: {\"p\": c[\"p\"], \"a\": c[\"p\"] - 3, \"gx\": c[\"gx\"], \"gy\": c[\"gy\"]} for name, c in _curves.CURVES.items()}\n\n\ndef on_curve(curve, x, y):\n    c = CURVES[curve]\n    p, a, b = c[\"p\"], c[\"a\"], _curves.CURVES[curve][\"b\"]\n    return (y * y - (x ** 3 + a * x + b)) % p == 0\n\n\ndef point_add(p, a, point, other):\n    x1, y1 = point\n    x2, y2 = other\n    if (x1, y1) == (x2, y2):\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p\n    x3 = (slope * slope - x1 - x2) % p\n    return x3, (slope * (x1 - x3) - y1) % p\n\n\ndef find_small_private_key(curve, x, y, bound):\n    c = CURVES[curve]\n    p, a = c[\"p\"], c[\"a\"]\n    point = (c[\"gx\"], c[\"gy\"])\n    target = (x, y)\n    for d in range(1, bound + 1):\n        if point == target:\n            return d\n        point = point_add(p, a, point, (c[\"gx\"], c[\"gy\"]))\n    return None\n\n\ndef lint_key(curve, x, y, blocklist):\n    \"\"\"Same three checks and priority order as checkpoint 13, applied here to every key in the\n    PKI, anchors included.\"\"\"\n    if not on_curve(curve, x, y):\n        return \"off-curve\"\n    if (curve, x, y) in blocklist:\n        return \"known-compromised\"\n    if find_small_private_key(curve, x, y, WEAK_BOUND) is not None:\n        return \"weak\"\n    return None\n\n\ndef validate_chain(keys_by_id, cert_ids, anchor_ids):\n    \"\"\"cert_ids: leaf-first, certs only (no anchor among them). anchor_ids: every anchor\n    declared anywhere in this PKI - the topmost cert is checked against each of them, and any\n    match is enough (checkpoint 9's \"try each\" rule, applied across the whole PKI instead of one\n    chain at a time). keys_by_id: id -> (curve, x, y, cert-or-None).\n    Returns (True, None, matched_anchor_id) or (False, reason, matched_anchor_id-or-None): the\n    matched anchor is which one actually signed the topmost cert, for blast-radius purposes,\n    even if a later check still rejects the chain.\"\"\"\n    certs = [keys_by_id[i] for i in cert_ids]\n    for i in range(len(certs) - 1):\n        signer_curve, signer_x, signer_y, _ = certs[i + 1]\n        _, _, _, leaf_cert = certs[i]\n        if not verify_ecdsa_sha384(signer_curve, signer_x, signer_y, leaf_cert.tbs_bytes,\n                                    leaf_cert.sig_r, leaf_cert.sig_s):\n            return False, \"bad-signature\", None\n    _, _, _, top_cert = certs[-1]\n    matched = next((aid for aid in anchor_ids\n                     if verify_ecdsa_sha384(*keys_by_id[aid][:3], top_cert.tbs_bytes,\n                                             top_cert.sig_r, top_cert.sig_s)), None)\n    if matched is None:\n        return False, \"unknown-anchor\", None\n    for i in range(1, len(certs)):\n        _, _, _, cert = certs[i]\n        if not cert.ca:\n            return False, \"not-a-ca\", matched\n    for i in range(1, len(certs)):\n        _, _, _, cert = certs[i]\n        if cert.pathlen is not None and (i - 1) > cert.pathlen:\n            return False, \"path-too-long\", matched\n    return True, None, matched\n\n\ndef blast_radius(chains, matched_anchors):\n    \"\"\"chains: list of (chain_id, [cert ids leaf-first]). matched_anchors: chain_id -> the\n    anchor id that actually signed its topmost cert, or None. Returns id -> sorted list of\n    chain ids that depend on it: a cert at position >= 1 in some chain's own list (a signer,\n    not the leaf), or an anchor that actually verified some chain's topmost cert.\"\"\"\n    exposed = {}\n    for chain_id, ids in chains:\n        for signer_id in ids[1:]:\n            exposed.setdefault(signer_id, []).append(chain_id)\n        anchor_id = matched_anchors.get(chain_id)\n        if anchor_id is not None:\n            exposed.setdefault(anchor_id, []).append(chain_id)\n    return exposed\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    bound = WEAK_BOUND\n    blocklist = set()\n    keys_by_id = {}       # id -> (curve, x, y, Certificate-or-None)\n    key_order = []        # ids in the order they were declared, for the `key` lines\n    chains = []            # (chain_id, [ids])\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            kw = words[0]\n            if kw == \"blocklist\":\n                blocklist.add((words[1], int(words[2], 16), int(words[3], 16)))\n            elif kw == \"anchor\":\n                _, aid, curve, x, y = words\n                keys_by_id[aid] = (curve, int(x, 16), int(y, 16), None)\n                key_order.append(aid)\n            elif kw == \"cert\":\n                _, cid, hexdata = words\n                cert = parse_certificate(bytes.fromhex(hexdata))\n                keys_by_id[cid] = (cert.curve, cert.pubx, cert.puby, cert)\n                key_order.append(cid)\n            elif kw == \"chain\":\n                chains.append((words[1], words[2:]))\n\n    anchor_ids = [kid for kid in key_order if keys_by_id[kid][3] is None]\n\n    lines = []\n    for kid in key_order:\n        curve, x, y, _ = keys_by_id[kid]\n        reason = lint_key(curve, x, y, blocklist)\n        lines.append(f\"key {kid} {reason or 'ok'}\")\n    matched_anchors = {}\n    for chain_id, ids in chains:\n        ok, reason, matched = validate_chain(keys_by_id, ids, anchor_ids)\n        matched_anchors[chain_id] = matched\n        lines.append(f\"chain {chain_id} trusted\" if ok else f\"chain {chain_id} untrusted {reason}\")\n    exposed = blast_radius(chains, matched_anchors)\n    for kid in key_order:\n        if kid in exposed:\n            lines.append(f\"exposed {kid} \" + \" \".join(exposed[kid]))\n\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"},{"path":"common/certlib.py","text":"\"\"\"Hand-written X.509 certificate reading and ECDSA verification, built on common/der.py.\nShared by the reference solutions for checkpoints 06-09. SPOILERS: try the checkpoints yourself\nfirst.\n\nNo `cryptography.x509` parsing and no library ECDSA verification here: every field is read with\ncommon/der.py's TLV walker, and signatures are checked with plain modular arithmetic (the same\npoint-addition formulas checkpoint 10 uses, run the other direction: multiply instead of search).\nThe curve constants (p, n, Gx, Gy) are reused from tools/curves.py rather than retyped.\n\"\"\"\n\nimport hashlib\nimport sys\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom . import der\n\n# tools/curves.py holds the OpenSSL-verified curve constants; reuse its numbers instead of\n# retyping them (the generators already prove them correct via curves.verify()).\n_ROOT = Path(__file__).resolve().parents[3]\nsys.path.insert(0, str(_ROOT / \"tools\"))\nimport curves as _curves  # noqa: E402\n\nCURVES = {name: {\"p\": c[\"p\"], \"n\": c[\"n\"], \"gx\": c[\"gx\"], \"gy\": c[\"gy\"]} for name, c in _curves.CURVES.items()}\n\nID_EC_PUBLIC_KEY = \"1.2.840.10045.2.1\"\nCURVE_OIDS = {\"1.2.840.10045.3.1.7\": \"P-256\", \"1.3.132.0.34\": \"P-384\"}\nCOMMON_NAME_OID = \"2.5.4.3\"\nBASIC_CONSTRAINTS_OID = \"2.5.29.19\"\nECDSA_SHA384_OID = \"1.2.840.10045.4.3.3\"\n\n\n# ---- Reading one field at a time (each takes the relevant DER node) --------------------------\n\ndef read_name_cn(name_node: der.Node):\n    \"\"\"Name ::= SEQUENCE OF RelativeDistinguishedName (SET OF {type, value}). Returns the\n    commonName attribute's value as text, or None if the name has no commonName.\"\"\"\n    for rdn in name_node.children:                 # RelativeDistinguishedName: SET OF ...\n        for atv in rdn.children:                    # AttributeTypeAndValue: SEQUENCE { type, value }\n            attr_type, value = atv.children\n            if der.decode_oid(attr_type.content) == COMMON_NAME_OID:\n                return value.content.decode(\"utf-8\")\n    return None\n\n\ndef read_validity(validity_node: der.Node):\n    \"\"\"Validity ::= SEQUENCE { notBefore Time, notAfter Time }. Time is UTCTime or\n    GeneralizedTime; both are printed here exactly as they appear (this isn't a date checkpoint).\"\"\"\n    not_before, not_after = validity_node.children\n    return not_before.content.decode(\"ascii\"), not_after.content.decode(\"ascii\")\n\n\ndef read_spki(spki_node: der.Node):\n    \"\"\"SubjectPublicKeyInfo ::= SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT\n    STRING }. Returns (curve name, x, y) for an uncompressed EC point (0x04 || x || y).\"\"\"\n    algorithm, public_key_bits = spki_node.children\n    alg_oid_node, curve_oid_node = algorithm.children\n    if der.decode_oid(alg_oid_node.content) != ID_EC_PUBLIC_KEY:\n        raise ValueError(\"subjectPublicKeyInfo algorithm is not id-ecPublicKey\")\n    curve_oid = der.decode_oid(curve_oid_node.content)\n    if curve_oid not in CURVE_OIDS:\n        raise ValueError(f\"unrecognised curve OID {curve_oid}\")\n    curve = CURVE_OIDS[curve_oid]\n    _unused, point = der.decode_bit_string(public_key_bits.content)\n    if not point or point[0] != 0x04:\n        raise ValueError(\"expected an uncompressed EC point (0x04 || x || y)\")\n    coord_len = (len(point) - 1) // 2\n    x = int.from_bytes(point[1:1 + coord_len], \"big\")\n    y = int.from_bytes(point[1 + coord_len:], \"big\")\n    return curve, x, y\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"The raw subjectPublicKeyInfo node of a certificate, untouched (checkpoint 07 hashes its\n    exact original bytes - the whole nested SEQUENCE, not just the key bytes inside it).\"\"\"\n    top = der.parse_all(cert_bytes)\n    tbs = top[0].children[0]\n    children = tbs.children\n    i = 1 if children and children[0].cls == \"context\" and children[0].tag == 0 else 0\n    return children[i + 5]  # serialNumber, signature, issuer, validity, subject, then spki\n\n\ndef read_basic_constraints(extensions_wrapper: der.Node):\n    \"\"\"extensions_wrapper is the [3] EXPLICIT context node wrapping `Extensions ::= SEQUENCE OF\n    Extension`. Returns (ca, pathlen). Extension ::= SEQUENCE { extnID, critical BOOLEAN DEFAULT\n    FALSE OPTIONAL, extnValue OCTET STRING }, so extnValue is always the extension's last field.\"\"\"\n    extensions_seq = extensions_wrapper.children[0]\n    for extension in extensions_seq.children:\n        extn_id = der.decode_oid(extension.children[0].content)\n        if extn_id != BASIC_CONSTRAINTS_OID:\n            continue\n        extn_value = extension.children[-1]          # OCTET STRING: itself DER-encoded again\n        bc_seq = der.parse_all(extn_value.content)[0]  # BasicConstraints ::= SEQUENCE { cA, pathLen }\n        ca, idx = False, 0\n        if bc_seq.children and bc_seq.children[0].tag == der.BOOLEAN:\n            ca = bc_seq.children[0].content[0] != 0\n            idx = 1\n        pathlen = der.decode_integer(bc_seq.children[idx].content) if len(bc_seq.children) > idx else None\n        return ca, pathlen\n    return False, None  # BasicConstraints absent: RFC 5280 4.2.1.9 default is \"not a CA\"\n\n\n# ---- A whole certificate -----------------------------------------------------------------\n\n@dataclass\nclass Certificate:\n    tbs_bytes: bytes          # the exact original bytes of tbsCertificate, for re-hashing\n    serial: int\n    issuer_cn: str\n    subject_cn: str\n    not_before: str\n    not_after: str\n    curve: str\n    pubx: int\n    puby: int\n    ca: bool\n    pathlen: object           # int, or None if there is no path length constraint\n    sig_alg_oid: str\n    sig_r: int\n    sig_s: int\n\n\ndef parse_certificate(cert_bytes: bytes) -> Certificate:\n    \"\"\"Certificate ::= SEQUENCE { tbsCertificate, signatureAlgorithm, signatureValue }.\"\"\"\n    top = der.parse_all(cert_bytes)\n    if len(top) != 1 or top[0].tag != der.SEQUENCE or not top[0].constructed:\n        raise ValueError(\"a certificate is exactly one top-level SEQUENCE\")\n    cert = top[0]\n    if len(cert.children) != 3:\n        raise ValueError(\"a Certificate has exactly 3 fields: tbsCertificate, \"\n                          \"signatureAlgorithm, signatureValue\")\n    tbs_node, sig_alg_node, sig_value_node = cert.children\n    tbs_bytes = cert_bytes[tbs_node.start: tbs_node.start + tbs_node.total_len]\n\n    children = tbs_node.children\n    i = 0\n    if children and children[i].cls == \"context\" and children[i].tag == 0:\n        i += 1  # version [0] EXPLICIT INTEGER; every certificate here is v3, so its value is fixed\n    serial = der.decode_integer(children[i].content); i += 1\n    i += 1  # signature: AlgorithmIdentifier, repeating the outer signatureAlgorithm; not needed again\n    issuer_cn = read_name_cn(children[i]); i += 1\n    not_before, not_after = read_validity(children[i]); i += 1\n    subject_cn = read_name_cn(children[i]); i += 1\n    curve, pubx, puby = read_spki(children[i]); i += 1\n    ca, pathlen = False, None\n    if i < len(children) and children[i].cls == \"context\" and children[i].tag == 3:\n        ca, pathlen = read_basic_constraints(children[i])\n\n    sig_alg_oid = der.decode_oid(sig_alg_node.children[0].content)\n    _unused, sig_der_bytes = der.decode_bit_string(sig_value_node.content)\n    sig_seq = der.parse_all(sig_der_bytes)[0]          # ECDSA-Sig-Value ::= SEQUENCE { r, s }\n    sig_r = der.decode_integer(sig_seq.children[0].content)\n    sig_s = der.decode_integer(sig_seq.children[1].content)\n\n    return Certificate(tbs_bytes, serial, issuer_cn, subject_cn, not_before, not_after,\n                        curve, pubx, puby, ca, pathlen, sig_alg_oid, sig_r, sig_s)\n\n\n# ---- Elliptic-curve point arithmetic and ECDSA verification (hand modular arithmetic) --------\n\ndef point_add(p: int, a: int, point, other):\n    \"\"\"Affine point addition on y^2 = x^3 + a*x + b (mod p). Either point may be None (the\n    point at infinity, the addition identity).\"\"\"\n    if point is None:\n        return other\n    if other is None:\n        return point\n    x1, y1 = point\n    x2, y2 = other\n    if x1 == x2:\n        if (y1 + y2) % p == 0:\n            return None  # point and its negation: the sum is the point at infinity\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # tangent slope (doubling)\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p          # chord slope\n    x3 = (slope * slope - x1 - x2) % p\n    y3 = (slope * (x1 - x3) - y1) % p\n    return x3, y3\n\n\ndef scalar_mult(p: int, a: int, n: int, k: int, point):\n    \"\"\"k * point, by double-and-add. point may be None (gives None back).\"\"\"\n    k %= n\n    if k == 0 or point is None:\n        return None\n    result = None\n    addend = point\n    while k:\n        if k & 1:\n            result = point_add(p, a, result, addend)\n        addend = point_add(p, a, addend, addend)\n        k >>= 1\n    return result\n\n\ndef verify_ecdsa_sha384(curve_name: str, pubx: int, puby: int, message: bytes, r: int, s: int) -> bool:\n    \"\"\"Checks an ECDSA signature (r, s) over SHA-384(message) against public key (pubx, puby).\n    This workbook's incident uses P-384 keys with ecdsa-with-SHA384 throughout, so the hash is\n    fixed here; a P-256 certificate would use SHA-256 instead (out of scope for this checkpoint).\"\"\"\n    c = CURVES[curve_name]\n    p, a, n, gx, gy = c[\"p\"], c[\"p\"] - 3, c[\"n\"], c[\"gx\"], c[\"gy\"]\n    if not (1 <= r < n and 1 <= s < n):\n        return False\n    digest = hashlib.sha384(message).digest()\n    z = int.from_bytes(digest, \"big\")\n    n_bits = n.bit_length()\n    if 8 * len(digest) > n_bits:\n        z >>= 8 * len(digest) - n_bits\n    w = pow(s, -1, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    point = point_add(p, a, scalar_mult(p, a, n, u1, (gx, gy)), scalar_mult(p, a, n, u2, (pubx, puby)))\n    if point is None:\n        return False\n    x, _y = point\n    return x % n == r\n"}],"proof":{"passed":12,"total":12,"date":"2026-10-21"},"uses":[]},"read":"<p>This is the capstone: it has no new source material of its own. Everything it asks for is a combination of checkpoints 6, 9, 10 and 13, applied to a small public key infrastructure (PKI) instead of one key or one chain at a time. If you want the story behind it, eMudhra's <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">statement<\/a> is still the one to read.<\/p>","context":"<p>Every earlier checkpoint in this workbook answered one question about one key or one chain. This one asks the question a real incident response actually has to answer: across an entire PKI, which keys are bad, which chains are trusted, and if a given key turned out to be compromised, <strong>which chains would that actually break<\/strong>? That last question, blast radius, is new: it's exactly what eMudhra, Mozilla and Chrome had to work out within hours of disclosure, not just \"is this key bad\" but \"what does it reach.\"<\/p>","sources":"<ul><li>Every earlier checkpoint in this workbook, especially 6, 9, 10 and 13<\/li><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a><\/li><\/ul>","checking":"<pre><code>./check.sh 16                              run every test\n./check.sh 16 -Case 16-R2-unknown-anchor   one test, showing its full input, expected output and your output\n./check.sh 16 -Fresh                       a new set of tests (new random seed)\n./check.sh 16 -Dispute &lt;id&gt; &quot;why&quot;          set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R1  Every key is linted (anchors included), in input order: off-curve... .    4 / 5   FAILED\n      x 16-R1-priority  a key that is both weak (d=56) and on the blocklist: known-compromised wins (checked first)\n          line 2: expected `key weak-and-blocked known-compromised`, got `key weak-and-blocked weak`\n          likely cause: R1 - Every key is linted (anchors included), in input order: off-curve, known-compromised, weak or ok, in that priority - same rules as checkpoint 13\n          expected values from: cryptography 41.0.7 / OpenSSL (key checks and openssl verify): independent of this checkpoint&#x27;s own lint, chain and blast-radius logic\n          reproduce: python3 -P tools/run_py.py solutions 16 build/cases/16/16-R1-priority.in build/cases/16/16-R1-priority.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Nothing here is new arithmetic. <code>lint_key<\/code> is checkpoint 13's function, unchanged. <code>parse_certificate<\/code> is checkpoint 6's field reading (plus checkpoint 8's <code>tbs_bytes<\/code>, <code>sig_r<\/code>, <code>sig_s<\/code>, which <code>validate_chain<\/code> needs). The only genuinely new piece is <code>blast_radius<\/code>, and that's bookkeeping, not cryptography.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Keep every declared key (anchor or cert) in one lookup from id to its curve, x, y and - for certs only - its parsed certificate. Lint every one of them up front. For each chain, walk its certificate ids exactly like checkpoint 9, except the very last step: instead of checking one named anchor, loop over every declared anchor and stop at the first one that verifies. Remember <em>which<\/em> anchor matched (or that none did) - you need that for blast radius, not just for the chain's own <code>trusted<\/code>/<code>untrusted<\/code> line.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>The priority order for linting is off-curve, then known-compromised, then weak. A key that's both weak and blocklisted must report known-compromised.<\/li><li>\"Any declared anchor\" means looping over all of them for the topmost certificate, not stopping at the first one declared - a chain can validate against an anchor that comes after an unrelated one in the input.<\/li><li>Blast radius counts a cert's signer position (every id in a chain's list except the leaf, position 0) <strong>and<\/strong> whichever anchor actually verified the topmost cert - both contribute <code>exposed<\/code> lines, not just the certs.<\/li><li>A chain that fails at \"unknown-anchor\" contributes no anchor <code>exposed<\/code> line (no anchor verified it), but its intermediates still do, if it has any - exposure from a mid-chain signature is about structure, not about whether the chain ultimately validates.<\/li><li>Don't give a key an <code>exposed<\/code> line with an empty list. If nothing depends on it, leave it out entirely.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>for each declared key (anchor or cert), in order:\n    print &quot;key&quot;, id, lint_key(curve, x, y, blocklist) or &quot;ok&quot;\n\nmatched = {}  # chain_id -&gt; which anchor verified it, or none\nfor each chain, in order:\n    certs = [parsed cert for each id in the chain]\n    ok = true\n    for i in 0 .. len(certs) - 2:\n        if not signed_by(certs[i], certs[i+1]): ok = false, reason = &quot;bad-signature&quot;; break\n    if ok:\n        matched[chain_id] = first anchor whose key verifies certs[-1], or none\n        if matched[chain_id] is none: ok = false, reason = &quot;unknown-anchor&quot;\n    if ok:\n        for cert in certs[1:]: if not cert.ca: ok = false, reason = &quot;not-a-ca&quot;; break\n    if ok:\n        for i in 1 .. len(certs)-1: if path length violated: ok = false, reason = &quot;path-too-long&quot;; break\n    # no validity step here: there is no &quot;now&quot; in this checkpoint&#x27;s input (checkpoint 9 covers it)\n    print &quot;chain&quot;, chain_id, &quot;trusted&quot; if ok else &quot;untrusted &quot; + reason\n\nexposed = {}  # id -&gt; [chain ids]\nfor each chain:\n    for id in chain.ids[1:]: exposed[id].append(chain_id)       # certs that signed something\n    if matched[chain_id] is not none: exposed[matched[chain_id]].append(chain_id)  # the anchor\nfor each declared key, in order:\n    if id in exposed: print &quot;exposed&quot;, id, *exposed[id]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"an anchor key off the curve, alongside a clean chain","test":"16-R1-off-curve","input":"anchor off-curve-anchor P-384 f3ef666c9d167c1b012da9b0343fe017dec1597a2ef6fdbcd6a03ed878e09e499a05b8b3bd035fd09efe358b97a62de7 f69e63e4fc03a6fbfe16d399f5c0dcfa4a1ca59209a7591488e99540bc0796ceadabd4282cf42c9425ffaabe89396787\nanchor root1 P-384 f3ef666c9d167c1b012da9b0343fe017dec1597a2ef6fdbcd6a03ed878e09e499a05b8b3bd035fd09efe358b97a62de7 f69e63e4fc03a6fbfe16d399f5c0dcfa4a1ca59209a7591488e99540bc0796ceadabd4282cf42c9425ffaabe89396786\ncert leaf1 <hex, a certificate issued by root1>\nchain c1 leaf1","output":"key off-curve-anchor off-curve\nkey root1 ok\nkey leaf1 ok\nchain c1 trusted\nexposed root1 c1","image":null,"explain":"<p><code>off-curve-anchor<\/code> has the same x as <code>root1<\/code> but y shifted by 1, so it fails the curve equation. It isn't used by any chain, but every declared key still gets linted. <code>root1<\/code> really does sign <code>leaf1<\/code>, so the chain is trusted against it, and <code>root1<\/code> picks up an <code>exposed<\/code> line.<\/p>"},{"label":"Example 2","name":"the recovered incident value","test":"16-R1-weak-d4","input":"anchor root2 P-384 <...>\ncert int-weak <hex, a CA certificate issued by root2, private key d=4>\ncert leaf-under-weak <hex, issued by int-weak>\nchain c1 leaf-under-weak int-weak","output":"key root2 ok\nkey int-weak weak\nkey leaf-under-weak ok\nchain c1 trusted\nexposed root2 c1\nexposed int-weak c1","image":null,"explain":"<p><code>int-weak<\/code>'s private key is exactly 4, the value checkpoint 10 recovers for the real incident's example key. The chain is still structurally <code>trusted<\/code> - linting and chain validation are separate questions - but <code>int-weak<\/code>'s own <code>key<\/code> line, and its <code>exposed<\/code> line, are exactly what this checkpoint is for: knowing both that the key is bad and what depends on it.<\/p>"},{"label":"Example 3","name":"the leaf's real signer was never declared","test":"16-R2-unknown-anchor","input":"anchor rootF P-384 <...>\ncert leafF <hex, issued by \"Unrelated-Root\", a key never declared as an anchor here>\nchain c-unknown leafF","output":"key rootF ok\nkey leafF ok\nchain c-unknown untrusted unknown-anchor","image":null,"explain":"<p><code>leafF<\/code> is a perfectly well-formed certificate, and <code>rootF<\/code> is a perfectly good anchor - they just have nothing to do with each other. No declared anchor's key verifies <code>leafF<\/code>'s signature, so the chain is <code>unknown-anchor<\/code>. Neither key gets an <code>exposed<\/code> line: <code>rootF<\/code> never actually signed anything in this PKI, and <code>leafF<\/code> is the chain's own leaf.<\/p>"},{"label":"Example 4","name":"one intermediate, two chains","test":"16-R3-R4-shared-intermediate","input":"anchor rootG P-384 <...>\ncert sharedG <hex, a CA certificate issued by rootG>\ncert leafG1 <hex, issued by sharedG>\ncert leafG2 <hex, issued by sharedG>\nchain c1 leafG1 sharedG\nchain c2 leafG2 sharedG","output":"key rootG ok\nkey sharedG ok\nkey leafG1 ok\nkey leafG2 ok\nchain c1 trusted\nchain c2 trusted\nexposed rootG c1 c2\nexposed sharedG c1 c2","image":null,"explain":"<p><code>sharedG<\/code> signs both leaves, so both <code>c1<\/code> and <code>c2<\/code> depend on it: if <code>sharedG<\/code>'s key were compromised, both chains would need to be re-issued, not just one. <code>rootG<\/code> is exposed by both for the same reason, one level further up.<\/p>"}],"editorial":{"title":"What this checkpoint doesn't do","html":"<p>A real relying party does more than this: it checks revocation (OCSP, CRLs, OneCRL), enforces Certificate Transparency, and applies name constraints and extended key usage, none of which this workbook covers. What you've built here is the part of the lesson that doesn't change: a weak key is a weak key regardless of which of these mechanisms eventually catches it, and knowing what a key reaches is what turns \"this key is bad\" into an actual incident response, the same shape of work eMudhra, Mozilla and Chrome all did within hours of the real disclosure.<\/p>\n<p>You've now rebuilt, from modular arithmetic up, the exact chain of reasoning that made eight weak intermediate keys a same-day incident instead of a quiet footnote: the maths that makes a key pair work, the format that carries a key between systems, the chain that decides whether to trust it, the search that breaks a bad one, and the checks that would have caught it first.<\/p>"}}]}</script>
<script>
(function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('book-data').textContent);
  const CPS = DATA.checkpoints;
  const BY = Object.fromEntries(CPS.map((c) => [c.id, c]));
  const DIFFS = ['Easy', 'Medium', 'Hard'].filter((d) => CPS.some((c) => c.difficulty === d))
    .concat([...new Set(CPS.map((c) => c.difficulty))].filter((d) => !['Easy', 'Medium', 'Hard'].includes(d)));

  // Progress, drafts and layout live in this browser only.
  const store = {
    get(k) { try { return localStorage.getItem(DATA.key + ':' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(DATA.key + ':' + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(DATA.key + ':' + k); } catch (e) {} },
  };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const command = (id, extra) => DATA.check.replace('{id}', id) + (extra ? ' ' + extra : '');
  const solved = (id) => store.get(id + ':solved') === '1';
  const drafted = (id) => store.get(id + ':draft') !== null;
  const diffClass = (d) => d.toLowerCase();
  const icon = (paths, size, extra) => `<svg viewBox="0 0 24 24" width="${size || 16}" height="${size || 16}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"${extra || ''}>${paths}</svg>`;
  const I = {
    check: icon('<path d="m5 12 5 5 9-10"/>'),
    tryIcon: icon('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'),
    tag: icon('<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>', 14),
    bulb: icon('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>', 15),
    lock: icon('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 14),
    down: icon('<path d="m6 9 6 6 6-6"/>', 15),
    link: icon('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', 15),
    map: icon('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>', 15),
    book: icon('<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/>', 15),
  };

  let current = null;          // checkpoint id on screen, or null for the list
  let caseIndex = 0;           // selected test case in the bottom panel
  const peeked = new Set();    // editorials opened before solving, this visit only
  const lastAction = {};       // id -> { kind: 'run' | 'submit', test, copied }

  // ---------------------------------------------------------------- problem list
  const filter = { topic: null, diff: null, q: '' };

  function topicsOf(c) {
    const concepts = c.tags.find((g) => g.label.toLowerCase() === 'concepts');
    return concepts ? concepts.text : c.tags.flatMap((g) => g.text);
  }

  function renderListShell() {
    $$('[data-logo]').forEach((el) => { el.textContent = DATA.title.trim().charAt(0).toUpperCase(); });
    $('#book-name').textContent = DATA.title;
    $('#nav-src').innerHTML = `Built on <a href="${esc(DATA.sourceUrl)}" target="_blank" rel="noopener">“${esc(DATA.sourceTitle)}”</a> by ${esc(DATA.author)}`;
    $('#hero').innerHTML = `<span class="over">${CPS.length} checkpoints · any language</span><h1>${esc(DATA.headline)}</h1><p>${esc(DATA.lede)}</p>`;
    $('#credits').textContent = DATA.credits;
    $('#diff').innerHTML = ['All'].concat(DIFFS).map((d) =>
      `<button type="button" data-diff="${d === 'All' ? '' : esc(d)}" aria-pressed="${d === 'All'}">${esc(d)}</button>`).join('');

    const counts = {};
    CPS.forEach((c) => topicsOf(c).forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
    const topics = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
    $('#topics').innerHTML = `<button class="tchip" type="button" data-topic="" aria-pressed="true">All topics</button>`
      + topics.map((t) => `<button class="tchip" type="button" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}<sup>${counts[t]}</sup></button>`).join('')
      + (topics.length > 11 ? '<button class="more" type="button" id="more-topics">Expand</button>' : '');
  }

  function renderSide() {
    const done = CPS.filter((c) => solved(c.id));
    const r = 50, C = 2 * Math.PI * r;
    let offset = 0;
    const arcs = DIFFS.map((d) => {
      const n = done.filter((c) => c.difficulty === d).length;
      const len = (n / CPS.length) * C;
      const arc = n ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="currentColor" class="${diffClass(d)}" stroke-width="7" stroke-linecap="butt" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"/>` : '';
      offset += len;
      return arc;
    }).join('');
    const bars = DIFFS.map((d) => {
      const all = CPS.filter((c) => c.difficulty === d).length;
      const n = done.filter((c) => c.difficulty === d).length;
      return `<button class="bar-row ${diffClass(d)}" type="button" data-diff="${esc(d)}" aria-pressed="${filter.diff === d}">
        <span class="lbl">${esc(d)}</span><span class="n"><b>${n}</b>/${all}</span><span class="bar"><i style="width:${all ? (n / all) * 100 : 0}%"></i></span></button>`;
    }).join('');
    const first = CPS[0] ? CPS[0].id : '01';
    $('#side').innerHTML = `
      <div class="card prog">
        <div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="${r}" fill="none" style="stroke: var(--fill)" stroke-width="7"/>${arcs}</svg>
          <div class="ring-c"><div><b>${done.length}</b><span>/${CPS.length}</span></div><small>Solved</small></div></div>
        <div class="bars">${bars}</div>
      </div>
      <div class="card how"><h2>How checking works</h2><ol>
        <li><span><b>Write it</b> in the editor here, or straight in <code>solutions/</code> in your own editor. Each starter is an empty <code>main</code>; switch to Boilerplate if you want the input and output code done for you.</span></li>
        ${LOCAL ? `<li><span><b>Run</b> checks the selected example and <b>Submit</b> runs every test; the verdict appears in Test Result, and Accepted marks the checkpoint solved. Your code is saved to <code>solutions/</code> as you type.</span></li>`
          : `<li><span><b>Submit</b> copies your code. Paste it into the solution file and run <code>${esc(command(first))}</code> in ${esc(DATA.shell)}, in the workbook folder:<br><span class="path">${esc(DATA.folder)}</span></span></li>
        <li><span><b>Paste the checker's output</b> into Test Result. Accepted marks the checkpoint solved. Or open the workbook with <code>study</code> (double-click <code>study.cmd</code>) and Run and Submit run your code directly.</span></li>`}
        <li><span><b>Any order.</b> Each input carries what the earlier checkpoints would produce, so every checkpoint stands alone.</span></li>
        <li><span><b>Build on your own work.</b> Code in <code>solutions/common/</code> is compiled into every checkpoint, so later ones (and the last one most of all) can call what you wrote earlier.</span></li>
        <li><span><b>A test looks wrong?</b> <code>${esc(command(first, '-Dispute <test-id> "why"'))}</code> sets it aside. Ask Claude to review your disputes.</span></li>
      </ol></div>`;
    if (CPS.length && done.length === CPS.length) renderFinish();
  }

  // Every checkpoint passes: show what the learner built, and how the pieces fit together.
  function renderFinish() {
    const card = document.createElement('div');
    card.className = 'card finish';
    card.innerHTML = `<h2>You built it</h2><p class="note">All ${CPS.length} checkpoints pass${LOCAL ? '. Here is your project:' : '. Open the workbook with study to see your project laid out.'}</p><div id="finish-files"></div>`;
    $('#side').prepend(card);
    if (!LOCAL) return;
    api('/api/files').then(({ files }) => {
      const cps = files.filter((f) => f.checkpoint), common = files.filter((f) => !f.checkpoint && !/\.(md|txt)$/i.test(f.path));
      const lines = (list) => list.reduce((n, f) => n + f.lines, 0);
      const users = (p) => cps.filter((f) => (f.uses || []).includes(p)).map((f) => (BY[f.checkpoint] || {}).num || f.checkpoint);
      $('#finish-files').innerHTML = (common.length
        ? `<table>${common.map((f) => `<tr><td>${esc(f.path.replace(/^solutions\//, ''))}</td><td>${f.lines} lines${users(f.path).length ? ` · used by ${users(f.path).join(', ')}` : ''}</td></tr>`).join('')}</table>`
        : '<p class="note">Nothing in <code>solutions/common/</code> yet, so each checkpoint is still its own program.</p>')
        + `<p class="note">${cps.length} checkpoint files (${lines(cps)} lines)${common.length ? ` and ${common.length} shared files (${lines(common)} lines)` : ''}.</p>`;
    }).catch(() => {});
  }

  function renderRows() {
    const q = filter.q.trim().toLowerCase();
    const shown = CPS.filter((c) => (!filter.diff || c.difficulty === filter.diff)
      && (!filter.topic || topicsOf(c).includes(filter.topic))
      && (!q || (c.num + '. ' + c.title + ' ' + c.tags.flatMap((g) => g.text).join(' ')).toLowerCase().includes(q)));
    $('#rows').innerHTML = shown.map((c) => {
      const st = store.get(c.id + ':broke') ? '<span class="st-broke" title="Solved before, failing since a re-check">!</span>'
        : solved(c.id) ? `<span class="st-ok" title="Solved">${I.check}</span>`
        : drafted(c.id) ? `<span class="st-try" title="Attempted: a draft is saved">${I.tryIcon}</span>` : '';
      return `<tr data-id="${c.id}"><td class="st">${st}</td><td class="ti"><a href="#p${c.id}">${esc(c.num)}. ${esc(c.title)}</a></td>`
        + `<td class="te">${c.tests}</td><td class="di ${diffClass(c.difficulty)}">${esc(c.difficulty)}</td></tr>`;
    }).join('') || '<tr><td></td><td class="muted" colspan="3">No checkpoints match.</td></tr>';
    return shown;
  }

  function showList() {
    current = null;
    $('#ide-view').hidden = true;
    $('#list-view').hidden = false;
    document.body.classList.remove('in-ide');
    renderSide();
    renderRows();
    window.scrollTo(0, 0);
  }

  $('#topics').addEventListener('click', (e) => {
    if (e.target.id === 'more-topics') {
      const box = $('#topics');
      e.target.textContent = box.classList.toggle('collapsed') ? 'Expand' : 'Collapse';
      return;
    }
    const chip = e.target.closest('[data-topic]');
    if (!chip) return;
    filter.topic = chip.dataset.topic || null;
    $$('#topics [data-topic]').forEach((b) => b.setAttribute('aria-pressed', String(b === chip)));
    renderRows();
  });
  function setDiff(d) {
    filter.diff = d || null;
    $$('#diff [data-diff]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.diff || null) === filter.diff)));
    renderSide();
    renderRows();
  }
  $('#diff').addEventListener('click', (e) => { const b = e.target.closest('[data-diff]'); if (b) setDiff(b.dataset.diff); });
  $('#side').addEventListener('click', (e) => { const b = e.target.closest('.bar-row'); if (b) setDiff(filter.diff === b.dataset.diff ? '' : b.dataset.diff); });
  $('#q').addEventListener('input', (e) => { filter.q = e.target.value; renderRows(); });
  $('#rows').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-id]');
    if (row && !e.target.closest('a')) go('p' + row.dataset.id);
  });
  function pickOne(pool) {
    const open = pool.filter((c) => !solved(c.id) && c.id !== current);
    const from = open.length ? open : pool.filter((c) => c.id !== current);
    if (from.length) go('p' + from[Math.floor(Math.random() * from.length)].id);
  }
  $('#pick').addEventListener('click', () => pickOne(renderRows()));

  // ---------------------------------------------------------------- problem view
  function renderDesc(c) {
    const opened = Number(store.get(c.id + ':hints') || 0);
    const acc = (id, iconHtml, title, body) => `<div class="acc" ${id ? `id="${id}"` : ''}><button class="acc-btn" type="button" aria-expanded="false">${iconHtml}<span>${title}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${body}</div></div>`;
    const hintHtml = c.hints.map((h, k) => {
      const n = k + 1, locked = n > opened + 1;
      return `<div class="acc hint" data-n="${n}"><button class="acc-btn" type="button" aria-expanded="false"${locked ? ' disabled' : ''}>${I.bulb}<span>${esc(h.title)}<span class="acc-sub">${h.sub}</span></span>`
        + `<span class="acc-lock" ${locked ? '' : 'hidden'} title="Open hint ${n - 1} first">${I.lock}</span><span class="chev">${I.down}</span></button><div class="acc-body flow" hidden>${h.html}</div></div>`;
    }).join('');
    const tags = c.tags.map((g) => `<div class="tg"><span class="tg-label">${esc(g.label)}</span><div class="tg-items">${g.items.map((t) => `<span class="chip">${t}</span>`).join('')}</div></div>`).join('');

    $('#desc').innerHTML = `
      <div class="d-head"><h1>${esc(c.num)}. ${esc(c.title)}</h1><span class="solved-mark" id="solved-mark" ${solved(c.id) ? '' : 'hidden'}>Solved ${I.check}</span></div>
      <div class="chips">
        <span class="chip ${diffClass(c.difficulty)}">${esc(c.difficulty)}</span>
        ${c.tags.length ? `<button class="chip" type="button" data-jump="acc-topics">${I.tag}Topics</button>` : ''}
        ${c.hints.length ? `<button class="chip" type="button" data-jump="hints">${I.bulb}Hint</button>` : ''}
        <span class="chip">${c.tests} tests</span>
        <span class="chip" title="Only your program's output is checked, so any structure, language or library works.">Any language</span>
      </div>
      ${c.read ? `<div class="callout">${I.book}<div><b>Read in the blog first.</b> ${c.read.replace(/^<p>|<\/p>$/g, '')}</div></div>` : ''}
      <div class="flow">${c.body}</div>
      <div class="accs">
        ${c.tags.length ? acc('acc-topics', I.tag, 'Topics', tags) : ''}
        ${hintHtml}
        ${c.context ? acc('', I.map, 'Where this fits', c.context) : ''}
        ${c.sources ? acc('', I.link, 'Source material', c.sources) : ''}
      </div>
      <div class="d-foot"><button class="btn" type="button" id="solve-btn"></button><span>Checkpoint ${CPS.indexOf(c) + 1} of ${CPS.length} · problem page <code>${esc(c.problem)}</code></span></div>`;

    const host = $('[data-examples]', $('#desc'));
    if (host) host.innerHTML = c.examples.map(exampleHtml).join('');
    paintSolved();
  }

  function exampleHtml(ex) {
    const title = `<p class="ex-title"><strong>${esc(ex.label)}:</strong> <span>${ex.name}</span></p>`;
    if (ex.raw) return `<div class="ex">${title}<div class="flow">${ex.raw}</div></div>`;
    const out = ex.output != null ? `<pre>${esc(ex.output)}</pre>`
      : ex.image ? `<img class="shot" src="${ex.image.src}" alt="${esc(ex.image.alt)}">` : '';
    return `<div class="ex">${title}<div class="ex-block">
      <div class="ex-row"><span class="ex-k">Input:</span><pre>${esc(ex.input)}</pre></div>
      ${out ? `<div class="ex-row"><span class="ex-k">Output:</span>${out}</div>` : ''}
      ${ex.explain ? `<div class="ex-row"><span class="ex-k">Explanation:</span><div class="flow">${ex.explain}</div></div>` : ''}
    </div></div>`;
  }

  function toggleAcc(box, open) {
    const btn = $('.acc-btn', box), body = $('.acc-body', box);
    const show = open === undefined ? body.hidden : open;
    body.hidden = !show;
    btn.setAttribute('aria-expanded', String(show));
  }

  // Hints open in order; the furthest one opened is remembered.
  function openHint(box) {
    const n = Number(box.dataset.n), key = current + ':hints';
    const opened = Number(store.get(key) || 0);
    if (n > opened) {
      store.set(key, String(n));
      $$('.acc.hint', $('#desc')).forEach((h) => {
        const locked = Number(h.dataset.n) > n + 1;
        $('.acc-btn', h).disabled = locked;
        $('.acc-lock', h).hidden = !locked;
      });
      toggleAcc(box, true);
    } else toggleAcc(box);
  }

  $('#desc').addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {
      const target = jump.dataset.jump === 'hints' ? $('.acc.hint', $('#desc')) : $('#' + jump.dataset.jump);
      if (target) {
        if (jump.dataset.jump !== 'hints') toggleAcc(target, true);
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      return;
    }
    const btn = e.target.closest('.acc-btn');
    if (btn) {
      const box = btn.parentElement;
      if (box.classList.contains('hint')) openHint(box); else toggleAcc(box);
      return;
    }
    if (e.target.closest('#solve-btn')) setSolved(current, !solved(current));
  });

  // The Editorial: a solution proven to pass every test (the reference, fingerprinted when it
  // passed), then how the blog author did it. Locked until Accepted, but always one click away.
  let solFile = 0;
  function renderEditorial(c) {
    const sol = c.solutionCode;
    const has = !!c.editorial || !!sol;
    $('#ed-tab').hidden = !has;
    $('#ed-sep').hidden = !has;
    if (!has) return;
    if (!(solved(c.id) || peeked.has(c.id))) {
      $('#editorial').innerHTML = `<div class="locked">${I.lock}<h2>Solve it first, or peek</h2><p>The editorial has a complete solution that passes every test${c.editorial ? ', and compares it with the author\'s code from the blog' : ''}. It opens by itself when the checker says Accepted.</p><button class="btn" type="button" id="peek">Show the solution anyway</button></div>`;
      return;
    }
    solFile = Math.min(solFile, sol ? sol.files.length - 1 : 0);
    const proof = sol && sol.proof
      ? `<span class="badge ok">${I.check} Passes all ${sol.proof.total} tests · checked ${esc(sol.proof.date)}</span>`
      : `<span class="badge warn">Not yet checked against the tests</span>`;
    const files = sol && sol.files.length > 1
      ? `<div class="case-pills" role="tablist">${sol.files.map((f, i) => `<button class="pill-btn" type="button" role="tab" data-sol="${i}" aria-selected="${i === solFile}">${esc(f.path)}</button>`).join('')}</div>` : '';
    $('#editorial').innerHTML = `<h1 class="ed-title">Editorial</h1>`
      + (sol ? `<section class="ed-sec"><h2>A solution that passes</h2>${proof}
          <p class="note">Written from the problem page, not copied from the blog. Yours can look completely different and still be right: only the output is checked.</p>
          ${files}<div class="sol-head"><code>${esc(sol.files[solFile].path)}</code><button class="btn" type="button" id="sol-copy">Copy</button></div>
          <pre class="sol-code" id="sol-code"></pre>
          ${sol.uses.length ? `<p class="note">It also uses ${sol.uses.map((u) => `<code>${esc(u)}</code>`).join(', ')}, ${sol.uses.length === 1 ? 'which is' : 'which are'} in the workbook.</p>` : ''}</section>` : '')
      + (c.editorial ? `<section class="ed-sec"><h2>${esc(c.editorial.title)}</h2><div class="flow">${c.editorial.html}</div></section>` : '');
    if (sol) {
      const box = $('#sol-code'), text = sol.files[solFile].text;
      if (window.CodeMirror && window.CodeMirror.runMode) window.CodeMirror.runMode(text, c.lang.mime, box);
      else box.textContent = text;
    }
  }
  $('#editorial').addEventListener('click', (e) => {
    const c = BY[current];
    if (e.target.closest('#peek')) { peeked.add(current); renderEditorial(c); return; }
    const tab = e.target.closest('[data-sol]');
    if (tab) { solFile = Number(tab.dataset.sol); renderEditorial(c); return; }
    const copy = e.target.closest('#sol-copy');
