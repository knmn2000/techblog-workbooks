self, label: str, wrapped_label: str) -> None:\n        \"\"\"Exports the key `label` names as `wrapped_label`.\"\"\"\n        self._carry(label, wrapped_label)\n\n    def unwrap(self, wrapped_label: str, label: str) -> None:\n        \"\"\"Imports the key `wrapped_label` names back under `label`.\"\"\"\n        self._carry(wrapped_label, label)\n\n    def _carry(self, source: str, target: str) -> None:\n        # An undefined source leaves the target naming no identity.\n        self.points_at[target] = self.points_at.get(source)\n        self.known.add(target)\n\n    def fingerprint(self, label: str, value: str) -> None:\n        \"\"\"Records the fingerprint of the key `label` names.\"\"\"\n        self.latest[label] = value\n        identity = self.points_at.get(label)\n        if identity in self.unattested:\n            self.attested[identity] = value\n            self.unattested.discard(identity)\n\n    def publish(self, label: str) -> Publication:\n        \"\"\"Checks the key `label` names against the fingerprint attested at its generation.\"\"\"\n        if label not in self.known:\n            return Publication(\"undefined\")\n        identity = self.points_at[label]\n        if self.latest.get(label) == self.attested.get(identity):\n            return Publication(\"ok\")\n        return Publication(\"MISMATCH\", self.generated_as.get(identity))\n"},{"path":"assignments/assignment_14_ceremony_checker.py","text":"\"\"\"Assignment 14 (ceremony checker): replays the key ceremony log in a test input.\n\nThe checker runs `assignment_14_ceremony_checker.py <input-file> <output-file>`.\nsrc/pkiaudit/pki/ceremony.py keeps the ceremony's state.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.pki.ceremony import Ceremony\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes a `duplicate` line for each reused label and a `publish` line for each publish step.\"\"\"\n    ceremony = Ceremony()\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            step = words[0]\n            if step == \"generate\":  # generate <label> <curve>\n                if ceremony.generate(words[1]):\n                    lines.append(f\"duplicate {words[1]}\")\n            elif step == \"wrap\":  # wrap <label> <wrapped-label>\n                ceremony.wrap(words[1], words[2])\n            elif step == \"unwrap\":  # unwrap <wrapped-label> <label>\n                ceremony.unwrap(words[1], words[2])\n            elif step == \"fingerprint\":  # fingerprint <label> <hex>\n                ceremony.fingerprint(words[1], words[2])\n            elif step == \"publish\":  # publish <label>\n                result = ceremony.publish(words[1])\n                if result.status == \"MISMATCH\":\n                    lines.append(f\"publish {words[1]} MISMATCH {result.generated_as}\")\n                else:\n                    lines.append(f\"publish {words[1]} {result.status}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/pki/__init__.py"],"proof":{"passed":10,"total":10,"date":"2026-10-22"}},"read":"<p>This page is complete on its own. Read eMudhra's <a href=\"https://emudhra.com/en/post/certificate-security-incident#:~:text=An%20Update%20on%20Our%20Global%20TLS%20Intermediate%20CA%20Incident\" target=\"_blank\" rel=\"noopener\">Update 3<\/a>, \"How it happened\": the keys were generated in a Key Generation Ceremony (KGC) in April 2025, on FIPS 140-2 Level 3 hardware security modules, and \"a flaw in one step of that process... produced a second, weak set of keys alongside the original strong keys.\" The post also mentions \"similar labels\" among the materials handled.<\/p>\n<p>eMudhra has not confirmed the exact root cause. This assignment models a plausible shape that fits their own description, and it doesn't reconstruct their ceremony software, which nobody outside eMudhra has described in public. A step that wraps a key for transport and later unwraps it could, with a bug, hand back different key material than it received, and a mix-up between artifacts with similar names is the kind of slip that would let that go unnoticed. Treat the log format below as a teaching model built for this workbook, not as eMudhra's file format or process.<\/p>","readTitle":"Read in the blog first","context":"<p>Assignment 12's <code>ecc/keys.py<\/code> turned random bytes into a key, the step that should go right every time. This assignment checks a later step: that a key which started out fine is still the same key when the ceremony publishes it. Your linter from assignment 13 can only catch a bad key it gets to look at, and this checker finds the moment the key stopped being the one the ceremony generated.<\/p>\n<p>Your new <code>pki/ceremony.py<\/code> needs none of your earlier modules, and no later assignment uses it.<\/p>","sources":"<ul><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a>, Update 3 (\"How it happened\", and the statement that the root cause is not yet confirmed)<\/li><li>Assignment 12 (<code>problems/12-generate-key.md<\/code>): the step that should go right every time, before any ceremony log starts<\/li><\/ul>","checking":"<pre><code>.\\check 14                                  run every test\n.\\check 14 -Case 14-R2-bad-unwrap           one test, showing its full input, expected output and your output\n.\\check 14 -Fresh                           a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 14 -Dispute &lt;id&gt; &quot;why&quot;              set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R2  A defective unwrap that substitutes a different token is caught ... .    1 / 2   FAILED\n      x 14-R2-bad-unwrap  the unwrap step silently substitutes a different token: MISMATCH at publish\n          line 1: expected `publish k1b MISMATCH k1`, got `publish k1b ok`\n          likely cause: R2 - A defective unwrap that substitutes a different token is caught at publish: `MISMATCH &lt;origin&gt;`\n          expected values from: definitional: fingerprint = sha256(token) in hex, computed by hashlib in this generator\n          reproduce: py -P tools/run_py.py solutions 14 build/cases/14/14-R2-bad-unwrap.in build/cases/14/14-R2-bad-unwrap.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Work through the log from top to bottom and keep track, for every label you've seen, of the key it names now. A second <code>generate<\/code> can reuse a label, so the label's text alone doesn't tell you which key it is: give each key something of its own to track it by.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Give every <code>generate<\/code> step its own identity (a counter works: 1, 2, 3, ...), even when it reuses a label. In <code>Ceremony<\/code>, the dictionary <code>points_at<\/code> maps a label to the identity it names now: <code>generate<\/code> sets it to a new identity, and <code>wrap<\/code> and <code>unwrap<\/code> copy the identity of their source label. A second dictionary, <code>attested<\/code>, maps an identity to its attested fingerprint, set once by the first <code>fingerprint<\/code> line after the key's generation. A third, <code>latest<\/code>, maps a label to the last fingerprint recorded for it. At <code>publish<\/code>, look up the label's identity and compare.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A label used by a second <code>generate<\/code> needs a new identity. Don't let the second <code>generate<\/code> overwrite the attested fingerprint of the first one's identity.<\/li><li><code>wrap<\/code> and <code>unwrap<\/code> look up the identity their <em>source<\/em> label names at the moment they run, not at some later point.<\/li><li>A <code>publish<\/code> of an unknown label has no identity to look up: check for that before anything else.<\/li><li>The <code>MISMATCH<\/code> line names the label the chain started at (the <code>generate<\/code> step), not the <code>wrap<\/code> or <code>unwrap<\/code> step that corrupted it, and not the label being published.<\/li><li><code>duplicate<\/code> lines and <code>publish<\/code> lines go out interleaved in log order, not grouped by kind.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>points_at = {}        # label -&gt; identity id\ngenerated_as = {}      # identity id -&gt; label it was generated under\nattested = {}          # identity id -&gt; fingerprint attested at generation\nlatest = {}            # label -&gt; most recent fingerprint recorded for it\nnext_id = 0\n\nfor step in log:\n    if step is generate(label, curve):\n        if label in points_at: emit &quot;duplicate &quot; + label\n        next_id += 1\n        points_at[label] = next_id\n        generated_as[next_id] = label\n    if step is wrap(label, wrapped_label) or unwrap(wrapped_label=label, target):\n        points_at[target] = points_at[source]\n    if step is fingerprint(label, hex):\n        latest[label] = hex\n        id = points_at[label]\n        if id not yet in attested: attested[id] = hex\n    if step is publish(label):\n        if label not in points_at: emit &quot;publish &quot; + label + &quot; undefined&quot;; continue\n        id = points_at[label]\n        if latest[label] == attested[id]: emit &quot;publish &quot; + label + &quot; ok&quot;\n        else: emit &quot;publish &quot; + label + &quot; MISMATCH &quot; + generated_as[id]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a defective unwrap, caught at publish","test":"14-R2-bad-unwrap","input":"generate k1 P-384\nfingerprint k1 <hash of the real key>\nwrap k1 wk1\nfingerprint wk1 <the same hash: wrap preserved it>\nunwrap wk1 k1b\nfingerprint k1b <a DIFFERENT hash: the unwrap substituted something else>\npublish k1b","output":"publish k1b MISMATCH k1","image":null,"explain":"<p>The key stayed the same through the wrap. The unwrap produced something with a different fingerprint from what went in, and that's the key the ceremony publishes. The output names <code>k1<\/code> because this chain of custody started there.<\/p>"},{"label":"Example 2","name":"a duplicate label that doesn't disturb an earlier chain","test":"14-R3-duplicate-does-not-disturb-earlier-wrap","input":"generate first-use P-384\nfingerprint first-use <hash A>\nwrap first-use stashed\nfingerprint stashed <hash A>\ngenerate first-use P-384\nfingerprint first-use <hash B>\nunwrap stashed recovered\nfingerprint recovered <hash A>\npublish recovered","output":"duplicate first-use\npublish recovered ok","image":null,"explain":"<p>The <code>wrap<\/code> moved the <em>first<\/em> <code>first-use<\/code> key to <code>stashed<\/code> before the label was reused. The second <code>generate<\/code> points <code>first-use<\/code> at a different key, and your program flags it as a duplicate. <code>recovered<\/code>, unwrapped from <code>stashed<\/code>, still traces back to the <em>first<\/em> key, and its fingerprint (hash A) matches the one attested for that key. The output reports the duplicate, and <code>recovered<\/code> is <code>ok<\/code>.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>The post describes the outcome of a ceremony gone wrong in vague terms and says that the root cause isn't confirmed, so there's no author's code to compare with here. You built one way a ceremony-log checker could have caught a failure of the shape they described, with no claim about what their software does.<\/p>\n<p>The post's mention of \"similar labels\" matters in this assignment. A ceremony that lets one name mean two different things at different times is a process hazard worth flagging on its own (R3's point), whether or not a key's material changed along the way.<\/p>"}},{"id":"15","num":"15","title":"Block and distrust","difficulty":"Easy","tests":8,"problem":"problems/15-blocklist-distrust.md","entry":"solutions/assignments/assignment_15_blocklist_distrust.py","files":[{"path":"solutions/assignments/assignment_15_blocklist_distrust.py","role":"entry","purpose":null,"job":"Read the input line by line (see Input): add `blocked-spki` and `distrusted-root` lines to two growing sets, and gather the `cert` lines of each `chain` block. Check each chain against the two sets with your `check_chain` and write one `chain` line per chain, in input order (see Output).","blank":"# ======================================================================================\n# Assignment 15: Block and distrust\n# Problem: problems/15-blocklist-distrust.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 15 as `python -P tools/run_py.py\n#   solutions 15 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 15`, or use Run and Submit in the book.\n#\n# Your job:\n#   Read the input line by line (see Input): add `blocked-spki` and `distrusted-root`\n#   lines to two growing sets, and gather the `cert` lines of each `chain` block. Check\n#   each chain against the two sets with your `check_chain` and write one `chain` line per\n#   chain, in input order (see Output).\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/pki/trust.py in this assignment; each one gives its job at\n#   the top.\n#   Import them as modules of your package, e.g. `from pkiaudit.pki import trust`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 15: Block and distrust\n# Problem: problems/15-blocklist-distrust.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 15 as `python -P tools/run_py.py\n#   solutions 15 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 15`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/pki/trust.py in this assignment; each one gives its job at\n#   the top.\n#   Import them as modules of your package, e.g. `from pkiaudit.pki import trust`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 15 (blocklist and distrust): gives a verdict on each `chain` block of a test input.\n\nThe checker runs `assignment_15_blocklist_distrust.py <input-file> <output-file>`. The rules are in\nsrc/pkiaudit/pki/trust.py.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.pki.trust import ChainCert, check_chain\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `chain <id> trusted` or `chain <id> blocked <spki|root> <what>` for each chain.\"\"\"\n    blocked_spki: set[str] = set()\n    distrusted_roots: set[str] = set()\n    lines = []\n    chain_id, certs = None, []\n\n    def finish() -> None:\n        if chain_id is None:\n            return\n        block = check_chain(certs, blocked_spki, distrusted_roots)\n        lines.append(f\"chain {chain_id} trusted\" if block is None\n                     else f\"chain {chain_id} blocked {block.mechanism} {block.what}\")\n\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"blocked-spki\":  # blocked-spki <hash>\n                blocked_spki.add(words[1])\n            elif words[0] == \"distrusted-root\":  # distrusted-root <root-id>\n                distrusted_roots.add(words[1])\n            elif words[0] == \"chain\":  # chain <id>: starts a new chain\n                finish()\n                chain_id, certs = words[1], []\n            elif words[0] == \"cert\":  # cert <role> <spki-hash> <root-id>, leaf first\n                certs.append(ChainCert(words[1], words[2], words[3]))\n    finish()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/pki/trust.py","role":"new","purpose":"It decides whether a browser still trusts a certificate chain once some keys are blocked by their SPKI hash and some roots are distrusted, the two ways a browser withdraws trust after an incident. It needs none of your earlier modules, and no later assignment uses it.","job":"Write the browser's verdict on one chain in `pki/trust.py`: given the chain's certificates (role, SPKI hash and root id, leaf first), the blocked SPKI hashes and the distrusted root ids, return what blocks the chain, or None when the browser trusts it. Check the SPKI blocks first, leaf to root, and the root distrust only when no SPKI block matches (see Two ways to block a chain).","blank":"# ======================================================================================\n# Assignment 15: Block and distrust\n# Problem: problems/15-blocklist-distrust.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   It decides whether a browser still trusts a certificate chain once some keys are\n#   blocked by their SPKI hash and some roots are distrusted, the two ways a browser\n#   withdraws trust after an incident. It needs none of your earlier modules, and no later\n#   assignment uses it.\n#\n# Your job:\n#   Write the browser's verdict on one chain in `pki/trust.py`: given the chain's\n#   certificates (role, SPKI hash and root id, leaf first), the blocked SPKI hashes and\n#   the distrusted root ids, return what blocks the chain, or None when the browser trusts\n#   it. Check the SPKI blocks first, leaf to root, and the root distrust only when no SPKI\n#   block matches (see Two ways to block a chain).\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 15: Block and distrust\n# Problem: problems/15-blocklist-distrust.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   It decides whether a browser still trusts a certificate chain once some keys are\n#   blocked by their SPKI hash and some roots are distrusted, the two ways a browser\n#   withdraws trust after an incident. It needs none of your earlier modules, and no later\n#   assignment uses it.\n#\n# Your job:\n#   Write the browser's verdict on one chain in `pki/trust.py`: given the chain's\n#   certificates (role, SPKI hash and root id, leaf first), the blocked SPKI hashes and\n#   the distrusted root ids, return what blocks the chain, or None when the browser trusts\n#   it. Check the SPKI blocks first, leaf to root, and the root distrust only when no SPKI\n#   block matches (see Two ways to block a chain). The Boilerplate gives you the\n#   declarations; fill in each TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Blocking keys and distrusting roots (assignment 15).\n\nA browser has two ways to stop trusting certificates after an incident. An SPKI block names one\nkey by its SPKI hash (assignment 07) and stops it wherever it appears. A root distrust stops the\nwhole hierarchy under a root. `check_chain` tries the finer SPKI block first, leaf to root, and\nfalls back to the root distrust only when the blocklist names no key in the chain.\n\"\"\"\n\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass ChainCert:\n    \"\"\"One certificate of a chain as the browser sees it: its role, SPKI hash and root id.\"\"\"\n\n    role: str  # \"leaf\", \"intermediate\" or \"root\"\n    spki: str\n    root_id: str\n\n\n@dataclass(frozen=True)\nclass Block:\n    \"\"\"What stops a chain: \"spki\" with the blocked certificate's role, or \"root\" with the root id.\"\"\"\n\n    mechanism: str\n    what: str\n\n\ndef check_chain(chain: Sequence[ChainCert], blocked_spki: set[str],\n                distrusted_roots: set[str]) -> Block | None:\n    \"\"\"Returns the Block that stops a chain, leaf first, or None when the browser trusts it.\"\"\"\n    # TODO: the SPKI blocks first, then the root distrust; see \"Two ways to block a chain\" on the\n    # problem page.\n    raise NotImplementedError(\"check_chain\")\n"}],"buildsOn":[],"indent":4,"tags":[{"label":"Language","items":["parsing a small log format","sets"],"text":["parsing a small log format","sets"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["SPKI pinning/blocking","root distrust","CRLSet-style revocation","response speed vs. blast radius"],"text":["SPKI pinning/blocking","root distrust","CRLSet-style revocation","response speed vs. blast radius"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that decides, for each certificate chain it reads, whether anything in it is blocked.<\/p>\n<h3>Two ways to block a chain<\/h3>\n<ol><li>SPKI blocking: the browser blocks one public key, named by its SPKI hash (a hash of the certificate's SubjectPublicKeyInfo, the field that holds its public key), wherever it appears, in any certificate of any chain. It's fast to issue and exact, because it blocks that one key and nothing else. Chrome's CRLSet did this in the real incident, within hours.<\/li><li>Root distrust: the browser distrusts a whole root certificate, named by an id. Every chain that leads back to that root is blocked, including certificates whose own keys aren't on any blocklist. This is coarser, since it can affect certificates that were fine on their own, and it was the precautionary step in this incident.<\/li><\/ol>\n<p>The two mechanisms are independent, and either one blocks a chain on its own. If a chain's own certificates trigger both, report the SPKI block: it's the more specific, faster-acting mechanism, and the one a response like this one would issue first.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains these kinds of lines, which may come in any order before and between <code>chain<\/code> blocks:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>blocked-spki &lt;hash&gt;<\/code><\/td><td>Adds one SPKI hash to the blocklist. It applies to every <code>chain<\/code> that follows it, in any certificate, at any position.<\/td><\/tr><tr><td><code>distrusted-root &lt;root-id&gt;<\/code><\/td><td>Adds one root id to the distrust set. It applies to every <code>chain<\/code> that follows it, whenever that chain's own root carries this id.<\/td><\/tr><tr><td><code>chain &lt;id&gt;<\/code><\/td><td>Starts a certificate chain. Every <code>cert<\/code> line after it, until the next <code>chain<\/code> line (or the end of the input), belongs to this chain.<\/td><\/tr><tr><td><code>cert &lt;role&gt; &lt;spki-hash&gt; &lt;root-id&gt;<\/code><\/td><td>One certificate in the current chain. <code>role<\/code> is <code>leaf<\/code>, <code>intermediate<\/code> or <code>root<\/code>, and a chain's certs come leaf to root. <code>spki-hash<\/code> is the SPKI hash of that certificate's public key. <code>root-id<\/code> is the identifier checked against the distrust set, and only means something for a <code>root<\/code> cert; for a <code>leaf<\/code> or <code>intermediate<\/code> cert it is always the placeholder <code>-<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>This assignment covers the blocking policy. Parsing real certificates was the work of assignments 05 to 09, so the input gives each SPKI hash and root id as a plain hex or word token, standing in for what a real chain's DER would carry.<\/p>\n<h3>Output<\/h3>\n<p>For each <code>chain<\/code> block, in input order, write one line:<\/p>\n<pre><code>chain &lt;id&gt; trusted                     nothing in the chain is blocked\nchain &lt;id&gt; blocked spki &lt;role&gt;         the FIRST cert (leaf to root) whose SPKI hash is blocklisted\nchain &lt;id&gt; blocked root &lt;root-id&gt;      the chain&#x27;s root id is in the distrust set, and no SPKI hash matched first<\/code><\/pre>\n<p>Copy <code>&lt;id&gt;<\/code> from the input unchanged. The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A chain with nothing blocklisted or distrusted anywhere in it is <code>trusted<\/code>.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A certificate (leaf, intermediate or root) whose SPKI hash is on the blocklist blocks the whole chain: <code>blocked spki &lt;role&gt;<\/code>, naming that certificate, even if nothing else about the chain looks wrong.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A chain whose root id is in the distrust set, with no SPKI hash anywhere in the chain on the blocklist, is <code>blocked root &lt;root-id&gt;<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>When a chain's own certificates trigger both mechanisms (an SPKI hit and a distrusted root), the output reports the SPKI block, not the root distrust.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A blocklist or distrust entry meant for some other chain's certificates doesn't affect a chain whose own certificates don't match it.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>blocked-spki<\/code> and <code>distrusted-root<\/code> lines, and <code>chain<\/code>/<code>cert<\/code> blocks, may appear in any order, but a <code>blocked-spki<\/code> or <code>distrusted-root<\/code> line only ever affects chains that come after it.<\/li><li>Every chain has exactly one <code>leaf<\/code>, at least one <code>intermediate<\/code>, and exactly one <code>root<\/code>, leaf to root in that order. An input has at most 8 chains.<\/li><li>Each case has a 10-second limit; this assignment does no heavy computation.<\/li><li>There are 8 tests: 1 for R1, 3 for R2 (one per role), 1 for R3, 1 for R4, 1 for R5, and 1 end-to-end case with five chains covering every verdict in one input. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/pkiaudit/pki/trust.py","text":"\"\"\"Blocking keys and distrusting roots (assignment 15).\n\nA browser has two ways to stop trusting certificates after an incident. An SPKI block names one\nkey by its SPKI hash (assignment 07) and stops it wherever it appears. A root distrust stops the\nwhole hierarchy under a root. `check_chain` tries the finer SPKI block first, leaf to root, and\nfalls back to the root distrust only when the blocklist names no key in the chain.\n\"\"\"\n\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass ChainCert:\n    \"\"\"One certificate of a chain as the browser sees it: its role, SPKI hash and root id.\"\"\"\n\n    role: str  # \"leaf\", \"intermediate\" or \"root\"\n    spki: str\n    root_id: str\n\n\n@dataclass(frozen=True)\nclass Block:\n    \"\"\"What stops a chain: \"spki\" with the blocked certificate's role, or \"root\" with the root id.\"\"\"\n\n    mechanism: str\n    what: str\n\n\ndef check_chain(chain: Sequence[ChainCert], blocked_spki: set[str],\n                distrusted_roots: set[str]) -> Block | None:\n    \"\"\"Returns the Block that stops a chain, leaf first, or None when the browser trusts it.\"\"\"\n    for cert in chain:\n        if cert.spki in blocked_spki:\n            return Block(\"spki\", cert.role)\n    for cert in chain:\n        if cert.role == \"root\" and cert.root_id in distrusted_roots:\n            return Block(\"root\", cert.root_id)\n    return None\n"},{"path":"assignments/assignment_15_blocklist_distrust.py","text":"\"\"\"Assignment 15 (blocklist and distrust): gives a verdict on each `chain` block of a test input.\n\nThe checker runs `assignment_15_blocklist_distrust.py <input-file> <output-file>`. The rules are in\nsrc/pkiaudit/pki/trust.py.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.pki.trust import ChainCert, check_chain\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `chain <id> trusted` or `chain <id> blocked <spki|root> <what>` for each chain.\"\"\"\n    blocked_spki: set[str] = set()\n    distrusted_roots: set[str] = set()\n    lines = []\n    chain_id, certs = None, []\n\n    def finish() -> None:\n        if chain_id is None:\n            return\n        block = check_chain(certs, blocked_spki, distrusted_roots)\n        lines.append(f\"chain {chain_id} trusted\" if block is None\n                     else f\"chain {chain_id} blocked {block.mechanism} {block.what}\")\n\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"blocked-spki\":  # blocked-spki <hash>\n                blocked_spki.add(words[1])\n            elif words[0] == \"distrusted-root\":  # distrusted-root <root-id>\n                distrusted_roots.add(words[1])\n            elif words[0] == \"chain\":  # chain <id>: starts a new chain\n                finish()\n                chain_id, certs = words[1], []\n            elif words[0] == \"cert\":  # cert <role> <spki-hash> <root-id>, leaf first\n                certs.append(ChainCert(words[1], words[2], words[3]))\n    finish()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/pki/__init__.py"],"proof":{"passed":8,"total":8,"date":"2026-10-22"}},"read":"<p>This page is complete on its own. eMudhra's <a href=\"https://emudhra.com/en/post/certificate-security-incident#:~:text=Update%201\" target=\"_blank\" rel=\"noopener\">Update 1<\/a> quotes Mozilla's response through OneCRL/NSS. Alongside the browser statements, Google's security blog post, \"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates,\" describes Chrome's response in two parts: blocking the compromised keys by their SPKI hash through Chrome's CRLSet, and, as a separate precaution, removing all trust in the affected root. This assignment models both mechanisms and the difference between them.<\/p>","readTitle":"Read in the blog first","context":"<p>Your <code>pki/lint.py<\/code> from assignment 13 found a bad key by inspecting it. This assignment covers the next step, at the scale of a browser's trust store: once someone knows that a key or a root is bad, the browser withdraws trust in it for every certificate it signed.<\/p>\n<p>The SPKI hash is the value your <code>x509/spki.py<\/code> computes in assignment 07. Here the input gives it to you, so your new <code>pki/trust.py<\/code> needs none of your earlier modules, and no later assignment uses it.<\/p>","sources":"<ul><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a>, Update 1 (quoting Mozilla's OneCRL/NSS response)<\/li><li>Google Security Blog, \"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates\": Chrome's CRLSet-based SPKI blocking, and the separate decision to remove trust in the affected root<\/li><li>Assignment 13 (<code>problems/13-key-linter.md<\/code>): the blocklist idea this assignment extends across a whole chain<\/li><\/ul>","checking":"<pre><code>.\\check 15                                         run every test\n.\\check 15 -Case 15-R4-spki-wins-over-root         one test, showing its full input, expected output and your output\n.\\check 15 -Fresh                                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 15 -Dispute &lt;id&gt; &quot;why&quot;                     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  When both could apply to the same chain, the SPKI block is report... .    0 / 1   FAILED\n      x 15-R4-spki-wins-over-root  the intermediate is SPKI-blocklisted AND the root is distrusted: the SPKI block is reported\n          line 1: expected `chain c1 blocked spki intermediate`, got `chain c1 blocked root root-both`\n          likely cause: R4 - When both could apply to the same chain, the SPKI block is reported, not the root distrust\n          expected values from: definitional: two structurally different restatements of the blocking policy, cross-checked before each case is written\n          reproduce: py -P tools/run_py.py solutions 15 build/cases/15/15-R4-spki-wins-over-root.in build/cases/15/15-R4-spki-wins-over-root.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Treat this as two separate checks in a fixed order. First, look for a certificate in the chain whose key is on the blocklist. Only if there's none, check whether the chain's root is distrusted. Keep them as two steps rather than one combined check.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>The program keeps two sets that grow as it reads the input: blocked SPKI hashes and distrusted root ids. Your <code>check_chain<\/code> scans the chain's certificates leaf to root, and the first one whose SPKI hash is on the blocklist decides the verdict. If none match, it looks at the chain's <code>root<\/code> certificate (a chain has only one) and checks its root id against the distrust set.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>A <code>blocked-spki<\/code> or <code>distrusted-root<\/code> line only applies to chains that come after it in the input, the same way assignment 10's <code>bound<\/code> line works. Don't apply it to earlier chains.<\/li><li>The SPKI check runs first, over every certificate in the chain, including the leaf and the intermediates. The compromised key could belong to a leaf, an intermediate or a root.<\/li><li>Only a <code>root<\/code> certificate's <code>root-id<\/code> field means anything. A <code>leaf<\/code> or <code>intermediate<\/code> certificate's third field is the placeholder <code>-<\/code>, so don't compare it with the distrust set.<\/li><li>An entry in either set that matches nothing in a particular chain has no effect on that chain. Keep one chain's problem out of another chain's verdict.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>check_chain(chain, blocked_spki, distrusted_roots):\n    for cert in chain:                            # leaf to root\n        if cert.spki in blocked_spki:\n            return Block(&quot;spki&quot;, cert.role)\n    for cert in chain:\n        if cert.role == &quot;root&quot; and cert.root_id in distrusted_roots:\n            return Block(&quot;root&quot;, cert.root_id)\n    return None   # trusted<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"an intermediate's key is blocked everywhere","test":"15-R2-spki-blocked-intermediate","input":"blocked-spki <hash of the compromised intermediate's key>\nchain c1\ncert leaf <leaf's own hash> -\ncert intermediate <the compromised hash> -\ncert root <root's own hash> root-beta","output":"chain c1 blocked spki intermediate","image":null,"explain":"<p>The leaf and the root are fine on their own. The intermediate's key is the compromised one, and blocking it by SPKI hash stops every chain built on it at once, without touching the root.<\/p>"},{"label":"Example 2","name":"both mechanisms could apply","test":"15-R4-spki-wins-over-root","input":"blocked-spki <hash>\ndistrusted-root root-both\nchain c1\ncert leaf <hash> -\ncert intermediate <the same blocked hash> -\ncert root <hash> root-both","output":"chain c1 blocked spki intermediate","image":null,"explain":"<p>The root is also on the distrust list, but the output reports the SPKI block. It's the more specific finding: it names the key that's bad, which tells a responder more than \"this whole root is under precautionary distrust\".<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>Neither source describes a single \"policy\" the way this assignment states one. They describe two separate actions taken during the same incident. You gave the distinction between them a name: one mechanism that's surgical and fast, another that's broad and precautionary, and a rule for which one to report when both apply.<\/p>\n<p>This is also the last assignment in the workbook about policy alone, with no cryptography. Assignment 16 is the capstone: it puts the earlier assignments' pieces together into one audit of a small, synthetic PKI.<\/p>"}},{"id":"16","num":"16","title":"Audit a PKI","difficulty":"Hard","tests":12,"problem":"problems/16-audit-pki.md","entry":"solutions/assignments/assignment_16_audit_pki.py","files":[{"path":"solutions/assignments/assignment_16_audit_pki.py","role":"entry","purpose":null,"job":"Open the input file, which holds a whole PKI file (see Input), and audit it with your `read_pki` and `audit` from `pki/audit.py`. Write the report's lines to the output file (see Output).","blank":"# ======================================================================================\n# Assignment 16: Audit a PKI\n# Problem: problems/16-audit-pki.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 16 as `python -P tools/run_py.py\n#   solutions 16 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 16`, or use Run and Submit in the book.\n#\n# Your job:\n#   Open the input file, which holds a whole PKI file (see Input), and audit it with your\n#   `read_pki` and `audit` from `pki/audit.py`. Write the report's lines to the output\n#   file (see Output).\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/pki/audit.py and src/pkiaudit/__main__.py in this\n#   assignment; each one gives its job at the top.\n#   Earlier files you can use: src/pkiaudit/pki/lint.py, src/pkiaudit/pki/chain.py,\n#   src/pkiaudit/x509/certificate.py, src/pkiaudit/ecc/curve.py and\n#   src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.pki import audit`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 16: Audit a PKI\n# Problem: problems/16-audit-pki.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 16 as `python -P tools/run_py.py\n#   solutions 16 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 16`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/pki/audit.py and src/pkiaudit/__main__.py in this\n#   assignment; each one gives its job at the top.\n#   Earlier files you can use: src/pkiaudit/pki/lint.py, src/pkiaudit/pki/chain.py,\n#   src/pkiaudit/x509/certificate.py, src/pkiaudit/ecc/curve.py and\n#   src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.pki import audit`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 16 (audit a PKI): audits the PKI in a test input.\n\nThe checker runs `assignment_16_audit_pki.py <input-file> <output-file>`. A test input is a PKI\nfile, and the expected output is the audit report, so this program uses the reader and the report\nfrom src/pkiaudit/pki/audit.py, the same ones the `pkiaudit audit` command uses.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.pki.audit import audit, read_pki\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes the audit report for the PKI in the input file.\"\"\"\n    with open(input_path, encoding=\"utf-8\") as f:\n        report = audit(read_pki(f))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(report.lines()) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/pki/audit.py","role":"new","purpose":"It audits a whole PKI file: a lint finding for every key, a verdict for every chain, and the chains each signing key would break if it leaked. The checker's program and the `pkiaudit audit` command both print its report.","job":"Write the PKI audit in `pki/audit.py`, from reading a PKI file to the lines of its report. Read the `blocklist`, `anchor`, `cert` and `chain` lines (see Input), then lint every key with your `lint_key` from assignment 13 against the whole blocklist, wherever its lines appear in the file, and validate every chain against all the anchors with your `validate_chain` from assignment 09, with no current time. Work out which chains depend on each signing key (see The three things you report), then write the report's `key`, `chain` and `exposed` lines (see Output).","blank":"# ======================================================================================\n# Assignment 16: Audit a PKI\n# Problem: problems/16-audit-pki.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   It audits a whole PKI file: a lint finding for every key, a verdict for every chain,\n#   and the chains each signing key would break if it leaked. The checker's program and\n#   the `pkiaudit audit` command both print its report.\n#\n# Your job:\n#   Write the PKI audit in `pki/audit.py`, from reading a PKI file to the lines of its\n#   report. Read the `blocklist`, `anchor`, `cert` and `chain` lines (see Input), then\n#   lint every key with your `lint_key` from assignment 13 against the whole blocklist,\n#   wherever its lines appear in the file, and validate every chain against all the\n#   anchors with your `validate_chain` from assignment 09, with no current time. Work out\n#   which chains depend on each signing key (see The three things you report), then write\n#   the report's `key`, `chain` and `exposed` lines (see Output).\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 16: Audit a PKI\n# Problem: problems/16-audit-pki.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   It audits a whole PKI file: a lint finding for every key, a verdict for every chain,\n#   and the chains each signing key would break if it leaked. The checker's program and\n#   the `pkiaudit audit` command both print its report.\n#\n# Your job:\n#   Write the PKI audit in `pki/audit.py`, from reading a PKI file to the lines of its\n#   report. Read the `blocklist`, `anchor`, `cert` and `chain` lines (see Input), then\n#   lint every key with your `lint_key` from assignment 13 against the whole blocklist,\n#   wherever its lines appear in the file, and validate every chain against all the\n#   anchors with your `validate_chain` from assignment 09, with no current time. Work out\n#   which chains depend on each signing key (see The three things you report), then write\n#   the report's `key`, `chain` and `exposed` lines (see Output). The Boilerplate gives\n#   you the declarations; fill in each TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Auditing a whole PKI (assignment 16).\n\nThe audit makes the findings eMudhra, Mozilla and Chrome needed after the disclosure, for every\nkey and chain in a PKI file:\n\n| Finding | How the audit finds it |\n|---|---|\n| bad keys | assignment 13's lint, anchors included |\n| the chains a verifier trusts | assignment 09's checks, with no current time |\n| each signing key's blast radius | the chains that depend on the key, and would break if it leaked |\n\nA PKI file declares one thing per line, and the audit reads it in this format:\n\n| Line | Declares |\n|---|---|\n| blocklist <curve> <x> <y> | a known-compromised public key |\n| anchor <id> <curve> <x> <y> | a trust anchor, a public key with no certificate |\n| cert <id> <hex> | a DER certificate |\n| chain <chain-id> <id> <id> ... | a chain of certificate ids, leaf first |\n\nThe report has a `key` line per anchor and certificate, a `chain` line per chain, and an\n`exposed` line per key that some chain depends on.\n\"\"\"\n\nfrom collections.abc import Iterable, Sequence\nfrom dataclasses import dataclass, field\n\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.ecc.curves import CURVES\nfrom pkiaudit.pki.chain import Anchor, ChainResult, validate_chain\nfrom pkiaudit.pki.lint import lint_key\nfrom pkiaudit.x509.certificate import parse_certificate\n\n\n@dataclass\nclass Pki:\n    \"\"\"The declarations of a PKI file, each kind in file order.\"\"\"\n\n    blocklist: set[tuple[str, tuple[int, int]]] = field(default_factory=set)  # (curve name, (x, y))\n    keys: dict[str, tuple[Curve, tuple[int, int]]] = field(default_factory=dict)  # anchor and cert ids\n    anchors: list[Anchor] = field(default_factory=list)\n    certificates: dict[str, bytes] = field(default_factory=dict)  # cert id -> DER\n    chains: list[tuple[str, list[str]]] = field(default_factory=list)  # (chain id, cert ids leaf first)\n\n\n@dataclass\nclass AuditReport:\n    \"\"\"The audit's findings, in the order the report lists them.\"\"\"\n\n    keys: list[tuple[str, str | None]]  # (key id, lint finding or None)\n    chains: list[tuple[str, ChainResult]]  # (chain id, verdict)\n    exposed: dict[str, list[str]]  # key id -> the chains that depend on it\n\n    def lines(self) -> list[str]:\n        \"\"\"Returns the report as text, one finding per line.\"\"\"\n        # TODO: the `key`, `chain` and `exposed` lines, in that order; see \"Output\" on the\n        # problem page.\n        raise NotImplementedError(\"AuditReport.lines\")\n\n\ndef read_pki(lines: Iterable[str]) -> Pki:\n    \"\"\"Reads the lines of a PKI file.\"\"\"\n    # TODO: one declaration per line; a `cert` line's key comes from your parse_certificate. See\n    # \"Input\" on the problem page.\n    raise NotImplementedError(\"read_pki\")\n\n\ndef blast_radius(chains: Sequence[tuple[str, list[str]]],\n                 results: Sequence[ChainResult]) -> dict[str, list[str]]:\n    \"\"\"Maps each key id to the chains that depend on it, in chain order.\"\"\"\n    # TODO: the signers each chain depends on; see \"Report blast radius\" under \"The three things\n    # you report\" on the problem page.\n    raise NotImplementedError(\"blast_radius\")\n\n\ndef audit(pki: Pki) -> AuditReport:\n    \"\"\"Lints every key, validates every chain against every anchor, and works out the blast radius.\"\"\"\n    # The whole blocklist applies to every key, wherever the file declares it.\n    # TODO: your lint_key on every key, your validate_chain on every chain with no current time,\n    # then blast_radius; see \"The three things you report\" on the problem page.\n    raise NotImplementedError(\"audit\")\n"},{"path":"solutions/src/pkiaudit/__main__.py","role":"new","purpose":"This is the finished command-line program. `pkiaudit audit <pki-file>`, or `python -m pkiaudit audit <pki-file>`, prints the audit report for a PKI file, using your `pki/audit.py`.","job":"Write the `pkiaudit audit <pki-file>` command: read the command line with `argparse`, audit the file with your `pki/audit.py` and print the report, one line at a time. The checker doesn't run it, and the Boilerplate already contains it. Try it on the sample PKI with `py -P tools/run_py.py solutions -m pkiaudit audit solutions/examples/sample.pki`.","blank":"# ======================================================================================\n# Assignment 16: Audit a PKI\n# Problem: problems/16-audit-pki.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This is the finished command-line program. `pkiaudit audit <pki-file>`, or `python -m\n#   pkiaudit audit <pki-file>`, prints the audit report for a PKI file, using your\n#   `pki/audit.py`.\n#\n# Your job:\n#   Write the `pkiaudit audit <pki-file>` command: read the command line with `argparse`,\n#   audit the file with your `pki/audit.py` and print the report, one line at a time. The\n#   checker doesn't run it, and the Boilerplate already contains it. Try it on the sample\n#   PKI with `py -P tools/run_py.py solutions -m pkiaudit audit\n#   solutions/examples/sample.pki`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 16: Audit a PKI\n# Problem: problems/16-audit-pki.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This is the finished command-line program. `pkiaudit audit <pki-file>`, or `python -m\n#   pkiaudit audit <pki-file>`, prints the audit report for a PKI file, using your\n#   `pki/audit.py`.\n#\n# Your job:\n#   The Boilerplate gives you this file finished: the declarations. You fill in the TODOs\n#   in this assignment's other files.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"The pkiaudit command (assignment 16).\n\n    pkiaudit audit <pki-file>        prints the audit report for a PKI file\n    python -m pkiaudit audit <pki-file>\n\npki/audit.py describes the file format and the report.\n\"\"\"\n\nimport argparse\nimport sys\n\nfrom pkiaudit.pki.audit import audit, read_pki\n\n\ndef main(argv: list[str] | None = None) -> int:\n    \"\"\"Runs the command with `argv` (sys.argv[1:] when None) and returns its exit code.\"\"\"\n    parser = argparse.ArgumentParser(prog=\"pkiaudit\", description=\"Audit a small public-key infrastructure.\")\n    commands = parser.add_subparsers(dest=\"command\", required=True)\n    audit_command = commands.add_parser(\n        \"audit\", help=\"lint every key, validate every chain and report each signing key's blast radius\")\n    audit_command.add_argument(\"pki_file\", help=\"a file of blocklist, anchor, cert and chain lines\")\n    args = parser.parse_args(argv)\n\n    with open(args.pki_file, encoding=\"utf-8\") as f:\n        report = audit(read_pki(f))\n    for line in report.lines():\n        print(line)\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n"}],"buildsOn":[{"path":"solutions/src/pkiaudit/pki/lint.py","owner":"13","purpose":"It decides whether a public key is safe to trust: the point is on its curve, it is not on a blocklist of known-compromised keys, and its private key is not small enough to find by search. Assignment 16 lints every key in a PKI with it."},{"path":"solutions/src/pkiaudit/pki/chain.py","owner":"09","purpose":"This module decides whether a verifier should trust a chain of certificates, leaf first, that ends at one of its trust anchors, and names the first check that fails if not. Assignment 16 runs it over every chain in a PKI to find the chains a bad key breaks."},{"path":"solutions/src/pkiaudit/x509/certificate.py","owner":"06","purpose":"This module reads the fields of an X.509 certificate that the project needs: the subject and issuer names, the validity window, the elliptic-curve public key and whether the certificate is a CA. Assignment 07 finds the public key field through it, 08 the signed bytes, and 09 and 16 validate chains with the fields it reads."},{"path":"solutions/src/pkiaudit/ecc/curve.py","owner":"02","purpose":"This module holds the elliptic-curve group law: the curve type, points, the point at infinity and the rule that adds two points. Assignment 03 adds scalar multiplication to it, and your ECDSA code from assignment 04 and the weak-key search in assignment 10 run on its point addition."},{"path":"solutions/src/pkiaudit/ecc/curves.py","owner":"02","purpose":"This module holds the constants of every curve the project uses: the toy curve now, and P-256 and P-384, which assignment 03 adds. Later assignments look up P-256 and P-384 here, from the certificate reader in assignment 06 to the PKI audit in assignment 16."}],"indent":4,"tags":[{"label":"Language","items":["graphs built from dictionaries","structured state"],"text":["graphs built from dictionaries","structured state"]},{"label":"Library","items":["none needed beyond what assignments 05 to 13 already use"],"text":["none needed beyond what assignments 05 to 13 already use"]},{"label":"Concepts","items":["key linting","chain validation","blast radius"],"text":["key linting","chain validation","blast radius"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that audits a small PKI: it lints every key, validates every chain, and reports, for every key that signs something, the chains that depend on it.<\/p>\n<h3>The three things you report<\/h3>\n<ol><li>Lint every key, anchors included, with assignment 13's three checks in the same priority order: off-curve, known-compromised (on the blocklist), and weak (a small private key, found by assignment 10's bounded search). In assignment 13 the blocklist grew as the program read. Here every <code>blocklist<\/code> line applies to every key in the file, including keys declared before it.<\/li><li>Validate every chain with three of assignment 09's four checks, in the same order: signatures, CA permission and path length. The input has no <code>now<\/code> line, so there is no time to check a certificate's validity window against. Assignment 09 covers that check, and repeating it here would test the same thing twice. A chain here names no anchor: its topmost certificate must be signed by any anchor declared anywhere in this PKI. That's assignment 09's \"try each\" rule for several anchors, applied to every anchor in the PKI.<\/li><li>Report the blast radius of every key that sits in a signer's position in some chain (an intermediate or anchor one step above a leaf or another intermediate): every chain that depends on it. This is structural: it follows where a key sits in a chain's list, whether or not every signature along that chain verifies. A certificate that names an issuer that didn't sign it (<code>bad-signature<\/code>) still has that issuer in its structure, so the issuer still gets an <code>exposed<\/code> line for that chain. A chain that depends on a forged link is a finding an audit should surface. A leaf's own key gets no report, because it signs nothing.<\/li><\/ol>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains, in any order except as noted:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>blocklist &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>A known-compromised public key. It applies to every key in the file, wherever the <code>blocklist<\/code> line appears, so read the whole file before you lint any key.<\/td><\/tr><tr><td><code>anchor &lt;id&gt; &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>A trust anchor: a public key the verifier already trusts, with no certificate of its own. <code>id<\/code> is a word with no spaces, unique across every <code>anchor<\/code> and <code>cert<\/code> line.<\/td><\/tr><tr><td><code>cert &lt;id&gt; &lt;hex&gt;<\/code><\/td><td>A full DER certificate, in the same format as assignments 06 to 09.<\/td><\/tr><tr><td><code>chain &lt;chain-id&gt; &lt;id&gt; &lt;id&gt; ...<\/code><\/td><td>A chain: certificate ids only, leaf first, most senior last. No anchor id appears here: your program finds the topmost certificate's signer among all the declared anchors.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Every <code>anchor<\/code> and <code>cert<\/code> line comes before any <code>chain<\/code> line that uses its id.<\/p>\n<h3>Output<\/h3>\n<p>Three kinds of line, in this order:<\/p>\n<pre><code>key &lt;id&gt; &lt;ok|off-curve|known-compromised|weak&gt;\nchain &lt;chain-id&gt; &lt;trusted|untrusted &lt;reason&gt;&gt;\nexposed &lt;id&gt; &lt;chain-id&gt; &lt;chain-id&gt; ...<\/code><\/pre>\n<ul><li>One <code>key<\/code> line per declared <code>anchor<\/code> or <code>cert<\/code>, in input order.<\/li><li>One <code>chain<\/code> line per <code>chain<\/code> line, in input order. <code>&lt;reason&gt;<\/code> is one of <code>bad-signature<\/code>, <code>unknown-anchor<\/code>, <code>not-a-ca<\/code> and <code>path-too-long<\/code>, four of assignment 09's five words. <code>expired<\/code> never appears, because the input has no <code>now<\/code> line to check validity windows against (see \"Validate every chain\" above).<\/li><li>One <code>exposed<\/code> line per key that sits in a signer's position in some chain (by structure, as above), in input order. It lists every chain id that depends on the key, separated by spaces, in the order the input declares those chains. A key that no chain depends on gets no <code>exposed<\/code> line, not even an empty one.<\/li><\/ul>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Every key is linted, anchors included, in input order: off-curve, known-compromised, weak or ok, in that priority. A key that is both weak and blocklisted reports known-compromised, because that check runs first.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Every chain is validated in input order with three of assignment 09's checks (signatures, CA permission and path length, but not validity, which the input has no <code>now<\/code> line for) and four of its reason words. The topmost certificate's signer is any declared anchor, since the chain names none.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Every key that sits in a signer's position in at least one chain gets an <code>exposed<\/code> line listing every chain that depends on it. A leaf's own key gets none.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>A key shared by two chains (the same intermediate, or the same anchor, signs both) is exposed by both. This is the blast-radius lesson: one compromised key can threaten more than one chain at once.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Keys on both curves get the right lint finding. Full chain validation here is P-384 only, matching the scope of assignments 06 to 09 (a P-256 certificate would need SHA-256 instead of SHA-384), so a P-256 key is linted but never put in a chain.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate is P-384, matching the scope of assignments 06 to 09. A P-256 key may appear as an <code>anchor<\/code> or a standalone <code>cert<\/code> for linting, but never inside a <code>chain<\/code> line.<\/li><li>Ids (<code>anchor<\/code> and <code>cert<\/code> together) are unique within one input. A <code>chain<\/code> line's ids all refer to <code>cert<\/code> lines declared before it.<\/li><li>The input has no <code>now<\/code> line and no <code>expired<\/code> reason. Validity was assignment 09's lesson, and this assignment's new idea is blast radius.<\/li><li>Each case has a 10-second limit. The bounded search that linting uses (assignment 10's) has the same budget as in assignment 13.<\/li><li>There are 12 tests: the examples above, both curves, a key that's both weak and blocklisted (R1), the <code>not-a-ca<\/code>, <code>path-too-long<\/code> and <code>unknown-anchor<\/code> reasons reached through this assignment's \"any anchor\" rule (R2), a 2-level chain confirming that a leaf gets no <code>exposed<\/code> line (R3), and an end-to-end PKI shaped like the real incident: one root, a weak intermediate signing two leaves, and a strong intermediate signing a third. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/pkiaudit/pki/audit.py","text":"\"\"\"Auditing a whole PKI (assignment 16).\n\nThe audit makes the findings eMudhra, Mozilla and Chrome needed after the disclosure, for every\nkey and chain in a PKI file:\n\n| Finding | How the audit finds it |\n|---|---|\n| bad keys | assignment 13's lint, anchors included |\n| the chains a verifier trusts | assignment 09's checks, with no current time |\n| each signing key's blast radius | the chains that depend on the key, and would break if it leaked |\n\nA PKI file declares one thing per line, and the audit reads it in this format:\n\n| Line | Declares |\n|---|---|\n| blocklist <curve> <x> <y> | a known-compromised public key |\n| anchor <id> <curve> <x> <y> | a trust anchor, a public key with no certificate |\n| cert <id> <hex> | a DER certificate |\n| chain <chain-id> <id> <id> ... | a chain of certificate ids, leaf first |\n\nThe report has a `key` line per anchor and certificate, a `chain` line per chain, and an\n`exposed` line per key that some chain depends on.\n\"\"\"\n\nfrom collections.abc import Iterable, Sequence\nfrom dataclasses import dataclass, field\n\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.ecc.curves import CURVES\nfrom pkiaudit.pki.chain import Anchor, ChainResult, validate_chain\nfrom pkiaudit.pki.lint import lint_key\nfrom pkiaudit.x509.certificate import parse_certificate\n\n\n@dataclass\nclass Pki:\n    \"\"\"The declarations of a PKI file, each kind in file order.\"\"\"\n\n    blocklist: set[tuple[str, tuple[int, int]]] = field(default_factory=set)  # (curve name, (x, y))\n    keys: dict[str, tuple[Curve, tuple[int, int]]] = field(default_factory=dict)  # anchor and cert ids\n    anchors: list[Anchor] = field(default_factory=list)\n    certificates: dict[str, bytes] = field(default_factory=dict)  # cert id -> DER\n    chains: list[tuple[str, list[str]]] = field(default_factory=list)  # (chain id, cert ids leaf first)\n\n\n@dataclass\nclass AuditReport:\n    \"\"\"The audit's findings, in the order the report lists them.\"\"\"\n\n    keys: list[tuple[str, str | None]]  # (key id, lint finding or None)\n    chains: list[tuple[str, ChainResult]]  # (chain id, verdict)\n    exposed: dict[str, list[str]]  # key id -> the chains that depend on it\n\n    def lines(self) -> list[str]:\n        \"\"\"Returns the report as text, one finding per line.\"\"\"\n        lines = [f\"key {key_id} {finding or 'ok'}\" for key_id, finding in self.keys]\n        for chain_id, result in self.chains:\n            verdict = \"trusted\" if result.trusted else f\"untrusted {result.reason}\"\n            lines.append(f\"chain {chain_id} {verdict}\")\n        lines += [f\"exposed {key_id} {' '.join(chain_ids)}\" for key_id, chain_ids in self.exposed.items()]\n        return lines\n\n\ndef read_pki(lines: Iterable[str]) -> Pki:\n    \"\"\"Reads the lines of a PKI file.\"\"\"\n    pki = Pki()\n    for line in lines:\n        words = line.split()\n        if not words:\n            continue\n        if words[0] == \"blocklist\":\n            pki.blocklist.add((words[1], (int(words[2], 16), int(words[3], 16))))\n        elif words[0] == \"anchor\":\n            _, anchor_id, curve_name, x, y = words\n            anchor = Anchor(CURVES[curve_name], (int(x, 16), int(y, 16)), anchor_id)\n            pki.anchors.append(anchor)\n            pki.keys[anchor_id] = (anchor.curve, anchor.public_key)\n        elif words[0] == \"cert\":\n            _, cert_id, cert_hex = words\n            cert_bytes = bytes.fromhex(cert_hex)\n            cert = parse_certificate(cert_bytes)\n            pki.certificates[cert_id] = cert_bytes\n            pki.keys[cert_id] = (cert.curve, cert.public_key)\n        elif words[0] == \"chain\":\n            pki.chains.append((words[1], words[2:]))\n    return pki\n\n\ndef blast_radius(chains: Sequence[tuple[str, list[str]]],\n                 results: Sequence[ChainResult]) -> dict[str, list[str]]:\n    \"\"\"Maps each key id to the chains that depend on it, in chain order.\"\"\"\n    # A chain depends on every certificate above its leaf, whether or not their signatures\n    # verified, and on the anchor that signed its topmost certificate, if one did.\n    exposed: dict[str, list[str]] = {}\n    for (chain_id, cert_ids), result in zip(chains, results):\n        for signer_id in cert_ids[1:]:\n            exposed.setdefault(signer_id, []).append(chain_id)\n        if result.anchor is not None:\n            exposed.setdefault(result.anchor.name, []).append(chain_id)\n    return exposed\n\n\ndef audit(pki: Pki) -> AuditReport:\n    \"\"\"Lints every key, validates every chain against every anchor, and works out the blast radius.\"\"\"\n    # The whole blocklist applies to every key, wherever the file declares it.\n    keys = [(key_id, lint_key(curve, public_key, pki.blocklist))\n            for key_id, (curve, public_key) in pki.keys.items()]\n    results = [validate_chain([pki.certificates[cert_id] for cert_id in cert_ids], pki.anchors)\n               for _chain_id, cert_ids in pki.chains]\n    exposed = blast_radius(pki.chains, results)\n    return AuditReport(\n        keys=keys,\n        chains=[(chain_id, result) for (chain_id, _ids), result in zip(pki.chains, results)],\n        exposed={key_id: exposed[key_id] for key_id in pki.keys if key_id in exposed},\n    )\n"},{"path":"assignments/assignment_16_audit_pki.py","text":"\"\"\"Assignment 16 (audit a PKI): audits the PKI in a test input.\n\nThe checker runs `assignment_16_audit_pki.py <input-file> <output-file>`. A test input is a PKI\nfile, and the expected output is the audit report, so this program uses the reader and the report\nfrom src/pkiaudit/pki/audit.py, the same ones the `pkiaudit audit` command uses.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.pki.audit import audit, read_pki\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes the audit report for the PKI in the input file.\"\"\"\n    with open(input_path, encoding=\"utf-8\") as f:\n        report = audit(read_pki(f))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(report.lines()) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/pki/__init__.py","src/pkiaudit/ecc/__init__.py","src/pkiaudit/ecc/curve.py","src/pkiaudit/ecc/curves.py","src/pkiaudit/pki/chain.py","src/pkiaudit/pki/lint.py","src/pkiaudit/x509/__init__.py","src/pkiaudit/x509/certificate.py","src/pkiaudit/ecc/modmath.py","src/pkiaudit/x509/signature.py","src/pkiaudit/attack/__init__.py","src/pkiaudit/attack/weak_key.py","src/pkiaudit/asn1/__init__.py","src/pkiaudit/asn1/der.py","src/pkiaudit/ecc/ecdsa.py"],"proof":{"passed":12,"total":12,"date":"2026-10-22"}},"read":"<p>This page is complete on its own. The capstone has no new source material: it combines assignments 06, 09, 10 and 13 and applies them to a small public key infrastructure (PKI), a set of trust anchors, certificates and chains, instead of one key or one chain at a time. For the story behind it, eMudhra's <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">statement<\/a> is still the one to read.<\/p>","readTitle":"Read in the blog first","context":"<p>Each earlier assignment answered one question about one key or one chain. This one asks the questions an incident response has to answer across a whole PKI: which keys are bad, which chains a verifier trusts, and, if a given key turned out to be compromised, which chains it would break. That last question, the key's blast radius, is new. eMudhra, Mozilla and Chrome had to work it out within hours of the disclosure: what a bad key reaches, as well as whether it's bad.<\/p>\n<p>Your new <code>pki/audit.py<\/code> puts your earlier modules together: <code>lint_key<\/code> from your <code>pki/lint.py<\/code> (assignment 13), <code>validate_chain<\/code> and <code>Anchor<\/code> from your <code>pki/chain.py<\/code> (assignment 09), <code>parse_certificate<\/code> from your <code>x509/certificate.py<\/code> (assignment 06), and the curves in your <code>ecc/curve.py<\/code> and <code>ecc/curves.py<\/code>. This is the last part of your project: <code>__main__.py<\/code> turns it into a program you can run, <code>pkiaudit audit &lt;pki-file&gt;<\/code>.<\/p>","sources":"<ul><li>Every earlier assignment in this workbook, above all 06, 09, 10 and 13<\/li><li>eMudhra, <a href=\"https://emudhra.com/en/post/certificate-security-incident\" target=\"_blank\" rel=\"noopener\">Statement on Recent Certificate Security Incident<\/a><\/li><\/ul>","checking":"<pre><code>.\\check 16                                run every test\n.\\check 16 -Case 16-R2-unknown-anchor     one test, showing its full input, expected output and your output\n.\\check 16 -Fresh                         a new set of tests (new random seed)\n.\\check 16 -Dispute &lt;id&gt; &quot;why&quot;            set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R1  Every key is linted (anchors included), in input order: off-curve... .    4 / 5   FAILED\n      x 16-R1-priority  a key that is both weak (d=56) and on the blocklist: known-compromised wins (checked first)\n          line 2: expected `key weak-and-blocked known-compromised`, got `key weak-and-blocked weak`\n          likely cause: R1 - Every key is linted (anchors included), in input order: off-curve, known-compromised, weak or ok, in that priority, by the same rules as assignment 13\n          expected values from: cryptography 41.0.7 / OpenSSL (key checks and openssl verify): independent of this assignment&#x27;s own lint, chain and blast-radius logic\n          reproduce: py -P tools/run_py.py solutions 16 build/cases/16/16-R1-priority.in build/cases/16/16-R1-priority.out<\/code><\/pre>\n<p>To run the finished command on the sample PKI in your project, use <code>py -P tools/run_py.py solutions -m pkiaudit audit solutions/examples/sample.pki<\/code>.<\/p>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p><code>lint_key<\/code> is your <code>pki/lint.py<\/code> from assignment 13, unchanged. <code>parse_certificate<\/code> from your <code>x509/certificate.py<\/code> (assignment 06) gives each certificate's curve and public key. <code>validate_chain<\/code> from your <code>pki/chain.py<\/code> (assignment 09) already tries every anchor it's given. The new pieces are <code>read_pki<\/code>, <code>blast_radius<\/code>, <code>audit<\/code> and the report's <code>lines<\/code>, and they're bookkeeping, with no new cryptography.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p><code>read_pki<\/code> keeps every declared key (anchor or cert) in one dictionary from id to its curve and public key, in input order. It also keeps the anchors as a list of <code>Anchor<\/code> values and each certificate's DER under its id. <code>audit<\/code> lints every key against the whole blocklist, then calls <code>validate_chain<\/code> on each chain's certificates with every anchor in the PKI and no <code>now<\/code>. Keep each chain's <code>ChainResult<\/code>: its <code>anchor<\/code> field says which anchor verified the topmost certificate (or that none did), and <code>blast_radius<\/code> needs that as well as the verdict. If your assignment 09 <code>validate_chain<\/code> leaves <code>anchor<\/code> empty, fill it in now.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>The priority order for linting is off-curve, then known-compromised, then weak. A key that's both weak and blocklisted must report known-compromised.<\/li><li>Every <code>blocklist<\/code> line applies to every key, including keys declared above it. Read the whole file before you lint anything.<\/li><li>\"Any declared anchor\" means trying all of them for the topmost certificate, not stopping at the first one declared. A chain can validate against an anchor that comes after an unrelated one in the input.<\/li><li>Blast radius counts every id in a chain's list except the leaf (position 0), and whichever anchor verified the topmost certificate. Both kinds of key get <code>exposed<\/code> lines.<\/li><li>A chain that fails with <code>unknown-anchor<\/code> contributes no anchor <code>exposed<\/code> line, since no anchor verified it, but its intermediates still do, if it has any. Exposure from a mid-chain signer comes from the chain's structure, whether or not the chain validates.<\/li><li>Don't give a key an <code>exposed<\/code> line with an empty list. If nothing depends on it, leave it out.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>for each declared key (anchor or cert), in order:\n    print &quot;key&quot;, id, lint_key(curve, (x, y), blocklist) or &quot;ok&quot;\n\nmatched = {}  # chain_id -&gt; which anchor verified it, or none\nfor each chain, in order:\n    # your validate_chain(certs, anchors) from assignment 09 does this part\n    certs = [parsed cert for each id in the chain]\n    ok = true\n    for i in 0 .. len(certs) - 2:\n        if not signed_by(certs[i], certs[i+1]): ok = false, reason = &quot;bad-signature&quot;; break\n    if ok:\n        matched[chain_id] = first anchor whose key verifies certs[-1], or none\n        if matched[chain_id] is none: ok = false, reason = &quot;unknown-anchor&quot;\n    if ok:\n        for cert in certs[1:]: if not cert.ca: ok = false, reason = &quot;not-a-ca&quot;; break\n    if ok:\n        for i in 1 .. len(certs)-1: if path length violated: ok = false, reason = &quot;path-too-long&quot;; break\n    # no validity step here: there is no &quot;now&quot; in this assignment&#x27;s input (assignment 09 covers it)\n    print &quot;chain&quot;, chain_id, &quot;trusted&quot; if ok else &quot;untrusted &quot; + reason\n\nexposed = {}  # id -&gt; [chain ids]\nfor each chain:\n    for id in chain.ids[1:]: exposed[id].append(chain_id)       # certs that signed something\n    if matched[chain_id] is not none: exposed[matched[chain_id]].append(chain_id)  # the anchor\nfor each declared key, in order:\n    if id in exposed: print &quot;exposed&quot;, id, *exposed[id]<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"an anchor key off the curve, alongside a clean chain","test":"16-R1-off-curve","input":"anchor off-curve-anchor P-384 f3ef666c9d167c1b012da9b0343fe017dec1597a2ef6fdbcd6a03ed878e09e499a05b8b3bd035fd09efe358b97a62de7 f69e63e4fc03a6fbfe16d399f5c0dcfa4a1ca59209a7591488e99540bc0796ceadabd4282cf42c9425ffaabe89396787\nanchor root1 P-384 f3ef666c9d167c1b012da9b0343fe017dec1597a2ef6fdbcd6a03ed878e09e499a05b8b3bd035fd09efe358b97a62de7 f69e63e4fc03a6fbfe16d399f5c0dcfa4a1ca59209a7591488e99540bc0796ceadabd4282cf42c9425ffaabe89396786\ncert leaf1 <hex, a certificate issued by root1>\nchain c1 leaf1","output":"key off-curve-anchor off-curve\nkey root1 ok\nkey leaf1 ok\nchain c1 trusted\nexposed root1 c1","image":null,"explain":"<p><code>off-curve-anchor<\/code> has the same x as <code>root1<\/code>, with y one higher, so it fails the curve equation. No chain uses it, but your program lints every declared key. <code>root1<\/code> signs <code>leaf1<\/code>, so the chain is trusted against it, and <code>root1<\/code> gets an <code>exposed<\/code> line.<\/p>"},{"label":"Example 2","name":"the recovered incident value","test":"16-R1-weak-d4
