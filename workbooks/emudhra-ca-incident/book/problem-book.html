346b","output":"cert ca Example-CA-Pathlen-1 Example-Root\nvalidity 250101000000Z 260101000000Z\nkey P-384 e1623e85fc905a98a7d91c6dc26756f4c066161013d55fa7f7ad67897920f7a685f7bc8dd5ade34e9b1f25b65a9d9e23 d97999d8a6638bbaf8def683da109ab03f8030fcd5c939c93a8e56d3ae60979440ee04be5d1288297aa111afebd07bba\nca true 1","image":null,"explain":"<p>The certificate carries a BasicConstraints extension whose content decodes to <code>SEQUENCE { BOOLEAN true, INTEGER 1 }<\/code>: <code>cA<\/code> is present and true, and <code>pathLenConstraint<\/code> is <code>1<\/code>.<\/p>"},{"label":"Example 2","name":"no extensions at all","test":"06-R6-no-basic-constraints","input":"cert plain 308201233081caa003020102020101300a06082a8648ce3d040302301f311d301b06035504030c144e6f2d457874656e73696f6e732d497373756572301e170d3235303130313030303030305a170d3236303130313030303030305a30183116301406035504030c0d4e6f2d457874656e73696f6e733059301306072a8648ce3d020106082a8648ce3d03010703420004fdefa4845516df81e692b44605f484718dc2fe2edcf5d0b79ad85fbb655dc72ce86f7ee0ed72f65e897ecada18a82d161eb1feb3fa8b0798582f21fbe45451ea300a06082a8648ce3d0403020348003045022100b009db1bcf6a306229bb122b3271e64a5d44ad6874e22067f59a4dc1230d2a350220674d5f5b01adc3d5f8859190bd5016a1301facff5a28b5993d9f1bc65fa608ca","output":"cert plain No-Extensions No-Extensions-Issuer\nvalidity 250101000000Z 260101000000Z\nkey P-256 fdefa4845516df81e692b44605f484718dc2fe2edcf5d0b79ad85fbb655dc72c e86f7ee0ed72f65e897ecada18a82d161eb1feb3fa8b0798582f21fbe45451ea\nca false none","image":null,"explain":"<p><code>tbsCertificate<\/code> has no eighth field: its last child is <code>subjectPublicKeyInfo<\/code>. With no extensions to look inside, the default applies.<\/p>"},{"label":"Example 3","name":"several certificates, one chain-shaped input","test":"06-E2E-chain-shaped","input":"cert root 3082016f3081f5a003020102020101300a06082a8648ce3d04030330183116301406035504030c0d576f726b626f6f6b2d526f6f74301e170d3235303130313030303030305a170d3236303130313030303030305a30183116301406035504030c0d576f726b626f6f6b2d526f6f743076301006072a8648ce3d020106052b8104002203620004507ddbbe1b5b4597fc94fa596afd5ea790ac82c752252ffe9e9b95cd696bbcf103cd95cac83c0b40fdb9d8d792defb500ccf0104f13d368f620e6de88ce4b96aa8190b9b968da2ef552251f69940df65343559faa197374de240d48ee4d99028a3133011300f0603551d130101ff040530030101ff300a06082a8648ce3d0403030369003066023100c50214aa231c11efa95960923e47a020dd7cb43d7113da0acb9918a6ff007a2f1954ce263527a21c66b5057d855f10c7023100c1cadfb71f2a8e07f02f9988d99fe08c0688ee3920dd400cc0496f7db5899af7d1e5ee1f349c13b98377aeb172b68987\ncert intermediate 3082017a30820100a003020102020101300a06082a8648ce3d04030330183116301406035504030c0d576f726b626f6f6b2d526f6f74301e170d3235303130313030303030305a170d3236303130313030303030305a3020311e301c06035504030c15576f726b626f6f6b2d496e7465726d6564696174653076301006072a8648ce3d020106052b810400220362000465fcfdf22ddb0828646fa09dd6ac70346910523bc4dc5685f99ece135247f11246abb5a9b1a2566ccbc9722707e38be2da9f61bf80f5ee378b911bf1fdc5b7d0bd16863e3dfc1fe45032a3ce0f6aa8d4f38ce5f59095592f155e15db7c636b64a316301430120603551d130101ff040830060101ff020100300a06082a8648ce3d0403030368003065023009ae7a7120d47ffc17a9961dae82bbaa12cc61edeb3772c42b1472bdadc2b3b62442f31d80280d0506447f561265390e023100a52b34c76fd7d65fe173ba0338700418bf8b42a5f6747ad9bb98c04a4785810a21bc9fc8d81dd3051869e811a31c9cb7\ncert leaf 308201603081e8a003020102020101300a06082a8648ce3d0403033020311e301c06035504030c15576f726b626f6f6b2d496e7465726d656469617465301e170d3235303130313030303030305a170d3236303130313030303030305a30183116301406035504030c0d576f726b626f6f6b2d4c6561663076301006072a8648ce3d020106052b8104002203620004e7b3aed763622f0e4776aa889b41b42354653dc964aea513a4498d785b0bb38952130cb33a0fe971f521257b484ba0bbb3d3be8724e1337d27043c65e65bcd10e10aa2b47d0e0091200e9c44328a8ac461b3b58a958e88b57c5acaa9a0514cc5300a06082a8648ce3d0403030367003064023028bde61493a39b95a28d3d84665ec4f879a27663704fb8fec2b47c2bf2dfa855bd47dfe08db7eee289dde50a0f14a5b202304365bf93be614e348762c9123dfc35fb5e15ee9c21762f07a371bf1e6371a559753e836fe94e20ad107c76352cc167ab","output":"cert root Workbook-Root Workbook-Root\nvalidity 250101000000Z 260101000000Z\nkey P-384 507ddbbe1b5b4597fc94fa596afd5ea790ac82c752252ffe9e9b95cd696bbcf103cd95cac83c0b40fdb9d8d792defb50 0ccf0104f13d368f620e6de88ce4b96aa8190b9b968da2ef552251f69940df65343559faa197374de240d48ee4d99028\nca true none\ncert intermediate Workbook-Intermediate Workbook-Root\nvalidity 250101000000Z 260101000000Z\nkey P-384 65fcfdf22ddb0828646fa09dd6ac70346910523bc4dc5685f99ece135247f11246abb5a9b1a2566ccbc9722707e38be2 da9f61bf80f5ee378b911bf1fdc5b7d0bd16863e3dfc1fe45032a3ce0f6aa8d4f38ce5f59095592f155e15db7c636b64\nca true 0\ncert leaf Workbook-Leaf Workbook-Intermediate\nvalidity 250101000000Z 260101000000Z\nkey P-384 e7b3aed763622f0e4776aa889b41b42354653dc964aea513a4498d785b0bb38952130cb33a0fe971f521257b484ba0bb b3d3be8724e1337d27043c65e65bcd10e10aa2b47d0e0091200e9c44328a8ac461b3b58a958e88b57c5acaa9a0514cc5\nca false none","image":null,"explain":"<p>Three input certificates give twelve output lines, four each, in order. This assignment doesn't check that <code>intermediate<\/code>'s signature came from <code>root<\/code>; assignment 08 does that.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>eMudhra's post has no code for this, so there is no author's version to compare. The reference <code>x509/certificate.py<\/code> reads each part with a function of its own (<code>read_name_cn<\/code>, <code>read_validity<\/code>, <code>read_public_key<\/code>, <code>read_basic_constraints<\/code>), and <code>parse_certificate<\/code> puts them together into a <code>Certificate<\/code>.<\/p>\n<p>To find <code>extensions<\/code>, the reference checks that there is a child after <code>subjectPublicKeyInfo<\/code> <em>and<\/em> that it carries tag <code>[3]<\/code>. A check for \"one more field than expected\" would also accept a stray extra field that isn't extensions. Compare that with the check you wrote.<\/p>"}},{"id":"07","num":"7","title":"Hash the public key (SPKI)","difficulty":"Easy","tests":6,"problem":"problems/07-spki-hash.md","entry":"solutions/assignments/assignment_07_spki_hash.py","files":[{"path":"solutions/assignments/assignment_07_spki_hash.py","role":"entry","purpose":null,"job":"Read each `cert` line of the input (see Input) and compute the certificate's SPKI hash with your `x509/spki.py`. Write one `spki` line per certificate, as Output shows.","blank":"# ======================================================================================\n# Assignment 07: Hash the public key (SPKI)\n# Problem: problems/07-spki-hash.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 07 as `python -P tools/run_py.py\n#   solutions 07 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 07`, or use Run and Submit in the book.\n#\n# Your job:\n#   Read each `cert` line of the input (see Input) and compute the certificate's SPKI hash\n#   with your `x509/spki.py`. Write one `spki` line per certificate, as Output shows.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/x509/spki.py in this assignment; each one gives its job at\n#   the top.\n#   Earlier files you can use: src/pkiaudit/asn1/der.py and\n#   src/pkiaudit/x509/certificate.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.x509 import spki`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 07: Hash the public key (SPKI)\n# Problem: problems/07-spki-hash.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 07 as `python -P tools/run_py.py\n#   solutions 07 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 07`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/x509/spki.py in this assignment; each one gives its job at\n#   the top.\n#   Earlier files you can use: src/pkiaudit/asn1/der.py and\n#   src/pkiaudit/x509/certificate.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.x509 import spki`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 07 (SPKI hash): prints the SPKI hash of each `cert` line of a test input.\n\nThe checker runs `assignment_07_spki_hash.py <input-file> <output-file>`.\nsrc/pkiaudit/x509/spki.py computes the hash.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.x509.spki import spki_hash\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `spki <label> <sha256-hex>` for each `cert <label> <hex>` line.\"\"\"\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if words and words[0] == \"cert\":\n                lines.append(f\"spki {words[1]} {spki_hash(bytes.fromhex(words[2]))}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/x509/spki.py","role":"new","purpose":"This module computes a key's SPKI hash, the SHA-256 of a certificate's subjectPublicKeyInfo bytes, which is how browsers name a key they block. The hash stays the same in every certificate that carries the key, and assignment 15 blocks whole chains by hashes like these.","job":"In `x509/spki.py`, find a certificate's subjectPublicKeyInfo field with your `x509/certificate.py` and return the SHA-256 of its original bytes, header included, as lowercase hex. Slice the bytes out of the certificate as they are, as \"What gets hashed\" describes, without re-encoding the field.","blank":"# ======================================================================================\n# Assignment 07: Hash the public key (SPKI)\n# Problem: problems/07-spki-hash.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module computes a key's SPKI hash, the SHA-256 of a certificate's\n#   subjectPublicKeyInfo bytes, which is how browsers name a key they block. The hash\n#   stays the same in every certificate that carries the key, and assignment 15 blocks\n#   whole chains by hashes like these.\n#\n# Your job:\n#   In `x509/spki.py`, find a certificate's subjectPublicKeyInfo field with your\n#   `x509/certificate.py` and return the SHA-256 of its original bytes, header included,\n#   as lowercase hex. Slice the bytes out of the certificate as they are, as \"What gets\n#   hashed\" describes, without re-encoding the field.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 07: Hash the public key (SPKI)\n# Problem: problems/07-spki-hash.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module computes a key's SPKI hash, the SHA-256 of a certificate's\n#   subjectPublicKeyInfo bytes, which is how browsers name a key they block. The hash\n#   stays the same in every certificate that carries the key, and assignment 15 blocks\n#   whole chains by hashes like these.\n#\n# Your job:\n#   In `x509/spki.py`, find a certificate's subjectPublicKeyInfo field with your\n#   `x509/certificate.py` and return the SHA-256 of its original bytes, header included,\n#   as lowercase hex. Slice the bytes out of the certificate as they are, as \"What gets\n#   hashed\" describes, without re-encoding the field. The Boilerplate gives you the\n#   declarations; fill in each TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"The SPKI hash: SHA-256 of a certificate's subjectPublicKeyInfo (assignment 07).\n\nBrowsers and CAs name a key by this hash when they block it. The hash covers the whole\nSubjectPublicKeyInfo SEQUENCE (the algorithm identifier and the BIT STRING), in its original bytes,\nso a key keeps its hash in every certificate that carries it.\n\"\"\"\n\nimport hashlib\n\nfrom pkiaudit.asn1 import der\nfrom pkiaudit.x509.certificate import PUBLIC_KEY_INFO, tbs_fields\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"Returns the subjectPublicKeyInfo node of a DER certificate.\"\"\"\n    # TODO: the same field your certificate.py reads the key from; see \"What gets hashed\" on the\n    # problem page.\n    raise NotImplementedError(\"find_spki\")\n\n\ndef spki_hash(cert_bytes: bytes) -> str:\n    \"\"\"Returns the SHA-256 of a certificate's subjectPublicKeyInfo bytes, as lowercase hex.\"\"\"\n    # TODO: hash the node's original bytes, header included; see \"What gets hashed\" on the\n    # problem page.\n    raise NotImplementedError(\"spki_hash\")\n"}],"buildsOn":[{"path":"solutions/src/pkiaudit/asn1/der.py","owner":"05","purpose":"This module reads DER, the tag-length-value encoding that holds every certificate in the project, into a tree of nodes, and decodes INTEGER, OBJECT IDENTIFIER and BIT STRING values. Your `x509/certificate.py` (assignment 06), `x509/spki.py` (07) and `x509/signature.py` (08) read certificates through it."},{"path":"solutions/src/pkiaudit/x509/certificate.py","owner":"06","purpose":"This module reads the fields of an X.509 certificate that the project needs: the subject and issuer names, the validity window, the elliptic-curve public key and whether the certificate is a CA. Assignment 07 finds the public key field through it, 08 the signed bytes, and 09 and 16 validate chains with the fields it reads."}],"indent":4,"tags":[{"label":"Language","items":["byte slicing","<code>hashlib.sha256<\/code> (or your language's SHA-256)"],"text":["byte slicing","hashlib.sha256 (or your language's SHA-256)"]},{"label":"Library","items":["none needed beyond a SHA-256 implementation"],"text":["none needed beyond a SHA-256 implementation"]},{"label":"Concepts","items":["SubjectPublicKeyInfo","SPKI pinning","CRLSet blocking"],"text":["SubjectPublicKeyInfo","SPKI pinning","CRLSet blocking"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that computes the SPKI hash of each certificate it reads: the SHA-256 of the original bytes of the certificate's <code>subjectPublicKeyInfo<\/code> field.<\/p>\n<h3>What gets hashed<\/h3>\n<p><code>subjectPublicKeyInfo<\/code> is the whole <code>SEQUENCE { algorithm AlgorithmIdentifier, subjectPublicKey BIT STRING }<\/code>. Assignment 06's <code>key<\/code> line came from the same field: the 7th child of <code>tbsCertificate<\/code>, counting the version (version, serialNumber, signature, issuer, validity, subject, then <code>subjectPublicKeyInfo<\/code>).<\/p>\n<p>The hash is the SHA-256 of that whole SEQUENCE's original DER bytes, which include:<\/p>\n<ul><li>the SEQUENCE's own tag and length bytes;<\/li><li>the AlgorithmIdentifier, which names the key type and the curve;<\/li><li>the BIT STRING, with its tag, its length and its unused-bits byte.<\/li><\/ul>\n<p>Hashing only the point inside the BIT STRING, or only the algorithm identifier, gives a different hash. Slice the bytes out of the certificate as they are, from the field's first header byte to its last content byte, and compare your output with the examples: the checker expects the bytes OpenSSL's own pipeline hashes.<\/p>\n<p>These OpenSSL commands compute the same hash:<\/p>\n<pre><code>openssl x509 -pubkey -noout -inform DER -in cert.der | openssl pkey -pubin -outform DER | openssl dgst -sha256<\/code><\/pre>\n<p>The first command extracts the public key as a PEM SubjectPublicKeyInfo block, the second re-encodes it as DER, and the third hashes those bytes.<\/p>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains one kind of line:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>cert &lt;label&gt; &lt;hex&gt;<\/code><\/td><td>A full DER-encoded certificate, the same shape as assignment 06's input. Each input stands alone: you don't need assignment 06's output. <code>label<\/code> is a word with no spaces.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each <code>cert<\/code> line, in input order, write one line:<\/p>\n<pre><code>spki &lt;label&gt; &lt;hash&gt;<\/code><\/pre>\n<p><code>&lt;hash&gt;<\/code> is the SHA-256 digest as 64 lowercase hex characters. The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>The SPKI hash is correct for several P-256 certificates.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>The SPKI hash is correct for several P-384 certificates.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Two certificates that carry the same public key give the same hash, even when their subject names, validity periods and serial numbers differ. The hash survives reissuance, which is why Chrome blocked on it instead of on a certificate's serial number or fingerprint.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate is well-formed DER, the same shape assignment 06 reads.<\/li><li>Each case has a 10-second limit.<\/li><li>There are 6 tests: 1 each for R1 and R2 (three certificates each), 2 for R3, and 2 end-to-end cases that mix both curves and reissued keys in one input. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/pkiaudit/x509/spki.py","text":"\"\"\"The SPKI hash: SHA-256 of a certificate's subjectPublicKeyInfo (assignment 07).\n\nBrowsers and CAs name a key by this hash when they block it. The hash covers the whole\nSubjectPublicKeyInfo SEQUENCE (the algorithm identifier and the BIT STRING), in its original bytes,\nso a key keeps its hash in every certificate that carries it.\n\"\"\"\n\nimport hashlib\n\nfrom pkiaudit.asn1 import der\nfrom pkiaudit.x509.certificate import PUBLIC_KEY_INFO, tbs_fields\n\n\ndef find_spki(cert_bytes: bytes) -> der.Node:\n    \"\"\"Returns the subjectPublicKeyInfo node of a DER certificate.\"\"\"\n    return tbs_fields(cert_bytes)[PUBLIC_KEY_INFO]\n\n\ndef spki_hash(cert_bytes: bytes) -> str:\n    \"\"\"Returns the SHA-256 of a certificate's subjectPublicKeyInfo bytes, as lowercase hex.\"\"\"\n    return hashlib.sha256(find_spki(cert_bytes).encoding(cert_bytes)).hexdigest()\n"},{"path":"assignments/assignment_07_spki_hash.py","text":"\"\"\"Assignment 07 (SPKI hash): prints the SPKI hash of each `cert` line of a test input.\n\nThe checker runs `assignment_07_spki_hash.py <input-file> <output-file>`.\nsrc/pkiaudit/x509/spki.py computes the hash.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.x509.spki import spki_hash\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `spki <label> <sha256-hex>` for each `cert <label> <hex>` line.\"\"\"\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if words and words[0] == \"cert\":\n                lines.append(f\"spki {words[1]} {spki_hash(bytes.fromhex(words[2]))}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/x509/__init__.py","src/pkiaudit/asn1/__init__.py","src/pkiaudit/asn1/der.py","src/pkiaudit/x509/certificate.py","src/pkiaudit/ecc/__init__.py","src/pkiaudit/ecc/curve.py","src/pkiaudit/ecc/curves.py","src/pkiaudit/ecc/modmath.py"],"proof":{"passed":6,"total":6,"date":"2026-10-22"}},"read":"<p>Read Google's security blog post, <a href=\"https://security.googleblog.com/\" target=\"_blank\" rel=\"noopener\">\"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates\"<\/a>, for how Chrome blocked the compromised intermediates: by the SHA-256 hash of their SubjectPublicKeyInfo, pushed to every Chrome install through CRLSet, instead of by their serial numbers or their exact bytes. The post explains why the mechanism exists; this assignment computes the hash. You can pass using this page alone.<\/p>","readTitle":"Read in the blog first","context":"<p>Your <code>x509/certificate.py<\/code> from assignment 06 finds a certificate's subjectPublicKeyInfo field, and your <code>asn1/der.py<\/code> (assignment 05) records where each node's bytes start and end. Here, in <code>x509/spki.py<\/code>, you hash that field. Chrome used this hash to block the compromised eMudhra intermediates by their key, and the hash stays the same when a CA reissues a certificate for the same key. Assignment 13 checks a new key against a blocklist of known-compromised keys, and assignment 15 blocks whole chains by SPKI hashes like these.<\/p>","sources":"<ul><li>Google Security Blog, \"Protecting Chrome and Android Users from Compromised eMudhra Intermediate CA Certificates\"<\/li><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, section 4.1.2.7 (SubjectPublicKeyInfo)<\/li><\/ul>","checking":"<pre><code>.\\check 07                                 run every test\n.\\check 07 -Case 07-R3-same-key-reissued   one test, showing its full input, expected output and your output\n.\\check 07 -Fresh                          a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 07 -Dispute &lt;id&gt; &quot;why&quot;             set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R3  Two different certificates ... share the same public key hash t...    0 / 2   FAILED\n      x 07-R3-same-key-reissued  two certificates with different subject names and different validity periods, same public key\n          spki[1]: expected (hash=119d012a158acc40f0a6790aa182b23f5cdb5e6be3ce0773cf69d3486b7b18e7), got (hash=&lt;a different hash&gt;) - differs in hash\n          likely cause: R3 - Two different certificates (different subject, different validity) that share the same public key hash the same, so the hash survives reissuance\n          expected values from: openssl x509 -pubkey | openssl pkey -pubin -outform DER | openssl dgst -sha256 (three independent OpenSSL commands)\n          reproduce: py -P tools/run_py.py solutions 07 build/cases/07/07-R3-same-key-reissued.in build/cases/07/07-R3-same-key-reissued.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Your <code>x509/certificate.py<\/code> from assignment 06 already finds <code>subjectPublicKeyInfo<\/code>: it's a fixed-position child of <code>tbsCertificate<\/code>. This assignment needs that one node's original bytes and none of the other fields.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Once you have the node, slice the certificate's bytes from the node's first header byte through its last content byte (tag, length and content) and hash that slice. In the Boilerplate, <code>Node.encoding<\/code> in <code>asn1/der.py<\/code> returns it. Don't re-encode the SEQUENCE yourself: DER is canonical, so the bytes you sliced are already the ones to hash.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Hash the whole SEQUENCE (tag, length and content). The BIT STRING inside it, or the raw key bytes inside that, give a different hash.<\/li><li>Keep the BIT STRING's unused-bits byte: you hash this field's bytes untouched, without decoding them.<\/li><li>Print lowercase hex. The checker compares the text.<\/li><li>Two certificates that share a key give identical output. If yours differ, your slice includes something specific to the certificate, such as the serial number or the validity dates.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>find_spki(cert_bytes):\n    return tbs_fields(cert_bytes)[PUBLIC_KEY_INFO]   # as in assignment 06\n\nspki_hash(cert_bytes):\n    spki_node = find_spki(cert_bytes)\n    raw = cert_bytes[spki_node.start : spki_node.start + spki_node.total_len]\n    return sha256(raw) as lowercase hex<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"three different certificates, three different hashes","test":"07-R1-p256-several","input":"cert c0 308201163081bda003020102020101300a06082a8648ce3d04030230153113301106035504030c0a53706b692d3235362d30301e170d3235303130313030303030305a170d3236303130313030303030305a30153113301106035504030c0a53706b692d3235362d303059301306072a8648ce3d020106082a8648ce3d03010703420004ced431f7289c6d75c5623eb85b4275dd362b23203dd10bcc6b9946311d4dcb1e1afa1d9d441a621c540410022bbd4e8fff9941f6ffcd8695c680283f33f537ff300a06082a8648ce3d04030203480030450220273de61de73efd9c3d9355e45a03703e8340ab82a7975a931505e57e65c17810022100997017fe6bf998e05cf7b7811d8e05ee9e001895df0d592efde8b973082fbd3f\ncert c1 308201153081bda003020102020102300a06082a8648ce3d04030230153113301106035504030c0a53706b692d3235362d31301e170d3235303130313030303030305a170d3236303130313030303030305a30153113301106035504030c0a53706b692d3235362d313059301306072a8648ce3d020106082a8648ce3d03010703420004bd5bf4e49987117744158d14f97ae8a2887779289bdfad1dadc43b7f7dbb6120d3dab6a986aba4607e28b3d127831864f45dfc082019d728c8a0311d0d4ecd64300a06082a8648ce3d040302034700304402206e0cd6d3966c5abb6ad3c6804c289af52598ee8d175d4414bb99520987802f270220274e06ef0ff0de69071809c586cd80cf3667b78c1c8ca0383d0dd4b5471b5676\ncert c2 308201153081bda003020102020103300a06082a8648ce3d04030230153113301106035504030c0a53706b692d3235362d32301e170d3235303130313030303030305a170d3236303130313030303030305a30153113301106035504030c0a53706b692d3235362d323059301306072a8648ce3d020106082a8648ce3d03010703420004c8e2bbb166515fa4870b60d4c7a10a7a44dba14d391b835d892177b0ccd01c47f96073cc78e247fd7e5cc136d05a6720bb91b7c2a1da0aba4a6c60fb1145bede300a06082a8648ce3d04030203470030440220655d837d396c54c476aff98686a235cf7aff790ede30b515229c25bf2dae0248022028c6e4a5ade40f47cc8f3f6a484c345fa46e3a0af3a058de0beef268e12a35f4","output":"spki c0 aa07b611245aa91ac5e6ffbb5a5bd5f0c31fa21edfca50e09ccc447571370938\nspki c1 5227c43bfb92248caa17da1360257dc01fc0d2df24772b73368ba4851d4edf67\nspki c2 06501fbecdfc4a2d42b5c156b9dbee39bb4fec752df7ecbb3d4bef94360430ef","image":null,"explain":"<p>Three unrelated keys give three different hashes.<\/p>"},{"label":"Example 2","name":"reissued key, same hash","test":"07-R3-same-key-reissued","input":"cert original 308201563081dca003020102020101300a06082a8648ce3d04030330163114301206035504030c0b52656973737565642d5631301e170d3234303130313030303030305a170d3235303130313030303030305a30163114301206035504030c0b52656973737565642d56313076301006072a8648ce3d020106052b8104002203620004dbe011d744b5f545db67dee9d9007aaed7fcb936d1d03d3b74fb7437fe188bb5df65ebe2c39c7e1a177d2a787c0d035ed89d25f8a63076bfa1d89a658ea6727885bbb6574d3c3ee1b2dae545d4e0d83c2ed2162467d33ea1b98596cf49ce4ad6300a06082a8648ce3d0403030369003066023100cd3dca49a78349954c04d3278d9e438cfc92f55a2bd56941c5265d30cbb663f928feec453d09dad12f9bf82c363231ec023100f780c528a0955ad8a6a02f703cc8bda8c620b827a68434027373c5df7c12edb048f047a680c2ae497d5974526913964e\ncert reissued 308201733081faa003020102020102300a06082a8648ce3d04030330253123302106035504030c1a52656973737565642d56322d446966666572656e742d4e616d65301e170d3235303630313030303030305a170d3236303630313030303030305a30253123302106035504030c1a52656973737565642d56322d446966666572656e742d4e616d653076301006072a8648ce3d020106052b8104002203620004dbe011d744b5f545db67dee9d9007aaed7fcb936d1d03d3b74fb7437fe188bb5df65ebe2c39c7e1a177d2a787c0d035ed89d25f8a63076bfa1d89a658ea6727885bbb6574d3c3ee1b2dae545d4e0d83c2ed2162467d33ea1b98596cf49ce4ad6300a06082a8648ce3d0403030368003065023100d494b78182205bd3f8a4fdc29bffd4b02806381182da7d46090ef63428fb9f13869f7c57112464b4114a4e1f63a465a70230071472b150800adf9f3085fa4e6f8a43b01d41984b9a393dbe86dc12695bd43fc8929e02b0f6a090440d9adda72c5c59","output":"spki original 119d012a158acc40f0a6790aa182b23f5cdb5e6be3ce0773cf69d3486b7b18e7\nspki reissued 119d012a158acc40f0a6790aa182b23f5cdb5e6be3ce0773cf69d3486b7b18e7","image":null,"explain":"<p><code>original<\/code> and <code>reissued<\/code> have different subject names, serial numbers and validity windows, and the same key, so they have the same SPKI hash. A certificate authority that reissues a certificate for the same key, or an attacker who reuses a compromised key across several mis-issued certificates, can't change the hash by changing anything else.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>Google's post describes the outcome, blocking by SPKI hash through CRLSet, and publishes no code for computing the hash. The reference <code>x509/spki.py<\/code> reuses <code>tbs_fields<\/code> from <code>x509/certificate.py<\/code>, the same field-finding code as assignment 06, and hashes the node's <code>encoding<\/code> with <code>hashlib.sha256<\/code>.<\/p>\n<p><code>tbs_fields<\/code> finds the SPKI node by its fixed position. Another valid approach looks among <code>tbsCertificate<\/code>'s children for a SEQUENCE shaped like SubjectPublicKeyInfo (a SEQUENCE followed by a BIT STRING), without counting positions. Both find the same bytes.<\/p>"}},{"id":"08","num":"8","title":"Check a certificate's signature","difficulty":"Hard","tests":10,"problem":"problems/08-certificate-signature.md","entry":"solutions/assignments/assignment_08_certificate_signature.py","files":[{"path":"solutions/assignments/assignment_08_certificate_signature.py","role":"entry","purpose":null,"job":"Read the input's `cert` and `issuer_pubkey` line pairs (see Input) and check each certificate's signature against the issuer key with your `x509/signature.py`. Write one `signature <label> valid` or `invalid` line per pair, as Output shows.","blank":"# ======================================================================================\n# Assignment 08: Check a certificate's signature\n# Problem: problems/08-certificate-signature.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 08 as `python -P tools/run_py.py\n#   solutions 08 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 08`, or use Run and Submit in the book.\n#\n# Your job:\n#   Read the input's `cert` and `issuer_pubkey` line pairs (see Input) and check each\n#   certificate's signature against the issuer key with your `x509/signature.py`. Write\n#   one `signature <label> valid` or `invalid` line per pair, as Output shows.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/x509/signature.py in this assignment; each one gives its\n#   job at the top.\n#   Earlier files you can use: src/pkiaudit/asn1/der.py, src/pkiaudit/x509/certificate.py,\n#   src/pkiaudit/ecc/ecdsa.py, src/pkiaudit/ecc/curve.py and src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.x509 import signature`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 08: Check a certificate's signature\n# Problem: problems/08-certificate-signature.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 08 as `python -P tools/run_py.py\n#   solutions 08 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 08`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/x509/signature.py in this assignment; each one gives its\n#   job at the top.\n#   Earlier files you can use: src/pkiaudit/asn1/der.py, src/pkiaudit/x509/certificate.py,\n#   src/pkiaudit/ecc/ecdsa.py, src/pkiaudit/ecc/curve.py and src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.x509 import signature`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 08 (certificate signature): checks each certificate of a test input against the\nissuer key on the line after it.\n\nThe checker runs `assignment_08_certificate_signature.py <input-file> <output-file>`.\nsrc/pkiaudit/x509/signature.py reads and checks the signature.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.ecc.curves import CURVES\nfrom pkiaudit.x509.signature import check_signature, read_signed_data\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `signature <label> valid|invalid` for each `cert` and `issuer_pubkey` pair of lines.\"\"\"\n    lines = []\n    pending = None  # (label, certificate bytes) of the `cert` line waiting for its issuer key\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"cert\":  # cert <label> <hex>\n                pending = (words[1], bytes.fromhex(words[2]))\n            elif words[0] == \"issuer_pubkey\":  # issuer_pubkey <label> <curve> <x> <y>\n                label, curve = words[1], CURVES[words[2]]\n                if pending is None or pending[0] != label:\n                    raise ValueError(f\"issuer_pubkey {label} must follow the cert with the same label\")\n                issuer_key = (int(words[3], 16), int(words[4], 16))\n                valid = check_signature(read_signed_data(pending[1]), curve, issuer_key)\n                lines.append(f\"signature {label} {'valid' if valid else 'invalid'}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/x509/signature.py","role":"new","purpose":"This module checks that an issuer's public key signed a certificate: it reads the signed tbsCertificate bytes and the signature, hashes the bytes with SHA-384 and runs your ECDSA verify. Assignment 09 checks every link of a chain with it, and assignment 16 does the same across a whole PKI.","job":"In `x509/signature.py`, read a certificate's signed bytes (tbsCertificate's original DER, header included) and its signature values `r` and `s` from the signatureValue BIT STRING. Hash the signed bytes with SHA-384 into ECDSA's `z`, and check the signature against an issuer's curve and public key with your verify from `ecc/ecdsa.py` (assignment 04).","blank":"# ======================================================================================\n# Assignment 08: Check a certificate's signature\n# Problem: problems/08-certificate-signature.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module checks that an issuer's public key signed a certificate: it reads the\n#   signed tbsCertificate bytes and the signature, hashes the bytes with SHA-384 and runs\n#   your ECDSA verify. Assignment 09 checks every link of a chain with it, and assignment\n#   16 does the same across a whole PKI.\n#\n# Your job:\n#   In `x509/signature.py`, read a certificate's signed bytes (tbsCertificate's original\n#   DER, header included) and its signature values `r` and `s` from the signatureValue BIT\n#   STRING. Hash the signed bytes with SHA-384 into ECDSA's `z`, and check the signature\n#   against an issuer's curve and public key with your verify from `ecc/ecdsa.py`\n#   (assignment 04).\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 08: Check a certificate's signature\n# Problem: problems/08-certificate-signature.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module checks that an issuer's public key signed a certificate: it reads the\n#   signed tbsCertificate bytes and the signature, hashes the bytes with SHA-384 and runs\n#   your ECDSA verify. Assignment 09 checks every link of a chain with it, and assignment\n#   16 does the same across a whole PKI.\n#\n# Your job:\n#   In `x509/signature.py`, read a certificate's signed bytes (tbsCertificate's original\n#   DER, header included) and its signature values `r` and `s` from the signatureValue BIT\n#   STRING. Hash the signed bytes with SHA-384 into ECDSA's `z`, and check the signature\n#   against an issuer's curve and public key with your verify from `ecc/ecdsa.py`\n#   (assignment 04). The Boilerplate gives you the declarations; fill in each TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Checking a certificate's signature (assignment 08).\n\nThe issuer signs tbsCertificate's original DER bytes. The signatureValue BIT STRING holds the\nsignature as DER again: ECDSA-Sig-Value ::= SEQUENCE { r INTEGER, s INTEGER }. Every issuer in\nthis project signs with ecdsa-with-SHA384.\n\"\"\"\n\nimport hashlib\nfrom dataclasses import dataclass\n\nfrom pkiaudit.asn1 import der\nfrom pkiaudit.ecc import ecdsa\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.x509.certificate import certificate_node\n\n\n@dataclass(frozen=True)\nclass SignedData:\n    \"\"\"What a certificate's issuer signed, and the signature: the TBS bytes and (r, s).\"\"\"\n\n    tbs: bytes  # tbsCertificate's original bytes, header included\n    r: int\n    s: int\n\n\ndef read_signed_data(cert_bytes: bytes) -> SignedData:\n    \"\"\"Reads the signed bytes and the signature out of a DER certificate.\"\"\"\n    # TODO: tbsCertificate's original bytes, and r and s from the signatureValue BIT STRING;\n    # see \"What the issuer signs\" and step 2 of \"The equation\" on the problem page.\n    raise NotImplementedError(\"read_signed_data\")\n\n\ndef tbs_hash(tbs: bytes, curve: Curve) -> int:\n    \"\"\"Returns ECDSA's z for the signed bytes: SHA-384, cut to as many leading bits as the curve's n has.\"\"\"\n    # TODO: SHA-384 of `tbs`, read as a big-endian number; see step 1 of \"The equation\" on the\n    # problem page. P-384's n has 384 bits, as many as the digest, so nothing gets cut there.\n    raise NotImplementedError(\"tbs_hash\")\n\n\ndef check_signature(signed: SignedData, issuer_curve: Curve, issuer_key: tuple[int, int]) -> bool:\n    \"\"\"Returns True when the issuer's public key verifies the certificate's signature.\"\"\"\n    # TODO: your ECDSA verify from assignment 04, with z from tbs_hash; see step 3 of \"The\n    # equation\" on the problem page.\n    raise NotImplementedError(\"check_signature\")\n"}],"buildsOn":[{"path":"solutions/src/pkiaudit/asn1/der.py","owner":"05","purpose":"This module reads DER, the tag-length-value encoding that holds every certificate in the project, into a tree of nodes, and decodes INTEGER, OBJECT IDENTIFIER and BIT STRING values. Your `x509/certificate.py` (assignment 06), `x509/spki.py` (07) and `x509/signature.py` (08) read certificates through it."},{"path":"solutions/src/pkiaudit/x509/certificate.py","owner":"06","purpose":"This module reads the fields of an X.509 certificate that the project needs: the subject and issuer names, the validity window, the elliptic-curve public key and whether the certificate is a CA. Assignment 07 finds the public key field through it, 08 the signed bytes, and 09 and 16 validate chains with the fields it reads."},{"path":"solutions/src/pkiaudit/ecc/ecdsa.py","owner":"04","purpose":"This module holds ECDSA: checking a signature now, and making one in assignment 11. Your certificate-signature check in assignment 08 calls this verification, and through it so do the chain validation in assignment 09 and the PKI audit in assignment 16."},{"path":"solutions/src/pkiaudit/ecc/curve.py","owner":"02","purpose":"This module holds the elliptic-curve group law: the curve type, points, the point at infinity and the rule that adds two points. Assignment 03 adds scalar multiplication to it, and your ECDSA code from assignment 04 and the weak-key search in assignment 10 run on its point addition."},{"path":"solutions/src/pkiaudit/ecc/curves.py","owner":"02","purpose":"This module holds the constants of every curve the project uses: the toy curve now, and P-256 and P-384, which assignment 03 adds. Later assignments look up P-256 and P-384 here, from the certificate reader in assignment 06 to the PKI audit in assignment 16."}],"indent":4,"tags":[{"label":"Language","items":["byte slicing","big integers","modular arithmetic"],"text":["byte slicing","big integers","modular arithmetic"]},{"label":"Library","items":["a SHA-384 implementation"],"text":["a SHA-384 implementation"]},{"label":"Concepts","items":["tbsCertificate","ECDSA verification","DER's canonical encoding"],"text":["tbsCertificate","ECDSA verification","DER's canonical encoding"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that checks, for each certificate it reads, whether a given issuer's public key signed it.<\/p>\n<h3>What the issuer signs<\/h3>\n<p>A certificate's <code>signatureValue<\/code> is a signature over <code>tbsCertificate<\/code>'s original DER bytes, as they appear in the certificate. DER's rules give each value one encoding (DER is canonical), so re-encoding <code>tbsCertificate<\/code> from its fields should give the same bytes back. One slip, such as a length written in the long form where DER uses the short form, gives different bytes, and the signature no longer checks against them.<\/p>\n<p>Slice the bytes out of the certificate instead, from <code>tbsCertificate<\/code>'s first header byte through its last content byte, tag and length included, and hash that slice.<\/p>\n<h3>The equation<\/h3>\n<ol><li>Hash <code>tbsCertificate<\/code>'s original bytes (above) with SHA-384, and read the digest as a big-endian number. Every certificate in this assignment is P-384, signed <code>ecdsa-with-SHA384<\/code>. A P-256 certificate would use SHA-256 instead, which is out of scope here (see Constraints).<\/li><li><code>signatureValue<\/code> is a BIT STRING. Its content, after the unused-bits byte (<code>0<\/code> here), is DER again: <code>SEQUENCE { r INTEGER, s INTEGER }<\/code>. Parse it with your DER reader, as in assignment 05, to get <code>r<\/code> and <code>s<\/code>.<\/li><li>Check <code>(r, s)<\/code> against the hash and the issuer's public key <code>(x, y)<\/code> with the ECDSA verification equation from assignment 04:<\/li><\/ol>\n<pre><code>z  = the hash, as a big integer\nw  = s^-1 mod n\nu1 = z * w mod n\nu2 = r * w mod n\n(x3, y3) = u1*G + u2*Q          (Q = the issuer&#x27;s public key point)\nvalid if x3 mod n == r<\/code><\/pre>\n<p><code>n<\/code> is the curve's order (its number of points), from the table below. <code>u1*G<\/code> and <code>u2*Q<\/code> are each a scalar multiplication (your <code>scalar_multiply<\/code> from assignment 03), and one more point addition adds the two results. Your <code>verify<\/code> in <code>ecc/ecdsa.py<\/code> already does all of this when you pass it <code>z<\/code>. Use your own code for the check and leave a cryptography library's verify function alone: writing the equation yourself is the point of this assignment.<\/p>\n<h3>The curve<\/h3>\n<p>P-384 only, for this assignment. These are the constants of your <code>P384<\/code> in <code>ecc/curves.py<\/code> (assignment 03):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>P-384<\/th><\/tr><\/thead><tbody><tr><td><code>p<\/code><\/td><td><code>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff<\/code><\/td><\/tr><tr><td><code>a<\/code><\/td><td><code>p - 3<\/code><\/td><\/tr><tr><td><code>Gx<\/code><\/td><td><code>aa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7<\/code><\/td><\/tr><tr><td><code>Gy<\/code><\/td><td><code>3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f<\/code><\/td><\/tr><tr><td><code>n<\/code><\/td><td><code>ffffffffffffffffffffffffffffffffffffffffffffffffc7634d81f4372ddf581a0db248b0a77aecec196accc52973<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Input<\/h3>\n<p>The checker runs your program from the workbook folder as <code>&lt;program&gt; &lt;input-file&gt; &lt;output-file&gt;<\/code>. The input file contains pairs of lines, each pair describing one check:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>cert &lt;label&gt; &lt;hex&gt;<\/code><\/td><td>The certificate to check.<\/td><\/tr><tr><td><code>issuer_pubkey &lt;label&gt; &lt;curve&gt; &lt;x&gt; &lt;y&gt;<\/code><\/td><td>Comes right after the <code>cert<\/code> line with the same <code>label<\/code>. The alleged issuer's public key: <code>curve<\/code> is <code>P-384<\/code> in every test here, and <code>x<\/code> and <code>y<\/code> are hexadecimal.<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Output<\/h3>\n<p>For each pair, in input order, write one line:<\/p>\n<pre><code>signature &lt;label&gt; valid\nsignature &lt;label&gt; invalid<\/code><\/pre>\n<p>The checker ignores extra whitespace.<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test checks one of these requirements. If tests fail, the checker's report shows how many pass for each requirement, and it may add a <code>likely cause<\/code> line that names the requirement the difference points to.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>A self-signed certificate (signed by the key it carries), checked against its own public key, is <code>valid<\/code>.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>A certificate checked against the wrong issuer key is <code>invalid<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>A certificate whose signature has one flipped bit, anywhere in <code>r<\/code> or <code>s<\/code>, is <code>invalid<\/code>, though the rest of the certificate and the issuer's real key stay the same.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Your program slices <code>tbsCertificate<\/code>'s bytes right when the certificate carries real v3 extensions, which make the structure large enough that its own length needs DER's long form.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every certificate here is P-384, signed <code>ecdsa-with-SHA384<\/code>. A P-256 certificate would need SHA-256 instead, by RFC 5280's pairing of algorithms. P-256 is out of scope for this assignment, which mirrors the P-384 keys of the real eMudhra incident.<\/li><li><code>issuer_pubkey<\/code> comes right after the <code>cert<\/code> line it belongs to, with the same label.<\/li><li>Each case has a 10-second limit.<\/li><li>There are 10 tests: 3 for R1, 2 for R2, 2 for R3, 2 for R4, and one end-to-end case that mixes valid, wrong-key and tampered signatures in one input. Part of the set is random (fresh keys each run) and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"src/pkiaudit/x509/signature.py","text":"\"\"\"Checking a certificate's signature (assignment 08).\n\nThe issuer signs tbsCertificate's original DER bytes. The signatureValue BIT STRING holds the\nsignature as DER again: ECDSA-Sig-Value ::= SEQUENCE { r INTEGER, s INTEGER }. Every issuer in\nthis project signs with ecdsa-with-SHA384.\n\"\"\"\n\nimport hashlib\nfrom dataclasses import dataclass\n\nfrom pkiaudit.asn1 import der\nfrom pkiaudit.ecc import ecdsa\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.x509.certificate import certificate_node\n\n\n@dataclass(frozen=True)\nclass SignedData:\n    \"\"\"What a certificate's issuer signed, and the signature: the TBS bytes and (r, s).\"\"\"\n\n    tbs: bytes  # tbsCertificate's original bytes, header included\n    r: int\n    s: int\n\n\ndef read_signed_data(cert_bytes: bytes) -> SignedData:\n    \"\"\"Reads the signed bytes and the signature out of a DER certificate.\"\"\"\n    tbs, _algorithm, signature_value = certificate_node(cert_bytes).children\n    _unused, signature = der.decode_bit_string(signature_value.content)\n    r, s = der.parse_all(signature)[0].children[:2]\n    return SignedData(tbs.encoding(cert_bytes), der.decode_integer(r.content), der.decode_integer(s.content))\n\n\ndef tbs_hash(tbs: bytes, curve: Curve) -> int:\n    \"\"\"Returns ECDSA's z for the signed bytes: SHA-384, cut to as many leading bits as the curve's n has.\"\"\"\n    digest = hashlib.sha384(tbs).digest()\n    z = int.from_bytes(digest, \"big\")\n    excess = 8 * len(digest) - curve.n.bit_length()\n    return z >> excess if excess > 0 else z\n\n\ndef check_signature(signed: SignedData, issuer_curve: Curve, issuer_key: tuple[int, int]) -> bool:\n    \"\"\"Returns True when the issuer's public key verifies the certificate's signature.\"\"\"\n    return ecdsa.verify(issuer_curve, issuer_key, tbs_hash(signed.tbs, issuer_curve), signed.r, signed.s)\n"},{"path":"assignments/assignment_08_certificate_signature.py","text":"\"\"\"Assignment 08 (certificate signature): checks each certificate of a test input against the\nissuer key on the line after it.\n\nThe checker runs `assignment_08_certificate_signature.py <input-file> <output-file>`.\nsrc/pkiaudit/x509/signature.py reads and checks the signature.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.ecc.curves import CURVES\nfrom pkiaudit.x509.signature import check_signature, read_signed_data\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `signature <label> valid|invalid` for each `cert` and `issuer_pubkey` pair of lines.\"\"\"\n    lines = []\n    pending = None  # (label, certificate bytes) of the `cert` line waiting for its issuer key\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"cert\":  # cert <label> <hex>\n                pending = (words[1], bytes.fromhex(words[2]))\n            elif words[0] == \"issuer_pubkey\":  # issuer_pubkey <label> <curve> <x> <y>\n                label, curve = words[1], CURVES[words[2]]\n                if pending is None or pending[0] != label:\n                    raise ValueError(f\"issuer_pubkey {label} must follow the cert with the same label\")\n                issuer_key = (int(words[3], 16), int(words[4], 16))\n                valid = check_signature(read_signed_data(pending[1]), curve, issuer_key)\n                lines.append(f\"signature {label} {'valid' if valid else 'invalid'}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"}],"also":["src/pkiaudit/__init__.py","src/pkiaudit/ecc/__init__.py","src/pkiaudit/ecc/curves.py","src/pkiaudit/x509/__init__.py","src/pkiaudit/ecc/curve.py","src/pkiaudit/asn1/__init__.py","src/pkiaudit/asn1/der.py","src/pkiaudit/ecc/ecdsa.py","src/pkiaudit/x509/certificate.py","src/pkiaudit/ecc/modmath.py"],"proof":{"passed":10,"total":10,"date":"2026-10-22"}},"read":"<p>eMudhra's post doesn't cover this assignment. It builds the link between an issuer's private key and the certificates it signs, which is what a compromise of a revoked or distrusted intermediate's key threatens. For background, read RFC 5280 sections 4.1.1.3 (\"signatureValue\") and 4.1.2 (\"TBSCertificate\"): which bytes the issuer signs and where the signature goes. You can pass using this page alone.<\/p>","readTitle":"Read in the blog first","context":"<p>Your <code>verify<\/code> in <code>ecc/ecdsa.py<\/code> (assignment 04) checks an ECDSA signature on a hash, and your <code>x509/certificate.py<\/code> (assignment 06) finds a certificate's parts with your <code>asn1/der.py<\/code> (assignment 05). Here, in <code>x509/signature.py<\/code>, you connect them: the message is a slice of the certificate itself, and checking the signature tells you whether a given issuer signed it. Your <code>pki/chain.py<\/code> (assignment 09) checks every link of a chain this way. It's also why a compromised CA key is dangerous: anyone who holds it can make signatures that pass this check.<\/p>","sources":"<ul><li>RFC 5280, <a href=\"https://www.rfc-editor.org/rfc/rfc5280\" target=\"_blank\" rel=\"noopener\">Internet X.509 Public Key Infrastructure Certificate and CRL Profile<\/a>, sections 4.1.1.3 and 4.1.2<\/li><li>ITU-T X.690, section 8.1 (why re-encoding DER should give the same bytes, and why slicing the original bytes avoids the risk that it doesn't)<\/li><li>FIPS 186-5, <em>Digital Signature Standard (DSS)<\/em>, section 6.4.2 (the ECDSA verification equation)<\/li><\/ul>","checking":"<pre><code>.\\check 08                                run every test\n.\\check 08 -Case 08-R3-tampered-0         one test, showing its full input, expected output and your output\n.\\check 08 -Fresh                         a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n.\\check 08 -Dispute &lt;id&gt; &quot;why&quot;            set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  The TBS bytes are re-extracted correctly even when the certifica...    0 / 2   FAILED\n      x 08-R4-with-extensions  a self-signed CA certificate with a BasicConstraints extension present\n          line 1: expected `signature ext1 valid`, got `signature ext1 invalid`\n          likely cause: R4 - The TBS bytes are re-extracted correctly even when the certificate has v3 extensions (a non-trivial TBS structure)\n          expected values from: cryptography 41.0.7: public_key.verify(signature, tbs_bytes, ec.ECDSA(hashes.SHA384())), independent of this workbook&#x27;s modular-arithmetic reference\n          reproduce: py -P tools/run_py.py solutions 08 build/cases/08/08-R4-with-extensions.in build/cases/08/08-R4-with-extensions.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Both parts you need are fixed-position children of the certificate's top-level SEQUENCE: <code>tbsCertificate<\/code> is the first and <code>signatureValue<\/code> the third. Your <code>certificate_node<\/code> from assignment 06 gives you that SEQUENCE. You don't need any of <code>tbsCertificate<\/code>'s own fields this time, only where it starts and ends.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Parse the certificate as one top-level SEQUENCE. Its first child's whole node, header included, gives you the bytes to hash: <code>data[node.start : node.start + node.total_len]<\/code> (<code>Node.encoding<\/code> in the Boilerplate). Its third child is signatureValue: after the unused-bits byte, parse the content as DER again to get <code>r<\/code> and <code>s<\/code>. Then run assignment 04's verification with the hash of the sliced bytes as <code>z<\/code>.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li>Hash the bytes from the certificate, not a re-encoding of the fields. If your DER writer and reader don't round-trip to the same bytes (a length form, most often), you hash the wrong bytes, and real certificates fail as well as the hand-made edge cases.<\/li><li><code>signatureValue<\/code> is a BIT STRING. Its first content byte is the unused-bits count (assignment 05), and the DER-encoded <code>(r, s)<\/code> SEQUENCE starts after it.<\/li><li><code>r<\/code> and <code>s<\/code> are each a full DER INTEGER: two's complement, and they may have a leading <code>0x00<\/code> pad byte (assignment 05's trap again).<\/li><li>SHA-384's digest has as many bits as P-384's order <code>n<\/code>, so this assignment never needs to cut the hash down. Other pairings of curve and hash can need it.<\/li><li>One flipped bit anywhere in <code>r<\/code> or <code>s<\/code> makes the signature invalid. If your check compares only part of a value, or compares lengths instead of values, it can miss that.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>check_signature(cert_bytes, curve, issuer_x, issuer_y):\n    cert = certificate_node(cert_bytes)\n    tbs_node = cert.children[0]\n    tbs_bytes = cert_bytes[tbs_node.start : tbs_node.start + tbs_node.total_len]\n\n    sig_bitstring = cert.children[2]\n    _unused, sig_der = decode_bit_string(sig_bitstring.content)\n    sig_seq = parse_all(sig_der)[0]\n    r = decode_integer(sig_seq.children[0].content)\n    s = decode_integer(sig_seq.children[1].content)\n\n    z = int(sha384(tbs_bytes))\n    # your verify(curve, (issuer_x, issuer_y), z, r, s) from assignment 04 does the rest:\n    w = modinv(s, n)\n    u1, u2 = (z * w) % n, (r * w) % n\n    (x3, y3) = add_points(scalar_multiply(u1, G), scalar_multiply(u2, (issuer_x, issuer_y)))\n    return (x3 % n) == r<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"a valid self-signed certificate","test":"08-R1-self-signed-0","input":"cert s0 3082014c3081d2a003020102020101300a06082a8648ce3d0403033011310f300d06035504030c0653656c662d30301e170d3235303130313030303030305a170d3236303130313030303030305a3011310f300d06035504030c0653656c662d303076301006072a8648ce3d020106052b810400220362000413799bc39cebcabf392d24625ec169db4dc1d3aa4b413fb92fb3450ea24d9ace0432ae1f242748eb41fae6d6fc190625e915239da017393f8f433efd149645fa8ccd3a38f03645dcf76a908f1dca483a724091b507a040f592d569d6be4406f8300a06082a8648ce3d0403030369003066023100a524602bdb5b7950ac3920ae115ff2658d6e8e80feae9bb515a578f13402b4ff7343be542a7d4fef963c797150d33466023100ce248e60dccf8814ce38576a7d62dbcf3c0c62fa5f9f793f3328f6eb5bf40643000bd1398c2b4f49e590832474ae61bd\nissuer_pubkey s0 P-384 13799bc39cebcabf392d24625ec169db4dc1d3aa4b413fb92fb3450ea24d9ace0432ae1f242748eb41fae6d6fc190625 e915239da017393f8f433efd149645fa8ccd3a38f03645dcf76a908f1dca483a724091b507a040f592d569d6be4406f8","output":"signature s0 valid","image":null,"explain":"<p>The public key in <code>issuer_pubkey<\/code> is the certificate's own subject key. The input gives it to you on its own line; assignment 06 covers reading it out of the certificate.<\/p>"},{"label":"Example 2","name":"one bit flipped in the signature","test":"08-R3-tampered-0","input":"cert t0 3082014e3081d6a003020102020114300a06082a8648ce3d04030330133111300f06035504030c0854616d7065722d30301e170d3235303130313030303030305a170d3236303130313030303030305a30133111300f06035504030c0854616d7065722d303076301006072a8648ce3d020106052b8104002203620004b7c32496319e08593b60245d1518bccd35f6236109df147af450aba3253237eeb9acedf9664944dcd9b1119a1cd6367532301c3af7cbdc8626374f8ece577d5d4067fbad012a61489fc14b73a8a9dd9365b1abedacd7daef7336b9e95a70b620300a06082a8648ce3d040303036700306402303503532ecae9d7ae31701e2665a92a062b581e1cfeb49f2b3bdcd94241c8cbb0cc85a088a3136ed8ee858bdca1f0789902304843909e09821bcc3a04fd568f14a080fa0aef6605341933fdd5ba128236de33b8652d66260af57cdbcda63c6c58188c\nissuer_pubkey t0 P-384 b7c32496319e08593b60245d1518bccd35f6236109df147af450aba3253237eeb9acedf9664944dcd9b1119a1cd63675 32301c3af7cbdc8626374f8ece577d5d4067fbad012a61489fc14b73a8a9dd9365b1abedacd7daef7336b9e95a70b620","output":"signature t0 invalid","image":null,"explain":"<p>Apart from one bit of the signature, the certificate is as its issuer signed it: the subject, issuer, key and validity match the original, and <code>issuer_pubkey<\/code> holds the real issuer's key. Flipping the lowest bit of the signature's last byte is enough to make it <code>invalid<\/code>.<\/p>"}],"editorial":{"title":"Compare with the post","html":"<p>eMudhra's post has no code for this, so there is no author's version to compare. The reference <code>x509/signature.py<\/code> splits the work into three functions. <code>read_signed_data<\/code> slices the TBS bytes and reads <code>r<\/code> and <code>s<\/code>, with <code>certificate_node<\/code> from assignment 06 and the DER decoders from assignment 05. <code>tbs_hash<\/code> turns the bytes into <code>z<\/code>, and <code>check_signature<\/code> calls <code>verify<\/code> from <code>ecc/ecdsa.py<\/code> (assignment 04).<\/p>\n<p>Inside <code>verify<\/code>, the reference's <code>scalar_multiply<\/code> (assignment 03) does double-and-add from the least significant bit. A correct alternative starts from the most significant bit and doubles the running result before each add. It gives the same answer with the bits in the opposite order. Compare it with the version you wrote.<\/p>"}},{"id":"09","num":"9","title":"Validate a certificate chain","difficulty":"Hard","tests":13,"problem":"problems/09-validate-chain.md","entry":"solutions/assignments/assignment_09_validate_chain.py","files":[{"path":"solutions/assignments/assignment_09_validate_chain.py","role":"entry","purpose":null,"job":"Write the assignment 09 program, which reads the input's `chain` blocks and writes one verdict line for each. It collects each block's `now`, `anchor` and `cert` lines as the Input section describes, validates the chain with your `pki/chain.py`, and writes `trusted` or `untrusted <reason>` in the Output format.","blank":"# ======================================================================================\n# Assignment 09: Validate a certificate chain\n# Problem: problems/09-validate-chain.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 09 as `python -P tools/run_py.py\n#   solutions 09 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 09`, or use Run and Submit in the book.\n#\n# Your job:\n#   Write the assignment 09 program, which reads the input's `chain` blocks and writes one\n#   verdict line for each. It collects each block's `now`, `anchor` and `cert` lines as\n#   the Input section describes, validates the chain with your `pki/chain.py`, and writes\n#   `trusted` or `untrusted <reason>` in the Output format.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/pki/chain.py in this assignment; each one gives its job at\n#   the top.\n#   Earlier files you can use: src/pkiaudit/x509/certificate.py,\n#   src/pkiaudit/x509/signature.py, src/pkiaudit/ecc/curve.py and\n#   src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.pki import chain`.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# ======================================================================================\n# Assignment 09: Validate a certificate chain\n# Problem: problems/09-validate-chain.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   The checker runs this program for assignment 09 as `python -P tools/run_py.py\n#   solutions 09 <input-file> <output-file>`. It reads a test input, calls your code and\n#   writes the answer to the output file, and the checker compares that answer with the\n#   expected one. Run `.\\check 09`, or use Run and Submit in the book.\n#\n# Your job:\n#   The Boilerplate gives you this program finished. You fill in the TODOs in this\n#   assignment's other files.\n#\n# The other files of this assignment:\n#   You also write src/pkiaudit/pki/chain.py in this assignment; each one gives its job at\n#   the top.\n#   Earlier files you can use: src/pkiaudit/x509/certificate.py,\n#   src/pkiaudit/x509/signature.py, src/pkiaudit/ecc/curve.py and\n#   src/pkiaudit/ecc/curves.py.\n#   Import them as modules of your package, e.g. `from pkiaudit.pki import chain`.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Assignment 09 (validate a chain): gives a verdict on each `chain` block of a test input.\n\nThe checker runs `assignment_09_validate_chain.py <input-file> <output-file>`. The checks are in\nsrc/pkiaudit/pki/chain.py.\n\"\"\"\n\nimport sys\n\nfrom pkiaudit.ecc.curves import CURVES\nfrom pkiaudit.pki.chain import Anchor, validate_chain\n\n\ndef main(input_path: str, output_path: str) -> None:\n    \"\"\"Writes `chain <label> trusted` or `chain <label> untrusted <reason>` for each chain block.\"\"\"\n    lines = []\n    label, now, anchors, certs = None, None, [], []\n\n    def finish() -> None:\n        if label is None:\n            return\n        result = validate_chain(certs, anchors, now)\n        verdict = \"trusted\" if result.trusted else f\"untrusted {result.reason}\"\n        lines.append(f\"chain {label} {verdict}\")\n\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"chain\":  # chain <label>: starts a new chain\n                finish()\n                label, now, anchors, certs = words[1], None, [], []\n            elif words[0] == \"now\":  # now <time>\n                now = words[1]\n            elif words[0] == \"anchor\":  # anchor <curve> <x> <y>: a trusted root public key\n                anchors.append(Anchor(CURVES[words[1]], (int(words[2], 16), int(words[3], 16))))\n            elif words[0] == \"cert\":  # cert <hex>: leaf first, most senior intermediate last\n                certs.append(bytes.fromhex(words[1]))\n    finish()\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        sys.exit(f\"usage: {sys.argv[0]} <input-file> <output-file>\")\n    main(sys.argv[1], sys.argv[2])\n"},{"path":"solutions/src/pkiaudit/pki/chain.py","role":"new","purpose":"This module decides whether a verifier should trust a chain of certificates, leaf first, that ends at one of its trust anchors, and names the first check that fails if not. Assignment 16 runs it over every chain in a PKI to find the chains a bad key breaks.","job":"Implement chain validation in `pki/chain.py`: given DER certificates, leaf first, and a list of trust anchors, run the four checks in the page's order and report the first one that fails. Define the trust anchor and the verdict the program uses, and read each certificate and its signature with your code from assignments 06 and 08.","blank":"# ======================================================================================\n# Assignment 09: Validate a certificate chain\n# Problem: problems/09-validate-chain.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module decides whether a verifier should trust a chain of certificates, leaf\n#   first, that ends at one of its trust anchors, and names the first check that fails if\n#   not. Assignment 16 runs it over every chain in a PKI to find the chains a bad key\n#   breaks.\n#\n# Your job:\n#   Implement chain validation in `pki/chain.py`: given DER certificates, leaf first, and\n#   a list of trust anchors, run the four checks in the page's order and report the first\n#   one that fails. Define the trust anchor and the verdict the program uses, and read\n#   each certificate and its signature with your code from assignments 06 and 08.\n#\n# How to start:\n#   Write it yourself from here, or press Boilerplate in the book's editor to get the\n#   input/output code and the declarations (the same files are in starters/boilerplate/).\n# ======================================================================================\n","boilerplate":"# ======================================================================================\n# Assignment 09: Validate a certificate chain\n# Problem: problems/09-validate-chain.md (and in the problem book, with its Start here card)\n#\n# Why this file exists:\n#   This module decides whether a verifier should trust a chain of certificates, leaf\n#   first, that ends at one of its trust anchors, and names the first check that fails if\n#   not. Assignment 16 runs it over every chain in a PKI to find the chains a bad key\n#   breaks.\n#\n# Your job:\n#   Implement chain validation in `pki/chain.py`: given DER certificates, leaf first, and\n#   a list of trust anchors, run the four checks in the page's order and report the first\n#   one that fails. Define the trust anchor and the verdict the program uses, and read\n#   each certificate and its signature with your code from assignments 06 and 08. The\n#   Boilerplate gives you the declarations; fill in each TODO.\n#\n# How to start:\n#   This is the Boilerplate. To start from an empty file instead, choose From scratch in\n#   the book (the empty files are in starters/blank/).\n# ======================================================================================\n\n\"\"\"Validating a certificate chain (assignment 09).\n\nThis is the core of RFC 5280's path validation, cut down to these checks, run in this order:\n\n| Check | Fails with |\n|---|---|\n| The next certificate up signed each certificate below it | bad-signature |\n| A trust anchor signed the topmost certificate | unknown-anchor |\n| Every certificate above the leaf is a CA | not-a-ca |\n| No signer has more intermediates below it than its pathLenConstraint allows | path-too-long |\n| Every certificate's validity window covers the current time | expired |\n\nAssignment 16 runs the same checks over a whole PKI, without a current time.\n\"\"\"\n\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass\n\nfrom pkiaudit.ecc.curve import Curve\nfrom pkiaudit.x509.certificate import parse_certificate\nfrom pkiaudit.x509.signature import SignedData, check_signature, read_signed_data\n\nREASONS = (\"bad-signature\", \"unknown-anchor\", \"not-a-ca\", \"path-too-long\", \"expired\")\n\n\n@dataclass(frozen=True)\nclass Anchor:\n    \"\"\"A public key the verifier trusts with no certificate; `name` labels it in reports.\"\"\"\n\n    curve: Curve\n    public_key: tuple[int, int]\n    name: str = \"\"\n\n\n@dataclass(frozen=True)\nclass ChainResult:\n    \"\"\"A chain's verdict: `reason` is None for a trusted chain, else one of REASONS.\n\n    `anchor` is the anchor that signed the topmost certificate. It stays set when a later check\n    fails, and is None when the signature checks failed first.\n    \"\"\"\n\n    reason: str | None = None\n    anchor: Anchor | None = None\n\n    @property\n    def trusted(self) -> bool:\n        \"\"\"Returns True when the chain passed every check.\"\"\"\n        return self.reason is None\n\n\ndef find_anchor(signed: SignedData, anchors: Sequence[Anchor]) -> Anchor | None:\n    \"\"\"Returns the first anchor whose key verifies the signature, or None.\"\"\"\n    # TODO: try each anchor's key in turn; see check 1 under \"The four checks, in order\" on the\n    # problem page.\n    raise NotImplementedError(\"find_anchor\")\n\n\ndef validate_chain(chain: Sequence[bytes], anchors: Sequence[Anchor],\n                   now: str | None = None) -> ChainResult:\n    \"\"\"Checks DER certificates, leaf first, against the anchors; `now` None skips the validity check.\"\"\"\n    # TODO: parse each certificate and its signature, then run the checks in order and return at\n    # the first failure; see \"The four checks, in order\" on the problem page.\n    raise NotImplementedError(\"validate_chain\")\n"}],"buildsOn":[{"path":"solutions/src/pkiaudit/x509/certificate.py","owner":"06","purpose":"This module reads the fields of an X.509 certificate that the project needs: the subject and issuer names, the validity window, the elliptic-curve public key and whether the certificate is a CA. Assignment 07 finds the public key field through it, 08 the signed bytes, and 09 and 16 validate chains with the fields it reads."},{"path":"solutions/src/pkiaudit/x509/signature.py","owner":"08","purpose":"This module checks that an issuer's public key signed a certificate: it reads the signed tbsCertificate bytes and the signature, hashes the bytes with SHA-384 and runs your ECDSA verify. Assignment 09 checks every link of a chain with it, and assignment 16 does the same across a whole PKI."},{"path":"solutions/src/pkiaudit/ecc/curve.py","owner":"02","purpose":"This module holds the elliptic-curve group law: the curve type, points, the point at infinity and the rule that adds two points. Assignment 03 adds scalar multiplication to it, and your ECDSA code from assignment 04 and the weak-key search in assignment 10 run on its point addition."},{"path":"solutions/src/pkiaudit/ecc/curves.py","owner":"02","purpose":"This module holds the constants of every curve the project uses: the toy curve now, and P-256 and P-384, which assignment 03 adds. Later assignments look up P-256 and P-384 here, from the certificate reader in assignment 06 to the PKI audit in assignment 16."}],"indent":4,"tags":[{"label":"Language","items":["loops over lists","structured state"],"text":["loops over lists","structured state"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["chain of trust","trust anchors","path length constraints","RFC 5280 path validation"],"text":["chain of trust","trust anchors","path length constraints","RFC 5280 path validation"]}],"body":"<div class=\"d-problem flow\"><p>Write a program that reads trust anchors and certificate chains and decides, for each chain, whether a verifier should trust it, and if not, why.<\/p>\n<h3>Trust anchors and chains<\/h3>\n<ul><li>A trust anchor is a public key the verifier already trusts. It has no certificate of its own: trust in it is axiomatic, the way a browser's root store works.<\/li><li>A chain is a list of certificates, leaf first. Certificate 0, the leaf, is the one being checked. Certificate 1 (if present) signed it, certificate 2 (if present) signed certificate 1, and so on. Every certificate after the leaf is an intermediate.<\/li><li>One of the trust anchors must have signed the last certificate in the list, the topmost one. The list holds no certificate for the anchor itself.<\/li><\/ul>\n<h3>The four checks, in order<\/h3>\n<p>Check a chain in this order, and stop at the first problem:<\/p>\n<ol><li>Signatures: the next certificate up must have signed each certificate below the topmost. Certificate <code>i + 1<\/code>'s public key must verify certificate <code>i<\/code>'s signature (your check from assignment 08). Then one of the trust anchors must have signed the topmost certificate. Try each anchor; one match is enough.<\/li><li>CA permission: every certificate that signed another one in the chain, which means every certificate except the leaf, must have BasicConstraints CA:TRUE (the <code>ca<\/code> field from assignment 06). A certificate without it can't sign other certificates, however good its signature is.<\/li><li>Path length: a certificate's path length constraint (the <code>pathlen<\/code> field from assignment 06, when it has one) limits how many more intermediates may appear between it and the leaf. With the leaf at position 0 in the list, the certificate at position <code>i<\/code> has <code>i - 1<\/code> intermediates below it (closer to the leaf). If it has a path length constraint and <code>i - 1<\/code> is larger, the chain fails.<\/li><li>Validity: every certificate's validity window, <code>notBefore<\/code> through <code>notAfter<\/code>, must cover the given <code>now<\/code>. Every time string in this assignment is UTCTime in the same format, with a two-digit year (<code>250601000000Z<\/code> is 2025-06-01). Comparing the strings as text puts them in time order, so you don't need to parse dates.<\/li><\/ol>\n<p>If all four hold, the chain is trusted. Otherwise report the first problem, in the order above, with one of these reasons:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Reason<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>bad-si
