<style>
/* A problem book in the style of a coding-practice site: a problem list, then a split view with
   the statement on the left and an editor + test cases on the right. Everything is rendered from
   the JSON in #book-data (written by tools/build_book.py), so the template fits any workbook. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Menlo, Monaco, Consolas, "Courier New", monospace;

  --bg: #f0f0f0;            /* page, behind the panels */

  --fill: #f2f3f5;          /* chips, input boxes, buttons */

  --row-alt: #f7f8fa;       /* striped list rows */
  --line: #e7e7e7;
  --line-strong: #d4d4d8;
  --text: #262626;
  --text-2: #595959;
  --text-3: #8c8c8c;
  --brand: #ffa116;         /* orange accent */
  --brand-ink: #b46a00;     /* orange that reads as text on light */
  --link: #0a6fd8;
  --easy: #00a38f;
  --medium: #c98300;
  --hard: #f02a50;
  --ok: #2db55d;
  --bad: #e5383b;
  --on-color: #ffffff;      /* text on --ok / --brand */
  --code-bg: #f5f6f7;
  --sel: #cde2ff;
  --sel-blur: #e3e6ea;
  --active-line: #f6f8fb;
  --icon-desc: #007aff;
  --icon-ed: #f08c00;
  --icon-code: #02a12f;
  --syn-text: #262626; --syn-kw: #0000ff; --syn-type: #267f99; --syn-str: #a31515; --syn-num: #098658;
  --syn-com: #008000; --syn-fn: #795e26; --syn-meta: #af00db; --syn-var: #001080;
  /* For figures on problem pages (inline SVG): these follow the theme. */
  --ink: var(--text); --muted: var(--text-2); --rule: var(--line); --surface: var(--layer);
  --fig-a: #2f55e4; --fig-b: #d9591f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
    --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
    --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
    --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
    --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
    --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
    --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
    --fig-a: #7f9cff; --fig-b: #ff8d5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a1a; --layer: #262626; --layer-head: #2d2d2d; --fill: #353535; --fill-hover: #404040; --row-alt: #2b2b2b;
  --line: #383838; --line-strong: #4a4a4a; --text: #e8e8ea; --text-2: #a9aaae; --text-3: #75767a;
  --brand: #ffa116; --brand-ink: #ffa116; --link: #4ea1ff; --easy: #00b8a3; --medium: #ffc01e; --hard: #ff375f;
  --ok: #2cbb5d; --bad: #ef4743; --on-color: #ffffff; --code-bg: #2f2f2f; --sel: #264f78; --sel-blur: #3a3d41;
  --active-line: #2c2c2c; --icon-desc: #4ea1ff; --icon-ed: #ffa116; --icon-code: #2cbb5d;
  --syn-text: #d4d4d4; --syn-kw: #569cd6; --syn-type: #4ec9b0; --syn-str: #ce9178; --syn-num: #b5cea8;
  --syn-com: #6a9955; --syn-fn: #dcdcaa; --syn-meta: #c586c0; --syn-var: #9cdcfe;
  --fig-a: #7f9cff; --fig-b: #ff8d5c;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 var(--font-ui); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; border-radius: 4px; }

svg { flex: none; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--text-3); }

/* ---------- shared bits ---------- */
.chip { height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border-radius: 999px; border: 0;
  background: var(--fill); color: var(--text-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
button.chip { cursor: pointer; }

.easy { color: var(--easy) !important; } .medium { color: var(--medium) !important; } .hard { color: var(--hard) !important; }
.btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; border: 0;
  background: var(--fill); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill-hover); }

  color: var(--text-2); cursor: pointer; }

.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.cmd { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 8px; padding: 5px 5px 5px 12px; min-width: 0; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; scrollbar-width: thin; }
.cmd .btn { height: 26px; padding: 0 10px; font-size: 12px; background: var(--layer); }
.cmd .btn:hover { background: var(--fill-hover); }

/* ---------- problem list ---------- */
.nav { background: var(--layer); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  padding-top: env(safe-area-inset-top, 0px); }
.nav-in { max-width: 1200px; margin: 0 auto; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: 15px; }
.brand:hover { text-decoration: none; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #1a1a1a; display: grid; place-items: center;
  font: 700 14px/1 var(--font-mono); }
.nav-src { color: var(--text-3); font-size: 13px; margin-left: auto; }
.list-wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 20px 28px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "prog" "plist" "how"; }
.side { display: contents; }
.side .prog { grid-area: prog; } .side .how { grid-area: how; }
@media (min-width: 1000px) {
  .list-wrap { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "hero side" "plist side"; align-items: start; }
  .side { display: grid; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .side .prog, .side .how { grid-area: auto; }
}
.hero { grid-area: hero; display: grid; gap: 8px; }
.hero .over { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink); }
.hero h1 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.hero p { margin: 0; color: var(--text-2); max-width: 70ch; }
.side { grid-area: side; gap: 16px; }
.plist { grid-area: plist; display: grid; gap: 14px; min-width: 0; }
.card { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 14px; font-weight: 600; }

.prog { grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 18px; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-c b { font-size: 24px; font-weight: 600; }
.ring-c span { color: var(--text-3); font-size: 13px; }
.ring-c small { color: var(--text-2); font-size: 12px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.bar-row .n { color: var(--text-2); }
.bar-row .n b { color: var(--text); font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.bar-row[aria-pressed="true"] .lbl { text-decoration: underline; text-underline-offset: 3px; }
.how ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: how; }
.how li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 13px; color: var(--text-2); counter-increment: how; }
.how li::before { content: counter(how); width: 20px; height: 20px; border-radius: 50%; background: var(--fill); color: var(--text-2);
  display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-top: 1px; }
.how b { color: var(--text); font-weight: 600; }
.how code, .credits code { font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 4px; }
.path { font: 12px/1.5 var(--font-mono); color: var(--text-3); word-break: break-all; }

.topics { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.topics.collapsed .tchip:nth-child(n + 13) { display: none; }
.tchip { height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 999px;
  background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.tchip:hover { color: var(--text); background: var(--fill); }
.tchip sup { color: var(--text-3); font-size: 10px; }
.tchip[aria-pressed="true"] { background: var(--text); color: var(--layer); }
.tchip[aria-pressed="true"] sup { color: var(--layer); opacity: .7; }
.topics .more { color: var(--link); background: none; border: 0; cursor: pointer; font-size: 13px; padding: 0 8px; height: 28px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; max-width: 340px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--fill); border-radius: 8px; color: var(--text-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--text); font-size: 13px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--layer); color: var(--text); font-weight: 500; }
.seg.small { flex: none; }
.seg.small button { height: 24px; padding: 0 9px; font-size: 12px; }
.pick { margin-left: auto; height: 32px; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.pick span { width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: var(--on-color); display: grid; place-items: center; }
.pick:hover { color: var(--text); }
.table-scroll { overflow-x: auto; }
.ptable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.ptable th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ptable td { padding: 11px 12px; white-space: nowrap; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:nth-child(odd) td { background: var(--row-alt); }
.ptable tbody tr td:first-child { border-radius: 8px 0 0 8px; }
.ptable tbody tr td:last-child { border-radius: 0 8px 8px 0; }
.ptable tbody tr:hover td { background: var(--fill); }
.ptable .st { width: 44px; }
.ptable .ti { white-space: normal; min-width: 220px; }
.ptable .ti a { color: var(--text); font-weight: 500; }
.ptable .ti a:hover { color: var(--link); text-decoration: none; }
.ptable .te { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); width: 80px; }
.ptable .di { width: 96px; font-weight: 500; }
.ptable th.te { text-align: right; }
.st-ok { color: var(--ok); display: inline-grid; }
.st-try { color: var(--medium); display: inline-grid; }
.credits { margin: 6px 0 0; color: var(--text-3); font-size: 12px; max-width: 80ch; }

/* ---------- problem view ---------- */
.ide { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; padding-bottom: 10px; }
body.in-ide { overflow: hidden; }
.topbar { flex: none; height: 50px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-right { justify-self: end; gap: 10px; }
.tb-left .logo { margin-right: 8px; }
.tb-link { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; color: var(--text); font-weight: 500; white-space: nowrap; }
.tb-link:hover { background: var(--fill); text-decoration: none; }
.tb-mid { display: flex; gap: 1px; }
.act { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; border: 0; background: var(--fill); cursor: pointer; font-weight: 600; }
.act:hover { background: var(--fill-hover); }
.act.run { border-radius: 8px 0 0 8px; color: var(--text-2); }
.act.submit { border-radius: 0 8px 8px 0; color: var(--ok); }
.tb-prog { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.tb-prog b { color: var(--text); font-weight: 600; }
.live { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: help; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.live.on { color: var(--ok); } .live.warn { color: var(--medium); } .live.off { color: var(--bad); }
.act:disabled { opacity: .55; cursor: progress; }
.running { display: flex; align-items: center; gap: 10px; color: var(--text-2); padding: 6px 0 14px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ok); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.err-list { display: grid; gap: 4px; margin-bottom: 12px; font: 12.5px/1.5 var(--font-mono); }
.err-list .loc { color: var(--bad); font-weight: 600; }
.cm-error-line { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.bad-text { color: var(--bad) !important; }
.note.muted { color: var(--text-3); font-size: 12px; }
.case-card { background: var(--fill); border-radius: 8px; margin-bottom: 8px; min-width: 0; }
.case-card > summary { cursor: pointer; padding: 9px 12px; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.case-card > summary .id { font: 600 12.5px var(--font-mono); color: var(--bad); white-space: nowrap; }
.case-card > summary .t { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case-body { padding: 0 12px 12px; display: grid; gap: 8px; min-width: 0; }
.case-body .field { margin-bottom: 0; }
.case-body .field-v { background: var(--layer); max-height: 220px; }
.field-v.diff { padding: 6px 0; }
.diff .dl { display: block; width: max-content; min-width: 100%; padding: 0 12px; min-height: 1.6em; }
.diff .dl.del.changed { background: color-mix(in srgb, var(--bad) 9%, transparent); }
.diff .dl.del.extra { background: color-mix(in srgb, var(--bad) 20%, transparent); }
.diff .dl.add.changed { background: color-mix(in srgb, var(--ok) 9%, transparent); }
.diff .dl.add.missing { background: color-mix(in srgb, var(--ok) 20%, transparent); }
.diff .dl.clip { color: var(--text-3); }
.tk-del { background: color-mix(in srgb, var(--bad) 40%, transparent); border-radius: 3px; padding: 0 2px; }
.tk-add { background: color-mix(in srgb, var(--ok) 40%, transparent); border-radius: 3px; padding: 0 2px; }
.img-cmp { display: flex; flex-wrap: wrap; gap: 10px; }
.img-cmp figure { margin: 0; display: grid; gap: 4px; justify-items: start; }
.img-cmp img { width: 180px; max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; }
.img-cmp figcaption { font-size: 12px; color: var(--text-3); }
.live-actions { margin: 14px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
.ide-main { flex: 1; min-height: 0; display: flex; }
.panel { background: var(--layer); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.left { flex: 0 0 var(--left, 45%); }
.right { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.code { flex: 0 0 var(--top, 60%); }
.tests { flex: 1; }
.splitter { flex: 0 0 8px; position: relative; touch-action: none; }
.splitter::after { content: ""; position: absolute; border-radius: 2px; background: transparent; transition: background .15s; }
.splitter.v { cursor: col-resize; } .splitter.v::after { top: 30%; bottom: 30%; left: 3px; width: 2px; }
.splitter.h { cursor: row-resize; } .splitter.h::after { left: 30%; right: 30%; top: 3px; height: 2px; }
.splitter:hover::after, .splitter.dragging::after, .splitter:focus-visible::after { background: var(--link); top: 0; bottom: 0; left: 3px; }
.splitter.h:hover::after, .splitter.h.dragging::after, .splitter.h:focus-visible::after { left: 0; right: 0; top: 3px; bottom: auto; }
.splitter:focus-visible { outline: none; }

.panel-head { flex: none; height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--layer-head);
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptab { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 6px; background: none;
  color: var(--text-2); cursor: pointer; font-weight: 500; white-space: nowrap; font-size: 13px; }
.ptab:hover { background: var(--fill); color: var(--text); }
.ptab[aria-selected="true"] { color: var(--text); font-weight: 600; }
.ptab.static { cursor: default; color: var(--text); font-weight: 600; } .ptab.static:hover { background: none; }
.sep { width: 1px; height: 14px; background: var(--line-strong); margin: 0 2px; flex: none; }
.ico-desc { color: var(--icon-desc); } .ico-ed { color: var(--icon-ed); } .ico-code { color: var(--icon-code); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }

/* statement */
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.d-head h1 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.solved-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-size: 13px; white-space: nowrap; padding-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
.callout { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; background: var(--fill); border-radius: 8px; padding: 10px 14px;
  color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
.callout svg { margin-top: 3px; color: var(--brand-ink); }
.callout p { margin: 0; }
.callout b { color: var(--text); font-weight: 600; }
.flow > * { margin: 0; }
.flow > * + * { margin-top: 12px; }
.flow > h2:not(:first-child) { margin-top: 26px; }
.flow > h3:not(:first-child) { margin-top: 20px; }
.flow > h4:not(:first-child) { margin-top: 16px; }
.flow > .d-sec:not(:first-child), .flow > .examples { margin-top: 26px; }
.flow h2 { font-size: 15px; font-weight: 600; }
.flow h3 { font-size: 14px; font-weight: 600; }
.flow h4 { font-size: 14px; font-weight: 500; }

<script type="application/json" id="book-data">{"key":"elliptic-curve-keys-certificates-and-chains-of-trust","title":"Elliptic-Curve Keys, Certificates and Chains of Trust","headline":"Learn how to not f*ck up like eMudhra","lede":"Each checkpoint asks you to write the program that one part of the post builds. A checker feeds your program inputs and compares what it writes with answers worked out independently. How you structure the code is up to you.","credits":"Expected outputs come from independent sources. Progress is saved in this browser only.","sourceUrl":"https://emudhra.com/en/post/certificate-security-incident","sourceTitle":"eMudhra Statement on Recent Certificate Security Incident","author":"eMudhra","folder":"emudhra-ca-incident","check":"./check.sh {id}","shell":"a terminal","checkpoints":[{"id":"01","num":"1","title":"Modular arithmetic","difficulty":"Easy","tests":27,"solution":"solutions/p01_modular_arithmetic.py","problem":"problems/01-modular-arithmetic.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 01 - Modular arithmetic\n#\n# Problem:  problems/01-modular-arithmetic.md (also in the web problem book)\n# Check:    ./check.sh 01\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 01 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p01_modular_arithmetic.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 01 - Modular arithmetic\n#\n# Problem:  problems/01-modular-arithmetic.md (also in the web problem book)\n# Check:    ./check.sh 01\n#\n# Only your program's output is checked, so structure this however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you\n# can focus on modexp() and modinv().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\n\ndef modexp(base, exp, mod):\n    \"\"\"Return base ** exp mod mod. mod >= 2, exp >= 0, base >= 0 (base may be >= mod).\"\"\"\n    # TODO: square-and-multiply. Don't multiply `exp` times in a loop - it must finish on a\n    # several-hundred-bit exponent well inside the time limit.\n    raise NotImplementedError(\"modexp\")\n\n\ndef modinv(a, mod):\n    \"\"\"Return a's inverse mod mod, or None if gcd(a, mod) != 1. mod >= 2, a >= 0.\"\"\"\n    # TODO: the extended Euclidean algorithm.\n    raise NotImplementedError(\"modinv\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"modexp\":  # modexp <base> <exp> <mod>\n                base, exp, mod = int(words[1]), int(words[2]), int(words[3])\n                lines.append(f\"modexp {modexp(base, exp, mod)}\")\n            elif words[0] == \"modinv\":  # modinv <a> <mod>\n                a, mod = int(words[1]), int(words[2])\n                r = modinv(a, mod)\n                lines.append(\"modinv none\" if r is None else f\"modinv {r}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["big integers","bit shifting","a loop"],"text":["big integers","bit shifting","a loop"]},{"label":"Library","items":["none needed. Python's built-in <code>int<\/code> handles numbers as large as these curves use"],"text":["none needed. Python's built-in int handles numbers as large as these curves use"]},{"label":"Concepts","items":["modular exponentiation (square-and-multiply)","modular inverse (extended Euclid)"],"text":["modular exponentiation (square-and-multiply)","modular inverse (extended Euclid)"]}],"body":"<section class=\"d-sec flow\"><h2>Prerequisite material<\/h2><p>This checkpoint is prerequisite material for the later checkpoints about the eMudhra incident; it isn't drawn from a specific blog post. Every later checkpoint that touches elliptic-curve points needs the two operations built here. See \"Source material\" below for where this arithmetic comes from.<\/p><\/section><div class=\"d-problem flow\"><p>Write a program that reads lines asking for a modular exponentiation or a modular inverse, and writes the answer to each, in order.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p01_modular_arithmetic.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p01_modular_arithmetic.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>modexp()<\/code> and <code>modinv()<\/code>.<\/p>\n<h3>Modular exponentiation<\/h3>\n<p><code>base ** exp mod mod<\/code> the ordinary way means multiplying <code>base<\/code> by itself <code>exp<\/code> times. For the exponents here, hundreds of bits long, that is far too slow. <strong>Square-and-multiply<\/strong> gets the same answer in about <code>log2(exp)<\/code> multiplications: look at <code>exp<\/code> one bit at a time, squaring a running value every step, and multiplying it by <code>base<\/code> whenever that bit is 1.<\/p>\n<h3>Modular inverse<\/h3>\n<p>There's no division mod a number. Instead, <code>a<\/code>'s <strong>modular inverse<\/strong> mod <code>mod<\/code> is a number <code>b<\/code> such that <code>a * b mod mod == 1<\/code> - multiplying by it acts like dividing by <code>a<\/code>. It exists exactly when <code>gcd(a, mod) == 1<\/code>. The <strong>extended Euclidean algorithm<\/strong> finds it: it runs the same steps as computing <code>gcd(a, mod)<\/code> (repeatedly replacing the larger of two numbers with its remainder when divided by the smaller), while also tracking, at each step, how to write the current remainder as some multiple of <code>a<\/code> plus some multiple of <code>mod<\/code>. When the remainder reaches 1, the multiple of <code>a<\/code> is the inverse (reduced mod <code>mod<\/code> so it comes out in range).<\/p>\n<h3>Input<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Line<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>modexp &lt;base&gt; &lt;exp&gt; &lt;mod&gt;<\/code><\/td><td>Compute <code>base ** exp mod mod<\/code>. <code>mod &gt;= 2<\/code>, <code>exp &gt;= 0<\/code>, <code>base &gt;= 0<\/code>.<\/td><\/tr><tr><td><code>modinv &lt;a&gt; &lt;mod&gt;<\/code><\/td><td>Compute <code>a<\/code>'s inverse mod <code>mod<\/code>. <code>mod &gt;= 2<\/code>, <code>a &gt;= 0<\/code>.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>All three numbers on a line are plain decimal integers, with no sign and no separators. <code>base<\/code> can be equal to or larger than <code>mod<\/code>; <code>a<\/code> can be equal to or larger than <code>mod<\/code> too.<\/p>\n<h3>Output<\/h3>\n<p>For each input line, in the same order, write one line:<\/p>\n<pre><code>modexp &lt;result&gt;      the value of base ** exp mod mod, 0 &lt;= result &lt; mod\nmodinv &lt;result&gt;      a&#x27;s inverse mod mod, 0 &lt;= result &lt; mod\nmodinv none          when gcd(a, mod) != 1: a has no inverse mod mod<\/code><\/pre>\n<h3>Special cases<\/h3>\n<ul><li><code>base ** 0<\/code> is 1, for every base, including <code>base = 0<\/code>. (This is the ordinary mathematical convention, not specific to modular arithmetic.)<\/li><li><code>mod = 1<\/code> is a valid modulus. Every number is congruent to 0 mod 1, so <code>modexp<\/code> always answers <code>0<\/code> there, whatever <code>base<\/code> and <code>exp<\/code> are. By the same reasoning <code>modinv ... 1<\/code> answers <code>0<\/code> too: the one value mod 1 is trivially its own \"inverse\" since <code>0 * 0 mod 1 == 0 == 1 mod 1<\/code>. This matches what Python's own <code>pow(a, -1, 1)<\/code> returns, if you want a second source for this convention.<\/li><\/ul><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>One output line per input line, in order: <code>modexp &lt;result&gt;<\/code> or <code>modinv &lt;result&gt;<\/code> / <code>modinv none<\/code>.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>exp = 0<\/code> gives <code>1 mod m<\/code> (even when <code>base = 0<\/code>), except <code>mod = 1<\/code>, which always gives <code>0<\/code>.<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>exp = 1<\/code> gives <code>base mod m<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Exponents hundreds of bits long finish well under the time limit. This rules out a loop that multiplies <code>exp<\/code> times; square-and-multiply does it in about <code>log2(exp)<\/code> multiplications.<\/span><\/li><li><span class=\"rid\">R5<\/span><span><code>base &gt;= mod<\/code> is reduced mod <code>mod<\/code> before exponentiating (not treated as an error, and not left unreduced in the arithmetic).<\/span><\/li><li><span class=\"rid\">R6<\/span><span><code>modinv<\/code> returns the correct inverse when <code>gcd(a, mod) == 1<\/code>.<\/span><\/li><li><span class=\"rid\">R7<\/span><span><code>modinv<\/code> returns <code>none<\/code> when <code>gcd(a, mod) != 1<\/code>. This includes <code>a = 0<\/code> (with <code>mod &gt; 1<\/code>, since <code>gcd(0, mod) == mod<\/code>), and <code>a<\/code> sharing a prime factor with a composite <code>mod<\/code>.<\/span><\/li><li><span class=\"rid\">R8<\/span><span><code>mod = 1<\/code>: <code>modexp<\/code> always answers <code>0<\/code>, and <code>modinv<\/code> answers <code>0<\/code> by the convention above.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every line is well formed: exactly <code>modexp &lt;base&gt; &lt;exp&gt; &lt;mod&gt;<\/code> or <code>modinv &lt;a&gt; &lt;mod&gt;<\/code>, decimal, no sign, no blank lines.<\/li><li><code>mod &gt;= 1<\/code> in every line (the examples above use <code>mod &gt;= 2<\/code>; a few cases use <code>mod = 1<\/code> specifically to test that edge).<\/li><li>Numbers can be as large as a few hundred bits - as large as the primes used by P-256 and P-384 in later checkpoints.<\/li><li>Each case has a 10-second limit. The R4 cases use exponents and moduli several hundred bits long; square-and-multiply finishes in well under a millisecond, but a loop of <code>exp<\/code> plain multiplications would still be running long after the universe ends.<\/li><li>There are 24 tests: 3 for R1, 3 for R2, 3 for R3, 4 for R4, 3 for R5, 3 for R6, 4 for R7, 2 for R8, and 2 end-to-end cases using the real P-384 field prime. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p01_modular_arithmetic.py","text":"# Reference solution - checkpoint 01 (Modular arithmetic). SPOILERS: try it yourself first.\n#\n# Square-and-multiply walks exp one bit at a time (from the bottom): it squares a running base\n# every step, and whenever the current bit is 1 it folds that squared base into the result. That\n# takes about log2(exp) multiplications instead of exp of them.\n#\n# Extended Euclid runs the same divide-and-remainder steps as gcd(a, mod), but carries along a\n# second pair of numbers that express the running remainder as (something) * a mod mod. When the\n# remainder finally reaches 1, that \"something\" is the inverse.\n\nimport sys\n\n\ndef modexp(base, exp, mod):\n    \"\"\"base ** exp mod mod. mod >= 2, exp >= 0, base >= 0 (base may be >= mod).\"\"\"\n    if mod == 1:\n        return 0\n    base %= mod\n    result = 1\n    while exp > 0:\n        if exp & 1:\n            result = (result * base) % mod\n        base = (base * base) % mod\n        exp >>= 1\n    return result\n\n\ndef modinv(a, mod):\n    \"\"\"a's inverse mod mod, or None if gcd(a, mod) != 1. mod >= 2, a >= 0.\"\"\"\n    if mod == 1:\n        return 0\n    old_r, r = a % mod, mod\n    old_s, s = 1, 0\n    while r != 0:\n        q = old_r // r\n        old_r, r = r, old_r - q * r\n        old_s, s = s, old_s - q * s\n    if old_r != 1:  # gcd(a, mod) != 1: no inverse\n        return None\n    return old_s % mod\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            if words[0] == \"modexp\":  # modexp <base> <exp> <mod>\n                base, exp, mod = int(words[1]), int(words[2]), int(words[3])\n                lines.append(f\"modexp {modexp(base, exp, mod)}\")\n            elif words[0] == \"modinv\":  # modinv <a> <mod>\n                a, mod = int(words[1]), int(words[2])\n                r = modinv(a, mod)\n                lines.append(\"modinv none\" if r is None else f\"modinv {r}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"}],"proof":{"passed":27,"total":27,"date":"2026-10-21"},"uses":[]},"read":"","context":"<p>This is the first checkpoint. It builds the two pieces of arithmetic that checkpoints 2 and 3 use to turn a private number into a public key, and that checkpoint 4 uses to check a signature: doing a huge exponent mod a prime quickly, and dividing mod a prime (which only makes sense through a modular inverse, since there's no fraction).<\/p>","sources":"<ul><li>NIST, <a href=\"https://csrc.nist.gov/pubs/sp/800/186/final\" target=\"_blank\" rel=\"noopener\">SP 800-186: Recommendations for Discrete Logarithm-based Cryptography<\/a>, for the P-256 and P-384 primes this arithmetic will run on from checkpoint 3 onward<\/li><li>Handbook of Applied Cryptography (Menezes, van Oorschot, Vanstone), chapter 2 (\"Mathematical Background\"), for square-and-multiply (there called the \"repeated square-and-multiply algorithm\") and the extended Euclidean algorithm<\/li><\/ul>","checking":"<pre><code>./check.sh 01                         run every test\n./check.sh 01 -Case 01-R7-prime-factor  one test, showing its full input, expected output and your output\n./check.sh 01 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 01 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R7  modinv returns `none` when gcd(a, mod) != 1, including a = 0 and a ....    0 / 4   FAILED\n      x 01-R7-zero  a = 0, mod &gt; 1 (gcd is mod, never 1)\n          line 1: expected `modinv none`, got `modinv 0`\n          likely cause: R7 - modinv returns `none` when gcd(a, mod) != 1, including a = 0 and a sharing a prime factor with mod\n          expected values from: Python&#x27;s built-in pow(base, exp, mod) and pow(a, -1, mod), cross-checked with math.gcd\n          reproduce: python3 -P tools/run_py.py solutions 01 build/cases/01/01-R7-zero.in build/cases/01/01-R7-zero.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Both functions are short, well-known algorithms. Don't try to derive them from scratch: write <code>modexp<\/code> as a loop over the bits of <code>exp<\/code>, and <code>modinv<\/code> as a loop that mimics computing <code>gcd(a, mod)<\/code> but tracks one extra pair of numbers along the way.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>For <code>modexp<\/code>: keep <code>result = 1<\/code> and a running <code>base<\/code> (already reduced mod <code>mod<\/code>). While <code>exp &gt; 0<\/code>: if the lowest bit of <code>exp<\/code> is 1, multiply it into <code>result<\/code>; always square <code>base<\/code> and mod it; then shift <code>exp<\/code> right by one bit. Stop when <code>exp<\/code> is 0.<\/p>\n<p>For <code>modinv<\/code>: keep two pairs, <code>(old_r, old_s) = (a mod mod, 1)<\/code> and <code>(r, s) = (mod, 0)<\/code>. Repeat: let <code>q = old_r // r<\/code>; replace <code>(old_r, r)<\/code> with <code>(r, old_r - q*r)<\/code> and <code>(old_s, s)<\/code> with <code>(s, old_s - q*s)<\/code>; stop when <code>r<\/code> is 0. If <code>old_r<\/code> isn't 1 at that point, there's no inverse. Otherwise the inverse is <code>old_s mod mod<\/code> (it may have gone negative along the way).<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>mod = 1<\/code> first: handle it before anything else, in both functions, by returning <code>0<\/code>.<\/li><li>Reduce <code>base<\/code> (and <code>a<\/code>) mod <code>mod<\/code> before using them; a loop that doesn't will still often get the right modexp answer but can get <code>modinv<\/code> wrong, and will run slower than it needs to.<\/li><li><code>exp = 0<\/code> must give <code>1<\/code>, not <code>0<\/code>, for any <code>base<\/code> (except through the <code>mod = 1<\/code> rule above).<\/li><li>The extended Euclid coefficients can go negative partway through. Take <code>% mod<\/code> only at the very end, or you'll reduce a negative number incorrectly in some languages.<\/li><li>Check <code>gcd(a, mod) == 1<\/code> (equivalently: the final <code>old_r == 1<\/code>) before trusting any computed inverse - don't just always print a number.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>modexp(base, exp, mod):\n    if mod == 1: return 0\n    base = base mod mod\n    result = 1\n    while exp &gt; 0:\n        if exp is odd: result = (result * base) mod mod\n        base = (base * base) mod mod\n        exp = exp &gt;&gt; 1\n    return result\n\nmodinv(a, mod):\n    if mod == 1: return 0\n    (old_r, r) = (a mod mod, mod)\n    (old_s, s) = (1, 0)\n    while r != 0:\n        q = old_r // r\n        (old_r, r) = (r, old_r - q*r)\n        (old_s, s) = (s, old_s - q*s)\n    if old_r != 1: return none\n    return old_s mod mod<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"square-and-multiply by hand","test":"01-R1-all-modexp","input":"modexp 2 3 5\nmodexp 5 5 11\nmodexp 7 2 13\nmodexp 9 9 17","output":"modexp 3\nmodexp 1\nmodexp 10\nmodexp 15","image":null,"explain":"<p><code>2 ** 3 mod 5<\/code>: <code>exp = 3<\/code> is <code>11<\/code> in binary. Start with <code>result = 1<\/code>, <code>base = 2<\/code>. Bit 0 (the low bit) is 1, so <code>result = 1 * 2 mod 5 = 2<\/code>; square <code>base<\/code> to <code>4<\/code>. Bit 1 is 1, so <code>result = 2 * 4 mod 5 = 8 mod 5 = 3<\/code>; that's the last bit, so the answer is <code>3<\/code>. Check: <code>2**3 = 8<\/code>, and <code>8 mod 5 = 3<\/code>.<\/p>"},{"label":"Example 2","name":"a modular inverse","test":"01-R6-small-prime-mod","input":"modinv 3 7","output":"modinv 5","image":null,"explain":"<p><code>3 * 5 = 15<\/code>, and <code>15 mod 7 = 1<\/code>, so <code>5<\/code> is <code>3<\/code>'s inverse mod <code>7<\/code>.<\/p>"},{"label":"Example 3","name":"no inverse exists","test":"01-R7-prime-factor","input":"modinv 21 35","output":"modinv none","image":null,"explain":"<p><code>35 = 5 * 7<\/code>, and <code>21 = 3 * 7<\/code> shares the factor <code>7<\/code> with <code>35<\/code>, so <code>gcd(21, 35) = 7<\/code>, not <code>1<\/code>. There is no number you can multiply <code>21<\/code> by to get something congruent to <code>1<\/code> mod <code>35<\/code>.<\/p>"}],"editorial":{"title":"Nothing to compare","html":"<p>There is no blog code for this checkpoint to compare against: it's the arithmetic every later checkpoint builds on, not something the post describes. What you wrote - square-and-multiply and extended Euclid - is the same pair of algorithms used inside every general-purpose cryptography library, including the one later checkpoints use as an independent oracle.<\/p>"}},{"id":"02","num":"2","title":"Add points on a toy curve","difficulty":"Easy","tests":15,"solution":"solutions/p02_toy_curve.py","problem":"problems/02-toy-curve.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 02 - Add points on a toy curve\n#\n# Problem:  problems/02-toy-curve.md (also in the web problem book)\n# Check:    ./check.sh 02\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 02 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p02_toy_curve.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 02 - Add points on a toy curve\n#\n# Problem:  problems/02-toy-curve.md (also in the web problem book)\n# Check:    ./check.sh 02\n#\n# Only your program's output is checked, so you can structure it however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you can\n# focus on add_points().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\nP = 17  # the field: all arithmetic below is mod 17\nA = 2  # the curve is y^2 = x^3 + 2x + 2 mod 17\nB = 2\n\n\ndef add_points(p1, p2):\n    \"\"\"p1, p2: each either None (the point at infinity) or an (x, y) pair. Return the sum,\n    in the same representation (None, or an (x, y) tuple).\"\"\"\n    # TODO: handle infinity on either side, the inverse-pair case (sum is infinity), doubling\n    # (p1 == p2, use the tangent slope), and the ordinary case (the chord's slope).\n    raise NotImplementedError(\"add_points\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef parse_point(words, i):\n    \"\"\"Reads one point starting at words[i] (`inf`, or two integers). Returns (point, next index).\"\"\"\n    if words[i] == \"inf\":\n        return None, i + 1\n    return (int(words[i]), int(words[i + 1])), i + 2\n\n\ndef format_point(pt):\n    return \"inf\" if pt is None else f\"{pt[0]} {pt[1]}\"\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            # add <P1> <P2>, each P either `inf` or two mod-17 integers\n            p1, i = parse_point(words, 1)\n            p2, _ = parse_point(words, i)\n            lines.append(format_point(add_points(p1, p2)))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["small integers","modular arithmetic (<code>pow(a, -1, p)<\/code> in Python)","parsing a point"],"text":["small integers","modular arithmetic (pow(a, -1, p) in Python)","parsing a point"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["elliptic-curve point addition and doubling","the point at infinity","inverse points"],"text":["elliptic-curve point addition and doubling","the point at infinity","inverse points"]}],"body":"<section class=\"d-sec flow\"><h2>Prerequisite material<\/h2><p>This checkpoint is prerequisite material for the later checkpoints about the eMudhra incident; it isn't drawn from a specific blog post. Checkpoint 10 (already part of this workbook) uses this exact curve and generator as a worked example; this checkpoint builds the addition rule that example's table was computed from. See \"Source material\" below for where this comes from.<\/p><\/section><div class=\"d-problem flow\"><p>Write a program that reads pairs of points on the curve <code>y² = x³ + 2x + 2 mod 17<\/code> and adds them.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p02_toy_curve.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p02_toy_curve.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>add_points()<\/code>.<\/p>\n<h3>A tiny example<\/h3>\n<p>This is the same curve, with the same generator <code>G = (5, 1)<\/code>, used as a worked example on checkpoint 10's page: it lists <code>1*G<\/code> through <code>5*G<\/code> as <code>(5, 1)<\/code>, <code>(6, 3)<\/code>, <code>(10, 6)<\/code>, <code>(3, 1)<\/code>, <code>(9, 16)<\/code>. That table is built by repeatedly adding <code>G<\/code> - exactly the operation this checkpoint asks you to write. If you've already read that page, this is the rule behind its table; if not, it's worth a look after you pass, as a second example of what you just built.<\/p>\n<h3>The point at infinity<\/h3>\n<p>An elliptic curve's points don't just mean <code>(x, y)<\/code> pairs: there's one more point, called <strong>infinity<\/strong>, that acts as the group's identity element - like <code>0<\/code> for addition, or <code>1<\/code> for multiplication. <code>P + infinity = P<\/code> for any point <code>P<\/code>, and <code>infinity + infinity = infinity<\/code>. It also shows up as the answer whenever a point and its own negation are added (see below). In this checkpoint's input and output, infinity is written as the single word <code>inf<\/code>; it never has coordinates.<\/p>\n<h3>Adding two different points<\/h3>\n<p>All arithmetic below is mod 17. To add two points <code>P = (x1, y1)<\/code> and <code>R = (x2, y2)<\/code> with <code>x1 != x2<\/code>:<\/p>\n<pre><code>slope = (y2 - y1) / (x2 - x1)\nx3    = slope² - x1 - x2\ny3    = slope * (x1 - x3) - y1<\/code><\/pre>\n<p>\"Divide by <code>k<\/code>\" means multiply by <code>k<\/code>'s modular inverse mod 17 (<code>pow(k, -1, 17)<\/code> in Python; see checkpoint 1 if you haven't built this yet).<\/p>\n<h3>Doubling a point<\/h3>\n<p>Adding a point to itself (<code>P + P<\/code>) uses a different slope, from the curve's tangent line at <code>P<\/code>:<\/p>\n<pre><code>slope = (3*x1² + a) / (2*y1)        (a = 2 on this curve)\nx3    = slope² - 2*x1\ny3    = slope * (x1 - x3) - y1<\/code><\/pre>\n<p>The <code>x3<\/code>, <code>y3<\/code> formulas are the same as above once you have the slope; only how the slope is found differs. A point with <code>y1 = 0<\/code> would make <code>2*y1 = 0<\/code>, which has no inverse - geometrically, the tangent there is a vertical line, and the \"sum\" is infinity. This curve happens to have no point with <code>y = 0<\/code> (worth checking: scan all 17 values of <code>x<\/code> and see that none of the matching <code>y<\/code>'s is <code>0<\/code>), so doubling never produces infinity here. Later, real curves (checkpoint 3 onward) are built so this never happens for the same reason.<\/p>\n<h3>Inverse points<\/h3>\n<p>The <strong>negation<\/strong> of <code>(x, y)<\/code> is <code>(x, 17 - y mod 17)<\/code> - same <code>x<\/code>, the other <code>y<\/code>. Adding a point to its own negation always gives infinity: <code>P + (-P) = inf<\/code>. Check this before applying either formula above, since <code>x1 == x2<\/code> there and the ordinary chord formula would divide by zero.<\/p>\n<h3>Input<\/h3>\n<p>One line per case:<\/p>\n<pre><code>add &lt;P1&gt; &lt;P2&gt;<\/code><\/pre>\n<p>Each of <code>P1<\/code>, <code>P2<\/code> is either the word <code>inf<\/code>, or two space-separated integers <code>x y<\/code> with <code>0 &lt;= x, y &lt;= 16<\/code> - a point already guaranteed to be on the curve.<\/p>\n<h3>Output<\/h3>\n<p>One line per input line: the sum, in the same format (<code>inf<\/code>, or <code>x y<\/code>).<\/p><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Adding two distinct points with different x, using the chord through them.<\/span><\/li><li><span class=\"rid\">R2<\/span><span>Doubling a point (<code>P + P<\/code>), using the tangent at that point.<\/span><\/li><li><span class=\"rid\">R3<\/span><span>Identity laws: <code>P + inf = P<\/code>, <code>inf + P = P<\/code>, <code>inf + inf = inf<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Inverse pairs: <code>P + (-P) = inf<\/code>, where <code>-P<\/code> is <code>(x, 17 - y)<\/code>.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>Every output other than <code>inf<\/code> is actually a point on the curve (<code>y² == x³ + 2x + 2 mod 17<\/code>). infinity) at least once, built by repeatedly adding <code>G<\/code> - the same process behind checkpoint 10's worked table.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li>Every input line is <code>add &lt;P1&gt; &lt;P2&gt;<\/code>, with each <code>P<\/code> either <code>inf<\/code> or two integers in <code>0..16<\/code>.<\/li><li>Every point given is guaranteed to already be a point on the curve, or <code>inf<\/code>.<\/li><li>There are 15 tests: 4 for R1, 2 for R2, 3 for R3, 3 for R4, 2 for R5, and one end-to-end test that walks the full 19-point cycle. The end-to-end test's id carries the seed and is rebuilt by <code>-Fresh<\/code>, though on this fixed, tiny curve its content doesn't change between seeds.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p02_toy_curve.py","text":"# Reference solution - checkpoint 02 (Add points on a toy curve). SPOILERS: try it yourself first.\n#\n# Two formulas: a chord through two distinct points, or the tangent at a point to double it. Both\n# give a slope; squaring the slope and subtracting the two known x's (by the curve's own algebra)\n# gives the third point's x, and the slope gives its y. The point at infinity is the identity:\n# adding it to anything returns that thing unchanged.\n\nimport sys\n\nP = 17  # the field: all arithmetic below is mod 17\nA = 2  # the curve is y^2 = x^3 + 2x + 2 mod 17\nB = 2\n\n\ndef add_points(p1, p2):\n    \"\"\"p1, p2: each either None (the point at infinity) or an (x, y) pair. Returns the sum,\n    in the same representation.\"\"\"\n    if p1 is None:\n        return p2\n    if p2 is None:\n        return p1\n    x1, y1 = p1\n    x2, y2 = p2\n    if x1 == x2 and (y1 + y2) % P == 0:  # p2 is -p1: the sum is infinity\n        return None\n    if p1 == p2:\n        slope = (3 * x1 * x1 + A) * pow(2 * y1, -1, P) % P  # tangent at p1\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, P) % P  # the line through p1 and p2\n    x3 = (slope * slope - x1 - x2) % P\n    y3 = (slope * (x1 - x3) - y1) % P\n    return (x3, y3)\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef parse_point(words, i):\n    \"\"\"Reads one point starting at words[i] (`inf`, or two integers). Returns (point, next index).\"\"\"\n    if words[i] == \"inf\":\n        return None, i + 1\n    return (int(words[i]), int(words[i + 1])), i + 2\n\n\ndef format_point(pt):\n    return \"inf\" if pt is None else f\"{pt[0]} {pt[1]}\"\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            # add <P1> <P2>, each P either `inf` or two mod-17 integers\n            p1, i = parse_point(words, 1)\n            p2, _ = parse_point(words, i)\n            lines.append(format_point(add_points(p1, p2)))\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"}],"proof":{"passed":15,"total":15,"date":"2026-10-21"},"uses":[]},"read":"","context":"<p>Checkpoint 1 built the modular arithmetic. This checkpoint uses it to add points on a curve small enough to check by hand - 17 is small enough to write out every point. Checkpoint 3 does the same addition on the real, much bigger P-256 and P-384 curves, where multiplying a point by a huge number needs this addition rule repeated efficiently.<\/p>","sources":"<ul><li>Checkpoint 10's page (<code>problems/10-find-weak-key.md<\/code>), \"A tiny example\": the same curve, the same <code>G<\/code>, and the table this checkpoint's addition rule produces.<\/li><li>Washington, <em>Elliptic Curves: Number Theory and Cryptography<\/em>, chapter 2 (\"The Group Law\"), for the chord-and-tangent construction and why the result is always another point on the curve.<\/li><li>SECG, <a href=\"https://www.secg.org/sec1-v2.pdf\" target=\"_blank\" rel=\"noopener\">SEC 1: Elliptic Curve Cryptography<\/a>, section 2.2.1, for the same addition and doubling formulas stated for a general field.<\/li><\/ul>","checking":"<pre><code>./check.sh 02                         run every test\n./check.sh 02 -Case 02-R2-g           one test, showing its full input, expected output and your output\n./check.sh 02 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 02 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R4  Inverse pairs: P + (-P) = inf, where -P is (x, 17 - y) .............    2 / 3   FAILED\n      x 02-R4-g-and-negation  G plus its own negation\n          line 1: expected `inf`, got `6 3`\n          likely cause: R4 - Inverse pairs: P + (-P) = inf, where -P is (x, 17 - y)\n          expected values from: brute-force search over the curve&#x27;s 19 points, validated by polynomial root-multiplicity (see tools/gen_p02.py)\n          reproduce: python3 -P tools/run_py.py solutions 02 build/cases/02/02-R4-g-and-negation.in build/cases/02/02-R4-g-and-negation.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>Handle the easy cases first and get them right before touching the formulas: infinity on either side, and a point plus its own negation. Only then do you need the two slope formulas, and only one of those two formulas runs per call - pick which one by checking whether the two points are equal.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Write one function that takes two points (each either <code>None<\/code> for infinity, or an <code>(x, y)<\/code> pair) and returns their sum in the same representation. Check, in order: is either point infinity (if so, return the other); are the two points negations of each other (if so, return infinity); are the two points equal (use the tangent slope); otherwise (use the chord slope). The last two cases share the same <code>x3<\/code>, <code>y3<\/code> formulas once you have a slope.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>inf<\/code> has no coordinates. Parse it before trying to read two numbers.<\/li><li>Check \"is this a negation pair\" using <code>x1 == x2 and (y1 + y2) % 17 == 0<\/code> - don't compare <code>y1<\/code> to a precomputed <code>17 - y2<\/code>, which can go wrong when <code>y2<\/code> is 0 (not that it occurs on this curve, but the check above is the one that generalises correctly).<\/li><li>Doubling uses a different slope formula than ordinary addition - check <code>p1 == p2<\/code> before deciding which one to use, not just \"are the x's equal\" (a point and its negation also share an x, but isn't a doubling case).<\/li><li>All arithmetic, including subtraction, is mod 17. A negative intermediate result (<code>x1 - x3<\/code>, for instance) needs <code>% 17<\/code> to land back in <code>0..16<\/code> in languages where <code>%<\/code> can return negative.<\/li><li>The modular inverse needs <code>k<\/code> and <code>17<\/code> to be coprime. Since <code>17<\/code> is prime, this only fails if <code>k mod 17 == 0<\/code> - which can't happen for <code>2*y1<\/code> or <code>x2 - x1<\/code> given the checks above already ruled out the bad cases.<\/li><\/ul>"},{"title":"Hint 4","sub":"pseudocode","html":"<pre><code>add_points(p1, p2):\n    if p1 is inf: return p2\n    if p2 is inf: return p1\n    (x1, y1) = p1\n    (x2, y2) = p2\n    if x1 == x2 and (y1 + y2) mod 17 == 0:\n        return inf\n    if p1 == p2:\n        slope = (3*x1*x1 + 2) * inverse(2*y1)  mod 17\n    else:\n        slope = (y2 - y1) * inverse(x2 - x1)  mod 17\n    x3 = slope*slope - x1 - x2  mod 17\n    y3 = slope*(x1 - x3) - y1  mod 17\n    return (x3, y3)<\/code><\/pre>"}],"examples":[{"label":"Example 1","name":"the first step of the worked table","test":"02-R1-small","input":"add 5 1 6 3","output":"10 6","image":null,"explain":"<p><code>P1 = (5, 1)<\/code> is <code>1*G<\/code>, <code>P2 = (6, 3)<\/code> is <code>2*G<\/code>. Their x's differ, so use the chord slope: <code>slope = (3 - 1) / (6 - 5) = 2<\/code>. Then <code>x3 = 2² - 5 - 6 = 4 - 11 = -7 mod 17 = 10<\/code>, and <code>y3 = 2*(5 - 10) - 1 = -11 mod 17 = 6<\/code>. The result, <code>(10, 6)<\/code>, is <code>3*G<\/code> in checkpoint 10's table.<\/p>"},{"label":"Example 2","name":"doubling","test":"02-R2-g","input":"add 5 1 5 1","output":"6 3","image":null,"explain":"<p>Both points are <code>G = (5, 1)<\/code>, so use the tangent slope: <code>slope = (3*5² + 2) / (2*1) = 77 / 2<\/code>. <code>77 mod 17 = 9<\/code>, and <code>2<\/code>'s inverse mod 17 is <code>9<\/code> (<code>2 * 9 = 18 = 1 mod 17<\/code>), so <code>slope = 9 * 9 mod 17 = 81 mod 17 = 13<\/code>. Then <code>x3 = 13² - 5 - 5 = 169 - 10 = 159 mod 17 = 6<\/code>, and <code>y3 = 13*(5 - 6) - 1 = -14 mod 17 = 3<\/code>. The result, <code>(6, 3)<\/code>, is <code>2*G<\/code>.<\/p>"},{"label":"Example 3","name":"an inverse pair","test":"02-R4-g-and-negation","input":"add 5 1 5 16","output":"inf","image":null,"explain":"<p><code>(5, 16)<\/code> is <code>G<\/code>'s negation (<code>17 - 1 = 16<\/code>), so the sum is <code>inf<\/code> without needing either formula.<\/p>"}],"editorial":{"title":"Nothing to compare","html":"<p>There is no blog code for this checkpoint to compare against: it's arithmetic every later checkpoint builds on, not something the post describes. What you wrote - the chord-and-tangent rule - is exactly the \"point addition\" step inside every elliptic-curve library, just run on a curve small enough to check by hand.<\/p>"}},{"id":"03","num":"3","title":"Multiply a point by a number","difficulty":"Medium","tests":9,"solution":"solutions/p03_scalar_multiplication.py","problem":"problems/03-scalar-multiplication.md","lang":{"label":"Python","mime":"text/x-python","mode":"python"},"starter":"# Checkpoint 03 - Multiply a point by a number\n#\n# Problem:  problems/03-scalar-multiplication.md (also in the web problem book)\n# Check:    ./check.sh 03\n#\n# The checker runs your program from the workbook folder as\n#\n#     python3 -P tools/run_py.py solutions 03 <input-file> <output-file>\n#\n# Read the input file and write your answer to the output file; only that file is\n# checked. The includes, the parsing and the structure are up to you.\n#\n# Code you want to share between checkpoints can go in solutions/common/ (see the\n# README there). To start from ready-made input/output code instead, copy\n# starters/boilerplate/p03_scalar_multiplication.py over this file.\n\ndef main():\n    pass\n\n\nif __name__ == \"__main__\":\n    main()\n","boilerplate":"# Checkpoint 03 - Multiply a point by a number\n#\n# Problem:  problems/03-scalar-multiplication.md (also in the web problem book)\n# Check:    ./check.sh 03\n#\n# Only your program's output is checked, so you can structure it however you like, or use another\n# language or library (see README.md). The input/output code at the bottom is provided so you can\n# focus on scalar_multiply().\n#\n# Your own code that other checkpoints could reuse goes in solutions/common/ and is imported\n# with `import common.<module>`.\n\nimport sys\n\n# Curve constants, typed from the standard (same values as checkpoint 10's page).\nCURVES = {\n    \"P-256\": {\n        \"p\": 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff,\n        \"gx\": 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296,\n        \"gy\": 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5,\n        \"hexlen\": 64,\n    },\n    \"P-384\": {\n        \"p\": 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff,\n        \"gx\": 0xaa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7,\n        \"gy\": 0x3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f,\n        \"hexlen\": 96,\n    },\n}\n\n\ndef scalar_multiply(curve, d):\n    \"\"\"Return d*G as an (x, y) pair, for the named curve. 1 <= d < n (the curve's order).\"\"\"\n    # TODO: double-and-add. Walk d's bits from the bottom; double a running point every step, and\n    # add it into a separate result whenever the current bit is 1. A loop that adds G to itself\n    # d times (checkpoint 10's approach) is too slow here - d can be hundreds of bits long.\n    raise NotImplementedError(\"scalar_multiply\")\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            # mul <curve> <d>\n            curve, d = words[1], int(words[2])\n            x, y = scalar_multiply(curve, d)\n            hexlen = CURVES[curve][\"hexlen\"]\n            lines.append(f\"{x:0{hexlen}x} {y:0{hexlen}x}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n","indent":4,"tags":[{"label":"Language","items":["big integers","bit shifting","a loop"],"text":["big integers","bit shifting","a loop"]},{"label":"Library","items":["none needed"],"text":["none needed"]},{"label":"Concepts","items":["elliptic-curve scalar multiplication (double-and-add)","private and public keys"],"text":["elliptic-curve scalar multiplication (double-and-add)","private and public keys"]}],"body":"<section class=\"d-sec flow\"><h2>Prerequisite material<\/h2><p>This checkpoint is prerequisite material for the later checkpoints about the eMudhra incident; it isn't drawn from a specific blog post. It builds the forward direction of what checkpoint 10 (already part of this workbook) does in reverse by brute force. See \"Source material\" below.<\/p><\/section><div class=\"d-problem flow\"><p>Write a program that reads a curve name and a private key <code>d<\/code>, and writes the public key <code>d*G<\/code>.<\/p>\n<p>Only the program's output is checked, so you can structure it however you like and use any language or library. The starter <code>solutions/p03_scalar_multiplication.py<\/code> is a comment and an empty program: reading the input and writing the output are yours. To start from working input/output code instead, copy <code>starters/boilerplate/p03_scalar_multiplication.py<\/code> over it, or pick Boilerplate in the book's editor. The boilerplate reads the input and writes the output; you fill in <code>scalar_multiply()<\/code>.<\/p>\n<h3>Why not just add G to itself d times<\/h3>\n<p>Checkpoint 10 computed <code>d*G<\/code> by starting at <code>G<\/code> and adding <code>G<\/code> again and again, d times. That works when <code>d<\/code> is small (at most 1000 there). Here, <code>d<\/code> can be close to the full width of the curve's order - hundreds of bits, so up to roughly <code>2^384<\/code> for P-384. Adding <code>G<\/code> that many times would never finish.<\/p>\n<h3>Double-and-add<\/h3>\n<p>The same trick that made checkpoint 1's <code>modexp<\/code> fast works here: walk <code>d<\/code>'s bits from the lowest to the highest. Keep two running points: one that doubles every step (<code>G<\/code>, <code>2G<\/code>, <code>4G<\/code>, <code>8G<\/code>, ...), and a separate result that starts at the point at infinity and gets the doubling point added into it whenever the current bit of <code>d<\/code> is 1. This takes about <code>log2(d)<\/code> point operations - a few hundred, however large <code>d<\/code> is - instead of <code>d<\/code> of them.<\/p>\n<pre><code>result = infinity\naddend = G\nwhile d &gt; 0:\n    if d&#x27;s lowest bit is 1:\n        result = result + addend\n    addend = addend + addend      (double it)\n    d = d &gt;&gt; 1\nreturn result<\/code><\/pre>\n<p><code>result + addend<\/code> and <code>addend + addend<\/code> are the same point addition and doubling you wrote for checkpoint 2, just on a much bigger curve. <code>result<\/code> starts at infinity so the very first addition (when the lowest bit is 1) correctly gives back <code>addend<\/code> unchanged.<\/p>\n<h3>The curves<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th><\/th><th>P-256<\/th><th>P-384<\/th><\/tr><\/thead><tbody><tr><td><code>p<\/code><\/td><td><code>ffffffff00000001000000000000000000000000ffffffffffffffffffffffff<\/code><\/td><td><code>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff<\/code><\/td><\/tr><tr><td><code>a<\/code><\/td><td><code>p - 3<\/code><\/td><td><code>p - 3<\/code><\/td><\/tr><tr><td><code>Gx<\/code><\/td><td><code>6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296<\/code><\/td><td><code>aa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7<\/code><\/td><\/tr><tr><td><code>Gy<\/code><\/td><td><code>4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5<\/code><\/td><td><code>3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f<\/code><\/td><\/tr><tr><td><code>n<\/code> (order)<\/td><td><code>ffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551<\/code><\/td><td><code>ffffffffffffffffffffffffffffffffffffffffffffffffc7634d81f4372ddf581a0db248b0a77aecec196accc52973<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>All numbers are hexadecimal. The point add/doubling formulas are the same ones from checkpoint 2 (with <code>b<\/code> unused, same as there): for distinct points <code>slope = (y2-y1)/(x2-x1)<\/code>; for doubling, <code>slope = (3x1² + a)/(2y1)<\/code>; then <code>x3 = slope² - x1 - x2<\/code>, <code>y3 = slope*(x1-x3) - y1<\/code>, all mod <code>p<\/code>.<\/p>\n<h3>Input<\/h3>\n<pre><code>mul &lt;curve&gt; &lt;d&gt;<\/code><\/pre>\n<p><code>curve<\/code> is <code>P-256<\/code> or <code>P-384<\/code>. <code>d<\/code> is a decimal integer with <code>1 &lt;= d &lt; n<\/code> (the curve's order above).<\/p>\n<h3>Output<\/h3>\n<p>One line per input line: <code>d*G<\/code>'s coordinates, in lowercase hex, each zero-padded to the curve's full width (64 hex digits for P-256, 96 for P-384) - the same format checkpoint 10 uses for its keys.<\/p>\n<pre><code>&lt;x&gt; &lt;y&gt;<\/code><\/pre><\/div><section class=\"d-sec flow\"><h2>Requirements<\/h2><p>Each test case is designed around one of these. A failing test also prints the requirement the difference most likely comes from.<\/p><ul class=\"reqs\"><li><span class=\"rid\">R1<\/span><span>Small <code>d<\/code> (1, 2, 3) matches the curve's own generator table: <code>d=1<\/code> is <code>G<\/code> itself, <code>d=2<\/code> needs the doubling formula, <code>d=3<\/code> needs an ordinary addition.<\/span><\/li><li><span class=\"rid\">R2<\/span><span><code>d<\/code> with different bit patterns - all 1 bits, a single high bit, alternating bits - exercises every branch of double-and-add (a loop that only handles some bit patterns correctly would still pass simple cases).<\/span><\/li><li><span class=\"rid\">R3<\/span><span><code>d = n - 1<\/code> gives the negation of <code>G<\/code>: <code>(Gx, p - Gy)<\/code>.<\/span><\/li><li><span class=\"rid\">R4<\/span><span>Both curves work: P-256 and P-384 each use their own <code>p<\/code> and <code>G<\/code>.<\/span><\/li><li><span class=\"rid\">R5<\/span><span>A large, random <code>d<\/code> - hundreds of bits - finishes well under the time limit. This is the requirement that rules out adding <code>G<\/code> to itself <code>d<\/code> times: that loop would still be running long after the time limit, while double-and-add needs only a few hundred steps regardless of how large <code>d<\/code> is.<\/span><\/li><\/ul><\/section><div class=\"examples\" data-examples><\/div><section class=\"d-sec flow\"><h2>Constraints<\/h2><ul><li><code>d<\/code> is a decimal integer with <code>1 &lt;= d &lt; n<\/code>.<\/li><li>Each case has a 10-second limit. Double-and-add finishes in well under a millisecond, even for <code>d<\/code> near the full width of <code>n<\/code>; a loop that adds <code>G<\/code> to itself <code>d<\/code> times would need on the order of <code>2^384<\/code> additions for the largest <code>d<\/code> here, which no computer finishes in the lifetime of the universe, let alone 10 seconds.<\/li><li>There are 9 tests: 2 for R1, 2 for R2, 2 for R3, 1 for R4, and 2 for R5, each covering both curves except R4, which mixes both in one input. Part of the set is random and changes with <code>-Fresh<\/code>.<\/li><\/ul><\/section>","solutionCode":{"files":[{"path":"p03_scalar_multiplication.py","text":"# Reference solution - checkpoint 03 (Multiply a point by a number). SPOILERS: try it yourself first.\n#\n# Double-and-add turns d*G into about log2(d) point operations instead of d of them: walk d's bits\n# from the bottom, doubling a running point every step, and adding it into the (separate) result\n# whenever that bit is 1. This is the forward direction of checkpoint 10's search: there, d was\n# small enough to try every value; here d can be any size, so the public key is built directly.\n\nimport sys\n\n# Curve constants, typed from the standard (same values as checkpoint 10's page).\nCURVES = {\n    \"P-256\": {\n        \"p\": 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffff,\n        \"gx\": 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296,\n        \"gy\": 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5,\n        \"hexlen\": 64,\n    },\n    \"P-384\": {\n        \"p\": 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffeffffffff0000000000000000ffffffff,\n        \"gx\": 0xaa87ca22be8b05378eb1c71ef320ad746e1d3b628ba79b9859f741e082542a385502f25dbf55296c3a545e3872760ab7,\n        \"gy\": 0x3617de4a96262c6f5d9e98bf9292dc29f8f41dbd289a147ce9da3113b5f0b8c00a60b1ce1d7e819d7a431d7c90ea0e5f,\n        \"hexlen\": 96,\n    },\n}\n\n\ndef add(p, a, point, other):\n    \"\"\"Add two affine points (None means the point at infinity).\"\"\"\n    if point is None:\n        return other\n    if other is None:\n        return point\n    x1, y1 = point\n    x2, y2 = other\n    if x1 == x2 and (y1 + y2) % p == 0:\n        return None\n    if (x1, y1) == (x2, y2):\n        slope = (3 * x1 * x1 + a) * pow(2 * y1, -1, p) % p  # doubling: the tangent's slope\n    else:\n        slope = (y2 - y1) * pow(x2 - x1, -1, p) % p  # the slope of the line through both points\n    x3 = (slope * slope - x1 - x2) % p\n    return x3, (slope * (x1 - x3) - y1) % p\n\n\ndef scalar_multiply(curve, d):\n    \"\"\"Return d*G as an (x, y) pair, by double-and-add. 1 <= d < n (the curve's order).\"\"\"\n    params = CURVES[curve]\n    p, a = params[\"p\"], params[\"p\"] - 3\n    addend = (params[\"gx\"], params[\"gy\"])  # doubles every step: G, 2G, 4G, 8G, ...\n    result = None  # the point at infinity: the running total\n    while d > 0:\n        if d & 1:\n            result = add(p, a, result, addend)\n        addend = add(p, a, addend, addend)\n        d >>= 1\n    return result\n\n\n# ---- Input/output (provided) -------------------------------------------------\n\n\ndef main(input_path, output_path):\n    lines = []\n    with open(input_path, encoding=\"utf-8\") as f:\n        for line in f:\n            words = line.split()\n            if not words:\n                continue\n            # mul <curve> <d>\n            curve, d = words[1], int(words[2])\n            x, y = scalar_multiply(curve, d)\n            hexlen = CURVES[curve][\"hexlen\"]\n            lines.append(f\"{x:0{hexlen}x} {y:0{hexlen}x}\")\n    with open(output_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(\"\\n\".join(lines) + \"\\n\")\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) != 3:\n        print(f\"usage: {sys.argv[0]} <input-file> <output-file>\", file=sys.stderr)\n        sys.exit(2)\n    try:\n        main(sys.argv[1], sys.argv[2])\n    except NotImplementedError as e:\n        print(f\"not implemented: {e}\", file=sys.stderr)\n        sys.exit(99)\n    except Exception as e:  # report the problem; the checker shows the message\n        print(f\"error: {e}\", file=sys.stderr)\n        sys.exit(1)\n"}],"proof":{"passed":9,"total":9,"date":"2026-10-21"},"uses":[]},"read":"","context":"<p>Checkpoint 2 added two points on a small curve. This checkpoint multiplies a point by a number - on the real, 256-bit and 384-bit curves this workbook uses from here on. <code>d*G<\/code> is exactly how a real private key <code>d<\/code> becomes its matching public key. Checkpoint 10 already asked you to search for small <code>d<\/code> given <code>Q = d*G<\/code>; this checkpoint computes <code>Q<\/code> from any <code>d<\/code>, however large.<\/p>","sources":"<ul><li>Checkpoint 10's page (<code>problems/10-find-weak-key.md<\/code>): the same curves, the same point add/doubling formulas, used there to search for a small <code>d<\/code> given <code>Q<\/code>; this checkpoint computes <code>Q<\/code> from <code>d<\/code> directly.<\/li><li>SECG, <a href=\"https://www.secg.org/sec1-v2.pdf\" target=\"_blank\" rel=\"noopener\">SEC 1: Elliptic Curve Cryptography<\/a>, section 3.2.1 (\"Elliptic Curve Public Key Pair Generation Primitive\") and section 2.2.1 (point multiplication algorithms, including double-and-add).<\/li><li>NIST, <a href=\"https://csrc.nist.gov/pubs/sp/800/186/final\" target=\"_blank\" rel=\"noopener\">SP 800-186: Recommendations for Discrete Logarithm-based Cryptography<\/a>, for the P-256 and P-384 domain parameters.<\/li><\/ul>","checking":"<pre><code>./check.sh 03                         run every test\n./check.sh 03 -Case 03-R3-negation-p384  one test, showing its full input, expected output and your output\n./check.sh 03 -Fresh                  a new set of tests (new random seed), to confirm on data you haven&#x27;t seen\n./check.sh 03 -Dispute &lt;id&gt; &quot;why&quot;     set aside a test you believe is wrong; you won&#x27;t be blocked<\/code><\/pre>\n<p>A failing test looks like this:<\/p>\n<pre><code>  R5  A large, random d (hundreds of bits) finishes well under the time ... .    0 / 2   FAILED\n      x 03-R5-large-p256-s1  P-256: three large random d, each nearly the full bit length (seed 1)\n          Time Limit Exceeded (over 10 s)\n          likely cause: R5 - A large, random d (hundreds of bits) finishes well under the time limit\n          expected values from: cryptography 41.0.7 (OpenSSL): d*G computed by deriving a private key with value d\n          reproduce: python3 -P tools/run_py.py solutions 03 build/cases/03/03-R5-large-p256-s1.in build/cases/03/03-R5-large-p256-s1.out<\/code><\/pre>","hints":[{"title":"Hint 1","sub":"where to start","html":"<p>You already wrote point addition and doubling for checkpoint 2. This checkpoint reuses exactly that arithmetic (on a bigger curve) and adds one new idea: walking <code>d<\/code>'s bits to decide when to add the current doubling point into the result.<\/p>"},{"title":"Hint 2","sub":"the approach","html":"<p>Keep two points: <code>addend<\/code>, which starts at <code>G<\/code> and doubles every loop iteration, and <code>result<\/code>, which starts at infinity and only changes when the current bit of <code>d<\/code> is 1 (then it becomes <code>result + addend<\/code>). Shift <code>d<\/code> right by one bit each iteration and stop when <code>d<\/code> is 0. <code>result<\/code> is the answer.<\/p>"},{"title":"Hint 3","sub":"the traps","html":"<ul><li><code>result<\/code> starts at infinity (not at <code>G<\/code>). Adding any point to infinity gives that point back unchanged - this is what makes the very first real addition work
