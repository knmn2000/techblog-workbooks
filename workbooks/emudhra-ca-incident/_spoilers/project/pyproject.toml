[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pkiaudit"
version = "0.1.0"
description = "Audit a small PKI: weak keys, trusted chains, and what each signing key could break"
requires-python = ">=3.10"

[project.scripts]
pkiaudit = "pkiaudit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
